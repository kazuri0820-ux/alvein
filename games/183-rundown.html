<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ランダウン (Run 'Em Down)</title>
<style>
  html,body{margin:0;height:100%;background:#0a1018;overflow:hidden;
    font-family:-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  #stage{position:relative;width:100vw;height:100vh;max-width:calc(100vh*1.5);max-height:calc(100vw/1.5);aspect-ratio:900/600;}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;border-radius:6px;}
</style>
</head>
<body>
<div id="wrap"><div id="stage"><canvas id="cv"></canvas></div></div>
<script>
(function(){
const W=900,H=600,cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let DPR=1;
function fit(){DPR=Math.min(2,window.devicePixelRatio||1);cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
fit();addEventListener('resize',fit);

// ---------- audio ----------
let AC=null;function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function tone(f,d,type,v,sweep){const a=ac();if(!a)return;const t=a.currentTime,o=a.createOscillator(),g=a.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(sweep)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+sweep),t+d);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v||0.2,t+0.008);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+0.02);}
function noise(d,v,hp){const a=ac();if(!a)return;const t=a.currentTime,n=Math.floor(a.sampleRate*d),buf=a.createBuffer(1,n,a.sampleRate),ch=buf.getChannelData(0);
  for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource();s.buffer=buf;
  const f=a.createBiquadFilter();f.type='highpass';f.frequency.value=hp||600;const g=a.createGain();g.gain.value=v||0.2;
  s.connect(f);f.connect(g);g.connect(a.destination);s.start(t);s.stop(t+d+0.02);}
const S={
  throw:()=>{noise(0.09,0.24,800);tone(500,0.09,'square',0.12,-160);},
  out:()=>{tone(760,0.09,'square',0.18);setTimeout(()=>tone(1040,0.13,'square',0.2),80);setTimeout(()=>tone(1320,0.16,'triangle',0.18),190);},
  great:()=>{[700,980,1320,1760].forEach((f,i)=>setTimeout(()=>tone(f,0.13,'triangle',0.2),i*65));},
  safe:()=>{tone(240,0.3,'sawtooth',0.2,-120);setTimeout(()=>tone(170,0.28,'sawtooth',0.16,-70),120);},
  juke:()=>{tone(320,0.1,'square',0.1,80);},
  over:()=>{[440,330,247,175].forEach((f,i)=>setTimeout(()=>tone(f,0.3,'triangle',0.2),i*160));}
};

// ---------- geometry ----------
const A={x:250,y:322}, B={x:650,y:322};   // base A (left), base B (right, teammate covers)
const TAG_LO=0.62, TAG_HI=0.95;

// ---------- state ----------
let state='title', phase='chase', t=0, plays=0;
let score=0, combo=0, best=+(localStorage.getItem('rundown_best')||0);
let outs=0, escapes=0, lvl=1;
let R=null, ball=null, result=null, resultT=0, msg='', msg2='';
let shake=0, flash=0, flashCol='#fff', last=performance.now();
let parts=[], pops=[];

function rnd(a,b){return a+Math.random()*(b-a);}
function chance(p){return Math.random()<p;}
function clamp(v,a,b){return v<a?a:v>b?b:v;}

function reset(){state='title';score=0;combo=0;outs=0;escapes=0;lvl=1;plays=0;R=null;ball=null;result=null;parts=[];pops=[];}

function newPlay(){
  plays++;
  lvl=Math.min(6,1+Math.floor(plays/3));
  const flee=0.00034+lvl*0.00004;
  const njukes=(lvl>=4?2:1)*(chance(0.7)?1:0)+ (lvl>=2?1:0);
  const jukes=[]; let base=0.34;
  for(let i=0;i<Math.max(1,njukes);i++){ jukes.push({at:base+rnd(0.06,0.16)+i*0.16, dur:Math.max(220,360-lvl*22), done:false, plant:false}); }
  R={rp:0.14, vel:flee, flee, jukes, juking:false, jukeT:0, plantT:0};
  ball=null; result=null; phase='chase'; t=0;
  msg='走者を追い込め'; msg2='二塁側へ committ した瞬間に送球（フェイントに注意）';
}

function start(){ if(!ac())ac(); if(AC&&AC.state==='suspended')AC.resume(); reset(); state='play'; newPlay(); }

// ---------- throw ----------
function doThrow(){
  if(state==='title'){start();return;}
  if(state==='over'){ if(resultT>0.5){reset();start();} return; }
  if(state!=='play'||phase!=='chase'||!R||ball) return;
  S.throw();
  const committed = R.vel>0 && !R.juking;
  const rx=A.x+(B.x-A.x)*R.rp;
  ball={x:A.x,y:A.y-40,tx:B.x,ty:B.y,tp:0};
  let kind;
  if(!committed){ kind='juke'; }
  else if(R.rp<TAG_LO){ kind='early'; }
  else if(R.rp>TAG_HI){ kind='late'; }
  else { kind=(R.rp>0.75)?'great':'out'; }
  ball.kind=kind; ball.rx=rx;
  phase='throw';
}

function applyResult(kind){
  result=kind; resultT=0; phase='resolve';
  const rx=A.x+(B.x-A.x)*R.rp;
  if(kind==='out'||kind==='great'){
    combo++; const mult=1+Math.min(6,combo-1)*0.24; const base=kind==='great'?200:130; const add=Math.round(base*mult);
    score+=add; outs++;
    if(kind==='great')S.great(); else S.out();
    flash=1;flashCol=kind==='great'?'#ffe08a':'#8ff0b8'; shake=kind==='great'?14:9;
    burst(rx,B.y,kind==='great'?'#ffe08a':'#bfffd0',kind==='great'?30:20,7);
    pop(rx,B.y-30,(kind==='great'?'完璧な挟殺！ ':'タッチアウト！ ')+'+'+add,'#eaffef');
    if(combo>=2)pop(rx,B.y-56,'コンボ x'+combo,'#ffe08a');
    msg=kind==='great'?'完璧！ 追い込んで仕留めた':'タッチアウト！ 挟殺成功'; msg2='';
  } else {
    combo=0; escapes++;
    S.safe();
    flash=1;flashCol='#ff6b6b'; shake=10;
    if(kind==='juke'){msg='フェイントに釣られた！ 逃げられた';msg2='切り返しを見極めろ';}
    else if(kind==='early'){msg='送球が早い！ 戻られた';msg2='もっと追い込んでから';}
    else {msg='間に合わず生還';msg2='committ の瞬間を逃すな';}
    burst(rx,B.y,'#ff8a8a',16,5);
  }
}

// ---------- input ----------
cv.addEventListener('pointerdown',e=>{e.preventDefault();doThrow();});
addEventListener('keydown',e=>{ if(e.code==='Space'||e.code==='Enter'||e.code==='ArrowUp'){e.preventDefault();doThrow();}});

// ---------- particles ----------
function burst(x,y,c,n,sp){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=rnd(sp*0.3,sp);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:1,c});}}
function pop(x,y,txt,c){pops.push({x,y,txt,c,life:1});}

// ---------- update ----------
function update(dt){
  shake*=Math.pow(0.86,dt/16.7); if(shake<0.3)shake=0;
  flash*=Math.pow(0.9,dt/16.7);
  for(const p of parts){p.vx*=0.96;p.vy=p.vy*0.96+0.3;p.x+=p.vx*dt/16.7;p.y+=p.vy*dt/16.7;p.life-=dt/16.7*0.026;}
  parts=parts.filter(p=>p.life>0);
  for(const p of pops){p.y-=dt/16.7*0.5;p.life-=dt/16.7*0.018;}
  pops=pops.filter(p=>p.life>0);

  if(state!=='play'){ if(state==='over')resultT+=dt/1000; return; }
  t+=dt;

  if(phase==='chase'){
    // handle jukes
    if(R.juking){
      R.jukeT-=dt; R.vel=-R.flee*1.15;
      if(R.jukeT<=0){ R.juking=false; R.vel=R.flee; }
    } else {
      R.vel=R.flee;
      for(const j of R.jukes){
        if(!j.done){
          if(!j.plant && R.rp>=j.at-0.06){ j.plant=true; R.plantT=140; }
          if(R.rp>=j.at){ j.done=true; R.juking=true; R.jukeT=j.dur; S.juke(); }
          break;
        }
      }
    }
    if(R.plantT>0)R.plantT-=dt;
    R.rp=clamp(R.rp+R.vel*dt,0,1);
    if(R.rp>=1){ applyResult('late'); } // reached B safe (never thrown in time)
    return;
  }
  if(phase==='throw'){
    ball.tp=clamp(ball.tp+dt/300,0,1);
    // runner keeps moving a touch
    if(ball.kind==='out'||ball.kind==='great'){ /* freeze near tag */ }
    else { R.rp=clamp(R.rp+R.vel*dt,0,1); }
    if(ball.tp>=1){ applyResult(ball.kind); }
    return;
  }
  if(phase==='resolve'){
    resultT+=dt/1000;
    if(resultT>1.1){
      if(escapes>=3){ state='over'; resultT=0; S.over(); if(score>best){best=score;localStorage.setItem('rundown_best',best);} }
      else newPlay();
    }
    return;
  }
}

// ---------- render ----------
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

function drawScene(){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#16273e');g.addColorStop(0.5,'#1d5233');g.addColorStop(1,'#227a46');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  // base path dirt
  ctx.fillStyle='rgba(150,95,55,0.5)';ctx.fillRect(A.x-30,A.y-26,B.x-A.x+60,52);
  ctx.strokeStyle='rgba(220,200,160,0.5)';ctx.lineWidth=8;ctx.beginPath();ctx.moveTo(A.x,A.y);ctx.lineTo(B.x,B.y);ctx.stroke();
  // tag zone hint (fades at high lvl)
  if(state==='play'&&phase==='chase'&&lvl<4){
    const zx0=A.x+(B.x-A.x)*TAG_LO, zx1=A.x+(B.x-A.x)*TAG_HI;
    ctx.fillStyle='rgba(126,240,176,0.12)';ctx.fillRect(zx0,A.y-26,zx1-zx0,52);
  }
  // bases
  function bag(b,lab){ctx.save();ctx.translate(b.x,b.y);ctx.rotate(Math.PI/4);ctx.fillStyle='#f0f0f0';ctx.fillRect(-12,-12,24,24);ctx.restore();
    ctx.fillStyle='rgba(255,255,255,0.7)';ctx.font='bold 13px sans-serif';ctx.textAlign='center';ctx.fillText(lab,b.x,b.y+38);}
  bag(A,'二塁'); bag(B,'三塁');
}

function drawPlayer(x,y,col,dark,label,sc,lean){
  sc=sc||1;ctx.save();ctx.translate(x,y);ctx.scale(sc,sc);if(lean)ctx.rotate(lean);
  ctx.fillStyle='rgba(0,0,0,0.22)';ctx.beginPath();ctx.ellipse(0,15,12,4,0,0,6.28);ctx.fill();
  ctx.fillStyle=col;rr(-8,-6,16,22,6);ctx.fill();
  ctx.fillStyle='#f2c9a0';ctx.beginPath();ctx.arc(0,-14,7,0,6.28);ctx.fill();
  ctx.fillStyle=dark;ctx.beginPath();ctx.arc(0,-16,7.5,Math.PI,0);ctx.fill();
  ctx.restore();
  if(label){ctx.fillStyle='rgba(255,255,255,0.85)';ctx.font='bold 11px sans-serif';ctx.textAlign='center';ctx.fillText(label,x,y+30);}
}

function render(){
  ctx.save();
  if(shake>0)ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
  drawScene();

  if(R){
    const rx=A.x+(B.x-A.x)*R.rp;
    // teammate at B
    drawPlayer(B.x, B.y-2, '#e8ebef','#20344a','味方',0.98);
    // fielder (you) trailing behind the runner toward A side
    const fx=clamp(rx-46, A.x-10, B.x);
    drawPlayer(fx, A.y+2, (phase==='chase'&&!ball)?'#f2f2f2':'#f2f2f2','#c9a24a', ball?null:'YOU',1.02);
    // runner (lean shows commit / plant)
    let lean=0; if(R.juking)lean=-0.3; else if(R.plantT>0)lean=0.25; else lean=0.18;
    drawPlayer(rx, A.y, '#e2413a','#8a1f1a','走者',1.0, lean*0.6);
    // commit arrow
    if(state==='play'&&phase==='chase'){
      const dir=R.juking?-1:1;
      ctx.strokeStyle=R.juking?'rgba(255,150,150,0.9)':'rgba(126,240,176,0.9)';ctx.lineWidth=4;
      ctx.beginPath();ctx.moveTo(rx,A.y-36);ctx.lineTo(rx+dir*28,A.y-36);ctx.stroke();
      ctx.beginPath();ctx.moveTo(rx+dir*28,A.y-36);ctx.lineTo(rx+dir*20,A.y-42);ctx.moveTo(rx+dir*28,A.y-36);ctx.lineTo(rx+dir*20,A.y-30);ctx.stroke();
    }
    // ball
    if(ball){ const x=ball.x+(ball.tx-ball.x)*ball.tp, y=ball.y+(ball.ty-ball.y)*ball.tp - Math.sin(ball.tp*Math.PI)*24;
      ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(x,y,7,0,6.28);ctx.fill();ctx.strokeStyle='#c33';ctx.lineWidth=1.3;ctx.beginPath();ctx.arc(x,y,7,0.4,2.3);ctx.stroke(); }
  }

  for(const p of parts){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,3.2,0,6.28);ctx.fill();}
  ctx.globalAlpha=1;
  for(const p of pops){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.font='bold 21px sans-serif';ctx.textAlign='center';ctx.fillText(p.txt,p.x,p.y);}
  ctx.globalAlpha=1;

  // HUD
  ctx.textAlign='left';ctx.fillStyle='#fff';ctx.font='bold 26px sans-serif';ctx.fillText('SCORE '+score,20,36);
  ctx.textAlign='right';ctx.fillStyle='rgba(255,255,255,0.85)';ctx.font='14px sans-serif';ctx.fillText('アウト '+outs+'  Lv.'+lvl,W-20,26);
  ctx.fillText('生還',W-92,50);
  for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(W-66+i*22,46,7,0,6.28);ctx.fillStyle=i<escapes?'#ff5b5b':'rgba(255,255,255,0.25)';ctx.fill();}
  if(combo>=2){ctx.textAlign='left';ctx.fillStyle='#ffe08a';ctx.font='bold 18px sans-serif';ctx.fillText('コンボ x'+combo,20,60);}

  if(state==='play'&&(msg||msg2)){
    ctx.textAlign='center';
    const good=result==='out'||result==='great';
    ctx.fillStyle=result?(good?'#8ff0b8':'#ff9a9a'):'rgba(255,255,255,0.92)';
    ctx.font='bold 26px sans-serif';ctx.fillText(msg,W/2,H-58);
    if(msg2){ctx.fillStyle='rgba(255,255,255,0.72)';ctx.font='15px sans-serif';ctx.fillText(msg2,W/2,H-32);}
  }

  if(state==='title'){
    ctx.fillStyle='rgba(6,10,18,0.66)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='bold 50px sans-serif';ctx.fillText('ランダウン',W/2,196);
    ctx.fillStyle='#8ff0b8';ctx.font='bold 22px sans-serif';ctx.fillText("Run 'Em Down",W/2,232);
    ctx.fillStyle='rgba(255,255,255,0.9)';ctx.font='18px sans-serif';
    ctx.fillText('塁間で挟んだ走者を追い込み、三塁側へ committ（緑↑）した',W/2,294);
    ctx.fillText('“その瞬間”にベースの味方へ送球（クリック/タップ/SPACE）＝タッチアウト',W/2,322);
    ctx.fillStyle='rgba(255,255,255,0.66)';ctx.font='15px sans-serif';
    ctx.fillText('急な切り返し（赤↑＝ジューク）に釣られて投げると逃げられ、早すぎると戻られる',W/2,364);
    ctx.fillText('しっかり追い込んで仕留めるほど高得点。3生還で交代',W/2,388);
    ctx.fillStyle='#ffe08a';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で開始',W/2,446);
    ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='14px sans-serif';ctx.fillText('BEST '+best,W/2,478);
  }
  if(state==='over'){
    ctx.fillStyle='rgba(6,10,18,0.74)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#ff6b6b';ctx.font='bold 46px sans-serif';ctx.fillText('3生還…交代',W/2,230);
    ctx.fillStyle='#fff';ctx.font='bold 40px sans-serif';ctx.fillText('SCORE '+score,W/2,296);
    ctx.fillStyle='rgba(255,255,255,0.85)';ctx.font='20px sans-serif';ctx.fillText('アウト '+outs+'   BEST '+best,W/2,336);
    ctx.fillStyle='#8ff0b8';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で もう一度',W/2,408);
  }

  if(flash>0.02){ctx.globalAlpha=flash*0.5;ctx.fillStyle=flashCol;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}
  ctx.restore();

  ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,0.4)';ctx.font='13px sans-serif';
  ctx.fillText('走者が三塁側へ committ（緑↑）した瞬間に送球。ジューク（赤↑）に注意。3生還で交代',W/2,H-8);
}

function frame(ts){let dt=ts-last;last=ts;if(dt>60)dt=60;if(dt<0)dt=0;update(dt);render();requestAnimationFrame(frame);}
requestAnimationFrame(frame);

// ---------- test hook ----------
window.__rd={
  start, throwIt:doThrow,
  get state(){return state;},
  get score(){return score;},
  get outs(){return outs;},
  get escapes(){return escapes;},
  get info(){return {state,phase, rp:R?R.rp:0, vel:R?R.vel:0, juking:R?R.juking:false,
    tagLo:TAG_LO, tagHi:TAG_HI, thrown:!!ball, result, outs, escapes, lvl};}
};
})();
</script>
</body>
</html>
