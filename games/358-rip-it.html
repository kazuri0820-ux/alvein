<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ぶち抜け (Rip It)</title>
<style>
  html,body{margin:0;height:100%;background:#07100a;overflow:hidden;
    font-family:-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  #stage{position:relative;width:100vw;height:100vh;max-width:calc(100vh*1.5);max-height:calc(100vw/1.5);aspect-ratio:900/600;}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;border-radius:6px;}
</style>
</head>
<body>
<div id="wrap"><div id="stage"><canvas id="cv"></canvas></div></div>
<script>
(function(){
const W=900,H=600,cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let DPR=1;
function fit(){DPR=Math.min(2,window.devicePixelRatio||1);cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
fit();addEventListener('resize',fit);

// ---------- audio ----------
let AC=null;function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function tone(f,d,type,v,sweep){const a=ac();if(!a)return;const t=a.currentTime,o=a.createOscillator(),g=a.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(sweep)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+sweep),t+d);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v||0.2,t+0.008);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+0.02);}
function noise(d,v,hp){const a=ac();if(!a)return;const t=a.currentTime,n=Math.floor(a.sampleRate*d),buf=a.createBuffer(1,n,a.sampleRate),ch=buf.getChannelData(0);
  for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource();s.buffer=buf;
  const f=a.createBiquadFilter();f.type='highpass';f.frequency.value=hp||600;const g=a.createGain();g.gain.value=v||0.2;
  s.connect(f);f.connect(g);g.connect(a.destination);s.start(t);s.stop(t+d+0.02);}
const S={
  charge:(p)=>{tone(150+p*5,0.03,'sine',0.05);},
  goal:()=>{noise(0.05,0.16,900);[540,760,1010].forEach((f,i)=>setTimeout(()=>tone(f,0.11,'triangle',0.16),i*54));},
  screamer:()=>{noise(0.07,0.2,700);[560,820,1080,1360].forEach((f,i)=>setTimeout(()=>tone(f,0.12,'triangle',0.18),i*52));},
  kick:()=>{noise(0.05,0.15,380);tone(300,0.06,'square',0.09,150);},
  save:()=>{noise(0.16,0.22,300);tone(180,0.2,'sawtooth',0.12,-40);},
  over:()=>{noise(0.16,0.16,500);tone(150,0.24,'sawtooth',0.12,-30);},
  streak:()=>{[700,930,1170,1400].forEach((f,i)=>setTimeout(()=>tone(f,0.1,'triangle',0.16),i*60));},
  gameover:()=>{[440,330,247,175].forEach((f,i)=>setTimeout(()=>tone(f,0.3,'triangle',0.2),i*160));}
};

// ---------- geometry ----------
const GOAL_L=280, GOAL_R=620, GOAL_TOP=94, GOAL_LINE=156;
const SHOOT={x:450,y:474};
function goalCX(){return (GOAL_L+GOAL_R)/2;}

// ---------- state ----------
let state='title', phase='set', t=0, plays=0;
let score=0, combo=0, outs=0, fails=0, lvl=1;   // outs = goals
let best=+(localStorage.getItem('ri_best')||0);
let setT=0, power=0, holding=false, chargeRate=0.152, bandLo=54, bandHi=84, chargeClock=0;
let released=false, lockedP=0;
let result=null, resultT=0, msg='', animU=0, flightT=0, flightDur=1;
let side=1, tgtX=0, tgtY=0;
let shake=0, flash=0, flashCol='#fff', last=performance.now(), netR=0;
let parts=[], pops=[];

function rnd(a,b){return a+Math.random()*(b-a);}
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function lerp(a,b,u){return a+(b-a)*u;}
function easeOut(u){return 1-Math.pow(1-u,2);}

function params(){ return { bandLo: 48 + rnd(0,10) + lvl*1.4, bandW: Math.max(13, 26 - lvl*1.5) };}

function reset(){state='title';score=0;combo=0;outs=0;fails=0;lvl=1;plays=0;result=null;parts=[];pops=[];}
function newPlay(){
  plays++; lvl=Math.min(7,1+Math.floor(outs/4));
  const p=params(); bandLo=clamp(p.bandLo,44,66); bandHi=Math.min(92,bandLo+Math.max(13,p.bandW));
  side=Math.random()<0.5?-1:1;
  phase='set'; setT=0; power=0; holding=false; chargeClock=0; released=false; lockedP=0;
  result=null; resultT=0; msg=''; animU=0; flightT=0; netR=0;
}
function start(){ if(!ac())ac(); if(AC&&AC.state==='suspended')AC.resume(); reset(); state='play'; newPlay(); }

function hold(){
  if(state==='title'){start();return;}
  if(state==='over'){ if(resultT>0.4){reset();start();} return; }
  if(state!=='play') return;
  if(phase==='charge'&&!released){ holding=true; }
}
function release(){
  if(state!=='play'||phase!=='charge'||released) return;
  released=true; holding=false; lockedP=power; S.kick();
  flightDur=Math.max(120,250-power*1.05); flightT=0;
  if(power<bandLo) result='weak';
  else if(power>bandHi) result='over';
  else result=(Math.abs(power-(bandLo+bandHi)/2)<= (bandHi-bandLo)*0.22)?'screamer':'goal';
  // aim target (top corner on `side`)
  const cornerX = side<0 ? GOAL_L+34 : GOAL_R-34;
  if(result==='over'){ tgtX=cornerX; tgtY=GOAL_TOP-50; }
  else if(result==='weak'){ tgtX=lerp(goalCX(),cornerX,0.62); tgtY=GOAL_LINE-14; }   // GK parries
  else { tgtX=cornerX; tgtY=GOAL_TOP+20; }                                            // top corner, in
  phase='flight';
}

function resolve(k){
  phase='result'; result=k; resultT=0; animU=0;
  const good=(k==='goal'||k==='screamer');
  if(good){
    outs++; combo++; netR=1;
    let add;
    if(k==='screamer'){ add=Math.round(240*(1+Math.min(9,combo-1)*0.14)); S.screamer();
      flash=1;flashCol='#8affa0';shake=10; burst(tgtX,tgtY,'#8affa0',24,8); pop(W/2,250,'芯を食った超ロングシュート！ゴラッソ！ +'+add,'#d6ffe0'); }
    else { add=Math.round(130*(1+Math.min(9,combo-1)*0.16)); S.goal();
      flash=1;flashCol='#bfffca';shake=6; burst(tgtX,tgtY,'#bfffca',14,6); pop(W/2,250,'豪快なミドルがゴール！ +'+add,'#e6ffe9'); }
    score+=add;
    if(combo>=2)pop(W/2,210,'コンボ x'+combo,'#ffd24d');
    if(combo>0&&combo%5===0)S.streak();
    msg=k==='screamer'?'完璧なミートで芯を食い、GKの届かない隅へ突き刺さった！':'力強く振り抜いてGKの逆を破る一撃——ゴール！';
  } else {
    fails++; combo=0; flash=1;flashCol='#ff5b5b';shake=8; if(result==='weak')S.save();else S.over();
    if(result==='weak') msg='力不足…球威が乗らず、GKに正面で弾かれた（キャッチ）';
    else msg='振り抜きすぎ…ふかしてクロスバーの上へ大きく外した';
    pop(W/2,250,result==='weak'?'GKセーブ…':'枠の上へ…','#ffb0b0');
  }
  if(fails>=3){ state='over'; resultT=0; S.gameover(); if(score>best){best=score;localStorage.setItem('ri_best',best);} }
}

// ---------- input ----------
cv.addEventListener('pointerdown',e=>{e.preventDefault(); hold();});
cv.addEventListener('pointerup',e=>{e.preventDefault(); if(state==='play'&&phase==='charge')release();});
cv.addEventListener('pointercancel',e=>{ if(state==='play'&&phase==='charge')release();});
addEventListener('keydown',e=>{ if(e.repeat)return; if(e.code==='Space'||e.code==='Enter'||e.code==='ArrowUp'){e.preventDefault(); hold();} });
addEventListener('keyup',e=>{ if(e.code==='Space'||e.code==='Enter'||e.code==='ArrowUp'){e.preventDefault(); if(state==='play'&&phase==='charge')release();} });

// ---------- particles ----------
function burst(x,y,c,n,sp){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=rnd(sp*0.3,sp);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:1,c});}}
function pop(x,y,txt,c){pops.push({x,y,txt,c,life:1});}

// ---------- update ----------
let sndAcc=0;
function update(dt){
  shake*=Math.pow(0.86,dt/16.7); if(shake<0.3)shake=0;
  flash*=Math.pow(0.9,dt/16.7); if(netR>0)netR*=Math.pow(0.9,dt/16.7);
  for(const p of parts){p.vx*=0.96;p.vy=p.vy*0.96+0.28;p.x+=p.vx*dt/16.7;p.y+=p.vy*dt/16.7;p.life-=dt/16.7*0.026;}
  parts=parts.filter(p=>p.life>0);
  for(const p of pops){p.y-=dt/16.7*0.5;p.life-=dt/16.7*0.02;}
  pops=pops.filter(p=>p.life>0);

  if(state!=='play'){ if(state==='over')resultT+=dt/1000; return; }
  t+=dt;
  if(phase==='set'){ setT+=dt; if(setT>=360) phase='charge'; return; }
  if(phase==='charge'){
    chargeClock+=dt;
    if(holding){ power=clamp(power+chargeRate*dt,0,100); sndAcc+=dt; if(sndAcc>50){sndAcc=0;S.charge(power);} }
    if(!released && power>=100) release();               // over-cooked -> auto over
    if(!released && chargeClock>=2600) release();         // never committed -> scuffed (weak)
    return;
  }
  if(phase==='flight'){ flightT+=dt;
    if(flightT>=flightDur){ resolve(result); }
    return;
  }
  if(phase==='result'){ resultT+=dt/1000; animU=Math.min(1,animU+dt/700); if(resultT>1.35 && state==='play') newPlay(); return; }
}

// ---------- render ----------
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function figure(x,y,col,sc,lean){ sc=sc||1;lean=lean||0;
  ctx.fillStyle='rgba(0,0,0,0.22)';ctx.beginPath();ctx.ellipse(x,y+13*sc,12*sc,4*sc,0,0,6.28);ctx.fill();
  ctx.save();ctx.translate(x,y);ctx.rotate(lean);
  ctx.fillStyle=col;rr(-7*sc,-22*sc,14*sc,24*sc,6*sc);ctx.fill();
  ctx.fillStyle='#f2c9a0';ctx.beginPath();ctx.arc(0,-27*sc,6*sc,0,6.28);ctx.fill();
  ctx.restore();
}
function drawGK(x,dive){
  ctx.save();ctx.translate(x,GOAL_LINE-8);ctx.rotate(dive*0.6);
  ctx.strokeStyle='#ffd23e';ctx.lineWidth=5;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(-16,-20);ctx.lineTo(16,-20);ctx.stroke();
  ctx.fillStyle='#ff5b3a';rr(-9,-24,18,26,6);ctx.fill();
  ctx.fillStyle='#f2c9a0';ctx.beginPath();ctx.arc(0,-30,6.5,0,6.28);ctx.fill();
  ctx.restore();
}
function drawScene(){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#123f26');g.addColorStop(0.5,'#187038');g.addColorStop(1,'#0f5a2c');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='rgba(255,255,255,0.03)';for(let i=0;i<6;i++)ctx.fillRect(0,210+i*66,W,33);
  // penalty box
  ctx.strokeStyle='rgba(255,255,255,0.32)';ctx.lineWidth=3;
  ctx.strokeRect(GOAL_L-84,GOAL_LINE,GOAL_R-GOAL_L+168,190);
  ctx.strokeRect(GOAL_L+54,GOAL_LINE,GOAL_R-GOAL_L-108,64);
  // goal net + frame
  ctx.fillStyle='rgba(255,255,255,0.08)';ctx.fillRect(GOAL_L,GOAL_TOP,GOAL_R-GOAL_L,GOAL_LINE-GOAL_TOP);
  ctx.strokeStyle='rgba(255,255,255,0.18)';ctx.lineWidth=1;
  for(let x=GOAL_L+14;x<GOAL_R;x+=14){ctx.beginPath();ctx.moveTo(x,GOAL_TOP);ctx.lineTo(x,GOAL_LINE);ctx.stroke();}
  for(let y=GOAL_TOP+12;y<GOAL_LINE;y+=12){ctx.beginPath();ctx.moveTo(GOAL_L,y);ctx.lineTo(GOAL_R,y);ctx.stroke();}
  ctx.strokeStyle='#f4f4f4';ctx.lineWidth=6;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(GOAL_L,GOAL_LINE);ctx.lineTo(GOAL_L,GOAL_TOP);ctx.lineTo(GOAL_R,GOAL_TOP);ctx.lineTo(GOAL_R,GOAL_LINE);ctx.stroke();
  ctx.lineCap='butt';
}

function render(){
  ctx.save();
  if(shake>0)ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
  drawScene();

  if(state==='play'){
    // GK
    let gkx=goalCX(), dive=0;
    if(phase==='result'){
      if(result==='weak'){ dive=side*easeOut(animU)*0.9; gkx=lerp(goalCX(),tgtX,easeOut(animU)); }
      else if(result==='goal'||result==='screamer'){ dive=side*easeOut(animU)*0.8; gkx=lerp(goalCX(),lerp(goalCX(),tgtX,0.7),easeOut(animU)); }
    }
    drawGK(gkx,dive);

    // shooter (winds up while charging, follows through on flight)
    let slean=0;
    if(phase==='charge'&&holding)slean=-0.18*(power/100);
    if(phase==='flight'||phase==='result')slean=0.3;
    figure(SHOOT.x,SHOOT.y,'#3aa0ff',1.0,slean);

    // ball
    let bx=SHOOT.x-2, by=SHOOT.y-16;
    if(phase==='flight'){ const u=easeOut(flightT/flightDur); bx=lerp(SHOOT.x-2,tgtX,u); by=lerp(SHOOT.y-16,tgtY,u)-Math.sin(u*Math.PI)*10; }
    else if(phase==='result'){ bx=tgtX; by=tgtY; }
    if(phase!=='set'){ ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(bx,by,7,0,6.28);ctx.fill();
      ctx.strokeStyle='#111';ctx.lineWidth=1;ctx.beginPath();ctx.arc(bx,by,7,0.4,2.2);ctx.stroke(); }
    if(netR>0.05&&(result==='goal'||result==='screamer')){ctx.globalAlpha=netR*0.5;ctx.fillStyle='#8affa0';ctx.beginPath();ctx.arc(tgtX,tgtY,15,0,6.28);ctx.fill();ctx.globalAlpha=1;}

    if(phase==='set'){ ctx.fillStyle='rgba(140,255,160,0.95)';ctx.font='bold 24px sans-serif';ctx.textAlign='center';ctx.fillText('ミドルレンジ——振り抜け！',W/2,126); }

    // power meter (right, vertical)
    if(phase==='charge'||phase==='flight'){
      const mx=W-70, my=180, mw=32, mh=280;
      ctx.fillStyle='rgba(0,0,0,0.35)';rr(mx-6,my-6,mw+12,mh+12,8);ctx.fill();
      const by1=my+mh*(1-bandHi/100), bh=mh*((bandHi-bandLo)/100);
      ctx.fillStyle='rgba(140,255,160,0.30)';ctx.fillRect(mx,by1,mw,bh);
      ctx.strokeStyle='rgba(140,255,160,0.8)';ctx.lineWidth=2;ctx.strokeRect(mx,by1,mw,bh);
      const pv=(phase==='flight')?lockedP:power;
      const inb=pv>=bandLo&&pv<=bandHi;
      ctx.fillStyle=inb?'#8fe0a0':(pv>bandHi?'#ff7a7a':'#ffd24d');ctx.fillRect(mx,my+mh*(1-pv/100),mw,mh*pv/100);
      ctx.strokeStyle='rgba(255,255,255,0.5)';ctx.lineWidth=1;ctx.strokeRect(mx,my,mw,mh);
      ctx.fillStyle='#fff';ctx.font='bold 12px sans-serif';ctx.textAlign='center';ctx.fillText('パワー',mx+mw/2,my-14);
      ctx.fillStyle='rgba(140,255,160,0.95)';ctx.font='10px sans-serif';ctx.fillText('芯', mx+mw/2, by1+bh/2+3);
      ctx.fillStyle='rgba(255,180,120,0.85)';ctx.font='9px sans-serif';ctx.fillText('枠上',mx+mw/2,my+8);
    }
  }

  for(const p of parts){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,3.2,0,6.28);ctx.fill();}
  ctx.globalAlpha=1;
  for(const p of pops){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.font='bold 21px sans-serif';ctx.textAlign='center';ctx.fillText(p.txt,p.x,p.y);}
  ctx.globalAlpha=1;

  // HUD
  ctx.textAlign='left';ctx.fillStyle='#fff';ctx.font='bold 26px sans-serif';ctx.fillText('SCORE '+score,20,36);
  ctx.textAlign='right';ctx.fillStyle='rgba(255,255,255,0.9)';ctx.font='14px sans-serif';ctx.fillText('ゴール '+outs+'  Lv'+lvl,W-20,24);
  ctx.fillText('失敗',W-92,46);
  for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(W-60+i*20,41,7,0,6.28);ctx.fillStyle=i<fails?'#ff5b5b':'rgba(255,255,255,0.25)';ctx.fill();}
  if(combo>=2){ctx.textAlign='center';ctx.fillStyle='#ffd24d';ctx.font='bold 18px sans-serif';ctx.fillText('コンボ x'+combo,W/2,556);}

  if(state==='play'&&phase==='charge'){ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,0.92)';ctx.font='bold 15px sans-serif';
    ctx.fillText('押し続けてパワーを溜め、緑の“芯”帯で離す＝豪快なミドル弾。力不足＝GKセーブ・溜め過ぎ＝枠の上',W/2,84);}
  if(state==='play'&&phase==='result'&&msg){ctx.textAlign='center';ctx.fillStyle=(result==='goal'||result==='screamer')?'#9ff0b8':'#ff9a9a';ctx.font='bold 17px sans-serif';ctx.fillText(msg,W/2,430);}

  if(state==='title'){
    ctx.fillStyle='rgba(4,10,6,0.82)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='bold 44px sans-serif';ctx.fillText('ぶち抜け',W/2,96);
    ctx.fillStyle='#ffd23e';ctx.font='bold 22px sans-serif';ctx.fillText('Rip It',W/2,132);
    ctx.fillStyle='rgba(255,255,255,0.92)';ctx.font='16px sans-serif';
    ctx.fillText('ミドルレンジから豪快なドライブシュート——パワーを溜め、芯を食う“ちょうどの強さ”で振り抜け',W/2,186);
    ctx.fillStyle='rgba(255,255,255,0.66)';ctx.font='14px sans-serif';
    ctx.fillText('押し続けて（タップ長押し / SPACE長押し）パワーメーターを溜める',W/2,224);
    ctx.fillText('右のメーターが緑の“芯”帯に来たら離す＝GKの届かない隅へ突き刺さる（ど真ん中はゴラッソで大量点）',W/2,248);
    ctx.fillText('力不足（緑の下で離す）＝球威が乗らずGKにキャッチ／溜め過ぎ（緑の上）＝ふかして枠の上',W/2,272);
    ctx.fillText('上級ほどメーターが速く芯の帯が狭い。3失敗で交代',W/2,296);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で開始',W/2,382);
    ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='14px sans-serif';ctx.fillText('BEST '+best,W/2,414);
  }
  if(state==='over'){
    ctx.fillStyle='rgba(4,10,6,0.85)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#ff6b6b';ctx.font='bold 46px sans-serif';ctx.fillText('3失敗…交代',W/2,222);
    ctx.fillStyle='#fff';ctx.font='bold 40px sans-serif';ctx.fillText('SCORE '+score,W/2,290);
    ctx.fillStyle='rgba(255,255,255,0.85)';ctx.font='19px sans-serif';ctx.fillText('ゴール '+outs+'   BEST '+best,W/2,330);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で もう一度',W/2,402);
  }

  if(flash>0.02){ctx.globalAlpha=flash*0.5;ctx.fillStyle=flashCol;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}
  ctx.restore();

  ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,0.4)';ctx.font='12px sans-serif';
  ctx.fillText('ぶち抜け：押し続けてパワーを溜め、緑の芯帯で離して豪快なミドル弾。力不足＝GKセーブ/溜め過ぎ＝枠上、3失敗で交代',W/2,H-8);
}

function frame(ts){let dt=ts-last;last=ts;if(dt>60)dt=60;if(dt<0)dt=0;update(dt);render();requestAnimationFrame(frame);}
requestAnimationFrame(frame);

// ---------- test hook ----------
window.__ri={
  start, hold:()=>hold(), release:()=>release(),
  get state(){return state;},
  get score(){return score;},
  get outs(){return outs;},
  get fails(){return fails;},
  get info(){return {state,phase,power,bandLo,bandHi,chargeClock,released,result,outs,fails,lvl,
    canAct:(phase==='charge'&&!released)};}
};
})();
</script>
</body>
</html>
