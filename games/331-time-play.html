<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>タイムプレー (Beat the Third Out)</title>
<style>
  html,body{margin:0;height:100%;background:#0a0d08;overflow:hidden;
    font-family:-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  #stage{position:relative;width:100vw;height:100vh;max-width:calc(100vh*1.5);max-height:calc(100vw/1.5);aspect-ratio:900/600;}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;border-radius:6px;}
</style>
</head>
<body>
<div id="wrap"><div id="stage"><canvas id="cv"></canvas></div></div>
<script>
(function(){
const W=900,H=600,cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let DPR=1;
function fit(){DPR=Math.min(2,window.devicePixelRatio||1);cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
fit();addEventListener('resize',fit);

// ---------- audio ----------
let AC=null;function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function tone(f,d,type,v,sweep){const a=ac();if(!a)return;const t=a.currentTime,o=a.createOscillator(),g=a.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(sweep)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+sweep),t+d);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v||0.2,t+0.008);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+0.02);}
function noise(d,v,hp){const a=ac();if(!a)return;const t=a.currentTime,n=Math.floor(a.sampleRate*d),buf=a.createBuffer(1,n,a.sampleRate),ch=buf.getChannelData(0);
  for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource();s.buffer=buf;
  const f=a.createBiquadFilter();f.type='highpass';f.frequency.value=hp||600;const g=a.createGain();g.gain.value=v||0.2;
  s.connect(f);f.connect(g);g.connect(a.destination);s.start(t);s.stop(t+d+0.02);}
const S={
  crack:()=>{noise(0.04,0.14,500);tone(240,0.06,'square',0.08,-40);},
  slide:()=>{noise(0.14,0.14,400);tone(240,0.1,'sine',0.06,-120);},
  score:()=>{[620,860,1120].forEach((f,i)=>setTimeout(()=>tone(f,0.11,'triangle',0.16),i*55));},
  big:()=>{[600,800,1000,1250].forEach((f,i)=>setTimeout(()=>tone(f,0.12,'triangle',0.17),i*80));},
  mitt:()=>{noise(0.05,0.18,1200);tone(220,0.05,'square',0.08,-60);},
  out:()=>{noise(0.18,0.2,300);tone(160,0.2,'sawtooth',0.12,-40);},
  streak:()=>{[700,930,1170,1400].forEach((f,i)=>setTimeout(()=>tone(f,0.1,'triangle',0.16),i*60));},
  over:()=>{[440,330,247,175].forEach((f,i)=>setTimeout(()=>tone(f,0.3,'triangle',0.2),i*160));}
};

// ---------- geometry ----------
const THIRD={x:214,y:214}, HOME={x:452,y:498}, FIRST={x:690,y:214}, MOUND={x:452,y:300};
const INF={x:560,y:330};   // fielder who throws to first

// ---------- state ----------
let state='title', phase='race', plays=0;
let score=0, combo=0, best=+(localStorage.getItem('tp_best')||0);
let outs=0, fails=0, lvl=1;   // outs = runs scored (timed correctly)
let clock=0, homeT=900, w=150, tough=false;
let acted=false, actT=0, result=null, resultT=0, msg='', msgOk=false, quality=0, throwU=0, runEnd=0;
let shake=0, flash=0, flashCol='#fff', last=performance.now();
let parts=[], pops=[];

function rnd(a,b){return a+Math.random()*(b-a);}
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function lerp(a,b,u){return a+(b-a)*u;}
function easeOut(u){return 1-Math.pow(1-u,2);}
function easeIn(u){return u*u;}

function reset(){state='title';score=0;combo=0;outs=0;fails=0;lvl=1;plays=0;result=null;parts=[];pops=[];}

function newPlay(){
  plays++; lvl=Math.min(7,1+Math.floor(outs/4));
  homeT=clamp(920-lvl*54,540,920);
  w=clamp(154-lvl*11,84,154);
  tough=Math.random()<clamp(0.2+lvl*0.05,0.2,0.5);
  if(tough)w*=0.8;
  phase='race'; clock=0; acted=false; actT=0; result=null; resultT=0; msg=''; msgOk=false; quality=0; throwU=0; runEnd=0;
  S.crack();
}
function start(){ if(!ac())ac(); if(AC&&AC.state==='suspended')AC.resume(); reset(); state='play'; newPlay(); }

function slide(){
  if(state==='title'){start();return;}
  if(state==='over'){ if(resultT>0.4){reset();start();} return; }
  if(state!=='play'||phase!=='race'||acted) return;
  acted=true; actT=clock; runEnd=clamp(clock/homeT,0,1); S.slide();
  if(clock<homeT-w){ resolve('early'); }
  else if(clock<=homeT+w){ quality=1-Math.abs(clock-homeT)/w; resolve('score'); }
  else resolve('late');
}

function resolve(k){
  phase='result'; result=k; resultT=0; throwU=0;
  if(k==='score'){
    outs++; combo++;
    const perfect=quality>=0.8;
    let add=Math.round((tough?250:150)*(1+Math.min(9,combo-1)*0.14)); score+=add;
    setTimeout(S.score,40); if(perfect||tough)setTimeout(S.big,150);
    msgOk=true; flash=1;flashCol='#8affa0';shake=5; burst(HOME.x,HOME.y-8,'#8affa0',16,7);
    pop(W/2,250,(perfect?'際どいタイムプレーで先制！ +':'先に生還！ 得点！ +')+add,'#d6ffe0');
    if(combo>=2)pop(W/2,150,'コンボ x'+combo,'#ffd24d');
    if(combo>0&&combo%5===0)S.streak();
    msg='三塁走者が本塁を先に踏んだ——三アウトより先に生還、タイムプレー成立で得点';
  } else {
    fails++; combo=0; msgOk=false; flash=1;shake=8; S.mitt(); setTimeout(S.out,60);
    if(k==='early'){ flashCol='#ff5b5b'; msg='早い…スライディングが早く失速、本塁を踏む前に一塁で三アウト＝無得点'; pop(W/2,250,'先に三アウト…無得点','#ffb0b0'); }
    else if(k==='late'){ flashCol='#ff8b3b'; msg='遅い…もたついた間に一塁で三アウトが先に成立＝走者の生還は無効'; pop(W/2,250,'間に合わず…無得点','#ffcf9a'); }
    else { flashCol='#ff5b5b'; msg='走り込めず…一塁で三アウトが先に成立して無得点'; pop(W/2,250,'無得点…','#ffb0b0'); }
  }
  if(fails>=3){ state='over'; resultT=0; S.over(); if(score>best){best=score;localStorage.setItem('tp_best',best);} }
}

// ---------- input ----------
cv.addEventListener('pointerdown',e=>{e.preventDefault();slide();});
addEventListener('keydown',e=>{ if(e.repeat)return;
  if(e.code==='Space'||e.code==='Enter'||e.code==='ArrowUp'||e.code==='KeyF'||e.code==='KeyJ'){e.preventDefault();slide();} });

// ---------- particles ----------
function burst(x,y,c,n,sp){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=rnd(sp*0.3,sp);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:1,c});}}
function pop(x,y,txt,c){pops.push({x,y,txt,c,life:1});}

// runner progress 3rd->home (0..1)
function runnerU(){
  if(phase==='race') return clamp(clock/homeT,0,1)*0.96;
  const base=runEnd*0.96;
  if(result==='score') return clamp(base+easeOut(throwU)*(1-base),0,1);   // slides across the plate
  return clamp(base+easeOut(throwU)*0.10,0,1);                            // stalls short / just short
}
// throw progress toward first (the 3rd out); reaches ~1 around homeT (a true race)
function throwProg(){
  if(phase==='race') return clamp((clock-homeT*0.12)/(homeT*0.9),0,1);
  return clamp(0.9+easeOut(throwU)*0.1,0,1);
}

// ---------- update ----------
function update(dt){
  shake*=Math.pow(0.86,dt/16.7); if(shake<0.3)shake=0;
  flash*=Math.pow(0.9,dt/16.7);
  for(const q of parts){q.vx*=0.96;q.vy=q.vy*0.96+0.28;q.x+=q.vx*dt/16.7;q.y+=q.vy*dt/16.7;q.life-=dt/16.7*0.026;}
  parts=parts.filter(q=>q.life>0);
  for(const q of pops){q.y-=dt/16.7*0.5;q.life-=dt/16.7*0.02;}
  pops=pops.filter(q=>q.life>0);

  if(state!=='play'){ if(state==='over')resultT+=dt/1000; return; }
  if(phase==='race'){ clock+=dt;
    if(!acted && clock>homeT+w*2){ acted=true; actT=clock; runEnd=1; resolve('no'); }
    return; }
  if(phase==='result'){ resultT+=dt/1000; throwU=Math.min(1,throwU+dt/460);
    if(resultT>1.6) newPlay(); return; }
}

// ---------- render ----------
function drawField(){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#12703f');g.addColorStop(0.5,'#0f5e34');g.addColorStop(1,'#0c4c2b');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  // infield dirt diamond (home at bottom, 2nd at top)
  ctx.fillStyle='#6a4a30';ctx.beginPath();ctx.moveTo(HOME.x,HOME.y+10);ctx.lineTo(THIRD.x-30,THIRD.y);ctx.lineTo(452,120);ctx.lineTo(FIRST.x+30,FIRST.y);ctx.closePath();ctx.fill();
  // basepath 3rd -> home (the runner's lane)
  ctx.strokeStyle='rgba(230,210,150,0.6)';ctx.lineWidth=20;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(THIRD.x,THIRD.y);ctx.lineTo(HOME.x,HOME.y);ctx.stroke();ctx.lineCap='butt';
  // bases
  for(const bs of [THIRD,FIRST]){ ctx.fillStyle='#f2f2f2';ctx.save();ctx.translate(bs.x,bs.y);ctx.rotate(0.785);ctx.fillRect(-12,-12,24,24);ctx.restore(); }
  // home plate
  ctx.fillStyle='#e8e4d8';ctx.beginPath();ctx.moveTo(HOME.x-14,HOME.y-8);ctx.lineTo(HOME.x+14,HOME.y-8);ctx.lineTo(HOME.x+14,HOME.y+3);ctx.lineTo(HOME.x,HOME.y+14);ctx.lineTo(HOME.x-14,HOME.y+3);ctx.closePath();ctx.fill();
}
function person(x,y,col,s,lean){s=s||1;lean=lean||0;
  ctx.save();ctx.translate(x,y);ctx.rotate(lean);
  ctx.fillStyle=col;ctx.beginPath();ctx.ellipse(0,-14*s,9*s,15*s,0,0,6.28);ctx.fill();
  ctx.fillStyle='#f0c9a0';ctx.beginPath();ctx.arc(0,-32*s,7*s,0,6.28);ctx.fill();
  ctx.restore();
}

function render(){
  ctx.save();
  if(shake>0)ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
  drawField();

  if(state==='play'||state==='over'){
    // first baseman waiting at first
    person(FIRST.x+16,FIRST.y-6,'#2b6fd6',0.82);
    // batter-runner hustling toward first (the potential 3rd out)
    const tp=throwProg();
    const brx=lerp(HOME.x+30,FIRST.x-14,clamp(tp*1.05,0,1)), bry=lerp(HOME.y-20,FIRST.y+6,clamp(tp*1.05,0,1));
    person(brx,bry,'#c86a2a',0.8,-0.4);
    // fielder throwing to first
    person(INF.x,INF.y,'#2b6fd6',0.9);
    // the throw to first
    if(tp>0.02){ const bx=lerp(INF.x,FIRST.x,easeOut(tp)),by=lerp(INF.y-14,FIRST.y-6,easeOut(tp));
      ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(bx,by,6.5,0,6.28);ctx.fill();
      ctx.strokeStyle='#c33';ctx.lineWidth=1.1;ctx.beginPath();ctx.arc(bx,by,6.5,0.4,2.2);ctx.stroke(); }

    // the 3rd-base runner racing home (you)
    const ru=runnerU(); const rx=lerp(THIRD.x,HOME.x,ru), ry=lerp(THIRD.y,HOME.y,ru);
    const sliding=(phase==='result'&&result==='score'&&throwU>0.35);
    person(rx,ry,'#d0403a',1.0,sliding?-0.9:-0.4);

    // cue banner + timing bar
    ctx.textAlign='center';
    if(state==='play'&&phase==='race'){
      ctx.fillStyle='rgba(255,220,90,0.96)';ctx.font='bold 20px sans-serif';ctx.fillText('二死・タイムプレー！ 三アウトより先に本塁を踏め',W/2,44);
      const bw=280,x=W/2-bw/2,y=58, span=homeT+w*2.2;
      ctx.fillStyle='rgba(255,255,255,0.16)';ctx.fillRect(x,y,bw,9);
      const gx0=x+bw*clamp((homeT-w)/span,0,1), gx1=x+bw*clamp((homeT+w)/span,0,1);
      ctx.fillStyle='rgba(90,240,130,0.5)';ctx.fillRect(gx0,y,gx1-gx0,9);
      // the "3rd out at first" tick — you must touch home before this
      ctx.fillStyle='#ff6b6b';ctx.fillRect(x+bw*clamp(homeT/span,0,1)-1,y-4,2,17);
      const px=x+bw*clamp(clock/span,0,1);
      ctx.fillStyle='#ffe14d';ctx.fillRect(px-2,y-3,4,15);
      ctx.fillStyle='rgba(255,255,255,0.55)';ctx.font='12px sans-serif';ctx.fillText('タップ / SPACE ＝ 本塁へスライディング（早いと失速・遅いと三アウトが先）',W/2,H-28);
    }
  }

  for(const q of parts){ctx.globalAlpha=Math.max(0,q.life);ctx.fillStyle=q.c;ctx.beginPath();ctx.arc(q.x,q.y,3.2,0,6.28);ctx.fill();}
  ctx.globalAlpha=1;
  for(const q of pops){ctx.globalAlpha=Math.max(0,q.life);ctx.fillStyle=q.c;ctx.font='bold 21px sans-serif';ctx.textAlign='center';ctx.fillText(q.txt,q.x,q.y);}
  ctx.globalAlpha=1;

  // HUD
  ctx.textAlign='left';ctx.fillStyle='#fff';ctx.font='bold 26px sans-serif';ctx.fillText('SCORE '+score,20,36);
  ctx.textAlign='right';ctx.fillStyle='rgba(255,255,255,0.9)';ctx.font='14px sans-serif';ctx.fillText('得点 '+outs+'  Lv'+lvl,W-20,24);
  ctx.fillText('無得点',W-104,46);
  for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(W-60+i*20,41,7,0,6.28);ctx.fillStyle=i<fails?'#ff5b5b':'rgba(255,255,255,0.25)';ctx.fill();}
  if(combo>=2){ctx.textAlign='center';ctx.fillStyle='#ffd24d';ctx.font='bold 18px sans-serif';ctx.fillText('コンボ x'+combo,W/2,112);}

  if(state==='play'&&phase==='result'&&msg){ctx.textAlign='center';ctx.fillStyle=msgOk?'#9ff0b8':'#ffb38a';ctx.font='bold 16px sans-serif';ctx.fillText(msg,W/2,556);}

  if(state==='title'){
    ctx.fillStyle='rgba(4,8,4,0.83)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='bold 42px sans-serif';ctx.fillText('タイムプレー',W/2,84);
    ctx.fillStyle='#ffd23e';ctx.font='bold 22px sans-serif';ctx.fillText('Beat the Third Out',W/2,120);
    ctx.fillStyle='rgba(255,255,255,0.92)';ctx.font='16px sans-serif';
    ctx.fillText('二死・三塁走者。打球を捌かれ一塁で三アウトになる——その“前に”本塁を踏めば得点になる時間差の勝負',W/2,178);
    ctx.fillStyle='rgba(255,255,255,0.66)';ctx.font='14px sans-serif';
    ctx.fillText('走者が本塁に到達する“ちょうど”の緑窓でタップ/SPACE＝スライディングで生還',W/2,216);
    ctx.fillText('早い＝スライディングが早く失速し、一塁の三アウトが先に成立＝無得点',W/2,240);
    ctx.fillText('遅い/無操作＝もたついて三アウトが先＝無得点。窓ど真ん中の際どい生還ほど大量加点',W/2,264);
    ctx.fillText('※三アウトが先なら走者の生還は無効（タイムプレー）。上級ほど速く窓が狭い。3無得点で交代',W/2,288);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で開始',W/2,356);
    ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='14px sans-serif';ctx.fillText('BEST '+best,W/2,388);
  }
  if(state==='over'){
    ctx.fillStyle='rgba(4,8,4,0.85)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#ff6b6b';ctx.font='bold 46px sans-serif';ctx.fillText('3無得点…交代',W/2,222);
    ctx.fillStyle='#fff';ctx.font='bold 40px sans-serif';ctx.fillText('SCORE '+score,W/2,290);
    ctx.fillStyle='rgba(255,255,255,0.85)';ctx.font='19px sans-serif';ctx.fillText('得点 '+outs+'   BEST '+best,W/2,330);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で もう一度',W/2,402);
  }

  if(flash>0.02){ctx.globalAlpha=flash*0.5;ctx.fillStyle=flashCol;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}
  ctx.restore();

  ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,0.4)';ctx.font='12px sans-serif';
  ctx.fillText('タイムプレー：二死、一塁の三アウトより先に本塁を踏めば得点。早い＝失速/遅い＝三アウト先/無操作＝無得点、3つで交代',W/2,H-8);
}

function frame(ts){let dt=ts-last;last=ts;if(dt>60)dt=60;if(dt<0)dt=0;update(dt);render();requestAnimationFrame(frame);}
requestAnimationFrame(frame);

// ---------- test hook ----------
window.__tp={
  start, slide,
  get state(){return state;},
  get score(){return score;},
  get outs(){return outs;},
  get fails(){return fails;},
  get info(){return {state,phase,clock,homeT,w,tough,acted,actT,result,outs,fails,lvl,
    inFair:(phase==='race'&&Math.abs(clock-homeT)<=w)};}
};
})();
</script>
</body>
</html>
