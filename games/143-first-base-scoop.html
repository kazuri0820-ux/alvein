<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ファースト・ストレッチ (First Base: Scoop &amp; Stretch)</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;background:#0a1206;overflow:hidden;font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",system-ui,sans-serif}
  #wrap{width:100%;height:100%;display:flex;align-items:center;justify-content:center}
  #stage{position:relative;width:min(100vw,calc(100vh*1.5));aspect-ratio:900/600;max-width:900px;
    box-shadow:0 10px 60px rgba(0,0,0,.6);border-radius:10px;overflow:hidden;touch-action:none}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
  #hint{position:absolute;left:0;bottom:6px;width:100%;text-align:center;color:#cfe;
    font-size:12px;opacity:.55;pointer-events:none;text-shadow:0 1px 3px #000}
</style>
</head>
<body>
<div id="wrap"><div id="stage">
  <canvas id="cv"></canvas>
  <div id="hint">送球の軌道を読んで捕り方を選べ！ ↑高い / ↓ショートバウンド / ←逸れ左 / →逸れ右 / SPACE通常。走者より先に捕ってアウト（タップ方向でも可）</div>
</div></div>
<script>
(()=>{
const cv=document.getElementById('cv'), g=cv.getContext('2d');
const W=900,H=600;
let DPR=1;
function fit(){ DPR=Math.min(2,window.devicePixelRatio||1); cv.width=W*DPR; cv.height=H*DPR; g.setTransform(DPR,0,0,DPR,0,0); }
fit(); addEventListener('resize',fit);

// ---------- audio ----------
let AC=null;
function ac(){ if(!AC){ try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){} } return AC; }
function tone(f,d,t,v,sweep){ const a=ac(); if(!a)return; const o=a.createOscillator(),gg=a.createGain();
  o.type=t||'sine'; o.frequency.value=f; if(sweep) o.frequency.exponentialRampToValueAtTime(Math.max(20,sweep),a.currentTime+d);
  gg.gain.setValueAtTime(0.0001,a.currentTime); gg.gain.exponentialRampToValueAtTime(v||0.2,a.currentTime+0.012);
  gg.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+d); o.connect(gg).connect(a.destination);
  o.start(); o.stop(a.currentTime+d+0.02); }
function noise(d,v,hp){ const a=ac(); if(!a)return; const n=a.createBuffer(1,a.sampleRate*d,a.sampleRate); const ch=n.getChannelData(0);
  for(let i=0;i<ch.length;i++) ch[i]=(Math.random()*2-1)*(1-i/ch.length);
  const s=a.createBufferSource(); s.buffer=n; const f=a.createBiquadFilter(); f.type='highpass'; f.frequency.value=hp||600;
  const gg=a.createGain(); gg.gain.value=v||0.15; s.connect(f).connect(gg).connect(a.destination); s.start(); }
const S={
  throw(){ tone(500,0.06,'triangle',0.07,760); },
  glove(){ noise(0.05,0.16,500); tone(240,0.06,'square',0.1,140); },
  out(){ tone(560,0.09,'triangle',0.13,880); setTimeout(()=>tone(840,0.11,'triangle',0.1,1120),80); },
  err(){ noise(0.16,0.2,400); tone(200,0.16,'sawtooth',0.13,80); },
  hit(){ tone(300,0.2,'sawtooth',0.11,110); },
  gg(){ tone(660,0.09,'triangle',0.1,980); setTimeout(()=>tone(990,0.13,'triangle',0.1,1320),100); noise(0.3,0.09,400); },
  over(){ tone(300,0.5,'sawtooth',0.16,90); setTimeout(()=>tone(200,0.6,'sawtooth',0.14,60),160); },
};

// ---------- geometry ----------
const BASE={x:700,y:430};       // first base (glove home)
const HOME={x:250,y:520};
const ZONES=['normal','scoop','high','left','right'];
function zonePoint(z){ if(z==='normal') return {x:BASE.x,y:BASE.y-34};
  if(z==='scoop') return {x:BASE.x,y:BASE.y+4};
  if(z==='high') return {x:BASE.x,y:BASE.y-78};
  if(z==='left') return {x:BASE.x-74,y:BASE.y-34};
  return {x:BASE.x+74,y:BASE.y-34}; }

// ---------- state ----------
let state='title';
let parts=[], pops=[];
let score, combo, best, lvl, errors, outs;
let phase='throw', play=null, t=0, resT=0, pend=null, pendDelay=0;
let flash=0, shakeT=0;
try{ best=+localStorage.getItem('fb_best')||0; }catch(e){ best=0; }

const crowd=[]; { const cc=['#e6b48f','#9bd0e6','#e6dc8f','#c9a0d8','#8fd8bd','#f0f0f0']; for(let i=0;i<200;i++) crowd.push({x:(i*29.7)%W, y:2+((i*61)%42), c:cc[i%cc.length]}); }
function clamp(v,a,b){ return v<a?a:v>b?b:v; }
function rnd(a,b){ return a+Math.random()*(b-a); }
function chance(p){ return Math.random()<p; }

function reset(){ parts=[]; pops=[]; score=0; combo=0; lvl=0; errors=0; outs=0; newPlay(); }
function newPlay(){
  phase='throw'; t=0; resT=0; pend=null;
  const zone = ZONES[Math.floor(Math.random()*ZONES.length)];
  // fielder position (SS/2B/3B/P) somewhere in the infield left/center
  const fx=rnd(300,470), fy=rnd(300,430);
  const flightT = clamp(820 - lvl*58 + rnd(-40,40), 440, 820);
  const target = zonePoint(zone);
  play={ zone, fx, fy, flightT, target, sel:null, locked:false, result:null, ball:{x:fx,y:fy}, applied:false };
  S.throw();
}
function ballAt(tt){ const p=play; const f=clamp(tt/p.flightT,0,1); const tgt=p.target;
  let x=p.fx+(tgt.x-p.fx)*f, y;
  if(p.zone==='scoop'){ // short hop: descends, bounces ~0.78 then to low glove
    if(f<0.8){ y=p.fy+(BASE.y+34-p.fy)*(f/0.8); } else { const b=(f-0.8)/0.2; y=(BASE.y+34)+(tgt.y-(BASE.y+34))*b - Math.sin(b*Math.PI)*26; } }
  else if(p.zone==='high'){ y=p.fy+(tgt.y-p.fy)*f - Math.sin(f*Math.PI)*40; }
  else { y=p.fy+(tgt.y-p.fy)*f - Math.sin(f*Math.PI)*24; }
  return {x,y,f}; }

function select(z){ if(state!=='play'||phase!=='throw'||play.locked) return;
  play.sel=z; play.locked=true; S.glove(); }
function resolvePlay(){
  const p=play; const ok = p.sel===p.zone;
  if(ok){ outs++; combo++; const gained=90+combo*10; score+=gained; S.out();
    // great = committed early (before 65% of flight); adds a bit
    pops.push({txt:'アウト！ +'+gained,x:W/2,y:150,big:true,life:1.05,c:'#8fffb0'});
    for(let i=0;i<12;i++) parts.push({x:BASE.x,y:BASE.y-30,vx:rnd(-5,5),vy:rnd(-6,-1),life:0.9,c:'#bfffcf'});
    if(combo>0&&combo%5===0){ score+=80; S.gg(); pops.push({txt:combo+'連続！ 好守 +80',x:W/2,y:196,big:false,life:1.0,c:'#ffd84a'}); flash=Math.max(flash,0.3); }
    lvl=Math.min(6, Math.floor(outs/4 + Math.floor(score/700)));
    end(true);
  } else {
    errors++; combo=0; shakeT=0.28; flash=Math.max(flash,0.32);
    const msg = p.sel==null ? '捕れず…内野安打' : 'グラブに当てられず エラー';
    (p.sel==null?S.hit():S.err());
    pops.push({txt:msg,x:W/2,y:160,big:true,life:1.1,c:'#ff6a6a'});
    for(let i=0;i<10;i++) parts.push({x:BASE.x,y:BASE.y,vx:rnd(-6,6),vy:rnd(-5,3),life:0.9,c:'#ff9a6a'});
    end(false);
  }
}
function end(ok){ phase='resolve'; resT=0; pendDelay=ok?820:1050; pend = errors>=3 ? 'over' : 'next'; }
function gameOver(){ state='over'; S.over(); if(score>best){ best=score; try{localStorage.setItem('fb_best',best);}catch(e){} } }

// ---------- input ----------
function start(){ ac(); reset(); state='play'; }
function pt(e){ const r=cv.getBoundingClientRect(); return {x:(e.clientX-r.left)/r.width*W, y:(e.clientY-r.top)/r.height*H}; }
cv.addEventListener('pointerdown',e=>{ ac(); if(state!=='play'){ start(); return; }
  if(phase==='throw'){ const p=pt(e); const dx=p.x-BASE.x, dy=p.y-BASE.y;
    if(Math.abs(dx)>Math.abs(dy)*1.3 && Math.abs(dx)>36){ select(dx<0?'left':'right'); }
    else if(dy<-46){ select('high'); }
    else if(dy>34){ select('scoop'); }
    else select('normal'); }
  e.preventDefault(); });
addEventListener('keydown',e=>{ const k=e.key.toLowerCase();
  if(state!=='play'){ if(!e.repeat) start(); return; }
  if(phase==='throw'){ if(k==='arrowup'||k==='w') select('high'); else if(k==='arrowdown'||k==='s') select('scoop');
    else if(k==='arrowleft'||k==='a') select('left'); else if(k==='arrowright'||k==='d') select('right');
    else if(k===' '||k==='enter') select('normal');
    if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(e.key.toLowerCase())) e.preventDefault(); } });

// ---------- update ----------
function update(dt){
  if(flash>0) flash=Math.max(0,flash-dt*0.003);
  if(shakeT>0) shakeT-=dt*0.001;
  parts.forEach(q=>{q.x+=q.vx;q.y+=q.vy;q.vy+=0.2;q.life-=dt*0.0022;});
  parts=parts.filter(q=>q.life>0);
  pops.forEach(q=>{q.y-=dt*0.02;q.life-=dt*0.0014;});
  pops=pops.filter(q=>q.life>0);
  if(state!=='play') return;

  if(phase==='throw'){
    t+=dt; const b=ballAt(t); play.ball.x=b.x; play.ball.y=b.y;
    if(t>=play.flightT+90 && !play.applied){ play.applied=true; resolvePlay(); }
  } else if(phase==='resolve'){
    resT+=dt;
    if(resT>=pendDelay && pend){ const p=pend; pend=null; if(p==='over') gameOver(); else newPlay(); }
  }
}

// ---------- render ----------
function man(x,y,col,r){ r=r||13; g.fillStyle=col; g.beginPath(); g.arc(x,y-r,r*0.7,0,6.28); g.fill();
  g.fillRect(x-r*0.55,y-r*0.6,r*1.1,r*1.3); g.fillStyle='rgba(0,0,0,0.18)'; g.beginPath(); g.ellipse(x,y+r*0.7,r*0.9,r*0.3,0,0,6.28); g.fill(); }
function bagd(b){ g.save(); g.translate(b.x,b.y+8); g.rotate(Math.PI/4); g.fillStyle='#eee'; g.fillRect(-11,-11,22,22); g.restore(); }
function drawField(){
  const gr=g.createLinearGradient(0,0,0,H); gr.addColorStop(0,'#25864a'); gr.addColorStop(1,'#1e6f3a'); g.fillStyle=gr; g.fillRect(0,0,W,H);
  g.fillStyle='#0e2233'; g.fillRect(0,0,W,40);
  for(const c of crowd){ g.fillStyle=c.c; g.globalAlpha=0.6; g.fillRect(c.x,c.y,3,3); } g.globalAlpha=1;
  // dirt around first base
  g.fillStyle='#7a5233'; g.beginPath(); g.arc(BASE.x,BASE.y+6,66,0,6.28); g.fill();
  g.fillStyle='#7a5233'; g.beginPath(); g.arc(HOME.x,HOME.y,42,0,6.28); g.fill();
  // foul line home->first
  g.strokeStyle='rgba(255,255,255,0.7)'; g.lineWidth=3; g.beginPath(); g.moveTo(HOME.x,HOME.y); g.lineTo(BASE.x+30,BASE.y+30); g.stroke();
  bagd(BASE);
}
function zoneLabel(z){ return {normal:'通常',scoop:'ショートバウンド',high:'高い',left:'逸れ左',right:'逸れ右'}[z]; }
function drawScene(){
  const p=play;
  // fielder who threw
  man(p.fx,p.fy,'#3550a0',13);
  // runner sprinting to first (urgency)
  if(phase==='throw'){ const f=clamp(t/p.flightT,0,1); const rx=HOME.x+(BASE.x-40-HOME.x)*(0.2+0.8*f), ry=HOME.y+(BASE.y-HOME.y)*(0.2+0.8*f);
    man(rx,ry,'#e08a2e',12); }
  // first baseman + glove at selected zone (or home)
  const gp = p.sel? zonePoint(p.sel) : {x:BASE.x-6,y:BASE.y-30};
  man(BASE.x-2,BASE.y+2,'#2f6fd0',14);
  g.fillStyle=p.locked?'#ffd84a':'#cfe'; g.beginPath(); g.arc(gp.x,gp.y,11,0,6.28); g.fill();
  // ball
  if(phase==='throw'|| (phase==='resolve')){ const bx=p.ball.x, by=p.ball.y; g.fillStyle='#fff'; g.beginPath(); g.arc(bx,by,6,0,6.28); g.fill();
    g.strokeStyle='rgba(0,0,0,0.3)'; g.lineWidth=1; g.beginPath(); g.arc(bx-2,by,4,-0.6,0.6); g.stroke(); }
  // prompt
  if(phase==='throw'){ g.textAlign='center'; g.fillStyle=p.locked?'#8fffb0':'rgba(255,255,255,0.8)'; g.font='bold 18px sans-serif';
    g.fillText(p.locked?('「'+zoneLabel(p.sel)+'」で捕球'):'送球の軌道を読め！',W/2,70);
    // zone key guide
    g.font='bold 13px sans-serif'; g.fillStyle='rgba(255,255,255,0.5)';
    g.fillText('↑高い  ↓バウンド  ←左  →右  SPACE通常',W/2,H-40); }
}
function drawHUD(){
  g.textAlign='left'; g.fillStyle='#fff'; g.font='bold 25px sans-serif'; g.fillText('SCORE '+score,20,34);
  if(combo>1){ g.fillStyle='#ffd84a'; g.font='bold 16px sans-serif'; g.fillText(combo+' 連続アウト',20,56); }
  g.textAlign='right'; g.fillStyle='rgba(255,255,255,0.8)'; g.font='14px sans-serif'; g.fillText('アウト '+outs+'  Lv.'+(lvl+1),W-20,32);
  g.fillStyle='#ff6a6a'; g.textAlign='right'; g.font='bold 14px sans-serif'; g.fillText('失策',W-92,H-18);
  for(let i=0;i<3;i++){ g.fillStyle=i<errors?'#ff5a5a':'rgba(255,255,255,0.24)'; g.beginPath(); g.arc(W-70+i*22,H-23,8,0,6.28); g.fill(); }
}
function drawTitle(){
  g.fillStyle='rgba(0,0,0,0.5)'; g.fillRect(0,0,W,H);
  g.textAlign='center'; g.fillStyle='#8fffb0'; g.font='bold 46px sans-serif'; g.fillText('ファースト・ストレッチ',W/2,158);
  g.fillStyle='#fff'; g.font='bold 22px sans-serif'; g.fillText('First Base — 捕り方を見極めろ',W/2,196);
  g.fillStyle='#cfe'; g.font='18px sans-serif';
  g.fillText('内野からの送球の軌道を読み、正しい捕り方を選べ。',W/2,250);
  g.fillText('↑高い / ↓ショートバウンド（すくう） / ←逸れ左 / →逸れ右 / SPACE通常。',W/2,278);
  g.fillText('走者が到達する前に正しく捕ればアウト。',W/2,306);
  g.fillText('捕り方を間違える・捕れないとエラー/内野安打。3失策で終了。',W/2,334);
  g.fillStyle='#ffd84a'; g.font='bold 22px sans-serif'; g.fillText('クリック / タップ / キー でスタート',W/2,402);
}
function drawOver(){
  g.fillStyle='rgba(0,0,0,0.62)'; g.fillRect(0,0,W,H);
  g.textAlign='center'; g.fillStyle='#ff6a6a'; g.font='bold 54px sans-serif'; g.fillText('3失策…降板',W/2,H/2-54);
  g.fillStyle='#fff'; g.font='bold 34px sans-serif'; g.fillText('SCORE '+score,W/2,H/2+2);
  g.fillStyle='#cfe'; g.font='20px sans-serif'; g.fillText('アウト '+outs+'　BEST '+best,W/2,H/2+40);
  g.fillStyle='#8fffb0'; g.font='bold 22px sans-serif'; g.fillText('クリック / タップ で もう一度',W/2,H/2+96);
}
function render(){
  g.setTransform(DPR,0,0,DPR,0,0);
  let sx=0,sy=0; if(shakeT>0){ sx=rnd(-6,6)*shakeT*3; sy=rnd(-6,6)*shakeT*3; g.translate(sx,sy); }
  drawField();
  if(state==='play'||state==='over') drawScene();
  parts.forEach(q=>{ g.globalAlpha=clamp(q.life,0,1); g.fillStyle=q.c; g.beginPath(); g.arc(q.x,q.y,3,0,6.28); g.fill(); }); g.globalAlpha=1;
  pops.forEach(q=>{ g.globalAlpha=clamp(q.life,0,1); g.textAlign='center'; g.fillStyle=q.c; g.font='bold '+(q.big?34:22)+'px sans-serif';
    const px=(q.x==null)?W/2:q.x; g.fillText(q.txt,px,q.y); }); g.globalAlpha=1;
  if(state==='play') drawHUD();
  if(flash>0){ g.fillStyle='rgba(255,255,255,'+(flash*0.6)+')'; g.fillRect(0,0,W,H); }
  if(state==='title') drawTitle();
  if(state==='over') drawOver();
  g.setTransform(DPR,0,0,DPR,0,0);
}

let last=0;
function frame(ts){ let dt=ts-last; last=ts; if(dt>60)dt=60; if(dt<0)dt=0; update(dt); render(); requestAnimationFrame(frame); }
requestAnimationFrame(frame);

// ---------- test hook ----------
window.__fb={
  start, select:(z)=>select(z),
  get state(){return state;}, get score(){return score;}, get errors(){return errors;}, get outs(){return outs;},
  get info(){ if(state!=='play') return {state,phase:'-'}; return {
    state, phase, zone:play&&play.zone, flightT:play&&play.flightT, t, sel:play&&play.sel, locked:play&&play.locked, result:play&&play.result, errors, outs }; }
};
})();
</script>
</body>
</html>
