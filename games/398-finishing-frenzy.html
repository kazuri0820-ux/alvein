<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>決めまくれ (Finishing Frenzy)</title>
<style>
  html,body{margin:0;height:100%;background:#07100a;overflow:hidden;
    font-family:-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  #stage{position:relative;width:100vw;height:100vh;max-width:calc(100vh*1.5);max-height:calc(100vw/1.5);aspect-ratio:900/600;}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;border-radius:6px;}
</style>
</head>
<body>
<div id="wrap"><div id="stage"><canvas id="cv"></canvas></div></div>
<script>
(function(){
const W=900,H=600,cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let DPR=1;
function fit(){DPR=Math.min(2,window.devicePixelRatio||1);cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
fit();addEventListener('resize',fit);

// ---------- audio ----------
let AC=null;function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function tone(f,d,type,v,sweep){const a=ac();if(!a)return;const t=a.currentTime,o=a.createOscillator(),g=a.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(sweep)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+sweep),t+d);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v||0.2,t+0.008);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+0.02);}
function noise(d,v,hp){const a=ac();if(!a)return;const t=a.currentTime,n=Math.floor(a.sampleRate*d),buf=a.createBuffer(1,n,a.sampleRate),ch=buf.getChannelData(0);
  for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource();s.buffer=buf;
  const f=a.createBiquadFilter();f.type='highpass';f.frequency.value=hp||600;const g=a.createGain();g.gain.value=v||0.2;
  s.connect(f);f.connect(g);g.connect(a.destination);s.start(t);s.stop(t+d+0.02);}
let scaleI=0;
const S={
  kick:()=>{const notes=[523,587,659,698,784];tone(notes[scaleI%notes.length],0.08,'triangle',0.12);scaleI++;noise(0.04,0.09,700);},
  perfect:()=>{tone(1050,0.1,'triangle',0.12);},
  miss:()=>{noise(0.16,0.2,240);tone(150,0.18,'sawtooth',0.1,-40);},
  streak:()=>{[700,930,1170,1400].forEach((f,i)=>setTimeout(()=>tone(f,0.1,'triangle',0.16),i*60));},
  over:()=>{[440,330,247,175].forEach((f,i)=>setTimeout(()=>tone(f,0.3,'triangle',0.2),i*160));}
};

// ---------- geometry ----------
const LANES=[250,452,654], LINE=382, SPAWNY=566;
const GOALY=96, GOALH=70, GW=112;   // per-lane goal-mouth width
const POS=['左','中','右'];

// ---------- state ----------
let state='title', plays=0;
let score=0, combo=0, best=+(localStorage.getItem('ff_best')||0);
let outs=0, fails=0, lvl=1;   // outs = goals finished
let notes=[], fx=[], shots=[], tclk=0, spawnClk=0, lastLane=-1, sameCnt=0;
let travelT=1700, spawnInt=920, winP=0.17, graceP=0.27, lastTap=[-999,-999,-999], glow=[0,0,0];
let kx=452, kxTarget=452, shake=0, flash=0, flashCol='#fff', last=performance.now();

function rnd(a,b){return a+Math.random()*(b-a);}
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function lerp(a,b,u){return a+(b-a)*u;}
function easeOut(u){return 1-Math.pow(1-u,2);}

function reset(){state='title';score=0;combo=0;outs=0;fails=0;lvl=1;plays=0;notes=[];fx=[];shots=[];scaleI=0;}
function retune(){ lvl=Math.min(7,1+Math.floor(outs/4));
  travelT=clamp(1700-lvl*90,1150,1700); spawnInt=clamp(940-lvl*56,560,940);
  winP=clamp(0.17-lvl*0.008,0.11,0.17); graceP=winP*1.6; }
function start(){ if(!ac())ac(); if(AC&&AC.state==='suspended')AC.resume(); reset(); state='play'; tclk=0; spawnClk=0; notes=[]; fx=[]; shots=[]; retune(); spawn(); }

function spawn(){
  let lane=Math.floor(Math.random()*3);
  if(lane===lastLane){ sameCnt++; if(sameCnt>=2){ lane=(lane+1+Math.floor(Math.random()*2))%3; sameCnt=0; } } else sameCnt=0;
  lastLane=lane;
  notes.push({lane,spawnT:tclk,resolved:false});
}

function progOf(n){ return (tclk-n.spawnT)/travelT; }

function tap(lane){
  if(state==='title'){start();return;}
  if(state==='over'){ if(tclk>400){reset();start();} return; }
  if(state!=='play') return;
  if(tclk-lastTap[lane]<70) return;   // per-lane debounce
  lastTap[lane]=tclk; glow[lane]=1;
  let best=null,bd=99;
  for(const n of notes){ if(n.resolved||n.lane!==lane)continue; const e=Math.abs(progOf(n)-1); if(e<=graceP&&e<bd){bd=e;best=n;} }
  if(best){
    best.resolved=true;
    if(bd<=winP){ const q=1-bd/winP; goal(best,q); }
    else { botch(best,'ミスショット'); }
  } else {
    fails++; combo=0; flash=1;flashCol='#ff5b5b';shake=4; S.miss();
    fx.push({x:LANES[lane],y:LINE,txt:'空振り',c:'#ffb0b0',life:1});
    checkOver();
  }
}
function goal(n,q){
  outs++; combo++;
  const perfect=q>=0.62;
  let add=Math.round((perfect?60:36)*(1+Math.min(12,combo-1)*0.12)); score+=add;
  S.kick(); if(perfect)S.perfect();
  if(combo>0&&combo%8===0)S.streak();
  glow[n.lane]=1; flash=perfect?0.5:0.3; flashCol='#8affa0';
  // shot flies to goal: perfect -> top corner, else -> mid
  const side=(n.lane===0?-1:n.lane===2?1:0);
  const gx=LANES[n.lane]+ (perfect? side*34 : side*14 + (side===0?rnd(-18,18):0));
  const gy=GOALY+ (perfect? 10 : 34);
  shots.push({x0:LANES[n.lane],y0:LINE,x1:gx,y1:gy,t:0,perfect});
  burst(gx,gy,'#8affa0',perfect?14:8,6);
  fx.push({x:LANES[n.lane],y:LINE-16,txt:(perfect?'ゴラッソ！':'ゴール！')+' +'+add,c:perfect?'#d6ffe0':'#9ff0b8',life:1});
}
function botch(n,why){
  fails++; combo=0; flash=1;flashCol='#ff5b5b';shake=6; S.miss();
  fx.push({x:LANES[n.lane],y:LINE,txt:why,c:'#ffb0b0',life:1});
  checkOver();
}
function checkOver(){ if(fails>=3){ state='over'; if(score>best){best=score;localStorage.setItem('ff_best',best);} S.over(); } }

// ---------- input ----------
cv.addEventListener('pointerdown',e=>{e.preventDefault();
  if(state!=='play'){ tap(0); return; }
  const r=cv.getBoundingClientRect(); const x=(e.clientX-r.left)/r.width*W;
  tap(x<W/3?0:x<W*2/3?1:2);
});
addEventListener('keydown',e=>{ if(e.repeat)return;
  if(e.code==='ArrowLeft'||e.code==='KeyA'){e.preventDefault();tap(0);}
  else if(e.code==='ArrowDown'||e.code==='ArrowUp'||e.code==='KeyS'||e.code==='Space'){e.preventDefault();tap(1);}
  else if(e.code==='ArrowRight'||e.code==='KeyD'){e.preventDefault();tap(2);}
  else if(e.code==='Enter'){e.preventDefault(); if(state!=='play')tap(0);} });

// ---------- particles ----------
function burst(x,y,c,n,sp){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=rnd(sp*0.3,sp);fx.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:1,c,p:1});}}

// ---------- update ----------
function update(dt){
  shake*=Math.pow(0.86,dt/16.7); if(shake<0.3)shake=0;
  flash*=Math.pow(0.9,dt/16.7);
  for(let i=0;i<3;i++)glow[i]*=Math.pow(0.86,dt/16.7);
  for(const f of fx){ if(f.p){f.vx*=0.96;f.vy=f.vy*0.96+0.28;f.x+=f.vx*dt/16.7;f.y+=f.vy*dt/16.7;f.life-=dt/16.7*0.03;} else {f.y-=dt/16.7*0.5;f.life-=dt/16.7*0.022;} }
  fx=fx.filter(f=>f.life>0);
  for(const sh of shots){ sh.t=Math.min(1,sh.t+dt/240); }
  shots=shots.filter(sh=>sh.t<1);
  // keeper drifts toward the most-imminent note lane
  let immin=null,ip=-9; for(const n of notes){ if(n.resolved)continue; const pr=progOf(n); if(pr>ip&&pr<1.05){ip=pr;immin=n;} }
  if(immin!==null) kxTarget=lerp(452, LANES[immin.lane], 0.45);
  kx+=(kxTarget-kx)*Math.min(1,dt/120);

  if(state!=='play') return;
  tclk+=dt; spawnClk+=dt;
  if(spawnClk>=spawnInt){ spawnClk-=spawnInt; retune(); spawn(); }
  for(const n of notes){ if(!n.resolved && progOf(n)>1+graceP){ n.resolved=true; botch(n,'枠外'); } }
  notes=notes.filter(n=>!n.resolved || progOf(n)<1.35);
}

// ---------- render ----------
function drawScene(){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#0f5e34');g.addColorStop(0.55,'#0e5230');g.addColorStop(1,'#0c4429');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='rgba(255,255,255,0.03)';for(let i=0;i<6;i++){ if(i%2===0)ctx.fillRect(0,60+i*95,W,95); }
  // three shooting lanes
  for(let i=0;i<3;i++){ ctx.fillStyle='rgba(255,255,255,0.03)';ctx.fillRect(LANES[i]-70,GOALY,140,H-GOALY-40);
    ctx.strokeStyle='rgba(255,255,255,0.06)';ctx.lineWidth=1;ctx.strokeRect(LANES[i]-70,GOALY,140,H-GOALY-40); }
  // goal across the top
  ctx.fillStyle='rgba(0,0,0,0.28)';ctx.fillRect(LANES[0]-GW/2-4,GOALY-4,LANES[2]-LANES[0]+GW+8,GOALH+4);
  ctx.strokeStyle='rgba(255,255,255,0.34)';ctx.lineWidth=1;
  for(let gx=LANES[0]-GW/2;gx<=LANES[2]+GW/2;gx+=15){ctx.beginPath();ctx.moveTo(gx,GOALY);ctx.lineTo(gx,GOALY+GOALH);ctx.stroke();}
  for(let gy=GOALY;gy<=GOALY+GOALH;gy+=12){ctx.beginPath();ctx.moveTo(LANES[0]-GW/2,gy);ctx.lineTo(LANES[2]+GW/2,gy);ctx.stroke();}
  ctx.strokeStyle='#f2f2f2';ctx.lineWidth=6;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(LANES[0]-GW/2,GOALY+GOALH);ctx.lineTo(LANES[0]-GW/2,GOALY);ctx.lineTo(LANES[2]+GW/2,GOALY);ctx.lineTo(LANES[2]+GW/2,GOALY+GOALH);ctx.stroke();
  ctx.lineCap='butt';
  // strike line
  ctx.strokeStyle='rgba(255,255,255,0.4)';ctx.setLineDash([8,8]);ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(60,LINE);ctx.lineTo(W-60,LINE);ctx.stroke();ctx.setLineDash([]);
}
function striker(x,y,glowv){
  ctx.save();ctx.translate(x,y);
  if(glowv>0.05){ctx.fillStyle='rgba(140,255,160,'+glowv*0.5+')';ctx.beginPath();ctx.arc(0,-6,26,0,6.28);ctx.fill();}
  ctx.fillStyle='rgba(0,0,0,0.2)';ctx.beginPath();ctx.ellipse(0,13,11,4,0,0,6.28);ctx.fill();
  ctx.fillStyle='#2b6fd6';ctx.beginPath();ctx.ellipse(0,-14,9,14,0,0,6.28);ctx.fill();
  ctx.fillStyle='#f0c9a0';ctx.beginPath();ctx.arc(0,-31,7,0,6.28);ctx.fill();
  ctx.restore();
}
function keeper(x,y){ ctx.save();ctx.translate(x,y);
  ctx.fillStyle='rgba(0,0,0,0.2)';ctx.beginPath();ctx.ellipse(0,12,11,4,0,0,6.28);ctx.fill();
  ctx.fillStyle='#e8c23a';ctx.beginPath();ctx.ellipse(0,-12,9,13,0,0,6.28);ctx.fill();
  ctx.fillStyle='#f0c9a0';ctx.beginPath();ctx.arc(0,-27,6.5,0,6.28);ctx.fill();
  ctx.strokeStyle='#e8c23a';ctx.lineWidth=5;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(-8,-16);ctx.lineTo(-15,-26);ctx.moveTo(8,-16);ctx.lineTo(15,-26);ctx.stroke();
  ctx.restore(); }
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

function render(){
  ctx.save();
  if(shake>0)ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
  drawScene();

  // keeper
  keeper(clamp(kx,LANES[0]-30,LANES[2]+30),GOALY+GOALH+6);

  // shots flying into the net
  for(const sh of shots){ const u=easeOut(sh.t); const x=lerp(sh.x0,sh.x1,u),y=lerp(sh.y0,sh.y1,u);
    ctx.globalAlpha=1-sh.t*0.3;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(x,y,7,0,6.28);ctx.fill();
    ctx.strokeStyle='#333';ctx.lineWidth=1;ctx.beginPath();ctx.arc(x,y,7,0.4,2.2);ctx.stroke();ctx.globalAlpha=1; }

  if(state==='play'||state==='over'){
    // strike ring + striker at each lane
    for(let i=0;i<3;i++){
      ctx.strokeStyle='rgba(255,255,255,0.22)';ctx.lineWidth=3;ctx.beginPath();ctx.arc(LANES[i],LINE,24,0,6.28);ctx.stroke();
      striker(LANES[i],LINE-2,glow[i]);
      ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='12px sans-serif';ctx.textAlign='center';ctx.fillText(POS[i],LANES[i],LINE+40);
    }
    // incoming balls (fed up toward the strike line)
    for(const n of notes){ if(n.resolved)continue; const pr=progOf(n); if(pr<-0.05)continue;
      const y=lerp(SPAWNY,LINE,clamp(pr,0,1.3)); const x=LANES[n.lane];
      const near=Math.abs(pr-1)<=winP;
      ctx.fillStyle=near?'#fff7c0':'#fff';ctx.beginPath();ctx.arc(x,y,8,0,6.28);ctx.fill();
      ctx.strokeStyle='#333';ctx.lineWidth=1;ctx.beginPath();ctx.arc(x,y,8,0.4,2.2);ctx.stroke();
      ctx.globalAlpha=0.2;ctx.fillStyle='#fff';const y2=lerp(SPAWNY,LINE,clamp(pr-0.08,0,1.3));ctx.beginPath();ctx.arc(x,y2,6,0,6.28);ctx.fill();ctx.globalAlpha=1;
    }
  }

  for(const f of fx){ ctx.globalAlpha=Math.max(0,f.life);
    if(f.p){ctx.fillStyle=f.c;ctx.beginPath();ctx.arc(f.x,f.y,3,0,6.28);ctx.fill();}
    else{ctx.fillStyle=f.c;ctx.font='bold 18px sans-serif';ctx.textAlign='center';ctx.fillText(f.txt,f.x,f.y);} }
  ctx.globalAlpha=1;

  // HUD
  ctx.textAlign='left';ctx.fillStyle='#fff';ctx.font='bold 26px sans-serif';ctx.fillText('SCORE '+score,20,36);
  ctx.textAlign='right';ctx.fillStyle='rgba(255,255,255,0.9)';ctx.font='14px sans-serif';ctx.fillText('ゴール '+outs+'  Lv'+lvl,W-20,24);
  ctx.fillText('ミス',W-96,46);
  for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(W-56+i*20,41,7,0,6.28);ctx.fillStyle=i<fails?'#ff5b5b':'rgba(255,255,255,0.25)';ctx.fill();}
  if(combo>=3){ctx.textAlign='center';ctx.fillStyle='#ffd24d';ctx.font='bold 20px sans-serif';ctx.fillText('コンボ x'+combo,W/2,LINE+70);}

  if(state==='play'){ ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='13px sans-serif';
    ctx.fillText('ボールが点線（足元）に届く瞬間、そのレーンをタップ ／ 左=A・中=S/SPACE・右=D',W/2,H-14); }

  if(state==='title'){
    ctx.fillStyle='rgba(3,10,6,0.85)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='bold 44px sans-serif';ctx.fillText('決めまくれ',W/2,84);
    ctx.fillStyle='#ffd23e';ctx.font='bold 22px sans-serif';ctx.fillText('Finishing Frenzy',W/2,120);
    ctx.fillStyle='rgba(255,255,255,0.92)';ctx.font='16px sans-serif';
    ctx.fillText('左・中・右の3レーンに次々と供給されるパスを、足元に届く“その瞬間”にレーンを叩いてダイレクトで決めろ',W/2,176);
    ctx.fillStyle='rgba(255,255,255,0.66)';ctx.font='14px sans-serif';
    ctx.fillText('ボールが点線（足元）に届くタイミングでそのレーンをタップ／←A（左）・↓S/SPACE（中）・→D（右）',W/2,214);
    ctx.fillText('ジャストで蹴るほど隅に突き刺す“ゴラッソ”で高得点＆コンボ、テンポよく連続で決めろ',W/2,238);
    ctx.fillText('タイミングがズレる（ミスショット）／蹴れず枠外／何もないレーンを蹴る（空振り）はミス',W/2,262);
    ctx.fillText('決めるほど供給が速くなる（レベルアップ）。3ミスで交代',W/2,286);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で開始',W/2,352);
    ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='14px sans-serif';ctx.fillText('BEST '+best,W/2,384);
  }
  if(state==='over'){
    ctx.fillStyle='rgba(3,10,6,0.86)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#ff6b6b';ctx.font='bold 46px sans-serif';ctx.fillText('3ミス…交代',W/2,222);
    ctx.fillStyle='#fff';ctx.font='bold 40px sans-serif';ctx.fillText('SCORE '+score,W/2,290);
    ctx.fillStyle='rgba(255,255,255,0.85)';ctx.font='19px sans-serif';ctx.fillText('ゴール '+outs+'   BEST '+best,W/2,330);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で もう一度',W/2,402);
  }

  if(flash>0.02){ctx.globalAlpha=flash*0.5;ctx.fillStyle=flashCol;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}
  ctx.restore();

  ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,0.4)';ctx.font='12px sans-serif';
  ctx.fillText('決めまくれ：3レーンに供給されるパスを足元に届く瞬間にレーンタップでダイレクト・フィニッシュ。ズレ・枠外・空振りはミス、3ミスで交代',W/2,H-8);
}

function frame(ts){let dt=ts-last;last=ts;if(dt>60)dt=60;if(dt<0)dt=0;update(dt);render();requestAnimationFrame(frame);}
requestAnimationFrame(frame);

// ---------- test hook ----------
window.__ff={
  start, tap:(l)=>tap(l),
  get state(){return state;},
  get score(){return score;},
  get outs(){return outs;},
  get fails(){return fails;},
  get info(){ const ns=notes.filter(n=>!n.resolved).map(n=>({lane:n.lane,prog:progOf(n)}));
    return {state,outs,fails,lvl,winP,graceP,notes:ns}; }
};
})();
</script>
</body>
</html>
