<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ハンドボール？ (Handball?)</title>
<style>
  html,body{margin:0;height:100%;background:#07120b;overflow:hidden;
    font-family:-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  #stage{position:relative;width:100vw;height:100vh;max-width:calc(100vh*1.5);max-height:calc(100vw/1.5);aspect-ratio:900/600;}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;border-radius:6px;}
</style>
</head>
<body>
<div id="wrap"><div id="stage"><canvas id="cv"></canvas></div></div>
<script>
(function(){
const W=900,H=600,cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let DPR=1;
function fit(){DPR=Math.min(2,window.devicePixelRatio||1);cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
fit();addEventListener('resize',fit);

// ---------- audio ----------
let AC=null;function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function tone(f,d,type,v,sweep){const a=ac();if(!a)return;const t=a.currentTime,o=a.createOscillator(),g=a.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(sweep)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+sweep),t+d);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v||0.2,t+0.008);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+0.02);}
function noise(d,v,hp){const a=ac();if(!a)return;const t=a.currentTime,n=Math.floor(a.sampleRate*d),buf=a.createBuffer(1,n,a.sampleRate),ch=buf.getChannelData(0);
  for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource();s.buffer=buf;
  const f=a.createBiquadFilter();f.type='highpass';f.frequency.value=hp||600;const g=a.createGain();g.gain.value=v||0.2;
  s.connect(f);f.connect(g);g.connect(a.destination);s.start(t);s.stop(t+d+0.02);}
const S={
  fly:()=>{tone(300,0.08,'sine',0.05,120);},
  contact:()=>{noise(0.04,0.12,600);tone(300,0.05,'square',0.07);},
  whistle:()=>{tone(1800,0.14,'square',0.07);},
  good:()=>{[680,940,1220].forEach((f,i)=>setTimeout(()=>tone(f,0.1,'triangle',0.16),i*55));},
  big:()=>{[600,800,1000,1250].forEach((f,i)=>setTimeout(()=>tone(f,0.12,'triangle',0.17),i*80));},
  bad:()=>{noise(0.18,0.22,300);tone(160,0.22,'sawtooth',0.12,-50);},
  streak:()=>{[700,930,1170,1400].forEach((f,i)=>setTimeout(()=>tone(f,0.1,'triangle',0.16),i*60));},
  over:()=>{[440,330,247,175].forEach((f,i)=>setTimeout(()=>tone(f,0.3,'triangle',0.2),i*160));}
};

// ---------- geometry ----------
const DEF={x:450,y:360}, SHOT={x:640,y:120};

// ---------- buttons ----------
const BTN=[
  {k:'pk', x:150,label:'ハンド！ PK',sub:'不自然な腕＝ペナルティ',col:'#e0574b'},
  {k:'no', x:520,label:'ノーハンド',sub:'自然な位置／体に当たり等',col:'#3fc46b'}
];
const BW=230, BY=505, BH=64;

// ---------- state ----------
let state='title', phase='roll', plays=0;
let score=0, combo=0, best=+(localStorage.getItem('hb_best')||0);
let outs=0, fails=0, lvl=1;   // outs = correct calls
let clock=0, revealT=520, callWin=980, kind='pk', sub='wide', tough=false;
let decided=false, call=null, result=null, resultT=0, msg='', msgOk=false;
let shake=0, flash=0, flashCol='#fff', last=performance.now();
let parts=[], pops=[];

function rnd(a,b){return a+Math.random()*(b-a);}
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function lerp(a,b,u){return a+(b-a)*u;}
function easeOut(u){return 1-Math.pow(1-u,2);}

function reset(){state='title';score=0;combo=0;outs=0;fails=0;lvl=1;plays=0;result=null;parts=[];pops=[];}

function newPlay(){
  plays++; lvl=Math.min(7,1+Math.floor(outs/4));
  revealT=clamp(560-lvl*24,360,560);
  callWin=clamp(1020-lvl*70,560,1020);
  tough=Math.random()<clamp(0.2+lvl*0.05,0.2,0.5);
  const r=Math.random();
  if(r<0.5){ kind='pk'; sub='wide'; }
  else if(r<0.72){ kind='no'; sub='natural'; }
  else if(r<0.87){ kind='no'; sub='body'; }
  else { kind='no'; sub='close'; }
  phase='roll'; clock=0; decided=false; call=null; result=null; resultT=0; msg=''; msgOk=false;
  S.fly();
}
function start(){ if(!ac())ac(); if(AC&&AC.state==='suspended')AC.resume(); reset(); state='play'; newPlay(); }

function makeCall(c){
  if(state==='title'){start();return;}
  if(state==='over'){ if(resultT>0.4){reset();start();} return; }
  if(state!=='play'||phase!=='roll'||decided) return;
  if(clock<revealT){ decided=true; call=c; resolve('early'); return; }
  decided=true; call=c;
  const correct=(c==='pk')===(kind==='pk');
  resolve(correct?'good':'wrong');
}

function resolve(k){
  phase='result'; result=k; resultT=0;
  if(k==='good'){
    outs++; combo++;
    let add=Math.round((tough?250:150)*(1+Math.min(9,combo-1)*0.14)); score+=add;
    if(kind==='pk')S.whistle(); setTimeout(S.good,60); if(tough)setTimeout(S.big,120);
    msgOk=true; flash=1;flashCol='#8affa0';shake=5; burst(DEF.x,DEF.y,'#8affa0',18,7);
    pop(DEF.x,DEF.y-60,tough?'際どい判定を的中！ +'+add:'正しい判定！ +'+add,'#d6ffe0');
    if(combo>=2&&!tough)pop(W/2,150,'コンボ x'+combo,'#ffd24d');
    if(combo>0&&combo%5===0)S.streak();
    msg = (kind==='pk')?'腕を広げて体を大きくした不自然な位置——ハンドでPKが正解':
      (sub==='natural'?'腕は体に沿った自然な位置——ノーハンドが正解':
       sub==='body'?'先に体（腿）に当たってから腕へ——ノーハンドが正解':'至近距離で反応不可能——ノーハンドが正解');
  } else {
    fails++; combo=0; msgOk=false; flash=1;flashCol='#ff5b5b';shake=9; S.bad();
    if(k==='early') msg='判定が早い…腕の位置と当たり方を見極める前は禁物';
    else if(k==='late') msg='判定が遅い…笛のタイミングを逃した';
    else msg = (kind==='pk')?'誤審…腕を広げた不自然な位置でハンド（PK）だった':
      (sub==='natural'?'誤審…腕は自然な位置でノーハンドが正解':
       sub==='body'?'誤審…先に体に当たっておりノーハンドが正解':'誤審…至近距離で反応不可能、ノーハンドが正解');
    pop(DEF.x,DEF.y-60,'誤審…','#ffb0b0');
  }
  if(fails>=3){ state='over'; resultT=0; S.over(); if(score>best){best=score;localStorage.setItem('hb_best',best);} }
}

// ---------- input ----------
cv.addEventListener('pointerdown',e=>{e.preventDefault();
  if(state!=='play'||phase!=='roll'){ makeCall('pk'); return; }
  const r=cv.getBoundingClientRect(); const x=(e.clientX-r.left)/r.width*W, y=(e.clientY-r.top)/r.height*H;
  for(const b of BTN){ if(x>=b.x&&x<=b.x+BW&&y>=BY&&y<=BY+BH){ makeCall(b.k); return; } }
});
addEventListener('keydown',e=>{ if(e.repeat)return;
  if(e.code==='ArrowUp'||e.code==='KeyH'||e.code==='Digit1'){e.preventDefault();makeCall('pk');}
  else if(e.code==='ArrowDown'||e.code==='KeyN'||e.code==='Digit2'){e.preventDefault();makeCall('no');}
  else if(e.code==='Space'||e.code==='Enter'){e.preventDefault(); if(state!=='play')makeCall('pk');} });

// ---------- particles ----------
function burst(x,y,c,n,sp){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=rnd(sp*0.3,sp);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:1,c});}}
function pop(x,y,txt,c){pops.push({x,y,txt,c,life:1});}

// ---------- update ----------
function update(dt){
  shake*=Math.pow(0.86,dt/16.7); if(shake<0.3)shake=0;
  flash*=Math.pow(0.9,dt/16.7);
  for(const p of parts){p.vx*=0.96;p.vy=p.vy*0.96+0.28;p.x+=p.vx*dt/16.7;p.y+=p.vy*dt/16.7;p.life-=dt/16.7*0.026;}
  parts=parts.filter(p=>p.life>0);
  for(const p of pops){p.y-=dt/16.7*0.5;p.life-=dt/16.7*0.02;}
  pops=pops.filter(p=>p.life>0);

  if(state!=='play'){ if(state==='over')resultT+=dt/1000; return; }
  if(phase==='roll'){ clock+=dt;
    if(Math.abs(clock-revealT)<9) S.contact();
    if(!decided && clock>revealT+callWin){ decided=true; call=null; resolve('late'); }
    return; }
  if(phase==='result'){ resultT+=dt/1000; if(resultT>1.6) newPlay(); return; }
}

// ---------- render ----------
function drawField(){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#0f5e34');g.addColorStop(0.5,'#12703f');g.addColorStop(1,'#0c4c2b');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  for(let i=0;i<8;i++){ ctx.fillStyle=i%2?'rgba(255,255,255,0.03)':'rgba(0,0,0,0.03)'; ctx.fillRect(0,i*80,W,80); }
  ctx.strokeStyle='rgba(255,255,255,0.35)';ctx.lineWidth=3;ctx.strokeRect(220,90,460,380);
  // penalty spot
  ctx.fillStyle='rgba(255,255,255,0.6)';ctx.beginPath();ctx.arc(450,440,4,0,6.28);ctx.fill();
}

function defender(revealed){
  const x=DEF.x,y=DEF.y;
  // legs
  ctx.fillStyle='#2b6fd6';ctx.beginPath();ctx.ellipse(x,y+20,16,14,0,0,6.28);ctx.fill();
  // torso
  ctx.beginPath();ctx.arc(x,y-8,17,0,6.28);ctx.fill();
  // head
  ctx.fillStyle='#f0c9a0';ctx.beginPath();ctx.arc(x,y-34,11,0,6.28);ctx.fill();
  // arms — position depends on kind (revealed)
  ctx.strokeStyle='#2b6fd6';ctx.lineWidth=8;ctx.lineCap='round';
  if(revealed && kind==='pk'){
    // spread wide (unnatural)
    ctx.beginPath();ctx.moveTo(x-8,y-12);ctx.lineTo(x-52,y-30);ctx.moveTo(x+8,y-12);ctx.lineTo(x+52,y-30);ctx.stroke();
  } else if(revealed){
    // tucked / natural (down along body)
    ctx.beginPath();ctx.moveTo(x-10,y-12);ctx.lineTo(x-16,y+18);ctx.moveTo(x+10,y-12);ctx.lineTo(x+16,y+18);ctx.stroke();
  } else {
    // pre-reveal: neutral slightly raised
    ctx.beginPath();ctx.moveTo(x-9,y-12);ctx.lineTo(x-30,y-2);ctx.moveTo(x+9,y-12);ctx.lineTo(x+30,y-2);ctx.stroke();
  }
  ctx.lineCap='butt';
}

function render(){
  ctx.save();
  if(shake>0)ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
  drawField();

  if(state==='play'||state==='over'){
    const revealed=(phase==='roll'&&clock>=revealT)||phase==='result';
    // shooter
    ctx.fillStyle='#d0403a';ctx.beginPath();ctx.ellipse(SHOT.x,SHOT.y,11,15,0,0,6.28);ctx.fill();
    ctx.fillStyle='#f0c9a0';ctx.beginPath();ctx.arc(SHOT.x,SHOT.y-22,8,0,6.28);ctx.fill();

    // ball path from shooter to contact point
    const u=clamp(clock/revealT,0,1);
    // contact point depends on sub: arm (pk) / body/leg (body,close) / natural arm (natural)
    let cpx=DEF.x, cpy=DEF.y-20;
    if(kind==='pk'){ cpx=DEF.x-46; cpy=DEF.y-28; }
    else if(sub==='body'){ cpx=DEF.x+4; cpy=DEF.y+14; }
    else if(sub==='close'){ cpx=DEF.x-2; cpy=DEF.y-6; }
    else { cpx=DEF.x-14; cpy=DEF.y+14; }
    const bx=lerp(SHOT.x,cpx,easeOut(u)), by=lerp(SHOT.y,cpy,easeOut(u));

    // defender
    defender(revealed);

    // ball
    ctx.fillStyle='rgba(0,0,0,0.18)';ctx.beginPath();ctx.ellipse(bx,by+12,9,3,0,0,6.28);ctx.fill();
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(bx,by,9,0,6.28);ctx.fill();
    ctx.strokeStyle='#222';ctx.lineWidth=1.3;
    ctx.beginPath();ctx.moveTo(bx-6,by-4);ctx.lineTo(bx+2,by-9);ctx.lineTo(bx+7,by-2);ctx.lineTo(bx+3,by+6);ctx.lineTo(bx-6,by+5);ctx.closePath();ctx.stroke();

    // reveal cue
    if(revealed){
      let txt,col;
      if(kind==='pk'){ txt='腕を広げて体を大きく（不自然）'; col='rgba(255,150,140,0.98)'; }
      else if(sub==='natural'){ txt='腕は体に沿った自然な位置'; col='rgba(150,255,170,0.95)'; }
      else if(sub==='body'){ txt='先に体（腿）に当たってから'; col='rgba(150,255,170,0.95)'; }
      else { txt='至近距離＝反応不可能'; col='rgba(150,255,170,0.95)'; }
      ctx.fillStyle=col;ctx.font='bold 15px sans-serif';ctx.textAlign='center';ctx.fillText(txt,DEF.x,DEF.y-58);
      // contact flash
      ctx.strokeStyle='rgba(255,240,120,0.9)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(cpx,cpy,16,0,6.28);ctx.stroke();
    }

    // cue banner + timer
    ctx.textAlign='center';
    if(state==='play'&&phase==='roll'){
      if(clock<revealT){ ctx.fillStyle='rgba(255,220,90,0.95)';ctx.font='bold 20px sans-serif';ctx.fillText('ボックス内で守備者に当たった！ ハンドか見極めろ',W/2,52); }
      else { ctx.fillStyle='rgba(255,220,120,0.98)';ctx.font='bold 22px sans-serif';ctx.fillText('判定！ ハンドか？',W/2,52);
        const p=clamp((clock-revealT)/callWin,0,1),bw=250,x=W/2-bw/2,y=64;
        ctx.fillStyle='rgba(255,255,255,0.18)';ctx.fillRect(x,y,bw,7);ctx.fillStyle=p<0.7?'#8affa0':(p<1?'#ffd24d':'#ff5b5b');ctx.fillRect(x,y,bw*p,7); }
    }

    if(state==='play'){
      for(const b of BTN){ const active=phase==='roll'&&clock>=revealT;
        ctx.fillStyle=active?b.col:'rgba(255,255,255,0.10)';rr(b.x,BY,BW,BH,10);ctx.fill();
        ctx.fillStyle=active?'#08130c':'rgba(255,255,255,0.5)';ctx.textAlign='center';ctx.font='bold 19px sans-serif';ctx.fillText(b.label,b.x+BW/2,BY+27);
        ctx.font='11px sans-serif';ctx.fillText(b.sub,b.x+BW/2,BY+47); }
      ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='12px sans-serif';ctx.textAlign='center';ctx.fillText('タップ / ↑=ハンド(PK) ・ ↓=ノーハンド',W/2,BY+BH+18);
    }
  }

  for(const p of parts){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,3.2,0,6.28);ctx.fill();}
  ctx.globalAlpha=1;
  for(const p of pops){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.font='bold 21px sans-serif';ctx.textAlign='center';ctx.fillText(p.txt,p.x,p.y);}
  ctx.globalAlpha=1;

  // HUD
  ctx.textAlign='left';ctx.fillStyle='#fff';ctx.font='bold 26px sans-serif';ctx.fillText('SCORE '+score,20,36);
  ctx.textAlign='right';ctx.fillStyle='rgba(255,255,255,0.9)';ctx.font='14px sans-serif';ctx.fillText('好判定 '+outs+'  Lv'+lvl,W-20,24);
  ctx.fillText('誤審',W-92,46);
  for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(W-60+i*20,41,7,0,6.28);ctx.fillStyle=i<fails?'#ff5b5b':'rgba(255,255,255,0.25)';ctx.fill();}
  if(combo>=2){ctx.textAlign='center';ctx.fillStyle='#ffd24d';ctx.font='bold 18px sans-serif';ctx.fillText('コンボ x'+combo,W/2,110);}

  if(state==='play'&&phase==='result'&&msg){ctx.textAlign='center';ctx.fillStyle=msgOk?'#9ff0b8':'#ff9a9a';ctx.font='bold 16px sans-serif';ctx.fillText(msg,W/2,468);}

  if(state==='title'){
    ctx.fillStyle='rgba(4,10,7,0.82)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='bold 40px sans-serif';ctx.fillText('ハンドボール？',W/2,90);
    ctx.fillStyle='#ffd23e';ctx.font='bold 22px sans-serif';ctx.fillText('Handball?',W/2,126);
    ctx.fillStyle='rgba(255,255,255,0.92)';ctx.font='16px sans-serif';
    ctx.fillText('ペナルティエリア内で守備者に当たった打球。ハンド（PK）か否かを主審／VARとして見極めろ',W/2,182);
    ctx.fillStyle='rgba(255,255,255,0.66)';ctx.font='14px sans-serif';
    ctx.fillText('腕を広げて“体を大きく見せた”不自然な位置での手＝ハンドでPK（↑/画面ボタン）',W/2,220);
    ctx.fillText('腕が体に沿った自然な位置／先に体（腿）に当たって／至近距離で反応不可能＝ノーハンド（↓）',W/2,244);
    ctx.fillText('当たった瞬間（合図）の前の判定＝早すぎ、誤審は失格ポイント、際どい判定を当てると大量加点',W/2,268);
    ctx.fillText('上級ほど腕の位置と当たり方が紙一重で猶予も短い。3誤審で交代',W/2,292);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で開始',W/2,360);
    ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='14px sans-serif';ctx.fillText('BEST '+best,W/2,392);
  }
  if(state==='over'){
    ctx.fillStyle='rgba(4,10,7,0.84)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#ff6b6b';ctx.font='bold 46px sans-serif';ctx.fillText('3誤審…主審交代',W/2,222);
    ctx.fillStyle='#fff';ctx.font='bold 40px sans-serif';ctx.fillText('SCORE '+score,W/2,290);
    ctx.fillStyle='rgba(255,255,255,0.85)';ctx.font='19px sans-serif';ctx.fillText('好判定 '+outs+'   BEST '+best,W/2,330);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で もう一度',W/2,402);
  }

  if(flash>0.02){ctx.globalAlpha=flash*0.5;ctx.fillStyle=flashCol;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}
  ctx.restore();

  ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,0.4)';ctx.font='12px sans-serif';
  ctx.fillText('ハンドボール？：腕を広げた不自然な位置での手はPK、体に沿った自然な位置/体に当たってから/至近距離はノーハンド。早判定/誤審は失敗、3つで交代',W/2,H-8);
}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

function frame(ts){let dt=ts-last;last=ts;if(dt>60)dt=60;if(dt<0)dt=0;update(dt);render();requestAnimationFrame(frame);}
requestAnimationFrame(frame);

// ---------- test hook ----------
window.__hb={
  start, makeCall:(c)=>makeCall(c),
  get state(){return state;},
  get score(){return score;},
  get outs(){return outs;},
  get fails(){return fails;},
  get info(){return {state,phase,clock,revealT,callWin,kind,sub,tough,decided,call,result,outs,fails,lvl,
    revealed:(clock>=revealT),canAct:(phase==='roll'&&!decided)};}
};
})();
</script>
</body>
</html>
