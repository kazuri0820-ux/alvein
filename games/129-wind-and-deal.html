<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>完全投球 (Wind & Deal)</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;background:#0a1018;overflow:hidden;font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",system-ui,sans-serif}
  #wrap{width:100%;height:100%;display:flex;align-items:center;justify-content:center}
  #stage{position:relative;width:min(100vw,calc(100vh*1.5));aspect-ratio:900/600;max-width:900px;
    box-shadow:0 10px 60px rgba(0,0,0,.6);border-radius:10px;overflow:hidden;touch-action:none}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
  #hint{position:absolute;left:0;bottom:6px;width:100%;text-align:center;color:#cfe;
    font-size:12px;opacity:.55;pointer-events:none;text-shadow:0 1px 3px #000}
</style>
</head>
<body>
<div id="wrap"><div id="stage">
  <canvas id="cv"></canvas>
  <div id="hint">1度目のクリック/SPACEで球威を決め、2度目でリリース（緑で制球）。狙いはミット＝隅を突け！ 真ん中は痛打</div>
</div></div>
<script>
(()=>{
const cv=document.getElementById('cv'), g=cv.getContext('2d');
const W=900,H=600;
let DPR=1;
function fit(){ DPR=Math.min(2,window.devicePixelRatio||1); cv.width=W*DPR; cv.height=H*DPR; g.setTransform(DPR,0,0,DPR,0,0); }
fit(); addEventListener('resize',fit);

// ---------- audio ----------
let AC=null;
function ac(){ if(!AC){ try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){} } return AC; }
function tone(f,d,t,v,sweep){ const a=ac(); if(!a)return; const o=a.createOscillator(),gg=a.createGain();
  o.type=t||'sine'; o.frequency.value=f; if(sweep) o.frequency.exponentialRampToValueAtTime(Math.max(20,sweep),a.currentTime+d);
  gg.gain.setValueAtTime(0.0001,a.currentTime); gg.gain.exponentialRampToValueAtTime(v||0.2,a.currentTime+0.012);
  gg.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+d); o.connect(gg).connect(a.destination);
  o.start(); o.stop(a.currentTime+d+0.02); }
function noise(d,v,hp){ const a=ac(); if(!a)return; const n=a.createBuffer(1,a.sampleRate*d,a.sampleRate); const ch=n.getChannelData(0);
  for(let i=0;i<ch.length;i++) ch[i]=(Math.random()*2-1)*(1-i/ch.length);
  const s=a.createBufferSource(); s.buffer=n; const f=a.createBiquadFilter(); f.type='highpass'; f.frequency.value=hp||600;
  const gg=a.createGain(); gg.gain.value=v||0.15; s.connect(f).connect(gg).connect(a.destination); s.start(); }
const S={
  lock(){ tone(300,0.06,'square',0.08,520); },
  release(){ tone(560,0.06,'triangle',0.08,900); },
  pop(){ noise(0.05,0.14,1200); tone(400,0.05,'square',0.08,700); },   // catcher's mitt pop
  strike(){ tone(660,0.08,'triangle',0.1,980); },
  paint(){ tone(660,0.06,'square',0.12,980); setTimeout(()=>tone(990,0.07,'square',0.1,1400),55); setTimeout(()=>tone(1320,0.1,'triangle',0.1,1760),120); },
  k(){ tone(720,0.09,'square',0.12,1080); setTimeout(()=>tone(1080,0.14,'square',0.12,1500),90); },
  ball(){ tone(320,0.12,'sine',0.08,240); },
  crush(){ noise(0.06,0.2,900); tone(200,0.14,'sawtooth',0.14,80); },
  over(){ tone(300,0.5,'sawtooth',0.16,90); setTimeout(()=>tone(200,0.6,'sawtooth',0.14,60),160); },
};

// ---------- geometry ----------
const ZX=450, ZY=308, ZW=200, ZH=244;
const ZL=ZX-ZW/2, ZR=ZX+ZW/2, ZT=ZY-ZH/2, ZB=ZY+ZH/2;
const HW=ZW*0.30, HH=ZH*0.30;  // heart (middle) half-sizes
const MOUNDY=118;
// target spots: corners + edges (never center)
const SPOTS=[
  {x:ZL+22,y:ZT+22},{x:ZR-22,y:ZT+22},{x:ZL+22,y:ZB-22},{x:ZR-22,y:ZB-22},
  {x:ZX,y:ZT+18},{x:ZX,y:ZB-18},{x:ZL+18,y:ZY},{x:ZR-18,y:ZY},
];

// ---------- state ----------
let state='title';
let parts=[], pops=[];
let score, runs, ks, combo, best, lvl;
let strikes, balls;
let p=null;
let flash=0, shakeT=0, zoom=0;
try{ best=+localStorage.getItem('wd_best')||0; }catch(e){ best=0; }

const crowd=[]; { const cc=['#e6b48f','#9bd0e6','#e6dc8f','#c9a0d8','#8fd8bd','#f0f0f0']; for(let i=0;i<230;i++) crowd.push({x:(i*33.1)%W, y:2+((i*57)%26), c:cc[i%cc.length]}); }

function clamp(v,a,b){ return v<a?a:v>b?b:v; }
function reset(){ parts=[]; pops=[]; score=0; runs=0; ks=0; combo=0; lvl=0; strikes=0; balls=0; flash=0; shakeT=0; zoom=0; nextPitch(); }
function nextPitch(){
  lvl=Math.min(7,Math.floor(ks/2));
  const t=SPOTS[Math.floor(Math.random()*SPOTS.length)];
  p={ phase:'power', t:0, pdir:1, power:0, lockedPower:0,
      acc:0, adir:1, accGreen:0.10-Math.min(0.045,lvl*0.006),
      target:{x:t.x+(Math.random()-0.5)*10, y:t.y+(Math.random()-0.5)*10},
      landing:null, res:null, resT:0, applied:false, flightT:0,
      powerSpeed:0.0016+lvl*0.00012 };
}
function accSpeed(){ return 0.0018 + p.lockedPower*0.0016 + lvl*0.00016; }
function inZone(x,y){ return x>=ZL&&x<=ZR&&y>=ZT&&y<=ZB; }
function inHeart(x,y){ return Math.abs(x-ZX)<HW && Math.abs(y-ZY)<HH; }

// ---------- action ----------
function click(){
  if(state!=='play'||!p) return;
  if(p.phase==='power'){ p.lockedPower=p.power; p.phase='acc'; p.acc=0; p.adir=1; S.lock(); }
  else if(p.phase==='acc'){ doRelease(); }
}
function doRelease(){
  if(p.phase!=='acc') return;
  // accuracy quality: how close acc is to the green center (0.5)
  const q=clamp(1 - Math.abs(p.acc-0.5)/0.5, 0, 1);   // 1=perfect
  const err=(1-q)*(96);   // px error
  const ang=Math.random()*6.28;
  p.quality=q;
  p.landing={ x:clamp(p.target.x+Math.cos(ang)*err, ZL-70, ZR+70), y:clamp(p.target.y+Math.sin(ang)*err, ZT-70, ZB+70) };
  p.phase='flight'; p.flightT=0; S.release();
}
function resolvePitch(){
  const L=p.landing; const z=inZone(L.x,L.y), heart=inHeart(L.x,L.y);
  let res;
  if(heart) res='hit';
  else if(z) res = (p.quality>0.86)?'paint':'strike';
  else res='ball';
  p.res=res;
  applyCount(res);
  p.pending=true;   // always advance to the next pitch after resolve
}
function applyCount(res){
  if(res==='strike'||res==='paint'){
    strikes++; S[res==='paint'?'paint':'strike'](); S.pop();
    const base=res==='paint'?55:32;
    const gained=Math.round((base + p.lockedPower*40)*(1+combo*0.06)); score+=gained;
    pops.push({txt:(res==='paint'?'ズバッと制球！ +':'ストライク +')+gained, x:p.landing.x, y:p.landing.y-24, life:0.9, c:res==='paint'?'#7fd8ff':'#8fffb0', big:res==='paint'});
    burst(p.landing.x,p.landing.y,res==='paint'?'#7fd8ff':'#8fffb0',res==='paint'?14:8);
    flash=Math.max(flash,res==='paint'?0.34:0.2);
    if(strikes>=3) strikeout();
  } else if(res==='ball'){
    balls++; S.ball();
    pops.push({txt:'ボール', x:p.landing.x, y:p.landing.y-20, life:0.8, c:'#ffd76a'});
    if(balls>=4) walk();
  } else { // hit (meatball to the heart)
    S.crush(); shakeT=0.34; flash=Math.max(flash,0.4);
    pops.push({txt:'甘い！ 痛打を浴びた', big:true, x:W/2, y:200, life:1.1, c:'#ff6a6a'});
    burst(ZX,ZY,'#ff6a6a',18);
    concede();
  }
}
function strikeout(){ ks++; combo++; const g2=Math.round(120*(1+combo*0.08)); score+=g2;
  pops.push({txt:'三振！ +'+g2, big:true, x:W/2, y:150, life:1.2, c:'#ffe15a'}); zoom=1; flash=Math.max(flash,0.4); S.k();
  for(let i=0;i<24;i++) parts.push({x:W/2,y:180,vx:(Math.random()-0.5)*8,vy:Math.random()*-6-1,life:1.3,c:['#ffe15a','#7dff9b','#7fd8ff'][i%3]});
  newBatter(); }
function walk(){ combo=0; pops.push({txt:'四球…走者を出した', big:true, x:W/2, y:200, life:1.1, c:'#ff6a6a'}); concede(); }
function concede(){ runs++; combo=0; if(runs>=3){ p.res='over'; } newBatter(); }
function newBatter(){ strikes=0; balls=0; p.pending=true; }
function gameOver(){ state='over'; S.over(); if(score>best){ best=score; try{localStorage.setItem('wd_best',best);}catch(e){} } }
function burst(x,y,c,n){ for(let i=0;i<n;i++) parts.push({x,y,vx:(Math.random()-0.5)*7,vy:(Math.random()-0.5)*7-1,life:1,c}); }

// ---------- input ----------
function start(){ ac(); reset(); state='play'; }
addEventListener('keydown',e=>{ const k=e.key.toLowerCase();
  if(state!=='play'){ if(!e.repeat) start(); return; }
  if((k===' '||k==='enter')&&!e.repeat){ click(); e.preventDefault(); } });
cv.addEventListener('pointerdown',e=>{ ac(); if(state!=='play'){ start(); return; } click(); e.preventDefault(); });

// ---------- update ----------
function update(dt){
  if(flash>0) flash=Math.max(0,flash-dt*0.003);
  if(shakeT>0) shakeT-=dt*0.001;
  if(zoom>0) zoom=Math.max(0,zoom-dt*0.002);
  parts.forEach(q=>{q.x+=q.vx;q.y+=q.vy;q.vy+=0.14;q.life-=dt*0.0022;});
  parts=parts.filter(q=>q.life>0);
  pops.forEach(q=>{q.y-=dt*0.02;q.life-=dt*0.0015;});
  pops=pops.filter(q=>q.life>0);
  if(state!=='play'||!p) return;

  if(p.phase==='power'){
    p.t+=dt; p.power+=p.pdir*p.powerSpeed*dt;
    if(p.power>=1){ p.power=1; p.pdir=-1; } if(p.power<=0){ p.power=0; p.pdir=1; }
    if(p.t>=1600){ p.lockedPower=p.power; p.phase='acc'; p.acc=0; p.adir=1; }   // auto-lock if idle
  } else if(p.phase==='acc'){
    p.t2=(p.t2||0)+dt; p.acc+=p.adir*accSpeed()*dt;
    if(p.acc>=1){ p.acc=1; p.adir=-1; } if(p.acc<=0){ p.acc=0; p.adir=1; }
    if(p.t2>=1500){ p.acc=0.06; doRelease(); }   // auto-release if idle -> poor accuracy (wild)
  } else if(p.phase==='flight'){
    p.flightT+=dt;
    if(p.flightT>=360){ p.phase='resolve'; p.resT=0; resolvePitch(); }
  } else if(p.phase==='resolve'){
    p.resT+=dt;
    if(p.resT>=900 && p.pending){ p.pending=false; if(p.res==='over') gameOver(); else nextPitch(); }
  }
}

// ---------- render ----------
function roundRect(x,y,w,h,r){ g.beginPath(); g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r); g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath(); }
function drawZone(){
  const gr=g.createLinearGradient(0,0,0,H); gr.addColorStop(0,'#16324a'); gr.addColorStop(1,'#0f2436'); g.fillStyle=gr; g.fillRect(0,0,W,H);
  g.fillStyle='#0c2036'; g.fillRect(0,0,W,26);
  for(const c of crowd){ g.fillStyle=c.c; g.globalAlpha=0.55; g.fillRect(c.x,c.y,3,3); } g.globalAlpha=1;
  g.fillStyle='#3a2a1c'; g.beginPath(); g.moveTo(0,H); g.lineTo(W,H); g.lineTo(W,H-80); g.lineTo(0,H-64); g.closePath(); g.fill();
  g.fillStyle='#eee'; g.beginPath(); g.moveTo(ZX-40,H-52); g.lineTo(ZX+40,H-52); g.lineTo(ZX+30,H-40); g.lineTo(ZX,H-32); g.lineTo(ZX-30,H-40); g.closePath(); g.fill();
  // zone grid
  g.strokeStyle='rgba(255,255,255,0.35)'; g.lineWidth=2; g.strokeRect(ZL,ZT,ZW,ZH);
  g.beginPath(); for(let i=1;i<3;i++){ g.moveTo(ZL+ZW/3*i,ZT); g.lineTo(ZL+ZW/3*i,ZB); g.moveTo(ZL,ZT+ZH/3*i); g.lineTo(ZR,ZT+ZH/3*i);} g.stroke();
  // heart warning
  g.strokeStyle='rgba(255,90,90,0.25)'; g.setLineDash([4,4]); g.strokeRect(ZX-HW,ZY-HH,HW*2,HH*2); g.setLineDash([]);
}
function drawScene(){
  if(!p) return;
  // catcher mitt = target
  if(p.phase==='power'||p.phase==='acc'){
    g.strokeStyle='#ffe15a'; g.lineWidth=3; g.beginPath(); g.arc(p.target.x,p.target.y,16,0,6.28); g.stroke();
    g.strokeStyle='rgba(255,225,90,0.5)'; g.lineWidth=1.5; g.beginPath(); g.moveTo(p.target.x-22,p.target.y); g.lineTo(p.target.x+22,p.target.y); g.moveTo(p.target.x,p.target.y-22); g.lineTo(p.target.x,p.target.y+22); g.stroke();
    g.fillStyle='#c98b2a'; g.beginPath(); g.arc(p.target.x,p.target.y,7,0,6.28); g.fill();
  }
  // pitcher
  g.fillStyle='rgba(255,255,255,0.08)'; g.beginPath(); g.ellipse(ZX,MOUNDY,54,34,0,0,6.28); g.fill();
  // ball
  let bx=ZX, by=MOUNDY, br=6;
  if(p.phase==='flight'){ const q=Math.min(1,p.flightT/360); bx=ZX+(p.landing.x-ZX)*q; by=MOUNDY+(p.landing.y-MOUNDY)*q; br=6+q*4; }
  else if(p.phase==='resolve'){ bx=p.landing.x; by=p.landing.y; br=9; }
  if(p.phase==='flight'||p.phase==='resolve'){ g.fillStyle='#fff'; g.beginPath(); g.arc(bx,by,br,0,6.28); g.fill(); g.strokeStyle='#c33'; g.lineWidth=1.3; g.stroke(); }

  // meters
  g.textAlign='center';
  if(p.phase==='power'){
    // vertical power meter (left)
    const mx=120, my=180, mh=260;
    g.fillStyle='rgba(0,0,0,0.4)'; roundRect(mx-16,my,32,mh,8); g.fill();
    g.fillStyle='#ff8a3a'; roundRect(mx-13,my+mh-mh*p.power,26,mh*p.power,6); g.fill();
    g.fillStyle='#fff'; g.font='bold 15px sans-serif'; g.fillText('球威',mx,my-12); g.fillText(Math.round(p.power*100),mx,my+mh+22);
    g.fillStyle='#ffd76a'; g.font='bold 22px sans-serif'; g.fillText('① 球威を決めろ！（クリック）',W/2,90);
  } else if(p.phase==='acc'){
    // horizontal accuracy meter (bottom)
    const bx2=W/2-160, by2=H-96, bw=320;
    g.fillStyle='rgba(0,0,0,0.4)'; roundRect(bx2,by2,bw,16,8); g.fill();
    const gl=(0.5-p.accGreen), gw=p.accGreen*2;
    g.fillStyle='rgba(120,230,140,0.6)'; roundRect(bx2+bw*gl,by2,bw*gw,16,6); g.fill();
    g.fillStyle='#fff'; g.fillRect(bx2+bw*p.acc-2,by2-4,4,24);
    g.fillStyle='#8fffb0'; g.font='bold 22px sans-serif'; g.fillText('② リリース！ 緑でズバッと制球',W/2,90);
    g.fillStyle='#cfe'; g.font='bold 14px sans-serif'; g.fillText('球威 '+Math.round(p.lockedPower*100),W/2,H-64);
  }
  // count
  g.textAlign='left'; g.font='bold 16px sans-serif';
  g.fillStyle='#cfe'; g.fillText('B',30,H-58); for(let i=0;i<3;i++){ g.fillStyle=i<balls?'#7fd8ff':'rgba(255,255,255,0.25)'; g.beginPath(); g.arc(52+i*20,H-63,7,0,6.28); g.fill(); }
  g.fillStyle='#cfe'; g.fillText('S',30,H-34); for(let i=0;i<2;i++){ g.fillStyle=i<strikes?'#ffe15a':'rgba(255,255,255,0.25)'; g.beginPath(); g.arc(52+i*20,H-39,7,0,6.28); g.fill(); }
}
function render(){
  g.clearRect(0,0,W,H);
  g.save();
  if(zoom>0){ const z=1+zoom*0.05; g.translate(ZX,ZY); g.scale(z,z); g.translate(-ZX,-ZY); }
  if(shakeT>0){ const s=shakeT*13; g.translate((Math.random()-0.5)*s,(Math.random()-0.5)*s); }
  drawZone();
  if(state==='play') drawScene();
  for(const q of parts){ g.globalAlpha=Math.max(0,q.life); g.fillStyle=q.c; g.fillRect(q.x-2,q.y-2,4,4); }
  g.globalAlpha=1;
  g.restore();

  if(state==='play') drawHUD();
  for(const q of pops){ g.globalAlpha=Math.max(0,q.life); g.textAlign='center';
    const fs=q.big?30:19; g.font='bold '+fs+'px sans-serif'; g.fillStyle=q.c; g.strokeStyle='#000'; g.lineWidth=4;
    g.strokeText(q.txt,q.x,q.y); g.fillText(q.txt,q.x,q.y); }
  g.globalAlpha=1;
  if(flash>0){ g.fillStyle='rgba(255,255,255,'+(flash*0.5)+')'; g.fillRect(0,0,W,H); }
  if(state==='title') drawTitle();
  if(state==='over') drawOver();
}
function drawHUD(){
  g.textAlign='left'; g.font='bold 26px sans-serif'; g.fillStyle='#fff'; g.strokeStyle='rgba(0,0,0,0.5)'; g.lineWidth=4;
  g.strokeText('SCORE '+score,20,40); g.fillText('SCORE '+score,20,40);
  g.font='bold 15px sans-serif'; g.fillStyle='#cfe'; g.fillText('奪三振 '+ks,22,62);
  if(combo>1){ g.textAlign='center'; g.font='bold 18px sans-serif'; g.fillStyle='#ffe15a'; g.fillText(combo+' 連続K',W/2,40); }
  g.textAlign='right'; g.font='bold 16px sans-serif'; g.fillStyle='#fff'; g.strokeText('失点',W-104,40); g.fillText('失点',W-104,40);
  for(let i=0;i<3;i++){ g.fillStyle=i<runs?'#ff5a5a':'rgba(255,255,255,0.28)'; g.beginPath(); g.arc(W-78+i*24,34,8,0,6.28); g.fill(); }
}
function drawTitle(){
  g.fillStyle='rgba(4,10,16,0.72)'; g.fillRect(0,0,W,H); g.textAlign='center';
  g.fillStyle='#8fffb0'; g.font='bold 52px sans-serif'; g.fillText('完全投球',W/2,H/2-104);
  g.fillStyle='#cfe'; g.font='20px sans-serif'; g.fillText('Wind & Deal — 2段階のタイミングで隅を突け',W/2,H/2-66);
  g.font='17px sans-serif'; g.fillStyle='#bcd';
  g.fillText('①クリック/SPACEで球威メーターを止める（高いほど高得点・でも②が速い）。',W/2,H/2-28);
  g.fillText('②もう一度クリックでリリース。緑ゾーンで止めるほど制球が正確に。',W/2,H/2-4);
  g.fillText('ミット（隅）に決めればストライク、ドンピシャは制球ボーナス。',W/2,H/2+20);
  g.fillText('真ん中に甘く入ると痛打、4ボールで四球。3失点で終了。',W/2,H/2+44);
  g.fillStyle='#ffe15a'; g.font='bold 24px sans-serif'; g.fillText('クリック / タップ / キー で スタート',W/2,H/2+96);
  if(best>0){ g.fillStyle='#9fd'; g.font='16px sans-serif'; g.fillText('BEST '+best,W/2,H/2+126); }
}
function drawOver(){
  g.fillStyle='rgba(4,10,16,0.8)'; g.fillRect(0,0,W,H); g.textAlign='center';
  g.fillStyle='#ff6a6a'; g.font='bold 50px sans-serif'; g.fillText('3失点…降板',W/2,H/2-60);
  g.fillStyle='#fff'; g.font='bold 34px sans-serif'; g.fillText('SCORE '+score,W/2,H/2);
  g.fillStyle='#cfe'; g.font='18px sans-serif'; g.fillText('奪三振 '+ks,W/2,H/2+32);
  const nb=score>0&&score>=best; g.fillStyle=nb?'#ffe15a':'#9fd'; g.font='18px sans-serif';
  g.fillText(nb?'🎉 ベスト更新！ BEST '+best:'BEST '+best,W/2,H/2+62);
  g.fillStyle='#8fffb0'; g.font='bold 22px sans-serif'; g.fillText('クリック / タップ で もう一度',W/2,H/2+112);
}

let last=0;
function frame(t){ let dt=t-last; last=t; if(dt>60)dt=60; if(dt<0)dt=0; update(dt); render(); requestAnimationFrame(frame); }
requestAnimationFrame(frame);

// ---------- test hook ----------
window.__wd={
  start, click,
  get state(){return state;}, get score(){return score;}, get runs(){return runs;}, get ks(){return ks;},
  get info(){ if(state!=='play'||!p) return {state,phase:'-'}; return {
    state, phase:p.phase, power:p.power, acc:p.acc, accGreen:p.accGreen, lockedPower:p.lockedPower,
    res:p.res, strikes, balls, runs }; }
};
})();
</script>
</body>
</html>
