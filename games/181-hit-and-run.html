<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>エンドラン (Hit and Run)</title>
<style>
  html,body{margin:0;height:100%;background:#0a1018;overflow:hidden;
    font-family:-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  #stage{position:relative;width:100vw;height:100vh;max-width:calc(100vh*1.5);max-height:calc(100vw/1.5);aspect-ratio:900/600;}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;border-radius:6px;}
</style>
</head>
<body>
<div id="wrap"><div id="stage"><canvas id="cv"></canvas></div></div>
<script>
(function(){
const W=900,H=600,cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let DPR=1;
function fit(){DPR=Math.min(2,window.devicePixelRatio||1);cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
fit();addEventListener('resize',fit);

// ---------- audio ----------
let AC=null;function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function tone(f,d,type,v,sweep){const a=ac();if(!a)return;const t=a.currentTime,o=a.createOscillator(),g=a.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(sweep)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+sweep),t+d);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v||0.2,t+0.008);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+0.02);}
function noise(d,v,hp){const a=ac();if(!a)return;const t=a.currentTime,n=Math.floor(a.sampleRate*d),buf=a.createBuffer(1,n,a.sampleRate),ch=buf.getChannelData(0);
  for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource();s.buffer=buf;
  const f=a.createBiquadFilter();f.type='highpass';f.frequency.value=hp||600;const g=a.createGain();g.gain.value=v||0.2;
  s.connect(f);f.connect(g);g.connect(a.destination);s.start(t);s.stop(t+d+0.02);}
const S={
  hit:()=>{noise(0.05,0.3,1100);tone(240,0.14,'square',0.18,300);setTimeout(()=>tone(520,0.12,'triangle',0.14),40);},
  great:()=>{noise(0.05,0.26,1200);[520,760,1040,1400].forEach((f,i)=>setTimeout(()=>tone(f,0.12,'triangle',0.2),i*60));},
  outp:()=>{tone(300,0.18,'sawtooth',0.16,-120);noise(0.1,0.12,300);},
  whiff:()=>{noise(0.14,0.18,500);tone(200,0.16,'sawtooth',0.12,-70);},
  dp:()=>{tone(240,0.3,'sawtooth',0.2,-120);setTimeout(()=>tone(170,0.28,'sawtooth',0.16,-70),120);},
  pitch:()=>{noise(0.04,0.07,1400);},
  over:()=>{[440,330,247,175].forEach((f,i)=>setTimeout(()=>tone(f,0.3,'triangle',0.2),i*160));}
};

// ---------- geometry ----------
const HP={x:450,y:512};
const B1={x:648,y:352}, B2={x:450,y:210}, B3={x:252,y:352};
const SS0={x:352,y:300}, TB0={x:548,y:300}; // shortstop / 2nd-baseman resting
const REL={x:450,y:120};

// ---------- state ----------
let state='title', phase='pitch', t=0, plays=0;
let score=0, combo=0, best=+(localStorage.getItem('hitrun_best')||0);
let hits=0, outs=0, lvl=1;
let P=null, result=null, resultT=0, msg='', msg2='';
let ball={x:REL.x,y:REL.y}, batAng=0.7, runner={p:0}, coverT=0;
let shake=0, flash=0, flashCol='#fff', last=performance.now();
let parts=[], pops=[], hitBall=null;

function rnd(a,b){return a+Math.random()*(b-a);}
function chance(p){return Math.random()<p;}
function clamp(v,a,b){return v<a?a:v>b?b:v;}

function reset(){state='title';score=0;combo=0;hits=0;outs=0;lvl=1;plays=0;P=null;result=null;parts=[];pops=[];hitBall=null;}

function newPlay(){
  plays++;
  lvl=Math.min(6,1+Math.floor(plays/3));
  const open=chance(0.5)?'L':'R';      // which hole opens (which fielder vacates to cover)
  const dur=Math.max(720,1150-lvl*74);
  const coverStart=0.35 - Math.min(0.2,lvl*0.03); // coverage shown later at high level
  const feint = lvl>=4 && chance(0.3);
  P={open,dur,t:0,swung:false,swingP:-1,swingDir:null,coverStart,feint,feintDone:false};
  ball={x:REL.x,y:REL.y}; batAng=0.7; runner={p:0}; coverT=0;
  result=null; hitBall=null; phase='pitch'; t=0;
  msg='走者スタート！ 空いた穴へ'; msg2='カバーに入った逆の穴を狙え';
  S.pitch();
}

function start(){ if(!ac())ac(); if(AC&&AC.state==='suspended')AC.resume(); reset(); state='play'; newPlay(); }

// cover fielder position: interpolate the vacating fielder toward 2B
function ssPos(){ // shortstop: covers 2B if open==='R' means TB vacates... define: open=hole side.
  // open 'L' => SS vacates (moves to 2B), hole on left. open 'R' => TB vacates, hole on right.
  const cov = clamp((P? (P.t/P.dur - P.coverStart)/0.4 :0),0,1)* (P&&P.open==='L'?1:0);
  return {x:SS0.x+(B2.x-SS0.x)*cov, y:SS0.y+(B2.y-SS0.y)*cov};
}
function tbPos(){
  const cov = clamp((P? (P.t/P.dur - P.coverStart)/0.4 :0),0,1)* (P&&P.open==='R'?1:0);
  return {x:TB0.x+(B2.x-TB0.x)*cov, y:TB0.y+(B2.y-TB0.y)*cov};
}

// ---------- swing ----------
function swing(dir){
  if(state==='title'){start();return;}
  if(state==='over'){ if(resultT>0.5){reset();start();} return; }
  if(state!=='play'||phase!=='pitch'||!P||P.swung) return;
  P.swung=true; P.swingP=P.t/P.dur; P.swingDir=dir;
  batAng=dir==='L'?-1.0:-0.2;
  const good = P.swingP>=0.80 && P.swingP<=1.02;
  const great = P.swingP>=0.90 && P.swingP<=1.0;
  if(!good){ // mistimed contact
    resolveSwing('mistime'); return;
  }
  if(dir===P.open){ resolveSwing(great?'great':'hit'); }
  else { resolveSwing('caught'); }
}

function resolveSwing(kind){
  phase='hitresolve'; P.kind=kind;
  // launch a grounder toward the appropriate gap
  let gx,gy;
  if(kind==='hit'||kind==='great'){ gx = P.open==='R'? 720: 180; gy= 300; }
  else if(kind==='caught'){ gx = P.swingDir==='R'? TB0.x: SS0.x; gy=300; }
  else { gx=450; gy=430; } // mistime dribbler
  hitBall={x:HP.x,y:HP.y-6,tx:gx,ty:gy,tp:0,kind};
  P.rt=0;
}

function applyResult(kind){
  result=kind; resultT=0; phase='resolve';
  if(kind==='hit'||kind==='great'){
    combo++; const mult=1+Math.min(6,combo-1)*0.24; const base=kind==='great'?170:110; const add=Math.round(base*mult);
    score+=add; hits++;
    if(kind==='great')S.great(); else S.hit();
    flash=1;flashCol=kind==='great'?'#ffe08a':'#8ff0b8'; shake=kind==='great'?13:8;
    burst(hitBall.tx,hitBall.ty,kind==='great'?'#ffe08a':'#bfffd0',kind==='great'?28:18,7);
    pop(hitBall.tx,hitBall.ty-24,(kind==='great'?'完璧なエンドラン！ ':'ヒット！ ')+'+'+add,'#eaffef');
    if(combo>=2)pop(hitBall.tx,hitBall.ty-48,'コンボ x'+combo,'#ffe08a');
    msg=kind==='great'?'完璧！ 空いた穴を破って走者は三塁へ':'ヒット＆ラン成功！ 穴を破った'; msg2='';
  } else {
    combo=0; outs++;
    if(kind==='caught'){S.outp();msg='カバーの正面！ 併殺の危機';msg2='空いた“逆”の穴を狙え';}
    else if(kind==='mistime'){S.whiff();msg=P.swingP<0.80?'差し込まれた／打ち損じ':'空振り…走者は憤死';msg2='ミートのタイミングを合わせろ';}
    else {S.dp();msg='打ち取られた';msg2='';}
    flash=1;flashCol='#ff6b6b';shake=10;
    if(hitBall)burst(hitBall.tx,hitBall.ty,'#ff8a8a',15,5);
  }
}

// ---------- input ----------
cv.addEventListener('pointerdown',e=>{
  e.preventDefault();
  if(state==='title'||state==='over'){swing('L');return;}
  const r=cv.getBoundingClientRect(); const x=((e.clientX-r.left)/r.width)*W;
  swing(x<W/2?'L':'R');
});
addEventListener('keydown',e=>{
  if(e.code==='ArrowLeft'){e.preventDefault();swing('L');}
  else if(e.code==='ArrowRight'){e.preventDefault();swing('R');}
  else if(e.code==='Space'||e.code==='Enter'){e.preventDefault(); if(state!=='play')swing('L');}
});

// ---------- particles ----------
function burst(x,y,c,n,sp){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=rnd(sp*0.3,sp);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:1,c});}}
function pop(x,y,txt,c){pops.push({x,y,txt,c,life:1});}

// ---------- update ----------
function update(dt){
  shake*=Math.pow(0.86,dt/16.7); if(shake<0.3)shake=0;
  flash*=Math.pow(0.9,dt/16.7);
  for(const p of parts){p.vx*=0.96;p.vy=p.vy*0.96+0.3;p.x+=p.vx*dt/16.7;p.y+=p.vy*dt/16.7;p.life-=dt/16.7*0.026;}
  parts=parts.filter(p=>p.life>0);
  for(const p of pops){p.y-=dt/16.7*0.5;p.life-=dt/16.7*0.018;}
  pops=pops.filter(p=>p.life>0);

  if(state!=='play'){ if(state==='over')resultT+=dt/1000; return; }
  t+=dt;

  if(phase==='pitch'){
    P.t+=dt; const p=clamp(P.t/P.dur,0,1);
    ball.x=REL.x+(HP.x-REL.x)*p; ball.y=REL.y+(HP.y-40-REL.y)*p;
    runner.p=clamp((P.t/P.dur)*0.9,0,1);
    if(p>=1 && !P.swung){ // took / no swing -> whiff, runner hung
      P.swung=true; P.swingP=1; resolveSwing('mistime'); }
    return;
  }
  if(phase==='hitresolve'){
    P.rt+=dt; hitBall.tp=clamp(hitBall.tp+dt/360,0,1);
    runner.p=clamp(runner.p+dt/700,0,1.1);
    if(hitBall.tp>=1){ applyResult(P.kind); }
    return;
  }
  if(phase==='resolve'){
    resultT+=dt/1000;
    if(resultT>1.05){
      if(outs>=3){ state='over'; resultT=0; S.over(); if(score>best){best=score;localStorage.setItem('hitrun_best',best);} }
      else newPlay();
    }
    return;
  }
}

// ---------- render ----------
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

function drawScene(){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#1d5233');g.addColorStop(1,'#227a46');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  // infield dirt diamond
  ctx.fillStyle='rgba(150,95,55,0.5)';
  ctx.beginPath();ctx.moveTo(HP.x,HP.y);ctx.lineTo(B1.x,B1.y);ctx.lineTo(B2.x,B2.y);ctx.lineTo(B3.x,B3.y);ctx.closePath();ctx.fill();
  // base lines
  ctx.strokeStyle='rgba(255,255,255,0.5)';ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(HP.x,HP.y);ctx.lineTo(B1.x,B1.y);ctx.lineTo(B2.x,B2.y);ctx.lineTo(B3.x,B3.y);ctx.closePath();ctx.stroke();
  // bases
  function bag(b){ctx.save();ctx.translate(b.x,b.y);ctx.rotate(Math.PI/4);ctx.fillStyle='#f0f0f0';ctx.fillRect(-9,-9,18,18);ctx.restore();}
  bag(B1);bag(B2);bag(B3);
  // home plate
  ctx.fillStyle='#eee';ctx.beginPath();ctx.moveTo(HP.x,HP.y+8);ctx.lineTo(HP.x-13,HP.y);ctx.lineTo(HP.x-13,HP.y-8);ctx.lineTo(HP.x+13,HP.y-8);ctx.lineTo(HP.x+13,HP.y);ctx.closePath();ctx.fill();
}

function drawPlayer(x,y,col,dark,label,sc){
  sc=sc||1;ctx.save();ctx.translate(x,y);ctx.scale(sc,sc);
  ctx.fillStyle='rgba(0,0,0,0.22)';ctx.beginPath();ctx.ellipse(0,15,11,4,0,0,6.28);ctx.fill();
  ctx.fillStyle=col;rr(-8,-6,16,21,6);ctx.fill();
  ctx.fillStyle='#f2c9a0';ctx.beginPath();ctx.arc(0,-13,6.5,0,6.28);ctx.fill();
  ctx.fillStyle=dark;ctx.beginPath();ctx.arc(0,-15,7,Math.PI,0);ctx.fill();
  ctx.restore();
  if(label){ctx.fillStyle='rgba(255,255,255,0.85)';ctx.font='bold 10px sans-serif';ctx.textAlign='center';ctx.fillText(label,x,y+26);}
}

function drawHole(){
  if(state!=='play'||!P||phase!=='pitch')return;
  const p=P.t/P.dur; if(p<P.coverStart)return;
  if(lvl>=4)return; // hint hidden at high level
  const hx = P.open==='R'? 620: 280;
  ctx.strokeStyle='rgba(126,240,176,0.5)';ctx.lineWidth=3;ctx.setLineDash([6,6]);
  ctx.beginPath();ctx.ellipse(hx,320,42,26,0,0,6.28);ctx.stroke();ctx.setLineDash([]);
  ctx.fillStyle='rgba(126,240,176,0.7)';ctx.font='bold 13px sans-serif';ctx.textAlign='center';ctx.fillText('穴',hx,325);
}

function render(){
  ctx.save();
  if(shake>0)ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
  drawScene();
  drawHole();

  // fielders
  const ss=ssPos(), tb=tbPos();
  drawPlayer(ss.x,ss.y,'#c0352e','#7a1712','遊',0.92);
  drawPlayer(tb.x,tb.y,'#c0352e','#7a1712','二',0.92);
  drawPlayer(B1.x+8,B1.y+6,'#c0352e','#7a1712','一',0.88);
  drawPlayer(B3.x-8,B3.y+6,'#c0352e','#7a1712','三',0.88);
  // runner from 1B toward 2B
  if(state==='play'){ const rx=B1.x+(B2.x-B1.x)*runner.p, ry=B1.y+(B2.y-B1.y)*runner.p; drawPlayer(rx,ry,'#2b6cff','#1a3a8a',null,0.95); }
  // batter
  ctx.save();ctx.translate(HP.x+22,HP.y-6);
  drawPlayer(0,0,'#2b6cff','#1a3a8a',null,1.0);
  ctx.strokeStyle='#c8a15a';ctx.lineWidth=6;ctx.lineCap='round';ctx.save();ctx.rotate(batAng);ctx.beginPath();ctx.moveTo(0,-4);ctx.lineTo(0,-40);ctx.stroke();ctx.restore();
  ctx.restore();

  // pitched ball
  if(state==='play'&&phase==='pitch'){ ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(ball.x,ball.y,7,0,6.28);ctx.fill();ctx.strokeStyle='#c33';ctx.lineWidth=1.2;ctx.beginPath();ctx.arc(ball.x,ball.y,7,0.4,2.3);ctx.stroke(); }
  // hit grounder
  if(hitBall){ const x=hitBall.x+(hitBall.tx-hitBall.x)*hitBall.tp, y=hitBall.y+(hitBall.ty-hitBall.y)*hitBall.tp;
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(x,y,6,0,6.28);ctx.fill();ctx.strokeStyle='#333';ctx.lineWidth=1.2;ctx.beginPath();ctx.arc(x,y,6,0,6.28);ctx.stroke(); }

  for(const p of parts){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,3.2,0,6.28);ctx.fill();}
  ctx.globalAlpha=1;
  for(const p of pops){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.font='bold 21px sans-serif';ctx.textAlign='center';ctx.fillText(p.txt,p.x,p.y);}
  ctx.globalAlpha=1;

  // HUD
  ctx.textAlign='left';ctx.fillStyle='#fff';ctx.font='bold 26px sans-serif';ctx.fillText('SCORE '+score,20,36);
  ctx.textAlign='right';ctx.fillStyle='rgba(255,255,255,0.85)';ctx.font='14px sans-serif';ctx.fillText('安打 '+hits+'  Lv.'+lvl,W-20,26);
  ctx.fillText('アウト',W-100,50);
  for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(W-70+i*22,46,7,0,6.28);ctx.fillStyle=i<outs?'#ff5b5b':'rgba(255,255,255,0.25)';ctx.fill();}
  if(combo>=2){ctx.textAlign='left';ctx.fillStyle='#ffe08a';ctx.font='bold 18px sans-serif';ctx.fillText('コンボ x'+combo,20,60);}

  if(state==='play'&&(msg||msg2)){
    ctx.textAlign='center';
    const good=result==='hit'||result==='great';
    ctx.fillStyle=result?(good?'#8ff0b8':'#ff9a9a'):'rgba(255,255,255,0.92)';
    ctx.font='bold 25px sans-serif';ctx.fillText(msg,W/2,H-52);
    if(msg2){ctx.fillStyle='rgba(255,255,255,0.72)';ctx.font='15px sans-serif';ctx.fillText(msg2,W/2,H-28);}
  }

  if(state==='title'){
    ctx.fillStyle='rgba(6,16,10,0.66)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='bold 50px sans-serif';ctx.fillText('エンドラン',W/2,190);
    ctx.fillStyle='#8ff0b8';ctx.font='bold 22px sans-serif';ctx.fillText('Hit and Run',W/2,226);
    ctx.fillStyle='rgba(255,255,255,0.9)';ctx.font='18px sans-serif';
    ctx.fillText('走者スタート！ 中間守備がカバーに入って空いた“穴”を読み',W/2,288);
    ctx.fillText('その方向へタイミングよく打つ（← 左方向 / → 右方向）',W/2,316);
    ctx.fillStyle='rgba(255,255,255,0.66)';ctx.font='15px sans-serif';
    ctx.fillText('カバーの正面へ打つと併殺の危機／ミートがズレると空振りで走者憤死',W/2,358);
    ctx.fillText('ジャストミートで穴を破れば走者は三塁へ＝好機拡大。3アウトで終了',W/2,382);
    ctx.fillStyle='#ffe08a';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で開始',W/2,442);
    ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='14px sans-serif';ctx.fillText('BEST '+best,W/2,474);
  }
  if(state==='over'){
    ctx.fillStyle='rgba(6,16,10,0.74)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#ff6b6b';ctx.font='bold 46px sans-serif';ctx.fillText('3アウト…交代',W/2,230);
    ctx.fillStyle='#fff';ctx.font='bold 40px sans-serif';ctx.fillText('SCORE '+score,W/2,296);
    ctx.fillStyle='rgba(255,255,255,0.85)';ctx.font='20px sans-serif';ctx.fillText('安打 '+hits+'   BEST '+best,W/2,336);
    ctx.fillStyle='#8ff0b8';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で もう一度',W/2,408);
  }

  if(flash>0.02){ctx.globalAlpha=flash*0.5;ctx.fillStyle=flashCol;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}
  ctx.restore();

  ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,0.4)';ctx.font='13px sans-serif';
  ctx.fillText('カバーで空いた穴の方向へ（←左/→右）ジャストミート。正面は併殺、ミスは空振り。3アウトで終了',W/2,H-8);
}

function frame(ts){let dt=ts-last;last=ts;if(dt>60)dt=60;if(dt<0)dt=0;update(dt);render();requestAnimationFrame(frame);}
requestAnimationFrame(frame);

// ---------- test hook ----------
window.__hr={
  start, swing,
  get state(){return state;},
  get score(){return score;},
  get hits(){return hits;},
  get outs(){return outs;},
  get info(){return {state,phase,p:P?P.t/P.dur:0, open:P?P.open:null, swung:P?P.swung:false,
    result,hits,outs,lvl};}
};
})();
</script>
</body>
</html>
