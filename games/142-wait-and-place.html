<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ウェイト＆プレース (Wait & Place PK)</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;background:#08120a;overflow:hidden;font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",system-ui,sans-serif}
  #wrap{width:100%;height:100%;display:flex;align-items:center;justify-content:center}
  #stage{position:relative;width:min(100vw,calc(100vh*1.5));aspect-ratio:900/600;max-width:900px;
    box-shadow:0 10px 60px rgba(0,0,0,.6);border-radius:10px;overflow:hidden;touch-action:none}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
  #hint{position:absolute;left:0;bottom:6px;width:100%;text-align:center;color:#cfe;
    font-size:12px;opacity:.55;pointer-events:none;text-shadow:0 1px 3px #000}
</style>
</head>
<body>
<div id="wrap"><div id="stage">
  <canvas id="cv"></canvas>
  <div id="hint">GKが飛ぶのを見てから逆サイドへ！ ← 左 / → 右 / ↑ 中央チップ（GKが飛べばパネンカ）。タップでも可。ためすぎは蹴り損じ</div>
</div></div>
<script>
(()=>{
const cv=document.getElementById('cv'), g=cv.getContext('2d');
const W=900,H=600;
let DPR=1;
function fit(){ DPR=Math.min(2,window.devicePixelRatio||1); cv.width=W*DPR; cv.height=H*DPR; g.setTransform(DPR,0,0,DPR,0,0); }
fit(); addEventListener('resize',fit);

// ---------- audio ----------
let AC=null;
function ac(){ if(!AC){ try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){} } return AC; }
function tone(f,d,t,v,sweep){ const a=ac(); if(!a)return; const o=a.createOscillator(),gg=a.createGain();
  o.type=t||'sine'; o.frequency.value=f; if(sweep) o.frequency.exponentialRampToValueAtTime(Math.max(20,sweep),a.currentTime+d);
  gg.gain.setValueAtTime(0.0001,a.currentTime); gg.gain.exponentialRampToValueAtTime(v||0.2,a.currentTime+0.012);
  gg.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+d); o.connect(gg).connect(a.destination);
  o.start(); o.stop(a.currentTime+d+0.02); }
function noise(d,v,hp){ const a=ac(); if(!a)return; const n=a.createBuffer(1,a.sampleRate*d,a.sampleRate); const ch=n.getChannelData(0);
  for(let i=0;i<ch.length;i++) ch[i]=(Math.random()*2-1)*(1-i/ch.length);
  const s=a.createBufferSource(); s.buffer=n; const f=a.createBiquadFilter(); f.type='highpass'; f.frequency.value=hp||600;
  const gg=a.createGain(); gg.gain.value=v||0.15; s.connect(f).connect(gg).connect(a.destination); s.start(); }
const S={
  kick(){ noise(0.05,0.16,700); tone(240,0.07,'square',0.12,120); },
  goal(){ tone(520,0.1,'triangle',0.14,780); setTimeout(()=>tone(780,0.12,'triangle',0.12,1040),90); setTimeout(()=>tone(1040,0.14,'triangle',0.1,1320),190); noise(0.35,0.1,400); },
  panenka(){ tone(700,0.1,'sine',0.1,520); setTimeout(()=>tone(560,0.12,'sine',0.09,760),110); setTimeout(()=>tone(920,0.16,'triangle',0.1,1200),230); },
  save(){ noise(0.14,0.2,500); tone(320,0.12,'sawtooth',0.12,140); },
  miss(){ tone(300,0.26,'sawtooth',0.12,110); },
  over(){ tone(300,0.5,'sawtooth',0.16,90); setTimeout(()=>tone(200,0.6,'sawtooth',0.14,60),160); },
};

// ---------- geometry ----------
const GY=120, GL=270, GR=630, SPOT={x:450,y:494};
const KLEFT=GL+70, KRIGHT=GR-70, KMID=450, KY=GY+6;

// ---------- state ----------
let state='title';
let parts=[], pops=[];
let score, combo, best, lvl, misses, goals;
let phase='wait', kick=null, t=0, resT=0, pend=null, pendDelay=0;
let flash=0, shakeT=0;
try{ best=+localStorage.getItem('wp_best')||0; }catch(e){ best=0; }

const crowd=[]; { const cc=['#e6b48f','#9bd0e6','#e6dc8f','#c9a0d8','#8fd8bd','#f0f0f0']; for(let i=0;i<240;i++) crowd.push({x:(i*27.7)%W, y:2+((i*61)%56), c:cc[i%cc.length]}); }
function clamp(v,a,b){ return v<a?a:v>b?b:v; }
function rnd(a,b){ return a+Math.random()*(b-a); }
function chance(p){ return Math.random()<p; }

function reset(){ parts=[]; pops=[]; score=0; combo=0; lvl=0; misses=0; goals=0; newKick(); }
function newKick(){
  phase='wait'; t=0; resT=0; pend=null;
  const stay = chance(clamp(0.12+lvl*0.045,0.12,0.34));
  const side = stay ? 'stay' : (chance(0.5)?'L':'R');
  const feint = !stay && chance(clamp((lvl-1)*0.16,0,0.6));
  const leanDir = stay ? (chance(0.5)?'L':'R') : (feint ? (side==='L'?'R':'L') : side);
  const Tc = clamp(rnd(620,960) - lvl*28, 460, 960);           // when keeper commits
  const react = clamp(640 - lvl*52, 300, 640);
  const deadline = Tc + react;
  kick={ side, stay, feint, leanDir, Tc, react, deadline, committed:false,
    shot:null, shotDir:null, result:null, ballT:0, kx:KMID, kdiveT:0 };
}

function shoot(dir){ // dir: 'L','R','chip'
  if(state!=='play'||phase!=='wait'||kick.shot) return;
  kick.shot=true; kick.shotDir=dir; S.kick();
  const k=kick;
  let res;
  if(dir==='chip'){ res = (k.side==='stay') ? 'saveMid' : 'panenka'; }   // chip beats a diver, caught if keeper stays
  else { if(k.side==='stay') res='goal';                                 // keeper stayed -> corner open
         else res = (dir!==k.side) ? 'goal' : 'save'; }                  // opposite the dive scores
  k.result=res; phase='kick'; k.ballT=0;
}
function applyResult(){
  const k=kick, r=k.result;
  if(r==='goal'||r==='panenka'){
    goals++; combo++; const late = !k.earlyGuess;
    const pan=r==='panenka';
    const gained=(pan?170:110) + combo*12 + (k.clutch?40:0); score+=gained;
    (pan?S.panenka():S.goal()); flash=Math.max(flash,pan?0.5:0.34);
    pops.push({txt:(pan?'パネンカ！ 決めた +':'ゴール！ +')+gained, x:W/2,y:150,big:true,life:1.2,c:pan?'#ffd84a':'#8fffb0'});
    if(k.clutch) pops.push({txt:'ギリギリで見切った！',x:W/2,y:196,big:false,life:1.0,c:'#7fd8ff'});
    for(let i=0;i<(pan?26:16);i++) parts.push({x:(GL+GR)/2,y:GY,vx:rnd(-7,7),vy:rnd(-6,2),life:1.1,c:pan?'#ffd84a':'#bfffcf'});
    lvl=Math.min(6, Math.floor(goals/3 + Math.floor(score/900)));
    end(true);
  } else {
    misses++; combo=0; shakeT=0.28; flash=Math.max(flash,0.3);
    const msg = r==='miss' ? 'ためすぎて蹴り損じ…' : (r==='saveMid'?'中央でキャッチ…':'GKに読まれた！セーブ');
    (r==='miss'?S.miss():S.save());
    pops.push({txt:msg, x:W/2,y:160,big:true,life:1.1,c:'#ff6a6a'});
    end(false);
  }
}
function end(ok){ phase='resolve'; resT=0; pendDelay=ok?950:1100; pend = misses>=3 ? 'over' : 'next'; }
function gameOver(){ state='over'; S.over(); if(score>best){ best=score; try{localStorage.setItem('wp_best',best);}catch(e){} } }

// ---------- input ----------
function start(){ ac(); reset(); state='play'; }
function pt(e){ const r=cv.getBoundingClientRect(); return {x:(e.clientX-r.left)/r.width*W, y:(e.clientY-r.top)/r.height*H}; }
cv.addEventListener('pointerdown',e=>{ ac(); if(state!=='play'){ start(); return; }
  if(phase==='wait'){ const p=pt(e); if(p.y<GY+150) shoot('chip'); else if(p.x<W/2) shoot('L'); else shoot('R'); } e.preventDefault(); });
addEventListener('keydown',e=>{ const k=e.key.toLowerCase();
  if(state!=='play'){ if(!e.repeat) start(); return; }
  if(phase==='wait'){ if(k==='arrowleft'||k==='a') shoot('L'); else if(k==='arrowright'||k==='d') shoot('R'); else if(k==='arrowup'||k==='w'||k===' ') shoot('chip'); if(['arrowleft','arrowright','arrowup',' '].includes(e.key.toLowerCase())) e.preventDefault(); } });

// ---------- update ----------
function update(dt){
  if(flash>0) flash=Math.max(0,flash-dt*0.003);
  if(shakeT>0) shakeT-=dt*0.001;
  parts.forEach(q=>{q.x+=q.vx;q.y+=q.vy;q.vy+=0.2;q.life-=dt*0.0022;});
  parts=parts.filter(q=>q.life>0);
  pops.forEach(q=>{q.y-=dt*0.02;q.life-=dt*0.0014;});
  pops=pops.filter(q=>q.life>0);
  if(state!=='play') return;

  if(phase==='wait'){
    t+=dt;
    if(t>=kick.Tc && !kick.committed){ kick.committed=true; }
    // keeper visual: lean before commit, dive after
    if(t>=kick.deadline && !kick.shot){ kick.shot=true; kick.shotDir='none'; kick.result='miss'; phase='kick'; kick.ballT=0; }
  } else if(phase==='kick'){
    kick.ballT+=dt;
    // keeper dives to its side (committed at Tc); animate quickly now
    kick.kdiveT=clamp(kick.kdiveT+dt,0,300);
    if(kick.ballT>=430 && !kick.applied){ kick.applied=true;
      // clutch: struck within the last third of the reaction window
      kick.clutch = kick.shotDir!=='none' && kick.committed && (kick.strikeT!=null) && (kick.strikeT > kick.Tc + kick.react*0.55);
      kick.earlyGuess = kick.shotDir!=='none' && !kick.committed;
      applyResult(); }
  } else if(phase==='resolve'){
    resT+=dt;
    if(resT>=pendDelay && pend){ const p=pend; pend=null; if(p==='over') gameOver(); else newKick(); }
  }
}
// record strike time
const _shoot=shoot;
shoot=function(dir){ if(state==='play'&&phase==='wait'&&!kick.shot){ kick.strikeT=t; } _shoot(dir); };

// ---------- render ----------
function keeperX(){ const k=kick; if(!k) return KMID;
  if(phase==='wait'){ if(k.committed){ const f=clamp((t-k.Tc)/240,0,1); const tx=k.side==='L'?KLEFT:(k.side==='R'?KRIGHT:KMID); return KMID+(tx-KMID)*f; }
    else { const lean=k.leanDir==='L'?-1:(k.leanDir==='R'?1:0); return KMID+lean*Math.min(26,(t/ k.Tc)*30); } }
  const f=clamp(k.kdiveT/240,0,1); const tx=k.side==='L'?KLEFT:(k.side==='R'?KRIGHT:KMID); return KMID+(tx-KMID)*f;
}
function drawField(){
  const gr=g.createLinearGradient(0,0,0,H); gr.addColorStop(0,'#2c9350'); gr.addColorStop(1,'#1f6f3b'); g.fillStyle=gr; g.fillRect(0,0,W,H);
  g.globalAlpha=0.05; for(let i=0;i<9;i++){ g.fillStyle=i%2?'#fff':'#000'; g.fillRect(0,GY+i*54,W,54); } g.globalAlpha=1;
  g.fillStyle='#14324a'; g.fillRect(0,0,W,72);
  for(const c of crowd){ g.fillStyle=c.c; g.globalAlpha=0.6; g.fillRect(c.x,c.y,3,3); } g.globalAlpha=1;
  // goal
  g.save(); g.strokeStyle='rgba(255,255,255,0.28)'; g.lineWidth=1; g.fillStyle='rgba(255,255,255,0.05)'; g.fillRect(GL,GY-58,GR-GL,58);
  for(let x=GL;x<=GR;x+=15){ g.beginPath(); g.moveTo(x,GY-58); g.lineTo(x,GY); g.stroke(); } g.restore();
  g.strokeStyle='#fff'; g.lineWidth=6; g.lineCap='round'; g.beginPath(); g.moveTo(GL,GY); g.lineTo(GL,GY-60); g.lineTo(GR,GY-60); g.lineTo(GR,GY); g.stroke();
  // penalty arc/box
  g.strokeStyle='rgba(255,255,255,0.35)'; g.lineWidth=2; g.strokeRect(GL-40,GY,GR-GL+80,300);
}
function drawKeeper(){ const kx=keeperX(); const diving = (phase==='kick') && kick.side!=='stay';
  g.save(); g.translate(kx,KY);
  if(diving){ const f=clamp(kick.kdiveT/240,0,1); g.rotate((kick.side==='L'?-1:1)*0.9*f); }
  g.fillStyle='#ffd24a'; g.beginPath(); g.arc(0,-16,11,0,6.28); g.fill(); g.fillRect(-11,-14,22,28);
  g.fillStyle='#e0b020'; g.fillRect(-20,-10,40,8);
  g.restore();
}
function drawScene(){
  drawKeeper();
  // ball
  const k=kick;
  if((phase==='kick'||phase==='resolve') && k.shotDir && k.shotDir!=='none'){ const f=clamp(k.ballT/430,0,1);
    let tx = k.shotDir==='L'?GL+40 : (k.shotDir==='R'?GR-40 : KMID); let ty=GY-10;
    // a saved shot stops at the keeper
    const saved = k.result==='save'||k.result==='saveMid';
    const ff = saved ? Math.min(f,0.9) : f;
    const bx=SPOT.x+(tx-SPOT.x)*ff, by=SPOT.y+(ty-SPOT.y)*ff - Math.sin(ff*Math.PI)*(k.shotDir==='chip'?60:18);
    g.fillStyle='#fff'; g.beginPath(); g.arc(bx,by,8-3*ff,0,6.28); g.fill(); }
  else if(phase==='wait'){ g.fillStyle='#fff'; g.beginPath(); g.arc(SPOT.x,SPOT.y,9,0,6.28); g.fill();
    g.strokeStyle='#bbb'; g.lineWidth=1; g.stroke(); }
  // kicker
  g.fillStyle='#3f7bd6'; g.beginPath(); g.arc(SPOT.x-2,SPOT.y+34,11,0,6.28); g.fill(); g.fillRect(SPOT.x-11,SPOT.y+38,18,24);
  // prompts + timer during wait
  if(phase==='wait'){
    const f=clamp(t/kick.deadline,0,1);
    g.textAlign='center'; g.fillStyle=kick.committed?'#8fffb0':'rgba(255,255,255,0.7)'; g.font='bold 20px sans-serif';
    g.fillText(kick.committed?'今だ！逆サイドへ！':'GKの動きを見る…',W/2,SPOT.y-70);
    // aim guide
    g.fillStyle='rgba(255,255,255,0.5)'; g.font='bold 15px sans-serif';
    g.fillText('← 左',GL+40,GY-70); g.fillText('右 →',GR-40,GY-70); g.fillText('↑チップ',KMID,GY-70);
    // timer bar
    g.fillStyle='rgba(255,255,255,0.2)'; g.fillRect(W/2-150,SPOT.y+70,300,7);
    g.fillStyle=f>0.72?'#ff6a6a':'#ffd84a'; g.fillRect(W/2-150,SPOT.y+70,300*(1-f),7);
  }
}
function drawHUD(){
  g.textAlign='left'; g.fillStyle='#fff'; g.font='bold 26px sans-serif'; g.fillText('SCORE '+score,20,40);
  if(combo>1){ g.fillStyle='#ffd84a'; g.font='bold 17px sans-serif'; g.fillText(combo+' 連続ゴール',20,63); }
  g.textAlign='right'; g.fillStyle='rgba(255,255,255,0.8)'; g.font='14px sans-serif'; g.fillText('得点 '+goals+'  Lv.'+(lvl+1),W-20,38);
  g.fillStyle='#ff6a6a'; g.textAlign='right'; g.font='bold 14px sans-serif'; g.fillText('失敗',W-96,63);
  for(let i=0;i<3;i++){ g.fillStyle=i<misses?'#ff5a5a':'rgba(255,255,255,0.24)'; g.beginPath(); g.arc(W-74+i*22,58,8,0,6.28); g.fill(); }
}
function drawTitle(){
  g.fillStyle='rgba(0,0,0,0.5)'; g.fillRect(0,0,W,H);
  g.textAlign='center'; g.fillStyle='#8fffb0'; g.font='bold 50px sans-serif'; g.fillText('ウェイト＆プレース',W/2,164);
  g.fillStyle='#fff'; g.font='bold 22px sans-serif'; g.fillText('Wait & Place — GKを見切って決めろ',W/2,202);
  g.fillStyle='#cfe'; g.font='18px sans-serif';
  g.fillText('GKが飛ぶ「その瞬間」を待って、逆サイドへ流し込め。',W/2,256);
  g.fillText('← 左 / → 右 / ↑ 中央チップ（GKが飛べばパネンカで加点）。',W/2,284);
  g.fillText('上級のGKはフェイントや残る（ステイ）ことも。見極めろ。',W/2,312);
  g.fillText('読まれてセーブ・ためすぎて蹴り損じは失敗。3失敗で終了。',W/2,340);
  g.fillStyle='#ffd84a'; g.font='bold 22px sans-serif'; g.fillText('クリック / タップ / キー でスタート',W/2,406);
}
function drawOver(){
  g.fillStyle='rgba(0,0,0,0.62)'; g.fillRect(0,0,W,H);
  g.textAlign='center'; g.fillStyle='#ff6a6a'; g.font='bold 54px sans-serif'; g.fillText('3失敗…終了',W/2,H/2-54);
  g.fillStyle='#fff'; g.font='bold 34px sans-serif'; g.fillText('SCORE '+score,W/2,H/2+2);
  g.fillStyle='#cfe'; g.font='20px sans-serif'; g.fillText('ゴール '+goals+'　BEST '+best,W/2,H/2+40);
  g.fillStyle='#8fffb0'; g.font='bold 22px sans-serif'; g.fillText('クリック / タップ で もう一度',W/2,H/2+96);
}
function render(){
  g.setTransform(DPR,0,0,DPR,0,0);
  let sx=0,sy=0; if(shakeT>0){ sx=rnd(-6,6)*shakeT*3; sy=rnd(-6,6)*shakeT*3; g.translate(sx,sy); }
  drawField();
  if(state==='play'||state==='over') drawScene();
  parts.forEach(q=>{ g.globalAlpha=clamp(q.life,0,1); g.fillStyle=q.c; g.beginPath(); g.arc(q.x,q.y,3,0,6.28); g.fill(); }); g.globalAlpha=1;
  pops.forEach(q=>{ g.globalAlpha=clamp(q.life,0,1); g.textAlign='center'; g.fillStyle=q.c; g.font='bold '+(q.big?34:22)+'px sans-serif';
    const px=(q.x==null)?W/2:q.x; g.fillText(q.txt,px,q.y); }); g.globalAlpha=1;
  if(state==='play') drawHUD();
  if(flash>0){ g.fillStyle='rgba(255,255,255,'+(flash*0.6)+')'; g.fillRect(0,0,W,H); }
  if(state==='title') drawTitle();
  if(state==='over') drawOver();
  g.setTransform(DPR,0,0,DPR,0,0);
}

let last=0;
function frame(ts){ let dt=ts-last; last=ts; if(dt>60)dt=60; if(dt<0)dt=0; update(dt); render(); requestAnimationFrame(frame); }
requestAnimationFrame(frame);

// ---------- test hook ----------
window.__wp={
  start, shootL:()=>shoot('L'), shootR:()=>shoot('R'), chip:()=>shoot('chip'),
  get state(){return state;}, get score(){return score;}, get misses(){return misses;}, get goals(){return goals;},
  get info(){ if(state!=='play') return {state,phase:'-'}; return {
    state, phase, t, committed:kick&&kick.committed, side:kick&&kick.side, stay:kick&&kick.stay,
    deadline:kick&&kick.deadline, shot:kick&&kick.shot, result:kick&&kick.result, misses, goals }; }
};
})();
</script>
</body>
</html>
