<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>PKか、エリア外か (In or Out of the Box?)</title>
<style>
  html,body{margin:0;height:100%;background:#07100a;overflow:hidden;
    font-family:-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  #stage{position:relative;width:100vw;height:100vh;max-width:calc(100vh*1.5);max-height:calc(100vw/1.5);aspect-ratio:900/600;}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;border-radius:6px;}
</style>
</head>
<body>
<div id="wrap"><div id="stage"><canvas id="cv"></canvas></div></div>
<script>
(function(){
const W=900,H=600,cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let DPR=1;
function fit(){DPR=Math.min(2,window.devicePixelRatio||1);cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
fit();addEventListener('resize',fit);

// ---------- audio ----------
let AC=null;function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function tone(f,d,type,v,sweep){const a=ac();if(!a)return;const t=a.currentTime,o=a.createOscillator(),g=a.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(sweep)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+sweep),t+d);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v||0.2,t+0.008);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+0.02);}
function noise(d,v,hp){const a=ac();if(!a)return;const t=a.currentTime,n=Math.floor(a.sampleRate*d),buf=a.createBuffer(1,n,a.sampleRate),ch=buf.getChannelData(0);
  for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource();s.buffer=buf;
  const f=a.createBiquadFilter();f.type='highpass';f.frequency.value=hp||600;const g=a.createGain();g.gain.value=v||0.2;
  s.connect(f);f.connect(g);g.connect(a.destination);s.start(t);s.stop(t+d+0.02);}
const S={
  tangle:()=>{tone(220,0.05,'sine',0.04,-30);},
  whistle:()=>{tone(1650,0.14,'square',0.05);setTimeout(()=>tone(1650,0.1,'square',0.05),120);},
  good:()=>{[660,900,1180].forEach((f,i)=>setTimeout(()=>tone(f,0.11,'triangle',0.16),i*56));},
  big:()=>{[600,800,1000,1250].forEach((f,i)=>setTimeout(()=>tone(f,0.12,'triangle',0.17),i*80));},
  bad:()=>{noise(0.2,0.24,240);tone(150,0.24,'sawtooth',0.13,-50);},
  streak:()=>{[700,930,1170,1400].forEach((f,i)=>setTimeout(()=>tone(f,0.1,'triangle',0.16),i*60));},
  over:()=>{[440,330,247,175].forEach((f,i)=>setTimeout(()=>tone(f,0.3,'triangle',0.2),i*160));}
};

// ---------- geometry ----------
const LINE=352;                     // the penalty-area (18-yard) line: inside = below (toward goal)
const GY=560, BOXL=170, BOXR=730;   // goal line & box sides

// ---------- state ----------
let state='title', phase='watch', plays=0;
let score=0, combo=0, best=+(localStorage.getItem('io_best')||0);
let outs=0, fails=0, lvl=1;   // outs = correct calls
let clock=0, revealT=520, callWin=980, truth='INSIDE', tough=false, contactY=LINE;
let cx=452;                          // x of the incident
let decided=false, pick=null, result=null, resultT=0, msg='', msgOk=false, anim=0;
let shake=0, flash=0, flashCol='#fff', last=performance.now();
let parts=[], pops=[];

function rnd(a,b){return a+Math.random()*(b-a);}
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function lerp(a,b,u){return a+(b-a)*u;}
function easeOut(u){return 1-Math.pow(1-u,2);}

function reset(){state='title';score=0;combo=0;outs=0;fails=0;lvl=1;plays=0;result=null;parts=[];pops=[];}

function newPlay(){
  plays++; lvl=Math.min(7,1+Math.floor(outs/4));
  revealT=clamp(560-lvl*24,360,560);
  callWin=clamp(1020-lvl*70,560,1020);
  tough=Math.random()<clamp(0.2+lvl*0.05,0.2,0.5);
  truth=(Math.random()<0.5?'INSIDE':'OUTSIDE');
  const off = tough ? rnd(6,16) : rnd(22,54);
  contactY = truth==='INSIDE' ? LINE+off : LINE-off;   // inside = below the line (toward goal)
  cx = rnd(330,574);
  phase='watch'; clock=0; decided=false; pick=null; result=null; resultT=0; msg=''; msgOk=false; anim=0;
  S.tangle();
}
function start(){ if(!ac())ac(); if(AC&&AC.state==='suspended')AC.resume(); reset(); state='play'; newPlay(); }

// PK = foul inside the box ; FK = foul outside
function makeCall(c){
  if(state==='title'){start();return;}
  if(state==='over'){ if(resultT>0.4){reset();start();} return; }
  if(state!=='play'||phase!=='watch'||decided) return;
  if(clock<revealT){ decided=true; pick=c; resolve('early'); return; }
  decided=true; pick=c;
  const correct=(c==='PK'&&truth==='INSIDE')||(c==='FK'&&truth==='OUTSIDE');
  resolve(correct?'right':'wrong');
}

function resolve(k){
  phase='result'; result=k; resultT=0; anim=0;
  if(k==='right'){
    outs++; combo++;
    let add=Math.round((tough?250:150)*(1+Math.min(9,combo-1)*0.14)); score+=add;
    S.whistle(); setTimeout(S.good,150); if(tough)setTimeout(S.big,240);
    msgOk=true; flash=1;flashCol='#8affa0';shake=6; burst(cx,contactY,'#8affa0',18,7);
    pop(W/2,236,(tough?'ライン際の紙一重を正確にジャッジ！ +':'正しくジャッジ——ナイスコール！ +')+add,'#d6ffe0');
    if(combo>=2)pop(W/2,204,'コンボ x'+combo,'#ffd24d');
    if(combo>0&&combo%5===0)S.streak();
    msg=(truth==='INSIDE')?'接触点はエリアの内側——ペナルティキック！正しい判定でスポットを指した':'接触点はライン“外”——直接フリーキック！エリア外なので正しくノーPKの判定';
  } else {
    fails++; combo=0; msgOk=false; flash=1;flashCol='#ff5b5b';shake=8; S.bad();
    if(k==='early') msg='判定が早い…接触点がラインの内外どちらか見える前にコールし、誤審となった';
    else if(k==='wrong'){
      msg=(truth==='INSIDE')?'誤審…接触はエリア“内”だったのに直接FK＝取り消されるべきPKを見逃した':'誤審…接触はエリア“外”だったのにPKを宣告＝与えるべきでないPKを与えてしまった';
    }
    else msg='判定が遅い…コールが間に合わず、両ベンチが猛抗議する曖昧な裁定になった';
    pop(W/2,236,(k==='wrong')?'誤審…':(k==='early')?'早い…見る前にコール':'遅い…判定できず','#ffb0b0');
  }
  if(fails>=3){ state='over'; resultT=0; S.over(); if(score>best){best=score;localStorage.setItem('io_best',best);} }
}

// ---------- input ----------
const BW=250, BY=506, BH=64, BL=150, BR=500;
cv.addEventListener('pointerdown',e=>{e.preventDefault();
  if(state!=='play'||phase!=='watch'){ makeCall('PK'); return; }
  const r=cv.getBoundingClientRect(); const x=(e.clientX-r.left)/r.width*W, y=(e.clientY-r.top)/r.height*H;
  if(y>=BY&&y<=BY+BH){ if(x>=BL&&x<=BL+BW){ makeCall('PK'); return; } if(x>=BR&&x<=BR+BW){ makeCall('FK'); return; } }
  makeCall(x<W*0.5?'PK':'FK');
});
addEventListener('keydown',e=>{ if(e.repeat)return;
  if(e.code==='ArrowLeft'||e.code==='ArrowUp'||e.code==='KeyA'){e.preventDefault();makeCall('PK');}
  else if(e.code==='ArrowRight'||e.code==='ArrowDown'||e.code==='KeyD'){e.preventDefault();makeCall('FK');}
  else if(e.code==='Space'||e.code==='Enter'){e.preventDefault(); if(state!=='play')makeCall('PK');} });

// ---------- particles ----------
function burst(x,y,c,n,sp){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=rnd(sp*0.3,sp);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:1,c});}}
function pop(x,y,txt,c){pops.push({x,y,txt,c,life:1});}

// ---------- update ----------
function update(dt){
  shake*=Math.pow(0.86,dt/16.7); if(shake<0.3)shake=0;
  flash*=Math.pow(0.9,dt/16.7);
  for(const p of parts){p.vx*=0.96;p.vy=p.vy*0.96+0.28;p.x+=p.vx*dt/16.7;p.y+=p.vy*dt/16.7;p.life-=dt/16.7*0.026;}
  parts=parts.filter(p=>p.life>0);
  for(const p of pops){p.y-=dt/16.7*0.5;p.life-=dt/16.7*0.02;}
  pops=pops.filter(p=>p.life>0);

  if(state!=='play'){ if(state==='over')resultT+=dt/1000; return; }
  if(phase==='watch'){ const before=clock<revealT; clock+=dt;
    if(before&&clock>=revealT)S.tangle();
    if(!decided && clock>revealT+callWin){ decided=true; resolve('late'); }
    return; }
  if(phase==='result'){ resultT+=dt/1000; anim=Math.min(1,anim+dt/360); if(resultT>1.6) newPlay(); return; }
}

// ---------- render ----------
function drawField(){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#0f5e34');g.addColorStop(0.55,'#0e5230');g.addColorStop(1,'#0c4429');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='rgba(255,255,255,0.03)';for(let i=0;i<5;i++){ if(i%2===0)ctx.fillRect(0,60+i*100,W,100); }
  // goal
  ctx.fillStyle='rgba(0,0,0,0.28)';ctx.fillRect(W/2-90,GY,180,26);
  ctx.strokeStyle='#f2f2f2';ctx.lineWidth=5;ctx.strokeRect(W/2-90,GY-2,180,26);
  // penalty box: from LINE (top) to GY, sides BOXL..BOXR
  ctx.strokeStyle='rgba(255,255,255,0.5)';ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(BOXL,GY);ctx.lineTo(BOXL,LINE);ctx.lineTo(BOXR,LINE);ctx.lineTo(BOXR,GY);ctx.stroke();
  // 6-yard box + spot
  ctx.strokeRect(W/2-70,GY-70,140,70);
  ctx.fillStyle='#eef2f0';ctx.beginPath();ctx.arc(W/2,GY-116,3.5,0,6.28);ctx.fill();
  // arc
  ctx.beginPath();ctx.arc(W/2,GY-116,66,Math.PI*1.18,Math.PI*1.82);ctx.stroke();
  // faint tint of the "inside" region
  ctx.fillStyle='rgba(90,140,220,0.05)';ctx.fillRect(BOXL,LINE,BOXR-BOXL,GY-LINE);
}
function person(x,y,col,s,lean){s=s||1;lean=lean||0;
  ctx.save();ctx.translate(x,y);ctx.rotate(lean);
  ctx.fillStyle='rgba(0,0,0,0.2)';ctx.beginPath();ctx.ellipse(0,13*s,10*s,4*s,0,0,6.28);ctx.fill();
  ctx.fillStyle=col;ctx.beginPath();ctx.ellipse(0,-14*s,9*s,14*s,0,0,6.28);ctx.fill();
  ctx.fillStyle='#f0c9a0';ctx.beginPath();ctx.arc(0,-31*s,7*s,0,6.28);ctx.fill();
  ctx.restore();
}
function faller(x,y,col){ ctx.save();ctx.translate(x,y);
  ctx.fillStyle='rgba(0,0,0,0.2)';ctx.beginPath();ctx.ellipse(6,10,16,5,0,0,6.28);ctx.fill();
  ctx.save();ctx.rotate(1.1);
  ctx.fillStyle=col;ctx.beginPath();ctx.ellipse(0,-9,10,15,0,0,6.28);ctx.fill();
  ctx.fillStyle='#f0c9a0';ctx.beginPath();ctx.arc(0,-30,7,0,6.28);ctx.fill();
  ctx.restore();ctx.restore(); }
function rr(x,y,w2,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w2,y,x+w2,y+h,r);ctx.arcTo(x+w2,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w2,y,r);ctx.closePath();}

function render(){
  ctx.save();
  if(shake>0)ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
  drawField();

  if(state==='play'||state==='over'){
    const revealed=(phase==='watch'&&clock>=revealT)||phase==='result';
    // the challenge: defender + attacker tangled near the line
    if(!revealed){ // still developing
      const j=Math.sin(clock/60)*3;
      person(cx-14, LINE+ (truth==='INSIDE'?18:-18)*0.3 + j, '#c85049', 0.94, 0.1);
      person(cx+16, LINE+ (truth==='INSIDE'?18:-18)*0.3 - j, '#2b6fd6', 0.98, -0.1);
    } else {
      // freeze: attacker down at the contact point, defender beside
      person(cx-16, contactY-4, '#c85049', 0.92, 0.25);
      faller(cx+8, contactY, '#2b6fd6');
      // VAR line highlight + contact marker
      ctx.strokeStyle='rgba(255,230,90,0.95)';ctx.lineWidth=3;ctx.setLineDash([9,7]);
      ctx.beginPath();ctx.moveTo(BOXL,LINE);ctx.lineTo(BOXR,LINE);ctx.stroke();ctx.setLineDash([]);
      // contact dot with a drop-line to the box line
      ctx.strokeStyle=(truth==='INSIDE')?'rgba(120,255,150,0.9)':'rgba(255,120,110,0.9)';ctx.lineWidth=2;
      ctx.beginPath();ctx.moveTo(cx,contactY);ctx.lineTo(cx,LINE);ctx.stroke();
      ctx.fillStyle=(truth==='INSIDE')?'#8affa0':'#ff8a6a';ctx.beginPath();ctx.arc(cx,contactY,7,0,6.28);ctx.fill();
      ctx.strokeStyle='#fff';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(cx,contactY,7,0,6.28);ctx.stroke();
      if(phase==='watch'){ ctx.textAlign='center';ctx.font='bold 15px sans-serif';
        ctx.fillStyle=(truth==='INSIDE')?'rgba(140,255,160,0.98)':'rgba(255,150,90,0.98)';
        ctx.fillText((truth==='INSIDE')?'接触点はライン内側':'接触点はライン外側', cx, contactY+ (truth==='INSIDE'?26:-16)); }
    }
    // "line" label
    ctx.textAlign='left';ctx.fillStyle='rgba(255,255,255,0.55)';ctx.font='11px sans-serif';
    ctx.fillText('← ペナルティエリアのライン（この内側＝PK）', BOXL+6, LINE-8);

    ctx.textAlign='center';
    if(state==='play'&&phase==='watch'){
      if(clock<revealT){ ctx.fillStyle='rgba(255,220,90,0.95)';ctx.font='bold 20px sans-serif';ctx.fillText('ボックス際の接触——エリアの内か外か、よく見ろ！',W/2,40); }
      else { ctx.fillStyle='rgba(255,220,120,0.98)';ctx.font='bold 22px sans-serif';ctx.fillText('判定しろ！',W/2,40);
        const p=clamp((clock-revealT)/callWin,0,1),bw=250,x=W/2-bw/2,y=54;
        ctx.fillStyle='rgba(255,255,255,0.18)';ctx.fillRect(x,y,bw,7);ctx.fillStyle=p<0.7?'#8affa0':(p<1?'#ffd24d':'#ff5b5b');ctx.fillRect(x,y,bw*p,7); }
    }
    if(state==='play'){
      const active=phase==='watch'&&clock>=revealT;
      ctx.fillStyle=active?'#2b8a5b':'rgba(255,255,255,0.10)';rr(BL,BY,BW,BH,10);ctx.fill();
      ctx.fillStyle=active?'#eafff0':'rgba(255,255,255,0.5)';ctx.textAlign='center';ctx.font='bold 20px sans-serif';ctx.fillText('◀ PK（エリア内）',BL+BW/2,BY+27);
      ctx.font='11px sans-serif';ctx.fillText('接触がライン内側（←/↑/A）',BL+BW/2,BY+46);
      ctx.fillStyle=active?'#b5502f':'rgba(255,255,255,0.10)';rr(BR,BY,BW,BH,10);ctx.fill();
      ctx.fillStyle=active?'#fff0ea':'rgba(255,255,255,0.5)';ctx.fillText('直接FK（エリア外）▶',BR+BW/2,BY+27);
      ctx.font='11px sans-serif';ctx.fillText('接触がライン外側（→/↓/D）',BR+BW/2,BY+46);
    }
  }

  for(const p of parts){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,3.2,0,6.28);ctx.fill();}
  ctx.globalAlpha=1;
  for(const p of pops){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.font='bold 20px sans-serif';ctx.textAlign='center';ctx.fillText(p.txt,p.x,p.y);}
  ctx.globalAlpha=1;

  // HUD
  ctx.textAlign='left';ctx.fillStyle='#fff';ctx.font='bold 26px sans-serif';ctx.fillText('SCORE '+score,20,36);
  ctx.textAlign='right';ctx.fillStyle='rgba(255,255,255,0.9)';ctx.font='14px sans-serif';ctx.fillText('好判定 '+outs+'  Lv'+lvl,W-20,24);
  ctx.fillText('誤審',W-96,46);
  for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(W-56+i*20,41,7,0,6.28);ctx.fillStyle=i<fails?'#ff5b5b':'rgba(255,255,255,0.25)';ctx.fill();}
  if(combo>=2){ctx.textAlign='center';ctx.fillStyle='#ffd24d';ctx.font='bold 18px sans-serif';ctx.fillText('コンボ x'+combo,W/2,110);}

  if(state==='play'&&phase==='result'&&msg){ctx.textAlign='center';ctx.fillStyle=msgOk?'#9ff0b8':'#ff9a9a';ctx.font='bold 14px sans-serif';ctx.fillText(msg,W/2,470);}

  if(state==='title'){
    ctx.fillStyle='rgba(3,10,6,0.85)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='bold 36px sans-serif';ctx.fillText('PKか、エリア外か',W/2,78);
    ctx.fillStyle='#ffd23e';ctx.font='bold 22px sans-serif';ctx.fillText('In or Out of the Box?',W/2,114);
    ctx.fillStyle='rgba(255,255,255,0.92)';ctx.font='16px sans-serif';
    ctx.fillText('主審／VARとして、ボックス際のファウルが“ペナルティエリアの内か外か”を接触点の位置で見極めろ',W/2,166);
    ctx.fillStyle='rgba(255,255,255,0.66)';ctx.font='14px sans-serif';
    ctx.fillText('接触点がラインの内側＝PK（←/↑/A・左ボタン）／ラインの外側＝直接FK（→/↓/D・右ボタン）',W/2,206);
    ctx.fillText('正しくコールすれば加点。ライン際の紙一重（tough）を裁くと大量加点＆コンボ',W/2,230);
    ctx.fillText('内か外か見える前にコール＝早すぎ／逆をコール＝誤審／判定できず＝失敗、いずれも誤審',W/2,254);
    ctx.fillText('上級ほど接触がライン際で紙一重、猶予も短い。3誤審で交代',W/2,278);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で開始',W/2,348);
    ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='14px sans-serif';ctx.fillText('BEST '+best,W/2,380);
  }
  if(state==='over'){
    ctx.fillStyle='rgba(3,10,6,0.86)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#ff6b6b';ctx.font='bold 46px sans-serif';ctx.fillText('3誤審…交代',W/2,222);
    ctx.fillStyle='#fff';ctx.font='bold 40px sans-serif';ctx.fillText('SCORE '+score,W/2,290);
    ctx.fillStyle='rgba(255,255,255,0.85)';ctx.font='19px sans-serif';ctx.fillText('好判定 '+outs+'   BEST '+best,W/2,330);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で もう一度',W/2,402);
  }

  if(flash>0.02){ctx.globalAlpha=flash*0.5;ctx.fillStyle=flashCol;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}
  ctx.restore();

  ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,0.4)';ctx.font='12px sans-serif';
  ctx.fillText('PKか、エリア外か：ボックス際の接触がエリア内（PK）か外（直接FK）かを接触点で判定。逆・早い・遅いは誤審、3誤審で交代',W/2,H-8);
}

function frame(ts){let dt=ts-last;last=ts;if(dt>60)dt=60;if(dt<0)dt=0;update(dt);render();requestAnimationFrame(frame);}
requestAnimationFrame(frame);

// ---------- test hook ----------
window.__io={
  start, pk:()=>makeCall('PK'), fk:()=>makeCall('FK'),
  get state(){return state;},
  get score(){return score;},
  get outs(){return outs;},
  get fails(){return fails;},
  get info(){return {state,phase,clock,revealT,callWin,truth,tough,decided,result,outs,fails,lvl,
    isInside:(truth==='INSIDE'),revealed:(clock>=revealT),canAct:(phase==='watch'&&!decided)};}
};
})();
</script>
</body>
</html>
