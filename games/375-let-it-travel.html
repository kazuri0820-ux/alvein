<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>流し打ちの間 (Let It Travel)</title>
<style>
  html,body{margin:0;height:100%;background:#0a0d08;overflow:hidden;
    font-family:-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  #stage{position:relative;width:100vw;height:100vh;max-width:calc(100vh*1.5);max-height:calc(100vw/1.5);aspect-ratio:900/600;}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;border-radius:6px;}
</style>
</head>
<body>
<div id="wrap"><div id="stage"><canvas id="cv"></canvas></div></div>
<script>
(function(){
const W=900,H=600,cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let DPR=1;
function fit(){DPR=Math.min(2,window.devicePixelRatio||1);cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
fit();addEventListener('resize',fit);

// ---------- audio ----------
let AC=null;function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function tone(f,d,type,v,sweep){const a=ac();if(!a)return;const t=a.currentTime,o=a.createOscillator(),g=a.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(sweep)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+sweep),t+d);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v||0.2,t+0.008);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+0.02);}
function noise(d,v,hp){const a=ac();if(!a)return;const t=a.currentTime,n=Math.floor(a.sampleRate*d),buf=a.createBuffer(1,n,a.sampleRate),ch=buf.getChannelData(0);
  for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource();s.buffer=buf;
  const f=a.createBiquadFilter();f.type='highpass';f.frequency.value=hp||600;const g=a.createGain();g.gain.value=v||0.2;
  s.connect(f);f.connect(g);g.connect(a.destination);s.start(t);s.stop(t+d+0.02);}
const S={
  pitch:()=>{tone(240,0.05,'sine',0.03);},
  crack:()=>{noise(0.05,0.2,1200);tone(420,0.05,'square',0.08,-120);},
  hit:()=>{[620,880,1150].forEach((f,i)=>setTimeout(()=>tone(f,0.11,'triangle',0.16),i*56));},
  big:()=>{[600,800,1000,1250,1500].forEach((f,i)=>setTimeout(()=>tone(f,0.12,'triangle',0.17),i*80));},
  bad:()=>{noise(0.14,0.16,300);tone(180,0.16,'square',0.09,-50);},
  streak:()=>{[700,930,1170,1400].forEach((f,i)=>setTimeout(()=>tone(f,0.1,'triangle',0.16),i*60));},
  over:()=>{[440,330,247,175].forEach((f,i)=>setTimeout(()=>tone(f,0.3,'triangle',0.2),i*160));}
};

// ---------- geometry ----------
const PLATE={x:452,y:470}, BAT={x:398,y:452}, REL={x:560,y:96};   // plate, batter, pitcher release (upper-right)
function ballPos(fr){ // outside pitch drifting in from upper-right toward the deep outside corner
  const ex=PLATE.x+58, ey=PLATE.y-18;   // deep outside contact point
  return {x:lerp(REL.x,ex,easeOut(fr)), y:lerp(REL.y,ey,fr*fr)};
}

// ---------- state ----------
let state='title', phase='hold', plays=0;
let score=0, combo=0, best=+(localStorage.getItem('lt_best')||0);
let outs=0, fails=0, lvl=1;   // outs = hits (opposite-field)
let clock=0, deadT=1100, win=290, tough=false;
let released=false, relT=0, result=null, resultT=0, msg='', msgOk=false, quality=0, anim=0;
let shake=0, flash=0, flashCol='#fff', last=performance.now();
let parts=[], pops=[];

function rnd(a,b){return a+Math.random()*(b-a);}
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function lerp(a,b,u){return a+(b-a)*u;}
function easeOut(u){return 1-Math.pow(1-u,2);}

function reset(){state='title';score=0;combo=0;outs=0;fails=0;lvl=1;plays=0;result=null;parts=[];pops=[];}
function winStart(){return deadT-win;}

function newPlay(){
  plays++; lvl=Math.min(7,1+Math.floor(outs/4));
  deadT=clamp(1160-lvl*58,720,1160);      // pitch reaches the deep corner sooner at higher levels
  win=clamp(300-lvl*18,160,300);          // how long the ball is "in the drive zone"
  tough=Math.random()<clamp(0.2+lvl*0.05,0.2,0.5);
  if(tough)win*=0.8;
  phase='hold'; clock=0; released=false; relT=0; result=null; resultT=0; msg=''; msgOk=false; quality=0; anim=0;
  S.pitch();
}
function start(){ if(!ac())ac(); if(AC&&AC.state==='suspended')AC.resume(); reset(); state='play'; newPlay(); }

function swing(){
  if(state==='title'){start();return;}
  if(state==='over'){ if(resultT>0.4){reset();start();} return; }
  if(state!=='play'||phase!=='hold'||released) return;
  released=true; relT=clock; S.crack();
  if(clock<winStart()){ resolve('early'); }
  else { quality=clamp((clock-winStart())/win,0,1); resolve('hit'); }
}

function resolve(k){
  phase='result'; result=k; resultT=0; anim=0;
  if(k==='hit'){
    outs++; combo++;
    const gapper=quality>=0.7;
    let add=Math.round((60+Math.round(quality*150)+(tough?70:0))*(1+Math.min(9,combo-1)*0.14)); score+=add;
    setTimeout(S.hit,110); if(gapper||tough)setTimeout(S.big,190);
    msgOk=true; flash=1;flashCol='#8affa0';shake=5; burst(PLATE.x+40,PLATE.y-20,'#8affa0',16,7);
    pop(W/2,250,(gapper?'ボールを呼び込んで逆方向へライナー！逆方向へ長打！ +':'呼び込んで軽打——逆方向へクリーンヒット！ +')+add,'#d6ffe0');
    if(combo>=2)pop(W/2,214,'コンボ x'+combo,'#ffd24d');
    if(combo>0&&combo%5===0)S.streak();
    msg=gapper?'ギリギリまで呼び込んで払うように打ち返した——逆方向の右中間を破る会心の長打！':'あわてず引きつけてバットを合わせ、逆方向へ強い打球——クリーンヒット！';
  } else {
    fails++; combo=0; msgOk=false; flash=1;flashCol='#ff5b5b';shake=7; S.bad();
    if(k==='early'){ flashCol='#ff8b3b'; msg='引っかけた…早く手を出して体が開き、引っ張り方向へ力ない転がり（凡打）'; pop(W/2,250,'引っかけ…凡打','#ffcf9a'); }
    else { msg='差し込まれた…呼び込み過ぎてバットが振り遅れ、詰まった当たりで内野へ（凡打）'; pop(W/2,250,'差し込まれ…凡打','#ffb0b0'); }
  }
  if(fails>=3){ state='over'; resultT=0; S.over(); if(score>best){best=score;localStorage.setItem('lt_best',best);} }
}

// ---------- input ----------
cv.addEventListener('pointerdown',e=>{e.preventDefault();swing();});
addEventListener('keydown',e=>{ if(e.repeat)return; if(e.code==='Space'||e.code==='Enter'||e.code==='ArrowRight'||e.code==='KeyF'||e.code==='KeyJ'){e.preventDefault();swing();} });

// ---------- particles ----------
function burst(x,y,c,n,sp){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=rnd(sp*0.3,sp);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:1,c});}}
function pop(x,y,txt,c){pops.push({x,y,txt,c,life:1});}

// ---------- update ----------
function update(dt){
  shake*=Math.pow(0.86,dt/16.7); if(shake<0.3)shake=0;
  flash*=Math.pow(0.9,dt/16.7);
  for(const p of parts){p.vx*=0.96;p.vy=p.vy*0.96+0.28;p.x+=p.vx*dt/16.7;p.y+=p.vy*dt/16.7;p.life-=dt/16.7*0.026;}
  parts=parts.filter(p=>p.life>0);
  for(const p of pops){p.y-=dt/16.7*0.5;p.life-=dt/16.7*0.02;}
  pops=pops.filter(p=>p.life>0);

  if(state!=='play'){ if(state==='over')resultT+=dt/1000; return; }
  if(phase==='hold'){ clock+=dt;
    if(!released && clock>=deadT){ released=true; relT=deadT; resolve('jammed'); }
    return; }
  if(phase==='result'){ resultT+=dt/1000; anim=Math.min(1,anim+dt/420);
    if(resultT>1.55) newPlay(); return; }
}

// ---------- render ----------
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function batter(x,y,sw){ // sw = swing progress 0..1
  ctx.fillStyle='rgba(0,0,0,0.22)';ctx.beginPath();ctx.ellipse(x,y+16,13,4,0,0,6.28);ctx.fill();
  ctx.save();ctx.translate(x,y);ctx.rotate(sw*0.5);
  ctx.fillStyle='#3aa0ff';rr(-8,-24,16,26,7);ctx.fill();
  ctx.fillStyle='#f2c9a0';ctx.beginPath();ctx.arc(0,-30,7.5,0,6.28);ctx.fill();
  // bat swings from up-behind to across
  const a=lerp(-2.2,0.5,easeOut(sw));
  ctx.strokeStyle='#c8993f';ctx.lineWidth=5;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(6,-14);ctx.lineTo(6+Math.cos(a)*34,-14+Math.sin(a)*34);ctx.stroke();
  ctx.restore();
}
function drawScene(){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#123a1f');g.addColorStop(0.5,'#0f5e34');g.addColorStop(1,'#0c4c2b');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  // opposite-field gap highlight (right-center) — where the reward lies
  ctx.fillStyle='rgba(140,255,170,0.05)';ctx.beginPath();ctx.moveTo(PLATE.x,PLATE.y);ctx.lineTo(760,120);ctx.lineTo(880,300);ctx.closePath();ctx.fill();
  // dirt around plate
  ctx.fillStyle='#6a4a30';ctx.beginPath();ctx.ellipse(PLATE.x,PLATE.y+14,150,80,0,0,6.28);ctx.fill();
  // home plate
  ctx.fillStyle='#eef0f2';ctx.beginPath();ctx.moveTo(PLATE.x-16,PLATE.y-8);ctx.lineTo(PLATE.x+16,PLATE.y-8);ctx.lineTo(PLATE.x+16,PLATE.y+2);ctx.lineTo(PLATE.x,PLATE.y+14);ctx.lineTo(PLATE.x-16,PLATE.y+2);ctx.closePath();ctx.fill();
}

function render(){
  ctx.save();
  if(shake>0)ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
  drawScene();

  if(state==='play'||state==='over'){
    // ball: travels in during hold; on result flies to the gap (hit) or dribbles (out)
    let b;
    if(phase==='hold'){ b=ballPos(clamp(clock/deadT,0,1)); }
    else {
      const cp=ballPos(clamp(relT/deadT,0,1)); const u=easeOut(anim);
      if(result==='hit'){ b={x:lerp(cp.x,820,u), y:lerp(cp.y,140,u)}; }                 // line drive to right-center gap
      else if(result==='early'){ b={x:lerp(cp.x,240,u), y:lerp(cp.y,PLATE.y+30,u)}; }    // rolled over to pull side
      else { b={x:lerp(cp.x,PLATE.x+120,u), y:lerp(cp.y,PLATE.y-70,u*0.6)}; }             // jammed flare
    }

    // batter swing anim
    let sw=0;
    if(phase==='result') sw=clamp(anim*1.4,0,1);
    else if(released) sw=1;
    batter(BAT.x,BAT.y,sw);

    // ball
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(b.x,b.y,7.5,0,6.28);ctx.fill();
    ctx.strokeStyle='#c33';ctx.lineWidth=1.1;ctx.beginPath();ctx.arc(b.x,b.y,7.5,0.4,2.2);ctx.stroke();
    // depth trail
    if(phase==='hold'){ ctx.strokeStyle='rgba(255,255,255,0.2)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(REL.x,REL.y);ctx.lineTo(b.x,b.y);ctx.stroke(); }

    // reward-lateness bar: "呼び込み"帯
    ctx.textAlign='center';
    if(state==='play'&&phase==='hold'){
      ctx.fillStyle='rgba(255,220,90,0.96)';ctx.font='bold 21px sans-serif';ctx.fillText('あわてるな！ ボールを“呼び込んで”逆方向へ払え',W/2,44);
      const bw=300,x=W/2-bw/2,y=62;
      ctx.fillStyle='rgba(255,255,255,0.15)';ctx.fillRect(x,y,bw,9);
      const gx0=x+bw*clamp(winStart()/deadT,0,1);
      const grad=ctx.createLinearGradient(gx0,0,x+bw,0);grad.addColorStop(0,'rgba(90,240,130,0.35)');grad.addColorStop(1,'rgba(120,255,150,0.8)');
      ctx.fillStyle=grad;ctx.fillRect(gx0,y,(x+bw)-gx0,9);
      ctx.fillStyle='#ff5b5b';ctx.fillRect(x+bw-2,y-3,3,15);
      ctx.fillStyle='rgba(255,120,110,0.9)';ctx.font='11px sans-serif';ctx.fillText('差し込まれる',x+bw,y+24);
      ctx.fillStyle='rgba(150,255,175,0.9)';ctx.fillText('呼び込み（引きつけるほど長打）',gx0+((x+bw)-gx0)/2,y+24);
      const px=x+bw*clamp(clock/deadT,0,1);
      ctx.fillStyle='#ffe14d';ctx.fillRect(px-2,y-4,4,17);
      ctx.fillStyle='rgba(255,255,255,0.55)';ctx.font='12px sans-serif';ctx.fillText('タップ / SPACE / → ＝ スイング（早いと引っかけ・呼び込み過ぎると差し込まれる）',W/2,H-26);
    }
  }

  for(const p of parts){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,3.2,0,6.28);ctx.fill();}
  ctx.globalAlpha=1;
  for(const p of pops){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.font='bold 21px sans-serif';ctx.textAlign='center';ctx.fillText(p.txt,p.x,p.y);}
  ctx.globalAlpha=1;

  // HUD
  ctx.textAlign='left';ctx.fillStyle='#fff';ctx.font='bold 26px sans-serif';ctx.fillText('SCORE '+score,20,36);
  ctx.textAlign='right';ctx.fillStyle='rgba(255,255,255,0.9)';ctx.font='14px sans-serif';ctx.fillText('安打 '+outs+'  Lv'+lvl,W-20,24);
  ctx.fillText('凡退',W-92,46);
  for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(W-60+i*20,41,7,0,6.28);ctx.fillStyle=i<fails?'#ff5b5b':'rgba(255,255,255,0.25)';ctx.fill();}
  if(combo>=2){ctx.textAlign='center';ctx.fillStyle='#ffd24d';ctx.font='bold 18px sans-serif';ctx.fillText('コンボ x'+combo,W/2,112);}

  if(state==='play'&&phase==='result'&&msg){ctx.textAlign='center';ctx.fillStyle=msgOk?'#9ff0b8':'#ffb38a';ctx.font='bold 15px sans-serif';ctx.fillText(msg,W/2,300);}

  if(state==='title'){
    ctx.fillStyle='rgba(4,8,4,0.83)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='bold 42px sans-serif';ctx.fillText('流し打ちの間',W/2,84);
    ctx.fillStyle='#ffd23e';ctx.font='bold 22px sans-serif';ctx.fillText('Let It Travel',W/2,120);
    ctx.fillStyle='rgba(255,255,255,0.92)';ctx.font='16px sans-serif';
    ctx.fillText('外角の球を“呼び込んで”逆方向へ払う流し打ち——引きつけるほど強い逆方向の打球になる打撃の間',W/2,176);
    ctx.fillStyle='rgba(255,255,255,0.66)';ctx.font='14px sans-serif';
    ctx.fillText('ボールを引きつけ、詰まる“寸前”の緑の帯でタップ/SPACE/→＝スイング。引きつけるほど逆方向へ長打',W/2,214);
    ctx.fillText('早く手を出す＝体が開いて引っかけ（引っ張りの力ない凡打）',W/2,238);
    ctx.fillText('呼び込み過ぎ＝振り遅れて差し込まれる（詰まった凡打）。ギリギリで払うほど大量加点＆コンボ',W/2,262);
    ctx.fillText('上級ほど球が速く引きつけの帯が短い。3凡退で交代',W/2,286);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で開始',W/2,352);
    ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='14px sans-serif';ctx.fillText('BEST '+best,W/2,384);
  }
  if(state==='over'){
    ctx.fillStyle='rgba(4,8,4,0.85)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#ff6b6b';ctx.font='bold 46px sans-serif';ctx.fillText('3凡退…交代',W/2,222);
    ctx.fillStyle='#fff';ctx.font='bold 40px sans-serif';ctx.fillText('SCORE '+score,W/2,290);
    ctx.fillStyle='rgba(255,255,255,0.85)';ctx.font='19px sans-serif';ctx.fillText('安打 '+outs+'   BEST '+best,W/2,330);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で もう一度',W/2,402);
  }

  if(flash>0.02){ctx.globalAlpha=flash*0.5;ctx.fillStyle=flashCol;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}
  ctx.restore();

  ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,0.4)';ctx.font='12px sans-serif';
  ctx.fillText('流し打ちの間：外角球を引きつけ、詰まる寸前の緑帯でスイング＝逆方向へ長打。早いと引っかけ・遅いと差し込まれ、3凡退で交代',W/2,H-8);
}

function frame(ts){let dt=ts-last;last=ts;if(dt>60)dt=60;if(dt<0)dt=0;update(dt);render();requestAnimationFrame(frame);}
requestAnimationFrame(frame);

// ---------- test hook ----------
window.__lt={
  start, swing:()=>swing(),
  get state(){return state;},
  get score(){return score;},
  get outs(){return outs;},
  get fails(){return fails;},
  get info(){return {state,phase,clock,deadT,win,winStart:winStart(),tough,released,relT,result,outs,fails,lvl,
    inWindow:(phase==='hold'&&clock>=winStart()&&clock<=deadT),canAct:(phase==='hold'&&!released)};}
};
})();
</script>
</body>
</html>
