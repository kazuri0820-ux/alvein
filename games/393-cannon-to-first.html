<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>深い所から一塁へ (Cannon to First)</title>
<style>
  html,body{margin:0;height:100%;background:#0a0d08;overflow:hidden;
    font-family:-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  #stage{position:relative;width:100vw;height:100vh;max-width:calc(100vh*1.5);max-height:calc(100vw/1.5);aspect-ratio:900/600;}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;border-radius:6px;}
</style>
</head>
<body>
<div id="wrap"><div id="stage"><canvas id="cv"></canvas></div></div>
<script>
(function(){
const W=900,H=600,cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let DPR=1;
function fit(){DPR=Math.min(2,window.devicePixelRatio||1);cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
fit();addEventListener('resize',fit);

// ---------- audio ----------
let AC=null;function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function tone(f,d,type,v,sweep){const a=ac();if(!a)return;const t=a.currentTime,o=a.createOscillator(),g=a.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(sweep)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+sweep),t+d);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v||0.2,t+0.008);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+0.02);}
function noise(d,v,hp){const a=ac();if(!a)return;const t=a.currentTime,n=Math.floor(a.sampleRate*d),buf=a.createBuffer(1,n,a.sampleRate),ch=buf.getChannelData(0);
  for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource();s.buffer=buf;
  const f=a.createBiquadFilter();f.type='highpass';f.frequency.value=hp||600;const g=a.createGain();g.gain.value=v||0.2;
  s.connect(f);f.connect(g);g.connect(a.destination);s.start(t);s.stop(t+d+0.02);}
const S={
  wind:()=>{tone(200,0.05,'sine',0.03);},
  fire:()=>{noise(0.05,0.16,700);tone(320,0.06,'square',0.09,-60);},
  good:()=>{[660,900,1180].forEach((f,i)=>setTimeout(()=>tone(f,0.11,'triangle',0.16),i*56));},
  big:()=>{[600,800,1000,1250].forEach((f,i)=>setTimeout(()=>tone(f,0.12,'triangle',0.17),i*80));},
  bad:()=>{noise(0.2,0.24,240);tone(150,0.24,'sawtooth',0.13,-50);},
  streak:()=>{[700,930,1170,1400].forEach((f,i)=>setTimeout(()=>tone(f,0.1,'triangle',0.16),i*60));},
  over:()=>{[440,330,247,175].forEach((f,i)=>setTimeout(()=>tone(f,0.3,'triangle',0.2),i*160));}
};

// ---------- geometry ----------
const HOME={x:452,y:476}, FIRST={x:686,y:356}, SECOND={x:452,y:196}, THIRD={x:218,y:356};
const SS={x:300,y:286};                    // you, fielded deep in the 5-6 hole
const R0={x:HOME.x+16,y:HOME.y-6};         // batter-runner sprinting to first
function runnerPos(u){ return {x:lerp(R0.x,FIRST.x-16,easeOut(u)), y:lerp(R0.y,FIRST.y+4,easeOut(u))}; }
function arc(a,b,u,h){ return {x:lerp(a.x,b.x,u), y:lerp(a.y,b.y,u)-h*Math.sin(Math.PI*u)}; }

// ---------- state ----------
let state='title', phase='charge', plays=0;
let score=0, combo=0, best=+(localStorage.getItem('cf_best')||0);
let outs=0, fails=0, lvl=1;   // outs = runners gunned down at first
let power=0, charging=false, chargeRate=0.145, bandLo=60, bandHi=82, tough=false, holdT=0;
let result=null, resultT=0, msg='', msgOk=false, anim=0, relPow=0, runU=0;
let shake=0, flash=0, flashCol='#fff', last=performance.now();
let parts=[], pops=[];

function rnd(a,b){return a+Math.random()*(b-a);}
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function lerp(a,b,u){return a+(b-a)*u;}
function easeOut(u){return 1-Math.pow(1-u,2);}

function reset(){state='title';score=0;combo=0;outs=0;fails=0;lvl=1;plays=0;result=null;parts=[];pops=[];}

function newPlay(){
  plays++; lvl=Math.min(7,1+Math.floor(outs/4));
  const c=72;                              // band centre (the throw that beats the runner)
  let hw=clamp(16-lvl*1.0,9,16);           // half-width of the sweet band, narrows with level
  tough=Math.random()<clamp(0.2+lvl*0.05,0.2,0.5);   // fast runner -> a narrower window
  if(tough)hw*=0.85;
  bandLo=c-hw; bandHi=c+hw;
  chargeRate=0.060+lvl*0.006;              // gauge fills faster at higher levels
  power=0; charging=false; holdT=0;
  phase='charge'; result=null; resultT=0; msg=''; msgOk=false; anim=0; relPow=0; runU=0;
  S.wind();
}
function start(){ if(!ac())ac(); if(AC&&AC.state==='suspended')AC.resume(); reset(); state='play'; newPlay(); }

function press(){
  if(state==='title'){start();return;}
  if(state==='over'){ if(resultT>0.4){reset();start();} return; }
  if(state!=='play'||phase!=='charge') return;
  charging=true;
}
function release(){
  if(state!=='play'||phase!=='charge'||!charging) return;
  charging=false; fire();
}
function fire(){
  relPow=power;
  if(power>=bandLo&&power<=bandHi){ resolve('laser'); }
  else if(power<bandLo){ resolve('weak'); }
  else { resolve('airmail'); }
}

function resolve(k){
  phase='result'; result=k; resultT=0; anim=0; runU=0;
  if(k==='laser'){
    outs++; combo++;
    const perfect=Math.abs(relPow-72)<=(bandHi-bandLo)*0.28;
    let add=Math.round((60+Math.round((1-Math.abs(relPow-72)/((bandHi-bandLo)/2||1))*150)+(tough?70:0))*(1+Math.min(9,combo-1)*0.14)); score+=add;
    S.fire(); setTimeout(S.good,120); if(perfect||tough)setTimeout(S.big,200);
    msgOk=true; flash=1;flashCol='#8affa0';shake=6; burst(FIRST.x,FIRST.y,'#8affa0',18,7);
    pop(W/2,250,(perfect?'糸を引くレーザービーム！深い所から刺した！ +':'強い送球で一塁へ——俊足を刺した！ +')+add,'#d6ffe0');
    if(combo>=2)pop(W/2,214,'コンボ x'+combo,'#ffd24d');
    if(combo>0&&combo%5===0)S.streak();
    msg=perfect?'三遊間の深い所から、伸びのある糸を引くようなレーザービーム——俊足の打者走者をきわどく一塁で刺した！':'深い所から強く正確な送球で、走り抜ける打者走者より先に一塁へ——好守備でアウト！';
  } else {
    fails++; combo=0; msgOk=false; flash=1;flashCol='#ff5b5b';shake=8; S.bad();
    if(k==='weak') msg='送球が弱い…深い所からの球威が足りずワンバウンドが伸びずショートし、一塁手が捌く間に俊足がセーフ（内野安打）';
    else msg='力み過ぎ…溜め過ぎて抜けた大暴走球、一塁手の頭上を越えて右翼へ転がり走者は二塁へ（悪送球）';
    pop(W/2,250,(k==='weak')?'弱い…内野安打':'暴投…セーフ＆進塁','#ffb0b0');
  }
  if(fails>=3){ state='over'; resultT=0; S.over(); if(score>best){best=score;localStorage.setItem('cf_best',best);} }
}

// ---------- input ----------
cv.addEventListener('pointerdown',e=>{e.preventDefault();press();});
cv.addEventListener('pointerup',e=>{e.preventDefault();release();});
cv.addEventListener('pointercancel',e=>{release();});
addEventListener('keydown',e=>{ if(e.repeat)return; if(e.code==='Space'||e.code==='Enter'||e.code==='ArrowUp'||e.code==='KeyF'){e.preventDefault();press();} });
addEventListener('keyup',e=>{ if(e.code==='Space'||e.code==='Enter'||e.code==='ArrowUp'||e.code==='KeyF'){e.preventDefault();release();} });

// ---------- particles ----------
function burst(x,y,c,n,sp){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=rnd(sp*0.3,sp);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:1,c});}}
function pop(x,y,txt,c){pops.push({x,y,txt,c,life:1});}

// ---------- update ----------
function update(dt){
  shake*=Math.pow(0.86,dt/16.7); if(shake<0.3)shake=0;
  flash*=Math.pow(0.9,dt/16.7);
  for(const p of parts){p.vx*=0.96;p.vy=p.vy*0.96+0.28;p.x+=p.vx*dt/16.7;p.y+=p.vy*dt/16.7;p.life-=dt/16.7*0.026;}
  parts=parts.filter(p=>p.life>0);
  for(const p of pops){p.y-=dt/16.7*0.5;p.life-=dt/16.7*0.02;}
  pops=pops.filter(p=>p.life>0);

  if(state!=='play'){ if(state==='over')resultT+=dt/1000; return; }
  if(phase==='charge'){ holdT+=dt;
    if(charging){ power=clamp(power+chargeRate*dt,0,100); if(power>=100){ charging=false; fire(); } }
    // the runner keeps sprinting while you set to throw
    runU=clamp(runU+dt/1500,0,1);
    return; }
  if(phase==='result'){ resultT+=dt/1000; anim=Math.min(1,anim+dt/460); runU=clamp(runU+dt/900,0,1); if(resultT>1.55) newPlay(); return; }
}

// ---------- render ----------
function drawScene(){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#12703f');g.addColorStop(0.5,'#0f5e34');g.addColorStop(1,'#0c4c2b');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#6a4a30';ctx.beginPath();ctx.moveTo(HOME.x,HOME.y+24);ctx.lineTo(FIRST.x+24,FIRST.y);ctx.lineTo(SECOND.x,SECOND.y-26);ctx.lineTo(THIRD.x-24,THIRD.y);ctx.closePath();ctx.fill();
  ctx.strokeStyle='rgba(230,210,150,0.5)';ctx.lineWidth=7;
  ctx.beginPath();ctx.moveTo(HOME.x,HOME.y);ctx.lineTo(FIRST.x,FIRST.y);ctx.lineTo(SECOND.x,SECOND.y);ctx.lineTo(THIRD.x,THIRD.y);ctx.closePath();ctx.stroke();
  for(const B of [FIRST,SECOND,THIRD]){ ctx.save();ctx.translate(B.x,B.y);ctx.rotate(0.785);ctx.fillStyle='#eef0f2';ctx.fillRect(-10,-10,20,20);ctx.restore(); }
  ctx.fillStyle='#eef0f2';ctx.beginPath();ctx.moveTo(HOME.x-13,HOME.y-7);ctx.lineTo(HOME.x+13,HOME.y-7);ctx.lineTo(HOME.x+13,HOME.y+2);ctx.lineTo(HOME.x,HOME.y+13);ctx.lineTo(HOME.x-13,HOME.y+2);ctx.closePath();ctx.fill();
}
function person(x,y,col,s,lean){s=s||1;lean=lean||0;
  ctx.save();ctx.translate(x,y);ctx.rotate(lean);
  ctx.fillStyle='rgba(0,0,0,0.2)';ctx.beginPath();ctx.ellipse(0,13*s,10*s,4*s,0,0,6.28);ctx.fill();
  ctx.fillStyle=col;ctx.beginPath();ctx.ellipse(0,-14*s,9*s,14*s,0,0,6.28);ctx.fill();
  ctx.fillStyle='#f0c9a0';ctx.beginPath();ctx.arc(0,-31*s,7*s,0,6.28);ctx.fill();
  ctx.restore();
}
function slider(x,y,col,lean){ ctx.save();ctx.translate(x,y);ctx.rotate(lean);
  ctx.fillStyle=col;ctx.beginPath();ctx.ellipse(0,-6,17,8,0,0,6.28);ctx.fill();
  ctx.fillStyle='#f0c9a0';ctx.beginPath();ctx.arc(15,-9,6.5,0,6.28);ctx.fill();
  ctx.strokeStyle=col;ctx.lineWidth=6;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(-8,-4);ctx.lineTo(-24,-1);ctx.stroke();ctx.restore(); }
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

function render(){
  ctx.save();
  if(shake>0)ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
  drawScene();

  if(state==='play'){
    // first baseman at the bag
    person(FIRST.x+20,FIRST.y-6,'#c85049',0.86,0);
    // runner sprinting to first
    const ru=(phase==='result')?clamp(runU,0,1):runU;
    const rp=runnerPos(ru); const sliding=ru>0.82;
    if(sliding) slider(rp.x,rp.y,'#2b6fd6',-0.35); else person(rp.x,rp.y,'#2b6fd6',0.98, 0.14);

    // you (SS) — winds up while charging
    person(SS.x,SS.y,'#2b6fd6',1.02, phase==='charge'&&charging?-0.2*(power/100):(phase==='result'?0.3:0));

    // ball
    let b;
    if(phase==='charge'){ b={x:SS.x+6,y:SS.y-10}; }
    else {
      const u=easeOut(anim);
      if(result==='laser'){ b=arc(SS,FIRST,u,20); }
      else if(result==='weak'){ const t2=Math.min(1,u*1.1); b=arc(SS,{x:FIRST.x-30,y:FIRST.y+18},t2,10); }  // short-hops in
      else { b=arc(SS,{x:FIRST.x+70,y:FIRST.y-70},u,10); }                                                    // airmailed over
    }
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(b.x,b.y,7,0,6.28);ctx.fill();
    ctx.strokeStyle='#c33';ctx.lineWidth=1;ctx.beginPath();ctx.arc(b.x,b.y,7,0.4,2.2);ctx.stroke();

    // power gauge (vertical, right side)
    const gx=W-70,gy=140,gh=300,gw=26;
    ctx.fillStyle='rgba(255,255,255,0.14)';rr(gx,gy,gw,gh,8);ctx.fill();
    // band (green safe zone)
    const by=gy+gh*(1-bandHi/100), bhh=gh*((bandHi-bandLo)/100);
    ctx.fillStyle='rgba(120,255,150,0.55)';rr(gx,by,gw,bhh,4);ctx.fill();
    ctx.fillStyle='rgba(120,255,150,0.9)';rr(gx,gy+gh*(1-72/100)-1.5,gw,3,1);ctx.fill();
    // fill
    const fh=gh*(power/100);
    ctx.fillStyle=charging?'#ffe14d':'rgba(255,225,77,0.7)';rr(gx,gy+gh-fh,gw,fh,6);ctx.fill();
    ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,0.6)';ctx.font='11px sans-serif';
    ctx.fillText('強',gx+gw/2,gy-6);ctx.fillText('弱',gx+gw/2,gy+gh+16);ctx.fillText('球威',gx+gw/2,gy+gh+32);

    // banner
    if(phase==='charge'){
      ctx.textAlign='center';ctx.fillStyle='rgba(255,220,90,0.96)';ctx.font='bold 21px sans-serif';
      ctx.fillText(charging?'離すな！ 緑の球威で放て！':'深い所から一塁へ——押し続けて球威を溜め、緑帯で離せ',W/2,44);
      ctx.fillStyle='rgba(255,255,255,0.55)';ctx.font='12px sans-serif';ctx.fillText('長押し（タップ長押し/SPACE）で溜め、緑帯で離す＝レーザービーム。弱い＝ショート／溜め過ぎ＝暴投',W/2,H-16);
    }
  }

  for(const p of parts){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,3.2,0,6.28);ctx.fill();}
  ctx.globalAlpha=1;
  for(const p of pops){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.font='bold 21px sans-serif';ctx.textAlign='center';ctx.fillText(p.txt,p.x,p.y);}
  ctx.globalAlpha=1;

  // HUD
  ctx.textAlign='left';ctx.fillStyle='#fff';ctx.font='bold 26px sans-serif';ctx.fillText('SCORE '+score,20,36);
  ctx.textAlign='right';ctx.fillStyle='rgba(255,255,255,0.9)';ctx.font='14px sans-serif';ctx.fillText('アウト '+outs+'  Lv'+lvl,W-104,24);
  ctx.fillText('失敗',W-176,46);
  for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(W-144+i*20,41,7,0,6.28);ctx.fillStyle=i<fails?'#ff5b5b':'rgba(255,255,255,0.25)';ctx.fill();}
  if(combo>=2){ctx.textAlign='center';ctx.fillStyle='#ffd24d';ctx.font='bold 18px sans-serif';ctx.fillText('コンボ x'+combo,W/2,112);}

  if(state==='play'&&phase==='result'&&msg){ctx.textAlign='center';ctx.fillStyle=msgOk?'#9ff0b8':'#ff9a9a';ctx.font='bold 15px sans-serif';ctx.fillText(msg,W/2,300);}

  if(state==='title'){
    ctx.fillStyle='rgba(4,8,4,0.84)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='bold 40px sans-serif';ctx.fillText('深い所から一塁へ',W/2,80);
    ctx.fillStyle='#ffd23e';ctx.font='bold 22px sans-serif';ctx.fillText('Cannon to First',W/2,116);
    ctx.fillStyle='rgba(255,255,255,0.92)';ctx.font='16px sans-serif';
    ctx.fillText('三遊間の深い所でゴロを捌いた遊撃手として、球威を溜めて一塁へレーザービーム——俊足の打者走者を刺せ',W/2,172);
    ctx.fillStyle='rgba(255,255,255,0.66)';ctx.font='14px sans-serif';
    ctx.fillText('長押し（タップ長押し/SPACE/↑）で右の“球威ゲージ”を溜め、緑帯（適正な球威）で離す＝強く正確な送球',W/2,212);
    ctx.fillText('緑帯ど真ん中で放つほど糸を引くレーザービームで大量加点＆コンボ',W/2,236);
    ctx.fillText('球威が弱い（帯の下で離す）＝ショートして内野安打／溜め過ぎ（帯の上・振り切り）＝頭上を越える暴投',W/2,260);
    ctx.fillText('俊足の走者（tough）ほど帯が狭い。上級ほどゲージが速い。3失敗で交代',W/2,284);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で開始',W/2,350);
    ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='14px sans-serif';ctx.fillText('BEST '+best,W/2,382);
  }
  if(state==='over'){
    ctx.fillStyle='rgba(4,8,4,0.86)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#ff6b6b';ctx.font='bold 46px sans-serif';ctx.fillText('3失敗…交代',W/2,222);
    ctx.fillStyle='#fff';ctx.font='bold 40px sans-serif';ctx.fillText('SCORE '+score,W/2,290);
    ctx.fillStyle='rgba(255,255,255,0.85)';ctx.font='19px sans-serif';ctx.fillText('アウト '+outs+'   BEST '+best,W/2,330);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で もう一度',W/2,402);
  }

  if(flash>0.02){ctx.globalAlpha=flash*0.5;ctx.fillStyle=flashCol;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}
  ctx.restore();

  ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,0.4)';ctx.font='12px sans-serif';
  ctx.fillText('深い所から一塁へ：球威を溜めて緑帯で離す＝レーザービームで一塁封殺。弱いとショート・溜め過ぎは暴投、3失敗で交代',W/2,H-8);
}

function frame(ts){let dt=ts-last;last=ts;if(dt>60)dt=60;if(dt<0)dt=0;update(dt);render();requestAnimationFrame(frame);}
requestAnimationFrame(frame);

// ---------- test hook ----------
window.__cf={
  start, press:()=>press(), release:()=>release(),
  get state(){return state;},
  get score(){return score;},
  get outs(){return outs;},
  get fails(){return fails;},
  get info(){return {state,phase,power,charging,bandLo,bandHi,tough,result,outs,fails,lvl,
    inBand:(phase==='charge'&&power>=bandLo&&power<=bandHi),canAct:(phase==='charge')};}
};
})();
</script>
</body>
</html>
