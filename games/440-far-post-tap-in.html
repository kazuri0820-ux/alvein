<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ファーで詰めろ (Far-Post Tap-In)</title>
<style>
  html,body{margin:0;padding:0;background:#08140d;overflow:hidden;font-family:'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif;-webkit-user-select:none;user-select:none;touch-action:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 26%,#1a3a22,#050d08 72%);}
  #stage{position:relative;width:min(100vw,calc(100vh*1.5));aspect-ratio:900/600;max-width:900px;box-shadow:0 10px 60px rgba(0,0,0,.6);border-radius:8px;overflow:hidden;}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;}
</style>
</head>
<body>
<div id="wrap"><div id="stage"><canvas id="cv"></canvas></div></div>
<script>
(function(){
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const W=900,H=600;let DPR=Math.min(2,window.devicePixelRatio||1);
function fit(){const r=cv.getBoundingClientRect();DPR=Math.min(2,window.devicePixelRatio||1);cv.width=Math.round(r.width*DPR);cv.height=Math.round(r.height*DPR);ctx.setTransform(cv.width/W,0,0,cv.height/H,0,0);}
new ResizeObserver(fit).observe(cv);fit();

// ---------- audio ----------
let AC=null;function actx(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function tone(f,d,type,v,sweep){const a=actx();if(!a)return;const o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.value=f;if(sweep)o.frequency.linearRampToValueAtTime(sweep,a.currentTime+d);g.gain.value=0.0001;g.gain.exponentialRampToValueAtTime(v||0.2,a.currentTime+0.008);g.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+d);o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+d+0.02);}
function noise(d,v,hp){const a=actx();if(!a)return;const n=a.createBufferSource(),b=a.createBuffer(1,a.sampleRate*d,a.sampleRate),dt=b.getChannelData(0);for(let i=0;i<dt.length;i++)dt[i]=Math.random()*2-1;n.buffer=b;const f=a.createBiquadFilter();f.type='highpass';f.frequency.value=hp||800;const g=a.createGain();g.gain.value=0.0001;g.gain.exponentialRampToValueAtTime(v||0.2,a.currentTime+0.01);g.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+d);n.connect(f);f.connect(g);g.connect(a.destination);n.start();n.stop(a.currentTime+d+0.02);}
const S={
  deliver(){tone(520,0.09,'sine',0.12,720);noise(0.04,0.06,700);},   // cross whipped in
  tapin(){tone(300,0.05,'square',0.16,180);},                        // toe-poke contact
  goal(){tone(520,0.1,'triangle',0.2);setTimeout(function(){tone(720,0.14,'triangle',0.22);},110);setTimeout(function(){tone(960,0.18,'triangle',0.2);},230);},
  roar(){noise(0.5,0.14,300);},
  whiff(){noise(0.14,0.2,900);tone(280,0.16,'sawtooth',0.1,170);},   // swung early, air
  clear(){tone(300,0.16,'square',0.14,150);noise(0.1,0.14,500);},    // defender hoofs it away
  combo(n){tone(600+Math.min(n,8)*70,0.12,'triangle',0.16);},
  over(){tone(330,0.3,'sine',0.2,160);setTimeout(function(){tone(220,0.5,'sine',0.2,110);},180);},
  start(){tone(440,0.1,'triangle',0.18);setTimeout(function(){tone(660,0.16,'triangle',0.2);},110);},
};

function clamp(v,a,b){return v<a?a:v>b?b:v;}
function rnd(a,b){return a+Math.random()*(b-a);}

// ---------- state ----------
let state='title';
let outs=0,fails=0,score=0,combo=0,lvl=1;   // outs = far-post tap-ins scored
let best=0;try{best=parseInt(localStorage.getItem('fp_best')||'0')||0;}catch(e){}
const TARGET=26;

let phase='wind';  // wind | watch(ball crossing the box) | result
let pt=0, clock=0;
let arriveT=900, w=180, effW=180, deadEnd=1300, tough=false;
let decided=false, result='', runClock=0, quality=0;
let parts=[];
let shakeT=0,flash=0;
let msg='',msgCol='#fff',msgT=0;
// scene
const GOAL=[450,58];                    // goal centre (mouth at top)
const NEARP=[398,150], FARP=[540,150];  // near / far post at the goal line
const CROSSER=[150,300];                // winger who whips the cross from the near byline
const START=[602,262];                  // striker waiting at the far post
let ballX=NEARP[0],ballY=NEARP[1], youX=START[0],youY=START[1], keeperX=GOAL[0]-34, defAdv=0, netShake=0;

function reset(){outs=0;fails=0;score=0;combo=0;lvl=1;parts=[];}
function newPlay(){
  lvl=Math.min(7,1+Math.floor(outs/4));
  arriveT=clamp(1000-lvl*46,700,1000);
  w=clamp(200-lvl*16,100,200);
  tough=Math.random()<clamp(0.2+lvl*0.05,0.2,0.5);
  effW=tough?w*0.82:w;
  deadEnd=arriveT+effW+300;
  phase='wind';pt=0;clock=0;decided=false;result='';runClock=0;quality=0;
  ballX=CROSSER[0];ballY=CROSSER[1];youX=START[0];youY=START[1];keeperX=GOAL[0]-34;defAdv=0;netShake=0;
}
function startGame(){reset();state='play';newPlay();S.start();}

function burst(x,y,col,n,sp){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=rnd(0.4,1)*(sp||3);parts.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:1,col:col,r:rnd(2,5)});}}

// ball position during the cross (near post -> far post over arriveT)
function crossPos(c){const u=clamp(c/arriveT,0,1);return [NEARP[0]+(FARP[0]-NEARP[0])*u, NEARP[1]+(FARP[1]-NEARP[1])*u - Math.sin(u*Math.PI)*10];}

function resolve(kind){
  decided=true;result=kind;runClock=clock;
  if(kind==='goal'){
    outs++;combo++;
    quality=clamp(1-Math.abs(clock-arriveT)/effW,0,1);
    const cm=1+Math.min(combo-1,6)*0.14;
    const add=Math.round((100+quality*130)*cm)*Math.max(1,lvl);
    score+=add;lastAdd=add;
    S.tapin();setTimeout(S.goal,120);setTimeout(S.roar,300);if(combo>1)setTimeout(function(){S.combo(combo);},420);
    flash=0.28;netShake=1;burst(FARP[0],FARP[1],'#5affa0',13,3);
    msg=(quality>0.72?'ドンピシャの詰め！ ファーで押し込んだ！':'ファーで詰めた！ ゴール！')+'  +'+add;msgCol='#5affa0';msgT=1;
  }else{
    combo=0;fails++;
    if(result==='early'){S.whiff();}else{S.clear();}
    flash=0.30;shakeT=0.7;
    if(result==='early')msg='振り抜くのが早い！ ボールが来る前で空振り';
    else msg='詰めが遅い！ 戻ったDFにクリアされた';
    msgCol='#ff6a6a';msgT=1;
  }
  phase='result';pt=0;
}
let lastAdd=0;

function tapIn(){
  if(state!=='play'||phase!=='watch'||decided)return;
  const c=clock;
  if(c<arriveT-effW)resolve('early');
  else resolve('goal');
}

// ---------- input ----------
function act(){if(!AC)actx();if(state==='title'){startGame();return;}if(state==='over'){startGame();return;}tapIn();}
cv.addEventListener('mousedown',function(e){e.preventDefault();act();});
cv.addEventListener('touchstart',function(e){e.preventDefault();act();},{passive:false});
window.addEventListener('keydown',function(e){
  if(e.code==='Space'||e.code==='ArrowUp'||e.code==='Enter'||e.code==='KeyJ'){e.preventDefault();act();}
});

// ---------- update ----------
let last=0;
function lerp(a,b,t){return [a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t];}
function update(dt){
  if(flash>0)flash=Math.max(0,flash-dt/300);
  if(shakeT>0)shakeT=Math.max(0,shakeT-dt/320);
  if(msgT>0)msgT=Math.max(0,msgT-dt/1500);
  if(netShake>0)netShake=Math.max(0,netShake-dt/500);
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.x+=p.vx;p.y+=p.vy;p.vy+=0.16;p.life-=dt/640;if(p.life<=0)parts.splice(i,1);}
  if(state!=='play')return;
  pt+=dt;
  if(phase==='wind'){
    if(pt>=460){phase='watch';pt=0;clock=0;S.deliver();}
  }else if(phase==='watch'){
    clock+=dt;
    // ball flies across the goalmouth toward the far post
    const bp=crossPos(clock);ballX=bp[0];ballY=bp[1];
    if(clock>=arriveT+effW&&!decided)resolve('late');
  }else if(phase==='result'){
    if(result==='goal'){
      // striker lunges to the far post and taps the crossing ball into the net
      const yp=lerp(START,[FARP[0]+6,FARP[1]+8],clamp(pt/220,0,1)); youX=yp[0];youY=yp[1];
      // ball redirected into the goal
      const bp=lerp([FARP[0],FARP[1]],[GOAL[0]+18,GOAL[1]+4],clamp(pt/240,0,1)); ballX=bp[0];ballY=bp[1];
    }else if(result==='early'){
      // striker swings early at empty air; ball keeps crossing and rolls away
      const yp=lerp(START,[FARP[0]+6,FARP[1]+8],clamp(pt/200,0,1)); youX=yp[0];youY=yp[1];
      const bp=crossPos(arriveT + pt*0.6); ballX=bp[0];ballY=Math.min(FARP[1]+2,bp[1]); if(pt>200){ballX=FARP[0]+ (pt-200)*0.22;}
    }else{ // late: a recovering defender slides across the far post and hoofs it clear
      defAdv=clamp(pt/240,0,1);
      const bp=lerp([FARP[0],FARP[1]],[FARP[0]+120,FARP[1]-60],clamp((pt-160)/300,0,1)); if(pt>160){ballX=bp[0];ballY=bp[1];}
    }
    if(pt>=1180){
      if(fails>=3){state='over';best=Math.max(best,score);try{localStorage.setItem('fp_best',String(best));}catch(e){}S.over();}
      else if(outs>=TARGET){state='over';best=Math.max(best,score);try{localStorage.setItem('fp_best',String(best));}catch(e){}S.goal();}
      else newPlay();
    }
  }
}

// ---------- render ----------
function roundRect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

function drawField(){
  for(let i=0;i<9;i++){ctx.fillStyle=i%2?'#2b6b3d':'#256036';ctx.fillRect(0,i*(H/9),W,H/9);}
  // goal frame + net at top
  const ns=netShake>0?Math.sin(pt/30)*netShake*3:0;
  ctx.strokeStyle='rgba(255,255,255,.9)';ctx.lineWidth=5;
  ctx.strokeRect(GOAL[0]-72,30,144,32);
  // net hatching
  ctx.save();ctx.strokeStyle='rgba(255,255,255,.28)';ctx.lineWidth=1;
  for(let x=GOAL[0]-70;x<=GOAL[0]+70;x+=10){ctx.beginPath();ctx.moveTo(x,32);ctx.lineTo(x+ns,60);ctx.stroke();}
  for(let y=33;y<=60;y+=8){ctx.beginPath();ctx.moveTo(GOAL[0]-70,y);ctx.lineTo(GOAL[0]+70,y);ctx.stroke();}
  ctx.restore();
  // 6-yard box + penalty arc hint
  ctx.strokeStyle='rgba(255,255,255,.4)';ctx.lineWidth=2;ctx.strokeRect(300,62,300,96);
  ctx.strokeStyle='rgba(255,255,255,.28)';ctx.strokeRect(210,62,480,210);
  // goal-line
  ctx.strokeStyle='rgba(255,255,255,.5)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,62);ctx.lineTo(W,62);ctx.stroke();
  // near/far post markers on the line
  ctx.fillStyle='rgba(255,255,255,.5)';ctx.font='11px sans-serif';ctx.textAlign='center';
  ctx.fillText('ニア',NEARP[0],150);
  // far-post spotlight (where you attack)
  const fpg=(phase==='watch'&&!decided&&clock>=arriveT-effW);
  ctx.fillStyle=fpg?'rgba(90,255,160,.28)':'rgba(255,225,120,.16)';
  ctx.beginPath();ctx.ellipse(FARP[0],FARP[1]+6,40,20,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=fpg?'#5affa0':'rgba(255,225,120,.9)';ctx.fillText('ファー',FARP[0],FARP[1]+42);
}

function person(x,y,col,glow,lean){
  ctx.save();ctx.translate(x,y);if(lean)ctx.rotate(lean);
  if(glow>0){ctx.strokeStyle='rgba(90,255,160,'+glow+')';ctx.lineWidth=4;ctx.beginPath();ctx.arc(0,-18,26,0,Math.PI*2);ctx.stroke();}
  ctx.fillStyle='rgba(0,0,0,.26)';ctx.beginPath();ctx.ellipse(0,4,14,5,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#222';ctx.fillRect(-8,-4,7,22);ctx.fillRect(1,-4,7,22);
  ctx.fillStyle=col;ctx.fillRect(-11,-30,22,28);
  ctx.fillStyle='#f0c9a0';ctx.beginPath();ctx.arc(0,-40,8,0,Math.PI*2);ctx.fill();
  ctx.restore();
}

function drawScene(){
  drawField();
  // keeper — committed toward the near post, beaten by the cross to the far side
  let kx=keeperX; if(phase==='watch')kx=GOAL[0]-34 - clamp(clock/arriveT,0,1)*20;
  person(kx,86,'#e9d84a',0,0);
  // recovering defender appears at the far post on a late tap-in
  if(phase==='result'&&result==='late'){person(FARP[0]+defAdv*10,FARP[1]-6+defAdv*4,'#c0343a',0,-0.3-defAdv*0.4);}
  // crosser (teammate) on the near byline — whips it in during the wind
  let clean=0; if(phase==='wind')clean=-0.2+clamp(pt/460,0,1)*0.6;
  person(CROSSER[0],CROSSER[1],'#2f6fd0',0,clean);
  // you (striker) at the far post — glows in the tap-in window
  const win=(phase==='watch'&&!decided&&clock>=arriveT-effW);
  person(youX,youY,'#e8d24a',win?1:0,(phase==='result'&&result==='goal')?0.4:0);
  // ball with a short motion trail while crossing
  if(phase==='watch'){const bp=crossPos(Math.max(0,clock-70));ctx.strokeStyle='rgba(255,255,255,.35)';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(bp[0],bp[1]);ctx.lineTo(ballX,ballY);ctx.stroke();}
  ctx.fillStyle='rgba(0,0,0,.2)';ctx.beginPath();ctx.ellipse(ballX,ballY+7,7,3,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(ballX,ballY,7,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#111';ctx.beginPath();ctx.arc(ballX,ballY,2.6,0,Math.PI*2);ctx.fill();
}

function drawTimingBar(){
  if(state!=='play')return;
  const mx=180,mw=540,my=560,mh=18;
  roundRect(mx,my,mw,mh,9);ctx.fillStyle='rgba(0,0,0,.45)';ctx.fill();
  const gx0=mx+mw*clamp((arriveT-effW)/deadEnd,0,1), gx1=mx+mw*clamp((arriveT+effW)/deadEnd,0,1);
  const gg=ctx.createLinearGradient(gx0,0,gx1,0);gg.addColorStop(0,'rgba(90,220,150,.4)');gg.addColorStop(0.5,'rgba(60,255,150,.9)');gg.addColorStop(1,'rgba(90,220,150,.4)');
  ctx.fillStyle=gg;ctx.fillRect(gx0,my,gx1-gx0,mh);
  ctx.fillStyle='rgba(210,70,70,.28)';ctx.fillRect(mx,my,gx0-mx,mh);
  roundRect(mx,my,mw,mh,9);ctx.strokeStyle='rgba(255,255,255,.4)';ctx.lineWidth=1.5;ctx.stroke();
  ctx.font='11px sans-serif';ctx.textAlign='left';ctx.fillStyle='#ff9a9a';ctx.fillText('早い＝空振り',mx+4,my-6);
  ctx.textAlign='center';ctx.fillStyle='#aaffcf';ctx.fillText('ファーに来た“今”で詰めろ！',(gx0+gx1)/2,my-6);
  ctx.textAlign='right';ctx.fillStyle='#ff9a9a';ctx.fillText('遅い＝クリアされる',mx+mw-4,my-6);
  if(phase==='watch'||phase==='result'){
    const cc=(phase==='watch')?clock:runClock;
    const px=mx+mw*clamp((result==='late'?arriveT+effW:cc)/deadEnd,0,1);
    ctx.fillStyle=(phase==='result')?(result==='goal'?'#5affa0':'#ff6a6a'):'#fff';
    ctx.fillRect(px-2,my-5,4,mh+10);
  }
}

function drawHUD(){
  ctx.textAlign='left';ctx.textBaseline='alphabetic';
  ctx.font='bold 20px sans-serif';ctx.fillStyle='#fff';
  ctx.fillText('ゴール '+outs+' / '+TARGET,20,32);
  ctx.font='14px sans-serif';ctx.fillStyle='#ffb14a';ctx.fillText('失敗 '+fails+' / 3',20,54);
  ctx.textAlign='right';
  ctx.font='bold 20px sans-serif';ctx.fillStyle='#ffe08a';ctx.fillText('SCORE '+score,W-20,32);
  ctx.font='13px sans-serif';ctx.fillStyle='#bfe';ctx.fillText('BEST '+Math.max(best,score)+'   Lv.'+lvl,W-20,52);
  if(combo>1){ctx.textAlign='center';ctx.font='bold 20px sans-serif';ctx.fillStyle='#5affa0';ctx.fillText(combo+' 連続ゴール!',450,320);}
  if(phase==='watch'&&!decided){ctx.textAlign='center';ctx.font='bold 15px sans-serif';ctx.fillStyle='#ffe08a';ctx.fillText('クロスがファーポストに届く“その瞬間”に詰めろ！',450,300);}
}

function drawMsg(){
  if(msgT<=0)return;
  ctx.save();ctx.globalAlpha=clamp(msgT*1.4,0,1);
  ctx.textAlign='center';ctx.font='bold 24px sans-serif';
  ctx.fillStyle='rgba(0,0,0,.6)';roundRect(450-290,360,580,44,10);ctx.fill();
  ctx.fillStyle=msgCol;ctx.fillText(msg,450,390);
  ctx.restore();
}

function drawTitle(){
  drawField();person(CROSSER[0],CROSSER[1],'#2f6fd0',0,0);person(START[0],START[1],'#e8d24a',0,0);person(GOAL[0]-34,86,'#e9d84a',0,0);
  ctx.save();ctx.textAlign='center';
  ctx.fillStyle='rgba(0,0,0,.66)';roundRect(96,96,708,404,16);ctx.fill();
  ctx.fillStyle='#fff';ctx.font='bold 34px sans-serif';ctx.fillText('ファーで詰めろ',450,152);
  ctx.font='18px sans-serif';ctx.fillStyle='#9fe0bf';ctx.fillText('Far-Post Tap-In',450,182);
  ctx.font='16px sans-serif';ctx.fillStyle='#e6fcef';
  const lines=[
    'あなたはファーポストに詰めるストライカー。',
    '味方のクロスがゴール前を横切り、ニアを抜けてファーへ流れてくる。',
    'ボールがファーポストに届く“その瞬間”に詰めて押し込め！',
    '早く振ると＝ボールが来る前で空振り。',
    '詰めが遅いと＝戻ったDFにクリアされる。',
    'タップ / クリック / SPACE で詰める。26ゴールで達成、3失敗で終了。',
  ];
  for(let i=0;i<lines.length;i++)ctx.fillText(lines[i],450,226+i*30);
  ctx.fillStyle='#ffe08a';ctx.font='bold 22px sans-serif';
  ctx.fillText('タップ / SPACE でスタート',450,476);
  ctx.restore();
}

function drawOver(){
  drawField();
  ctx.save();ctx.textAlign='center';
  ctx.fillStyle='rgba(0,0,0,.66)';roundRect(190,150,520,300,16);ctx.fill();
  const w2=outs>=TARGET;
  ctx.fillStyle=w2?'#5affa0':'#ff8a5a';ctx.font='bold 34px sans-serif';
  ctx.fillText(w2?'ファーの鬼！':'詰め切れず…',450,222);
  ctx.fillStyle='#fff';ctx.font='20px sans-serif';
  ctx.fillText('ゴール '+outs+' / '+TARGET,450,270);
  ctx.fillText('スコア '+score,450,304);
  ctx.fillStyle='#ffe08a';ctx.fillText('ベスト '+Math.max(best,score),450,336);
  ctx.fillStyle='#9fe0bf';ctx.font='bold 20px sans-serif';
  ctx.fillText('タップ / SPACE でもう一度',450,404);
  ctx.restore();
}

function render(){
  ctx.save();
  if(shakeT>0){const s=shakeT*7;ctx.translate(rnd(-s,s),rnd(-s,s));}
  if(state==='title'){drawTitle();}
  else if(state==='over'){drawOver();}
  else{
    drawScene();
    drawTimingBar();
    drawHUD();
    drawMsg();
  }
  for(const p of parts){ctx.globalAlpha=clamp(p.life,0,1);ctx.fillStyle=p.col;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();}
  ctx.globalAlpha=1;
  ctx.restore();
  if(flash>0){ctx.fillStyle='rgba(255,255,255,'+(flash*0.5)+')';ctx.fillRect(0,0,W,H);}
}

function frame(ts){let dt=ts-last;last=ts;if(dt>60)dt=60;if(dt<0)dt=0;update(dt);render();requestAnimationFrame(frame);}
requestAnimationFrame(frame);

// ---------- test hook ----------
window.__fp={
  start:startGame,
  run:tapIn,
  get state(){return state;},
  get outs(){return outs;},
  get fails(){return fails;},
  get score(){return score;},
  get info(){return {state:state,phase:phase,clock:clock,arriveT:arriveT,w:w,effW:effW,deadEnd:deadEnd,tough:tough,decided:decided,result:result,quality:quality,outs:outs,fails:fails,lvl:lvl,inWindow:(clock>=arriveT-effW&&clock<arriveT+effW),canAct:(state==='play'&&phase==='watch'&&!decided)};}
};
})();
</script>
</body>
</html>
