<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>キーパー・リフレックス — Keeper Reflex</title>
<style>
  :root{--night:#071a2e;--pitch:#0e5f34;--pitch-l:#12793f;--chalk:#eaf3ec;--gold:#ffcf3a;
    --hot:#ff5a3c;--cyan:#3ae8cf;--ink:#06210f;--glove:#3ae8cf;}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:#04121f;font-family:"Arial Narrow","Roboto Condensed",system-ui,sans-serif;color:var(--chalk);
    display:flex;align-items:center;justify-content:center;overflow:hidden;-webkit-user-select:none;user-select:none;touch-action:manipulation;}
  #stage{position:relative;width:min(100vw,calc(100vh*1.5));aspect-ratio:3/2;max-height:100vh;
    box-shadow:0 30px 80px rgba(0,0,0,.6);overflow:hidden;background:#0e5f34;}
  canvas{display:block;width:100%;height:100%}
  #hud{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;padding:clamp(6px,1.4vw,14px);gap:8px;pointer-events:none;align-items:flex-start;}
  .board{background:rgba(4,10,18,.72);backdrop-filter:blur(6px);border:1px solid rgba(58,232,207,.35);
    border-radius:10px;padding:6px clamp(10px,1.6vw,18px);display:flex;flex-direction:column;line-height:1;}
  .board .label{font-size:clamp(9px,1.3vw,12px);letter-spacing:.2em;text-transform:uppercase;color:var(--cyan);opacity:.9}
  .board .value{font-family:"Courier New",monospace;font-weight:700;font-size:clamp(20px,4.2vw,36px);font-variant-numeric:tabular-nums;color:var(--chalk);}
  #lives{font-size:clamp(20px,4.4vw,34px);letter-spacing:2px}
  #msg{position:absolute;top:44%;left:0;right:0;text-align:center;pointer-events:none;font-weight:900;letter-spacing:.03em;
    text-transform:uppercase;font-size:clamp(30px,8vw,72px);color:#fff;opacity:0;transition:opacity .14s;
    text-shadow:0 4px 0 rgba(0,0,0,.35),0 0 30px currentColor;}
  #hint{position:absolute;bottom:0;left:0;right:0;text-align:center;padding:8px 12px calc(9px + env(safe-area-inset-bottom));
    font-size:clamp(12px,2.2vw,17px);letter-spacing:.04em;color:var(--chalk);background:linear-gradient(transparent,rgba(4,10,18,.72));pointer-events:none;}
  #hint b{color:var(--cyan)}
  #overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(10px,2vw,20px);
    text-align:center;padding:20px;background:radial-gradient(120% 90% at 50% 25%,rgba(7,26,46,.5),rgba(4,18,31,.92));backdrop-filter:blur(3px);z-index:5;transition:opacity .4s;}
  #overlay.hidden{opacity:0;pointer-events:none}
  #overlay h1{font-size:clamp(32px,9vw,80px);font-weight:900;letter-spacing:.02em;line-height:.9;text-transform:uppercase;color:var(--chalk);
    text-shadow:0 6px 0 rgba(0,0,0,.35),0 0 40px rgba(58,232,207,.4);}
  #overlay h1 span{display:block;color:var(--gold);font-size:.5em;letter-spacing:.22em}
  #overlay p{max-width:34ch;font-size:clamp(14px,2.6vw,19px);line-height:1.45;opacity:.92}
  #playBtn{pointer-events:auto;cursor:pointer;border:none;border-radius:100px;padding:clamp(12px,2vw,18px) clamp(30px,6vw,56px);
    font-family:inherit;font-weight:900;font-size:clamp(18px,3.4vw,26px);letter-spacing:.12em;text-transform:uppercase;color:var(--ink);
    background:linear-gradient(180deg,var(--cyan),#12b79c);box-shadow:0 8px 0 #0a6a5a,0 14px 30px rgba(0,0,0,.5);transition:transform .08s,box-shadow .08s;}
  #playBtn:active{transform:translateY(5px);box-shadow:0 3px 0 #0a6a5a}
  #playBtn:focus-visible{outline:3px solid var(--hot);outline-offset:4px}
  .sub{font-size:clamp(11px,2vw,14px);letter-spacing:.2em;text-transform:uppercase;color:var(--cyan);opacity:.85}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div id="stage">
  <canvas id="c"></canvas>
  <div id="hud">
    <div class="board"><span class="label">Saves</span><span class="value" id="score">0</span></div>
    <div class="board" style="text-align:center"><span class="label">Streak</span><span class="value" id="streak">0</span></div>
    <div class="board" style="text-align:right"><span class="label">Lives</span><span class="value" id="lives">❤❤❤</span></div>
  </div>
  <div id="msg"></div>
  <div id="hint">ボールの飛ぶ<b>ゾーン</b>をタップ / 矢印キーで移動して止めろ！</div>
  <div id="overlay">
    <div class="sub">Soccer · Reflex</div>
    <h1>キーパー<span>Reflex</span></h1>
    <p>シュートの狙いを読め。ボールが飛ぶ<b style="color:var(--cyan)">ゾーンをタップ</b>（矢印キーでも移動可）してセーブ。3失点でゲームオーバー。連続セーブを狙え！</p>
    <button id="playBtn">Start</button>
    <div class="sub" style="opacity:.55">Tap zone / Arrows</div>
  </div>
</div>

<script>
(()=>{
"use strict";
const cvs=document.getElementById('c'),ctx=cvs.getContext('2d');
const W=900,H=600;let dpr=Math.min(window.devicePixelRatio||1,2);
function resize(){const r=cvs.getBoundingClientRect();cvs.width=Math.round(r.width*dpr);cvs.height=Math.round(r.height*dpr);
  ctx.setTransform(cvs.width/W,0,0,cvs.height/H,0,0);}
new ResizeObserver(resize).observe(cvs);resize();

let AC=null;function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function tone(f,d,t='sine',v=.22,to=null){const a=ac();if(!a)return;const o=a.createOscillator(),g=a.createGain();
  o.type=t;o.frequency.setValueAtTime(f,a.currentTime);if(to)o.frequency.exponentialRampToValueAtTime(to,a.currentTime+d);
  g.gain.setValueAtTime(v,a.currentTime);g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+d);
  o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+d);}
function noise(d,v){const a=ac();if(!a)return;const n=a.createBuffer(1,a.sampleRate*d,a.sampleRate);const dd=n.getChannelData(0);
  for(let i=0;i<dd.length;i++)dd[i]=(Math.random()*2-1)*(1-i/dd.length);const s=a.createBufferSource();s.buffer=n;const g=a.createGain();
  g.gain.value=v;s.connect(g);g.connect(a.destination);s.start();}
const sMove=()=>tone(520,.05,'square',.12,700);
const sKick=()=>tone(240,.1,'square',.24,90);
const sSave=()=>{noise(.1,.25);tone(700,.14,'square',.22,320);};
const sGoal=()=>tone(150,.3,'sawtooth',.26,60);
const sSt=()=>tone(880,.08,'square',.18);

// goal + zones (front view). zones: 2 rows (0 high,1 low) x 3 cols(0 L,1 C,2 R) => idx=row*3+col
const goal={x:170,y:120,w:560,h:260};
const cols=3, rows=2, zw=goal.w/cols, zh=goal.h/rows;
function zoneCenter(idx){const c=idx%3,r=Math.floor(idx/3);return {x:goal.x+c*zw+zw/2,y:goal.y+r*zh+zh/2};}
const shooter={x:450,y:545};
const S={IDLE:'idle',WINDUP:'windup',SHOT:'flight',RESULT:'result',OVER:'over'};
let state=S.IDLE;
let score=0, streak=0, lives=3, shotCount=0;
let keeper={zone:1,x:0,y:0,dx:0,dive:0}; // start center-high? use zone 4 (low center)
let shot=null; // {target,t,dur}
let particles=[], shake=0, flash=0, flashCol='#3ae8cf', tPrev=0;

function reset(){score=0;streak=0;lives=3;shotCount=0;keeper.zone=4;const z=zoneCenter(4);keeper.x=z.x;keeper.y=z.y;keeper.dive=0;
  shot=null;particles=[];updateHUD();}
function start(){reset();document.getElementById('overlay').classList.add('hidden');nextShot();}
function nextShot(){
  if(lives<=0)return endGame();
  shotCount++;
  state=S.WINDUP;
  const wind=Math.max(0.32,0.6-shotCount*0.01);
  shot={target:Math.floor(Math.random()*6),t:-wind,dur:Math.max(0.62,1.15-shotCount*0.028),launched:false};
  setHint('狙いを読め…');
}
function launch(){shot.launched=true;state=S.SHOT;shot.t=0;sKick();}
function moveKeeper(zone){if(state!==S.SHOT&&state!==S.WINDUP)return;
  if(zone!==keeper.zone){keeper.zone=zone;sMove();}}
function moveDir(dc,dr){if(state!==S.SHOT&&state!==S.WINDUP)return;
  let c=keeper.zone%3,r=Math.floor(keeper.zone/3);c=Math.max(0,Math.min(2,c+dc));r=Math.max(0,Math.min(1,r+dr));
  moveKeeper(r*3+c);}

window.addEventListener('keydown',e=>{
  if(e.code==='ArrowLeft'||e.code==='KeyA'){e.preventDefault();moveDir(-1,0);}
  else if(e.code==='ArrowRight'||e.code==='KeyD'){e.preventDefault();moveDir(1,0);}
  else if(e.code==='ArrowUp'||e.code==='KeyW'){e.preventDefault();moveDir(0,-1);}
  else if(e.code==='ArrowDown'||e.code==='KeyS'){e.preventDefault();moveDir(0,1);}
  else if(e.code==='Space'){e.preventDefault();if(state===S.IDLE||state===S.OVER){const a=ac();a&&a.resume&&a.resume();start();}}
});
cvs.addEventListener('pointerdown',e=>{const a=ac();a&&a.resume&&a.resume();
  if(state===S.IDLE||state===S.OVER)return;
  const r=cvs.getBoundingClientRect();const mx=(e.clientX-r.left)/r.width*W, my=(e.clientY-r.top)/r.height*H;
  // map to zone if within goal, else nearest column
  let c=Math.floor((mx-goal.x)/zw), rr=Math.floor((my-goal.y)/zh);
  c=Math.max(0,Math.min(2,c));rr=Math.max(0,Math.min(1,rr));
  moveKeeper(rr*3+c);});
document.getElementById('playBtn').addEventListener('click',e=>{e.stopPropagation();ac()&&ac().resume&&ac().resume();start();});

function resolve(){
  const saved=keeper.zone===shot.target;
  const z=zoneCenter(shot.target);
  if(saved){score++;streak++;sSave();shake=8;flash=.7;flashCol='#3ae8cf';keeper.dive=1;
    showMsg(streak>=3?('SAVE ×'+streak+'!'):'SAVE!','#3ae8cf');
    burst(z.x,z.y,['#3ae8cf','#fff','#ffcf3a'],22);
  } else {lives--;streak=0;sGoal();shake=14;flash=.7;flashCol='#ff5a3c';
    showMsg('GOAL…','#ff5a3c');burst(z.x,z.y,['#ff5a3c','#fff'],26);}
  updateHUD();
  state=S.RESULT;
  setTimeout(()=>{keeper.dive=0;if(lives<=0)endGame();else nextShot();},900);
}
function endGame(){state=S.OVER;const ov=document.getElementById('overlay');
  const rating=score>=25?'WALL!':score>=15?'WORLD CLASS':score>=8?'SOLID KEEPER':score>=3?'DECENT':'ROOKIE';
  ov.querySelector('.sub').textContent='Full time';
  ov.querySelector('h1').innerHTML=score+' セーブ<span>'+rating+'</span>';
  ov.querySelector('p').innerHTML='<b style="color:var(--gold)">'+rating+'</b> — 反射神経を磨いて連続セーブを伸ばそう！';
  ov.querySelector('#playBtn').textContent='Retry';ov.classList.remove('hidden');}

function burst(x,y,cols_,n){for(let i=0;i<n;i++){const a=Math.random()*7,s=1+Math.random()*6;
  particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-2,life:1,col:cols_[i%cols_.length],r:2+Math.random()*4});}}
function updateHUD(){document.getElementById('score').textContent=score;
  document.getElementById('streak').textContent=streak;
  document.getElementById('lives').textContent='❤'.repeat(Math.max(0,lives))+'♡'.repeat(Math.max(0,3-lives));}
let msgT=null;function showMsg(t,c){const m=document.getElementById('msg');m.textContent=t;m.style.color=c;m.style.opacity='1';
  clearTimeout(msgT);msgT=setTimeout(()=>m.style.opacity='0',800);}
function setHint(h){document.getElementById('hint').innerHTML=h;}

function update(dt){
  if(state===S.WINDUP){shot.t+=dt;if(shot.t>=0)launch();}
  else if(state===S.SHOT){shot.t+=dt;if(shot.t>=shot.dur)resolve();}
  // keeper smooth toward zone
  const z=zoneCenter(keeper.zone);keeper.x+=(z.x-keeper.x)*Math.min(1,dt*18);keeper.y+=(z.y-keeper.y)*Math.min(1,dt*18);
  for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.x+=p.vx;p.y+=p.vy;p.vy+=.3;p.vx*=.99;p.life-=dt*1.1;if(p.life<=0)particles.splice(i,1);}
  if(shake>0)shake=Math.max(0,shake-dt*30);if(flash>0)flash=Math.max(0,flash-dt*1.6);
}
function roundRect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function drawScene(){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#071a2e');g.addColorStop(.5,'#0a3a24');g.addColorStop(1,'#0e5f34');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  // crowd band
  ctx.fillStyle='#0c2436';ctx.fillRect(0,60,W,60);ctx.save();ctx.globalAlpha=.4;
  for(let i=0;i<220;i++){const x=i*27%W,y=64+(i*13%50);ctx.fillStyle=['#13314a','#1c4a30','#2a2f5a'][i%3];ctx.fillRect(x,y,4,4);}ctx.restore();
  // pitch stripes
  for(let i=0;i<7;i++){const y0=390+i*30;ctx.fillStyle=i%2?'rgba(255,255,255,.04)':'rgba(0,0,0,.05)';ctx.fillRect(0,y0,W,30);}
  // penalty spot
  ctx.fillStyle='rgba(234,243,236,.7)';ctx.beginPath();ctx.arc(shooter.x,shooter.y-4,4,0,7);ctx.fill();
}
function drawGoal(){
  // net
  ctx.save();ctx.strokeStyle='rgba(234,243,236,.16)';ctx.lineWidth=1;
  for(let i=0;i<=goal.w;i+=16){ctx.beginPath();ctx.moveTo(goal.x+i,goal.y);ctx.lineTo(goal.x+i,goal.y+goal.h);ctx.stroke();}
  for(let j=0;j<=goal.h;j+=16){ctx.beginPath();ctx.moveTo(goal.x,goal.y+j);ctx.lineTo(goal.x+goal.w,goal.y+j);ctx.stroke();}
  ctx.restore();
  // zone grid highlight (keeper target zone lit)
  for(let i=0;i<6;i++){const c=i%3,r=Math.floor(i/3);
    if(i===keeper.zone){ctx.fillStyle='rgba(58,232,207,.14)';ctx.fillRect(goal.x+c*zw,goal.y+r*zh,zw,zh);}
    ctx.strokeStyle='rgba(255,255,255,.10)';ctx.lineWidth=1;ctx.strokeRect(goal.x+c*zw,goal.y+r*zh,zw,zh);}
  // posts
  ctx.fillStyle='#f4f7f4';ctx.shadowColor='rgba(0,0,0,.4)';ctx.shadowBlur=8;
  ctx.fillRect(goal.x-12,goal.y-12,14,goal.h+12);ctx.fillRect(goal.x+goal.w-2,goal.y-12,14,goal.h+12);
  ctx.fillRect(goal.x-12,goal.y-12,goal.w+24,14);ctx.shadowBlur=0;
}
function drawKeeper(){
  const x=keeper.x,y=keeper.y;const spread=keeper.dive;
  ctx.save();ctx.translate(x,y);
  const lean=(keeper.zone%3-1)*0.2*(0.4+spread);
  ctx.rotate(lean);
  // body (yellow kit)
  ctx.fillStyle='#ffd21f';roundRect(-16,-30,32,44,9);ctx.fill();
  ctx.fillStyle='#f2c79a';ctx.beginPath();ctx.arc(0,-40,12,0,7);ctx.fill();
  ctx.fillStyle='#111';ctx.fillRect(-16,10,32,10);
  // arms spread
  ctx.strokeStyle='#ffd21f';ctx.lineWidth=9;ctx.lineCap='round';
  const reach=20+spread*30;
  ctx.beginPath();ctx.moveTo(0,-18);ctx.lineTo(-reach,-30-spread*16);ctx.moveTo(0,-18);ctx.lineTo(reach,-30-spread*16);ctx.stroke();
  ctx.fillStyle='#3ae8cf';ctx.beginPath();ctx.arc(-reach,-30-spread*16,7,0,7);ctx.fill();ctx.beginPath();ctx.arc(reach,-30-spread*16,7,0,7);ctx.fill();
  ctx.strokeStyle='#f2c79a';ctx.lineWidth=8;
  ctx.beginPath();ctx.moveTo(-7,12);ctx.lineTo(-10-spread*12,30);ctx.moveTo(7,12);ctx.lineTo(10+spread*12,30);ctx.stroke();
  ctx.restore();
}
function drawShot(){
  if(!shot)return;
  if(state===S.WINDUP){
    // shooter winds up; telegraph a faint aim glow at target (brief)
    const z=zoneCenter(shot.target);
    // (no target reveal to keep it reflex-based)
    drawShooter(0.4);
    return;
  }
  if(state===S.SHOT||state===S.RESULT){
    drawShooter(1);
    if(state===S.SHOT){
      const z=zoneCenter(shot.target);const k=shot.t/shot.dur;
      const x=shooter.x+(z.x-shooter.x)*k, y=shooter.y+(z.y-shooter.y)*k;
      const r=14-6*k;
      // shadow trail
      ctx.save();ctx.globalAlpha=.3;ctx.fillStyle='#fff';
      const px=shooter.x+(z.x-shooter.x)*Math.max(0,k-.08), py=shooter.y+(z.y-shooter.y)*Math.max(0,k-.08);
      ctx.beginPath();ctx.arc(px,py,r*0.8,0,7);ctx.fill();ctx.restore();
      ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();
      ctx.fillStyle='#111';const rot=k*20;for(let i=0;i<5;i++){const a=rot+i*1.256;ctx.beginPath();ctx.arc(x+Math.cos(a)*r*.5,y+Math.sin(a)*r*.5,r*.2,0,7);ctx.fill();}
      ctx.strokeStyle='rgba(0,0,0,.25)';ctx.lineWidth=1;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.stroke();
    }
  }
}
function drawShooter(alpha){
  ctx.save();ctx.globalAlpha=alpha;ctx.translate(shooter.x,shooter.y+8);
  ctx.fillStyle='rgba(0,0,0,.25)';ctx.beginPath();ctx.ellipse(0,26,22,7,0,0,7);ctx.fill();
  ctx.fillStyle='#c62d2d';roundRect(-13,-30,26,38,8);ctx.fill();
  ctx.fillStyle='#e8b88a';ctx.beginPath();ctx.arc(0,-40,11,0,7);ctx.fill();
  ctx.fillStyle='#0c2138';ctx.fillRect(-13,4,26,10);
  ctx.restore();
}
function render(){
  ctx.clearRect(0,0,W,H);ctx.save();
  if(shake>0)ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
  drawScene();drawGoal();drawKeeper();drawShot();
  for(const p of particles){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.col;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill();}
  ctx.globalAlpha=1;ctx.restore();
  if(flash>0){ctx.fillStyle='rgba('+(flashCol==='#3ae8cf'?'58,232,207':'255,90,60')+','+(flash*0.28)+')';ctx.fillRect(0,0,W,H);}
}
function loop(t){if(!tPrev)tPrev=t;let dt=(t-tPrev)/1000;tPrev=t;if(dt>.05)dt=.05;update(dt);render();requestAnimationFrame(loop);}
reset();requestAnimationFrame(loop);state=S.IDLE;
})();
</script>
