<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>胸トラップ・ボレー (Chest Volley)</title>
<style>
  html,body{margin:0;height:100%;background:#07100a;overflow:hidden;
    font-family:-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  #stage{position:relative;width:100vw;height:100vh;max-width:calc(100vh*1.5);max-height:calc(100vw/1.5);aspect-ratio:900/600;}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;border-radius:6px;}
</style>
</head>
<body>
<div id="wrap"><div id="stage"><canvas id="cv"></canvas></div></div>
<script>
(function(){
const W=900,H=600,cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let DPR=1;
function fit(){DPR=Math.min(2,window.devicePixelRatio||1);cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
fit();addEventListener('resize',fit);

// ---------- audio ----------
let AC=null;function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function tone(f,d,type,v,sweep){const a=ac();if(!a)return;const t=a.currentTime,o=a.createOscillator(),g=a.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(sweep)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+sweep),t+d);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v||0.2,t+0.008);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+0.02);}
function noise(d,v,hp){const a=ac();if(!a)return;const t=a.currentTime,n=Math.floor(a.sampleRate*d),buf=a.createBuffer(1,n,a.sampleRate),ch=buf.getChannelData(0);
  for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource();s.buffer=buf;
  const f=a.createBiquadFilter();f.type='highpass';f.frequency.value=hp||600;const g=a.createGain();g.gain.value=v||0.2;
  s.connect(f);f.connect(g);g.connect(a.destination);s.start(t);s.stop(t+d+0.02);}
const S={
  chest:()=>{tone(240,0.09,'sine',0.12,-60);noise(0.03,0.05,500);},
  volley:()=>{noise(0.05,0.16,600);tone(340,0.06,'square',0.1,240);},
  goal:()=>{noise(0.05,0.12,500);[560,820,1080,1340].forEach((f,i)=>setTimeout(()=>tone(f,0.12,'triangle',0.18),i*55));},
  bad:()=>{noise(0.16,0.22,320);tone(170,0.18,'sawtooth',0.12,-50);},
  streak:()=>{[700,930,1170,1400].forEach((f,i)=>setTimeout(()=>tone(f,0.1,'triangle',0.16),i*60));},
  over:()=>{[440,330,247,175].forEach((f,i)=>setTimeout(()=>tone(f,0.3,'triangle',0.2),i*160));}
};

// ---------- geometry ----------
const PX=450, FEET=452, CHEST=406, HEADY=384, TOPY=92, GOALY=74, GW=210, GL=PX-GW/2, GR=PX+GW/2;

// ---------- state ----------
let state='title', stg='ctrl', t=0, plays=0;
let score=0, combo=0, best=+(localStorage.getItem('chestvolley_best')||0);
let outs=0, fails=0, lvl=1;   // outs = goals
let clock=0, trapClock=0, dropT=1000, cw=150, volleyT=500, vw=140, sweetV=50;
let dropX=450, gkSide=0;
let acted2=false, result=null, resultT=0, msg='', shotU=0, shotX=450, trapGood=false;
let shake=0, flash=0, flashCol='#fff', last=performance.now();
let parts=[], pops=[];

function rnd(a,b){return a+Math.random()*(b-a);}
function chance(p){return Math.random()<p;}
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function lerp(a,b,u){return a+(b-a)*u;}
function easeOut(u){return 1-Math.pow(1-u,2);}
function easeIn(u){return u*u;}

function params(){ return {
  drop:Math.max(720,1060-lvl*50),
  cw:Math.max(96,152-lvl*8),
  vol:Math.max(360,520-lvl*24),
  vw:Math.max(86,142-lvl*8),
  sweet:Math.max(30,52-lvl*3)
};}

function reset(){state='title';score=0;combo=0;outs=0;fails=0;lvl=1;plays=0;result=null;parts=[];pops=[];}
function newPlay(){
  plays++; lvl=Math.min(7,1+Math.floor(outs/4));
  const p=params();
  dropT=p.drop; cw=p.cw; volleyT=p.vol; vw=p.vw; sweetV=p.sweet;
  dropX=PX+rnd(-40,40);
  gkSide=chance(0.5)?-1:1;
  clock=0; trapClock=0; acted2=false; result=null; stg='ctrl'; msg=''; resultT=0; shotU=0; trapGood=false;
}
function start(){ if(!ac())ac(); if(AC&&AC.state==='suspended')AC.resume(); reset(); state='play'; newPlay(); }

function act(){
  if(state==='title'){start();return;}
  if(state==='over'){ if(resultT>0.4){reset();start();} return; }
  if(state!=='play') return;
  if(stg==='ctrl'){
    const err=Math.abs(clock-dropT);
    if(err<=cw){ // good chest trap
      trapGood=true; trapClock=clock; stg='volley'; S.chest();
      flash=0.5;flashCol='#bfe3ff'; burst(PX,CHEST,'#bfe3ff',8,3);
      pop(PX,CHEST-30,'ナイスクッション！','#bfe3ff');
    } else { resolve(clock<dropT?'earlytouch':'badtouch'); }
    return;
  }
  if(stg==='volley'){
    const err=Math.abs((clock-trapClock)-volleyT);
    S.volley();
    if(err<=sweetV){ shotX=PX+gkSide*rnd(70,96); resolve('worldie'); }   // rifle it into the far corner past the diving GK
    else if(err<=vw){ shotX=PX+ (chance(0.5)?1:-1)*rnd(30,70); resolve( (Math.sign(shotX-PX)===gkSide)?'goal':'goal'); }
    else { shotX=PX+rnd(-30,30); resolve('mishit'); }
    return;
  }
}

function resolve(kind){
  stg='result'; result=kind; resultT=0;
  const good=(kind==='goal'||kind==='worldie');
  if(good){
    outs++; combo++;
    let add=Math.round((kind==='worldie'?230:130)*(1+Math.min(9,combo-1)*0.15)); score+=add;
    S.goal(); flash=1;flashCol=kind==='worldie'?'#8affa0':'#ffe08a';shake=kind==='worldie'?9:6;
    burst(shotX,GOALY+26,kind==='worldie'?'#8affa0':'#ffe08a',kind==='worldie'?24:16,7);
    pop(shotX,GOALY+2,(kind==='worldie'?'スーパーボレー！ +':'ボレーゴール！ +')+add,kind==='worldie'?'#d6ffe0':'#fff3c4');
    if(kind==='worldie')pop(PX,180,'ど真ん中で叩いた！','#8affa0');
    if(combo>=2)pop(PX,220,'コンボ x'+combo,'#ffd24d');
    if(combo>0&&combo%5===0)S.streak();
    msg=kind==='worldie'?'胸トラップから完璧なボレー！ 芯で叩き込んだ！':'胸で落としてボレー成功！ 流し込んだ！';
  } else {
    fails++; combo=0; flash=1;flashCol='#ff5b5b';shake=8; S.bad();
    if(kind==='earlytouch') msg='早い！ 胸に当てる前にトラップして弾いた';
    else if(kind==='badtouch') msg='トラップが浮いた…胸のクッションが遅れた';
    else if(kind==='missctrl') msg='ボールを胸で止められず流れた…';
    else msg='ボレーのタイミングがズレて空振り／ふかした';
    pop(PX,CHEST-30,'ミス…','#ffb0b0');
  }
  if(fails>=3){ state='over'; resultT=0; S.over(); if(score>best){best=score;localStorage.setItem('chestvolley_best',best);} }
}

// ---------- input ----------
cv.addEventListener('pointerdown',e=>{e.preventDefault();act();});
addEventListener('keydown',e=>{ if(e.code==='Space'||e.code==='Enter'||e.code==='ArrowUp'||e.code==='KeyZ'){e.preventDefault();act();} });

// ---------- particles ----------
function burst(x,y,c,n,sp){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=rnd(sp*0.3,sp);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:1,c});}}
function pop(x,y,txt,c){pops.push({x,y,txt,c,life:1});}

// ---------- update ----------
function update(dt){
  shake*=Math.pow(0.86,dt/16.7); if(shake<0.3)shake=0;
  flash*=Math.pow(0.9,dt/16.7);
  for(const p of parts){p.vx*=0.96;p.vy=p.vy*0.96+0.28;p.x+=p.vx*dt/16.7;p.y+=p.vy*dt/16.7;p.life-=dt/16.7*0.026;}
  parts=parts.filter(p=>p.life>0);
  for(const p of pops){p.y-=dt/16.7*0.5;p.life-=dt/16.7*0.02;}
  pops=pops.filter(p=>p.life>0);

  if(state!=='play'){ if(state==='over')resultT+=dt/1000; return; }
  t+=dt;
  if(stg==='ctrl'){
    clock+=dt;
    if(clock>dropT+cw){ resolve('missctrl'); }
    return;
  }
  if(stg==='volley'){
    clock+=dt;
    if((clock-trapClock)>volleyT+vw){ shotX=PX; resolve('mishit'); }
    return;
  }
  if(stg==='result'){
    resultT+=dt/1000;
    shotU=Math.min(1,shotU+dt/230);
    if(resultT>1.15 && state==='play') newPlay();
    return;
  }
}

// ---------- render ----------
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function ballPos(){
  if(stg==='ctrl'){ const u=clamp(clock/dropT,0,1); return {x:lerp(dropX,PX,u), y:lerp(TOPY,CHEST,easeIn(u))}; }
  if(stg==='volley'){ const u=clamp((clock-trapClock)/volleyT,0,1); return {x:PX, y:lerp(CHEST,FEET-6,u)}; }
  return {x:PX,y:FEET-6};
}
function drawScene(){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#256d34');g.addColorStop(1,'#184a22');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='rgba(255,255,255,0.035)';
  for(let i=0;i<7;i++){ if(i%2===0)ctx.fillRect(0,i*H/7,W,H/7); }
  // goal
  ctx.fillStyle='rgba(255,255,255,0.10)';ctx.fillRect(GL-6,GOALY-4,GW+12,42);
  ctx.strokeStyle='#f2f4f6';ctx.lineWidth=6;
  ctx.beginPath();ctx.moveTo(GL-6,GOALY+38);ctx.lineTo(GL-6,GOALY-4);ctx.lineTo(GR+6,GOALY-4);ctx.lineTo(GR+6,GOALY+38);ctx.stroke();
  ctx.strokeStyle='rgba(255,255,255,0.14)';ctx.lineWidth=1;
  for(let x=GL;x<=GR;x+=15){ctx.beginPath();ctx.moveTo(x,GOALY-2);ctx.lineTo(x,GOALY+36);ctx.stroke();}
  // box arc
  ctx.strokeStyle='rgba(255,255,255,0.12)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(PX,GOALY+150,120,3.4,6.02);ctx.stroke();
}

function render(){
  ctx.save();
  if(shake>0)ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
  drawScene();

  if(state==='play'){
    // GK
    const gkx = PX + (stg==='result'&&(result==='goal'||result==='worldie'||result==='mishit') ? gkSide*lerp(0,64,easeOut(shotU)) : 0);
    ctx.fillStyle='#e23c3c';rr(gkx-12,GOALY+2,24,30,6);ctx.fill();
    ctx.fillStyle='#f2c9a0';ctx.beginPath();ctx.arc(gkx,GOALY,7,0,6.28);ctx.fill();

    // player (facing up)
    ctx.fillStyle='rgba(0,0,0,0.22)';ctx.beginPath();ctx.ellipse(PX,FEET+14,16,5,0,0,6.28);ctx.fill();
    ctx.fillStyle='#2b6cff';rr(PX-11,CHEST,22,FEET-CHEST,7);ctx.fill();
    ctx.fillStyle='#f2c9a0';ctx.beginPath();ctx.arc(PX,HEADY,8,0,6.28);ctx.fill();
    // volley leg swing on result
    if(stg==='result'&&(result==='goal'||result==='worldie'||result==='mishit')){
      const sw=clamp(shotU/0.3,0,1);
      ctx.strokeStyle='#f2c9a0';ctx.lineWidth=5;ctx.lineCap='round';
      const a=lerp(1.2,-0.6,sw);
      ctx.beginPath();ctx.moveTo(PX,FEET-4);ctx.lineTo(PX+Math.cos(a)*26,FEET-4-Math.sin(a)*26);ctx.stroke();
    }

    // chest window ring (stg ctrl, when ball nears chest)
    if(stg==='ctrl'){
      if(clock>dropT-cw*1.7){
        const u=clamp((clock-(dropT-cw))/(2*cw),0,1);
        const inw = Math.abs(clock-dropT)<=cw;
        ctx.strokeStyle=inw?'rgba(150,210,255,0.95)':'rgba(255,255,255,0.35)';
        ctx.lineWidth=3;ctx.beginPath();ctx.arc(PX,CHEST,lerp(46,20,clamp(u,0,1)),0,6.28);ctx.stroke();
      }
      ctx.fillStyle='rgba(191,227,255,0.9)';ctx.font='bold 14px sans-serif';ctx.textAlign='center';
      ctx.fillText('①胸でクッション',PX,CHEST-52);
    }
    // volley window ring (stg volley, when ball nears feet)
    if(stg==='volley'){
      const s=clock-trapClock;
      if(s>volleyT-vw*1.7){
        const u=clamp((s-(volleyT-vw))/(2*vw),0,1);
        const inw=Math.abs(s-volleyT)<=vw;
        ctx.strokeStyle=inw?'rgba(150,240,170,0.95)':'rgba(255,255,255,0.35)';
        ctx.lineWidth=3;ctx.beginPath();ctx.arc(PX,FEET-6,lerp(44,18,clamp(u,0,1)),0,6.28);ctx.stroke();
        if(inw){ ctx.strokeStyle='rgba(214,255,224,0.6)';ctx.lineWidth=2;
          ctx.beginPath();ctx.arc(PX,FEET-6,lerp(44,18,clamp(u,0,1))*(sweetV/vw),0,6.28);ctx.stroke(); }
      }
      ctx.fillStyle='rgba(159,240,184,0.9)';ctx.font='bold 14px sans-serif';ctx.textAlign='center';
      ctx.fillText('②ボレーで叩け！',PX,CHEST-14);
    }

    // ball
    if(stg==='ctrl'||stg==='volley'){
      const bp=ballPos();
      // trail
      ctx.globalAlpha=0.25;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(bp.x,bp.y-12,6,0,6.28);ctx.fill();ctx.globalAlpha=1;
      ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(bp.x,bp.y,8,0,6.28);ctx.fill();
      ctx.strokeStyle='#333';ctx.lineWidth=1.2;ctx.beginPath();ctx.arc(bp.x,bp.y,8,0.6,2.4);ctx.stroke();
    } else if(stg==='result'&&(result==='goal'||result==='worldie')){
      const fx=lerp(PX,shotX,easeOut(shotU)), fy=lerp(FEET-6,GOALY+16,easeOut(shotU));
      ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(fx,fy,7,0,6.28);ctx.fill();
    } else if(stg==='result'&&result==='mishit'){
      const fx=lerp(PX,shotX,easeOut(shotU)), fy=lerp(FEET-6,GOALY-40,easeOut(shotU));
      ctx.globalAlpha=clamp(1.2-resultT,0,1);ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(fx,fy,7,0,6.28);ctx.fill();ctx.globalAlpha=1;
    } else if(stg==='result'){ // badtouch / early / missctrl: ball bounces away
      const bp=ballPos(); const bx=bp.x+ (result==='earlytouch'?-1:1)*lerp(0,120,easeOut(shotU)); const by=CHEST-lerp(0,40,Math.sin(shotU*3.14));
      ctx.globalAlpha=clamp(1.2-resultT,0,1);ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(bx,by,8,0,6.28);ctx.fill();ctx.globalAlpha=1;
    }
  }

  for(const p of parts){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,3.2,0,6.28);ctx.fill();}
  ctx.globalAlpha=1;
  for(const p of pops){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.font='bold 22px sans-serif';ctx.textAlign='center';ctx.fillText(p.txt,p.x,p.y);}
  ctx.globalAlpha=1;

  // HUD
  ctx.textAlign='left';ctx.fillStyle='#fff';ctx.font='bold 26px sans-serif';ctx.fillText('SCORE '+score,20,36);
  ctx.textAlign='right';ctx.fillStyle='rgba(255,255,255,0.9)';ctx.font='14px sans-serif';ctx.fillText('ゴール '+outs+'  Lv'+lvl,W-20,24);
  ctx.fillText('失敗',W-92,46);
  for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(W-60+i*20,41,7,0,6.28);ctx.fillStyle=i<fails?'#ff5b5b':'rgba(255,255,255,0.25)';ctx.fill();}
  if(combo>=2){ctx.textAlign='center';ctx.fillStyle='#ffd24d';ctx.font='bold 18px sans-serif';ctx.fillText('コンボ x'+combo,PX,150);}

  if(state==='play'&&(stg==='ctrl'||stg==='volley')){ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,0.9)';ctx.font='bold 15px sans-serif';
    ctx.fillText('落ちてくる球を①胸でクッション→②足元でボレー。2拍のタイミングを合わせろ',W/2,44);}
  if(state==='play'&&stg==='result'&&msg){ctx.textAlign='center';ctx.fillStyle=(result==='goal'||result==='worldie')?'#9ff0b8':'#ff9a9a';ctx.font='bold 20px sans-serif';ctx.fillText(msg,W/2,44);}

  if(state==='title'){
    ctx.fillStyle='rgba(5,12,7,0.76)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='bold 40px sans-serif';ctx.fillText('胸トラップ・ボレー',W/2,112);
    ctx.fillStyle='#ffd23e';ctx.font='bold 22px sans-serif';ctx.fillText('Chest Volley',W/2,148);
    ctx.fillStyle='rgba(255,255,255,0.92)';ctx.font='16px sans-serif';
    ctx.fillText('浮き球を胸で殺して、落ち際をボレーで叩き込む2段階の一連プレー',W/2,198);
    ctx.fillStyle='rgba(255,255,255,0.66)';ctx.font='14px sans-serif';
    ctx.fillText('高いボールが落ちてくる。① 胸の高さ（青リング）でタップ＝胸トラップでクッション',W/2,238);
    ctx.fillText('② 胸から足元へ落ちる球を、緑リングのタイミングでタップ＝ボレーシュート',W/2,260);
    ctx.fillText('ボレーを芯（内側リング）で叩くと“スーパーボレー”で大量得点',W/2,282);
    ctx.fillText('胸トラップが早すぎ/遅すぎると弾く、ボレーがズレると空振り/ふかし＝失敗',W/2,304);
    ctx.fillText('2拍のリズムが命。上級ほど落下が速くリングが狭い。3失敗で交代',W/2,326);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で開始',W/2,392);
    ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='14px sans-serif';ctx.fillText('BEST '+best+'　　タップ/クリック/SPACE',W/2,424);
  }
  if(state==='over'){
    ctx.fillStyle='rgba(5,12,7,0.82)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#ff6b6b';ctx.font='bold 46px sans-serif';ctx.fillText('3失敗…交代',W/2,222);
    ctx.fillStyle='#fff';ctx.font='bold 40px sans-serif';ctx.fillText('SCORE '+score,W/2,290);
    ctx.fillStyle='rgba(255,255,255,0.85)';ctx.font='19px sans-serif';ctx.fillText('ゴール '+outs+'   BEST '+best,W/2,330);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で もう一度',W/2,402);
  }

  if(flash>0.02){ctx.globalAlpha=flash*0.5;ctx.fillStyle=flashCol;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}
  ctx.restore();

  ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,0.4)';ctx.font='12px sans-serif';
  ctx.fillText('①胸トラップ（青リング）→②ボレー（緑リング）の2拍。芯で叩けばスーパーボレー。早/遅/空振りは失敗。3失敗で交代',W/2,H-8);
}

function frame(ts){let dt=ts-last;last=ts;if(dt>60)dt=60;if(dt<0)dt=0;update(dt);render();requestAnimationFrame(frame);}
requestAnimationFrame(frame);

// ---------- test hook ----------
window.__cv={
  start, act:()=>act(),
  get state(){return state;},
  get score(){return score;},
  get outs(){return outs;},
  get fails(){return fails;},
  get info(){const sub=(stg==='volley')?(clock-trapClock):null;
    return {state,stg,clock,dropT,cw,volleyT,vw,sweetV,trapGood,sub,
      canCtrl:(stg==='ctrl'),canVolley:(stg==='volley'),
      ctrlErr:(stg==='ctrl'?Math.abs(clock-dropT):null),
      volErr:(stg==='volley'?Math.abs((clock-trapClock)-volleyT):null),
      result,outs,fails,lvl};}
};
})();
</script>
</body>
</html>
