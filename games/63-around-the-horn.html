<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>アラウンドザホーン — Around the Horn</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{width:100%;height:100%;background:#0a1622;overflow:hidden;
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,system-ui,sans-serif;
    touch-action:none;user-select:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  #stage{position:relative;aspect-ratio:900/600;max-width:100%;max-height:100%;
    width:auto;height:auto;box-shadow:0 0 60px rgba(0,0,0,.6);}
  canvas{display:block;width:100%;height:100%;border-radius:6px;}
</style>
</head>
<body>
<div id="wrap"><div id="stage"><canvas id="c" width="900" height="600"></canvas></div></div>
<script>
(function(){
"use strict";
const TEST=location.hash.indexOf('test')>=0;
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
const W=900,H=600;
let dpr=Math.max(1,Math.min(2,window.devicePixelRatio||1));
function fit(){ dpr=Math.max(1,Math.min(2,window.devicePixelRatio||1)); cv.width=W*dpr; cv.height=H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0); }
fit(); window.addEventListener('resize',fit);

// ---- audio ----
let AC=null;
function ac(){ if(!AC){ try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){AC=null;} } return AC; }
function tone(f,d,type,g,f2){ const a=ac(); if(!a)return; const o=a.createOscillator(),gg=a.createGain();
  o.type=type||'sine'; o.frequency.setValueAtTime(f,a.currentTime); if(f2)o.frequency.exponentialRampToValueAtTime(f2,a.currentTime+d);
  gg.gain.setValueAtTime(0.0001,a.currentTime); gg.gain.exponentialRampToValueAtTime(g||0.2,a.currentTime+0.01);
  gg.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+d); o.connect(gg); gg.connect(a.destination); o.start(); o.stop(a.currentTime+d+0.02); }
function noise(d,g,cut){ const a=ac(); if(!a)return; const n=Math.floor(a.sampleRate*d),buf=a.createBuffer(1,n,a.sampleRate),ch=buf.getChannelData(0);
  for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(1-i/n); const src=a.createBufferSource(); src.buffer=buf;
  const f=a.createBiquadFilter(); f.type='lowpass'; f.frequency.value=cut||1200; const gg=a.createGain(); gg.gain.value=g||0.2;
  src.connect(f); f.connect(gg); gg.connect(a.destination); src.start(); }
const S={
  relay(n){ noise(0.045,0.34,1400); tone(360+((n||0)%8)*40,0.05,'square',0.16,520); },
  perfect(n){ noise(0.04,0.3,2000); tone(520+((n||0)%6)*50,0.07,'square',0.2,760); },
  lap(){ const a=ac(); if(!a)return; for(let i=0;i<5;i++)setTimeout(()=>tone(500+i*90,0.18,'square',0.12),i*60); },
  bobble(){ noise(0.14,0.3,900); tone(200,0.16,'sawtooth',0.14,90); },
  cheer(){ const a=ac(); if(!a)return; noise(0.7,0.24,1900); for(let i=0;i<5;i++)setTimeout(()=>tone(500+Math.random()*320,0.3,'sine',0.05),i*46); },
  whoosh(){ noise(0.06,0.1,1400); }
};

// ---- stations (around the horn) ----
const ST=[
  {name:'捕', x:450, y:498},
  {name:'三', x:252, y:356},
  {name:'遊', x:372, y:322},
  {name:'二', x:450, y:262},
  {name:'一', x:648, y:356}
];

// ---- state ----
let state='ready';   // ready, play, over
let combo=0, laps=0, bobbles=0, best=0;
let from=0, to=1, seg=0, segDur=0.6, win=0.18, caught=false, relays=0;
let ball={x:ST[0].x,y:ST[0].y}, flash=0,flashCol='#fff',shakeT=0,shakeM=0;
let msg='',msgT=0, subMsg='', popText='', popT=0, popCol='#fff', popX=0, popY=0;
let parts=[], crowd=[], t=0;

try{ best=parseInt(localStorage.getItem('ah_best')||'0',10)||0; }catch(e){}
for(let i=0;i<70;i++) crowd.push({x:Math.random()*W,y:6+Math.random()*38,c:['#e8544e','#f0c14b','#4a90d9','#fff','#5cc98a','#c98af0'][i%6],b:Math.random()*6.28});

function saveBest(){ try{localStorage.setItem('ah_best',''+best);}catch(e){} }
function reset(){ combo=0;laps=0;bobbles=0;relays=0; parts=[]; from=0;to=1; startSeg(true); state='play';
  msg='ボールが次の野手に収まる瞬間にタップ！'; msgT=170; subMsg=''; }

function startSeg(first){
  segDur=Math.max(0.32, 0.62 - combo*0.006);
  win=Math.max(0.12, 0.22 - combo*0.004);
  seg=0; caught=false; if(!first)S.whoosh();
}
function relay(){
  if(state!=='play'||caught) return;
  const e=Math.abs(seg-1.0);
  if(e>win+0.14){ return; }  // way early flail; ignore (ball may still bobble if never caught)
  caught=true; relays++;
  const perfect = e<win*0.4;
  const st=ST[to];
  popX=st.x; popY=st.y-30;
  if(perfect){ combo++; popText='ナイス！'; popCol='#8effa8'; S.perfect(relays); burst(st.x,st.y,'#eaffe0',8); flash=0.14; flashCol='#eafff0'; }
  else { combo++; popText='OK'; popCol='#ffd23e'; S.relay(relays); }
  popT=1;
  if(combo>best){ best=combo; saveBest(); }
  // advance
  const nf=to, nt=(to+1)%ST.length;
  if(nt===0 || to===0){ /* lap boundary handled below */ }
  if(to===ST.length-1){ laps++; subMsg='一周！ +'+laps; msgT=50; S.lap(); setTimeout(S.cheer,60); flash=0.3; }
  from=nf; to=nt; startSeg();
}
function bobble(){
  bobbles++; combo=0; S.bobble(); shakeT=9; shakeM=4; popX=ST[to].x; popY=ST[to].y-30; popText='ボブル！'; popCol='#ff6a5a'; popT=1;
  if(bobbles>=3){ state='over'; msg='3ボブル・終了'; msgT=99999; }
  else { caught=true; from=to; to=(to+1)%ST.length; startSeg(); }   // resume from the muffed station
}

function burst(x,y,col,n){ for(let i=0;i<n;i++){ const a=Math.random()*6.28,sp=1+Math.random()*4;
  parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-1.5,life:1,col,r:2+Math.random()*3}); } }

// ---- input ----
function press(){ const a=ac(); if(a&&a.state==='suspended')a.resume();
  if(state==='ready'||state==='over'){ reset(); return; }
  if(state==='play'){ relay(); }
}
cv.addEventListener('pointerdown',e=>{ e.preventDefault(); press(); });
window.addEventListener('keydown',e=>{ if(e.code==='Space'||e.code==='Enter'){ e.preventDefault(); press(); } });

// ---- update ----
let last=0;
function update(dt){
  t+=dt; if(msgT>0)msgT--; if(flash>0)flash=Math.max(0,flash-dt*2.4); if(shakeT>0)shakeT--; if(popT>0)popT=Math.max(0,popT-dt*1.6);
  if(state==='play'){
    if(!caught){ seg+=dt/segDur;
      const a=ST[from], b=ST[to];
      const pp=Math.min(1,seg); ball.x=a.x+(b.x-a.x)*pp; ball.y=a.y+(b.y-a.y)*pp - Math.sin(pp*Math.PI)*24;
      if(seg>=1.0+win+0.02){ bobble(); }
    } else {
      // ball rests at 'from' briefly then next seg already started (caught sets up next); animate toward new target start
      const a=ST[from]; ball.x+=(a.x-ball.x)*Math.min(1,dt*18); ball.y+=(a.y-6-ball.y)*Math.min(1,dt*18);
      // small delay before launching next throw
      caught=false;   // immediately begin next segment travel
    }
  }
  for(let i=parts.length-1;i>=0;i--){ const q=parts[i]; q.x+=q.vx;q.y+=q.vy;q.vy+=0.15;q.life-=dt*1.1; if(q.life<=0)parts.splice(i,1); }
}

// ---- draw ----
function rr(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }

function drawField(){
  const g=ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,'#1a6a38'); g.addColorStop(1,'#22894e');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#0a1c10'; ctx.fillRect(0,0,W,30);
  for(const c of crowd){ const yy=c.y+Math.sin(t*3+c.b)*1.1; ctx.fillStyle=c.c; ctx.globalAlpha=.5; ctx.fillRect(c.x,yy,5,4); }
  ctx.globalAlpha=1;
  // dirt diamond
  ctx.fillStyle='#b5763e'; ctx.beginPath();
  ctx.moveTo(ST[0].x,ST[0].y+14); ctx.lineTo(ST[4].x+30,ST[4].y); ctx.lineTo(ST[3].x,ST[3].y-30); ctx.lineTo(ST[1].x-30,ST[1].y); ctx.closePath(); ctx.fill();
  // base path around the horn (loop)
  ctx.strokeStyle='rgba(255,255,255,.2)'; ctx.lineWidth=2; ctx.setLineDash([6,8]);
  ctx.beginPath(); for(let i=0;i<ST.length;i++){ const a=ST[i],b=ST[(i+1)%ST.length]; ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); } ctx.stroke(); ctx.setLineDash([]);
  // bases
  for(let i=1;i<ST.length;i++){ const B=ST[i]; ctx.save(); ctx.translate(B.x,B.y+14); ctx.rotate(Math.PI/4); ctx.fillStyle='#fff'; ctx.fillRect(-7,-7,14,14); ctx.restore(); }
  ctx.fillStyle='#fff'; ctx.beginPath(); ctx.moveTo(ST[0].x-10,ST[0].y+12);ctx.lineTo(ST[0].x+10,ST[0].y+12);ctx.lineTo(ST[0].x+10,ST[0].y+18);ctx.lineTo(ST[0].x,ST[0].y+24);ctx.lineTo(ST[0].x-10,ST[0].y+18);ctx.closePath(); ctx.fill();
}
function drawFielders(){
  for(let i=0;i<ST.length;i++){ const s=ST[i]; const active=(state==='play'&&i===to&&!caught);
    ctx.save(); ctx.translate(s.x,s.y);
    if(active){ const rr0=10+Math.max(0,(1-seg))*70; const near=Math.abs(seg-1)<win;
      ctx.strokeStyle= near?'#8effa8':'rgba(255,255,255,.5)'; ctx.lineWidth=3; ctx.beginPath(); ctx.arc(0,-6,rr0,0,6.28); ctx.stroke(); }
    ctx.fillStyle='rgba(0,0,0,.24)'; ctx.beginPath(); ctx.ellipse(0,12,13,4,0,0,6.28); ctx.fill();
    ctx.fillStyle=i===0?'#e8544e':'#4a90d9'; rr(-10,-22,20,26,6); ctx.fill();
    ctx.fillStyle='#f0c39a'; ctx.beginPath(); ctx.arc(0,-27,6,0,6.28); ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.85)'; ctx.font='bold 12px sans-serif'; ctx.textAlign='center'; ctx.fillText(s.name, 0, -34); ctx.textAlign='left';
    ctx.restore();
  }
}
function drawBall(){
  ctx.strokeStyle='rgba(255,255,255,.35)'; ctx.lineWidth=2;
  if(state==='play'&&!caught){ const a=ST[from]; ctx.beginPath(); ctx.moveTo(a.x,a.y-6); ctx.lineTo(ball.x,ball.y); ctx.stroke(); }
  ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(ball.x,ball.y,7,0,6.28); ctx.fill(); ctx.strokeStyle='#123'; ctx.lineWidth=1.2; ctx.stroke();
}
function drawPop(){
  if(popT>0&&popText){ ctx.textAlign='center'; ctx.globalAlpha=Math.min(1,popT*1.4); ctx.font='bold 22px sans-serif'; ctx.fillStyle=popCol;
    ctx.fillText(popText, popX, popY-(1-popT)*18); ctx.globalAlpha=1; ctx.textAlign='left'; }
}

function hud(x,y,w,h,lab,val,col){
  ctx.fillStyle='rgba(6,20,12,.62)'; rr(x,y,w,h,9); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.6)'; ctx.font='11px sans-serif'; ctx.textAlign='left'; ctx.fillText(lab,x+12,y+19);
  ctx.fillStyle=col||'#fff'; ctx.font='bold 24px sans-serif'; ctx.fillText(val,x+12,y+44);
}
function drawHUD(){
  hud(20,14,150,56,'コンボ COMBO',''+combo,'#ffd23e');
  hud(W/2-75,14,150,56,'一周 LAPS',''+laps,'#8effa8');
  const bc=bobbles>=2?'#ff6a5a':'#fff';
  hud(W-170,14,150,56,'ボブル',bobbles+' /3',bc); ctx.textAlign='left';
  ctx.fillStyle='rgba(255,255,255,.5)'; ctx.font='12px sans-serif'; ctx.fillText('自己ベストコンボ '+best,22,88);
}
function drawMsg(){
  if(msgT>0&&msg){ ctx.textAlign='center'; ctx.font='bold 26px sans-serif'; const w=ctx.measureText(msg).width;
    ctx.fillStyle='rgba(6,18,10,.75)'; rr(450-w/2-18,120,w+36,40,10); ctx.fill();
    ctx.fillStyle='#fff'; ctx.fillText(msg,450,147);
    if(subMsg){ ctx.font='bold 17px sans-serif'; ctx.fillStyle='rgba(140,255,168,.95)'; ctx.fillText(subMsg,450,177); }
    ctx.textAlign='left'; }
}
function drawOverlay(){
  ctx.fillStyle='rgba(6,16,10,.76)'; ctx.fillRect(0,0,W,H); ctx.textAlign='center';
  ctx.fillStyle='rgba(140,255,168,.9)'; ctx.font='600 15px sans-serif'; ctx.fillText('BASEBALL · AROUND THE HORN',450,132);
  ctx.fillStyle='#fff'; ctx.font='bold 48px sans-serif'; ctx.fillText('アラウンドザホーン',450,188);
  ctx.fillStyle='#ffd23e'; ctx.font='bold 21px sans-serif'; ctx.fillText('Whip It Around',450,220);
  ctx.fillStyle='rgba(255,255,255,.9)'; ctx.font='16px sans-serif';
  const L=['アウトの後の内野の連係！ ボールを一周させろ。',
    '捕→三→遊→二→一…と回るボールが野手に届く瞬間にタップ。',
    'リング（緑）が最小の一瞬でジャストリレー。連続でコンボ加速。',
    'テンポは上がっていく。ジャストで“ナイス！”を重ねろ。',
    'タイミングを外すとボブル。3ボブルで終了。'];
  for(let i=0;i<L.length;i++) ctx.fillText(L[i],450,258+i*25);
  ctx.fillStyle='#e8544e'; rr(450-95,414,190,54,27); ctx.fill();
  ctx.fillStyle='#fff'; ctx.font='bold 24px sans-serif'; ctx.fillText('プレイボール',450,448);
  ctx.fillStyle='rgba(255,255,255,.6)'; ctx.font='14px sans-serif'; ctx.fillText('タップ / Space でリレー',450,492);
  ctx.textAlign='left';
}
function drawOver(){
  ctx.fillStyle='rgba(6,16,10,.84)'; ctx.fillRect(0,0,W,H); ctx.textAlign='center';
  ctx.fillStyle='#fff'; ctx.font='bold 46px sans-serif'; ctx.fillText('3ボブル・終了',450,232);
  ctx.fillStyle='#ffd23e'; ctx.font='bold 32px sans-serif'; ctx.fillText('最高コンボ '+best,450,288);
  ctx.fillStyle='#8effa8'; ctx.font='20px sans-serif'; ctx.fillText('一周 '+laps+' 回',450,324);
  ctx.fillStyle='#2f7fd6'; rr(450-95,372,190,54,27); ctx.fill();
  ctx.fillStyle='#fff'; ctx.font='bold 22px sans-serif'; ctx.fillText('もう一度',450,406);
  ctx.textAlign='left';
}

function render(){
  ctx.save();
  if(shakeT>0){ ctx.translate((Math.random()*2-1)*shakeM,(Math.random()*2-1)*shakeM); }
  drawField(); drawFielders(); drawBall();
  for(const q of parts){ ctx.globalAlpha=Math.max(0,q.life); ctx.fillStyle=q.col; ctx.beginPath(); ctx.arc(q.x,q.y,q.r,0,6.28); ctx.fill(); }
  ctx.globalAlpha=1;
  drawPop(); drawHUD(); drawMsg();
  ctx.restore();
  if(flash>0){ ctx.fillStyle=flashCol; ctx.globalAlpha=flash; ctx.fillRect(0,0,W,H); ctx.globalAlpha=1; }
  if(state==='ready') drawOverlay();
  if(state==='over') drawOver();
}
function loop(ts){ if(!last)last=ts; let dt=(ts-last)/1000; last=ts; if(dt>0.05)dt=0.05; update(dt); render(); requestAnimationFrame(loop); }
requestAnimationFrame(loop);

if(TEST){
  window.__ah={
    get state(){return state;},
    get seg(){return seg;},
    get win(){return win;},
    get caught(){return caught;},
    get to(){return to;},
    get count(){return {combo,laps,bobbles,best};},
    relay(){ relay(); },
    tap(){ if(state==='ready'||state==='over')reset(); }
  };
}
})();
</script>
</body>
</html>
