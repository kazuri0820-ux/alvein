<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ノールックパス (No-Look Pass)</title>
<style>
  html,body{margin:0;padding:0;background:#08140d;overflow:hidden;font-family:'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif;-webkit-user-select:none;user-select:none;touch-action:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 32%,#17361f,#050d08 72%);}
  #stage{position:relative;width:min(100vw,calc(100vh*1.5));aspect-ratio:900/600;max-width:900px;box-shadow:0 10px 60px rgba(0,0,0,.6);border-radius:8px;overflow:hidden;}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;}
</style>
</head>
<body>
<div id="wrap"><div id="stage"><canvas id="cv"></canvas></div></div>
<script>
(function(){
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const W=900,H=600;let DPR=Math.min(2,window.devicePixelRatio||1);
function fit(){const r=cv.getBoundingClientRect();DPR=Math.min(2,window.devicePixelRatio||1);cv.width=Math.round(r.width*DPR);cv.height=Math.round(r.height*DPR);ctx.setTransform(cv.width/W,0,0,cv.height/H,0,0);}
new ResizeObserver(fit).observe(cv);fit();

// ---------- audio ----------
let AC=null;function actx(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function tone(f,d,type,v,sweep){const a=actx();if(!a)return;const o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.value=f;if(sweep)o.frequency.linearRampToValueAtTime(sweep,a.currentTime+d);g.gain.value=0.0001;g.gain.exponentialRampToValueAtTime(v||0.2,a.currentTime+0.008);g.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+d);o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+d+0.02);}
function noise(d,v,hp){const a=actx();if(!a)return;const n=a.createBufferSource(),b=a.createBuffer(1,a.sampleRate*d,a.sampleRate),dt=b.getChannelData(0);for(let i=0;i<dt.length;i++)dt[i]=Math.random()*2-1;n.buffer=b;const f=a.createBiquadFilter();f.type='highpass';f.frequency.value=hp||800;const g=a.createGain();g.gain.value=0.0001;g.gain.exponentialRampToValueAtTime(v||0.2,a.currentTime+0.01);g.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+d);n.connect(f);f.connect(g);g.connect(a.destination);n.start();n.stop(a.currentTime+d+0.02);}
const S={
  set(){tone(300,0.1,'sine',0.08);},
  lunge(){noise(0.08,0.16,600);tone(220,0.1,'sine',0.12,120);},
  pass(){tone(520,0.08,'sine',0.14,720);},
  goal(){tone(560,0.1,'triangle',0.2);setTimeout(function(){tone(760,0.14,'triangle',0.22);},110);setTimeout(function(){tone(1000,0.2,'triangle',0.22);},230);for(let i=0;i<5;i++)setTimeout(function(){tone(500+Math.random()*400,0.2,'triangle',0.05);},260+i*45);},
  cut(){tone(300,0.3,'sawtooth',0.16,150);setTimeout(function(){tone(190,0.4,'sawtooth',0.14,110);},150);},
  combo(n){tone(600+Math.min(n,8)*70,0.12,'triangle',0.16);},
  over(){tone(330,0.3,'sine',0.2,160);setTimeout(function(){tone(220,0.5,'sine',0.2,110);},180);},
  start(){tone(440,0.1,'triangle',0.18);setTimeout(function(){tone(660,0.16,'triangle',0.2);},110);},
};

function clamp(v,a,b){return v<a?a:v>b?b:v;}
function rnd(a,b){return a+Math.random()*(b-a);}

// ---------- state ----------
let state='title';
let outs=0,fails=0,score=0,combo=0,lvl=1;   // outs = assists
let best=0;try{best=parseInt(localStorage.getItem('nl_best')||'0')||0;}catch(e){}
const TARGET=26;

let phase='wind';  // wind | watch | result
let pt=0, clock=0;
let revealT=500, callWin=1000, tough=false, open='left'; // open = side to pass (defender covers the other)
let decided=false, result='', passed='';
let defX=450, defLunge=0;
let ballX=450, ballY=470, ballFly=0, ballTarget='left';
let parts=[];
let shakeT=0,flash=0;
let msg='',msgCol='#fff',msgT=0;
// teammate positions
const LT=[200,250], RT=[700,250], YOU=[450,470];

function reset(){outs=0;fails=0;score=0;combo=0;lvl=1;parts=[];}
function newPlay(){
  lvl=Math.min(7,1+Math.floor(outs/4));
  revealT=clamp(560-lvl*24,360,560);
  callWin=clamp(1020-lvl*70,560,1020);
  tough=Math.random()<clamp(0.2+lvl*0.05,0.2,0.5);
  open=Math.random()<0.5?'left':'right';
  phase='wind';pt=0;clock=0;decided=false;result='';passed='';
  defX=450;defLunge=0;ballX=YOU[0];ballY=YOU[1];ballFly=0;
}
function startGame(){reset();state='play';newPlay();S.start();}

function burst(x,y,col,n,sp){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=rnd(0.4,1)*(sp||3);parts.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:1,col:col,r:rnd(2,5)});}}

function resolve(kind){
  decided=true;result=kind;
  if(kind==='right'){
    outs++;combo++;
    const cm=1+Math.min(combo-1,6)*0.13;
    const add=Math.round((100+(tough?60:0))*cm)*Math.max(1,lvl);
    score+=add;lastAdd=add;ballFly=0;ballTarget=open;
    S.pass();setTimeout(S.goal,360);if(combo>1)setTimeout(function(){S.combo(combo);},500);
    flash=0.28;
    msg=(tough?'完璧なノールック！ 決定機を演出！':'ノールックで通した！ アシスト')+'  +'+add;msgCol='#5affa0';msgT=1;
  }else{
    combo=0;fails++;
    S.cut();flash=0.35;shakeT=0.7;ballFly=0;ballTarget=passed;
    if(result==='early')msg='早すぎ！ 読まれてコースを切られた';
    else if(result==='late')msg='迷った！ 出しどころを失った';
    else msg='引っかけた！ 相手の正面へパス';
    msgCol='#ff6a6a';msgT=1;
  }
  phase='result';pt=0;
}
let lastAdd=0;

function makeCall(c){
  if(state!=='play'||phase!=='watch'||decided)return;
  passed=c;
  if(clock<revealT){resolve('early');return;}
  resolve(c===open?'right':'wrong');
}

// ---------- input ----------
function passL(){if(!AC)actx();if(state==='title'){startGame();return;}if(state==='over'){startGame();return;}makeCall('left');}
function passR(){if(!AC)actx();if(state==='title'){startGame();return;}if(state==='over'){startGame();return;}makeCall('right');}
cv.addEventListener('mousedown',function(e){e.preventDefault();
  if(state!=='play'){passL();return;}
  const r=cv.getBoundingClientRect();const x=(e.clientX-r.left)/r.width*W;
  if(x<450)passL();else passR();
});
cv.addEventListener('touchstart',function(e){e.preventDefault();
  if(state!=='play'){passL();return;}
  const r=cv.getBoundingClientRect();const t=e.changedTouches[0];const x=(t.clientX-r.left)/r.width*W;
  if(x<450)passL();else passR();
},{passive:false});
window.addEventListener('keydown',function(e){
  if(e.code==='ArrowLeft'||e.code==='KeyA'){e.preventDefault();passL();}
  else if(e.code==='ArrowRight'||e.code==='KeyD'){e.preventDefault();passR();}
  else if(e.code==='Space'||e.code==='Enter'){e.preventDefault();if(state!=='play')passL();}
});

// ---------- update ----------
let last=0;
function update(dt){
  if(flash>0)flash=Math.max(0,flash-dt/300);
  if(shakeT>0)shakeT=Math.max(0,shakeT-dt/320);
  if(msgT>0)msgT=Math.max(0,msgT-dt/1500);
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.x+=p.vx;p.y+=p.vy;p.vy+=0.16;p.life-=dt/640;if(p.life<=0)parts.splice(i,1);}
  if(state!=='play')return;
  pt+=dt;
  const closed=(open==='left')?'right':'left'; // defender covers the closed (non-open) side
  if(phase==='wind'){
    if(pt>=440){phase='watch';pt=0;clock=0;S.set();}
  }else if(phase==='watch'){
    clock+=dt;
    if(clock>=revealT){
      const u=clamp((clock-revealT)/160,0,1);
      defLunge=u;
      defX=450+(closed==='left'?-120:120)*u;
      if(clock<revealT+18)S.lunge();
    }
    if(clock>=revealT+callWin&&!decided)resolve('late');
  }else if(phase==='result'){
    if(ballFly<1)ballFly=Math.min(1,ballFly+dt/300);
    const tgt=(ballTarget==='left')?LT:RT;
    ballX=YOU[0]+(tgt[0]-YOU[0])*ballFly;
    ballY=YOU[1]+(tgt[1]-YOU[1])*ballFly;
    if(result==='right'&&ballFly>=1&&Math.random()<0.3)burst(tgt[0],tgt[1],'#5affa0',1,1);
    if(pt>=1080){
      if(fails>=3){state='over';best=Math.max(best,score);try{localStorage.setItem('nl_best',String(best));}catch(e){}S.over();}
      else if(outs>=TARGET){state='over';best=Math.max(best,score);try{localStorage.setItem('nl_best',String(best));}catch(e){}S.start();}
      else newPlay();
    }
  }
}

// ---------- render ----------
function roundRect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

function drawField(){
  for(let i=0;i<9;i++){ctx.fillStyle=i%2?'#2b6b3d':'#256036';ctx.fillRect(0,i*(H/9),W,H/9);}
  ctx.strokeStyle='rgba(255,255,255,.5)';ctx.lineWidth=4;ctx.strokeRect(370,40,160,40);
  ctx.strokeStyle='rgba(255,255,255,.3)';ctx.lineWidth=2;ctx.strokeRect(280,40,340,150);
}

function drawPlayer(x,y,col,glow,face){
  ctx.save();ctx.translate(x,y);
  if(glow>0){ctx.strokeStyle='rgba(90,255,160,'+glow+')';ctx.lineWidth=4;ctx.beginPath();ctx.arc(0,-20,30,0,Math.PI*2);ctx.stroke();}
  ctx.fillStyle='rgba(0,0,0,.28)';ctx.beginPath();ctx.ellipse(0,6,16,6,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#222';ctx.fillRect(-9,-26,8,26);ctx.fillRect(2,-26,8,26);
  ctx.fillStyle=col;ctx.fillRect(-12,-54,24,30);
  ctx.fillStyle='#f0c9a0';ctx.beginPath();ctx.arc((face||0)*4,-62,9,0,Math.PI*2);ctx.fill();
  ctx.restore();
}

function drawScene(){
  drawField();
  // open teammate glows once revealed
  const revealed=(phase==='watch'&&clock>=revealT)||phase==='result';
  const lg=(revealed&&open==='left')?1:0, rg=(revealed&&open==='right')?1:0;
  drawPlayer(LT[0],LT[1],'#3f7de0',lg,0);
  drawPlayer(RT[0],RT[1],'#3f7de0',rg,0);
  // defender (covers closed side once revealed); face toward where you "look" = the closed side (no-look)
  drawPlayer(defX,340,'#d64545',0,0);
  if(revealed){
    // red X on the covered lane (the side the defender lunged to)
    const closed=(open==='left')?'right':'left';
    const cx=(closed==='left')?LT[0]:RT[0];
    ctx.strokeStyle='rgba(255,90,90,.8)';ctx.lineWidth=4;
    ctx.beginPath();ctx.moveTo(cx-14,300-14);ctx.lineTo(cx+14,300+14);ctx.moveTo(cx+14,300-14);ctx.lineTo(cx-14,300+14);ctx.stroke();
  }
  // you (playmaker): look at the closed side (gaze), pass to the open side
  const gaze=(revealed)?((open==='left')?1:-1):0; // look toward closed side
  drawPlayer(YOU[0],YOU[1],'#e8d24a',0,gaze);
  // ball
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(ballX,ballY,7,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#111';ctx.beginPath();ctx.arc(ballX,ballY,2.6,0,Math.PI*2);ctx.fill();
}

function drawReveal(){
  if(phase==='watch'&&clock>=revealT&&!decided){
    ctx.textAlign='center';ctx.font='bold 26px sans-serif';
    ctx.fillStyle='#ff9a9a';ctx.fillText('相手は'+(open==='left'?'右':'左')+'を切った！',450,150);
    ctx.font='14px sans-serif';ctx.fillStyle='#aaffcf';ctx.fillText('空いた'+(open==='left'?'左':'右')+'へノールックで通せ！',450,176);
  }
}

function drawButtons(){
  if(state!=='play')return;
  const active=(phase==='watch'&&!decided&&clock>=revealT);
  ctx.globalAlpha=active?1:0.5;
  roundRect(70,494,320,66,12);ctx.fillStyle=(passed==='left')?'#2f7db0':'rgba(30,90,140,.7)';ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,.5)';ctx.lineWidth=2;ctx.stroke();
  roundRect(510,494,320,66,12);ctx.fillStyle=(passed==='right')?'#2f7db0':'rgba(30,90,140,.7)';ctx.fill();ctx.stroke();
  ctx.globalAlpha=1;
  ctx.textAlign='center';ctx.fillStyle='#dff';ctx.font='bold 24px sans-serif';
  ctx.fillText('◀ 左へパス',230,528);ctx.fillText('右へパス ▶',670,528);
  ctx.font='12px sans-serif';ctx.fillStyle='#bcd';ctx.fillText('← / A',230,550);ctx.fillText('→ / D',670,550);
}

function drawHUD(){
  ctx.textAlign='left';ctx.textBaseline='alphabetic';
  ctx.font='bold 20px sans-serif';ctx.fillStyle='#fff';
  ctx.fillText('アシスト '+outs+' / '+TARGET,20,32);
  ctx.font='14px sans-serif';ctx.fillStyle='#ffb14a';ctx.fillText('ロスト '+fails+' / 3',20,54);
  ctx.textAlign='right';
  ctx.font='bold 20px sans-serif';ctx.fillStyle='#ffe08a';ctx.fillText('SCORE '+score,W-20,32);
  ctx.font='13px sans-serif';ctx.fillStyle='#bfe';ctx.fillText('BEST '+Math.max(best,score)+'   Lv.'+lvl,W-20,52);
  if(combo>1){ctx.textAlign='center';ctx.font='bold 20px sans-serif';ctx.fillStyle='#5affa0';ctx.fillText(combo+' 連続アシスト!',450,110);}
}

function drawMsg(){
  if(msgT<=0)return;
  ctx.save();ctx.globalAlpha=clamp(msgT*1.4,0,1);
  ctx.textAlign='center';ctx.font='bold 25px sans-serif';
  ctx.fillStyle='rgba(0,0,0,.55)';roundRect(450-280,118,560,44,10);ctx.fill();
  ctx.fillStyle=msgCol;ctx.fillText(msg,450,148);
  ctx.restore();
}

function drawTitle(){
  drawField();
  drawPlayer(LT[0],LT[1],'#3f7de0',0,0);drawPlayer(RT[0],RT[1],'#3f7de0',0,0);drawPlayer(450,340,'#d64545',0,0);drawPlayer(YOU[0],YOU[1],'#e8d24a',0,0);
  ctx.save();ctx.textAlign='center';
  ctx.fillStyle='rgba(0,0,0,.6)';roundRect(110,110,680,392,16);ctx.fill();
  ctx.fillStyle='#fff';ctx.font='bold 38px sans-serif';ctx.fillText('ノールックパス',450,172);
  ctx.font='18px sans-serif';ctx.fillStyle='#9fe0bf';ctx.fillText('No-Look Pass',450,202);
  ctx.font='16px sans-serif';ctx.fillStyle='#e6fcef';
  const lines=[
    'あなたは司令塔。両サイドに走り込む味方、間にはインターセプター。',
    '相手が“どちらのコースを切った（潰した）”かを一瞬で読み、',
    '空いた逆サイドの味方へノールックでスルーパスを通せ！',
    '相手の正面（切られた側）へ出すとカット。',
    '早すぎる（読む前の）パス・迷って出し遅れも失敗。',
    '左半分/← = 左へ、右半分/→ = 右へ。3ロストで終了。',
  ];
  for(let i=0;i<lines.length;i++)ctx.fillText(lines[i],450,244+i*30);
  ctx.fillStyle='#ffe08a';ctx.font='bold 22px sans-serif';
  ctx.fillText('タップ / SPACE でスタート',450,476);
  ctx.restore();
}

function drawOver(){
  drawField();
  ctx.save();ctx.textAlign='center';
  ctx.fillStyle='rgba(0,0,0,.6)';roundRect(190,150,520,300,16);ctx.fill();
  const w2=outs>=TARGET;
  ctx.fillStyle=w2?'#5affa0':'#ff8a5a';ctx.font='bold 36px sans-serif';
  ctx.fillText(w2?'司令塔の視野！':'読み負け続き…',450,222);
  ctx.fillStyle='#fff';ctx.font='20px sans-serif';
  ctx.fillText('アシスト '+outs+' / '+TARGET,450,270);
  ctx.fillText('スコア '+score,450,304);
  ctx.fillStyle='#ffe08a';ctx.fillText('ベスト '+Math.max(best,score),450,336);
  ctx.fillStyle='#9fe0bf';ctx.font='bold 20px sans-serif';
  ctx.fillText('タップ / SPACE でもう一度',450,404);
  ctx.restore();
}

function render(){
  ctx.save();
  if(shakeT>0){const s=shakeT*7;ctx.translate(rnd(-s,s),rnd(-s,s));}
  if(state==='title'){drawTitle();}
  else if(state==='over'){drawOver();}
  else{
    drawScene();
    drawButtons();
    drawReveal();
    drawHUD();
    drawMsg();
  }
  for(const p of parts){ctx.globalAlpha=clamp(p.life,0,1);ctx.fillStyle=p.col;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();}
  ctx.globalAlpha=1;
  ctx.restore();
  if(flash>0){ctx.fillStyle='rgba(255,255,255,'+(flash*0.5)+')';ctx.fillRect(0,0,W,H);}
}

function frame(ts){let dt=ts-last;last=ts;if(dt>60)dt=60;if(dt<0)dt=0;update(dt);render();requestAnimationFrame(frame);}
requestAnimationFrame(frame);

// ---------- test hook ----------
window.__nl={
  start:startGame,
  left:function(){makeCall('left');},
  right:function(){makeCall('right');},
  get state(){return state;},
  get outs(){return outs;},
  get fails(){return fails;},
  get score(){return score;},
  get info(){return {state:state,phase:phase,clock:clock,revealT:revealT,callWin:callWin,tough:tough,decided:decided,result:result,passed:passed,open:open,outs:outs,fails:fails,lvl:lvl,isLeftOpen:(open==='left'),revealed:(clock>=revealT),canAct:(state==='play'&&phase==='watch'&&!decided)};}
};
})();
</script>
</body>
</html>
