<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>パントキック (Launch the Counter)</title>
<style>
  html,body{margin:0;height:100%;background:#06110a;overflow:hidden;
    font-family:-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  #stage{position:relative;width:100vw;height:100vh;max-width:calc(100vh*1.5);max-height:calc(100vw/1.5);aspect-ratio:900/600;}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;border-radius:6px;}
</style>
</head>
<body>
<div id="wrap"><div id="stage"><canvas id="cv"></canvas></div></div>
<script>
(function(){
const W=900,H=600,cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let DPR=1;
function fit(){DPR=Math.min(2,window.devicePixelRatio||1);cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
fit();addEventListener('resize',fit);

// ---------- audio ----------
let AC=null;function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function tone(f,d,type,v,sweep){const a=ac();if(!a)return;const t=a.currentTime,o=a.createOscillator(),g=a.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(sweep)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+sweep),t+d);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v||0.2,t+0.008);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+0.02);}
function noise(d,v,hp){const a=ac();if(!a)return;const t=a.currentTime,n=Math.floor(a.sampleRate*d),buf=a.createBuffer(1,n,a.sampleRate),ch=buf.getChannelData(0);
  for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource();s.buffer=buf;
  const f=a.createBiquadFilter();f.type='highpass';f.frequency.value=hp||600;const g=a.createGain();g.gain.value=v||0.2;
  s.connect(f);f.connect(g);g.connect(a.destination);s.start(t);s.stop(t+d+0.02);}
const S={
  drop:()=>{tone(300,0.08,'sine',0.05,80);},
  boot:()=>{noise(0.06,0.22,300);tone(180,0.12,'square',0.12,60);},
  good:()=>{[680,940,1220].forEach((f,i)=>setTimeout(()=>tone(f,0.1,'triangle',0.16),i*55));},
  launch:()=>{[500,720,980,1240].forEach((f,i)=>setTimeout(()=>tone(f,0.11,'triangle',0.16),i*70));},
  bad:()=>{noise(0.18,0.2,300);tone(150,0.22,'sawtooth',0.12,-40);},
  streak:()=>{[700,930,1170,1400].forEach((f,i)=>setTimeout(()=>tone(f,0.1,'triangle',0.16),i*60));},
  over:()=>{[440,330,247,175].forEach((f,i)=>setTimeout(()=>tone(f,0.3,'triangle',0.2),i*160));}
};

// ---------- geometry ----------
const GKX=180, GKY=392;              // keeper
const TRKX=232, TRKTOP=250, TRKBOT=430;  // vertical fall track for the ball
const GROUNDY=470;

// ---------- state ----------
let state='title', phase='drop', plays=0;
let score=0, combo=0, best=+(localStorage.getItem('punt_best')||0);
let outs=0, fails=0, lvl=1;          // outs = counters launched, fails = giveaways
let clock=0, dropDur=1020, ballU=0, struck=false, strikeU=0;
let bandCenterU=0.5, bandHalfU=0.14, targetKind=1, tough=false, contest=1;
let result=null, resultT=0, reason='', flightT=0, flightDur=720, landX=500, landY=430, mateX=600, ok=false, quality=0;
let shake=0, flash=0, flashCol='#fff', last=performance.now();
let parts=[], pops=[];

const KINDS=[
  {name:'ショート', center:0.72, dist:0.24},
  {name:'ミドル',   center:0.50, dist:0.52},
  {name:'ロング',   center:0.28, dist:0.82}
];

function rnd(a,b){return a+Math.random()*(b-a);}
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function lerp(a,b,u){return a+(b-a)*u;}
function easeOut(u){return 1-Math.pow(1-u,2);}

function reset(){state='title';score=0;combo=0;outs=0;fails=0;lvl=1;plays=0;result=null;parts=[];pops=[];}
function trackY(u){return lerp(TRKTOP,TRKBOT,u);}
function mateXFor(cu){return lerp(GKX+90,860,1-cu);}   // higher contact (small u) => farther downfield

function newPlay(){
  plays++; lvl=Math.min(7,1+Math.floor(outs/4));
  dropDur=clamp(1060-lvl*46,740,1060);
  bandHalfU=clamp(0.145-lvl*0.009,0.076,0.145);
  targetKind=Math.floor(Math.random()*3);
  const k=KINDS[targetKind];
  bandCenterU=clamp(k.center+rnd(-0.05,0.05),0.16,0.82);
  tough=Math.random()<clamp(0.22+lvl*0.03,0.22,0.46);
  if(tough)bandHalfU*=0.72;                              // contested launch: tighter timing
  mateX=mateXFor(bandCenterU);
  struck=false; strikeU=0; ballU=0; result=null; reason=''; resultT=0; flightT=0; ok=false; quality=0;
  phase='drop'; clock=0; S.drop();
}
function start(){ if(!ac())ac(); if(AC&&AC.state==='suspended')AC.resume(); reset(); state='play'; newPlay(); }

function strike(){
  if(state==='title'){start();return;}
  if(state==='over'){ if(resultT>0.4){reset();start();} return; }
  if(state!=='play'||phase!=='drop'||struck) return;
  struck=true; strikeU=clamp(clock/dropDur,0,1);
  const err=strikeU-bandCenterU;
  S.boot();
  landX=mateXFor(strikeU); landY=GROUNDY;
  if(Math.abs(err)<=bandHalfU){ ok=true; quality=1-Math.abs(err)/bandHalfU; resolve('good'); }
  else if(err<0){ ok=false; resolve('long'); }       // struck too high/early -> overshoots
  else { ok=false; resolve('short'); }                // struck too low/late -> falls short
}

function resolve(k){
  phase='result'; result=k; resultT=0; flightT=0; anim0();
  if(k==='good'){
    outs++; combo++;
    const mult=1+Math.min(9,combo-1)*0.14;
    const add=Math.round((100+Math.round(quality*70)+(tough?110:0))*mult);
    score+=add;
    S.boot(); setTimeout(S.launch,120); flash=1;flashCol='#8affa0';shake=5;
    pop(mateX,GROUNDY-70,(tough?'完璧なカウンター！ +':'味方にドンピシャ！ +')+add,'#d6ffe0');
    if(combo>=2)pop(W/2,150,'コンボ x'+combo,'#ffd24d');
    if(combo>0&&combo%5===0)S.streak();
    reason='ナイスパント！ 走り込む味方に通してカウンター発動';
  } else {
    fails++; combo=0; flash=1;flashCol='#ff5b5b';shake=8; S.bad();
    if(k==='long') reason='蹴り上げが早く力み過ぎ…オーバーして相手ボール';
    else if(k==='short') reason='ミートが遅く力不足…手前でカットされる';
    else reason='蹴り損ね…ボールを地面に落として好機を逃す';
    pop(GKX+120,GROUNDY-60,k==='miss'?'蹴り損ね…':'カットされた…','#ffb0b0');
  }
  if(fails>=3){ state='over'; resultT=0; S.over(); if(score>best){best=score;localStorage.setItem('punt_best',best);} }
}
function anim0(){}

// ---------- input ----------
cv.addEventListener('pointerdown',e=>{e.preventDefault();strike();});
addEventListener('keydown',e=>{ if(e.repeat)return;
  if(e.code==='Space'||e.code==='Enter'||e.code==='ArrowUp'||e.code==='KeyF'||e.code==='KeyJ'){e.preventDefault();strike();} });

// ---------- particles ----------
function burst(x,y,c,n,sp){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=rnd(sp*0.3,sp);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:1,c});}}
function pop(x,y,txt,c){pops.push({x,y,txt,c,life:1});}

// ---------- update ----------
function update(dt){
  shake*=Math.pow(0.86,dt/16.7); if(shake<0.3)shake=0;
  flash*=Math.pow(0.9,dt/16.7);
  for(const p of parts){p.vx*=0.96;p.vy=p.vy*0.96+0.28;p.x+=p.vx*dt/16.7;p.y+=p.vy*dt/16.7;p.life-=dt/16.7*0.026;}
  parts=parts.filter(p=>p.life>0);
  for(const p of pops){p.y-=dt/16.7*0.5;p.life-=dt/16.7*0.02;}
  pops=pops.filter(p=>p.life>0);

  if(state!=='play'){ if(state==='over')resultT+=dt/1000; return; }
  if(phase==='drop'){ clock+=dt; ballU=clamp(clock/dropDur,0,1);
    if(!struck && clock>=dropDur){ struck=true; strikeU=1; resolve('miss'); }
    return; }
  if(phase==='result'){ resultT+=dt/1000; flightT+=dt; if(resultT>1.55) newPlay(); return; }
}

// ---------- render ----------
function drawScene(){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#0f5230');g.addColorStop(0.6,'#12703f');g.addColorStop(1,'#0d5730');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  // mow stripes
  for(let i=0;i<9;i++){ ctx.fillStyle=i%2?'rgba(255,255,255,0.03)':'rgba(0,0,0,0.03)'; ctx.fillRect(i*100,0,100,H); }
  // own goal (left)
  ctx.strokeStyle='rgba(255,255,255,0.8)';ctx.lineWidth=4;
  ctx.beginPath();ctx.moveTo(60,300);ctx.lineTo(60,470);ctx.stroke();
  ctx.strokeStyle='rgba(255,255,255,0.4)';ctx.lineWidth=2;
  ctx.strokeRect(60,300,70,170);
  // penalty arc hint
  ctx.beginPath();ctx.moveTo(60,250);ctx.lineTo(300,250);ctx.stroke();
}

function keeper(x,y,kick){
  ctx.fillStyle='#ffd54a';
  ctx.beginPath();ctx.ellipse(x,y+16,20,13,0,0,6.28);ctx.fill();     // shorts/legs
  ctx.fillStyle='#28c07a';ctx.beginPath();ctx.arc(x,y-10,15,0,6.28);ctx.fill(); // jersey
  ctx.fillStyle='#f0c9a0';ctx.beginPath();ctx.arc(x,y-34,11,0,6.28);ctx.fill(); // head
  // kicking leg
  ctx.strokeStyle='#ffd54a';ctx.lineWidth=7;ctx.lineCap='round';
  const ang=kick? -0.5 : 0.6;
  ctx.beginPath();ctx.moveTo(x+6,y+18);ctx.lineTo(x+6+Math.cos(ang)*30,y+18+Math.sin(ang)*30);ctx.stroke();ctx.lineCap='butt';
}

function render(){
  ctx.save();
  if(shake>0)ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
  drawScene();

  if(state==='play'||state==='over'){
    // downfield teammate (target)
    const showMate = state==='play';
    if(showMate){
      const mx=mateX, my=GROUNDY;
      // target zone marker on the pitch
      ctx.fillStyle='rgba(120,220,255,0.14)';ctx.beginPath();ctx.ellipse(mx,my+6,46,16,0,0,6.28);ctx.fill();
      ctx.strokeStyle='rgba(150,230,255,0.7)';ctx.lineWidth=2;ctx.setLineDash([5,4]);
      ctx.beginPath();ctx.ellipse(mx,my+6,46,16,0,0,6.28);ctx.stroke();ctx.setLineDash([]);
      // teammate figure
      ctx.fillStyle='#3aa0ff';ctx.beginPath();ctx.ellipse(mx,my-8,11,15,0,0,6.28);ctx.fill();
      ctx.fillStyle='#f0c9a0';ctx.beginPath();ctx.arc(mx,my-28,9,0,6.28);ctx.fill();
      ctx.fillStyle='rgba(150,230,255,0.9)';ctx.font='12px sans-serif';ctx.textAlign='center';
      ctx.fillText(KINDS[targetKind].name+'の味方',mx,my+34);
    }

    // keeper
    const kicking = phase==='result'&&result!=='miss';
    keeper(GKX,GKY,kicking);

    // fall track + power band (during drop)
    if(state==='play'&&phase==='drop'){
      ctx.strokeStyle='rgba(255,255,255,0.18)';ctx.lineWidth=2;
      ctx.beginPath();ctx.moveTo(TRKX,TRKTOP);ctx.lineTo(TRKX,TRKBOT);ctx.stroke();
      // band
      const by0=trackY(bandCenterU-bandHalfU), by1=trackY(bandCenterU+bandHalfU);
      ctx.fillStyle='rgba(90,240,130,0.30)';ctx.fillRect(TRKX-26,by0,52,by1-by0);
      ctx.strokeStyle='#7dff9a';ctx.lineWidth=2;ctx.strokeRect(TRKX-26,by0,52,by1-by0);
      ctx.fillStyle='#7dff9a';ctx.font='11px sans-serif';ctx.textAlign='left';ctx.fillText('ミート',TRKX+30,trackY(bandCenterU)+4);
      // labels top/bottom
      ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='10px sans-serif';ctx.textAlign='right';
      ctx.fillText('強い(遠く)',TRKX-30,TRKTOP+4);ctx.fillText('弱い(近く)',TRKX-30,TRKBOT+2);
      // falling ball
      const by=trackY(ballU);
      ctx.fillStyle='rgba(0,0,0,0.18)';ctx.beginPath();ctx.ellipse(TRKX,GROUNDY,14,4,0,0,6.28);ctx.fill();
      ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(TRKX,by,12,0,6.28);ctx.fill();
      ctx.strokeStyle='#222';ctx.lineWidth=1.4;ctx.beginPath();ctx.moveTo(TRKX-8,by-6);ctx.lineTo(TRKX+8,by+6);ctx.moveTo(TRKX+8,by-6);ctx.lineTo(TRKX-8,by+6);ctx.stroke();
    }

    // flight of the punt after strike
    if(phase==='result'&&result!=='miss'){
      const u=easeOut(clamp(flightT/flightDur,0,1));
      const sx=TRKX, sy=trackY(strikeU), ex=landX, ey=GROUNDY;
      const bx=lerp(sx,ex,u), arc=Math.sin(u*Math.PI)*(120+ (1-strikeU)*90), by=lerp(sy,ey,u)-arc;
      // trail
      ctx.strokeStyle='rgba(255,255,255,0.25)';ctx.lineWidth=2;ctx.beginPath();
      for(let s=0;s<=u;s+=0.05){const tx=lerp(sx,ex,s),ty=lerp(sy,ey,s)-Math.sin(s*Math.PI)*(120+(1-strikeU)*90);if(s===0)ctx.moveTo(tx,ty);else ctx.lineTo(tx,ty);}
      ctx.stroke();
      ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(bx,by,10,0,6.28);ctx.fill();
      ctx.strokeStyle='#c33';ctx.lineWidth=1.3;ctx.beginPath();ctx.arc(bx,by,10,0.4,2.2);ctx.stroke();
    }
    if(phase==='result'&&result==='miss'){
      ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(TRKX,GROUNDY,12,0,6.28);ctx.fill();
    }

    // cue text
    ctx.textAlign='center';
    if(state==='play'&&phase==='drop'){
      ctx.fillStyle='rgba(255,220,90,0.96)';ctx.font='bold 21px sans-serif';
      ctx.fillText('カウンター！ 落ちるボールをミートの帯で蹴れ',W/2,46);
      ctx.fillStyle='rgba(255,255,255,0.72)';ctx.font='14px sans-serif';
      ctx.fillText('緑の「ミート」帯に落ちてきた瞬間にタップ / SPACE ＝ '+KINDS[targetKind].name+'の味方へ',W/2,H-40);
    }
  }

  for(const p of parts){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,3.2,0,6.28);ctx.fill();}
  ctx.globalAlpha=1;
  for(const p of pops){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.font='bold 21px sans-serif';ctx.textAlign='center';ctx.fillText(p.txt,p.x,p.y);}
  ctx.globalAlpha=1;

  // HUD
  ctx.textAlign='left';ctx.fillStyle='#fff';ctx.font='bold 26px sans-serif';ctx.fillText('SCORE '+score,20,36);
  ctx.textAlign='right';ctx.fillStyle='rgba(255,255,255,0.9)';ctx.font='14px sans-serif';ctx.fillText('カウンター '+outs+'  Lv'+lvl,W-20,24);
  ctx.fillText('ロスト',W-96,46);
  for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(W-60+i*20,41,7,0,6.28);ctx.fillStyle=i<fails?'#ff5b5b':'rgba(255,255,255,0.25)';ctx.fill();}
  if(combo>=2){ctx.textAlign='center';ctx.fillStyle='#ffd24d';ctx.font='bold 18px sans-serif';ctx.fillText('コンボ x'+combo,W/2,110);}

  if(state==='play'&&phase==='result'&&reason){ctx.textAlign='center';ctx.fillStyle=result==='good'?'#9ff0b8':'#ff9a9a';ctx.font='bold 18px sans-serif';ctx.fillText(reason,W/2,H-64);}

  if(state==='title'){
    ctx.fillStyle='rgba(4,10,7,0.82)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='bold 40px sans-serif';ctx.fillText('パントキック',W/2,92);
    ctx.fillStyle='#ffd23e';ctx.font='bold 22px sans-serif';ctx.fillText('Launch the Counter',W/2,128);
    ctx.fillStyle='rgba(255,255,255,0.92)';ctx.font='16px sans-serif';
    ctx.fillText('GKがボールをキャッチ。前線へ走り出す味方にパントキックでカウンターを通せ',W/2,182);
    ctx.fillStyle='rgba(255,255,255,0.66)';ctx.font='14px sans-serif';
    ctx.fillText('手から落ちるボールが、縦のライン上の緑「ミート」帯に来た瞬間にタップ / SPACE',W/2,220);
    ctx.fillText('帯の高さ＝蹴る強さ＝飛距離。ショート/ミドル/ロングの味方に合った高さでミートする',W/2,244);
    ctx.fillText('早く（高く）蹴るとオーバー、遅く（低く）蹴ると力不足でカット、落とすと蹴り損ね',W/2,268);
    ctx.fillText('上級ほど落下が速く帯が狭い。競り合い（tough）のロングは帯がさらにシビア。3ロストで交代',W/2,292);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で開始',W/2,360);
    ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='14px sans-serif';ctx.fillText('BEST '+best,W/2,392);
  }
  if(state==='over'){
    ctx.fillStyle='rgba(4,10,7,0.84)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#ff6b6b';ctx.font='bold 46px sans-serif';ctx.fillText('3ロスト…交代',W/2,222);
    ctx.fillStyle='#fff';ctx.font='bold 40px sans-serif';ctx.fillText('SCORE '+score,W/2,290);
    ctx.fillStyle='rgba(255,255,255,0.85)';ctx.font='19px sans-serif';ctx.fillText('カウンター '+outs+'   BEST '+best,W/2,330);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で もう一度',W/2,402);
  }

  if(flash>0.02){ctx.globalAlpha=flash*0.5;ctx.fillStyle=flashCol;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}
  ctx.restore();

  ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,0.4)';ctx.font='12px sans-serif';
  ctx.fillText('パントキック：落ちるボールを緑「ミート」帯（＝味方への飛距離）でタップして蹴る。早蹴りはオーバー/遅蹴りはカット/落球は蹴り損ね、3ロストで交代',W/2,H-8);
}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

function frame(ts){let dt=ts-last;last=ts;if(dt>60)dt=60;if(dt<0)dt=0;update(dt);render();requestAnimationFrame(frame);}
requestAnimationFrame(frame);

// ---------- test hook ----------
window.__pk={
  start, strike:()=>strike(),
  get state(){return state;},
  get score(){return score;},
  get outs(){return outs;},
  get fails(){return fails;},
  get info(){return {state,phase,clock,dropDur,ballU,struck,strikeU,bandCenterU,bandHalfU,targetKind,tough,result,reason,outs,fails,lvl,
    inBand:(phase==='drop'&&Math.abs(clamp(clock/dropDur,0,1)-bandCenterU)<=bandHalfU),
    dropping:(phase==='drop')};}
};
})();
</script>
</body>
</html>
