<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ドリブル・キャリー — Dribble to Goal</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{width:100%;height:100%;background:#07131e;overflow:hidden;
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,system-ui,sans-serif;
    touch-action:none;user-select:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  #stage{position:relative;aspect-ratio:900/600;max-width:100%;max-height:100%;
    width:auto;height:auto;box-shadow:0 0 60px rgba(0,0,0,.6);}
  canvas{display:block;width:100%;height:100%;border-radius:6px;}
</style>
</head>
<body>
<div id="wrap"><div id="stage"><canvas id="c" width="900" height="600"></canvas></div></div>
<script>
(function(){
"use strict";
const TEST=location.hash.indexOf('test')>=0;
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
const W=900,H=600;
let dpr=Math.max(1,Math.min(2,window.devicePixelRatio||1));
function fit(){ dpr=Math.max(1,Math.min(2,window.devicePixelRatio||1)); cv.width=W*dpr; cv.height=H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0); }
fit(); window.addEventListener('resize',fit);

// ---- audio ----
let AC=null;
function ac(){ if(!AC){ try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){AC=null;} } return AC; }
function tone(f,d,type,g,f2){ const a=ac(); if(!a)return; const o=a.createOscillator(),gg=a.createGain();
  o.type=type||'sine'; o.frequency.setValueAtTime(f,a.currentTime); if(f2)o.frequency.exponentialRampToValueAtTime(f2,a.currentTime+d);
  gg.gain.setValueAtTime(0.0001,a.currentTime); gg.gain.exponentialRampToValueAtTime(g||0.2,a.currentTime+0.01);
  gg.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+d); o.connect(gg); gg.connect(a.destination); o.start(); o.stop(a.currentTime+d+0.02); }
function noise(d,g,cut){ const a=ac(); if(!a)return; const n=Math.floor(a.sampleRate*d),buf=a.createBuffer(1,n,a.sampleRate),ch=buf.getChannelData(0);
  for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(1-i/n); const src=a.createBufferSource(); src.buffer=buf;
  const f=a.createBiquadFilter(); f.type='lowpass'; f.frequency.value=cut||1200; const gg=a.createGain(); gg.gain.value=g||0.2;
  src.connect(f); f.connect(gg); gg.connect(a.destination); src.start(); }
const S={
  goal(){ noise(0.3,0.22,2600); tone(80,0.2,'sine',0.12,50); },
  cheer(){ const a=ac(); if(!a)return; noise(0.8,0.26,1900); for(let i=0;i<6;i++)setTimeout(()=>tone(480+Math.random()*320,0.34,'sine',0.05),i*44); },
  tackle(){ noise(0.2,0.4,800); tone(150,0.2,'square',0.16,80); },
  juke(){ noise(0.04,0.12,2600); },
  whistle(){ tone(2000,0.1,'square',0.1); },
  over(){ tone(240,0.4,'sawtooth',0.14,80); }
};

// ---- geometry ----
const GOALY=70, GML=346, GMR=554, BOX_X0=282, BOX_X1=618, BOX_Y=214;

// ---- state ----
let state='ready';   // ready, play, scored, over
let score=0, lives=3, best=0, level=0;
let player={x:450,y:544,vx:0,vy:0};
let target={x:450,y:544};
let defs=[];
let particles=[]; let crowd=[]; let trail=[];
let msg='',msgT=0;
let flash=0,flashCol='#fff',shakeT=0,shakeM=0;
let t=0, scoredTimer=0, invuln=0;

try{ best=parseInt(localStorage.getItem('dc_best')||'0',10)||0; }catch(e){}
for(let i=0;i<60;i++) crowd.push({x:Math.random()*W,y:6+Math.random()*40,c:['#e8544e','#f0c14b','#4a90d9','#fff','#5cc98a','#c98af0'][i%6],b:Math.random()*6.28});

function reset(){ score=0;lives=3;level=0; particles=[]; newRun(); }
function playerSpeed(){ return 244; }
function defSpeed(){ return 166+level*5; }

function newRun(){
  level=Math.min(12,score);
  player={x:450,y:548,vx:0,vy:0}; target={x:450,y:548}; trail=[];
  const n=Math.min(7, 2+Math.floor(score/2));
  defs=[];
  for(let i=0;i<n;i++){
    const x=150+ (i+0.5)*(600/n) + (Math.random()*60-30);
    const y=150+Math.random()*170;
    defs.push({x:Math.max(60,Math.min(840,x)),y,vx:0,vy:0});
  }
  invuln=0.8; scoredTimer=0;
  state='play';
  msg = score===0? 'ドリブルでゴールへ運べ！ ポインタ/ドラッグで進路を操作。切り返しでDFを剥がせ':''; msgT= score===0?200:0;
  if(score===0) S.whistle();
}

function goalScored(){
  score++; if(score>best){best=score; try{localStorage.setItem('dc_best',''+best);}catch(e){}}
  state='scored'; scoredTimer=1.0; msg='ゴォォル！ '+score+'点目！';
  S.goal(); setTimeout(S.cheer,80); flash=0.5; flashCol='#eafff0'; shakeT=14; shakeM=5;
  burst(player.x,player.y,'#ffe14d',26); burst(player.x,player.y,'#5cc98a',16);
}
function tackled(){
  lives--; streakBreak();
  S.tackle(); flash=0.34; flashCol='#ff9060'; shakeT=14; shakeM=6; burst(player.x,player.y,'#ff8f60',18);
  if(lives<=0){ setTimeout(()=>{ state='over'; msg='ゲームセット'; S.over(); }, 500); state='scored'; scoredTimer=0.5; }
  else { msg='ボールを奪われた！ 残り'+lives; msgT=90; state='scored'; scoredTimer=0.7; }
}
function streakBreak(){}
function burst(x,y,col,n){ for(let i=0;i<n;i++){ const a=Math.random()*6.28,sp=1+Math.random()*5;
  particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-2,life:1,col,r:2+Math.random()*3}); } }

// ---- input ----
function toStage(clientX,clientY){ const r=cv.getBoundingClientRect(); return {x:(clientX-r.left)/r.width*W,y:(clientY-r.top)/r.height*H}; }
let pointerDown=false;
cv.addEventListener('pointerdown',e=>{ e.preventDefault();
  const a=ac(); if(a&&a.state==='suspended')a.resume();
  if(state==='ready'||state==='over'){ reset(); return; }
  pointerDown=true; const p=toStage(e.clientX,e.clientY); target.x=p.x; target.y=p.y;
});
cv.addEventListener('pointermove',e=>{ const p=toStage(e.clientX,e.clientY);
  if(pointerDown || e.pointerType!=='touch'){ target.x=p.x; target.y=p.y; } });
window.addEventListener('pointerup',()=>{ pointerDown=false; });
// keyboard steering
const keys={};
window.addEventListener('keydown',e=>{ keys[e.code]=true; if((e.code==='Space'||e.code==='Enter')&&(state==='ready'||state==='over')){e.preventDefault();reset();} });
window.addEventListener('keyup',e=>{ keys[e.code]=false; });

// ---- update ----
let last=0;
function update(dt){
  t+=dt; if(msgT>0)msgT--; if(flash>0)flash=Math.max(0,flash-dt*2); if(shakeT>0)shakeT--;
  if(invuln>0)invuln-=dt;
  if(state==='play'){
    // keyboard target override
    let kx=0,ky=0;
    if(keys['ArrowLeft']||keys['KeyA'])kx-=1; if(keys['ArrowRight']||keys['KeyD'])kx+=1;
    if(keys['ArrowUp']||keys['KeyW'])ky-=1; if(keys['ArrowDown']||keys['KeyS'])ky+=1;
    if(kx||ky){ target.x=player.x+kx*200; target.y=player.y+ky*200; }
    // player moves toward target (nimble)
    const dx=target.x-player.x, dy=target.y-player.y, d=Math.hypot(dx,dy);
    const sp=playerSpeed();
    if(d>2){ const mv=Math.min(sp*dt, d); const pvx=dx/d*sp, pvy=dy/d*sp;
      // detect sharp cut for juke sfx
      const turn = (player.vx*pvx+player.vy*pvy); if(turn<0 && (Math.abs(player.vx)+Math.abs(player.vy))>120){ S.juke(); }
      player.vx=pvx; player.vy=pvy; player.x+=dx/d*mv; player.y+=dy/d*mv;
    } else { player.vx*=0.6; player.vy*=0.6; }
    player.x=Math.max(20,Math.min(880,player.x)); player.y=Math.max(GOALY,Math.min(580,player.y));
    trail.push({x:player.x,y:player.y}); if(trail.length>12)trail.shift();
    // defenders chase with momentum (steering + lead), overshoot on jukes
    for(const dfn of defs){
      const lead=0.12;
      const tx=player.x+player.vx*lead, ty=player.y+player.vy*lead;
      const ax=tx-dfn.x, ay=ty-dfn.y, ad=Math.hypot(ax,ay)||1;
      const desiredx=ax/ad*defSpeed(), desiredy=ay/ad*defSpeed();
      const accel=360;
      dfn.vx+=Math.max(-accel*dt,Math.min(accel*dt, desiredx-dfn.vx));
      dfn.vy+=Math.max(-accel*dt,Math.min(accel*dt, desiredy-dfn.vy));
      const spd=Math.hypot(dfn.vx,dfn.vy); if(spd>defSpeed()){ dfn.vx=dfn.vx/spd*defSpeed(); dfn.vy=dfn.vy/spd*defSpeed(); }
      dfn.x+=dfn.vx*dt; dfn.y+=dfn.vy*dt;
      // tackle
      if(invuln<=0 && Math.hypot(dfn.x-player.x,dfn.y-player.y)<18){ tackled(); return; }
    }
    // goal: carry the ball into the penalty box
    if(player.y<=BOX_Y && player.x>BOX_X0 && player.x<BOX_X1){ goalScored(); return; }
  }
  else if(state==='scored'){
    scoredTimer-=dt;
    if(scoredTimer<=0 && state==='scored'){
      if(lives>0) newRun();
    }
  }
  for(let i=particles.length-1;i>=0;i--){ const q=particles[i]; q.x+=q.vx;q.y+=q.vy;q.vy+=0.16;q.life-=dt*1.0; if(q.life<=0)particles.splice(i,1); }
}

// ---- draw ----
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

function drawField(){
  const g=ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,'#20844a'); g.addColorStop(1,'#166237');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  for(let i=0;i<10;i++){ if(i%2){ ctx.fillStyle='rgba(255,255,255,.03)'; ctx.fillRect(0,i*H/10,W,H/10); } }
  ctx.fillStyle='#0c1c28'; ctx.fillRect(0,0,W,38);
  for(const c of crowd){ const yy=c.y+Math.sin(t*3+c.b)*1.1; ctx.fillStyle=c.c; ctx.globalAlpha=.7; ctx.fillRect(c.x,yy,5,5); }
  ctx.globalAlpha=1;
  // box + goal
  ctx.strokeStyle='rgba(255,255,255,.45)'; ctx.lineWidth=3;
  ctx.strokeRect(BOX_X0,GOALY,BOX_X1-BOX_X0,BOX_Y-GOALY);
  ctx.strokeStyle='rgba(92,201,138,.5)'; ctx.setLineDash([10,8]); ctx.beginPath(); ctx.moveTo(BOX_X0,BOX_Y); ctx.lineTo(BOX_X1,BOX_Y); ctx.stroke(); ctx.setLineDash([]);
  // goal
  ctx.strokeStyle='#f4f8ff'; ctx.lineWidth=6; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(GML,GOALY); ctx.lineTo(GML,GOALY-30); ctx.lineTo(GMR,GOALY-30); ctx.lineTo(GMR,GOALY); ctx.stroke();
  ctx.strokeStyle='rgba(255,255,255,.12)'; ctx.lineWidth=1;
  for(let x=GML;x<=GMR;x+=12){ ctx.beginPath(); ctx.moveTo(x,GOALY-30); ctx.lineTo(x,GOALY); ctx.stroke(); }
}

function drawDefender(d){
  ctx.save(); ctx.translate(d.x,d.y);
  ctx.fillStyle='rgba(0,0,0,.24)'; ctx.beginPath(); ctx.ellipse(0,16,13,5,0,0,6.28); ctx.fill();
  const ang=Math.atan2(d.vy,d.vx); ctx.rotate(Math.sin(t*16)*0.05);
  ctx.strokeStyle='#20304a'; ctx.lineWidth=6; ctx.lineCap='round';
  const sw=Math.sin(t*18+d.x)*5;
  ctx.beginPath(); ctx.moveTo(-2,-4); ctx.lineTo(-5+sw,16); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(2,-4); ctx.lineTo(5-sw,16); ctx.stroke();
  ctx.fillStyle='#2b2f38'; rr(-12,-30,24,26,7); ctx.fill();
  ctx.fillStyle='#f0c39a'; ctx.beginPath(); ctx.arc(0,-36,7,0,6.28); ctx.fill();
  ctx.restore();
}

function drawPlayer(){
  // trail
  for(let i=0;i<trail.length;i++){ const q=trail[i]; ctx.globalAlpha=(i/trail.length)*0.25; ctx.fillStyle='#7fd0ff';
    ctx.beginPath(); ctx.arc(q.x,q.y,5,0,6.28); ctx.fill(); }
  ctx.globalAlpha=1;
  const p=player;
  ctx.save(); ctx.translate(p.x,p.y);
  ctx.fillStyle='rgba(0,0,0,.24)'; ctx.beginPath(); ctx.ellipse(0,16,13,5,0,0,6.28); ctx.fill();
  if(invuln>0 && (Math.floor(t*12)%2)) ctx.globalAlpha=0.5;
  ctx.strokeStyle='#20304a'; ctx.lineWidth=6; ctx.lineCap='round';
  const sw=Math.sin(t*22)*6;
  ctx.beginPath(); ctx.moveTo(-2,-4); ctx.lineTo(-5+sw,16); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(2,-4); ctx.lineTo(5-sw,16); ctx.stroke();
  ctx.fillStyle='#e8544e'; rr(-12,-30,24,26,7); ctx.fill();
  ctx.fillStyle='#f0c39a'; ctx.beginPath(); ctx.arc(0,-36,7,0,6.28); ctx.fill();
  ctx.globalAlpha=1;
  ctx.restore();
  // ball just ahead of player in movement dir
  const md=Math.hypot(p.vx,p.vy)||1; const bx=p.x+(p.vx/md)*16, by=p.y+(p.vy/md)*16+8;
  ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(bx,by,7,0,6.28); ctx.fill();
  ctx.fillStyle='#1a1a1a'; for(let i=0;i<5;i++){ const a=i/5*6.28+t*4; ctx.beginPath(); ctx.arc(bx+Math.cos(a)*3.5,by+Math.sin(a)*3.5,1.3,0,6.28); ctx.fill(); }
}

function drawHUD(){
  ctx.textAlign='left'; hud(14,10,'得点 GOALS',score,'#ffe14d');
  ctx.textAlign='center';
  // lives
  ctx.fillStyle='rgba(6,18,28,.72)'; rr(W/2-70,10,140,48,9); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.6)'; ctx.font='11px sans-serif'; ctx.fillText('ボール LIVES',W/2,27);
  for(let i=0;i<3;i++){ ctx.beginPath(); ctx.arc(W/2-24+i*24,44,8,0,6.28); ctx.fillStyle=i<lives?'#5cc98a':'rgba(255,255,255,.15)'; ctx.fill(); }
  ctx.textAlign='right'; hudR(W-14,10,'自己ベスト',best,'#7fd0ff');
}
function hud(x,y,l,v,c){ ctx.fillStyle='rgba(6,18,28,.72)'; rr(x,y,120,48,9); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.6)'; ctx.font='11px sans-serif'; ctx.textAlign='left'; ctx.fillText(l,x+10,y+17);
  ctx.fillStyle=c; ctx.font='bold 22px sans-serif'; ctx.fillText(v,x+10,y+41); }
function hudR(x,y,l,v,c){ const w=120; ctx.fillStyle='rgba(6,18,28,.72)'; rr(x-w,y,w,48,9); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.6)'; ctx.font='11px sans-serif'; ctx.textAlign='right'; ctx.fillText(l,x-10,y+17);
  ctx.fillStyle=c; ctx.font='bold 22px sans-serif'; ctx.fillText(v,x-10,y+41); }

function drawMsg(){ if(msgT>0&&msg){ const my=560; ctx.textAlign='center'; ctx.font='bold 19px sans-serif';
  const tw=ctx.measureText(msg).width; ctx.fillStyle='rgba(4,10,18,.62)'; rr(W/2-tw/2-14,my-24,tw+30,33,10); ctx.fill();
  ctx.fillStyle='#fff'; ctx.fillText(msg,W/2,my); }
  if(state==='scored' && msg && scoredTimer>0){ ctx.textAlign='center'; ctx.font='bold 30px sans-serif'; ctx.fillStyle='#fff';
    ctx.fillText(msg,W/2,300); } }

function drawOverlay(){
  ctx.fillStyle='rgba(4,10,18,.76)'; ctx.fillRect(0,0,W,H); ctx.textAlign='center';
  ctx.fillStyle='rgba(255,255,255,.55)'; ctx.font='14px sans-serif'; ctx.fillText('SOCCER · DRIBBLE  ·  GAME 40',W/2,120);
  ctx.fillStyle='#fff'; ctx.font='bold 46px sans-serif'; ctx.fillText('ドリブル・キャリー',W/2,180);
  ctx.fillStyle='#5cc98a'; ctx.font='bold 22px sans-serif'; ctx.fillText('Dribble to Goal',W/2,214);
  ctx.fillStyle='rgba(255,255,255,.82)'; ctx.font='16px sans-serif';
  const lines=['ポインタ（またはドラッグ／WASD・矢印）でボールを操作し、','群がるDFをかわしてゴールへ運べ！','DFは勢いがあるので、鋭い切り返しで置き去りにできる。','ゴール前の箱に運び込めば得点。得点ごとに敵が増え加速。','奪われるとボールを1つ失う。3つ失って終了。'];
  lines.forEach((l,i)=>ctx.fillText(l,W/2,252+i*25));
  const bw=220,bh=54,bx=(W-bw)/2,by=452; ctx.fillStyle='#e8544e'; rr(bx,by,bw,bh,12); ctx.fill();
  ctx.fillStyle='#fff'; ctx.font='bold 24px sans-serif'; ctx.fillText('キックオフ',W/2,by+35);
  ctx.fillStyle='rgba(255,255,255,.5)'; ctx.font='13px sans-serif'; ctx.fillText('タップ / Space',W/2,by+bh+22);
}
function drawOver(){
  ctx.fillStyle='rgba(4,10,18,.8)'; ctx.fillRect(0,0,W,H); ctx.textAlign='center';
  ctx.fillStyle='#fff'; ctx.font='bold 46px sans-serif'; ctx.fillText('ゲームセット',W/2,224);
  ctx.fillStyle='#ffe14d'; ctx.font='bold 30px sans-serif'; ctx.fillText('得点 '+score,W/2,278);
  ctx.fillStyle='#7fd0ff'; ctx.font='20px sans-serif'; ctx.fillText('自己ベスト '+best,W/2,314);
  const bw=220,bh=54,bx=(W-bw)/2,by=358; ctx.fillStyle='#e8544e'; rr(bx,by,bw,bh,12); ctx.fill();
  ctx.fillStyle='#fff'; ctx.font='bold 24px sans-serif'; ctx.fillText('もう一度',W/2,by+35);
  ctx.fillStyle='rgba(255,255,255,.5)'; ctx.font='13px sans-serif'; ctx.fillText('タップ / Space',W/2,by+bh+22);
}

function render(){
  ctx.save(); if(shakeT>0){ const s2=shakeM*(shakeT/14); ctx.translate((Math.random()*2-1)*s2,(Math.random()*2-1)*s2); }
  drawField();
  for(const d of defs) drawDefender(d);
  if(state!=='ready') drawPlayer();
  for(const q of particles){ ctx.globalAlpha=Math.max(0,q.life); ctx.fillStyle=q.col; ctx.beginPath(); ctx.arc(q.x,q.y,q.r,0,6.28); ctx.fill(); }
  ctx.globalAlpha=1;
  drawHUD(); drawMsg();
  ctx.restore();
  if(flash>0){ ctx.fillStyle=flashCol; ctx.globalAlpha=flash; ctx.fillRect(0,0,W,H); ctx.globalAlpha=1; }
  if(state==='ready') drawOverlay();
  if(state==='over') drawOver();
}
function loop(ts){ if(!last)last=ts; let dt=(ts-last)/1000; last=ts; if(dt>0.05)dt=0.05; update(dt); render(); requestAnimationFrame(loop); }
requestAnimationFrame(loop);

if(TEST){
  window.__dc={
    get state(){return state;},
    get player(){return {x:player.x,y:player.y};},
    get defs(){return defs.map(d=>({x:d.x,y:d.y}));},
    get goalY(){return GOALY;},
    get box(){return {x0:BOX_X0,x1:BOX_X1};},
    get score(){return score;},
    get lives(){return lives;},
    steer(x,y){ target.x=x; target.y=y; pointerDown=true; },
    tap(){ if(state==='ready'||state==='over')reset(); }
  };
}
})();
</script>
</body>
</html>
