<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>配球バトル — Pitch Sequencing Duel</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{width:100%;height:100%;background:#0a1622;overflow:hidden;
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,system-ui,sans-serif;
    touch-action:none;user-select:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  #stage{position:relative;aspect-ratio:900/600;max-width:100%;max-height:100%;
    width:auto;height:auto;box-shadow:0 0 60px rgba(0,0,0,.6);}
  canvas{display:block;width:100%;height:100%;border-radius:6px;}
</style>
</head>
<body>
<div id="wrap"><div id="stage"><canvas id="c" width="900" height="600"></canvas></div></div>
<script>
(function(){
"use strict";
const TEST=location.hash.indexOf('test')>=0;
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
const W=900,H=600;
let dpr=Math.max(1,Math.min(2,window.devicePixelRatio||1));
function fit(){ dpr=Math.max(1,Math.min(2,window.devicePixelRatio||1)); cv.width=W*dpr; cv.height=H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0); }
fit(); window.addEventListener('resize',fit);

// ---- audio ----
let AC=null;
function ac(){ if(!AC){ try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){AC=null;} } return AC; }
function tone(f,d,type,g,f2){ const a=ac(); if(!a)return; const o=a.createOscillator(),gg=a.createGain();
  o.type=type||'sine'; o.frequency.setValueAtTime(f,a.currentTime); if(f2)o.frequency.exponentialRampToValueAtTime(f2,a.currentTime+d);
  gg.gain.setValueAtTime(0.0001,a.currentTime); gg.gain.exponentialRampToValueAtTime(g||0.2,a.currentTime+0.01);
  gg.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+d); o.connect(gg); gg.connect(a.destination); o.start(); o.stop(a.currentTime+d+0.02); }
function noise(d,g,cut){ const a=ac(); if(!a)return; const n=Math.floor(a.sampleRate*d),buf=a.createBuffer(1,n,a.sampleRate),ch=buf.getChannelData(0);
  for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(1-i/n); const src=a.createBufferSource(); src.buffer=buf;
  const f=a.createBiquadFilter(); f.type='lowpass'; f.frequency.value=cut||1200; const gg=a.createGain(); gg.gain.value=g||0.2;
  src.connect(f); f.connect(gg); gg.connect(a.destination); src.start(); }
const S={
  mitt(){ noise(0.06,0.34,1400); tone(230,0.07,'triangle',0.16,150); },
  swing(){ noise(0.05,0.2,2600); },
  strike(){ tone(680,0.09,'square',0.16,920); },
  ball(){ tone(300,0.14,'sine',0.14,220); },
  foul(){ noise(0.05,0.22,2200); tone(400,0.07,'square',0.12,260); },
  k(){ S.strike(); setTimeout(()=>tone(880,0.16,'square',0.16,1300),90); setTimeout(()=>{const a=ac();if(a){noise(0.5,0.2,1900);}},160); },
  hit(){ noise(0.05,0.4,2500); tone(300,0.24,'sawtooth',0.16,110); },
  walk(){ tone(260,0.3,'square',0.14,180); },
  cheer(){ const a=ac(); if(!a)return; noise(0.6,0.22,1900); for(let i=0;i<4;i++)setTimeout(()=>tone(500+Math.random()*280,0.28,'sine',0.05),i*44); },
  whistle(){ tone(2000,0.1,'square',0.1); }
};

// ---- grid geometry (catcher view, 5x5; inner 3x3 = strike zone) ----
const GX0=326, GY0=138, CELL=62;               // 5x5 grid
function cellCenter(r,c){ return {x:GX0+c*CELL+CELL/2, y:GY0+r*CELL+CELL/2}; }
function isStrikeCell(r,c){ return r>=1&&r<=3&&c>=1&&c<=3; }
const PITCHER={x:450,y:70};

// ---- state ----
let state='ready';   // ready, pitch, result, over
let ks=0, runners=0, batters=0, streak=0, best=0, level=0;
let balls=0, strikes=0;
let sit={r:2,c:2};
let recent=[];       // recent thrown cells for drift
let anim=null;       // {fr,fc,t,dur}
let lastResult=null; // {type, cell}
let msg='',msgT=0;
let hoverCell=null;
let shakeT=0,shakeM=0,flash=0,flashCol='#fff';
let parts=[]; let crowd=[]; let t=0;
let batterLunge=0, batterName='', power=false;
const NAMES=['1番 俊足','2番 巧打','3番 主砲','4番 大砲','5番 中軸','6番 いぶし銀','7番 若手','8番 職人','9番 代打'];
const POWER_NAMES=['3番 主砲','4番 大砲'];

try{ best=parseInt(localStorage.getItem('pd_best')||'0',10)||0; }catch(e){}
for(let i=0;i<64;i++) crowd.push({x:Math.random()*W,y:6+Math.random()*40,c:['#e8544e','#f0c14b','#4a90d9','#fff','#5cc98a','#c98af0'][i%6],b:Math.random()*6.28});

function reset(){ ks=0;runners=0;batters=0;streak=0;level=0; parts=[]; newBatter(true); }
function levelUp(){ level=Math.min(9,Math.floor(ks/3)); }

function newBatter(first){
  levelUp();
  balls=0; strikes=0; recent=[];
  batters++;
  batterName=NAMES[(batters-1)%NAMES.length];
  power = POWER_NAMES.indexOf(batterName)>=0 || Math.random()<0.14;
  // starting sit: somewhere in/around the zone, weighted to zone
  sit={ r:1+Math.floor(Math.random()*3), c:1+Math.floor(Math.random()*3) };
  anim=null; lastResult=null;
  state='aim';
  if(!first){ /* keep */ }
  if(batters<=1){ msg='打者の"狙い"（赤）を外してコースを突け！ タップで投球'; msgT=170; }
  else { msg=''; msgT=0; }
}

function cheb(r,c){ return Math.max(Math.abs(r-sit.r), Math.abs(c-sit.c)); }

function resolve(r,c){
  const d=cheb(r,c), strike=isStrikeCell(r,c);
  let type;   // 'strike','ball','foul','hit','walk','K'
  if(d===0){
    if(strike){ type='hit'; } else { type='ball'; }
  } else if(d===1){
    if(strike){ type = power? 'hit' : 'foul'; }   // sluggers punish even the corners
    else { // just off the zone: chase only when protecting (2 strikes)
      type = (strikes>=2)? 'chase' : 'ball';
    }
  } else {
    type = strike? 'strike' : 'ball';
  }
  applyResult(type,r,c);
}

function applyResult(type,r,c){
  lastResult={type,cell:{r,c}};
  const cc=cellCenter(r,c);
  if(type==='hit'){
    runners++; streak=0; msg='痛打！ 芯で捉えられた…'; S.hit(); S.swing();
    flash=0.3; flashCol='#ff9060'; shakeT=13; shakeM=5; batterLunge=1; burst(cc.x,cc.y,'#ff8f60',16);
    endBatter(); return;
  }
  if(type==='ball'){
    balls++; S.ball();
    if(balls>=4){ runners++; streak=0; msg='フォアボール… 歩かせた'; S.walk(); flash=0.24; flashCol='#ffd0a0'; endBatter(); return; }
    msg='ボール ('+balls+'-'+strikes+')'; state='result'; msgT=70; scheduleNext(); return;
  }
  if(type==='foul'){
    S.foul(); S.swing(); batterLunge=1;
    if(strikes<2){ strikes++; }
    msg='ファウル ('+balls+'-'+strikes+')'; state='result'; msgT=70; scheduleNext(); return;
  }
  if(type==='strike' || type==='chase'){
    strikes++; batterLunge = type==='chase'?1:0.4;
    if(type==='chase'){ S.swing(); } S.strike();
    if(strikes>=3){ // strikeout
      ks++; streak++; if(streak>best){best=streak; save();}
      msg = type==='chase'? '空振り三振！ 誘い球ズバッ！':'見逃し／空振り三振！';
      if(streak>=3) msg+=`（${streak}連続K）`;
      S.k(); setTimeout(S.cheer,80); flash=0.42; flashCol='#eafff0'; shakeT=12; shakeM=4;
      burst(cc.x,cc.y,'#ffe14d',22); burst(cc.x,cc.y,'#5cc98a',12);
      endBatter(); return;
    }
    msg=(type==='chase'?'空振り！ ':'ストライク！ ')+'('+balls+'-'+strikes+')'; state='result'; msgT=70; scheduleNext(); return;
  }
}

function endBatter(){
  state='result'; msgT=140;
  if(runners>=3){ setTimeout(()=>{ state='over'; msg='ノックアウト… 3人出塁で交代'; msgT=99999; }, 950); }
  else setTimeout(()=>{ if(state==='result') newBatter(false); }, 1150);
}
function scheduleNext(){
  // drift the batter's sit toward recent pitches (learning)
  driftSit();
  setTimeout(()=>{ if(state==='result') state='aim'; }, 620);
}
function driftSit(){
  if(recent.length===0) return;
  const last=recent[recent.length-1];
  // move 1 step toward last pitch on each axis with prob
  if(Math.random()<0.7 && last.r!==sit.r) sit.r += last.r>sit.r?1:-1;
  if(Math.random()<0.7 && last.c!==sit.c) sit.c += last.c>sit.c?1:-1;
  // occasional independent jump to keep it fresh
  if(Math.random()<0.18){ sit.r=Math.max(0,Math.min(4,sit.r+(Math.random()<0.5?-1:1))); }
  sit.r=Math.max(0,Math.min(4,sit.r)); sit.c=Math.max(0,Math.min(4,sit.c));
}
function save(){ try{localStorage.setItem('pd_best',''+best);}catch(e){} }
function burst(x,y,col,n){ for(let i=0;i<n;i++){ const a=Math.random()*6.28,sp=1+Math.random()*5;
  parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-2,life:1,col,r:2+Math.random()*3}); } }

function throwTo(r,c){
  if(state!=='aim') return;
  recent.push({r,c}); if(recent.length>4)recent.shift();
  anim={fr:PITCHER.y,fc:PITCHER.x,tc:cellCenter(r,c),t:0,dur:0.34,r,c};
  state='pitch';
}

// ---- input ----
function cellAt(x,y){
  const c=Math.floor((x-GX0)/CELL), r=Math.floor((y-GY0)/CELL);
  if(r<0||r>4||c<0||c>4) return null;
  return {r,c};
}
function toStage(clientX,clientY){ const r=cv.getBoundingClientRect(); return {x:(clientX-r.left)/r.width*W,y:(clientY-r.top)/r.height*H}; }
cv.addEventListener('pointermove',e=>{ const p=toStage(e.clientX,e.clientY); hoverCell=cellAt(p.x,p.y); });
cv.addEventListener('pointerdown',e=>{ e.preventDefault();
  const a=ac(); if(a&&a.state==='suspended')a.resume();
  if(state==='ready'||state==='over'){ reset(); return; }
  if(state==='aim'){ const p=toStage(e.clientX,e.clientY); const cell=cellAt(p.x,p.y); if(cell) throwTo(cell.r,cell.c); }
});
window.addEventListener('keydown',e=>{ if((e.code==='Space'||e.code==='Enter')&&(state==='ready'||state==='over')){ e.preventDefault(); reset(); } });

// ---- update ----
let last=0;
function update(dt){
  t+=dt; if(msgT>0)msgT--; if(flash>0)flash=Math.max(0,flash-dt*2); if(shakeT>0)shakeT--;
  if(batterLunge>0)batterLunge=Math.max(0,batterLunge-dt*2.4);
  if(state==='pitch' && anim){
    anim.t+=dt;
    if(anim.t>=anim.dur){ S.mitt(); resolve(anim.r,anim.c); anim.done=true; }
  }
  for(let i=parts.length-1;i>=0;i--){ const q=parts[i]; q.x+=q.vx;q.y+=q.vy;q.vy+=0.16;q.life-=dt*1.1; if(q.life<=0)parts.splice(i,1); }
}

// ---- draw ----
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

function drawBG(){
  const g=ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,'#14324a'); g.addColorStop(1,'#0e2436');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#0c1c28'; ctx.fillRect(0,0,W,40);
  for(const c of crowd){ const yy=c.y+Math.sin(t*3+c.b)*1.1; ctx.fillStyle=c.c; ctx.globalAlpha=.7; ctx.fillRect(c.x,yy,5,5); }
  ctx.globalAlpha=1;
  // dirt behind plate
  ctx.fillStyle='#b5763e'; ctx.beginPath(); ctx.ellipse(450,520,240,70,0,0,6.28); ctx.fill();
  // home plate
  ctx.fillStyle='#fff'; ctx.beginPath();
  ctx.moveTo(420,506); ctx.lineTo(480,506); ctx.lineTo(480,516); ctx.lineTo(450,528); ctx.lineTo(420,516); ctx.closePath(); ctx.fill();
}

function drawBatter(){
  const bx=278, by=430;
  ctx.save(); ctx.translate(bx,by);
  ctx.fillStyle='rgba(0,0,0,.22)'; ctx.beginPath(); ctx.ellipse(0,50,26,7,0,0,6.28); ctx.fill();
  ctx.rotate(-batterLunge*0.4);
  // legs
  ctx.strokeStyle='#20304a'; ctx.lineWidth=9; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(-6,8); ctx.lineTo(-12,48); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(6,8); ctx.lineTo(14,48); ctx.stroke();
  // body
  ctx.fillStyle='#e8544e'; rr(-15,-40,30,52,9); ctx.fill();
  ctx.fillStyle='#f0c39a'; ctx.beginPath(); ctx.arc(0,-52,11,0,6.28); ctx.fill();
  ctx.fillStyle='#20304a'; ctx.beginPath(); ctx.arc(0,-54,11,Math.PI,0); ctx.fill();
  // bat
  ctx.strokeStyle='#b5763e'; ctx.lineWidth=7; ctx.lineCap='round';
  const ba=-0.7 - batterLunge*1.4;
  ctx.save(); ctx.translate(10,-30); ctx.rotate(ba);
  ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(0,-64); ctx.stroke(); ctx.restore();
  ctx.restore();
  ctx.fillStyle= power?'#ff8f60':'rgba(255,255,255,.6)'; ctx.font=power?'bold 12px sans-serif':'12px sans-serif'; ctx.textAlign='center';
  ctx.fillText(batterName+(power?' ⚡強打者':''),bx,by+72);
}

function drawGrid(){
  // outer grid faint
  for(let r=0;r<5;r++)for(let c=0;c<5;c++){
    const x=GX0+c*CELL,y=GY0+r*CELL;
    const strike=isStrikeCell(r,c);
    ctx.fillStyle= strike? 'rgba(255,255,255,.05)':'rgba(0,0,0,.10)';
    ctx.fillRect(x+1,y+1,CELL-2,CELL-2);
  }
  // sit highlight (batter's aim) + coverage
  if(state==='aim'||state==='pitch'){
    for(let r=0;r<5;r++)for(let c=0;c<5;c++){
      const d=Math.max(Math.abs(r-sit.r),Math.abs(c-sit.c));
      if(d===0){ ctx.fillStyle='rgba(232,84,78,.5)'; }
      else if(d===1){ ctx.fillStyle= power? 'rgba(232,84,78,.34)':'rgba(232,84,78,.16)'; }
      else continue;
      const x=GX0+c*CELL,y=GY0+r*CELL; ctx.fillRect(x+1,y+1,CELL-2,CELL-2);
    }
  }
  // hover
  if(state==='aim'&&hoverCell){ const x=GX0+hoverCell.c*CELL,y=GY0+hoverCell.r*CELL;
    ctx.strokeStyle='rgba(255,235,120,.9)'; ctx.lineWidth=3; ctx.strokeRect(x+2,y+2,CELL-4,CELL-4); }
  // strike zone bold box
  ctx.strokeStyle='rgba(255,255,255,.85)'; ctx.lineWidth=3;
  ctx.strokeRect(GX0+CELL, GY0+CELL, CELL*3, CELL*3);
  // grid lines
  ctx.strokeStyle='rgba(255,255,255,.14)'; ctx.lineWidth=1;
  for(let i=0;i<=5;i++){ ctx.beginPath(); ctx.moveTo(GX0+i*CELL,GY0); ctx.lineTo(GX0+i*CELL,GY0+5*CELL); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(GX0,GY0+i*CELL); ctx.lineTo(GX0+5*CELL,GY0+i*CELL); ctx.stroke(); }
  // labels
  ctx.fillStyle='rgba(255,255,255,.4)'; ctx.font='11px sans-serif'; ctx.textAlign='center';
  ctx.fillText('ストライクゾーン', GX0+CELL*2.5, GY0-8);
  if(state==='aim'){ ctx.fillStyle='rgba(232,84,78,.85)'; ctx.fillText('打者の狙い（赤を外せ）', GX0+CELL*2.5, GY0+5*CELL+18); }
}

function drawCatcher(){
  // mitt at bottom center
  ctx.save(); ctx.translate(450,470);
  ctx.fillStyle='#7a4a24'; ctx.beginPath(); ctx.arc(0,0,16,0,6.28); ctx.fill();
  ctx.strokeStyle='#5a3418'; ctx.lineWidth=3; ctx.beginPath(); ctx.arc(0,0,16,0,6.28); ctx.stroke();
  ctx.restore();
}

function drawBall(){
  if(state!=='pitch'||!anim) return;
  const p=Math.min(1,anim.t/anim.dur);
  const x=anim.fc+(anim.tc.x-anim.fc)*p, y=anim.fr+(anim.tc.y-anim.fr)*p;
  const r=10-4*p;
  ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(x,y,r,0,6.28); ctx.fill();
  ctx.strokeStyle='#d33'; ctx.lineWidth=1; ctx.beginPath(); ctx.arc(x-1,y-1,r,0.4,1.9); ctx.stroke();
}

function drawCount(){
  // B-S-count and results
  const bx=690,by=150;
  ctx.fillStyle='rgba(6,18,28,.72)'; rr(bx,by,190,120,10); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.6)'; ctx.font='12px sans-serif'; ctx.textAlign='left';
  ctx.fillText('カウント',bx+16,by+24);
  // balls
  ctx.fillText('B',bx+16,by+52); for(let i=0;i<3;i++){ ctx.beginPath(); ctx.arc(bx+40+i*24,by+48,8,0,6.28);
    ctx.fillStyle=i<balls?'#5cc98a':'rgba(255,255,255,.15)'; ctx.fill(); ctx.fillStyle='rgba(255,255,255,.6)'; }
  ctx.fillText('S',bx+16,by+82); for(let i=0;i<2;i++){ ctx.beginPath(); ctx.arc(bx+40+i*24,by+78,8,0,6.28);
    ctx.fillStyle=i<strikes?'#ffd23e':'rgba(255,255,255,.15)'; ctx.fill(); ctx.fillStyle='rgba(255,255,255,.6)'; }
  ctx.fillStyle='rgba(255,255,255,.6)'; ctx.fillText('出塁 (失点圏)',bx+16,by+108);
  for(let i=0;i<3;i++){ ctx.beginPath(); ctx.arc(bx+120+i*22,by+104,8,0,6.28);
    ctx.fillStyle=i<runners?'#ff7d6b':'rgba(255,255,255,.15)'; ctx.fill(); }
}

function drawHUD(){
  ctx.textAlign='left'; hud(14,10,'奪三振 K',ks,'#ffe14d');
  ctx.textAlign='center'; hudC(W/2,10,'連続K STREAK',streak,'#7fd0ff');
  ctx.textAlign='right'; hudR(W-14,10,'打者 No.',batters,'#9fd0ff');
  ctx.fillStyle='rgba(255,255,255,.5)'; ctx.font='12px sans-serif'; ctx.textAlign='left';
  ctx.fillText('自己ベスト連続K '+best, 16, 78);
}
function hud(x,y,l,v,c){ ctx.fillStyle='rgba(6,18,28,.72)'; rr(x,y,120,48,9); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.6)'; ctx.font='11px sans-serif'; ctx.textAlign='left'; ctx.fillText(l,x+10,y+17);
  ctx.fillStyle=c; ctx.font='bold 21px sans-serif'; ctx.fillText(v,x+10,y+40); }
function hudC(x,y,l,v,c){ const w=126; ctx.fillStyle='rgba(6,18,28,.72)'; rr(x-w/2,y,w,48,9); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.6)'; ctx.font='11px sans-serif'; ctx.textAlign='center'; ctx.fillText(l,x,y+17);
  ctx.fillStyle=c; ctx.font='bold 21px sans-serif'; ctx.fillText(v,x,y+40); }
function hudR(x,y,l,v,c){ const w=116; ctx.fillStyle='rgba(6,18,28,.72)'; rr(x-w,y,w,48,9); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.6)'; ctx.font='11px sans-serif'; ctx.textAlign='right'; ctx.fillText(l,x-10,y+17);
  ctx.fillStyle=c; ctx.font='bold 21px sans-serif'; ctx.fillText(v,x-10,y+40); }

function drawMsg(){ if(msgT>0&&msg){ const my=560; ctx.textAlign='center'; ctx.font='bold 20px sans-serif';
  const tw=ctx.measureText(msg).width; ctx.fillStyle='rgba(4,10,18,.66)'; rr(W/2-tw/2-14,my-24,tw+30,33,10); ctx.fill();
  ctx.fillStyle='#fff'; ctx.fillText(msg,W/2,my); } }

function drawOverlay(){
  ctx.fillStyle='rgba(4,10,18,.78)'; ctx.fillRect(0,0,W,H); ctx.textAlign='center';
  ctx.fillStyle='rgba(255,255,255,.55)'; ctx.font='14px sans-serif'; ctx.fillText('BASEBALL · PITCHING DUEL',W/2,120);
  ctx.fillStyle='#fff'; ctx.font='bold 52px sans-serif'; ctx.fillText('配球バトル',W/2,178);
  ctx.fillStyle='#ffe14d'; ctx.font='bold 22px sans-serif'; ctx.fillText('Pitch Sequencing Duel',W/2,212);
  ctx.fillStyle='rgba(255,255,255,.82)'; ctx.font='15px sans-serif';
  const lines=['打者は毎球"狙い"（赤）を定める。読み合いで討ち取れ！',
    '・赤を外したゾーン内 → ストライク　・角(隣接) → ファウル',
    '・ど真ん中＝狙い直撃 → 痛打　・ボールの投げ過ぎ → 四球',
    '・2ストライクなら狙いの隣にボール球で"誘い球"→空振りK',
    '狙いは投げた所へ寄っていく。散らして3ストライクを奪え。',
    '3人出塁されたらノックアウト。'];
  lines.forEach((l,i)=>ctx.fillText(l,W/2,250+i*24));
  const bw=220,bh=52,bx=(W-bw)/2,by=452; ctx.fillStyle='#e8544e'; rr(bx,by,bw,bh,12); ctx.fill();
  ctx.fillStyle='#fff'; ctx.font='bold 24px sans-serif'; ctx.fillText('プレイボール',W/2,by+34);
  ctx.fillStyle='rgba(255,255,255,.5)'; ctx.font='13px sans-serif'; ctx.fillText('タップ / Space',W/2,by+bh+22);
}
function drawOver(){
  ctx.fillStyle='rgba(4,10,18,.82)'; ctx.fillRect(0,0,W,H); ctx.textAlign='center';
  ctx.fillStyle='#fff'; ctx.font='bold 44px sans-serif'; ctx.fillText('ノックアウト',W/2,220);
  ctx.fillStyle='#ffe14d'; ctx.font='bold 28px sans-serif'; ctx.fillText('奪三振 '+ks+' 個',W/2,274);
  ctx.fillStyle='#5cc98a'; ctx.font='20px sans-serif'; ctx.fillText('自己ベスト連続K '+best,W/2,310);
  const bw=220,bh=54,bx=(W-bw)/2,by=356; ctx.fillStyle='#e8544e'; rr(bx,by,bw,bh,12); ctx.fill();
  ctx.fillStyle='#fff'; ctx.font='bold 24px sans-serif'; ctx.fillText('もう一度',W/2,by+35);
  ctx.fillStyle='rgba(255,255,255,.5)'; ctx.font='13px sans-serif'; ctx.fillText('タップ / Space',W/2,by+bh+22);
}

function render(){
  ctx.save(); if(shakeT>0){ const s=shakeM*(shakeT/13); ctx.translate((Math.random()*2-1)*s,(Math.random()*2-1)*s); }
  drawBG(); drawBatter(); drawCatcher(); drawGrid(); drawBall();
  for(const q of parts){ ctx.globalAlpha=Math.max(0,q.life); ctx.fillStyle=q.col; ctx.beginPath(); ctx.arc(q.x,q.y,q.r,0,6.28); ctx.fill(); }
  ctx.globalAlpha=1;
  drawCount(); drawHUD(); drawMsg();
  ctx.restore();
  if(flash>0){ ctx.fillStyle=flashCol; ctx.globalAlpha=flash; ctx.fillRect(0,0,W,H); ctx.globalAlpha=1; }
  if(state==='ready') drawOverlay();
  if(state==='over') drawOver();
}
function loop(ts){ if(!last)last=ts; let dt=(ts-last)/1000; last=ts; if(dt>0.05)dt=0.05; update(dt); render(); requestAnimationFrame(loop); }
requestAnimationFrame(loop);

if(TEST){
  window.__pd={
    get state(){return state;},
    get sit(){return {r:sit.r,c:sit.c};},
    get balls(){return balls;},
    get strikes(){return strikes;},
    get power(){return power;},
    get lastResult(){return lastResult?lastResult.type:null;},
    get count(){return {ks,runners,batters,streak,level};},
    isStrikeCell(r,c){return isStrikeCell(r,c);},
    throwTo(r,c){ throwTo(r,c); }
  };
}
})();
</script>
