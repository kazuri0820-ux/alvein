<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>スイング軌道 (Match the Plane)</title>
<style>
  html,body{margin:0;height:100%;background:#0a1207;overflow:hidden;
    font-family:-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  #stage{position:relative;width:100vw;height:100vh;max-width:calc(100vh*1.5);max-height:calc(100vw/1.5);aspect-ratio:900/600;}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;border-radius:6px;}
</style>
</head>
<body>
<div id="wrap"><div id="stage"><canvas id="cv"></canvas></div></div>
<script>
(function(){
const W=900,H=600,cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let DPR=1;
function fit(){DPR=Math.min(2,window.devicePixelRatio||1);cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
fit();addEventListener('resize',fit);

// ---------- audio ----------
let AC=null;function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function tone(f,d,type,v,sweep){const a=ac();if(!a)return;const t=a.currentTime,o=a.createOscillator(),g=a.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(sweep)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+sweep),t+d);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v||0.2,t+0.008);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+0.02);}
function noise(d,v,hp){const a=ac();if(!a)return;const t=a.currentTime,n=Math.floor(a.sampleRate*d),buf=a.createBuffer(1,n,a.sampleRate),ch=buf.getChannelData(0);
  for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource();s.buffer=buf;
  const f=a.createBiquadFilter();f.type='highpass';f.frequency.value=hp||600;const g=a.createGain();g.gain.value=v||0.2;
  s.connect(f);f.connect(g);g.connect(a.destination);s.start(t);s.stop(t+d+0.02);}
const S={
  pitch:()=>{tone(280,0.06,'sine',0.05,80);},
  crack:()=>{noise(0.05,0.2,500);tone(220,0.07,'square',0.13,-50);},
  hit:()=>{[680,940,1220].forEach((f,i)=>setTimeout(()=>tone(f,0.1,'triangle',0.16),i*55));},
  homer:()=>{[620,840,1080,1360,1650].forEach((f,i)=>setTimeout(()=>tone(f,0.12,'triangle',0.18),i*75));},
  weak:()=>{noise(0.05,0.1,400);tone(200,0.1,'sine',0.08,-40);},
  whiff:()=>{noise(0.1,0.14,700);tone(300,0.06,'triangle',0.05,-140);},
  bad:()=>{noise(0.16,0.2,300);tone(150,0.2,'sawtooth',0.11,-40);},
  streak:()=>{[700,930,1170,1400].forEach((f,i)=>setTimeout(()=>tone(f,0.1,'triangle',0.16),i*60));},
  over:()=>{[440,330,247,175].forEach((f,i)=>setTimeout(()=>tone(f,0.3,'triangle',0.2),i*160));}
};

// ---------- geometry ----------
const PIT={x:180,y:250}, PLATE={x:610,y:430}, BAT={x:672,y:420};
const ZX=560, ZW=110, ZTOP=250, ZBOT=430, ZMID=(ZTOP+ZBOT)/2;   // strike zone
const BTN=[
  {k:'level', x:150,label:'レベル',sub:'高め＝上から叩く',col:'#4aa3ff'},
  {k:'uppercut', x:520,label:'アッパー',sub:'低め＝下から掬う',col:'#e0904b'}
];
const BW=230, BY=512, BH=62;

// ---------- state ----------
let state='title', phase='pitch', plays=0;
let score=0, combo=0, best=+(localStorage.getItem('sp_best')||0);
let outs=0, fails=0, lvl=1;   // outs = hits
let t=0, swingT=650, w=440, revealLead=340, loc='high', tough=false;
let decided=false, result=null, resultT=0, msg='', msgOk=false, swingAt=0, planePicked=null;
let ballU=0, hitU=0, hy=ZMID;
let shake=0, flash=0, flashCol='#fff', last=performance.now();
let parts=[], pops=[];

function rnd(a,b){return a+Math.random()*(b-a);}
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function lerp(a,b,u){return a+(b-a)*u;}
function easeOut(u){return 1-Math.pow(1-u,2);}
function revealT(){return swingT-revealLead;}
function needPlane(){return loc==='high'?'level':'uppercut';}

function reset(){state='title';score=0;combo=0;outs=0;fails=0;lvl=1;plays=0;result=null;parts=[];pops=[];}

function newPlay(){
  plays++; lvl=Math.min(7,1+Math.floor(outs/4));
  swingT=clamp(680-lvl*26,480,680);
  w=clamp(450-lvl*24,300,450);
  revealLead=clamp(360-lvl*16,230,360);
  tough=Math.random()<clamp(0.18+lvl*0.05,0.18,0.5);
  loc=(Math.random()<0.5?'high':'low');
  phase='pitch'; t=0; decided=false; result=null; resultT=0; msg=''; msgOk=false; swingAt=0; planePicked=null;
  ballU=0; hitU=0; hy=(loc==='high')?ZTOP+26:ZBOT-26;
  S.pitch();
}
function start(){ if(!ac())ac(); if(AC&&AC.state==='suspended')AC.resume(); reset(); state='play'; newPlay(); }

function act(plane){
  if(state==='title'){start();return;}
  if(state==='over'){ if(resultT>0.4){reset();start();} return; }
  if(state!=='play'||phase!=='pitch'||decided||plane==null) return;
  decided=true; swingAt=t; planePicked=plane;
  if(t<swingT){ resolve('early'); return; }
  if(t<=swingT+w){ resolve(plane===needPlane()?'hit':'weak'); return; }
  resolve('late');
}

function resolve(k){
  phase='result'; result=k; resultT=0;
  if(k==='hit'){
    outs++; combo++;
    const perfect=(Math.abs(swingAt-(swingT+w*0.28))<w*0.22);
    let base=tough?250:150; if(perfect)base+=80;
    let add=Math.round(base*(1+Math.min(9,combo-1)*0.14)); score+=add;
    S.crack(); setTimeout(S.hit,70); if(perfect||tough)setTimeout(S.homer,150);
    msgOk=true; flash=1;flashCol='#8affa0';shake=6; burst(ZX,hy,'#8affa0',18,8);
    pop(ZX,ZTOP-24,(perfect?'会心の一撃！ +':'芯で捉えた！ +')+add,'#d6ffe0');
    if(combo>=2)pop(W/2,160,'コンボ x'+combo,'#ffd24d');
    if(combo>0&&combo%5===0)S.streak();
    msg=(loc==='high')?'高めをレベルに叩いてライナー——軌道が合った会心の当たり':'低めをアッパーで掬い上げて長打——軌道ドンピシャ！';
  } else {
    fails++; combo=0; msgOk=false; flash=1;flashCol='#ff5b5b';shake=9;
    if(k==='early'){ S.whiff(); msg='振り出しが早い…球が来る前に振ってしまい空振り'; pop(ZX,hy,'空振り…','#ffb0b0'); }
    else if(k==='late'){ S.whiff(); msg='振り遅れ…差し込まれて空振り'; pop(ZX,hy,'振り遅れ…','#ffb0b0'); }
    else { S.weak(); // wrong plane
      msg=(loc==='high')?'軌道ミス…高めをアッパーで掬い、力ないポップフライ（凡退）':'軌道ミス…低めをレベルに叩き、ボテボテのゴロ（凡退）';
      pop(ZX,hy,(loc==='high')?'ポップフライ…':'ゴロ…','#ffb0b0'); }
  }
  if(fails>=3){ state='over'; resultT=0; setTimeout(S.over,200); if(score>best){best=score;localStorage.setItem('sp_best',best);} }
}

// ---------- input ----------
cv.addEventListener('pointerdown',e=>{e.preventDefault();
  if(state!=='play'||phase!=='pitch'){ act('level'); return; }
  const r=cv.getBoundingClientRect(); const x=(e.clientX-r.left)/r.width*W, y=(e.clientY-r.top)/r.height*H;
  for(const b of BTN){ if(x>=b.x&&x<=b.x+BW&&y>=BY&&y<=BY+BH){ act(b.k); return; } }
  // fallback: upper half of screen = level, lower half = uppercut
  act(y<H*0.5?'level':'uppercut');
});
addEventListener('keydown',e=>{ if(e.repeat)return;
  if(e.code==='ArrowDown'||e.code==='KeyS'||e.code==='Digit1'){e.preventDefault();act('level');}
  else if(e.code==='ArrowUp'||e.code==='KeyW'||e.code==='Digit2'){e.preventDefault();act('uppercut');}
  else if(e.code==='Space'||e.code==='Enter'){e.preventDefault(); if(state!=='play')act('level');} });

// ---------- particles ----------
function burst(x,y,c,n,sp){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=rnd(sp*0.3,sp);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:1,c});}}
function pop(x,y,txt,c){pops.push({x,y,txt,c,life:1});}

// ---------- update ----------
function update(dt){
  shake*=Math.pow(0.86,dt/16.7); if(shake<0.3)shake=0;
  flash*=Math.pow(0.9,dt/16.7);
  for(const p of parts){p.vx*=0.96;p.vy=p.vy*0.96+0.28;p.x+=p.vx*dt/16.7;p.y+=p.vy*dt/16.7;p.life-=dt/16.7*0.026;}
  parts=parts.filter(p=>p.life>0);
  for(const p of pops){p.y-=dt/16.7*0.5;p.life-=dt/16.7*0.02;}
  pops=pops.filter(p=>p.life>0);

  if(state!=='play'){ if(state==='over')resultT+=dt/1000; return; }
  if(phase==='pitch'){ t+=dt;
    ballU=clamp(t/(swingT+w*0.5),0,1);
    if(!decided && t>swingT+w){ decided=true; swingAt=t; resolve('late'); }
    return; }
  if(phase==='result'){ resultT+=dt/1000; hitU=Math.min(1,hitU+dt/300);
    if(resultT>1.5) newPlay(); return; }
}

// ---------- render ----------
function drawField(){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#123f22');g.addColorStop(0.5,'#0f5e34');g.addColorStop(1,'#0b3f24');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='rgba(122,84,51,0.5)';ctx.beginPath();ctx.ellipse(PIT.x,PIT.y+30,66,24,0,0,6.28);ctx.fill();
}
function person(x,y,col,s){s=s||1;ctx.fillStyle=col;ctx.beginPath();ctx.ellipse(x,y-16*s,11*s,18*s,0,0,6.28);ctx.fill();
  ctx.fillStyle='#f0c9a0';ctx.beginPath();ctx.arc(x,y-38*s,8.5*s,0,6.28);ctx.fill();}

function render(){
  ctx.save();
  if(shake>0)ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
  drawField();

  // strike zone with high/low halves
  const revealed=(phase==='pitch'&&t>=revealT())||phase==='result';
  ctx.strokeStyle='rgba(255,255,255,0.5)';ctx.lineWidth=2;ctx.strokeRect(ZX-ZW/2,ZTOP,ZW,ZBOT-ZTOP);
  ctx.strokeStyle='rgba(255,255,255,0.22)';ctx.beginPath();ctx.moveTo(ZX-ZW/2,ZMID);ctx.lineTo(ZX+ZW/2,ZMID);ctx.stroke();
  if(revealed){
    const hi=(loc==='high');
    ctx.fillStyle=hi?'rgba(74,163,255,0.16)':'rgba(255,255,255,0)';ctx.fillRect(ZX-ZW/2,ZTOP,ZW,ZMID-ZTOP);
    ctx.fillStyle=!hi?'rgba(224,144,75,0.16)':'rgba(255,255,255,0)';ctx.fillRect(ZX-ZW/2,ZMID,ZW,ZBOT-ZMID);
    ctx.fillStyle=hi?'rgba(120,190,255,0.95)':'rgba(255,190,120,0.95)';ctx.font='bold 15px sans-serif';ctx.textAlign='center';
    ctx.fillText(hi?'高め → レベル':'低め → アッパー',ZX,hi?ZTOP-8:ZBOT+20);
  } else {
    ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='13px sans-serif';ctx.textAlign='center';ctx.fillText('コース見極め中…',ZX,ZTOP-8);
  }

  if(state==='play'||state==='over'){
    person(PIT.x,PIT.y,'#c23b34',1);
    // batter with bat
    ctx.save();ctx.translate(BAT.x,BAT.y);person(0,0,'#2b6fd6',1);
    let ba=-2.3; if(phase==='result'&&(result==='hit'||result==='weak')) ba=-2.3+easeOut(hitU)*2.5;
    else if(phase==='result') ba=-2.3+easeOut(hitU)*2.5; // whiff also swings
    ctx.strokeStyle='#cebb88';ctx.lineWidth=6;ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(-6,-30);ctx.lineTo(-6+Math.cos(ba)*46,-30+Math.sin(ba)*46);ctx.stroke();ctx.lineCap='butt';
    ctx.restore();

    // ball
    let bx,by;
    if(phase==='pitch'){ const u=clamp(t/swingT,0,1);
      bx=lerp(PIT.x+14,ZX,u);
      // starts middle, breaks to loc late (deceptive)
      const brk=clamp((u-0.5)/0.5,0,1); by=lerp(PIT.y-8,lerp(ZMID,hy,brk),u); }
    else if(phase==='result'&&result==='hit'){ const u=easeOut(hitU);
      const dir=(loc==='high')?-0.5:-1.2; bx=lerp(ZX,ZX-360,u); by=lerp(hy,hy+ (loc==='high'?-40:-180)*Math.sin(u*1.4),u); }
    else if(phase==='result'&&result==='weak'){ const u=easeOut(hitU);
      if(loc==='high'){ bx=lerp(ZX,ZX-70,u); by=lerp(hy,hy-140*Math.sin(u*3.14)+40,u); } // pop up
      else { bx=lerp(ZX,ZX-150,u); by=lerp(hy,ZBOT+30,u); } } // grounder
    else { bx=ZX; by=hy; }
    if(!(phase==='result'&&(result==='hit'||result==='weak')&&hitU>0.9)){
      ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(bx,by,8,0,6.28);ctx.fill();
      ctx.strokeStyle='#c33';ctx.lineWidth=1.2;ctx.beginPath();ctx.arc(bx-2,by-2,5,0.6,2.6);ctx.stroke();
    }

    // swing window ring at the ball's target height
    if(phase==='pitch'&&t>=swingT&&t<=swingT+w){ ctx.strokeStyle='rgba(140,255,160,0.9)';ctx.lineWidth=3;ctx.beginPath();ctx.arc(ZX,hy,18,0,6.28);ctx.stroke(); }

    // cue + timer + buttons
    ctx.textAlign='center';
    if(state==='play'&&phase==='pitch'){
      if(t<swingT){ ctx.fillStyle='rgba(255,220,90,0.95)';ctx.font='bold 20px sans-serif';ctx.fillText(revealed?'軌道を合わせて振れ！':'投球！ 高めか低めか見極めろ',W/2,52);
        if(t>=revealT()){ const p=clamp((swingT-t)/revealLead,0,1),bw=200,x=W/2-bw/2,y=64;
          ctx.fillStyle='rgba(255,255,255,0.16)';ctx.fillRect(x,y,bw,6);ctx.fillStyle='#ffd24d';ctx.fillRect(x,y,bw*(1-p),6); } }
      else { ctx.fillStyle='rgba(150,255,170,0.98)';ctx.font='bold 22px sans-serif';ctx.fillText('今だ！ 振れ！',W/2,52);
        const p=clamp((t-swingT)/w,0,1),bw=250,x=W/2-bw/2,y=64;
        ctx.fillStyle='rgba(255,255,255,0.18)';ctx.fillRect(x,y,bw,7);ctx.fillStyle=p<0.5?'#8affa0':(p<1?'#ffd24d':'#ff5b5b');ctx.fillRect(x,y,bw*p,7); }
    }
    if(state==='play'){
      for(const b of BTN){ const active=phase==='pitch'&&t>=revealT();
        const hot=active&&revealed&&b.k===needPlane();
        ctx.fillStyle=hot?b.col:(active?'rgba(255,255,255,0.14)':'rgba(255,255,255,0.08)');rr(b.x,BY,BW,BH,10);ctx.fill();
        ctx.fillStyle=hot?'#08130c':'rgba(255,255,255,0.55)';ctx.textAlign='center';ctx.font='bold 20px sans-serif';ctx.fillText(b.label,b.x+BW/2,BY+26);
        ctx.font='11px sans-serif';ctx.fillText(b.sub,b.x+BW/2,BY+46); }
      ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='12px sans-serif';ctx.textAlign='center';ctx.fillText('タップ / ↓=レベル(高め) ・ ↑=アッパー(低め)',W/2,BY+BH+16);
    }
  }

  for(const p of parts){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,3.2,0,6.28);ctx.fill();}
  ctx.globalAlpha=1;
  for(const p of pops){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.font='bold 21px sans-serif';ctx.textAlign='center';ctx.fillText(p.txt,p.x,p.y);}
  ctx.globalAlpha=1;

  // HUD
  ctx.textAlign='left';ctx.fillStyle='#fff';ctx.font='bold 26px sans-serif';ctx.fillText('SCORE '+score,20,36);
  ctx.textAlign='right';ctx.fillStyle='rgba(255,255,255,0.9)';ctx.font='14px sans-serif';ctx.fillText('ヒット '+outs+'  Lv'+lvl,W-20,24);
  ctx.fillText('凡退',W-96,46);
  for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(W-60+i*20,41,7,0,6.28);ctx.fillStyle=i<fails?'#ff5b5b':'rgba(255,255,255,0.25)';ctx.fill();}
  if(combo>=2){ctx.textAlign='center';ctx.fillStyle='#ffd24d';ctx.font='bold 18px sans-serif';ctx.fillText('コンボ x'+combo,W/2,120);}

  if(state==='play'&&phase==='result'&&msg){ctx.textAlign='center';ctx.fillStyle=msgOk?'#9ff0b8':'#ff9a9a';ctx.font='bold 16px sans-serif';ctx.fillText(msg,W/2,478);}

  if(state==='title'){
    ctx.fillStyle='rgba(4,10,7,0.82)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='bold 40px sans-serif';ctx.fillText('スイング軌道',W/2,92);
    ctx.fillStyle='#ffd23e';ctx.font='bold 22px sans-serif';ctx.fillText('Match the Plane',W/2,128);
    ctx.fillStyle='rgba(255,255,255,0.92)';ctx.font='16px sans-serif';
    ctx.fillText('高めか低めか——コースに合わせてスイング軌道を切り替え、芯で捉える打撃',W/2,182);
    ctx.fillStyle='rgba(255,255,255,0.66)';ctx.font='14px sans-serif';
    ctx.fillText('球は中央から遅れて高め／低めへ。見極めたら 高め＝レベル（↓）／低め＝アッパー（↑）',W/2,220);
    ctx.fillText('正しい軌道で“今だ！”の緑リングのタイミングに振れば芯で捉えて長打＝加点',W/2,244);
    ctx.fillText('軌道を間違えると高め→ポップフライ／低め→ゴロで凡退、振りが早い・遅いと空振り',W/2,268);
    ctx.fillText('上級ほど球が速く見極めが遅れ窓も狭い。3凡退で交代',W/2,292);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で開始',W/2,360);
    ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='14px sans-serif';ctx.fillText('BEST '+best,W/2,392);
  }
  if(state==='over'){
    ctx.fillStyle='rgba(4,10,7,0.84)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#ff6b6b';ctx.font='bold 46px sans-serif';ctx.fillText('3凡退…交代',W/2,224);
    ctx.fillStyle='#fff';ctx.font='bold 40px sans-serif';ctx.fillText('SCORE '+score,W/2,292);
    ctx.fillStyle='rgba(255,255,255,0.85)';ctx.font='19px sans-serif';ctx.fillText('ヒット '+outs+'   BEST '+best,W/2,332);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で もう一度',W/2,404);
  }

  if(flash>0.02){ctx.globalAlpha=flash*0.5;ctx.fillStyle=flashCol;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}
  ctx.restore();

  ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,0.4)';ctx.font='12px sans-serif';
  ctx.fillText('スイング軌道：高め＝レベル/低め＝アッパーに切り替え、緑リングで振る＝長打。軌道ミスは凡退、早振り/振り遅れは空振り、3凡退で交代',W/2,H-8);
}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

function frame(ts){let dt=ts-last;last=ts;if(dt>60)dt=60;if(dt<0)dt=0;update(dt);render();requestAnimationFrame(frame);}
requestAnimationFrame(frame);

// ---------- test hook ----------
window.__sp={
  start, act:(p)=>act(p),
  get state(){return state;},
  get score(){return score;},
  get outs(){return outs;},
  get fails(){return fails;},
  get info(){return {state,phase,t,swingT,w,revealLead,loc,tough,decided,result,outs,fails,lvl,
    revealed:(t>=revealT()),needPlane:needPlane(),swingWin:(phase==='pitch'&&t>=swingT&&t<=swingT+w),canAct:(phase==='pitch'&&!decided)};}
};
})();
</script>
</body>
</html>
