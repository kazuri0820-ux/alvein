<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ゴールキック (Find the Runner)</title>
<style>
  html,body{margin:0;height:100%;background:#07120b;overflow:hidden;
    font-family:-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  #stage{position:relative;width:100vw;height:100vh;max-width:calc(100vh*1.5);max-height:calc(100vw/1.5);aspect-ratio:900/600;}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;border-radius:6px;}
</style>
</head>
<body>
<div id="wrap"><div id="stage"><canvas id="cv"></canvas></div></div>
<script>
(function(){
const W=900,H=600,cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let DPR=1;
function fit(){DPR=Math.min(2,window.devicePixelRatio||1);cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
fit();addEventListener('resize',fit);

// ---------- audio ----------
let AC=null;function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function tone(f,d,type,v,sweep){const a=ac();if(!a)return;const t=a.currentTime,o=a.createOscillator(),g=a.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(sweep)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+sweep),t+d);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v||0.2,t+0.008);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+0.02);}
function noise(d,v,hp){const a=ac();if(!a)return;const t=a.currentTime,n=Math.floor(a.sampleRate*d),buf=a.createBuffer(1,n,a.sampleRate),ch=buf.getChannelData(0);
  for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource();s.buffer=buf;
  const f=a.createBiquadFilter();f.type='highpass';f.frequency.value=hp||600;const g=a.createGain();g.gain.value=v||0.2;
  s.connect(f);f.connect(g);g.connect(a.destination);s.start(t);s.stop(t+d+0.02);}
let chargeOsc=null,chargeGain=null;
function startChargeSnd(){const a=ac();if(!a)return;stopChargeSnd();chargeOsc=a.createOscillator();chargeGain=a.createGain();
  chargeOsc.type='sawtooth';chargeOsc.frequency.setValueAtTime(160,a.currentTime);chargeGain.gain.setValueAtTime(0.05,a.currentTime);
  chargeOsc.connect(chargeGain);chargeGain.connect(a.destination);chargeOsc.start();}
function setChargeSnd(c){const a=ac();if(!a||!chargeOsc)return;chargeOsc.frequency.setValueAtTime(160+c*520,a.currentTime);}
function stopChargeSnd(){if(chargeOsc){try{chargeOsc.stop();}catch(e){}chargeOsc=null;chargeGain=null;}}
const S={
  kick:()=>{stopChargeSnd();noise(0.05,0.14,500);tone(300,0.08,'square',0.1,260);},
  ok:()=>{noise(0.05,0.12,500);[560,820,1080,1340].forEach((f,i)=>setTimeout(()=>tone(f,0.12,'triangle',0.17),i*55));},
  bad:()=>{stopChargeSnd();noise(0.14,0.2,360);tone(200,0.16,'sawtooth',0.1,-50);},
  streak:()=>{[700,930,1170,1400].forEach((f,i)=>setTimeout(()=>tone(f,0.1,'triangle',0.16),i*60));},
  over:()=>{[440,330,247,175].forEach((f,i)=>setTimeout(()=>tone(f,0.3,'triangle',0.2),i*160));}
};

// ---------- geometry ----------
const GK={x:300,y:524}, CHX=624, RUN_START=470, RUN_END=96;

// ---------- state ----------
let state='title', phase='ready', t=0, plays=0;
let score=0, combo=0, best=+(localStorage.getItem('goalkick_best')||0);
let outs=0, fails=0, lvl=1;   // outs = passes completed
let clock=0, runDur=2400, F=480, chargeFull=920, radius=44, runSpeed=0;
let charging=false, chargeStart=0, charge=0, lockCharge=0;
let landY=RUN_START, arriveTeamY=0;
let acted=false, result=null, resultT=0, msg='', flightU=0, teamY=RUN_START, perfect=false;
let shake=0, flash=0, flashCol='#fff', last=performance.now();
let parts=[], pops=[];

function rnd(a,b){return a+Math.random()*(b-a);}
function chance(p){return Math.random()<p;}
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function lerp(a,b,u){return a+(b-a)*u;}
function easeOut(u){return 1-Math.pow(1-u,2);}

function params(){ return {
  run:Math.max(1700,2500-lvl*112),
  rad:Math.max(26,46-lvl*2.8)
};}
function landYfor(c){ return lerp(RUN_START, RUN_END, clamp(c,0,1)); }
function teamYat(ms){ return clamp(RUN_START + runSpeed*ms, RUN_END, RUN_START); }

function reset(){state='title';score=0;combo=0;outs=0;fails=0;lvl=1;plays=0;result=null;parts=[];pops=[];}
function newPlay(){
  plays++; lvl=Math.min(7,1+Math.floor(outs/4));
  const p=params();
  runDur=p.run; radius=p.rad; F=480; chargeFull=920;
  runSpeed=(RUN_END-RUN_START)/runDur; // negative (up)
  clock=0; charging=false; chargeStart=0; charge=0; lockCharge=0;
  acted=false; result=null; phase='ready'; msg=''; resultT=0; flightU=0; teamY=RUN_START; perfect=false;
}
function start(){ if(!ac())ac(); if(AC&&AC.state==='suspended')AC.resume(); reset(); state='play'; newPlay(); }

function press(){
  if(state==='title'){start();return;}
  if(state==='over'){ if(resultT>0.4){reset();start();} return; }
  if(state!=='play'||phase!=='ready'&&phase!=='charge'||acted) return;
  if(phase==='ready'){ phase='charge'; charging=true; chargeStart=clock; startChargeSnd(); }
}
function release(){
  if(state!=='play'||phase!=='charge'||acted) return;
  acted=true; charging=false; lockCharge=charge; S.kick();
  landY=landYfor(lockCharge);
  arriveTeamY=teamYat(clock+F);
  const err=Math.abs(landY-arriveTeamY);
  perfect=err<=radius*0.4;
  phase='flight';
  // resolve after flight animation completes (handled by timer in update)
  flightTimer=F;
  pendingResult=(err<=radius)?(perfect?'perfect':'complete'):(landY<arriveTeamY?'over':'short');
}
let flightTimer=0, pendingResult=null;

function resolve(kind){
  phase='result'; result=kind; resultT=0;
  const good=(kind==='complete'||kind==='perfect');
  if(good){
    outs++; combo++;
    let add=Math.round((kind==='perfect'?180:120)*(1+Math.min(9,combo-1)*0.15)); score+=add;
    S.ok(); flash=1;flashCol=kind==='perfect'?'#8affa0':'#ffe08a';shake=kind==='perfect'?8:5;
    burst(CHX,landY,kind==='perfect'?'#8affa0':'#ffe08a',kind==='perfect'?20:12,6);
    pop(CHX,landY-30,(kind==='perfect'?'ドンピシャ！ +':'つながった！ +')+add,kind==='perfect'?'#d6ffe0':'#fff3c4');
    if(kind==='perfect')pop(450,150,'走り込みにピタリ！','#8affa0');
    if(combo>=2)pop(450,190,'コンボ x'+combo,'#ffd24d');
    if(combo>0&&combo%5===0)S.streak();
    msg=kind==='perfect'?'完璧な配球！ 走り込む味方の足元へピタリ！':'ナイスフィード！ 味方につながった！';
  } else {
    fails++; combo=0; flash=1;flashCol='#ff5b5b';shake=8; S.bad();
    if(kind==='short') msg='弱い…味方の後ろに落ちて相手にカットされた';
    else msg='強すぎ…味方の前に流れてラインを割った';
    pop(CHX,landY-30,kind==='short'?'届かず':'オーバー','#ffb0b0');
  }
  if(fails>=3){ state='over'; resultT=0; S.over(); if(score>best){best=score;localStorage.setItem('goalkick_best',best);} }
}

// ---------- input ----------
cv.addEventListener('pointerdown',e=>{e.preventDefault();
  if(state==='title'){start();return;}
  if(state==='over'){ if(resultT>0.4){reset();start();} return; }
  press();
});
cv.addEventListener('pointerup',e=>{e.preventDefault();release();});
cv.addEventListener('pointercancel',e=>{release();});
addEventListener('keydown',e=>{ if(e.repeat)return; if(e.code==='Space'||e.code==='Enter'||e.code==='ArrowUp'){e.preventDefault();
  if(state!=='play')press(); else press();} });
addEventListener('keyup',e=>{ if(e.code==='Space'||e.code==='Enter'||e.code==='ArrowUp'){e.preventDefault();release();} });

// ---------- particles ----------
function burst(x,y,c,n,sp){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=rnd(sp*0.3,sp);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:1,c});}}
function pop(x,y,txt,c){pops.push({x,y,txt,c,life:1});}

// ---------- update ----------
function update(dt){
  shake*=Math.pow(0.86,dt/16.7); if(shake<0.3)shake=0;
  flash*=Math.pow(0.9,dt/16.7);
  for(const p of parts){p.vx*=0.96;p.vy=p.vy*0.96+0.28;p.x+=p.vx*dt/16.7;p.y+=p.vy*dt/16.7;p.life-=dt/16.7*0.026;}
  parts=parts.filter(p=>p.life>0);
  for(const p of pops){p.y-=dt/16.7*0.5;p.life-=dt/16.7*0.02;}
  pops=pops.filter(p=>p.life>0);

  if(state!=='play'){ if(state==='over')resultT+=dt/1000; return; }
  t+=dt;
  if(phase==='ready'||phase==='charge'){
    clock+=dt;
    if(phase==='charge'){ charge=clamp((clock-chargeStart)/chargeFull,0,1); setChargeSnd(charge);
      if(charge>=1){ /* auto-release at max */ release(); } }
    teamY=teamYat(clock);
    if(!acted && clock>=runDur){ // runner reached the end without a kick
      if(phase==='charge'){ release(); } else { resolve('short'); }
    }
    return;
  }
  if(phase==='flight'){
    clock+=dt; teamY=teamYat(clock);
    flightTimer-=dt; flightU=clamp(1-flightTimer/F,0,1);
    if(flightTimer<=0){ resolve(pendingResult); }
    return;
  }
  if(phase==='result'){
    resultT+=dt/1000;
    if(resultT>1.15 && state==='play') newPlay();
    return;
  }
}

// ---------- render ----------
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function drawScene(){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#2a7a38');g.addColorStop(1,'#184a22');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='rgba(255,255,255,0.035)';
  for(let i=0;i<7;i++){ if(i%2===0)ctx.fillRect(0,i*H/7,W,H/7); }
  // run channel
  ctx.strokeStyle='rgba(255,255,255,0.12)';ctx.lineWidth=2;ctx.setLineDash([6,10]);
  ctx.beginPath();ctx.moveTo(CHX,RUN_START+20);ctx.lineTo(CHX,RUN_END-16);ctx.stroke();ctx.setLineDash([]);
  // far goal hint
  ctx.strokeStyle='rgba(255,255,255,0.4)';ctx.lineWidth=4;ctx.strokeRect(CHX-56,RUN_END-46,112,30);
}
function drawFig(x,y,col,s){ s=s||1; ctx.fillStyle='rgba(0,0,0,0.22)';ctx.beginPath();ctx.ellipse(x,y+12*s,10*s,3.5*s,0,0,6.28);ctx.fill();
  ctx.fillStyle=col;rr(x-8*s,y-10*s,16*s,24*s,6);ctx.fill();
  ctx.fillStyle='#f2c9a0';ctx.beginPath();ctx.arc(x,y-14*s,6*s,0,6.28);ctx.fill(); }

function render(){
  ctx.save();
  if(shake>0)ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
  drawScene();

  if(state==='play'){
    // running teammate (blue) up the channel
    const ty=(phase==='result'||phase==='flight')?teamY:teamYat(clock);
    drawFig(CHX,ty,'#2b6cff',1.05);
    // a trailing defender behind the runner
    drawFig(CHX-2, clamp(ty+64,RUN_END,RUN_START+80), '#e23c3c',0.95);

    // projected landing marker while charging
    if(phase==='charge'){
      const ly=landYfor(charge);
      ctx.strokeStyle='rgba(255,210,77,0.9)';ctx.lineWidth=2;ctx.setLineDash([4,4]);
      ctx.beginPath();ctx.arc(CHX,ly,radius,0,6.28);ctx.stroke();ctx.setLineDash([]);
      ctx.fillStyle='rgba(255,210,77,0.9)';ctx.beginPath();ctx.arc(CHX,ly,5,0,6.28);ctx.fill();
      ctx.fillStyle='rgba(255,210,77,0.9)';ctx.font='bold 12px sans-serif';ctx.textAlign='center';ctx.fillText('落下点',CHX+radius+26,ly);
    }
    // GK figure
    drawFig(GK.x,GK.y,'#e2b23c',1.15);

    // ball
    if(phase==='ready'||phase==='charge'){
      ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(GK.x+14,GK.y+2,7,0,6.28);ctx.fill();
    } else if(phase==='flight'||phase==='result'){
      const tx=(phase==='flight')?flightU:1;
      const bx=lerp(GK.x,CHX,easeOut(tx)), by=lerp(GK.y,landY,easeOut(tx)) - Math.sin(Math.PI*tx)*90;
      const shown=(phase==='flight')||(result==='complete'||result==='perfect')|| (resultT<0.5);
      if(shown){ ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(bx,by,7,0,6.28);ctx.fill(); }
    }

    // power gauge (left)
    const gx=70,gy=150,gw=26,gh=300;
    ctx.fillStyle='rgba(0,0,0,0.3)';rr(gx-5,gy-22,gw+10,gh+40,9);ctx.fill();
    ctx.fillStyle='rgba(255,255,255,0.85)';ctx.font='bold 12px sans-serif';ctx.textAlign='center';ctx.fillText('飛距離',gx+gw/2,gy-8);
    ctx.fillStyle='rgba(255,255,255,0.12)';rr(gx,gy,gw,gh,6);ctx.fill();
    const c=(phase==='charge')?charge:(phase==='ready'?0:lockCharge);
    ctx.fillStyle=charging?'#ffd24d':'#8ab6ff';rr(gx,gy+gh*(1-c),gw,gh*c,6);ctx.fill();
    ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='10px sans-serif';ctx.fillText('遠',gx+gw/2,gy+8);ctx.fillText('近',gx+gw/2,gy+gh+14);
  }

  for(const p of parts){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,3.2,0,6.28);ctx.fill();}
  ctx.globalAlpha=1;
  for(const p of pops){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.font='bold 22px sans-serif';ctx.textAlign='center';ctx.fillText(p.txt,p.x,p.y);}
  ctx.globalAlpha=1;

  // HUD
  ctx.textAlign='left';ctx.fillStyle='#fff';ctx.font='bold 26px sans-serif';ctx.fillText('SCORE '+score,20,36);
  ctx.textAlign='right';ctx.fillStyle='rgba(255,255,255,0.9)';ctx.font='14px sans-serif';ctx.fillText('配球 '+outs+'  Lv'+lvl,W-20,24);
  ctx.fillText('失敗',W-92,46);
  for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(W-60+i*20,41,7,0,6.28);ctx.fillStyle=i<fails?'#ff5b5b':'rgba(255,255,255,0.25)';ctx.fill();}
  if(combo>=2){ctx.textAlign='center';ctx.fillStyle='#ffd24d';ctx.font='bold 18px sans-serif';ctx.fillText('コンボ x'+combo,W/2,250);}

  if(state==='play'&&(phase==='ready'||phase==='charge')){ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,0.9)';ctx.font='bold 15px sans-serif';
    ctx.fillText('押し続けて飛距離をため、走り込む味方の“少し前”に落ちるよう離せ（長押し→離す）',W/2,44);}
  if(state==='play'&&phase==='result'&&msg){ctx.textAlign='center';ctx.fillStyle=(result==='complete'||result==='perfect')?'#9ff0b8':'#ff9a9a';ctx.font='bold 20px sans-serif';ctx.fillText(msg,W/2,44);}

  if(state==='title'){
    ctx.fillStyle='rgba(5,12,7,0.8)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='bold 44px sans-serif';ctx.fillText('ゴールキック',W/2,108);
    ctx.fillStyle='#ffd23e';ctx.font='bold 22px sans-serif';ctx.fillText('Find the Runner',W/2,144);
    ctx.fillStyle='rgba(255,255,255,0.92)';ctx.font='16px sans-serif';
    ctx.fillText('前線へ走り込む味方に“飛距離”を合わせて配球するロングフィード',W/2,192);
    ctx.fillStyle='rgba(255,255,255,0.66)';ctx.font='14px sans-serif';
    ctx.fillText('味方（青）が前線へ走り込む。ボタンを押し続けると飛距離（落下点）が伸びる',W/2,232);
    ctx.fillText('走る味方の“少し前”に落下点が来た瞬間に離す＝走り込みにピタリで配球成功',W/2,254);
    ctx.fillText('飛距離が短いと味方の後ろに落ちてカット、長いと前に流れてライン割れ',W/2,276);
    ctx.fillText('ドンピシャの落下点なら“ピタリ”で大量得点。走る味方は動くのでリードして落とせ',W/2,298);
    ctx.fillText('操作：長押し（タップ長押し / SPACE長押し）→離す。上級ほど味方が速い。3失敗で交代',W/2,320);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で開始',W/2,384);
    ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='14px sans-serif';ctx.fillText('BEST '+best,W/2,416);
  }
  if(state==='over'){
    ctx.fillStyle='rgba(5,12,7,0.84)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#ff6b6b';ctx.font='bold 46px sans-serif';ctx.fillText('3失敗…交代',W/2,222);
    ctx.fillStyle='#fff';ctx.font='bold 40px sans-serif';ctx.fillText('SCORE '+score,W/2,290);
    ctx.fillStyle='rgba(255,255,255,0.85)';ctx.font='19px sans-serif';ctx.fillText('配球 '+outs+'   BEST '+best,W/2,330);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で もう一度',W/2,402);
  }

  if(flash>0.02){ctx.globalAlpha=flash*0.5;ctx.fillStyle=flashCol;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}
  ctx.restore();

  ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,0.4)';ctx.font='12px sans-serif';
  ctx.fillText('長押しで飛距離をため、走る味方の少し前に落下点が来たら離す。短い/長いは失敗。3失敗で交代',W/2,H-8);
}

function frame(ts){let dt=ts-last;last=ts;if(dt>60)dt=60;if(dt<0)dt=0;update(dt);render();requestAnimationFrame(frame);}
requestAnimationFrame(frame);

// ---------- test hook ----------
window.__gk={
  start, press:()=>press(), release:()=>release(),
  get state(){return state;},
  get score(){return score;},
  get outs(){return outs;},
  get fails(){return fails;},
  get info(){const ch=(phase==='charge')?charge:(phase==='ready'?0:lockCharge);
    const ly=landYfor(ch), ty=teamYat(clock), leadTarget=teamYat(clock+F);
    return {state,phase,charge:ch,landY:ly,teamY:ty,leadTargetY:leadTarget,radius,F,runSpeed,chargeFull,clock,runDur,
      canPress:(phase==='ready'||phase==='charge'),charging,result,outs,fails,lvl};}
};
})();
</script>
</body>
</html>
