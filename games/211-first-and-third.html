<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>1・3塁 (First and Third)</title>
<style>
  html,body{margin:0;height:100%;background:#0a1018;overflow:hidden;
    font-family:-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  #stage{position:relative;width:100vw;height:100vh;max-width:calc(100vh*1.5);max-height:calc(100vw/1.5);aspect-ratio:900/600;}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;border-radius:6px;}
</style>
</head>
<body>
<div id="wrap"><div id="stage"><canvas id="cv"></canvas></div></div>
<script>
(function(){
const W=900,H=600,cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let DPR=1;
function fit(){DPR=Math.min(2,window.devicePixelRatio||1);cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
fit();addEventListener('resize',fit);

// ---------- audio ----------
let AC=null;function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function tone(f,d,type,v,sweep){const a=ac();if(!a)return;const t=a.currentTime,o=a.createOscillator(),g=a.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(sweep)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+sweep),t+d);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v||0.2,t+0.008);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+0.02);}
function noise(d,v,hp){const a=ac();if(!a)return;const t=a.currentTime,n=Math.floor(a.sampleRate*d),buf=a.createBuffer(1,n,a.sampleRate),ch=buf.getChannelData(0);
  for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource();s.buffer=buf;
  const f=a.createBiquadFilter();f.type='highpass';f.frequency.value=hp||600;const g=a.createGain();g.gain.value=v||0.2;
  s.connect(f);f.connect(g);g.connect(a.destination);s.start(t);s.stop(t+d+0.02);}
const S={
  throw:()=>{noise(0.04,0.14,900);tone(400,0.06,'square',0.1);},
  out:()=>{[720,960,1200].forEach((f,i)=>setTimeout(()=>tone(f,0.12,'triangle',0.18),i*70));},
  run:()=>{tone(300,0.26,'sawtooth',0.2,-150);setTimeout(()=>tone(200,0.24,'sawtooth',0.16,-70),120);},
  safe:()=>{tone(280,0.22,'sawtooth',0.16,-120);},
  set:()=>{noise(0.03,0.06,1500);},
  streak:()=>{[660,880,1100].forEach((f,i)=>setTimeout(()=>tone(f,0.1,'triangle',0.16),i*60));},
  over:()=>{[440,330,247,175].forEach((f,i)=>setTimeout(()=>tone(f,0.3,'triangle',0.2),i*160));}
};

// ---------- bases ----------
const B2={x:450,y:150}, B1={x:648,y:330}, B3={x:252,y:330}, HOME={x:450,y:492};

// ---------- state ----------
let state='title', phase='live', t=0, plays=0;
let score=0, combo=0, best=+(localStorage.getItem('firstthird_best')||0);
let outsMade=0, fails=0, lvl=1;
let r3intent='hold', r3committed=false, clock=0, commitT=700, deadline=2000, acted=false, action=null;
let r1p=0, r3p=0, ball=null, result=null, resultT=0, msg='', msg2='';
let shake=0, flash=0, flashCol='#fff', last=performance.now();
let parts=[], pops=[];

function rnd(a,b){return a+Math.random()*(b-a);}
function chance(p){return Math.random()<p;}
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function lerp(a,b,u){return a+(b-a)*u;}

function reset(){state='title';score=0;combo=0;outsMade=0;fails=0;lvl=1;plays=0;ball=null;result=null;parts=[];pops=[];}
function newPlay(){
  plays++; lvl=Math.min(7,1+Math.floor(outsMade/4));
  r3intent = chance(0.5)?'break':'hold';
  commitT = rnd(500,850); deadline = commitT + (1500-lvl*105);
  r3committed=false; clock=0; acted=false; action=null;
  r1p=0; r3p=0; ball=null; result=null; phase='live'; msg=''; msg2=''; S.set();
}
function start(){ if(!ac())ac(); if(AC&&AC.state==='suspended')AC.resume(); reset(); state='play'; newPlay(); }

function act(kind){ // 'home' (tag at plate) or 'second' (throw to 2nd)
  if(state==='title'){start();return;}
  if(state==='over'){ if(resultT>0.4){reset();start();} return; }
  if(state!=='play'||phase!=='live'||acted) return;
  acted=true; action=kind;
  if(!r3committed){ resolve('early',kind); return; } // acted before reading the runner
  const correct = (r3intent==='break'&&kind==='home')||(r3intent==='hold'&&kind==='second');
  if(kind==='second'){ ball={from:{...HOME},to:{...B2},t:0,dur:360}; S.throw(); }
  else { ball={from:{...HOME},to:{x:HOME.x-20,y:HOME.y-10},t:0,dur:200}; }
  resolve(correct?'out':'fail',kind);
}
function resolve(kind,dir){
  phase='resolve'; resultT=0; result=kind;
  if(kind==='out'){
    outsMade++; combo++; const add=Math.round(150*(1+Math.min(9,combo-1)*0.16)); score+=add;
    S.out(); flash=1;flashCol='#8fe0a0';shake=11;
    const at = dir==='home'?HOME:B2; burst(at.x,at.y,'#cfffe0',22,7);
    pop(at.x,at.y-26,'アウト！ +'+add, '#dfffe6');
    if(combo>=2)pop(at.x,at.y-52,'コンボ x'+combo,'#ffd24d');
    if(combo>0&&combo%5===0)S.streak();
    msg = dir==='home'?'本塁でタッチアウト！ 三塁走者を刺した':'二塁へ送球アウト！ 盗塁を刺した'; msg2='';
  } else {
    fails++; combo=0; flash=1;flashCol='#ff5b5b';shake=9;
    if(kind==='early'){S.safe();msg='早すぎる！ 走者を見てから判断しろ';}
    else if(action==='second'&&r3intent==='break'){S.run();msg='二塁へ投げた隙に三塁走者が生還…';}
    else if(action==='home'&&r3intent==='hold'){S.safe();msg='本塁で待つも走らず、盗塁を許した';}
    else {S.safe();msg='遅い…間に合わなかった';}
    msg2 = fails>=3?'':'あと'+(3-fails)+'回で交代';
    pop(HOME.x,HOME.y-30, (action==='second'&&r3intent==='break')?'生還':'セーフ','#ffb0b0');
  }
  if(fails>=3){ state='over'; resultT=0; S.over(); if(score>best){best=score;localStorage.setItem('firstthird_best',best);} }
}

// ---------- input ----------
cv.addEventListener('pointerdown',e=>{
  e.preventDefault();
  if(state==='title'||state==='over'){act('home');return;}
  const r=cv.getBoundingClientRect(); const x=((e.clientX-r.left)/r.width)*W;
  act(x<W/2?'home':'second');
});
addEventListener('keydown',e=>{
  if(e.code==='ArrowLeft'||e.code==='KeyA'){e.preventDefault(); if(state!=='play')act('home'); else act('home');}
  else if(e.code==='ArrowRight'||e.code==='KeyD'||e.code==='Space'){e.preventDefault(); if(state!=='play')act('home'); else act('second');}
});

// ---------- particles ----------
function burst(x,y,c,n,sp){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=rnd(sp*0.3,sp);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:1,c});}}
function pop(x,y,txt,c){pops.push({x,y,txt,c,life:1});}

// ---------- update ----------
function update(dt){
  shake*=Math.pow(0.86,dt/16.7); if(shake<0.3)shake=0;
  flash*=Math.pow(0.9,dt/16.7);
  for(const p of parts){p.vx*=0.96;p.vy=p.vy*0.96+0.28;p.x+=p.vx*dt/16.7;p.y+=p.vy*dt/16.7;p.life-=dt/16.7*0.028;}
  parts=parts.filter(p=>p.life>0);
  for(const p of pops){p.y-=dt/16.7*0.5;p.life-=dt/16.7*0.02;}
  pops=pops.filter(p=>p.life>0);
  if(ball){ ball.t+=dt; }

  if(state!=='play'){ if(state==='over')resultT+=dt/1000; return; }
  t+=dt;
  if(phase==='live'){
    clock+=dt;
    r1p=clamp(clock/1700,0,1);                     // stealer toward 2nd
    if(!r3committed && clock>=commitT){ r3committed=true; }
    if(r3committed){ if(r3intent==='break') r3p=clamp((clock-commitT)/1500,0,1); else r3p=clamp(-(clock-commitT)/2500,-0.25,0); }
    if(!acted && clock>deadline){ resolve('slow','none'); }
    return;
  }
  if(phase==='resolve'){ resultT+=dt/1000; if(resultT>1.1 && state==='play') newPlay(); return; }
}

// ---------- render ----------
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function base(b,label){ ctx.save();ctx.translate(b.x,b.y);ctx.rotate(0.78);ctx.fillStyle='#eef2f4';rr(-11,-11,22,22,3);ctx.fill();ctx.restore();
  ctx.fillStyle='rgba(255,255,255,0.4)';ctx.font='12px sans-serif';ctx.textAlign='center';ctx.fillText(label,b.x,b.y+30); }
function figure(x,y,col){ctx.fillStyle='rgba(0,0,0,0.24)';ctx.beginPath();ctx.ellipse(x,y+12,12,4,0,0,6.28);ctx.fill();
  ctx.fillStyle=col;rr(x-8,y-8,16,22,6);ctx.fill();ctx.fillStyle='#f2c9a0';ctx.beginPath();ctx.arc(x,y-15,6.5,0,6.28);ctx.fill();}

function drawField(){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#16233a');g.addColorStop(0.55,'#1a3324');g.addColorStop(1,'#20442d');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  // infield diamond dirt
  ctx.fillStyle='rgba(150,95,55,0.36)';ctx.beginPath();ctx.moveTo(B2.x,B2.y);ctx.lineTo(B1.x,B1.y);ctx.lineTo(HOME.x,HOME.y);ctx.lineTo(B3.x,B3.y);ctx.closePath();ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,0.5)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(B2.x,B2.y);ctx.lineTo(B1.x,B1.y);ctx.lineTo(HOME.x,HOME.y);ctx.lineTo(B3.x,B3.y);ctx.closePath();ctx.stroke();
  base(B2,'二塁');base(B1,'一塁');base(B3,'三塁');
  // home plate
  ctx.fillStyle='#eee';ctx.beginPath();ctx.moveTo(HOME.x,HOME.y+8);ctx.lineTo(HOME.x-11,HOME.y);ctx.lineTo(HOME.x-11,HOME.y-8);ctx.lineTo(HOME.x+11,HOME.y-8);ctx.lineTo(HOME.x+11,HOME.y);ctx.closePath();ctx.fill();
  ctx.fillStyle='rgba(255,255,255,0.4)';ctx.font='12px sans-serif';ctx.textAlign='center';ctx.fillText('本塁',HOME.x,HOME.y+26);
}

function render(){
  ctx.save();
  if(shake>0)ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
  drawField();

  if(state==='play'){
    // catcher at home
    figure(HOME.x+26,HOME.y-6,'#3a4a6a');
    // R1 stealer (1st -> 2nd)
    const r1x=lerp(B1.x,B2.x,r1p), r1y=lerp(B1.y,B2.y,r1p);
    figure(r1x,r1y,'#e23c3c');
    // R3 (3rd, breaks toward home or holds)
    const r3x=lerp(B3.x,HOME.x,Math.max(0,r3p)), r3y=lerp(B3.y,HOME.y,Math.max(0,r3p));
    figure(r3x - (r3p<0?r3p*40:0), r3y,'#e23c3c');
    // ball throw
    if(ball){ const f=clamp(ball.t/ball.dur,0,1); const bx=lerp(ball.from.x,ball.to.x,f),by=lerp(ball.from.y,ball.to.y,f)-Math.sin(f*Math.PI)*24;
      ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(bx,by,7,0,6.28);ctx.fill(); }
    // R3 commit tell (fades)
    if(phase==='live'&&r3committed&&lvl<4){ ctx.textAlign='center';ctx.font='bold 15px sans-serif';
      if(r3intent==='break'){ctx.fillStyle='#ff8a5a';ctx.fillText('三塁走者、走った！',B3.x+70,B3.y-24);}
      else{ctx.fillStyle='#8fd0ff';ctx.fillText('三塁走者、止まった',B3.x+70,B3.y-24);} }
  }

  for(const p of parts){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,3.2,0,6.28);ctx.fill();}
  ctx.globalAlpha=1;
  for(const p of pops){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.font='bold 21px sans-serif';ctx.textAlign='center';ctx.fillText(p.txt,p.x,p.y);}
  ctx.globalAlpha=1;

  // HUD
  ctx.textAlign='left';ctx.fillStyle='#fff';ctx.font='bold 26px sans-serif';ctx.fillText('SCORE '+score,20,36);
  ctx.textAlign='right';ctx.fillStyle='rgba(255,255,255,0.85)';ctx.font='14px sans-serif';ctx.fillText('アウト '+outsMade+'  Lv'+lvl,W-20,24);
  ctx.fillText('失敗',W-92,46);
  for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(W-60+i*20,41,7,0,6.28);ctx.fillStyle=i<fails?'#ff5b5b':'rgba(255,255,255,0.22)';ctx.fill();}
  if(combo>=2){ctx.textAlign='center';ctx.fillStyle='#ffd24d';ctx.font='bold 18px sans-serif';ctx.fillText('コンボ x'+combo,450,H-40);}

  if(state==='play'&&phase==='live'){ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,0.85)';ctx.font='bold 16px sans-serif';
    ctx.fillText('三塁走者を見極めろ：走ったら本塁でタッチ（左）／止まれば二塁へ送球（右）',450,44);}
  if(state==='play'&&phase==='resolve'&&msg){ctx.textAlign='center';ctx.fillStyle=result==='out'?'#9ff0b8':'#ff9a9a';ctx.font='bold 21px sans-serif';ctx.fillText(msg,450,44);}

  if(state==='title'){
    ctx.fillStyle='rgba(6,10,18,0.68)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='bold 50px sans-serif';ctx.fillText('1・3塁',W/2,150);
    ctx.fillStyle='#ffd23e';ctx.font='bold 22px sans-serif';ctx.fillText('First and Third',W/2,186);
    ctx.fillStyle='rgba(255,255,255,0.9)';ctx.font='16px sans-serif';
    ctx.fillText('一・三塁のダブルスチール守備。三塁走者の動きを読んで刺す駆け引き',W/2,240);
    ctx.fillStyle='rgba(255,255,255,0.66)';ctx.font='14px sans-serif';
    ctx.fillText('一塁走者は二塁へ盗塁。三塁走者が“走ったら”本塁でタッチ（左クリック/←）で刺す',W/2,280);
    ctx.fillText('三塁走者が“止まったら”二塁へ送球（右クリック/→）で盗塁を刺す',W/2,302);
    ctx.fillText('二塁へ投げた隙に走られると生還、走らないのに本塁で待つと盗塁を許す。上級ほど速い。3失敗で交代',W/2,324);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で開始',W/2,404);
    ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='14px sans-serif';ctx.fillText('BEST '+best+'　　左=本塁タッチ / 右=二塁送球',W/2,436);
  }
  if(state==='over'){
    ctx.fillStyle='rgba(6,10,18,0.76)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#ff6b6b';ctx.font='bold 46px sans-serif';ctx.fillText('3失敗…交代',W/2,222);
    ctx.fillStyle='#fff';ctx.font='bold 40px sans-serif';ctx.fillText('SCORE '+score,W/2,290);
    ctx.fillStyle='rgba(255,255,255,0.85)';ctx.font='19px sans-serif';ctx.fillText('アウト '+outsMade+'   BEST '+best,W/2,330);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で もう一度',W/2,402);
  }

  if(flash>0.02){ctx.globalAlpha=flash*0.5;ctx.fillStyle=flashCol;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}
  ctx.restore();

  ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,0.4)';ctx.font='12px sans-serif';
  ctx.fillText('三塁走者が走れば本塁タッチ(左/←)、止まれば二塁送球(右/→)。見てから判断。二塁へ投げた隙の生還に注意。3失敗で交代',W/2,H-8);
}

function frame(ts){let dt=ts-last;last=ts;if(dt>60)dt=60;if(dt<0)dt=0;update(dt);render();requestAnimationFrame(frame);}
requestAnimationFrame(frame);

// ---------- test hook ----------
window.__ft={
  start, home:()=>act('home'), second:()=>act('second'),
  get state(){return state;},
  get score(){return score;},
  get outsMade(){return outsMade;},
  get fails(){return fails;},
  get info(){return {state,phase, r3intent, r3committed, clock, deadline, acted, result, outsMade, fails, lvl};}
};
})();
</script>
</body>
</html>
