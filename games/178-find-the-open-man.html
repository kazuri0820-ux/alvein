<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ビジョン (Find the Open Man)</title>
<style>
  html,body{margin:0;height:100%;background:#0a1a10;overflow:hidden;
    font-family:-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  #stage{position:relative;width:100vw;height:100vh;max-width:calc(100vh*1.5);max-height:calc(100vw/1.5);aspect-ratio:900/600;}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;border-radius:6px;}
</style>
</head>
<body>
<div id="wrap"><div id="stage"><canvas id="cv"></canvas></div></div>
<script>
(function(){
const W=900,H=600,cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let DPR=1;
function fit(){DPR=Math.min(2,window.devicePixelRatio||1);cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
fit();addEventListener('resize',fit);

// ---------- audio ----------
let AC=null;function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function tone(f,d,type,v,sweep){const a=ac();if(!a)return;const t=a.currentTime,o=a.createOscillator(),g=a.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(sweep)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+sweep),t+d);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v||0.2,t+0.008);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+0.02);}
function noise(d,v,hp){const a=ac();if(!a)return;const t=a.currentTime,n=Math.floor(a.sampleRate*d),buf=a.createBuffer(1,n,a.sampleRate),ch=buf.getChannelData(0);
  for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource();s.buffer=buf;
  const f=a.createBiquadFilter();f.type='highpass';f.frequency.value=hp||600;const g=a.createGain();g.gain.value=v||0.2;
  s.connect(f);f.connect(g);g.connect(a.destination);s.start(t);s.stop(t+d+0.02);}
const S={
  pass:()=>{tone(500,0.08,'square',0.13,140);noise(0.04,0.08,700);},
  complete:()=>{tone(620,0.09,'triangle',0.16);setTimeout(()=>tone(880,0.12,'triangle',0.16),70);},
  great:()=>{[700,980,1320,1760].forEach((f,i)=>setTimeout(()=>tone(f,0.12,'triangle',0.2),i*65));},
  cut:()=>{noise(0.14,0.28,300);tone(200,0.16,'sawtooth',0.14,-70);},
  lost:()=>{tone(240,0.3,'sawtooth',0.2,-120);setTimeout(()=>tone(170,0.28,'sawtooth',0.16,-70),120);},
  over:()=>{[440,330,247,175].forEach((f,i)=>setTimeout(()=>tone(f,0.3,'triangle',0.2),i*160));}
};

// ---------- geometry ----------
const YOU={x:450,y:486};
const MARK_TH=50;      // marker farther than this = open
const LANE_TH=25;      // defender nearer than this to lane = blocked

// ---------- state ----------
let state='title', phase='scan', t=0, rounds=0;
let score=0, combo=0, best=+(localStorage.getItem('vision_best')||0);
let completes=0, turnovers=0, lvl=1;
let mates=[], lanes=[], presser=null, pressure=0, pressRate=0.00028;
let ball=null, result=null, resultT=0, passTo=-1, msg='', msg2='';
let shake=0, flash=0, flashCol='#fff', last=performance.now();
let parts=[], pops=[];

function rnd(a,b){return a+Math.random()*(b-a);}
function chance(p){return Math.random()<p;}
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function segDist(px,py,ax,ay,bx,by){const dx=bx-ax,dy=by-ay;const L=dx*dx+dy*dy||1;let tt=((px-ax)*dx+(py-ay)*dy)/L;tt=clamp(tt,0,1);const cx=ax+dx*tt,cy=ay+dy*tt;return Math.hypot(px-cx,py-cy);}

function reset(){state='title';score=0;combo=0;completes=0;turnovers=0;lvl=1;rounds=0;mates=[];ball=null;result=null;parts=[];pops=[];}

const SLOTS=[{x:190,y:250},{x:450,y:150},{x:710,y:250},{x:300,y:352},{x:600,y:352}];

function newRound(){
  rounds++;
  lvl=Math.min(6,1+Math.floor(rounds/3));
  const n=lvl>=4?4:3;
  mates=[];
  const idxs=[0,1,2,3,4].slice(0,n); // use first n slots (0,1,2[,3])
  const useSlots = n===4? [0,1,2,4] : [0,1,2];
  for(let k=0;k<useSlots.length;k++){
    const s=SLOTS[useSlots[k]];
    // each marker oscillates between tight and loose with its own phase/speed
    const amp=rnd(62,96), sp=(0.0011+lvl*0.00016)*rnd(0.8,1.2), ph=rnd(0,6.28);
    const ang=rnd(0,6.28);
    mates.push({x:s.x,y:s.y, mAmp:amp, mSp:sp, mPh:ph, mAng:ang, mx:s.x, my:s.y});
  }
  // lane defenders roaming horizontally in midfield
  lanes=[];
  const nl=1+Math.floor(lvl/2);
  for(let i=0;i<nl;i++){ lanes.push({x:rnd(250,650), y:rnd(300,400), dir:chance(0.5)?1:-1, sp:0.06+lvl*0.02, lo:rnd(180,300), hi:rnd(600,720)}); }
  presser={x:450,y:640};
  pressure=0; pressRate=0.00019+lvl*0.00003;
  ball=null; result=null; passTo=-1;
  phase='scan'; t=0;
  msg='フリーの味方を探せ'; msg2='マークが離れ、コースが通った味方へ';
}

function start(){ if(!ac())ac(); if(AC&&AC.state==='suspended')AC.resume(); reset(); state='play'; newRound(); }

// ---------- openness ----------
function markerPos(m){ return {x:m.mx, y:m.my}; }
function isOpen(i){
  const m=mates[i];
  const md=Math.hypot(m.mx-m.x, m.my-m.y);
  if(md<=MARK_TH) return false;
  // lane clear?
  for(const L of lanes){ if(segDist(L.x,L.y, YOU.x,YOU.y, m.x,m.y) < LANE_TH) return false; }
  return true;
}
function openness(i){
  const m=mates[i];
  const md=Math.hypot(m.mx-m.x,m.my-m.y);
  let laneMin=999; for(const L of lanes){ laneMin=Math.min(laneMin, segDist(L.x,L.y, YOU.x,YOU.y, m.x,m.y)); }
  return md + Math.min(laneMin,60) + (m.y<220?30:0); // advanced mates slightly better
}

// ---------- pass ----------
function doPass(i){
  if(state==='title'){start();return;}
  if(state==='over'){ if(resultT>0.5){reset();start();} return; }
  if(state!=='play'||phase!=='scan'||!mates[i]) return;
  passTo=i; S.pass();
  const m=mates[i];
  ball={x:YOU.x,y:YOU.y,tx:m.x,ty:m.y,tp:0};
  const ok=isOpen(i);
  // best option?
  let best=0,bi=0; for(let k=0;k<mates.length;k++){const o=openness(k); if(o>best){best=o;bi=k;}}
  ball.ok=ok; ball.best=(i===bi && ok);
  phase='pass';
}

function applyResult(kind){
  result=kind; resultT=0; phase='resolve';
  const m=mates[passTo];
  if(kind==='complete'||kind==='great'){
    combo++; const mult=1+Math.min(6,combo-1)*0.22; const base=kind==='great'?150:100; const add=Math.round(base*mult);
    score+=add; completes++;
    if(kind==='great')S.great(); else S.complete();
    flash=1;flashCol=kind==='great'?'#ffe08a':'#8ff0b8'; shake=kind==='great'?12:6;
    burst(m.x,m.y,kind==='great'?'#ffe08a':'#bfffd0',kind==='great'?26:16,6);
    pop(m.x,m.y-28,(kind==='great'?'ナイスパス！ ベストの選択 ':'パス成功！ ')+'+'+add,'#eaffef');
    if(combo>=2)pop(m.x,m.y-52,'コンボ x'+combo,'#ffe08a');
    msg=kind==='great'?'ナイスビジョン！ 最もフリーな味方へ':'パス成功！ フリーの味方に通した'; msg2='';
  } else {
    combo=0; turnovers++;
    if(kind==='cut'){S.cut();msg='インターセプト！ マークに囲まれていた';msg2='空いた味方を選べ';}
    else {S.lost();msg='奪われた！ 判断が遅い';msg2='素早く預けろ';}
    flash=1;flashCol='#ff6b6b';shake=10;
    burst(kind==='cut'?m.x:YOU.x, kind==='cut'?m.y:YOU.y,'#ff8a8a',16,5);
  }
}

// ---------- input ----------
cv.addEventListener('pointerdown',e=>{
  e.preventDefault();
  if(state==='title'||state==='over'){doPass(0);return;}
  if(state!=='play'||phase!=='scan')return;
  const r=cv.getBoundingClientRect();
  const x=((e.clientX-r.left)/r.width)*W, y=((e.clientY-r.top)/r.height)*H;
  // pick nearest teammate
  let bi=-1,bd=1e9; for(let i=0;i<mates.length;i++){const d=Math.hypot(mates[i].x-x,mates[i].y-y); if(d<bd){bd=d;bi=i;}}
  if(bi>=0 && bd<120) doPass(bi);
});
addEventListener('keydown',e=>{
  if(state!=='play'||phase!=='scan'){ if((e.code==='Space'||e.code==='Enter')&&state!=='play'){doPass(0);} return; }
  const map={Digit1:0,Digit2:1,Digit3:2,Digit4:3,KeyA:0,KeyW:1,KeyD:2};
  // by slot layout: left/center/right; arrows
  if(e.code==='ArrowLeft'){pickDir(-1);}
  else if(e.code==='ArrowUp'){pickDir(0);}
  else if(e.code==='ArrowRight'){pickDir(1);}
  else if(map[e.code]!==undefined && mates[map[e.code]]){e.preventDefault();doPass(map[e.code]);}
});
function pickDir(d){ // -1 left, 0 up/center, 1 right
  let target;
  if(d<0) target=mates.reduce((a,b)=>b.x<a.x?b:a,mates[0]);
  else if(d>0) target=mates.reduce((a,b)=>b.x>a.x?b:a,mates[0]);
  else target=mates.reduce((a,b)=>b.y<a.y?b:a,mates[0]);
  doPass(mates.indexOf(target));
}

// ---------- particles ----------
function burst(x,y,c,n,sp){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=rnd(sp*0.3,sp);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:1,c});}}
function pop(x,y,txt,c){pops.push({x,y,txt,c,life:1});}

// ---------- update ----------
function update(dt){
  shake*=Math.pow(0.86,dt/16.7); if(shake<0.3)shake=0;
  flash*=Math.pow(0.9,dt/16.7);
  for(const p of parts){p.vx*=0.96;p.vy=p.vy*0.96+0.3;p.x+=p.vx*dt/16.7;p.y+=p.vy*dt/16.7;p.life-=dt/16.7*0.026;}
  parts=parts.filter(p=>p.life>0);
  for(const p of pops){p.y-=dt/16.7*0.5;p.life-=dt/16.7*0.018;}
  pops=pops.filter(p=>p.life>0);

  // markers oscillate (always, for life)
  for(const m of mates){ m.mPh+=m.mSp*dt; const r=m.mAmp*(0.5+0.5*Math.sin(m.mPh)); m.mx=m.x+Math.cos(m.mAng)*r; m.my=m.y+Math.sin(m.mAng)*r*0.7; }
  for(const L of lanes){ L.x+=L.dir*L.sp*dt; if(L.x>L.hi){L.x=L.hi;L.dir=-1;} if(L.x<L.lo){L.x=L.lo;L.dir=1;} }

  if(state!=='play'){ if(state==='over')resultT+=dt/1000; return; }
  t+=dt;

  if(phase==='scan'){
    pressure=clamp(pressure+pressRate*dt,0,1);
    presser.x += (YOU.x-presser.x)*Math.min(1,dt/16.7*0.02);
    presser.y = 640 - pressure*120;
    if(pressure>=1){ applyResult('lost'); }
    return;
  }
  if(phase==='pass'){
    ball.tp=clamp(ball.tp+dt/300,0,1);
    if(ball.tp>=1){ applyResult(ball.ok?(ball.best?'great':'complete'):'cut'); }
    return;
  }
  if(phase==='resolve'){
    resultT+=dt/1000;
    if(resultT>0.95){
      if(turnovers>=3){ state='over'; resultT=0; S.over(); if(score>best){best=score;localStorage.setItem('vision_best',best);} }
      else newRound();
    }
    return;
  }
}

// ---------- render ----------
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

function drawScene(){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#164a2c');g.addColorStop(1,'#1f7040');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='rgba(255,255,255,0.03)';for(let i=0;i<6;i++){if(i%2)ctx.fillRect(0,i*100,W,100);}
  ctx.strokeStyle='rgba(255,255,255,0.12)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(450,120,70,0,6.28);ctx.stroke();
}

function drawPlayer(x,y,col,dark,label,sc){
  sc=sc||1;ctx.save();ctx.translate(x,y);ctx.scale(sc,sc);
  ctx.fillStyle='rgba(0,0,0,0.22)';ctx.beginPath();ctx.ellipse(0,15,11,4,0,0,6.28);ctx.fill();
  ctx.fillStyle=col;rr(-8,-6,16,21,6);ctx.fill();
  ctx.fillStyle='#f2c9a0';ctx.beginPath();ctx.arc(0,-13,6.5,0,6.28);ctx.fill();
  ctx.fillStyle=dark;ctx.beginPath();ctx.arc(0,-15,7,Math.PI,0);ctx.fill();
  ctx.restore();
  if(label){ctx.fillStyle='rgba(255,255,255,0.9)';ctx.font='bold 12px sans-serif';ctx.textAlign='center';ctx.fillText(label,x,y+30);}
}

function render(){
  ctx.save();
  if(shake>0)ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
  drawScene();

  // passing lanes (subtle; colored by openness, fades at high lvl)
  if(state==='play'&&(phase==='scan')){
    for(let i=0;i<mates.length;i++){
      const op=isOpen(i);
      const show = lvl<4 || op;
      ctx.strokeStyle= op? 'rgba(126,240,176,'+(lvl<4?0.55:0.32)+')' : 'rgba(255,120,120,0.18)';
      ctx.setLineDash(op?[]:[5,7]);ctx.lineWidth=op?3:1.5;
      if(show||op){ctx.beginPath();ctx.moveTo(YOU.x,YOU.y-8);ctx.lineTo(mates[i].x,mates[i].y);ctx.stroke();}
    }
    ctx.setLineDash([]);
  }

  // mates + markers
  for(let i=0;i<mates.length;i++){
    const m=mates[i];
    // marker
    drawPlayer(m.mx,m.my,'#e2413a','#8a1f1a',null,0.92);
    // teammate
    const op=state==='play'&&phase==='scan'&&isOpen(i);
    if(op){ ctx.strokeStyle='rgba(126,240,176,0.8)';ctx.lineWidth=3;ctx.beginPath();ctx.arc(m.x,m.y-2,22,0,6.28);ctx.stroke(); }
    drawPlayer(m.x,m.y,'#2b6cff','#1a3a8a',(i+1)+'',1.0);
  }
  // lane defenders
  for(const L of lanes){ drawPlayer(L.x,L.y,'#c0352e','#7a1712',null,0.86); }
  // presser + pressure ring
  if(state==='play'){ drawPlayer(presser.x,presser.y,'#c0352e','#7a1712',null,0.9);
    ctx.strokeStyle=pressure>0.7?'rgba(255,90,90,0.8)':'rgba(255,220,120,0.6)';ctx.lineWidth=3;
    ctx.beginPath();ctx.arc(YOU.x,YOU.y,26+pressure*8,-Math.PI/2,-Math.PI/2+6.28*pressure);ctx.stroke();
  }
  // you
  drawPlayer(YOU.x,YOU.y,'#f2f2f2','#c9a24a','YOU',1.06);

  // ball
  if(ball){ const x=ball.x+(ball.tx-ball.x)*ball.tp, y=ball.y+(ball.ty-ball.y)*ball.tp - Math.sin(ball.tp*Math.PI)*16;
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(x,y,7,0,6.28);ctx.fill();ctx.strokeStyle='#333';ctx.lineWidth=1.3;ctx.beginPath();ctx.arc(x,y,7,0,6.28);ctx.stroke(); }
  else { ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(YOU.x+9,YOU.y+4,7,0,6.28);ctx.fill();ctx.strokeStyle='#333';ctx.lineWidth=1.2;ctx.beginPath();ctx.arc(YOU.x+9,YOU.y+4,7,0,6.28);ctx.stroke(); }

  for(const p of parts){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,3.2,0,6.28);ctx.fill();}
  ctx.globalAlpha=1;
  for(const p of pops){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.font='bold 21px sans-serif';ctx.textAlign='center';ctx.fillText(p.txt,p.x,p.y);}
  ctx.globalAlpha=1;

  // HUD
  ctx.textAlign='left';ctx.fillStyle='#fff';ctx.font='bold 26px sans-serif';ctx.fillText('SCORE '+score,20,36);
  ctx.textAlign='right';ctx.fillStyle='rgba(255,255,255,0.85)';ctx.font='14px sans-serif';ctx.fillText('成功 '+completes+'  Lv.'+lvl,W-20,26);
  ctx.fillText('被奪取',W-100,50);
  for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(W-70+i*22,46,7,0,6.28);ctx.fillStyle=i<turnovers?'#ff5b5b':'rgba(255,255,255,0.25)';ctx.fill();}
  if(combo>=2){ctx.textAlign='left';ctx.fillStyle='#ffe08a';ctx.font='bold 18px sans-serif';ctx.fillText('コンボ x'+combo,20,60);}

  if(state==='play'&&(msg||msg2)){
    ctx.textAlign='center';
    const good=result==='complete'||result==='great';
    ctx.fillStyle=result?(good?'#8ff0b8':'#ff9a9a'):'rgba(255,255,255,0.92)';
    ctx.font='bold 26px sans-serif';ctx.fillText(msg,W/2,H-54);
    if(msg2){ctx.fillStyle='rgba(255,255,255,0.72)';ctx.font='15px sans-serif';ctx.fillText(msg2,W/2,H-30);}
  }

  if(state==='title'){
    ctx.fillStyle='rgba(6,16,10,0.66)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='bold 50px sans-serif';ctx.fillText('ビジョン',W/2,196);
    ctx.fillStyle='#8ff0b8';ctx.font='bold 22px sans-serif';ctx.fillText('Find the Open Man',W/2,232);
    ctx.fillStyle='rgba(255,255,255,0.9)';ctx.font='18px sans-serif';
    ctx.fillText('マークが離れ、コースが通った“フリーの味方”を見つけてパス',W/2,294);
    ctx.fillText('味方をタップ（または 1/2/3・←↑→）で選択',W/2,322);
    ctx.fillStyle='rgba(255,255,255,0.66)';ctx.font='15px sans-serif';
    ctx.fillText('囲まれた味方へ出すとカット／モタつくと寄せられて奪われる（プレッシャー）',W/2,364);
    ctx.fillText('最もフリーな選択でナイスビジョン加点。3被奪取で終了',W/2,388);
    ctx.fillStyle='#ffe08a';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で開始',W/2,446);
    ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='14px sans-serif';ctx.fillText('BEST '+best,W/2,478);
  }
  if(state==='over'){
    ctx.fillStyle='rgba(6,16,10,0.74)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#ff6b6b';ctx.font='bold 46px sans-serif';ctx.fillText('3被奪取…終了',W/2,230);
    ctx.fillStyle='#fff';ctx.font='bold 40px sans-serif';ctx.fillText('SCORE '+score,W/2,296);
    ctx.fillStyle='rgba(255,255,255,0.85)';ctx.font='20px sans-serif';ctx.fillText('成功 '+completes+'   BEST '+best,W/2,336);
    ctx.fillStyle='#8ff0b8';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で もう一度',W/2,408);
  }

  if(flash>0.02){ctx.globalAlpha=flash*0.5;ctx.fillStyle=flashCol;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}
  ctx.restore();

  ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,0.4)';ctx.font='13px sans-serif';
  ctx.fillText('マークが離れコースが通った味方（緑の輪）へ素早くパス。囲まれた味方はカット。3被奪取で終了',W/2,H-8);
}

function frame(ts){let dt=ts-last;last=ts;if(dt>60)dt=60;if(dt<0)dt=0;update(dt);render();requestAnimationFrame(frame);}
requestAnimationFrame(frame);

// ---------- test hook ----------
window.__vz={
  start, pass:doPass,
  get state(){return state;},
  get score(){return score;},
  get completes(){return completes;},
  get turnovers(){return turnovers;},
  get info(){return {state,phase,pressure,turnovers,completes,lvl,
    n:mates.length, open:mates.map((m,i)=>isOpen(i)), openness:mates.map((m,i)=>openness(i)), result};}
};
})();
</script>
</body>
</html>
