<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>キープイン (Keep It Alive)</title>
<style>
  html,body{margin:0;height:100%;background:#06110a;overflow:hidden;
    font-family:-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  #stage{position:relative;width:100vw;height:100vh;max-width:calc(100vh*1.5);max-height:calc(100vw/1.5);aspect-ratio:900/600;}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;border-radius:6px;}
</style>
</head>
<body>
<div id="wrap"><div id="stage"><canvas id="cv"></canvas></div></div>
<script>
(function(){
const W=900,H=600,cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let DPR=1;
function fit(){DPR=Math.min(2,window.devicePixelRatio||1);cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
fit();addEventListener('resize',fit);

// ---------- audio ----------
let AC=null;function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function tone(f,d,type,v,sweep){const a=ac();if(!a)return;const t=a.currentTime,o=a.createOscillator(),g=a.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(sweep)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+sweep),t+d);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v||0.2,t+0.008);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+0.02);}
function noise(d,v,hp){const a=ac();if(!a)return;const t=a.currentTime,n=Math.floor(a.sampleRate*d),buf=a.createBuffer(1,n,a.sampleRate),ch=buf.getChannelData(0);
  for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource();s.buffer=buf;
  const f=a.createBiquadFilter();f.type='highpass';f.frequency.value=hp||600;const g=a.createGain();g.gain.value=v||0.2;
  s.connect(f);f.connect(g);g.connect(a.destination);s.start(t);s.stop(t+d+0.02);}
const S={
  roll:()=>{noise(0.12,0.04,240);},
  near:()=>{tone(1300,0.05,'sine',0.08);},
  hook:()=>{noise(0.05,0.14,600);tone(420,0.05,'square',0.08,120);},
  save:()=>{[620,860,1120].forEach((f,i)=>setTimeout(()=>tone(f,0.1,'triangle',0.16),i*60));},
  worldclass:()=>{[660,900,1160,1450].forEach((f,i)=>setTimeout(()=>tone(f,0.11,'triangle',0.16),i*66));},
  out:()=>{noise(0.2,0.2,300);tone(160,0.22,'sawtooth',0.12,-50);},
  streak:()=>{[700,930,1170,1400].forEach((f,i)=>setTimeout(()=>tone(f,0.1,'triangle',0.16),i*60));},
  over:()=>{[440,330,247,175].forEach((f,i)=>setTimeout(()=>tone(f,0.3,'triangle',0.2),i*160));}
};

// ---------- geometry ----------
const LINEX=720, BALLR=11, ROLLY=330, STARTX=250;
const MATE={x:300,y:180};

// ---------- state ----------
let state='title', phase='roll', plays=0;
let score=0, combo=0, best=+(localStorage.getItem('kia_best')||0);
let outs=0, fails=0, lvl=1;   // outs = balls kept alive, fails = went out
let clock=0, crossT=880, win=290, tough=false, edge=0;
let flicked=false, flickClock=0, result=null, resultT=0, reason='', quality=0, hookT=0;
let shake=0, flash=0, flashCol='#fff', last=performance.now();
let parts=[], pops=[];

function rnd(a,b){return a+Math.random()*(b-a);}
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function lerp(a,b,u){return a+(b-a)*u;}
function easeOut(u){return 1-Math.pow(1-u,2);}

function reset(){state='title';score=0;combo=0;outs=0;fails=0;lvl=1;plays=0;result=null;parts=[];pops=[];}

function ballX(){ return lerp(STARTX, LINEX+BALLR, easeOut(clamp(clock/crossT,0,1))); }

function newPlay(){
  plays++; lvl=Math.min(7,1+Math.floor(outs/4));
  crossT=clamp(920-lvl*42,640,920);
  win=clamp(300-lvl*22,150,300);
  tough=Math.random()<clamp(0.22+lvl*0.03,0.22,0.46);
  if(tough){ win=Math.round(win*0.76); crossT=Math.round(crossT*0.9); }
  MATE.y=rnd(150,250); MATE.x=rnd(270,340);
  flicked=false; flickClock=0; result=null; reason=''; resultT=0; quality=0; hookT=0;
  phase='roll'; clock=0; S.roll();
}
function start(){ if(!ac())ac(); if(AC&&AC.state==='suspended')AC.resume(); reset(); state='play'; newPlay(); }

function flick(){
  if(state==='title'){start();return;}
  if(state==='over'){ if(resultT>0.4){reset();start();} return; }
  if(state!=='play'||phase!=='roll'||flicked) return;
  flicked=true; flickClock=clock; S.hook();
  if(clock<crossT-win){ resolve('early'); return; }
  quality=clamp((clock-(crossT-win))/win,0,1);   // later = better
  resolve('save');
}

function resolve(k){
  phase='result'; result=k; resultT=0; hookT=0;
  if(k==='save'){
    outs++; combo++;
    const wc=quality>=0.82;
    const mult=1+Math.min(9,combo-1)*0.14;
    const add=Math.round((60+Math.round(quality*110)+(tough?80:0))*mult); score+=add;
    S.hook(); setTimeout(wc?S.worldclass:S.save,90);
    flash=1;flashCol='#8affa0';shake=5; burst(LINEX-8,ROLLY,'#8affa0',18,7);
    reason = wc?'ライン際でギリギリ掻き出した！ 値千金のキープ':'ボールを外に出さずキープ！ 切り返して繋ぐ';
    pop(LINEX-60,ROLLY-40,(tough?'際どく残した！ +':'キープ！ +')+add,'#d6ffe0');
    if(combo>=2)pop(W/2,150,'コンボ x'+combo,'#ffd24d');
    if(combo>0&&combo%5===0)S.streak();
  } else {
    fails++; combo=0; flash=1;flashCol='#ff5b5b';shake=8; S.out();
    if(k==='early'){ reason='掻き出すのが早い…自分でボールを外に蹴り出す'; pop(LINEX-40,ROLLY-40,'蹴り出し…','#ffb0b0'); }
    else { reason='間に合わず…ボールがラインを割って相手ボール'; pop(LINEX+20,ROLLY-40,'ライン割れ…','#ffb0b0'); }
  }
  if(fails>=3){ state='over'; resultT=0; S.over(); if(score>best){best=score;localStorage.setItem('kia_best',best);} }
}

// ---------- input ----------
cv.addEventListener('pointerdown',e=>{e.preventDefault();flick();});
addEventListener('keydown',e=>{ if(e.repeat)return;
  if(e.code==='Space'||e.code==='Enter'||e.code==='ArrowUp'||e.code==='KeyF'||e.code==='KeyJ'){e.preventDefault();flick();} });

// ---------- particles ----------
function burst(x,y,c,n,sp){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=rnd(sp*0.3,sp);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:1,c});}}
function pop(x,y,txt,c){pops.push({x,y,txt,c,life:1});}

// ---------- update ----------
function update(dt){
  shake*=Math.pow(0.86,dt/16.7); if(shake<0.3)shake=0;
  flash*=Math.pow(0.9,dt/16.7);
  for(const p of parts){p.vx*=0.96;p.vy=p.vy*0.96+0.28;p.x+=p.vx*dt/16.7;p.y+=p.vy*dt/16.7;p.life-=dt/16.7*0.026;}
  parts=parts.filter(p=>p.life>0);
  for(const p of pops){p.y-=dt/16.7*0.5;p.life-=dt/16.7*0.02;}
  pops=pops.filter(p=>p.life>0);

  if(state!=='play'){ if(state==='over')resultT+=dt/1000; return; }
  if(phase==='roll'){ clock+=dt;
    if(Math.abs(clock-(crossT-win))<9) S.near();
    if(!flicked && clock>crossT){ resolve('out'); }
    return; }
  if(phase==='result'){ resultT+=dt/1000; hookT=Math.min(1,hookT+dt/440); if(resultT>1.45) newPlay(); return; }
}

// ---------- render ----------
function drawPitch(){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#12703f');g.addColorStop(0.55,'#0f5e34');g.addColorStop(1,'#0c4c2b');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  for(let i=0;i<9;i++){ ctx.fillStyle=i%2?'rgba(255,255,255,0.03)':'rgba(0,0,0,0.03)'; ctx.fillRect(0,i*70,W,70); }
  // out-of-play area beyond touchline (right)
  ctx.fillStyle='rgba(0,0,0,0.18)';ctx.fillRect(LINEX,0,W-LINEX,H);
  // touchline
  ctx.strokeStyle='rgba(255,255,255,0.92)';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(LINEX,40);ctx.lineTo(LINEX,H-40);ctx.stroke();
  ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='12px sans-serif';ctx.textAlign='left';ctx.fillText('タッチライン',LINEX+8,60);
}

function render(){
  ctx.save();
  if(shake>0)ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
  drawPitch();

  if(state==='play'||state==='over'){
    // teammate infield (cutback target)
    ctx.fillStyle='#3aa0ff';ctx.beginPath();ctx.ellipse(MATE.x,MATE.y,11,15,0,0,6.28);ctx.fill();
    ctx.fillStyle='#f0c9a0';ctx.beginPath();ctx.arc(MATE.x,MATE.y-22,8,0,6.28);ctx.fill();
    if(state==='play'&&phase==='roll'){ ctx.strokeStyle='rgba(120,220,255,0.4)';ctx.lineWidth=2;ctx.setLineDash([5,5]);
      ctx.beginPath();ctx.moveTo(LINEX-40,ROLLY);ctx.lineTo(MATE.x,MATE.y);ctx.stroke();ctx.setLineDash([]); }

    // ball
    let bx=ballX(), by=ROLLY;
    if(phase==='result'&&result==='save'){ const u=easeOut(hookT); bx=lerp(LINEX-6,MATE.x,u); by=lerp(ROLLY,MATE.y,u); }
    else if(phase==='result'&&result==='out'){ const u=easeOut(hookT); bx=lerp(LINEX+BALLR,LINEX+80,u); }
    else if(phase==='result'&&result==='early'){ const u=easeOut(hookT); bx=lerp(ballX(),LINEX+70,u); by=ROLLY-40*Math.sin(u*Math.PI); }
    ctx.fillStyle='rgba(0,0,0,0.18)';ctx.beginPath();ctx.ellipse(bx,by+11,9,3,0,0,6.28);ctx.fill();
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(bx,by,BALLR,0,6.28);ctx.fill();
    ctx.strokeStyle='#222';ctx.lineWidth=1.4;
    ctx.beginPath();ctx.moveTo(bx-6,by-4);ctx.lineTo(bx+2,by-9);ctx.lineTo(bx+7,by-2);ctx.lineTo(bx+3,by+6);ctx.lineTo(bx-6,by+5);ctx.closePath();ctx.stroke();

    // chasing player just behind the ball
    if(phase==='roll'){ const px=Math.min(bx-26,LINEX-30);
      ctx.fillStyle='#2b6fd6';ctx.beginPath();ctx.ellipse(px,ROLLY+6,12,16,0,0,6.28);ctx.fill();
      ctx.fillStyle='#f0c9a0';ctx.beginPath();ctx.arc(px,ROLLY-18,9,0,6.28);ctx.fill();
      // reaching leg toward ball
      ctx.strokeStyle='#2b6fd6';ctx.lineWidth=6;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(px+6,ROLLY+8);ctx.lineTo(px+22,ROLLY+2);ctx.stroke();ctx.lineCap='butt';
    }

    // save-window marker near the line
    if(state==='play'&&phase==='roll'){
      const wx0=lerp(STARTX,LINEX+BALLR,easeOut(clamp((crossT-win)/crossT,0,1)));
      ctx.fillStyle='rgba(90,240,130,0.14)';ctx.fillRect(wx0,ROLLY-40,LINEX-wx0,80);
      ctx.strokeStyle='rgba(120,255,150,0.55)';ctx.lineWidth=2;ctx.setLineDash([4,4]);
      ctx.beginPath();ctx.moveTo(wx0,ROLLY-40);ctx.lineTo(wx0,ROLLY+40);ctx.stroke();ctx.setLineDash([]);
      const near=clock>=crossT-win;
      if(near){ ctx.fillStyle='rgba(140,255,160,0.98)';ctx.font='bold 13px sans-serif';ctx.textAlign='center';ctx.fillText('今！掻き出せ',(wx0+LINEX)/2,ROLLY-48); }
    }

    // cue
    ctx.textAlign='center';
    if(state==='play'&&phase==='roll'){
      ctx.fillStyle='rgba(255,220,90,0.96)';ctx.font='bold 21px sans-serif';ctx.fillText('ボールがライン際へ！ 出る直前に掻き出してキープ',W/2,44);
      ctx.fillStyle='rgba(255,255,255,0.6)';ctx.font='13px sans-serif';ctx.fillText('ラインを割る直前（緑帯）でタップ / SPACE＝ギリギリほど高得点・早いと自分で蹴り出す',W/2,H-34);
    }
  }

  for(const p of parts){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,3.2,0,6.28);ctx.fill();}
  ctx.globalAlpha=1;
  for(const p of pops){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.font='bold 21px sans-serif';ctx.textAlign='center';ctx.fillText(p.txt,p.x,p.y);}
  ctx.globalAlpha=1;

  // HUD
  ctx.textAlign='left';ctx.fillStyle='#fff';ctx.font='bold 26px sans-serif';ctx.fillText('SCORE '+score,20,36);
  ctx.textAlign='right';ctx.fillStyle='rgba(255,255,255,0.9)';ctx.font='14px sans-serif';ctx.fillText('キープ '+outs+'  Lv'+lvl,W-20,24);
  ctx.fillText('ライン割れ',W-116,46);
  for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(W-60+i*20,41,7,0,6.28);ctx.fillStyle=i<fails?'#ff5b5b':'rgba(255,255,255,0.25)';ctx.fill();}
  if(combo>=2){ctx.textAlign='center';ctx.fillStyle='#ffd24d';ctx.font='bold 18px sans-serif';ctx.fillText('コンボ x'+combo,W/2,110);}

  if(state==='play'&&phase==='result'&&reason){ctx.textAlign='center';ctx.fillStyle=result==='save'?'#9ff0b8':'#ff9a9a';ctx.font='bold 18px sans-serif';ctx.fillText(reason,W/2,H-64);}

  if(state==='title'){
    ctx.fillStyle='rgba(4,10,7,0.82)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='bold 40px sans-serif';ctx.fillText('キープイン',W/2,90);
    ctx.fillStyle='#ffd23e';ctx.font='bold 22px sans-serif';ctx.fillText('Keep It Alive',W/2,126);
    ctx.fillStyle='rgba(255,255,255,0.92)';ctx.font='16px sans-serif';
    ctx.fillText('タッチライン際へ流れるボールを、外に出す直前で掻き出してマイボールをキープしろ',W/2,182);
    ctx.fillStyle='rgba(255,255,255,0.66)';ctx.font='14px sans-serif';
    ctx.fillText('転がる球がラインへ迫る→“出る直前”の緑の帯でタップ / SPACE で掻き出し＝切り返してキープ',W/2,220);
    ctx.fillText('ギリギリで残すほど値千金の“魅せ”プレーで高得点（ライン際ドンピシャは大量点）',W/2,244);
    ctx.fillText('早すぎると自分でボールを外へ蹴り出す／遅れるとラインを割って相手ボール',W/2,268);
    ctx.fillText('上級ほど球が速く猶予（帯）が狭い。3ライン割れで交代',W/2,292);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で開始',W/2,360);
    ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='14px sans-serif';ctx.fillText('BEST '+best,W/2,392);
  }
  if(state==='over'){
    ctx.fillStyle='rgba(4,10,7,0.84)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#ff6b6b';ctx.font='bold 44px sans-serif';ctx.fillText('3ライン割れ…交代',W/2,222);
    ctx.fillStyle='#fff';ctx.font='bold 40px sans-serif';ctx.fillText('SCORE '+score,W/2,290);
    ctx.fillStyle='rgba(255,255,255,0.85)';ctx.font='19px sans-serif';ctx.fillText('キープ '+outs+'   BEST '+best,W/2,330);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で もう一度',W/2,402);
  }

  if(flash>0.02){ctx.globalAlpha=flash*0.5;ctx.fillStyle=flashCol;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}
  ctx.restore();

  ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,0.4)';ctx.font='12px sans-serif';
  ctx.fillText('キープイン：ライン際へ流れる球を出る直前（緑帯）で掻き出してキープ。ギリギリほど高得点、早いと蹴り出し・遅いとライン割れ、3つで交代',W/2,H-8);
}

function frame(ts){let dt=ts-last;last=ts;if(dt>60)dt=60;if(dt<0)dt=0;update(dt);render();requestAnimationFrame(frame);}
requestAnimationFrame(frame);

// ---------- test hook ----------
window.__kia={
  start, flick:()=>flick(),
  get state(){return state;},
  get score(){return score;},
  get outs(){return outs;},
  get fails(){return fails;},
  get info(){return {state,phase,clock,crossT,win,tough,flicked,flickClock,result,outs,fails,lvl,
    canSave:(phase==='roll'&&!flicked&&clock>=crossT-win&&clock<=crossT)};}
};
})();
</script>
</body>
</html>
