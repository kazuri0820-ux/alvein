<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>グラブトス (Glove Flip)</title>
<style>
  html,body{margin:0;height:100%;background:#0a0d08;overflow:hidden;
    font-family:-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  #stage{position:relative;width:100vw;height:100vh;max-width:calc(100vh*1.5);max-height:calc(100vw/1.5);aspect-ratio:900/600;}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;border-radius:6px;}
</style>
</head>
<body>
<div id="wrap"><div id="stage"><canvas id="cv"></canvas></div></div>
<script>
(function(){
const W=900,H=600,cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let DPR=1;
function fit(){DPR=Math.min(2,window.devicePixelRatio||1);cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
fit();addEventListener('resize',fit);

// ---------- audio ----------
let AC=null;function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function tone(f,d,type,v,sweep){const a=ac();if(!a)return;const t=a.currentTime,o=a.createOscillator(),g=a.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(sweep)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+sweep),t+d);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v||0.2,t+0.008);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+0.02);}
function noise(d,v,hp){const a=ac();if(!a)return;const t=a.currentTime,n=Math.floor(a.sampleRate*d),buf=a.createBuffer(1,n,a.sampleRate),ch=buf.getChannelData(0);
  for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource();s.buffer=buf;
  const f=a.createBiquadFilter();f.type='highpass';f.frequency.value=hp||600;const g=a.createGain();g.gain.value=v||0.2;
  s.connect(f);f.connect(g);g.connect(a.destination);s.start(t);s.stop(t+d+0.02);}
const S={
  set:()=>{tone(240,0.05,'sine',0.03);},
  flip:()=>{tone(520,0.06,'triangle',0.09);noise(0.03,0.08,1400);},
  good:()=>{[660,900,1180].forEach((f,i)=>setTimeout(()=>tone(f,0.11,'triangle',0.16),i*56));},
  big:()=>{[600,800,1000,1250].forEach((f,i)=>setTimeout(()=>tone(f,0.12,'triangle',0.17),i*80));},
  bad:()=>{noise(0.2,0.24,240);tone(150,0.24,'sawtooth',0.13,-50);},
  streak:()=>{[700,930,1170,1400].forEach((f,i)=>setTimeout(()=>tone(f,0.1,'triangle',0.16),i*60));},
  over:()=>{[440,330,247,175].forEach((f,i)=>setTimeout(()=>tone(f,0.3,'triangle',0.2),i*160));}
};

// ---------- geometry ----------
const SECOND={x:452,y:214}, FIRST={x:690,y:346}, THIRD={x:214,y:346}, HOME={x:452,y:476};
const FLIP={x:548,y:250};                 // you (2B), fielded the ball just to the 1B side of the bag
const SS0={x:322,y:292};                  // shortstop starts here, races to cover second
const R0={x:642,y:300};                   // runner from first, bearing down on second
function coverPos(t){ const u=easeOut(clamp(t/arriveT,0,1)); return {x:lerp(SS0.x,SECOND.x-14,u), y:lerp(SS0.y,SECOND.y+4,u)}; }
function runnerPos(t){ const u=easeOut(clamp(t/(arriveT+w*1.35),0,1)); return {x:lerp(R0.x,SECOND.x+18,u), y:lerp(R0.y,SECOND.y+8,u)}; }

// ---------- state ----------
let state='title', phase='live', plays=0;
let score=0, combo=0, best=+(localStorage.getItem('gf_best')||0);
let outs=0, fails=0, lvl=1;   // outs = double plays turned (clean feeds)
let clock=0, arriveT=920, w=190, tough=false;
let decided=false, relT=0, result=null, resultT=0, msg='', msgOk=false, quality=0, anim=0;
let shake=0, flash=0, flashCol='#fff', last=performance.now();
let parts=[], pops=[];

function rnd(a,b){return a+Math.random()*(b-a);}
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function lerp(a,b,u){return a+(b-a)*u;}
function easeOut(u){return 1-Math.pow(1-u,2);}
function arc(a,b,u,h){ return {x:lerp(a.x,b.x,u), y:lerp(a.y,b.y,u)-h*Math.sin(Math.PI*u)}; }

function reset(){state='title';score=0;combo=0;outs=0;fails=0;lvl=1;plays=0;result=null;parts=[];pops=[];}

function newPlay(){
  plays++; lvl=Math.min(7,1+Math.floor(outs/4));
  arriveT=clamp(1000-lvl*46,700,1000);      // cover man reaches the bag sooner at higher levels
  w=clamp(200-lvl*16,100,200);
  tough=Math.random()<clamp(0.2+lvl*0.05,0.2,0.5);  // ball fielded on the move / awkward feed
  if(tough)w*=0.82;
  phase='live'; clock=0; decided=false; relT=0; result=null; resultT=0; msg=''; msgOk=false; quality=0; anim=0;
  S.set();
}
function start(){ if(!ac())ac(); if(AC&&AC.state==='suspended')AC.resume(); reset(); state='play'; newPlay(); }

function flip(){   // underhand glove-flip to the covering fielder
  if(state==='title'){start();return;}
  if(state==='over'){ if(resultT>0.4){reset();start();} return; }
  if(state!=='play'||phase!=='live'||decided) return;
  decided=true; relT=clock; S.flip();
  if(clock<arriveT-w){ resolve('early'); }
  else if(clock>arriveT+w){ resolve('late'); }
  else { quality=1-Math.abs(clock-arriveT)/w; resolve('flip'); }
}

function resolve(k){
  phase='result'; result=k; resultT=0; anim=0;
  if(k==='flip'){
    outs++; combo++;
    const perfect=quality>=0.72;
    let add=Math.round((60+Math.round(quality*150)+(tough?70:0))*(1+Math.min(9,combo-1)*0.14)); score+=add;
    setTimeout(S.good,110); if(perfect||tough)setTimeout(S.big,190);
    msgOk=true; flash=1;flashCol='#8affa0';shake=6; burst(SECOND.x,SECOND.y,'#8affa0',18,7);
    pop(W/2,250,(perfect?'グラブから完璧なトス！ゲッツー完成！ +':'ベースへピタリ——素早い転送で併殺！ +')+add,'#d6ffe0');
    if(combo>=2)pop(W/2,214,'コンボ x'+combo,'#ffd24d');
    if(combo>0&&combo%5===0)S.streak();
    msg=perfect?'カバーに入った遊撃手がベースを踏むその瞬間、グラブトスがミットへピタリ——流れるような転送で一塁も刺し併殺完成！':'ベースカバーの到達に合わせて下手投げ——好捕からの素早いグラブトスでゲッツーを完成させた！';
  } else {
    fails++; combo=0; msgOk=false; flash=1;flashCol='#ff5b5b';shake=8; S.bad();
    if(k==='early') msg='トスが早い…遊撃手がベースに入る前に放り、無人の二塁を抜けてボールは外野へ——走者は生きて傷口が広がった';
    else msg='トスが遅い…カバーがベースを通過し、滑り込む走者が先に到達——フォースアウトを取れず併殺崩れ';
    pop(W/2,250,(k==='early')?'早い…二塁を抜けた':'遅い…併殺崩れ','#ffb0b0');
  }
  if(fails>=3){ state='over'; resultT=0; S.over(); if(score>best){best=score;localStorage.setItem('gf_best',best);} }
}

// ---------- input ----------
cv.addEventListener('pointerdown',e=>{e.preventDefault();flip();});
addEventListener('keydown',e=>{ if(e.repeat)return; if(e.code==='Space'||e.code==='Enter'||e.code==='ArrowUp'||e.code==='KeyF'){e.preventDefault();flip();} });

// ---------- particles ----------
function burst(x,y,c,n,sp){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=rnd(sp*0.3,sp);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:1,c});}}
function pop(x,y,txt,c){pops.push({x,y,txt,c,life:1});}

// ---------- update ----------
function update(dt){
  shake*=Math.pow(0.86,dt/16.7); if(shake<0.3)shake=0;
  flash*=Math.pow(0.9,dt/16.7);
  for(const p of parts){p.vx*=0.96;p.vy=p.vy*0.96+0.28;p.x+=p.vx*dt/16.7;p.y+=p.vy*dt/16.7;p.life-=dt/16.7*0.026;}
  parts=parts.filter(p=>p.life>0);
  for(const p of pops){p.y-=dt/16.7*0.5;p.life-=dt/16.7*0.02;}
  pops=pops.filter(p=>p.life>0);

  if(state!=='play'){ if(state==='over')resultT+=dt/1000; return; }
  if(phase==='live'){ clock+=dt;
    if(!decided && clock>arriveT+w+80){ decided=true; resolve('late'); }
    return; }
  if(phase==='result'){ resultT+=dt/1000; anim=Math.min(1,anim+dt/360); if(resultT>1.6) newPlay(); return; }
}

// ---------- render ----------
function drawField(){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#12703f');g.addColorStop(0.5,'#0f5e34');g.addColorStop(1,'#0c4c2b');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  // infield dirt diamond
  ctx.fillStyle='#6a4a30';ctx.beginPath();ctx.moveTo(HOME.x,HOME.y+22);ctx.lineTo(FIRST.x+24,FIRST.y);ctx.lineTo(SECOND.x,SECOND.y-26);ctx.lineTo(THIRD.x-24,THIRD.y);ctx.closePath();ctx.fill();
  // dirt ring around second (the pivot area)
  ctx.fillStyle='rgba(120,84,54,0.55)';ctx.beginPath();ctx.arc(SECOND.x,SECOND.y+2,86,0,6.28);ctx.fill();
  // basepaths
  ctx.strokeStyle='rgba(230,210,150,0.5)';ctx.lineWidth=7;
  ctx.beginPath();ctx.moveTo(HOME.x,HOME.y);ctx.lineTo(FIRST.x,FIRST.y);ctx.lineTo(SECOND.x,SECOND.y);ctx.lineTo(THIRD.x,THIRD.y);ctx.closePath();ctx.stroke();
  // bags
  for(const B of [FIRST,THIRD]){ ctx.save();ctx.translate(B.x,B.y);ctx.rotate(0.785);ctx.fillStyle='#eef0f2';ctx.fillRect(-10,-10,20,20);ctx.restore(); }
  ctx.fillStyle='#eef0f2';ctx.beginPath();ctx.moveTo(HOME.x-13,HOME.y-7);ctx.lineTo(HOME.x+13,HOME.y-7);ctx.lineTo(HOME.x+13,HOME.y+2);ctx.lineTo(HOME.x,HOME.y+13);ctx.lineTo(HOME.x-13,HOME.y+2);ctx.closePath();ctx.fill();
}
function person(x,y,col,s,lean){s=s||1;lean=lean||0;
  ctx.save();ctx.translate(x,y);ctx.rotate(lean);
  ctx.fillStyle='rgba(0,0,0,0.2)';ctx.beginPath();ctx.ellipse(0,13*s,10*s,4*s,0,0,6.28);ctx.fill();
  ctx.fillStyle=col;ctx.beginPath();ctx.ellipse(0,-14*s,9*s,14*s,0,0,6.28);ctx.fill();
  ctx.fillStyle='#f0c9a0';ctx.beginPath();ctx.arc(0,-31*s,7*s,0,6.28);ctx.fill();
  ctx.restore();
}
function slider(x,y,col,lean){ ctx.save();ctx.translate(x,y);ctx.rotate(lean);
  ctx.fillStyle=col;ctx.beginPath();ctx.ellipse(0,-6,17,8,0,0,6.28);ctx.fill();
  ctx.fillStyle='#f0c9a0';ctx.beginPath();ctx.arc(-15,-9,6.5,0,6.28);ctx.fill();
  ctx.strokeStyle=col;ctx.lineWidth=6;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(8,-4);ctx.lineTo(23,-2);ctx.stroke();ctx.restore(); }
function bag(B,hot){ ctx.save();ctx.translate(B.x,B.y);ctx.rotate(0.785);
  ctx.fillStyle=hot?'#fff7cf':'#eef0f2';ctx.fillRect(-11,-11,22,22);ctx.restore(); }

function render(){
  ctx.save();
  if(shake>0)ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
  drawField();

  if(state==='play'||state==='over'){
    const near=(phase==='live'&&Math.abs(clock-arriveT)<=w);
    // second base bag (glows green while the cover man is arriving in-window)
    bag(SECOND, near);

    // covering shortstop running to the bag
    let cov;
    if(phase==='live') cov=coverPos(clock);
    else if(result==='early') cov=coverPos(relT);                 // caught short of the bag (flip was too soon)
    else cov=coverPos(Math.max(arriveT,relT||arriveT));           // at/over the bag
    person(cov.x,cov.y,'#e8c23a',0.98,0);

    // runner from first, sliding into second
    let rn;
    if(phase==='live') rn=runnerPos(clock);
    else rn=runnerPos(Math.min(arriveT+w*1.35, (relT||0)+ (result==='late'?520:260)));
    const sliding=(rn.x-SECOND.x)<70;
    if(sliding) slider(rn.x,rn.y,'#c8443d',-0.4); else person(rn.x,rn.y,'#c8443d',0.98,0);

    // you (2B) who fielded it and flips
    person(FLIP.x,FLIP.y,'#2b6fd6',1.0, phase==='result'?0.25:0);

    // ball
    let b;
    if(phase==='live'){ b={x:FLIP.x-6,y:FLIP.y-6}; }   // in your glove
    else {
      const u=easeOut(anim);
      if(result==='flip'){
        if(anim<0.5){ b=arc(FLIP,SECOND, anim/0.5, 26); }                          // underhand toss to the bag
        else { b=arc(SECOND,FIRST,(anim-0.5)/0.5, 40); }                            // relay on to first
      } else if(result==='early'){
        // toss sails through the empty bag into center field
        if(anim<0.45){ b=arc(FLIP,SECOND, anim/0.45, 24); }
        else { const uu=(anim-0.45)/0.55; b={x:lerp(SECOND.x,452,uu), y:lerp(SECOND.y,70,uu)}; }
      } else {
        b=arc(FLIP,SECOND, Math.min(1,anim/0.6), 24);                              // arrives, but late
      }
    }
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(b.x,b.y,7,0,6.28);ctx.fill();
    ctx.strokeStyle='#c33';ctx.lineWidth=1;ctx.beginPath();ctx.arc(b.x,b.y,7,0.4,2.2);ctx.stroke();

    // relay-to-first result flourish
    if(phase==='result'&&result==='flip'&&anim>0.5){ person(FIRST.x,FIRST.y-4,'#e8c23a',0.9,0); }

    // timing bar + banner
    ctx.textAlign='center';
    if(state==='play'&&phase==='live'){
      ctx.fillStyle=near?'rgba(140,255,160,0.98)':'rgba(255,220,90,0.96)';ctx.font='bold 21px sans-serif';
      ctx.fillText(near?'今だ！ ベースへグラブトス！':'遊撃手がベースカバーへ——到達に合わせて下手投げ',W/2,44);
      const bw=280,x=W/2-bw/2,y=62;
      const wl=x+bw*clamp((arriveT-w)/(arriveT+w),0,1), ww=bw*(2*w/(arriveT+w));
      ctx.fillStyle='rgba(255,255,255,0.15)';ctx.fillRect(x,y,bw,8);
      ctx.fillStyle='rgba(120,255,150,0.5)';ctx.fillRect(wl,y,ww,8);
      const px=x+bw*clamp(clock/(arriveT+w),0,1);
      ctx.fillStyle='#ffe14d';ctx.fillRect(px-2,y-3,4,14);
      ctx.fillStyle='rgba(255,255,255,0.55)';ctx.font='12px sans-serif';ctx.fillText('タップ / クリック / SPACE ＝ グラブトス（早いと二塁を抜け・遅いと走者が先に到達）',W/2,H-22);
    }
  }

  for(const p of parts){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,3.2,0,6.28);ctx.fill();}
  ctx.globalAlpha=1;
  for(const p of pops){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.font='bold 21px sans-serif';ctx.textAlign='center';ctx.fillText(p.txt,p.x,p.y);}
  ctx.globalAlpha=1;

  // HUD
  ctx.textAlign='left';ctx.fillStyle='#fff';ctx.font='bold 26px sans-serif';ctx.fillText('SCORE '+score,20,36);
  ctx.textAlign='right';ctx.fillStyle='rgba(255,255,255,0.9)';ctx.font='14px sans-serif';ctx.fillText('併殺 '+outs+'  Lv'+lvl,W-20,24);
  ctx.fillText('失敗',W-92,46);
  for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(W-60+i*20,41,7,0,6.28);ctx.fillStyle=i<fails?'#ff5b5b':'rgba(255,255,255,0.25)';ctx.fill();}
  if(combo>=2){ctx.textAlign='center';ctx.fillStyle='#ffd24d';ctx.font='bold 18px sans-serif';ctx.fillText('コンボ x'+combo,W/2,112);}

  if(state==='play'&&phase==='result'&&msg){ctx.textAlign='center';ctx.fillStyle=msgOk?'#9ff0b8':'#ff9a9a';ctx.font='bold 15px sans-serif';ctx.fillText(msg,W/2,300);}

  if(state==='title'){
    ctx.fillStyle='rgba(4,8,4,0.84)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='bold 42px sans-serif';ctx.fillText('グラブトス',W/2,82);
    ctx.fillStyle='#ffd23e';ctx.font='bold 22px sans-serif';ctx.fillText('Glove Flip',W/2,118);
    ctx.fillStyle='rgba(255,255,255,0.92)';ctx.font='16px sans-serif';
    ctx.fillText('二塁手として、ベース間近で捌いたゴロを、カバーに入る遊撃手の到達に合わせて“下手投げ”でトスし併殺を始動せよ',W/2,172);
    ctx.fillStyle='rgba(255,255,255,0.66)';ctx.font='14px sans-serif';
    ctx.fillText('遊撃手が二塁ベースを踏む“その瞬間”の緑帯でタップ/クリック/SPACE＝グラブトス（ベースが緑に光る）',W/2,210);
    ctx.fillText('早い＝カバーが入る前に放って無人の二塁を抜け外野へ（傷口拡大）／遅い＝走者が先に到達で併殺崩れ',W/2,234);
    ctx.fillText('到達ドンピシャでミットへ収めるほど、流れる転送で一塁も刺しゲッツー完成＝大量加点＆コンボ',W/2,258);
    ctx.fillText('捕った体勢が難しい際どい球（tough）を捌くと加点。上級ほどカバーが速く帯が短い。3失敗で交代',W/2,282);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で開始',W/2,352);
    ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='14px sans-serif';ctx.fillText('BEST '+best,W/2,384);
  }
  if(state==='over'){
    ctx.fillStyle='rgba(4,8,4,0.86)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#ff6b6b';ctx.font='bold 46px sans-serif';ctx.fillText('3失敗…交代',W/2,222);
    ctx.fillStyle='#fff';ctx.font='bold 40px sans-serif';ctx.fillText('SCORE '+score,W/2,290);
    ctx.fillStyle='rgba(255,255,255,0.85)';ctx.font='19px sans-serif';ctx.fillText('併殺 '+outs+'   BEST '+best,W/2,330);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で もう一度',W/2,402);
  }

  if(flash>0.02){ctx.globalAlpha=flash*0.5;ctx.fillStyle=flashCol;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}
  ctx.restore();

  ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,0.4)';ctx.font='12px sans-serif';
  ctx.fillText('グラブトス：カバーの遊撃手が二塁に到達する瞬間に下手投げ＝併殺始動。早いと二塁を抜け・遅いと走者が先着、3失敗で交代',W/2,H-8);
}

function frame(ts){let dt=ts-last;last=ts;if(dt>60)dt=60;if(dt<0)dt=0;update(dt);render();requestAnimationFrame(frame);}
requestAnimationFrame(frame);

// ---------- test hook ----------
window.__gf={
  start, flip:()=>flip(),
  get state(){return state;},
  get score(){return score;},
  get outs(){return outs;},
  get fails(){return fails;},
  get info(){return {state,phase,clock,arriveT,w,tough,decided,result,outs,fails,lvl,
    inWindow:(phase==='live'&&clock>=arriveT-w&&clock<=arriveT+w),canAct:(phase==='live'&&!decided)};}
};
})();
</script>
</body>
</html>
