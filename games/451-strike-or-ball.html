<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ストライク、ボール！ (Strike or Ball?)</title>
<style>
  html,body{margin:0;padding:0;background:#0a1016;overflow:hidden;font-family:'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif;-webkit-user-select:none;user-select:none;touch-action:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 22%,#2a3a24,#060a08 72%);}
  #stage{position:relative;width:min(100vw,calc(100vh*1.5));aspect-ratio:900/600;max-width:900px;box-shadow:0 10px 60px rgba(0,0,0,.6);border-radius:8px;overflow:hidden;}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;}
</style>
</head>
<body>
<div id="wrap"><div id="stage"><canvas id="cv"></canvas></div></div>
<script>
(function(){
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const W=900,H=600;let DPR=Math.min(2,window.devicePixelRatio||1);
function fit(){const r=cv.getBoundingClientRect();DPR=Math.min(2,window.devicePixelRatio||1);cv.width=Math.round(r.width*DPR);cv.height=Math.round(r.height*DPR);ctx.setTransform(cv.width/W,0,0,cv.height/H,0,0);}
new ResizeObserver(fit).observe(cv);fit();

// ---------- audio ----------
let AC=null;function actx(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function tone(f,d,type,v,sweep){const a=actx();if(!a)return;const o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.value=f;if(sweep)o.frequency.linearRampToValueAtTime(sweep,a.currentTime+d);g.gain.value=0.0001;g.gain.exponentialRampToValueAtTime(v||0.2,a.currentTime+0.008);g.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+d);o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+d+0.02);}
function noise(d,v,hp){const a=actx();if(!a)return;const n=a.createBufferSource(),b=a.createBuffer(1,a.sampleRate*d,a.sampleRate),dt=b.getChannelData(0);for(let i=0;i<dt.length;i++)dt[i]=Math.random()*2-1;n.buffer=b;const f=a.createBiquadFilter();f.type='highpass';f.frequency.value=hp||800;const g=a.createGain();g.gain.value=0.0001;g.gain.exponentialRampToValueAtTime(v||0.2,a.currentTime+0.01);g.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+d);n.connect(f);f.connect(g);g.connect(a.destination);n.start();n.stop(a.currentTime+d+0.02);}
const S={
  pop(){noise(0.05,0.22,900);tone(320,0.06,'square',0.12,180);},   // ball into mitt
  whoosh(){noise(0.12,0.08,500);},
  right(){tone(560,0.1,'triangle',0.2);setTimeout(function(){tone(760,0.14,'triangle',0.22);},110);},
  wrong(){tone(280,0.32,'sawtooth',0.18,150);setTimeout(function(){tone(180,0.4,'sawtooth',0.16,110);},150);},
  roar(){noise(0.5,0.14,300);},
  combo(n){tone(600+Math.min(n,8)*70,0.12,'triangle',0.16);},
  over(){tone(330,0.3,'sine',0.2,160);setTimeout(function(){tone(220,0.5,'sine',0.2,110);},180);},
  start(){tone(440,0.1,'triangle',0.18);setTimeout(function(){tone(660,0.16,'triangle',0.2);},110);},
};

function clamp(v,a,b){return v<a?a:v>b?b:v;}
function rnd(a,b){return a+Math.random()*(b-a);}

// ---------- state ----------
// truth 'strike' = caught the outside corner (in the zone) ; 'ball' = just missed outside
let state='title';
let outs=0,fails=0,score=0,combo=0,lvl=1;   // outs = correct calls
let best=0;try{best=parseInt(localStorage.getItem('sb_best')||'0')||0;}catch(e){}
const TARGET=26;

let phase='wind';  // wind | watch | result
let pt=0, clock=0;
let revealT=500, callWin=1000, tough=false, truth='strike';
let decided=false, result='', called='';
// strike-zone geometry (ump view, ball comes toward the plate)
const ZX=372, ZY=232, ZW=156, ZH=186;      // zone box
const EDGEX=ZX+ZW;                          // the outside (right) edge — the borderline
const ZMIDY=ZY+ZH*0.5;
let margin=20, fx=EDGEX, fy=ZMIDY, br=4;
const LAUNCH=[440,58];
let bx=440,by=58;
let mitt=0;                                 // 0..1 catcher-mitt travel
let parts=[];
let shakeT=0,flash=0;
let msg='',msgCol='#fff',msgT=0;
let lastAdd=0;

function reset(){outs=0;fails=0;score=0;combo=0;lvl=1;parts=[];}
function newPlay(){
  lvl=Math.min(7,1+Math.floor(outs/4));
  revealT=clamp(560-lvl*24,360,560);
  callWin=clamp(1020-lvl*70,560,1020);
  tough=Math.random()<clamp(0.2+lvl*0.05,0.2,0.5);
  truth=Math.random()<0.5?'strike':'ball';
  margin=tough?rnd(4,11):rnd(16,32);
  fx=(truth==='strike')?EDGEX-margin:EDGEX+margin;   // inside the edge = strike
  fy=ZMIDY+rnd(-ZH*0.16,ZH*0.16);
  phase='wind';pt=0;clock=0;decided=false;result='';called='';mitt=0;br=4;
  bx=LAUNCH[0];by=LAUNCH[1];
}
function startGame(){reset();state='play';newPlay();S.start();}

function burst(x,y,col,n,sp){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=rnd(0.4,1)*(sp||3);parts.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:1,col:col,r:rnd(2,5)});}}

function resolve(kind){
  decided=true;result=kind;
  if(kind==='right'){
    outs++;combo++;
    const cm=1+Math.min(combo-1,6)*0.13;
    const add=Math.round((100+(tough?60:0))*cm)*Math.max(1,lvl);
    score+=add;lastAdd=add;
    S.right();if(combo>1)setTimeout(function(){S.combo(combo);},250);
    flash=0.26;burst(fx,fy,truth==='strike'?'#ffd23a':'#8ad0ff',13,3);
    msg='正しいジャッジ！ '+(truth==='strike'?'コーナーを捉えた——ストライク！':'わずかに外れた——ボール！')+'  +'+add;msgCol='#5affa0';msgT=1;
  }else{
    combo=0;fails++;
    S.wrong();flash=0.36;shakeT=0.7;
    if(result==='early')msg='早すぎる！ まだ捕手が捕っていない';
    else if(result==='late')msg='判定が遅い！ 両ベンチがもめ出す';
    else msg='誤審！ 本当は'+(truth==='strike'?'ストライク（ゾーンをかすめた）だった':'ボール（外れていた）だった');
    msgCol='#ff6a6a';msgT=1;
  }
  phase='result';pt=0;
}

function makeCall(c){
  if(state!=='play'||phase!=='watch'||decided)return;
  called=c;
  if(clock<revealT){resolve('early');return;}
  const correct=(c===truth);
  resolve(correct?'right':'wrong');
}

// ---------- input ----------
// left button / A = ストライク ; right button / D = ボール
function actS(){if(!AC)actx();if(state==='title'){startGame();return;}if(state==='over'){startGame();return;}makeCall('strike');}
function actB(){if(!AC)actx();if(state==='title'){startGame();return;}if(state==='over'){startGame();return;}makeCall('ball');}
cv.addEventListener('mousedown',function(e){e.preventDefault();
  if(state!=='play'){actS();return;}
  const r=cv.getBoundingClientRect();const x=(e.clientX-r.left)/r.width*W;
  if(x<450)actS();else actB();
});
cv.addEventListener('touchstart',function(e){e.preventDefault();
  if(state!=='play'){actS();return;}
  const r=cv.getBoundingClientRect();const t=e.changedTouches[0];const x=(t.clientX-r.left)/r.width*W;
  if(x<450)actS();else actB();
},{passive:false});
window.addEventListener('keydown',function(e){
  if(e.code==='ArrowLeft'||e.code==='KeyA'){e.preventDefault();actS();}
  else if(e.code==='ArrowRight'||e.code==='KeyD'){e.preventDefault();actB();}
  else if(e.code==='Space'||e.code==='Enter'){e.preventDefault();if(state!=='play')actS();}
});

// ---------- update ----------
let last=0;
function update(dt){
  if(flash>0)flash=Math.max(0,flash-dt/300);
  if(shakeT>0)shakeT=Math.max(0,shakeT-dt/320);
  if(msgT>0)msgT=Math.max(0,msgT-dt/1500);
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.x+=p.vx;p.y+=p.vy;p.vy+=0.16;p.life-=dt/640;if(p.life<=0)parts.splice(i,1);}
  if(state!=='play')return;
  pt+=dt;
  if(phase==='wind'){
    if(pt>=440){phase='watch';pt=0;clock=0;S.whoosh();}
  }else if(phase==='watch'){
    clock+=dt;
    if(clock<revealT){
      // pitch flies from the mound toward the plate; grows with perspective
      const u=clamp(clock/revealT,0,1);
      bx=LAUNCH[0]+(fx-LAUNCH[0])*u;
      by=LAUNCH[1]+(fy-LAUNCH[1])*u;
      br=4+u*5.5;
    }else{
      if(mitt<0.02)S.pop();
      mitt=Math.min(1,mitt+dt/160);
      bx=fx;by=fy;br=9;
    }
    if(clock>=revealT+callWin&&!decided)resolve('late');
  }else if(phase==='result'){
    mitt=Math.min(1,mitt+dt/160);
    if(pt>=1080){
      if(fails>=3){state='over';best=Math.max(best,score);try{localStorage.setItem('sb_best',String(best));}catch(e){}S.over();}
      else if(outs>=TARGET){state='over';best=Math.max(best,score);try{localStorage.setItem('sb_best',String(best));}catch(e){}S.roar();}
      else newPlay();
    }
  }
}

// ---------- render ----------
function roundRect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

function drawField(){
  // stands / backdrop beyond the mound
  const sky=ctx.createLinearGradient(0,0,0,150);sky.addColorStop(0,'#22344a');sky.addColorStop(1,'#31506a');
  ctx.fillStyle=sky;ctx.fillRect(0,0,W,150);
  ctx.fillStyle='#1c2c40';ctx.fillRect(0,86,W,64);
  for(let y=92;y<146;y+=12){for(let x=8;x<W;x+=13){ctx.fillStyle=(x+y)%3?'rgba(200,210,230,.08)':'rgba(255,230,160,.08)';ctx.fillRect(x,y,6,6);}}
  // grass
  const gr=ctx.createLinearGradient(0,150,0,H);gr.addColorStop(0,'#2f7d45');gr.addColorStop(1,'#215c33');
  ctx.fillStyle=gr;ctx.fillRect(0,150,W,H-150);
  // mowing stripes
  for(let i=0;i<10;i++){ctx.fillStyle=i%2?'rgba(255,255,255,.03)':'rgba(0,0,0,.04)';ctx.fillRect(i*90,150,90,H-150);}
  // dirt of the batter's box / home-plate circle
  ctx.fillStyle='#8a5a34';ctx.beginPath();ctx.ellipse(450,500,300,120,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#7a4e2c';ctx.beginPath();ctx.ellipse(450,516,210,78,0,0,Math.PI*2);ctx.fill();
  // pitcher's mound (far, small)
  ctx.fillStyle='#8a5a34';ctx.beginPath();ctx.ellipse(450,110,54,16,0,0,Math.PI*2);ctx.fill();
  // home plate (pentagon), ump view
  ctx.fillStyle='#f4f4f4';ctx.beginPath();ctx.moveTo(450,556);ctx.lineTo(492,536);ctx.lineTo(486,512);ctx.lineTo(414,512);ctx.lineTo(408,536);ctx.closePath();ctx.fill();
  // batter's boxes (chalk)
  ctx.strokeStyle='rgba(255,255,255,.5)';ctx.lineWidth=3;
  ctx.strokeRect(300,486,66,96);ctx.strokeRect(534,486,66,96);
}

function drawBatterCatcher(){
  // batter taking the pitch (left box)
  ctx.save();ctx.translate(340,470);
  ctx.fillStyle='#20242c';ctx.fillRect(-9,44,8,40);ctx.fillRect(2,44,8,40);
  ctx.fillStyle='#2d5fa8';ctx.fillRect(-14,2,26,46);          // uniform
  ctx.fillStyle='#e9c39a';ctx.beginPath();ctx.arc(-1,-12,12,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#16305c';ctx.beginPath();ctx.arc(-1,-16,13,Math.PI,0);ctx.fill();  // helmet
  // bat on shoulder
  ctx.strokeStyle='#c9a05a';ctx.lineWidth=6;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(8,6);ctx.lineTo(40,-40);ctx.stroke();
  ctx.restore();

  // catcher crouched behind the plate, mitt reaches to the pitch
  const mx=450+(fx-450)*(0.35+mitt*0.65), my=470+(fy-470)*(0.30+mitt*0.70);
  ctx.save();ctx.translate(450,528);
  ctx.fillStyle='#1b1e24';ctx.beginPath();ctx.ellipse(0,26,40,20,0,0,Math.PI*2);ctx.fill();  // seat/legs
  ctx.fillStyle='#8a1f28';ctx.beginPath();ctx.ellipse(0,-2,30,30,0,Math.PI,0);ctx.fill();     // back (chest protector)
  ctx.fillStyle='#333';ctx.beginPath();ctx.arc(0,-26,13,0,Math.PI*2);ctx.fill();               // helmet back
  ctx.fillStyle='#777';ctx.beginPath();ctx.arc(0,-26,13,Math.PI*0.15,Math.PI*0.85);ctx.fill(); // cage
  ctx.restore();
  // mitt (drawn at plate-relative, tracks toward the ball)
  ctx.save();ctx.translate(mx,my);
  ctx.fillStyle='#6b3f1e';ctx.beginPath();ctx.arc(0,0,13,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#8a552a';ctx.beginPath();ctx.arc(0,0,9,0,Math.PI*2);ctx.fill();
  ctx.restore();
}

function drawZone(){
  // floating strike zone above the plate
  ctx.save();
  ctx.strokeStyle='rgba(255,255,255,.85)';ctx.lineWidth=2.5;ctx.setLineDash([7,6]);
  ctx.strokeRect(ZX,ZY,ZW,ZH);ctx.setLineDash([]);
  // 3x3 guide grid
  ctx.strokeStyle='rgba(255,255,255,.18)';ctx.lineWidth=1;
  for(let i=1;i<3;i++){ctx.beginPath();ctx.moveTo(ZX+ZW*i/3,ZY);ctx.lineTo(ZX+ZW*i/3,ZY+ZH);ctx.stroke();
    ctx.beginPath();ctx.moveTo(ZX,ZY+ZH*i/3);ctx.lineTo(ZX+ZW,ZY+ZH*i/3);ctx.stroke();}
  // highlight the outside (borderline) edge
  ctx.strokeStyle='rgba(255,210,58,.55)';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(EDGEX,ZY);ctx.lineTo(EDGEX,ZY+ZH);ctx.stroke();
  ctx.restore();
}

function drawPitch(){
  // ball + trail
  ctx.strokeStyle='rgba(255,255,255,.28)';ctx.lineWidth=Math.max(2,br*0.5);ctx.lineCap='round';
  const tx=bx-(fx-LAUNCH[0])*0.05, ty=by-(fy-LAUNCH[1])*0.05;
  ctx.beginPath();ctx.moveTo(tx,ty);ctx.lineTo(bx,by);ctx.stroke();
  ctx.fillStyle='rgba(0,0,0,.16)';ctx.beginPath();ctx.ellipse(bx,by+br*0.7,br*0.85,br*0.4,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(bx,by,br,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='#d33';ctx.lineWidth=1.1;ctx.beginPath();ctx.arc(bx-br*0.3,by,br*0.7,-0.7,0.7);ctx.stroke();
}

function drawReveal(){
  if(!(phase==='watch'&&clock>=revealT&&!decided)&&!(phase==='result'))return;
  if(phase==='result'&&pt>900)return;
  ctx.textAlign='center';ctx.font='bold 22px sans-serif';
  if(truth==='strike'){ctx.fillStyle='#ffe08a';ctx.fillText('アウトコースいっぱい——ゾーンをかすめた',450,52);}
  else{ctx.fillStyle='#9fd0ff';ctx.fillText('ボール半個分、外へ外れた',450,52);}
  // replay inset: ball vs the outside edge (vertical line). left = in-zone (strike), right = outside (ball)
  const ix=636,iy=76,iw=240,ih=176;
  roundRect(ix,iy,iw,ih,10);ctx.fillStyle='rgba(6,14,24,.94)';ctx.fill();ctx.strokeStyle='rgba(255,255,255,.4)';ctx.lineWidth=2;ctx.stroke();
  ctx.save();ctx.beginPath();roundRect(ix,iy,iw,ih,10);ctx.clip();
  const edgeX=ix+iw*0.5, sc=3.0;
  ctx.fillStyle='rgba(70,150,90,.18)';ctx.fillRect(ix,iy,edgeX-ix,ih);      // left = in zone (strike)
  ctx.fillStyle='rgba(200,90,90,.16)';ctx.fillRect(edgeX,iy,ix+iw-edgeX,ih); // right = outside (ball)
  ctx.fillStyle='#ffd23a';ctx.fillRect(edgeX-2,iy+16,5,ih-32);              // the zone edge line
  ctx.strokeStyle='rgba(255,255,255,.25)';ctx.lineWidth=1;ctx.strokeRect(ix+18,iy+16,edgeX-ix-18,ih-32); // zone box hint
  const lim=iw*0.5-16-6;
  const off=clamp((fx-EDGEX)*sc,-lim,lim);
  const mbx=edgeX+off, mby=iy+ih*0.5;
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(mbx,mby,13,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='#d33';ctx.lineWidth=2;ctx.beginPath();ctx.arc(mbx-4,mby,9,-0.7,0.7);ctx.stroke();
  ctx.restore();
  ctx.fillStyle='#cfe';ctx.font='12px sans-serif';ctx.fillText('リプレー検証',ix+iw/2,iy-8);
  ctx.fillStyle='rgba(150,220,170,.95)';ctx.font='10px sans-serif';ctx.textAlign='left';ctx.fillText('左＝ゾーン内（ストライク）',ix+8,iy+14);
  ctx.textAlign='right';ctx.fillStyle='rgba(230,150,150,.95)';ctx.fillText('右＝外れ（ボール）',ix+iw-8,iy+ih-8);
}

function drawButtons(){
  if(state!=='play')return;
  const active=(phase==='watch'&&!decided&&clock>=revealT);
  ctx.globalAlpha=active?1:0.5;
  roundRect(70,520,320,64,12);ctx.fillStyle=(called==='strike')?'#2f9b5a':'rgba(40,130,80,.72)';ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,.5)';ctx.lineWidth=2;ctx.stroke();
  roundRect(510,520,320,64,12);ctx.fillStyle=(called==='ball')?'#c85a5a':'rgba(150,70,70,.72)';ctx.fill();ctx.stroke();
  ctx.globalAlpha=1;
  ctx.textAlign='center';
  ctx.fillStyle='#c9ffd8';ctx.font='bold 24px sans-serif';ctx.fillText('ストライク',230,550);
  ctx.font='12px sans-serif';ctx.fillStyle='#a0e0b8';ctx.fillText('ゾーンをかすめた　← / A',230,572);
  ctx.fillStyle='#ffd0d0';ctx.font='bold 24px sans-serif';ctx.fillText('ボール',670,550);
  ctx.font='12px sans-serif';ctx.fillStyle='#e0a8a8';ctx.fillText('外れていた　→ / D',670,572);
}

function drawHUD(){
  ctx.textAlign='left';ctx.textBaseline='alphabetic';
  ctx.font='bold 20px sans-serif';ctx.fillStyle='#fff';
  ctx.fillText('正審 '+outs+' / '+TARGET,20,32);
  ctx.font='14px sans-serif';ctx.fillStyle='#ffb14a';ctx.fillText('誤審 '+fails+' / 3',20,54);
  ctx.textAlign='right';
  ctx.font='bold 20px sans-serif';ctx.fillStyle='#ffe08a';ctx.fillText('SCORE '+score,W-20,32);
  ctx.font='13px sans-serif';ctx.fillStyle='#bfe';ctx.fillText('BEST '+Math.max(best,score)+'   Lv.'+lvl,W-20,52);
  if(combo>1){ctx.textAlign='center';ctx.font='bold 20px sans-serif';ctx.fillStyle='#5affa0';ctx.fillText(combo+' 連続好ジャッジ!',450,150);}
  if(phase==='watch'&&!decided&&clock<revealT){ctx.textAlign='center';ctx.font='bold 15px sans-serif';ctx.fillStyle='#ffe08a';ctx.fillText('際どいコース——ゾーンをかすめたか、外れたか見極めろ',450,178);}
}

function drawMsg(){
  if(msgT<=0)return;
  ctx.save();ctx.globalAlpha=clamp(msgT*1.4,0,1);
  ctx.textAlign='center';ctx.font='bold 22px sans-serif';
  ctx.fillStyle='rgba(0,0,0,.6)';roundRect(450-320,432,640,42,10);ctx.fill();
  ctx.fillStyle=msgCol;ctx.fillText(msg,450,460);
  ctx.restore();
}

function drawTitle(){
  drawField();
  ctx.save();ctx.textAlign='center';
  ctx.fillStyle='rgba(0,0,0,.72)';roundRect(96,92,708,416,16);ctx.fill();
  ctx.fillStyle='#fff';ctx.font='bold 30px sans-serif';ctx.fillText('ストライク、ボール！',450,150);
  ctx.font='18px sans-serif';ctx.fillStyle='#9fe0bf';ctx.fillText('Strike or Ball?',450,180);
  ctx.font='16px sans-serif';ctx.fillStyle='#e6fcef';
  const lines=[
    'あなたは球審。際どいコーナーの一球を裁け！',
    '投球がストライクゾーンをかすめた＝ストライク、',
    'ボール半個分でも外れた＝ボール。',
    'リプレー検証で、ボールがゾーンの端の内か外かを見極めて判定。',
    '早すぎるコール・判定遅れ・誤審は失点。3誤審で降格。',
    '左半分/← = ストライク、右半分/→ = ボール。',
  ];
  for(let i=0;i<lines.length;i++)ctx.fillText(lines[i],450,222+i*30);
  ctx.fillStyle='#ffe08a';ctx.font='bold 22px sans-serif';
  ctx.fillText('タップ / キーでスタート',450,482);
  ctx.restore();
}

function drawOver(){
  drawField();
  ctx.save();ctx.textAlign='center';
  ctx.fillStyle='rgba(0,0,0,.7)';roundRect(190,150,520,300,16);ctx.fill();
  const w2=outs>=TARGET;
  ctx.fillStyle=w2?'#5affa0':'#ff8a5a';ctx.font='bold 34px sans-serif';
  ctx.fillText(w2?'名球審！':'誤審で降格…',450,222);
  ctx.fillStyle='#fff';ctx.font='20px sans-serif';
  ctx.fillText('正審 '+outs+' / '+TARGET,450,270);
  ctx.fillText('スコア '+score,450,304);
  ctx.fillStyle='#ffe08a';ctx.fillText('ベスト '+Math.max(best,score),450,336);
  ctx.fillStyle='#9fe0bf';ctx.font='bold 20px sans-serif';
  ctx.fillText('タップ / キー でもう一度',450,404);
  ctx.restore();
}

function render(){
  ctx.save();
  if(shakeT>0){const s=shakeT*7;ctx.translate(rnd(-s,s),rnd(-s,s));}
  if(state==='title'){drawTitle();}
  else if(state==='over'){drawOver();}
  else{
    drawField();
    drawZone();
    drawBatterCatcher();
    drawPitch();
    drawReveal();
    drawButtons();
    drawHUD();
    drawMsg();
  }
  for(const p of parts){ctx.globalAlpha=clamp(p.life,0,1);ctx.fillStyle=p.col;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();}
  ctx.globalAlpha=1;
  ctx.restore();
  if(flash>0){ctx.fillStyle='rgba(255,255,255,'+(flash*0.5)+')';ctx.fillRect(0,0,W,H);}
}

function frame(ts){let dt=ts-last;last=ts;if(dt>60)dt=60;if(dt<0)dt=0;update(dt);render();requestAnimationFrame(frame);}
requestAnimationFrame(frame);

// ---------- test hook ----------
window.__sb={
  start:startGame,
  strike:function(){makeCall('strike');},   // strike = caught the corner (in zone)
  ball:function(){makeCall('ball');},         // ball = missed outside
  get state(){return state;},
  get outs(){return outs;},
  get fails(){return fails;},
  get score(){return score;},
  get info(){return {state:state,phase:phase,clock:clock,revealT:revealT,callWin:callWin,tough:tough,decided:decided,result:result,called:called,truth:truth,outs:outs,fails:fails,lvl:lvl,isStrike:(truth==='strike'),revealed:(clock>=revealT),canAct:(state==='play'&&phase==='watch'&&!decided)};}
};
})();
</script>
</body>
