<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>オフサイドトラップ — Spring the Trap</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{width:100%;height:100%;background:#07131e;overflow:hidden;
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,system-ui,sans-serif;
    touch-action:none;user-select:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  #stage{position:relative;aspect-ratio:900/600;max-width:100%;max-height:100%;
    width:auto;height:auto;box-shadow:0 0 60px rgba(0,0,0,.6);}
  canvas{display:block;width:100%;height:100%;border-radius:6px;}
</style>
</head>
<body>
<div id="wrap"><div id="stage"><canvas id="c" width="900" height="600"></canvas></div></div>
<script>
(function(){
"use strict";
const TEST=location.hash.indexOf('test')>=0;
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
const W=900,H=600;
let dpr=Math.max(1,Math.min(2,window.devicePixelRatio||1));
function fit(){ dpr=Math.max(1,Math.min(2,window.devicePixelRatio||1)); cv.width=W*dpr; cv.height=H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0); }
fit(); window.addEventListener('resize',fit);

// ---- audio ----
let AC=null;
function ac(){ if(!AC){ try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){AC=null;} } return AC; }
function tone(f,d,type,g,f2){ const a=ac(); if(!a)return; const o=a.createOscillator(),gg=a.createGain();
  o.type=type||'sine'; o.frequency.setValueAtTime(f,a.currentTime); if(f2)o.frequency.exponentialRampToValueAtTime(f2,a.currentTime+d);
  gg.gain.setValueAtTime(0.0001,a.currentTime); gg.gain.exponentialRampToValueAtTime(g||0.2,a.currentTime+0.01);
  gg.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+d); o.connect(gg); gg.connect(a.destination); o.start(); o.stop(a.currentTime+d+0.02); }
function noise(d,g,cut){ const a=ac(); if(!a)return; const n=Math.floor(a.sampleRate*d),buf=a.createBuffer(1,n,a.sampleRate),ch=buf.getChannelData(0);
  for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(1-i/n); const src=a.createBufferSource(); src.buffer=buf;
  const f=a.createBiquadFilter(); f.type='lowpass'; f.frequency.value=cut||1200; const gg=a.createGain(); gg.gain.value=g||0.2;
  src.connect(f); f.connect(gg); gg.connect(a.destination); src.start(); }
const S={
  step(){ noise(0.06,0.22,1400); tone(300,0.08,'square',0.14,520); },
  whistle(){ tone(2100,0.14,'square',0.14); setTimeout(()=>tone(2400,0.18,'square',0.12),110); },
  offside(){ tone(2100,0.14,'square',0.14); setTimeout(()=>tone(1750,0.22,'square',0.12),130); },
  cheer(){ const a=ac(); if(!a)return; noise(0.7,0.24,1900); for(let i=0;i<5;i++)setTimeout(()=>tone(500+Math.random()*300,0.3,'sine',0.05),i*44); },
  pass(){ noise(0.05,0.24,1800); tone(360,0.08,'sine',0.14,540); },
  goal(){ noise(0.3,0.22,2600); tone(80,0.2,'sine',0.12,50); },
  tick(){ tone(1000,0.03,'square',0.07); }
};

// ---- geometry (vertical, your goal at BOTTOM; attack comes downward) ----
const GY=560, GML=356, GMR=544, PASSER={x:450,y:96};

// ---- state ----
let state='ready';   // ready, play, resolve, result, over
let stops=0, goals=0, streak=0, best=0, level=0, playN=0;
let clock=0, passT=1.5, windupStart=0.45, reactionDelay=0.34;
let feint=false, feintHold=[0,0];
let lineY0=286, lineY=286, stepped=false, stepT=-1, STEP=64, lineTarget=286;
let strikerY=270, strikerBase=270, strikerRecover=false;
let ball={x:PASSER.x,y:PASSER.y}, passAnim=null, passed=false;
let result=null;
let msg='',msgT=0;
let flash=0,flashCol='#fff',shakeT=0,shakeM=0;
let parts=[]; let crowd=[]; let t=0;
let defX=[170,350,550,730];

try{ best=parseInt(localStorage.getItem('otr_best')||'0',10)||0; }catch(e){}
for(let i=0;i<64;i++) crowd.push({x:Math.random()*W,y:6+Math.random()*40,c:['#e8544e','#f0c14b','#4a90d9','#fff','#5cc98a','#c98af0'][i%6],b:Math.random()*6.28});

function reset(){ stops=0;goals=0;streak=0;level=0;playN=0; parts=[]; nextPlay(); }
function levelUp(){ level=Math.min(9,Math.floor(stops/3)); }

function nextPlay(){
  levelUp(); playN++;
  clock=0; passed=false; passAnim=null; result=null;
  passT=1.25+Math.random()*0.7;
  reactionDelay=Math.max(0.20,0.36-level*0.016);
  lineY0=280+Math.random()*20; lineY=lineY0; lineTarget=lineY0; stepped=false; stepT=-1;
  strikerBase=lineY0-10; strikerY=strikerBase; strikerRecover=false;
  feint = level>=2 && Math.random()<Math.min(0.55,0.18+level*0.06);
  if(feint){ const f=windupStart+ (passT-windupStart)*0.4; feintHold=[f, f+0.28+Math.random()*0.15]; }
  ball={x:PASSER.x,y:PASSER.y};
  state='play';
  if(playN<=2){ msg='パサーの動き出しを読み、ギリギリでタップしてライン↑！ 早いと戻られる'; msgT=170; }
  else { msg=''; msgT=0; }
  S.whistle();
}

// windup 0..1 (visual tell); reaches 1 at passT, pausing on feint
function windup(){
  if(clock<windupStart) return 0;
  if(feint){
    const [a,bb]=feintHold;
    if(clock<a) return (clock-windupStart)/(a-windupStart)*0.55;
    if(clock<bb) return 0.55;
    return 0.55 + (clock-bb)/(passT-bb)*0.45;
  }
  return (clock-windupStart)/(passT-windupStart);
}

function stepLine(){
  if(state!=='play'||stepped) return;
  stepped=true; stepT=clock; lineTarget=lineY0-STEP; S.step();
  // striker recovers (moves up onside) if there's time before the pass
  if((passT-stepT) > reactionDelay){ strikerRecover=true; }
}

function firePass(){
  passed=true; S.pass();
  passAnim={t:0};
  // determine result
  if(!stepped){ result='goal'; }
  else if(strikerRecover){ result='goal'; }
  else { result='offside'; }
  state='resolve';
}

function onResolve(){
  if(result==='offside'){
    stops++; streak++; if(streak>best){best=streak; save();}
    msg = streak>=3? `オフサイド！ トラップ成功 ${streak}連続`:'オフサイド！ 罠にハメた！';
    S.offside(); setTimeout(S.cheer,90); flash=0.4; flashCol='#eafff0'; shakeT=12; shakeM=4;
    burst(strikerX(),strikerY,'#ffe14d',20);
  } else {
    goals++; streak=0; msg = stepped? '戻られた！ 裏を取られ失点':'ラインを上げ損ね、独走で失点';
    S.goal(); flash=0.3; flashCol='#ff9060'; shakeT=13; shakeM=5; burst(450,GY,'#ff8f60',16);
  }
  state='result'; msgT=140;
  if(goals>=3){ setTimeout(()=>{ state='over'; msg='3失点… ゲームセット'; msgT=99999; }, 950); }
  else setTimeout(()=>{ if(state==='result') nextPlay(); }, 1100);
}
function save(){ try{localStorage.setItem('otr_best',''+best);}catch(e){} }
function strikerX(){ return 450; }
function burst(x,y,col,n){ for(let i=0;i<n;i++){ const a=Math.random()*6.28,sp=1+Math.random()*5;
  parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-2,life:1,col,r:2+Math.random()*3}); } }

// ---- input ----
function press(){
  const a=ac(); if(a&&a.state==='suspended')a.resume();
  if(state==='ready'||state==='over'){ reset(); return; }
  if(state==='play'){ stepLine(); }
}
cv.addEventListener('pointerdown',e=>{ e.preventDefault(); press(); });
window.addEventListener('keydown',e=>{ if(e.code==='Space'||e.code==='Enter'){ e.preventDefault(); press(); } });

// ---- update ----
let last=0;
function update(dt){
  t+=dt; if(msgT>0)msgT--; if(flash>0)flash=Math.max(0,flash-dt*2); if(shakeT>0)shakeT--;
  // line eases toward target
  lineY+=(lineTarget-lineY)*Math.min(1,dt*10);
  if(state==='play'){
    clock+=dt;
    // striker recovery motion (moves up to just onside of the line)
    if(strikerRecover){ const tgt=lineY-10; strikerY+=(tgt-strikerY)*Math.min(1,dt*7); }
    if(clock>passT*0.7 && ((clock*16|0)!==((clock-dt)*16|0))) S.tick();
    if(clock>=passT && !passed){ firePass(); }
  }
  else if(state==='resolve' && passAnim){
    passAnim.t+=dt;
    if(strikerRecover){ const tgt=lineY-10; strikerY+=(tgt-strikerY)*Math.min(1,dt*7); }
    // ball travels from passer into space behind the line (toward goal)
    const p=Math.min(1,passAnim.t/0.5);
    const ty = result==='goal'? GY-30 : lineY+40;
    ball.x=PASSER.x; ball.y=PASSER.y+(ty-PASSER.y)*p;
    // striker runs onto it if goal
    if(result==='goal'){ strikerY += 240*dt; }
    if(passAnim.t>=0.55){ onResolve(); passAnim=null; }
  }
  for(let i=parts.length-1;i>=0;i--){ const q=parts[i]; q.x+=q.vx;q.y+=q.vy;q.vy+=0.16;q.life-=dt*1.1; if(q.life<=0)parts.splice(i,1); }
}

// ---- draw ----
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function figure(x,y,col,scale){ scale=scale||1; ctx.save(); ctx.translate(x,y); ctx.scale(scale,scale);
  ctx.fillStyle='rgba(0,0,0,.22)'; ctx.beginPath(); ctx.ellipse(0,16,13,5,0,0,6.28); ctx.fill();
  ctx.strokeStyle='#20304a'; ctx.lineWidth=6; ctx.lineCap='round'; const sw=Math.sin(t*16+x)*4;
  ctx.beginPath(); ctx.moveTo(-2,-4); ctx.lineTo(-5+sw,16); ctx.stroke(); ctx.beginPath(); ctx.moveTo(2,-4); ctx.lineTo(5-sw,16); ctx.stroke();
  ctx.fillStyle=col; rr(-12,-30,24,26,7); ctx.fill(); ctx.fillStyle='#f0c39a'; ctx.beginPath(); ctx.arc(0,-36,7,0,6.28); ctx.fill(); ctx.restore(); }

function drawField(){
  const g=ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,'#20844a'); g.addColorStop(1,'#166237');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  for(let i=0;i<9;i++){ if(i%2){ ctx.fillStyle='rgba(255,255,255,.03)'; ctx.fillRect(0,i*H/9,W,H/9); } }
  ctx.fillStyle='#0c1c28'; ctx.fillRect(0,0,W,38);
  for(const c of crowd){ const yy=c.y+Math.sin(t*3+c.b)*1.1; ctx.fillStyle=c.c; ctx.globalAlpha=.7; ctx.fillRect(c.x,yy,5,5); }
  ctx.globalAlpha=1;
  // your goal at bottom + box
  ctx.strokeStyle='rgba(255,255,255,.45)'; ctx.lineWidth=3; ctx.strokeRect(250,GY-150,400,150);
  ctx.strokeStyle='#f4f8ff'; ctx.lineWidth=6; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(GML,GY); ctx.lineTo(GML,GY+28); ctx.lineTo(GMR,GY+28); ctx.lineTo(GMR,GY); ctx.stroke();
}

function drawLine(){
  // offside line
  const win = state==='play' && stepped && !strikerRecover;
  ctx.strokeStyle= win?'rgba(92,201,138,.9)':'rgba(255,235,120,.7)'; ctx.lineWidth=2.5; ctx.setLineDash([12,8]);
  ctx.beginPath(); ctx.moveTo(0,lineY); ctx.lineTo(W,lineY); ctx.stroke(); ctx.setLineDash([]);
  ctx.fillStyle='rgba(255,255,255,.4)'; ctx.font='11px sans-serif'; ctx.textAlign='left'; ctx.fillText('最終ライン',12,lineY-6);
  for(const dx of defX) figure(dx,lineY,'#4a90d9');
}

function drawStriker(){
  if(state==='ready') return;
  const off = strikerY>lineY;
  figure(strikerX(),strikerY,'#e8544e');
  if(state==='play'||state==='resolve'){
    ctx.fillStyle= off?'rgba(255,90,74,.95)':'rgba(92,201,138,.9)'; ctx.font='bold 12px sans-serif'; ctx.textAlign='center';
    ctx.fillText(off?'OFFSIDE':'ONSIDE', strikerX(), strikerY-40);
  }
}

function drawPasser(){
  const w=windup();
  ctx.save(); ctx.translate(PASSER.x,PASSER.y);
  ctx.fillStyle='rgba(0,0,0,.22)'; ctx.beginPath(); ctx.ellipse(0,16,13,5,0,0,6.28); ctx.fill();
  ctx.fillStyle='#2b2f38'; rr(-12,-30,24,26,7); ctx.fill(); ctx.fillStyle='#f0c39a'; ctx.beginPath(); ctx.arc(0,-36,7,0,6.28); ctx.fill();
  // kicking leg draws back with windup
  ctx.strokeStyle='#2b2f38'; ctx.lineWidth=7; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(0,-4); ctx.lineTo(-6-w*16,16-w*8); ctx.stroke();
  ctx.restore();
  if(state==='play'||state==='resolve'){ ball.x=PASSER.x+14; if(!passed)ball.y=PASSER.y+2; }
  // windup meter
  if(state==='play'){
    const bw=200,bx=(W-bw)/2,by=150; ctx.fillStyle='rgba(6,18,28,.6)'; rr(bx,by,bw,12,6); ctx.fill();
    ctx.fillStyle= w>0.8?'#ff5a4a':'#ffd23e'; rr(bx,by,bw*Math.min(1,w),12,6); ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.6)'; ctx.font='12px sans-serif'; ctx.textAlign='center'; ctx.fillText('パサーの構え（満タン直前でライン↑）',W/2,by-6);
  }
  // ball
  if(!passed){ ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(PASSER.x+14,PASSER.y+2,7,0,6.28); ctx.fill(); }
}

function drawBall(){
  if((state==='resolve') && passAnim){ ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(ball.x,ball.y,8,0,6.28); ctx.fill();
    ctx.fillStyle='#1a1a1a'; for(let i=0;i<5;i++){ const a=i/5*6.28+t*3; ctx.beginPath(); ctx.arc(ball.x+Math.cos(a)*4,ball.y+Math.sin(a)*4,1.5,0,6.28); ctx.fill(); } }
}

function drawHUD(){
  ctx.textAlign='left'; hud(14,10,'阻止 STOPS',stops,'#5cc98a');
  ctx.textAlign='center'; hudC(W/2,10,'連続 STREAK',streak,'#7fd0ff');
  ctx.textAlign='right'; hudR(W-14,10,'失点 GOALS',goals+' /3','#ff7d6b');
  ctx.fillStyle='rgba(255,255,255,.5)'; ctx.font='12px sans-serif'; ctx.textAlign='left'; ctx.fillText('自己ベスト連続 '+best, 16, 78);
}
function hud(x,y,l,v,c){ ctx.fillStyle='rgba(6,18,28,.72)'; rr(x,y,118,48,9); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.6)'; ctx.font='11px sans-serif'; ctx.textAlign='left'; ctx.fillText(l,x+10,y+17);
  ctx.fillStyle=c; ctx.font='bold 22px sans-serif'; ctx.fillText(v,x+10,y+41); }
function hudC(x,y,l,v,c){ const w=118; ctx.fillStyle='rgba(6,18,28,.72)'; rr(x-w/2,y,w,48,9); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.6)'; ctx.font='11px sans-serif'; ctx.textAlign='center'; ctx.fillText(l,x,y+17);
  ctx.fillStyle=c; ctx.font='bold 22px sans-serif'; ctx.fillText(v,x,y+41); }
function hudR(x,y,l,v,c){ const w=118; ctx.fillStyle='rgba(6,18,28,.72)'; rr(x-w,y,w,48,9); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.6)'; ctx.font='11px sans-serif'; ctx.textAlign='right'; ctx.fillText(l,x-10,y+17);
  ctx.fillStyle=c; ctx.font='bold 22px sans-serif'; ctx.fillText(v,x-10,y+41); }

function drawMsg(){ if(msgT>0&&msg){ const my=560; ctx.textAlign='center'; ctx.font='bold 19px sans-serif';
  const tw=ctx.measureText(msg).width; ctx.fillStyle='rgba(4,10,18,.66)'; rr(W/2-tw/2-14,my-24,tw+30,33,10); ctx.fill();
  ctx.fillStyle='#fff'; ctx.fillText(msg,W/2,my); } }

function drawOverlay(){
  ctx.fillStyle='rgba(4,10,18,.76)'; ctx.fillRect(0,0,W,H); ctx.textAlign='center';
  ctx.fillStyle='rgba(255,255,255,.55)'; ctx.font='14px sans-serif'; ctx.fillText('SOCCER · DEFENDING',W/2,120);
  ctx.fillStyle='#fff'; ctx.font='bold 42px sans-serif'; ctx.fillText('オフサイドトラップ',W/2,180);
  ctx.fillStyle='#5cc98a'; ctx.font='bold 22px sans-serif'; ctx.fillText('Spring the Trap',W/2,214);
  ctx.fillStyle='rgba(255,255,255,.82)'; ctx.font='16px sans-serif';
  const lines=['最終ラインを操り、相手をオフサイドの罠にかけろ！','パサーの"構え"（メーター）が満タンになる直前にタップ。','ラインが一気に上がり、FWを置き去りにできればオフサイド。',
    '早すぎると戻られてオンサイド、遅い/無操作は裏を取られ失点。','フェイント（構えの止め）に釣られるな。3失点で終了。'];
  lines.forEach((l,i)=>ctx.fillText(l,W/2,252+i*24));
  const bw=220,bh=52,bx=(W-bw)/2,by=452; ctx.fillStyle='#e8544e'; rr(bx,by,bw,bh,12); ctx.fill();
  ctx.fillStyle='#fff'; ctx.font='bold 24px sans-serif'; ctx.fillText('キックオフ',W/2,by+34);
  ctx.fillStyle='rgba(255,255,255,.5)'; ctx.font='13px sans-serif'; ctx.fillText('タップ / Space',W/2,by+bh+22);
}
function drawOver(){
  ctx.fillStyle='rgba(4,10,18,.8)'; ctx.fillRect(0,0,W,H); ctx.textAlign='center';
  ctx.fillStyle='#fff'; ctx.font='bold 46px sans-serif'; ctx.fillText('ゲームセット',W/2,224);
  ctx.fillStyle='#5cc98a'; ctx.font='bold 30px sans-serif'; ctx.fillText('オフサイド '+stops+' 回',W/2,280);
  ctx.fillStyle='#ffe14d'; ctx.font='20px sans-serif'; ctx.fillText('自己ベスト連続 '+best,W/2,316);
  const bw=220,bh=54,bx=(W-bw)/2,by=358; ctx.fillStyle='#e8544e'; rr(bx,by,bw,bh,12); ctx.fill();
  ctx.fillStyle='#fff'; ctx.font='bold 24px sans-serif'; ctx.fillText('もう一度',W/2,by+35);
  ctx.fillStyle='rgba(255,255,255,.5)'; ctx.font='13px sans-serif'; ctx.fillText('タップ / Space',W/2,by+bh+22);
}

function render(){
  ctx.save(); if(shakeT>0){ const s2=shakeM*(shakeT/13); ctx.translate((Math.random()*2-1)*s2,(Math.random()*2-1)*s2); }
  drawField(); drawLine(); drawStriker(); drawPasser(); drawBall();
  for(const q of parts){ ctx.globalAlpha=Math.max(0,q.life); ctx.fillStyle=q.col; ctx.beginPath(); ctx.arc(q.x,q.y,q.r,0,6.28); ctx.fill(); }
  ctx.globalAlpha=1;
  drawHUD(); drawMsg();
  ctx.restore();
  if(flash>0){ ctx.fillStyle=flashCol; ctx.globalAlpha=flash; ctx.fillRect(0,0,W,H); ctx.globalAlpha=1; }
  if(state==='ready') drawOverlay();
  if(state==='over') drawOver();
}
function loop(ts){ if(!last)last=ts; let dt=(ts-last)/1000; last=ts; if(dt>0.05)dt=0.05; update(dt); render(); requestAnimationFrame(loop); }
requestAnimationFrame(loop);

if(TEST){
  window.__otr={
    get state(){return state;},
    get clock(){return clock;},
    get passT(){return passT;},
    get windup(){return windup();},
    get reactionDelay(){return reactionDelay;},
    get result(){return result;},
    get count(){return {stops,goals,streak};},
    step(){ stepLine(); },
    tap(){ if(state==='ready'||state==='over')reset(); }
  };
}
})();
</script>
</body>
</html>
