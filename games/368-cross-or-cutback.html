<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>クロスか折り返しか (Cross or Cutback)</title>
<style>
  html,body{margin:0;height:100%;background:#07100a;overflow:hidden;
    font-family:-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  #stage{position:relative;width:100vw;height:100vh;max-width:calc(100vh*1.5);max-height:calc(100vw/1.5);aspect-ratio:900/600;}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;border-radius:6px;}
</style>
</head>
<body>
<div id="wrap"><div id="stage"><canvas id="cv"></canvas></div></div>
<script>
(function(){
const W=900,H=600,cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let DPR=1;
function fit(){DPR=Math.min(2,window.devicePixelRatio||1);cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
fit();addEventListener('resize',fit);

// ---------- audio ----------
let AC=null;function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function tone(f,d,type,v,sweep){const a=ac();if(!a)return;const t=a.currentTime,o=a.createOscillator(),g=a.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(sweep)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+sweep),t+d);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v||0.2,t+0.008);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+0.02);}
function noise(d,v,hp){const a=ac();if(!a)return;const t=a.currentTime,n=Math.floor(a.sampleRate*d),buf=a.createBuffer(1,n,a.sampleRate),ch=buf.getChannelData(0);
  for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource();s.buffer=buf;
  const f=a.createBiquadFilter();f.type='highpass';f.frequency.value=hp||600;const g=a.createGain();g.gain.value=v||0.2;
  s.connect(f);f.connect(g);g.connect(a.destination);s.start(t);s.stop(t+d+0.02);}
const S={
  set:()=>{tone(220,0.05,'sine',0.03);},
  pass:()=>{noise(0.05,0.13,500);tone(360,0.05,'square',0.07,120);},
  good:()=>{[680,940,1220].forEach((f,i)=>setTimeout(()=>tone(f,0.1,'triangle',0.16),i*55));},
  big:()=>{[600,800,1000,1250].forEach((f,i)=>setTimeout(()=>tone(f,0.12,'triangle',0.17),i*80));},
  bad:()=>{noise(0.18,0.22,300);tone(160,0.22,'sawtooth',0.12,-50);},
  streak:()=>{[700,930,1170,1400].forEach((f,i)=>setTimeout(()=>tone(f,0.1,'triangle',0.16),i*60));},
  over:()=>{[440,330,247,175].forEach((f,i)=>setTimeout(()=>tone(f,0.3,'triangle',0.2),i*160));}
};

// ---------- geometry ----------
const GOAL={x:150,y:150}, GW=150, GH=52;           // goal mouth (upper-left), opens rightward
const WING={x:760,y:474};                           // you, at the right byline with the ball
const NEAR={x:300,y:210};                           // near-post runner (target of the CROSS)
const CUT={x:452,y:344};                            // trailing runner at the top of the box (target of the CUTBACK)
const DEF0={x:430,y:270};                           // covering defender's starting spot
function defPos(open){ return (open==='CROSS')? {x:398,y:322} : {x:360,y:250}; } // covers the OTHER lane

// ---------- state ----------
let state='title', phase='set', plays=0;
let score=0, combo=0, best=+(localStorage.getItem('cc_best')||0);
let outs=0, fails=0, lvl=1;   // outs = chances converted
let clock=0, revealT=520, callWin=980, open='CROSS', tough=false;
let decided=false, call=null, result=null, resultT=0, msg='', msgOk=false, anim=0;
let shake=0, flash=0, flashCol='#fff', last=performance.now();
let parts=[], pops=[];

function rnd(a,b){return a+Math.random()*(b-a);}
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function lerp(a,b,u){return a+(b-a)*u;}
function easeOut(u){return 1-Math.pow(1-u,2);}

function reset(){state='title';score=0;combo=0;outs=0;fails=0;lvl=1;plays=0;result=null;parts=[];pops=[];}

function newPlay(){
  plays++; lvl=Math.min(7,1+Math.floor(outs/4));
  revealT=clamp(560-lvl*24,360,560);
  callWin=clamp(1020-lvl*70,560,1020);
  tough=Math.random()<clamp(0.2+lvl*0.05,0.2,0.5);
  open=(Math.random()<0.5?'CROSS':'CUT');
  phase='set'; clock=0; decided=false; call=null; result=null; resultT=0; msg=''; msgOk=false; anim=0;
  S.set();
}
function start(){ if(!ac())ac(); if(AC&&AC.state==='suspended')AC.resume(); reset(); state='play'; newPlay(); }

// call 'CROSS' (whip to near post, ↑) or 'CUT' (pull it back, ↓)
function makeCall(c){
  if(state==='title'){start();return;}
  if(state==='over'){ if(resultT>0.4){reset();start();} return; }
  if(state!=='play'||phase!=='set'||decided) return;
  if(clock<revealT){ decided=true; call=c; resolve('early'); return; }
  decided=true; call=c;
  resolve(c===open?'good':'wrong');
}

function resolve(k){
  phase='result'; result=k; resultT=0; anim=0;
  if(k==='good'){
    outs++; combo++;
    let add=Math.round((tough?250:150)*(1+Math.min(9,combo-1)*0.14)); score+=add;
    S.pass(); setTimeout(S.good,150); if(tough)setTimeout(S.big,220);
    msgOk=true; flash=1;flashCol='#8affa0';shake=5; burst(GOAL.x+GW*0.5,GOAL.y+GH,'#8affa0',18,7);
    pop(W/2,250,(open==='CROSS'?'ニアへズバッ！ヘッドで合わせてゴール！ +':'カットバックがドンピシャ！流し込んでゴール！ +')+add,'#d6ffe0');
    if(combo>=2)pop(W/2,214,'コンボ x'+combo,'#ffd24d');
    if(combo>0&&combo%5===0)S.streak();
    msg=(open==='CROSS')?'DFがカットバックを警戒した——空いたニアへ速いクロス、走り込んだ味方がヘッドで叩き込んだ！':'DFがニアを切った——引いて空けたバイタルへ折り返し、走り込んだ味方が冷静に流し込んだ！';
  } else {
    fails++; combo=0; msgOk=false; flash=1;flashCol='#ff5b5b';shake=9; S.bad();
    if(k==='early') msg='仕掛けが早い…DFがまだ絞る前で両コースを見られ、読まれてブロックされた（見切り不足）';
    else if(k==='wrong'){
      if(open==='CROSS'&&call==='CUT') msg='逆を突かれた…DFはカットバックを切っていた、折り返しは足に当ててクリアされた';
      else msg='逆を突かれた…DFはニアを閉じていた、クロスはブロックされて跳ね返された';
    } else msg='遅れた…えぐり切る前にDFに寄せられ、ボールがラインを割ってゴールキック';
    pop(W/2,250,(k==='wrong')?'逆を突かれた…':(k==='early')?'読まれた…':'えぐれず…','#ffb0b0');
  }
  if(fails>=3){ state='over'; resultT=0; S.over(); if(score>best){best=score;localStorage.setItem('cc_best',best);} }
}

// ---------- input ----------
const BTN=[{k:'CROSS',x:150,label:'クロス',sub:'↑ ニアへ速く',col:'#3f99e0'},{k:'CUT',x:520,label:'カットバック',sub:'↓ 引いて折り返し',col:'#e0a24b'}];
const BW=230, BY=506, BH=62;
cv.addEventListener('pointerdown',e=>{e.preventDefault();
  if(state!=='play'||phase!=='set'){ makeCall('CROSS'); return; }
  const r=cv.getBoundingClientRect(); const x=(e.clientX-r.left)/r.width*W, y=(e.clientY-r.top)/r.height*H;
  for(const b of BTN){ if(x>=b.x&&x<=b.x+BW&&y>=BY&&y<=BY+BH){ makeCall(b.k); return; } }
  makeCall(x<W*0.5?'CROSS':'CUT');
});
addEventListener('keydown',e=>{ if(e.repeat)return;
  if(e.code==='ArrowUp'||e.code==='KeyW'){e.preventDefault();makeCall('CROSS');}
  else if(e.code==='ArrowDown'||e.code==='KeyS'){e.preventDefault();makeCall('CUT');}
  else if(e.code==='Space'||e.code==='Enter'){e.preventDefault(); if(state!=='play')makeCall('CROSS');} });

// ---------- particles ----------
function burst(x,y,c,n,sp){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=rnd(sp*0.3,sp);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:1,c});}}
function pop(x,y,txt,c){pops.push({x,y,txt,c,life:1});}

// ---------- update ----------
function update(dt){
  shake*=Math.pow(0.86,dt/16.7); if(shake<0.3)shake=0;
  flash*=Math.pow(0.9,dt/16.7);
  for(const p of parts){p.vx*=0.96;p.vy=p.vy*0.96+0.28;p.x+=p.vx*dt/16.7;p.y+=p.vy*dt/16.7;p.life-=dt/16.7*0.026;}
  parts=parts.filter(p=>p.life>0);
  for(const p of pops){p.y-=dt/16.7*0.5;p.life-=dt/16.7*0.02;}
  pops=pops.filter(p=>p.life>0);

  if(state!=='play'){ if(state==='over')resultT+=dt/1000; return; }
  if(phase==='set'){ const wasBefore=clock<revealT; clock+=dt;
    if(wasBefore&&clock>=revealT)S.set();
    if(clock>=revealT) anim=Math.min(1,anim+dt/240);
    if(!decided && clock>revealT+callWin){ decided=true; call=null; resolve('late'); }
    return; }
  if(phase==='result'){ resultT+=dt/1000; anim=Math.min(1,anim+dt/360); if(resultT>1.55) newPlay(); return; }
}

// ---------- render ----------
function drawField(){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#0f5e34');g.addColorStop(0.55,'#0e5230');g.addColorStop(1,'#0c4429');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='rgba(255,255,255,0.03)';for(let i=0;i<6;i++){ if(i%2===0)ctx.fillRect(0,60+i*95,W,95); }
  // penalty box (opening to the right of the goal)
  ctx.strokeStyle='rgba(255,255,255,0.28)';ctx.lineWidth=3;
  ctx.strokeRect(GOAL.x-30,GOAL.y-46,300,320);
  ctx.strokeRect(GOAL.x-30,GOAL.y-6,132,160);
  ctx.fillStyle='rgba(255,255,255,0.6)';ctx.beginPath();ctx.arc(GOAL.x+230,GOAL.y+114,3,0,6.28);ctx.fill();
  // goal frame (posts vertical, opening rightward toward the pitch)
  ctx.fillStyle='rgba(0,0,0,0.28)';ctx.fillRect(GOAL.x-16,GOAL.y-4,20,GH+8);
  ctx.strokeStyle='rgba(255,255,255,0.32)';ctx.lineWidth=1;
  for(let gy=GOAL.y;gy<=GOAL.y+GH;gy+=12){ctx.beginPath();ctx.moveTo(GOAL.x-16,gy);ctx.lineTo(GOAL.x,gy);ctx.stroke();}
  ctx.strokeStyle='#f2f2f2';ctx.lineWidth=6;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(GOAL.x,GOAL.y);ctx.lineTo(GOAL.x-16,GOAL.y);ctx.lineTo(GOAL.x-16,GOAL.y+GH);ctx.lineTo(GOAL.x,GOAL.y+GH);ctx.stroke();
  ctx.lineCap='butt';
  // byline
  ctx.strokeStyle='rgba(255,255,255,0.18)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(GOAL.x-30,20);ctx.lineTo(GOAL.x-30,H-20);ctx.stroke();
}
function person(x,y,col,s,lean){s=s||1;lean=lean||0;
  ctx.save();ctx.translate(x,y);ctx.rotate(lean);
  ctx.fillStyle='rgba(0,0,0,0.22)';ctx.beginPath();ctx.ellipse(0,13*s,11*s,4*s,0,0,6.28);ctx.fill();
  ctx.fillStyle=col;ctx.beginPath();ctx.ellipse(0,-15*s,10*s,15*s,0,0,6.28);ctx.fill();
  ctx.fillStyle='#f0c9a0';ctx.beginPath();ctx.arc(0,-34*s,7.5*s,0,6.28);ctx.fill();
  ctx.restore();
}
function keeper(x,y){ ctx.save();ctx.translate(x,y);
  ctx.fillStyle='#e8c23a';ctx.beginPath();ctx.ellipse(0,-15,10,15,0,0,6.28);ctx.fill();
  ctx.fillStyle='#f0c9a0';ctx.beginPath();ctx.arc(0,-34,7,0,6.28);ctx.fill();
  ctx.strokeStyle='#e8c23a';ctx.lineWidth=5;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(-4,-22);ctx.lineTo(-16,-16);ctx.stroke();ctx.beginPath();ctx.moveTo(4,-22);ctx.lineTo(16,-16);ctx.stroke();ctx.restore(); }

function render(){
  ctx.save();
  if(shake>0)ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
  drawField();

  if(state==='play'||state==='over'){
    const revealed=(phase==='set'&&clock>=revealT)||phase==='result';
    const dp = revealed? defPos(open) : DEF0;

    // GK guards the near post
    keeper(GOAL.x+22,GOAL.y+GH+6);

    // lanes (dashed): cross lane to near runner, cutback lane to the trailing runner
    if(state==='play'&&phase==='set'){
      const crossOpen=revealed&&open==='CROSS', cutOpen=revealed&&open==='CUT';
      ctx.setLineDash([9,8]);ctx.lineWidth=3;
      ctx.strokeStyle=crossOpen?'rgba(120,205,255,0.9)':'rgba(255,255,255,0.18)';
      ctx.beginPath();ctx.moveTo(WING.x,WING.y-14);ctx.lineTo(NEAR.x,NEAR.y);ctx.stroke();
      ctx.strokeStyle=cutOpen?'rgba(255,200,110,0.9)':'rgba(255,255,255,0.18)';
      ctx.beginPath();ctx.moveTo(WING.x,WING.y-14);ctx.lineTo(CUT.x,CUT.y);ctx.stroke();
      ctx.setLineDash([]);
    }

    // teammates (runners)
    person(NEAR.x,NEAR.y,'#3aa0ff',0.95,0.12);
    person(CUT.x,CUT.y,'#3aa0ff',0.95,-0.1);
    // covering defender (slides to cover one lane at the reveal)
    person(dp.x,dp.y,'#d0403a',0.98,revealed?0.14:0);
    if(revealed){ ctx.strokeStyle='rgba(255,90,90,0.85)';ctx.lineWidth=3;ctx.beginPath();ctx.arc(dp.x,dp.y-12,20+anim*10,0,6.28);ctx.stroke(); }

    // you (winger) at the byline
    person(WING.x,WING.y,'#2b6fd6',1.02,phase==='result'?-0.14:0);

    // ball
    let bx=WING.x, by=WING.y-14;
    if(phase==='result'){
      const u=easeOut(anim);
      const tgt=(call==='CROSS')?NEAR:(call==='CUT')?CUT:{x:GOAL.x-40,y:WING.y-14};
      if(result==='good'){
        // to the runner, then a quick finish to goal
        if(u<0.6){ const uu=u/0.6; bx=lerp(WING.x,tgt.x,uu); by=lerp(WING.y-14,tgt.y,uu); }
        else { const uu=(u-0.6)/0.4; bx=lerp(tgt.x,GOAL.x+GW*0.5,uu); by=lerp(tgt.y,GOAL.y+GH*0.5,uu); }
      } else if(result==='wrong'){ bx=lerp(WING.x,dp.x,u); by=lerp(WING.y-14,dp.y-6,u); }        // into the defender
      else if(result==='early'){ bx=lerp(WING.x,DEF0.x,u); by=lerp(WING.y-14,DEF0.y-6,u); }        // read, intercepted
      else { bx=lerp(WING.x,GOAL.x-40,u); by=lerp(WING.y-14,GOAL.y+GH+70,u); }                       // late: rolls out over byline
    }
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(bx,by,7.5,0,6.28);ctx.fill();
    ctx.strokeStyle='#333';ctx.lineWidth=1.1;ctx.beginPath();ctx.arc(bx,by,7.5,0.4,2.2);ctx.stroke();

    // reveal tell
    if(revealed){
      ctx.fillStyle=open==='CROSS'?'rgba(120,205,255,0.98)':'rgba(255,200,110,0.98)';ctx.font='bold 20px sans-serif';ctx.textAlign='center';
      ctx.fillText(open==='CROSS'?'DFがカットバックを切った！ ニアが空く':'DFがニアを切った！ 折り返しが空く', W/2, 250);
    }

    // cue banner + timer
    ctx.textAlign='center';
    if(state==='play'&&phase==='set'){
      if(clock<revealT){ ctx.fillStyle='rgba(255,220,90,0.95)';ctx.font='bold 20px sans-serif';ctx.fillText('バイラインをえぐった——DFがどちらを切るか見極めろ',W/2,44); }
      else { ctx.fillStyle='rgba(255,220,120,0.98)';ctx.font='bold 22px sans-serif';ctx.fillText(open==='CROSS'?'ニアが空いた！ クロスだ！':'折り返しが空いた！ カットバックだ！',W/2,44);
        const p=clamp((clock-revealT)/callWin,0,1),bw=250,x=W/2-bw/2,y=60;
        ctx.fillStyle='rgba(255,255,255,0.18)';ctx.fillRect(x,y,bw,7);ctx.fillStyle=p<0.7?'#8affa0':(p<1?'#ffd24d':'#ff5b5b');ctx.fillRect(x,y,bw*p,7); }
    }

    if(state==='play'){
      for(const bb of BTN){ const active=phase==='set'&&clock>=revealT;
        ctx.fillStyle=active?bb.col:'rgba(255,255,255,0.10)';rr(bb.x,BY,BW,BH,10);ctx.fill();
        ctx.fillStyle=active?'#08130c':'rgba(255,255,255,0.5)';ctx.textAlign='center';ctx.font='bold 19px sans-serif';ctx.fillText(bb.label,bb.x+BW/2,BY+26);
        ctx.font='11px sans-serif';ctx.fillText(bb.sub,bb.x+BW/2,BY+45); }
      ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='12px sans-serif';ctx.textAlign='center';ctx.fillText('タップ / ↑=ニアへクロス ・ ↓=カットバック（DFが切った逆を突く）',W/2,BY+BH+16);
    }
  }

  for(const p of parts){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,3.2,0,6.28);ctx.fill();}
  ctx.globalAlpha=1;
  for(const p of pops){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.font='bold 21px sans-serif';ctx.textAlign='center';ctx.fillText(p.txt,p.x,p.y);}
  ctx.globalAlpha=1;

  // HUD
  ctx.textAlign='left';ctx.fillStyle='#fff';ctx.font='bold 26px sans-serif';ctx.fillText('SCORE '+score,20,36);
  ctx.textAlign='right';ctx.fillStyle='rgba(255,255,255,0.9)';ctx.font='14px sans-serif';ctx.fillText('決定機 '+outs+'  Lv'+lvl,W-20,24);
  ctx.fillText('失敗',W-92,46);
  for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(W-60+i*20,41,7,0,6.28);ctx.fillStyle=i<fails?'#ff5b5b':'rgba(255,255,255,0.25)';ctx.fill();}
  if(combo>=2){ctx.textAlign='center';ctx.fillStyle='#ffd24d';ctx.font='bold 18px sans-serif';ctx.fillText('コンボ x'+combo,W/2,112);}

  if(state==='play'&&phase==='result'&&msg){ctx.textAlign='center';ctx.fillStyle=msgOk?'#9ff0b8':'#ff9a9a';ctx.font='bold 15px sans-serif';ctx.fillText(msg,W/2,300);}

  if(state==='title'){
    ctx.fillStyle='rgba(3,10,6,0.84)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='bold 40px sans-serif';ctx.fillText('クロスか折り返しか',W/2,82);
    ctx.fillStyle='#ffd23e';ctx.font='bold 22px sans-serif';ctx.fillText('Cross or Cutback',W/2,118);
    ctx.fillStyle='rgba(255,255,255,0.92)';ctx.font='16px sans-serif';
    ctx.fillText('サイドをえぐった1対1——カバーのDFが“ニア”を切るか“折り返し”を切るかを見極め、空いた逆を突く',W/2,176);
    ctx.fillStyle='rgba(255,255,255,0.66)';ctx.font='14px sans-serif';
    ctx.fillText('DFが絞った瞬間、ニアが空いたら↑/画面左「クロス」＝速いクロスでニアの味方がヘッド',W/2,214);
    ctx.fillText('折り返しが空いたら↓/画面右「カットバック」＝引いてバイタルの味方が流し込む',W/2,238);
    ctx.fillText('DFが切った側へ出す＝ブロック／絞る前に出す＝読まれる／遅れ＝えぐり切れずゴールキック',W/2,262);
    ctx.fillText('際どい判断（tough）を通すと大量加点。上級ほど絞りが速く猶予も短い。3失敗で交代',W/2,286);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で開始',W/2,354);
    ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='14px sans-serif';ctx.fillText('BEST '+best,W/2,386);
  }
  if(state==='over'){
    ctx.fillStyle='rgba(3,10,6,0.86)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#ff6b6b';ctx.font='bold 46px sans-serif';ctx.fillText('3失敗…交代',W/2,222);
    ctx.fillStyle='#fff';ctx.font='bold 40px sans-serif';ctx.fillText('SCORE '+score,W/2,290);
    ctx.fillStyle='rgba(255,255,255,0.85)';ctx.font='19px sans-serif';ctx.fillText('決定機 '+outs+'   BEST '+best,W/2,330);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で もう一度',W/2,402);
  }

  if(flash>0.02){ctx.globalAlpha=flash*0.5;ctx.fillStyle=flashCol;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}
  ctx.restore();

  ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,0.4)';ctx.font='12px sans-serif';
  ctx.fillText('クロスか折り返しか：DFが切った逆＝空いたコースへ、ニアへクロス（↑）か引いてカットバック（↓）。逆突き/遅れは失敗、3失敗で交代',W/2,H-8);
}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

function frame(ts){let dt=ts-last;last=ts;if(dt>60)dt=60;if(dt<0)dt=0;update(dt);render();requestAnimationFrame(frame);}
requestAnimationFrame(frame);

// ---------- test hook ----------
window.__cc={
  start, makeCall:(c)=>makeCall(c),
  get state(){return state;},
  get score(){return score;},
  get outs(){return outs;},
  get fails(){return fails;},
  get info(){return {state,phase,clock,revealT,callWin,open,tough,decided,call,result,outs,fails,lvl,
    want:open, revealed:(clock>=revealT),canAct:(phase==='set'&&!decided)};}
};
})();
