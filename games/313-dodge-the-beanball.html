<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>のけぞれ！ (Dodge the Beanball)</title>
<style>
  html,body{margin:0;height:100%;background:#0a0d16;overflow:hidden;
    font-family:-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  #stage{position:relative;width:100vw;height:100vh;max-width:calc(100vh*1.5);max-height:calc(100vw/1.5);aspect-ratio:900/600;}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;border-radius:6px;}
</style>
</head>
<body>
<div id="wrap"><div id="stage"><canvas id="cv"></canvas></div></div>
<script>
(function(){
const W=900,H=600,cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let DPR=1;
function fit(){DPR=Math.min(2,window.devicePixelRatio||1);cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
fit();addEventListener('resize',fit);

// ---------- audio ----------
let AC=null;function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function tone(f,d,type,v,sweep){const a=ac();if(!a)return;const t=a.currentTime,o=a.createOscillator(),g=a.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(sweep)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+sweep),t+d);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v||0.2,t+0.008);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+0.02);}
function noise(d,v,hp){const a=ac();if(!a)return;const t=a.currentTime,n=Math.floor(a.sampleRate*d),buf=a.createBuffer(1,n,a.sampleRate),ch=buf.getChannelData(0);
  for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource();s.buffer=buf;
  const f=a.createBiquadFilter();f.type='highpass';f.frequency.value=hp||600;const g=a.createGain();g.gain.value=v||0.2;
  s.connect(f);f.connect(g);g.connect(a.destination);s.start(t);s.stop(t+d+0.02);}
const S={
  pitch:()=>{tone(430,0.09,'sawtooth',0.06,260);},
  whoosh:()=>{noise(0.14,0.16,900);tone(300,0.12,'sine',0.05,-160);},
  dodge:()=>{noise(0.12,0.12,700);tone(620,0.1,'triangle',0.12,340);},
  mitt:()=>{noise(0.05,0.16,1400);tone(240,0.05,'square',0.06,-60);},
  good:()=>{[680,940,1220].forEach((f,i)=>setTimeout(()=>tone(f,0.1,'triangle',0.16),i*55));},
  big:()=>{[600,800,1000,1250].forEach((f,i)=>setTimeout(()=>tone(f,0.12,'triangle',0.17),i*80));},
  bean:()=>{noise(0.22,0.3,180);tone(120,0.28,'sawtooth',0.16,-40);},
  bad:()=>{noise(0.18,0.2,300);tone(150,0.22,'sawtooth',0.11,-50);},
  streak:()=>{[700,930,1170,1400].forEach((f,i)=>setTimeout(()=>tone(f,0.1,'triangle',0.16),i*60));},
  over:()=>{[440,330,247,175].forEach((f,i)=>setTimeout(()=>tone(f,0.3,'triangle',0.2),i*160));}
};

// ---------- geometry ----------
const MOUND={x:450,y:150};          // pitcher release
const PLATE={x:450,y:492};          // home plate
const BAT={x:392,y:454};            // batter stance center (feet)
const BODY={x:404,y:398};           // batter head/body impact point (target for a beanball)
const CORNER={x:452,y:452};         // inside-corner strike target
const DBTN={x:W/2-140,y:512,w:280,h:66};

// ---------- state ----------
let state='title', phase='wind', plays=0;   // phase: wind(pre-reveal flight) -> in the roll it's just 'pitch' ; result
let score=0, combo=0, best=+(localStorage.getItem('bean_best')||0);
let outs=0, fails=0, lvl=1;   // outs = correct plate discipline reps
let clock=0, revealT=520, holdWin=1000, kind='bean', tough=false;
let decided=false, acted=false, result=null, resultT=0, msg='', msgOk=false;
let leanU=0, hitU=0, ballX=MOUND.x, ballY=MOUND.y;
let shake=0, flash=0, flashCol='#fff', last=performance.now();
let parts=[], pops=[];

function rnd(a,b){return a+Math.random()*(b-a);}
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function lerp(a,b,u){return a+(b-a)*u;}
function easeOut(u){return 1-Math.pow(1-u,2);}
function easeIn(u){return u*u;}

function reset(){state='title';score=0;combo=0;outs=0;fails=0;lvl=1;plays=0;result=null;parts=[];pops=[];leanU=0;hitU=0;}

function newPlay(){
  plays++; lvl=Math.min(7,1+Math.floor(outs/4));
  revealT=clamp(540-lvl*24,360,540);
  holdWin=clamp(1000-lvl*66,560,1000);
  tough=Math.random()<clamp(0.18+lvl*0.05,0.18,0.5);
  if(tough)holdWin=Math.round(holdWin*0.86);
  kind=(Math.random()<0.5?'bean':'strike');
  phase='pitch'; clock=0; decided=false; acted=false; result=null; resultT=0; msg=''; msgOk=false;
  leanU=0; hitU=0; ballX=MOUND.x; ballY=MOUND.y;
  S.pitch();
}
function start(){ if(!ac())ac(); if(AC&&AC.state==='suspended')AC.resume(); reset(); state='play'; newPlay(); }

// player dodges
function act(){
  if(state==='title'){start();return;}
  if(state==='over'){ if(resultT>0.4){reset();start();} return; }
  if(state!=='play'||phase!=='pitch'||decided) return;
  if(clock<revealT){ decided=true; acted=true; resolve('early'); return; }
  decided=true; acted=true;
  resolve(kind==='bean'?'good':'flinch');
}

function resolve(k){
  phase='result'; result=k; resultT=0;
  if(k==='good'){
    outs++; combo++;
    let add=Math.round((tough?250:150)*(1+Math.min(9,combo-1)*0.14)); score+=add;
    S.dodge(); setTimeout(S.good,70); if(tough)setTimeout(S.big,140);
    msgOk=true; flash=1;flashCol='#8affa0';shake=5;
    if(kind==='bean'){ leanU=1; burst(BODY.x-20,BODY.y,'#8affa0',16,7);
      pop(BODY.x,BODY.y-70,(tough?'危険球を回避！ +':'ナイス回避！ +')+add,'#d6ffe0');
      msg='頭を狙った危険球——のけぞって回避、身を守って正解'; }
    else { hitU=0; burst(CORNER.x,CORNER.y,'#8affa0',14,6);
      pop(BODY.x,BODY.y-70,(tough?'どっしり見送り！ +':'見逃しストライク！ +')+add,'#d6ffe0');
      msg='際どいインコースのストライク——のけぞらず見送って正解'; }
    if(combo>=2)pop(W/2,150,'コンボ x'+combo,'#ffd24d');
    if(combo>0&&combo%5===0)S.streak();
  } else {
    fails++; combo=0; msgOk=false; flash=1;shake=9;
    if(k==='early'){ flashCol='#ff5b5b'; S.bad(); msg='早い…球筋を見極める前にのけぞるな（腰が浮く）'; pop(BODY.x,BODY.y-70,'早すぎ…','#ffb0b0'); }
    else if(k==='flinch'){ flashCol='#ff8b3b'; leanU=1; S.bad(); msg='腰砕け…ただのインコースのストライクにのけぞって見逃し（弱気）'; pop(BODY.x,BODY.y-70,'腰砕け…','#ffcf9a'); }
    else { flashCol='#ff2b2b'; hitU=1; S.bean(); shake=16; msg='死球…頭部への危険球をよけられず被弾（負傷）'; burst(BODY.x,BODY.y,'#ff5b5b',20,8); pop(BODY.x,BODY.y-70,'デッドボール…','#ffb0b0'); }
  }
  if(fails>=3){ state='over'; resultT=0; S.over(); if(score>best){best=score;localStorage.setItem('bean_best',best);} }
}

// ---------- input ----------
cv.addEventListener('pointerdown',e=>{e.preventDefault(); act(); });
addEventListener('keydown',e=>{ if(e.repeat)return;
  if(e.code==='Space'||e.code==='ArrowDown'||e.code==='ArrowUp'||e.code==='Enter'||e.code==='KeyD'){e.preventDefault();act();} });

// ---------- particles ----------
function burst(x,y,c,n,sp){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=rnd(sp*0.3,sp);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:1,c});}}
function pop(x,y,txt,c){pops.push({x,y,txt,c,life:1});}

// ---------- ball flight ----------
function ballPos(){
  // arrives at plate when clock == revealT+holdWin
  const arr=revealT+holdWin;
  let u=clamp(clock/arr,0,1);
  const tx=(kind==='bean')?BODY.x:CORNER.x;
  const ty=(kind==='bean')?BODY.y:CORNER.y;
  // before reveal, aim ambiguous toward plate center; after reveal, curve to true target
  const revealed=clock>=revealT;
  let aimX,aimY;
  if(!revealed){ aimX=PLATE.x-6; aimY=PLATE.y-30; }
  else { const ru=easeIn(clamp((clock-revealT)/Math.max(120,holdWin*0.5),0,1));
    aimX=lerp(PLATE.x-6,tx,ru); aimY=lerp(PLATE.y-30,ty,ru); }
  const uu=easeIn(u);
  return {x:lerp(MOUND.x,aimX,uu), y:lerp(MOUND.y,aimY,uu), u};
}

// ---------- update ----------
function update(dt){
  shake*=Math.pow(0.86,dt/16.7); if(shake<0.3)shake=0;
  flash*=Math.pow(0.9,dt/16.7);
  for(const p of parts){p.vx*=0.96;p.vy=p.vy*0.96+0.28;p.x+=p.vx*dt/16.7;p.y+=p.vy*dt/16.7;p.life-=dt/16.7*0.026;}
  parts=parts.filter(p=>p.life>0);
  for(const p of pops){p.y-=dt/16.7*0.5;p.life-=dt/16.7*0.02;}
  pops=pops.filter(p=>p.life>0);
  // ease the lean-back / hit visuals
  if(phase==='result'){ if((result==='good'&&kind==='bean')||result==='flinch') leanU=lerp(leanU,1,0.2);
    if(result==='beaned') hitU=lerp(hitU,1,0.25); }

  if(state!=='play'){ if(state==='over')resultT+=dt/1000; return; }
  if(phase==='pitch'){ clock+=dt; const bp=ballPos(); ballX=bp.x; ballY=bp.y;
    if(!decided && clock>=revealT+holdWin){ decided=true; acted=false;
      resolve(kind==='strike'?'good':'beaned'); return; }
    return; }
  if(phase==='result'){ resultT+=dt/1000; if(resultT>1.6) newPlay(); return; }
}

// ---------- render ----------
function drawField(){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#243a2a');g.addColorStop(0.42,'#2f5a3b');g.addColorStop(1,'#20472e');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  // dirt circle (batter's box area)
  ctx.fillStyle='#6a4a30';ctx.beginPath();ctx.ellipse(PLATE.x,PLATE.y+8,210,86,0,0,6.28);ctx.fill();
  ctx.fillStyle='#5c3f28';ctx.beginPath();ctx.ellipse(MOUND.x,MOUND.y+18,70,26,0,0,6.28);ctx.fill();
  // batter's boxes
  ctx.strokeStyle='rgba(255,255,255,0.5)';ctx.lineWidth=3;
  ctx.strokeRect(PLATE.x-96,PLATE.y-44,66,96); ctx.strokeRect(PLATE.x+30,PLATE.y-44,66,96);
  // home plate
  ctx.fillStyle='#f4f4f4';ctx.beginPath();
  ctx.moveTo(PLATE.x-16,PLATE.y-6);ctx.lineTo(PLATE.x+16,PLATE.y-6);ctx.lineTo(PLATE.x+16,PLATE.y+6);ctx.lineTo(PLATE.x,PLATE.y+16);ctx.lineTo(PLATE.x-16,PLATE.y+6);ctx.closePath();ctx.fill();
}
// batter: leanU=0 upright, leanU=1 leaned back (bailing/dodging)
function drawBatter(){
  const cx=BAT.x, feetY=BAT.y;
  const tilt=leanU*0.7;               // radians of backward lean
  const dx=-leanU*22;                 // shift back off the plate
  ctx.save(); ctx.translate(cx+dx,feetY); ctx.rotate(tilt);
  // legs
  ctx.strokeStyle='#20406e';ctx.lineWidth=8;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(-2,0);ctx.lineTo(-10,-2);ctx.moveTo(-2,0);ctx.lineTo(8,-2);ctx.stroke();
  // torso
  ctx.fillStyle='#2b6fd6';ctx.beginPath();ctx.ellipse(0,-40,15,26,0,0,6.28);ctx.fill();
  // arms holding bat up-and-back
  ctx.strokeStyle='#2b6fd6';ctx.lineWidth=7;
  ctx.beginPath();ctx.moveTo(4,-52);ctx.lineTo(20,-64);ctx.stroke();
  // bat
  ctx.strokeStyle='#c98b3b';ctx.lineWidth=7;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(20,-64);ctx.lineTo(44,-96);ctx.stroke();
  // helmet head
  const hu=hitU;
  ctx.fillStyle=hu>0.02?('rgba('+Math.round(240)+','+Math.round(90*(1-hu)+40)+',60,1)'):'#f0c9a0';
  ctx.beginPath();ctx.arc(0,-70,11,0,6.28);ctx.fill();
  ctx.fillStyle='#1b3f7a';ctx.beginPath();ctx.arc(0,-73,12,Math.PI*1.05,Math.PI*1.95);ctx.fill(); // helmet cap
  ctx.restore();
  // impact star on head if beaned
  if(hitU>0.4){ ctx.save();ctx.translate(BODY.x-4,BODY.y-4);ctx.fillStyle='#ffe14d';
    for(let i=0;i<7;i++){const a=i/7*6.28;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(Math.cos(a)*18,Math.sin(a)*18);ctx.lineTo(Math.cos(a+0.4)*8,Math.sin(a+0.4)*8);ctx.closePath();ctx.fill();}
    ctx.restore(); }
}
function drawPitcher(){
  const x=MOUND.x,y=MOUND.y;
  ctx.fillStyle='#c0403a';ctx.beginPath();ctx.ellipse(x,y-4,13,20,0,0,6.28);ctx.fill();
  ctx.fillStyle='#f0c9a0';ctx.beginPath();ctx.arc(x,y-28,9,0,6.28);ctx.fill();
  ctx.fillStyle='#8a2a26';ctx.beginPath();ctx.arc(x,y-31,10,Math.PI*1.05,Math.PI*1.95);ctx.fill();
}
function drawCatcher(){
  const x=PLATE.x+2,y=PLATE.y+34;
  ctx.fillStyle='#3a5a8c';ctx.beginPath();ctx.ellipse(x,y,15,16,0,0,6.28);ctx.fill();
  ctx.fillStyle='#f0c9a0';ctx.beginPath();ctx.arc(x,y-16,8,0,6.28);ctx.fill();
  ctx.fillStyle='#28406a';ctx.beginPath();ctx.arc(x,y-16,9,Math.PI,0);ctx.fill();
  // mitt
  ctx.fillStyle='#7a4a22';ctx.beginPath();ctx.arc(x-16,y-6,10,0,6.28);ctx.fill();
}

function render(){
  ctx.save();
  if(shake>0)ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
  drawField();

  if(state==='play'||state==='over'){
    const revealed=(phase==='pitch'&&clock>=revealT)||phase==='result';
    // strike zone box (inside corner reference)
    ctx.strokeStyle='rgba(255,255,255,0.35)';ctx.lineWidth=2;
    ctx.strokeRect(PLATE.x-8,PLATE.y-118,64,74);

    drawCatcher();
    drawPitcher();

    // reveal target marker
    if(revealed){
      if(kind==='bean'){
        ctx.strokeStyle='rgba(255,70,70,0.95)';ctx.lineWidth=3;ctx.setLineDash([6,5]);
        ctx.beginPath();ctx.arc(BODY.x,BODY.y,26+Math.sin(clock*0.02)*3,0,6.28);ctx.stroke();ctx.setLineDash([]);
        ctx.fillStyle='rgba(255,90,90,0.98)';ctx.font='bold 15px sans-serif';ctx.textAlign='center';ctx.fillText('危険球！ 頭を狙ってる',BODY.x,BODY.y-40);
      } else {
        ctx.fillStyle='rgba(120,220,255,0.22)';ctx.fillRect(PLATE.x-8,PLATE.y-118,64,74);
        ctx.strokeStyle='rgba(150,230,255,0.95)';ctx.lineWidth=3;ctx.strokeRect(PLATE.x-8,PLATE.y-118,64,74);
        ctx.fillStyle='rgba(160,230,255,0.98)';ctx.font='bold 15px sans-serif';ctx.textAlign='center';ctx.fillText('インコースのストライク',PLATE.x+24,PLATE.y-128);
      }
    }

    drawBatter();

    // ball
    if(phase==='pitch'||(phase==='result'&&result==='beaned')){
      ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(ballX,ballY,7.5,0,6.28);ctx.fill();
      ctx.strokeStyle='#c33';ctx.lineWidth=1.2;ctx.beginPath();ctx.arc(ballX,ballY,7.5,0.6,2.2);ctx.stroke();
      // motion trail
      ctx.globalAlpha=0.4;ctx.fillStyle='#fff';
      ctx.beginPath();ctx.arc(lerp(ballX,MOUND.x,0.10),lerp(ballY,MOUND.y,0.10),5.5,0,6.28);ctx.fill();
      ctx.globalAlpha=1;
    }

    // cue banner + timer
    ctx.textAlign='center';
    if(state==='play'&&phase==='pitch'){
      if(clock<revealT){ ctx.fillStyle='rgba(255,220,90,0.95)';ctx.font='bold 21px sans-serif';ctx.fillText('インコースへ来る…球筋を見極めろ',W/2,44); }
      else { ctx.fillStyle=kind==='bean'?'rgba(255,120,110,0.98)':'rgba(150,230,255,0.98)';ctx.font='bold 23px sans-serif';
        ctx.fillText(kind==='bean'?'よけろ！':'見送れ！（のけぞるな）',W/2,44);
        const p=clamp((clock-revealT)/holdWin,0,1),bw=250,x=W/2-bw/2,y=56;
        ctx.fillStyle='rgba(255,255,255,0.18)';ctx.fillRect(x,y,bw,7);ctx.fillStyle=p<0.7?'#8affa0':(p<1?'#ffd24d':'#ff5b5b');ctx.fillRect(x,y,bw*p,7); }
    }

    if(state==='play'){
      const active=phase==='pitch'&&clock>=revealT;
      ctx.fillStyle=active?'#e05b4b':'rgba(255,255,255,0.10)';rr(DBTN.x,DBTN.y,DBTN.w,DBTN.h,12);ctx.fill();
      ctx.fillStyle=active?'#1a0a08':'rgba(255,255,255,0.55)';ctx.textAlign='center';ctx.font='bold 22px sans-serif';ctx.fillText('のけぞる（よける）',DBTN.x+DBTN.w/2,DBTN.y+30);
      ctx.font='12px sans-serif';ctx.fillText('危険球はよける ・ ストライクは何もせず見送る',DBTN.x+DBTN.w/2,DBTN.y+50);
      ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='12px sans-serif';ctx.fillText('タップ / SPACE / ↓ ＝ のけぞる',W/2,DBTN.y+DBTN.h+16);
    }
  }

  for(const p of parts){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,3.2,0,6.28);ctx.fill();}
  ctx.globalAlpha=1;
  for(const p of pops){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.font='bold 21px sans-serif';ctx.textAlign='center';ctx.fillText(p.txt,p.x,p.y);}
  ctx.globalAlpha=1;

  // HUD
  ctx.textAlign='left';ctx.fillStyle='#fff';ctx.font='bold 26px sans-serif';ctx.fillText('SCORE '+score,20,36);
  ctx.textAlign='right';ctx.fillStyle='rgba(255,255,255,0.9)';ctx.font='14px sans-serif';ctx.fillText('好判断 '+outs+'  Lv'+lvl,W-20,24);
  ctx.fillText('被弾',W-92,46);
  for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(W-60+i*20,41,7,0,6.28);ctx.fillStyle=i<fails?'#ff5b5b':'rgba(255,255,255,0.25)';ctx.fill();}
  if(combo>=2){ctx.textAlign='center';ctx.fillStyle='#ffd24d';ctx.font='bold 18px sans-serif';ctx.fillText('コンボ x'+combo,W/2,88);}

  if(state==='play'&&phase==='result'&&msg){ctx.textAlign='center';ctx.fillStyle=msgOk?'#9ff0b8':'#ffb38a';ctx.font='bold 16px sans-serif';ctx.fillText(msg,W/2,470);}

  if(state==='title'){
    ctx.fillStyle='rgba(6,9,16,0.84)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='bold 42px sans-serif';ctx.fillText('のけぞれ！',W/2,88);
    ctx.fillStyle='#ff6b5b';ctx.font='bold 22px sans-serif';ctx.fillText('Dodge the Beanball',W/2,124);
    ctx.fillStyle='rgba(255,255,255,0.92)';ctx.font='16px sans-serif';
    ctx.fillText('打者として、インコースへ来る球を見極めろ。頭を狙う「危険球」はよけ、際どい「ストライク」は見送る',W/2,180);
    ctx.fillStyle='rgba(255,255,255,0.66)';ctx.font='14px sans-serif';
    ctx.fillText('危険球（赤い標的＝頭部へ）＝タップ/SPACE/↓ でのけぞって回避',W/2,218);
    ctx.fillText('インコースのストライク（青い枠）＝何もせずどっしり見送る（のけぞると腰砕け）',W/2,242);
    ctx.fillText('球筋が分かる前にのけぞる＝早すぎ、危険球を被弾＝負傷、際どい球ほど大量加点',W/2,266);
    ctx.fillText('上級ほど球が速く見極めの猶予が短い。3被弾（失敗）で交代',W/2,290);
    ctx.fillStyle='#ff8f7f';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で開始',W/2,358);
    ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='14px sans-serif';ctx.fillText('BEST '+best,W/2,390);
  }
  if(state==='over'){
    ctx.fillStyle='rgba(6,9,16,0.86)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#ff6b6b';ctx.font='bold 44px sans-serif';ctx.fillText('3失敗…交代',W/2,222);
    ctx.fillStyle='#fff';ctx.font='bold 40px sans-serif';ctx.fillText('SCORE '+score,W/2,290);
    ctx.fillStyle='rgba(255,255,255,0.85)';ctx.font='19px sans-serif';ctx.fillText('好判断 '+outs+'   BEST '+best,W/2,330);
    ctx.fillStyle='#ff8f7f';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で もう一度',W/2,402);
  }

  if(flash>0.02){ctx.globalAlpha=flash*0.5;ctx.fillStyle=flashCol;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}
  ctx.restore();

  ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,0.4)';ctx.font='12px sans-serif';
  ctx.fillText('のけぞれ！：頭を狙う危険球はよけ、際どいインコースのストライクは見送る。早よけ/被弾/腰砕けは失敗、3つで交代',W/2,H-8);
}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

function frame(ts){let dt=ts-last;last=ts;if(dt>60)dt=60;if(dt<0)dt=0;update(dt);render();requestAnimationFrame(frame);}
requestAnimationFrame(frame);

// ---------- test hook ----------
window.__bb={
  start, act,
  get state(){return state;},
  get score(){return score;},
  get outs(){return outs;},
  get fails(){return fails;},
  get info(){return {state,phase,clock,revealT,holdWin,arriveT:revealT+holdWin,kind,tough,decided,acted,result,outs,fails,lvl,
    revealed:(clock>=revealT), mustDodge:(kind==='bean'), canAct:(phase==='pitch'&&!decided)};}
};
})();
</script>
