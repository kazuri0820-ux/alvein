<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>封殺かタッチか (Force or Tag?)</title>
<style>
  html,body{margin:0;height:100%;background:#0a0d08;overflow:hidden;
    font-family:-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  #stage{position:relative;width:100vw;height:100vh;max-width:calc(100vh*1.5);max-height:calc(100vw/1.5);aspect-ratio:900/600;}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;border-radius:6px;}
</style>
</head>
<body>
<div id="wrap"><div id="stage"><canvas id="cv"></canvas></div></div>
<script>
(function(){
const W=900,H=600,cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let DPR=1;
function fit(){DPR=Math.min(2,window.devicePixelRatio||1);cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
fit();addEventListener('resize',fit);

// ---------- audio ----------
let AC=null;function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function tone(f,d,type,v,sweep){const a=ac();if(!a)return;const t=a.currentTime,o=a.createOscillator(),g=a.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(sweep)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+sweep),t+d);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v||0.2,t+0.008);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+0.02);}
function noise(d,v,hp){const a=ac();if(!a)return;const t=a.currentTime,n=Math.floor(a.sampleRate*d),buf=a.createBuffer(1,n,a.sampleRate),ch=buf.getChannelData(0);
  for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource();s.buffer=buf;
  const f=a.createBiquadFilter();f.type='highpass';f.frequency.value=hp||600;const g=a.createGain();g.gain.value=v||0.2;
  s.connect(f);f.connect(g);g.connect(a.destination);s.start(t);s.stop(t+d+0.02);}
const S={
  ready:()=>{tone(430,0.06,'sawtooth',0.04,120);},
  mitt:()=>{noise(0.05,0.18,1200);tone(230,0.05,'square',0.08,-60);},
  out:()=>{[640,900,1180].forEach((f,i)=>setTimeout(()=>tone(f,0.11,'triangle',0.16),i*56));},
  big:()=>{[600,800,1000,1250].forEach((f,i)=>setTimeout(()=>tone(f,0.12,'triangle',0.17),i*80));},
  safe:()=>{noise(0.18,0.2,300);tone(160,0.2,'sawtooth',0.12,-40);},
  streak:()=>{[700,930,1170,1400].forEach((f,i)=>setTimeout(()=>tone(f,0.1,'triangle',0.16),i*60));},
  over:()=>{[440,330,247,175].forEach((f,i)=>setTimeout(()=>tone(f,0.3,'triangle',0.2),i*160));}
};

// ---------- geometry ----------
const BASE={x:452,y:296};        // the base you cover
const RSTART={x:846,y:452};      // primary runner starts here (from the previous base)
const TSTART={x:900,y:540};      // trailing (forcing) runner start
const BTN=[
  {k:'force',x:150,label:'封殺 ←',sub:'ベースを踏む',col:'#5db4ff'},
  {k:'tag',  x:520,label:'タッチ →',sub:'走者にタッチ',col:'#3fc46b'}
];
const BW=230, BY=505, BH=64;

// ---------- state ----------
let state='title', phase='play', plays=0;
let score=0, combo=0, best=+(localStorage.getItem('fo_best')||0);
let outs=0, fails=0, lvl=1;   // outs = outs recorded
let clock=0, arriveT=880, w=150, kind='force', tough=false;
let decided=false, call=null, result=null, resultT=0, msg='', msgOk=false, runU=0;
let shake=0, flash=0, flashCol='#fff', last=performance.now();
let parts=[], pops=[];

function rnd(a,b){return a+Math.random()*(b-a);}
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function lerp(a,b,u){return a+(b-a)*u;}
function easeOut(u){return 1-Math.pow(1-u,2);}

function reset(){state='title';score=0;combo=0;outs=0;fails=0;lvl=1;plays=0;result=null;parts=[];pops=[];}

function newPlay(){
  plays++; lvl=Math.min(7,1+Math.floor(outs/4));
  arriveT=clamp(920-lvl*54,560,920);
  w=clamp(154-lvl*11,86,154);
  tough=Math.random()<clamp(0.2+lvl*0.05,0.2,0.5);
  if(tough)w*=0.8;
  kind=(Math.random()<0.5?'force':'tag');   // force = a trailing runner forces this out
  phase='play'; clock=0; decided=false; call=null; result=null; resultT=0; msg=''; msgOk=false; runU=0;
  S.ready();
}
function start(){ if(!ac())ac(); if(AC&&AC.state==='suspended')AC.resume(); reset(); state='play'; newPlay(); }

function correctCall(){ return kind; }

function makeCall(c){
  if(state==='title'){start();return;}
  if(state==='over'){ if(resultT>0.4){reset();start();} return; }
  if(state!=='play'||phase!=='play'||decided) return;
  decided=true; call=c;
  if(clock<arriveT-w){ resolve('early'); return; }
  if(clock<=arriveT+w){ resolve(c===correctCall()?'out':'wrong'); return; }
  resolve('late');
}

function resolve(k){
  phase='result'; result=k; resultT=0; S.mitt();
  if(k==='out'){
    outs++; combo++;
    let add=Math.round((tough?250:150)*(1+Math.min(9,combo-1)*0.14)); score+=add;
    setTimeout(S.out,60); if(tough)setTimeout(S.big,160);
    msgOk=true; flash=1;flashCol='#8affa0';shake=6; burst(BASE.x,BASE.y,'#8affa0',15,6);
    pop(W/2,240,(tough?'際どい判断でアウト！ +':'正しい方法でアウト！ +')+add,'#d6ffe0');
    if(combo>=2)pop(W/2,150,'コンボ x'+combo,'#ffd24d');
    if(combo>0&&combo%5===0)S.streak();
    msg=(kind==='force')?'後ろの走者に押し出される封殺——ベースを踏んでアウト':'フォースはかからない場面——走者にタッチしてアウト';
  } else {
    fails++; combo=0; msgOk=false; flash=1;flashCol='#ff5b5b';shake=9; S.safe();
    if(k==='early') msg='早い…走者が来る前に動いて、間に合わず生きられた';
    else if(k==='late') msg='遅い…判断が遅れて先に塁に到達され、セーフ';
    else if(kind==='tag') msg='誤り…フォースは無い場面、ベースを踏んでもアウトにならずセーフ（タッチが必要）';
    else msg='誤り…封殺の場面、走者を追ってタッチしにいく間に先に到達されてセーフ（踏めば良かった）';
    pop(W/2,240,'セーフ…','#ffb0b0');
  }
  if(fails>=3){ state='over'; resultT=0; S.over(); if(score>best){best=score;localStorage.setItem('fo_best',best);} }
}

// ---------- input ----------
cv.addEventListener('pointerdown',e=>{e.preventDefault();
  if(state!=='play'||phase!=='play'){ makeCall('force'); return; }
  const r=cv.getBoundingClientRect(); const x=(e.clientX-r.left)/r.width*W, y=(e.clientY-r.top)/r.height*H;
  for(const b of BTN){ if(x>=b.x&&x<=b.x+BW&&y>=BY&&y<=BY+BH){ makeCall(b.k); return; } }
  makeCall(x<W*0.5?'force':'tag');
});
addEventListener('keydown',e=>{ if(e.repeat)return;
  if(e.code==='ArrowLeft'||e.code==='KeyA'){e.preventDefault();makeCall('force');}
  else if(e.code==='ArrowRight'||e.code==='KeyD'){e.preventDefault();makeCall('tag');}
  else if(e.code==='Space'||e.code==='Enter'){e.preventDefault(); if(state!=='play')makeCall('force');} });

// ---------- particles ----------
function burst(x,y,c,n,sp){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=rnd(sp*0.3,sp);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:1,c});}}
function pop(x,y,txt,c){pops.push({x,y,txt,c,life:1});}

// ---------- update ----------
function update(dt){
  shake*=Math.pow(0.86,dt/16.7); if(shake<0.3)shake=0;
  flash*=Math.pow(0.9,dt/16.7);
  for(const q of parts){q.vx*=0.96;q.vy=q.vy*0.96+0.28;q.x+=q.vx*dt/16.7;q.y+=q.vy*dt/16.7;q.life-=dt/16.7*0.026;}
  parts=parts.filter(q=>q.life>0);
  for(const q of pops){q.y-=dt/16.7*0.5;q.life-=dt/16.7*0.02;}
  pops=pops.filter(q=>q.life>0);

  if(state!=='play'){ if(state==='over')resultT+=dt/1000; return; }
  if(phase==='play'){ clock+=dt; runU=easeOut(clamp(clock/arriveT,0,1));
    if(!decided && clock>arriveT+w){ decided=true; call=null; resolve('late'); }
    return; }
  if(phase==='result'){ resultT+=dt/1000; if(result!=='out') runU=Math.min(1.12,runU+dt/700);
    if(resultT>1.7) newPlay(); return; }
}

// ---------- render ----------
function drawField(){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#12703f');g.addColorStop(0.5,'#0f5e34');g.addColorStop(1,'#0c4c2b');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#6a4a30';ctx.beginPath();ctx.ellipse(BASE.x+80,BASE.y+40,360,180,0,0,6.28);ctx.fill();
  // basepath into the base
  ctx.strokeStyle='rgba(230,210,150,0.5)';ctx.lineWidth=22;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(RSTART.x,RSTART.y);ctx.lineTo(BASE.x,BASE.y);ctx.stroke();ctx.lineCap='butt';
  // base
  ctx.fillStyle='#f2f2f2';ctx.save();ctx.translate(BASE.x,BASE.y);ctx.rotate(0.785);ctx.fillRect(-15,-15,30,30);ctx.restore();
}
function person(x,y,col,s,lean){s=s||1;lean=lean||0;
  ctx.save();ctx.translate(x,y);ctx.rotate(lean);
  ctx.fillStyle=col;ctx.beginPath();ctx.ellipse(0,-14*s,9*s,15*s,0,0,6.28);ctx.fill();
  ctx.fillStyle='#f0c9a0';ctx.beginPath();ctx.arc(0,-32*s,7*s,0,6.28);ctx.fill();
  ctx.restore();
}

function render(){
  ctx.save();
  if(shake>0)ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
  drawField();

  if(state==='play'||state==='over'){
    // fielder covering the base (steps on bag for force, sweeps for tag)
    let fx=BASE.x-8, flean=0;
    if(phase==='result'&&result==='out'){ if(kind==='tag'){ fx=BASE.x+18; flean=0.4; } }
    person(fx,BASE.y-6,'#2b6fd6',0.92,flean);

    // primary runner sliding into the base
    const ru=(phase==='result'&&result!=='out')?Math.min(runU,1.08):runU;
    const rx=lerp(RSTART.x,BASE.x+6,Math.min(ru,1)), ry=lerp(RSTART.y,BASE.y+6,Math.min(ru,1));
    const sliding=ru>0.7;
    ctx.save();ctx.translate(rx,ry);if(sliding)ctx.rotate(0.6);
    ctx.fillStyle='#d0403a';ctx.beginPath();ctx.ellipse(0,sliding?0:-14,sliding?18:9,sliding?10:15,0,0,6.28);ctx.fill();
    ctx.fillStyle='#f0c9a0';ctx.beginPath();ctx.arc(sliding?-20:0,sliding?-4:-32,7,0,6.28);ctx.fill();
    ctx.restore();

    // trailing (forcing) runner — present ONLY on a force play (the visual cue)
    if(kind==='force'){
      const tu=easeOut(clamp(clock/(arriveT*1.25),0,1));
      const tx=lerp(TSTART.x,RSTART.x+10,tu), ty=lerp(TSTART.y,RSTART.y+8,tu);
      person(tx,ty,'#d0403a',0.9,0.2);
      ctx.fillStyle='rgba(255,180,120,0.9)';ctx.font='bold 12px sans-serif';ctx.textAlign='center';ctx.fillText('後ろに走者＝封殺',tx,ty-42);
    } else {
      ctx.fillStyle='rgba(150,220,255,0.85)';ctx.font='bold 12px sans-serif';ctx.textAlign='center';ctx.fillText('後ろに走者なし＝タッチ必要',RSTART.x-30,RSTART.y-46);
    }

    // cue banner + timing bar
    ctx.textAlign='center';
    if(state==='play'&&phase==='play'){
      ctx.fillStyle=kind==='force'?'rgba(120,200,255,0.98)':'rgba(90,240,130,0.98)';ctx.font='bold 21px sans-serif';
      ctx.fillText(kind==='force'?'封殺の場面！ ベースを踏め':'フォースなし！ タッチしろ',W/2,44);
      const bw=280,x=W/2-bw/2,y=58, span=arriveT+w*2.2;
      ctx.fillStyle='rgba(255,255,255,0.16)';ctx.fillRect(x,y,bw,9);
      const gx0=x+bw*clamp((arriveT-w)/span,0,1), gx1=x+bw*clamp((arriveT+w)/span,0,1);
      ctx.fillStyle='rgba(90,240,130,0.5)';ctx.fillRect(gx0,y,gx1-gx0,9);
      const px=x+bw*clamp(clock/span,0,1);
      ctx.fillStyle='#ffe14d';ctx.fillRect(px-2,y-3,4,15);
    }
    if(state==='play'){
      for(const b of BTN){ const active=phase==='play';
        ctx.fillStyle=active?b.col:'rgba(255,255,255,0.10)';rr(b.x,BY,BW,BH,10);ctx.fill();
        ctx.fillStyle=active?'#08130c':'rgba(255,255,255,0.5)';ctx.textAlign='center';ctx.font='bold 19px sans-serif';ctx.fillText(b.label,b.x+BW/2,BY+27);
        ctx.font='11px sans-serif';ctx.fillText(b.sub,b.x+BW/2,BY+47); }
      ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='12px sans-serif';ctx.textAlign='center';ctx.fillText('タップ / ←=封殺（踏む）・ →=タッチ　—走者到達の窓で',W/2,BY+BH+18);
    }
  }

  for(const q of parts){ctx.globalAlpha=Math.max(0,q.life);ctx.fillStyle=q.c;ctx.beginPath();ctx.arc(q.x,q.y,3.2,0,6.28);ctx.fill();}
  ctx.globalAlpha=1;
  for(const q of pops){ctx.globalAlpha=Math.max(0,q.life);ctx.fillStyle=q.c;ctx.font='bold 21px sans-serif';ctx.textAlign='center';ctx.fillText(q.txt,q.x,q.y);}
  ctx.globalAlpha=1;

  // HUD
  ctx.textAlign='left';ctx.fillStyle='#fff';ctx.font='bold 26px sans-serif';ctx.fillText('SCORE '+score,20,36);
  ctx.textAlign='right';ctx.fillStyle='rgba(255,255,255,0.9)';ctx.font='14px sans-serif';ctx.fillText('アウト '+outs+'  Lv'+lvl,W-20,24);
  ctx.fillText('セーフ',W-104,46);
  for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(W-60+i*20,41,7,0,6.28);ctx.fillStyle=i<fails?'#ff5b5b':'rgba(255,255,255,0.25)';ctx.fill();}
  if(combo>=2){ctx.textAlign='center';ctx.fillStyle='#ffd24d';ctx.font='bold 18px sans-serif';ctx.fillText('コンボ x'+combo,W/2,112);}

  if(state==='play'&&phase==='result'&&msg){ctx.textAlign='center';ctx.fillStyle=msgOk?'#9ff0b8':'#ff9a9a';ctx.font='bold 15px sans-serif';ctx.fillText(msg,W/2,462);}

  if(state==='title'){
    ctx.fillStyle='rgba(4,8,4,0.83)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='bold 40px sans-serif';ctx.fillText('封殺かタッチか',W/2,84);
    ctx.fillStyle='#ffd23e';ctx.font='bold 22px sans-serif';ctx.fillText('Force or Tag?',W/2,120);
    ctx.fillStyle='rgba(255,255,255,0.92)';ctx.font='16px sans-serif';
    ctx.fillText('塁を守る野手として、走者が“封殺（フォース）”か“タッチが必要”かを見極めて正しくアウトを取る',W/2,180);
    ctx.fillStyle='rgba(255,255,255,0.66)';ctx.font='14px sans-serif';
    ctx.fillText('後ろに押し出す走者がいる＝封殺＝ベースを踏む（←/画面左）／後ろに走者がいない＝タッチが必要（→/画面右）',W/2,218);
    ctx.fillText('走者が到達する“ちょうど”の緑窓で正しい方法を選べばアウト。早い/遅いはセーフ',W/2,242);
    ctx.fillText('封殺なのにタッチしに行く＝間に合わずセーフ／タッチ場面で踏むだけ＝アウトにならずセーフ',W/2,266);
    ctx.fillText('際どい判断ほど大量加点。上級ほど走者が速く窓が狭い。3セーフで交代',W/2,290);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で開始',W/2,358);
    ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='14px sans-serif';ctx.fillText('BEST '+best,W/2,390);
  }
  if(state==='over'){
    ctx.fillStyle='rgba(4,8,4,0.85)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#ff6b6b';ctx.font='bold 46px sans-serif';ctx.fillText('3セーフ…交代',W/2,222);
    ctx.fillStyle='#fff';ctx.font='bold 40px sans-serif';ctx.fillText('SCORE '+score,W/2,290);
    ctx.fillStyle='rgba(255,255,255,0.85)';ctx.font='19px sans-serif';ctx.fillText('アウト '+outs+'   BEST '+best,W/2,330);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で もう一度',W/2,402);
  }

  if(flash>0.02){ctx.globalAlpha=flash*0.5;ctx.fillStyle=flashCol;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}
  ctx.restore();

  ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,0.4)';ctx.font='12px sans-serif';
  ctx.fillText('封殺かタッチか：後ろの走者の有無で封殺（踏む）/タッチを見極め、到達の窓で正しくアウト。誤り/早遅はセーフ、3つで交代',W/2,H-8);
}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

function frame(ts){let dt=ts-last;last=ts;if(dt>60)dt=60;if(dt<0)dt=0;update(dt);render();requestAnimationFrame(frame);}
requestAnimationFrame(frame);

// ---------- test hook ----------
window.__fo={
  start, makeCall:(c)=>makeCall(c),
  get state(){return state;},
  get score(){return score;},
  get outs(){return outs;},
  get fails(){return fails;},
  get info(){return {state,phase,clock,arriveT,w,kind,tough,decided,call,result,outs,fails,lvl,
    correctCall:correctCall(),canAct:(phase==='play'&&!decided),inWin:(phase==='play'&&Math.abs(clock-arriveT)<=w)};}
};
})();
</script>
</body>
</html>
