<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ロングスロー (Long Throw-In)</title>
<style>
  html,body{margin:0;height:100%;background:#0a0d08;overflow:hidden;
    font-family:-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  #stage{position:relative;width:100vw;height:100vh;max-width:calc(100vh*1.5);max-height:calc(100vw/1.5);aspect-ratio:900/600;}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;border-radius:6px;}
</style>
</head>
<body>
<div id="wrap"><div id="stage"><canvas id="cv"></canvas></div></div>
<script>
(function(){
const W=900,H=600,cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let DPR=1;
function fit(){DPR=Math.min(2,window.devicePixelRatio||1);cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
fit();addEventListener('resize',fit);

// ---------- audio ----------
let AC=null;function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function tone(f,d,type,v,sweep){const a=ac();if(!a)return;const t=a.currentTime,o=a.createOscillator(),g=a.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(sweep)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+sweep),t+d);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v||0.2,t+0.008);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+0.02);}
function noise(d,v,hp){const a=ac();if(!a)return;const t=a.currentTime,n=Math.floor(a.sampleRate*d),buf=a.createBuffer(1,n,a.sampleRate),ch=buf.getChannelData(0);
  for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource();s.buffer=buf;
  const f=a.createBiquadFilter();f.type='highpass';f.frequency.value=hp||600;const g=a.createGain();g.gain.value=v||0.2;
  s.connect(f);f.connect(g);g.connect(a.destination);s.start(t);s.stop(t+d+0.02);}
const S={
  wind:()=>{tone(300,0.16,'sine',0.05,180);},
  hurl:()=>{noise(0.06,0.16,700);tone(360,0.06,'square',0.08,120);},
  head:()=>{noise(0.05,0.16,1000);tone(300,0.05,'square',0.07,-40);},
  goal:()=>{[620,860,1120].forEach((f,i)=>setTimeout(()=>tone(f,0.11,'triangle',0.16),i*58));},
  big:()=>{[600,800,1000,1250].forEach((f,i)=>setTimeout(()=>tone(f,0.12,'triangle',0.17),i*80));},
  clear:()=>{noise(0.14,0.16,300);tone(180,0.14,'sawtooth',0.1,-40);},
  wide:()=>{tone(300,0.3,'sine',0.12,-120);},
  streak:()=>{[700,930,1170,1400].forEach((f,i)=>setTimeout(()=>tone(f,0.1,'triangle',0.16),i*60));},
  over:()=>{[440,330,247,175].forEach((f,i)=>setTimeout(()=>tone(f,0.3,'triangle',0.2),i*160));}
};

// ---------- geometry ----------
const GOAL={x:534,y:74,w:210};
const THROW={x:78,y:372};          // thrower on the touchline
const MX=800, MTOP=120, MBOT=486, MW=60;   // vertical power meter
function my(p){return MBOT-(MBOT-MTOP)*p;}
// landing point in the box for a given power p (0..1): short(low) -> near midfield, long(high) -> past goal
function landPt(pp){ return {x:lerp(210,646,clamp(pp,0,1)), y:lerp(392,150,clamp(pp,0,1))}; }

// ---------- state ----------
let state='title', phase='wind', plays=0;
let score=0, combo=0, best=+(localStorage.getItem('ls_best')||0);
let outs=0, fails=0, lvl=1;   // outs = dangerous throws converted (headers scored)
let clock=0, riseDur=1300, p=0, bandCenter=0.58, bandHalf=0.085, tough=false;
let struck=false, pStop=0, result=null, resultT=0, msg='', msgOk=false, flyT=0;
let shake=0, flash=0, flashCol='#fff', last=performance.now();
let parts=[], pops=[];

function rnd(a,b){return a+Math.random()*(b-a);}
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function lerp(a,b,u){return a+(b-a)*u;}
function easeOut(u){return 1-Math.pow(1-u,2);}

function reset(){state='title';score=0;combo=0;outs=0;fails=0;lvl=1;plays=0;result=null;parts=[];pops=[];}

function newPlay(){
  plays++; lvl=Math.min(7,1+Math.floor(outs/4));
  riseDur=clamp(1360-lvl*84,820,1360);
  bandHalf=clamp(0.09-lvl*0.005,0.055,0.09);
  tough=Math.random()<clamp(0.2+lvl*0.05,0.2,0.5);
  if(tough)bandHalf*=0.8;
  bandCenter=rnd(0.44,0.72);   // target header zone distance varies (near vs far post)
  phase='wind'; clock=0; p=0; struck=false; pStop=0; result=null; resultT=0; msg=''; msgOk=false; flyT=0;
  S.wind();
}
function start(){ if(!ac())ac(); if(AC&&AC.state==='suspended')AC.resume(); reset(); state='play'; newPlay(); }

function release(){
  if(state==='title'){start();return;}
  if(state==='over'){ if(resultT>0.4){reset();start();} return; }
  if(state!=='play'||phase!=='wind'||struck) return;
  struck=true; pStop=p; S.hurl();
  if(Math.abs(p-bandCenter)<=bandHalf){ resolve('target'); }
  else if(p<bandCenter-bandHalf) resolve('short');
  else resolve('long');
}

function resolve(k){
  phase='result'; result=k; resultT=0; flyT=0;
  if(k==='target'){
    outs++; combo++;
    const q=1-Math.abs(pStop-bandCenter)/bandHalf; const perfect=q>=0.8;
    let add=Math.round((tough?250:150)*(1+Math.min(9,combo-1)*0.14)); score+=add;
    setTimeout(S.head,300); setTimeout(S.goal,420); if(tough||perfect)setTimeout(S.big,500);
    msgOk=true; flash=1;flashCol='#8affa0';shake=5;
    pop(W/2,250,(perfect?'ドンピシャの飛距離！ヘッドで叩き込んだ！ +':'ターゲットへ！ 合わせてゴール！ +')+add,'#d6ffe0');
    if(combo>=2)pop(W/2,150,'コンボ x'+combo,'#ffd24d');
    if(combo>0&&combo%5===0)S.streak();
    msg='ミサイルのようなロングスロー——味方の頭にドンピシャで合わせて叩き込んだ';
  } else {
    fails++; combo=0; msgOk=false; flash=1;shake=8;
    if(k==='short'){ flashCol='#ff5b5b'; S.clear(); msg='飛距離不足…手前で失速し、DFに難なく弾き返された'; pop(W/2,250,'届かず…クリア','#ffb0b0'); }
    else { flashCol='#ff8b3b'; S.wide(); msg='投げすぎ…全員の頭を越えてゴールラインを割った'; pop(W/2,250,'オーバー…','#ffcf9a'); }
  }
  if(fails>=3){ state='over'; resultT=0; S.over(); if(score>best){best=score;localStorage.setItem('ls_best',best);} }
}

// ---------- input ----------
cv.addEventListener('pointerdown',e=>{e.preventDefault();release();});
addEventListener('keydown',e=>{ if(e.repeat)return;
  if(e.code==='Space'||e.code==='Enter'||e.code==='ArrowUp'||e.code==='KeyF'||e.code==='KeyJ'){e.preventDefault();release();} });

// ---------- particles ----------
function burst(x,y,c,n,sp){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=rnd(sp*0.3,sp);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:1,c});}}
function pop(x,y,txt,c){pops.push({x,y,txt,c,life:1});}

// ---------- update ----------
function update(dt){
  shake*=Math.pow(0.86,dt/16.7); if(shake<0.3)shake=0;
  flash*=Math.pow(0.9,dt/16.7);
  for(const q of parts){q.vx*=0.96;q.vy=q.vy*0.96+0.28;q.x+=q.vx*dt/16.7;q.y+=q.vy*dt/16.7;q.life-=dt/16.7*0.026;}
  parts=parts.filter(q=>q.life>0);
  for(const q of pops){q.y-=dt/16.7*0.5;q.life-=dt/16.7*0.02;}
  pops=pops.filter(q=>q.life>0);

  if(state!=='play'){ if(state==='over')resultT+=dt/1000; return; }
  if(phase==='wind'){ clock+=dt; p=clamp(clock/riseDur,0,1);
    if(!struck && p>=1){ struck=true; pStop=1; resolve('long'); }
    return; }
  if(phase==='result'){ resultT+=dt/1000; flyT=Math.min(1,flyT+dt/560);
    if(resultT>1.6) newPlay(); return; }
}

// ---------- render ----------
function drawField(){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#12703f');g.addColorStop(0.5,'#0f5e34');g.addColorStop(1,'#0c4c2b');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.globalAlpha=0.06;for(let i=0;i<7;i++){ctx.fillStyle=i%2?'#fff':'#000';ctx.fillRect(0,60+i*78,W,78);}ctx.globalAlpha=1;
  // touchline (left)
  ctx.strokeStyle='rgba(255,255,255,0.5)';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(40,0);ctx.lineTo(40,H);ctx.stroke();
  // penalty box + goal at top
  ctx.strokeStyle='rgba(255,255,255,0.28)';ctx.lineWidth=2;ctx.strokeRect(330,74,410,150);
  const gx0=GOAL.x-GOAL.w/2,gx1=GOAL.x+GOAL.w/2;
  ctx.strokeStyle='#f4f4f4';ctx.lineWidth=6;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(gx0,GOAL.y+32);ctx.lineTo(gx0,GOAL.y);ctx.lineTo(gx1,GOAL.y);ctx.lineTo(gx1,GOAL.y+32);ctx.stroke();ctx.lineCap='butt';
  ctx.strokeStyle='rgba(255,255,255,0.15)';ctx.lineWidth=1;
  for(let x=gx0;x<=gx1;x+=14){ctx.beginPath();ctx.moveTo(x,GOAL.y);ctx.lineTo(x,GOAL.y+32);ctx.stroke();}
}
function player(x,y,col,s,lean){s=s||1;lean=lean||0;
  ctx.save();ctx.translate(x,y);ctx.rotate(lean);
  ctx.fillStyle=col;ctx.beginPath();ctx.ellipse(0,-14*s,9*s,15*s,0,0,6.28);ctx.fill();
  ctx.fillStyle='#f0c9a0';ctx.beginPath();ctx.arc(0,-32*s,7*s,0,6.28);ctx.fill();
  ctx.restore();
}
function drawMeter(){
  ctx.fillStyle='rgba(0,0,0,0.28)';rr(MX-MW/2,MTOP-12,MW,MBOT-MTOP+24,10);ctx.fill();
  // band (ideal power)
  const by0=my(bandCenter+bandHalf), by1=my(bandCenter-bandHalf);
  ctx.fillStyle='rgba(90,240,130,0.5)';ctx.fillRect(MX-MW/2,by0,MW,by1-by0);
  ctx.strokeStyle='rgba(160,255,190,0.8)';ctx.lineWidth=1;ctx.strokeRect(MX-MW/2,by0,MW,by1-by0);
  // fill up to current power
  const val=(phase==='wind')?p:pStop;
  const fy=my(val);
  ctx.fillStyle=val<bandCenter-bandHalf?'#7fd0ff':(val>bandCenter+bandHalf?'#ff9a5b':'#ffe14d');
  ctx.fillRect(MX-MW/2+4,fy,MW-8,MBOT-fy);
  // pointer
  ctx.fillStyle='#fff';ctx.beginPath();ctx.moveTo(MX-MW/2-10,fy);ctx.lineTo(MX-MW/2-2,fy-6);ctx.lineTo(MX-MW/2-2,fy+6);ctx.closePath();ctx.fill();
  ctx.fillStyle='rgba(255,255,255,0.85)';ctx.font='11px sans-serif';ctx.textAlign='center';ctx.fillText('飛距離',MX,MTOP-18);
}

function render(){
  ctx.save();
  if(shake>0)ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
  drawField();

  if(state==='play'||state==='over'){
    // target teammate + a marking defender in the box
    const tgt=landPt(bandCenter);
    const def={x:tgt.x+30,y:tgt.y-8};
    player(def.x,def.y,'#2b6fd6',0.92);
    // target marker
    ctx.strokeStyle='rgba(255,230,90,0.7)';ctx.lineWidth=2;ctx.setLineDash([5,4]);
    ctx.beginPath();ctx.arc(tgt.x,tgt.y,20,0,6.28);ctx.stroke();ctx.setLineDash([]);
    const headScore=(phase==='result'&&result==='target'&&flyT>0.7);
    player(tgt.x,tgt.y,'#d0403a',0.95,headScore?-0.5:0);

    // thrower (winds up overhead)
    const wind=(phase==='wind')?p:(phase==='result'?1:0);
    ctx.save();ctx.translate(THROW.x,THROW.y);
    ctx.fillStyle='#d0403a';ctx.beginPath();ctx.ellipse(0,-15,10,16,0,0,6.28);ctx.fill();
    ctx.fillStyle='#f0c9a0';ctx.beginPath();ctx.arc(0,-36,8,0,6.28);ctx.fill();
    ctx.strokeStyle='#d0403a';ctx.lineWidth=5;ctx.lineCap='round';
    const ay=-46-wind*14;
    ctx.beginPath();ctx.moveTo(-6,-26);ctx.lineTo(-3,ay);ctx.moveTo(6,-26);ctx.lineTo(3,ay);ctx.stroke();ctx.lineCap='butt';
    ctx.restore();

    // ball
    let bx=THROW.x, by=THROW.y-52-wind*14;
    if(phase==='result'){
      const u=easeOut(flyT); const land=landPt(pStop);
      bx=lerp(THROW.x,land.x,u); by=lerp(THROW.y-64,land.y,u)-Math.sin(u*Math.PI)*120;   // high arc
      if(result==='long'){ if(u>0.8){ bx=lerp(land.x,GOAL.x+70,(u-0.8)/0.2); by=lerp(land.y,GOAL.y+16,(u-0.8)/0.2);} }
    }
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(bx,by,7.5,0,6.28);ctx.fill();
    ctx.strokeStyle='#333';ctx.lineWidth=1.1;ctx.beginPath();ctx.arc(bx,by,7.5,0.3,2.0);ctx.stroke();
    if(phase==='result'&&result==='target'&&flyT>=1&&parts.length<2)burst(tgt.x,tgt.y,'#8affa0',14,6);

    drawMeter();

    // cue banner
    ctx.textAlign='center';
    if(state==='play'&&phase==='wind'){
      ctx.fillStyle='rgba(255,220,90,0.96)';ctx.font='bold 20px sans-serif';ctx.fillText('ロングスロー！ 飛距離を“ターゲット”に合わせて離せ',W/2,44);
      ctx.fillStyle='rgba(255,255,255,0.55)';ctx.font='12px sans-serif';ctx.fillText('タップ / SPACE ＝ 投げる（飛距離が足りないとクリア・投げすぎるとオーバー）',W/2,H-28);
    }
  }

  for(const q of parts){ctx.globalAlpha=Math.max(0,q.life);ctx.fillStyle=q.c;ctx.beginPath();ctx.arc(q.x,q.y,3.2,0,6.28);ctx.fill();}
  ctx.globalAlpha=1;
  for(const q of pops){ctx.globalAlpha=Math.max(0,q.life);ctx.fillStyle=q.c;ctx.font='bold 21px sans-serif';ctx.textAlign='center';ctx.fillText(q.txt,q.x,q.y);}
  ctx.globalAlpha=1;

  // HUD
  ctx.textAlign='left';ctx.fillStyle='#fff';ctx.font='bold 26px sans-serif';ctx.fillText('SCORE '+score,20,36);
  ctx.textAlign='right';ctx.fillStyle='rgba(255,255,255,0.9)';ctx.font='14px sans-serif';ctx.fillText('決定機 '+outs+'  Lv'+lvl,W-20,24);
  ctx.fillText('失敗',W-92,46);
  for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(W-60+i*20,41,7,0,6.28);ctx.fillStyle=i<fails?'#ff5b5b':'rgba(255,255,255,0.25)';ctx.fill();}
  if(combo>=2){ctx.textAlign='center';ctx.fillStyle='#ffd24d';ctx.font='bold 18px sans-serif';ctx.fillText('コンボ x'+combo,W/2,112);}

  if(state==='play'&&phase==='result'&&msg){ctx.textAlign='center';ctx.fillStyle=msgOk?'#9ff0b8':'#ffb38a';ctx.font='bold 16px sans-serif';ctx.fillText(msg,W/2,520);}

  if(state==='title'){
    ctx.fillStyle='rgba(4,8,4,0.83)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='bold 42px sans-serif';ctx.fillText('ロングスロー',W/2,84);
    ctx.fillStyle='#ffd23e';ctx.font='bold 22px sans-serif';ctx.fillText('Long Throw-In',W/2,120);
    ctx.fillStyle='rgba(255,255,255,0.92)';ctx.font='16px sans-serif';
    ctx.fillText('ロングスローの名手として、飛距離ゲージを“ターゲット（味方の頭）”に合わせて投げ、ヘッドで叩き込む',W/2,180);
    ctx.fillStyle='rgba(255,255,255,0.66)';ctx.font='14px sans-serif';
    ctx.fillText('投げる構えでゲージが下から上へ上昇＝飛距離。緑の帯（ターゲットの距離）でタップ/SPACE＝投げる',W/2,218);
    ctx.fillText('飛距離が足りない（帯より下）＝手前で失速してDFにクリアされる',W/2,242);
    ctx.fillText('投げすぎ（帯より上）＝全員の頭を越えてゴールラインの外へ。緑ど真ん中ほど大量加点',W/2,266);
    ctx.fillText('ターゲットの距離は毎回変わる（近い/遠い）。上級ほどゲージが速く帯が狭い。3失敗で交代',W/2,290);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で開始',W/2,358);
    ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='14px sans-serif';ctx.fillText('BEST '+best,W/2,390);
  }
  if(state==='over'){
    ctx.fillStyle='rgba(4,8,4,0.85)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#ff6b6b';ctx.font='bold 46px sans-serif';ctx.fillText('3失敗…交代',W/2,222);
    ctx.fillStyle='#fff';ctx.font='bold 40px sans-serif';ctx.fillText('SCORE '+score,W/2,290);
    ctx.fillStyle='rgba(255,255,255,0.85)';ctx.font='19px sans-serif';ctx.fillText('決定機 '+outs+'   BEST '+best,W/2,330);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で もう一度',W/2,402);
  }

  if(flash>0.02){ctx.globalAlpha=flash*0.5;ctx.fillStyle=flashCol;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}
  ctx.restore();

  ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,0.4)';ctx.font='12px sans-serif';
  ctx.fillText('ロングスロー：飛距離ゲージをターゲットの距離に合わせて投げ、ヘッドで合わせる。不足＝クリア/投げすぎ＝オーバー、3失敗で交代',W/2,H-8);
}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

function frame(ts){let dt=ts-last;last=ts;if(dt>60)dt=60;if(dt<0)dt=0;update(dt);render();requestAnimationFrame(frame);}
requestAnimationFrame(frame);

// ---------- test hook ----------
window.__ls={
  start, release,
  get state(){return state;},
  get score(){return score;},
  get outs(){return outs;},
  get fails(){return fails;},
  get info(){return {state,phase,clock,riseDur,p,bandCenter,bandHalf,bandLo:bandCenter-bandHalf,bandHi:bandCenter+bandHalf,tough,struck,pStop,result,outs,fails,lvl,
    inBand:(phase==='wind'&&Math.abs(p-bandCenter)<=bandHalf)};}
};
})();
</script>
</body>
</html>
