<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>コーナーを合わせろ (Deliver the Corner)</title>
<style>
  html,body{margin:0;padding:0;background:#08140d;overflow:hidden;font-family:'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif;-webkit-user-select:none;user-select:none;touch-action:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 30%,#17361f,#050d08 72%);}
  #stage{position:relative;width:min(100vw,calc(100vh*1.5));aspect-ratio:900/600;max-width:900px;box-shadow:0 10px 60px rgba(0,0,0,.6);border-radius:8px;overflow:hidden;}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;}
</style>
</head>
<body>
<div id="wrap"><div id="stage"><canvas id="cv"></canvas></div></div>
<script>
(function(){
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const W=900,H=600;let DPR=Math.min(2,window.devicePixelRatio||1);
function fit(){const r=cv.getBoundingClientRect();DPR=Math.min(2,window.devicePixelRatio||1);cv.width=Math.round(r.width*DPR);cv.height=Math.round(r.height*DPR);ctx.setTransform(cv.width/W,0,0,cv.height/H,0,0);}
new ResizeObserver(fit).observe(cv);fit();

// ---------- audio ----------
let AC=null;function actx(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function tone(f,d,type,v,sweep){const a=actx();if(!a)return;const o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.value=f;if(sweep)o.frequency.linearRampToValueAtTime(sweep,a.currentTime+d);g.gain.value=0.0001;g.gain.exponentialRampToValueAtTime(v||0.2,a.currentTime+0.008);g.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+d);o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+d+0.02);}
function noise(d,v,hp){const a=actx();if(!a)return;const n=a.createBufferSource(),b=a.createBuffer(1,a.sampleRate*d,a.sampleRate),dt=b.getChannelData(0);for(let i=0;i<dt.length;i++)dt[i]=Math.random()*2-1;n.buffer=b;const f=a.createBiquadFilter();f.type='highpass';f.frequency.value=hp||800;const g=a.createGain();g.gain.value=0.0001;g.gain.exponentialRampToValueAtTime(v||0.2,a.currentTime+0.01);g.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+d);n.connect(f);f.connect(g);g.connect(a.destination);n.start();n.stop(a.currentTime+d+0.02);}
const S={
  swish(){tone(700,0.07,'sine',0.05);},
  kick(){noise(0.06,0.22,900);tone(300,0.09,'square',0.14,160);},
  head(){tone(260,0.09,'square',0.16);},
  goal(){tone(520,0.1,'triangle',0.2);setTimeout(function(){tone(680,0.12,'triangle',0.2);},100);setTimeout(function(){tone(880,0.2,'triangle',0.22);},210);for(let i=0;i<5;i++)setTimeout(function(){tone(500+Math.random()*400,0.2,'triangle',0.05);},260+i*45);},
  miss(){tone(300,0.3,'sawtooth',0.16,150);setTimeout(function(){tone(200,0.36,'sawtooth',0.14,110);},150);},
  combo(n){tone(600+Math.min(n,8)*70,0.12,'triangle',0.16);},
  over(){tone(330,0.3,'sine',0.2,160);setTimeout(function(){tone(220,0.5,'sine',0.2,110);},180);},
  start(){tone(440,0.1,'triangle',0.18);setTimeout(function(){tone(660,0.16,'triangle',0.2);},110);},
};

function clamp(v,a,b){return v<a?a:v>b?b:v;}
function rnd(a,b){return a+Math.random()*(b-a);}

// ---------- state ----------
let state='title';
let outs=0,fails=0,score=0,best=0,combo=0,lvl=1;   // outs = goals
try{best=parseInt(localStorage.getItem('ck_best')||'0')||0;}catch(e){}
const TARGET=26;

let phase='wind';  // wind | aim | result
let pt=0, swp=0;
let period=1400, bandW=0.24, bandC=0.5, deadT=3000, tough=false;
let pos=0;
let decided=false, result='', stopPos=0, quality=0;
let parts=[];
let shakeT=0,flash=0;
let msg='',msgCol='#fff',msgT=0;
// target bar geometry
const BARX0=250, BARX1=760, BARY=196;
// ball / anim
let ballX=90,ballY=520,ballFly=0,headX=0;

function reset(){outs=0;fails=0;score=0;combo=0;lvl=1;parts=[];}
function newCorner(){
  lvl=Math.min(7,1+Math.floor(outs/4));
  period=clamp(1560-lvl*110,860,1560);
  tough=Math.random()<clamp(0.2+lvl*0.05,0.2,0.5);
  bandW=clamp(0.26-lvl*0.02,0.12,0.26)*(tough?0.8:1);
  bandC=rnd(0.20,0.80);
  deadT=clamp(3200-lvl*180,1900,3200);
  phase='wind';pt=0;swp=0;pos=0;decided=false;result='';stopPos=0;quality=0;ballFly=0;
}
function startGame(){reset();state='play';newCorner();S.start();}

function burst(x,y,col,n,sp){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=rnd(0.4,1)*(sp||3);parts.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:1,col:col,r:rnd(2,5)});}}

function barX(p){return BARX0+(BARX1-BARX0)*p;}

function resolve(kind){
  decided=true;result=kind;stopPos=pos;
  headX=barX(bandC);
  if(kind==='goal'){
    outs++;combo++;
    const half=bandW/2;quality=clamp(1-Math.abs(pos-bandC)/half,0,1);
    const cm=1+Math.min(combo-1,6)*0.14;
    const add=Math.round((100+quality*120)*cm)*Math.max(1,lvl);
    score+=add;lastAdd=add;
    S.kick();setTimeout(S.head,360);setTimeout(S.goal,440);
    if(combo>1)setTimeout(function(){S.combo(combo);},520);
    flash=0.3;
    msg=(quality>0.7?'ドンピシャの配球！ ヘッドでゴール！':'味方に合った！ ヘディング弾')+'  +'+add;
    msgCol='#5affa0';msgT=1;
  }else{
    combo=0;fails++;
    S.kick();setTimeout(S.miss,300);flash=0.35;shakeT=0.7;
    if(result==='timeout')msg='蹴り遅れ！ 守備が整ってしまった';
    else if(pos<bandC)msg='ニアに寄りすぎ！ GKにパンチされた';
    else msg='大きすぎ！ 誰も合わせられず枠外へ';
    msgCol='#ff6a6a';msgT=1;
  }
  phase='result';pt=0;
}
let lastAdd=0;

function kickCorner(){
  if(state!=='play'||phase!=='aim'||decided)return;
  const half=bandW/2;
  if(Math.abs(pos-bandC)<=half)resolve('goal');
  else resolve('miss');
}

// ---------- input ----------
function act(){if(!AC)actx();if(state==='title'){startGame();return;}if(state==='over'){startGame();return;}kickCorner();}
cv.addEventListener('mousedown',function(e){e.preventDefault();act();});
cv.addEventListener('touchstart',function(e){e.preventDefault();act();},{passive:false});
window.addEventListener('keydown',function(e){
  if(e.code==='Space'||e.code==='ArrowUp'||e.code==='Enter'||e.code==='KeyK'){e.preventDefault();act();}
});

// ---------- update ----------
let last=0;
function update(dt){
  if(flash>0)flash=Math.max(0,flash-dt/300);
  if(shakeT>0)shakeT=Math.max(0,shakeT-dt/320);
  if(msgT>0)msgT=Math.max(0,msgT-dt/1500);
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.x+=p.vx;p.y+=p.vy;p.vy+=0.16;p.life-=dt/640;if(p.life<=0)parts.splice(i,1);}
  if(state!=='play')return;
  pt+=dt;
  if(phase==='wind'){
    if(pt>=420){phase='aim';pt=0;swp=0;}
  }else if(phase==='aim'){
    swp+=dt;
    const ph=(swp%period)/period;
    pos=1-Math.abs(2*ph-1);
    if(Math.floor((swp)/ (period/2)) !== Math.floor((swp-dt)/(period/2)))S.swish();
    if(swp>=deadT&&!decided)resolve('timeout');
  }else if(phase==='result'){
    if(ballFly<1)ballFly=Math.min(1,ballFly+dt/380);
    if(result==='goal'&&ballFly>=1){/* header handled by anim */}
    if(pt>=1150){
      if(fails>=3){state='over';best=Math.max(best,score);try{localStorage.setItem('ck_best',String(best));}catch(e){}S.over();}
      else if(outs>=TARGET){state='over';best=Math.max(best,score);try{localStorage.setItem('ck_best',String(best));}catch(e){}S.start();}
      else newCorner();
    }
  }
}

// ---------- render ----------
function roundRect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

function drawField(){
  for(let i=0;i<8;i++){ctx.fillStyle=i%2?'#2b6b3d':'#256036';ctx.fillRect(0,i*(H/8),W,H/8);}
  // goal at top
  ctx.strokeStyle='rgba(255,255,255,.9)';ctx.lineWidth=5;
  ctx.strokeRect(350,52,200,44);
  ctx.strokeStyle='rgba(255,255,255,.18)';ctx.lineWidth=1;
  for(let gx=356;gx<550;gx+=10){ctx.beginPath();ctx.moveTo(gx,54);ctx.lineTo(gx,94);ctx.stroke();}
  // penalty area
  ctx.strokeStyle='rgba(255,255,255,.5)';ctx.lineWidth=3;
  ctx.strokeRect(230,96,440,180);
  ctx.strokeRect(360,96,180,70);
  // corner arc (bottom-left)
  ctx.beginPath();ctx.arc(80,540,16,Math.PI*1.5,Math.PI*2);ctx.stroke();
}

function drawAttackers(){
  // marked attackers scattered; the free one sits at band center on the bar
  ctx.fillStyle='rgba(60,120,224,.9)';
  const spots=[[330,150],[430,240],[560,175],[500,140]];
  for(const s of spots){ctx.beginPath();ctx.arc(s[0],s[1],9,0,Math.PI*2);ctx.fill();}
  // defenders (red)
  ctx.fillStyle='rgba(214,69,69,.85)';
  const ds=[[380,190],[470,150],[540,220],[300,210]];
  for(const s of ds){ctx.beginPath();ctx.arc(s[0],s[1],9,0,Math.PI*2);ctx.fill();}
}

function drawBar(){
  // the delivery target bar (near post .. far post)
  roundRect(BARX0-6,BARY-13,(BARX1-BARX0)+12,26,10);ctx.fillStyle='rgba(0,0,0,.42)';ctx.fill();
  // band = free teammate zone (green)
  const bx0=barX(clamp(bandC-bandW/2,0,1)), bx1=barX(clamp(bandC+bandW/2,0,1));
  const gg=ctx.createLinearGradient(bx0,0,bx1,0);gg.addColorStop(0,'rgba(90,220,150,.4)');gg.addColorStop(0.5,'rgba(60,255,150,.9)');gg.addColorStop(1,'rgba(90,220,150,.4)');
  ctx.fillStyle=gg;ctx.fillRect(bx0,BARY-11,bx1-bx0,22);
  // frame + posts labels
  roundRect(BARX0-6,BARY-13,(BARX1-BARX0)+12,26,10);ctx.strokeStyle='rgba(255,255,255,.45)';ctx.lineWidth=1.5;ctx.stroke();
  ctx.font='11px sans-serif';ctx.textAlign='left';ctx.fillStyle='#cde';ctx.fillText('ニア',BARX0-4,BARY-18);
  ctx.textAlign='right';ctx.fillText('ファー',BARX1+4,BARY-18);
  // free teammate marker above band
  ctx.fillStyle='#9fffcf';ctx.beginPath();ctx.arc(barX(bandC),BARY-30,7,0,Math.PI*2);ctx.fill();
  ctx.font='10px sans-serif';ctx.textAlign='center';ctx.fillStyle='#9fffcf';ctx.fillText('フリー',barX(bandC),BARY-40);
  // sweeping marker
  if(phase==='aim'&&!decided){
    const mx=barX(pos);
    ctx.fillStyle='#fff';ctx.fillRect(mx-2,BARY-16,4,32);
    ctx.beginPath();ctx.moveTo(mx,BARY-20);ctx.lineTo(mx-7,BARY-30);ctx.lineTo(mx+7,BARY-30);ctx.closePath();ctx.fill();
  }else if(phase==='result'){
    const mx=barX(stopPos);
    ctx.fillStyle=result==='goal'?'#5affa0':'#ff6a6a';ctx.fillRect(mx-2,BARY-16,4,32);
  }
  // deadline timer bar
  if(phase==='aim'){
    const tl=clamp((deadT-swp)/deadT,0,1);
    roundRect(BARX0,BARY+22,(BARX1-BARX0),7,3);ctx.fillStyle='rgba(0,0,0,.4)';ctx.fill();
    ctx.fillStyle=tl<0.28?'#ff6a6a':'#ffd23a';ctx.fillRect(BARX0,BARY+22,(BARX1-BARX0)*tl,7);
  }
}

function drawBall(){
  let x=90,y=540;
  if(phase==='result'){
    const u=ballFly;
    const tx=barX(stopPos),ty=BARY;
    x=90+(tx-90)*u; y=540+(ty-540)*u - Math.sin(u*Math.PI)*70;
    if(result==='goal'&&u>=1){
      // header into goal
      const v=clamp((pt-380)/300,0,1);
      x=barX(bandC)+(450-barX(bandC))*v; y=BARY+(74-BARY)*v;
      if(v>0.02&&parts.length<40&&Math.random()<0.3)burst(x,y,'#fff',1,1);
    }
  }
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(x,y,7,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#111';ctx.beginPath();ctx.arc(x,y,2.6,0,Math.PI*2);ctx.fill();
  // corner taker
  if(phase!=='result'||ballFly<0.15){ctx.fillStyle='#3f7de0';ctx.fillRect(70,522,14,26);ctx.fillStyle='#f0c9a0';ctx.beginPath();ctx.arc(77,516,7,0,Math.PI*2);ctx.fill();}
}

function drawHUD(){
  ctx.textAlign='left';ctx.textBaseline='alphabetic';
  ctx.font='bold 20px sans-serif';ctx.fillStyle='#fff';
  ctx.fillText('ゴール '+outs+' / '+TARGET,20,32);
  ctx.font='14px sans-serif';ctx.fillStyle='#ffb14a';ctx.fillText('失敗 '+fails+' / 3',20,54);
  ctx.textAlign='right';
  ctx.font='bold 20px sans-serif';ctx.fillStyle='#ffe08a';ctx.fillText('SCORE '+score,W-20,32);
  ctx.font='13px sans-serif';ctx.fillStyle='#bfe';ctx.fillText('BEST '+Math.max(best,score)+'   Lv.'+lvl,W-20,52);
  if(combo>1){ctx.textAlign='center';ctx.font='bold 20px sans-serif';ctx.fillStyle='#5affa0';ctx.fillText(combo+' 連続ゴール!',450,300);}
  if(phase==='aim'){ctx.textAlign='center';ctx.font='bold 17px sans-serif';ctx.fillStyle='#ffe08a';ctx.fillText('フリーの味方（緑）に合わせてタップ！',450,300);}
}

function drawMsg(){
  if(msgT<=0)return;
  ctx.save();ctx.globalAlpha=clamp(msgT*1.4,0,1);
  ctx.textAlign='center';ctx.font='bold 25px sans-serif';
  ctx.fillStyle='rgba(0,0,0,.55)';roundRect(450-290,330,580,44,10);ctx.fill();
  ctx.fillStyle=msgCol;ctx.fillText(msg,450,360);
  ctx.restore();
}

function drawTitle(){
  drawField();
  ctx.save();ctx.textAlign='center';
  ctx.fillStyle='rgba(0,0,0,.6)';roundRect(110,120,680,380,16);ctx.fill();
  ctx.fillStyle='#fff';ctx.font='bold 38px sans-serif';ctx.fillText('コーナーを合わせろ',450,182);
  ctx.font='18px sans-serif';ctx.fillStyle='#9fe0bf';ctx.fillText('Deliver the Corner',450,212);
  ctx.font='16px sans-serif';ctx.fillStyle='#e6fcef';
  const lines=[
    'あなたはコーナーキッカー。左右に往復する配球マーカーを、',
    'フリーの味方（緑のバンド）にピタリと合わせて蹴り込め！',
    '緑の中心＝ドンピシャの配球でヘディング弾。',
    'ニアに寄りすぎ＝GKにパンチ、大きすぎ＝枠外、蹴り遅れも失敗。',
    'レベルが上がると往復が速く、フリーの幅は狭くなる。',
    'タップ / クリック / SPACE で配球（キック）。3失敗で終了。',
  ];
  for(let i=0;i<lines.length;i++)ctx.fillText(lines[i],450,254+i*30);
  ctx.fillStyle='#ffe08a';ctx.font='bold 22px sans-serif';
  ctx.fillText('タップ / SPACE でスタート',450,472);
  ctx.restore();
}

function drawOver(){
  drawField();
  ctx.save();ctx.textAlign='center';
  ctx.fillStyle='rgba(0,0,0,.6)';roundRect(190,150,520,300,16);ctx.fill();
  const w=outs>=TARGET;
  ctx.fillStyle=w?'#5affa0':'#ff8a5a';ctx.font='bold 38px sans-serif';
  ctx.fillText(w?'キック職人！':'配球ミス続き…',450,222);
  ctx.fillStyle='#fff';ctx.font='20px sans-serif';
  ctx.fillText('ゴール '+outs+' / '+TARGET,450,270);
  ctx.fillText('スコア '+score,450,304);
  ctx.fillStyle='#ffe08a';ctx.fillText('ベスト '+Math.max(best,score),450,336);
  ctx.fillStyle='#9fe0bf';ctx.font='bold 20px sans-serif';
  ctx.fillText('タップ / SPACE でもう一度',450,404);
  ctx.restore();
}

function render(){
  ctx.save();
  if(shakeT>0){const s=shakeT*7;ctx.translate(rnd(-s,s),rnd(-s,s));}
  if(state==='title'){drawTitle();}
  else if(state==='over'){drawOver();}
  else{
    drawField();
    drawAttackers();
    drawBar();
    drawBall();
    drawHUD();
    drawMsg();
  }
  for(const p of parts){ctx.globalAlpha=clamp(p.life,0,1);ctx.fillStyle=p.col;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();}
  ctx.globalAlpha=1;
  ctx.restore();
  if(flash>0){ctx.fillStyle='rgba(255,255,255,'+(flash*0.5)+')';ctx.fillRect(0,0,W,H);}
}

function frame(ts){let dt=ts-last;last=ts;if(dt>60)dt=60;if(dt<0)dt=0;update(dt);render();requestAnimationFrame(frame);}
requestAnimationFrame(frame);

// ---------- test hook ----------
window.__ck={
  start:startGame,
  kick:kickCorner,
  get state(){return state;},
  get outs(){return outs;},
  get fails(){return fails;},
  get score(){return score;},
  get info(){return {state:state,phase:phase,swp:swp,pos:pos,bandC:bandC,bandW:bandW,period:period,deadT:deadT,timeLeft:(deadT-swp),tough:tough,decided:decided,result:result,quality:quality,outs:outs,fails:fails,lvl:lvl,inBand:(Math.abs(pos-bandC)<=bandW/2),dist:Math.abs(pos-bandC),canAct:(state==='play'&&phase==='aim'&&!decided)};}
};
})();
</script>
</body>
</html>
