<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ホームゲッツー (Home-to-First)</title>
<style>
  html,body{margin:0;height:100%;background:#0a0c12;overflow:hidden;
    font-family:-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  #stage{position:relative;width:100vw;height:100vh;max-width:calc(100vh*1.5);max-height:calc(100vw/1.5);aspect-ratio:900/600;}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;border-radius:6px;}
</style>
</head>
<body>
<div id="wrap"><div id="stage"><canvas id="cv"></canvas></div></div>
<script>
(function(){
const W=900,H=600,cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let DPR=1;
function fit(){DPR=Math.min(2,window.devicePixelRatio||1);cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
fit();addEventListener('resize',fit);

// ---------- audio ----------
let AC=null;function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function tone(f,d,type,v,sweep){const a=ac();if(!a)return;const t=a.currentTime,o=a.createOscillator(),g=a.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(sweep)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+sweep),t+d);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v||0.2,t+0.008);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+0.02);}
function noise(d,v,hp){const a=ac();if(!a)return;const t=a.currentTime,n=Math.floor(a.sampleRate*d),buf=a.createBuffer(1,n,a.sampleRate),ch=buf.getChannelData(0);
  for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource();s.buffer=buf;
  const f=a.createBiquadFilter();f.type='highpass';f.frequency.value=hp||600;const g=a.createGain();g.gain.value=v||0.2;
  s.connect(f);f.connect(g);g.connect(a.destination);s.start(t);s.stop(t+d+0.02);}
const S={
  catch:()=>{noise(0.05,0.18,900);tone(240,0.05,'square',0.07,-40);},
  fire:()=>{noise(0.05,0.14,400);tone(320,0.06,'square',0.09,140);},
  two:()=>{[560,820,1080,1360].forEach((f,i)=>setTimeout(()=>tone(f,0.12,'triangle',0.18),i*52));},
  out:()=>{[620,880,1150].forEach((f,i)=>setTimeout(()=>tone(f,0.11,'triangle',0.16),i*56));},
  bad:()=>{noise(0.2,0.24,240);tone(150,0.28,'sawtooth',0.14,-60);},
  streak:()=>{[700,930,1170,1400].forEach((f,i)=>setTimeout(()=>tone(f,0.1,'triangle',0.16),i*60));},
  over:()=>{[440,330,247,175].forEach((f,i)=>setTimeout(()=>tone(f,0.3,'triangle',0.2),i*160));}
};

// ---------- geometry ----------
const HOME={x:452,y:496}, FIRST={x:706,y:352}, THIRD={x:198,y:352}, SECOND={x:452,y:210}, MOUND={x:452,y:340};

// ---------- state ----------
let state='title', phase='catch', t=0, plays=0;
let score=0, combo=0, best=+(localStorage.getItem('h2f_best')||0);
let outs=0, fails=0, lvl=1;   // outs = double plays turned
let clock=0, catchIdeal=520, catchW=140, throwIdeal=300, throwW=130, catchGrace=90;
let acted=false, caught=false, catchAt=0, result=null, resultT=0, msg='', animU=0, quick=false;
let shake=0, flash=0, flashCol='#fff', last=performance.now();
let parts=[], pops=[];

function rnd(a,b){return a+Math.random()*(b-a);}
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function lerp(a,b,u){return a+(b-a)*u;}
function easeOut(u){return 1-Math.pow(1-u,2);}

function params(){ return {
  catchIdeal:rnd(440,640)-lvl*6,
  catchW:Math.max(90,150-lvl*8),
  throwIdeal:rnd(250,360),
  throwW:Math.max(90,150-lvl*8)
};}

function reset(){state='title';score=0;combo=0;outs=0;fails=0;lvl=1;plays=0;result=null;parts=[];pops=[];}
function newPlay(){
  plays++; lvl=Math.min(7,1+Math.floor(outs/4));
  const p=params(); catchIdeal=Math.max(300,p.catchIdeal); catchW=p.catchW; throwIdeal=p.throwIdeal; throwW=p.throwW;
  phase='catch'; clock=0; acted=false; caught=false; catchAt=0; result=null; resultT=0; msg=''; animU=0; quick=false;
}
function start(){ if(!ac())ac(); if(AC&&AC.state==='suspended')AC.resume(); reset(); state='play'; newPlay(); }

function act(){
  if(state==='title'){start();return;}
  if(state==='over'){ if(resultT>0.4){reset();start();} return; }
  if(state!=='play') return;
  if(phase==='catch'&&!caught){
    const err=clock-catchIdeal;
    if(err< -catchW){ acted=true; resolve('earlyCatch'); return; }   // reached before the ball
    if(err> catchW){ acted=true; resolve('lateCatch'); return; }     // too slow, run scores
    caught=true; catchAt=clock; S.catch(); phase='throw'; clock=0;    // clean catch -> force at home
    return;
  }
  if(phase==='throw'&&!acted){
    const err=clock-throwIdeal;
    if(err< -throwW){ acted=true; resolve('earlyThrow'); return; }    // rushed wild throw
    if(err> throwW){ acted=true; resolve('lateThrow'); return; }      // too slow, batter safe
    acted=true; quick=Math.abs(err)<=throwW*0.4; resolve('two');
    return;
  }
}

function resolve(k){
  phase='result'; result=k; resultT=0; animU=0;
  if(k==='two'){
    outs++; combo++;
    let add=Math.round((quick?240:140)*(1+Math.min(9,combo-1)*0.14)); S.fire();setTimeout(S.two,120);
    flash=1;flashCol='#8affa0';shake=9; burst(FIRST.x,FIRST.y,'#8affa0',20,8);
    pop(W/2,150,quick?'電光石火のホームゲッツー！ +'+add:'ホームゲッツー完成！ +'+add,'#d6ffe0');
    score+=add;
    if(combo>=2&&!quick)pop(W/2,112,'コンボ x'+combo,'#ffd24d');
    if(combo>0&&combo%5===0)S.streak();
    msg=quick?'本塁で封殺→一塁へ矢のような送球——鮮やかな2-3ダブルプレーでピンチを断った！':'本塁で刺して一塁へ送球——ホームゲッツーで満塁のピンチを脱出！';
  } else {
    fails++; combo=0; flash=1;flashCol='#ff5b5b';shake=8; S.bad();
    if(result==='earlyCatch') msg='捕るのが早い…ボールが来る前にミットを出して弾いた——走者生還';
    else if(result==='lateCatch') msg='捕るのが遅い…本塁がこじ開けられ走者生還を許した';
    else if(result==='earlyThrow') msg='送球が早い…力んで一塁へ悪送球、打者走者セーフ';
    else msg='送球が遅い…一塁へ間に合わず、打者走者セーフでゲッツー崩れ';
    pop(W/2,150,(result==='earlyCatch'||result==='lateCatch')?'失点…':'ゲッツー崩れ…','#ffb0b0');
  }
  if(fails>=3){ state='over'; resultT=0; S.over(); if(score>best){best=score;localStorage.setItem('h2f_best',best);} }
}

// ---------- input ----------
cv.addEventListener('pointerdown',e=>{e.preventDefault();act();});
addEventListener('keydown',e=>{ if(e.repeat)return; if(e.code==='Space'||e.code==='Enter'||e.code==='ArrowUp'||e.code==='KeyZ'){e.preventDefault();act();} });

// ---------- particles ----------
function burst(x,y,c,n,sp){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=rnd(sp*0.3,sp);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:1,c});}}
function pop(x,y,txt,c){pops.push({x,y,txt,c,life:1});}

// ---------- update ----------
function update(dt){
  shake*=Math.pow(0.86,dt/16.7); if(shake<0.3)shake=0;
  flash*=Math.pow(0.9,dt/16.7);
  for(const p of parts){p.vx*=0.96;p.vy=p.vy*0.96+0.28;p.x+=p.vx*dt/16.7;p.y+=p.vy*dt/16.7;p.life-=dt/16.7*0.026;}
  parts=parts.filter(p=>p.life>0);
  for(const p of pops){p.y-=dt/16.7*0.5;p.life-=dt/16.7*0.02;}
  pops=pops.filter(p=>p.life>0);

  if(state!=='play'){ if(state==='over')resultT+=dt/1000; return; }
  t+=dt;
  if(phase==='catch'){ clock+=dt; if(!acted && clock>catchIdeal+catchW+catchGrace){ acted=true; resolve('lateCatch'); } return; }
  if(phase==='throw'){ clock+=dt; if(!acted && clock>throwIdeal+throwW){ acted=true; resolve('lateThrow'); } return; }
  if(phase==='result'){ resultT+=dt/1000; animU=Math.min(1,animU+dt/620); if(resultT>1.35 && state==='play') newPlay(); return; }
}

// ---------- render ----------
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function figure(x,y,col,sc,lean){ sc=sc||1;lean=lean||0;
  ctx.fillStyle='rgba(0,0,0,0.22)';ctx.beginPath();ctx.ellipse(x,y+13*sc,12*sc,4*sc,0,0,6.28);ctx.fill();
  ctx.save();ctx.translate(x,y);ctx.rotate(lean);
  ctx.fillStyle=col;rr(-7*sc,-22*sc,14*sc,24*sc,6*sc);ctx.fill();
  ctx.fillStyle='#f2c9a0';ctx.beginPath();ctx.arc(0,-27*sc,6*sc,0,6.28);ctx.fill();
  ctx.restore();
}
function baseM(x,y,r,col){ ctx.save();ctx.translate(x,y);ctx.rotate(0.785);ctx.fillStyle=col||'#eef0f2';ctx.fillRect(-r,-r,r*2,r*2);ctx.restore(); }
function drawScene(){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#22406b');g.addColorStop(0.4,'#2c7a3b');g.addColorStop(1,'#1c5233');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  // infield dirt
  ctx.fillStyle='#7a5230';ctx.beginPath();ctx.moveTo(HOME.x,HOME.y+14);ctx.lineTo(FIRST.x+34,FIRST.y);ctx.lineTo(SECOND.x,SECOND.y-30);ctx.lineTo(THIRD.x-34,THIRD.y);ctx.closePath();ctx.fill();
  // basepaths
  ctx.strokeStyle='rgba(255,255,255,0.4)';ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(THIRD.x,THIRD.y);ctx.lineTo(HOME.x,HOME.y);ctx.lineTo(FIRST.x,FIRST.y);ctx.stroke();
  baseM(THIRD.x,THIRD.y,11); baseM(FIRST.x,FIRST.y,11); baseM(SECOND.x,SECOND.y,10);
  // home plate
  ctx.fillStyle='#eef0f2';ctx.beginPath();ctx.moveTo(HOME.x-13,HOME.y-6);ctx.lineTo(HOME.x+13,HOME.y-6);ctx.lineTo(HOME.x+13,HOME.y+3);ctx.lineTo(HOME.x,HOME.y+12);ctx.lineTo(HOME.x-13,HOME.y+3);ctx.closePath();ctx.fill();
  // rubber
  ctx.fillStyle='#8a6038';ctx.fillRect(MOUND.x-18,MOUND.y+6,36,6);
}

function render(){
  ctx.save();
  if(shake>0)ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
  drawScene();

  if(state==='play'){
    // runner from third toward home (the force runner)
    let ru=clamp((caught?catchAt:clock)/ (catchIdeal+catchW*0.6),0,1);
    if(phase==='throw'||(phase==='result'&&result==='two')) ru=Math.min(ru,0.8);   // forced out short of home
    if(phase==='result'&&(result==='earlyCatch'||result==='lateCatch')) ru=clamp(0.8+animU*0.3,0,1);  // scores
    const rx=lerp(THIRD.x,HOME.x-16,easeOut(ru)), ry=lerp(THIRD.y,HOME.y-2,easeOut(ru));
    figure(rx,ry,'#ff8a3a',0.9);

    // batter-runner toward first
    let bu;
    if(phase==='catch') bu=clamp(clock/(catchIdeal+throwIdeal+throwW),0,0.5);
    else if(phase==='throw') bu=clamp(0.5+clock/(throwIdeal+throwW)*0.4,0,0.92);
    else bu=(result==='two')?Math.min(0.9,0.9):clamp(0.9+animU*0.2,0,1);
    const bx=lerp(HOME.x+18,FIRST.x-16,easeOut(bu)), by=lerp(HOME.y-6,FIRST.y+2,easeOut(bu));
    figure(bx,by,'#ff8a3a',0.9);

    // catcher (you) at home; first baseman at first
    figure(HOME.x+20,HOME.y-2,'#3aa0ff',1.0, (phase==='throw')?-0.2:0);
    figure(FIRST.x+16,FIRST.y-8,'#3aa0ff',0.92);
    // pitcher who threw home
    figure(MOUND.x,MOUND.y-6,'#c0403a',0.82);

    // ball
    let ballx=MOUND.x, bally=MOUND.y-14;
    if(phase==='catch'){ const u=easeOut(clamp(clock/catchIdeal,0,1)); ballx=lerp(MOUND.x,HOME.x,u); bally=lerp(MOUND.y-14,HOME.y-8,u); }
    else if(phase==='throw'){ ballx=HOME.x; bally=HOME.y-10; }
    else { // result
      if(result==='two'){ const u=easeOut(animU); ballx=lerp(HOME.x,FIRST.x,u); bally=lerp(HOME.y-10,FIRST.y-6,u)-Math.sin(u*Math.PI)*20; }
      else if(result==='earlyThrow'){ const u=easeOut(animU); ballx=lerp(HOME.x,FIRST.x+50,u); bally=lerp(HOME.y-10,FIRST.y-70,u); }  // wild
      else if(result==='lateThrow'){ const u=easeOut(animU); ballx=lerp(HOME.x,FIRST.x,u); bally=lerp(HOME.y-10,FIRST.y-6,u); }
      else if(result==='lateCatch'){ const u=easeOut(animU); ballx=lerp(MOUND.x,HOME.x-20,u); bally=lerp(MOUND.y-14,HOME.y,u); }
      else { const u=easeOut(animU); ballx=lerp(HOME.x,HOME.x+30,u); bally=lerp(HOME.y-8,HOME.y-70,u); } // earlyCatch: mishandled up
    }
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(ballx,bally,7,0,6.28);ctx.fill();
    ctx.strokeStyle='#c33';ctx.lineWidth=1;ctx.beginPath();ctx.arc(ballx,bally,7,0.4,2.2);ctx.stroke();

    // beat cues + timing rings (at home)
    if(phase==='catch'){
      const inWin=Math.abs(clock-catchIdeal)<=catchW;
      ctx.strokeStyle=inWin?'rgba(140,255,160,0.95)':'rgba(255,220,90,0.7)';ctx.lineWidth=4;
      const rem=clamp(1-clock/(catchIdeal),0,1);
      ctx.beginPath();ctx.arc(HOME.x, HOME.y-6, 18+rem*50, 0, 6.28);ctx.stroke();
      ctx.textAlign='center';ctx.fillStyle=inWin?'rgba(140,255,160,0.95)':'rgba(255,255,255,0.85)';ctx.font='bold 17px sans-serif';
      ctx.fillText(inWin?'① 今だ！ 捕って本塁で封殺':'① 送球が来る…本塁で捕れ',W/2,44);
    } else if(phase==='throw'){
      const inWin=Math.abs(clock-throwIdeal)<=throwW;
      ctx.strokeStyle=inWin?'rgba(140,255,160,0.95)':'rgba(255,220,90,0.7)';ctx.lineWidth=4;
      const rem=clamp(1-clock/(throwIdeal),0,1);
      ctx.beginPath();ctx.arc(HOME.x, HOME.y-6, 18+rem*50, 0, 6.28);ctx.stroke();
      ctx.textAlign='center';ctx.fillStyle=inWin?'rgba(140,255,160,0.95)':'rgba(255,255,255,0.85)';ctx.font='bold 17px sans-serif';
      ctx.fillText(inWin?'② 今だ！ 一塁へ送球でゲッツー！':'② 持ち替えて一塁へ…',W/2,44);
    }
  }

  for(const p of parts){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,3.2,0,6.28);ctx.fill();}
  ctx.globalAlpha=1;
  for(const p of pops){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.font='bold 21px sans-serif';ctx.textAlign='center';ctx.fillText(p.txt,p.x,p.y);}
  ctx.globalAlpha=1;

  // HUD
  ctx.textAlign='left';ctx.fillStyle='#fff';ctx.font='bold 26px sans-serif';ctx.fillText('SCORE '+score,20,36);
  ctx.textAlign='right';ctx.fillStyle='rgba(255,255,255,0.9)';ctx.font='14px sans-serif';ctx.fillText('併殺 '+outs+'  Lv'+lvl,W-20,24);
  ctx.fillText('失敗',W-92,46);
  for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(W-60+i*20,41,7,0,6.28);ctx.fillStyle=i<fails?'#ff5b5b':'rgba(255,255,255,0.25)';ctx.fill();}
  if(combo>=2){ctx.textAlign='center';ctx.fillStyle='#ffd24d';ctx.font='bold 18px sans-serif';ctx.fillText('コンボ x'+combo,W/2,548);}

  if(state==='play'&&phase==='result'&&msg){ctx.textAlign='center';ctx.fillStyle=(result==='two')?'#9ff0b8':'#ff9a9a';ctx.font='bold 16px sans-serif';ctx.fillText(msg,W/2,458);}

  if(state==='title'){
    ctx.fillStyle='rgba(6,9,14,0.80)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='bold 42px sans-serif';ctx.fillText('ホームゲッツー',W/2,96);
    ctx.fillStyle='#ffd23e';ctx.font='bold 22px sans-serif';ctx.fillText('Home-to-First (2-3 DP)',W/2,132);
    ctx.fillStyle='rgba(255,255,255,0.92)';ctx.font='16px sans-serif';
    ctx.fillText('満塁のピンチ——捕手として本塁で封殺し、すかさず一塁へ送球して“2-3ダブルプレー”でピンチを断て',W/2,184);
    ctx.fillStyle='rgba(255,255,255,0.66)';ctx.font='14px sans-serif';
    ctx.fillText('① マウンドからの送球が本塁に届く“ちょうど”の緑リングでタップ/クリック/SPACE＝捕って本塁で封殺',W/2,222);
    ctx.fillText('　早いとミットを出し過ぎて弾く／遅いと本塁をこじ開けられて走者生還',W/2,246);
    ctx.fillText('② 封殺した直後、持ち替えて一塁へ送る緑リングでもう一度＝一塁で打者走者を刺してゲッツー完成',W/2,270);
    ctx.fillText('　早いと力んで悪送球／遅いと一塁で間に合わずゲッツー崩れ。2拍を素早く決めるほど高得点',W/2,294);
    ctx.fillText('上級ほど各リングが速く一瞬。3失敗で交代',W/2,318);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で開始',W/2,382);
    ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='14px sans-serif';ctx.fillText('BEST '+best,W/2,414);
  }
  if(state==='over'){
    ctx.fillStyle='rgba(6,9,14,0.84)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#ff6b6b';ctx.font='bold 46px sans-serif';ctx.fillText('3失敗…交代',W/2,222);
    ctx.fillStyle='#fff';ctx.font='bold 40px sans-serif';ctx.fillText('SCORE '+score,W/2,290);
    ctx.fillStyle='rgba(255,255,255,0.85)';ctx.font='19px sans-serif';ctx.fillText('併殺 '+outs+'   BEST '+best,W/2,330);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で もう一度',W/2,402);
  }

  if(flash>0.02){ctx.globalAlpha=flash*0.5;ctx.fillStyle=flashCol;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}
  ctx.restore();

  ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,0.4)';ctx.font='12px sans-serif';
  ctx.fillText('ホームゲッツー：①本塁に届く緑リングで捕って封殺→②一塁へ送る緑リングでもう一度、の2拍で2-3ゲッツー。3失敗で交代',W/2,H-8);
}

function frame(ts){let dt=ts-last;last=ts;if(dt>60)dt=60;if(dt<0)dt=0;update(dt);render();requestAnimationFrame(frame);}
requestAnimationFrame(frame);

// ---------- test hook ----------
window.__h2f={
  start, act:()=>act(),
  get state(){return state;},
  get score(){return score;},
  get outs(){return outs;},
  get fails(){return fails;},
  get info(){return {state,phase,clock,catchIdeal,catchW,throwIdeal,throwW,caught,acted,result,outs,fails,lvl,
    canAct:((phase==='catch'&&!caught)||(phase==='throw'&&!acted))};}
};
})();
</script>
</body>
</html>
