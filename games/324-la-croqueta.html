<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ラ・クロケッタ (La Croqueta)</title>
<style>
  html,body{margin:0;height:100%;background:#07120b;overflow:hidden;
    font-family:-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  #stage{position:relative;width:100vw;height:100vh;max-width:calc(100vh*1.5);max-height:calc(100vw/1.5);aspect-ratio:900/600;}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;border-radius:6px;}
</style>
</head>
<body>
<div id="wrap"><div id="stage"><canvas id="cv"></canvas></div></div>
<script>
(function(){
const W=900,H=600,cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let DPR=1;
function fit(){DPR=Math.min(2,window.devicePixelRatio||1);cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
fit();addEventListener('resize',fit);

// ---------- audio ----------
let AC=null;function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function tone(f,d,type,v,sweep){const a=ac();if(!a)return;const t=a.currentTime,o=a.createOscillator(),g=a.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(sweep)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+sweep),t+d);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v||0.2,t+0.008);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+0.02);}
function noise(d,v,hp){const a=ac();if(!a)return;const t=a.currentTime,n=Math.floor(a.sampleRate*d),buf=a.createBuffer(1,n,a.sampleRate),ch=buf.getChannelData(0);
  for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource();s.buffer=buf;
  const f=a.createBiquadFilter();f.type='highpass';f.frequency.value=hp||600;const g=a.createGain();g.gain.value=v||0.2;
  s.connect(f);f.connect(g);g.connect(a.destination);s.start(t);s.stop(t+d+0.02);}
const S={
  close:()=>{tone(240,0.05,'sine',0.03);},
  touch:()=>{noise(0.04,0.14,900);tone(520,0.05,'triangle',0.08,220);},
  through:()=>{[620,860,1120].forEach((f,i)=>setTimeout(()=>tone(f,0.11,'triangle',0.16),i*55));},
  big:()=>{[600,800,1000,1250].forEach((f,i)=>setTimeout(()=>tone(f,0.12,'triangle',0.17),i*80));},
  lost:()=>{noise(0.18,0.2,300);tone(160,0.2,'sawtooth',0.12,-40);},
  streak:()=>{[700,930,1170,1400].forEach((f,i)=>setTimeout(()=>tone(f,0.1,'triangle',0.16),i*60));},
  over:()=>{[440,330,247,175].forEach((f,i)=>setTimeout(()=>tone(f,0.3,'triangle',0.2),i*160));}
};

// ---------- geometry ----------
const YOU={x:450,y:508};
const DLY=286;                 // defenders' y
const DLX0=286, DRX0=614;      // defenders' start x (apart)
const MEETX=450;               // where they converge

// ---------- state ----------
let state='title', phase='close', plays=0;
let score=0, combo=0, best=+(localStorage.getItem('lc_best')||0);
let outs=0, fails=0, lvl=1;   // outs = successful splits
let clock=0, openT=760, closeT=1080, meetT=1220, dur=1420, tough=false;
let acted=false, actT=0, result=null, resultT=0, msg='', msgOk=false, quality=0, flyU=0;
let shake=0, flash=0, flashCol='#fff', last=performance.now();
let parts=[], pops=[];

function rnd(a,b){return a+Math.random()*(b-a);}
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function lerp(a,b,u){return a+(b-a)*u;}
function easeOut(u){return 1-Math.pow(1-u,2);}
function center(){return (openT+closeT)/2;}
function half(){return (closeT-openT)/2;}

function reset(){state='title';score=0;combo=0;outs=0;fails=0;lvl=1;plays=0;result=null;parts=[];pops=[];}

function newPlay(){
  plays++; lvl=Math.min(7,1+Math.floor(outs/4));
  openT=clamp(820-lvl*44,500,820);
  let win=clamp(330-lvl*22,180,330);
  tough=Math.random()<clamp(0.2+lvl*0.05,0.2,0.5);
  if(tough)win*=0.78;
  closeT=openT+win; meetT=closeT+130; dur=meetT+220;
  phase='close'; clock=0; acted=false; actT=0; result=null; resultT=0; msg=''; msgOk=false; quality=0; flyU=0;
  S.close();
}
function start(){ if(!ac())ac(); if(AC&&AC.state==='suspended')AC.resume(); reset(); state='play'; newPlay(); }

function push(){
  if(state==='title'){start();return;}
  if(state==='over'){ if(resultT>0.4){reset();start();} return; }
  if(state!=='play'||phase!=='close'||acted) return;
  acted=true; actT=clock;
  if(clock<openT){ resolve('early'); }
  else if(clock<=closeT){ quality=1-Math.abs(clock-center())/half(); resolve('through'); }
  else resolve('closed');
}

function resolve(k){
  phase='result'; result=k; resultT=0; flyU=0;
  if(k==='through'){
    outs++; combo++;
    const perfect=quality>=0.8;
    let add=Math.round((tough?250:150)*(1+Math.min(9,combo-1)*0.14)); score+=add;
    S.touch(); setTimeout(S.through,180); if(perfect||tough)setTimeout(S.big,260);
    msgOk=true; flash=1;flashCol='#8affa0';shake=5; burst(MEETX,DLY,'#8affa0',16,7);
    pop(W/2,240,(perfect?'股を抜く絶妙ラ・クロケッタ！ +':'2枚を割って突破！ +')+add,'#d6ffe0');
    if(combo>=2)pop(W/2,150,'コンボ x'+combo,'#ffd24d');
    if(combo>0&&combo%5===0)S.streak();
    msg='寄せる2枚のDFが閉じる一瞬、ダブルタッチで間を割って抜け出した';
  } else {
    fails++; combo=0; msgOk=false; flash=1;flashCol='#ff5b5b';shake=8; S.lost();
    if(k==='early') msg='早い…DFが寄せ切る前に仕掛け、立て直されて挟まれた';
    else msg='遅い…2枚が閉じてから仕掛け、間が消えてボールを奪われた';
    pop(W/2,240,(k==='early')?'挟まれた…':'間に合わず…','#ffb0b0');
  }
  if(fails>=3){ state='over'; resultT=0; S.over(); if(score>best){best=score;localStorage.setItem('lc_best',best);} }
}

// ---------- input ----------
cv.addEventListener('pointerdown',e=>{e.preventDefault();push();});
addEventListener('keydown',e=>{ if(e.repeat)return;
  if(e.code==='Space'||e.code==='Enter'||e.code==='ArrowUp'||e.code==='KeyF'||e.code==='KeyJ'){e.preventDefault();push();} });

// ---------- particles ----------
function burst(x,y,c,n,sp){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=rnd(sp*0.3,sp);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:1,c});}}
function pop(x,y,txt,c){pops.push({x,y,txt,c,life:1});}

// defender x positions as they converge (clock/meetT -> 0..1)
function defX(side){ const u=easeOut(clamp((phase==='close'?clock:actT||clock)/meetT,0,1));
  return side<0? lerp(DLX0,MEETX-16,u) : lerp(DRX0,MEETX+16,u); }

// ---------- update ----------
function update(dt){
  shake*=Math.pow(0.86,dt/16.7); if(shake<0.3)shake=0;
  flash*=Math.pow(0.9,dt/16.7);
  for(const q of parts){q.vx*=0.96;q.vy=q.vy*0.96+0.28;q.x+=q.vx*dt/16.7;q.y+=q.vy*dt/16.7;q.life-=dt/16.7*0.026;}
  parts=parts.filter(q=>q.life>0);
  for(const q of pops){q.y-=dt/16.7*0.5;q.life-=dt/16.7*0.02;}
  pops=pops.filter(q=>q.life>0);

  if(state!=='play'){ if(state==='over')resultT+=dt/1000; return; }
  if(phase==='close'){ clock+=dt;
    if(!acted && clock>closeT){ acted=true; actT=clock; resolve('closed'); }
    return; }
  if(phase==='result'){ resultT+=dt/1000; flyU=Math.min(1,flyU+dt/460);
    if(resultT>1.55) newPlay(); return; }
}

// ---------- render ----------
function drawField(){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#12703f');g.addColorStop(0.5,'#0f5e34');g.addColorStop(1,'#0c4c2b');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  for(let i=0;i<8;i++){ctx.fillStyle=i%2?'rgba(255,255,255,0.03)':'rgba(0,0,0,0.03)';ctx.fillRect(0,i*80,W,80);}
  // goal at top
  ctx.strokeStyle='#f4f4f4';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(360,70);ctx.lineTo(540,70);ctx.stroke();
  ctx.strokeStyle='rgba(255,255,255,0.24)';ctx.lineWidth=2;ctx.strokeRect(250,74,400,150);
}
function person(x,y,col,s){s=s||1;
  ctx.fillStyle=col;ctx.beginPath();ctx.ellipse(x,y-15*s,10*s,15*s,0,0,6.28);ctx.fill();
  ctx.fillStyle='#f0c9a0';ctx.beginPath();ctx.arc(x,y-34*s,7.5*s,0,6.28);ctx.fill();
}

function render(){
  ctx.save();
  if(shake>0)ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
  drawField();

  if(state==='play'||state==='over'){
    // GK far
    ctx.fillStyle='#ffd23e';ctx.beginPath();ctx.ellipse(450,96,10,15,0,0,6.28);ctx.fill();
    ctx.fillStyle='#f0c9a0';ctx.beginPath();ctx.arc(450,78,7,0,6.28);ctx.fill();

    // converging defenders
    const lx=defX(-1), rx=defX(1);
    person(lx,DLY,'#d0403a',0.95); person(rx,DLY,'#d0403a',0.95);
    // gap highlight between them
    const gapOpen=(phase==='close'&&clock>=openT&&clock<=closeT);
    if(gapOpen){ ctx.strokeStyle='rgba(140,255,170,0.7)';ctx.lineWidth=3;ctx.setLineDash([5,5]);
      ctx.beginPath();ctx.moveTo((lx+rx)/2,DLY-40);ctx.lineTo((lx+rx)/2,DLY+40);ctx.stroke();ctx.setLineDash([]); }

    // you with the ball
    let yx=YOU.x,yy=YOU.y;
    if(phase==='result'&&result==='through'){ yy=lerp(YOU.y,DLY-60,easeOut(flyU)); }
    else if(phase==='result'&&result!=='through'){ yy=lerp(YOU.y,DLY+34,easeOut(flyU)*0.5); }
    person(yx,yy,'#2b6fd6',0.98);
    // ball
    let bx=yx+10,by=yy-6;
    if(phase==='result'&&result==='through'){ const u=easeOut(flyU); bx=lerp(YOU.x+10,MEETX,u); by=lerp(YOU.y-6,120,u); }
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(bx,by,7.5,0,6.28);ctx.fill();
    ctx.strokeStyle='#222';ctx.lineWidth=1.2;
    ctx.beginPath();ctx.moveTo(bx-6,by-4);ctx.lineTo(bx+2,by-9);ctx.lineTo(bx+7,by-2);ctx.lineTo(bx+3,by+6);ctx.lineTo(bx-6,by+5);ctx.closePath();ctx.stroke();

    // cue banner + window timer
    ctx.textAlign='center';
    if(state==='play'&&phase==='close'){
      ctx.fillStyle='rgba(255,220,90,0.96)';ctx.font='bold 21px sans-serif';ctx.fillText('2枚が寄せる！ 間が空く一瞬にダブルタッチで割れ',W/2,48);
      const bw=280,x=W/2-bw/2,y=64, span=meetT;
      ctx.fillStyle='rgba(255,255,255,0.15)';ctx.fillRect(x,y,bw,9);
      const gx0=x+bw*clamp(openT/span,0,1), gx1=x+bw*clamp(closeT/span,0,1);
      ctx.fillStyle='rgba(90,240,130,0.5)';ctx.fillRect(gx0,y,gx1-gx0,9);
      const px=x+bw*clamp(clock/span,0,1);
      ctx.fillStyle='#ffe14d';ctx.fillRect(px-2,y-3,4,15);
      ctx.fillStyle='rgba(255,255,255,0.55)';ctx.font='12px sans-serif';ctx.fillText('タップ / SPACE ＝ 間を割ってすり抜ける（早いと立て直される・遅いと閉じる）',W/2,H-30);
    }
  }

  for(const q of parts){ctx.globalAlpha=Math.max(0,q.life);ctx.fillStyle=q.c;ctx.beginPath();ctx.arc(q.x,q.y,3.2,0,6.28);ctx.fill();}
  ctx.globalAlpha=1;
  for(const q of pops){ctx.globalAlpha=Math.max(0,q.life);ctx.fillStyle=q.c;ctx.font='bold 21px sans-serif';ctx.textAlign='center';ctx.fillText(q.txt,q.x,q.y);}
  ctx.globalAlpha=1;

  // HUD
  ctx.textAlign='left';ctx.fillStyle='#fff';ctx.font='bold 26px sans-serif';ctx.fillText('SCORE '+score,20,36);
  ctx.textAlign='right';ctx.fillStyle='rgba(255,255,255,0.9)';ctx.font='14px sans-serif';ctx.fillText('突破 '+outs+'  Lv'+lvl,W-20,24);
  ctx.fillText('ロスト',W-98,46);
  for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(W-60+i*20,41,7,0,6.28);ctx.fillStyle=i<fails?'#ff5b5b':'rgba(255,255,255,0.25)';ctx.fill();}
  if(combo>=2){ctx.textAlign='center';ctx.fillStyle='#ffd24d';ctx.font='bold 18px sans-serif';ctx.fillText('コンボ x'+combo,W/2,110);}

  if(state==='play'&&phase==='result'&&msg){ctx.textAlign='center';ctx.fillStyle=msgOk?'#9ff0b8':'#ff9a9a';ctx.font='bold 16px sans-serif';ctx.fillText(msg,W/2,470);}

  if(state==='title'){
    ctx.fillStyle='rgba(4,10,7,0.83)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='bold 40px sans-serif';ctx.fillText('ラ・クロケッタ',W/2,86);
    ctx.fillStyle='#ffd23e';ctx.font='bold 22px sans-serif';ctx.fillText('La Croqueta',W/2,122);
    ctx.fillStyle='rgba(255,255,255,0.92)';ctx.font='16px sans-serif';
    ctx.fillText('挟みに来る2枚のDFの“間が空く一瞬”を突き、ダブルタッチで割ってすり抜ける技ありドリブル',W/2,182);
    ctx.fillStyle='rgba(255,255,255,0.66)';ctx.font='14px sans-serif';
    ctx.fillText('2人のDFが左右から寄せてくる→間（緑窓）が空いた瞬間にタップ/SPACE＝ダブルタッチで割って抜ける',W/2,220);
    ctx.fillText('早すぎ（DFが寄せ切る前）＝立て直されて挟まれる／遅すぎ（2枚が閉じてから）＝間が消えて奪われる',W/2,244);
    ctx.fillText('閉じる直前ギリギリの狭い間を割るほど“股抜き級”で大量加点。上級ほど寄せが速く間も狭い',W/2,268);
    ctx.fillText('3ロストで交代',W/2,292);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で開始',W/2,360);
    ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='14px sans-serif';ctx.fillText('BEST '+best,W/2,392);
  }
  if(state==='over'){
    ctx.fillStyle='rgba(4,10,7,0.85)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#ff6b6b';ctx.font='bold 46px sans-serif';ctx.fillText('3ロスト…交代',W/2,222);
    ctx.fillStyle='#fff';ctx.font='bold 40px sans-serif';ctx.fillText('SCORE '+score,W/2,290);
    ctx.fillStyle='rgba(255,255,255,0.85)';ctx.font='19px sans-serif';ctx.fillText('突破 '+outs+'   BEST '+best,W/2,330);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で もう一度',W/2,402);
  }

  if(flash>0.02){ctx.globalAlpha=flash*0.5;ctx.fillStyle=flashCol;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}
  ctx.restore();

  ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,0.4)';ctx.font='12px sans-serif';
  ctx.fillText('ラ・クロケッタ：寄せる2枚の間が空く緑窓でダブルタッチして割る。早い＝挟まれ/遅い＝閉じて奪われ、3ロストで交代',W/2,H-8);
}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

function frame(ts){let dt=ts-last;last=ts;if(dt>60)dt=60;if(dt<0)dt=0;update(dt);render();requestAnimationFrame(frame);}
requestAnimationFrame(frame);

// ---------- test hook ----------
window.__lc={
  start, push,
  get state(){return state;},
  get score(){return score;},
  get outs(){return outs;},
  get fails(){return fails;},
  get info(){return {state,phase,clock,openT,closeT,center:center(),half:half(),meetT,tough,acted,actT,result,outs,fails,lvl,
    inWindow:(phase==='close'&&clock>=openT&&clock<=closeT)};}
};
})();
</script>
</body>
</html>
