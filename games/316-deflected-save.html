<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ディフレクション (Deflected Save)</title>
<style>
  html,body{margin:0;height:100%;background:#07120b;overflow:hidden;
    font-family:-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  #stage{position:relative;width:100vw;height:100vh;max-width:calc(100vh*1.5);max-height:calc(100vw/1.5);aspect-ratio:900/600;}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;border-radius:6px;}
</style>
</head>
<body>
<div id="wrap"><div id="stage"><canvas id="cv"></canvas></div></div>
<script>
(function(){
const W=900,H=600,cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let DPR=1;
function fit(){DPR=Math.min(2,window.devicePixelRatio||1);cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
fit();addEventListener('resize',fit);

// ---------- audio ----------
let AC=null;function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function tone(f,d,type,v,sweep){const a=ac();if(!a)return;const t=a.currentTime,o=a.createOscillator(),g=a.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(sweep)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+sweep),t+d);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v||0.2,t+0.008);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+0.02);}
function noise(d,v,hp){const a=ac();if(!a)return;const t=a.currentTime,n=Math.floor(a.sampleRate*d),buf=a.createBuffer(1,n,a.sampleRate),ch=buf.getChannelData(0);
  for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource();s.buffer=buf;
  const f=a.createBiquadFilter();f.type='highpass';f.frequency.value=hp||600;const g=a.createGain();g.gain.value=v||0.2;
  s.connect(f);f.connect(g);g.connect(a.destination);s.start(t);s.stop(t+d+0.02);}
const S={
  strike:()=>{noise(0.05,0.18,500);tone(240,0.06,'square',0.08,-40);},
  deflect:()=>{noise(0.05,0.2,1400);tone(520,0.05,'square',0.08,180);},
  save:()=>{noise(0.1,0.16,700);setTimeout(()=>{[620,860,1120].forEach((f,i)=>setTimeout(()=>tone(f,0.1,'triangle',0.16),i*55));},30);},
  big:()=>{[600,800,1000,1250].forEach((f,i)=>setTimeout(()=>tone(f,0.12,'triangle',0.17),i*80));},
  goal:()=>{noise(0.22,0.22,240);tone(150,0.28,'sawtooth',0.13,-40);},
  streak:()=>{[700,930,1170,1400].forEach((f,i)=>setTimeout(()=>tone(f,0.1,'triangle',0.16),i*60));},
  over:()=>{[440,330,247,175].forEach((f,i)=>setTimeout(()=>tone(f,0.3,'triangle',0.2),i*160));}
};

// ---------- geometry ----------
const GOAL={lx:300,rx:600,top:96,mouth:158};
const LCOR={x:346,y:150}, RCOR={x:554,y:150};   // where the ball ends up
const GKY=132;
const DEF={x:450,y:322};    // defender = deflection point
const KICK={x:450,y:512};   // shooter
const BTN=[
  {k:'left', x:150,label:'左へ ←',sub:'',col:'#3fc46b'},
  {k:'right',x:520,label:'右へ →',sub:'',col:'#3fc46b'}
];
const BW=230, BY=508, BH=64;

// ---------- state ----------
let state='title', phase='flight', plays=0;
let score=0, combo=0, best=+(localStorage.getItem('df_best')||0);
let outs=0, fails=0, lvl=1;   // outs = saves
let clock=0, revealT=520, callWin=900, finalDir='left', tough=false;
let decided=false, call=null, result=null, resultT=0, msg='', msgOk=false;
let gkU=0, initAim=0;         // gkU dive progress ; initAim: pre-deflection lean hint (-1..1)
let shake=0, flash=0, flashCol='#fff', last=performance.now();
let parts=[], pops=[];

function rnd(a,b){return a+Math.random()*(b-a);}
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function lerp(a,b,u){return a+(b-a)*u;}
function easeOut(u){return 1-Math.pow(1-u,2);}
function easeIn(u){return u*u;}

function reset(){state='title';score=0;combo=0;outs=0;fails=0;lvl=1;plays=0;result=null;parts=[];pops=[];gkU=0;}

function newPlay(){
  plays++; lvl=Math.min(7,1+Math.floor(outs/4));
  revealT=clamp(560-lvl*24,360,560);
  callWin=clamp(940-lvl*66,520,940);
  tough=Math.random()<clamp(0.2+lvl*0.05,0.2,0.5);
  if(tough)callWin=Math.round(callWin*0.86);
  finalDir=(Math.random()<0.5?'left':'right');
  // the initial line before the deflection points toward a corner independent of finalDir (a bait)
  initAim=(Math.random()<0.5?-1:1);
  phase='flight'; clock=0; decided=false; call=null; result=null; resultT=0; msg=''; msgOk=false; gkU=0;
  S.strike();
}
function start(){ if(!ac())ac(); if(AC&&AC.state==='suspended')AC.resume(); reset(); state='play'; newPlay(); }

function makeCall(c){
  if(state==='title'){start();return;}
  if(state==='over'){ if(resultT>0.4){reset();start();} return; }
  if(state!=='play'||phase!=='flight'||decided) return;
  if(clock<revealT){ decided=true; call=c; resolve('early'); return; }
  decided=true; call=c;
  resolve(c===finalDir?'save':'wrong');
}

function resolve(k){
  phase='result'; result=k; resultT=0;
  if(k==='save'){
    outs++; combo++;
    let add=Math.round((tough?250:150)*(1+Math.min(9,combo-1)*0.14)); score+=add;
    S.save(); if(tough)setTimeout(S.big,120);
    msgOk=true; flash=1;flashCol='#8affa0';shake=5;
    const c=(finalDir==='left')?LCOR:RCOR; burst(c.x,c.y,'#8affa0',16,7);
    pop(W/2,250,(tough?'超反応セーブ！ +':'ナイスセーブ！ +')+add,'#d6ffe0');
    if(combo>=2)pop(W/2,150,'コンボ x'+combo,'#ffd24d');
    if(combo>0&&combo%5===0)S.streak();
    msg='味方に当たってコースが変わった一発——反応良く'+(finalDir==='left'?'左':'右')+'へ跳んでストップ';
  } else {
    fails++; combo=0; msgOk=false; flash=1;shake=9;
    if(k==='early'){ flashCol='#ff5b5b'; S.goal(); msg='早すぎ…ディフレクションを見る前に跳んで逆を突かれた'; pop(W/2,250,'一足早い…','#ffb0b0'); }
    else { flashCol='#ff2b2b'; S.goal(); msg='逆へ跳んだ…当たって変わったコースは'+(finalDir==='left'?'左':'右')+'だった'; pop(W/2,250,'ゴール…','#ffb0b0'); }
  }
  if(fails>=3){ state='over'; resultT=0; S.over(); if(score>best){best=score;localStorage.setItem('df_best',best);} }
}

// ---------- input ----------
cv.addEventListener('pointerdown',e=>{e.preventDefault();
  if(state!=='play'||phase!=='flight'){ makeCall('left'); return; }
  const r=cv.getBoundingClientRect(); const x=(e.clientX-r.left)/r.width*W, y=(e.clientY-r.top)/r.height*H;
  for(const b of BTN){ if(x>=b.x&&x<=b.x+BW&&y>=BY&&y<=BY+BH){ makeCall(b.k); return; } }
  makeCall(x<W*0.5?'left':'right');
});
addEventListener('keydown',e=>{ if(e.repeat)return;
  if(e.code==='ArrowLeft'||e.code==='KeyA'){e.preventDefault();makeCall('left');}
  else if(e.code==='ArrowRight'||e.code==='KeyD'){e.preventDefault();makeCall('right');}
  else if(e.code==='Space'||e.code==='Enter'){e.preventDefault(); if(state!=='play')makeCall('left');} });

// ---------- particles ----------
function burst(x,y,c,n,sp){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=rnd(sp*0.3,sp);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:1,c});}}
function pop(x,y,txt,c){pops.push({x,y,txt,c,life:1});}

// ---------- ball flight ----------
function ballPos(){
  const arr=revealT+callWin;
  if(clock<revealT){ // pre-deflection: from shooter toward the defender, drifting toward initAim corner slightly
    const u=easeIn(clamp(clock/revealT,0,1));
    const preX=DEF.x+initAim*30, preY=DEF.y;
    return {x:lerp(KICK.x,preX,u), y:lerp(KICK.y,preY,u)};
  } else { // post-deflection: from defender to finalDir corner (continues through during result)
    const extra=(phase==='result')?resultT*1.7:0;
    const u=easeOut(clamp((clock-revealT)/callWin+extra,0,1));
    const c=(finalDir==='left')?LCOR:RCOR;
    // on a goal the ball carries into the net (a touch past the line)
    const past=(phase==='result'&&(result==='wrong'||result==='early'))?18:0;
    return {x:lerp(DEF.x,c.x,u), y:lerp(DEF.y,c.y-past,u)};
  }
}

// ---------- update ----------
function update(dt){
  shake*=Math.pow(0.86,dt/16.7); if(shake<0.3)shake=0;
  flash*=Math.pow(0.9,dt/16.7);
  for(const p of parts){p.vx*=0.96;p.vy=p.vy*0.96+0.28;p.x+=p.vx*dt/16.7;p.y+=p.vy*dt/16.7;p.life-=dt/16.7*0.026;}
  parts=parts.filter(p=>p.life>0);
  for(const p of pops){p.y-=dt/16.7*0.5;p.life-=dt/16.7*0.02;}
  pops=pops.filter(p=>p.life>0);

  if(decided&&call){ gkU=lerp(gkU,1,0.22); }

  if(state!=='play'){ if(state==='over')resultT+=dt/1000; return; }
  if(phase==='flight'){ clock+=dt;
    if(!decided && clock>revealT+callWin){ decided=true; call=null; resolve('wrong'); }
    return; }
  if(phase==='result'){ resultT+=dt/1000; if(resultT>1.6) newPlay(); return; }
}

// ---------- render ----------
function drawField(){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#12703f');g.addColorStop(0.5,'#0f5e34');g.addColorStop(1,'#0c4c2b');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  for(let i=0;i<8;i++){ctx.fillStyle=i%2?'rgba(255,255,255,0.03)':'rgba(0,0,0,0.03)';ctx.fillRect(0,i*80,W,80);}
  ctx.strokeStyle='rgba(255,255,255,0.26)';ctx.lineWidth=2;
  ctx.strokeRect(230,GOAL.mouth,440,250);
  ctx.beginPath();ctx.arc(450,GOAL.mouth+250,54,1.15*Math.PI,1.85*Math.PI);ctx.stroke();
  ctx.fillStyle='#e8e4d8';ctx.beginPath();ctx.arc(450,GOAL.mouth+120,4,0,6.28);ctx.fill();  // pk spot
}
function drawGoal(){
  ctx.fillStyle='rgba(255,255,255,0.06)';ctx.fillRect(GOAL.lx,GOAL.top,GOAL.rx-GOAL.lx,GOAL.mouth-GOAL.top);
  ctx.strokeStyle='rgba(255,255,255,0.22)';ctx.lineWidth=1;
  for(let x=GOAL.lx+10;x<GOAL.rx;x+=14){ctx.beginPath();ctx.moveTo(x,GOAL.top);ctx.lineTo(x,GOAL.mouth);ctx.stroke();}
  for(let y=GOAL.top+8;y<GOAL.mouth;y+=12){ctx.beginPath();ctx.moveTo(GOAL.lx,y);ctx.lineTo(GOAL.rx,y);ctx.stroke();}
  ctx.strokeStyle='#f4f4f4';ctx.lineWidth=5;
  ctx.beginPath();ctx.moveTo(GOAL.lx,GOAL.mouth);ctx.lineTo(GOAL.lx,GOAL.top);ctx.lineTo(GOAL.rx,GOAL.top);ctx.lineTo(GOAL.rx,GOAL.mouth);ctx.stroke();
}
function drawGK(){
  const dive=(decided&&call)?gkU:0;
  const dx=(call==='left'?-1:call==='right'?1:0)*dive*96;
  const cx=450+dx, lean=dive*(call==='left'?-0.7:0.7);
  ctx.save();ctx.translate(cx,GKY);ctx.rotate(lean);
  ctx.fillStyle='#ffd23e';ctx.beginPath();ctx.ellipse(0,-12,11,17,0,0,6.28);ctx.fill();
  ctx.fillStyle='#f0c9a0';ctx.beginPath();ctx.arc(0,-34,8,0,6.28);ctx.fill();
  ctx.strokeStyle='#ffd23e';ctx.lineWidth=6;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(-7,-22);ctx.lineTo(-20,-34-dive*8);ctx.moveTo(7,-22);ctx.lineTo(20,-34-dive*8);ctx.stroke();
  ctx.restore();
}

function render(){
  ctx.save();
  if(shake>0)ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
  drawField();
  drawGoal();

  if(state==='play'||state==='over'){
    const deflected=(phase==='flight'&&clock>=revealT)||phase==='result';

    // shooter
    ctx.fillStyle='#2b6fd6';ctx.beginPath();ctx.ellipse(KICK.x,KICK.y,12,18,0,0,6.28);ctx.fill();
    ctx.fillStyle='#f0c9a0';ctx.beginPath();ctx.arc(KICK.x,KICK.y-24,8,0,6.28);ctx.fill();

    // defender (deflection point)
    ctx.fillStyle=deflected?'#e0584a':'#c0403a';ctx.beginPath();ctx.ellipse(DEF.x,DEF.y,12,17,0,0,6.28);ctx.fill();
    ctx.fillStyle='#f0c9a0';ctx.beginPath();ctx.arc(DEF.x,DEF.y-22,7.5,0,6.28);ctx.fill();
    // leg stuck out
    ctx.strokeStyle=deflected?'#e0584a':'#c0403a';ctx.lineWidth=6;ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(DEF.x,DEF.y+6);ctx.lineTo(DEF.x+initAim*16,DEF.y+18);ctx.stroke();ctx.lineCap='butt';

    drawGK();

    // ball
    const bp=ballPos();
    if(deflected){ // deflection flash marker at the defender
      ctx.strokeStyle='rgba(255,230,90,0.9)';ctx.lineWidth=2;ctx.setLineDash([4,4]);
      ctx.beginPath();ctx.arc(DEF.x,DEF.y,20+Math.sin(clock*0.03)*3,0,6.28);ctx.stroke();ctx.setLineDash([]);
    }
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(bp.x,bp.y,7.5,0,6.28);ctx.fill();
    ctx.strokeStyle='#222';ctx.lineWidth=1.2;
    ctx.beginPath();ctx.moveTo(bp.x-6,bp.y-4);ctx.lineTo(bp.x+2,bp.y-9);ctx.lineTo(bp.x+7,bp.y-2);ctx.lineTo(bp.x+3,bp.y+6);ctx.lineTo(bp.x-6,bp.y+5);ctx.closePath();ctx.stroke();

    // cue banner + timer
    ctx.textAlign='center';
    if(state==='play'&&phase==='flight'){
      if(clock<revealT){ ctx.fillStyle='rgba(255,220,90,0.95)';ctx.font='bold 21px sans-serif';ctx.fillText('シュート！ 味方に当たる——コースの変化を見てから跳べ',W/2,52); }
      else { ctx.fillStyle='rgba(255,120,110,0.98)';ctx.font='bold 23px sans-serif';ctx.fillText('コースが変わった！ '+(finalDir==='left'?'左':'右')+'だ！',W/2,52);
        const p=clamp((clock-revealT)/callWin,0,1),bw=250,x=W/2-bw/2,y=64;
        ctx.fillStyle='rgba(255,255,255,0.18)';ctx.fillRect(x,y,bw,7);ctx.fillStyle=p<0.7?'#8affa0':(p<1?'#ffd24d':'#ff5b5b');ctx.fillRect(x,y,bw*p,7); }
    }

    if(state==='play'){
      for(const b of BTN){ const active=phase==='flight'&&clock>=revealT;
        ctx.fillStyle=active?b.col:'rgba(255,255,255,0.10)';rr(b.x,BY,BW,BH,10);ctx.fill();
        ctx.fillStyle=active?'#08130c':'rgba(255,255,255,0.5)';ctx.textAlign='center';ctx.font='bold 21px sans-serif';ctx.fillText(b.label,b.x+BW/2,BY+40); }
      ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='12px sans-serif';ctx.textAlign='center';ctx.fillText('タップ / ←=左 ・ →=右 に跳ぶ',W/2,BY+BH+18);
    }
  }

  for(const p of parts){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,3.2,0,6.28);ctx.fill();}
  ctx.globalAlpha=1;
  for(const p of pops){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.font='bold 21px sans-serif';ctx.textAlign='center';ctx.fillText(p.txt,p.x,p.y);}
  ctx.globalAlpha=1;

  // HUD
  ctx.textAlign='left';ctx.fillStyle='#fff';ctx.font='bold 26px sans-serif';ctx.fillText('SCORE '+score,20,36);
  ctx.textAlign='right';ctx.fillStyle='rgba(255,255,255,0.9)';ctx.font='14px sans-serif';ctx.fillText('セーブ '+outs+'  Lv'+lvl,W-20,24);
  ctx.fillText('失点',W-92,46);
  for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(W-60+i*20,41,7,0,6.28);ctx.fillStyle=i<fails?'#ff5b5b':'rgba(255,255,255,0.25)';ctx.fill();}
  if(combo>=2){ctx.textAlign='center';ctx.fillStyle='#ffd24d';ctx.font='bold 18px sans-serif';ctx.fillText('コンボ x'+combo,W/2,108);}

  if(state==='play'&&phase==='result'&&msg){ctx.textAlign='center';ctx.fillStyle=msgOk?'#9ff0b8':'#ff9a9a';ctx.font='bold 16px sans-serif';ctx.fillText(msg,W/2,470);}

  if(state==='title'){
    ctx.fillStyle='rgba(4,10,7,0.83)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='bold 40px sans-serif';ctx.fillText('ディフレクション',W/2,86);
    ctx.fillStyle='#ffd23e';ctx.font='bold 22px sans-serif';ctx.fillText('Deflected Save',W/2,122);
    ctx.fillStyle='rgba(255,255,255,0.92)';ctx.font='16px sans-serif';
    ctx.fillText('GKとして、味方に当たってコースが変わる“ディフレクション”を見極めて跳べ。当たる前の軌道に釣られるな',W/2,180);
    ctx.fillStyle='rgba(255,255,255,0.66)';ctx.font='14px sans-serif';
    ctx.fillText('シュートが味方DFに当たってコースが変化→変わった方向へ跳ぶ（左＝←/画面左・右＝→/画面右）',W/2,220);
    ctx.fillText('当たる前に跳ぶ＝早すぎ（逆を突かれる）、変わった方向を外すと失点、際どい一発を止めると大量加点',W/2,244);
    ctx.fillText('当たる瞬間まで我慢して、変化を見てから素早く反応するのがコツ。上級ほど変化が速く猶予も短い',W/2,268);
    ctx.fillText('3失点で交代',W/2,292);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で開始',W/2,360);
    ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='14px sans-serif';ctx.fillText('BEST '+best,W/2,392);
  }
  if(state==='over'){
    ctx.fillStyle='rgba(4,10,7,0.85)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#ff6b6b';ctx.font='bold 46px sans-serif';ctx.fillText('3失点…交代',W/2,222);
    ctx.fillStyle='#fff';ctx.font='bold 40px sans-serif';ctx.fillText('SCORE '+score,W/2,290);
    ctx.fillStyle='rgba(255,255,255,0.85)';ctx.font='19px sans-serif';ctx.fillText('セーブ '+outs+'   BEST '+best,W/2,330);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で もう一度',W/2,402);
  }

  if(flash>0.02){ctx.globalAlpha=flash*0.5;ctx.fillStyle=flashCol;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}
  ctx.restore();

  ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,0.4)';ctx.font='12px sans-serif';
  ctx.fillText('ディフレクション：味方に当たって変わったコースを見てから左右へ跳ぶ。当たる前の早跳び/逆は失点、3失点で交代',W/2,H-8);
}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

function frame(ts){let dt=ts-last;last=ts;if(dt>60)dt=60;if(dt<0)dt=0;update(dt);render();requestAnimationFrame(frame);}
requestAnimationFrame(frame);

// ---------- test hook ----------
window.__df={
  start, makeCall:(c)=>makeCall(c),
  get state(){return state;},
  get score(){return score;},
  get outs(){return outs;},
  get fails(){return fails;},
  get info(){return {state,phase,clock,revealT,callWin,finalDir,initAim,tough,decided,call,result,outs,fails,lvl,
    revealed:(clock>=revealT),correctCall:finalDir,canAct:(phase==='flight'&&!decided)};}
};
})();
</script>
</body>
</html>
