<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>カットオフ・中継プレー — Cut the Runner Down</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{width:100%;height:100%;background:#0a1622;overflow:hidden;
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,system-ui,sans-serif;
    touch-action:none;user-select:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  #stage{position:relative;aspect-ratio:900/600;max-width:100%;max-height:100%;
    width:auto;height:auto;box-shadow:0 0 60px rgba(0,0,0,.6);}
  canvas{display:block;width:100%;height:100%;border-radius:6px;}
</style>
</head>
<body>
<div id="wrap"><div id="stage"><canvas id="c" width="900" height="600"></canvas></div></div>
<script>
(function(){
"use strict";
const TEST=location.hash.indexOf('test')>=0;
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
const W=900,H=600;
let dpr=Math.max(1,Math.min(2,window.devicePixelRatio||1));
function fit(){ dpr=Math.max(1,Math.min(2,window.devicePixelRatio||1)); cv.width=W*dpr; cv.height=H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0); }
fit(); window.addEventListener('resize',fit);

// ---- audio ----
let AC=null;
function ac(){ if(!AC){ try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){AC=null;} } return AC; }
function tone(f,d,type,g,f2){ const a=ac(); if(!a)return; const o=a.createOscillator(),gg=a.createGain();
  o.type=type||'sine'; o.frequency.setValueAtTime(f,a.currentTime); if(f2)o.frequency.exponentialRampToValueAtTime(f2,a.currentTime+d);
  gg.gain.setValueAtTime(0.0001,a.currentTime); gg.gain.exponentialRampToValueAtTime(g||0.2,a.currentTime+0.01);
  gg.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+d); o.connect(gg); gg.connect(a.destination); o.start(); o.stop(a.currentTime+d+0.02); }
function noise(d,g,cut){ const a=ac(); if(!a)return; const n=Math.floor(a.sampleRate*d),buf=a.createBuffer(1,n,a.sampleRate),ch=buf.getChannelData(0);
  for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(1-i/n); const src=a.createBufferSource(); src.buffer=buf;
  const f=a.createBiquadFilter(); f.type='lowpass'; f.frequency.value=cut||1200; const gg=a.createGain(); gg.gain.value=g||0.2;
  src.connect(f); f.connect(gg); gg.connect(a.destination); src.start(); }
const S={
  throwG(){ noise(0.05,0.4,2600); tone(300,0.09,'square',0.2,540); },
  throwW(){ noise(0.06,0.28,1400); tone(220,0.12,'sine',0.14,150); },
  wild(){ noise(0.1,0.3,900); tone(180,0.16,'sawtooth',0.14,90); },
  catch(){ noise(0.05,0.34,1200); tone(360,0.05,'sine',0.14); },
  out(){ noise(0.06,0.4,2200); tone(520,0.12,'square',0.24,660); },
  cheer(){ const a=ac(); if(!a)return; noise(0.8,0.26,1900); for(let i=0;i<6;i++)setTimeout(()=>tone(480+Math.random()*320,0.34,'sine',0.05),i*44); },
  safe(){ tone(300,0.26,'sawtooth',0.14,110); },
  start(){ noise(0.05,0.3,2400); tone(420,0.08,'square',0.16,260); },
  tick(){ tone(1100,0.03,'square',0.05); }
};

// ---- geometry ----
const HOME={x:450,y:474}, FIRST={x:626,y:352}, SECOND={x:450,y:230}, THIRD={x:274,y:352};
const OF={x:660,y:152}, CUT={x:520,y:300};       // outfielder (gap) + cutoff man
// runner path: SECOND -> THIRD -> HOME (scoring on a gap hit)
const RPATH=[SECOND,THIRD,HOME];

// ---- state ----
let state='ready';   // ready, throw1, relay1, throw2, relay2, result, over
let outs=0, runs=0, streak=0, best=0, level=0, playN=0;
let power=0, powerDir=1, powerSpeed=2.0, locked=false;
let greenLo=0.7, greenHi=0.92;
let q1='',q2='';
let ballFly=null;       // {x0,y0,x1,y1,t,dur,acc}
let ballAt=OF;          // current resting spot
let runnerS=0, runnerRate=0.86;
let result=null, msg='', msgT=0;
let flash=0,flashCol='#fff',shakeT=0,shakeM=0;
let parts=[], crowd=[], t=0, dust=0;

try{ best=parseInt(localStorage.getItem('cr_best')||'0',10)||0; }catch(e){}
for(let i=0;i<70;i++) crowd.push({x:Math.random()*W,y:6+Math.random()*40,c:['#e8544e','#f0c14b','#4a90d9','#fff','#5cc98a','#c98af0'][i%6],b:Math.random()*6.28});

function save(){ try{localStorage.setItem('cr_best',''+best);}catch(e){} }
function levelUp(){ level=Math.min(9,Math.floor(outs/3)); }

function reset(){ outs=0;runs=0;streak=0;level=0;playN=0; parts=[]; nextPlay(); }

function nextPlay(){
  levelUp(); playN++;
  power=0; powerDir=1; locked=false;
  greenLo=Math.max(0.6,0.72-level*0.012); greenHi=greenLo+Math.max(0.14,0.22-level*0.008);
  powerSpeed=2.0+level*0.12;
  runnerRate=0.9+level*0.02;
  runnerS=0; ballFly=null; ballAt=OF; result=null;
  state='throw1';
  if(playN<=2){ msg='パワーゲージを緑で止めて速い送球！ カットマンへ中継'; msgT=160; }
  else { msg=''; msgT=0; }
  S.start();
}

function runnerPos(){
  const s=Math.min(2,runnerS); const seg=Math.min(1,Math.floor(s)); const f=s-seg;
  const a=RPATH[seg], b=RPATH[seg+1];
  return {x:a.x+(b.x-a.x)*f, y:a.y+(b.y-a.y)*f};
}

function gradeThrow(){
  // returns {dur, acc, tier}
  if(power>greenHi+0.03){ return {dur:0.72, acc:false, tier:'wild'}; }       // overcooked -> sails
  if(power>=greenLo){ const centered=1-Math.abs(power-(greenLo+greenHi)/2)/((greenHi-greenLo)/2);
    return {dur:0.5-centered*0.06, acc:true, tier:'green'}; }
  return {dur:0.62+(greenLo-power)*1.1, acc:true, tier:'weak'};              // too soft -> lob
}

function fire1(){
  if(state!=='throw1'||locked) return; locked=true;
  const g=gradeThrow(); q1=g.tier;
  const dur=g.dur; const tgt = g.acc?CUT:{x:CUT.x+(Math.random()<0.5?-70:70),y:CUT.y-30};
  ballFly={x0:OF.x,y0:OF.y,x1:tgt.x,y1:tgt.y,t:0,dur,acc:g.acc};
  state='relay1';
  if(g.tier==='green'){ S.throwG(); } else if(g.tier==='wild'){ S.wild(); } else { S.throwW(); }
}
function fire2(){
  if(state!=='throw2'||locked) return; locked=true;
  const g=gradeThrow(); q2=g.tier;
  const dur=g.dur+0.1; const tgt = g.acc?HOME:{x:HOME.x+(Math.random()<0.5?-60:60),y:HOME.y-24};
  ballFly={x0:ballAt.x,y0:ballAt.y,x1:tgt.x,y1:tgt.y,t:0,dur,acc:g.acc,home:true};
  state='relay2';
  if(g.tier==='green'){ S.throwG(); } else if(g.tier==='wild'){ S.wild(); } else { S.throwW(); }
}

function arriveCut(){
  ballAt={x:CUT.x,y:CUT.y}; S.catch(); burst(CUT.x,CUT.y,'#cfe4ff',7);
  state='throw2'; power=0; powerDir=1; locked=false;
}
function resolveHome(acc){
  if(result) return;
  if(!acc){ safeRun('送球がそれた！ 生還'); return; }
  if(runnerS<2){ makeOut('タッチアウト！ 走者を刺した'); }
  else { safeRun('わずかに及ばず… 生還'); }
}
function makeOut(m){
  outs++; streak++; if(streak>best){best=streak;save();}
  result='out'; msg = streak>=3? `${streak}連続アシスト！`:m; S.out(); setTimeout(S.cheer,70);
  flash=0.5; flashCol='#eafff0'; shakeT=14; shakeM=5; burst(HOME.x,HOME.y,'#eaffe0',16);
  state='result'; msgT=120;
  setTimeout(()=>{ if(state==='result') nextPlay(); }, 1050);
}
function safeRun(m){
  runs++; streak=0; result='safe'; msg=m; S.safe(); dust=1; shakeT=6; shakeM=3;
  state='result'; msgT=120;
  if(runs>=3){ setTimeout(()=>{ state='over'; msg='3失点・ゲームセット'; msgT=99999; },850); }
  else setTimeout(()=>{ if(state==='result') nextPlay(); }, 1000);
}

function burst(x,y,col,n){ for(let i=0;i<n;i++){ const a=Math.random()*6.28,sp=1+Math.random()*5;
  parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-2,life:1,col,r:2+Math.random()*3}); } }

// ---- input ----
function press(){
  const a=ac(); if(a&&a.state==='suspended')a.resume();
  if(state==='ready'||state==='over'){ reset(); return; }
  if(state==='throw1'){ fire1(); return; }
  if(state==='throw2'){ fire2(); return; }
}
cv.addEventListener('pointerdown',e=>{ e.preventDefault(); press(); });
window.addEventListener('keydown',e=>{ if(e.code==='Space'||e.code==='Enter'){ e.preventDefault(); press(); } });

// ---- update ----
let last=0;
function update(dt){
  t+=dt; if(msgT>0)msgT--; if(flash>0)flash=Math.max(0,flash-dt*2); if(shakeT>0)shakeT--; if(dust>0)dust=Math.max(0,dust-dt*1.4);
  const active = (state==='throw1'||state==='relay1'||state==='throw2'||state==='relay2');
  if(active){
    runnerS += dt*runnerRate;
    if(runnerS>=2 && !result){ runnerS=2; safeRun('走者生還… 中継間に合わず'); }
  }
  if((state==='throw1'||state==='throw2') && !locked){
    power+=powerDir*powerSpeed*dt;
    if(power>=1){ power=1; powerDir=-1; } else if(power<=0){ power=0; powerDir=1; }
  }
  if(ballFly){ ballFly.t+=dt;
    if(ballFly.t>=ballFly.dur){
      if(state==='relay1'){ ballFly=null; arriveCut(); }
      else if(state==='relay2'){ const acc=ballFly.acc; ballAt={x:ballFly.x1,y:ballFly.y1}; ballFly=null; resolveHome(acc); }
    }
  }
  for(let i=parts.length-1;i>=0;i--){ const p=parts[i]; p.x+=p.vx;p.y+=p.vy;p.vy+=0.16;p.life-=dt*1.0; if(p.life<=0)parts.splice(i,1); }
}

// ---- draw ----
function rr(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }

function drawField(){
  const g=ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,'#123a20'); g.addColorStop(1,'#1c6a38');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#0a1c10'; ctx.fillRect(0,0,W,46);
  for(const c of crowd){ const yy=c.y+Math.sin(t*3+c.b)*1.1; ctx.fillStyle=c.c; ctx.globalAlpha=.6; ctx.fillRect(c.x,yy,5,5); }
  ctx.globalAlpha=1;
  // infield dirt diamond
  ctx.fillStyle='#b5763e'; ctx.beginPath();
  ctx.moveTo(HOME.x,HOME.y+16); ctx.lineTo(FIRST.x+18,FIRST.y); ctx.lineTo(SECOND.x,SECOND.y-18); ctx.lineTo(THIRD.x-18,THIRD.y); ctx.closePath(); ctx.fill();
  // grass infield
  ctx.fillStyle='#20844a'; ctx.beginPath();
  ctx.moveTo(HOME.x,HOME.y-14); ctx.lineTo(FIRST.x-30,FIRST.y); ctx.lineTo(SECOND.x,SECOND.y+30); ctx.lineTo(THIRD.x+30,THIRD.y); ctx.closePath(); ctx.fill();
  // base paths
  ctx.strokeStyle='rgba(255,255,255,.28)'; ctx.lineWidth=3;
  ctx.beginPath(); ctx.moveTo(HOME.x,HOME.y);ctx.lineTo(FIRST.x,FIRST.y);ctx.lineTo(SECOND.x,SECOND.y);ctx.lineTo(THIRD.x,THIRD.y);ctx.closePath(); ctx.stroke();
  // bases
  for(const B of [FIRST,SECOND,THIRD]){ ctx.save(); ctx.translate(B.x,B.y); ctx.rotate(Math.PI/4); ctx.fillStyle='#fff'; ctx.fillRect(-9,-9,18,18); ctx.restore(); }
  ctx.fillStyle='#fff'; ctx.beginPath(); ctx.moveTo(HOME.x-11,HOME.y-2);ctx.lineTo(HOME.x+11,HOME.y-2);ctx.lineTo(HOME.x+11,HOME.y+6);ctx.lineTo(HOME.x,HOME.y+14);ctx.lineTo(HOME.x-11,HOME.y+6);ctx.closePath(); ctx.fill();
  // relay guide line (OF -> cut -> home)
  ctx.strokeStyle='rgba(255,255,255,.12)'; ctx.setLineDash([6,8]); ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(OF.x,OF.y);ctx.lineTo(CUT.x,CUT.y);ctx.lineTo(HOME.x,HOME.y); ctx.stroke(); ctx.setLineDash([]);
}

function drawFielders(){
  // outfielder
  fig(OF.x,OF.y,'#4a90d9', state==='throw1');
  // cutoff
  fig(CUT.x,CUT.y,'#5cc98a', state==='throw2');
  // catcher at home
  fig(HOME.x,HOME.y-6,'#e8544e', state==='relay2');
}
function fig(x,y,col,active){
  ctx.save(); ctx.translate(x,y);
  ctx.fillStyle='rgba(0,0,0,.24)'; ctx.beginPath(); ctx.ellipse(0,8,15,5,0,0,6.28); ctx.fill();
  if(active){ ctx.strokeStyle='rgba(255,255,255,.5)'; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(0,-8,22+Math.sin(t*8)*2,0,6.28); ctx.stroke(); }
  ctx.fillStyle=col; rr(-10,-26,20,26,6); ctx.fill();
  ctx.fillStyle='#f0c39a'; ctx.beginPath(); ctx.arc(0,-32,7,0,6.28); ctx.fill();
  ctx.restore();
}

function drawRunner(){
  if(!(state==='throw1'||state==='relay1'||state==='throw2'||state==='relay2'||(state==='result'))) return;
  const r=runnerPos();
  ctx.save(); ctx.translate(r.x,r.y);
  if(dust>0){ ctx.globalAlpha=dust*0.6; ctx.fillStyle='#d8c9a8'; for(let i=0;i<6;i++){ const a=Math.random()*6.28; ctx.beginPath(); ctx.arc(Math.cos(a)*14,6+Math.sin(a)*6,4,0,6.28); ctx.fill(); } ctx.globalAlpha=1; }
  ctx.fillStyle='rgba(0,0,0,.24)'; ctx.beginPath(); ctx.ellipse(0,9,14,5,0,0,6.28); ctx.fill();
  const run=Math.sin(t*16)* (state==='result'?0:6);
  ctx.strokeStyle='#20304a'; ctx.lineWidth=6; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(0,-14); ctx.lineTo(-6-run*0.2,6+run*0.3); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0,-14); ctx.lineTo(6+run*0.2,6-run*0.3); ctx.stroke();
  ctx.fillStyle='#f0c14b'; rr(-10,-30,20,20,6); ctx.fill();
  ctx.fillStyle='#f0c39a'; ctx.beginPath(); ctx.arc(0,-37,7,0,6.28); ctx.fill();
  ctx.restore();
}

function drawBall(){
  let bx,by;
  if(ballFly){ const p=Math.min(1,ballFly.t/ballFly.dur);
    bx=ballFly.x0+(ballFly.x1-ballFly.x0)*p; by=ballFly.y0+(ballFly.y1-ballFly.y0)*p - Math.sin(p*Math.PI)*22;
    // trail
    ctx.strokeStyle='rgba(255,255,255,.4)'; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(ballFly.x0,ballFly.y0); ctx.lineTo(bx,by); ctx.stroke();
  } else { bx=ballAt.x; by=ballAt.y-6; }
  ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(bx,by,7,0,6.28); ctx.fill();
  ctx.strokeStyle='#123'; ctx.lineWidth=1.3; ctx.stroke();
}

function drawPower(){
  if(!(state==='throw1'||state==='throw2')) return;
  const bw=360,bx=(W-bw)/2,by=540,bh=22;
  ctx.fillStyle='rgba(6,18,12,.7)'; rr(bx,by,bw,bh,8); ctx.fill();
  // green zone
  ctx.fillStyle='rgba(92,201,138,.55)'; ctx.fillRect(bx+bw*greenLo,by,bw*(greenHi-greenLo),bh);
  // red overcook zone
  ctx.fillStyle='rgba(232,84,78,.4)'; ctx.fillRect(bx+bw*(greenHi+0.03),by,bw*(1-greenHi-0.03),bh);
  // marker
  const mx=bx+bw*power;
  ctx.fillStyle='#fff'; ctx.fillRect(mx-2,by-4,4,bh+8);
  ctx.fillStyle='rgba(255,255,255,.85)'; ctx.font='13px sans-serif'; ctx.textAlign='center';
  ctx.fillText(state==='throw1'?'① カットマンへ中継':'② 本塁へ返球', W/2, by-8); ctx.textAlign='left';
}

function hud(x,y,w,h,lab,val,col){
  ctx.fillStyle='rgba(6,20,12,.62)'; rr(x,y,w,h,9); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.6)'; ctx.font='11px sans-serif'; ctx.textAlign='left'; ctx.fillText(lab,x+12,y+19);
  ctx.fillStyle=col||'#fff'; ctx.font='bold 24px sans-serif'; ctx.fillText(val,x+12,y+44);
}
function drawHUD(){
  hud(20,14,150,56,'アシスト OUT',''+outs,'#8effa8');
  hud(W/2-75,14,150,56,'連続 STREAK',''+streak,'#ffd23e');
  const rc = runs>=2?'#ff6a5a':'#fff';
  hud(W-170,14,150,56,'失点 RUNS',runs+' /3',rc); ctx.textAlign='left';
  ctx.fillStyle='rgba(255,255,255,.5)'; ctx.font='12px sans-serif'; ctx.fillText('自己ベスト連続 '+best,22,88);
}
function drawMsg(){
  if(msgT>0&&msg){ ctx.textAlign='center'; ctx.font='bold 28px sans-serif'; const w=ctx.measureText(msg).width;
    ctx.fillStyle='rgba(6,18,10,.72)'; rr(450-w/2-18,86,w+36,42,10); ctx.fill();
    ctx.fillStyle='#fff'; ctx.fillText(msg,450,114); ctx.textAlign='left'; }
}
function drawOverlay(){
  ctx.fillStyle='rgba(6,16,10,.74)'; ctx.fillRect(0,0,W,H); ctx.textAlign='center';
  ctx.fillStyle='rgba(140,255,168,.9)'; ctx.font='600 15px sans-serif'; ctx.fillText('BASEBALL · CUT-OFF & RELAY',450,150);
  ctx.fillStyle='#fff'; ctx.font='bold 50px sans-serif'; ctx.fillText('カットオフ・中継プレー',450,204);
  ctx.fillStyle='#ffd23e'; ctx.font='bold 21px sans-serif'; ctx.fillText('Cut the Runner Down',450,236);
  ctx.fillStyle='rgba(255,255,255,.9)'; ctx.font='16px sans-serif';
  const L=['ギャップを破られた！ 走者が本塁を狙う。',
    'パワーゲージを緑で止めて、外野手→カットマン→本塁へ2回中継。',
    '緑ど真ん中ほど速い送球。弱いと山なり、振り切りすぎ(赤)はそれる。',
    'モタつくと走者が生還。中継が先に届けばタッチアウト！',
    '3失点でゲームセット。'];
  for(let i=0;i<L.length;i++) ctx.fillText(L[i],450,274+i*25);
  ctx.fillStyle='#e8544e'; rr(450-95,432,190,54,27); ctx.fill();
  ctx.fillStyle='#fff'; ctx.font='bold 24px sans-serif'; ctx.fillText('プレイボール',450,466);
  ctx.fillStyle='rgba(255,255,255,.6)'; ctx.font='14px sans-serif'; ctx.fillText('タップ / Space で送球',450,510);
  ctx.textAlign='left';
}
function drawOver(){
  ctx.fillStyle='rgba(6,16,10,.82)'; ctx.fillRect(0,0,W,H); ctx.textAlign='center';
  ctx.fillStyle='#fff'; ctx.font='bold 46px sans-serif'; ctx.fillText('3失点・ゲームセット',450,232);
  ctx.fillStyle='#8effa8'; ctx.font='bold 30px sans-serif'; ctx.fillText('走者を刺した '+outs+' 回',450,286);
  ctx.fillStyle='#ffd23e'; ctx.font='20px sans-serif'; ctx.fillText('自己ベスト連続 '+best,450,322);
  ctx.fillStyle='#2f7fd6'; rr(450-95,372,190,54,27); ctx.fill();
  ctx.fillStyle='#fff'; ctx.font='bold 22px sans-serif'; ctx.fillText('もう一度',450,406);
  ctx.textAlign='left';
}

function render(){
  ctx.save();
  if(shakeT>0){ ctx.translate((Math.random()*2-1)*shakeM,(Math.random()*2-1)*shakeM); }
  drawField(); drawFielders(); drawRunner(); drawBall();
  for(const p of parts){ ctx.globalAlpha=Math.max(0,p.life); ctx.fillStyle=p.col; ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,6.28); ctx.fill(); }
  ctx.globalAlpha=1;
  drawPower(); drawHUD(); drawMsg();
  ctx.restore();
  if(flash>0){ ctx.fillStyle=flashCol; ctx.globalAlpha=flash; ctx.fillRect(0,0,W,H); ctx.globalAlpha=1; }
  if(state==='ready') drawOverlay();
  if(state==='over') drawOver();
}
function loop(ts){ if(!last)last=ts; let dt=(ts-last)/1000; last=ts; if(dt>0.05)dt=0.05; update(dt); render(); requestAnimationFrame(loop); }
requestAnimationFrame(loop);

if(TEST){
  window.__cr={
    get state(){return state;},
    get power(){return power;},
    get greenLo(){return greenLo;},
    get greenHi(){return greenHi;},
    get inGreen(){return power>=greenLo && power<=greenHi;},
    get runnerS(){return runnerS;},
    get result(){return result;},
    get count(){return {outs,runs,streak};},
    tap(){ press(); }
  };
}
})();
</script>
</body>
</html>
