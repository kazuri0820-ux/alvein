<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ダイビングキャッチ — Diving Catch</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{width:100%;height:100%;background:#0a1622;overflow:hidden;
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,system-ui,sans-serif;
    touch-action:none;user-select:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  #stage{position:relative;aspect-ratio:900/600;max-width:100%;max-height:100%;
    width:auto;height:auto;box-shadow:0 0 60px rgba(0,0,0,.6);}
  canvas{display:block;width:100%;height:100%;border-radius:6px;}
</style>
</head>
<body>
<div id="wrap"><div id="stage"><canvas id="c" width="900" height="600"></canvas></div></div>
<script>
(function(){
"use strict";
const TEST=location.hash.indexOf('test')>=0;
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
const W=900,H=600;
let dpr=Math.max(1,Math.min(2,window.devicePixelRatio||1));
function fit(){ dpr=Math.max(1,Math.min(2,window.devicePixelRatio||1)); cv.width=W*dpr; cv.height=H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0); }
fit(); window.addEventListener('resize',fit);

// ---- audio ----
let AC=null;
function ac(){ if(!AC){ try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){AC=null;} } return AC; }
function tone(f,d,type,g,f2){ const a=ac(); if(!a)return; const o=a.createOscillator(),gg=a.createGain();
  o.type=type||'sine'; o.frequency.setValueAtTime(f,a.currentTime); if(f2)o.frequency.exponentialRampToValueAtTime(f2,a.currentTime+d);
  gg.gain.setValueAtTime(0.0001,a.currentTime); gg.gain.exponentialRampToValueAtTime(g||0.2,a.currentTime+0.01);
  gg.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+d); o.connect(gg); gg.connect(a.destination); o.start(); o.stop(a.currentTime+d+0.02); }
function noise(d,g,cut){ const a=ac(); if(!a)return; const n=Math.floor(a.sampleRate*d),buf=a.createBuffer(1,n,a.sampleRate),ch=buf.getChannelData(0);
  for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(1-i/n); const src=a.createBufferSource(); src.buffer=buf;
  const f=a.createBiquadFilter(); f.type='lowpass'; f.frequency.value=cut||1200; const gg=a.createGain(); gg.gain.value=g||0.2;
  src.connect(f); f.connect(gg); gg.connect(a.destination); src.start(); }
const S={
  crack(){ noise(0.05,0.4,2600); tone(240,0.07,'square',0.2,120); },
  catch(){ noise(0.06,0.42,1200); tone(340,0.05,'sine',0.18); },
  dive(){ noise(0.12,0.3,1400); tone(300,0.05,'square',0.1,200); },
  great(){ noise(0.06,0.4,2200); tone(520,0.12,'square',0.24,700); },
  cheer(){ const a=ac(); if(!a)return; noise(0.9,0.28,1900); for(let i=0;i<7;i++)setTimeout(()=>tone(500+Math.random()*340,0.34,'sine',0.05),i*42); },
  drop(){ noise(0.14,0.3,900); tone(200,0.16,'sawtooth',0.14,90); },
  run(){ noise(0.03,0.08,900); }, tick(){ tone(1000,0.03,'square',0.05); }
};

// ---- geometry ----
const HOME={x:450,y:64};
const FSTART={x:450,y:452};

// ---- state ----
let state='ready';   // ready, fly, result, over
let outs=0, drops=0, streak=0, best=0, level=0, playN=0;
let q=0, flyDur=1.4, land={x:450,y:430}, peak=140, liner=false, win=0.13;
let fx=450, fy=452, fdive=0, diveDir=1, caught=false, catchQ=0, wasDive=false;
let result=null, msg='', msgT=0, subMsg='';
let flash=0,flashCol='#fff',shakeT=0,shakeM=0;
let parts=[], crowd=[], t=0, dust=0;

const FSPD=430;
try{ best=parseInt(localStorage.getItem('dc_best')||'0',10)||0; }catch(e){}
for(let i=0;i<70;i++) crowd.push({x:Math.random()*W,y:6+Math.random()*38,c:['#e8544e','#f0c14b','#4a90d9','#fff','#5cc98a','#c98af0'][i%6],b:Math.random()*6.28});

function saveBest(){ try{localStorage.setItem('dc_best',''+best);}catch(e){} }
function levelUp(){ level=Math.min(9,Math.floor(outs/4)); }
function reset(){ outs=0;drops=0;streak=0;level=0;playN=0; parts=[]; fx=FSTART.x;fy=FSTART.y;fdive=0; nextBall(); }

function nextBall(){
  levelUp(); playN++;
  liner = Math.random()<0.4+level*0.03;
  land={ x:150+Math.random()*600, y:340+Math.random()*150 };
  peak = liner? 70+Math.random()*40 : 150+Math.random()*90;
  flyDur = (liner? 0.95:1.35) - level*0.045 + Math.random()*0.15;
  flyDur=Math.max(0.6,flyDur);
  win = (liner?0.10:0.15) - level*0.006;
  q=0; caught=false; wasDive=false; catchQ=0; fdive=0; result=null; dust=0;
  state='fly';
  if(playN<=2){ msg='打球の落下点へ自動で移動！ グラブに収まる瞬間にタップ'; msgT=170; subMsg=''; }
  else { msg=''; msgT=0; subMsg=''; }
  S.crack();
}

function shadowPos(){ const qq=Math.min(1.2,q); return {x:HOME.x+(land.x-HOME.x)*qq, y:HOME.y+(land.y-HOME.y)*qq}; }
function ballHeight(){ const qq=Math.min(1.2,q); return Math.max(0,Math.sin(Math.min(1,qq)*Math.PI))*peak; }

function tryCatch(){
  if(state!=='fly'||caught) return;
  const e=Math.abs(q-1.0);
  if(e>win+0.12){ // way off -> flail, no catch (counts as an attempt fail only if ball then drops)
    return;
  }
  // within a plausible window: attempt
  caught=true; catchQ=q;
  const sh=shadowPos();
  const off=Math.abs(fx-sh.x);           // how far fielder is from the ball horizontally
  wasDive = liner || off>20 || e>win*0.6;
  diveDir = sh.x>=fx?1:-1;
  if(e<=win){ result='catch'; fdive=wasDive?1:0.35; (wasDive?S.dive():S.catch()); if(wasDive)setTimeout(S.great,90); finishCatch(); }
  else { result='drop'; caught=true; fdive=1; S.dive(); setTimeout(S.drop,120); finishDrop('ダイビング届かず…'); }
}
function finishCatch(){
  outs++; streak++; if(streak>best){best=streak;saveBest();}
  const sh=shadowPos();
  if(wasDive){ msg='ダイビングキャッチ！！'; subMsg=streak>=3?`${streak}連続好捕！`:'美技！'; flash=0.5; flashCol='#eafff0'; shakeT=14; shakeM=5; setTimeout(S.cheer,60); burst(fx,fy,'#eaffe0',18); }
  else { msg='ナイスキャッチ！'; subMsg=''; flash=0.25; flashCol='#eafff0'; shakeT=6; shakeM=2; burst(fx,fy,'#dfffe8',10); }
  state='result'; msgT=105;
  setTimeout(()=>{ if(state==='result') nextBall(); }, 1050);
}
function finishDrop(m){
  drops++; streak=0; result='drop'; msg=m||'落球…ヒット'; subMsg=''; S.drop(); shakeT=9; shakeM=4; dust=1;
  state='result'; msgT=110;
  if(drops>=3){ setTimeout(()=>{ state='over'; msg='3失策・終了'; msgT=99999; }, 850); }
  else setTimeout(()=>{ if(state==='result') nextBall(); }, 1000);
}

function burst(x,y,col,n){ for(let i=0;i<n;i++){ const a=Math.random()*6.28,sp=1+Math.random()*5;
  parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-2,life:1,col,r:2+Math.random()*3}); } }

// ---- input ----
function press(){ const a=ac(); if(a&&a.state==='suspended')a.resume();
  if(state==='ready'||state==='over'){ reset(); return; }
  if(state==='fly'){ tryCatch(); }
}
cv.addEventListener('pointerdown',e=>{ e.preventDefault(); press(); });
window.addEventListener('keydown',e=>{ if(e.code==='Space'||e.code==='Enter'){ e.preventDefault(); press(); } });

// ---- update ----
let last=0;
function update(dt){
  t+=dt; if(msgT>0)msgT--; if(flash>0)flash=Math.max(0,flash-dt*2); if(shakeT>0)shakeT--; if(dust>0)dust=Math.max(0,dust-dt*1.3);
  if(state==='fly'){
    q+=dt/flyDur;
    // fielder auto-runs toward landing point
    const dx=land.x-fx, dy=land.y-fy, d=Math.hypot(dx,dy), mv=FSPD*dt;
    if(d>1){ const s=Math.min(mv,d)/d; fx+=dx*s; fy+=dy*s; if((t*20|0)%3===0)S.run(); }
    if(q>0.75 && ((q*14|0)!==((q-dt/flyDur)*14|0))) S.tick();
    // ball reached ground uncaught
    if(q>=1.0+win+0.02 && !caught){ finishDrop('前で落ちた…ヒット'); }
  } else if(state==='result'){
    if(fdive>0)fdive=Math.max(0,fdive-dt*1.4);
  }
  for(let i=parts.length-1;i>=0;i--){ const p=parts[i]; p.x+=p.vx;p.y+=p.vy;p.vy+=0.16;p.life-=dt*1.0; if(p.life<=0)parts.splice(i,1); }
}

// ---- draw ----
function rr(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }

function drawField(){
  const g=ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,'#1a6a38'); g.addColorStop(1,'#22894e');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#0a1c10'; ctx.fillRect(0,0,W,30);
  for(const c of crowd){ const yy=c.y+Math.sin(t*3+c.b)*1.1; ctx.fillStyle=c.c; ctx.globalAlpha=.5; ctx.fillRect(c.x,yy,5,4); }
  ctx.globalAlpha=1;
  // mow stripes
  for(let i=0;i<7;i++){ ctx.fillStyle=i%2?'rgba(255,255,255,.045)':'rgba(0,0,0,.05)'; ctx.fillRect(0,60+i*78,W,78); }
  // warning track arc
  ctx.strokeStyle='rgba(200,150,90,.4)'; ctx.lineWidth=14; ctx.beginPath(); ctx.arc(HOME.x,HOME.y,540,0.5,Math.PI-0.5); ctx.stroke();
  // infield dirt near home
  ctx.fillStyle='#b5763e'; ctx.beginPath(); ctx.ellipse(HOME.x,HOME.y+10,120,50,0,0,6.28); ctx.fill();
  // batter at home
  ctx.save(); ctx.translate(HOME.x-4,HOME.y+8); ctx.fillStyle='#c33'; rr(-8,-16,16,20,5); ctx.fill(); ctx.fillStyle='#f0c39a'; ctx.beginPath(); ctx.arc(0,-20,5,0,6.28); ctx.fill(); ctx.restore();
}
function drawBall(){
  if(state==='fly' || (state==='result'&&result==='catch'&&fdive>0.05)){
    const sh=shadowPos(); const H0=ballHeight();
    // landing marker
    if(state==='fly'){ ctx.strokeStyle='rgba(255,255,255,.5)'; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(land.x,land.y,10,0,6.28); ctx.stroke();
      ctx.strokeStyle='rgba(255,255,255,.2)'; ctx.beginPath(); ctx.moveTo(land.x-14,land.y); ctx.lineTo(land.x+14,land.y); ctx.moveTo(land.x,land.y-14); ctx.lineTo(land.x,land.y+14); ctx.stroke(); }
    // shadow
    ctx.fillStyle='rgba(0,0,0,.22)'; ctx.beginPath(); ctx.ellipse(sh.x,sh.y,8,3,0,0,6.28); ctx.fill();
    // ball
    const by=sh.y-H0;
    ctx.strokeStyle='rgba(255,255,255,.3)'; ctx.lineWidth=2;
    ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(sh.x,by,7,0,6.28); ctx.fill(); ctx.strokeStyle='#123'; ctx.lineWidth=1.2; ctx.stroke();
    // catch-timing ring around the fielder's glove (shrinks as ball nears q=1)
    if(state==='fly'){ const rr0=12+Math.max(0,(1-q))*130;
      const near = Math.abs(q-1.0)<win;
      ctx.strokeStyle= near?'#8effa8':'rgba(255,255,255,.5)'; ctx.lineWidth=3;
      ctx.beginPath(); ctx.arc(fx+12*fdiveDirSign(),fy-6,rr0,0,6.28); ctx.stroke(); }
  }
}
function fdiveDirSign(){ const sh=shadowPos(); return sh.x>=fx?1:-1; }
function drawFielder(){
  const dv=fdive;
  ctx.save(); ctx.translate(fx,fy);
  ctx.fillStyle='rgba(0,0,0,.26)'; ctx.beginPath(); ctx.ellipse(0,14,16+dv*14,5,0,0,6.28); ctx.fill();
  const dir=diveDir;
  if(dv>0.1){ ctx.rotate(dir*dv*0.9); }
  // body
  ctx.strokeStyle='#20304a'; ctx.lineWidth=7; ctx.lineCap='round';
  const stride=Math.sin(t*20)*(state==='fly'?6:0);
  ctx.beginPath(); ctx.moveTo(0,-4); ctx.lineTo(-6-stride*0.3,16); ctx.stroke(); ctx.beginPath(); ctx.moveTo(0,-4); ctx.lineTo(6+stride*0.3,16); ctx.stroke();
  ctx.fillStyle='#f0c14b'; rr(-11,-28,22,26,7); ctx.fill();
  ctx.fillStyle='#f0c39a'; ctx.beginPath(); ctx.arc(0,-34,7,0,6.28); ctx.fill();
  // glove arm extends toward ball on dive
  ctx.strokeStyle='#f0c14b'; ctx.lineWidth=7; ctx.lineCap='round';
  const ext=10+dv*28;
  ctx.beginPath(); ctx.moveTo(0,-16); ctx.lineTo(dir*ext,-20-dv*8); ctx.stroke();
  ctx.fillStyle='#5a3a20'; ctx.beginPath(); ctx.arc(dir*ext,-22-dv*8,7,0,6.28); ctx.fill();
  if(state==='result'&&result==='catch'){ ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(dir*ext,-22-dv*8,4,0,6.28); ctx.fill(); }
  ctx.restore();
  if(dust>0){ ctx.globalAlpha=dust*0.6; ctx.fillStyle='#d8c9a8'; for(let i=0;i<7;i++){ const a=Math.random()*6.28; ctx.beginPath(); ctx.arc(fx+Math.cos(a)*20,fy+8+Math.sin(a)*6,4,0,6.28); ctx.fill(); } ctx.globalAlpha=1; }
}

function hud(x,y,w,h,lab,val,col){
  ctx.fillStyle='rgba(6,20,12,.62)'; rr(x,y,w,h,9); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.6)'; ctx.font='11px sans-serif'; ctx.textAlign='left'; ctx.fillText(lab,x+12,y+19);
  ctx.fillStyle=col||'#fff'; ctx.font='bold 24px sans-serif'; ctx.fillText(val,x+12,y+44);
}
function drawHUD(){
  hud(20,14,150,56,'好捕 OUTS',''+outs,'#8effa8');
  hud(W/2-75,14,150,56,'連続 STREAK',''+streak,'#ffd23e');
  const dc=drops>=2?'#ff6a5a':'#fff';
  hud(W-170,14,150,56,'失策 DROP',drops+' /3',dc); ctx.textAlign='left';
  ctx.fillStyle='rgba(255,255,255,.5)'; ctx.font='12px sans-serif'; ctx.fillText('自己ベスト連続 '+best,22,88);
}
function drawMsg(){
  if(msgT>0&&msg){ ctx.textAlign='center'; ctx.font='bold 30px sans-serif'; const w=ctx.measureText(msg).width;
    ctx.fillStyle='rgba(6,18,10,.75)'; rr(450-w/2-18,H-96,w+36,44,10); ctx.fill();
    ctx.fillStyle='#fff'; ctx.fillText(msg,450,H-66);
    if(subMsg){ ctx.font='bold 17px sans-serif'; ctx.fillStyle='rgba(140,255,168,.95)'; ctx.fillText(subMsg,450,H-40); }
    ctx.textAlign='left'; }
}
function drawOverlay(){
  ctx.fillStyle='rgba(6,16,10,.74)'; ctx.fillRect(0,0,W,H); ctx.textAlign='center';
  ctx.fillStyle='rgba(140,255,168,.9)'; ctx.font='600 15px sans-serif'; ctx.fillText('BASEBALL · DIVING CATCH',450,140);
  ctx.fillStyle='#fff'; ctx.font='bold 50px sans-serif'; ctx.fillText('ダイビングキャッチ',450,198);
  ctx.fillStyle='#ffd23e'; ctx.font='bold 21px sans-serif'; ctx.fillText('Rob the Hit',450,230);
  ctx.fillStyle='rgba(255,255,255,.9)'; ctx.font='16px sans-serif';
  const L=['外野手を操作…はしない。落下点へは自動で全力疾走！',
    'ボールがグラブに収まる瞬間にタップ／Spaceでキャッチ。',
    'リング（緑）が最小になる一瞬が捕球のタイミング。',
    '難しい打球ほど飛び込む美技に。速いライナーは窓が狭い。',
    'タイミングを外すと落球。3失策で終了。'];
  for(let i=0;i<L.length;i++) ctx.fillText(L[i],450,268+i*25);
  ctx.fillStyle='#e8544e'; rr(450-95,424,190,54,27); ctx.fill();
  ctx.fillStyle='#fff'; ctx.font='bold 24px sans-serif'; ctx.fillText('プレイボール',450,458);
  ctx.fillStyle='rgba(255,255,255,.6)'; ctx.font='14px sans-serif'; ctx.fillText('タップ / Space で捕球',450,502);
  ctx.textAlign='left';
}
function drawOver(){
  ctx.fillStyle='rgba(6,16,10,.84)'; ctx.fillRect(0,0,W,H); ctx.textAlign='center';
  ctx.fillStyle='#fff'; ctx.font='bold 46px sans-serif'; ctx.fillText('3失策・終了',450,232);
  ctx.fillStyle='#8effa8'; ctx.font='bold 30px sans-serif'; ctx.fillText('好捕 '+outs+' 回',450,286);
  ctx.fillStyle='#ffd23e'; ctx.font='20px sans-serif'; ctx.fillText('自己ベスト連続 '+best,450,322);
  ctx.fillStyle='#2f7fd6'; rr(450-95,372,190,54,27); ctx.fill();
  ctx.fillStyle='#fff'; ctx.font='bold 22px sans-serif'; ctx.fillText('もう一度',450,406);
  ctx.textAlign='left';
}

function render(){
  ctx.save();
  if(shakeT>0){ ctx.translate((Math.random()*2-1)*shakeM,(Math.random()*2-1)*shakeM); }
  drawField(); drawFielder(); drawBall();
  for(const p of parts){ ctx.globalAlpha=Math.max(0,p.life); ctx.fillStyle=p.col; ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,6.28); ctx.fill(); }
  ctx.globalAlpha=1;
  drawHUD(); drawMsg();
  ctx.restore();
  if(flash>0){ ctx.fillStyle=flashCol; ctx.globalAlpha=flash; ctx.fillRect(0,0,W,H); ctx.globalAlpha=1; }
  if(state==='ready') drawOverlay();
  if(state==='over') drawOver();
}
function loop(ts){ if(!last)last=ts; let dt=(ts-last)/1000; last=ts; if(dt>0.05)dt=0.05; update(dt); render(); requestAnimationFrame(loop); }
requestAnimationFrame(loop);

if(TEST){
  window.__dc={
    get state(){return state;},
    get q(){return q;},
    get win(){return win;},
    get liner(){return liner;},
    get result(){return result;},
    get count(){return {outs,drops,streak};},
    catch(){ tryCatch(); },
    tap(){ if(state==='ready'||state==='over')reset(); }
  };
}
})();
</script>
</body>
</html>
