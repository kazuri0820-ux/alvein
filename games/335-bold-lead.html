<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>大胆リード (Bold Lead-Off)</title>
<style>
  html,body{margin:0;height:100%;background:#0a0d08;overflow:hidden;
    font-family:-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  #stage{position:relative;width:100vw;height:100vh;max-width:calc(100vh*1.5);max-height:calc(100vw/1.5);aspect-ratio:900/600;}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;border-radius:6px;}
</style>
</head>
<body>
<div id="wrap"><div id="stage"><canvas id="cv"></canvas></div></div>
<script>
(function(){
const W=900,H=600,cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let DPR=1;
function fit(){DPR=Math.min(2,window.devicePixelRatio||1);cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
fit();addEventListener('resize',fit);

// ---------- audio ----------
let AC=null;function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function tone(f,d,type,v,sweep){const a=ac();if(!a)return;const t=a.currentTime,o=a.createOscillator(),g=a.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(sweep)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+sweep),t+d);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v||0.2,t+0.008);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+0.02);}
function noise(d,v,hp){const a=ac();if(!a)return;const t=a.currentTime,n=Math.floor(a.sampleRate*d),buf=a.createBuffer(1,n,a.sampleRate),ch=buf.getChannelData(0);
  for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource();s.buffer=buf;
  const f=a.createBiquadFilter();f.type='highpass';f.frequency.value=hp||600;const g=a.createGain();g.gain.value=v||0.2;
  s.connect(f);f.connect(g);g.connect(a.destination);s.start(t);s.stop(t+d+0.02);}
const S={
  press:()=>{tone(220,0.05,'sine',0.03);},
  dive:()=>{noise(0.12,0.14,400);tone(240,0.07,'sine',0.06,-90);},
  safe:()=>{[620,860,1120].forEach((f,i)=>setTimeout(()=>tone(f,0.11,'triangle',0.16),i*58));},
  big:()=>{[600,800,1000,1250].forEach((f,i)=>setTimeout(()=>tone(f,0.12,'triangle',0.17),i*80));},
  out:()=>{noise(0.18,0.2,300);tone(160,0.2,'sawtooth',0.12,-40);},
  streak:()=>{[700,930,1170,1400].forEach((f,i)=>setTimeout(()=>tone(f,0.1,'triangle',0.16),i*60));},
  over:()=>{[440,330,247,175].forEach((f,i)=>setTimeout(()=>tone(f,0.3,'triangle',0.2),i*160));}
};

// ---------- geometry ----------
const FIRST={x:236,y:452}, MOUND={x:470,y:150};
const MAXLEAD=200;   // px of lead the runner can edge off first

// ---------- state ----------
let state='title', phase='hold', plays=0;
let score=0, combo=0, best=+(localStorage.getItem('bl_best')||0);
let outs=0, fails=0, lvl=1;   // outs = bold leads earned
let clock=0, tackleT=1100, win=290, tough=false;
let released=false, relT=0, result=null, resultT=0, msg='', msgOk=false, quality=0, flyT=0;
let shake=0, flash=0, flashCol='#fff', last=performance.now();
let parts=[], pops=[];

function rnd(a,b){return a+Math.random()*(b-a);}
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function lerp(a,b,u){return a+(b-a)*u;}
function easeOut(u){return 1-Math.pow(1-u,2);}

function reset(){state='title';score=0;combo=0;outs=0;fails=0;lvl=1;plays=0;result=null;parts=[];pops=[];}
function winStart(){return tackleT-win;}

function newPlay(){
  plays++; lvl=Math.min(7,1+Math.floor(outs/4));
  tackleT=clamp(1160-lvl*58,720,1160);
  win=clamp(300-lvl*18,160,300);
  tough=Math.random()<clamp(0.2+lvl*0.05,0.2,0.5);
  if(tough)win*=0.8;
  phase='hold'; clock=0; released=false; relT=0; result=null; resultT=0; msg=''; msgOk=false; quality=0; flyT=0;
  S.press();
}
function start(){ if(!ac())ac(); if(AC&&AC.state==='suspended')AC.resume(); reset(); state='play'; newPlay(); }

function pass(){   // "dive back" — kept name for logic/harness parity
  if(state==='title'){start();return;}
  if(state==='over'){ if(resultT>0.4){reset();start();} return; }
  if(state!=='play'||phase!=='hold'||released) return;
  released=true; relT=clock;
  if(clock<winStart()){ resolve('covered'); }
  else { quality=clamp((clock-winStart())/win,0,1); resolve('through'); }
}

function resolve(k){
  phase='result'; result=k; resultT=0; flyT=0;
  if(k==='through'){
    outs++; combo++;
    const perfect=quality>=0.82;
    let add=Math.round((60+Math.round(quality*140)+(tough?80:0))*(1+Math.min(9,combo-1)*0.14)); score+=add;
    S.dive(); setTimeout(S.safe,140); if(perfect||tough)setTimeout(S.big,220);
    msgOk=true; flash=1;flashCol='#8affa0';shake=4; burst(FIRST.x,FIRST.y-6,'#8affa0',14,6);
    pop(W/2,250,(perfect?'最大リードで帰塁セーフ！ 完全に揺さぶった！ +':'大胆リードから帰塁セーフ！ +')+add,'#d6ffe0');
    if(combo>=2)pop(W/2,150,'コンボ x'+combo,'#ffd24d');
    if(combo>0&&combo%5===0)S.streak();
    msg=perfect?'牽制ギリギリまでリードを広げ、間一髪で帰塁——投手を完全に揺さぶる好リード':'大きくリードを取ってから素早く帰塁、次の盗塁へ最高の布石';
  } else {
    fails++; combo=0; msgOk=false; flash=1;shake=8; S.out();
    if(k==='covered'){ flashCol='#ff5b5b'; msg='戻るのが早い…腰が引けてリードを取れず、投手に抑え込まれてチャンスを潰した'; pop(W/2,250,'リード取れず…','#ffb0b0'); }
    else { flashCol='#ff8b3b'; msg='欲張りすぎ…帰塁が遅れて牽制球にタッチアウト（飛び出し）'; pop(W/2,250,'牽制アウト…','#ffcf9a'); }
  }
  if(fails>=3){ state='over'; resultT=0; S.over(); if(score>best){best=score;localStorage.setItem('bl_best',best);} }
}

// ---------- input ----------
cv.addEventListener('pointerdown',e=>{e.preventDefault();pass();});
addEventListener('keydown',e=>{ if(e.repeat)return;
  if(e.code==='Space'||e.code==='Enter'||e.code==='ArrowLeft'||e.code==='KeyF'||e.code==='KeyJ'){e.preventDefault();pass();} });

// ---------- particles ----------
function burst(x,y,c,n,sp){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=rnd(sp*0.3,sp);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:1,c});}}
function pop(x,y,txt,c){pops.push({x,y,txt,c,life:1});}

function leadFrac(){ return clamp((phase==='hold'?clock:relT)/tackleT,0,1); }

// ---------- update ----------
function update(dt){
  shake*=Math.pow(0.86,dt/16.7); if(shake<0.3)shake=0;
  flash*=Math.pow(0.9,dt/16.7);
  for(const q of parts){q.vx*=0.96;q.vy=q.vy*0.96+0.28;q.x+=q.vx*dt/16.7;q.y+=q.vy*dt/16.7;q.life-=dt/16.7*0.026;}
  parts=parts.filter(q=>q.life>0);
  for(const q of pops){q.y-=dt/16.7*0.5;q.life-=dt/16.7*0.02;}
  pops=pops.filter(q=>q.life>0);

  if(state!=='play'){ if(state==='over')resultT+=dt/1000; return; }
  if(phase==='hold'){ clock+=dt;
    if(!released && clock>=tackleT){ released=true; relT=tackleT; resolve('tackled'); }
    return; }
  if(phase==='result'){ resultT+=dt/1000; flyT=Math.min(1,flyT+dt/420);
    if(resultT>1.6) newPlay(); return; }
}

// ---------- render ----------
function drawField(){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#12703f');g.addColorStop(0.5,'#0f5e34');g.addColorStop(1,'#0c4c2b');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  // infield dirt
  ctx.fillStyle='#6a4a30';ctx.beginPath();ctx.ellipse(FIRST.x+150,FIRST.y-40,360,150,0,0,6.28);ctx.fill();
  // basepath first -> second (the lead lane)
  ctx.strokeStyle='rgba(230,210,150,0.55)';ctx.lineWidth=22;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(FIRST.x,FIRST.y);ctx.lineTo(FIRST.x+MAXLEAD+120,FIRST.y-70);ctx.stroke();ctx.lineCap='butt';
  // first base
  ctx.fillStyle='#f2f2f2';ctx.save();ctx.translate(FIRST.x,FIRST.y);ctx.rotate(0.785);ctx.fillRect(-13,-13,26,26);ctx.restore();
  // mound
  ctx.fillStyle='#7a5636';ctx.beginPath();ctx.ellipse(MOUND.x,MOUND.y+8,54,22,0,0,6.28);ctx.fill();
}
function person(x,y,col,s,lean){s=s||1;lean=lean||0;
  ctx.save();ctx.translate(x,y);ctx.rotate(lean);
  ctx.fillStyle=col;ctx.beginPath();ctx.ellipse(0,-15*s,10*s,15*s,0,0,6.28);ctx.fill();
  ctx.fillStyle='#f0c9a0';ctx.beginPath();ctx.arc(0,-34*s,7.5*s,0,6.28);ctx.fill();
  ctx.restore();
}

function render(){
  ctx.save();
  if(shake>0)ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
  drawField();

  if(state==='play'||state==='over'){
    const lf=leadFrac();
    // lead position along the lane
    const laneX=x=>FIRST.x+x*(MAXLEAD), laneY=x=>FIRST.y-x*(MAXLEAD*0.35);
    // pitcher (watches, then throws over on tackle)
    person(MOUND.x,MOUND.y,'#c0403a',0.92);
    // first baseman holding the bag
    person(FIRST.x+16,FIRST.y-8,'#2b6fd6',0.86);

    // runner: leads off (grows), dives back on result
    let rp=lf, sliding=false;
    if(phase==='result'){
      if(result==='through'){ rp=lerp(leadFrac(),0.02,easeOut(flyT)); sliding=flyT<0.8; }   // dive back safe
      else if(result==='covered'){ rp=lerp(leadFrac(),0.02,easeOut(flyT)); }                 // timid, already back
      else { rp=leadFrac(); }                                                                 // tackled: caught off the bag
    }
    const rx=laneX(rp), ry=laneY(rp);
    person(rx,ry,(phase==='result'&&result==='tackled')?'#e0584a':'#d0403a',0.98,sliding?0.6:0);

    // pickoff throw to first (only when a real pickoff happened: through/tackled)
    if(phase==='result'&&(result==='through'||result==='tackled')){
      const u=easeOut(flyT); const bx=lerp(MOUND.x,FIRST.x+8,u), by=lerp(MOUND.y-6,FIRST.y-10,u);
      ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(bx,by,6.5,0,6.28);ctx.fill();
      ctx.strokeStyle='#c33';ctx.lineWidth=1.1;ctx.beginPath();ctx.arc(bx,by,6.5,0.4,2.2);ctx.stroke();
    }

    // lead-pressure bar (reward-lateness window)
    ctx.textAlign='center';
    if(state==='play'&&phase==='hold'){
      ctx.fillStyle='rgba(255,220,90,0.96)';ctx.font='bold 21px sans-serif';ctx.fillText('リードを広げろ！ 牽制ギリギリまで粘るほど好リード',W/2,50);
      const bw=300,x=W/2-bw/2,y=66;
      ctx.fillStyle='rgba(255,255,255,0.15)';ctx.fillRect(x,y,bw,9);
      const gx0=x+bw*clamp(winStart()/tackleT,0,1);
      const grad=ctx.createLinearGradient(gx0,0,x+bw,0);grad.addColorStop(0,'rgba(90,240,130,0.35)');grad.addColorStop(1,'rgba(120,255,150,0.75)');
      ctx.fillStyle=grad;ctx.fillRect(gx0,y,(x+bw)-gx0,9);
      ctx.fillStyle='#ff5b5b';ctx.fillRect(x+bw-2,y-3,3,15);
      ctx.fillStyle='rgba(255,120,110,0.9)';ctx.font='11px sans-serif';ctx.fillText('牽制',x+bw,y+24);
      const px=x+bw*clamp(clock/tackleT,0,1);
      ctx.fillStyle='#ffe14d';ctx.fillRect(px-2,y-4,4,17);
      ctx.fillStyle='rgba(255,255,255,0.55)';ctx.font='12px sans-serif';ctx.fillText('タップ / SPACE / ← ＝ 帰塁（早いとリード取れず・粘り過ぎると牽制アウト）',W/2,H-30);
    }
  }

  for(const q of parts){ctx.globalAlpha=Math.max(0,q.life);ctx.fillStyle=q.c;ctx.beginPath();ctx.arc(q.x,q.y,3.2,0,6.28);ctx.fill();}
  ctx.globalAlpha=1;
  for(const q of pops){ctx.globalAlpha=Math.max(0,q.life);ctx.fillStyle=q.c;ctx.font='bold 21px sans-serif';ctx.textAlign='center';ctx.fillText(q.txt,q.x,q.y);}
  ctx.globalAlpha=1;

  // HUD
  ctx.textAlign='left';ctx.fillStyle='#fff';ctx.font='bold 26px sans-serif';ctx.fillText('SCORE '+score,20,36);
  ctx.textAlign='right';ctx.fillStyle='rgba(255,255,255,0.9)';ctx.font='14px sans-serif';ctx.fillText('好リード '+outs+'  Lv'+lvl,W-20,24);
  ctx.fillText('失敗',W-92,46);
  for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(W-60+i*20,41,7,0,6.28);ctx.fillStyle=i<fails?'#ff5b5b':'rgba(255,255,255,0.25)';ctx.fill();}
  if(combo>=2){ctx.textAlign='center';ctx.fillStyle='#ffd24d';ctx.font='bold 18px sans-serif';ctx.fillText('コンボ x'+combo,W/2,112);}

  if(state==='play'&&phase==='result'&&msg){ctx.textAlign='center';ctx.fillStyle=msgOk?'#9ff0b8':'#ffb38a';ctx.font='bold 16px sans-serif';ctx.fillText(msg,W/2,470);}

  if(state==='title'){
    ctx.fillStyle='rgba(4,8,4,0.83)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='bold 44px sans-serif';ctx.fillText('大胆リード',W/2,86);
    ctx.fillStyle='#ffd23e';ctx.font='bold 22px sans-serif';ctx.fillText('Bold Lead-Off',W/2,122);
    ctx.fillStyle='rgba(255,255,255,0.92)';ctx.font='16px sans-serif';
    ctx.fillText('一塁走者としてリードを“できるだけ大きく”取り、牽制球が来る直前ギリギリで帰塁する度胸の勝負',W/2,182);
    ctx.fillStyle='rgba(255,255,255,0.66)';ctx.font='14px sans-serif';
    ctx.fillText('時間とともにリードが広がる→牽制“寸前”の緑窓でタップ/SPACE/←＝帰塁。粘るほど大きなリードで高得点',W/2,220);
    ctx.fillText('戻るのが早い＝リードを取れず投手に抑え込まれてチャンスを潰す（腰が引ける）',W/2,244);
    ctx.fillText('欲張って帰塁が遅い＝牽制球にタッチアウト（飛び出し）。ギリギリの大胆リードほど大量加点',W/2,268);
    ctx.fillText('上級ほど牽制が速く窓が短い。3失敗で交代',W/2,292);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で開始',W/2,360);
    ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='14px sans-serif';ctx.fillText('BEST '+best,W/2,392);
  }
  if(state==='over'){
    ctx.fillStyle='rgba(4,8,4,0.85)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#ff6b6b';ctx.font='bold 46px sans-serif';ctx.fillText('3失敗…交代',W/2,222);
    ctx.fillStyle='#fff';ctx.font='bold 40px sans-serif';ctx.fillText('SCORE '+score,W/2,290);
    ctx.fillStyle='rgba(255,255,255,0.85)';ctx.font='19px sans-serif';ctx.fillText('好リード '+outs+'   BEST '+best,W/2,330);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で もう一度',W/2,402);
  }

  if(flash>0.02){ctx.globalAlpha=flash*0.5;ctx.fillStyle=flashCol;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}
  ctx.restore();

  ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,0.4)';ctx.font='12px sans-serif';
  ctx.fillText('大胆リード：リードを大きく取り牽制寸前で帰塁。早い＝リード取れず/粘り過ぎ＝牽制アウト、3失敗で交代',W/2,H-8);
}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

function frame(ts){let dt=ts-last;last=ts;if(dt>60)dt=60;if(dt<0)dt=0;update(dt);render();requestAnimationFrame(frame);}
requestAnimationFrame(frame);

// ---------- test hook ----------
window.__bl={
  start, pass,
  get state(){return state;},
  get score(){return score;},
  get outs(){return outs;},
  get fails(){return fails;},
  get info(){return {state,phase,clock,tackleT,win,winStart:winStart(),tough,released,relT,result,outs,fails,lvl,
    inWindow:(phase==='hold'&&clock>=winStart()&&clock<=tackleT)};}
};
})();
</script>
</body>
</html>
