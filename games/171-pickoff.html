<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ピックオフ (Pickoff Move)</title>
<style>
  html,body{margin:0;height:100%;background:#0a1420;overflow:hidden;
    font-family:-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  #stage{position:relative;width:100vw;height:100vh;max-width:calc(100vh*1.5);max-height:calc(100vw/1.5);aspect-ratio:900/600;}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;border-radius:6px;}
</style>
</head>
<body>
<div id="wrap"><div id="stage"><canvas id="cv"></canvas></div></div>
<script>
(function(){
const W=900,H=600,cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let DPR=1;
function fit(){DPR=Math.min(2,window.devicePixelRatio||1);cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
fit();addEventListener('resize',fit);

// ---------- audio ----------
let AC=null;function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function tone(f,d,type,v,sweep){const a=ac();if(!a)return;const t=a.currentTime,o=a.createOscillator(),g=a.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(sweep)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+sweep),t+d);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v||0.2,t+0.008);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+0.02);}
function noise(d,v,hp){const a=ac();if(!a)return;const t=a.currentTime,n=Math.floor(a.sampleRate*d),buf=a.createBuffer(1,n,a.sampleRate),ch=buf.getChannelData(0);
  for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource();s.buffer=buf;
  const f=a.createBiquadFilter();f.type='highpass';f.frequency.value=hp||600;const g=a.createGain();g.gain.value=v||0.2;
  s.connect(f);f.connect(g);g.connect(a.destination);s.start(t);}
const S={
  throw:()=>{noise(0.12,0.28,900);tone(520,0.1,'square',0.12,-200);},
  out:()=>{tone(760,0.09,'square',0.18);setTimeout(()=>tone(1040,0.13,'square',0.2),80);setTimeout(()=>tone(1320,0.16,'triangle',0.18),190);},
  great:()=>{[880,1170,1560,2090].forEach((f,i)=>setTimeout(()=>tone(f,0.14,'triangle',0.2),i*70));},
  waste:()=>{tone(300,0.16,'sawtooth',0.16,-120);noise(0.1,0.14,300);},
  steal:()=>{tone(240,0.3,'sawtooth',0.2,-120);setTimeout(()=>tone(180,0.32,'sawtooth',0.18,-80),120);},
  over:()=>{[440,330,247,175].forEach((f,i)=>setTimeout(()=>tone(f,0.3,'triangle',0.2),i*160));},
  step:()=>{tone(160,0.05,'sine',0.08);}
};

// ---------- geometry ----------
// baseline from 1B (bottom-left) up to 2B (upper-right); runner leads along it
const B1={x:322,y:474}, B2={x:690,y:250};
function onLine(t){return {x:B1.x+(B2.x-B1.x)*t, y:B1.y+(B2.y-B1.y)*t};}
const MOUND={x:470,y:352};
const F1={x:300,y:498}; // first baseman waiting spot near bag
const SAFE_LEAD=0.20;   // beyond this lead a pickoff can catch him if leaning
const COMMIT_THR=0.46;  // weight/commit toward 2B needed for a pickoff to work

// ---------- state ----------
let state='title', phase='set', t=0, plays=0;
let score=0, combo=0, best=+(localStorage.getItem('pickoff_best')||0);
let outs=0, mistakes=0;
let lvl=1;
let P=null; // current play
let ball=null, result=null, resultT=0, msg='', msg2='';
let shake=0, flash=0, flashCol='#fff', last=performance.now();
let parts=[], pops=[];

function rnd(a,b){return a+Math.random()*(b-a);}
function chance(p){return Math.random()<p;}
function clamp(v,a,b){return v<a?a:v>b?b:v;}

function reset(){state='title';score=0;combo=0;outs=0;mistakes=0;lvl=1;plays=0;P=null;ball=null;result=null;parts=[];pops=[];}

function newPlay(){
  plays++;
  lvl=Math.min(6, 1+Math.floor(plays/3));
  const leadIn=Math.max(360, 620-lvl*36);
  const leanDur=Math.max(300, 520-lvl*34);      // window length shrinks
  const gap=Math.max(220, 420-lvl*30);
  const count=(lvl>=4?2:3)+ (chance(0.4)?1:0);   // shuffles before break
  const shuffles=[];
  let tt=leadIn, step=(SAFE_LEAD+0.02);
  const realIdx=Math.floor(rnd(0,count)); // guarantee at least one true pickoff window per play
  for(let i=0;i<count;i++){
    const fake = (i!==realIdx) && chance(Math.min(0.5,0.12+lvl*0.06)); // some shuffles are bluffs (never reach commit peak)
    shuffles.push({start:tt, dur:leanDur, lead:step+i*0.045, fake:fake, peak: fake? rnd(0.28,0.42): rnd(0.86,1.0)});
    tt += leanDur + gap;
  }
  P={ leadIn:leadIn, shuffles:shuffles, breakAt:tt+40, breakDur:Math.max(260,460-lvl*40),
      lead:0, commit:0, broke:false, curIdx:-1, thrown:false, primary:SAFE_LEAD*0.75 };
  phase='set'; t=0; result=null; ball=null;
  msg='走者のリードを読め'; msg2='';
}

function start(){ if(!ac())ac(); if(AC&&AC.state==='suspended')AC.resume(); reset(); state='play'; newPlay(); }

// ---------- input ----------
function doThrow(){
  if(state==='title'){start();return;}
  if(state==='over'){ if(resultT>0.5){reset();start();} return; }
  if(state!=='play'||phase!=='active'||!P||P.thrown||result) return;
  P.thrown=true;
  S.throw();
  const pk = !P.broke && P.lead>SAFE_LEAD && P.commit>COMMIT_THR;
  const rp=onLine(P.lead);
  ball={x:F1.x,y:F1.y,tx:rp.x,ty:rp.y,tp:0,phase:'toRunner',pk:pk,greatp:P.commit>0.85 && P.lead>SAFE_LEAD};
  phase='throw';
}
function press(){ doThrow(); }
cv.addEventListener('pointerdown',e=>{e.preventDefault();press();});
addEventListener('keydown',e=>{ if(e.code==='Space'||e.code==='Enter'||e.code==='ArrowUp'){e.preventDefault();press();}});

// ---------- particles ----------
function burst(x,y,c,n,sp){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=rnd(sp*0.3,sp);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:1,c});}}
function pop(x,y,txt,c){pops.push({x,y,txt,c,life:1});}

// ---------- update ----------
function applyResult(kind){
  result=kind; resultT=0; phase='resolve';
  const rp=onLine(P.lead);
  if(kind==='out'||kind==='great'){
    const base=kind==='great'?250:150;
    combo++; const mult=1+Math.min(5,combo-1)*0.25;
    const add=Math.round(base*mult);
    score+=add; outs++;
    S[kind==='great'?'great':'out']();
    flash=1;flashCol=kind==='great'?'#7ef0b0':'#bfe8ff'; shake=kind==='great'?14:9;
    burst(rp.x,rp.y,kind==='great'?'#7ef0b0':'#bfe8ff',kind==='great'?34:22,7);
    pop(rp.x,rp.y-30,(kind==='great'?'ジャストけん制！ ':'ピックオフ！ ')+'+'+add,'#eaffef');
    if(combo>=2) pop(rp.x,rp.y-56,'コンボ x'+combo,'#ffe08a');
    msg=kind==='great'?'完璧な刺し！ 一瞬の隙を突いた':'アウト！ けん制で刺した'; msg2='走者を封じた';
  } else {
    combo=0; mistakes++;
    S[kind==='steal'?'steal':'waste']();
    flash=1;flashCol='#ff6b6b'; shake=11;
    if(kind==='waste'){ msg='けん制ミス！ 走者に戻られた'; msg2='重心が戻っている所へは通じない'; pop(B1.x,B1.y-30,'セーフ','#ffb3b3'); }
    else { msg='盗塁を許した！ 隙を突けず'; msg2='リードが伸びきる前に刺せ'; pop(B2.x,B2.y-24,'盗塁成功','#ffb3b3'); }
    burst(rp.x,rp.y,'#ff8a8a',18,5);
    if(mistakes>=3){ setTimeout(()=>{},0); }
  }
}

function update(dt){
  shake*=Math.pow(0.86,dt/16.7); if(shake<0.3)shake=0;
  flash*=Math.pow(0.9,dt/16.7);
  for(const p of parts){p.vx*=0.96;p.vy=p.vy*0.96+0.3;p.x+=p.vx*dt/16.7;p.y+=p.vy*dt/16.7;p.life-=dt/16.7*0.028;}
  parts=parts.filter(p=>p.life>0);
  for(const p of pops){p.y-=dt/16.7*0.6;p.life-=dt/16.7*0.02;}
  pops=pops.filter(p=>p.life>0);

  if(state!=='play') { if(state==='over')resultT+=dt/1000; return; }
  t+=dt;

  if(phase==='set'){
    // lead off the bag to primary
    const u=clamp(t/P.leadIn,0,1);
    P.lead=P.primary*u; P.commit=0;
    if(t>=P.leadIn){ phase='active'; }
    return;
  }

  if(phase==='active'){
    // find current shuffle
    let inShuffle=false;
    for(let i=0;i<P.shuffles.length;i++){
      const s=P.shuffles[i];
      if(t>=s.start && t<s.start+s.dur){
        inShuffle=true;
        const u=(t-s.start)/s.dur;
        const shape=Math.sin(u*Math.PI);        // 0..1..0
        P.commit=shape*s.peak - (u>0.75?(u-0.75)*4*0.4:0); // slight dive-back tail
        P.lead=s.lead + shape*0.03;
        if(P.curIdx!==i){ P.curIdx=i; S.step(); }
        break;
      }
    }
    if(!inShuffle){
      // between shuffles: settle, weight back
      P.commit += (0 - P.commit)*Math.min(1,dt/120);
    }
    // break?
    if(t>=P.breakAt){
      P.broke=true;
      const bu=clamp((t-P.breakAt)/P.breakDur,0,1);
      P.lead = clamp(P.shuffles[P.shuffles.length-1].lead + bu*(1-P.shuffles[P.shuffles.length-1].lead), 0,1);
      P.commit=1;
      if(bu>=1){ applyResult('steal'); }
    }
    return;
  }

  if(phase==='throw'){
    // ball flies to runner spot; runner keeps moving a touch
    ball.tp=clamp(ball.tp+dt/210,0,1);
    if(!P.broke && !ball.pk){ /* runner dives back */ P.commit+= (-0.8-P.commit)*Math.min(1,dt/140); P.lead+= (P.primary-P.lead)*Math.min(1,dt/160);}
    if(ball.pk){ const rp=onLine(P.lead); ball.tx=rp.x; ball.ty=rp.y; }
    if(ball.tp>=1){
      if(ball.pk) applyResult(ball.greatp?'great':'out');
      else applyResult('waste');
    }
    return;
  }

  if(phase==='resolve'){
    resultT+=dt/1000;
    if(resultT>1.05){
      if(mistakes>=3){ state='over'; resultT=0; S.over(); if(score>best){best=score;localStorage.setItem('pickoff_best',best);} }
      else newPlay();
    }
    return;
  }
}

// ---------- render ----------
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

function drawField(){
  // sky/stands
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#12263b');g.addColorStop(0.42,'#183b2a');g.addColorStop(1,'#20553a');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  // grass tone bands
  ctx.fillStyle='rgba(255,255,255,0.02)';
  for(let i=0;i<7;i++){ if(i%2) ctx.fillRect(0,120+i*66,W,66); }
  // infield dirt (big arc)
  ctx.save();
  ctx.fillStyle='#8a5a34';
  ctx.beginPath();ctx.moveTo(470,540);
  ctx.quadraticCurveTo(120,430,250,250);
  ctx.quadraticCurveTo(470,120,720,250);
  ctx.quadraticCurveTo(840,420,470,540);
  ctx.closePath();ctx.globalAlpha=0.9;ctx.fill();ctx.globalAlpha=1;
  ctx.restore();
  // baseline 1B-2B
  ctx.strokeStyle='rgba(255,255,255,0.5)';ctx.lineWidth=5;
  ctx.beginPath();ctx.moveTo(B1.x,B1.y);ctx.lineTo(B2.x,B2.y);ctx.stroke();
  // bags
  function bag(b,lab){ ctx.save();ctx.translate(b.x,b.y);ctx.rotate(Math.PI/4);ctx.fillStyle='#f4f4f4';ctx.fillRect(-11,-11,22,22);ctx.restore();
    ctx.fillStyle='rgba(255,255,255,0.7)';ctx.font='bold 13px sans-serif';ctx.textAlign='center';ctx.fillText(lab,b.x,b.y+34);}
  bag(B1,'1B'); bag(B2,'2B');
  // mound
  ctx.fillStyle='#9c6a3e';ctx.beginPath();ctx.ellipse(MOUND.x,MOUND.y+6,46,26,0,0,6.28);ctx.fill();
  ctx.fillStyle='#f4f4f4';ctx.fillRect(MOUND.x-16,MOUND.y-2,32,6);
}

function drawFielder(x,y,col,dark){
  ctx.fillStyle=dark||'#20344a'; ctx.beginPath();ctx.ellipse(x,y+16,13,5,0,0,6.28);ctx.fill();
  ctx.fillStyle=col; rr(x-7,y-6,14,20,5);ctx.fill();
  ctx.fillStyle='#f2c9a0';ctx.beginPath();ctx.arc(x,y-14,7,0,6.28);ctx.fill();
  ctx.fillStyle=dark||'#20344a';ctx.beginPath();ctx.arc(x,y-16,7.5,Math.PI,0);ctx.fill();
}

function drawRunner(){
  if(!P)return;
  const rp=onLine(P.lead);
  // lean offset by commit (toward 2B when positive, back toward 1B when negative)
  const dir={x:(B2.x-B1.x),y:(B2.y-B1.y)}; const dl=Math.hypot(dir.x,dir.y);dir.x/=dl;dir.y/=dl;
  const lx=rp.x+dir.x*P.commit*10, ly=rp.y+dir.y*P.commit*10;
  // shadow
  ctx.fillStyle='rgba(0,0,0,0.28)';ctx.beginPath();ctx.ellipse(rp.x,rp.y+15,15,5,0,0,6.28);ctx.fill();
  // pickoff-chance highlight (fades out at high level)
  const okNow = state==='play' && phase==='active' && !P.broke && P.lead>SAFE_LEAD && P.commit>COMMIT_THR;
  if(okNow && lvl<4){
    ctx.strokeStyle='rgba(126,240,176,'+(0.5+0.4*Math.sin(t/70))+')';ctx.lineWidth=4;
    ctx.beginPath();ctx.arc(lx,ly-4,26,0,6.28);ctx.stroke();
  }
  // lean direction arrow
  if(state==='play'&&(phase==='active'||phase==='set')&&Math.abs(P.commit)>0.2){
    ctx.strokeStyle=P.commit>0?'rgba(126,240,176,0.85)':'rgba(255,150,150,0.8)';ctx.lineWidth=4;
    ctx.beginPath();ctx.moveTo(lx,ly-30);ctx.lineTo(lx+dir.x*P.commit*30,ly-30+dir.y*P.commit*30);ctx.stroke();
  }
  // body (leaning)
  ctx.save();ctx.translate(lx,ly);ctx.rotate(P.commit*0.22);
  ctx.fillStyle='#c9352e'; rr(-8,-6,16,22,5);ctx.fill();
  ctx.fillStyle='#f2c9a0';ctx.beginPath();ctx.arc(0,-15,7.5,0,6.28);ctx.fill();
  ctx.fillStyle='#8a1f1a';ctx.beginPath();ctx.arc(0,-17,8,Math.PI,0);ctx.fill();
  // lead legs
  ctx.strokeStyle='#c9352e';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(-4,14);ctx.lineTo(-9,24);ctx.moveTo(4,14);ctx.lineTo(10,22);ctx.stroke();
  ctx.restore();
}

function drawBall(){
  if(!ball)return;
  const x=ball.x+(ball.tx-ball.x)*ball.tp, y=ball.y+(ball.ty-ball.y)*ball.tp - Math.sin(ball.tp*Math.PI)*22;
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(x,y,6,0,6.28);ctx.fill();
  ctx.strokeStyle='#d33';ctx.lineWidth=1.4;ctx.beginPath();ctx.arc(x,y,6,0.4,2.2);ctx.stroke();
}

function drawHUD(){
  ctx.textAlign='left';ctx.fillStyle='#fff';ctx.font='bold 26px sans-serif';
  ctx.fillText('SCORE '+score,20,36);
  ctx.textAlign='right';ctx.fillStyle='rgba(255,255,255,0.85)';ctx.font='14px sans-serif';
  ctx.fillText('アウト '+outs+'  Lv.'+lvl,W-20,26);
  // mistake dots
  ctx.fillText('けん制',W-96,50);
  for(let i=0;i<3;i++){ ctx.beginPath();ctx.arc(W-70+i*22,46,7,0,6.28); ctx.fillStyle=i<mistakes?'#ff5b5b':'rgba(255,255,255,0.25)';ctx.fill(); }
  if(combo>=2){ ctx.textAlign='left';ctx.fillStyle='#ffe08a';ctx.font='bold 18px sans-serif';ctx.fillText('コンボ x'+combo,20,60); }
}

function render(){
  ctx.save();
  if(shake>0)ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
  drawField();

  // fielders
  drawFielder(MOUND.x,MOUND.y-6,'#e8ebef','#20344a'); // pitcher
  drawFielder(F1.x-2,F1.y-6,'#e8ebef','#20344a');      // first baseman
  drawRunner();
  drawBall();

  // particles
  for(const p of parts){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,3.2,0,6.28);ctx.fill();}
  ctx.globalAlpha=1;
  for(const p of pops){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.font='bold 22px sans-serif';ctx.textAlign='center';ctx.fillText(p.txt,p.x,p.y);}
  ctx.globalAlpha=1;

  // message band
  if(state==='play'&&(msg||msg2)){
    ctx.textAlign='center';
    ctx.fillStyle=result?(result==='out'||result==='great'?'#8ff0b8':'#ff9a9a'):'rgba(255,255,255,0.92)';
    ctx.font='bold 30px sans-serif';ctx.fillText(msg,W/2,132);
    if(msg2){ctx.fillStyle='rgba(255,255,255,0.75)';ctx.font='17px sans-serif';ctx.fillText(msg2,W/2,162);}
  }

  if(state==='title'){
    ctx.fillStyle='rgba(6,12,20,0.62)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='bold 52px sans-serif';ctx.fillText('ピックオフ',W/2,214);
    ctx.fillStyle='#8ff0b8';ctx.font='bold 23px sans-serif';ctx.fillText('Pickoff Move',W/2,250);
    ctx.fillStyle='rgba(255,255,255,0.9)';ctx.font='18px sans-serif';
    ctx.fillText('走者が二塁側へ重心を移した“隙”を狙って',W/2,312);
    ctx.fillText('けん制球（クリック / タップ / SPACE）で刺せ',W/2,342);
    ctx.fillStyle='rgba(255,255,255,0.66)';ctx.font='15px sans-serif';
    ctx.fillText('重心が戻っている所へ投げると無駄球／リードが伸びきると盗塁される',W/2,384);
    ctx.fillStyle='#ffe08a';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で開始',W/2,446);
    ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='14px sans-serif';ctx.fillText('BEST '+best,W/2,480);
  }
  if(state==='over'){
    ctx.fillStyle='rgba(6,12,20,0.72)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#ff6b6b';ctx.font='bold 46px sans-serif';ctx.fillText('3つ許した…交代',W/2,230);
    ctx.fillStyle='#fff';ctx.font='bold 40px sans-serif';ctx.fillText('SCORE '+score,W/2,296);
    ctx.fillStyle='rgba(255,255,255,0.85)';ctx.font='20px sans-serif';ctx.fillText('アウト '+outs+'   BEST '+best,W/2,336);
    ctx.fillStyle='#8ff0b8';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で もう一度',W/2,408);
  }

  // flash
  if(flash>0.02){ctx.globalAlpha=flash*0.5;ctx.fillStyle=flashCol;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}
  ctx.restore();

  // footer hint
  ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,0.4)';ctx.font='13px sans-serif';
  ctx.fillText('二塁側へ重心（緑）が乗った一瞬にけん制。戻り（赤）や伸びきる前を狙う。3つ許すと交代',W/2,H-12);
}

function frame(ts){ let dt=ts-last; last=ts; if(dt>60)dt=60; if(dt<0)dt=0; update(dt); render(); requestAnimationFrame(frame); }
requestAnimationFrame(frame);

// ---------- test hook ----------
window.__pk={
  start,
  press,
  get state(){return state;},
  get score(){return score;},
  get outs(){return outs;},
  get mistakes(){return mistakes;},
  get info(){return {state,phase,t,lead:P?P.lead:0,commit:P?P.commit:0,broke:P?P.broke:false,
    pickoffOK: !!(P&&state==='play'&&phase==='active'&&!P.broke&&P.lead>SAFE_LEAD&&P.commit>COMMIT_THR),
    safeLead:SAFE_LEAD,commitThr:COMMIT_THR,thrown:P?P.thrown:false,result,outs,mistakes,lvl};}
};
})();
</script>
</body>
</html>
