<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>スタートを切れ (Get the Jump)</title>
<style>
  html,body{margin:0;height:100%;background:#0a0d08;overflow:hidden;
    font-family:-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  #stage{position:relative;width:100vw;height:100vh;max-width:calc(100vh*1.5);max-height:calc(100vw/1.5);aspect-ratio:900/600;}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;border-radius:6px;}
</style>
</head>
<body>
<div id="wrap"><div id="stage"><canvas id="cv"></canvas></div></div>
<script>
(function(){
const W=900,H=600,cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let DPR=1;
function fit(){DPR=Math.min(2,window.devicePixelRatio||1);cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
fit();addEventListener('resize',fit);

// ---------- audio ----------
let AC=null;function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function tone(f,d,type,v,sweep){const a=ac();if(!a)return;const t=a.currentTime,o=a.createOscillator(),g=a.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(sweep)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+sweep),t+d);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v||0.2,t+0.008);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+0.02);}
function noise(d,v,hp){const a=ac();if(!a)return;const t=a.currentTime,n=Math.floor(a.sampleRate*d),buf=a.createBuffer(1,n,a.sampleRate),ch=buf.getChannelData(0);
  for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource();s.buffer=buf;
  const f=a.createBiquadFilter();f.type='highpass';f.frequency.value=hp||600;const g=a.createGain();g.gain.value=v||0.2;
  s.connect(f);f.connect(g);g.connect(a.destination);s.start(t);s.stop(t+d+0.02);}
const S={
  tick:()=>{tone(300,0.02,'square',0.03);},
  go:()=>{noise(0.05,0.14,600);tone(420,0.06,'square',0.08,140);},
  safe:()=>{[620,880,1150].forEach((f,i)=>setTimeout(()=>tone(f,0.11,'triangle',0.16),i*56));},
  big:()=>{[600,800,1000,1250].forEach((f,i)=>setTimeout(()=>tone(f,0.12,'triangle',0.17),i*80));},
  out:()=>{noise(0.18,0.22,300);tone(160,0.22,'sawtooth',0.12,-50);},
  streak:()=>{[700,930,1170,1400].forEach((f,i)=>setTimeout(()=>tone(f,0.1,'triangle',0.16),i*60));},
  over:()=>{[440,330,247,175].forEach((f,i)=>setTimeout(()=>tone(f,0.3,'triangle',0.2),i*160));}
};

// ---------- geometry ----------
const FIRST={x:236,y:452}, SECOND={x:640,y:250}, PITCHER={x:452,y:300}, CATCHER={x:150,y:560};
function runnerPos(fr){ return {x:lerp(FIRST.x,SECOND.x-18,easeOut(fr)), y:lerp(FIRST.y,SECOND.y+6,easeOut(fr))}; }

// ---------- state ----------
let state='title', phase='time', plays=0;
let score=0, combo=0, best=+(localStorage.getItem('gj_best')||0);
let outs=0, fails=0, lvl=1;   // outs = bases stolen
let swp=0, period=1500, pos=0, dir=1, bandC=0.5, bandW=0.24, tough=false, timeLeft=0;
let acted=false, stopPos=0, quality=0, result=null, resultT=0, msg='', msgOk=false, anim=0, throwU=0;
let shake=0, flash=0, flashCol='#fff', last=performance.now();
let parts=[], pops=[];

function rnd(a,b){return a+Math.random()*(b-a);}
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function lerp(a,b,u){return a+(b-a)*u;}
function easeOut(u){return 1-Math.pow(1-u,2);}
function bandLo(){return bandC-bandW/2;}
function bandHi(){return bandC+bandW/2;}

function reset(){state='title';score=0;combo=0;outs=0;fails=0;lvl=1;plays=0;result=null;parts=[];pops=[];}

function newPlay(){
  plays++; lvl=Math.min(7,1+Math.floor(outs/4));
  period=clamp(1560-lvl*110,860,1560);          // faster sweep at higher levels
  bandW=clamp(0.26-lvl*0.02,0.11,0.26);          // tighter jump window
  tough=Math.random()<clamp(0.2+lvl*0.05,0.2,0.5);
  if(tough)bandW*=0.82;
  bandC=rnd(0.30,0.70);
  timeLeft=2600;                                  // must commit before the pitch is delivered
  phase='time'; swp=Math.random()*period; pos=0; dir=1;
  acted=false; stopPos=0; quality=0; result=null; resultT=0; msg=''; msgOk=false; anim=0; throwU=0;
}
function start(){ if(!ac())ac(); if(AC&&AC.state==='suspended')AC.resume(); reset(); state='play'; newPlay(); }

function go(){   // break for second
  if(state==='title'){start();return;}
  if(state==='over'){ if(resultT>0.4){reset();start();} return; }
  if(state!=='play'||phase!=='time'||acted) return;
  acted=true; stopPos=pos; S.go();
  if(pos>=bandLo()&&pos<=bandHi()){ quality=1-Math.abs(pos-bandC)/(bandW/2); resolve('safe'); }
  else resolve(pos<bandLo()?'early':'late');
}

function resolve(k){
  phase='result'; result=k; resultT=0; anim=0; throwU=0;
  if(k==='safe'){
    outs++; combo++;
    const perfect=quality>=0.7;
    let add=Math.round((60+Math.round(quality*150)+(tough?70:0))*(1+Math.min(9,combo-1)*0.14)); score+=add;
    setTimeout(S.safe,120); if(perfect||tough)setTimeout(S.big,210);
    msgOk=true; flash=1;flashCol='#8affa0';shake=5; burst(SECOND.x,SECOND.y,'#8affa0',16,7);
    pop(W/2,250,(perfect?'完璧なスタート！余裕で盗塁成功！ +':'good jump——盗塁成功！ +')+add,'#d6ffe0');
    if(combo>=2)pop(W/2,214,'コンボ x'+combo,'#ffd24d');
    if(combo>0&&combo%5===0)S.streak();
    msg=perfect?'投手の重心が本塁へ向いた一瞬を完璧に突いた——最高のスタートで悠々セーフ！':'good jumpでスタート——送球より先に二塁を陥れた！';
  } else {
    fails++; combo=0; msgOk=false; flash=1;flashCol='#ff5b5b';shake=8; S.out();
    if(k==='early') msg='仕掛けが早い…投手がまだ本塁へ向く前で、牽制気味の間に飛び出して刺された';
    else msg='スタートが遅い…重心が本塁へ向いた瞬間を逃し、good jumpを切れず送球で悠々アウト';
    pop(W/2,250,(k==='early')?'早い…盗塁死':'遅い…盗塁死','#ffb0b0');
  }
  if(fails>=3){ state='over'; resultT=0; S.over(); if(score>best){best=score;localStorage.setItem('gj_best',best);} }
}

// ---------- input ----------
cv.addEventListener('pointerdown',e=>{e.preventDefault();go();});
addEventListener('keydown',e=>{ if(e.repeat)return; if(e.code==='Space'||e.code==='Enter'||e.code==='ArrowRight'||e.code==='KeyF'){e.preventDefault();go();} });

// ---------- particles ----------
function burst(x,y,c,n,sp){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=rnd(sp*0.3,sp);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:1,c});}}
function pop(x,y,txt,c){pops.push({x,y,txt,c,life:1});}

// ---------- update ----------
function update(dt){
  shake*=Math.pow(0.86,dt/16.7); if(shake<0.3)shake=0;
  flash*=Math.pow(0.9,dt/16.7);
  for(const p of parts){p.vx*=0.96;p.vy=p.vy*0.96+0.28;p.x+=p.vx*dt/16.7;p.y+=p.vy*dt/16.7;p.life-=dt/16.7*0.026;}
  parts=parts.filter(p=>p.life>0);
  for(const p of pops){p.y-=dt/16.7*0.5;p.life-=dt/16.7*0.02;}
  pops=pops.filter(p=>p.life>0);

  if(state!=='play'){ if(state==='over')resultT+=dt/1000; return; }
  if(phase==='time'){
    const before=pos;
    swp+=dt; const ph=(swp%period)/period; pos=1-Math.abs(2*ph-1);
    if((before<bandLo())!==(pos<bandLo())||(before>bandHi())!==(pos>bandHi())){} // (edge crossings; no-op)
    timeLeft-=dt;
    if(!acted && timeLeft<=0){ acted=true; stopPos=-1; resolve('late'); }  // never went -> caught not running
    return;
  }
  if(phase==='result'){ resultT+=dt/1000; anim=Math.min(1,anim+dt/620); throwU=Math.min(1,throwU+dt/700); if(resultT>1.5) newPlay(); return; }
}

// ---------- render ----------
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function figure(x,y,col,sc,lean){ sc=sc||1;lean=lean||0;
  ctx.fillStyle='rgba(0,0,0,0.22)';ctx.beginPath();ctx.ellipse(x,y+13*sc,12*sc,4*sc,0,0,6.28);ctx.fill();
  ctx.save();ctx.translate(x,y);ctx.rotate(lean);
  ctx.fillStyle=col;rr(-7*sc,-22*sc,14*sc,24*sc,6*sc);ctx.fill();
  ctx.fillStyle='#f2c9a0';ctx.beginPath();ctx.arc(0,-27*sc,6*sc,0,6.28);ctx.fill();
  ctx.restore();
}
function slider(x,y,col,lean){ ctx.save();ctx.translate(x,y);ctx.rotate(lean);
  ctx.fillStyle=col;ctx.beginPath();ctx.ellipse(0,-6,17,9,0,0,6.28);ctx.fill();
  ctx.fillStyle='#f0c9a0';ctx.beginPath();ctx.arc(-19,-10,7,0,6.28);ctx.fill();
  ctx.strokeStyle=col;ctx.lineWidth=6;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(10,-4);ctx.lineTo(26,-2);ctx.stroke();ctx.restore(); }
function drawScene(){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#12703f');g.addColorStop(0.5,'#0f5e34');g.addColorStop(1,'#0c4c2b');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  // infield dirt
  ctx.fillStyle='#6a4a30';ctx.beginPath();ctx.ellipse(430,360,380,240,0,0,6.28);ctx.fill();
  // basepath first -> second
  ctx.strokeStyle='rgba(230,210,150,0.5)';ctx.lineWidth=26;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(FIRST.x,FIRST.y);ctx.lineTo(SECOND.x,SECOND.y);ctx.stroke();ctx.lineCap='butt';
  // mound
  ctx.fillStyle='rgba(150,110,80,0.5)';ctx.beginPath();ctx.ellipse(PITCHER.x,PITCHER.y+6,48,20,0,0,6.28);ctx.fill();
  // bags
  for(const B of [FIRST,SECOND]){ ctx.save();ctx.translate(B.x,B.y);ctx.rotate(0.785);ctx.fillStyle='#eef0f2';ctx.fillRect(-12,-12,24,24);ctx.restore(); }
}

function render(){
  ctx.save();
  if(shake>0)ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
  drawScene();

  if(state==='play'){
    // runner fraction along the basepath
    let rf;
    if(phase==='time') rf=clamp(0.02+ (acted?0:0),0,0.1);
    else {
      if(result==='safe') rf=clamp(0.35+easeOut(anim)*0.62,0,1);          // sprints in, beats the throw
      else if(result==='early') rf=clamp(0.10+easeOut(anim)*0.30,0,0.5);   // caught leaning / picked
      else rf=clamp(0.20+easeOut(anim)*0.55,0,0.9);                        // late: thrown out short of the bag
    }
    const rp=runnerPos(rf);

    // pitcher
    figure(PITCHER.x,PITCHER.y,'#c9782f',0.92,(phase==='time')?0.06*Math.sin(swp/90):0);
    // catcher throwing to second on a result
    figure(CATCHER.x,CATCHER.y,'#7a86c9',0.8,0);

    // the throw to second (on a caught-stealing, arrives ahead; on safe, arrives late)
    if(phase==='result'&&result!=='safe'){
      const bx=lerp(CATCHER.x,SECOND.x,easeOut(throwU)), by=lerp(CATCHER.y-14,SECOND.y-4,easeOut(throwU));
      ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(bx,by,6,0,6.28);ctx.fill();
      ctx.strokeStyle='#c33';ctx.lineWidth=1;ctx.beginPath();ctx.arc(bx,by,6,0.4,2.2);ctx.stroke();
    }

    // runner
    const sliding=(phase==='result');
    if(sliding) slider(rp.x,rp.y,(result==='safe')?'#4fa3ff':'#d0403a',0.2);
    else figure(rp.x,rp.y,'#3aa0ff',0.95,0.16);

    // ---- timing gauge (the jump window) ----
    const gx=W/2-260, gy=H-52, gw=520, gh=26;
    ctx.fillStyle='rgba(0,0,0,0.4)';rr(gx-6,gy-6,gw+12,gh+12,8);ctx.fill();
    ctx.fillStyle='rgba(255,255,255,0.12)';rr(gx,gy,gw,gh,6);ctx.fill();
    // green band = commit-to-home window
    const bl=gx+bandLo()*gw, bw=bandW*gw;
    const grad=ctx.createLinearGradient(bl,0,bl+bw,0);grad.addColorStop(0,'rgba(90,240,130,0.5)');grad.addColorStop(0.5,'rgba(140,255,170,0.85)');grad.addColorStop(1,'rgba(90,240,130,0.5)');
    ctx.fillStyle=grad;ctx.fillRect(bl,gy,bw,gh);
    ctx.fillStyle='rgba(255,255,255,0.85)';ctx.fillRect(gx+bandC*gw-1,gy,2,gh);
    // needle
    let nx;
    if(phase==='time') nx=gx+pos*gw; else nx=gx+clamp(stopPos<0?bandC:stopPos,0,1)*gw;
    ctx.fillStyle=(phase==='result')?(result==='safe'?'#8affa0':'#ff6b6b'):'#ffe14d';
    ctx.fillRect(nx-3,gy-7,6,gh+14);
    ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,0.85)';ctx.font='bold 15px sans-serif';
    ctx.fillText('緑の「スタート窓」でタップ／SPACE＝スタートを切れ',W/2,gy-16);

    // banner
    ctx.textAlign='center';
    if(phase==='time'){ ctx.fillStyle='rgba(255,220,90,0.96)';ctx.font='bold 21px sans-serif';ctx.fillText('リードを取って、投手が本塁へ重心を移す“一瞬”を突け',W/2,44);
      const tp=clamp(timeLeft/2600,0,1),tw=180,tx=W/2-tw/2,ty=60;
      ctx.fillStyle='rgba(255,255,255,0.15)';ctx.fillRect(tx,ty,tw,5);ctx.fillStyle=tp<0.3?'#ff5b5b':'#ffd24d';ctx.fillRect(tx,ty,tw*tp,5); }
  }

  for(const p of parts){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,3.2,0,6.28);ctx.fill();}
  ctx.globalAlpha=1;
  for(const p of pops){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.font='bold 21px sans-serif';ctx.textAlign='center';ctx.fillText(p.txt,p.x,p.y);}
  ctx.globalAlpha=1;

  // HUD
  ctx.textAlign='left';ctx.fillStyle='#fff';ctx.font='bold 26px sans-serif';ctx.fillText('SCORE '+score,20,36);
  ctx.textAlign='right';ctx.fillStyle='rgba(255,255,255,0.9)';ctx.font='14px sans-serif';ctx.fillText('盗塁 '+outs+'  Lv'+lvl,W-20,24);
  ctx.fillText('盗塁死',W-104,46);
  for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(W-60+i*20,41,7,0,6.28);ctx.fillStyle=i<fails?'#ff5b5b':'rgba(255,255,255,0.25)';ctx.fill();}
  if(combo>=2){ctx.textAlign='center';ctx.fillStyle='#ffd24d';ctx.font='bold 18px sans-serif';ctx.fillText('コンボ x'+combo,W/2,112);}

  if(state==='play'&&phase==='result'&&msg){ctx.textAlign='center';ctx.fillStyle=msgOk?'#9ff0b8':'#ff9a9a';ctx.font='bold 15px sans-serif';ctx.fillText(msg,W/2,300);}

  if(state==='title'){
    ctx.fillStyle='rgba(4,8,4,0.83)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='bold 42px sans-serif';ctx.fillText('スタートを切れ',W/2,84);
    ctx.fillStyle='#ffd23e';ctx.font='bold 22px sans-serif';ctx.fillText('Get the Jump',W/2,120);
    ctx.fillStyle='rgba(255,255,255,0.92)';ctx.font='16px sans-serif';
    ctx.fillText('一塁走者として二盗を狙う——投手が本塁へ重心を移す“スタート窓”を、往復するタイミング針で捉えろ',W/2,176);
    ctx.fillStyle='rgba(255,255,255,0.66)';ctx.font='14px sans-serif';
    ctx.fillText('下のゲージを針が往復する→緑の「スタート窓」に来た瞬間にタップ/SPACE/→＝good jumpでスタート',W/2,214);
    ctx.fillText('窓の中心ドンピシャほど最高のスタートで余裕の盗塁成功＝大量加点',W/2,238);
    ctx.fillText('窓より早く飛び出す＝牽制気味の間に刺される／遅い＝スタートを切れず送球でアウト',W/2,262);
    ctx.fillText('上級ほど針が速く窓が狭い。3盗塁死で交代',W/2,286);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で開始',W/2,352);
    ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='14px sans-serif';ctx.fillText('BEST '+best,W/2,384);
  }
  if(state==='over'){
    ctx.fillStyle='rgba(4,8,4,0.85)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#ff6b6b';ctx.font='bold 46px sans-serif';ctx.fillText('3盗塁死…交代',W/2,222);
    ctx.fillStyle='#fff';ctx.font='bold 40px sans-serif';ctx.fillText('SCORE '+score,W/2,290);
    ctx.fillStyle='rgba(255,255,255,0.85)';ctx.font='19px sans-serif';ctx.fillText('盗塁 '+outs+'   BEST '+best,W/2,330);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で もう一度',W/2,402);
  }

  if(flash>0.02){ctx.globalAlpha=flash*0.5;ctx.fillStyle=flashCol;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}
  ctx.restore();

  ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,0.4)';ctx.font='12px sans-serif';
  ctx.fillText('スタートを切れ：往復する針を緑の「スタート窓」で止めてgood jump＝盗塁成功。早い/遅いは盗塁死、3盗塁死で交代',W/2,H-8);
}

function frame(ts){let dt=ts-last;last=ts;if(dt>60)dt=60;if(dt<0)dt=0;update(dt);render();requestAnimationFrame(frame);}
requestAnimationFrame(frame);

// ---------- test hook ----------
window.__gj={
  start, go:()=>go(),
  get state(){return state;},
  get score(){return score;},
  get outs(){return outs;},
  get fails(){return fails;},
  get info(){return {state,phase,pos,bandC,bandW,bandLo:bandLo(),bandHi:bandHi(),tough,acted,result,outs,fails,lvl,timeLeft,
    canAct:(phase==='time'&&!acted)};}
};
})();
</script>
</body>
</html>
