<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>重盗を防げ (First & Third)</title>
<style>
  html,body{margin:0;height:100%;background:#0a0f0a;overflow:hidden;
    font-family:-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  #stage{position:relative;width:100vw;height:100vh;max-width:calc(100vh*1.5);max-height:calc(100vw/1.5);aspect-ratio:900/600;}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;border-radius:6px;}
</style>
</head>
<body>
<div id="wrap"><div id="stage"><canvas id="cv"></canvas></div></div>
<script>
(function(){
const W=900,H=600,cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let DPR=1;
function fit(){DPR=Math.min(2,window.devicePixelRatio||1);cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
fit();addEventListener('resize',fit);

// ---------- audio ----------
let AC=null;function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function tone(f,d,type,v,sweep){const a=ac();if(!a)return;const t=a.currentTime,o=a.createOscillator(),g=a.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(sweep)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+sweep),t+d);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v||0.2,t+0.008);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+0.02);}
function noise(d,v,hp){const a=ac();if(!a)return;const t=a.currentTime,n=Math.floor(a.sampleRate*d),buf=a.createBuffer(1,n,a.sampleRate),ch=buf.getChannelData(0);
  for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource();s.buffer=buf;
  const f=a.createBiquadFilter();f.type='highpass';f.frequency.value=hp||600;const g=a.createGain();g.gain.value=v||0.2;
  s.connect(f);f.connect(g);g.connect(a.destination);s.start(t);s.stop(t+d+0.02);}
const S={
  throw:()=>{noise(0.04,0.12,700);tone(440,0.05,'square',0.09,180);},
  out:()=>{noise(0.05,0.12,600);[720,980,1240].forEach((f,i)=>setTimeout(()=>tone(f,0.11,'triangle',0.17),i*66));},
  bad:()=>{noise(0.16,0.22,320);tone(170,0.18,'sawtooth',0.12,-50);},
  run:()=>{noise(0.1,0.14,360);tone(220,0.14,'sawtooth',0.1,-40);},
  streak:()=>{[700,930,1170,1400].forEach((f,i)=>setTimeout(()=>tone(f,0.1,'triangle',0.16),i*60));},
  over:()=>{[440,330,247,175].forEach((f,i)=>setTimeout(()=>tone(f,0.3,'triangle',0.2),i*160));}
};

// ---------- geometry ----------
const HOME={x:450,y:474}, FIRST={x:672,y:322}, SECOND={x:450,y:180}, THIRD={x:228,y:322};
// throw dirs: 0=THIRD(back-pick), 1=HOME, 2=SECOND
const DEST=[THIRD,HOME,SECOND];
const DNAME=['三塁','本塁','二塁'];

// ---------- state ----------
let state='title', phase='read', t=0, plays=0;
let score=0, combo=0, best=+(localStorage.getItem('firstthird_best')||0);
let outs=0, fails=0, lvl=1;   // outs = correct plays
let clock=0, coverT=760, pressT=1440, beh='hold', correct=2;
let r1u=0;
let acted=false, choice=-1, result=null, resultT=0, msg='', throwU=0, r3done=0;
let shake=0, flash=0, flashCol='#fff', last=performance.now();
let parts=[], pops=[];

function rnd(a,b){return a+Math.random()*(b-a);}
function chance(p){return Math.random()<p;}
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function lerp(a,b,u){return a+(b-a)*u;}
function easeOut(u){return 1-Math.pow(1-u,2);}

function params(){ return {
  cover:Math.max(460,840-lvl*54),
  react:Math.max(380,780-lvl*58)
};}

function reset(){state='title';score=0;combo=0;outs=0;fails=0;lvl=1;plays=0;result=null;parts=[];pops=[];}
function newPlay(){
  plays++; lvl=Math.min(7,1+Math.floor(outs/4));
  const p=params();
  coverT=p.cover; pressT=coverT+p.react;
  const r=Math.random(); beh = r<0.4?'hold' : r<0.7?'home' : 'far';
  correct = beh==='hold'?2 : beh==='home'?1 : 0;   // hold->2nd, home->home, far->3rd
  clock=0; acted=false; choice=-1; result=null; phase='read'; msg=''; resultT=0; throwU=0; r3done=0; r1u=0;
}
function start(){ if(!ac())ac(); if(AC&&AC.state==='suspended')AC.resume(); reset(); state='play'; newPlay(); }

function r3lead(){ // 0..1 how far R3 is off third toward home / its commitment
  const u=clamp(clock/Math.max(1,pressT),0,1);
  if(beh==='hold') return 0.12*easeOut(clamp(clock/coverT,0,1));
  if(beh==='home') return (clock<coverT? 0.28*easeOut(clock/coverT) : 0.28+0.72*easeOut((clock-coverT)/Math.max(1,pressT-coverT)));
  return 0.6*easeOut(clamp(clock/coverT,0,1)); // far: big lead, then hovers
}

function throwTo(dir){
  if(state==='title'){start();return;}
  if(state==='over'){ if(resultT>0.4){reset();start();} return; }
  if(state!=='play'||phase!=='read'||acted) return;
  acted=true; choice=dir; S.throw();
  if(dir===correct){ resolve('out'); } else { resolve('wrong'); }
}

function resolve(kind){
  phase='result'; result=kind; resultT=0;
  const good=(kind==='out');
  if(good){
    outs++; combo++;
    let add=Math.round(120*(1+Math.min(9,combo-1)*0.16)); score+=add;
    S.out(); flash=1;flashCol='#ffe08a';shake=6; burst(DEST[correct].x,DEST[correct].y,'#ffe08a',16,6);
    pop(DEST[correct].x,DEST[correct].y-28,'アウト！ +'+add,'#fff3c4');
    pop(450,130, beh==='hold'?'二塁で刺した！':beh==='home'?'本塁で刺した！':'飛び出しをバックピック！','#ffe08a');
    if(combo>=2)pop(450,170,'コンボ x'+combo,'#ffd24d');
    if(combo>0&&combo%5===0)S.streak();
    msg=beh==='hold'?'三塁走者を確認して二塁で刺した！':beh==='home'?'本盗を読んで本塁で刺した！':'飛び出した三塁走者を逆に刺した！';
  } else {
    fails++; combo=0; flash=1;flashCol='#ff5b5b';shake=8; S.run();
    if(beh==='home'&&choice===2) msg='二塁へ投げた隙に本盗を許した…';
    else if(beh==='hold'&&choice!==2) msg='空いた塁へ投げて二塁も許した…';
    else if(beh==='far'&&choice!==0) msg='飛び出しを見逃した…';
    else msg='判断ミス…走者に走られた';
    pop(450,130,'走られた','#ffb0b0');
  }
  if(fails>=3){ state='over'; resultT=0; S.over(); if(score>best){best=score;localStorage.setItem('firstthird_best',best);} }
}

// ---------- input ----------
cv.addEventListener('pointerdown',e=>{e.preventDefault();
  if(state==='title'){start();return;}
  if(state==='over'){ if(resultT>0.4){reset();start();} return; }
  const r=cv.getBoundingClientRect(); const x=(e.clientX-r.left)/r.width, y=(e.clientY-r.top)/r.height;
  if(y>0.6) throwTo(1);            // lower area = home
  else throwTo(x<0.5?0:2);         // upper left = 3rd, upper right = 2nd
});
addEventListener('keydown',e=>{
  if(e.repeat)return;
  if(e.code==='ArrowLeft'||e.code==='KeyA'){e.preventDefault();throwTo(0);}
  else if(e.code==='ArrowDown'||e.code==='KeyS'){e.preventDefault();throwTo(1);}
  else if(e.code==='ArrowRight'||e.code==='KeyD'){e.preventDefault();throwTo(2);}
  else if(e.code==='Space'||e.code==='Enter'){e.preventDefault(); if(state!=='play')throwTo(1);}
});

// ---------- particles ----------
function burst(x,y,c,n,sp){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=rnd(sp*0.3,sp);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:1,c});}}
function pop(x,y,txt,c){pops.push({x,y,txt,c,life:1});}

// ---------- update ----------
function update(dt){
  shake*=Math.pow(0.86,dt/16.7); if(shake<0.3)shake=0;
  flash*=Math.pow(0.9,dt/16.7);
  for(const p of parts){p.vx*=0.96;p.vy=p.vy*0.96+0.28;p.x+=p.vx*dt/16.7;p.y+=p.vy*dt/16.7;p.life-=dt/16.7*0.026;}
  parts=parts.filter(p=>p.life>0);
  for(const p of pops){p.y-=dt/16.7*0.5;p.life-=dt/16.7*0.02;}
  pops=pops.filter(p=>p.life>0);

  if(state!=='play'){ if(state==='over')resultT+=dt/1000; return; }
  t+=dt;
  if(phase==='read'){
    clock+=dt; r1u=clamp(clock/pressT,0,1);
    if(!acted && clock>=pressT){ resolve('timeout'); }
    return;
  }
  if(phase==='result'){
    resultT+=dt/1000; throwU=Math.min(1,throwU+dt/230); r3done=Math.min(1,r3done+dt/300);
    if(resultT>1.15 && state==='play') newPlay();
    return;
  }
}

// ---------- render ----------
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function drawScene(){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#1f5f2a');g.addColorStop(1,'#123a1b');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#7a5230';ctx.beginPath();ctx.moveTo(HOME.x,HOME.y);ctx.lineTo(FIRST.x+16,FIRST.y);ctx.lineTo(SECOND.x,SECOND.y-16);ctx.lineTo(THIRD.x-16,THIRD.y);ctx.closePath();ctx.fill();
  ctx.fillStyle='#2c7a3b';ctx.beginPath();ctx.moveTo(HOME.x,HOME.y-14);ctx.lineTo(FIRST.x-14,FIRST.y);ctx.lineTo(SECOND.x,SECOND.y+14);ctx.lineTo(THIRD.x+14,THIRD.y);ctx.closePath();ctx.fill();
  ctx.strokeStyle='rgba(240,220,180,0.5)';ctx.lineWidth=4;
  ctx.beginPath();ctx.moveTo(HOME.x,HOME.y);ctx.lineTo(FIRST.x,FIRST.y);ctx.lineTo(SECOND.x,SECOND.y);ctx.lineTo(THIRD.x,THIRD.y);ctx.closePath();ctx.stroke();
  for(const bb of [[HOME,'本'],[FIRST,'一'],[SECOND,'二'],[THIRD,'三']]){ const b=bb[0];
    ctx.save();ctx.translate(b.x,b.y);ctx.rotate(Math.PI/4);ctx.fillStyle='#f2f4f6';ctx.fillRect(-9,-9,18,18);ctx.restore(); }
}
function drawFig(x,y,col,s){ s=s||1; ctx.fillStyle='rgba(0,0,0,0.22)';ctx.beginPath();ctx.ellipse(x,y+12*s,10*s,3.5*s,0,0,6.28);ctx.fill();
  ctx.fillStyle=col;rr(x-7*s,y-9*s,14*s,22*s,6);ctx.fill();
  ctx.fillStyle='#f2c9a0';ctx.beginPath();ctx.arc(x,y-13*s,5.5*s,0,6.28);ctx.fill(); }

function render(){
  ctx.save();
  if(shake>0)ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
  drawScene();

  if(state==='play'){
    // R1 first->second (the steal)
    let r1=(phase==='read')?r1u:clamp((choice===2&&result==='out')?0.7:1,0,1);
    const r1x=lerp(FIRST.x,SECOND.x,easeOut(r1)), r1y=lerp(FIRST.y,SECOND.y,easeOut(r1));
    drawFig(r1x,r1y,'#e23c3c',1.0);
    // R3 near third, behavior-driven
    let lead=(phase==='read')?r3lead():r3lead();
    if(phase==='result'){ if(beh==='home'&&result!=='out') lead=Math.min(1,lead+ r3done*0.5); }
    const r3x=lerp(THIRD.x,HOME.x,lead), r3y=lerp(THIRD.y,HOME.y,lead);
    // highlight R3 (the key read)
    ctx.strokeStyle='rgba(255,210,77,0.5)';ctx.lineWidth=2;ctx.setLineDash([4,4]);ctx.beginPath();ctx.arc(r3x,r3y,20,0,6.28);ctx.stroke();ctx.setLineDash([]);
    drawFig(r3x,r3y,'#e2683c',1.05);
    ctx.fillStyle='rgba(255,210,77,0.85)';ctx.font='bold 12px sans-serif';ctx.textAlign='center';ctx.fillText('三塁走者を読め',r3x,r3y-28);

    // catcher (you) at home
    drawFig(HOME.x+18,HOME.y-6,'#2b6cff',1.05);

    // ball / throw
    if(phase==='read'){ ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(HOME.x+10,HOME.y+2,7,0,6.28);ctx.fill(); }
    else if(result==='out'){ const d=DEST[correct]; const bx=lerp(HOME.x,d.x,easeOut(throwU)), by=lerp(HOME.y,d.y,easeOut(throwU));
      ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(bx,by,7,0,6.28);ctx.fill(); }
    else if(choice>=0){ const d=DEST[choice]; const bx=lerp(HOME.x,d.x,easeOut(throwU)), by=lerp(HOME.y,d.y,easeOut(throwU));
      ctx.globalAlpha=clamp(1.3-resultT,0,1);ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(bx,by,7,0,6.28);ctx.fill();ctx.globalAlpha=1; }

    // pressure timer
    const bw=200; ctx.fillStyle='rgba(0,0,0,0.3)';rr(W/2-bw/2-3,H-42,bw+6,12,6);ctx.fill();
    ctx.fillStyle= r1u>0.7?'#ff6b6b':'#ffd24d';rr(W/2-bw/2,H-40,bw*(1-clamp(clock/pressT,0,1)),8,4);ctx.fill();
    ctx.fillStyle='rgba(255,255,255,0.6)';ctx.font='11px sans-serif';ctx.textAlign='center';ctx.fillText('送球猶予',W/2,H-46);
  }

  for(const p of parts){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,3.2,0,6.28);ctx.fill();}
  ctx.globalAlpha=1;
  for(const p of pops){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.font='bold 22px sans-serif';ctx.textAlign='center';ctx.fillText(p.txt,p.x,p.y);}
  ctx.globalAlpha=1;

  // HUD
  ctx.textAlign='left';ctx.fillStyle='#fff';ctx.font='bold 26px sans-serif';ctx.fillText('SCORE '+score,20,36);
  ctx.textAlign='right';ctx.fillStyle='rgba(255,255,255,0.9)';ctx.font='14px sans-serif';ctx.fillText('好判断 '+outs+'  Lv'+lvl,W-20,24);
  ctx.fillText('失点',W-92,46);
  for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(W-60+i*20,41,7,0,6.28);ctx.fillStyle=i<fails?'#ff5b5b':'rgba(255,255,255,0.25)';ctx.fill();}
  if(combo>=2){ctx.textAlign='center';ctx.fillStyle='#ffd24d';ctx.font='bold 18px sans-serif';ctx.fillText('コンボ x'+combo,W/2,250);}

  if(state==='play'&&phase==='read'){ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,0.9)';ctx.font='bold 15px sans-serif';
    ctx.fillText('一・三塁で重盗！ 三塁走者の動きを読んで投げる塁を選べ（三塁←／本塁↓／二塁→）',W/2,44);}
  if(state==='play'&&phase==='result'&&msg){ctx.textAlign='center';ctx.fillStyle=(result==='out')?'#9ff0b8':'#ff9a9a';ctx.font='bold 20px sans-serif';ctx.fillText(msg,W/2,44);}

  if(state==='title'){
    ctx.fillStyle='rgba(5,10,6,0.8)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='bold 42px sans-serif';ctx.fillText('重盗を防げ',W/2,104);
    ctx.fillStyle='#ffd23e';ctx.font='bold 22px sans-serif';ctx.fillText('First & Third',W/2,140);
    ctx.fillStyle='rgba(255,255,255,0.92)';ctx.font='16px sans-serif';
    ctx.fillText('一・三塁のピンチ。二塁走者が走る中、三塁走者の動きを読んで最善の送球を選べ',W/2,190);
    ctx.fillStyle='rgba(255,255,255,0.66)';ctx.font='14px sans-serif';
    ctx.fillText('毎回、一塁走者が二塁へスタート。カギは三塁走者（オレンジ）の動き',W/2,230);
    ctx.fillText('三塁走者が動かない → 二塁へ送球（→キー/右上）で一塁走者を刺す',W/2,252);
    ctx.fillText('三塁走者が本盗を狙う → 本塁へ送球（↓キー/画面下）で刺す',W/2,274);
    ctx.fillText('三塁走者が大きく飛び出す → 三塁へバックピック（←キー/左上）で刺す',W/2,296);
    ctx.fillText('投げる塁を間違える/遅れると走られて失点。速い好判断ほど高得点。3失点で交代',W/2,318);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で開始',W/2,384);
    ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='14px sans-serif';ctx.fillText('BEST '+best+'　　三塁←／本塁↓／二塁→',W/2,416);
  }
  if(state==='over'){
    ctx.fillStyle='rgba(5,10,6,0.84)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#ff6b6b';ctx.font='bold 46px sans-serif';ctx.fillText('3失点…交代',W/2,222);
    ctx.fillStyle='#fff';ctx.font='bold 40px sans-serif';ctx.fillText('SCORE '+score,W/2,290);
    ctx.fillStyle='rgba(255,255,255,0.85)';ctx.font='19px sans-serif';ctx.fillText('好判断 '+outs+'   BEST '+best,W/2,330);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で もう一度',W/2,402);
  }

  if(flash>0.02){ctx.globalAlpha=flash*0.5;ctx.fillStyle=flashCol;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}
  ctx.restore();

  ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,0.4)';ctx.font='12px sans-serif';
  ctx.fillText('三塁走者の動きを読み、二塁（→）/本塁（↓）/三塁バックピック（←）を選ぶ。誤り/遅れは失点。3失点で交代',W/2,H-8);
}

function frame(ts){let dt=ts-last;last=ts;if(dt>60)dt=60;if(dt<0)dt=0;update(dt);render();requestAnimationFrame(frame);}
requestAnimationFrame(frame);

// ---------- test hook ----------
window.__ft={
  start, throwTo:(d)=>throwTo(d),
  get state(){return state;},
  get score(){return score;},
  get outs(){return outs;},
  get fails(){return fails;},
  get info(){return {state,phase,beh,correct,clock,coverT,pressT,committed:(clock>=coverT),
    canThrow:(phase==='read'&&!acted),acted,choice,result,outs,fails,lvl};}
};
})();
</script>
</body>
</html>
