<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ハーフウェイ (Read the Fly)</title>
<style>
  html,body{margin:0;height:100%;background:#0b120a;overflow:hidden;
    font-family:-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  #stage{position:relative;width:100vw;height:100vh;max-width:calc(100vh*1.5);max-height:calc(100vw/1.5);aspect-ratio:900/600;}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;border-radius:6px;}
</style>
</head>
<body>
<div id="wrap"><div id="stage"><canvas id="cv"></canvas></div></div>
<script>
(function(){
const W=900,H=600,cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let DPR=1;
function fit(){DPR=Math.min(2,window.devicePixelRatio||1);cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
fit();addEventListener('resize',fit);

// ---------- audio ----------
let AC=null;function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function tone(f,d,type,v,sweep){const a=ac();if(!a)return;const t=a.currentTime,o=a.createOscillator(),g=a.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(sweep)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+sweep),t+d);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v||0.2,t+0.008);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+0.02);}
function noise(d,v,hp){const a=ac();if(!a)return;const t=a.currentTime,n=Math.floor(a.sampleRate*d),buf=a.createBuffer(1,n,a.sampleRate),ch=buf.getChannelData(0);
  for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource();s.buffer=buf;
  const f=a.createBiquadFilter();f.type='highpass';f.frequency.value=hp||600;const g=a.createGain();g.gain.value=v||0.2;
  s.connect(f);f.connect(g);g.connect(a.destination);s.start(t);s.stop(t+d+0.02);}
const S={
  move:()=>{noise(0.05,0.1,500);tone(220,0.06,'sine',0.08);},
  catch:()=>{noise(0.05,0.16,600);tone(300,0.07,'triangle',0.1,-40);},
  drop:()=>{noise(0.11,0.16,300);tone(180,0.1,'square',0.08,-40);},
  safe:()=>{[720,960,1200].forEach((f,i)=>setTimeout(()=>tone(f,0.11,'triangle',0.18),i*70));},
  out:()=>{noise(0.14,0.2,400);tone(190,0.16,'sawtooth',0.12,-60);},
  streak:()=>{[660,880,1100,1320].forEach((f,i)=>setTimeout(()=>tone(f,0.1,'triangle',0.16),i*60));},
  over:()=>{[440,330,247,175].forEach((f,i)=>setTimeout(()=>tone(f,0.3,'triangle',0.2),i*160));}
};

// ---------- geometry ----------
const BFROM={x:250,y:432}, BTO={x:650,y:432}, MID={x:450,y:432}, OF={x:450,y:150};

// ---------- state ----------
let state='title', phase='fly', t=0, plays=0;
let score=0, combo=0, best=+(localStorage.getItem('halfway_best')||0);
let safes=0, outs=0, lvl=1;
let clock=0, resolveT=1100, deadline=1600, outcome='caught', acted=false, choice=null;
let fake=0, ballY=-10, revealP=0, runX=MID.x, slideP=0;
let result=null, resultT=0, msg='';
let shake=0, flash=0, flashCol='#fff', last=performance.now();
let parts=[], pops=[];

function rnd(a,b){return a+Math.random()*(b-a);}
function chance(p){return Math.random()<p;}
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function lerp(a,b,u){return a+(b-a)*u;}
function easeOut(u){return 1-Math.pow(1-u,2);}

function params(){ return { fly:Math.max(820,1360-lvl*66), window:Math.max(300,620-lvl*46), fake:lvl>=3?0.45:0 }; }

function reset(){state='title';score=0;combo=0;safes=0;outs=0;lvl=1;plays=0;result=null;parts=[];pops=[];}
function newFly(){
  plays++; lvl=Math.min(7,1+Math.floor(safes/4));
  const p=params(); resolveT=p.fly; deadline=resolveT+p.window;
  outcome=chance(0.5)?'caught':'dropped';
  fake=(p.fake>0&&chance(0.55))?1:0;
  clock=0; acted=false; choice=null; ballY=-10; revealP=0; runX=MID.x; slideP=0;
  result=null; phase='fly'; msg='';
}
function start(){ if(!ac())ac(); if(AC&&AC.state==='suspended')AC.resume(); reset(); state='play'; newFly(); }

// dir: 'back' (retreat/tag up) or 'go' (advance)
function act(dir){
  if(state==='title'){start();return;}
  if(state==='over'){ if(resultT>0.4){reset();start();} return; }
  if(state!=='play'||phase!=='fly'||acted) return;
  acted=true; choice=dir; S.move();
  if(clock<resolveT){ resolve('early'); return; }
  const correct = (outcome==='caught'&&dir==='back') || (outcome==='dropped'&&dir==='go');
  resolve(correct?'safe':(outcome==='caught'?'doubled':'missed'));
}

function resolve(kind){
  phase='result'; result=kind; resultT=0;
  if(kind==='safe'){
    safes++; combo++; const fast=(clock-resolveT)<(deadline-resolveT)*0.45;
    const add=Math.round((fast?150:105)*(1+Math.min(9,combo-1)*0.16)); score+=add;
    (outcome==='caught')?S.catch():S.drop(); setTimeout(()=>S.safe(),160);
    flash=1;flashCol='#9fe0ff';shake=6;
    const bx=(choice==='go')?BTO.x:BFROM.x; burst(bx,MID.y,'#bfe6ff',16,5.5);
    pop(450, MID.y-70, (outcome==='caught'?'戻ってセーフ！ +':'進塁成功！ +')+add,'#dff3ff');
    if(fast)pop(450,MID.y-96,'good read！','#9fe0ff');
    if(combo>=2)pop(450,MID.y-44,'コンボ x'+combo,'#ffd24d');
    if(combo>0&&combo%5===0)S.streak();
    msg=(outcome==='caught')?'捕球を見て素早く帰塁！':'落球を見て一気に進塁！';
  } else {
    outs++; combo=0; flash=1;flashCol='#ff5b5b';shake=8; S.out();
    if(kind==='early') msg='早い！ 捕るか落とすか見極める前に動いた';
    else if(kind==='doubled') msg='飛び出した！ 捕られて帰れずダブルプレー';
    else if(kind==='missed') msg='ちゃんと落ちた！ 進まず好機を逃した';
    else msg='遅い！ 判断が遅れてアウト';   // late
    pop(450,MID.y-64,'アウト','#ffb0b0');
  }
  if(outs>=3){ state='over'; resultT=0; S.over(); if(score>best){best=score;localStorage.setItem('halfway_best',best);} }
}

// ---------- input ----------
function dirFromEvent(e){ const r=cv.getBoundingClientRect(); const x=(e.clientX-r.left)/r.width; return x<0.5?'back':'go'; }
cv.addEventListener('pointerdown',e=>{e.preventDefault();
  if(state!=='play'){act('back');return;}
  act(dirFromEvent(e));
});
addEventListener('keydown',e=>{
  const c=e.code;
  if(c==='ArrowLeft'||c==='KeyA'){e.preventDefault();act('back');}
  else if(c==='ArrowRight'||c==='KeyD'){e.preventDefault();act('go');}
  else if(c==='Space'||c==='Enter'){e.preventDefault(); if(state!=='play')act('back');}
});

// ---------- particles ----------
function burst(x,y,c,n,sp){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=rnd(sp*0.3,sp);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:1,c});}}
function pop(x,y,txt,c){pops.push({x,y,txt,c,life:1});}

// ---------- update ----------
function update(dt){
  shake*=Math.pow(0.86,dt/16.7); if(shake<0.3)shake=0;
  flash*=Math.pow(0.9,dt/16.7);
  for(const p of parts){p.vx*=0.96;p.vy=p.vy*0.96+0.28;p.x+=p.vx*dt/16.7;p.y+=p.vy*dt/16.7;p.life-=dt/16.7*0.026;}
  parts=parts.filter(p=>p.life>0);
  for(const p of pops){p.y-=dt/16.7*0.5;p.life-=dt/16.7*0.02;}
  pops=pops.filter(p=>p.life>0);

  if(state!=='play'){ if(state==='over')resultT+=dt/1000; return; }
  t+=dt;
  if(phase==='fly'){
    clock+=dt;
    ballY = lerp(-10, OF.y-14, easeOut(Math.min(1,clock/resolveT)));
    if(clock>=resolveT) revealP=Math.min(1,revealP+dt/240);
    if(!acted && clock>deadline){ resolve('late'); }
    return;
  }
  if(phase==='result'){
    resultT+=dt/1000; revealP=Math.min(1,revealP+dt/240);
    slideP=Math.min(1,slideP+dt/380);
    const tgt=(choice==='go')?BTO.x:BFROM.x; runX=lerp(MID.x,tgt,easeOut(slideP));
    if(resultT>1.25 && state==='play') newFly();
    return;
  }
}

// ---------- render ----------
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function drawScene(){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#2b7a3a');g.addColorStop(1,'#1c5626');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  for(let i=0;i<10;i++){ctx.fillStyle=i%2?'rgba(255,255,255,0.04)':'rgba(0,0,0,0.045)';ctx.fillRect(0,i*60,W,30);}
  // basepath
  ctx.strokeStyle='rgba(210,170,120,0.6)';ctx.lineWidth=26;ctx.beginPath();ctx.moveTo(BFROM.x,BFROM.y);ctx.lineTo(BTO.x,BTO.y);ctx.stroke();
  // bases
  for(const b of [BFROM,BTO]){ ctx.save();ctx.translate(b.x,b.y);ctx.rotate(Math.PI/4);ctx.fillStyle='#f2f4f6';ctx.fillRect(-13,-13,26,26);ctx.restore(); }
  ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='12px sans-serif';ctx.textAlign='center';
  ctx.fillText('◀ 戻る(タグアップ)',BFROM.x,BFROM.y+40); ctx.fillText('進む(GO) ▶',BTO.x,BTO.y+40);
}
function drawFig(x,y,col){
  ctx.fillStyle='rgba(0,0,0,0.22)';ctx.beginPath();ctx.ellipse(x,y+15,13,5,0,0,6.28);ctx.fill();
  ctx.fillStyle=col;rr(x-10,y-12,20,30,7);ctx.fill();
  ctx.fillStyle='#f2c9a0';ctx.beginPath();ctx.arc(x,y-19,8,0,6.28);ctx.fill();
}

function render(){
  ctx.save();
  if(shake>0)ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
  drawScene();

  if(state==='play'){
    // outfielder + catch/drop reveal
    const showDrop = (phase!=='fly'||clock>=resolveT) ? ((outcome==='dropped')? revealP : 0) : 0;
    // deceptive dive when fake
    const dive = fake? Math.min(1,revealP)*0.5 : 0;
    ctx.save();ctx.translate(OF.x,OF.y);ctx.rotate(dive*(outcome==='caught'?0.3:-0.3));
    drawFig(0,0,'#c23c3c');
    // glove up
    ctx.strokeStyle='#c23c3c';ctx.lineWidth=6;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(0,-8);ctx.lineTo(6,-30);ctx.stroke();
    ctx.fillStyle='#7a4a22';ctx.beginPath();ctx.arc(7,-34,11,0,6.28);ctx.fill();
    ctx.restore();
    // ball
    let bx=OF.x+7, by=(phase==='fly')?ballY:(OF.y-34);
    if(clock>=resolveT || phase==='result'){
      if(outcome==='caught'){ by=OF.y-34; bx=OF.x+7; }
      else { by=OF.y+18+showDrop*22; bx=OF.x+14+showDrop*30; }  // ball drops to ground
    }
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(bx,by,7,0,6.28);ctx.fill();
    ctx.strokeStyle='#d23c3c';ctx.lineWidth=1.2;ctx.beginPath();ctx.arc(bx-3,by,5,-0.7,0.7);ctx.stroke();
    // reveal label
    if((clock>=resolveT||phase==='result') && revealP>0.4){ ctx.fillStyle=outcome==='caught'?'#ffd24d':'#9fe0ff';ctx.font='bold 20px sans-serif';ctx.textAlign='center';
      ctx.fillText(outcome==='caught'?'キャッチ！':'落球！',OF.x,OF.y+62); }

    // runner (shuffling at halfway during fly, slides on result)
    const rx = (phase==='fly')? MID.x + Math.sin(clock/260)*8*(1-clock/resolveT) : runX;
    drawFig(rx,MID.y,'#2b6cff');

    // timing ring at the catch point
    if(phase==='fly'){ const u=clock/resolveT; const rad=lerp(70,26,clamp(u,0,1));
      ctx.strokeStyle=(clock>=resolveT&&clock<=deadline)?'rgba(150,240,170,0.85)':'rgba(255,255,255,0.28)';
      ctx.lineWidth=3;ctx.beginPath();ctx.arc(OF.x,OF.y,rad,0,6.28);ctx.stroke(); }
  }

  for(const p of parts){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,3.2,0,6.28);ctx.fill();}
  ctx.globalAlpha=1;
  for(const p of pops){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.font='bold 22px sans-serif';ctx.textAlign='center';ctx.fillText(p.txt,p.x,p.y);}
  ctx.globalAlpha=1;

  // HUD
  ctx.textAlign='left';ctx.fillStyle='#fff';ctx.font='bold 26px sans-serif';ctx.fillText('SCORE '+score,20,36);
  ctx.textAlign='right';ctx.fillStyle='rgba(255,255,255,0.9)';ctx.font='14px sans-serif';ctx.fillText('好走塁 '+safes+'  Lv'+lvl,W-20,24);
  ctx.fillText('アウト',W-100,46);
  for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(W-60+i*20,41,7,0,6.28);ctx.fillStyle=i<outs?'#ff5b5b':'rgba(255,255,255,0.25)';ctx.fill();}
  if(combo>=2){ctx.textAlign='center';ctx.fillStyle='#ffd24d';ctx.font='bold 18px sans-serif';ctx.fillText('コンボ x'+combo,W/2,86);}

  if(state==='play'&&phase==='fly'){ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,0.9)';ctx.font='bold 15px sans-serif';
    ctx.fillText('捕ったら戻る（タグアップ）、落としたら進む。捕球/落球を見極めて即断（左=戻る / 右=進む）',W/2,40);}
  if(state==='play'&&phase==='result'&&msg){ctx.textAlign='center';ctx.fillStyle=result==='safe'?'#9ff0b8':'#ff9a9a';ctx.font='bold 20px sans-serif';ctx.fillText(msg,W/2,40);}

  if(state==='title'){
    ctx.fillStyle='rgba(6,12,8,0.72)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='bold 46px sans-serif';ctx.fillText('ハーフウェイ',W/2,132);
    ctx.fillStyle='#ffd23e';ctx.font='bold 22px sans-serif';ctx.fillText('Read the Fly',W/2,168);
    ctx.fillStyle='rgba(255,255,255,0.92)';ctx.font='16px sans-serif';
    ctx.fillText('飛球でハーフウェイに出た走者の判断。捕るか落とすかを見極めろ',W/2,216);
    ctx.fillStyle='rgba(255,255,255,0.66)';ctx.font='14px sans-serif';
    ctx.fillText('外野手が捕球したら素早く戻ってタグアップ（左クリック/A/←）＝ダブルプレー回避',W/2,254);
    ctx.fillText('落球（ヒット）なら一気に進塁（右クリック/D/→）＝好走塁で得点',W/2,276);
    ctx.fillText('捕られたのに飛び出すとダブルプレー、落ちたのに戻ると好機を逃す',W/2,298);
    ctx.fillText('見極める前に動くと外し、判断が遅いとアウト。上級はダイビングの“見せ球”に注意。3アウトで交代',W/2,320);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で開始',W/2,398);
    ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='14px sans-serif';ctx.fillText('BEST '+best+'　　左=戻る / 右=進む',W/2,432);
  }
  if(state==='over'){
    ctx.fillStyle='rgba(6,12,8,0.8)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#ff6b6b';ctx.font='bold 46px sans-serif';ctx.fillText('3アウト…交代',W/2,222);
    ctx.fillStyle='#fff';ctx.font='bold 40px sans-serif';ctx.fillText('SCORE '+score,W/2,290);
    ctx.fillStyle='rgba(255,255,255,0.85)';ctx.font='19px sans-serif';ctx.fillText('好走塁 '+safes+'   BEST '+best,W/2,330);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で もう一度',W/2,402);
  }

  if(flash>0.02){ctx.globalAlpha=flash*0.5;ctx.fillStyle=flashCol;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}
  ctx.restore();

  ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,0.4)';ctx.font='12px sans-serif';
  ctx.fillText('捕球=戻る/落球=進む。飛び出し=ダブルプレー、戻り過ぎ=好機逃し、早い=見誤り、遅い=アウト。3アウトで交代',W/2,H-8);
}

function frame(ts){let dt=ts-last;last=ts;if(dt>60)dt=60;if(dt<0)dt=0;update(dt);render();requestAnimationFrame(frame);}
requestAnimationFrame(frame);

// ---------- test hook ----------
window.__hw={
  start, act:(d)=>act(d),
  get state(){return state;},
  get score(){return score;},
  get safes(){return safes;},
  get outs(){return outs;},
  get info(){return {state,phase,outcome,resolved:clock>=resolveT,clock,resolveT,deadline,acted,result,safes,outs,lvl};}
};
})();
</script>
</body>
</html>
