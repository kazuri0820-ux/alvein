<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>インターセプト — Piggy in the Middle</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{width:100%;height:100%;background:#08140c;overflow:hidden;
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,system-ui,sans-serif;
    touch-action:none;user-select:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  #stage{position:relative;aspect-ratio:900/600;max-width:100%;max-height:100%;
    width:auto;height:auto;box-shadow:0 0 60px rgba(0,0,0,.6);}
  canvas{display:block;width:100%;height:100%;border-radius:6px;}
</style>
</head>
<body>
<div id="wrap"><div id="stage"><canvas id="c" width="900" height="600"></canvas></div></div>
<script>
(function(){
"use strict";
const TEST=location.hash.indexOf('test')>=0;
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
const W=900,H=600;
let dpr=Math.max(1,Math.min(2,window.devicePixelRatio||1));
function fit(){ dpr=Math.max(1,Math.min(2,window.devicePixelRatio||1)); cv.width=W*dpr; cv.height=H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0); }
fit(); window.addEventListener('resize',fit);

// ---- audio ----
let AC=null;
function ac(){ if(!AC){ try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){AC=null;} } return AC; }
function tone(f,d,type,g,f2){ const a=ac(); if(!a)return; const o=a.createOscillator(),gg=a.createGain();
  o.type=type||'sine'; o.frequency.setValueAtTime(f,a.currentTime); if(f2)o.frequency.exponentialRampToValueAtTime(f2,a.currentTime+d);
  gg.gain.setValueAtTime(0.0001,a.currentTime); gg.gain.exponentialRampToValueAtTime(g||0.2,a.currentTime+0.01);
  gg.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+d); o.connect(gg); gg.connect(a.destination); o.start(); o.stop(a.currentTime+d+0.02); }
function noise(d,g,cut){ const a=ac(); if(!a)return; const n=Math.floor(a.sampleRate*d),buf=a.createBuffer(1,n,a.sampleRate),ch=buf.getChannelData(0);
  for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(1-i/n); const src=a.createBufferSource(); src.buffer=buf;
  const f=a.createBiquadFilter(); f.type='lowpass'; f.frequency.value=cut||1200; const gg=a.createGain(); gg.gain.value=g||0.2;
  src.connect(f); f.connect(gg); gg.connect(a.destination); src.start(); }
const S={
  pass(n){ noise(0.03,0.14,1600); tone(300+((n||0)%6)*30,0.04,'square',0.08,420); },
  steal(){ noise(0.06,0.4,2000); tone(440,0.08,'square',0.2,660); },
  cheer(){ const a=ac(); if(!a)return; noise(0.7,0.24,1900); for(let i=0;i<5;i++)setTimeout(()=>tone(500+Math.random()*320,0.3,'sine',0.05),i*46); },
  miss(){ noise(0.12,0.3,900); tone(200,0.16,'sawtooth',0.14,90); },
  wind(){ tone(700,0.05,'sine',0.06,520); }
};

// ---- geometry ----
const CX=450, CY=312, RINGR=214, REACH0=26;

// ---- state ----
let state='ready';   // ready, play, over
let score=0, miss=0, streak=0, level=0, passStreak=0, maxPass=8;
let atk=[];          // attacker positions (ring)
let holder=0, phase='hold', pt=0, tellDur=0.42, travelDur=0.34, target=1, prevHolder=-1;
let def={x:CX,y:CY}, tx=CX, ty=CY, reach=REACH0;
let ball={x:0,y:0};
let msg='',msgT=0, subMsg='', popText='',popT=0,popX=0,popY=0,popCol='#fff';
let flash=0,flashCol='#fff',shakeT=0,shakeM=0;
let parts=[], crowd=[], t=0;
const N=5;

let best=0; try{ best=parseInt(localStorage.getItem('ic_best')||'0',10)||0; }catch(e){}
for(let i=0;i<60;i++) crowd.push({x:Math.random()*W,y:6+Math.random()*30,c:['#e8544e','#f0c14b','#4a90d9','#fff','#5cc98a','#c98af0'][i%6],b:Math.random()*6.28});
placeRing(); ball.x=atk[0].x; ball.y=atk[0].y;   // populate ring so ready-screen render is safe

function saveBest(){ try{localStorage.setItem('ic_best',''+best);}catch(e){} }
function levelUp(){ level=Math.min(9,Math.floor(score/4)); }
function placeRing(){ atk=[]; const off=Math.random()*6.28; for(let i=0;i<N;i++){ const a=off+i/N*6.28; atk.push({x:CX+Math.cos(a)*RINGR, y:CY+Math.sin(a)*RINGR, a}); } }
function reset(){ score=0;miss=0;streak=0;level=0;passStreak=0; parts=[]; placeRing(); holder=0;prevHolder=-1; def={x:CX,y:CY};tx=CX;ty=CY;
  startPass(true); state='play'; msg='パスをカット！ 出す先を読んでコースに入れ'; msgT=180; }

function startPass(first){
  levelUp();
  reach=Math.max(18,REACH0-level*0.8);
  tellDur=Math.max(0.2,0.44-level*0.022); travelDur=Math.max(0.2,0.36-level*0.014); maxPass=Math.max(6,9-Math.floor(level/3));
  // pick a target != holder and != prevHolder (avoid immediate return) mostly
  let cand=[]; for(let i=0;i<N;i++){ if(i!==holder && (i!==prevHolder||Math.random()<0.3)) cand.push(i); }
  if(!cand.length){ for(let i=0;i<N;i++) if(i!==holder) cand.push(i); }
  target=cand[Math.floor(Math.random()*cand.length)];
  phase='hold'; pt=0; ball.x=atk[holder].x; ball.y=atk[holder].y;
  if(!first)S.wind();
}
function completePass(){
  passStreak++; prevHolder=holder; holder=target; S.pass(passStreak);
  if(passStreak>=maxPass){ // conceded a rondo
    miss++; passStreak=0; popText='回された…'; popCol='#ff6a5a'; popX=CX;popY=CY-40;popT=1; S.miss(); shakeT=8; shakeM=3; streak=0;
    if(miss>=3){ state='over'; if(score>best){best=score;saveBest();} msg='3回まわされた・終了'; msgT=99999; return; }
  }
  startPass();
}
function intercept(){
  score++; streak++; passStreak=0; if(streak>best&&false){} if(score>best){best=score;saveBest();}
  popText='カット！ +1'; popCol='#8effa8'; popX=ball.x;popY=ball.y-28;popT=1; S.steal(); setTimeout(S.cheer,40);
  flash=0.3; flashCol='#eafff0'; shakeT=8; shakeM=3; burst(ball.x,ball.y,'#eaffe0',12);
  subMsg = streak>=3? streak+'連続カット！':''; if(subMsg){msg='';msgT=40;}
  // new holder = nearest attacker to where ball was, reset
  holder=Math.floor(Math.random()*N); prevHolder=-1; startPass();
}

function burst(x,y,col,n){ for(let i=0;i<n;i++){ const a=Math.random()*6.28,sp=1+Math.random()*4;
  parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-1.5,life:1,col,r:2+Math.random()*3}); } }

// ---- input ----
function setT(e){ const rect=cv.getBoundingClientRect(); tx=(e.clientX-rect.left)/rect.width*W; ty=(e.clientY-rect.top)/rect.height*H; }
cv.addEventListener('pointerdown',e=>{ e.preventDefault(); const a=ac(); if(a&&a.state==='suspended')a.resume();
  if(state==='ready'||state==='over'){ reset(); return; } setT(e); });
cv.addEventListener('pointermove',e=>{ if(state==='play'&&(e.buttons||e.pointerType==='touch')) setT(e); });
window.addEventListener('keydown',e=>{ if(state==='ready'||state==='over'){ if(e.code==='Space'||e.code==='Enter'){e.preventDefault();reset();} return; }
  const s=40; if(e.code==='ArrowLeft'||e.code==='KeyA')tx-=s; else if(e.code==='ArrowRight'||e.code==='KeyD')tx+=s; else if(e.code==='ArrowUp'||e.code==='KeyW')ty-=s; else if(e.code==='ArrowDown'||e.code==='KeyS')ty+=s;
  tx=Math.max(20,Math.min(W-20,tx)); ty=Math.max(60,Math.min(H-20,ty)); });

// ---- update ----
let last=0;
function update(dt){
  t+=dt; if(msgT>0)msgT--; if(flash>0)flash=Math.max(0,flash-dt*2); if(shakeT>0)shakeT--; if(popT>0)popT=Math.max(0,popT-dt*1.4);
  if(state==='play'){
    // defender toward target
    const dx=tx-def.x, dy=ty-def.y, d=Math.hypot(dx,dy), mv=(360+level*10)*dt;
    if(d>1){ const s=Math.min(mv,d)/d; def.x+=dx*s; def.y+=dy*s; }
    def.x=Math.max(30,Math.min(W-30,def.x)); def.y=Math.max(60,Math.min(H-20,def.y));
    // pass phases
    pt+=dt;
    if(phase==='hold'){ ball.x=atk[holder].x; ball.y=atk[holder].y; if(pt>=tellDur){ phase='travel'; pt=0; } }
    else if(phase==='travel'){ const p=Math.min(1,pt/travelDur); ball.x=atk[holder].x+(atk[target].x-atk[holder].x)*p; ball.y=atk[holder].y+(atk[target].y-atk[holder].y)*p;
      if(Math.hypot(def.x-ball.x,def.y-ball.y)<reach){ intercept(); }
      else if(pt>=travelDur){ completePass(); } }
  }
  for(let i=parts.length-1;i>=0;i--){ const q=parts[i]; q.x+=q.vx;q.y+=q.vy;q.vy+=0.14;q.life-=dt*1.1; if(q.life<=0)parts.splice(i,1); }
}

// ---- draw ----
function rr(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }

function drawField(){
  const g=ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,'#155a30'); g.addColorStop(1,'#1e7a40');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#0a1c10'; ctx.fillRect(0,0,W,30);
  for(const c of crowd){ ctx.fillStyle=c.c; ctx.globalAlpha=.3; ctx.fillRect(c.x,c.y,4,3); } ctx.globalAlpha=1;
  for(let i=0;i<7;i++){ ctx.fillStyle=i%2?'rgba(255,255,255,.04)':'rgba(0,0,0,.05)'; ctx.fillRect(0,60+i*74,W,74); }
  // rondo circle
  ctx.strokeStyle='rgba(255,255,255,.14)'; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(CX,CY,RINGR,0,6.28); ctx.stroke();
  // pass lanes (faint) + tell
  if(state==='play'){
    for(let i=0;i<N;i++){ ctx.strokeStyle='rgba(255,255,255,.05)'; ctx.lineWidth=1; }
    if(phase==='hold'){ // tell arrow from holder to target
      const a=atk[holder], b=atk[target]; const mx=a.x+(b.x-a.x)*0.5, my=a.y+(b.y-a.y)*0.5;
      ctx.strokeStyle='rgba(255,90,74,'+(0.4+Math.sin(t*10)*0.2)+')'; ctx.lineWidth=3; ctx.setLineDash([6,7]);
      ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke(); ctx.setLineDash([]);
      const ang=Math.atan2(b.y-a.y,b.x-a.x); ctx.fillStyle='rgba(255,90,74,.85)'; ctx.save(); ctx.translate(b.x-Math.cos(ang)*22,b.y-Math.sin(ang)*22); ctx.rotate(ang); ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(-12,-6); ctx.lineTo(-12,6); ctx.closePath(); ctx.fill(); ctx.restore();
    }
  }
  // attackers
  for(let i=0;i<N;i++){ const A=atk[i]; ctx.save(); ctx.translate(A.x,A.y);
    ctx.fillStyle='rgba(0,0,0,.24)'; ctx.beginPath(); ctx.ellipse(0,12,13,4,0,0,6.28); ctx.fill();
    ctx.fillStyle=(i===holder&&phase==='hold')?'#f0c14b':'#e8544e'; rr(-10,-22,20,26,6); ctx.fill();
    ctx.fillStyle='#f0c39a'; ctx.beginPath(); ctx.arc(0,-27,6,0,6.28); ctx.fill(); ctx.restore(); }
  // defender (you)
  ctx.strokeStyle='rgba(255,255,255,.2)'; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(def.x,def.y,reach,0,6.28); ctx.stroke();
  ctx.save(); ctx.translate(def.x,def.y);
  ctx.fillStyle='rgba(0,0,0,.28)'; ctx.beginPath(); ctx.ellipse(0,13,14,5,0,0,6.28); ctx.fill();
  const run=Math.sin(t*20)*(Math.hypot(tx-def.x,ty-def.y)>10?6:0);
  ctx.strokeStyle='#20304a'; ctx.lineWidth=6; ctx.lineCap='round'; ctx.beginPath(); ctx.moveTo(0,-4); ctx.lineTo(-5-run*0.2,14); ctx.stroke(); ctx.beginPath(); ctx.moveTo(0,-4); ctx.lineTo(5+run*0.2,14); ctx.stroke();
  ctx.fillStyle='#2f7fd6'; rr(-11,-27,22,26,7); ctx.fill(); ctx.fillStyle='#f0c39a'; ctx.beginPath(); ctx.arc(0,-33,7,0,6.28); ctx.fill();
  ctx.restore();
  // ball
  ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(ball.x,ball.y,7,0,6.28); ctx.fill(); ctx.strokeStyle='#123'; ctx.lineWidth=1.3; ctx.stroke();
  if(phase==='travel'){ ctx.strokeStyle='rgba(255,255,255,.35)'; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(atk[holder].x,atk[holder].y); ctx.lineTo(ball.x,ball.y); ctx.stroke(); }
}
function drawPop(){ if(popT>0&&popText){ ctx.textAlign='center'; ctx.globalAlpha=Math.min(1,popT*1.4); ctx.font='bold 22px sans-serif'; ctx.fillStyle=popCol; ctx.fillText(popText,popX,popY-(1-popT)*18); ctx.globalAlpha=1; ctx.textAlign='left'; } }

function hud(x,y,w,h,lab,val,col){
  ctx.fillStyle='rgba(6,20,12,.62)'; rr(x,y,w,h,9); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.6)'; ctx.font='11px sans-serif'; ctx.textAlign='left'; ctx.fillText(lab,x+12,y+19);
  ctx.fillStyle=col||'#fff'; ctx.font='bold 24px sans-serif'; ctx.fillText(val,x+12,y+44);
}
function drawHUD(){
  hud(20,14,150,56,'カット STEALS',''+score,'#8effa8');
  hud(W/2-75,14,150,56,'連続 STREAK',''+streak,'#ffd23e');
  const mc=miss>=2?'#ff6a5a':'#fff';
  hud(W-170,14,150,56,'被回し MISS',miss+' /3',mc); ctx.textAlign='left';
  ctx.fillStyle='rgba(255,255,255,.5)'; ctx.font='12px sans-serif'; ctx.fillText('自己ベスト '+best,22,88);
  // pass counter toward maxPass
  if(state==='play'){ ctx.textAlign='center'; ctx.fillStyle='rgba(255,255,255,.75)'; ctx.font='bold 14px sans-serif';
    ctx.fillText('連続パス '+passStreak+' / '+maxPass+'（回されると被回し）', 450, 102); ctx.textAlign='left'; }
}
function drawMsg(){
  if(msgT>0&&msg){ ctx.textAlign='center'; ctx.font='bold 24px sans-serif'; const w=ctx.measureText(msg).width;
    ctx.fillStyle='rgba(6,18,10,.72)'; rr(450-w/2-16,H-84,w+32,38,9); ctx.fill(); ctx.fillStyle='#fff'; ctx.fillText(msg,450,H-59); ctx.textAlign='left'; }
  if(subMsg&&popT>0){ ctx.textAlign='center'; ctx.fillStyle='rgba(140,255,168,.95)'; ctx.font='bold 18px sans-serif'; ctx.fillText(subMsg,450,H-58); ctx.textAlign='left'; }
}
function drawHint(){ if(state==='play'){ ctx.textAlign='center'; ctx.fillStyle='rgba(255,255,255,.7)'; ctx.font='14px sans-serif';
  ctx.fillText('ドラッグ／マウス追従で移動。赤い矢印＝次のパス先を先読み', 450, H-24); ctx.textAlign='left'; } }
function drawOverlay(){
  ctx.fillStyle='rgba(6,16,10,.76)'; ctx.fillRect(0,0,W,H); ctx.textAlign='center';
  ctx.fillStyle='rgba(140,255,168,.9)'; ctx.font='600 15px sans-serif'; ctx.fillText('SOCCER · RONDO DEFENDER',450,132);
  ctx.fillStyle='#fff'; ctx.font='bold 50px sans-serif'; ctx.fillText('インターセプト',450,190);
  ctx.fillStyle='#ffd23e'; ctx.font='bold 21px sans-serif'; ctx.fillText('Piggy in the Middle',450,222);
  ctx.fillStyle='rgba(255,255,255,.9)'; ctx.font='16px sans-serif';
  const L=['鳥かご（ロンド）の中央でボールを奪え！',
    'ドラッグで守備者を動かし、パスコースに体を入れる。',
    'パス直前に赤い矢印で出す先が分かる。先読みして走れ。',
    '走るボールに触れればカット＝得点。',
    '連続で回され切ると「被回し」。3回で終了。'];
  for(let i=0;i<L.length;i++) ctx.fillText(L[i],450,258+i*25);
  ctx.fillStyle='#e8544e'; rr(450-95,410,190,54,27); ctx.fill();
  ctx.fillStyle='#fff'; ctx.font='bold 24px sans-serif'; ctx.fillText('キックオフ',450,444);
  ctx.fillStyle='rgba(255,255,255,.6)'; ctx.font='14px sans-serif'; ctx.fillText('タップ／ドラッグで守備',450,488);
  ctx.textAlign='left';
}
function drawOver(){
  ctx.fillStyle='rgba(6,16,10,.84)'; ctx.fillRect(0,0,W,H); ctx.textAlign='center';
  ctx.fillStyle='#fff'; ctx.font='bold 46px sans-serif'; ctx.fillText('被回し3回・終了',450,232);
  ctx.fillStyle='#8effa8'; ctx.font='bold 32px sans-serif'; ctx.fillText('カット '+score,450,288);
  ctx.fillStyle='#ffd23e'; ctx.font='20px sans-serif'; ctx.fillText('自己ベスト '+best,450,324);
  ctx.fillStyle='#2f7fd6'; rr(450-95,372,190,54,27); ctx.fill();
  ctx.fillStyle='#fff'; ctx.font='bold 22px sans-serif'; ctx.fillText('もう一度',450,406);
  ctx.textAlign='left';
}

function render(){
  ctx.save();
  if(shakeT>0){ ctx.translate((Math.random()*2-1)*shakeM,(Math.random()*2-1)*shakeM); }
  drawField();
  for(const q of parts){ ctx.globalAlpha=Math.max(0,q.life); ctx.fillStyle=q.col; ctx.beginPath(); ctx.arc(q.x,q.y,q.r,0,6.28); ctx.fill(); }
  ctx.globalAlpha=1;
  drawPop(); drawHUD(); drawMsg(); drawHint();
  ctx.restore();
  if(flash>0){ ctx.fillStyle=flashCol; ctx.globalAlpha=flash; ctx.fillRect(0,0,W,H); ctx.globalAlpha=1; }
  if(state==='ready') drawOverlay();
  if(state==='over') drawOver();
}
function loop(ts){ if(!last)last=ts; let dt=(ts-last)/1000; last=ts; if(dt>0.05)dt=0.05; update(dt); render(); requestAnimationFrame(loop); }
requestAnimationFrame(loop);

if(TEST){
  window.__ic={
    get state(){return state;},
    get ball(){return {x:ball.x,y:ball.y};},
    get phase(){return phase;},
    get def(){return {x:def.x,y:def.y};},
    get count(){return {score,miss,streak,passStreak};},
    moveTo(x,y){ tx=Math.max(20,Math.min(W-20,x)); ty=Math.max(60,Math.min(H-20,y)); },
    tap(){ if(state==='ready'||state==='over')reset(); }
  };
}
})();
</script>
</body>
</html>
