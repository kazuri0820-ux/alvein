<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>一気に三塁 (Take Third)</title>
<style>
  html,body{margin:0;height:100%;background:#0a1018;overflow:hidden;
    font-family:-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  #stage{position:relative;width:100vw;height:100vh;max-width:calc(100vh*1.5);max-height:calc(100vw/1.5);aspect-ratio:900/600;}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;border-radius:6px;}
</style>
</head>
<body>
<div id="wrap"><div id="stage"><canvas id="cv"></canvas></div></div>
<script>
(function(){
const W=900,H=600,cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let DPR=1;
function fit(){DPR=Math.min(2,window.devicePixelRatio||1);cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
fit();addEventListener('resize',fit);

// ---------- audio ----------
let AC=null;function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function tone(f,d,type,v,sweep){const a=ac();if(!a)return;const t=a.currentTime,o=a.createOscillator(),g=a.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(sweep)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+sweep),t+d);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v||0.2,t+0.008);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+0.02);}
function noise(d,v,hp){const a=ac();if(!a)return;const t=a.currentTime,n=Math.floor(a.sampleRate*d),buf=a.createBuffer(1,n,a.sampleRate),ch=buf.getChannelData(0);
  for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource();s.buffer=buf;
  const f=a.createBiquadFilter();f.type='highpass';f.frequency.value=hp||600;const g=a.createGain();g.gain.value=v||0.2;
  s.connect(f);f.connect(g);g.connect(a.destination);s.start(t);s.stop(t+d+0.02);}
const S={
  go:()=>{tone(520,0.08,'square',0.13,140);},
  slide:()=>{noise(0.2,0.22,300);},
  safe:()=>{[660,880,1100,1320].forEach((f,i)=>setTimeout(()=>tone(f,0.13,'triangle',0.2),i*70));},
  great:()=>{[700,980,1320,1760,2100].forEach((f,i)=>setTimeout(()=>tone(f,0.12,'triangle',0.2),i*60));noise(0.4,0.1,300);},
  hold:()=>{tone(520,0.1,'sine',0.12);},
  out:()=>{tone(240,0.3,'sawtooth',0.2,-120);setTimeout(()=>tone(170,0.28,'sawtooth',0.16,-70),120);},
  bobble:()=>{noise(0.1,0.14,300);tone(300,0.1,'sawtooth',0.1,-60);},
  over:()=>{[440,330,247,175].forEach((f,i)=>setTimeout(()=>tone(f,0.3,'triangle',0.2),i*160));}
};

// ---------- geometry ----------
const HOME={x:450,y:512}, B1={x:664,y:360}, B2={x:450,y:206}, B3={x:236,y:360};
const OF={x:760,y:150};

// ---------- state ----------
let state='title', phase='lead', t=0, plays=0;
let score=0, combo=0, best=+(localStorage.getItem('takethird_best')||0);
let takes=0, fails=0, lvl=1;
let P=null, runner={p:0}, thr=null, result=null, resultT=0, msg='', msg2='';
let shake=0, flash=0, flashCol='#fff', last=performance.now();
let parts=[], pops=[];

function rnd(a,b){return a+Math.random()*(b-a);}
function chance(p){return Math.random()<p;}
function clamp(v,a,b){return v<a?a:v>b?b:v;}

function reset(){state='title';score=0;combo=0;takes=0;fails=0;lvl=1;plays=0;P=null;result=null;parts=[];pops=[];thr=null;}

function newPlay(){
  plays++;
  lvl=Math.min(6,1+Math.floor(plays/3));
  const clean=chance(0.5);
  const revealP=0.52+ Math.min(0.22,lvl*0.035);   // OF play revealed later at high lvl
  const dur2=Math.max(1050,1500-lvl*80);
  P={clean, revealP, dur2, t:0, decided:false, go:false, slid:false, slidP:-1, phase2t:0};
  runner={p:0}; thr=null; result=null; phase='lead'; t=0;
  msg='一塁走者、単打で二塁へ！'; msg2='外野の処理を見て GO か 自重かを判断';
}

function start(){ if(!ac())ac(); if(AC&&AC.state==='suspended')AC.resume(); reset(); state='play'; newPlay(); }

// runner path: 0..1 = 1B->2B ; 1..2 = 2B->3B
function runnerXY(){
  const p=runner.p;
  if(p<=1){ return {x:B1.x+(B2.x-B1.x)*p, y:B1.y+(B2.y-B1.y)*p}; }
  const q=p-1; return {x:B2.x+(B3.x-B2.x)*q, y:B2.y+(B3.y-B2.y)*q};
}

// ---------- action ----------
function act(){
  if(state==='title'){start();return;}
  if(state==='over'){ if(resultT>0.5){reset();start();} return; }
  if(state!=='play')return;
  if(phase==='decision'){
    if(P.decided)return; P.decided=true; P.go=true; S.go();
    // launch throw to third (racing); clean throw is quicker
    thr={t:0, T: P.clean? 900 : 1300, pos:0};
    phase='run3'; P.phase2t=0;
  } else if(phase==='run3'){
    // slide attempt
    if(P.slid)return; const q=runner.p-1;
    if(q>=0.70 && q<=0.98){ P.slid=true; P.slidP=q; S.slide();
      // outcome: bobble + timely slide -> safe ; clean -> out (throw beats you)
      if(!P.clean){ const great=Math.abs(q-0.86)<0.06; startResolve(great?'great':'safe3'); }
      else startResolve('out3');
    } else { P.slid=true; S.slide(); startResolve('outslide'); }
  }
}

function startResolve(kind){ result=kind; resultT=0; phase='resolve'; applyResult(kind); }

function applyResult(kind){
  const rp=runnerXY();
  if(kind==='safe3'||kind==='great'||kind==='safe2'){
    const isBig=(kind!=='safe2');
    combo++; const mult=1+Math.min(6,combo-1)*0.24;
    const base=kind==='great'?250:(kind==='safe3'?170:70); const add=Math.round(base*mult);
    score+=add; if(kind!=='safe2')takes++;
    (kind==='great')?S.great():(kind==='safe2'?S.hold():S.safe());
    flash=1;flashCol=kind==='great'?'#ffe08a':'#8ff0b8'; shake=kind==='great'?14:9;
    burst(rp.x,rp.y,kind==='great'?'#ffe08a':'#bfffd0',isBig?28:16,7);
    pop(rp.x,rp.y-30,(kind==='great'?'完璧なスライド！ ':(kind==='safe2'?'堅実にストップ ':'セーフ！ 三塁へ '))+'+'+add,'#eaffef');
    if(combo>=2&&isBig)pop(rp.x,rp.y-54,'コンボ x'+combo,'#ffe08a');
    msg=kind==='great'?'完璧なスライディング！ 一気に三塁':(kind==='safe2'?'自重して二塁でストップ（正しい判断）':'セーフ！ 隙を突いて三塁へ'); msg2='';
  } else {
    combo=0; fails++;
    S.out();
    flash=1;flashCol='#ff6b6b'; shake=11;
    burst(rp.x,rp.y,'#ff8a8a',16,5);
    if(kind==='out3'){msg='タッチアウト！ クリーン捕球に刺された';msg2='クリーンな処理なら自重しろ';}
    else if(kind==='outslide'){msg='スライドのタイミングがズレた';msg2='ベース手前でジャストに';}
    else {msg='行けたのに自重…好機を逃した';msg2='お手玉を見たら一気に狙え';}
  }
}

// ---------- input ----------
cv.addEventListener('pointerdown',e=>{e.preventDefault();act();});
addEventListener('keydown',e=>{ if(e.code==='Space'||e.code==='Enter'||e.code==='ArrowUp'){e.preventDefault();act();}});

// ---------- particles ----------
function burst(x,y,c,n,sp){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=rnd(sp*0.3,sp);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:1,c});}}
function pop(x,y,txt,c){pops.push({x,y,txt,c,life:1});}

// ---------- update ----------
function update(dt){
  shake*=Math.pow(0.86,dt/16.7); if(shake<0.3)shake=0;
  flash*=Math.pow(0.9,dt/16.7);
  for(const p of parts){p.vx*=0.96;p.vy=p.vy*0.96+0.3;p.x+=p.vx*dt/16.7;p.y+=p.vy*dt/16.7;p.life-=dt/16.7*0.026;}
  parts=parts.filter(p=>p.life>0);
  for(const p of pops){p.y-=dt/16.7*0.5;p.life-=dt/16.7*0.018;}
  pops=pops.filter(p=>p.life>0);

  if(state!=='play'){ if(state==='over')resultT+=dt/1000; return; }
  t+=dt;

  if(phase==='lead'){
    P.t+=dt; runner.p=clamp(P.t/P.dur2,0,1);
    if(runner.p>=1){ phase='decision'; P.decT=0; }
    return;
  }
  if(phase==='decision'){
    P.decT+=dt; // brief window to decide GO; then auto-hold
    const win=Math.max(320,560-lvl*40);
    if(P.decT>=win && !P.decided){ // held
      P.decided=true; P.go=false;
      if(P.clean) startResolve('safe2'); else startResolve('missed');
    }
    return;
  }
  if(phase==='run3'){
    P.phase2t+=dt; runner.p=1+clamp(P.phase2t/Math.max(620,900-lvl*46),0,1);
    if(thr){ thr.t+=dt; thr.pos=clamp(thr.t/thr.T,0,1); }
    if(runner.p>=2 && !P.slid){ // reached third standing without sliding -> tagged out
      P.slid=true; startResolve('out3'); }
    return;
  }
  if(phase==='resolve'){
    resultT+=dt/1000;
    if(resultT>1.1){
      if(fails>=3){ state='over'; resultT=0; S.over(); if(score>best){best=score;localStorage.setItem('takethird_best',best);} }
      else newPlay();
    }
    return;
  }
}

// ---------- render ----------
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

function drawScene(){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#16273e');g.addColorStop(0.5,'#1d5233');g.addColorStop(1,'#227a46');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='rgba(150,95,55,0.5)';ctx.beginPath();ctx.moveTo(HOME.x,HOME.y);ctx.lineTo(B1.x,B1.y);ctx.lineTo(B2.x,B2.y);ctx.lineTo(B3.x,B3.y);ctx.closePath();ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,0.5)';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(HOME.x,HOME.y);ctx.lineTo(B1.x,B1.y);ctx.lineTo(B2.x,B2.y);ctx.lineTo(B3.x,B3.y);ctx.closePath();ctx.stroke();
  function bag(b,l){ctx.save();ctx.translate(b.x,b.y);ctx.rotate(Math.PI/4);ctx.fillStyle='#f0f0f0';ctx.fillRect(-10,-10,20,20);ctx.restore();
    ctx.fillStyle='rgba(255,255,255,0.7)';ctx.font='bold 12px sans-serif';ctx.textAlign='center';ctx.fillText(l,b.x,b.y+34);}
  bag(B1,'一塁');bag(B2,'二塁');bag(B3,'三塁');
  const hp=HOME;ctx.fillStyle='#eee';ctx.beginPath();ctx.moveTo(hp.x,hp.y+8);ctx.lineTo(hp.x-12,hp.y);ctx.lineTo(hp.x-12,hp.y-8);ctx.lineTo(hp.x+12,hp.y-8);ctx.lineTo(hp.x+12,hp.y);ctx.closePath();ctx.fill();
}

function drawPlayer(x,y,col,dark,label,sc,ang){
  sc=sc||1;ctx.save();ctx.translate(x,y);ctx.scale(sc,sc);if(ang)ctx.rotate(ang);
  ctx.fillStyle='rgba(0,0,0,0.22)';ctx.beginPath();ctx.ellipse(0,15,11,4,0,0,6.28);ctx.fill();
  ctx.fillStyle=col;rr(-8,-6,16,22,6);ctx.fill();
  ctx.fillStyle='#f2c9a0';ctx.beginPath();ctx.arc(0,-13,6.5,0,6.28);ctx.fill();
  ctx.fillStyle=dark;ctx.beginPath();ctx.arc(0,-15,7,Math.PI,0);ctx.fill();
  ctx.restore();
  if(label){ctx.fillStyle='rgba(255,255,255,0.85)';ctx.font='bold 11px sans-serif';ctx.textAlign='center';ctx.fillText(label,x,y+28);}
}

function render(){
  ctx.save();
  if(shake>0)ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
  drawScene();

  if(P){
    // outfielder + play tell (clean vs bobble) once revealed
    const revealed = (phase==='lead'&&runner.p>=P.revealP) || phase==='decision'||phase==='run3'||phase==='resolve';
    drawPlayer(OF.x,OF.y,'#c0352e','#7a1712','外野',0.95);
    if(revealed){ ctx.textAlign='center';ctx.font='bold 15px sans-serif';
      if(P.clean){ ctx.fillStyle='#8ff0ff'; ctx.fillText('クリーン捕球！',OF.x,OF.y-24); }
      else { ctx.fillStyle='#ffb15b'; ctx.fillText('お手玉！',OF.x,OF.y-24);
        for(let i=0;i<3;i++){ctx.globalAlpha=0.5;ctx.fillStyle='#ffd24d';ctx.beginPath();ctx.arc(OF.x+rnd(-14,14),OF.y+rnd(-10,6),2.5,0,6.28);ctx.fill();}ctx.globalAlpha=1; }
    }
    // ball at OF / throw to third
    if(thr){ const from=OF, to=B3; const bx=from.x+(to.x-from.x)*thr.pos, by=from.y+(to.y-from.y)*thr.pos - Math.sin(thr.pos*Math.PI)*30;
      ctx.strokeStyle='rgba(255,255,255,0.12)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(from.x,from.y);ctx.lineTo(bx,by);ctx.stroke();
      ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(bx,by,6,0,6.28);ctx.fill();ctx.strokeStyle='#c33';ctx.lineWidth=1.2;ctx.beginPath();ctx.arc(bx,by,6,0.4,2.3);ctx.stroke(); }
    else { ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(OF.x-8,OF.y+2,6,0,6.28);ctx.fill(); }
    // 3B fielder waiting when a throw is coming
    if(thr){ drawPlayer(B3.x-2,B3.y-4,'#c0352e','#7a1712',null,0.9); }

    // decision prompt at 2B
    if(phase==='decision'&&!P.decided){
      const win=Math.max(320,560-lvl*40); const a=clamp(1-P.decT/win,0,1);
      ctx.strokeStyle='rgba(255,224,138,'+(0.4+0.5*a)+')';ctx.lineWidth=4;ctx.beginPath();ctx.arc(B2.x,B2.y,30,-Math.PI/2,-Math.PI/2+6.28*a);ctx.stroke();
      ctx.fillStyle='#ffe08a';ctx.font='bold 15px sans-serif';ctx.textAlign='center';ctx.fillText('GO？（タップ）',B2.x,B2.y-40);
    }
    // slide window near 3B
    if(phase==='run3'&&!P.slid){ const q=runner.p-1; if(q>=0.58){ ctx.strokeStyle=(q>=0.70&&q<=0.98)?'rgba(126,240,176,0.9)':'rgba(255,255,255,0.3)';ctx.lineWidth=4;ctx.beginPath();ctx.arc(B3.x,B3.y,28,0,6.28);ctx.stroke();
      if(q>=0.70&&q<=0.98){ctx.fillStyle='#8ff0b8';ctx.font='bold 14px sans-serif';ctx.textAlign='center';ctx.fillText('スライド！',B3.x,B3.y-36);} } }

    // runner
    const rp=runnerXY(); const sliding=(phase==='run3'&&P.slid)||(phase==='resolve'&&P.go);
    drawPlayer(rp.x,rp.y,'#2b6cff','#1a3a8a',null,1.0, sliding?0.7:0);
  }

  for(const p of parts){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,3.2,0,6.28);ctx.fill();}
  ctx.globalAlpha=1;
  for(const p of pops){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.font='bold 20px sans-serif';ctx.textAlign='center';ctx.fillText(p.txt,p.x,p.y);}
  ctx.globalAlpha=1;

  // HUD
  ctx.textAlign='left';ctx.fillStyle='#fff';ctx.font='bold 26px sans-serif';ctx.fillText('SCORE '+score,20,36);
  ctx.textAlign='right';ctx.fillStyle='rgba(255,255,255,0.85)';ctx.font='14px sans-serif';ctx.fillText('進塁 '+takes+'  Lv.'+lvl,W-20,26);
  ctx.fillText('失敗',W-92,50);
  for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(W-66+i*22,46,7,0,6.28);ctx.fillStyle=i<fails?'#ff5b5b':'rgba(255,255,255,0.25)';ctx.fill();}
  if(combo>=2){ctx.textAlign='left';ctx.fillStyle='#ffe08a';ctx.font='bold 18px sans-serif';ctx.fillText('コンボ x'+combo,20,60);}

  if(state==='play'&&(msg||msg2)){
    ctx.textAlign='center';
    const good=result&&(result.indexOf('safe')>=0||result==='great');
    ctx.fillStyle=result?(good?'#8ff0b8':'#ff9a9a'):'rgba(255,255,255,0.92)';
    ctx.font='bold 25px sans-serif';ctx.fillText(msg,W/2,H-52);
    if(msg2){ctx.fillStyle='rgba(255,255,255,0.72)';ctx.font='15px sans-serif';ctx.fillText(msg2,W/2,H-28);}
  }

  if(state==='title'){
    ctx.fillStyle='rgba(6,10,18,0.66)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='bold 48px sans-serif';ctx.fillText('一気に三塁',W/2,190);
    ctx.fillStyle='#8ff0b8';ctx.font='bold 22px sans-serif';ctx.fillText('Take Third',W/2,226);
    ctx.fillStyle='rgba(255,255,255,0.9)';ctx.font='18px sans-serif';
    ctx.fillText('外野手の処理を読め：お手玉なら二塁で GO（タップ）して三塁へ、',W/2,288);
    ctx.fillText('クリーン捕球なら自重（無反応）。GOなら三塁でスライド（緑帯でタップ）',W/2,316);
    ctx.fillStyle='rgba(255,255,255,0.66)';ctx.font='15px sans-serif';
    ctx.fillText('クリーンなのに突っ込むと刺される／お手玉で自重すると好機を逃す',W/2,358);
    ctx.fillText('隙を突いてジャストスライドで奪えば高得点。3失敗で交代',W/2,382);
    ctx.fillStyle='#ffe08a';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で開始',W/2,442);
    ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='14px sans-serif';ctx.fillText('BEST '+best,W/2,474);
  }
  if(state==='over'){
    ctx.fillStyle='rgba(6,10,18,0.74)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#ff6b6b';ctx.font='bold 46px sans-serif';ctx.fillText('3失敗…交代',W/2,230);
    ctx.fillStyle='#fff';ctx.font='bold 40px sans-serif';ctx.fillText('SCORE '+score,W/2,296);
    ctx.fillStyle='rgba(255,255,255,0.85)';ctx.font='20px sans-serif';ctx.fillText('進塁 '+takes+'   BEST '+best,W/2,336);
    ctx.fillStyle='#8ff0b8';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で もう一度',W/2,408);
  }

  if(flash>0.02){ctx.globalAlpha=flash*0.5;ctx.fillStyle=flashCol;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}
  ctx.restore();

  ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,0.4)';ctx.font='13px sans-serif';
  ctx.fillText('外野の処理を読み、お手玉なら二塁でGO→三塁で緑帯スライド、クリーンなら自重。3失敗で交代',W/2,H-8);
}

function frame(ts){let dt=ts-last;last=ts;if(dt>60)dt=60;if(dt<0)dt=0;update(dt);render();requestAnimationFrame(frame);}
requestAnimationFrame(frame);

// ---------- test hook ----------
window.__tt={
  start, act,
  get state(){return state;},
  get score(){return score;},
  get takes(){return takes;},
  get fails(){return fails;},
  get info(){return {state,phase, clean:P?P.clean:false, revealed: !!(P&&((phase==='lead'&&runner.p>=P.revealP)||phase==='decision'||phase==='run3')),
    rp:runner.p, decided:P?P.decided:false, slid:P?P.slid:false, q:runner.p>1?runner.p-1:-1, result, takes, fails, lvl};}
};
})();
</script>
</body>
</html>
