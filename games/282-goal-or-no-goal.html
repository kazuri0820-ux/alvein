<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ゴールライン判定 (Goal or No Goal?)</title>
<style>
  html,body{margin:0;height:100%;background:#06110a;overflow:hidden;
    font-family:-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  #stage{position:relative;width:100vw;height:100vh;max-width:calc(100vh*1.5);max-height:calc(100vw/1.5);aspect-ratio:900/600;}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;border-radius:6px;}
</style>
</head>
<body>
<div id="wrap"><div id="stage"><canvas id="cv"></canvas></div></div>
<script>
(function(){
const W=900,H=600,cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let DPR=1;
function fit(){DPR=Math.min(2,window.devicePixelRatio||1);cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
fit();addEventListener('resize',fit);

// ---------- audio ----------
let AC=null;function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function tone(f,d,type,v,sweep){const a=ac();if(!a)return;const t=a.currentTime,o=a.createOscillator(),g=a.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(sweep)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+sweep),t+d);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v||0.2,t+0.008);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+0.02);}
function noise(d,v,hp){const a=ac();if(!a)return;const t=a.currentTime,n=Math.floor(a.sampleRate*d),buf=a.createBuffer(1,n,a.sampleRate),ch=buf.getChannelData(0);
  for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource();s.buffer=buf;
  const f=a.createBiquadFilter();f.type='highpass';f.frequency.value=hp||600;const g=a.createGain();g.gain.value=v||0.2;
  s.connect(f);f.connect(g);g.connect(a.destination);s.start(t);s.stop(t+d+0.02);}
const S={
  roll:()=>{noise(0.08,0.05,300);},
  beep:()=>{tone(1400,0.06,'sine',0.1);tone(1700,0.06,'sine',0.06);},
  good:()=>{[680,940,1220].forEach((f,i)=>setTimeout(()=>tone(f,0.1,'triangle',0.16),i*55));},
  goal:()=>{[600,800,1000,1250].forEach((f,i)=>setTimeout(()=>tone(f,0.12,'triangle',0.17),i*80));},
  bad:()=>{noise(0.18,0.22,300);tone(160,0.22,'sawtooth',0.12,-50);},
  streak:()=>{[700,930,1170,1400].forEach((f,i)=>setTimeout(()=>tone(f,0.1,'triangle',0.16),i*60));},
  over:()=>{[440,330,247,175].forEach((f,i)=>setTimeout(()=>tone(f,0.3,'triangle',0.2),i*160));}
};

// ---------- geometry ----------
const LINEX=560, BALLR=15, CY=320;

// ---------- buttons ----------
const BTN=[
  {k:'goal', x:150,label:'ゴール！',sub:'完全に越えた',col:'#3fc46b'},
  {k:'nogoal',x:520,label:'ノーゴール',sub:'越えていない',col:'#e0574b'}
];
const BW=230, BY=505, BH=64;

// ---------- state ----------
let state='title', phase='roll', plays=0;
let score=0, combo=0, best=+(localStorage.getItem('gln_best')||0);
let outs=0, fails=0, lvl=1;   // outs = correct calls
let clock=0, revealT=520, callWin=980, crossed=false, farCX=560, startCX=340, tough=false;
let decided=false, call=null, result=null, resultT=0, msg='', anim=0, clearU=0;
let shake=0, flash=0, flashCol='#fff', last=performance.now();
let parts=[], pops=[];

function rnd(a,b){return a+Math.random()*(b-a);}
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function lerp(a,b,u){return a+(b-a)*u;}
function easeOut(u){return 1-Math.pow(1-u,2);}

function reset(){state='title';score=0;combo=0;outs=0;fails=0;lvl=1;plays=0;result=null;parts=[];pops=[];}
function ballCX(){
  if(phase==='roll'){ const t=clamp(clock/revealT,0,1); return lerp(startCX, farCX, easeOut(t)); }
  if(phase==='result'){ return lerp(farCX, startCX-40, easeOut(clearU)); }  // cleared back out
  return farCX;
}
function newPlay(){
  plays++; lvl=Math.min(7,1+Math.floor(outs/4));
  revealT=clamp(560-lvl*24,360,560);
  callWin=clamp(1020-lvl*70,560,1020);
  const margin=clamp(58-lvl*7,9,58);
  crossed=Math.random()<0.5;
  tough=Math.random()<clamp(0.2+lvl*0.05,0.2,0.5);
  const off = tough? rnd(3, Math.max(5,margin*0.5)) : rnd(margin*0.5, margin);
  // farCX so that (farCX - BALLR) is past/short of the line by 'off'
  farCX = LINEX + BALLR + (crossed? off : -off);
  startCX = LINEX - 170;
  phase='roll'; clock=0; decided=false; call=null; result=null; resultT=0; msg=''; anim=0; clearU=0;
  S.roll();
}
function start(){ if(!ac())ac(); if(AC&&AC.state==='suspended')AC.resume(); reset(); state='play'; newPlay(); }

function makeCall(c){
  if(state==='title'){start();return;}
  if(state==='over'){ if(resultT>0.4){reset();start();} return; }
  if(state!=='play'||phase!=='roll'||decided) return;
  if(clock<revealT){ decided=true; call=c; resolve('early'); return; }
  decided=true; call=c;
  const correct = (c==='goal')===crossed;
  resolve(correct?'good':'wrong');
}

function resolve(k){
  phase='result'; result=k; resultT=0; anim=0; clearU=0;
  if(k==='good'){
    outs++; combo++;
    let add=Math.round((tough?250:150)*(1+Math.min(9,combo-1)*0.14)); score+=add;
    if(crossed){ S.goal(); } else S.good(); setTimeout(S.good,60);
    flash=1;flashCol='#8affa0';shake=5; burst(farCX,CY,'#8affa0',18,7);
    pop(farCX,CY-40,tough?'際どい判定を的中！ +'+add:'正しい判定！ +'+add,'#d6ffe0');
    if(combo>=2&&!tough)pop(W/2,150,'コンボ x'+combo,'#ffd24d');
    if(combo>0&&combo%5===0)S.streak();
    msg=crossed?'ボールは完全にラインを越えていた——ゴールで正解！':'ボールはラインを越え切っていない——ノーゴールで正解！';
  } else {
    fails++; combo=0; flash=1;flashCol='#ff5b5b';shake=9; S.bad();
    if(k==='early') msg='判定が早い…ボールが止まる（最深部）前の判定は禁物';
    else if(k==='late') msg='判定が遅い…主審が迷ってはいけない';
    else msg='誤審…'+(crossed?'実際は完全に越えていた（ゴール）':'実際は越え切っていない（ノーゴール）');
    pop(farCX,CY-40,'誤審…','#ffb0b0');
  }
  if(fails>=3){ state='over'; resultT=0; S.over(); if(score>best){best=score;localStorage.setItem('gln_best',best);} }
}

// ---------- input ----------
cv.addEventListener('pointerdown',e=>{e.preventDefault();
  if(state!=='play'||phase!=='roll'){ makeCall('goal'); return; }
  const r=cv.getBoundingClientRect(); const x=(e.clientX-r.left)/r.width*W, y=(e.clientY-r.top)/r.height*H;
  for(const b of BTN){ if(x>=b.x&&x<=b.x+BW&&y>=BY&&y<=BY+BH){ makeCall(b.k); return; } }
});
addEventListener('keydown',e=>{ if(e.repeat)return;
  if(e.code==='ArrowUp'||e.code==='KeyG'||e.code==='Digit1'){e.preventDefault();makeCall('goal');}
  else if(e.code==='ArrowDown'||e.code==='KeyN'||e.code==='Digit2'){e.preventDefault();makeCall('nogoal');}
  else if(e.code==='Space'||e.code==='Enter'){e.preventDefault(); if(state!=='play')makeCall('goal');} });

// ---------- particles ----------
function burst(x,y,c,n,sp){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=rnd(sp*0.3,sp);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:1,c});}}
function pop(x,y,txt,c){pops.push({x,y,txt,c,life:1});}

// ---------- update ----------
function update(dt){
  shake*=Math.pow(0.86,dt/16.7); if(shake<0.3)shake=0;
  flash*=Math.pow(0.9,dt/16.7);
  for(const p of parts){p.vx*=0.96;p.vy=p.vy*0.96+0.28;p.x+=p.vx*dt/16.7;p.y+=p.vy*dt/16.7;p.life-=dt/16.7*0.026;}
  parts=parts.filter(p=>p.life>0);
  for(const p of pops){p.y-=dt/16.7*0.5;p.life-=dt/16.7*0.02;}
  pops=pops.filter(p=>p.life>0);

  if(state!=='play'){ if(state==='over')resultT+=dt/1000; return; }
  if(phase==='roll'){ clock+=dt;
    if(Math.abs(clock-revealT)<9) S.beep();
    if(!decided && clock>revealT+callWin){ decided=true; call=null; resolve('late'); }
    return; }
  if(phase==='result'){ resultT+=dt/1000; clearU=Math.min(1,clearU+dt/700); if(resultT>1.45) newPlay(); return; }
}

// ---------- render ----------
function drawScene(){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#0f3d24');g.addColorStop(0.6,'#12653a');g.addColorStop(1,'#0c4d2c');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  // goal area (beyond the line, to the right = inside goal)
  ctx.fillStyle='rgba(255,255,255,0.05)';ctx.fillRect(LINEX,120,W-LINEX,400);
  // net
  ctx.strokeStyle='rgba(255,255,255,0.12)';ctx.lineWidth=1;
  for(let x=LINEX+18;x<W-20;x+=22){ctx.beginPath();ctx.moveTo(x,120);ctx.lineTo(x,520);ctx.stroke();}
  for(let y=140;y<520;y+=22){ctx.beginPath();ctx.moveTo(LINEX,y);ctx.lineTo(W-20,y);ctx.stroke();}
  // goalpost / crossbar hint (left edge = line)
  ctx.fillStyle='#eef3f0';ctx.fillRect(LINEX-18,120,7,400);
}

function render(){
  ctx.save();
  if(shake>0)ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
  drawScene();

  if(state==='play'||state==='over'){
    // THE goal line (bold)
    const frozen = phase==='roll'&&clock>=revealT;
    ctx.strokeStyle= frozen?'#ffe14d':'rgba(255,255,255,0.95)';ctx.lineWidth=4;
    ctx.beginPath();ctx.moveTo(LINEX,120);ctx.lineTo(LINEX,520);ctx.stroke();
    ctx.fillStyle='rgba(255,255,255,0.75)';ctx.font='12px sans-serif';ctx.textAlign='center';ctx.fillText('ゴールライン',LINEX,132);

    // ball
    const bx=ballCX();
    ctx.fillStyle='rgba(0,0,0,0.22)';ctx.beginPath();ctx.ellipse(bx,CY+BALLR+3,BALLR,4,0,0,6.28);ctx.fill();
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(bx,CY,BALLR,0,6.28);ctx.fill();
    ctx.strokeStyle='#c33';ctx.lineWidth=1.6;ctx.beginPath();ctx.arc(bx,CY,BALLR,0.5,2.3);ctx.stroke();
    // trailing edge indicator at freeze/result
    if(frozen||phase==='result'){
      const te=bx-BALLR;
      ctx.strokeStyle=(te>LINEX)?'rgba(120,255,150,0.9)':'rgba(255,120,110,0.9)';ctx.lineWidth=2;ctx.setLineDash([4,4]);
      ctx.beginPath();ctx.moveTo(te,CY-BALLR-24);ctx.lineTo(te,CY+BALLR+24);ctx.stroke();ctx.setLineDash([]);
      ctx.fillStyle=(te>LINEX)?'rgba(150,255,170,0.95)':'rgba(255,150,140,0.95)';ctx.font='11px sans-serif';ctx.fillText('ボール後端',te,CY-BALLR-30);
    }
    // defender's foot clears on result (miss cases still show)
    if(phase==='result'){ ctx.strokeStyle='#3aa0ff';ctx.lineWidth=8;ctx.lineCap='round';
      const fx=lerp(startCX-60,bx+8,clamp(1-clearU,0,1)); ctx.beginPath();ctx.moveTo(fx-30,CY+40);ctx.lineTo(fx,CY+6);ctx.stroke();ctx.lineCap='butt'; }

    // cue
    ctx.textAlign='center';
    if(state==='play'&&phase==='roll'){
      if(clock<revealT){ ctx.fillStyle='rgba(255,220,90,0.95)';ctx.font='bold 20px sans-serif';ctx.fillText('ゴールライン・テクノロジー — 最深部を見極めろ',W/2,52); }
      else { ctx.fillStyle='rgba(140,255,160,0.98)';ctx.font='bold 22px sans-serif';ctx.fillText('判定！ ボールは完全に越えたか？',W/2,52);
        const p=clamp((clock-revealT)/callWin,0,1),bw=250,x=W/2-bw/2,y=64;
        ctx.fillStyle='rgba(255,255,255,0.18)';ctx.fillRect(x,y,bw,7);ctx.fillStyle=p<0.7?'#8affa0':(p<1?'#ffd24d':'#ff5b5b');ctx.fillRect(x,y,bw*p,7); }
    }

    // buttons
    if(state==='play'){
      for(const b of BTN){ const active=phase==='roll'&&clock>=revealT;
        ctx.fillStyle=active?b.col:'rgba(255,255,255,0.10)';rr(b.x,BY,BW,BH,10);ctx.fill();
        ctx.fillStyle=active?'#08130c':'rgba(255,255,255,0.5)';ctx.textAlign='center';ctx.font='bold 20px sans-serif';ctx.fillText(b.label,b.x+BW/2,BY+28);
        ctx.font='12px sans-serif';ctx.fillText(b.sub,b.x+BW/2,BY+48); }
      ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='12px sans-serif';ctx.textAlign='center';ctx.fillText('タップ / ↑=ゴール ・ ↓=ノーゴール',W/2,BY+BH+18);
    }
  }

  for(const p of parts){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,3.2,0,6.28);ctx.fill();}
  ctx.globalAlpha=1;
  for(const p of pops){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.font='bold 21px sans-serif';ctx.textAlign='center';ctx.fillText(p.txt,p.x,p.y);}
  ctx.globalAlpha=1;

  // HUD
  ctx.textAlign='left';ctx.fillStyle='#fff';ctx.font='bold 26px sans-serif';ctx.fillText('SCORE '+score,20,36);
  ctx.textAlign='right';ctx.fillStyle='rgba(255,255,255,0.9)';ctx.font='14px sans-serif';ctx.fillText('好判定 '+outs+'  Lv'+lvl,W-20,24);
  ctx.fillText('誤審',W-92,46);
  for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(W-60+i*20,41,7,0,6.28);ctx.fillStyle=i<fails?'#ff5b5b':'rgba(255,255,255,0.25)';ctx.fill();}
  if(combo>=2){ctx.textAlign='center';ctx.fillStyle='#ffd24d';ctx.font='bold 18px sans-serif';ctx.fillText('コンボ x'+combo,W/2,110);}

  if(state==='play'&&phase==='result'&&msg){ctx.textAlign='center';ctx.fillStyle=result==='good'?'#9ff0b8':'#ff9a9a';ctx.font='bold 18px sans-serif';ctx.fillText(msg,W/2,470);}

  if(state==='title'){
    ctx.fillStyle='rgba(4,10,7,0.82)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='bold 38px sans-serif';ctx.fillText('ゴールライン判定',W/2,96);
    ctx.fillStyle='#ffd23e';ctx.font='bold 22px sans-serif';ctx.fillText('Goal or No Goal?',W/2,132);
    ctx.fillStyle='rgba(255,255,255,0.92)';ctx.font='16px sans-serif';
    ctx.fillText('ゴール前の混戦。転がる球がクリアされる寸前——ボールが完全にラインを越えたか判定しろ',W/2,184);
    ctx.fillStyle='rgba(255,255,255,0.66)';ctx.font='14px sans-serif';
    ctx.fillText('ボールが最深部に達した瞬間（黄ライン＋合図）、“ボール後端”がゴールラインを越えていれば「ゴール」',W/2,222);
    ctx.fillText('後端がラインに届いていなければ（部分的に乗っただけ）「ノーゴール」＝タップ / ↑ゴール・↓ノーゴール',W/2,246);
    ctx.fillText('最深部の前に判定＝早すぎ、誤審は失格ポイント。際どい判定を当てると大量加点',W/2,270);
    ctx.fillText('上級ほど越え/未越えが紙一重で、判定の猶予も短い。3誤審で交代',W/2,294);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で開始',W/2,362);
    ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='14px sans-serif';ctx.fillText('BEST '+best,W/2,394);
  }
  if(state==='over'){
    ctx.fillStyle='rgba(4,10,7,0.84)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#ff6b6b';ctx.font='bold 46px sans-serif';ctx.fillText('3誤審…主審交代',W/2,222);
    ctx.fillStyle='#fff';ctx.font='bold 40px sans-serif';ctx.fillText('SCORE '+score,W/2,290);
    ctx.fillStyle='rgba(255,255,255,0.85)';ctx.font='19px sans-serif';ctx.fillText('好判定 '+outs+'   BEST '+best,W/2,330);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で もう一度',W/2,402);
  }

  if(flash>0.02){ctx.globalAlpha=flash*0.5;ctx.fillStyle=flashCol;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}
  ctx.restore();

  ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,0.4)';ctx.font='12px sans-serif';
  ctx.fillText('ゴールライン判定：最深部でボール後端がラインを越えていれば「ゴール」、届いていなければ「ノーゴール」。早判定/誤審は失敗、3つで交代',W/2,H-8);
}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

function frame(ts){let dt=ts-last;last=ts;if(dt>60)dt=60;if(dt<0)dt=0;update(dt);render();requestAnimationFrame(frame);}
requestAnimationFrame(frame);

// ---------- test hook ----------
window.__gl={
  start, makeCall:(c)=>makeCall(c),
  get state(){return state;},
  get score(){return score;},
  get outs(){return outs;},
  get fails(){return fails;},
  get info(){return {state,phase,clock,revealT,callWin,crossed,tough,decided,call,result,outs,fails,lvl,
    revealed:(clock>=revealT),canAct:(phase==='roll'&&!decided)};}
};
})();
</script>
</body>
</html>
