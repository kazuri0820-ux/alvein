<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>落下点に入れ (Get Under It)</title>
<style>
  html,body{margin:0;height:100%;background:#06110a;overflow:hidden;
    font-family:-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  #stage{position:relative;width:100vw;height:100vh;max-width:calc(100vh*1.5);max-height:calc(100vw/1.5);aspect-ratio:900/600;}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;border-radius:6px;}
</style>
</head>
<body>
<div id="wrap"><div id="stage"><canvas id="cv"></canvas></div></div>
<script>
(function(){
const W=900,H=600,cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let DPR=1;
function fit(){DPR=Math.min(2,window.devicePixelRatio||1);cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
fit();addEventListener('resize',fit);

// ---------- audio ----------
let AC=null;function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function tone(f,d,type,v,sweep){const a=ac();if(!a)return;const t=a.currentTime,o=a.createOscillator(),g=a.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(sweep)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+sweep),t+d);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v||0.2,t+0.008);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+0.02);}
function noise(d,v,hp){const a=ac();if(!a)return;const t=a.currentTime,n=Math.floor(a.sampleRate*d),buf=a.createBuffer(1,n,a.sampleRate),ch=buf.getChannelData(0);
  for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource();s.buffer=buf;
  const f=a.createBiquadFilter();f.type='highpass';f.frequency.value=hp||600;const g=a.createGain();g.gain.value=v||0.2;
  s.connect(f);f.connect(g);g.connect(a.destination);s.start(t);s.stop(t+d+0.02);}
const S={
  loft:()=>{tone(300,0.1,'sine',0.05,120);},
  beep:()=>{tone(1200,0.05,'sine',0.06);},
  clear:()=>{noise(0.06,0.14,500);setTimeout(()=>{[620,860,1120].forEach((f,i)=>setTimeout(()=>tone(f,0.1,'triangle',0.16),i*55));},30);},
  big:()=>{[660,900,1160,1450].forEach((f,i)=>setTimeout(()=>tone(f,0.11,'triangle',0.16),i*62));},
  concede:()=>{noise(0.2,0.2,300);tone(150,0.24,'sawtooth',0.12,-50);},
  streak:()=>{[700,930,1170,1400].forEach((f,i)=>setTimeout(()=>tone(f,0.1,'triangle',0.16),i*60));},
  over:()=>{[440,330,247,175].forEach((f,i)=>setTimeout(()=>tone(f,0.3,'triangle',0.2),i*160));}
};

// ---------- state ----------
let state='title', phase='track', plays=0;
let score=0, combo=0, best=+(localStorage.getItem('gui_best')||0);
let outs=0, fails=0, lvl=1;   // outs = clears, fails = conceded
let clock=0, arriveT=1400, catchR=56, tough=false;
let sx=450, sy=90, lx=450, ly=430, curveAmp=0, apex=150;
let defX=450, defY=430, tX=450, tY=430, useTarget=true, velX=0, velY=0, maxSpeed=0.5;
let atkX=560, atkY=440;
let result=null, resultT=0, reason='', quality=0, hdU=0;
let shake=0, flash=0, flashCol='#fff', last=performance.now();
let parts=[], pops=[];

function rnd(a,b){return a+Math.random()*(b-a);}
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function lerp(a,b,u){return a+(b-a)*u;}
function easeInOut(u){return u<0.5?2*u*u:1-Math.pow(-2*u+2,2)/2;}

function reset(){state='title';score=0;combo=0;outs=0;fails=0;lvl=1;plays=0;result=null;parts=[];pops=[];}

// current ground shadow (projected landing of the curving ball)
function shadowXY(){
  const u=clamp(clock/arriveT,0,1);
  const x=lerp(sx,lx,easeInOut(u))+curveAmp*Math.sin(u*Math.PI);
  const y=lerp(sy+40,ly,easeInOut(u));
  return {x,y};
}
function ballXY(){
  const u=clamp(clock/arriveT,0,1); const sh=shadowXY();
  return {x:sh.x, y:sh.y - Math.sin(u*Math.PI)*apex};
}

function newPlay(){
  plays++; lvl=Math.min(7,1+Math.floor(outs/4));
  arriveT=clamp(1580-lvl*64,1130,1580);
  catchR=clamp(62-lvl*3,44,62);
  tough=Math.random()<clamp(0.22+lvl*0.03,0.22,0.46);
  if(tough)catchR=Math.round(catchR*0.85);
  lx=rnd(300,600); ly=rnd(360,470);
  sx=clamp(lx+rnd(-110,110),200,700); sy=80;
  curveAmp=rnd(-1,1)*(78+lvl*15);
  apex=rnd(150,210);
  atkX=clamp(lx+rnd(-60,60),240,660); atkY=ly+rnd(-6,14);
  // keep defender where it is (continuous feel); ensure inside
  defX=clamp(defX,120,780); defY=clamp(defY,300,500);
  result=null; reason=''; resultT=0; quality=0; hdU=0;
  phase='track'; clock=0; S.loft();
}
function start(){ if(!ac())ac(); if(AC&&AC.state==='suspended')AC.resume(); reset(); state='play'; defX=450;defY=430;tX=450;tY=430; newPlay(); }

function resolve(){
  const d=Math.hypot(defX-lx,defY-ly);
  phase='result'; result= d<=catchR? 'clear':'concede'; resultT=0; hdU=0;
  if(result==='clear'){
    outs++; combo++; quality=1-d/catchR; const big=quality>=0.7;
    const mult=1+Math.min(9,combo-1)*0.14;
    const add=Math.round((60+Math.round(quality*90)+(tough?80:0))*mult); score+=add;
    (big?S.big:S.clear)();
    flash=1;flashCol='#8affa0';shake=5; burst(lx,ly,'#8affa0',18,7);
    reason = big?'ど真ん中で捉えた！ 力強いヘディングクリア':'落下点に入ってヘディングでクリア！';
    pop(lx,ly-40,(tough?'難しい軌道を処理！ +':'クリア！ +')+add,'#d6ffe0');
    if(combo>=2)pop(W/2,150,'コンボ x'+combo,'#ffd24d');
    if(combo>0&&combo%5===0)S.streak();
  } else {
    fails++; combo=0; flash=1;flashCol='#ff5b5b';shake=8; S.concede();
    reason='落下点を外した…フリーの相手にヘディングを許す';
    pop(lx,ly-40,'かぶった…','#ffb0b0');
  }
  if(fails>=3){ state='over'; resultT=0; S.over(); if(score>best){best=score;localStorage.setItem('gui_best',best);} }
}

// ---------- input ----------
function setTarget(cx,cy){ const r=cv.getBoundingClientRect(); tX=(cx-r.left)/r.width*W; tY=(cy-r.top)/r.height*H; useTarget=true; }
cv.addEventListener('pointerdown',e=>{e.preventDefault();
  if(state==='title'){start();return;}
  if(state==='over'){ if(resultT>0.4){reset();start();} return; }
  setTarget(e.clientX,e.clientY);
});
cv.addEventListener('pointermove',e=>{ if(state==='play'&&(e.buttons||e.pointerType==='touch')) setTarget(e.clientX,e.clientY); });
addEventListener('keydown',e=>{
  if(e.code==='ArrowLeft'||e.code==='KeyA'){e.preventDefault();useTarget=false;velX=-maxSpeed;}
  else if(e.code==='ArrowRight'||e.code==='KeyD'){e.preventDefault();useTarget=false;velX=maxSpeed;}
  else if(e.code==='ArrowUp'||e.code==='KeyW'){e.preventDefault();useTarget=false;velY=-maxSpeed;}
  else if(e.code==='ArrowDown'||e.code==='KeyS'){e.preventDefault();useTarget=false;velY=maxSpeed;}
  else if(e.code==='Space'||e.code==='Enter'){e.preventDefault(); if(state!=='play'){ if(state==='title')start(); else if(resultT>0.4){reset();start();} }}
});
addEventListener('keyup',e=>{
  if(e.code==='ArrowLeft'||e.code==='KeyA'||e.code==='ArrowRight'||e.code==='KeyD'){velX=0;}
  if(e.code==='ArrowUp'||e.code==='KeyW'||e.code==='ArrowDown'||e.code==='KeyS'){velY=0;}
});

// ---------- particles ----------
function burst(x,y,c,n,sp){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=rnd(sp*0.3,sp);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:1,c});}}
function pop(x,y,txt,c){pops.push({x,y,txt,c,life:1});}

// ---------- update ----------
function update(dt){
  shake*=Math.pow(0.86,dt/16.7); if(shake<0.3)shake=0;
  flash*=Math.pow(0.9,dt/16.7);
  for(const p of parts){p.vx*=0.96;p.vy=p.vy*0.96+0.28;p.x+=p.vx*dt/16.7;p.y+=p.vy*dt/16.7;p.life-=dt/16.7*0.026;}
  parts=parts.filter(p=>p.life>0);
  for(const p of pops){p.y-=dt/16.7*0.5;p.life-=dt/16.7*0.02;}
  pops=pops.filter(p=>p.life>0);

  if(state!=='play'){ if(state==='over')resultT+=dt/1000; return; }
  // move defender
  if(phase==='track'||phase==='result'){
    if(useTarget){ const dx=tX-defX,dy=tY-defY,d=Math.hypot(dx,dy),step=maxSpeed*dt;
      if(d>step){ defX+=dx/d*step; defY+=dy/d*step; } else { defX=tX; defY=tY; } }
    else { defX+=velX*dt; defY+=velY*dt; }
    defX=clamp(defX,110,790); defY=clamp(defY,290,505);
  }
  if(phase==='track'){ clock+=dt;
    if(Math.abs(clock-(arriveT-140))<9) S.beep();
    if(clock>=arriveT){ resolve(); }
    return; }
  if(phase==='result'){ resultT+=dt/1000; hdU=Math.min(1,hdU+dt/380); if(resultT>1.35) newPlay(); return; }
}

// ---------- render ----------
function drawPitch(){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#0e5e33');g.addColorStop(0.5,'#12703f');g.addColorStop(1,'#0c4c2b');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  for(let i=0;i<8;i++){ ctx.fillStyle=i%2?'rgba(255,255,255,0.03)':'rgba(0,0,0,0.03)'; ctx.fillRect(0,i*80,W,80); }
  // goal at bottom (defending), penalty box
  ctx.strokeStyle='rgba(255,255,255,0.4)';ctx.lineWidth=3;ctx.strokeRect(230,300,440,240);
  ctx.fillStyle='rgba(255,255,255,0.06)';ctx.fillRect(360,540,180,40);
  ctx.fillStyle='#eef3f0';ctx.fillRect(360,538,180,6);
}

function render(){
  ctx.save();
  if(shake>0)ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
  drawPitch();

  if(state==='play'||state==='over'){
    const sh=shadowXY(), bl=ballXY();
    // landing marker (drifting shadow)
    if(state==='play'&&phase==='track'){
      ctx.strokeStyle='rgba(255,225,120,0.85)';ctx.lineWidth=2;ctx.setLineDash([5,5]);
      ctx.beginPath();ctx.ellipse(sh.x,sh.y,catchR*0.5,catchR*0.28,0,0,6.28);ctx.stroke();ctx.setLineDash([]);
    }
    // lurking attacker
    ctx.fillStyle='#d0403a';ctx.beginPath();ctx.ellipse(atkX,atkY,11,15,0,0,6.28);ctx.fill();
    ctx.fillStyle='#f0c9a0';ctx.beginPath();ctx.arc(atkX,atkY-22,8,0,6.28);ctx.fill();

    // defender (you) + reach ring
    let dx=defX,dy=defY;
    ctx.strokeStyle=(phase==='result'&&result==='clear')?'rgba(120,255,150,0.6)':'rgba(120,200,255,0.45)';ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(dx,dy,catchR,0,6.28);ctx.stroke();
    ctx.fillStyle='#2b6fd6';ctx.beginPath();ctx.ellipse(dx,dy,12,16,0,0,6.28);ctx.fill();
    ctx.fillStyle='#f0c9a0';ctx.beginPath();ctx.arc(dx,dy-24,9,0,6.28);ctx.fill();

    // ball shadow + ball
    ctx.fillStyle='rgba(0,0,0,0.2)';ctx.beginPath();ctx.ellipse(sh.x,sh.y,10,4,0,0,6.28);ctx.fill();
    let bx=bl.x,by=bl.y;
    if(phase==='result'){ const u=1-Math.min(1,hdU);
      if(result==='clear'){ bx=lerp(lx,lx+(lx<450?-160:160),hdU); by=lerp(ly,ly-120,hdU); }
      else { bx=lerp(lx,540,hdU); by=lerp(ly,545,hdU); } }
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(bx,by,10,0,6.28);ctx.fill();
    ctx.strokeStyle='#222';ctx.lineWidth=1.3;
    ctx.beginPath();ctx.moveTo(bx-6,by-4);ctx.lineTo(bx+2,by-9);ctx.lineTo(bx+7,by-2);ctx.lineTo(bx+3,by+6);ctx.lineTo(bx-6,by+5);ctx.closePath();ctx.stroke();

    // cue
    ctx.textAlign='center';
    if(state==='play'&&phase==='track'){
      ctx.fillStyle='rgba(255,220,90,0.96)';ctx.font='bold 21px sans-serif';ctx.fillText('危険なハイボール！ 落下点に入ってヘディングでクリア',W/2,44);
      ctx.fillStyle='rgba(255,255,255,0.6)';ctx.font='13px sans-serif';ctx.fillText('マウス/指で守備者を動かし、曲がりながら落ちる球の落下点（黄マーカー）へ入る（←→↑↓可）',W/2,H-30);
    }
  }

  for(const p of parts){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,3.2,0,6.28);ctx.fill();}
  ctx.globalAlpha=1;
  for(const p of pops){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.font='bold 21px sans-serif';ctx.textAlign='center';ctx.fillText(p.txt,p.x,p.y);}
  ctx.globalAlpha=1;

  // HUD
  ctx.textAlign='left';ctx.fillStyle='#fff';ctx.font='bold 26px sans-serif';ctx.fillText('SCORE '+score,20,36);
  ctx.textAlign='right';ctx.fillStyle='rgba(255,255,255,0.9)';ctx.font='14px sans-serif';ctx.fillText('クリア '+outs+'  Lv'+lvl,W-20,24);
  ctx.fillText('被弾',W-92,46);
  for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(W-60+i*20,41,7,0,6.28);ctx.fillStyle=i<fails?'#ff5b5b':'rgba(255,255,255,0.25)';ctx.fill();}
  if(combo>=2){ctx.textAlign='center';ctx.fillStyle='#ffd24d';ctx.font='bold 18px sans-serif';ctx.fillText('コンボ x'+combo,W/2,110);}

  if(state==='play'&&phase==='result'&&reason){ctx.textAlign='center';ctx.fillStyle=result==='clear'?'#9ff0b8':'#ff9a9a';ctx.font='bold 18px sans-serif';ctx.fillText(reason,W/2,H-58);}

  if(state==='title'){
    ctx.fillStyle='rgba(4,10,7,0.82)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='bold 40px sans-serif';ctx.fillText('落下点に入れ',W/2,90);
    ctx.fillStyle='#ffd23e';ctx.font='bold 22px sans-serif';ctx.fillText('Get Under It',W/2,126);
    ctx.fillStyle='rgba(255,255,255,0.92)';ctx.font='16px sans-serif';
    ctx.fillText('自陣ゴール前へ放り込まれる危険なハイボール。落下点に入ってヘディングでクリアしろ',W/2,182);
    ctx.fillStyle='rgba(255,255,255,0.66)';ctx.font='14px sans-serif';
    ctx.fillText('マウス/指（または ←→↑↓）で守備者を動かし、曲がりながら落ちてくる球の落下点へ入る',W/2,220);
    ctx.fillText('落ちてくる途中は横に膨らむので、最終的な落下点（黄マーカー）を予測して先回りする',W/2,244);
    ctx.fillText('着地の瞬間に落下点に入っていればクリア（ど真ん中は力強いクリアで大量点）',W/2,268);
    ctx.fillText('落下点を外すとフリーの相手にヘディングを許す。上級ほど球が速く曲がりも急。3被弾で交代',W/2,292);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で開始',W/2,360);
    ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='14px sans-serif';ctx.fillText('BEST '+best,W/2,392);
  }
  if(state==='over'){
    ctx.fillStyle='rgba(4,10,7,0.84)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#ff6b6b';ctx.font='bold 46px sans-serif';ctx.fillText('3被弾…交代',W/2,222);
    ctx.fillStyle='#fff';ctx.font='bold 40px sans-serif';ctx.fillText('SCORE '+score,W/2,290);
    ctx.fillStyle='rgba(255,255,255,0.85)';ctx.font='19px sans-serif';ctx.fillText('クリア '+outs+'   BEST '+best,W/2,330);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で もう一度',W/2,402);
  }

  if(flash>0.02){ctx.globalAlpha=flash*0.5;ctx.fillStyle=flashCol;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}
  ctx.restore();

  ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,0.4)';ctx.font='12px sans-serif';
  ctx.fillText('落下点に入れ：曲がりながら落ちるハイボールの落下点を予測して守備者を入れ、着地の瞬間にヘディングでクリア。外すと被弾、3つで交代',W/2,H-8);
}

function frame(ts){let dt=ts-last;last=ts;if(dt>60)dt=60;if(dt<0)dt=0;update(dt);render();requestAnimationFrame(frame);}
requestAnimationFrame(frame);

// ---------- test hook ----------
window.__gui={
  start, aim:(x,y)=>{tX=clamp(x,110,790);tY=clamp(y,290,505);useTarget=true;},
  get state(){return state;},
  get score(){return score;},
  get outs(){return outs;},
  get fails(){return fails;},
  get info(){const sh=shadowXY();return {state,phase,clock,arriveT,catchR,defX,defY,lx,ly,shadowX:sh.x,shadowY:sh.y,maxSpeed,tough,result,outs,fails,lvl};}
};
})();
</script>
</body>
</html>
