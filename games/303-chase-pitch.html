<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>釣り球 (Get Him Chasing)</title>
<style>
  html,body{margin:0;height:100%;background:#0a1207;overflow:hidden;
    font-family:-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  #stage{position:relative;width:100vw;height:100vh;max-width:calc(100vh*1.5);max-height:calc(100vw/1.5);aspect-ratio:900/600;}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;border-radius:6px;}
</style>
</head>
<body>
<div id="wrap"><div id="stage"><canvas id="cv"></canvas></div></div>
<script>
(function(){
const W=900,H=600,cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let DPR=1;
function fit(){DPR=Math.min(2,window.devicePixelRatio||1);cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
fit();addEventListener('resize',fit);

// ---------- audio ----------
let AC=null;function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function tone(f,d,type,v,sweep){const a=ac();if(!a)return;const t=a.currentTime,o=a.createOscillator(),g=a.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(sweep)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+sweep),t+d);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v||0.2,t+0.008);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+0.02);}
function noise(d,v,hp){const a=ac();if(!a)return;const t=a.currentTime,n=Math.floor(a.sampleRate*d),buf=a.createBuffer(1,n,a.sampleRate),ch=buf.getChannelData(0);
  for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource();s.buffer=buf;
  const f=a.createBiquadFilter();f.type='highpass';f.frequency.value=hp||600;const g=a.createGain();g.gain.value=v||0.2;
  s.connect(f);f.connect(g);g.connect(a.destination);s.start(t);s.stop(t+d+0.02);}
const S={
  set:()=>{tone(300,0.06,'sine',0.05,90);},
  whiff:()=>{noise(0.09,0.14,700);tone(300,0.06,'triangle',0.05,-120);},
  k:()=>{[720,980,1280].forEach((f,i)=>setTimeout(()=>tone(f,0.1,'triangle',0.16),i*55));},
  big:()=>{[640,860,1100,1400].forEach((f,i)=>setTimeout(()=>tone(f,0.12,'triangle',0.17),i*80));},
  crush:()=>{noise(0.05,0.2,400);tone(200,0.14,'square',0.14,-60);},
  take:()=>{tone(360,0.12,'square',0.08);},
  bad:()=>{noise(0.16,0.2,300);tone(150,0.2,'sawtooth',0.11,-40);},
  streak:()=>{[700,930,1170,1400].forEach((f,i)=>setTimeout(()=>tone(f,0.1,'triangle',0.16),i*60));},
  over:()=>{[440,330,247,175].forEach((f,i)=>setTimeout(()=>tone(f,0.3,'triangle',0.2),i*160));}
};

// ---------- geometry ----------
const ZX=470, ZY=250, ZW=150, ZH=150;          // strike zone box
const ZL=ZX-ZW/2, ZR=ZX+ZW/2, ZT=ZY-ZH/2, ZB=ZY+ZH/2;
const CHT=54;                                   // chase band height (below zone)
const PIT={x:180,y:430}, BAT={x:640,y:320}, CAT={x:470,y:470};

// ---------- state ----------
let state='title', phase='pitch', plays=0;
let score=0, combo=0, best=+(localStorage.getItem('cp_best')||0);
let outs=0, fails=0, lvl=1;      // outs = strikeouts
let t=0, relT=560, w=430, tough=false, disc=false; // disc = disciplined hitter
let decided=false, result=null, resultT=0, msg='', msgOk=false, relAt=0;
let ballU=0, finishY=0, swingU=0;
let shake=0, flash=0, flashCol='#fff', last=performance.now();
let parts=[], pops=[];

function rnd(a,b){return a+Math.random()*(b-a);}
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function lerp(a,b,u){return a+(b-a)*u;}
function easeOut(u){return 1-Math.pow(1-u,2);}
function easeIn(u){return u*u;}

function reset(){state='title';score=0;combo=0;outs=0;fails=0;lvl=1;plays=0;result=null;parts=[];pops=[];}

function chaseH(){ return CHT*(disc?0.82:1.12)*clamp(1-lvl*0.03,0.72,1); } // chase band height, narrower vs disciplined/high level

function newPlay(){
  plays++; lvl=Math.min(7,1+Math.floor(outs/4));
  relT=clamp(640-lvl*28,440,640);
  w=clamp(480-lvl*26,300,480);
  tough=Math.random()<clamp(0.18+lvl*0.05,0.18,0.5);
  disc=Math.random()<0.4;
  phase='pitch'; t=0; decided=false; result=null; resultT=0; msg=''; msgOk=false; relAt=0;
  ballU=0; finishY=0; swingU=0;
  S.set();
}
function start(){ if(!ac())ac(); if(AC&&AC.state==='suspended')AC.resume(); reset(); state='play'; newPlay(); }

function act(){
  if(state==='title'){start();return;}
  if(state==='over'){ if(resultT>0.4){reset();start();} return; }
  if(state!=='play'||phase!=='pitch'||decided) return;
  decided=true; relAt=t;
  if(t<relT){ finishY=lerp(ZT+18,ZB-14,clamp(t/relT,0,1)); resolve('hang'); return; }      // too early: stays up in the zone
  if(t<=relT+w){ finishY=ZB+chaseH()*0.5; resolve('chase'); return; }                        // window: finishes in chase band
  finishY=ZB+chaseH()+40; resolve('waste'); return;                                          // late: breaks too far
}

function resolve(k){
  phase='result'; result=k; resultT=0;
  if(k==='chase'){
    outs++; combo++;
    const nasty=(relAt>=relT+w*0.5);
    let base=(tough||disc)?250:150; if(nasty)base+=70;
    let add=Math.round(base*(1+Math.min(9,combo-1)*0.14)); score+=add;
    S.whiff(); setTimeout(S.k,120); if(nasty||disc)setTimeout(S.big,190);
    msgOk=true; flash=1;flashCol='#8affa0';shake=5; burst(ZX,ZB+chaseH()*0.5,'#8affa0',18,7);
    pop(ZX,ZT-24,(disc?'選球眼を欺いた三振！ +':'空振り三振！ +')+add,'#d6ffe0');
    if(combo>=2)pop(W/2,150,'コンボ x'+combo,'#ffd24d');
    if(combo>0&&combo%5===0)S.streak();
    msg=disc?'我慢強い打者も誘い出した——ゾーンから落ちる誘い球で空振り三振':'ボールゾーンへ落として空振りを奪った——誘い球で三振！';
  } else {
    fails++; combo=0; msgOk=false; flash=1;flashCol='#ff5b5b';shake=9;
    if(k==='hang'){ S.crush(); msg='高い…ゾーンに残った甘い球を痛打された'; pop(ZX,ZY,'痛打…','#ffb0b0'); }
    else { setTimeout(S.take,60); S.bad(); msg='低すぎ…はっきりボールと見切られて見逃された（ボール）'; pop(ZX,ZB+chaseH()+40,'見逃し…','#ffb0b0'); }
  }
  if(fails>=3){ state='over'; resultT=0; setTimeout(S.over,200); if(score>best){best=score;localStorage.setItem('cp_best',best);} }
}

// ---------- input ----------
cv.addEventListener('pointerdown',e=>{e.preventDefault();act();});
addEventListener('keydown',e=>{ if(e.repeat)return;
  if(e.code==='Space'||e.code==='Enter'||e.code==='ArrowDown'||e.code==='KeyF'){e.preventDefault();act();} });

// ---------- particles ----------
function burst(x,y,c,n,sp){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=rnd(sp*0.3,sp);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:1,c});}}
function pop(x,y,txt,c){pops.push({x,y,txt,c,life:1});}

// ---------- update ----------
function update(dt){
  shake*=Math.pow(0.86,dt/16.7); if(shake<0.3)shake=0;
  flash*=Math.pow(0.9,dt/16.7);
  for(const p of parts){p.vx*=0.96;p.vy=p.vy*0.96+0.28;p.x+=p.vx*dt/16.7;p.y+=p.vy*dt/16.7;p.life-=dt/16.7*0.026;}
  parts=parts.filter(p=>p.life>0);
  for(const p of pops){p.y-=dt/16.7*0.5;p.life-=dt/16.7*0.02;}
  pops=pops.filter(p=>p.life>0);

  if(state!=='play'){ if(state==='over')resultT+=dt/1000; return; }
  if(phase==='pitch'){ t+=dt;
    ballU=clamp(t/(relT+w*0.6),0,1);
    if(!decided && t>relT+w){ decided=true; relAt=t; finishY=ZB+chaseH()+40; resolve('waste'); }
    return; }
  if(phase==='result'){ resultT+=dt/1000;
    ballU=Math.min(1,ballU+dt/240);
    if(result!=='waste') swingU=Math.min(1,swingU+dt/200);
    if(resultT>1.5) newPlay(); return; }
}

// ---------- render ----------
function drawField(){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#123f22');g.addColorStop(0.5,'#0f5e34');g.addColorStop(1,'#0b3f24');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  // dirt mound + plate
  ctx.fillStyle='rgba(122,84,51,0.5)';ctx.beginPath();ctx.ellipse(PIT.x,PIT.y+18,70,26,0,0,6.28);ctx.fill();
  ctx.fillStyle='#eee';ctx.beginPath();ctx.moveTo(CAT.x-14,CAT.y-4);ctx.lineTo(CAT.x+14,CAT.y-4);ctx.lineTo(CAT.x+14,CAT.y+3);ctx.lineTo(CAT.x,CAT.y+11);ctx.lineTo(CAT.x-14,CAT.y+3);ctx.closePath();ctx.fill();
}
function person(x,y,col,s){s=s||1;ctx.fillStyle=col;ctx.beginPath();ctx.ellipse(x,y-16*s,11*s,18*s,0,0,6.28);ctx.fill();
  ctx.fillStyle='#f0c9a0';ctx.beginPath();ctx.arc(x,y-38*s,8.5*s,0,6.28);ctx.fill();}

function render(){
  ctx.save();
  if(shake>0)ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
  drawField();

  // strike zone + chase band
  const ch=chaseH();
  ctx.fillStyle='rgba(255,90,80,0.08)';ctx.fillRect(ZL,ZT,ZW,ZH);
  ctx.strokeStyle='rgba(255,255,255,0.6)';ctx.lineWidth=2;ctx.strokeRect(ZL,ZT,ZW,ZH);
  ctx.setLineDash([5,5]);ctx.strokeStyle='rgba(255,255,255,0.25)';
  ctx.beginPath();ctx.moveTo(ZL+ZW/3,ZT);ctx.lineTo(ZL+ZW/3,ZB);ctx.moveTo(ZL+2*ZW/3,ZT);ctx.lineTo(ZL+2*ZW/3,ZB);
  ctx.moveTo(ZL,ZT+ZH/3);ctx.lineTo(ZR,ZT+ZH/3);ctx.moveTo(ZL,ZT+2*ZH/3);ctx.lineTo(ZR,ZT+2*ZH/3);ctx.stroke();ctx.setLineDash([]);
  // chase band (green, just below zone)
  ctx.fillStyle='rgba(120,255,150,0.16)';ctx.fillRect(ZL,ZB,ZW,ch);
  ctx.strokeStyle='rgba(120,255,150,0.55)';ctx.lineWidth=2;ctx.strokeRect(ZL,ZB,ZW,ch);
  ctx.fillStyle='rgba(150,255,170,0.85)';ctx.font='12px sans-serif';ctx.textAlign='center';ctx.fillText('誘い球ゾーン',ZX,ZB+ch+16);
  ctx.fillStyle='rgba(255,150,140,0.7)';ctx.fillText('甘い（痛打）',ZX,ZT-8);

  if(state==='play'||state==='over'){
    // catcher (behind plate), batter, pitcher
    person(CAT.x,CAT.y+34,'#8a6d3b',0.85);
    person(PIT.x,PIT.y,'#c23b34',1);
    // batter with bat, swings on chase/hang
    const sw=easeOut(swingU)*(result==='waste'?0:1);
    ctx.save();ctx.translate(BAT.x,BAT.y);
    person(0,0,'#2b6fd6',1);
    ctx.strokeStyle='#cebb88';ctx.lineWidth=6;ctx.lineCap='round';
    const ba=-2.2+sw*2.6;
    ctx.beginPath();ctx.moveTo(-6,-30);ctx.lineTo(-6+Math.cos(ba)*46,-30+Math.sin(ba)*46);ctx.stroke();ctx.lineCap='butt';
    ctx.restore();

    // ball: flies from pitcher toward plate then breaks down to finishY
    let bx,by;
    const u=easeOut(ballU);
    bx=lerp(PIT.x+14,ZX,u);
    const flat=lerp(PIT.y-40,ZY,u);
    const targetY=(phase==='pitch')?ZB+ch*0.5:finishY;
    // break grows late in flight
    const brk=easeIn(clamp((ballU-0.45)/0.55,0,1))*(targetY-ZY);
    by=flat+brk;
    if(!(phase==='result'&&result==='hang'&&swingU>0.6)){ // hide ball once crushed
      ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(bx,by,8,0,6.28);ctx.fill();
      ctx.strokeStyle='#c33';ctx.lineWidth=1.2;ctx.beginPath();ctx.arc(bx-2,by-2,5,0.6,2.6);ctx.stroke();
      ctx.strokeStyle='rgba(255,255,255,0.3)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(bx-Math.cos(u)*12,by-8);ctx.lineTo(bx,by);ctx.stroke();
    }
    if(phase==='result'&&result==='hang'&&swingU>0.6){ // crushed line drive out
      const cx=lerp(ZX,ZX-260,swingU),cy=lerp(ZY,ZY-120,swingU);
      ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(cx,cy,8,0,6.28);ctx.fill();
    }

    // release-timing bar
    ctx.textAlign='center';
    if(state==='play'&&phase==='pitch'){
      ctx.fillStyle='rgba(255,220,90,0.95)';ctx.font='bold 20px sans-serif';
      ctx.fillText(t<relT?'追い込んだ！ ゾーンから“落として”空振りを奪え':'今だ！ 誘い球のタイミングで離せ',W/2,64);
      const bw=300,x=W/2-bw/2,y=78,tot=relT+w+120;
      ctx.fillStyle='rgba(255,255,255,0.16)';ctx.fillRect(x,y,bw,9);
      // green window segment
      ctx.fillStyle='rgba(120,255,150,0.55)';ctx.fillRect(x+bw*(relT/tot),y,bw*(w/tot),9);
      // fill needle
      const p=clamp(t/tot,0,1);
      ctx.fillStyle='#fff';ctx.fillRect(x+bw*p-2,y-3,4,15);
    }
    if(state==='play'){ ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='12px sans-serif';ctx.textAlign='center';
      ctx.fillText('タップ / SPACE / ↓：誘い球ゾーンに落として空振りを奪う（早いと痛打・遅いとボール）',W/2,H-28);
      if(disc){ctx.fillStyle='rgba(255,210,90,0.9)';ctx.font='bold 13px sans-serif';ctx.fillText('選球眼のある打者（誘い球ゾーンが狭い）',W/2,H-46);}
    }
  }

  for(const p of parts){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,3.2,0,6.28);ctx.fill();}
  ctx.globalAlpha=1;
  for(const p of pops){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.font='bold 21px sans-serif';ctx.textAlign='center';ctx.fillText(p.txt,p.x,p.y);}
  ctx.globalAlpha=1;

  // HUD
  ctx.textAlign='left';ctx.fillStyle='#fff';ctx.font='bold 26px sans-serif';ctx.fillText('SCORE '+score,20,36);
  ctx.textAlign='right';ctx.fillStyle='rgba(255,255,255,0.9)';ctx.font='14px sans-serif';ctx.fillText('三振 '+outs+'  Lv'+lvl,W-20,24);
  ctx.fillText('失',W-92,46);
  for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(W-60+i*20,41,7,0,6.28);ctx.fillStyle=i<fails?'#ff5b5b':'rgba(255,255,255,0.25)';ctx.fill();}
  if(combo>=2){ctx.textAlign='center';ctx.fillStyle='#ffd24d';ctx.font='bold 18px sans-serif';ctx.fillText('コンボ x'+combo,W/2,120);}

  if(state==='play'&&phase==='result'&&msg){ctx.textAlign='center';ctx.fillStyle=msgOk?'#9ff0b8':'#ff9a9a';ctx.font='bold 16px sans-serif';ctx.fillText(msg,W/2,H-52);}

  if(state==='title'){
    ctx.fillStyle='rgba(4,10,7,0.82)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='bold 42px sans-serif';ctx.fillText('釣り球',W/2,96);
    ctx.fillStyle='#ffd23e';ctx.font='bold 22px sans-serif';ctx.fillText('Get Him Chasing',W/2,132);
    ctx.fillStyle='rgba(255,255,255,0.92)';ctx.font='16px sans-serif';
    ctx.fillText('投手として、追い込んだ打者にストライクゾーンから“落ちる”誘い球を投げ、空振り三振を奪え',W/2,186);
    ctx.fillStyle='rgba(255,255,255,0.66)';ctx.font='14px sans-serif';
    ctx.fillText('リリースのタイミングバーが緑（誘い球ゾーン）に来た瞬間にタップ／SPACE／↓＝ゾーン直下へ落として空振り',W/2,224);
    ctx.fillText('早いとゾーンに残って“甘い球”を痛打され、遅いと大きく外れて“ボール”と見逃される（どちらも失敗）',W/2,248);
    ctx.fillText('よりボールゾーンで空振りを奪うほど、また選球眼のある打者を欺くほど大量加点',W/2,272);
    ctx.fillText('上級ほど球が速く誘い球ゾーンも狭い。3失敗で交代',W/2,296);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で開始',W/2,362);
    ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='14px sans-serif';ctx.fillText('BEST '+best,W/2,394);
  }
  if(state==='over'){
    ctx.fillStyle='rgba(4,10,7,0.84)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#ff6b6b';ctx.font='bold 46px sans-serif';ctx.fillText('3失敗…交代',W/2,224);
    ctx.fillStyle='#fff';ctx.font='bold 40px sans-serif';ctx.fillText('SCORE '+score,W/2,292);
    ctx.fillStyle='rgba(255,255,255,0.85)';ctx.font='19px sans-serif';ctx.fillText('三振 '+outs+'   BEST '+best,W/2,332);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で もう一度',W/2,404);
  }

  if(flash>0.02){ctx.globalAlpha=flash*0.5;ctx.fillStyle=flashCol;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}
  ctx.restore();

  ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,0.4)';ctx.font='12px sans-serif';
  ctx.fillText('釣り球：ゾーン直下の“誘い球ゾーン”へ落として空振り三振を奪う。早いと痛打・遅いとボール、3失敗で交代',W/2,H-8);
}

function frame(ts){let dt=ts-last;last=ts;if(dt>60)dt=60;if(dt<0)dt=0;update(dt);render();requestAnimationFrame(frame);}
requestAnimationFrame(frame);

// ---------- test hook ----------
window.__cp={
  start, act:()=>act(),
  get state(){return state;},
  get score(){return score;},
  get outs(){return outs;},
  get fails(){return fails;},
  get info(){return {state,phase,t,relT,w,tough,disc,decided,result,outs,fails,lvl,
    pre:(t<relT),relWin:(phase==='pitch'&&t>=relT&&t<=relT+w),canAct:(phase==='pitch'&&!decided)};}
};
})();
</script>
</body>
</html>
