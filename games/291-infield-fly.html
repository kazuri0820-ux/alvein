<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>インフィールドフライ (Infield Fly?)</title>
<style>
  html,body{margin:0;height:100%;background:#0b0a06;overflow:hidden;
    font-family:-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  #stage{position:relative;width:100vw;height:100vh;max-width:calc(100vh*1.5);max-height:calc(100vw/1.5);aspect-ratio:900/600;}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;border-radius:6px;}
</style>
</head>
<body>
<div id="wrap"><div id="stage"><canvas id="cv"></canvas></div></div>
<script>
(function(){
const W=900,H=600,cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let DPR=1;
function fit(){DPR=Math.min(2,window.devicePixelRatio||1);cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
fit();addEventListener('resize',fit);

// ---------- audio ----------
let AC=null;function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function tone(f,d,type,v,sweep){const a=ac();if(!a)return;const t=a.currentTime,o=a.createOscillator(),g=a.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(sweep)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+sweep),t+d);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v||0.2,t+0.008);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+0.02);}
function noise(d,v,hp){const a=ac();if(!a)return;const t=a.currentTime,n=Math.floor(a.sampleRate*d),buf=a.createBuffer(1,n,a.sampleRate),ch=buf.getChannelData(0);
  for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource();s.buffer=buf;
  const f=a.createBiquadFilter();f.type='highpass';f.frequency.value=hp||600;const g=a.createGain();g.gain.value=v||0.2;
  s.connect(f);f.connect(g);g.connect(a.destination);s.start(t);s.stop(t+d+0.02);}
const S={
  pop:()=>{noise(0.05,0.14,500);tone(240,0.06,'square',0.07);},
  beep:()=>{tone(1400,0.06,'sine',0.1);tone(1700,0.06,'sine',0.06);},
  good:()=>{[680,940,1220].forEach((f,i)=>setTimeout(()=>tone(f,0.1,'triangle',0.16),i*55));},
  big:()=>{[600,800,1000,1250].forEach((f,i)=>setTimeout(()=>tone(f,0.12,'triangle',0.17),i*80));},
  bad:()=>{noise(0.18,0.22,300);tone(160,0.22,'sawtooth',0.12,-50);},
  streak:()=>{[700,930,1170,1400].forEach((f,i)=>setTimeout(()=>tone(f,0.1,'triangle',0.16),i*60));},
  over:()=>{[440,330,247,175].forEach((f,i)=>setTimeout(()=>tone(f,0.3,'triangle',0.2),i*160));}
};

// ---------- geometry ----------
const HOME={x:450,y:512};
const FL_L={x:150,y:150}, FL_R={x:750,y:150};   // foul line endpoints (3B / 1B lines)
const B1={x:600,y:392}, B2={x:450,y:300}, B3={x:300,y:392};

// ---------- buttons ----------
const BTN=[
  {k:'fly', x:150,label:'インフィールドフライ',sub:'フェアの内野フライ＝打者アウト',col:'#3fc46b'},
  {k:'no',  x:520,label:'ノーコール',sub:'ファウル方向／深い＝そのまま',col:'#e0a03a'}
];
const BW=230, BY=505, BH=64;

// ---------- state ----------
let state='title', phase='roll', plays=0;
let score=0, combo=0, best=+(localStorage.getItem('iff_best')||0);
let outs=0, fails=0, lvl=1;   // outs = correct calls
let clock=0, revealT=520, callWin=980, kind='ifr', sub='fair', tough=false;
let landX=450, landY=340, peak=200, decided=false, call=null, result=null, resultT=0, msg='', msgOk=false;
let shake=0, flash=0, flashCol='#fff', last=performance.now();
let parts=[], pops=[];

function rnd(a,b){return a+Math.random()*(b-a);}
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function lerp(a,b,u){return a+(b-a)*u;}
function easeOut(u){return 1-Math.pow(1-u,2);}

function reset(){state='title';score=0;combo=0;outs=0;fails=0;lvl=1;plays=0;result=null;parts=[];pops=[];}

// foul test: is (x,y) in fair territory (between the two foul lines from home)?
function fairSide(x,y){
  // left line home->FL_L, right line home->FL_R. Fair is between.
  const crossL=(FL_L.x-HOME.x)*(y-HOME.y)-(FL_L.y-HOME.y)*(x-HOME.x);
  const crossR=(FL_R.x-HOME.x)*(y-HOME.y)-(FL_R.y-HOME.y)*(x-HOME.x);
  return (crossL<=0 && crossR>=0);
}

function newPlay(){
  plays++; lvl=Math.min(7,1+Math.floor(outs/4));
  revealT=clamp(560-lvl*24,360,560);
  callWin=clamp(1020-lvl*70,560,1020);
  tough=Math.random()<clamp(0.2+lvl*0.05,0.2,0.5);
  const r=Math.random();
  if(r<0.5){ kind='ifr'; sub='fair';
    // fair, catchable infield: near center, medium depth
    landY=rnd(300,372); landX=rnd(360,540);
  } else if(r<0.75){ kind='no'; sub='foul';
    // just foul: place outside a foul line at a shallow depth
    const left=Math.random()<0.5; landY=rnd(340,430);
    const m=tough?rnd(6,26):rnd(26,70);
    // solve x on the foul line at this y, then push outside by m
    if(left){ const u=(landY-HOME.y)/(FL_L.y-HOME.y); const lx=HOME.x+(FL_L.x-HOME.x)*u; landX=lx-m; }
    else { const u=(landY-HOME.y)/(FL_R.y-HOME.y); const rx=HOME.x+(FL_R.x-HOME.x)*u; landX=rx+m; }
  } else { kind='no'; sub='deep';
    // fair but too deep (shallow OF, no infielder ordinary effort)
    landY=tough?rnd(232,262):rnd(180,232); landX=rnd(360,540);
  }
  peak=rnd(150,210);
  phase='roll'; clock=0; decided=false; call=null; result=null; resultT=0; msg=''; msgOk=false;
  S.pop();
}
function start(){ if(!ac())ac(); if(AC&&AC.state==='suspended')AC.resume(); reset(); state='play'; newPlay(); }

function callIt(c){
  if(state==='title'){start();return;}
  if(state==='over'){ if(resultT>0.4){reset();start();} return; }
  if(state!=='play'||phase!=='roll'||decided) return;
  if(clock<revealT){ decided=true; call=c; resolve('early'); return; }
  decided=true; call=c;
  const correct=(c==='fly')===(kind==='ifr');
  resolve(correct?'good':'wrong');
}

function resolve(k){
  phase='result'; result=k; resultT=0;
  if(k==='good'){
    outs++; combo++;
    let add=Math.round((tough?250:150)*(1+Math.min(9,combo-1)*0.14)); score+=add;
    S.good(); if(tough)setTimeout(S.big,60);
    msgOk=true; flash=1;flashCol='#8affa0';shake=5; burst(landX,landY,'#8affa0',18,7);
    pop(landX,landY-40,tough?'際どい判定を的中！ +'+add:'正しい判定！ +'+add,'#d6ffe0');
    if(combo>=2&&!tough)pop(W/2,150,'コンボ x'+combo,'#ffd24d');
    if(combo>0&&combo%5===0)S.streak();
    msg = (kind==='ifr')?'フェアの内野フライ——インフィールドフライで打者アウト、走者を守った':
      (sub==='foul'?'ファウル方向へ流れる打球——ノーコールで正解':'内野を越える深い打球——ノーコールで正解');
  } else {
    fails++; combo=0; msgOk=false; flash=1;flashCol='#ff5b5b';shake=9; S.bad();
    if(k==='early') msg='判定が早い…打球の行方（フェア/ファウル・深さ）を見極める前は禁物';
    else if(k==='late') msg='判定が遅い…宣告のタイミングを逃した';
    else msg = (kind==='ifr')?'誤審…実際はフェアの内野フライ（インフィールドフライ）だった':
      (sub==='foul'?'誤審…実際はファウル方向でノーコールが正解':'誤審…実際は内野を越える深い打球でノーコールが正解');
    pop(landX,landY-40,'誤審…','#ffb0b0');
  }
  if(fails>=3){ state='over'; resultT=0; S.over(); if(score>best){best=score;localStorage.setItem('iff_best',best);} }
}

// ---------- input ----------
cv.addEventListener('pointerdown',e=>{e.preventDefault();
  if(state!=='play'||phase!=='roll'){ callIt('fly'); return; }
  const r=cv.getBoundingClientRect(); const x=(e.clientX-r.left)/r.width*W, y=(e.clientY-r.top)/r.height*H;
  for(const b of BTN){ if(x>=b.x&&x<=b.x+BW&&y>=BY&&y<=BY+BH){ callIt(b.k); return; } }
});
addEventListener('keydown',e=>{ if(e.repeat)return;
  if(e.code==='ArrowUp'||e.code==='KeyF'||e.code==='Digit1'){e.preventDefault();callIt('fly');}
  else if(e.code==='ArrowDown'||e.code==='KeyN'||e.code==='Digit2'){e.preventDefault();callIt('no');}
  else if(e.code==='Space'||e.code==='Enter'){e.preventDefault(); if(state!=='play')callIt('fly');} });

// ---------- particles ----------
function burst(x,y,c,n,sp){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=rnd(sp*0.3,sp);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:1,c});}}
function pop(x,y,txt,c){pops.push({x,y,txt,c,life:1});}

// ---------- update ----------
function update(dt){
  shake*=Math.pow(0.86,dt/16.7); if(shake<0.3)shake=0;
  flash*=Math.pow(0.9,dt/16.7);
  for(const p of parts){p.vx*=0.96;p.vy=p.vy*0.96+0.28;p.x+=p.vx*dt/16.7;p.y+=p.vy*dt/16.7;p.life-=dt/16.7*0.026;}
  parts=parts.filter(p=>p.life>0);
  for(const p of pops){p.y-=dt/16.7*0.5;p.life-=dt/16.7*0.02;}
  pops=pops.filter(p=>p.life>0);

  if(state!=='play'){ if(state==='over')resultT+=dt/1000; return; }
  if(phase==='roll'){ clock+=dt;
    if(Math.abs(clock-revealT)<9) S.beep();
    if(!decided && clock>revealT+callWin){ decided=true; call=null; resolve('late'); }
    return; }
  if(phase==='result'){ resultT+=dt/1000; if(resultT>1.5) newPlay(); return; }
}

// ---------- render ----------
function drawField(){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#0e5e33');g.addColorStop(0.5,'#12703f');g.addColorStop(1,'#0c4c2b');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  // foul territory shading (outside lines)
  ctx.fillStyle='rgba(0,0,0,0.16)';
  ctx.beginPath();ctx.moveTo(HOME.x,HOME.y);ctx.lineTo(FL_L.x,FL_L.y);ctx.lineTo(0,FL_L.y);ctx.lineTo(0,H);ctx.closePath();ctx.fill();
  ctx.beginPath();ctx.moveTo(HOME.x,HOME.y);ctx.lineTo(FL_R.x,FL_R.y);ctx.lineTo(W,FL_R.y);ctx.lineTo(W,H);ctx.closePath();ctx.fill();
  // infield dirt (diamond)
  ctx.fillStyle='#8a5c33';ctx.beginPath();ctx.moveTo(HOME.x,HOME.y);ctx.lineTo(B1.x,B1.y);ctx.lineTo(B2.x,B2.y);ctx.lineTo(B3.x,B3.y);ctx.closePath();ctx.fill();
  // foul lines
  ctx.strokeStyle='rgba(255,255,255,0.9)';ctx.lineWidth=4;
  ctx.beginPath();ctx.moveTo(HOME.x,HOME.y);ctx.lineTo(FL_L.x,FL_L.y);ctx.moveTo(HOME.x,HOME.y);ctx.lineTo(FL_R.x,FL_R.y);ctx.stroke();
  // bases
  function base(b){ctx.save();ctx.translate(b.x,b.y);ctx.rotate(Math.PI/4);ctx.fillStyle='#f2efe6';ctx.fillRect(-9,-9,18,18);ctx.restore();}
  base(HOME);base(B1);base(B2);base(B3);
}

function render(){
  ctx.save();
  if(shake>0)ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
  drawField();

  if(state==='play'||state==='over'){
    const revealed = (phase==='roll'&&clock>=revealT)||phase==='result';
    const u = clamp(clock/(revealT+120),0,1);
    // ball arc: from home up, landing at (landX,landY)
    let bx=lerp(HOME.x,landX,easeOut(u)), by=lerp(HOME.y,landY,easeOut(u)) - Math.sin(Math.min(1,u)*Math.PI)*peak;
    if(phase==='result'){ bx=landX; by=landY; }

    // landing marker + fielder at reveal
    if(revealed){
      const okFair=(kind==='ifr');
      ctx.strokeStyle=okFair?'rgba(120,255,150,0.9)':'rgba(255,150,110,0.95)';ctx.lineWidth=2;ctx.setLineDash([4,4]);
      ctx.beginPath();ctx.arc(landX,landY,26,0,6.28);ctx.stroke();ctx.setLineDash([]);
      // camped infielder (green) for ifr, running/none for no
      if(kind==='ifr'){
        ctx.fillStyle='#3aa0ff';ctx.beginPath();ctx.ellipse(landX,landY+18,10,14,0,0,6.28);ctx.fill();
        ctx.fillStyle='#f0c9a0';ctx.beginPath();ctx.arc(landX,landY-2,8,0,6.28);ctx.fill();
        ctx.fillStyle='rgba(150,255,170,0.95)';ctx.font='12px sans-serif';ctx.textAlign='center';ctx.fillText('内野手が余裕で下に',landX,landY-34);
      } else if(sub==='foul'){
        ctx.fillStyle='rgba(255,150,140,0.98)';ctx.font='bold 13px sans-serif';ctx.textAlign='center';ctx.fillText('ファウル方向へ流れる',landX,landY-34);
      } else {
        // deep: an outfielder running in from beyond
        ctx.fillStyle='#d0403a';ctx.beginPath();ctx.ellipse(landX,landY-30,9,13,0,0,6.28);ctx.fill();
        ctx.fillStyle='rgba(255,150,140,0.98)';ctx.font='bold 13px sans-serif';ctx.textAlign='center';ctx.fillText('内野を越える深い打球',landX,landY-46);
      }
    }
    // ball
    ctx.fillStyle='rgba(0,0,0,0.16)';ctx.beginPath();ctx.ellipse(bx,landY+6,8,3,0,0,6.28);ctx.fill();
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(bx,by,8,0,6.28);ctx.fill();
    ctx.strokeStyle='#c33';ctx.lineWidth=1.2;ctx.beginPath();ctx.arc(bx,by,8,0.4,2.2);ctx.stroke();

    // cue
    ctx.textAlign='center';
    if(state==='play'&&phase==='roll'){
      if(clock<revealT){ ctx.fillStyle='rgba(255,220,90,0.95)';ctx.font='bold 20px sans-serif';ctx.fillText('走者一・二塁！ ポップフライの行方を見極めろ',W/2,40); }
      else { ctx.fillStyle='rgba(140,255,160,0.98)';ctx.font='bold 22px sans-serif';ctx.fillText('判定！ 内野フライか？',W/2,40);
        const p=clamp((clock-revealT)/callWin,0,1),bw=250,x=W/2-bw/2,y=52;
        ctx.fillStyle='rgba(255,255,255,0.18)';ctx.fillRect(x,y,bw,7);ctx.fillStyle=p<0.7?'#8affa0':(p<1?'#ffd24d':'#ff5b5b');ctx.fillRect(x,y,bw*p,7); }
    }

    // buttons
    if(state==='play'){
      for(const b of BTN){ const active=phase==='roll'&&clock>=revealT;
        ctx.fillStyle=active?b.col:'rgba(255,255,255,0.10)';rr(b.x,BY,BW,BH,10);ctx.fill();
        ctx.fillStyle=active?'#08130c':'rgba(255,255,255,0.5)';ctx.textAlign='center';ctx.font='bold 16px sans-serif';ctx.fillText(b.label,b.x+BW/2,BY+26);
        ctx.font='11px sans-serif';ctx.fillText(b.sub,b.x+BW/2,BY+46); }
      ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='12px sans-serif';ctx.textAlign='center';ctx.fillText('タップ / ↑=インフィールドフライ ・ ↓=ノーコール',W/2,BY+BH+18);
    }
  }

  for(const p of parts){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,3.2,0,6.28);ctx.fill();}
  ctx.globalAlpha=1;
  for(const p of pops){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.font='bold 21px sans-serif';ctx.textAlign='center';ctx.fillText(p.txt,p.x,p.y);}
  ctx.globalAlpha=1;

  // HUD
  ctx.textAlign='left';ctx.fillStyle='#fff';ctx.font='bold 26px sans-serif';ctx.fillText('SCORE '+score,20,36);
  ctx.textAlign='right';ctx.fillStyle='rgba(255,255,255,0.9)';ctx.font='14px sans-serif';ctx.fillText('好判定 '+outs+'  Lv'+lvl,W-20,24);
  ctx.fillText('誤審',W-92,46);
  for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(W-60+i*20,41,7,0,6.28);ctx.fillStyle=i<fails?'#ff5b5b':'rgba(255,255,255,0.25)';ctx.fill();}
  if(combo>=2){ctx.textAlign='center';ctx.fillStyle='#ffd24d';ctx.font='bold 18px sans-serif';ctx.fillText('コンボ x'+combo,W/2,470);}

  if(state==='play'&&phase==='result'&&msg){ctx.textAlign='center';ctx.fillStyle=msgOk?'#9ff0b8':'#ff9a9a';ctx.font='bold 16px sans-serif';ctx.fillText(msg,W/2,464);}

  if(state==='title'){
    ctx.fillStyle='rgba(6,5,3,0.82)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='bold 34px sans-serif';ctx.fillText('インフィールドフライ',W/2,92);
    ctx.fillStyle='#ffd23e';ctx.font='bold 22px sans-serif';ctx.fillText('Infield Fly?',W/2,128);
    ctx.fillStyle='rgba(255,255,255,0.92)';ctx.font='16px sans-serif';
    ctx.fillText('走者一・二塁で上がったポップフライ。塁審としてインフィールドフライを宣告するか判定しろ',W/2,182);
    ctx.fillStyle='rgba(255,255,255,0.66)';ctx.font='14px sans-serif';
    ctx.fillText('内野手が“普通の守備”で捕れるフェアの内野フライ＝「インフィールドフライ」（↑）＝打者アウトで走者を守る',W/2,220);
    ctx.fillText('ファウル方向へ流れる／内野を越える深い打球は対象外＝「ノーコール」（↓）でそのままプレー',W/2,244);
    ctx.fillText('打球の行方が見える前の判定＝早すぎ、誤審は失格ポイント。際どい判定を当てると大量加点',W/2,268);
    ctx.fillText('上級ほどフェア/ファウル・深さが紙一重で猶予も短い。3誤審で交代',W/2,292);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で開始',W/2,360);
    ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='14px sans-serif';ctx.fillText('BEST '+best,W/2,392);
  }
  if(state==='over'){
    ctx.fillStyle='rgba(6,5,3,0.84)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#ff6b6b';ctx.font='bold 46px sans-serif';ctx.fillText('3誤審…交代',W/2,222);
    ctx.fillStyle='#fff';ctx.font='bold 40px sans-serif';ctx.fillText('SCORE '+score,W/2,290);
    ctx.fillStyle='rgba(255,255,255,0.85)';ctx.font='19px sans-serif';ctx.fillText('好判定 '+outs+'   BEST '+best,W/2,330);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で もう一度',W/2,402);
  }

  if(flash>0.02){ctx.globalAlpha=flash*0.5;ctx.fillStyle=flashCol;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}
  ctx.restore();

  ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,0.4)';ctx.font='12px sans-serif';
  ctx.fillText('インフィールドフライ：内野手が普通に捕れるフェアの内野フライなら宣告（↑）、ファウル方向/深い打球はノーコール（↓）。早判定/誤審は失敗、3つで交代',W/2,H-8);
}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

function frame(ts){let dt=ts-last;last=ts;if(dt>60)dt=60;if(dt<0)dt=0;update(dt);render();requestAnimationFrame(frame);}
requestAnimationFrame(frame);

// ---------- test hook ----------
window.__iff={
  start, callIt:(c)=>callIt(c),
  get state(){return state;},
  get score(){return score;},
  get outs(){return outs;},
  get fails(){return fails;},
  get info(){return {state,phase,clock,revealT,callWin,kind,sub,tough,decided,call,result,outs,fails,lvl,
    revealed:(clock>=revealT),canAct:(phase==='roll'&&!decided)};}
};
})();
</script>
</body>
</html>
