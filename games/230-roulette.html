<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ルーレット (Roulette Spin)</title>
<style>
  html,body{margin:0;height:100%;background:#07100a;overflow:hidden;
    font-family:-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  #stage{position:relative;width:100vw;height:100vh;max-width:calc(100vh*1.5);max-height:calc(100vw/1.5);aspect-ratio:900/600;}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;border-radius:6px;}
</style>
</head>
<body>
<div id="wrap"><div id="stage"><canvas id="cv"></canvas></div></div>
<script>
(function(){
const W=900,H=600,cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let DPR=1;
function fit(){DPR=Math.min(2,window.devicePixelRatio||1);cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
fit();addEventListener('resize',fit);

// ---------- audio ----------
let AC=null;function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function tone(f,d,type,v,sweep){const a=ac();if(!a)return;const t=a.currentTime,o=a.createOscillator(),g=a.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(sweep)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+sweep),t+d);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v||0.2,t+0.008);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+0.02);}
function noise(d,v,hp){const a=ac();if(!a)return;const t=a.currentTime,n=Math.floor(a.sampleRate*d),buf=a.createBuffer(1,n,a.sampleRate),ch=buf.getChannelData(0);
  for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource();s.buffer=buf;
  const f=a.createBiquadFilter();f.type='highpass';f.frequency.value=hp||600;const g=a.createGain();g.gain.value=v||0.2;
  s.connect(f);f.connect(g);g.connect(a.destination);s.start(t);s.stop(t+d+0.02);}
const S={
  spin:()=>{tone(420,0.09,'sine',0.14,520);noise(0.04,0.07,1200);},
  ole:()=>{noise(0.05,0.12,500);[660,880,1100,1320].forEach((f,i)=>setTimeout(()=>tone(f,0.11,'triangle',0.17),i*55));},
  bad:()=>{noise(0.16,0.22,320);tone(180,0.18,'sawtooth',0.13,-60);},
  streak:()=>{[700,930,1170,1400].forEach((f,i)=>setTimeout(()=>tone(f,0.1,'triangle',0.16),i*60));},
  over:()=>{[440,330,247,175].forEach((f,i)=>setTimeout(()=>tone(f,0.3,'triangle',0.2),i*160));}
};

// ---------- geometry ----------
const YOU={x:450,y:452};

// ---------- state ----------
let state='title', phase='approach', t=0, plays=0;
let score=0, combo=0, best=+(localStorage.getItem('roulette_best')||0);
let outs=0, fails=0, lvl=1;   // outs = defenders beaten
let clock=0, commitT=800, winDur=380, tackleT=1180;
let committedSide='L', openSide='R', acted=false, choice=null, spun=0;
let result=null, resultT=0, msg='';
let defProg=0, spinU=0, breakU=0;
let shake=0, flash=0, flashCol='#fff', last=performance.now();
let parts=[], pops=[];

function rnd(a,b){return a+Math.random()*(b-a);}
function chance(p){return Math.random()<p;}
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function lerp(a,b,u){return a+(b-a)*u;}
function easeOut(u){return 1-Math.pow(1-u,2);}
function easeInOut(u){return u<0.5?2*u*u:1-Math.pow(-2*u+2,2)/2;}

function params(){ return {
  base:Math.max(700,1150-lvl*62),
  win:Math.max(230,460-lvl*30),
  lean:Math.max(0.42,0.8-lvl*0.055)   // how strongly the defender telegraphs the committed side
};}

function reset(){state='title';score=0;combo=0;outs=0;fails=0;lvl=1;plays=0;result=null;parts=[];pops=[];}
function newPlay(){
  plays++; lvl=Math.min(7,1+Math.floor(outs/4));
  const p=params();
  commitT=rnd(p.base-150,p.base+150);
  winDur=p.win;
  tackleT=commitT+winDur;
  committedSide=chance(0.5)?'L':'R'; openSide=committedSide==='L'?'R':'L';
  clock=0; acted=false; choice=null; spun=0; defProg=0; spinU=0; breakU=0;
  result=null; phase='approach'; msg=''; resultT=0;
}
function start(){ if(!ac())ac(); if(AC&&AC.state==='suspended')AC.resume(); reset(); state='play'; newPlay(); }

function spin(dir){
  if(state==='title'){start();return;}
  if(state==='over'){ if(resultT>0.4){reset();start();} return; }
  if(state!=='play'||phase!=='play'||acted) return;
  acted=true; choice=dir; spun=1; S.spin();
  if(clock<commitT){ resolve('early',dir); }         // spun before the defender committed
  else if(dir===openSide){ resolve('evade',dir); }   // correct: spun to the open side in the window
  else { resolve('wrong',dir); }                       // spun into the committed side
}

function resolve(kind,dir){
  phase='result'; result=kind; resultT=0; if(dir)choice=dir;
  const good=(kind==='evade');
  if(good){
    outs++; combo++;
    const add=Math.round(110*(1+Math.min(9,combo-1)*0.16)); score+=add;
    S.ole(); flash=1;flashCol='#ffe08a';shake=6;
    burst(YOU.x,YOU.y-6,'#ffe08a',18,6);
    pop(YOU.x,YOU.y-70,'抜いた！ +'+add,'#fff3c4');
    pop(YOU.x,YOU.y-96,'オーレ！','#ffd24d');
    if(combo>=2)pop(450,150,'コンボ x'+combo,'#ffd24d');
    if(combo>0&&combo%5===0)S.streak();
    msg='ルーレット成功！ 空いた方へ回して抜き去った！';
  } else {
    fails++; combo=0; flash=1;flashCol='#ff5b5b';shake=8; S.bad();
    if(kind==='early') msg='早すぎ！ 仕掛ける前に回してDFに読まれた';
    else if(kind==='wrong') msg='逆！ 踏み込んだ側へ回してボールを奪われた';
    else msg='遅い！ タックルにボールを刈られた';
    pop(YOU.x,YOU.y-70,'奪われた…','#ffb0b0');
  }
  if(fails>=3){ state='over'; resultT=0; S.over(); if(score>best){best=score;localStorage.setItem('roulette_best',best);} }
}

// ---------- input ----------
function sideFromX(cx){ const r=cv.getBoundingClientRect(); const x=(cx-r.left)/r.width; return x<0.5?'L':'R'; }
cv.addEventListener('pointerdown',e=>{e.preventDefault();
  if(state==='title'){start();return;}
  if(state==='over'){ if(resultT>0.4){reset();start();} return; }
  spin(sideFromX(e.clientX));
});
addEventListener('keydown',e=>{
  if(e.code==='ArrowLeft'||e.code==='KeyA'){e.preventDefault();spin('L');}
  else if(e.code==='ArrowRight'||e.code==='KeyD'){e.preventDefault();spin('R');}
  else if(e.code==='Space'||e.code==='Enter'){e.preventDefault();
    if(state==='title')start(); else if(state==='over'&&resultT>0.4){reset();start();}}
});

// ---------- particles ----------
function burst(x,y,c,n,sp){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=rnd(sp*0.3,sp);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:1,c});}}
function pop(x,y,txt,c){pops.push({x,y,txt,c,life:1});}

// ---------- update ----------
function update(dt){
  shake*=Math.pow(0.86,dt/16.7); if(shake<0.3)shake=0;
  flash*=Math.pow(0.9,dt/16.7);
  for(const p of parts){p.vx*=0.96;p.vy=p.vy*0.96+0.28;p.x+=p.vx*dt/16.7;p.y+=p.vy*dt/16.7;p.life-=dt/16.7*0.026;}
  parts=parts.filter(p=>p.life>0);
  for(const p of pops){p.y-=dt/16.7*0.5;p.life-=dt/16.7*0.02;}
  pops=pops.filter(p=>p.life>0);

  if(state!=='play'){ if(state==='over')resultT+=dt/1000; return; }
  t+=dt;
  if(phase==='play'){
    clock+=dt;
    defProg=clamp(clock/commitT,0,1);
    if(!acted && clock>=tackleT){ resolve('tackled'); }
    return;
  }
  if(phase==='result'){
    resultT+=dt/1000;
    if(result==='evade'){ spinU=Math.min(1,spinU+dt/260); breakU=Math.min(1,breakU+dt/420); }
    else { spinU=Math.min(1,spinU+dt/220); }
    if(resultT>1.25 && state==='play') newPlay();
    return;
  }
}

// alias phase names: 'approach' used only at newPlay init; play loop uses 'play'
// (newPlay sets phase='approach'; convert to 'play' immediately)
function ensurePlay(){ if(state==='play'&&phase==='approach')phase='play'; }

// ---------- render ----------
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function drawScene(){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#2f8a41');g.addColorStop(1,'#1c5a28');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  // mowing stripes
  ctx.fillStyle='rgba(255,255,255,0.035)';
  for(let i=0;i<7;i++){ if(i%2===0)ctx.fillRect(0,i*H/7,W,H/7); }
  // upfield goal hint (top, kept clear of the header text)
  ctx.strokeStyle='rgba(255,255,255,0.4)';ctx.lineWidth=5;
  ctx.strokeRect(378,74,144,34);
  ctx.strokeStyle='rgba(255,255,255,0.14)';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(300,150);ctx.lineTo(600,150);ctx.stroke();
}
function drawYou(x,y,rot){
  ctx.save();ctx.translate(x,y);ctx.rotate(rot||0);
  ctx.fillStyle='rgba(0,0,0,0.22)';ctx.beginPath();ctx.ellipse(0,13,12,4,0,0,6.28);ctx.fill();
  ctx.fillStyle='#2b6cff';rr(-9,-12,18,26,7);ctx.fill();
  ctx.fillStyle='#f2c9a0';ctx.beginPath();ctx.arc(0,-17,7,0,6.28);ctx.fill();
  ctx.restore();
}
function drawDef(x,y,leanx){
  ctx.save();ctx.translate(x,y);
  ctx.fillStyle='rgba(0,0,0,0.22)';ctx.beginPath();ctx.ellipse(0,13,12,4,0,0,6.28);ctx.fill();
  // committed foot / lunge leg toward leanx
  if(leanx!==0){ ctx.strokeStyle='#d23a3a';ctx.lineWidth=7;ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(0,6);ctx.lineTo(leanx*30,16);ctx.stroke(); }
  ctx.save();ctx.translate(leanx*8,0);
  ctx.fillStyle='#e23c3c';rr(-9,-12,18,26,7);ctx.fill();
  ctx.fillStyle='#f2c9a0';ctx.beginPath();ctx.arc(0,-17,7,0,6.28);ctx.fill();
  ctx.restore();
  ctx.restore();
}

function render(){
  ensurePlay();
  ctx.save();
  if(shake>0)ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
  drawScene();

  if(state==='play'){
    const committed = (phase==='play' && clock>=commitT) || (phase==='result');
    const sgn = committedSide==='L'?-1:1;
    const p=params();
    // defender: approaches from top, at commit leans to committed side
    let defY=lerp(300,392,easeOut(defProg));
    let leanAmt=0;
    if(phase==='play'){
      if(clock>=commitT){ const wu=clamp((clock-commitT)/Math.max(120,winDur*0.5),0,1); leanAmt=sgn*p.lean*wu; }
    } else if(phase==='result'){ leanAmt=sgn*p.lean; defY=392; }
    const defX=450+leanAmt*46;

    // you: on evade, spin ball around open side then break upfield
    let youX=YOU.x, youY=YOU.y, youRot=0;
    if(phase==='result'&&result==='evade'){
      const os=openSide==='L'?-1:1;
      youX=YOU.x+os*lerp(0,44,easeInOut(spinU))*(1-breakU*0.4);
      youY=YOU.y-lerp(0,120,easeOut(breakU));
      youRot=os*spinU*6.28;
    } else if(phase==='result'&&result!=='evade'){
      youRot=(choice==='L'?-1:1)*spinU*3.0;
    }

    // draw order by depth
    drawDef(defX,defY,leanAmt===0?0:sgn);
    drawYou(youX,youY,youRot);

    // ball near your feet, loops around on spin
    let bx,by;
    if(phase==='result'&&result==='evade'){
      const os=openSide==='L'?-1:1; const ang=os*spinU*6.28 - Math.PI/2;
      const rad=lerp(20,10,breakU);
      bx=youX+Math.cos(ang)*rad; by=youY+Math.sin(ang)*rad*0.7+6;
    } else { bx=youX+(choice==='L'?-1:choice==='R'?1:0)*spinU*14; by=youY+12; }
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(bx,by,6,0,6.28);ctx.fill();

    // spin window ring + directional arrows during window
    if(phase==='play'&&committed){
      const u=clamp((clock-commitT)/winDur,0,1);
      const rad=lerp(58,26,u);
      ctx.strokeStyle='rgba(150,240,170,0.9)';ctx.lineWidth=3;
      ctx.beginPath();ctx.arc(YOU.x,YOU.y,rad,0,6.28);ctx.stroke();
      // hint arrow to open side
      const os=openSide==='L'?-1:1;
      ctx.fillStyle='#9ff0b8';ctx.font='bold 15px sans-serif';ctx.textAlign='center';
      ctx.fillText('今！空いた方へ回せ',YOU.x,YOU.y-70);
      ctx.save();ctx.translate(YOU.x+os*84,YOU.y-6);
      ctx.fillStyle='rgba(159,240,184,0.9)';ctx.beginPath();
      if(os<0){ctx.moveTo(-14,0);ctx.lineTo(4,-11);ctx.lineTo(4,11);}else{ctx.moveTo(14,0);ctx.lineTo(-4,-11);ctx.lineTo(-4,11);}
      ctx.closePath();ctx.fill();ctx.restore();
    } else if(phase==='play'&&!committed){
      // approach cue: watch which way the defender commits
      ctx.fillStyle='rgba(255,255,255,0.7)';ctx.font='14px sans-serif';ctx.textAlign='center';
      ctx.fillText('DFが踏み込む方向を見極めろ…',YOU.x,YOU.y-70);
    }

    // commit-timer bar
    const bw=220,bx0=W/2-bw/2,byy=H-40;
    ctx.fillStyle='rgba(0,0,0,0.3)';rr(bx0-3,byy-3,bw+6,16,7);ctx.fill();
    ctx.fillStyle=committed?'#9ff0b8':'#7fd0ff';
    const barU=phase==='play'?(committed?clamp((clock-commitT)/winDur,0,1):defProg):1;
    rr(bx0,byy,bw*barU,10,4);ctx.fill();
    ctx.fillStyle='rgba(255,255,255,0.72)';ctx.font='11px sans-serif';ctx.textAlign='right';
    ctx.fillText(committed?'回す猶予':'DF接近',bx0-8,byy+9);
  }

  for(const p of parts){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,3.2,0,6.28);ctx.fill();}
  ctx.globalAlpha=1;
  for(const p of pops){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.font='bold 22px sans-serif';ctx.textAlign='center';ctx.fillText(p.txt,p.x,p.y);}
  ctx.globalAlpha=1;

  // HUD
  ctx.textAlign='left';ctx.fillStyle='#fff';ctx.font='bold 26px sans-serif';ctx.fillText('SCORE '+score,20,36);
  ctx.textAlign='right';ctx.fillStyle='rgba(255,255,255,0.9)';ctx.font='14px sans-serif';ctx.fillText('抜き '+outs+'  Lv'+lvl,W-20,24);
  ctx.fillText('被奪',W-92,46);
  for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(W-60+i*20,41,7,0,6.28);ctx.fillStyle=i<fails?'#ff5b5b':'rgba(255,255,255,0.25)';ctx.fill();}
  if(combo>=2){ctx.textAlign='center';ctx.fillStyle='#ffd24d';ctx.font='bold 18px sans-serif';ctx.fillText('コンボ x'+combo,W/2,112);}

  if(state==='play'&&phase==='play'){ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,0.9)';ctx.font='bold 15px sans-serif';
    ctx.fillText('DFが踏み込んだら、その“逆側”へルーレットで回せ（左半分/→ / 右半分/←）',W/2,44);}
  if(state==='play'&&phase==='result'&&msg){ctx.textAlign='center';ctx.fillStyle=(result==='evade')?'#9ff0b8':'#ff9a9a';ctx.font='bold 20px sans-serif';ctx.fillText(msg,W/2,44);}

  if(state==='title'){
    ctx.fillStyle='rgba(5,12,7,0.72)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='bold 44px sans-serif';ctx.fillText('ルーレット',W/2,120);
    ctx.fillStyle='#ffd23e';ctx.font='bold 22px sans-serif';ctx.fillText('Roulette Spin',W/2,156);
    ctx.fillStyle='rgba(255,255,255,0.92)';ctx.font='16px sans-serif';
    ctx.fillText('タックルに来たDFを“くるり”とかわす、マルセイユ・ルーレット',W/2,206);
    ctx.fillStyle='rgba(255,255,255,0.66)';ctx.font='14px sans-serif';
    ctx.fillText('DFが左右どちらかへ踏み込む（赤い足が伸びる）',W/2,244);
    ctx.fillText('踏み込んだ“逆側（空いた方）”へ、緑リングの間に回す',W/2,266);
    ctx.fillText('回す＝踏み込んだ逆へ：左に踏めば右へ／右に踏めば左へ',W/2,288);
    ctx.fillText('踏み込む前に回すと読まれ、同じ側へ回すと足に刈られる。遅れてもタックルされる',W/2,310);
    ctx.fillText('操作：左半分/→キー=左へ回す、右半分/←キー=右へ回す（画面の“空き側”へ）',W/2,332);
    ctx.fillText('速い判断ほど高得点＆コンボ。上級ほど踏み込みが速く猶予が短い。3被奪で交代',W/2,354);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で開始',W/2,410);
    ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='14px sans-serif';ctx.fillText('BEST '+best,W/2,442);
  }
  if(state==='over'){
    ctx.fillStyle='rgba(5,12,7,0.8)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#ff6b6b';ctx.font='bold 46px sans-serif';ctx.fillText('3被奪…交代',W/2,222);
    ctx.fillStyle='#fff';ctx.font='bold 40px sans-serif';ctx.fillText('SCORE '+score,W/2,290);
    ctx.fillStyle='rgba(255,255,255,0.85)';ctx.font='19px sans-serif';ctx.fillText('抜き '+outs+'   BEST '+best,W/2,330);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で もう一度',W/2,402);
  }

  if(flash>0.02){ctx.globalAlpha=flash*0.5;ctx.fillStyle=flashCol;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}
  ctx.restore();

  ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,0.4)';ctx.font='12px sans-serif';
  ctx.fillText('DFの踏み込みを見て“逆側”へルーレット（左半分/右半分・←/→）。早い/逆/遅いは被奪。3被奪で交代',W/2,H-8);
}

function frame(ts){let dt=ts-last;last=ts;if(dt>60)dt=60;if(dt<0)dt=0;update(dt);render();requestAnimationFrame(frame);}
requestAnimationFrame(frame);

// ---------- test hook ----------
window.__ro={
  start, spin:(d)=>spin(d),
  get state(){return state;},
  get score(){return score;},
  get outs(){return outs;},
  get fails(){return fails;},
  get info(){ensurePlay();return {state,phase,committedSide,openSide,clock,commitT,winStart:commitT,winEnd:tackleT,
    canSpin:(phase==='play'&&!acted&&clock>=commitT&&clock<=tackleT),committed:(phase==='play'&&clock>=commitT),
    acted,result,outs,fails,lvl};}
};
})();
</script>
</body>
</html>
