<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>タッチをかわせ (Hook Slide)</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;background:#0a1206;overflow:hidden;font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",system-ui,sans-serif}
  #wrap{width:100%;height:100%;display:flex;align-items:center;justify-content:center}
  #stage{position:relative;width:min(100vw,calc(100vh*1.5));aspect-ratio:900/600;max-width:900px;
    box-shadow:0 10px 60px rgba(0,0,0,.6);border-radius:10px;overflow:hidden;touch-action:none}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
  #hint{position:absolute;left:0;bottom:6px;width:100%;text-align:center;color:#cfe;
    font-size:12px;opacity:.55;pointer-events:none;text-shadow:0 1px 3px #000}
</style>
</head>
<body>
<div id="wrap"><div id="stage">
  <canvas id="cv"></canvas>
  <div id="hint">タッチが来る側の逆へフックスライド！ ベース手前のタイミングで ← 左 / → 右。グラブの位置を見極めろ（タップ左右でも可）</div>
</div></div>
<script>
(()=>{
const cv=document.getElementById('cv'), g=cv.getContext('2d');
const W=900,H=600;
let DPR=1;
function fit(){ DPR=Math.min(2,window.devicePixelRatio||1); cv.width=W*DPR; cv.height=H*DPR; g.setTransform(DPR,0,0,DPR,0,0); }
fit(); addEventListener('resize',fit);

// ---------- audio ----------
let AC=null;
function ac(){ if(!AC){ try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){} } return AC; }
function tone(f,d,t,v,sweep){ const a=ac(); if(!a)return; const o=a.createOscillator(),gg=a.createGain();
  o.type=t||'sine'; o.frequency.value=f; if(sweep) o.frequency.exponentialRampToValueAtTime(Math.max(20,sweep),a.currentTime+d);
  gg.gain.setValueAtTime(0.0001,a.currentTime); gg.gain.exponentialRampToValueAtTime(v||0.2,a.currentTime+0.012);
  gg.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+d); o.connect(gg).connect(a.destination);
  o.start(); o.stop(a.currentTime+d+0.02); }
function noise(d,v,hp){ const a=ac(); if(!a)return; const n=a.createBuffer(1,a.sampleRate*d,a.sampleRate); const ch=n.getChannelData(0);
  for(let i=0;i<ch.length;i++) ch[i]=(Math.random()*2-1)*(1-i/ch.length);
  const s=a.createBufferSource(); s.buffer=n; const f=a.createBiquadFilter(); f.type='highpass'; f.frequency.value=hp||600;
  const gg=a.createGain(); gg.gain.value=v||0.15; s.connect(f).connect(gg).connect(a.destination); s.start(); }
const S={
  throw(){ tone(520,0.06,'triangle',0.08,760); },
  slide(){ noise(0.18,0.2,300); },
  safe(){ tone(520,0.1,'triangle',0.14,780); setTimeout(()=>tone(780,0.12,'triangle',0.12,1040),90); noise(0.25,0.09,400); },
  clutch(){ tone(660,0.09,'square',0.1,980); setTimeout(()=>tone(990,0.13,'triangle',0.1,1320),100); },
  out(){ noise(0.14,0.2,400); tone(200,0.16,'sawtooth',0.13,80); },
  over(){ tone(300,0.5,'sawtooth',0.16,90); setTimeout(()=>tone(200,0.6,'sawtooth',0.14,60),160); },
};

// ---------- geometry ----------
const BAG={x:450,y:320};
const START={x:770,y:392};
const CORNERX=48;               // hook corner offset

// ---------- state ----------
let state='title';
let parts=[], pops=[];
let score, combo, best, lvl, outs, safes;
let phase='run', play=null, t=0, resT=0, pend=null, pendDelay=0;
let flash=0, shakeT=0;
try{ best=+localStorage.getItem('hs_best')||0; }catch(e){ best=0; }

const crowd=[]; { const cc=['#e6b48f','#9bd0e6','#e6dc8f','#c9a0d8','#8fd8bd','#f0f0f0']; for(let i=0;i<200;i++) crowd.push({x:(i*29.7)%W, y:2+((i*61)%42), c:cc[i%cc.length]}); }
function clamp(v,a,b){ return v<a?a:v>b?b:v; }
function rnd(a,b){ return a+Math.random()*(b-a); }
function chance(p){ return Math.random()<p; }

function reset(){ parts=[]; pops=[]; score=0; combo=0; lvl=0; outs=0; safes=0; newPlay(); }
function newPlay(){
  phase='run'; t=0; resT=0; pend=null;
  const setSide = chance(0.5)?'L':'R';
  const feint = chance(clamp((lvl-2)*0.18,0,0.6));            // late glove switch
  const realSide = feint ? (setSide==='L'?'R':'L') : setSide;
  const approachT = clamp(1500 - lvl*105, 820, 1500);
  const Tset = approachT*0.34, flipT = approachT*0.62;
  const winStart = approachT*0.60, winEnd = approachT*0.985;
  // throw origin (from outfield toward the bag, biased to the set side for a tell)
  const from = { x: setSide==='L'? rnd(180,360):rnd(540,720), y: rnd(70,150) };
  play={ setSide, realSide, feint, approachT, Tset, flipT, winStart, winEnd, from,
    revealed:false, glove:setSide, ball:{x:from.x,y:from.y}, runU:0.06,
    hooked:false, hookDir:null, hookT:0, res:null, applied:false, clutch:false };
  S.throw();
}
function gloveSide(){ const p=play; if(t>=p.flipT) return p.realSide; if(t>=p.Tset) return p.setSide; return null; }

function hook(dir){ if(state!=='play'||phase!=='run'||play.hooked) return;
  const p=play; p.hooked=true; p.hookDir=dir; p.hookT=t; p.hookU=p.runU; S.slide();
  for(let i=0;i<8;i++) parts.push({x:runPos().x,y:runPos().y,vx:rnd(-3,2),vy:rnd(-2,2),life:0.7,c:'#d8c090'});
  // decide result
  const inWin = t>=p.winStart && t<=p.winEnd;
  const realGlove = p.realSide;
  if(!inWin){ p.res = t<p.winStart ? 'early':'late'; }
  else { p.res = (dir!==realGlove) ? 'safe' : 'tagged'; if(p.res==='safe' && t>p.winStart+(p.winEnd-p.winStart)*0.5) p.clutch=true; }
  phase='slide';
}
function runPos(){ const p=play; const u=clamp(p.runU,0,1); return { x:START.x+(BAG.x-START.x)*u, y:START.y+(BAG.y+8-START.y)*u }; }

function resolveNow(){
  const p=play, r=p.res;
  if(r==='safe'){ safes++; combo++; const gained=(p.clutch?150:100)+combo*10; score+=gained;
    (p.clutch?S.clutch():S.safe()); flash=Math.max(flash,p.clutch?0.4:0.28);
    pops.push({txt:(p.clutch?'際どく セーフ！ +':'セーフ！ +')+gained,x:W/2,y:150,big:true,life:1.1,c:'#8fffb0'});
    if(p.clutch) pops.push({txt:'グラブの逆を取った！',x:W/2,y:194,big:false,life:1.0,c:'#7fd8ff'});
    for(let i=0;i<16;i++) parts.push({x:BAG.x,y:BAG.y,vx:rnd(-6,6),vy:rnd(-6,-1),life:1.0,c:'#bfffcf'});
    lvl=Math.min(6, Math.floor(safes/3 + Math.floor(score/700)));
    end(true);
  } else {
    outs++; combo=0; shakeT=0.3; flash=Math.max(flash,0.32); S.out();
    const msg = r==='tagged'?'グラブに突っ込んだ！タッチアウト':(r==='early'?'早すぎ…届かずタッチ':'遅れてタッチアウト');
    pops.push({txt:msg,x:W/2,y:155,big:true,life:1.1,c:'#ff6a6a'});
    for(let i=0;i<10;i++) parts.push({x:BAG.x,y:BAG.y,vx:rnd(-6,6),vy:rnd(-5,2),life:0.9,c:'#ff9a6a'});
    end(false);
  }
}
function end(ok){ phase='resolve'; resT=0; pendDelay=ok?880:1050; pend = outs>=3 ? 'over' : 'next'; }
function gameOver(){ state='over'; S.over(); if(score>best){ best=score; try{localStorage.setItem('hs_best',best);}catch(e){} } }

// ---------- input ----------
function start(){ ac(); reset(); state='play'; }
function pt(e){ const r=cv.getBoundingClientRect(); return {x:(e.clientX-r.left)/r.width*W, y:(e.clientY-r.top)/r.height*H}; }
cv.addEventListener('pointerdown',e=>{ ac(); if(state!=='play'){ start(); return; }
  if(phase==='run'){ const p=pt(e); hook(p.x<BAG.x?'L':'R'); } e.preventDefault(); });
addEventListener('keydown',e=>{ const k=e.key.toLowerCase();
  if(state!=='play'){ if(!e.repeat) start(); return; }
  if(phase==='run'){ if(k==='arrowleft'||k==='a'){ hook('L'); e.preventDefault(); } else if(k==='arrowright'||k==='d'){ hook('R'); e.preventDefault(); } } });

// ---------- update ----------
function update(dt){
  if(flash>0) flash=Math.max(0,flash-dt*0.003);
  if(shakeT>0) shakeT-=dt*0.001;
  parts.forEach(q=>{q.x+=q.vx;q.y+=q.vy;q.vy+=0.14;q.life-=dt*0.0022;});
  parts=parts.filter(q=>q.life>0);
  pops.forEach(q=>{q.y-=dt*0.02;q.life-=dt*0.0014;});
  pops=pops.filter(q=>q.life>0);
  if(state!=='play') return;
  const p=play;
  // ball flies to the bag over the approach (arrives ~Tset)
  { const bf=clamp(t/(p.Tset+60),0,1); p.ball.x=p.from.x+(BAG.x-p.from.x)*bf; p.ball.y=p.from.y+(BAG.y-24-p.from.y)*bf; }
  p.glove=gloveSide();

  if(phase==='run'){
    t+=dt; p.runU=0.06 + 0.80*clamp(t/p.approachT,0,1);
    if(t>=p.approachT && !p.hooked){ p.hooked=true; p.res='late'; p.hookDir=null; p.hookU=p.runU; phase='slide'; p.hookT=t; }
  } else if(phase==='slide'){
    p.hookT2=(p.hookT2||0)+dt; const sf=clamp(p.hookT2/300,0,1);
    // slide toward the chosen corner (or short if early)
    const targetU = p.res==='early'? Math.min(0.9, p.hookU+0.12) : 1.0;
    p.runU = p.hookU + (targetU-p.hookU)*sf;
    if(sf>=1 && !p.applied){ p.applied=true; resolveNow(); }
  } else if(phase==='resolve'){
    resT+=dt;
    if(resT>=pendDelay && pend){ const pp=pend; pend=null; if(pp==='over') gameOver(); else newPlay(); }
  }
}

// ---------- render ----------
function bagd(){ g.save(); g.translate(BAG.x,BAG.y); g.rotate(Math.PI/4); g.fillStyle='#eee'; g.fillRect(-17,-17,34,34); g.strokeStyle='rgba(0,0,0,0.25)'; g.lineWidth=1; g.strokeRect(-17,-17,34,34); g.restore(); }
function drawRunner(){ const p=play; const rp=runPos();
  const sliding = phase==='slide'||phase==='resolve';
  if(sliding && p.hookDir){ const corner = p.hookDir==='L'? -CORNERX:CORNERX; // shift toward hook corner
    const sf=clamp((p.hookT2||0)/300,0,1); const cx=rp.x, cy=rp.y+ (p.hookDir==='L'?-1:1)*0;
    g.save(); g.translate(cx, cy); g.rotate((p.hookDir==='L'?-1:1)*0.5*sf);
    g.fillStyle='#2f6fd0'; g.fillRect(-20,-8,40,15); g.beginPath(); g.arc(-20,-2,9,0,6.28); g.fillStyle='#e9c6a0'; g.fill();
    g.restore();
    // hook hand reaching the far corner
    g.fillStyle='#e9c6a0'; g.beginPath(); g.arc(BAG.x+corner, BAG.y+ (p.hookDir==='L'?-2:2), 6, 0,6.28); g.fill();
  } else {
    g.fillStyle='#2f6fd0'; g.beginPath(); g.arc(rp.x,rp.y-14,10,0,6.28); g.fill(); g.fillRect(rp.x-9,rp.y-12,18,22);
    g.fillStyle='rgba(0,0,0,0.16)'; g.beginPath(); g.ellipse(rp.x,rp.y+6,12,4,0,0,6.28); g.fill();
  }
}
function drawField(){
  const gr=g.createLinearGradient(0,0,0,H); gr.addColorStop(0,'#25864a'); gr.addColorStop(1,'#1e6f3a'); g.fillStyle=gr; g.fillRect(0,0,W,H);
  g.fillStyle='#0e2233'; g.fillRect(0,0,W,40);
  for(const c of crowd){ g.fillStyle=c.c; g.globalAlpha=0.6; g.fillRect(c.x,c.y,3,3); } g.globalAlpha=1;
  g.fillStyle='#7a5233'; g.beginPath(); g.arc(BAG.x,BAG.y+4,92,0,6.28); g.fill();
  // basepath from start to bag
  g.strokeStyle='rgba(255,255,255,0.5)'; g.lineWidth=3; g.beginPath(); g.moveTo(START.x+30,START.y+20); g.lineTo(BAG.x,BAG.y); g.stroke();
  bagd();
}
function drawScene(){
  const p=play;
  // fielder at the bag with glove on current glove side
  const gs = p.glove; const gx = BAG.x + (gs==='L'?-30:(gs==='R'?30:0)); const gy=BAG.y-6;
  g.fillStyle='#3550a0'; g.beginPath(); g.arc(BAG.x, BAG.y-30,11,0,6.28); g.fill(); g.fillRect(BAG.x-11,BAG.y-28,22,24);
  // glove (with ball once caught)
  if(gs){ g.fillStyle=(t>=p.flipT&&p.feint)?'#ffd84a':'#c98a2a'; g.beginPath(); g.arc(gx,gy,12,0,6.28); g.fill();
    g.fillStyle='#fff'; g.beginPath(); g.arc(gx,gy,5,0,6.28); g.fill();
    g.fillStyle='#ff6a6a'; g.font='bold 13px sans-serif'; g.textAlign='center'; g.fillText('タッチ',gx, gy-18); }
  else { // ball still flying to the bag
    g.fillStyle='#fff'; g.beginPath(); g.arc(p.ball.x,p.ball.y,6,0,6.28); g.fill(); }
  drawRunner();
  // prompt + window indicator
  if(phase==='run'){
    g.textAlign='center';
    const inWin = t>=p.winStart && t<=p.winEnd;
    g.fillStyle=inWin?'#8fffb0':'rgba(255,255,255,0.7)'; g.font='bold 19px sans-serif';
    g.fillText(gs? (inWin?'今だ！グラブの逆へフック！':'グラブの位置を見る…') : '送球到達を待つ…', W/2, 70);
    // slide-window bar
    const f=clamp(t/p.approachT,0,1);
    g.fillStyle='rgba(255,255,255,0.18)'; g.fillRect(W/2-160,96,320,8);
    g.fillStyle='rgba(143,255,176,0.5)'; g.fillRect(W/2-160+320*p.winStart/1, 96, 320*(p.winEnd-p.winStart), 8);
    g.fillStyle='#fff'; g.fillRect(W/2-160+320*f-1,92,3,16);
    g.fillStyle='rgba(255,255,255,0.5)'; g.font='bold 13px sans-serif'; g.fillText('← 左へフック    右へフック →',W/2,H-40);
  }
}
function drawHUD(){
  g.textAlign='left'; g.fillStyle='#fff'; g.font='bold 25px sans-serif'; g.fillText('SCORE '+score,20,34);
  if(combo>1){ g.fillStyle='#ffd84a'; g.font='bold 16px sans-serif'; g.fillText(combo+' 連続セーフ',20,56); }
  g.textAlign='right'; g.fillStyle='rgba(255,255,255,0.8)'; g.font='14px sans-serif'; g.fillText('セーフ '+safes+'  Lv.'+(lvl+1),W-20,32);
  g.fillStyle='#ff6a6a'; g.textAlign='right'; g.font='bold 14px sans-serif'; g.fillText('OUT',W-92,H-18);
  for(let i=0;i<3;i++){ g.fillStyle=i<outs?'#ff5a5a':'rgba(255,255,255,0.24)'; g.beginPath(); g.arc(W-70+i*22,H-23,8,0,6.28); g.fill(); }
}
function drawTitle(){
  g.fillStyle='rgba(0,0,0,0.5)'; g.fillRect(0,0,W,H);
  g.textAlign='center'; g.fillStyle='#8fffb0'; g.font='bold 52px sans-serif'; g.fillText('タッチをかわせ',W/2,158);
  g.fillStyle='#fff'; g.font='bold 22px sans-serif'; g.fillText('Hook Slide — グラブの逆を取れ',W/2,196);
  g.fillStyle='#cfe'; g.font='18px sans-serif';
  g.fillText('野手のグラブ（タッチ）が構える側を見極め、',W/2,250);
  g.fillText('ベース手前のスライド帯で 逆サイドへフック（← / →）。',W/2,278);
  g.fillText('早すぎると届かず、遅れると立ったままタッチアウト。',W/2,306);
  g.fillText('上級はグラブを直前で持ち替えるフェイントも。3アウトで終了。',W/2,334);
  g.fillStyle='#ffd84a'; g.font='bold 22px sans-serif'; g.fillText('クリック / タップ / キー でスタート',W/2,402);
}
function drawOver(){
  g.fillStyle='rgba(0,0,0,0.62)'; g.fillRect(0,0,W,H);
  g.textAlign='center'; g.fillStyle='#ff6a6a'; g.font='bold 54px sans-serif'; g.fillText('3アウト…終了',W/2,H/2-54);
  g.fillStyle='#fff'; g.font='bold 34px sans-serif'; g.fillText('SCORE '+score,W/2,H/2+2);
  g.fillStyle='#cfe'; g.font='20px sans-serif'; g.fillText('セーフ '+safes+'　BEST '+best,W/2,H/2+40);
  g.fillStyle='#8fffb0'; g.font='bold 22px sans-serif'; g.fillText('クリック / タップ で もう一度',W/2,H/2+96);
}
function render(){
  g.setTransform(DPR,0,0,DPR,0,0);
  let sx=0,sy=0; if(shakeT>0){ sx=rnd(-6,6)*shakeT*3; sy=rnd(-6,6)*shakeT*3; g.translate(sx,sy); }
  drawField();
  if(state==='play'||state==='over') drawScene();
  parts.forEach(q=>{ g.globalAlpha=clamp(q.life,0,1); g.fillStyle=q.c; g.beginPath(); g.arc(q.x,q.y,3,0,6.28); g.fill(); }); g.globalAlpha=1;
  pops.forEach(q=>{ g.globalAlpha=clamp(q.life,0,1); g.textAlign='center'; g.fillStyle=q.c; g.font='bold '+(q.big?32:22)+'px sans-serif';
    const px=(q.x==null)?W/2:q.x; g.fillText(q.txt,px,q.y); }); g.globalAlpha=1;
  if(state==='play') drawHUD();
  if(flash>0){ g.fillStyle='rgba(255,255,255,'+(flash*0.6)+')'; g.fillRect(0,0,W,H); }
  if(state==='title') drawTitle();
  if(state==='over') drawOver();
  g.setTransform(DPR,0,0,DPR,0,0);
}

let last=0;
function frame(ts){ let dt=ts-last; last=ts; if(dt>60)dt=60; if(dt<0)dt=0; update(dt); render(); requestAnimationFrame(frame); }
requestAnimationFrame(frame);

// ---------- test hook ----------
window.__hs={
  start, hookL:()=>hook('L'), hookR:()=>hook('R'),
  get state(){return state;}, get score(){return score;}, get outs(){return outs;}, get safes(){return safes;},
  get info(){ if(state!=='play') return {state,phase:'-'}; const p=play; return {
    state, phase, t, approachT:p&&p.approachT, glove:p&&p.glove, realSide:p&&p.realSide,
    inWindow: p? (t>=p.winStart && t<=p.winEnd):false, winStart:p&&p.winStart, winEnd:p&&p.winEnd, res:p&&p.res, outs, safes }; }
};
})();
</script>
</body>
</html>
