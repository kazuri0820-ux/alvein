<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>サッカー人生スゴロク — Soccer Career Sugoroku</title>
<style>
  :root{
    --board:#137a43; --board-d:#0e5f34; --frame:#08251a;
    --tile:#f4efe0; --tile-edge:#d8cfb2; --ink:#0c2a1a; --chalk:#f4f7f2;
    --gold:#ffcf3a; --skill:#3a9bd8; --money:#3ec46b; --fame:#ff8a3c; --danger:#e0503a;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:#04120b;font-family:"Arial Narrow","Roboto Condensed",system-ui,sans-serif;
    color:var(--chalk);display:flex;align-items:center;justify-content:center;
    overflow:hidden;-webkit-user-select:none;user-select:none;touch-action:manipulation;}
  #stage{position:relative;width:min(100vw,calc(100vh*1.5));aspect-ratio:3/2;max-height:100vh;
    box-shadow:0 30px 80px rgba(0,0,0,.6);overflow:hidden;background:#0e5f34;}
  canvas{display:block;width:100%;height:100%}
  /* HUD */
  #hud{position:absolute;top:0;left:0;right:0;display:flex;gap:6px;padding:clamp(5px,1.1vw,10px);
    pointer-events:none;flex-wrap:wrap;justify-content:center;}
  .stat{background:rgba(8,37,26,.82);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.14);
    border-radius:9px;padding:4px clamp(7px,1.2vw,13px);display:flex;flex-direction:column;line-height:1;min-width:clamp(58px,10vw,90px);}
  .stat .label{font-size:clamp(8px,1.15vw,11px);letter-spacing:.14em;text-transform:uppercase;opacity:.85}
  .stat .value{font-family:"Courier New",monospace;font-weight:700;font-size:clamp(15px,2.9vw,26px);
    font-variant-numeric:tabular-nums;}
  .stat.skill .label{color:var(--skill)} .stat.fame .label{color:var(--fame)}
  .stat.money .label{color:var(--money)} .stat.goals .label{color:var(--gold)}
  .stat.season .label{color:#cfe6d6}
  /* bottom bar */
  #bottom{position:absolute;bottom:0;left:0;right:0;display:flex;align-items:center;justify-content:center;
    gap:14px;padding:10px 14px calc(10px + env(safe-area-inset-bottom));
    background:linear-gradient(transparent,rgba(8,37,26,.8));}
  #rollBtn{pointer-events:auto;cursor:pointer;border:none;border-radius:100px;
    padding:clamp(11px,1.8vw,16px) clamp(26px,5vw,48px);font-family:inherit;font-weight:900;
    font-size:clamp(16px,3vw,24px);letter-spacing:.1em;text-transform:uppercase;color:var(--ink);
    background:linear-gradient(180deg,var(--gold),#e0a81f);box-shadow:0 7px 0 #a8790f,0 12px 26px rgba(0,0,0,.5);
    transition:transform .08s,box-shadow .08s;}
  #rollBtn:active{transform:translateY(4px);box-shadow:0 3px 0 #a8790f,0 6px 14px rgba(0,0,0,.5)}
  #rollBtn:disabled{filter:grayscale(.6) brightness(.7);cursor:default}
  #rollBtn:focus-visible{outline:3px solid var(--skill);outline-offset:4px}
  #status{font-size:clamp(12px,2.2vw,17px);color:var(--chalk);letter-spacing:.03em;max-width:46%;}
  #status b{color:var(--gold)}
  /* event / overlay modal */
  .modal{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:18px;
    background:radial-gradient(120% 90% at 50% 30%,rgba(19,122,67,.4),rgba(4,18,11,.9));
    backdrop-filter:blur(3px);z-index:10;transition:opacity .25s;}
  .modal.hidden{opacity:0;pointer-events:none;visibility:hidden}
  .card{background:linear-gradient(180deg,#12362a,#0b241b);border:1px solid rgba(255,255,255,.16);
    border-radius:18px;padding:clamp(18px,3vw,30px);max-width:min(88%,440px);text-align:center;
    box-shadow:0 20px 60px rgba(0,0,0,.6);}
  .card .badge{display:inline-block;font-size:clamp(10px,1.8vw,13px);letter-spacing:.18em;text-transform:uppercase;
    padding:4px 14px;border-radius:100px;margin-bottom:12px;font-weight:800;}
  .card h2{font-size:clamp(20px,4.4vw,32px);font-weight:900;line-height:1.05;margin-bottom:10px;color:var(--chalk);
    text-wrap:balance;}
  .card p{font-size:clamp(13px,2.5vw,17px);line-height:1.5;color:#cfe0d6;margin-bottom:14px;}
  .effects{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:16px;}
  .chip{font-family:"Courier New",monospace;font-weight:700;font-size:clamp(13px,2.4vw,18px);
    padding:5px 12px;border-radius:8px;background:rgba(255,255,255,.08);}
  .chip.up{color:#8ff0a8} .chip.down{color:#ff9a8a}
  .btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}
  .btn{pointer-events:auto;cursor:pointer;border:none;border-radius:100px;font-family:inherit;font-weight:800;
    font-size:clamp(14px,2.6vw,19px);letter-spacing:.05em;padding:clamp(10px,1.6vw,14px) clamp(22px,4vw,34px);
    color:var(--ink);background:linear-gradient(180deg,var(--gold),#e0a81f);box-shadow:0 5px 0 #a8790f;
    transition:transform .07s,box-shadow .07s;}
  .btn.alt{background:linear-gradient(180deg,#e6ebef,#b9c4cc);box-shadow:0 5px 0 #7c8890;}
  .btn:active{transform:translateY(3px);box-shadow:0 2px 0 #a8790f}
  .btn:focus-visible{outline:3px solid var(--skill);outline-offset:3px}
  #title h1{font-size:clamp(30px,7.5vw,64px);font-weight:900;line-height:.95;text-transform:uppercase;
    color:var(--chalk);text-shadow:0 5px 0 rgba(0,0,0,.3),0 0 40px rgba(255,207,58,.35);text-wrap:balance;}
  #title h1 span{display:block;color:var(--gold);font-size:.5em;letter-spacing:.2em}
  .sub{font-size:clamp(11px,2vw,14px);letter-spacing:.2em;text-transform:uppercase;color:var(--gold);opacity:.85;margin-bottom:6px}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div id="stage">
  <canvas id="c"></canvas>
  <div id="hud">
    <div class="stat season"><span class="label">Season</span><span class="value" id="s-season">1</span></div>
    <div class="stat skill"><span class="label">実力</span><span class="value" id="s-skill">50</span></div>
    <div class="stat fame"><span class="label">名声</span><span class="value" id="s-fame">10</span></div>
    <div class="stat goals"><span class="label">通算G</span><span class="value" id="s-goals">0</span></div>
    <div class="stat money"><span class="label">資産</span><span class="value" id="s-money">¥0</span></div>
  </div>
  <div id="bottom">
    <button id="rollBtn">Roll</button>
    <div id="status">サイコロを振ってキャリアを進めよう ⚽</div>
  </div>

  <div class="modal hidden" id="event"><div class="card">
    <span class="badge" id="ev-badge">EVENT</span>
    <h2 id="ev-title"></h2>
    <p id="ev-desc"></p>
    <div class="effects" id="ev-effects"></div>
    <div class="btns" id="ev-btns"></div>
  </div></div>

  <div class="modal" id="title"><div class="card">
    <div class="sub">Soccer · Career</div>
    <h1>人生<span>スゴロク</span></h1>
    <p style="color:#cfe0d6">ユースからプロ、そして伝説へ。サイコロを振って<b style="color:var(--gold)">1人の選手</b>のキャリアを歩む。各マスのイベントで実力・名声・資産・ゴールが動く。ゴール地点＝引退時の評価は？</p>
    <div class="btns"><button class="btn" id="startBtn">キックオフ</button></div>
  </div></div>
</div>

<script>
(()=>{
"use strict";
const cvs=document.getElementById('c'),ctx=cvs.getContext('2d');
const W=900,H=600;let dpr=Math.min(window.devicePixelRatio||1,2);
function resize(){const r=cvs.getBoundingClientRect();cvs.width=Math.round(r.width*dpr);cvs.height=Math.round(r.height*dpr);
  ctx.setTransform(cvs.width/W,0,0,cvs.height/H,0,0);}
new ResizeObserver(resize).observe(cvs);resize();

// ---- audio ----
let AC=null;function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function tone(f,d,t='sine',v=.22,to=null){const a=ac();if(!a)return;const o=a.createOscillator(),g=a.createGain();
  o.type=t;o.frequency.setValueAtTime(f,a.currentTime);if(to)o.frequency.exponentialRampToValueAtTime(to,a.currentTime+d);
  g.gain.setValueAtTime(v,a.currentTime);g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+d);
  o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+d);}
const sHop=()=>tone(520,.07,'square',.16,700);
const sRoll=()=>tone(300,.05,'square',.12,420);
const sGood=()=>{tone(523,.1,'square',.2);setTimeout(()=>tone(784,.16,'square',.22),90);};
const sGreat=()=>{tone(523,.1,'square',.22);setTimeout(()=>tone(659,.1,'square',.22),90);setTimeout(()=>tone(988,.22,'square',.24),180);};
const sBad=()=>tone(200,.25,'sawtooth',.22,90);

// ---- board ----
const COLS=6, TILE=Math.floor((780)/(COLS));
const TYPES={START:'start',GOAL:'goal',MATCH:'match',TRAIN:'train',NAT:'nat',
  TRANSFER:'transfer',INJURY:'injury',SLUMP:'slump',SPONSOR:'sponsor',LUCKY:'lucky',CHANCE:'chance'};
const tileMeta={
  start:{c:'#3a9bd8',ic:'⚽',name:'ユース'},
  goal:{c:'#ffcf3a',ic:'★',name:'引退'},
  match:{c:'#3ec46b',ic:'⚽',name:'試合'},
  train:{c:'#7fc9e8',ic:'💪',name:'練習'},
  nat:{c:'#ff8a3c',ic:'🌐',name:'代表'},
  transfer:{c:'#c98ae0',ic:'✈',name:'移籍'},
  injury:{c:'#e0503a',ic:'✚',name:'怪我'},
  slump:{c:'#8a95a0',ic:'▼',name:'不調'},
  sponsor:{c:'#ffcf3a',ic:'¥',name:'スポンサー'},
  lucky:{c:'#ff6bd0',ic:'🍀',name:'幸運'},
  chance:{c:'#f4efe0',ic:'?',name:'チャンス'},
};
let tiles=[]; // {x,y,type}
function buildBoard(){
  tiles=[];
  const layout=[
    'start','match','train','match','chance','nat',
    'transfer','match','injury','sponsor','match','train',
    'chance','match','nat','slump','match','transfer',
    'sponsor','match','train','chance','injury','match',
    'nat','match','lucky','chance','match','goal'
  ];
  const rows=Math.ceil(layout.length/COLS);
  const x0=70, y0=95, gapX=(760)/(COLS-1), gapY=(360)/(rows-1);
  for(let i=0;i<layout.length;i++){
    const row=Math.floor(i/COLS);
    let col=i%COLS; if(row%2===1)col=COLS-1-col; // serpentine
    tiles.push({x:x0+col*gapX, y:y0+row*gapY, type:layout[i], idx:i});
  }
}
buildBoard();

// ---- game state ----
let st={season:1,skill:50,fame:10,goals:0,money:0};
let pos=0, rolling=false, moving=false, busy=false, gameOver=false;
let dice={val:1,anim:0,x:W/2,y:520}, token={x:0,y:0,hop:0}, skipTurns=0;
let particles=[], confetti=[], shake=0;
let tPrev=0;

function setToken(i){token.x=tiles[i].x;token.y=tiles[i].y;}
function resetGame(){
  st={season:1,skill:50,fame:10,goals:0,money:0};pos=0;skipTurns=0;gameOver=false;
  setToken(0);updateHUD();particles=[];confetti=[];
  setStatus('サイコロを振ってキャリアを進めよう ⚽');
  document.getElementById('rollBtn').disabled=false;
}
function updateHUD(){
  document.getElementById('s-season').textContent=st.season;
  document.getElementById('s-skill').textContent=Math.max(0,Math.round(st.skill));
  document.getElementById('s-fame').textContent=Math.max(0,Math.round(st.fame));
  document.getElementById('s-goals').textContent=st.goals;
  document.getElementById('s-money').textContent=fmtMoney(st.money);
}
function fmtMoney(m){ // m in 万円
  if(m>=10000)return '¥'+(m/10000).toFixed(m%10000?1:0)+'億';
  return '¥'+Math.round(m)+'万';
}
function setStatus(h){document.getElementById('status').innerHTML=h;}

// ---- events ----
const rnd=(a,b)=>a+Math.random()*(b-a);
const ri=(a,b)=>Math.floor(rnd(a,b+1));
function ev(badge,color,title,desc,effects,move,delta){return {badge,color,title,desc,effects,move,delta};}
function eventFor(type){
  const s=st;
  switch(type){
    case 'match':{
      const g=ri(0,3);
      const skill=ri(1,3), money=ri(200,900);
      return ev('試合','var(--money)', g>=2?'ハットトリック級の活躍！':(g>=1?'ゴールを決めた！':'堅実にプレー'),
        g>=1?`このシーズン ${g} 得点。スタメンに定着した。`:'目立たないが確かな一戦。経験を積んだ。',
        [d('通算G',g,true),d('実力',skill,true),d('資産',money,true,'m')],
        null, {goals:g,skill,money});
    }
    case 'train':{const skill=ri(2,5);return ev('練習','var(--skill)','猛特訓','ひたむきに練習を重ね、技術が磨かれた。',
      [d('実力',skill,true)],null,{skill});}
    case 'nat':{const fame=ri(6,12),skill=ri(1,3);return ev('代表選出','var(--fame)','代表に選出！','国を背負う誇り。世界が君を見ている。',
      [d('名声',fame,true),d('実力',skill,true)],null,{fame,skill});}
    case 'sponsor':{const money=ri(1000,4000),fame=ri(2,5);return ev('スポンサー','var(--gold)','大型スポンサー契約','CMやグッズ展開。ピッチ外でも稼ぐ。',
      [d('資産',money,true,'m'),d('名声',fame,true)],null,{money,fame});}
    case 'injury':{const skill=-ri(2,5),back=ri(1,3);return ev('怪我','var(--danger)','長期離脱','タックルで負傷。リハビリで数マス後退…',
      [d('実力',skill,false),{t:back+'マス戻る',up:false}],-back,{skill});}
    case 'slump':{const skill=-ri(2,4),fame=-ri(1,4);return ev('不調','#8a95a0','スランプ','出場機会が減り、調子を落とした。',
      [d('実力',skill,false),d('名声',fame,false)],null,{skill,fame});}
    case 'lucky':{const fwd=ri(1,3);return ev('幸運','#ff6bd0','絶好調！','波に乗っている。一気に前進！',
      [{t:fwd+'マス進む',up:true}],fwd,{});}
    case 'chance':{ // random generic
      return [genGood,genBad,genChoice][ri(0,2)]();
    }
    case 'start':return ev('スタート','var(--skill)','プロ契約','ユースからトップチームへ昇格。キャリアの始まりだ！',[d('名声',3,true)],null,{fame:3});
    default:return ev('','#fff','','',[],null,{});
  }
}
function d(label,v,up,kind){const sign=(kind==='m')?'':(v>0?'+':'');
  return {t:label+' '+sign+(kind==='m'?fmtDelta(v):v),up:up,_v:v,_k:kind,label,};}
function fmtDelta(v){return (v>0?'+':'')+ (Math.abs(v)>=10000?(v/10000).toFixed(1)+'億':v+'万');}
function genGood(){const money=ri(300,1200),fame=ri(2,6);return ev('チャンス','var(--gold)','バロンドール候補に浮上','記者投票で名前が挙がった。価値が急上昇。',
  [d('名声',fame,true),d('資産',money,true,'m')],null,{fame,money});}
function genBad(){const fame=-ri(2,6);return ev('チャンス','var(--danger)','スキャンダル報道','週刊誌に書かれ、イメージダウン…',
  [d('名声',fame,false)],null,{fame});}
function genChoice(){
  return {choice:true,badge:'決断','color':'#c98ae0',title:'ビッグクラブからオファー',
    desc:'強豪から移籍の誘い。飛び込めば大きく伸びるが、環境になじめないリスクも。',
    options:[
      {label:'移籍する',alt:false,resolve:()=>{
        if(Math.random()<0.62){return ev('決断 → 成功','var(--money)','新天地で覚醒','見事フィット。スターダムを駆け上がる！',
          [d('実力',ri(3,7),true),d('名声',ri(5,10),true),d('資産',ri(1500,5000),true,'m')],null,
          {skill:ri(3,7),fame:ri(5,10),money:ri(1500,5000)});}
        return ev('決断 → 苦戦','var(--danger)','出番を失う','ベンチ暮らし。試練の時。',
          [d('実力',-ri(1,3),false),d('名声',-ri(2,5),false)],null,{skill:-ri(1,3),fame:-ri(2,5)});
      }},
      {label:'残留する',alt:true,resolve:()=>ev('決断 → 残留','var(--skill)','忠誠のキャプテン','クラブの象徴に。ファンの信頼は厚い。',
        [d('名声',ri(3,6),true),d('資産',ri(400,1000),true,'m')],null,{fame:ri(3,6),money:ri(400,1000)})}
    ]};
}

// ---- flow ----
document.getElementById('startBtn').onclick=()=>{const a=ac();a&&a.resume&&a.resume();
  document.getElementById('title').classList.add('hidden');resetGame();};
const rollBtn=document.getElementById('rollBtn');
rollBtn.onclick=()=>tryRoll();
window.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();
  if(!document.getElementById('title').classList.contains('hidden')){document.getElementById('startBtn').click();return;}
  if(!document.getElementById('event').classList.contains('hidden')){const b=document.querySelector('#ev-btns .btn');b&&b.click();return;}
  tryRoll();}});

function tryRoll(){
  if(busy||rolling||moving||gameOver)return;
  const a=ac();a&&a.resume&&a.resume();
  if(skipTurns>0){skipTurns--;setStatus('怪我で休養中… 残り'+(skipTurns+1)+'回休み'); // this turn is the skip
    // consume as a "roll" that does nothing
    flashSkip();return;}
  rolling=true;rollBtn.disabled=true;
  dice.anim=1;dice.val=ri(1,6);sRoll();
  let ticks=0;const iv=setInterval(()=>{dice.val=ri(1,6);sRoll();ticks++;
    if(ticks>=10){clearInterval(iv);rolling=false;finalizeRoll();}},70);
}
function flashSkip(){shake=6;setTimeout(()=>{setStatus('サイコロを振ってキャリアを進めよう ⚽');},1200);}
function finalizeRoll(){
  const steps=dice.val;setStatus('<b>'+steps+'</b> 進む！');
  moveSteps(steps);
}
function moveSteps(n){
  moving=true;let done=0;
  const step=()=>{
    if(pos>=tiles.length-1){moving=false;resolveTile();return;}
    pos=Math.min(tiles.length-1,pos+1);token.hop=1;sHop();done++;
    if(pos>=tiles.length-1){ // reached goal
      setTimeout(()=>{moving=false;resolveTile();},260);return;}
    if(done<n)setTimeout(step,240);
    else setTimeout(()=>{moving=false;resolveTile();},260);
  };
  step();
}
function resolveTile(){
  const type=tiles[pos].type;
  if(type==='goal'){return endGame();}
  busy=true;
  const e=eventFor(type);
  if(e.choice){showChoice(e);}
  else showEvent(e);
}
function applyEffects(delta){
  if(!delta)return;
  st.skill=Math.max(0,st.skill+(delta.skill||0));
  st.fame=Math.max(0,st.fame+(delta.fame||0));
  st.goals=Math.max(0,st.goals+(delta.goals||0));
  st.money=Math.max(0,st.money+(delta.money||0));
}
function showEvent(e){
  const m=document.getElementById('event');
  const badge=document.getElementById('ev-badge');
  badge.textContent=e.badge;badge.style.background=e.color;badge.style.color='#0c2a1a';
  document.getElementById('ev-title').textContent=e.title;
  document.getElementById('ev-desc').textContent=e.desc;
  const fx=document.getElementById('ev-effects');fx.innerHTML='';
  (e.effects||[]).forEach(x=>{const s=document.createElement('span');s.className='chip '+(x.up?'up':'down');s.textContent=x.t;fx.appendChild(s);});
  const bt=document.getElementById('ev-btns');bt.innerHTML='';
  const ok=document.createElement('button');ok.className='btn';ok.textContent='続ける';
  ok.onclick=()=>{closeEvent();commitEvent(e);};bt.appendChild(ok);
  // sound + juice based on positivity
  const positive=(e.effects||[]).some(x=>x.up)&&!(e.effects||[]).some(x=>!x.up&&x._v);
  if(e.color==='var(--danger)'){sBad();shake=8;}
  else if(e.badge.indexOf('代表')>=0||e.badge.indexOf('成功')>=0){sGreat();celebrate();}
  else sGood();
  m.classList.remove('hidden');
}
function showChoice(e){
  const m=document.getElementById('event');
  const badge=document.getElementById('ev-badge');
  badge.textContent=e.badge;badge.style.background=e.color;badge.style.color='#0c2a1a';
  document.getElementById('ev-title').textContent=e.title;
  document.getElementById('ev-desc').textContent=e.desc;
  document.getElementById('ev-effects').innerHTML='';
  const bt=document.getElementById('ev-btns');bt.innerHTML='';
  e.options.forEach(op=>{const b=document.createElement('button');b.className='btn'+(op.alt?' alt':'');b.textContent=op.label;
    b.onclick=()=>{const res=op.resolve();closeEvent();showEvent(res);};bt.appendChild(b);});
  sGood();m.classList.remove('hidden');
}
function commitEvent(e){
  applyEffects(e.delta);
  updateHUD();
  // movement effect
  if(e.move){
    const target=Math.max(0,Math.min(tiles.length-1,pos+e.move));
    animateTo(target,()=>{
      if(tiles[pos].type==='goal'){endGame();return;}
      // landing after forced move does NOT re-trigger event (avoid loops), just end turn
      endTurn();
    });
  } else endTurn();
}
function animateTo(target,cb){
  moving=true;const dir=target>pos?1:-1;
  const step=()=>{ if(pos===target){moving=false;cb();return;}
    pos+=dir;token.hop=1;sHop();
    if(pos===target){setTimeout(()=>{moving=false;cb();},220);}else setTimeout(step,200);};
  step();
}
function endTurn(){
  busy=false;st.season++;updateHUD();
  if(!gameOver){rollBtn.disabled=false;
    setStatus(skipTurns>0?('怪我で休養… 次は休み'):'サイコロを振ろう ⚽ ('+ (tiles.length-1-pos) +'マス先がゴール)');}
}
function closeEvent(){document.getElementById('event').classList.add('hidden');}

function endGame(){
  gameOver=true;rollBtn.disabled=true;bigCelebrate();
  const score=Math.round(st.skill*1.2+st.fame*1.5+st.goals*4+st.money/300);
  let rank,flavor;
  if(score>=260){rank='⚽ LEGEND';flavor='歴史に名を刻む伝説の選手。銅像が建った。';}
  else if(score>=190){rank='★ SUPERSTAR';flavor='世界を熱狂させたスーパースター。';}
  else if(score>=130){rank='◎ STAR';flavor='一時代を築いた一流プレイヤー。';}
  else if(score>=80){rank='○ PRO';flavor='堅実なキャリアを全うした名選手。';}
  else{rank='◇ JOURNEYMAN';flavor='山あり谷あり。それもサッカー人生。';}
  const m=document.getElementById('event');
  document.getElementById('ev-badge').textContent='引退';
  document.getElementById('ev-badge').style.background='var(--gold)';
  document.getElementById('ev-badge').style.color='#0c2a1a';
  document.getElementById('ev-title').textContent=rank;
  document.getElementById('ev-desc').textContent=flavor;
  const fx=document.getElementById('ev-effects');fx.innerHTML='';
  [['実力',Math.round(st.skill)],['名声',Math.round(st.fame)],['通算G',st.goals],['資産',fmtMoney(st.money)],['SCORE',score]]
    .forEach(([k,v])=>{const s=document.createElement('span');s.className='chip up';s.textContent=k+' '+v;fx.appendChild(s);});
  const bt=document.getElementById('ev-btns');bt.innerHTML='';
  const b=document.createElement('button');b.className='btn';b.textContent='もう一度';
  b.onclick=()=>{closeEvent();resetGame();};bt.appendChild(b);
  sGreat();m.classList.remove('hidden');
}

// ---- particles ----
function celebrate(){for(let i=0;i<24;i++){const a=Math.random()*Math.PI*2,sp=1+Math.random()*5;
  particles.push({x:token.x,y:token.y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-2,life:1,
    col:['#ffcf3a','#3ec46b','#3a9bd8','#fff'][i%4],r:2+Math.random()*4});}}
function bigCelebrate(){for(let i=0;i<120;i++){confetti.push({x:Math.random()*W,y:-20-Math.random()*200,
  vx:(Math.random()-.5)*2,vy:2+Math.random()*3,rot:Math.random()*7,vr:(Math.random()-.5)*.3,
  col:['#ffcf3a','#3ec46b','#3a9bd8','#ff6bd0','#fff','#ff8a3c'][i%6],w:5+Math.random()*7,h:8+Math.random()*8});}}

// ---- update/render ----
function update(dt){
  if(dice.anim>0)dice.anim=Math.max(0,dice.anim-dt*2);
  if(token.hop>0)token.hop=Math.max(0,token.hop-dt*4);
  // token toward tile (smooth)
  const tt=tiles[pos];token.x+=(tt.x-token.x)*Math.min(1,dt*14);token.y+=(tt.y-token.y)*Math.min(1,dt*14);
  for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.x+=p.vx;p.y+=p.vy;p.vy+=.35;p.vx*=.99;p.life-=dt*1.1;if(p.life<=0)particles.splice(i,1);}
  for(let i=confetti.length-1;i>=0;i--){const c=confetti[i];c.x+=c.vx;c.y+=c.vy;c.rot+=c.vr;if(c.y>H+30)confetti.splice(i,1);}
  if(shake>0)shake=Math.max(0,shake-dt*30);
}
function roundRect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function drawBoard(){
  // pitch bg
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#137a43');g.addColorStop(1,'#0d5c33');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.save();ctx.globalAlpha=.05;ctx.fillStyle='#fff';
  for(let i=0;i<H;i+=44)ctx.fillRect(0,i,W,22);ctx.restore();
  // path connecting tiles
  ctx.save();ctx.strokeStyle='rgba(255,255,255,.28)';ctx.lineWidth=8;ctx.lineCap='round';ctx.setLineDash([2,14]);
  ctx.beginPath();ctx.moveTo(tiles[0].x,tiles[0].y);
  for(let i=1;i<tiles.length;i++)ctx.lineTo(tiles[i].x,tiles[i].y);ctx.stroke();ctx.restore();
  // tiles
  for(let i=0;i<tiles.length;i++){
    const t=tiles[i],mtd=tileMeta[t.type],r=TILE*0.42;
    const passed=i<pos;
    ctx.save();
    // shadow
    ctx.fillStyle='rgba(0,0,0,.25)';roundRect(t.x-r+2,t.y-r+4,r*2,r*2,12);ctx.fill();
    // body
    ctx.fillStyle=mtd.c;if(passed)ctx.globalAlpha=.55;roundRect(t.x-r,t.y-r,r*2,r*2,12);ctx.fill();
    ctx.globalAlpha=1;
    ctx.strokeStyle='rgba(255,255,255,.5)';ctx.lineWidth=2;roundRect(t.x-r,t.y-r,r*2,r*2,12);ctx.stroke();
    // icon
    ctx.font=(r*1.05)+'px system-ui,"Apple Color Emoji","Segoe UI Emoji"';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(mtd.ic,t.x,t.y-2);
    // tile number
    ctx.fillStyle='rgba(0,0,0,.5)';ctx.font='bold 11px system-ui';ctx.fillText((i+1),t.x,t.y+r-9);
    ctx.restore();
  }
}
function drawToken(){
  const hop=Math.sin(token.hop*Math.PI)*18;
  const x=token.x,y=token.y-hop-4;
  ctx.save();
  ctx.fillStyle='rgba(0,0,0,.3)';ctx.beginPath();ctx.ellipse(token.x,token.y+14,14,5,0,0,7);ctx.fill();
  // jersey figure
  ctx.translate(x,y);
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(0,-20,8,0,7);ctx.fill(); // head
  ctx.fillStyle='#e0503a';roundRect(-11,-14,22,22,6);ctx.fill(); // shirt
  ctx.fillStyle='#0c2a1a';ctx.fillRect(-11,6,22,6); // shorts
  ctx.fillStyle='#fff';ctx.font='bold 11px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('10',0,-2);
  // little ball
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(12,14,5,0,7);ctx.fill();
  ctx.strokeStyle='#0c2a1a';ctx.lineWidth=1;ctx.beginPath();ctx.arc(12,14,5,0,7);ctx.stroke();
  ctx.restore();
}
function drawDice(){
  const d=dice,size=46, x=180, y=515;
  const wob=Math.sin(d.anim*20)*0.15;
  ctx.save();ctx.translate(x,y);ctx.rotate(wob*d.anim);
  ctx.fillStyle='rgba(0,0,0,.3)';roundRect(-size/2+3,-size/2+4,size,size,10);ctx.fill();
  ctx.fillStyle='#f7f3e6';roundRect(-size/2,-size/2,size,size,10);ctx.fill();
  ctx.strokeStyle='#d8cfb2';ctx.lineWidth=2;roundRect(-size/2,-size/2,size,size,10);ctx.stroke();
  // pips
  ctx.fillStyle='#0c2a1a';const o=size*0.26;
  const pipMap={1:[[0,0]],2:[[-o,-o],[o,o]],3:[[-o,-o],[0,0],[o,o]],
    4:[[-o,-o],[o,-o],[-o,o],[o,o]],5:[[-o,-o],[o,-o],[0,0],[-o,o],[o,o]],
    6:[[-o,-o],[o,-o],[-o,0],[o,0],[-o,o],[o,o]]};
  (pipMap[d.val]||pipMap[1]).forEach(p=>{ctx.beginPath();ctx.arc(p[0],p[1],4.5,0,7);ctx.fill();});
  ctx.restore();
  // label
  ctx.fillStyle='rgba(255,255,255,.7)';ctx.font='700 12px "Courier New",monospace';ctx.textAlign='center';
  ctx.fillText('DICE',x,y+size/2+16);
}
function render(){
  ctx.clearRect(0,0,W,H);
  ctx.save();if(shake>0)ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
  drawBoard();drawToken();drawDice();
  for(const p of particles){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.col;
    ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill();}
  ctx.globalAlpha=1;ctx.restore();
  for(const c of confetti){ctx.save();ctx.translate(c.x,c.y);ctx.rotate(c.rot);ctx.fillStyle=c.col;
    ctx.fillRect(-c.w/2,-c.h/2,c.w,c.h);ctx.restore();}
}
function loop(t){if(!tPrev)tPrev=t;let dt=(t-tPrev)/1000;tPrev=t;if(dt>.05)dt=.05;update(dt);render();requestAnimationFrame(loop);}
setToken(0);requestAnimationFrame(loop);
})();
</script>
