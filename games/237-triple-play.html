<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>トリプルプレー (Turn Three)</title>
<style>
  html,body{margin:0;height:100%;background:#0a0f0a;overflow:hidden;
    font-family:-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  #stage{position:relative;width:100vw;height:100vh;max-width:calc(100vh*1.5);max-height:calc(100vw/1.5);aspect-ratio:900/600;}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;border-radius:6px;}
</style>
</head>
<body>
<div id="wrap"><div id="stage"><canvas id="cv"></canvas></div></div>
<script>
(function(){
const W=900,H=600,cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let DPR=1;
function fit(){DPR=Math.min(2,window.devicePixelRatio||1);cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
fit();addEventListener('resize',fit);

// ---------- audio ----------
let AC=null;function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function tone(f,d,type,v,sweep){const a=ac();if(!a)return;const t=a.currentTime,o=a.createOscillator(),g=a.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(sweep)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+sweep),t+d);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v||0.2,t+0.008);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+0.02);}
function noise(d,v,hp){const a=ac();if(!a)return;const t=a.currentTime,n=Math.floor(a.sampleRate*d),buf=a.createBuffer(1,n,a.sampleRate),ch=buf.getChannelData(0);
  for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource();s.buffer=buf;
  const f=a.createBiquadFilter();f.type='highpass';f.frequency.value=hp||600;const g=a.createGain();g.gain.value=v||0.2;
  s.connect(f);f.connect(g);g.connect(a.destination);s.start(t);s.stop(t+d+0.02);}
const S={
  out:(i)=>{noise(0.04,0.12,700);tone(680+i*160,0.08,'triangle',0.16);},
  triple:()=>{noise(0.06,0.14,500);[600,760,920,1120,1360].forEach((f,i)=>setTimeout(()=>tone(f,0.13,'triangle',0.18),i*70));},
  glove:()=>{noise(0.03,0.1,900);tone(420,0.04,'sine',0.08);},
  bad:()=>{noise(0.18,0.24,300);tone(160,0.2,'sawtooth',0.13,-60);},
  streak:()=>{[700,930,1170,1400].forEach((f,i)=>setTimeout(()=>tone(f,0.1,'triangle',0.16),i*60));},
  over:()=>{[440,330,247,175].forEach((f,i)=>setTimeout(()=>tone(f,0.3,'triangle',0.2),i*160));}
};

// ---------- geometry ----------
const HOME={x:450,y:512}, FIRST={x:672,y:352}, SECOND={x:450,y:236}, THIRD={x:228,y:352}, SS={x:338,y:300}, PIT={x:450,y:372};
const NAME={FIRST:'一塁',SECOND:'二塁',THIRD:'三塁',SS:'遊撃',PIT:'投手',HOME:'本塁'};

// ---------- state ----------
let state='title', phase='play', t=0, plays=0;
let score=0, combo=0, best=+(localStorage.getItem('triple_best')||0);
let outs=0, fails=0, lvl=1;   // outs = triple plays completed
let clock=0, beat=0, madeOuts=0;
let legDur=[500,420,380], tArrive=[500,920,1300], win=140, sweet=56;
let pts=[HOME,SS,SECOND,FIRST], baseName=['SS','SECOND','FIRST'];
let acted=false, result=null, resultT=0, msg='', flashBase=-1, flashBaseT=0;
let shake=0, flash=0, flashCol='#fff', last=performance.now();
let parts=[], pops=[];

function rnd(a,b){return a+Math.random()*(b-a);}
function chance(p){return Math.random()<p;}
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function lerp(a,b,u){return a+(b-a)*u;}
function easeOut(u){return 1-Math.pow(1-u,2);}

function params(){ return {
  l0:Math.max(360,520-lvl*22), l1:Math.max(300,440-lvl*20), l2:Math.max(280,400-lvl*18),
  win:Math.max(86,150-lvl*9), sweet:Math.max(34,58-lvl*3.4)
};}

function reset(){state='title';score=0;combo=0;outs=0;fails=0;lvl=1;plays=0;result=null;parts=[];pops=[];}
function newPlay(){
  plays++; lvl=Math.min(7,1+Math.floor(outs/4));
  const p=params();
  legDur=[p.l0,p.l1,p.l2]; win=p.win; sweet=p.sweet;
  tArrive=[legDur[0],legDur[0]+legDur[1],legDur[0]+legDur[1]+legDur[2]];
  // path: field at 3B or SS or P, then 2B, then 1B (vary start)
  const starts=[[THIRD,'THIRD'],[SS,'SS'],[PIT,'PIT']]; const st=starts[Math.floor(Math.random()*starts.length)];
  pts=[HOME, st[0], SECOND, FIRST];
  baseName=[st[1],'SECOND','FIRST'];
  clock=0; beat=0; madeOuts=0; acted=false; result=null; phase='play'; msg=''; resultT=0; flashBase=-1;
}
function start(){ if(!ac())ac(); if(AC&&AC.state==='suspended')AC.resume(); reset(); state='play'; newPlay(); }

function ballPos(){
  // travel through pts[0]->pts[1]->pts[2]->pts[3] over the three legs
  const seg = beat; // current leg index 0..2 (pts[seg]->pts[seg+1])
  let c=clock, base=0;
  for(let i=0;i<3;i++){ if(c<=tArrive[i]||i===2){ const from=pts[i], to=pts[i+1];
      const t0=i===0?0:tArrive[i-1]; const u=clamp((c-t0)/(tArrive[i]-t0),0,1);
      return {x:lerp(from.x,to.x,easeOut(u)), y:lerp(from.y,to.y,easeOut(u)), leg:i}; } }
  return {x:pts[3].x,y:pts[3].y,leg:2};
}

function tap(){
  if(state==='title'){start();return;}
  if(state==='over'){ if(resultT>0.4){reset();start();} return; }
  if(state!=='play'||phase!=='play'||acted) return;
  const err=Math.abs(clock-tArrive[beat]);
  if(err<=win){
    const perfect=err<=sweet;
    madeOuts++; S.out(beat); S.glove();
    flashBase=beat; flashBaseT=0;
    const pt=pts[beat+1]; burst(pt.x,pt.y,perfect?'#8affa0':'#ffe08a',perfect?16:10,5);
    pop(pt.x,pt.y-26,(beat===0?'捕球！':beat===1?'2つ目！':'3つ目！')+(perfect?' ジャスト!':''),perfect?'#d6ffe0':'#fff3c4');
    let add=Math.round((perfect?70:44)); score+=add;
    beat++;
    if(beat>=3){ resolve('triple'); }
  } else {
    resolve('break');
  }
}

function resolve(kind){
  phase='result'; result=kind; resultT=0;
  if(kind==='triple'){
    outs++; combo++;
    let add=Math.round(260*(1+Math.min(9,combo-1)*0.15)); score+=add;
    S.triple(); flash=1;flashCol='#8affa0';shake=10; burst(450,300,'#8affa0',30,8);
    pop(450,250,'トリプルプレー！ +'+add,'#d6ffe0'); pop(450,290,'3アウトチェンジ！','#8affa0');
    if(combo>=2)pop(450,330,'コンボ x'+combo,'#ffd24d');
    if(combo>0&&combo%3===0)S.streak();
    msg='鮮やかなトリプルプレー！ 一気に3アウト！';
  } else {
    fails++; combo=0; flash=1;flashCol='#ff5b5b';shake=8; S.bad();
    msg=(madeOuts>0?(madeOuts+'アウトで連係が乱れた…'):'握り損ない…')+' トリプルプレー失敗';
    pop(pts[Math.min(beat+1,3)].x,pts[Math.min(beat+1,3)].y-26,'エラー','#ffb0b0');
  }
  if(fails>=3){ state='over'; resultT=0; S.over(); if(score>best){best=score;localStorage.setItem('triple_best',best);} }
}

// ---------- input ----------
cv.addEventListener('pointerdown',e=>{e.preventDefault();tap();});
addEventListener('keydown',e=>{ if(e.code==='Space'||e.code==='Enter'||e.code==='ArrowUp'||e.code==='KeyZ'){e.preventDefault();tap();} });

// ---------- particles ----------
function burst(x,y,c,n,sp){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=rnd(sp*0.3,sp);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:1,c});}}
function pop(x,y,txt,c){pops.push({x,y,txt,c,life:1});}

// ---------- update ----------
function update(dt){
  shake*=Math.pow(0.86,dt/16.7); if(shake<0.3)shake=0;
  flash*=Math.pow(0.9,dt/16.7); if(flashBase>=0)flashBaseT+=dt;
  for(const p of parts){p.vx*=0.96;p.vy=p.vy*0.96+0.28;p.x+=p.vx*dt/16.7;p.y+=p.vy*dt/16.7;p.life-=dt/16.7*0.026;}
  parts=parts.filter(p=>p.life>0);
  for(const p of pops){p.y-=dt/16.7*0.5;p.life-=dt/16.7*0.02;}
  pops=pops.filter(p=>p.life>0);

  if(state!=='play'){ if(state==='over')resultT+=dt/1000; return; }
  t+=dt;
  if(phase==='play'){
    clock+=dt;
    if(!acted && clock>tArrive[beat]+win){ resolve('break'); }
    return;
  }
  if(phase==='result'){
    resultT+=dt/1000;
    if(resultT>1.2 && state==='play') newPlay();
    return;
  }
}

// ---------- render ----------
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function drawScene(){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#1f5f2a');g.addColorStop(1,'#123a1b');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  // infield dirt diamond
  ctx.fillStyle='#7a5230';ctx.beginPath();ctx.moveTo(HOME.x,HOME.y+8);ctx.lineTo(FIRST.x+16,FIRST.y);ctx.lineTo(SECOND.x,SECOND.y-16);ctx.lineTo(THIRD.x-16,THIRD.y);ctx.closePath();ctx.fill();
  ctx.fillStyle='#2c7a3b';ctx.beginPath();ctx.moveTo(HOME.x,HOME.y-14);ctx.lineTo(FIRST.x-14,FIRST.y);ctx.lineTo(SECOND.x,SECOND.y+14);ctx.lineTo(THIRD.x+14,THIRD.y);ctx.closePath();ctx.fill();
  // basepaths
  ctx.strokeStyle='rgba(240,220,180,0.5)';ctx.lineWidth=4;
  ctx.beginPath();ctx.moveTo(HOME.x,HOME.y);ctx.lineTo(FIRST.x,FIRST.y);ctx.lineTo(SECOND.x,SECOND.y);ctx.lineTo(THIRD.x,THIRD.y);ctx.closePath();ctx.stroke();
  // mound
  ctx.fillStyle='rgba(150,110,70,0.5)';ctx.beginPath();ctx.ellipse(PIT.x,PIT.y,26,16,0,0,6.28);ctx.fill();
  // bases
  for(const bb of [[HOME,'本'],[FIRST,'一'],[SECOND,'二'],[THIRD,'三']]){ const b=bb[0];
    ctx.save();ctx.translate(b.x,b.y);ctx.rotate(Math.PI/4);ctx.fillStyle='#f2f4f6';ctx.fillRect(-9,-9,18,18);ctx.restore(); }
}
function drawFig(x,y,col,s){ s=s||1; ctx.fillStyle='rgba(0,0,0,0.22)';ctx.beginPath();ctx.ellipse(x,y+11*s,9*s,3*s,0,0,6.28);ctx.fill();
  ctx.fillStyle=col;rr(x-7*s,y-9*s,14*s,20*s,6);ctx.fill();
  ctx.fillStyle='#f2c9a0';ctx.beginPath();ctx.arc(x,y-13*s,5*s,0,6.28);ctx.fill(); }

function render(){
  ctx.save();
  if(shake>0)ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
  drawScene();

  if(state==='play'){
    // fielders at the three receiving points
    for(let i=0;i<3;i++){ const pt=pts[i+1];
      const done=(phase==='play'&&i<beat)||(phase==='result'&&result==='triple');
      drawFig(pt.x+14,pt.y-2, done?'#3a7d3a':'#2b6cff'); }
    // out markers (bases already stepped)
    // base flash when an out is made
    if(flashBase>=0 && flashBaseT<380){ const pt=pts[flashBase+1]; const a=1-flashBaseT/380;
      ctx.strokeStyle='rgba(150,240,170,'+a+')';ctx.lineWidth=4;ctx.beginPath();ctx.arc(pt.x,pt.y,18+flashBaseT*0.06,0,6.28);ctx.stroke(); }

    // target ring at the current receiving base as ball approaches
    if(phase==='play'&&beat<3){
      const pt=pts[beat+1]; const ta=tArrive[beat];
      if(clock>ta-win*1.9){
        const u=clamp((clock-(ta-win))/(2*win),0,1);
        const inw=Math.abs(clock-ta)<=win;
        ctx.strokeStyle=inw?'rgba(150,240,170,0.95)':'rgba(255,255,255,0.4)';ctx.lineWidth=3;
        ctx.beginPath();ctx.arc(pt.x,pt.y,lerp(42,16,clamp(u,0,1)),0,6.28);ctx.stroke();
        if(inw){ ctx.strokeStyle='rgba(214,255,224,0.6)';ctx.lineWidth=2;
          ctx.beginPath();ctx.arc(pt.x,pt.y,lerp(42,16,clamp(u,0,1))*(sweet/win),0,6.28);ctx.stroke(); }
      }
      // label which base is next
      ctx.fillStyle='rgba(159,240,184,0.9)';ctx.font='bold 13px sans-serif';ctx.textAlign='center';
      ctx.fillText((beat===0?'捕球':NAME[baseName[beat]]+'へ送球'), pt.x, pt.y-34);
    }

    // ball
    if(phase==='play'){ const bp=ballPos();
      ctx.globalAlpha=0.25;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(bp.x-4,bp.y-4,6,0,6.28);ctx.fill();ctx.globalAlpha=1;
      ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(bp.x,bp.y,7,0,6.28);ctx.fill();
      ctx.strokeStyle='#c33';ctx.lineWidth=1.3;ctx.beginPath();ctx.arc(bp.x,bp.y,7,0.5,2.1);ctx.stroke();
    }

    // beat progress pips
    for(let i=0;i<3;i++){ ctx.beginPath();ctx.arc(W/2-24+i*24,86,8,0,6.28);
      ctx.fillStyle=i<madeOuts?'#8affa0':'rgba(255,255,255,0.25)';ctx.fill();
      ctx.strokeStyle='rgba(0,0,0,0.3)';ctx.lineWidth=1;ctx.stroke(); }
  }

  for(const p of parts){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,3.2,0,6.28);ctx.fill();}
  ctx.globalAlpha=1;
  for(const p of pops){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.font='bold 22px sans-serif';ctx.textAlign='center';ctx.fillText(p.txt,p.x,p.y);}
  ctx.globalAlpha=1;

  // HUD
  ctx.textAlign='left';ctx.fillStyle='#fff';ctx.font='bold 26px sans-serif';ctx.fillText('SCORE '+score,20,36);
  ctx.textAlign='right';ctx.fillStyle='rgba(255,255,255,0.9)';ctx.font='14px sans-serif';ctx.fillText('三重殺 '+outs+'  Lv'+lvl,W-20,24);
  ctx.fillText('失敗',W-92,46);
  for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(W-60+i*20,41,7,0,6.28);ctx.fillStyle=i<fails?'#ff5b5b':'rgba(255,255,255,0.25)';ctx.fill();}
  if(combo>=2){ctx.textAlign='center';ctx.fillStyle='#ffd24d';ctx.font='bold 18px sans-serif';ctx.fillText('コンボ x'+combo,W/2,120);}

  if(state==='play'&&phase==='play'){ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,0.9)';ctx.font='bold 15px sans-serif';
    ctx.fillText('ボールが各塁に届く“緑リング”の瞬間にタップ！ 捕球→二塁→一塁の3連続で三重殺',W/2,44);}
  if(state==='play'&&phase==='result'&&msg){ctx.textAlign='center';ctx.fillStyle=(result==='triple')?'#9ff0b8':'#ff9a9a';ctx.font='bold 20px sans-serif';ctx.fillText(msg,W/2,44);}

  if(state==='title'){
    ctx.fillStyle='rgba(5,10,6,0.78)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='bold 44px sans-serif';ctx.fillText('トリプルプレー',W/2,110);
    ctx.fillStyle='#ffd23e';ctx.font='bold 22px sans-serif';ctx.fillText('Turn Three',W/2,146);
    ctx.fillStyle='rgba(255,255,255,0.92)';ctx.font='16px sans-serif';
    ctx.fillText('一球で3アウト。野球最高の魅せ場“三重殺”を決めろ',W/2,196);
    ctx.fillStyle='rgba(255,255,255,0.66)';ctx.font='14px sans-serif';
    ctx.fillText('ボールが内野を回る。各塁に届く瞬間に“緑リング”でタップして送球をつなぐ',W/2,236);
    ctx.fillText('① 捕球 → ② 二塁 → ③ 一塁 の3連続を、すべてタイミングよく決めると三重殺',W/2,258);
    ctx.fillText('中心（内側リング）でジャストなら加点。1つでもズレると連係が乱れて失敗',W/2,280);
    ctx.fillText('塁を回るごとにテンポが速くなる。上級ほどリングが狭い。3失敗で交代',W/2,302);
    ctx.fillText('操作：タップ / クリック / SPACE',W/2,324);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で開始',W/2,388);
    ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='14px sans-serif';ctx.fillText('BEST '+best,W/2,420);
  }
  if(state==='over'){
    ctx.fillStyle='rgba(5,10,6,0.84)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#ff6b6b';ctx.font='bold 46px sans-serif';ctx.fillText('3失敗…交代',W/2,222);
    ctx.fillStyle='#fff';ctx.font='bold 40px sans-serif';ctx.fillText('SCORE '+score,W/2,290);
    ctx.fillStyle='rgba(255,255,255,0.85)';ctx.font='19px sans-serif';ctx.fillText('三重殺 '+outs+'   BEST '+best,W/2,330);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で もう一度',W/2,402);
  }

  if(flash>0.02){ctx.globalAlpha=flash*0.5;ctx.fillStyle=flashCol;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}
  ctx.restore();

  ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,0.4)';ctx.font='12px sans-serif';
  ctx.fillText('各塁に届く緑リングの瞬間にタップ→捕球→二塁→一塁の3連続で三重殺。1つでもズレると失敗。3失敗で交代',W/2,H-8);
}

function frame(ts){let dt=ts-last;last=ts;if(dt>60)dt=60;if(dt<0)dt=0;update(dt);render();requestAnimationFrame(frame);}
requestAnimationFrame(frame);

// ---------- test hook ----------
window.__tp={
  start, tap:()=>tap(),
  get state(){return state;},
  get score(){return score;},
  get outs(){return outs;},
  get fails(){return fails;},
  get info(){return {state,phase,beat,madeOuts,clock,tArrive:tArrive.slice(),win,sweet,
    nextArrive:(phase==='play'&&beat<3?tArrive[beat]:null),err:(phase==='play'&&beat<3?Math.abs(clock-tArrive[beat]):null),
    canTap:(phase==='play'&&!acted),acted,result,outs,fails,lvl};}
};
})();
</script>
</body>
</html>
