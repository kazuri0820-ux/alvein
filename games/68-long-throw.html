<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ロングスロー — Long Throw-In</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{width:100%;height:100%;background:#08140c;overflow:hidden;
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,system-ui,sans-serif;
    touch-action:none;user-select:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  #stage{position:relative;aspect-ratio:900/600;max-width:100%;max-height:100%;
    width:auto;height:auto;box-shadow:0 0 60px rgba(0,0,0,.6);}
  canvas{display:block;width:100%;height:100%;border-radius:6px;}
</style>
</head>
<body>
<div id="wrap"><div id="stage"><canvas id="c" width="900" height="600"></canvas></div></div>
<script>
(function(){
"use strict";
const TEST=location.hash.indexOf('test')>=0;
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
const W=900,H=600;
let dpr=Math.max(1,Math.min(2,window.devicePixelRatio||1));
function fit(){ dpr=Math.max(1,Math.min(2,window.devicePixelRatio||1)); cv.width=W*dpr; cv.height=H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0); }
fit(); window.addEventListener('resize',fit);

// ---- audio ----
let AC=null;
function ac(){ if(!AC){ try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){AC=null;} } return AC; }
function tone(f,d,type,g,f2){ const a=ac(); if(!a)return; const o=a.createOscillator(),gg=a.createGain();
  o.type=type||'sine'; o.frequency.setValueAtTime(f,a.currentTime); if(f2)o.frequency.exponentialRampToValueAtTime(f2,a.currentTime+d);
  gg.gain.setValueAtTime(0.0001,a.currentTime); gg.gain.exponentialRampToValueAtTime(g||0.2,a.currentTime+0.01);
  gg.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+d); o.connect(gg); gg.connect(a.destination); o.start(); o.stop(a.currentTime+d+0.02); }
function noise(d,g,cut){ const a=ac(); if(!a)return; const n=Math.floor(a.sampleRate*d),buf=a.createBuffer(1,n,a.sampleRate),ch=buf.getChannelData(0);
  for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(1-i/n); const src=a.createBufferSource(); src.buffer=buf;
  const f=a.createBiquadFilter(); f.type='lowpass'; f.frequency.value=cut||1200; const gg=a.createGain(); gg.gain.value=g||0.2;
  src.connect(f); f.connect(gg); gg.connect(a.destination); src.start(); }
const S={
  charge(){ tone(200+Math.random()*20,0.03,'square',0.05); },
  throw(){ noise(0.06,0.3,1600); tone(260,0.08,'square',0.14,140); },
  head(){ noise(0.05,0.4,1600); tone(320,0.06,'square',0.2,180); },
  goal(){ noise(0.08,0.4,2200); tone(520,0.14,'square',0.26,660); },
  cheer(){ const a=ac(); if(!a)return; noise(0.9,0.28,1900); for(let i=0;i<7;i++)setTimeout(()=>tone(500+Math.random()*340,0.34,'sine',0.05),i*42); },
  miss(){ tone(300,0.2,'sine',0.12,180); noise(0.1,0.14,1000); }
};

// ---- geometry ----
const THR={x:824,y:250};           // thrower on the touchline
const RUNY=196;                    // teammate run line (in the box)
const RUN_L=224, RUN_R=628;
const LX_NEAR=630, LX_FAR=214;     // landing x range (power 0..1)
const GOAL={l:360,r:540,y:70};
const FLIGHT=0.64, CATCH0=36;

// ---- state ----
let state='ready';   // ready, aim, fly, result, over
let goals=0, miss=0, streak=0, best=0, level=0, playN=0;
let charging=false, power=0, chargeDur=1.15;
let mateX=430, mateV=150, catchR=CATCH0;
let ball=null, land=null, result=null, header=null;
let msg='',msgT=0, subMsg='';
let flash=0,flashCol='#fff',shakeT=0,shakeM=0;
let parts=[], crowd=[], t=0;

try{ best=parseInt(localStorage.getItem('lt_best')||'0',10)||0; }catch(e){}
for(let i=0;i<80;i++) crowd.push({x:Math.random()*W,y:6+Math.random()*40,c:['#e8544e','#f0c14b','#4a90d9','#fff','#5cc98a','#c98af0'][i%6],b:Math.random()*6.28});

function saveBest(){ try{localStorage.setItem('lt_best',''+best);}catch(e){} }
function levelUp(){ level=Math.min(9,Math.floor(goals/3)); }
function powerToX(p){ return LX_NEAR+(LX_FAR-LX_NEAR)*Math.max(0,Math.min(1,p)); }
function reset(){ goals=0;miss=0;streak=0;level=0;playN=0; parts=[]; nextThrow(); }

function nextThrow(){
  levelUp(); playN++;
  mateX=RUN_L+Math.random()*(RUN_R-RUN_L); mateV=(140+level*14)*(Math.random()<0.5?1:-1);
  catchR=Math.max(22,CATCH0-level*1.5);
  charging=false; power=0; chargeDur=Math.max(0.85,1.2-level*0.03);
  ball=null; land=null; result=null; header=null;
  state='aim';
  if(playN<=2){ msg='長押しでパワーを溜め、走り込む味方の落下点へ！ 離してスロー'; msgT=190; subMsg=''; }
  else { msg=''; msgT=0; subMsg=''; }
}

function startCharge(){ if(state!=='aim'||charging)return; charging=true; }
function release(){
  if(state!=='aim'||!charging) return; charging=false;
  const lx=powerToX(power);
  land={x:lx,y:RUNY};
  ball={x0:THR.x,y0:THR.y-10,x1:lx,y1:RUNY,t:0,dur:FLIGHT};
  state='fly'; S.throw();
}
function resolveThrow(){
  // teammate position at arrival already advanced during flight
  const d=Math.abs(mateX-land.x);
  if(d<catchR){ // caught -> header to goal
    result='goal'; goals++; streak++; if(streak>best){best=streak;saveBest();}
    const bull=d<catchR*0.4;
    msg = bull?'ドンピシャ！ ヘディングゴール！':'合った！ ヘディング決定機！'; subMsg=streak>=3?`${streak}連続で合わせた！`:'';
    S.head(); setTimeout(()=>{ S.goal(); setTimeout(S.cheer,40); },160);
    header={x0:land.x,y0:RUNY,x1:(land.x<450?GOAL.r-30:GOAL.l+30),y1:GOAL.y+8,t:0,dur:0.34};
    flash=0.45; flashCol='#eafff0'; shakeT=12; shakeM=4; burst(land.x,RUNY,'#eaffe0',14);
  } else {
    miss++; streak=0; result='miss';
    msg = land.x<mateX-catchR? '前に投げすぎた…':'届かなかった…'; subMsg=''; S.miss(); shakeT=7; shakeM=3;
    burst(land.x,RUNY,'#c8b088',8);
  }
  state='result'; msgT=110;
  if(result==='miss' && miss>=3){ setTimeout(()=>{ state='over'; msg='3ミス・終了'; msgT=99999; }, 850); }
  else setTimeout(()=>{ if(state==='result') nextThrow(); }, result==='goal'?1150:1000);
}

function burst(x,y,col,n){ for(let i=0;i<n;i++){ const a=Math.random()*6.28,sp=1+Math.random()*4;
  parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-1.5,life:1,col,r:2+Math.random()*3}); } }

// ---- input ----
cv.addEventListener('pointerdown',e=>{ e.preventDefault(); const a=ac(); if(a&&a.state==='suspended')a.resume();
  if(state==='ready'||state==='over'){ reset(); return; }
  if(state==='aim'){ startCharge(); } });
cv.addEventListener('pointerup',e=>{ e.preventDefault(); if(state==='aim'&&charging) release(); });
cv.addEventListener('pointercancel',e=>{ if(charging) release(); });
window.addEventListener('keydown',e=>{ if(e.code==='Space'||e.code==='Enter'){ e.preventDefault();
  if(state==='ready'||state==='over'){ reset(); return; } if(state==='aim'&&!e.repeat) startCharge(); } });
window.addEventListener('keyup',e=>{ if(e.code==='Space'||e.code==='Enter'){ if(state==='aim'&&charging) release(); } });

// ---- update ----
let last=0;
function update(dt){
  t+=dt; if(msgT>0)msgT--; if(flash>0)flash=Math.max(0,flash-dt*2); if(shakeT>0)shakeT--;
  // teammate runs (except after resolve)
  if(state==='aim'||state==='fly'){
    mateX+=mateV*dt; if(mateX<RUN_L){mateX=RUN_L;mateV=Math.abs(mateV);} else if(mateX>RUN_R){mateX=RUN_R;mateV=-Math.abs(mateV);} }
  if(state==='aim'&&charging){ power=Math.min(1, power+dt/chargeDur); if((power*22|0)!==((power-dt/chargeDur)*22|0))S.charge(); }
  if(state==='fly'&&ball){ ball.t+=dt; if(ball.t>=ball.dur){ resolveThrow(); } }
  if(state==='result'&&header){ header.t+=dt; }
  for(let i=parts.length-1;i>=0;i--){ const q=parts[i]; q.x+=q.vx;q.y+=q.vy;q.vy+=0.16;q.life-=dt*1.0; if(q.life<=0)parts.splice(i,1); }
}

// ---- draw ----
function rr(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }

function drawField(){
  const g=ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,'#0f3a1e'); g.addColorStop(1,'#1e7a40');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#0a1c10'; ctx.fillRect(0,0,W,40);
  for(const c of crowd){ const yy=c.y+Math.sin(t*3+c.b)*1.1; ctx.fillStyle=c.c; ctx.globalAlpha=.5; ctx.fillRect(c.x,yy,5,4); }
  ctx.globalAlpha=1;
  for(let i=0;i<7;i++){ ctx.fillStyle=i%2?'rgba(255,255,255,.04)':'rgba(0,0,0,.05)'; ctx.fillRect(0,60+i*78,W,78); }
  // touchline (right)
  ctx.strokeStyle='rgba(255,255,255,.5)'; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(812,60); ctx.lineTo(812,560); ctx.stroke();
  // goal + box
  ctx.fillStyle='rgba(255,255,255,.06)'; ctx.fillRect(GOAL.l,GOAL.y-26,GOAL.r-GOAL.l,26);
  ctx.strokeStyle='rgba(255,255,255,.24)'; ctx.lineWidth=1; for(let x=GOAL.l;x<=GOAL.r;x+=14){ ctx.beginPath(); ctx.moveTo(x,GOAL.y-26); ctx.lineTo(x,GOAL.y); ctx.stroke(); }
  ctx.strokeStyle='#fff'; ctx.lineWidth=7; ctx.lineCap='round'; ctx.beginPath(); ctx.moveTo(GOAL.l,GOAL.y); ctx.lineTo(GOAL.l,GOAL.y-26); ctx.lineTo(GOAL.r,GOAL.y-26); ctx.lineTo(GOAL.r,GOAL.y); ctx.stroke();
  ctx.strokeStyle='rgba(255,255,255,.4)'; ctx.lineWidth=3; ctx.strokeRect(300,GOAL.y,300,150);
  // run line hint
  ctx.strokeStyle='rgba(255,255,255,.12)'; ctx.setLineDash([6,8]); ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(RUN_L,RUNY); ctx.lineTo(RUN_R,RUNY); ctx.stroke(); ctx.setLineDash([]);
  // keeper
  ctx.save(); ctx.translate(450,GOAL.y+8); ctx.fillStyle='#ffcf3f'; rr(-10,-22,20,24,6); ctx.fill(); ctx.fillStyle='#f0c39a'; ctx.beginPath(); ctx.arc(0,-27,6,0,6.28); ctx.fill(); ctx.restore();
}
function drawThrower(){
  ctx.save(); ctx.translate(THR.x,THR.y);
  ctx.fillStyle='rgba(0,0,0,.24)'; ctx.beginPath(); ctx.ellipse(0,20,15,5,0,0,6.28); ctx.fill();
  ctx.fillStyle='#2f7fd6'; rr(-11,-24,22,42,7); ctx.fill();
  ctx.fillStyle='#f0c39a'; ctx.beginPath(); ctx.arc(0,-32,8,0,6.28); ctx.fill();
  // arms overhead holding ball when charging
  ctx.strokeStyle='#2f7fd6'; ctx.lineWidth=7; ctx.lineCap='round';
  const up = (state==='aim'&&charging)? -1 : (state==='aim'?-0.5:0);
  ctx.beginPath(); ctx.moveTo(-6,-18); ctx.lineTo(-10,-44+up*8); ctx.stroke(); ctx.beginPath(); ctx.moveTo(6,-18); ctx.lineTo(10,-44+up*8); ctx.stroke();
  if(state==='aim'){ ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(0,-52+up*8,7,0,6.28); ctx.fill(); ctx.strokeStyle='#123'; ctx.lineWidth=1.2; ctx.stroke(); }
  ctx.restore();
}
function drawMate(){
  if(state==='over'||state==='ready') return;
  ctx.save(); ctx.translate(mateX,RUNY);
  ctx.fillStyle='rgba(0,0,0,.24)'; ctx.beginPath(); ctx.ellipse(0,14,13,4,0,0,6.28); ctx.fill();
  const run=Math.sin(t*20)*(state==='aim'||state==='fly'?6:0);
  ctx.strokeStyle='#20304a'; ctx.lineWidth=6; ctx.lineCap='round'; ctx.beginPath(); ctx.moveTo(0,-4); ctx.lineTo(-5-run*0.2,14); ctx.stroke(); ctx.beginPath(); ctx.moveTo(0,-4); ctx.lineTo(5+run*0.2,14); ctx.stroke();
  ctx.fillStyle='#e8544e'; rr(-10,-26,20,24,6); ctx.fill(); ctx.fillStyle='#f0c39a'; ctx.beginPath(); ctx.arc(0,-32,7,0,6.28); ctx.fill();
  ctx.restore();
  // catch radius hint
  if(state==='aim'){ ctx.strokeStyle='rgba(232,84,78,.25)'; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(mateX,RUNY,catchR,0,6.28); ctx.stroke(); }
}
function drawAim(){
  if(state!=='aim') return;
  const lx=powerToX(power);
  // arc preview
  ctx.strokeStyle='rgba(255,255,255,.5)'; ctx.setLineDash([2,7]); ctx.lineWidth=2;
  ctx.beginPath(); for(let i=0;i<=20;i++){ const p=i/20; const x=THR.x+(lx-THR.x)*p, y=(THR.y-10)+(RUNY-(THR.y-10))*p - Math.sin(p*Math.PI)*90; if(i===0)ctx.moveTo(x,y); else ctx.lineTo(x,y);} ctx.stroke(); ctx.setLineDash([]);
  // landing marker
  ctx.strokeStyle='#ffd23e'; ctx.lineWidth=3; ctx.beginPath(); ctx.arc(lx,RUNY,10,0,6.28); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(lx-14,RUNY); ctx.lineTo(lx+14,RUNY); ctx.moveTo(lx,RUNY-14); ctx.lineTo(lx,RUNY+14); ctx.stroke();
  // power bar
  const bw=280,bx=(W-bw)/2,by=H-42; ctx.fillStyle='rgba(6,18,10,.6)'; rr(bx,by,bw,12,6); ctx.fill();
  ctx.fillStyle='#ffd23e'; rr(bx,by,bw*power,12,6); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.7)'; ctx.font='12px sans-serif'; ctx.textAlign='center'; ctx.fillText('パワー（長押しで飛距離↑／離してスロー）',450,by-4); ctx.textAlign='left';
}
function drawBall(){
  if(ball&&state==='fly'){ const p=Math.min(1,ball.t/ball.dur); const x=ball.x0+(ball.x1-ball.x0)*p, y=ball.y0+(ball.y1-ball.y0)*p - Math.sin(p*Math.PI)*110;
    ctx.fillStyle='rgba(0,0,0,.18)'; ctx.beginPath(); ctx.ellipse(x,RUNY,7,3,0,0,6.28); ctx.fill();
    ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(x,y,7,0,6.28); ctx.fill(); ctx.strokeStyle='#123'; ctx.lineWidth=1.3; ctx.stroke(); }
  if(header){ const p=Math.min(1,header.t/header.dur); const x=header.x0+(header.x1-header.x0)*p, y=header.y0+(header.y1-header.y0)*p - Math.sin(p*Math.PI)*24;
    ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(x,y,7,0,6.28); ctx.fill(); ctx.strokeStyle='#123'; ctx.lineWidth=1.3; ctx.stroke(); }
}

function hud(x,y,w,h,lab,val,col){
  ctx.fillStyle='rgba(6,20,12,.62)'; rr(x,y,w,h,9); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.6)'; ctx.font='11px sans-serif'; ctx.textAlign='left'; ctx.fillText(lab,x+12,y+19);
  ctx.fillStyle=col||'#fff'; ctx.font='bold 24px sans-serif'; ctx.fillText(val,x+12,y+44);
}
function drawHUD(){
  hud(20,14,150,56,'ゴール GOALS',''+goals,'#8effa8');
  hud(W/2-75,14,150,56,'連続 STREAK',''+streak,'#ffd23e');
  const mc=miss>=2?'#ff6a5a':'#fff';
  hud(W-170,14,150,56,'ミス MISS',miss+' /3',mc); ctx.textAlign='left';
  ctx.fillStyle='rgba(255,255,255,.5)'; ctx.font='12px sans-serif'; ctx.fillText('自己ベスト連続 '+best,22,88);
}
function drawMsg(){
  if(msgT>0&&msg){ ctx.textAlign='center'; ctx.font='bold 26px sans-serif'; const w=ctx.measureText(msg).width;
    ctx.fillStyle='rgba(6,18,10,.75)'; rr(450-w/2-18,H-96,w+40,40,10); ctx.fill();
    ctx.fillStyle='#fff'; ctx.fillText(msg,450,H-69);
    if(subMsg){ ctx.font='bold 16px sans-serif'; ctx.fillStyle='rgba(140,255,168,.95)'; ctx.fillText(subMsg,450,H-44); }
    ctx.textAlign='left'; }
}
function drawOverlay(){
  ctx.fillStyle='rgba(6,16,10,.76)'; ctx.fillRect(0,0,W,H); ctx.textAlign='center';
  ctx.fillStyle='rgba(140,255,168,.9)'; ctx.font='600 15px sans-serif'; ctx.fillText('SOCCER · LONG THROW-IN',450,140);
  ctx.fillStyle='#fff'; ctx.font='bold 54px sans-serif'; ctx.fillText('ロングスロー',450,198);
  ctx.fillStyle='#ffd23e'; ctx.font='bold 21px sans-serif'; ctx.fillText('Long Throw-In',450,230);
  ctx.fillStyle='rgba(255,255,255,.9)'; ctx.font='16px sans-serif';
  const L=['ロングスローでゴール前の味方を狙え！',
    '長押しでパワー（飛距離）を溜め、離してスロー。',
    '味方は走っている。飛距離＝落下点を走り込む先へ合わせろ。',
    '頭に合えばヘディング決定機。ドンピシャは高評価。',
    '前・後ろにズレるとミス。3ミスで終了。'];
  for(let i=0;i<L.length;i++) ctx.fillText(L[i],450,268+i*25);
  ctx.fillStyle='#e8544e'; rr(450-95,424,190,54,27); ctx.fill();
  ctx.fillStyle='#fff'; ctx.font='bold 24px sans-serif'; ctx.fillText('キックオフ',450,458);
  ctx.fillStyle='rgba(255,255,255,.6)'; ctx.font='14px sans-serif'; ctx.fillText('長押しで溜めて離す（Spaceも可）',450,498);
  ctx.textAlign='left';
}
function drawOver(){
  ctx.fillStyle='rgba(6,16,10,.84)'; ctx.fillRect(0,0,W,H); ctx.textAlign='center';
  ctx.fillStyle='#fff'; ctx.font='bold 46px sans-serif'; ctx.fillText('3ミス・終了',450,232);
  ctx.fillStyle='#8effa8'; ctx.font='bold 30px sans-serif'; ctx.fillText('決定機 '+goals,450,286);
  ctx.fillStyle='#ffd23e'; ctx.font='20px sans-serif'; ctx.fillText('自己ベスト連続 '+best,450,322);
  ctx.fillStyle='#2f7fd6'; rr(450-95,372,190,54,27); ctx.fill();
  ctx.fillStyle='#fff'; ctx.font='bold 22px sans-serif'; ctx.fillText('もう一度',450,406);
  ctx.textAlign='left';
}

function render(){
  ctx.save();
  if(shakeT>0){ ctx.translate((Math.random()*2-1)*shakeM,(Math.random()*2-1)*shakeM); }
  drawField(); drawMate(); drawThrower(); drawAim(); drawBall();
  for(const q of parts){ ctx.globalAlpha=Math.max(0,q.life); ctx.fillStyle=q.col; ctx.beginPath(); ctx.arc(q.x,q.y,q.r,0,6.28); ctx.fill(); }
  ctx.globalAlpha=1;
  drawHUD(); drawMsg();
  ctx.restore();
  if(flash>0){ ctx.fillStyle=flashCol; ctx.globalAlpha=flash; ctx.fillRect(0,0,W,H); ctx.globalAlpha=1; }
  if(state==='ready') drawOverlay();
  if(state==='over') drawOver();
}
function loop(ts){ if(!last)last=ts; let dt=(ts-last)/1000; last=ts; if(dt>0.05)dt=0.05; update(dt); render(); requestAnimationFrame(loop); }
requestAnimationFrame(loop);

if(TEST){
  window.__lt={
    get state(){return state;},
    get mateX(){return mateX;},
    get mateV(){return mateV;},
    flight:FLIGHT, get catchR(){return catchR;},
    runL:RUN_L, runR:RUN_R,
    powerForX(x){ return (LX_NEAR - x)/(LX_NEAR-LX_FAR); },
    get result(){return result;},
    get count(){return {goals,miss,streak};},
    throwAtX(x){ if(state!=='aim')return; land={x:Math.max(LX_FAR,Math.min(LX_NEAR,x)),y:RUNY};
      ball={x0:THR.x,y0:THR.y-10,x1:land.x,y1:RUNY,t:0,dur:FLIGHT}; charging=false; state='fly'; S.throw(); },
    tap(){ if(state==='ready'||state==='over')reset(); }
  };
}
})();
</script>
</body>
</html>
