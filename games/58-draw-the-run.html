<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ドリブル・ルート — Draw the Run</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{width:100%;height:100%;background:#08140c;overflow:hidden;
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,system-ui,sans-serif;
    touch-action:none;user-select:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  #stage{position:relative;aspect-ratio:900/600;max-width:100%;max-height:100%;
    width:auto;height:auto;box-shadow:0 0 60px rgba(0,0,0,.6);}
  canvas{display:block;width:100%;height:100%;border-radius:6px;}
</style>
</head>
<body>
<div id="wrap"><div id="stage"><canvas id="c" width="900" height="600"></canvas></div></div>
<script>
(function(){
"use strict";
const TEST=location.hash.indexOf('test')>=0;
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
const W=900,H=600;
let dpr=Math.max(1,Math.min(2,window.devicePixelRatio||1));
function fit(){ dpr=Math.max(1,Math.min(2,window.devicePixelRatio||1)); cv.width=W*dpr; cv.height=H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0); }
fit(); window.addEventListener('resize',fit);

// ---- audio ----
let AC=null;
function ac(){ if(!AC){ try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){AC=null;} } return AC; }
function tone(f,d,type,g,f2){ const a=ac(); if(!a)return; const o=a.createOscillator(),gg=a.createGain();
  o.type=type||'sine'; o.frequency.setValueAtTime(f,a.currentTime); if(f2)o.frequency.exponentialRampToValueAtTime(f2,a.currentTime+d);
  gg.gain.setValueAtTime(0.0001,a.currentTime); gg.gain.exponentialRampToValueAtTime(g||0.2,a.currentTime+0.01);
  gg.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+d); o.connect(gg); gg.connect(a.destination); o.start(); o.stop(a.currentTime+d+0.02); }
function noise(d,g,cut){ const a=ac(); if(!a)return; const n=Math.floor(a.sampleRate*d),buf=a.createBuffer(1,n,a.sampleRate),ch=buf.getChannelData(0);
  for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(1-i/n); const src=a.createBufferSource(); src.buffer=buf;
  const f=a.createBiquadFilter(); f.type='lowpass'; f.frequency.value=cut||1200; const gg=a.createGain(); gg.gain.value=g||0.2;
  src.connect(f); f.connect(gg); gg.connect(a.destination); src.start(); }
const S={
  go(){ noise(0.05,0.24,2000); tone(300,0.08,'square',0.14,460); },
  step(){ noise(0.025,0.08,900); }, beat(){ tone(760,0.05,'square',0.08,520); },
  goal(){ noise(0.08,0.4,2200); tone(520,0.14,'square',0.26,660); },
  cheer(){ const a=ac(); if(!a)return; noise(0.9,0.28,1900); for(let i=0;i<7;i++)setTimeout(()=>tone(500+Math.random()*340,0.34,'sine',0.05),i*42); },
  tackle(){ noise(0.12,0.34,1000); tone(200,0.16,'sawtooth',0.14,90); },
  draw(){ tone(600,0.02,'sine',0.03); }
};

// ---- geometry ----
const GOAL={L:360,R:540,line:70};
const START={x:450,y:530};

// ---- state ----
let state='ready';   // ready, draw, run, result, over
let goals=0, fails=0, streak=0, best=0, level=0, playN=0;
let defs=[];         // {x,y,vx,vy,r} pursuing defenders
let path=[], drawing=false, pathLen=0, maxLen=1000;
let runI=0, runT=0, player={x:START.x,y:START.y}, tackledBy=null;
let result=null, msg='', msgT=0, subMsg='';
let flash=0,flashCol='#fff',shakeT=0,shakeM=0;
let parts=[], crowd=[], t=0, nutmegs=0;

const PV=272;                 // player dribble speed
try{ best=parseInt(localStorage.getItem('dr_best')||'0',10)||0; }catch(e){}
for(let i=0;i<80;i++) crowd.push({x:Math.random()*W,y:6+Math.random()*38,c:['#e8544e','#f0c14b','#4a90d9','#fff','#5cc98a','#c98af0'][i%6],b:Math.random()*6.28});

function saveBest(){ try{localStorage.setItem('dr_best',''+best);}catch(e){} }
function levelUp(){ level=Math.min(9,Math.floor(goals/3)); }
function reset(){ goals=0;fails=0;streak=0;level=0;playN=0; parts=[]; nextPlay(); }

function nextPlay(){
  levelUp(); playN++;
  const N=3+Math.floor(level/1.5);
  defs=[]; let tries=0;
  while(defs.length<N && tries<300){ tries++;
    const x=90+Math.random()*720, y=170+Math.random()*250;
    if(Math.hypot(x-START.x,y-START.y)<120) continue;
    if(defs.some(d=>Math.hypot(d.x-x,d.y-y)<86)) continue;
    defs.push({x,y,x0:x,y0:y, vd:132+level*9, r:24});
  }
  maxLen=Math.max(720,1080-level*30);
  path=[{x:START.x,y:START.y}]; pathLen=0; drawing=false;
  runI=0; runT=0; player={x:START.x,y:START.y}; tackledBy=null; result=null; nutmegs=0;
  state='draw';
  if(playN<=2){ msg='ボールから指でルートを描いて突破！ 敵を避けてゴールへ'; msgT=200; subMsg=''; }
  else { msg=''; msgT=0; subMsg=''; }
}

// ---- path helpers ----
function addPoint(x,y){
  const last=path[path.length-1];
  const d=Math.hypot(x-last.x,y-last.y);
  if(d<7) return;
  if(pathLen+d>maxLen){ // clamp to remaining
    const rem=maxLen-pathLen; if(rem<=1)return; const f=rem/d;
    x=last.x+(x-last.x)*f; y=last.y+(y-last.y)*f; pathLen=maxLen;
    path.push({x,y}); drawing=false; commitPath(); return;
  }
  pathLen+=d; path.push({x,y}); if(path.length%3===0)S.draw();
}
function commitPath(){
  if(path.length<2){ state='draw'; return; }
  state='run'; runI=0; runT=0; S.go();
}

// ---- input ----
function cpt(e){ const rect=cv.getBoundingClientRect(); return {x:(e.clientX-rect.left)/rect.width*W, y:(e.clientY-rect.top)/rect.height*H}; }
cv.addEventListener('pointerdown',e=>{ e.preventDefault(); const a=ac(); if(a&&a.state==='suspended')a.resume();
  if(state==='ready'||state==='over'){ reset(); return; }
  if(state==='draw'){ const p=cpt(e); // start drawing from the ball
    drawing=true; path=[{x:START.x,y:START.y}]; pathLen=0; addPoint(p.x,p.y); }
});
cv.addEventListener('pointermove',e=>{ if(!drawing||state!=='draw')return; const p=cpt(e); addPoint(p.x,p.y); });
cv.addEventListener('pointerup',e=>{ e.preventDefault(); if(drawing&&state==='draw'){ drawing=false; commitPath(); } });
cv.addEventListener('pointercancel',e=>{ if(drawing){ drawing=false; commitPath(); } });
window.addEventListener('keydown',e=>{ if((e.code==='Space'||e.code==='Enter')&&(state==='ready'||state==='over')){ e.preventDefault(); reset(); } });

// ---- update ----
let last=0;
function update(dt){
  t+=dt; if(msgT>0)msgT--; if(flash>0)flash=Math.max(0,flash-dt*2); if(shakeT>0)shakeT--;
  if(state==='run'){
    // advance player along path
    let move=PV*dt;
    while(move>0 && runI<path.length-1){
      const a=path[runI], b=path[runI+1]; const seg=Math.hypot(b.x-a.x,b.y-a.y);
      const segLeft=seg*(1-runT);
      if(move<segLeft){ runT+=move/seg; move=0; }
      else { move-=segLeft; runI++; runT=0; }
    }
    const a=path[Math.min(runI,path.length-1)], b=path[Math.min(runI+1,path.length-1)];
    player.x=a.x+(b.x-a.x)*runT; player.y=a.y+(b.y-a.y)*runT;
    if((t*30|0)%3===0) {}
    // defenders pursue
    for(const d of defs){ const dx=player.x-d.x, dy=player.y-d.y, dd=Math.hypot(dx,dy)||1;
      const sp=d.vd*dt; d.x+=dx/dd*Math.min(sp,dd); d.y+=dy/dd*Math.min(sp,dd);
      if(dd<20){ tackledBy=d; endRun('tackle'); return; }
      else if(dd<40){ if(!d._near){ d._near=1; } }
    }
    // reached goal?
    if(player.y<=GOAL.line+6 && player.x>GOAL.L && player.x<GOAL.R){ endRun('goal'); return; }
    // ran out of path without reaching goal
    if(runI>=path.length-1 && runT>=1){ endRun(player.y<=GOAL.line+30?'goal':'short'); return; }
  }
  for(let i=parts.length-1;i>=0;i--){ const q=parts[i]; q.x+=q.vx;q.y+=q.vy;q.vy+=0.16;q.life-=dt*1.0; if(q.life<=0)parts.splice(i,1); }
}
function endRun(r){
  result=r;
  if(r==='goal'){ goals++; streak++; if(streak>best){best=streak;saveBest();}
    // count near-misses (nutmegs): defenders passed closely
    const close=defs.filter(d=>d._near).length;
    msg = streak>=3? `${streak}人抜き級の連続突破！`:'ゴール！ 見事な突破！';
    if(close>=2){ subMsg='際どいドリブルで'+close+'人を交わした！'; } else subMsg='';
    S.goal(); setTimeout(S.cheer,60); flash=0.5; flashCol='#eafff0'; shakeT=13; shakeM=5; burst(player.x,player.y,'#eaffe0',16);
    state='result'; msgT=120; setTimeout(()=>{ if(state==='result') nextPlay(); }, 1150);
  } else {
    fails++; streak=0;
    msg = r==='tackle'?'ボールを奪われた！':'ゴールまで届かなかった…'; subMsg='';
    S.tackle(); shakeT=9; shakeM=4; if(tackledBy)burst(player.x,player.y,'#ff9a6a',12);
    state='result'; msgT=120;
    if(fails>=3){ setTimeout(()=>{ state='over'; msg='3回失敗・終了'; msgT=99999; }, 850); }
    else setTimeout(()=>{ if(state==='result') nextPlay(); }, 1000);
  }
}

function burst(x,y,col,n){ for(let i=0;i<n;i++){ const a=Math.random()*6.28,sp=1+Math.random()*5;
  parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-2,life:1,col,r:2+Math.random()*3}); } }

// ---- draw ----
function rr(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }

function drawField(){
  const g=ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,'#155a30'); g.addColorStop(1,'#1e7a40');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#0a1c10'; ctx.fillRect(0,0,W,30);
  for(const c of crowd){ const yy=c.y+Math.sin(t*3+c.b)*1.1; ctx.fillStyle=c.c; ctx.globalAlpha=.5; ctx.fillRect(c.x,yy,5,4); }
  ctx.globalAlpha=1;
  for(let i=0;i<7;i++){ ctx.fillStyle=i%2?'rgba(255,255,255,.04)':'rgba(0,0,0,.05)'; ctx.fillRect(0,60+i*70,W,70); }
  ctx.strokeStyle='rgba(255,255,255,.4)'; ctx.lineWidth=3; ctx.strokeRect(250,GOAL.line,400,150);
  // net
  ctx.fillStyle='rgba(255,255,255,.06)'; ctx.fillRect(GOAL.L,GOAL.line-26,GOAL.R-GOAL.L,26);
  ctx.strokeStyle='rgba(255,255,255,.24)'; ctx.lineWidth=1;
  for(let x=GOAL.L;x<=GOAL.R;x+=14){ ctx.beginPath(); ctx.moveTo(x,GOAL.line-26); ctx.lineTo(x,GOAL.line); ctx.stroke(); }
  ctx.strokeStyle='#fff'; ctx.lineWidth=7; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(GOAL.L,GOAL.line); ctx.lineTo(GOAL.L,GOAL.line-26); ctx.lineTo(GOAL.R,GOAL.line-26); ctx.lineTo(GOAL.R,GOAL.line); ctx.stroke();
}
function drawPath(){
  if(path.length>1){
    ctx.strokeStyle= state==='run'? 'rgba(255,210,62,.5)':'rgba(140,255,168,.75)'; ctx.lineWidth=4; ctx.lineCap='round'; ctx.lineJoin='round';
    ctx.beginPath(); ctx.moveTo(path[0].x,path[0].y); for(const p of path)ctx.lineTo(p.x,p.y); ctx.stroke();
    // arrow head at end
    const e=path[path.length-1], q=path[path.length-2];
    const a=Math.atan2(e.y-q.y,e.x-q.x); ctx.fillStyle=state==='run'?'rgba(255,210,62,.7)':'rgba(140,255,168,.9)';
    ctx.save(); ctx.translate(e.x,e.y); ctx.rotate(a); ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(-12,-6); ctx.lineTo(-12,6); ctx.closePath(); ctx.fill(); ctx.restore();
  }
}
function drawDefs(){
  for(const d of defs){
    if(state==='draw'){ ctx.fillStyle='rgba(255,90,74,.12)'; ctx.beginPath(); ctx.arc(d.x,d.y,d.r+18,0,6.28); ctx.fill(); }
    ctx.save(); ctx.translate(d.x,d.y);
    ctx.fillStyle='rgba(0,0,0,.24)'; ctx.beginPath(); ctx.ellipse(0,12,14,5,0,0,6.28); ctx.fill();
    ctx.fillStyle=d.keeper?'#ffcf3f':'#e8544e'; rr(-11,-24,22,30,6); ctx.fill();
    ctx.fillStyle='#f0c39a'; ctx.beginPath(); ctx.arc(0,-30,7,0,6.28); ctx.fill();
    ctx.restore();
  }
}
function drawPlayer(){
  const px=state==='run'?player.x:START.x, py=state==='run'?player.y:START.y;
  ctx.save(); ctx.translate(px,py);
  ctx.fillStyle='rgba(0,0,0,.26)'; ctx.beginPath(); ctx.ellipse(0,13,15,5,0,0,6.28); ctx.fill();
  const run=Math.sin(t*20)*(state==='run'?6:0);
  ctx.strokeStyle='#20304a'; ctx.lineWidth=7; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(0,-6); ctx.lineTo(-6-run*0.2,14); ctx.stroke(); ctx.beginPath(); ctx.moveTo(0,-6); ctx.lineTo(6+run*0.2,14); ctx.stroke();
  ctx.fillStyle='#2f7fd6'; rr(-12,-30,24,26,7); ctx.fill();
  ctx.fillStyle='#f0c39a'; ctx.beginPath(); ctx.arc(0,-38,8,0,6.28); ctx.fill();
  ctx.restore();
  // ball at feet
  ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(px+8,py+14,6,0,6.28); ctx.fill(); ctx.strokeStyle='#123'; ctx.lineWidth=1.2; ctx.stroke();
}
function drawStamina(){
  if(state!=='draw') return;
  const bw=300,bx=(W-bw)/2,by=H-40;
  ctx.fillStyle='rgba(6,18,12,.6)'; rr(bx,by,bw,10,5); ctx.fill();
  ctx.fillStyle=pathLen>maxLen*0.85?'#ff8a5a':'#8effa8'; rr(bx,by,bw*Math.min(1,pathLen/maxLen),10,5); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.7)'; ctx.font='12px sans-serif'; ctx.textAlign='center'; ctx.fillText('ルートの長さ',450,by-4); ctx.textAlign='left';
}

function hud(x,y,w,h,lab,val,col){
  ctx.fillStyle='rgba(6,20,12,.62)'; rr(x,y,w,h,9); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.6)'; ctx.font='11px sans-serif'; ctx.textAlign='left'; ctx.fillText(lab,x+12,y+19);
  ctx.fillStyle=col||'#fff'; ctx.font='bold 24px sans-serif'; ctx.fillText(val,x+12,y+44);
}
function drawHUD(){
  hud(20,14,150,56,'ゴール GOALS',''+goals,'#8effa8');
  hud(W/2-75,14,150,56,'連続 STREAK',''+streak,'#ffd23e');
  const fc=fails>=2?'#ff6a5a':'#fff';
  hud(W-170,14,150,56,'失敗 FAIL',fails+' /3',fc); ctx.textAlign='left';
  ctx.fillStyle='rgba(255,255,255,.5)'; ctx.font='12px sans-serif'; ctx.fillText('自己ベスト連続 '+best,22,88);
}
function drawMsg(){
  if(msgT>0&&msg){ ctx.textAlign='center'; ctx.font='bold 28px sans-serif'; const w=ctx.measureText(msg).width;
    ctx.fillStyle='rgba(6,18,10,.75)'; rr(450-w/2-18,96,w+36,42,10); ctx.fill();
    ctx.fillStyle='#fff'; ctx.fillText(msg,450,124);
    if(subMsg){ ctx.font='bold 17px sans-serif'; ctx.fillStyle='rgba(255,210,62,.95)'; ctx.fillText(subMsg,450,150); }
    ctx.textAlign='left'; }
}
function drawOverlay(){
  ctx.fillStyle='rgba(6,16,10,.76)'; ctx.fillRect(0,0,W,H); ctx.textAlign='center';
  ctx.fillStyle='rgba(140,255,168,.9)'; ctx.font='600 15px sans-serif'; ctx.fillText('SOCCER · DRAW YOUR RUN',450,140);
  ctx.fillStyle='#fff'; ctx.font='bold 52px sans-serif'; ctx.fillText('ドリブル・ルート',450,198);
  ctx.fillStyle='#ffd23e'; ctx.font='bold 21px sans-serif'; ctx.fillText('Draw the Run',450,230);
  ctx.fillStyle='rgba(255,255,255,.9)'; ctx.font='16px sans-serif';
  const L=['ボールから指でルートを描くと、その通りにドリブル突破！',
    '敵ディフェンダーは選手を追いかけてくる（赤い範囲に注意）。',
    'すき間を通し、追いつかれる前にゴールへ運べ。',
    'ルートの長さには限界あり。最短で鋭く。',
    '奪われる・届かないは失敗。3回失敗で終了。'];
  for(let i=0;i<L.length;i++) ctx.fillText(L[i],450,268+i*25);
  ctx.fillStyle='#e8544e'; rr(450-95,424,190,54,27); ctx.fill();
  ctx.fillStyle='#fff'; ctx.font='bold 24px sans-serif'; ctx.fillText('キックオフ',450,458);
  ctx.fillStyle='rgba(255,255,255,.6)'; ctx.font='14px sans-serif'; ctx.fillText('ボールからドラッグしてルートを描く',450,502);
  ctx.textAlign='left';
}
function drawOver(){
  ctx.fillStyle='rgba(6,16,10,.84)'; ctx.fillRect(0,0,W,H); ctx.textAlign='center';
  ctx.fillStyle='#fff'; ctx.font='bold 46px sans-serif'; ctx.fillText('3回失敗・終了',450,232);
  ctx.fillStyle='#8effa8'; ctx.font='bold 30px sans-serif'; ctx.fillText('突破 '+goals+' 回',450,286);
  ctx.fillStyle='#ffd23e'; ctx.font='20px sans-serif'; ctx.fillText('自己ベスト連続 '+best,450,322);
  ctx.fillStyle='#2f7fd6'; rr(450-95,372,190,54,27); ctx.fill();
  ctx.fillStyle='#fff'; ctx.font='bold 22px sans-serif'; ctx.fillText('もう一度',450,406);
  ctx.textAlign='left';
}

function render(){
  ctx.save();
  if(shakeT>0){ ctx.translate((Math.random()*2-1)*shakeM,(Math.random()*2-1)*shakeM); }
  drawField(); drawPath(); drawDefs(); drawPlayer();
  for(const q of parts){ ctx.globalAlpha=Math.max(0,q.life); ctx.fillStyle=q.col; ctx.beginPath(); ctx.arc(q.x,q.y,q.r,0,6.28); ctx.fill(); }
  ctx.globalAlpha=1;
  drawStamina(); drawHUD(); drawMsg();
  ctx.restore();
  if(flash>0){ ctx.fillStyle=flashCol; ctx.globalAlpha=flash; ctx.fillRect(0,0,W,H); ctx.globalAlpha=1; }
  if(state==='ready') drawOverlay();
  if(state==='over') drawOver();
}
function loop(ts){ if(!last)last=ts; let dt=(ts-last)/1000; last=ts; if(dt>0.05)dt=0.05; update(dt); render(); requestAnimationFrame(loop); }
requestAnimationFrame(loop);

if(TEST){
  window.__dr={
    get state(){return state;},
    get defs(){ return defs.map(d=>({x:d.x,y:d.y,r:d.r,keeper:!!d.keeper})); },
    get player(){ return {x:player.x,y:player.y}; },
    goalL:GOAL.L, goalR:GOAL.R, goalLine:GOAL.line, start:{x:START.x,y:START.y}, maxLen:0,
    get result(){return result;},
    get count(){return {goals,fails,streak};},
    submitPath(pts){ if(state!=='draw')return; path=[{x:START.x,y:START.y}]; pathLen=0;
      for(const p of pts){ addPoint(p.x,p.y); } drawing=false; commitPath(); },
    tap(){ if(state==='ready'||state==='over')reset(); }
  };
}
})();
</script>
</body>
</html>
