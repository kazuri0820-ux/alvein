<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>オーバーラップ (Overlap)</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;background:#08120a;overflow:hidden;font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",system-ui,sans-serif}
  #wrap{width:100%;height:100%;display:flex;align-items:center;justify-content:center}
  #stage{position:relative;width:min(100vw,calc(100vh*1.5));aspect-ratio:900/600;max-width:900px;
    box-shadow:0 10px 60px rgba(0,0,0,.6);border-radius:10px;overflow:hidden;touch-action:none}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
  #hint{position:absolute;left:0;bottom:6px;width:100%;text-align:center;color:#cfe;
    font-size:12px;opacity:.55;pointer-events:none;text-shadow:0 1px 3px #000}
</style>
</head>
<body>
<div id="wrap"><div id="stage">
  <canvas id="cv"></canvas>
  <div id="hint">DFの動きを読め！ 内を切ってきたら 外の味方へリリース（→）、外へついたら 中へカットイン（←）。DFの空けた側を突け（タップ 左/右）</div>
</div></div>
<script>
(()=>{
const cv=document.getElementById('cv'), g=cv.getContext('2d');
const W=900,H=600;
let DPR=1;
function fit(){ DPR=Math.min(2,window.devicePixelRatio||1); cv.width=W*DPR; cv.height=H*DPR; g.setTransform(DPR,0,0,DPR,0,0); }
fit(); addEventListener('resize',fit);

// ---------- audio ----------
let AC=null;
function ac(){ if(!AC){ try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){} } return AC; }
function tone(f,d,t,v,sweep){ const a=ac(); if(!a)return; const o=a.createOscillator(),gg=a.createGain();
  o.type=t||'sine'; o.frequency.value=f; if(sweep) o.frequency.exponentialRampToValueAtTime(Math.max(20,sweep),a.currentTime+d);
  gg.gain.setValueAtTime(0.0001,a.currentTime); gg.gain.exponentialRampToValueAtTime(v||0.2,a.currentTime+0.012);
  gg.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+d); o.connect(gg).connect(a.destination);
  o.start(); o.stop(a.currentTime+d+0.02); }
function noise(d,v,hp){ const a=ac(); if(!a)return; const n=a.createBuffer(1,a.sampleRate*d,a.sampleRate); const ch=n.getChannelData(0);
  for(let i=0;i<ch.length;i++) ch[i]=(Math.random()*2-1)*(1-i/ch.length);
  const s=a.createBufferSource(); s.buffer=n; const f=a.createBiquadFilter(); f.type='highpass'; f.frequency.value=hp||600;
  const gg=a.createGain(); gg.gain.value=v||0.15; s.connect(f).connect(gg).connect(a.destination); s.start(); }
const S={
  pass(){ noise(0.04,0.14,700); tone(260,0.06,'square',0.1,140); },
  goal(){ tone(520,0.1,'triangle',0.14,780); setTimeout(()=>tone(780,0.12,'triangle',0.12,1040),90); setTimeout(()=>tone(1040,0.14,'triangle',0.1,1320),190); noise(0.3,0.1,400); },
  chance(){ tone(500,0.09,'triangle',0.11,760); },
  lost(){ noise(0.14,0.2,400); tone(200,0.16,'sawtooth',0.13,80); },
  over(){ tone(300,0.5,'sawtooth',0.16,90); setTimeout(()=>tone(200,0.6,'sawtooth',0.14,60),160); },
};

// ---------- geometry ----------
const GY=96, WING={x:628,y:452};

// ---------- state ----------
let state='title';
let parts=[], pops=[];
let score, combo, best, lvl, losses, goals;
let phase='read', play=null, t=0, resT=0, pend=null, pendDelay=0;
let flash=0, shakeT=0;
try{ best=+localStorage.getItem('ov_best')||0; }catch(e){ best=0; }

const crowd=[]; { const cc=['#e6b48f','#9bd0e6','#e6dc8f','#c9a0d8','#8fd8bd','#f0f0f0']; for(let i=0;i<240;i++) crowd.push({x:(i*27.7)%W, y:2+((i*61)%56), c:cc[i%cc.length]}); }
function clamp(v,a,b){ return v<a?a:v>b?b:v; }
function rnd(a,b){ return a+Math.random()*(b-a); }
function chance(p){ return Math.random()<p; }

function reset(){ parts=[]; pops=[]; score=0; combo=0; lvl=0; losses=0; goals=0; newPlay(); }
function newPlay(){
  phase='read'; t=0; resT=0; pend=null;
  const commit = chance(0.5)?'stay':'shift';   // stay=blocks inside cut / shift=covers overlap
  const feint = chance(clamp((lvl-2)*0.16,0,0.55));
  const setDir = feint ? (commit==='stay'?'shift':'stay') : commit;
  const approachT=clamp(1650 - lvl*110, 900, 1650);
  const cueLead=clamp(470 - lvl*44, 190, 470);
  const flipT=approachT - cueLead*0.5;
  play={ commit, feint, setDir, approachT, cueLead, flipT, deadline:approachT+120, cued:false,
    choice:null, result:null, applied:false, t2:0,
    def:{x:565,y:392}, run:{x:706,y:520}, ball:{x:WING.x-8,y:WING.y+6}, wx:WING.x, wy:WING.y };
  S.pass();  // whistle-ish cue (kept subtle)
}
function shownCommit(){ const p=play; if(t< p.approachT - p.cueLead) return null; if(p.feint && t< p.flipT) return p.setDir; return p.commit; }

function choose(dir){ // 'release' (wide) or 'cut' (inside)
  if(state!=='play'||phase!=='read'||play.choice) return;
  const p=play; p.choice=dir; S.pass();
  const need = p.commit==='stay' ? 'release' : 'cut';   // attack the space DF vacates
  p.result = (dir===need) ? 'goal' : 'lost';
  p.late = t > p.approachT - p.cueLead*0.55;
  phase='exec'; p.t2=0;
}
function applyResult(){
  const p=play;
  if(p.result==='goal'){ goals++; combo++; const clutch=p.late; const gained=(clutch?150:100)+combo*10; score+=gained;
    S.goal(); flash=Math.max(flash,clutch?0.4:0.3);
    pops.push({txt:(p.choice==='release'?'オーバーラップ成功！ゴール +':'カットインで一撃！ +')+gained,x:W/2,y:150,big:true,life:1.15,c:'#8fffb0'});
    if(clutch) pops.push({txt:'ギリギリで見切った！',x:W/2,y:194,big:false,life:1.0,c:'#7fd8ff'});
    for(let i=0;i<20;i++) parts.push({x:450,y:GY,vx:rnd(-7,7),vy:rnd(-6,2),life:1.0,c:'#bfffcf'});
    lvl=Math.min(6, Math.floor(goals/3 + Math.floor(score/800)));
    end(true);
  } else { losses++; combo=0; shakeT=0.28; flash=Math.max(flash,0.3); S.lost();
    const msg = p.choice==null?'遅い…潰された' : (p.commit==='stay'?'内を切られてカット失敗！':'外を消されてパスカット！');
    pops.push({txt:msg,x:W/2,y:155,big:true,life:1.1,c:'#ff6a6a'}); end(false);
  }
}
function end(ok){ phase='resolve'; resT=0; pendDelay=ok?950:1050; pend = losses>=3 ? 'over':'next'; }
function gameOver(){ state='over'; S.over(); if(score>best){ best=score; try{localStorage.setItem('ov_best',best);}catch(e){} } }

// ---------- input ----------
function start(){ ac(); reset(); state='play'; }
function pt(e){ const r=cv.getBoundingClientRect(); return {x:(e.clientX-r.left)/r.width*W, y:(e.clientY-r.top)/r.height*H}; }
cv.addEventListener('pointerdown',e=>{ ac(); if(state!=='play'){ start(); return; }
  if(phase==='read'){ const p=pt(e); choose(p.x> WING.x-40 ? 'release':'cut'); } e.preventDefault(); });
addEventListener('keydown',e=>{ const k=e.key.toLowerCase();
  if(state!=='play'){ if(!e.repeat) start(); return; }
  if(phase==='read'){ if(k==='arrowright'||k==='d') choose('release'); else if(k==='arrowleft'||k==='a') choose('cut');
    if(['arrowleft','arrowright'].includes(e.key.toLowerCase())) e.preventDefault(); } });

// ---------- update ----------
function update(dt){
  if(flash>0) flash=Math.max(0,flash-dt*0.003);
  if(shakeT>0) shakeT-=dt*0.001;
  parts.forEach(q=>{q.x+=q.vx;q.y+=q.vy;q.vy+=0.16;q.life-=dt*0.0022;});
  parts=parts.filter(q=>q.life>0);
  pops.forEach(q=>{q.y-=dt*0.02;q.life-=dt*0.0014;});
  pops=pops.filter(q=>q.life>0);
  if(state!=='play') return;
  const p=play;
  // overlap runner runs up the touchline
  if(phase==='read'||phase==='exec'){ p.run.y=clamp(p.run.y - 0.10*dt, 150, 520); p.run.x=clamp(p.run.x + 0.02*dt, 700, 770); }
  // defender steps to its (shown) commit
  const sc=shownCommit();
  if(phase==='read'){ const tx = sc==='shift'? 690 : (sc==='stay'? 588 : 565); const ty= sc==='shift'?360:392;
    p.def.x += (tx-p.def.x)*0.12; p.def.y += (ty-p.def.y)*0.12;
    if(sc && !p.cued){ p.cued=true; S.chance(); flash=Math.max(flash,0.14); } }

  if(phase==='read'){ t+=dt; if(t>=p.deadline && !p.choice){ p.choice=null; p.result='lost'; phase='exec'; p.t2=0; } }
  else if(phase==='exec'){
    p.t2+=dt; const f=clamp(p.t2/460,0,1);
    if(p.choice==='release'){ // ball to the overlap runner, who drives to byline & crosses
      p.ball.x=WING.x+(p.run.x-WING.x)*Math.min(1,f*1.4); p.ball.y=WING.y+(p.run.y-WING.y)*Math.min(1,f*1.4);
    } else if(p.choice==='cut'){ // winger drives inside toward goal
      p.wx=WING.x+(450-WING.x)*f; p.wy=WING.y+(GY+60-WING.y)*f; p.ball.x=p.wx-8; p.ball.y=p.wy+6;
    }
    if(f>=1 && !p.applied){ p.applied=true; applyResult(); }
  } else if(phase==='resolve'){
    resT+=dt;
    if(resT>=pendDelay && pend){ const pp=pend; pend=null; if(pp==='over') gameOver(); else newPlay(); }
  }
}

// ---------- render ----------
function man(x,y,col,r,ring){ r=r||14; if(ring){ g.strokeStyle=ring; g.lineWidth=3; g.beginPath(); g.arc(x,y-r*0.2,r+5,0,6.28); g.stroke(); }
  g.fillStyle=col; g.beginPath(); g.arc(x,y-r,r*0.7,0,6.28); g.fill();
  g.fillRect(x-r*0.55,y-r*0.6,r*1.1,r*1.35); g.fillStyle='rgba(0,0,0,0.18)'; g.beginPath(); g.ellipse(x,y+r*0.75,r*0.9,r*0.3,0,0,6.28); g.fill(); }
function drawField(){
  const gr=g.createLinearGradient(0,0,0,H); gr.addColorStop(0,'#2c9350'); gr.addColorStop(1,'#1f6f3b'); g.fillStyle=gr; g.fillRect(0,0,W,H);
  g.globalAlpha=0.05; for(let i=0;i<9;i++){ g.fillStyle=i%2?'#fff':'#000'; g.fillRect(0,i*66,W,66); } g.globalAlpha=1;
  g.fillStyle='#14324a'; g.fillRect(0,0,W,60);
  for(const c of crowd){ g.fillStyle=c.c; g.globalAlpha=0.6; g.fillRect(c.x,c.y,3,3); } g.globalAlpha=1;
  g.strokeStyle='#fff'; g.lineWidth=5; g.beginPath(); g.moveTo(360,GY); g.lineTo(540,GY); g.stroke();
  g.strokeStyle='rgba(255,255,255,0.35)'; g.lineWidth=2; g.strokeRect(300,GY,300,160);
  // touchline
  g.strokeStyle='rgba(255,255,255,0.3)'; g.lineWidth=2; g.beginPath(); g.moveTo(792,60); g.lineTo(792,H); g.stroke();
}
function drawScene(){
  const p=play;
  // overlap runner + run arrow
  g.strokeStyle='rgba(143,255,176,0.4)'; g.lineWidth=2; g.setLineDash([6,6]); g.beginPath(); g.moveTo(p.run.x,p.run.y); g.lineTo(p.run.x+8,p.run.y-70); g.stroke(); g.setLineDash([]);
  man(p.run.x,p.run.y,'#3f7bd6',13, phase==='read'?null:null);
  // defender
  man(p.def.x,p.def.y,'#d34e4e',14);
  // winger with ball
  man(p.wx,p.wy,'#2f6fd0',14,'#dfe8ff');
  // ball
  g.fillStyle='#fff'; g.beginPath(); g.arc(p.ball.x,p.ball.y,7,0,6.28); g.fill();
  // cue / prompt
  if(phase==='read'){
    const sc=shownCommit(); g.textAlign='center';
    if(sc){ const lab= sc==='stay'?'DFは内を切った！（外が空く）':'DFが外へ！（中が空く）'; const col=sc==='stay'?'#ffd84a':'#7fd8ff';
      g.fillStyle=col; g.font='bold 21px sans-serif'; g.fillText(lab,W/2,86);
      g.fillStyle=col; g.font='bold 20px sans-serif'; g.fillText(sc==='stay'?'▶':'◀', p.def.x, p.def.y-30); }
    else { g.fillStyle='rgba(255,255,255,0.7)'; g.font='bold 20px sans-serif'; g.fillText('DFの動きを読め…',W/2,86); }
    g.fillStyle='rgba(255,255,255,0.5)'; g.font='bold 14px sans-serif'; g.fillText('← カットイン（中）    リリース（外）→',W/2,H-40);
  }
}
function drawHUD(){
  g.textAlign='left'; g.fillStyle='#fff'; g.font='bold 25px sans-serif'; g.fillText('SCORE '+score,20,40);
  if(combo>1){ g.fillStyle='#ffd84a'; g.font='bold 16px sans-serif'; g.fillText(combo+' 連続突破',20,62); }
  g.textAlign='right'; g.fillStyle='rgba(255,255,255,0.8)'; g.font='14px sans-serif'; g.fillText('ゴール '+goals+'  Lv.'+(lvl+1),W-20,38);
  g.fillStyle='#ff6a6a'; g.textAlign='right'; g.font='bold 14px sans-serif'; g.fillText('ロスト',W-96,62);
  for(let i=0;i<3;i++){ g.fillStyle=i<losses?'#ff5a5a':'rgba(255,255,255,0.24)'; g.beginPath(); g.arc(W-74+i*22,57,8,0,6.28); g.fill(); }
}
function drawTitle(){
  g.fillStyle='rgba(0,0,0,0.5)'; g.fillRect(0,0,W,H);
  g.textAlign='center'; g.fillStyle='#8fffb0'; g.font='bold 56px sans-serif'; g.fillText('オーバーラップ',W/2,158);
  g.fillStyle='#fff'; g.font='bold 22px sans-serif'; g.fillText('Overlap — DFの空けた側を突け',W/2,196);
  g.fillStyle='#cfe'; g.font='18px sans-serif';
  g.fillText('サイドで1対1。味方が外を追い越す（オーバーラップ）中、',W/2,250);
  g.fillText('DFが内を切ればリリース（→）で外の味方へ、外へつけばカットイン（←）。',W/2,278);
  g.fillText('DFが空けた側を突けば決定機。逆に出すと潰される。',W/2,306);
  g.fillText('上級のDFは動きにフェイントも。ギリギリの見切りは加点。3ロストで終了。',W/2,334);
  g.fillStyle='#ffd84a'; g.font='bold 22px sans-serif'; g.fillText('クリック / タップ / キー でスタート',W/2,402);
}
function drawOver(){
  g.fillStyle='rgba(0,0,0,0.62)'; g.fillRect(0,0,W,H);
  g.textAlign='center'; g.fillStyle='#ff6a6a'; g.font='bold 54px sans-serif'; g.fillText('3ロスト…終了',W/2,H/2-54);
  g.fillStyle='#fff'; g.font='bold 34px sans-serif'; g.fillText('SCORE '+score,W/2,H/2+2);
  g.fillStyle='#cfe'; g.font='20px sans-serif'; g.fillText('ゴール '+goals+'　BEST '+best,W/2,H/2+40);
  g.fillStyle='#8fffb0'; g.font='bold 22px sans-serif'; g.fillText('クリック / タップ で もう一度',W/2,H/2+96);
}
function render(){
  g.setTransform(DPR,0,0,DPR,0,0);
  let sx=0,sy=0; if(shakeT>0){ sx=rnd(-6,6)*shakeT*3; sy=rnd(-6,6)*shakeT*3; g.translate(sx,sy); }
  drawField();
  if(state==='play'||state==='over') drawScene();
  parts.forEach(q=>{ g.globalAlpha=clamp(q.life,0,1); g.fillStyle=q.c; g.beginPath(); g.arc(q.x,q.y,3,0,6.28); g.fill(); }); g.globalAlpha=1;
  pops.forEach(q=>{ g.globalAlpha=clamp(q.life,0,1); g.textAlign='center'; g.fillStyle=q.c; g.font='bold '+(q.big?30:20)+'px sans-serif';
    const px=(q.x==null)?W/2:q.x; g.fillText(q.txt,px,q.y); }); g.globalAlpha=1;
  if(state==='play') drawHUD();
  if(flash>0){ g.fillStyle='rgba(255,255,255,'+(flash*0.6)+')'; g.fillRect(0,0,W,H); }
  if(state==='title') drawTitle();
  if(state==='over') drawOver();
  g.setTransform(DPR,0,0,DPR,0,0);
}

let last=0;
function frame(ts){ let dt=ts-last; last=ts; if(dt>60)dt=60; if(dt<0)dt=0; update(dt); render(); requestAnimationFrame(frame); }
requestAnimationFrame(frame);

// ---------- test hook ----------
window.__ov={
  start, release:()=>choose('release'), cut:()=>choose('cut'),
  get state(){return state;}, get score(){return score;}, get losses(){return losses;}, get goals(){return goals;},
  get info(){ if(state!=='play') return {state,phase:'-'}; const p=play; return {
    state, phase, t, approachT:p&&p.approachT, cue:shownCommit(), commit:p&&p.commit, chosen:p&&p.choice, res:p&&p.result, losses, goals }; }
};
})();
</script>
</body>
</html>
