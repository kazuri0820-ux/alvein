<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>トリヴェラ (Trivela)</title>
<style>
  html,body{margin:0;height:100%;background:#07120b;overflow:hidden;
    font-family:-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  #stage{position:relative;width:100vw;height:100vh;max-width:calc(100vh*1.5);max-height:calc(100vw/1.5);aspect-ratio:900/600;}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;border-radius:6px;}
</style>
</head>
<body>
<div id="wrap"><div id="stage"><canvas id="cv"></canvas></div></div>
<script>
(function(){
const W=900,H=600,cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let DPR=1;
function fit(){DPR=Math.min(2,window.devicePixelRatio||1);cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
fit();addEventListener('resize',fit);

// ---------- audio ----------
let AC=null;function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function tone(f,d,type,v,sweep){const a=ac();if(!a)return;const t=a.currentTime,o=a.createOscillator(),g=a.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(sweep)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+sweep),t+d);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v||0.2,t+0.008);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+0.02);}
function noise(d,v,hp){const a=ac();if(!a)return;const t=a.currentTime,n=Math.floor(a.sampleRate*d),buf=a.createBuffer(1,n,a.sampleRate),ch=buf.getChannelData(0);
  for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource();s.buffer=buf;
  const f=a.createBiquadFilter();f.type='highpass';f.frequency.value=hp||600;const g=a.createGain();g.gain.value=v||0.2;
  s.connect(f);f.connect(g);g.connect(a.destination);s.start(t);s.stop(t+d+0.02);}
const S={
  wind:()=>{tone(320,0.05,'sine',0.03);},
  strike:()=>{noise(0.05,0.18,500);tone(260,0.06,'square',0.08,-40);},
  goal:()=>{[620,860,1120].forEach((f,i)=>setTimeout(()=>tone(f,0.11,'triangle',0.16),i*60));},
  big:()=>{[600,800,1000,1250].forEach((f,i)=>setTimeout(()=>tone(f,0.12,'triangle',0.17),i*80));},
  block:()=>{noise(0.1,0.2,400);tone(180,0.14,'square',0.09,-40);},
  wide:()=>{noise(0.16,0.16,700);tone(300,0.14,'sine',0.06,-140);},
  streak:()=>{[700,930,1170,1400].forEach((f,i)=>setTimeout(()=>tone(f,0.1,'triangle',0.16),i*60));},
  over:()=>{[440,330,247,175].forEach((f,i)=>setTimeout(()=>tone(f,0.3,'triangle',0.2),i*160));}
};

// ---------- geometry ----------
const GOAL={lx:250,rx:650,top:96,mouth:154};
const BALL0={x:322,y:498};
const FARC={x:604,y:150};          // far (right) corner target
const MX=772, MTOP=126, MBOT=474, MW=64;   // curl/power meter
function my(p){return MBOT-(MBOT-MTOP)*p;}

// ---------- state ----------
let state='title', phase='wind', plays=0;
let score=0, combo=0, best=+(localStorage.getItem('tv_best')||0);
let outs=0, fails=0, lvl=1;   // outs = goals
let clock=0, riseDur=1300, p=0, bandCenter=0.58, bandHalf=0.085, tough=false;
let defX=486, defY=306;
let struck=false, pStop=0, result=null, resultT=0, msg='', msgOk=false, flyT=0;
let shake=0, flash=0, flashCol='#fff', last=performance.now();
let parts=[], pops=[];

function rnd(a,b){return a+Math.random()*(b-a);}
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function lerp(a,b,u){return a+(b-a)*u;}
function easeOut(u){return 1-Math.pow(1-u,2);}

function reset(){state='title';score=0;combo=0;outs=0;fails=0;lvl=1;plays=0;result=null;parts=[];pops=[];}

function newPlay(){
  plays++; lvl=Math.min(7,1+Math.floor(outs/4));
  riseDur=clamp(1360-lvl*84,820,1360);
  bandHalf=clamp(0.09-lvl*0.005,0.055,0.09);
  tough=Math.random()<clamp(0.2+lvl*0.05,0.2,0.5);
  if(tough)bandHalf*=0.8;
  bandCenter=rnd(0.46,0.72);
  // defender sits on the direct line; higher required curl when defender is nearer the goal
  defX=lerp(452,516,(bandCenter-0.46)/0.26); defY=rnd(288,322);
  phase='wind'; clock=0; p=0; struck=false; pStop=0; result=null; resultT=0; msg=''; msgOk=false; flyT=0;
  S.wind();
}
function start(){ if(!ac())ac(); if(AC&&AC.state==='suspended')AC.resume(); reset(); state='play'; newPlay(); }

function strike(){
  if(state==='title'){start();return;}
  if(state==='over'){ if(resultT>0.4){reset();start();} return; }
  if(state!=='play'||phase!=='wind'||struck) return;
  struck=true; pStop=p;
  if(Math.abs(p-bandCenter)<=bandHalf){ resolve('goal'); }
  else if(p<bandCenter-bandHalf) resolve('under');
  else resolve('over');
}

function resolve(k){
  phase='result'; result=k; resultT=0; flyT=0;
  if(k==='goal'){
    outs++; combo++;
    const q=1-Math.abs(pStop-bandCenter)/bandHalf; const perfect=q>=0.8;
    let add=Math.round((tough?250:150)*(1+Math.min(9,combo-1)*0.14)); score+=add;
    S.strike(); setTimeout(S.goal,300); if(tough)setTimeout(S.big,380);
    msgOk=true; flash=1;flashCol='#8affa0';shake=5;
    pop(W/2,250,(perfect?'ワールドクラスの巻き！ +':'ゴラッソ！ +')+add,'#d6ffe0');
    if(combo>=2)pop(W/2,150,'コンボ x'+combo,'#ffd24d');
    if(combo>0&&combo%5===0)S.streak();
    msg='アウトサイドで巻いてDFの外から遠い隅へ——完璧なトリヴェラ';
  } else {
    fails++; combo=0; msgOk=false; flash=1;shake=8;
    if(k==='under'){ flashCol='#ff5b5b'; S.block(); msg='巻きが足りない…直線的な弾道がDFに当たってブロック'; pop(W/2,250,'ブロック…','#ffb0b0'); }
    else { flashCol='#ff8b3b'; S.wide(); msg='巻きすぎ…曲がりすぎて遠いポストの外へ外れた'; pop(W/2,250,'枠の外…','#ffcf9a'); }
  }
  if(fails>=3){ state='over'; resultT=0; S.over(); if(score>best){best=score;localStorage.setItem('tv_best',best);} }
}

// ---------- input ----------
cv.addEventListener('pointerdown',e=>{e.preventDefault();strike();});
addEventListener('keydown',e=>{ if(e.repeat)return;
  if(e.code==='Space'||e.code==='Enter'||e.code==='ArrowUp'||e.code==='KeyF'||e.code==='KeyJ'){e.preventDefault();strike();} });

// ---------- particles ----------
function burst(x,y,c,n,sp){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=rnd(sp*0.3,sp);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:1,c});}}
function pop(x,y,txt,c){pops.push({x,y,txt,c,life:1});}

// ---------- ball path (quadratic bezier), curl set by outcome ----------
function ctrlFor(k){
  // control point governs the bend; good = curl around defender to far corner
  if(k==='goal') return {cx:defX+150, cy:defY-40, ex:FARC.x, ey:FARC.y};
  if(k==='under') return {cx:defX+40, cy:defY-30, ex:defX+6, ey:defY+2};       // straight-ish into defender
  return {cx:defX+250, cy:defY-70, ex:GOAL.rx+40, ey:GOAL.top+10};              // over-curled, wide of far post
}
function bez(u,c){ const mx=lerp(lerp(BALL0.x,c.cx,u),lerp(c.cx,c.ex,u),u);
  const my2=lerp(lerp(BALL0.y,c.cy,u),lerp(c.cy,c.ey,u),u); return {x:mx,y:my2}; }

// ---------- update ----------
function update(dt){
  shake*=Math.pow(0.86,dt/16.7); if(shake<0.3)shake=0;
  flash*=Math.pow(0.9,dt/16.7);
  for(const q of parts){q.vx*=0.96;q.vy=q.vy*0.96+0.28;q.x+=q.vx*dt/16.7;q.y+=q.vy*dt/16.7;q.life-=dt/16.7*0.026;}
  parts=parts.filter(q=>q.life>0);
  for(const q of pops){q.y-=dt/16.7*0.5;q.life-=dt/16.7*0.02;}
  pops=pops.filter(q=>q.life>0);

  if(state!=='play'){ if(state==='over')resultT+=dt/1000; return; }
  if(phase==='wind'){ clock+=dt; p=clamp(clock/riseDur,0,1);
    if(!struck && p>=1){ struck=true; pStop=1; resolve('over'); }
    return; }
  if(phase==='result'){ resultT+=dt/1000; flyT=Math.min(1,flyT+dt/560);
    if(flyT>=1&&result==='goal'&&parts.length<2)burst(FARC.x,FARC.y,'#8affa0',14,6);
    if(resultT>1.6) newPlay(); return; }
}

// ---------- render ----------
function drawField(){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#12703f');g.addColorStop(0.5,'#0f5e34');g.addColorStop(1,'#0c4c2b');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  for(let i=0;i<8;i++){ctx.fillStyle=i%2?'rgba(255,255,255,0.03)':'rgba(0,0,0,0.03)';ctx.fillRect(0,i*80,W,80);}
  ctx.strokeStyle='rgba(255,255,255,0.24)';ctx.lineWidth=2;ctx.strokeRect(180,GOAL.mouth,540,250);
}
function drawGoal(){
  ctx.fillStyle='rgba(255,255,255,0.06)';ctx.fillRect(GOAL.lx,GOAL.top,GOAL.rx-GOAL.lx,GOAL.mouth-GOAL.top);
  ctx.strokeStyle='rgba(255,255,255,0.22)';ctx.lineWidth=1;
  for(let x=GOAL.lx+10;x<GOAL.rx;x+=14){ctx.beginPath();ctx.moveTo(x,GOAL.top);ctx.lineTo(x,GOAL.mouth);ctx.stroke();}
  for(let y=GOAL.top+8;y<GOAL.mouth;y+=12){ctx.beginPath();ctx.moveTo(GOAL.lx,y);ctx.lineTo(GOAL.rx,y);ctx.stroke();}
  ctx.strokeStyle='#f4f4f4';ctx.lineWidth=5;
  ctx.beginPath();ctx.moveTo(GOAL.lx,GOAL.mouth);ctx.lineTo(GOAL.lx,GOAL.top);ctx.lineTo(GOAL.rx,GOAL.top);ctx.lineTo(GOAL.rx,GOAL.mouth);ctx.stroke();
}

function render(){
  ctx.save();
  if(shake>0)ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
  drawField();
  drawGoal();

  if(state==='play'||state==='over'){
    // target far corner marker
    ctx.strokeStyle='rgba(140,255,170,0.7)';ctx.lineWidth=3;ctx.setLineDash([5,5]);
    ctx.strokeRect(FARC.x-24,GOAL.top+4,26,44);ctx.setLineDash([]);
    // GK covering near side
    ctx.fillStyle='#ffd23e';ctx.beginPath();ctx.ellipse(360,132,11,17,0,0,6.28);ctx.fill();
    ctx.fillStyle='#f0c9a0';ctx.beginPath();ctx.arc(360,110,7.5,0,6.28);ctx.fill();
    // defender blocking the direct line
    ctx.fillStyle='#d0403a';ctx.beginPath();ctx.ellipse(defX,defY,12,18,0,0,6.28);ctx.fill();
    ctx.fillStyle='#f0c9a0';ctx.beginPath();ctx.arc(defX,defY-24,8,0,6.28);ctx.fill();
    // shooter
    ctx.fillStyle='#2b6fd6';ctx.beginPath();ctx.ellipse(BALL0.x-16,BALL0.y-6,12,18,0,0,6.28);ctx.fill();
    ctx.fillStyle='#f0c9a0';ctx.beginPath();ctx.arc(BALL0.x-16,BALL0.y-30,8,0,6.28);ctx.fill();

    // ball / flight
    if(phase==='result'){
      const c=ctrlFor(result), u=easeOut(flyT);
      // draw trail
      ctx.strokeStyle=result==='goal'?'rgba(150,255,180,0.5)':'rgba(255,255,255,0.35)';ctx.lineWidth=2;
      ctx.beginPath();for(let t=0;t<=u+0.001;t+=0.04){const q=bez(Math.min(t,u),c);if(t===0)ctx.moveTo(q.x,q.y);else ctx.lineTo(q.x,q.y);}ctx.stroke();
      const b=bez(u,c);
      ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(b.x,b.y,7.5,0,6.28);ctx.fill();
      ctx.strokeStyle='#222';ctx.lineWidth=1.2;ctx.beginPath();ctx.arc(b.x,b.y,7.5,0.4,2.2);ctx.stroke();
    } else {
      ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(BALL0.x,BALL0.y,8,0,6.28);ctx.fill();
      ctx.strokeStyle='#222';ctx.lineWidth=1.2;
      ctx.beginPath();ctx.moveTo(BALL0.x-6,BALL0.y-4);ctx.lineTo(BALL0.x+2,BALL0.y-9);ctx.lineTo(BALL0.x+7,BALL0.y-2);ctx.lineTo(BALL0.x+3,BALL0.y+6);ctx.lineTo(BALL0.x-6,BALL0.y+5);ctx.closePath();ctx.stroke();
    }

    // CURL / POWER METER (vertical)
    ctx.fillStyle='rgba(0,0,0,0.35)';rr(MX,MTOP,MW,MBOT-MTOP,10);ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,0.4)';ctx.lineWidth=2;rr(MX,MTOP,MW,MBOT-MTOP,10);ctx.stroke();
    // green target band
    const y0=my(bandCenter+bandHalf), y1=my(bandCenter-bandHalf);
    ctx.fillStyle='rgba(90,240,130,0.42)';ctx.fillRect(MX+3,y0,MW-6,y1-y0);
    ctx.strokeStyle='#7dff9a';ctx.lineWidth=2;ctx.strokeRect(MX+3,y0,MW-6,y1-y0);
    ctx.fillStyle='#d6ffe0';ctx.font='bold 11px sans-serif';ctx.textAlign='right';ctx.fillText('理想の巻き',MX-6,(y0+y1)/2+4);
    ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='11px sans-serif';ctx.textAlign='center';
    ctx.fillText('巻き強',MX+MW/2,MTOP-6);ctx.fillText('直線',MX+MW/2,MBOT+16);
    // fill up to current
    const fy=my(phase==='wind'?p:pStop);
    ctx.fillStyle= phase==='result'? (result==='goal'?'rgba(140,255,170,0.5)':'rgba(255,120,110,0.45)'):'rgba(255,225,80,0.4)';
    ctx.fillRect(MX+3,fy,MW-6,MBOT-fy);
    const ny=fy;
    ctx.fillStyle= phase==='result'? (result==='goal'?'#8affa0':'#ff6b6b'):'#ffe14d';
    ctx.fillRect(MX-8,ny-2,MW+16,4);
    ctx.beginPath();ctx.moveTo(MX-8,ny-7);ctx.lineTo(MX-18,ny);ctx.lineTo(MX-8,ny+7);ctx.fill();

    // cue
    ctx.textAlign='center';
    if(state==='play'&&phase==='wind'){
      ctx.fillStyle='rgba(255,220,90,0.96)';ctx.font='bold 21px sans-serif';ctx.fillText('アウトサイドで巻け！ “理想の巻き”でシュート',W/2,50);
      ctx.fillStyle='rgba(255,255,255,0.78)';ctx.font='14px sans-serif';ctx.fillText('巻きゲージが緑の帯に来た瞬間にタップ／SPACE＝DFの外から遠い隅へ',W/2,H-32);
    }
  }

  for(const q of parts){ctx.globalAlpha=Math.max(0,q.life);ctx.fillStyle=q.c;ctx.beginPath();ctx.arc(q.x,q.y,3.2,0,6.28);ctx.fill();}
  ctx.globalAlpha=1;
  for(const q of pops){ctx.globalAlpha=Math.max(0,q.life);ctx.fillStyle=q.c;ctx.font='bold 21px sans-serif';ctx.textAlign='center';ctx.fillText(q.txt,q.x,q.y);}
  ctx.globalAlpha=1;

  // HUD
  ctx.textAlign='left';ctx.fillStyle='#fff';ctx.font='bold 26px sans-serif';ctx.fillText('SCORE '+score,20,36);
  ctx.textAlign='right';ctx.fillStyle='rgba(255,255,255,0.9)';ctx.font='14px sans-serif';ctx.fillText('ゴール '+outs+'  Lv'+lvl,W-20,24);
  ctx.fillText('失敗',W-92,46);
  for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(W-60+i*20,41,7,0,6.28);ctx.fillStyle=i<fails?'#ff5b5b':'rgba(255,255,255,0.25)';ctx.fill();}
  if(combo>=2){ctx.textAlign='center';ctx.fillStyle='#ffd24d';ctx.font='bold 18px sans-serif';ctx.fillText('コンボ x'+combo,W/2,110);}

  if(state==='play'&&phase==='result'&&msg){ctx.textAlign='center';ctx.fillStyle=msgOk?'#9ff0b8':'#ffb38a';ctx.font='bold 16px sans-serif';ctx.fillText(msg,W/2,470);}

  if(state==='title'){
    ctx.fillStyle='rgba(4,10,7,0.83)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='bold 42px sans-serif';ctx.fillText('トリヴェラ',W/2,86);
    ctx.fillStyle='#ffd23e';ctx.font='bold 22px sans-serif';ctx.fillText('Trivela',W/2,122);
    ctx.fillStyle='rgba(255,255,255,0.92)';ctx.font='16px sans-serif';
    ctx.fillText('アウトサイド（足の外側）で巻いて、直線を塞ぐDFの外から回し込み、遠い隅へ沈める曲球シュート',W/2,182);
    ctx.fillStyle='rgba(255,255,255,0.66)';ctx.font='14px sans-serif';
    ctx.fillText('右の“巻きゲージ”が上がっていく→緑の「理想の巻き」帯に来た瞬間にタップ／SPACEでシュート',W/2,220);
    ctx.fillText('巻きが足りない（帯より下）＝直線的でDFにブロック／巻きすぎ（帯より上）＝曲がりすぎて枠外',W/2,244);
    ctx.fillText('緑ど真ん中の“会心の巻き”は大量加点。DFの位置で必要な巻き量が変わる。上級ほどゲージが速く帯が狭い',W/2,268);
    ctx.fillText('3失敗で交代',W/2,292);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で開始',W/2,360);
    ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='14px sans-serif';ctx.fillText('BEST '+best,W/2,392);
  }
  if(state==='over'){
    ctx.fillStyle='rgba(4,10,7,0.85)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#ff6b6b';ctx.font='bold 46px sans-serif';ctx.fillText('3失敗…交代',W/2,222);
    ctx.fillStyle='#fff';ctx.font='bold 40px sans-serif';ctx.fillText('SCORE '+score,W/2,290);
    ctx.fillStyle='rgba(255,255,255,0.85)';ctx.font='19px sans-serif';ctx.fillText('ゴール '+outs+'   BEST '+best,W/2,330);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で もう一度',W/2,402);
  }

  if(flash>0.02){ctx.globalAlpha=flash*0.5;ctx.fillStyle=flashCol;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}
  ctx.restore();

  ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,0.4)';ctx.font='12px sans-serif';
  ctx.fillText('トリヴェラ：上がる巻きゲージを“理想の巻き”の緑帯で止めてアウトサイドで曲げDFの外から隅へ。巻き不足=ブロック/巻きすぎ=枠外、3失敗で交代',W/2,H-8);
}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

function frame(ts){let dt=ts-last;last=ts;if(dt>60)dt=60;if(dt<0)dt=0;update(dt);render();requestAnimationFrame(frame);}
requestAnimationFrame(frame);

// ---------- test hook ----------
window.__tv={
  start, strike,
  get state(){return state;},
  get score(){return score;},
  get outs(){return outs;},
  get fails(){return fails;},
  get info(){return {state,phase,clock,riseDur,p,bandCenter,bandHalf,bandLo:bandCenter-bandHalf,bandHi:bandCenter+bandHalf,tough,struck,pStop,result,outs,fails,lvl,
    inBand:(phase==='wind'&&Math.abs(p-bandCenter)<=bandHalf)};}
};
})();
</script>
</body>
</html>
