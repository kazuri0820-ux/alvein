<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>トラップを狩れ (Nick It)</title>
<style>
  html,body{margin:0;height:100%;background:#07120b;overflow:hidden;
    font-family:-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  #stage{position:relative;width:100vw;height:100vh;max-width:calc(100vh*1.5);max-height:calc(100vw/1.5);aspect-ratio:900/600;}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;border-radius:6px;}
</style>
</head>
<body>
<div id="wrap"><div id="stage"><canvas id="cv"></canvas></div></div>
<script>
(function(){
const W=900,H=600,cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let DPR=1;
function fit(){DPR=Math.min(2,window.devicePixelRatio||1);cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
fit();addEventListener('resize',fit);

// ---------- audio ----------
let AC=null;function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function tone(f,d,type,v,sweep){const a=ac();if(!a)return;const t=a.currentTime,o=a.createOscillator(),g=a.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(sweep)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+sweep),t+d);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v||0.2,t+0.008);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+0.02);}
function noise(d,v,hp){const a=ac();if(!a)return;const t=a.currentTime,n=Math.floor(a.sampleRate*d),buf=a.createBuffer(1,n,a.sampleRate),ch=buf.getChannelData(0);
  for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource();s.buffer=buf;
  const f=a.createBiquadFilter();f.type='highpass';f.frequency.value=hp||600;const g=a.createGain();g.gain.value=v||0.2;
  s.connect(f);f.connect(g);g.connect(a.destination);s.start(t);s.stop(t+d+0.02);}
const S={
  pass:()=>{tone(240,0.05,'sine',0.03);},
  nick:()=>{noise(0.05,0.16,600);tone(320,0.05,'square',0.09,120);},
  win:()=>{[620,880,1150].forEach((f,i)=>setTimeout(()=>tone(f,0.12,'triangle',0.17),i*58));},
  big:()=>{[600,800,1000,1250].forEach((f,i)=>setTimeout(()=>tone(f,0.12,'triangle',0.17),i*80));},
  lost:()=>{noise(0.16,0.18,300);tone(170,0.18,'sawtooth',0.12,-40);},
  streak:()=>{[700,930,1170,1400].forEach((f,i)=>setTimeout(()=>tone(f,0.1,'triangle',0.16),i*60));},
  over:()=>{[440,330,247,175].forEach((f,i)=>setTimeout(()=>tone(f,0.3,'triangle',0.2),i*160));}
};

// ---------- geometry ----------
const START={x:452,y:66}, FEET={x:452,y:262}, DEF={x:452,y:344};

// ---------- state ----------
let state='title', phase='in', plays=0;
let score=0, combo=0, best=+(localStorage.getItem('ni_best')||0);
let outs=0, fails=0, lvl=1;   // outs = clean steals
let clock=0, arriveT=880, w=140, tough=false;
let acted=false, actT=0, result=null, resultT=0, msg='', msgOk=false, quality=0, gone=0;
let shake=0, flash=0, flashCol='#fff', last=performance.now();
let parts=[], pops=[];

function rnd(a,b){return a+Math.random()*(b-a);}
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function lerp(a,b,u){return a+(b-a)*u;}
function easeOut(u){return 1-Math.pow(1-u,2);}

function reset(){state='title';score=0;combo=0;outs=0;fails=0;lvl=1;plays=0;result=null;parts=[];pops=[];}

function newPlay(){
  plays++; lvl=Math.min(7,1+Math.floor(outs/4));
  arriveT=clamp(900-lvl*52,560,900);
  w=clamp(148-lvl*10,86,148);
  tough=Math.random()<clamp(0.2+lvl*0.05,0.2,0.5);
  if(tough)w*=0.8;
  phase='in'; clock=0; acted=false; actT=0; result=null; resultT=0; msg=''; msgOk=false; quality=0; gone=0;
  S.pass();
}
function start(){ if(!ac())ac(); if(AC&&AC.state==='suspended')AC.resume(); reset(); state='play'; newPlay(); }

function nick(){
  if(state==='title'){start();return;}
  if(state==='over'){ if(resultT>0.4){reset();start();} return; }
  if(state!=='play'||phase!=='in'||acted) return;
  acted=true; actT=clock; S.nick();
  if(clock<arriveT-w){ resolve('early'); }
  else if(clock<=arriveT+w){ quality=1-Math.abs(clock-arriveT)/w; resolve('steal'); }
  else resolve('late');
}

function resolve(k){
  phase='result'; result=k; resultT=0; gone=0;
  if(k==='steal'){
    outs++; combo++;
    const perfect=quality>=0.8;
    let add=Math.round((tough?250:150)*(1+Math.min(9,combo-1)*0.14)); score+=add;
    setTimeout(S.win,120); if(perfect||tough)setTimeout(S.big,240);
    msgOk=true; flash=1;flashCol='#8affa0';shake=6; burst(FEET.x,FEET.y,'#8affa0',16,7);
    pop(W/2,320,(perfect?'足元へ入ってクリーンに強奪！ +':'トラップの前に足を出して奪取！ +')+add,'#d6ffe0');
    if(combo>=2)pop(W/2,286,'コンボ x'+combo,'#ffd24d');
    if(combo>0&&combo%5===0)S.streak();
    msg='収まる直前に足を差し込んでボールをかっさらう——鮮やかなインターセプト！';
  } else {
    fails++; combo=0; msgOk=false; flash=1;shake=8; S.lost();
    if(k==='early'){ flashCol='#ff5b5b'; msg='早い…ボールが来る前に足を出して空を切り、そのまま収められた'; pop(W/2,320,'空振り…','#ffb0b0'); }
    else if(k==='late'){ flashCol='#ff8b3b'; msg='遅い…先にトラップされ、前を向かれて運ばれた'; pop(W/2,320,'収められた…','#ffcf9a'); }
    else { flashCol='#ff5b5b'; msg='見送り…足を出せず、相手にトラップされてキープされた'; pop(W/2,320,'キープされた…','#ffb0b0'); }
  }
  if(fails>=3){ state='over'; resultT=0; S.over(); if(score>best){best=score;localStorage.setItem('ni_best',best);} }
}

// ---------- input ----------
cv.addEventListener('pointerdown',e=>{e.preventDefault();nick();});
addEventListener('keydown',e=>{ if(e.repeat)return;
  if(e.code==='Space'||e.code==='Enter'||e.code==='ArrowUp'||e.code==='KeyF'||e.code==='KeyJ'){e.preventDefault();nick();} });

// ---------- particles ----------
function burst(x,y,c,n,sp){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=rnd(sp*0.3,sp);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:1,c});}}
function pop(x,y,txt,c){pops.push({x,y,txt,c,life:1});}

// pass rolls from START toward the receiver's feet
function ballPos(){
  const u=clock/arriveT;
  const e=0.14*clamp(u,0,1)+0.86*easeOut(clamp(u,0,1));
  return {x:lerp(START.x,FEET.x,e), y:lerp(START.y,FEET.y,e), u};
}

// ---------- update ----------
function update(dt){
  shake*=Math.pow(0.86,dt/16.7); if(shake<0.3)shake=0;
  flash*=Math.pow(0.9,dt/16.7);
  for(const q of parts){q.vx*=0.96;q.vy=q.vy*0.96+0.28;q.x+=q.vx*dt/16.7;q.y+=q.vy*dt/16.7;q.life-=dt/16.7*0.026;}
  parts=parts.filter(q=>q.life>0);
  for(const q of pops){q.y-=dt/16.7*0.5;q.life-=dt/16.7*0.02;}
  pops=pops.filter(q=>q.life>0);

  if(state!=='play'){ if(state==='over')resultT+=dt/1000; return; }
  if(phase==='in'){ clock+=dt;
    if(!acted && clock>arriveT+w*2){ acted=true; actT=clock; resolve('miss'); }
    return; }
  if(phase==='result'){ resultT+=dt/1000; gone=Math.min(1,gone+dt/460);
    if(resultT>1.5) newPlay(); return; }
}

// ---------- render ----------
function drawField(){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#12703f');g.addColorStop(0.5,'#0f5e34');g.addColorStop(1,'#0c4c2b');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  for(let i=0;i<8;i++){ctx.fillStyle=i%2?'rgba(255,255,255,0.03)':'rgba(0,0,0,0.03)';ctx.fillRect(0,i*80,W,80);}
  ctx.strokeStyle='rgba(255,255,255,0.16)';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(120,GYline());ctx.lineTo(W-120,GYline());ctx.stroke();
}
function GYline(){return 200;}
function person(x,y,col,s,lean,back){s=s||1;lean=lean||0;
  ctx.save();ctx.translate(x,y);ctx.rotate(lean);
  ctx.fillStyle=col;ctx.beginPath();ctx.ellipse(0,-15*s,10*s,15*s,0,0,6.28);ctx.fill();
  ctx.fillStyle=back?'#7a5030':'#f0c9a0';ctx.beginPath();ctx.arc(0,-34*s,7.5*s,0,6.28);ctx.fill();
  ctx.restore();
}

function render(){
  ctx.save();
  if(shake>0)ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
  drawField();

  if(state==='play'||state==='over'){
    // receiving opponent (back to you) — turns away with the ball if he controls it
    let ox=FEET.x, oy=FEET.y-24, olean=0;
    if(phase==='result'&&(result==='late'||result==='miss')){ const u=easeOut(gone); ox=lerp(FEET.x,FEET.x-40,u); oy=lerp(FEET.y-24,FEET.y-70,u); olean=-0.3*u; }
    person(ox,oy,'#d0403a',0.98,olean,true);

    // you (defender), steps across / pokes on a steal
    const poking=(phase==='result'&&result==='steal');
    let dx=DEF.x, dy=DEF.y;
    if(poking){ const u=easeOut(gone); dx=lerp(DEF.x,FEET.x-6,u*0.7); dy=lerp(DEF.y,FEET.y+14,u*0.7); }
    person(dx,dy,'#2b6fd6',1.0, poking?-0.4:0);

    // the ball
    let bx,by;
    if(phase==='in'){ const p=ballPos(); bx=p.x; by=p.y; }
    else {
      if(result==='steal'){ const u=easeOut(gone); bx=lerp(FEET.x,DEF.x-34,u); by=lerp(FEET.y,DEF.y+2,u); }   // poked out to you
      else { const u=easeOut(gone); bx=lerp(FEET.x,FEET.x-46,u); by=lerp(FEET.y,FEET.y-58,u); }               // receiver carries it off
    }
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(bx,by,7.5,0,6.28);ctx.fill();
    ctx.strokeStyle='#222';ctx.lineWidth=1.1;ctx.beginPath();ctx.arc(bx,by,7.5,0.4,2.2);ctx.stroke();

    // timing ring at the receiver's feet
    if(state==='play'&&phase==='in'){
      const inw=Math.abs(clock-arriveT)<=w;
      ctx.strokeStyle=inw?'rgba(140,255,160,0.95)':'rgba(255,220,90,0.7)';ctx.lineWidth=4;
      const rem=clamp(1-clock/arriveT,0,1);
      ctx.beginPath();ctx.arc(FEET.x,FEET.y,14+rem*54,0,6.28);ctx.stroke();
    }

    // cue banner + timing bar
    ctx.textAlign='center';
    if(state==='play'&&phase==='in'){
      ctx.fillStyle='rgba(255,220,90,0.96)';ctx.font='bold 20px sans-serif';ctx.fillText('縦パスが敵の足元へ！ 収まる前に足を出して奪え',W/2,42);
      const bw=280,x=W/2-bw/2,y=56, span=arriveT+w*2.2;
      ctx.fillStyle='rgba(255,255,255,0.16)';ctx.fillRect(x,y,bw,9);
      const gx0=x+bw*clamp((arriveT-w)/span,0,1), gx1=x+bw*clamp((arriveT+w)/span,0,1);
      ctx.fillStyle='rgba(90,240,130,0.5)';ctx.fillRect(gx0,y,gx1-gx0,9);
      const px=x+bw*clamp(clock/span,0,1);
      ctx.fillStyle='#ffe14d';ctx.fillRect(px-2,y-3,4,15);
      ctx.fillStyle='rgba(255,255,255,0.55)';ctx.font='12px sans-serif';ctx.fillText('タップ / SPACE ＝ 足を差し込んで奪取（早いと空振り・遅いと収められる）',W/2,H-28);
    }
  }

  for(const q of parts){ctx.globalAlpha=Math.max(0,q.life);ctx.fillStyle=q.c;ctx.beginPath();ctx.arc(q.x,q.y,3.2,0,6.28);ctx.fill();}
  ctx.globalAlpha=1;
  for(const q of pops){ctx.globalAlpha=Math.max(0,q.life);ctx.fillStyle=q.c;ctx.font='bold 21px sans-serif';ctx.textAlign='center';ctx.fillText(q.txt,q.x,q.y);}
  ctx.globalAlpha=1;

  // HUD
  ctx.textAlign='left';ctx.fillStyle='#fff';ctx.font='bold 26px sans-serif';ctx.fillText('SCORE '+score,20,36);
  ctx.textAlign='right';ctx.fillStyle='rgba(255,255,255,0.9)';ctx.font='14px sans-serif';ctx.fillText('奪取 '+outs+'  Lv'+lvl,W-20,24);
  ctx.fillText('被キープ',W-104,46);
  for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(W-60+i*20,41,7,0,6.28);ctx.fillStyle=i<fails?'#ff5b5b':'rgba(255,255,255,0.25)';ctx.fill();}
  if(combo>=2){ctx.textAlign='center';ctx.fillStyle='#ffd24d';ctx.font='bold 18px sans-serif';ctx.fillText('コンボ x'+combo,W/2,112);}

  if(state==='play'&&phase==='result'&&msg){ctx.textAlign='center';ctx.fillStyle=msgOk?'#9ff0b8':'#ffb38a';ctx.font='bold 15px sans-serif';ctx.fillText(msg,W/2,430);}

  if(state==='title'){
    ctx.fillStyle='rgba(4,8,4,0.83)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='bold 42px sans-serif';ctx.fillText('トラップを狩れ',W/2,84);
    ctx.fillStyle='#ffd23e';ctx.font='bold 22px sans-serif';ctx.fillText('Nick It',W/2,120);
    ctx.fillStyle='rgba(255,255,255,0.92)';ctx.font='16px sans-serif';
    ctx.fillText('背負う相手の足元へ縦パスが入る——トラップで収まる“直前”に足を差し込んでボールを奪え',W/2,180);
    ctx.fillStyle='rgba(255,255,255,0.66)';ctx.font='14px sans-serif';
    ctx.fillText('パスが足元に届く“ちょうど”の緑窓でタップ/SPACE＝足を出して奪取（トラップの前に引っかける）',W/2,218);
    ctx.fillText('早い＝ボールが来る前に足を出して空振り／遅い＝先に収められ前を向かれて運ばれる（被キープ）',W/2,242);
    ctx.fillText('ジャストで足元へ入ればクリーンに強奪＝加点。ど真ん中の一閃は大量加点',W/2,266);
    ctx.fillText('上級ほどパスが速く窓が狭い。3被キープで交代',W/2,290);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で開始',W/2,356);
    ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='14px sans-serif';ctx.fillText('BEST '+best,W/2,388);
  }
  if(state==='over'){
    ctx.fillStyle='rgba(4,8,4,0.85)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#ff6b6b';ctx.font='bold 46px sans-serif';ctx.fillText('3被キープ…交代',W/2,222);
    ctx.fillStyle='#fff';ctx.font='bold 40px sans-serif';ctx.fillText('SCORE '+score,W/2,290);
    ctx.fillStyle='rgba(255,255,255,0.85)';ctx.font='19px sans-serif';ctx.fillText('奪取 '+outs+'   BEST '+best,W/2,330);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で もう一度',W/2,402);
  }

  if(flash>0.02){ctx.globalAlpha=flash*0.5;ctx.fillStyle=flashCol;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}
  ctx.restore();

  ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,0.4)';ctx.font='12px sans-serif';
  ctx.fillText('トラップを狩れ：足元へ収まる直前の緑窓でタップして奪取。早い＝空振り/遅い＝収められる、3被キープで交代',W/2,H-8);
}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

function frame(ts){let dt=ts-last;last=ts;if(dt>60)dt=60;if(dt<0)dt=0;update(dt);render();requestAnimationFrame(frame);}
requestAnimationFrame(frame);

// ---------- test hook ----------
window.__ni={
  start, nick,
  get state(){return state;},
  get score(){return score;},
  get outs(){return outs;},
  get fails(){return fails;},
  get info(){return {state,phase,clock,arriveT,w,tough,acted,actT,result,outs,fails,lvl,
    inWin:(phase==='in'&&Math.abs(clock-arriveT)<=w)};}
};
})();
</script>
</body>
</html>
