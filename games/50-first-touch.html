<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ファーストタッチ・フィニッシュ — First Touch Finish</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{width:100%;height:100%;background:#08140c;overflow:hidden;
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,system-ui,sans-serif;
    touch-action:none;user-select:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  #stage{position:relative;aspect-ratio:900/600;max-width:100%;max-height:100%;
    width:auto;height:auto;box-shadow:0 0 60px rgba(0,0,0,.6);}
  canvas{display:block;width:100%;height:100%;border-radius:6px;}
</style>
</head>
<body>
<div id="wrap"><div id="stage"><canvas id="c" width="900" height="600"></canvas></div></div>
<script>
(function(){
"use strict";
const TEST=location.hash.indexOf('test')>=0;
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
const W=900,H=600;
let dpr=Math.max(1,Math.min(2,window.devicePixelRatio||1));
function fit(){ dpr=Math.max(1,Math.min(2,window.devicePixelRatio||1)); cv.width=W*dpr; cv.height=H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0); }
fit(); window.addEventListener('resize',fit);

// ---- audio ----
let AC=null;
function ac(){ if(!AC){ try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){AC=null;} } return AC; }
function tone(f,d,type,g,f2){ const a=ac(); if(!a)return; const o=a.createOscillator(),gg=a.createGain();
  o.type=type||'sine'; o.frequency.setValueAtTime(f,a.currentTime); if(f2)o.frequency.exponentialRampToValueAtTime(f2,a.currentTime+d);
  gg.gain.setValueAtTime(0.0001,a.currentTime); gg.gain.exponentialRampToValueAtTime(g||0.2,a.currentTime+0.01);
  gg.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+d); o.connect(gg); gg.connect(a.destination); o.start(); o.stop(a.currentTime+d+0.02); }
function noise(d,g,cut){ const a=ac(); if(!a)return; const n=Math.floor(a.sampleRate*d),buf=a.createBuffer(1,n,a.sampleRate),ch=buf.getChannelData(0);
  for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(1-i/n); const src=a.createBufferSource(); src.buffer=buf;
  const f=a.createBiquadFilter(); f.type='lowpass'; f.frequency.value=cut||1200; const gg=a.createGain(); gg.gain.value=g||0.2;
  src.connect(f); f.connect(gg); gg.connect(a.destination); src.start(); }
const S={
  feed(){ noise(0.05,0.14,1800); },
  trapP(){ noise(0.04,0.3,900); tone(360,0.09,'sine',0.2,520); },
  trapG(){ noise(0.045,0.24,1000); tone(300,0.08,'sine',0.16,420); },
  trapH(){ noise(0.06,0.28,700); tone(200,0.1,'sine',0.14,150); },
  kick(){ noise(0.05,0.4,2600); tone(220,0.08,'square',0.2,120); },
  goal(){ noise(0.08,0.4,2200); tone(520,0.14,'square',0.26,660); },
  cheer(){ const a=ac(); if(!a)return; noise(0.9,0.28,1900); for(let i=0;i<7;i++)setTimeout(()=>tone(500+Math.random()*340,0.34,'sine',0.05),i*42); },
  save(){ noise(0.12,0.34,1400); tone(260,0.16,'sawtooth',0.14,120); },
  wide(){ tone(300,0.2,'sine',0.12,180); noise(0.06,0.14,1600); },
  lost(){ tone(240,0.28,'sawtooth',0.14,90); },
  tick(){ tone(1100,0.03,'square',0.05); }
};

// ---- geometry ----
const GOAL={L:322,R:578,y:118};       // goal mouth
const FEET={x:450,y:454};             // where the player controls
const FEEDS=[200,300,620,720];        // feeder x positions

// ---- state ----
let state='ready';                    // ready, trap, shoot, result, over
let phase='trap';
let goals=0,out=0,streak=0,best=0,level=0,playN=0;
let q=0,trapDur=1.1,feederX=200,control=0,trapGrade='';
let leanDir=0,leanShown=true,gkX=450,gkDiveX=450,gkReach=80,gkDiving=false,gkT=0,gkLean=0;
let aimX=450,aimDir=1,aimSpeed=300,sweepMin=GOAL.L,sweepMax=GOAL.R,shootTimer=0,shootLimit=2.4;
let ballOff=0,result=null,shotFly=null;
let msg='',msgT=0,flash=0,flashCol='#fff',shakeT=0,shakeM=0;
let parts=[],crowd=[],t=0;

try{ best=parseInt(localStorage.getItem('ft_best')||'0',10)||0; }catch(e){}
for(let i=0;i<80;i++) crowd.push({x:Math.random()*W,y:6+Math.random()*40,c:['#e8544e','#f0c14b','#4a90d9','#fff','#5cc98a','#c98af0'][i%6],b:Math.random()*6.28});

function save(){ try{localStorage.setItem('ft_best',''+best);}catch(e){} }
function levelUp(){ level=Math.min(9,Math.floor(goals/3)); }

function reset(){ goals=0;out=0;streak=0;level=0;playN=0; parts=[]; nextPlay(); }

function nextPlay(){
  levelUp(); playN++;
  feederX=FEEDS[Math.floor(Math.random()*FEEDS.length)];
  trapDur=Math.max(0.72,1.16-level*0.045);
  q=0; phase='trap'; control=0; trapGrade=''; result=null; shotFly=null; ballOff=0;
  leanDir=Math.random()<0.5?-1:1;
  leanShown = level<3 ? true : (Math.random()<0.82);
  gkDiving=false; gkT=0; gkX=450; gkDiveX=450; gkLean=0;
  gkReach=78+level*3.2;
  state='trap';
  if(playN<=2){ msg='ボールが足元に来た瞬間にタップ＝トラップ！'; msgT=150; }
  else { msg=''; msgT=0; }
  S.feed();
}

// incoming ball position during trap (arc from feeder to feet)
function ballPos(){
  const qq=Math.min(1.12,q);
  const x=feederX+(FEET.x-feederX)*qq;
  const y=250+(FEET.y-250)*qq;
  const arc=Math.sin(Math.min(1,qq)*Math.PI)*70;    // lofted
  return {x,y:y-arc, scale:0.7+qq*0.55};
}

function doTrap(){
  if(state!=='trap'||phase!=='trap') return;
  const e=Math.abs(q-1.0);
  if(q<0.5){ control=0.28; trapGrade='mishit'; ballOff=(Math.random()*2-1)*44; S.trapH(); msg='トラップが乱れた…'; msgT=70; }
  else if(e<0.06){ control=1.0; trapGrade='perfect'; ballOff=0; S.trapP(); msg='完璧なトラップ！'; msgT=70; burst(FEET.x,FEET.y,'#eaffe0',10); }
  else if(e<0.14){ control=0.72; trapGrade='good'; ballOff=(Math.random()*2-1)*14; S.trapG(); msg='ナイスコントロール'; msgT=60; }
  else if(e<0.24){ control=0.45; trapGrade='heavy'; ballOff=(Math.random()*2-1)*30; S.trapH(); msg='少し浮いた…'; msgT=60; }
  else { control=0.3; trapGrade='heavy'; ballOff=(Math.random()*2-1)*40; S.trapH(); msg='トラップが大きい！'; msgT=60; }
  // enter shoot
  phase='shoot'; state='shoot';
  aimSpeed=(250+level*22)*(1+(1-control)*0.85);
  sweepMin=GOAL.L-4; sweepMax=GOAL.R+4;
  aimX=GOAL.L; aimDir=1;
  shootTimer=0; shootLimit=Math.max(1.6,2.5-level*0.08);
}

function doShoot(){
  if(state!=='shoot') return;
  const jit=(1-control)*48;
  const sx=aimX+(Math.random()*2-1)*jit + ballOff*0.5;
  gkDiveX=450+leanDir*(84+level*3.4);
  gkDiving=true; gkT=0;
  S.kick();
  let r;
  if(sx<GOAL.L-2||sx>GOAL.R+2) r='wide';
  else if(Math.abs(sx-gkDiveX)<gkReach) r='save';
  else r='goal';
  const corner = Math.min(Math.abs(sx-GOAL.L),Math.abs(sx-GOAL.R))<52;
  result=r;
  const oneTouch = control>=1 && shootTimer<0.6;
  shotFly={x0:FEET.x,y0:FEET.y-14,x1:sx,y1:r==='wide'?(sx<450?GOAL.L-40:GOAL.R+40):GOAL.y+8,t:0,r,corner};
  finishShot(r,corner,oneTouch);
}

function finishShot(r,corner,oneTouch){
  if(r==='goal'){ goals++; streak++; if(streak>best){best=streak;save();}
    let gt = corner?'ゴラッソ！ コーナーぶち抜き':'決めた！ ナイスフィニッシュ';
    if(oneTouch) gt='ワンタッチ・ゴラッソ！！';
    msg = streak>=3? `${streak}試合連続ゴール！`:gt; S.goal(); setTimeout(S.cheer,70);
    if(oneTouch){ setTimeout(()=>S.goal(),90); burst(GOAL.L+ (Math.random()*(GOAL.R-GOAL.L)),GOAL.y,'#ffd23e',18); }
    flash=oneTouch?0.7:0.55; flashCol='#eafff0'; shakeT=oneTouch?18:14; shakeM=oneTouch?6:5; }
  else if(r==='save'){ out++; streak=0; msg='GKにセーブされた！'; S.save(); shakeT=8; shakeM=3; }
  else { out++; streak=0; msg='枠を外した…'; S.wide(); }
  endPlay();
}

function loseTrap(){
  out++; streak=0; result='lost'; msg='トラップミス…ボールロスト'; S.lost();
  state='result'; msgT=100;
  if(out>=3){ setTimeout(()=>{ state='over'; msg='スリーミス・終了'; msgT=99999; },800); }
  else setTimeout(()=>{ if(state==='result') nextPlay(); },900);
}

function endPlay(){
  state='result'; msgT = result==='goal'?120:110;
  if(out>=3){ setTimeout(()=>{ state='over'; msg='スリーミス・終了'; msgT=99999; },1000); }
  else setTimeout(()=>{ if(state==='result') nextPlay(); }, result==='goal'?1050:950);
}

function burst(x,y,col,n){ for(let i=0;i<n;i++){ const a=Math.random()*6.28,sp=1+Math.random()*5;
  parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-2,life:1,col,r:2+Math.random()*3}); } }

// ---- input ----
function press(){
  const a=ac(); if(a&&a.state==='suspended')a.resume();
  if(state==='ready'||state==='over'){ reset(); return; }
  if(state==='trap'&&phase==='trap'){ doTrap(); return; }
  if(state==='shoot'){ doShoot(); return; }
}
cv.addEventListener('pointerdown',e=>{ e.preventDefault(); press(); });
window.addEventListener('keydown',e=>{ if(e.code==='Space'||e.code==='Enter'){ e.preventDefault(); press(); } });

// ---- update ----
let last=0;
function update(dt){
  t+=dt; if(msgT>0)msgT--; if(flash>0)flash=Math.max(0,flash-dt*2); if(shakeT>0)shakeT--;
  if(state==='trap'){
    q+=dt/trapDur;
    if(q>0.75 && ((q*16|0)!==((q-dt/trapDur)*16|0))) S.tick();
    if(q>=1.12){ loseTrap(); }
  } else if(state==='shoot'){
    aimX+=aimDir*aimSpeed*dt;
    if(aimX>=sweepMax){ aimX=sweepMax; aimDir=-1; } else if(aimX<=sweepMin){ aimX=sweepMin; aimDir=1; }
    if(leanShown) gkLean += ((leanDir)-gkLean)*Math.min(1,dt*6);
    shootTimer+=dt; if(shootTimer>=shootLimit){ // forced hurried miss
      const keep=aimX; aimX=450+leanDir*10; doShoot(); aimX=keep; if(result!=='goal'&&msgT<40){msg='シュートが遅れた…';msgT=90;} }
  } else if(state==='result'){
    if(shotFly){ shotFly.t+=dt; }
    if(gkDiving){ gkT+=dt; gkLean += ((leanDir* (Math.min(1,gkT/0.18)))-gkLean)*Math.min(1,dt*14); }
  }
  for(let i=parts.length-1;i>=0;i--){ const p=parts[i]; p.x+=p.vx;p.y+=p.vy;p.vy+=0.16;p.life-=dt*1.0; if(p.life<=0)parts.splice(i,1); }
}

// ---- draw ----
function rr(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }

function drawField(){
  const g=ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,'#123a20'); g.addColorStop(1,'#1c6a38');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  // crowd strip
  ctx.fillStyle='#0a1c10'; ctx.fillRect(0,0,W,54);
  for(const c of crowd){ const yy=c.y+Math.sin(t*3+c.b)*1.1; ctx.fillStyle=c.c; ctx.globalAlpha=.6; ctx.fillRect(c.x,yy,5,5); }
  ctx.globalAlpha=1;
  // perspective mow stripes
  for(let i=0;i<6;i++){ ctx.fillStyle=i%2? 'rgba(255,255,255,.04)':'rgba(0,0,0,.05)';
    const y0=120+i*80, y1=y0+80; ctx.beginPath(); ctx.moveTo(0,y0);ctx.lineTo(W,y0);ctx.lineTo(W,y1);ctx.lineTo(0,y1);ctx.closePath(); ctx.fill(); }
  // goal net area
  ctx.fillStyle='rgba(255,255,255,.06)'; ctx.fillRect(GOAL.L,66,GOAL.R-GOAL.L,GOAL.y-66);
  // net lines
  ctx.strokeStyle='rgba(255,255,255,.22)'; ctx.lineWidth=1;
  for(let x=GOAL.L;x<=GOAL.R;x+=16){ ctx.beginPath(); ctx.moveTo(x,66); ctx.lineTo(x,GOAL.y); ctx.stroke(); }
  for(let y=66;y<=GOAL.y;y+=13){ ctx.beginPath(); ctx.moveTo(GOAL.L,y); ctx.lineTo(GOAL.R,y); ctx.stroke(); }
  // posts + crossbar
  ctx.strokeStyle='#fff'; ctx.lineWidth=7; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(GOAL.L,GOAL.y); ctx.lineTo(GOAL.L,64); ctx.lineTo(GOAL.R,64); ctx.lineTo(GOAL.R,GOAL.y); ctx.stroke();
  // goal-line
  ctx.strokeStyle='rgba(255,255,255,.5)'; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(GOAL.L-70,GOAL.y);ctx.lineTo(GOAL.R+70,GOAL.y); ctx.stroke();
  // penalty arc hint
  ctx.strokeStyle='rgba(255,255,255,.14)'; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(450,GOAL.y,150,0.15,Math.PI-0.15); ctx.stroke();
}

function drawGK(){
  // pre-shot: partial weight-shift hint; on the dive: full commitment
  const reachDist=84+level*3.4;
  const bx=gkX + gkLean*(state==='shoot'?32:reachDist);
  const lean=gkLean;
  ctx.save(); ctx.translate(bx,GOAL.y-4);
  ctx.fillStyle='rgba(0,0,0,.25)'; ctx.beginPath(); ctx.ellipse(0,6,26,7,0,0,6.28); ctx.fill();
  // arms spread when diving
  const spread=18+Math.abs(lean)*22;
  ctx.strokeStyle='#ffcf3f'; ctx.lineWidth=7; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(0,-30); ctx.lineTo(-spread,-30-lean*10); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0,-30); ctx.lineTo(spread,-30+lean*10); ctx.stroke();
  ctx.fillStyle='#ffcf3f'; rr(-13,-42,26,30,7); ctx.fill();
  ctx.fillStyle='#f0c39a'; ctx.beginPath(); ctx.arc(lean*4,-50,9,0,6.28); ctx.fill();
  ctx.restore();
  // weight-shift tell — placed outside the posts on the lean side (clear of HUD/aim marker)
  if(state==='shoot'&&leanShown&&Math.abs(gkLean)>0.15){
    ctx.fillStyle='rgba(255,90,74,.92)'; ctx.font='bold 22px sans-serif'; ctx.textAlign='center';
    const tx = gkLean<0 ? GOAL.L-48 : GOAL.R+48;
    ctx.fillText(gkLean<0?'◀重心':'重心▶', tx, GOAL.y-24);
  }
}

function drawBall(){
  if(state==='trap'){
    const b=ballPos(); const r=9*b.scale;
    // shadow
    ctx.fillStyle='rgba(0,0,0,.22)'; ctx.beginPath(); ctx.ellipse(b.x, 250+(FEET.y-250)*Math.min(1,q), r*0.9, r*0.35,0,0,6.28); ctx.fill();
    ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(b.x,b.y,r,0,6.28); ctx.fill();
    ctx.strokeStyle='#123'; ctx.lineWidth=1.4; ctx.beginPath(); ctx.arc(b.x,b.y,r,0,6.28); ctx.stroke();
    ctx.fillStyle='#123'; ctx.beginPath(); ctx.arc(b.x-r*0.3+Math.sin(t*8)*2,b.y-r*0.2,r*0.28,0,6.28); ctx.fill();
    // timing ring
    const rr0=14+Math.max(0,(1-q))*120;
    ctx.strokeStyle= q>0.92&&q<1.08?'#8effa8':'rgba(255,255,255,.5)'; ctx.lineWidth=3;
    ctx.beginPath(); ctx.arc(FEET.x,FEET.y,rr0,0,6.28); ctx.stroke();
  } else if(state==='shoot'){
    // ball at feet (offset by trap)
    const bx=FEET.x+ballOff*0.4;
    ctx.fillStyle='rgba(0,0,0,.22)'; ctx.beginPath(); ctx.ellipse(bx,FEET.y+8,11,4,0,0,6.28); ctx.fill();
    ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(bx,FEET.y-4,10,0,6.28); ctx.fill();
    ctx.strokeStyle='#123'; ctx.lineWidth=1.4; ctx.stroke();
    // aim marker on goal line
    ctx.strokeStyle='#ffd23e'; ctx.lineWidth=3;
    ctx.beginPath(); ctx.moveTo(aimX,GOAL.y-2); ctx.lineTo(aimX,GOAL.y+16); ctx.stroke();
    ctx.fillStyle='#ffd23e'; ctx.beginPath(); ctx.moveTo(aimX,GOAL.y+22); ctx.lineTo(aimX-8,GOAL.y+36); ctx.lineTo(aimX+8,GOAL.y+36); ctx.closePath(); ctx.fill();
    // aim line
    ctx.strokeStyle='rgba(255,210,62,.28)'; ctx.lineWidth=2; ctx.setLineDash([7,7]);
    ctx.beginPath(); ctx.moveTo(bx,FEET.y-4); ctx.lineTo(aimX,GOAL.y+8); ctx.stroke(); ctx.setLineDash([]);
  } else if(state==='result'&&shotFly){
    const p=Math.min(1,shotFly.t/0.42);
    const x=shotFly.x0+(shotFly.x1-shotFly.x0)*p;
    const y=shotFly.y0+(shotFly.y1-shotFly.y0)*p - Math.sin(p*Math.PI)*26;
    ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(x,y,9,0,6.28); ctx.fill();
    ctx.strokeStyle='#123'; ctx.lineWidth=1.4; ctx.stroke();
    if(shotFly.r==='goal'&&p>=1){ // net ripple
      ctx.strokeStyle='rgba(255,255,255,.5)'; ctx.lineWidth=2;
      for(let i=1;i<4;i++){ ctx.beginPath(); ctx.arc(shotFly.x1,shotFly.y1,i*9+Math.sin(t*10)*2,0,6.28); ctx.stroke(); } }
  }
}

function drawPlayer(){
  ctx.save(); ctx.translate(FEET.x-2,FEET.y+2);
  ctx.fillStyle='rgba(0,0,0,.24)'; ctx.beginPath(); ctx.ellipse(0,10,20,6,0,0,6.28); ctx.fill();
  const kick = state==='result'&&shotFly&&shotFly.t<0.2?1:0;
  ctx.strokeStyle='#20304a'; ctx.lineWidth=8; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(-4,-30); ctx.lineTo(-9,6); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(4,-30); ctx.lineTo(9-kick*16,6-kick*8); ctx.stroke();
  ctx.fillStyle='#2f7fd6'; rr(-12,-52,24,34,8); ctx.fill();
  ctx.fillStyle='#f0c39a'; ctx.beginPath(); ctx.arc(0,-60,9,0,6.28); ctx.fill();
  ctx.fillStyle='#20304a'; ctx.beginPath(); ctx.arc(0,-63,9,Math.PI,0); ctx.fill();
  ctx.restore();
}

function drawFeeder(){
  if(state!=='trap') return;
  ctx.save(); ctx.translate(feederX,250);
  ctx.fillStyle='rgba(0,0,0,.2)'; ctx.beginPath(); ctx.ellipse(0,12,16,5,0,0,6.28); ctx.fill();
  ctx.fillStyle='#c94e8a'; rr(-9,-24,18,26,6); ctx.fill();
  ctx.fillStyle='#f0c39a'; ctx.beginPath(); ctx.arc(0,-30,7,0,6.28); ctx.fill();
  ctx.restore();
}

function hud(x,y,w,h,lab,val,col){
  ctx.fillStyle='rgba(6,20,12,.62)'; rr(x,y,w,h,9); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.6)'; ctx.font='11px sans-serif'; ctx.textAlign='left'; ctx.fillText(lab,x+12,y+19);
  ctx.fillStyle=col||'#fff'; ctx.font='bold 24px sans-serif'; ctx.fillText(val,x+12,y+44);
}
function drawHUD(){
  hud(20,16,150,56,'ゴール GOALS',''+goals,'#8effa8');
  hud(W/2-75,16,150,56,'連続 STREAK',''+streak,'#ffd23e');
  const oc = out>=2?'#ff6a5a':'#fff';
  hud(W-170,16,150,56,'ミス MISS',out+' /3',oc); ctx.textAlign='left';
  ctx.fillStyle='rgba(255,255,255,.5)'; ctx.font='12px sans-serif'; ctx.fillText('自己ベスト連続 '+best,22,90);
  // control bar after trap
  if(state==='shoot'||(state==='result'&&trapGrade)){
    const bw=150,bx=W-170,by=82;
    ctx.fillStyle='rgba(6,20,12,.6)'; rr(bx,by,bw,10,5); ctx.fill();
    ctx.fillStyle= control>=1?'#8effa8':control>=0.7?'#ffd23e':'#ff8a5a';
    rr(bx,by,bw*control,10,5); ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.7)'; ctx.font='11px sans-serif'; ctx.fillText('コントロール',bx,by-3);
  }
}

function drawMsg(){
  if(msgT>0&&msg){ ctx.textAlign='center';
    ctx.font='bold 30px sans-serif'; const w=ctx.measureText(msg).width;
    ctx.fillStyle='rgba(6,18,10,.72)'; rr(450-w/2-18,H-70,w+36,44,10); ctx.fill();
    ctx.fillStyle='#fff'; ctx.fillText(msg,450,H-40); ctx.textAlign='left'; }
}

function drawOverlay(){
  ctx.fillStyle='rgba(6,16,10,.72)'; ctx.fillRect(0,0,W,H); ctx.textAlign='center';
  ctx.fillStyle='rgba(140,255,168,.9)'; ctx.font='600 15px sans-serif'; ctx.fillText('SOCCER · FIRST TOUCH & FINISH',450,168);
  ctx.fillStyle='#fff'; ctx.font='bold 52px sans-serif'; ctx.fillText('ファーストタッチ・フィニッシュ',450,222);
  ctx.fillStyle='#ffd23e'; ctx.font='bold 22px sans-serif'; ctx.fillText('First Touch Finish',450,254);
  ctx.fillStyle='rgba(255,255,255,.9)'; ctx.font='17px sans-serif';
  const L=['浮き球が足元に届く瞬間にタップ＝トラップ（コントロール確定）。',
    '完璧に止めるほど、次のシュートの狙いが安定する。',
    'GKの重心(◀▶)を読み、狙いマーカーを逆サイドで止めてシュート。',
    'コーナーぶち抜きは高得点。枠外・セーブ・トラップミスはミス。',
    '3ミスで終了。'];
  for(let i=0;i<L.length;i++) ctx.fillText(L[i],450,296+i*26);
  ctx.fillStyle='#e8544e'; rr(450-95,452,190,54,27); ctx.fill();
  ctx.fillStyle='#fff'; ctx.font='bold 24px sans-serif'; ctx.fillText('キックオフ',450,486);
  ctx.fillStyle='rgba(255,255,255,.6)'; ctx.font='14px sans-serif'; ctx.fillText('タップ / Space でトラップ→シュート',450,532);
  ctx.textAlign='left';
}
function drawOver(){
  ctx.fillStyle='rgba(6,16,10,.8)'; ctx.fillRect(0,0,W,H); ctx.textAlign='center';
  ctx.fillStyle='#fff'; ctx.font='bold 46px sans-serif'; ctx.fillText('スリーミス・終了',450,232);
  ctx.fillStyle='#8effa8'; ctx.font='bold 30px sans-serif'; ctx.fillText('ゴール '+goals+' 本',450,286);
  ctx.fillStyle='#ffd23e'; ctx.font='20px sans-serif'; ctx.fillText('自己ベスト連続 '+best,450,322);
  ctx.fillStyle='#2f7fd6'; rr(450-95,372,190,54,27); ctx.fill();
  ctx.fillStyle='#fff'; ctx.font='bold 22px sans-serif'; ctx.fillText('もう一度',450,406);
  ctx.textAlign='left';
}

function render(){
  ctx.save();
  if(shakeT>0){ ctx.translate((Math.random()*2-1)*shakeM,(Math.random()*2-1)*shakeM); }
  drawField(); drawFeeder(); drawGK(); drawPlayer(); drawBall();
  for(const p of parts){ ctx.globalAlpha=Math.max(0,p.life); ctx.fillStyle=p.col; ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,6.28); ctx.fill(); }
  ctx.globalAlpha=1;
  drawHUD(); drawMsg();
  ctx.restore();
  if(flash>0){ ctx.fillStyle=flashCol; ctx.globalAlpha=flash; ctx.fillRect(0,0,W,H); ctx.globalAlpha=1; }
  if(state==='ready') drawOverlay();
  if(state==='over') drawOver();
}
function loop(ts){ if(!last)last=ts; let dt=(ts-last)/1000; last=ts; if(dt>0.05)dt=0.05; update(dt); render(); requestAnimationFrame(loop); }
requestAnimationFrame(loop);

if(TEST){
  window.__ft={
    get state(){return state;},
    get phase(){return phase;},
    get q(){return q;},
    get control(){return control;},
    get lean(){return leanDir;},
    get leanShown(){return leanShown;},
    get aimX(){return aimX;},
    get goalL(){return GOAL.L;},
    get goalR(){return GOAL.R;},
    get result(){return result;},
    get count(){return {goals,out,streak};},
    predictSafe(){ const gd=450+leanDir*(84+level*3.4); const rr0=78+level*3.2;
      return aimX>=GOAL.L-2 && aimX<=GOAL.R+2 && Math.abs(aimX-gd)>=rr0+8; },
    tap(){ press(); }
  };
}
})();
</script>
