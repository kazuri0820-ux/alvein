<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>盗塁 — Steal Second</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{width:100%;height:100%;background:#0a1622;overflow:hidden;
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,system-ui,sans-serif;
    touch-action:none;user-select:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  #stage{position:relative;aspect-ratio:900/600;max-width:100%;max-height:100%;
    width:auto;height:auto;box-shadow:0 0 60px rgba(0,0,0,.6);}
  canvas{display:block;width:100%;height:100%;border-radius:6px;}
</style>
</head>
<body>
<div id="wrap"><div id="stage"><canvas id="c" width="900" height="600"></canvas></div></div>
<script>
(function(){
"use strict";
const TEST=location.hash.indexOf('test')>=0;
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
const W=900,H=600;
let dpr=Math.max(1,Math.min(2,window.devicePixelRatio||1));
function fit(){ dpr=Math.max(1,Math.min(2,window.devicePixelRatio||1)); cv.width=W*dpr; cv.height=H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0); }
fit(); window.addEventListener('resize',fit);

// ---- audio ----
let AC=null;
function ac(){ if(!AC){ try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){AC=null;} } return AC; }
function tone(f,d,type,g,f2){ const a=ac(); if(!a)return; const o=a.createOscillator(),gg=a.createGain();
  o.type=type||'sine'; o.frequency.setValueAtTime(f,a.currentTime); if(f2)o.frequency.exponentialRampToValueAtTime(f2,a.currentTime+d);
  gg.gain.setValueAtTime(0.0001,a.currentTime); gg.gain.exponentialRampToValueAtTime(g||0.2,a.currentTime+0.01);
  gg.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+d); o.connect(gg); gg.connect(a.destination); o.start(); o.stop(a.currentTime+d+0.02); }
function noise(d,g,cut){ const a=ac(); if(!a)return; const n=Math.floor(a.sampleRate*d),buf=a.createBuffer(1,n,a.sampleRate),ch=buf.getChannelData(0);
  for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(1-i/n); const src=a.createBufferSource(); src.buffer=buf;
  const f=a.createBiquadFilter(); f.type='lowpass'; f.frequency.value=cut||1200; const gg=a.createGain(); gg.gain.value=g||0.2;
  src.connect(f); f.connect(gg); gg.connect(a.destination); src.start(); }
const S={
  set(){ tone(1600,0.1,'square',0.08,1900); },
  go(){ noise(0.05,0.24,2000); tone(320,0.06,'square',0.14,520); },
  safe(){ noise(0.08,0.4,2200); tone(520,0.14,'square',0.24,660); },
  cheer(){ const a=ac(); if(!a)return; noise(0.8,0.26,1900); for(let i=0;i<6;i++)setTimeout(()=>tone(480+Math.random()*320,0.32,'sine',0.05),i*44); },
  out(){ tone(300,0.26,'sawtooth',0.16,100); noise(0.08,0.16,1200); },
  pick(){ noise(0.1,0.3,1000); tone(220,0.14,'sawtooth',0.14,120); },
  run(){ noise(0.03,0.08,900); }, throw(){ noise(0.05,0.34,2200); }
};

// ---- geometry ----
const FIRST={x:640,y:388}, SECOND={x:450,y:250}, MOUND={x:450,y:340}, HOME={x:450,y:492};

// ---- state ----
let state='ready';   // ready, set, react, run, result, over
let steals=0, outs=0, streak=0, best=0, level=0, playN=0;
let setDur=0.9, setT=0, move='', reactT=0, reactWin=0.6, broke=false, breakReact=1;
let leadOff=0, runnerP=0, throwP=0, result=null, resolved=false, pitcherLean=0;
let msg='',msgT=0, subMsg='', umpT=0, umpText='', umpCol='#fff';
let flash=0,flashCol='#fff',shakeT=0,shakeM=0;
let parts=[], crowd=[], t=0;

try{ best=parseInt(localStorage.getItem('st_best')||'0',10)||0; }catch(e){}
for(let i=0;i<70;i++) crowd.push({x:Math.random()*W,y:6+Math.random()*40,c:['#e8544e','#f0c14b','#4a90d9','#fff','#5cc98a','#c98af0'][i%6],b:Math.random()*6.28});

function saveBest(){ try{localStorage.setItem('st_best',''+best);}catch(e){} }
function levelUp(){ level=Math.min(9,Math.floor(steals/3)); }
function reset(){ steals=0;outs=0;streak=0;level=0;playN=0; parts=[]; nextPlay(); }

function nextPlay(){
  levelUp(); playN++;
  setDur=0.6+Math.random()*0.9;
  move = Math.random()<0.62?'deliver':'pickoff';
  reactWin=Math.max(0.4,0.62-level*0.02);
  setT=0; reactT=0; broke=false; breakReact=1; leadOff=0; runnerP=0; throwP=0; result=null; resolved=false; pitcherLean=0;
  state='set';
  if(playN<=2){ msg='セットから始動を見極めろ！ 投球=即スタート、けん制=待て'; msgT=190; subMsg=''; }
  else { msg=''; msgT=0; subMsg=''; }
  S.set();
}

function breakNow(){
  if(state==='set'){ // jumped early -> picked off
    result='pickearly'; endOut('フライング！ けん制でアウト', true); return;
  }
  if(state!=='react'||broke) return;
  broke=true; breakReact=reactT/reactWin;   // 0=instant, 1=at window end
  if(move==='pickoff'){ result='picked'; endOut('けん制に飛び出した… タッチアウト', true); return; }
  // deliver + break -> steal attempt, quality by reaction
  S.go(); state='run'; runnerP=0; throwP=0;
  // throw arrival: fast reaction -> you're ahead; slow -> throw beats you
  window.__ta = 0.62 + breakReact*0.5 + level*0.02;   // your run time to 2nd (lower=faster)... see resolveSteal
}
function endOut(m,pick){
  outs++; streak=0; result=result||'out'; umpText='OUT'; umpCol='#ff6a5a'; umpT=1;
  msg=m; subMsg=''; (pick?S.pick():S.out()); shakeT=8; shakeM=3;
  state='result'; msgT=110;
  if(outs>=3){ setTimeout(()=>{ state='over'; msg='スリーアウト・終了'; msgT=99999; }, 850); }
  else setTimeout(()=>{ if(state==='result') nextPlay(); }, 1000);
}
function resolveSteal(){
  if(resolved) return; resolved=true;
  // reach time (run to 2nd) vs throw arrival (fixed catcher pop). good jump (small breakReact) => reach sooner.
  const reach = 1.02 + breakReact*0.62;
  const throwArrive = 1.30 + level*0.01;
  const safe = reach < throwArrive;
  umpText=safe?'SAFE':'OUT'; umpCol=safe?'#8effa8':'#ff6a5a'; umpT=1;
  if(safe){ steals++; streak++; if(streak>best){best=streak;saveBest();}
    const m2=reach<throwArrive-0.18; result='safe'; msg=m2?'好スタート！ 楽々セーフ':'際どく… セーフ！ 盗塁成功'; subMsg=streak>=3?`${streak}連続成功！`:''; S.safe(); setTimeout(S.cheer,50);
    flash=0.4; flashCol='#eafff0'; shakeT=10; shakeM=3; burst(SECOND.x,SECOND.y,'#eaffe0',14);
    state='result'; msgT=110; setTimeout(()=>{ if(state==='result') nextPlay(); },1100);
  } else { result='cs'; endOut('スタートが遅れ… 盗塁失敗', false); }
}

function burst(x,y,col,n){ for(let i=0;i<n;i++){ const a=Math.random()*6.28,sp=1+Math.random()*4;
  parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-1.5,life:1,col,r:2+Math.random()*3}); } }

// ---- input ----
function press(){ const a=ac(); if(a&&a.state==='suspended')a.resume();
  if(state==='ready'||state==='over'){ reset(); return; }
  if(state==='set'||state==='react'){ breakNow(); }
}
cv.addEventListener('pointerdown',e=>{ e.preventDefault(); press(); });
window.addEventListener('keydown',e=>{ if(e.code==='Space'||e.code==='Enter'){ e.preventDefault(); press(); } });

// ---- update ----
let last=0;
function update(dt){
  t+=dt; if(msgT>0)msgT--; if(flash>0)flash=Math.max(0,flash-dt*2); if(shakeT>0)shakeT--; if(umpT>0)umpT=Math.max(0,umpT-dt*1.2);
  if(leadOff<1 && (state==='set'||state==='react')) leadOff=Math.min(1,leadOff+dt*2.4);
  if(state==='set'){ setT+=dt; if(setT>=setDur){ state='react'; reactT=0; pitcherLean=0; } }
  else if(state==='react'){ reactT+=dt; pitcherLean=Math.min(1,pitcherLean+dt*5);
    if(reactT>=reactWin){ // no break in time
      if(move==='pickoff'){ result='safeback'; msg='けん制を見送り セーフ（次へ）'; msgT=70; state='result'; setTimeout(()=>{ if(state==='result')nextPlay(); },700); }
      else { result='nogo'; msg='スタートを切れず…（次へ）'; msgT=70; state='result'; setTimeout(()=>{ if(state==='result')nextPlay(); },700); }
    }
  }
  else if(state==='run'){ const ta=window.__ta||1.3; runnerP=Math.min(1, runnerP+dt/ (1.02+breakReact*0.62)); throwP=Math.min(1, throwP+dt/(1.30+level*0.01));
    if(runnerP>=1 || throwP>=1){ resolveSteal(); } }
  for(let i=parts.length-1;i>=0;i--){ const q=parts[i]; q.x+=q.vx;q.y+=q.vy;q.vy+=0.16;q.life-=dt*1.0; if(q.life<=0)parts.splice(i,1); }
}

// ---- draw ----
function rr(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }

function runnerPos(){ if(state==='run'||state==='result'){ return {x:FIRST.x+(SECOND.x-FIRST.x)*runnerP, y:FIRST.y+(SECOND.y-FIRST.y)*runnerP}; }
  return {x:FIRST.x-24-leadOff*36, y:FIRST.y+leadOff*6}; }

function drawField(){
  const g=ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,'#123a24'); g.addColorStop(1,'#1e7a42');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#0a1c10'; ctx.fillRect(0,0,W,32);
  for(const c of crowd){ const yy=c.y+Math.sin(t*3+c.b)*1.1; ctx.fillStyle=c.c; ctx.globalAlpha=.5; ctx.fillRect(c.x,yy,5,4); }
  ctx.globalAlpha=1;
  // dirt diamond
  ctx.fillStyle='#b5763e'; ctx.beginPath(); ctx.moveTo(HOME.x,HOME.y+12); ctx.lineTo(FIRST.x+26,FIRST.y); ctx.lineTo(SECOND.x,SECOND.y-26); ctx.lineTo(2*450-FIRST.x-26,FIRST.y); ctx.closePath(); ctx.fill();
  // basepath 1st->2nd highlighted
  ctx.strokeStyle='rgba(255,255,255,.35)'; ctx.lineWidth=3;
  ctx.beginPath(); ctx.moveTo(HOME.x,HOME.y);ctx.lineTo(FIRST.x,FIRST.y);ctx.lineTo(SECOND.x,SECOND.y);ctx.lineTo(2*450-FIRST.x,FIRST.y);ctx.closePath(); ctx.stroke();
  ctx.strokeStyle='rgba(255,210,62,.5)'; ctx.lineWidth=4; ctx.beginPath(); ctx.moveTo(FIRST.x,FIRST.y); ctx.lineTo(SECOND.x,SECOND.y); ctx.stroke();
  // bases
  for(const B of [FIRST,SECOND,{x:2*450-FIRST.x,y:FIRST.y}]){ ctx.save(); ctx.translate(B.x,B.y); ctx.rotate(Math.PI/4); ctx.fillStyle='#fff'; ctx.fillRect(-9,-9,18,18); ctx.restore(); }
  ctx.fillStyle='#fff'; ctx.beginPath(); ctx.moveTo(HOME.x-10,HOME.y-2);ctx.lineTo(HOME.x+10,HOME.y-2);ctx.lineTo(HOME.x+10,HOME.y+5);ctx.lineTo(HOME.x,HOME.y+13);ctx.lineTo(HOME.x-10,HOME.y+5);ctx.closePath(); ctx.fill();
  // pitcher (leans toward home on deliver, toward 1st on pickoff)
  const lean = state==='react'? (move==='deliver'? pitcherLean : -pitcherLean) : 0;
  ctx.save(); ctx.translate(MOUND.x+lean*20, MOUND.y-4); ctx.rotate(lean*0.2);
  ctx.fillStyle='#c94e8a'; rr(-11,-24,22,26,6); ctx.fill(); ctx.fillStyle='#f0c39a'; ctx.beginPath(); ctx.arc(0,-30,7,0,6.28); ctx.fill();
  ctx.strokeStyle='#c94e8a'; ctx.lineWidth=6; ctx.lineCap='round';
  if(state==='react'&&move==='deliver'){ ctx.beginPath(); ctx.moveTo(0,-14); ctx.lineTo(-14,-30); ctx.stroke(); } // leg kick-ish
  ctx.restore();
  // catcher / 2B fielder
  fig(HOME.x,HOME.y+18,'#e8544e'); fig(SECOND.x+14,SECOND.y+6,'#4a90d9');
  // 1B holding runner
  fig(FIRST.x+16,FIRST.y-4,'#4a90d9');
  // read cue
  if(state==='react'){ ctx.textAlign='center'; ctx.font='bold 30px sans-serif';
    ctx.fillStyle= move==='deliver'?'#8effa8':'#ff6a5a'; ctx.fillText(move==='deliver'?'投球！ GO!':'けん制！ 戻れ', 450, 150); ctx.textAlign='left'; }
  else if(state==='set'){ ctx.textAlign='center'; ctx.fillStyle='rgba(255,255,255,.6)'; ctx.font='bold 20px sans-serif'; ctx.fillText('セット… 始動を待て', 450, 150); ctx.textAlign='left'; }
}
function fig(x,y,col){ ctx.save(); ctx.translate(x,y); ctx.fillStyle='rgba(0,0,0,.24)'; ctx.beginPath(); ctx.ellipse(0,10,12,4,0,0,6.28); ctx.fill();
  ctx.fillStyle=col; rr(-9,-22,18,26,6); ctx.fill(); ctx.fillStyle='#f0c39a'; ctx.beginPath(); ctx.arc(0,-27,6,0,6.28); ctx.fill(); ctx.restore(); }
function drawRunner(){
  const r=runnerPos(); const sliding=(state==='result'&&(result==='safe'||result==='cs'));
  ctx.save(); ctx.translate(r.x,r.y);
  if(sliding){ ctx.rotate(-0.7); ctx.fillStyle='rgba(0,0,0,.2)'; ctx.beginPath(); ctx.ellipse(4,14,20,6,0,0,6.28); ctx.fill();
    ctx.fillStyle='#f0c14b'; rr(-14,-6,36,14,6); ctx.fill(); ctx.fillStyle='#f0c39a'; ctx.beginPath(); ctx.arc(22,0,7,0,6.28); ctx.fill(); }
  else { ctx.fillStyle='rgba(0,0,0,.24)'; ctx.beginPath(); ctx.ellipse(0,13,13,4,0,0,6.28); ctx.fill();
    const run=Math.sin(t*22)*(state==='run'?7:0); ctx.strokeStyle='#20304a'; ctx.lineWidth=6; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(0,-4); ctx.lineTo(-5-run*0.2,13); ctx.stroke(); ctx.beginPath(); ctx.moveTo(0,-4); ctx.lineTo(5+run*0.2,13); ctx.stroke();
    ctx.fillStyle='#f0c14b'; rr(-10,-26,20,24,6); ctx.fill(); ctx.fillStyle='#f0c39a'; ctx.beginPath(); ctx.arc(0,-32,7,0,6.28); ctx.fill(); }
  ctx.restore();
}
function drawThrow(){
  if(state==='run' || (state==='result'&&(result==='cs'))){ const p=Math.min(1,throwP);
    const x=HOME.x+(SECOND.x-HOME.x)*p, y=(HOME.y+18)+(SECOND.y-(HOME.y+18))*p - Math.sin(p*Math.PI)*24;
    ctx.strokeStyle='rgba(255,255,255,.35)'; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(HOME.x,HOME.y+18); ctx.lineTo(x,y); ctx.stroke();
    ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(x,y,6,0,6.28); ctx.fill(); ctx.strokeStyle='#123'; ctx.lineWidth=1.2; ctx.stroke(); }
}
function drawUmp(){ if(umpT<=0)return; ctx.textAlign='center'; ctx.font='bold 40px sans-serif'; ctx.globalAlpha=Math.min(1,umpT*1.5);
  ctx.fillStyle=umpCol; ctx.fillText(umpText, SECOND.x, SECOND.y-42); ctx.globalAlpha=1; ctx.textAlign='left'; }

function hud(x,y,w,h,lab,val,col){
  ctx.fillStyle='rgba(6,20,14,.62)'; rr(x,y,w,h,9); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.6)'; ctx.font='11px sans-serif'; ctx.textAlign='left'; ctx.fillText(lab,x+12,y+19);
  ctx.fillStyle=col||'#fff'; ctx.font='bold 24px sans-serif'; ctx.fillText(val,x+12,y+44);
}
function drawHUD(){
  hud(20,14,150,56,'盗塁 STEALS',''+steals,'#8effa8');
  hud(W/2-75,14,150,56,'連続 STREAK',''+streak,'#ffd23e');
  const oc=outs>=2?'#ff6a5a':'#fff';
  hud(W-170,14,150,56,'アウト OUT',outs+' /3',oc); ctx.textAlign='left';
  ctx.fillStyle='rgba(255,255,255,.5)'; ctx.font='12px sans-serif'; ctx.fillText('自己ベスト連続 '+best,22,88);
}
function drawMsg(){
  if(msgT>0&&msg){ ctx.textAlign='center'; ctx.font='bold 25px sans-serif'; const w=ctx.measureText(msg).width;
    ctx.fillStyle='rgba(6,18,10,.75)'; rr(450-w/2-18,H-92,w+40,40,10); ctx.fill();
    ctx.fillStyle='#fff'; ctx.fillText(msg,450,H-65);
    if(subMsg){ ctx.font='bold 16px sans-serif'; ctx.fillStyle='rgba(140,255,168,.95)'; ctx.fillText(subMsg,450,H-42); }
    ctx.textAlign='left'; }
}
function drawHint(){ if(state==='set'||state==='react'){ ctx.textAlign='center'; ctx.fillStyle='rgba(255,255,255,.7)'; ctx.font='14px sans-serif';
  ctx.fillText('投球と同時にタップ＝スタート。けん制では待つ（早撃ち厳禁）',450,H-22); ctx.textAlign='left'; } }
function drawOverlay(){
  ctx.fillStyle='rgba(6,16,12,.76)'; ctx.fillRect(0,0,W,H); ctx.textAlign='center';
  ctx.fillStyle='rgba(140,255,168,.9)'; ctx.font='600 15px sans-serif'; ctx.fillText('BASEBALL · STEAL SECOND',450,138);
  ctx.fillStyle='#fff'; ctx.font='bold 56px sans-serif'; ctx.fillText('盗塁',450,198);
  ctx.fillStyle='#ffd23e'; ctx.font='bold 21px sans-serif'; ctx.fillText('Steal Second',450,230);
  ctx.fillStyle='rgba(255,255,255,.9)'; ctx.font='16px sans-serif';
  const L=['一塁走者となって二塁を盗め！ 投手の始動を見極めろ。',
    '「投球！」の瞬間にタップ＝好スタート → 送球より先に到達でセーフ。',
    '「けん制！」ではタップ厳禁。飛び出すとタッチアウト。',
    'セット中の早撃ちも、けん制でアウト。反応の速さが勝負。',
    '盗塁成功でスコア、3アウトで終了。'];
  for(let i=0;i<L.length;i++) ctx.fillText(L[i],450,266+i*25);
  ctx.fillStyle='#e8544e'; rr(450-95,424,190,54,27); ctx.fill();
  ctx.fillStyle='#fff'; ctx.font='bold 24px sans-serif'; ctx.fillText('リード', 450,458);
  ctx.fillStyle='rgba(255,255,255,.6)'; ctx.font='14px sans-serif'; ctx.fillText('タップ / Space でスタート',450,498);
  ctx.textAlign='left';
}
function drawOver(){
  ctx.fillStyle='rgba(6,16,12,.84)'; ctx.fillRect(0,0,W,H); ctx.textAlign='center';
  ctx.fillStyle='#fff'; ctx.font='bold 46px sans-serif'; ctx.fillText('スリーアウト・終了',450,232);
  ctx.fillStyle='#8effa8'; ctx.font='bold 30px sans-serif'; ctx.fillText('盗塁成功 '+steals,450,286);
  ctx.fillStyle='#ffd23e'; ctx.font='20px sans-serif'; ctx.fillText('自己ベスト連続 '+best,450,322);
  ctx.fillStyle='#2f7fd6'; rr(450-95,372,190,54,27); ctx.fill();
  ctx.fillStyle='#fff'; ctx.font='bold 22px sans-serif'; ctx.fillText('もう一度',450,406);
  ctx.textAlign='left';
}

function render(){
  ctx.save();
  if(shakeT>0){ ctx.translate((Math.random()*2-1)*shakeM,(Math.random()*2-1)*shakeM); }
  drawField(); drawThrow(); drawRunner();
  for(const q of parts){ ctx.globalAlpha=Math.max(0,q.life); ctx.fillStyle=q.col; ctx.beginPath(); ctx.arc(q.x,q.y,q.r,0,6.28); ctx.fill(); }
  ctx.globalAlpha=1;
  drawUmp(); drawHUD(); drawMsg(); drawHint();
  ctx.restore();
  if(flash>0){ ctx.fillStyle=flashCol; ctx.globalAlpha=flash; ctx.fillRect(0,0,W,H); ctx.globalAlpha=1; }
  if(state==='ready') drawOverlay();
  if(state==='over') drawOver();
}
function loop(ts){ if(!last)last=ts; let dt=(ts-last)/1000; last=ts; if(dt>0.05)dt=0.05; update(dt); render(); requestAnimationFrame(loop); }
requestAnimationFrame(loop);

if(TEST){
  window.__st={
    get state(){return state;},
    get move(){return state==='react'?move:'';},
    get reactT(){return reactT;},
    get result(){return result;},
    get count(){return {steals,outs,streak};},
    breakNow(){ breakNow(); },
    tap(){ if(state==='ready'||state==='over')reset(); }
  };
}
})();
</script>
</body>
</html>
