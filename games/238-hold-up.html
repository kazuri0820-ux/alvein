<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ポストプレー (Hold-Up Play)</title>
<style>
  html,body{margin:0;height:100%;background:#07120b;overflow:hidden;
    font-family:-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  #stage{position:relative;width:100vw;height:100vh;max-width:calc(100vh*1.5);max-height:calc(100vw/1.5);aspect-ratio:900/600;}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;border-radius:6px;}
</style>
</head>
<body>
<div id="wrap"><div id="stage"><canvas id="cv"></canvas></div></div>
<script>
(function(){
const W=900,H=600,cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let DPR=1;
function fit(){DPR=Math.min(2,window.devicePixelRatio||1);cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
fit();addEventListener('resize',fit);

// ---------- audio ----------
let AC=null;function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function tone(f,d,type,v,sweep){const a=ac();if(!a)return;const t=a.currentTime,o=a.createOscillator(),g=a.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(sweep)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+sweep),t+d);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v||0.2,t+0.008);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+0.02);}
function noise(d,v,hp){const a=ac();if(!a)return;const t=a.currentTime,n=Math.floor(a.sampleRate*d),buf=a.createBuffer(1,n,a.sampleRate),ch=buf.getChannelData(0);
  for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource();s.buffer=buf;
  const f=a.createBiquadFilter();f.type='highpass';f.frequency.value=hp||600;const g=a.createGain();g.gain.value=v||0.2;
  s.connect(f);f.connect(g);g.connect(a.destination);s.start(t);s.stop(t+d+0.02);}
const S={
  lay:()=>{noise(0.03,0.1,700);tone(440,0.06,'sine',0.09,120);},
  chance:()=>{[600,860,1120,1360].forEach((f,i)=>setTimeout(()=>tone(f,0.11,'triangle',0.17),i*55));},
  bad:()=>{noise(0.16,0.22,320);tone(170,0.18,'sawtooth',0.12,-50);},
  steal:()=>{noise(0.14,0.2,360);tone(200,0.16,'sawtooth',0.1,-50);},
  streak:()=>{[700,930,1170,1400].forEach((f,i)=>setTimeout(()=>tone(f,0.1,'triangle',0.16),i*60));},
  over:()=>{[440,330,247,175].forEach((f,i)=>setTimeout(()=>tone(f,0.3,'triangle',0.2),i*160));}
};

// ---------- geometry ----------
const FWD={x:450,y:474};
const LANES=[{x:170,y:150},{x:450,y:120},{x:730,y:150}]; // L / C / R support runners
const LNAME=['左','中央','右'];

// ---------- state ----------
let state='title', phase='read', t=0, plays=0;
let score=0, combo=0, best=+(localStorage.getItem('holdup_best')||0);
let outs=0, fails=0, lvl=1;   // outs = successful lay-offs
let clock=0, coverT=800, pressT=1500, openLane=1;
let covered=[false,false,false];          // final coverage
let shuffle=[false,false,false], shuffleT=0; // pre-commit visual feint
let acted=false, choice=-1, result=null, resultT=0, msg='', passU=0;
let markerU=0;
let shake=0, flash=0, flashCol='#fff', last=performance.now();
let parts=[], pops=[];

function rnd(a,b){return a+Math.random()*(b-a);}
function chance(p){return Math.random()<p;}
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function lerp(a,b,u){return a+(b-a)*u;}
function easeOut(u){return 1-Math.pow(1-u,2);}
function pick(a){return a[Math.floor(Math.random()*a.length)];}

function params(){ return {
  cover:Math.max(480,860-lvl*56),
  react:Math.max(360,760-lvl*58)
};}

function reset(){state='title';score=0;combo=0;outs=0;fails=0;lvl=1;plays=0;result=null;parts=[];pops=[];}
function newPlay(){
  plays++; lvl=Math.min(7,1+Math.floor(outs/4));
  const p=params();
  coverT=p.cover; pressT=coverT+p.react;
  openLane=Math.floor(Math.random()*3);
  covered=[true,true,true]; covered[openLane]=false;
  // shuffle: random feint coverage before commit
  shuffle=[true,true,true]; shuffle[Math.floor(Math.random()*3)]=false; shuffleT=0;
  clock=0; acted=false; choice=-1; result=null; phase='read'; msg=''; resultT=0; passU=0; markerU=0;
}
function start(){ if(!ac())ac(); if(AC&&AC.state==='suspended')AC.resume(); reset(); state='play'; newPlay(); }

function lay(lane){
  if(state==='title'){start();return;}
  if(state==='over'){ if(resultT>0.4){reset();start();} return; }
  if(state!=='play'||phase!=='read'||acted) return;
  acted=true; choice=lane; passU=0;
  if(lane===openLane){ S.lay(); resolve('layoff'); }
  else { S.bad(); resolve('intercepted'); }
}

function resolve(kind){
  phase='result'; result=kind; resultT=0;
  const good=(kind==='layoff');
  if(good){
    outs++; combo++;
    let add=Math.round(120*(1+Math.min(9,combo-1)*0.16)); score+=add;
    flash=1;flashCol='#8affa0';shake=5; burst(LANES[openLane].x,LANES[openLane].y,'#8affa0',16,6);
    pop(LANES[openLane].x,LANES[openLane].y-28,'ナイス配球！ +'+add,'#d6ffe0');
    if(combo>=2)pop(450,300,'コンボ x'+combo,'#ffd24d');
    if(combo>0&&combo%5===0)S.streak();
    if(combo>0&&combo%3===0)S.chance();
    msg='空いた'+LNAME[openLane]+'へ的確にはたいた！ 好機を作った';
  } else {
    fails++; combo=0; flash=1;flashCol='#ff5b5b';shake=8;
    if(kind==='intercepted'){ msg='塞がれた'+LNAME[choice]+'へ…相手に引っかけた'; }
    else { S.steal(); msg='もたつき過ぎ…背後の相手に潰された'; }
    pop(FWD.x,FWD.y-40,kind==='dispossessed'?'ロスト':'カット','#ffb0b0');
  }
  if(fails>=3){ state='over'; resultT=0; S.over(); if(score>best){best=score;localStorage.setItem('holdup_best',best);} }
}

// ---------- input ----------
cv.addEventListener('pointerdown',e=>{e.preventDefault();
  if(state==='title'){start();return;}
  if(state==='over'){ if(resultT>0.4){reset();start();} return; }
  const r=cv.getBoundingClientRect(); const x=(e.clientX-r.left)/r.width;
  lay(x<0.34?0:x<0.66?1:2);
});
addEventListener('keydown',e=>{
  if(e.code==='ArrowLeft'||e.code==='KeyA'){e.preventDefault();lay(0);}
  else if(e.code==='ArrowDown'||e.code==='ArrowUp'||e.code==='KeyW'||e.code==='KeyS'){e.preventDefault();lay(1);}
  else if(e.code==='ArrowRight'||e.code==='KeyD'){e.preventDefault();lay(2);}
  else if(e.code==='Space'||e.code==='Enter'){e.preventDefault(); if(state!=='play')lay(1);}
});

// ---------- particles ----------
function burst(x,y,c,n,sp){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=rnd(sp*0.3,sp);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:1,c});}}
function pop(x,y,txt,c){pops.push({x,y,txt,c,life:1});}

// ---------- update ----------
function update(dt){
  shake*=Math.pow(0.86,dt/16.7); if(shake<0.3)shake=0;
  flash*=Math.pow(0.9,dt/16.7);
  for(const p of parts){p.vx*=0.96;p.vy=p.vy*0.96+0.28;p.x+=p.vx*dt/16.7;p.y+=p.vy*dt/16.7;p.life-=dt/16.7*0.026;}
  parts=parts.filter(p=>p.life>0);
  for(const p of pops){p.y-=dt/16.7*0.5;p.life-=dt/16.7*0.02;}
  pops=pops.filter(p=>p.life>0);

  if(state!=='play'){ if(state==='over')resultT+=dt/1000; return; }
  t+=dt;
  if(phase==='read'){
    clock+=dt; markerU=clamp(clock/pressT,0,1);
    // pre-commit feint shuffle
    if(clock<coverT){ shuffleT+=dt; if(shuffleT>Math.max(150,260-lvl*14)){ shuffleT=0;
      const openIdx=Math.floor(Math.random()*3); shuffle=[true,true,true]; shuffle[openIdx]=false; } }
    if(!acted && clock>=pressT){ resolve('dispossessed'); }
    return;
  }
  if(phase==='result'){
    resultT+=dt/1000; passU=Math.min(1,passU+dt/260);
    if(resultT>1.1 && state==='play') newPlay();
    return;
  }
}

// ---------- render ----------
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function drawScene(){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#2a7a38');g.addColorStop(1,'#18521f');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='rgba(255,255,255,0.035)';
  for(let i=0;i<7;i++){ if(i%2===0)ctx.fillRect(0,i*H/7,W,H/7); }
  ctx.strokeStyle='rgba(255,255,255,0.14)';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(60,90);ctx.lineTo(840,90);ctx.stroke();
}
function drawFig(x,y,col,s){ s=s||1; ctx.fillStyle='rgba(0,0,0,0.22)';ctx.beginPath();ctx.ellipse(x,y+12*s,10*s,3.5*s,0,0,6.28);ctx.fill();
  ctx.fillStyle=col;rr(x-8*s,y-10*s,16*s,24*s,6);ctx.fill();
  ctx.fillStyle='#f2c9a0';ctx.beginPath();ctx.arc(x,y-14*s,6*s,0,6.28);ctx.fill(); }

function render(){
  ctx.save();
  if(shake>0)ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
  drawScene();

  if(state==='play'){
    const committed = clock>=coverT || phase==='result';
    const cov = committed ? covered : shuffle;
    // passing lanes
    for(let i=0;i<3;i++){ const L=LANES[i];
      const blocked = cov[i];
      const isOpen = committed && !covered[i];
      ctx.strokeStyle = isOpen ? 'rgba(150,240,170,0.85)' : (blocked?'rgba(226,60,60,0.5)':'rgba(255,255,255,0.28)');
      ctx.lineWidth = isOpen?5:3; ctx.setLineDash(isOpen?[]:[8,8]);
      ctx.beginPath();ctx.moveTo(FWD.x,FWD.y-14);ctx.lineTo(L.x,L.y+16);ctx.stroke();ctx.setLineDash([]);
      // support runner
      drawFig(L.x,L.y,'#2b6cff',0.95);
      ctx.fillStyle='rgba(255,255,255,0.7)';ctx.font='12px sans-serif';ctx.textAlign='center';ctx.fillText(LNAME[i],L.x,L.y-26);
      // covering defender in blocked lanes (mid-lane)
      if(blocked){ const mx=lerp(FWD.x,L.x,0.52), my=lerp(FWD.y-14,L.y+16,0.52);
        drawFig(mx,my,'#e23c3c',0.9); }
      if(isOpen){ ctx.fillStyle='#9ff0b8';ctx.font='bold 13px sans-serif';ctx.fillText('空き！',L.x,L.y+40); }
    }

    // forward (you), back to goal
    drawFig(FWD.x,FWD.y,'#e2b23c',1.1);
    // marker behind
    const my=lerp(FWD.y+70,FWD.y+22,easeOut(markerU));
    drawFig(FWD.x,my,'#e23c3c',0.95);

    // ball
    if(phase==='read'){ ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(FWD.x+14,FWD.y+6,7,0,6.28);ctx.fill(); }
    else if(result==='layoff'){ const L=LANES[openLane];
      const bx=lerp(FWD.x,L.x,easeOut(passU)), by=lerp(FWD.y,L.y,easeOut(passU));
      ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(bx,by,7,0,6.28);ctx.fill(); }
    else if(result==='intercepted'){ const L=LANES[choice];
      const bx=lerp(FWD.x,lerp(FWD.x,L.x,0.52),easeOut(passU)), by=lerp(FWD.y,lerp(FWD.y,L.y,0.52),easeOut(passU));
      ctx.globalAlpha=clamp(1.2-resultT,0,1);ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(bx,by,7,0,6.28);ctx.fill();ctx.globalAlpha=1; }
    else { ctx.globalAlpha=clamp(1.2-resultT,0,1);ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(FWD.x+14,FWD.y+6,7,0,6.28);ctx.fill();ctx.globalAlpha=1; }

    // pressure timer bar under the forward
    const bw=150; ctx.fillStyle='rgba(0,0,0,0.3)';rr(FWD.x-bw/2-3,FWD.y+52,bw+6,10,5);ctx.fill();
    ctx.fillStyle= markerU>0.7?'#ff6b6b':'#ffd24d';rr(FWD.x-bw/2,FWD.y+54,bw*(1-markerU),6,3);ctx.fill();
  }

  for(const p of parts){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,3.2,0,6.28);ctx.fill();}
  ctx.globalAlpha=1;
  for(const p of pops){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.font='bold 22px sans-serif';ctx.textAlign='center';ctx.fillText(p.txt,p.x,p.y);}
  ctx.globalAlpha=1;

  // HUD
  ctx.textAlign='left';ctx.fillStyle='#fff';ctx.font='bold 26px sans-serif';ctx.fillText('SCORE '+score,20,36);
  ctx.textAlign='right';ctx.fillStyle='rgba(255,255,255,0.9)';ctx.font='14px sans-serif';ctx.fillText('配球 '+outs+'  Lv'+lvl,W-20,24);
  ctx.fillText('ロスト',W-100,46);
  for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(W-60+i*20,41,7,0,6.28);ctx.fillStyle=i<fails?'#ff5b5b':'rgba(255,255,255,0.25)';ctx.fill();}
  if(combo>=2){ctx.textAlign='center';ctx.fillStyle='#ffd24d';ctx.font='bold 18px sans-serif';ctx.fillText('コンボ x'+combo,W/2,300);}

  if(state==='play'&&phase==='read'){ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,0.9)';ctx.font='bold 15px sans-serif';
    ctx.fillText('相手が2レーンを塞ぐ。遅れて“空く1レーン”を見つけて素早くはたけ（左/中央/右）',W/2,44);}
  if(state==='play'&&phase==='result'&&msg){ctx.textAlign='center';ctx.fillStyle=(result==='layoff')?'#9ff0b8':'#ff9a9a';ctx.font='bold 20px sans-serif';ctx.fillText(msg,W/2,44);}

  if(state==='title'){
    ctx.fillStyle='rgba(5,12,7,0.78)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='bold 44px sans-serif';ctx.fillText('ポストプレー',W/2,110);
    ctx.fillStyle='#ffd23e';ctx.font='bold 22px sans-serif';ctx.fillText('Hold-Up Play',W/2,146);
    ctx.fillStyle='rgba(255,255,255,0.92)';ctx.font='16px sans-serif';
    ctx.fillText('楔を受けた的（ポスト）。背後の相手に潰される前に、味方へ的確にはたけ',W/2,196);
    ctx.fillStyle='rgba(255,255,255,0.66)';ctx.font='14px sans-serif';
    ctx.fillText('左・中央・右に味方が3人。相手が2レーンを塞ぎ、1レーンだけが“空く”',W/2,236);
    ctx.fillText('どのレーンが空くかは終盤に確定（それまでは揺さぶり）。空いた瞬間に素早くはたく',W/2,258);
    ctx.fillText('操作：左半分/←＝左、中央/↓＝中央、右半分/→＝右',W/2,280);
    ctx.fillText('塞がれたレーンへ出すとカット、もたつくと背後の相手にロスト＝失敗',W/2,302);
    ctx.fillText('連続成功でコンボ。上級ほど確定が遅く猶予が短い。3ロストで交代',W/2,324);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で開始',W/2,388);
    ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='14px sans-serif';ctx.fillText('BEST '+best,W/2,420);
  }
  if(state==='over'){
    ctx.fillStyle='rgba(5,12,7,0.84)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#ff6b6b';ctx.font='bold 46px sans-serif';ctx.fillText('3ロスト…交代',W/2,222);
    ctx.fillStyle='#fff';ctx.font='bold 40px sans-serif';ctx.fillText('SCORE '+score,W/2,290);
    ctx.fillStyle='rgba(255,255,255,0.85)';ctx.font='19px sans-serif';ctx.fillText('配球 '+outs+'   BEST '+best,W/2,330);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で もう一度',W/2,402);
  }

  if(flash>0.02){ctx.globalAlpha=flash*0.5;ctx.fillStyle=flashCol;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}
  ctx.restore();

  ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,0.4)';ctx.font='12px sans-serif';
  ctx.fillText('2レーンが塞がれ1レーンが空く。確定を見て空いた方（左/中央/右）へ素早くはたく。誤り/遅れは失敗。3ロストで交代',W/2,H-8);
}

function frame(ts){let dt=ts-last;last=ts;if(dt>60)dt=60;if(dt<0)dt=0;update(dt);render();requestAnimationFrame(frame);}
requestAnimationFrame(frame);

// ---------- test hook ----------
window.__hu={
  start, lay:(l)=>lay(l),
  get state(){return state;},
  get score(){return score;},
  get outs(){return outs;},
  get fails(){return fails;},
  get info(){return {state,phase,openLane,committed:(clock>=coverT),clock,coverT,pressT,
    canAct:(phase==='read'&&!acted),acted,choice,result,outs,fails,lvl};}
};
})();
</script>
</body>
</html>
