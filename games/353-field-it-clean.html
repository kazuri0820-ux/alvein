<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>正確に刺せ (Field It Clean)</title>
<style>
  html,body{margin:0;height:100%;background:#0a0d08;overflow:hidden;
    font-family:-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  #stage{position:relative;width:100vw;height:100vh;max-width:calc(100vh*1.5);max-height:calc(100vw/1.5);aspect-ratio:900/600;}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;border-radius:6px;}
</style>
</head>
<body>
<div id="wrap"><div id="stage"><canvas id="cv"></canvas></div></div>
<script>
(function(){
const W=900,H=600,cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let DPR=1;
function fit(){DPR=Math.min(2,window.devicePixelRatio||1);cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
fit();addEventListener('resize',fit);

// ---------- audio ----------
let AC=null;function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function tone(f,d,type,v,sweep){const a=ac();if(!a)return;const t=a.currentTime,o=a.createOscillator(),g=a.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(sweep)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+sweep),t+d);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v||0.2,t+0.008);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+0.02);}
function noise(d,v,hp){const a=ac();if(!a)return;const t=a.currentTime,n=Math.floor(a.sampleRate*d),buf=a.createBuffer(1,n,a.sampleRate),ch=buf.getChannelData(0);
  for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource();s.buffer=buf;
  const f=a.createBiquadFilter();f.type='highpass';f.frequency.value=hp||600;const g=a.createGain();g.gain.value=v||0.2;
  s.connect(f);f.connect(g);g.connect(a.destination);s.start(t);s.stop(t+d+0.02);}
const S={
  tick:()=>{tone(1200,0.015,'square',0.03);},
  fire:()=>{noise(0.05,0.14,400);tone(320,0.06,'square',0.09,140);},
  out:()=>{[620,880,1150].forEach((f,i)=>setTimeout(()=>tone(f,0.11,'triangle',0.16),i*54));},
  laser:()=>{noise(0.06,0.16,600);[560,820,1080,1360].forEach((f,i)=>setTimeout(()=>tone(f,0.12,'triangle',0.18),i*52));},
  err:()=>{noise(0.2,0.24,240);tone(150,0.28,'sawtooth',0.14,-60);},
  streak:()=>{[700,930,1170,1400].forEach((f,i)=>setTimeout(()=>tone(f,0.1,'triangle',0.16),i*60));},
  over:()=>{[440,330,247,175].forEach((f,i)=>setTimeout(()=>tone(f,0.3,'triangle',0.2),i*160));}
};

// ---------- geometry ----------
const FIELDER={x:352,y:262}, FIRST={x:726,y:392}, HOME={x:250,y:512};
const BARX=W/2-170, BARY=470, BARW=340, BARH=22;

// ---------- state ----------
let state='title', phase='aim', plays=0;
let score=0, combo=0, best=+(localStorage.getItem('fic_best')||0);
let outs=0, fails=0, lvl=1;   // outs = clean putouts
let clock=0, oscT=0, P=1000, hb=0.15, Tdl=1650;
let pos=0.5, released=false, relPos=0, result=null, resultT=0, msg='', msgOk=false, quality=0, gone=0;
let shake=0, flash=0, flashCol='#fff', last=performance.now(), lastTick=-1;
let parts=[], pops=[];

function rnd(a,b){return a+Math.random()*(b-a);}
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function lerp(a,b,u){return a+(b-a)*u;}
function easeOut(u){return 1-Math.pow(1-u,2);}

function reset(){state='title';score=0;combo=0;outs=0;fails=0;lvl=1;plays=0;result=null;parts=[];pops=[];}

function newPlay(){
  plays++; lvl=Math.min(7,1+Math.floor(outs/4));
  P=clamp(1250-lvl*45,940,1250);
  hb=clamp(0.23-lvl*0.009,0.17,0.23);
  Tdl=clamp(2000-lvl*80,1400,2000);
  phase='aim'; clock=0; oscT=rnd(0,P); pos=0.5; released=false; relPos=0; result=null; resultT=0; msg=''; msgOk=false; quality=0; gone=0;
}
function start(){ if(!ac())ac(); if(AC&&AC.state==='suspended')AC.resume(); reset(); state='play'; newPlay(); }

function fire(){
  if(state==='title'){start();return;}
  if(state==='over'){ if(resultT>0.4){reset();start();} return; }
  if(state!=='play'||phase!=='aim'||released) return;
  released=true; relPos=pos; S.fire();
  const off=Math.abs(pos-0.5);
  if(off<=hb){ quality=1-off/hb; resolve('out'); }
  else resolve('wild');
}

function resolve(k){
  phase='result'; result=k; resultT=0; gone=0;
  if(k==='out'){
    outs++; combo++;
    const perfect=quality>=0.72;
    let add=Math.round((perfect?240:130)*(1+Math.min(9,combo-1)*0.14)); score+=add;
    setTimeout(perfect?S.laser:S.out,90); if(perfect)setTimeout(S.streak,0);
    msgOk=true; flash=1;flashCol='#8affa0';shake=5; burst(FIRST.x,FIRST.y,'#8affa0',14,6);
    pop(W/2,150,(perfect?'ど真ん中へ矢のような送球！アウト！ +':'正確な送球でアウト！ +')+add,'#d6ffe0');
    if(combo>=2&&!perfect)pop(W/2,112,'コンボ x'+combo,'#ffd24d');
    msg=perfect?'一塁手の胸元へピンポイント——危なげなくアウト！':'落ち着いて一塁へ正確に送球——確実にアウトを取った';
  } else {
    fails++; combo=0; msgOk=false; flash=1;flashCol='#ff5b5b';shake=8; S.err();
    if(k==='late') msg='投げ遅れ…送球をためらううちに打者走者が一塁を駆け抜けた（セーフ）';
    else msg=(relPos<0.5)?'逸れた…送球が一塁手の内側へ逸れ、ベースから引き離されてセーフ（悪送球）':'逸れた…送球が大きく逸れる悪送球——走者は二塁まで進んだ';
    pop(W/2,150,(k==='late')?'投げ遅れ…セーフ':'悪送球…','#ffb0b0');
  }
  if(fails>=3){ state='over'; resultT=0; S.over(); if(score>best){best=score;localStorage.setItem('fic_best',best);} }
}

// ---------- input ----------
cv.addEventListener('pointerdown',e=>{e.preventDefault();fire();});
addEventListener('keydown',e=>{ if(e.repeat)return;
  if(e.code==='Space'||e.code==='Enter'||e.code==='ArrowUp'||e.code==='KeyF'||e.code==='KeyJ'){e.preventDefault();fire();} });

// ---------- particles ----------
function burst(x,y,c,n,sp){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=rnd(sp*0.3,sp);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:1,c});}}
function pop(x,y,txt,c){pops.push({x,y,txt,c,life:1});}

// ---------- update ----------
function update(dt){
  shake*=Math.pow(0.86,dt/16.7); if(shake<0.3)shake=0;
  flash*=Math.pow(0.9,dt/16.7);
  for(const q of parts){q.vx*=0.96;q.vy=q.vy*0.96+0.28;q.x+=q.vx*dt/16.7;q.y+=q.vy*dt/16.7;q.life-=dt/16.7*0.026;}
  parts=parts.filter(q=>q.life>0);
  for(const q of pops){q.y-=dt/16.7*0.5;q.life-=dt/16.7*0.02;}
  pops=pops.filter(q=>q.life>0);

  if(state!=='play'){ if(state==='over')resultT+=dt/1000; return; }
  if(phase==='aim'){ clock+=dt; oscT+=dt;
    const ph=(oscT%P)/P; pos=1-Math.abs(2*ph-1);   // triangle sweep 0->1->0
    const inb=Math.abs(pos-0.5)<=hb; const tk=inb?1:0; if(tk!==lastTick){lastTick=tk; if(inb)S.tick();}
    if(!released && clock>=Tdl){ released=true; relPos=pos; resolve('late'); }
    return; }
  if(phase==='result'){ resultT+=dt/1000; gone=Math.min(1,gone+dt/420);
    if(resultT>1.4) newPlay(); return; }
}

// ---------- render ----------
function drawScene(){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#22406b');g.addColorStop(0.4,'#2c7a3b');g.addColorStop(1,'#1c5233');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  // infield dirt
  ctx.fillStyle='#7a5230';ctx.beginPath();ctx.moveTo(HOME.x,HOME.y);ctx.lineTo(FIRST.x+40,FIRST.y);ctx.lineTo(520,150);ctx.lineTo(HOME.x-30,320);ctx.closePath();ctx.fill();
  // basepath home->first
  ctx.strokeStyle='rgba(255,255,255,0.4)';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(HOME.x,HOME.y);ctx.lineTo(FIRST.x,FIRST.y);ctx.stroke();
  // first base
  ctx.save();ctx.translate(FIRST.x,FIRST.y);ctx.rotate(0.785);ctx.fillStyle='#eef0f2';ctx.fillRect(-12,-12,24,24);ctx.restore();
  // home plate
  ctx.fillStyle='#eef0f2';ctx.beginPath();ctx.moveTo(HOME.x-12,HOME.y-6);ctx.lineTo(HOME.x+12,HOME.y-6);ctx.lineTo(HOME.x+12,HOME.y+2);ctx.lineTo(HOME.x,HOME.y+11);ctx.lineTo(HOME.x-12,HOME.y+2);ctx.closePath();ctx.fill();
}
function figure(x,y,col,sc,lean){ sc=sc||1;lean=lean||0;
  ctx.fillStyle='rgba(0,0,0,0.22)';ctx.beginPath();ctx.ellipse(x,y+13*sc,12*sc,4*sc,0,0,6.28);ctx.fill();
  ctx.save();ctx.translate(x,y);ctx.rotate(lean);
  ctx.fillStyle=col;ctx.beginPath();ctx.ellipse(0,-15*sc,10*sc,15*sc,0,0,6.28);ctx.fill();
  ctx.fillStyle='#f0c9a0';ctx.beginPath();ctx.arc(0,-34*sc,7.5*sc,0,6.28);ctx.fill();
  ctx.restore();
}

function render(){
  ctx.save();
  if(shake>0)ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
  drawScene();

  if(state==='play'||state==='over'){
    // batter-runner toward first (the deadline)
    let ru=(phase==='aim')?clamp(clock/Tdl,0,1):((result==='out')?Math.min(0.82, clamp((released?clock:Tdl)/Tdl,0,1)) : clamp(0.86+gone*0.2,0,1));
    const rx=lerp(HOME.x,FIRST.x-14,easeOut(ru)), ry=lerp(HOME.y,FIRST.y+2,easeOut(ru));
    figure(rx,ry,'#ff8a3a',0.9);
    // first baseman
    const off=(phase==='result'&&result==='wild'&&relPos<0.5);
    figure(FIRST.x+16+(off?-24:0),FIRST.y-8,'#3aa0ff',0.92,off?-0.3:0);
    // you (fielder) — just fielded the grounder
    figure(FIELDER.x,FIELDER.y,'#3aa0ff',1.0,(phase==='result')?-0.2:0);

    // the throw
    let bx=FIELDER.x+8, by=FIELDER.y-16;
    if(phase==='result'){
      const u=easeOut(gone);
      if(result==='out'){ bx=lerp(FIELDER.x+8,FIRST.x,u); by=lerp(FIELDER.y-16,FIRST.y-8,u)-Math.sin(u*Math.PI)*16; }
      else if(result==='late'){ bx=lerp(FIELDER.x+8,FIRST.x,u); by=lerp(FIELDER.y-16,FIRST.y-8,u); }
      else { const wide=(relPos-0.5); bx=lerp(FIELDER.x+8,FIRST.x+wide*260,u); by=lerp(FIELDER.y-16,FIRST.y-8-Math.abs(wide)*40,u); }  // errant
    }
    if(phase!=='aim'||released){ ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(bx,by,7,0,6.28);ctx.fill();
      ctx.strokeStyle='#c33';ctx.lineWidth=1;ctx.beginPath();ctx.arc(bx,by,7,0.4,2.2);ctx.stroke(); }

    // aim bar
    if(state==='play'&&(phase==='aim'||phase==='result')){
      ctx.textAlign='center';
      if(phase==='aim'){ctx.fillStyle='rgba(255,255,255,0.92)';ctx.font='bold 16px sans-serif';ctx.fillText('往復する照準が緑（一塁手の胸元）に来た瞬間にタップ＝正確な送球',W/2,BARY-22);}
      ctx.fillStyle='rgba(0,0,0,0.35)';rr(BARX-6,BARY-6,BARW+12,BARH+12,8);ctx.fill();
      // full bar (off-target zones)
      ctx.fillStyle='rgba(255,120,110,0.20)';ctx.fillRect(BARX,BARY,BARW,BARH);
      // green band
      const gx0=BARX+BARW*(0.5-hb), gw=BARW*(2*hb);
      ctx.fillStyle='rgba(140,255,160,0.30)';ctx.fillRect(gx0,BARY,gw,BARH);
      ctx.strokeStyle='rgba(140,255,160,0.85)';ctx.lineWidth=2;ctx.strokeRect(gx0,BARY,gw,BARH);
      // center tick
      ctx.strokeStyle='rgba(255,255,255,0.5)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(BARX+BARW*0.5,BARY-3);ctx.lineTo(BARX+BARW*0.5,BARY+BARH+3);ctx.stroke();
      ctx.strokeStyle='rgba(255,255,255,0.4)';ctx.lineWidth=1;ctx.strokeRect(BARX,BARY,BARW,BARH);
      // marker
      const mpos=(phase==='aim')?pos:relPos;
      const mx=BARX+BARW*mpos; const inb=Math.abs(mpos-0.5)<=hb;
      ctx.fillStyle=inb?'#8fe0a0':'#ff7a7a';ctx.fillRect(mx-3,BARY-6,6,BARH+12);
      // labels
      ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='11px sans-serif';
      ctx.fillText('内へ逸れる',BARX+40,BARY+BARH+16);ctx.fillText('大きく逸れる',BARX+BARW-44,BARY+BARH+16);
      // deadline bar (runner)
      if(phase==='aim'){ const rw=BARW*0.7, rmx=W/2-rw/2, rmy=BARY-40;
        ctx.fillStyle='rgba(0,0,0,0.3)';rr(rmx,rmy,rw,7,3);ctx.fill();
        ctx.fillStyle='#ff8a3a';rr(rmx,rmy,rw*clamp(clock/Tdl,0,1),7,3);ctx.fill(); }
    }
  }

  for(const q of parts){ctx.globalAlpha=Math.max(0,q.life);ctx.fillStyle=q.c;ctx.beginPath();ctx.arc(q.x,q.y,3.2,0,6.28);ctx.fill();}
  ctx.globalAlpha=1;
  for(const q of pops){ctx.globalAlpha=Math.max(0,q.life);ctx.fillStyle=q.c;ctx.font='bold 21px sans-serif';ctx.textAlign='center';ctx.fillText(q.txt,q.x,q.y);}
  ctx.globalAlpha=1;

  // HUD
  ctx.textAlign='left';ctx.fillStyle='#fff';ctx.font='bold 26px sans-serif';ctx.fillText('SCORE '+score,20,36);
  ctx.textAlign='right';ctx.fillStyle='rgba(255,255,255,0.9)';ctx.font='14px sans-serif';ctx.fillText('アウト '+outs+'  Lv'+lvl,W-20,24);
  ctx.fillText('失策',W-92,46);
  for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(W-60+i*20,41,7,0,6.28);ctx.fillStyle=i<fails?'#ff5b5b':'rgba(255,255,255,0.25)';ctx.fill();}
  if(combo>=2){ctx.textAlign='center';ctx.fillStyle='#ffd24d';ctx.font='bold 18px sans-serif';ctx.fillText('コンボ x'+combo,W/2,86);}

  if(state==='play'&&phase==='result'&&msg){ctx.textAlign='center';ctx.fillStyle=msgOk?'#9ff0b8':'#ffb38a';ctx.font='bold 16px sans-serif';ctx.fillText(msg,W/2,352);}

  if(state==='title'){
    ctx.fillStyle='rgba(6,9,6,0.82)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='bold 42px sans-serif';ctx.fillText('正確に刺せ',W/2,92);
    ctx.fillStyle='#ffd23e';ctx.font='bold 22px sans-serif';ctx.fillText('Field It Clean',W/2,128);
    ctx.fillStyle='rgba(255,255,255,0.92)';ctx.font='16px sans-serif';
    ctx.fillText('凡ゴロを捌いた——あとは一塁へ“正確に”送球するだけ。往復する照準を止めて確実にアウトを取れ',W/2,182);
    ctx.fillStyle='rgba(255,255,255,0.66)';ctx.font='14px sans-serif';
    ctx.fillText('照準バーが左右に往復——緑の帯（一塁手の胸元）に来た瞬間にタップ/クリック/SPACE＝正確な送球でアウト',W/2,220);
    ctx.fillText('帯を外すと送球が逸れる悪送球＝失策（内側なら引き離されてセーフ／大きく逸れると走者は進塁）',W/2,244);
    ctx.fillText('迷って投げ遅れる（走者バーが満タン）とセーフ。ど真ん中の胸元へはレーザー送球で大量加点',W/2,268);
    ctx.fillText('上級ほど照準が速く緑の帯が狭い。3失策で交代',W/2,292);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で開始',W/2,360);
    ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='14px sans-serif';ctx.fillText('BEST '+best,W/2,392);
  }
  if(state==='over'){
    ctx.fillStyle='rgba(6,9,6,0.85)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#ff6b6b';ctx.font='bold 46px sans-serif';ctx.fillText('3失策…交代',W/2,222);
    ctx.fillStyle='#fff';ctx.font='bold 40px sans-serif';ctx.fillText('SCORE '+score,W/2,290);
    ctx.fillStyle='rgba(255,255,255,0.85)';ctx.font='19px sans-serif';ctx.fillText('アウト '+outs+'   BEST '+best,W/2,330);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で もう一度',W/2,402);
  }

  if(flash>0.02){ctx.globalAlpha=flash*0.5;ctx.fillStyle=flashCol;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}
  ctx.restore();

  ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,0.4)';ctx.font='12px sans-serif';
  ctx.fillText('正確に刺せ：往復する照準を緑（一塁手の胸元）で止めて正確な送球＝アウト。外すと悪送球・投げ遅れはセーフ、3失策で交代',W/2,H-8);
}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

function frame(ts){let dt=ts-last;last=ts;if(dt>60)dt=60;if(dt<0)dt=0;update(dt);render();requestAnimationFrame(frame);}
requestAnimationFrame(frame);

// ---------- test hook ----------
window.__fic={
  start, fire,
  get state(){return state;},
  get score(){return score;},
  get outs(){return outs;},
  get fails(){return fails;},
  get info(){return {state,phase,pos,bandLo:0.5-hb,bandHi:0.5+hb,hb,clock,Tdl,released,result,outs,fails,lvl,
    canAct:(phase==='aim'&&!released)};}
};
})();
</script>
</body>
</html>
