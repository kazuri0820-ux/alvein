<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>フェイクを見切れ (Don't Buy the Fake)</title>
<style>
  html,body{margin:0;height:100%;background:#07120b;overflow:hidden;
    font-family:-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  #stage{position:relative;width:100vw;height:100vh;max-width:calc(100vh*1.5);max-height:calc(100vw/1.5);aspect-ratio:900/600;}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;border-radius:6px;}
</style>
</head>
<body>
<div id="wrap"><div id="stage"><canvas id="cv"></canvas></div></div>
<script>
(function(){
const W=900,H=600,cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let DPR=1;
function fit(){DPR=Math.min(2,window.devicePixelRatio||1);cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
fit();addEventListener('resize',fit);

// ---------- audio ----------
let AC=null;function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function tone(f,d,type,v,sweep){const a=ac();if(!a)return;const t=a.currentTime,o=a.createOscillator(),g=a.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(sweep)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+sweep),t+d);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v||0.2,t+0.008);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+0.02);}
function noise(d,v,hp){const a=ac();if(!a)return;const t=a.currentTime,n=Math.floor(a.sampleRate*d),buf=a.createBuffer(1,n,a.sampleRate),ch=buf.getChannelData(0);
  for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource();s.buffer=buf;
  const f=a.createBiquadFilter();f.type='highpass';f.frequency.value=hp||600;const g=a.createGain();g.gain.value=v||0.2;
  s.connect(f);f.connect(g);g.connect(a.destination);s.start(t);s.stop(t+d+0.02);}
const S={
  set:()=>{tone(300,0.06,'sine',0.05);},
  strike:()=>{noise(0.05,0.14,500);tone(300,0.05,'square',0.09,-40);},
  block:()=>{noise(0.06,0.2,400);tone(240,0.07,'square',0.1,-40);},
  good:()=>{[680,940,1220].forEach((f,i)=>setTimeout(()=>tone(f,0.1,'triangle',0.16),i*55));},
  big:()=>{[600,800,1000,1250].forEach((f,i)=>setTimeout(()=>tone(f,0.12,'triangle',0.17),i*80));},
  bad:()=>{noise(0.18,0.22,300);tone(160,0.22,'sawtooth',0.12,-50);},
  streak:()=>{[700,930,1170,1400].forEach((f,i)=>setTimeout(()=>tone(f,0.1,'triangle',0.16),i*60));},
  over:()=>{[440,330,247,175].forEach((f,i)=>setTimeout(()=>tone(f,0.3,'triangle',0.2),i*160));}
};

// ---------- geometry ----------
const GOAL_L=352, GOAL_R=548, GOAL_Y=100, GTOP=48;
const DEF={x:452,y:334}, SHOOT={x:452,y:456};

// ---------- state ----------
let state='title', phase='read', plays=0;
let score=0, combo=0, best=+(localStorage.getItem('fb_best')||0);
let outs=0, fails=0, lvl=1;   // outs = good reads (block or held)
let clock=0, revealT=520, callWin=980, kind='shot', tough=false, fdir=1;
let decided=false, result=null, resultT=0, msg='', msgOk=false, anim=0;
let shake=0, flash=0, flashCol='#fff', last=performance.now();
let parts=[], pops=[];

function rnd(a,b){return a+Math.random()*(b-a);}
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function lerp(a,b,u){return a+(b-a)*u;}
function easeOut(u){return 1-Math.pow(1-u,2);}

function reset(){state='title';score=0;combo=0;outs=0;fails=0;lvl=1;plays=0;result=null;parts=[];pops=[];}

function newPlay(){
  plays++; lvl=Math.min(7,1+Math.floor(outs/4));
  revealT=clamp(560-lvl*24,360,560);
  callWin=clamp(1020-lvl*70,560,1020);
  tough=Math.random()<clamp(0.2+lvl*0.05,0.2,0.5);
  kind=(Math.random()<0.5?'shot':'fake');
  fdir=Math.random()<0.5?-1:1;   // which way he cuts on a fake / shades a shot
  phase='read'; clock=0; decided=false; result=null; resultT=0; msg=''; msgOk=false; anim=0;
  S.set();
}
function start(){ if(!ac())ac(); if(AC&&AC.state==='suspended')AC.resume(); reset(); state='play'; newPlay(); }

function block(){   // tap = commit to the block (slide in)
  if(state==='title'){start();return;}
  if(state==='over'){ if(resultT>0.4){reset();start();} return; }
  if(state!=='play'||phase!=='read'||decided) return;
  decided=true;
  if(clock<revealT){ resolve('early'); return; }        // committed before he showed his hand
  if(kind==='shot'){ resolve('block'); }                // reacted to the real shot -> block
  else { resolve('bit'); }                              // dove on the fake -> beaten
}

function resolve(k){
  phase='result'; result=k; resultT=0; anim=0;
  const good=(k==='block'||k==='held');
  if(good){
    outs++; combo++;
    let add=Math.round(((k==='block'&&tough)?250:150)*(1+Math.min(9,combo-1)*0.14)); score+=add;
    if(k==='block')S.block(); setTimeout(S.good,120); if(k==='block'&&tough)setTimeout(S.big,180);
    msgOk=true; flash=1;flashCol='#8affa0';shake=k==='block'?7:4; burst(DEF.x,DEF.y-10,'#8affa0',14,6);
    pop(W/2,250,(k==='block'?(tough?'鋭いシュートを読んで体でブロック！ +':'シュートを見切って体を張った！ +'):'飛び込まず我慢——好守！ +')+add,'#d6ffe0');
    if(combo>=2)pop(W/2,214,'コンボ x'+combo,'#ffd24d');
    if(combo>0&&combo%5===0)S.streak();
    msg=(k==='block')?'本物のシュートを見極めて前に入り、体を張ってブロック——決定機を防いだ！':'シュートフェイクに乗らず前に立ち塞ぎ、相手を持たせて封じた（好判断）';
  } else {
    fails++; combo=0; msgOk=false; flash=1;flashCol='#ff5b5b';shake=9; S.bad();
    if(k==='bit') msg='飛び込んだ…シュートフェイクに乗って前に出てしまい、横をすり抜けられて決定機';
    else if(k==='conceded') msg='見送り…本物のシュートに反応できず、そのままゴールへ流し込まれた';
    else msg='早い…読む前に飛び込んで、逆を取られてかわされた';
    pop(W/2,250,(k==='bit')?'かわされた…':(k==='conceded')?'撃たれた…':'早すぎ…','#ffb0b0');
  }
  if(fails>=3){ state='over'; resultT=0; S.over(); if(score>best){best=score;localStorage.setItem('fb_best',best);} }
}

// ---------- input ----------
cv.addEventListener('pointerdown',e=>{e.preventDefault();block();});
addEventListener('keydown',e=>{ if(e.repeat)return;
  if(e.code==='Space'||e.code==='Enter'||e.code==='ArrowUp'||e.code==='ArrowDown'||e.code==='KeyF'||e.code==='KeyJ'){e.preventDefault();block();} });

// ---------- particles ----------
function burst(x,y,c,n,sp){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=rnd(sp*0.3,sp);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:1,c});}}
function pop(x,y,txt,c){pops.push({x,y,txt,c,life:1});}

// ---------- update ----------
function update(dt){
  shake*=Math.pow(0.86,dt/16.7); if(shake<0.3)shake=0;
  flash*=Math.pow(0.9,dt/16.7);
  for(const p of parts){p.vx*=0.96;p.vy=p.vy*0.96+0.28;p.x+=p.vx*dt/16.7;p.y+=p.vy*dt/16.7;p.life-=dt/16.7*0.026;}
  parts=parts.filter(p=>p.life>0);
  for(const p of pops){p.y-=dt/16.7*0.5;p.life-=dt/16.7*0.02;}
  pops=pops.filter(p=>p.life>0);

  if(state!=='play'){ if(state==='over')resultT+=dt/1000; return; }
  if(phase==='read'){ clock+=dt;
    if(clock>=revealT) anim=Math.min(1,anim+dt/300);
    if(!decided && clock>revealT+callWin){ decided=true; resolve(kind==='shot'?'conceded':'held'); }
    return; }
  if(phase==='result'){ resultT+=dt/1000; anim=Math.min(1,anim+dt/360); if(resultT>1.6) newPlay(); return; }
}

// ---------- render ----------
function drawField(){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#12703f');g.addColorStop(0.5,'#0f5e34');g.addColorStop(1,'#0c4c2b');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  for(let i=0;i<7;i++){ctx.fillStyle=i%2?'rgba(255,255,255,0.03)':'rgba(0,0,0,0.03)';ctx.fillRect(0,GOAL_Y+i*72,W,72);}
  ctx.strokeStyle='rgba(255,255,255,0.2)';ctx.lineWidth=2;ctx.strokeRect(292,GOAL_Y,316,150);
  // goal
  ctx.fillStyle='rgba(255,255,255,0.07)';ctx.fillRect(GOAL_L,GTOP,GOAL_R-GOAL_L,GOAL_Y-GTOP);
  ctx.strokeStyle='rgba(255,255,255,0.28)';ctx.lineWidth=1;
  for(let x=GOAL_L;x<=GOAL_R;x+=14){ctx.beginPath();ctx.moveTo(x,GTOP);ctx.lineTo(x,GOAL_Y);ctx.stroke();}
  ctx.strokeStyle='#f4f4f4';ctx.lineWidth=5;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(GOAL_L,GOAL_Y);ctx.lineTo(GOAL_L,GTOP);ctx.lineTo(GOAL_R,GTOP);ctx.lineTo(GOAL_R,GOAL_Y);ctx.stroke();ctx.lineCap='butt';
}
function person(x,y,col,s,lean){s=s||1;lean=lean||0;
  ctx.save();ctx.translate(x,y);ctx.rotate(lean);
  ctx.fillStyle=col;ctx.beginPath();ctx.ellipse(0,-15*s,10*s,15*s,0,0,6.28);ctx.fill();
  ctx.fillStyle='#f0c9a0';ctx.beginPath();ctx.arc(0,-34*s,7.5*s,0,6.28);ctx.fill();
  ctx.restore();
}

function render(){
  ctx.save();
  if(shake>0)ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
  drawField();

  if(state==='play'||state==='over'){
    const revealed=(phase==='read'&&clock>=revealT)||phase==='result';

    // GK on the line
    person(452,GOAL_Y+6,'#e8b23a',0.8);

    // defender (you): slides in to block, or holds his ground
    let dxo=0,dyo=0,dlean=0;
    if(phase==='result'){
      if(result==='block'){ const u=easeOut(anim); dyo=lerp(0,52,u); }                 // steps into the lane
      else if(result==='bit'||result==='early'){ const u=easeOut(anim); dyo=lerp(0,58,u); dxo=lerp(0,fdir*20,u); dlean=fdir*0.4*u; }  // committed, got skipped
    }
    person(DEF.x+dxo,DEF.y+dyo,'#2b6fd6',1.0,dlean);

    // shooter
    let sLean=0;
    if(revealed){ if(kind==='shot') sLean=-0.5*anim; else sLean=fdir*0.4*anim; }
    person(SHOOT.x,SHOOT.y,'#c23a3a',0.98,sLean);

    // ball
    let bx=SHOOT.x-2, by=SHOOT.y-14;
    if(revealed){
      const u=easeOut(anim);
      if(kind==='shot'){
        if(result==='block'){ bx=lerp(SHOOT.x-2,DEF.x,u); by=lerp(SHOOT.y-14,DEF.y-8,u); }        // hits the block
        else { bx=lerp(SHOOT.x-2,452,u); by=lerp(SHOOT.y-14,GOAL_Y-16,u); }                        // conceded -> into the net
      } else {
        // fake: he pulls it to the side; on a bite he then goes past
        const pull=lerp(SHOOT.x-2,SHOOT.x+fdir*40,Math.min(1,anim*1.6));
        if(result==='bit'||result==='early'){ bx=lerp(pull,SHOOT.x+fdir*70,u); by=lerp(SHOOT.y-14,DEF.y-30,u); }
        else { bx=pull; by=SHOOT.y-14; }                                                          // held: still at his feet
      }
    }
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(bx,by,7.5,0,6.28);ctx.fill();
    ctx.strokeStyle='#222';ctx.lineWidth=1.1;ctx.beginPath();ctx.arc(bx,by,7.5,0.3,2.0);ctx.stroke();

    // reveal tell
    if(revealed){
      ctx.textAlign='center';
      ctx.fillStyle=kind==='shot'?'rgba(255,120,95,0.98)':'rgba(120,205,255,0.98)';ctx.font='bold 20px sans-serif';
      ctx.fillText(kind==='shot'?'本物のシュート！':'シュートフェイク！', W/2, 250);
    }

    // cue banner + timer
    ctx.textAlign='center';
    if(state==='play'&&phase==='read'){
      if(clock<revealT){ ctx.fillStyle='rgba(255,220,90,0.95)';ctx.font='bold 20px sans-serif';ctx.fillText('最後の砦——シュートか、フェイクか見極めろ',W/2,44); }
      else { ctx.fillStyle='rgba(255,220,120,0.98)';ctx.font='bold 22px sans-serif';ctx.fillText(kind==='shot'?'シュートだ！ 体を張ってブロック！':'フェイクだ！ 飛び込むな！',W/2,44);
        const p=clamp((clock-revealT)/callWin,0,1),bw=250,x=W/2-bw/2,y=60;
        ctx.fillStyle='rgba(255,255,255,0.18)';ctx.fillRect(x,y,bw,7);ctx.fillStyle=p<0.7?'#8affa0':(p<1?'#ffd24d':'#ff5b5b');ctx.fillRect(x,y,bw*p,7); }
    }

    if(state==='play'&&phase==='read'){
      ctx.fillStyle='rgba(255,255,255,0.55)';ctx.font='12px sans-serif';ctx.textAlign='center';
      ctx.fillText('タップ / SPACE ＝ 飛び込んでブロック ／ フェイクには“何もしない”で我慢',W/2,H-26);
    }
  }

  for(const p of parts){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,3.2,0,6.28);ctx.fill();}
  ctx.globalAlpha=1;
  for(const p of pops){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.font='bold 21px sans-serif';ctx.textAlign='center';ctx.fillText(p.txt,p.x,p.y);}
  ctx.globalAlpha=1;

  // HUD
  ctx.textAlign='left';ctx.fillStyle='#fff';ctx.font='bold 26px sans-serif';ctx.fillText('SCORE '+score,20,36);
  ctx.textAlign='right';ctx.fillStyle='rgba(255,255,255,0.9)';ctx.font='14px sans-serif';ctx.fillText('好守 '+outs+'  Lv'+lvl,W-20,24);
  ctx.fillText('失敗',W-92,46);
  for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(W-60+i*20,41,7,0,6.28);ctx.fillStyle=i<fails?'#ff5b5b':'rgba(255,255,255,0.25)';ctx.fill();}
  if(combo>=2){ctx.textAlign='center';ctx.fillStyle='#ffd24d';ctx.font='bold 18px sans-serif';ctx.fillText('コンボ x'+combo,W/2,112);}

  if(state==='play'&&phase==='result'&&msg){ctx.textAlign='center';ctx.fillStyle=msgOk?'#9ff0b8':'#ff9a9a';ctx.font='bold 15px sans-serif';ctx.fillText(msg,W/2,300);}

  if(state==='title'){
    ctx.fillStyle='rgba(4,8,4,0.84)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='bold 40px sans-serif';ctx.fillText('フェイクを見切れ',W/2,82);
    ctx.fillStyle='#ffd23e';ctx.font='bold 22px sans-serif';ctx.fillText("Don't Buy the Fake",W/2,118);
    ctx.fillStyle='rgba(255,255,255,0.92)';ctx.font='16px sans-serif';
    ctx.fillText('最後の砦のDFとして、相手の仕掛けが“本物のシュート”か“シュートフェイク”かを見極めて対応しろ',W/2,176);
    ctx.fillStyle='rgba(255,255,255,0.66)';ctx.font='14px sans-serif';
    ctx.fillText('本物のシュート＝タップ/SPACEで飛び込み、体を張ってブロック（決定機を防ぐ）',W/2,214);
    ctx.fillText('シュートフェイク＝“何もしない”で我慢（飛び込むと横をすり抜けられて決定機）',W/2,238);
    ctx.fillText('見極める前に飛び込む＝早すぎで逆を取られる／シュートに反応できず見送る＝失点',W/2,262);
    ctx.fillText('鋭いシュートを読んでブロックすると大量加点。上級ほど速く猶予が短い。3失敗で交代',W/2,286);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で開始',W/2,354);
    ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='14px sans-serif';ctx.fillText('BEST '+best,W/2,386);
  }
  if(state==='over'){
    ctx.fillStyle='rgba(4,8,4,0.86)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#ff6b6b';ctx.font='bold 46px sans-serif';ctx.fillText('3失敗…交代',W/2,222);
    ctx.fillStyle='#fff';ctx.font='bold 40px sans-serif';ctx.fillText('SCORE '+score,W/2,290);
    ctx.fillStyle='rgba(255,255,255,0.85)';ctx.font='19px sans-serif';ctx.fillText('好守 '+outs+'   BEST '+best,W/2,330);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で もう一度',W/2,402);
  }

  if(flash>0.02){ctx.globalAlpha=flash*0.5;ctx.fillStyle=flashCol;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}
  ctx.restore();

  ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,0.4)';ctx.font='12px sans-serif';
  ctx.fillText('フェイクを見切れ：本物のシュートは飛び込んでブロック、シュートフェイクは飛び込まず我慢。早い/逆/見送りは失敗、3失敗で交代',W/2,H-8);
}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

function frame(ts){let dt=ts-last;last=ts;if(dt>60)dt=60;if(dt<0)dt=0;update(dt);render();requestAnimationFrame(frame);}
requestAnimationFrame(frame);

// ---------- test hook ----------
window.__fb={
  start, block:()=>block(),
  get state(){return state;},
  get score(){return score;},
  get outs(){return outs;},
  get fails(){return fails;},
  get info(){return {state,phase,clock,revealT,callWin,kind,tough,decided,result,outs,fails,lvl,
    revealed:(clock>=revealT),canAct:(phase==='read'&&!decided)};}
};
})();
</script>
</body>
</html>
