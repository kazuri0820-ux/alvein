<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>配球 (Call the Game)</title>
<style>
  html,body{margin:0;height:100%;background:#0a0f18;overflow:hidden;
    font-family:-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  #stage{position:relative;width:100vw;height:100vh;max-width:calc(100vh*1.5);max-height:calc(100vw/1.5);aspect-ratio:900/600;}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;border-radius:6px;}
</style>
</head>
<body>
<div id="wrap"><div id="stage"><canvas id="cv"></canvas></div></div>
<script>
(function(){
const W=900,H=600,cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let DPR=1;
function fit(){DPR=Math.min(2,window.devicePixelRatio||1);cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
fit();addEventListener('resize',fit);

// ---------- audio ----------
let AC=null;function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function tone(f,d,type,v,sweep){const a=ac();if(!a)return;const t=a.currentTime,o=a.createOscillator(),g=a.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(sweep)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+sweep),t+d);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v||0.2,t+0.008);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+0.02);}
function noise(d,v,hp){const a=ac();if(!a)return;const t=a.currentTime,n=Math.floor(a.sampleRate*d),buf=a.createBuffer(1,n,a.sampleRate),ch=buf.getChannelData(0);
  for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource();s.buffer=buf;
  const f=a.createBiquadFilter();f.type='highpass';f.frequency.value=hp||600;const g=a.createGain();g.gain.value=v||0.2;
  s.connect(f);f.connect(g);g.connect(a.destination);s.start(t);s.stop(t+d+0.02);}
const S={
  swing:()=>{noise(0.06,0.16,700);},
  whiff:()=>{noise(0.12,0.2,600);tone(210,0.14,'sawtooth',0.12,-70);},
  mitt:()=>{noise(0.05,0.22,1300);tone(420,0.05,'square',0.1);},
  called:()=>{tone(360,0.11,'triangle',0.13);},
  ball:()=>{tone(540,0.09,'sine',0.11);},
  hit:()=>{noise(0.05,0.3,1200);tone(230,0.13,'square',0.2,300);setTimeout(()=>tone(150,0.16,'sawtooth',0.14,-60),40);},
  k:()=>{[720,960,1200].forEach((f,i)=>setTimeout(()=>tone(f,0.12,'triangle',0.2),i*70));},
  walk:()=>{tone(300,0.2,'sawtooth',0.14,-90);},
  pitch:()=>{noise(0.03,0.06,1500);},
  over:()=>{[440,330,247,175].forEach((f,i)=>setTimeout(()=>tone(f,0.3,'triangle',0.2),i*160));}
};

// ---------- zone ----------
const ZX0=372,ZX1=528,ZY0=238,ZY1=398, ZCX=450,ZCY=318;
const MOUND={x:450,y:78};

// ---------- state ----------
let state='title', phase='set', t=0, batters=0, pitchInAB=0;
let score=0, combo=0, best=+(localStorage.getItem('callgame_best')||0);
let ks=0, dmg=0, lvl=1;                 // dmg = 出塁を許した数（3で交代）
let balls=0, strikes=0;
let sit='F', aggro=true;                 // batter hidden read
let choice=null, pitch=null, result=null, resultT=0, msg='', msg2='';
let batAng=0.6, swungThisPitch=false, swingT=0;
let shake=0, flash=0, flashCol='#fff', last=performance.now();
let parts=[], pops=[];

function rnd(a,b){return a+Math.random()*(b-a);}
function chance(p){return Math.random()<p;}
function clamp(v,a,b){return v<a?a:v>b?b:v;}

// pitch buttons (2x2)
const BTN=[
  {i:0,type:'F',zin:true , key:'1', lab:'直球', sub:'ゾーンで勝負'},
  {i:1,type:'F',zin:false, key:'2', lab:'直球', sub:'ボールで誘う'},
  {i:2,type:'B',zin:true , key:'3', lab:'変化球', sub:'ゾーンで勝負'},
  {i:3,type:'B',zin:false, key:'4', lab:'変化球', sub:'ボールで誘う'}
];
function btnRect(i){ const bw=196,bh=52,gx=16,gy=12,x0=W/2-bw-gx/2,y0=H-2-bh*2-gy-6;
  const col=i%2, row=i<2?0:1; return {x:x0+col*(bw+gx),y:y0+row*(bh+gy),w:bw,h:bh}; }

function reset(){state='title';score=0;combo=0;ks=0;dmg=0;lvl=1;batters=0;pitchInAB=0;balls=0;strikes=0;choice=null;pitch=null;result=null;parts=[];pops=[];}

function newBatter(){ batters++; lvl=Math.min(6,1+Math.floor(batters/3)); balls=0; strikes=0; newPitch(); }
function newPitch(){
  pitchInAB++;
  sit = chance(0.5)?'F':'B';
  aggro = chance(0.5);
  choice=null; pitch=null; result=null; phase='set'; t=0; batAng=0.6; swungThisPitch=false;
  msg=''; msg2='';
}
function start(){ if(!ac())ac(); if(AC&&AC.state==='suspended')AC.resume(); reset(); state='play'; newBatter(); }

// ---------- choose pitch ----------
function choose(idx){
  if(state==='title'){start();return;}
  if(state==='over'){ if(resultT>0.5){reset();start();} return; }
  if(state!=='play'||phase!=='set'||choice!=null) return;
  const b=BTN[idx]; choice=b;
  // launch ball
  let tx,ty;
  if(b.zin){ tx=rnd(ZX0+22,ZX1-22); ty=rnd(ZY0+22,ZY1-22); }
  else { // just outside a random edge
    const s=Math.floor(rnd(0,4)), off=rnd(26,48);
    if(s===0){tx=ZX0-off;ty=rnd(ZY0,ZY1);} else if(s===1){tx=ZX1+off;ty=rnd(ZY0,ZY1);}
    else if(s===2){ty=ZY0-off;tx=rnd(ZX0,ZX1);} else {ty=ZY1+off;tx=rnd(ZX0,ZX1);}
  }
  pitch={type:b.type,zin:b.zin,sx:MOUND.x,sy:MOUND.y,tx,ty,
    dur:(b.type==='F'?rnd(430,500):rnd(500,580))-lvl*12,t:0,
    curl:(b.type==='B'?(chance(0.5)?-1:1)*rnd(26,44):0)};
  phase='pitch'; t=0; S.pitch();
}

function ballAt(f){ const off=(pitch.type==='B'? pitch.curl*(f<0.5?0:((f-0.5)/0.5)*((f-0.5)/0.5)) :0);
  return {x:pitch.sx+(pitch.tx-pitch.sx)*f+off, y:pitch.sy+(pitch.ty-pitch.sy)*f}; }

function decide(){
  // batter swing model
  const matched = (choice.type===sit);
  let swing, outcome;
  if(choice.zin){
    swing = aggro ? true : matched;   // patient swings only at his pitch (matched)
    if(swing){ outcome = matched?'hit':'whiff'; }
    else outcome='called';
  } else {
    swing = aggro;                    // chase only if aggressive
    outcome = aggro?'chase':'ball';
  }
  swungThisPitch=swing; if(swing){swingT=1;batAng=choice.type==='F'?-0.9:-0.6;}
  resolve(outcome);
}

function resolve(kind){
  phase='resolve'; resultT=0; result=kind;
  const bp=ballAt(1);
  if(kind==='hit'){
    combo=0; dmg++; S.hit(); flash=1;flashCol='#ff6b6b';shake=13;
    burst(ZCX,ZCY,'#ff8a8a',26,8); pop(ZCX,ZY0-26,'痛打を浴びた…','#ffb0b0');
    msg='待たれていた！ '+(sit==='F'?'直球':'変化球')+'をゾーンで狙い打ち'; msg2='読み負け＝出塁を許した';
    endResult(true); return;
  }
  if(kind==='ball'){
    balls++; S.ball(); pop(bp.x,bp.y,'ボール','#8fe0ff');
    if(balls>=4){ combo=0; dmg++; S.walk(); flash=0.8;flashCol='#ffb15b';shake=7;
      pop(ZCX,ZY0-26,'四球','#ffd6a0'); msg='慎重な打者に見送られ四球…'; msg2='誘い球が読まれた'; endResult(true); }
    else { msg='見送られてボール'; msg2='慎重な打者。ゾーンで勝負したい'; endResult(false); }
    return;
  }
  // strikes: whiff / chase / called
  strikes++;
  if(kind==='whiff'){S.whiff();pop(bp.x,bp.y,'空振り！','#cfe8ff');}
  else if(kind==='chase'){S.whiff();pop(bp.x,bp.y,'釣られた！','#bfe0ff');}
  else {S.called();pop(bp.x,bp.y,'見逃し','#dfe8ff');}
  S.mitt();
  const base = kind==='chase'?22:14; combo++; const add=Math.round(base*(1+Math.min(6,combo-1)*0.15)); score+=add;
  flash=0.5;flashCol='#8fd0ff';shake=4;
  if(strikes>=3){
    ks++; const kb=Math.round(180*(1+Math.min(8,combo-1)*0.18)); score+=kb;
    S.k(); flash=1;flashCol='#8fe0a0';shake=11; burst(ZCX,ZCY,'#bfffcf',24,7);
    pop(ZCX,ZY0-26,'三振！ +'+kb,'#dfffe6');
    if(combo>=3)pop(ZCX,ZY0-52,'コンボ x'+combo,'#ffd24d');
    msg='三振に打ち取った！'; msg2=''; endResult(true);
  } else {
    msg = kind==='chase'?'ボール球を振らせた！':(kind==='called'?'見逃しストライク':'空振りを奪った！');
    msg2='あと'+(3-strikes)+'球で三振'; endResult(false);
  }
}
let abDone=false;
function endResult(end){ abDone=end; }

// ---------- input ----------
cv.addEventListener('pointerdown',e=>{
  e.preventDefault();
  if(state==='title'||state==='over'){choose(0);return;}
  if(state!=='play'||phase!=='set')return;
  const r=cv.getBoundingClientRect(); const x=((e.clientX-r.left)/r.width)*W, y=((e.clientY-r.top)/r.height)*H;
  for(let i=0;i<4;i++){const b=btnRect(i);if(x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h){choose(i);return;}}
});
addEventListener('keydown',e=>{
  if(e.code==='Digit1'||e.code==='KeyQ'){choose(0);}
  else if(e.code==='Digit2'||e.code==='KeyW'){choose(1);}
  else if(e.code==='Digit3'||e.code==='KeyE'){choose(2);}
  else if(e.code==='Digit4'||e.code==='KeyR'){choose(3);}
  else if(e.code==='Space'||e.code==='Enter'){ if(state!=='play')choose(0); }
});

// ---------- particles ----------
function burst(x,y,c,n,sp){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=rnd(sp*0.3,sp);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:1,c});}}
function pop(x,y,txt,c){pops.push({x,y,txt,c,life:1});}

// ---------- update ----------
function update(dt){
  shake*=Math.pow(0.86,dt/16.7); if(shake<0.3)shake=0;
  flash*=Math.pow(0.9,dt/16.7);
  swingT*=Math.pow(0.86,dt/16.7);
  batAng+=(0.6-batAng)*Math.min(1,dt/16.7*0.16);
  for(const p of parts){p.vx*=0.96;p.vy=p.vy*0.96+0.28;p.x+=p.vx*dt/16.7;p.y+=p.vy*dt/16.7;p.life-=dt/16.7*0.028;}
  parts=parts.filter(p=>p.life>0);
  for(const p of pops){p.y-=dt/16.7*0.5;p.life-=dt/16.7*0.02;}
  pops=pops.filter(p=>p.life>0);

  if(state!=='play'){ if(state==='over')resultT+=dt/1000; return; }
  t+=dt;

  if(phase==='pitch'){
    pitch.t+=dt; const f=clamp(pitch.t/pitch.dur,0,1);
    if(f>=1){ decide(); }
    return;
  }
  if(phase==='resolve'){
    resultT+=dt/1000;
    if(resultT>1.0){
      if(abDone){ abDone=false;
        if(dmg>=3){ state='over'; resultT=0; S.over(); if(score>best){best=score;localStorage.setItem('callgame_best',best);} return; }
        newBatter();
      } else newPitch();
    }
    return;
  }
}

// ---------- render ----------
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

function drawScene(){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#16233a');g.addColorStop(0.55,'#182a20');g.addColorStop(1,'#1d3a28');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  // dirt circle around plate
  ctx.fillStyle='rgba(150,95,55,0.4)';ctx.beginPath();ctx.ellipse(450,470,250,120,0,0,6.28);ctx.fill();
  // plate
  ctx.fillStyle='#f2f2f2';ctx.beginPath();ctx.moveTo(450,500);ctx.lineTo(414,482);ctx.lineTo(414,466);ctx.lineTo(486,466);ctx.lineTo(486,482);ctx.closePath();ctx.fill();
  // strike zone
  ctx.strokeStyle='rgba(255,255,255,0.7)';ctx.lineWidth=3;ctx.strokeRect(ZX0,ZY0,ZX1-ZX0,ZY1-ZY0);
  ctx.strokeStyle='rgba(255,255,255,0.13)';ctx.lineWidth=1;
  for(let i=1;i<3;i++){ctx.beginPath();ctx.moveTo(ZX0+(ZX1-ZX0)*i/3,ZY0);ctx.lineTo(ZX0+(ZX1-ZX0)*i/3,ZY1);ctx.stroke();
    ctx.beginPath();ctx.moveTo(ZX0,ZY0+(ZY1-ZY0)*i/3);ctx.lineTo(ZX1,ZY0+(ZY1-ZY0)*i/3);ctx.stroke();}
}

function drawCatcher(){
  ctx.fillStyle='#3a4a6a';ctx.beginPath();ctx.arc(450,438,20,Math.PI,0);ctx.fill();
  ctx.fillStyle='#556';ctx.beginPath();ctx.arc(450,430,10,0,6.28);ctx.fill();
  // mitt
  ctx.fillStyle=phase==='resolve'&&(result==='whiff'||result==='chase'||result==='called'||result&&result.indexOf('k')>=0)?'#caa15a':'#8a6a3a';
  ctx.beginPath();ctx.arc(450,404,11,0,6.28);ctx.fill();
}
function drawBatter(){
  const bx=560,by=402;
  ctx.save();ctx.translate(bx,by);
  ctx.fillStyle='rgba(0,0,0,0.22)';ctx.beginPath();ctx.ellipse(0,26,15,5,0,0,6.28);ctx.fill();
  ctx.fillStyle='#e23c3c';rr(-10,-8,20,28,7);ctx.fill();
  ctx.fillStyle='#f2c9a0';ctx.beginPath();ctx.arc(0,-18,8,0,6.28);ctx.fill();
  ctx.fillStyle='#1a1a1a';ctx.beginPath();ctx.arc(0,-20,8.5,Math.PI,0.15);ctx.fill();
  ctx.strokeStyle='#c8a15a';ctx.lineWidth=6;ctx.lineCap='round';ctx.save();ctx.rotate(batAng);ctx.beginPath();ctx.moveTo(0,-6);ctx.lineTo(0,-48);ctx.stroke();ctx.restore();
  ctx.restore();
}

function drawReads(){
  if(state!=='play')return;
  // fade prominence with level, but never fully gone
  const a = clamp(1.05 - (lvl-1)*0.13, 0.34, 1); // lvl1=1 .. lvl6~0.4
  const cx=200,cy=150;
  ctx.textAlign='center';
  // sit
  ctx.globalAlpha=a;
  ctx.fillStyle=sit==='F'?'#ff7a5a':'#7ab8ff';
  rr(cx-96,cy-24,192,34,9);ctx.fill();
  ctx.globalAlpha=Math.min(1,a+0.15);
  ctx.fillStyle='#0a0f18';ctx.font='bold 17px sans-serif';
  ctx.fillText((sit==='F'?'直球待ち':'変化球待ち'),cx,cy);
  // aggro
  ctx.globalAlpha=a;
  ctx.fillStyle=aggro?'#ffd24d':'#9fdfae';
  rr(cx-96,cy+18,192,34,9);ctx.fill();
  ctx.globalAlpha=Math.min(1,a+0.15);
  ctx.fillStyle='#0a0f18';ctx.font='bold 17px sans-serif';
  ctx.fillText((aggro?'積極的（振ってくる）':'慎重（見てくる）'),cx,cy+42);
  ctx.globalAlpha=1;
  ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='12px sans-serif';
  ctx.fillText('打者の読み',cx,cy-34);
}

function drawButtons(){
  if(state!=='play')return;
  for(let i=0;i<4;i++){const b=btnRect(i),cfg=BTN[i];
    const enabled = phase==='set'&&choice==null;
    const sel = choice&&choice.i===i;
    ctx.globalAlpha= enabled?1:(sel?1:0.4);
    ctx.fillStyle = sel?'#2f6a3a':(cfg.type==='F'?'#3a2b2b':'#2b3346');
    rr(b.x,b.y,b.w,b.h,10);ctx.fill();
    ctx.strokeStyle= sel?'#8fe0a0':'rgba(255,255,255,0.25)';ctx.lineWidth=2;rr(b.x,b.y,b.w,b.h,10);ctx.stroke();
    ctx.textAlign='left';
    ctx.fillStyle= cfg.type==='F'?'#ff9a7a':'#9fc4ff';ctx.font='bold 19px sans-serif';
    ctx.fillText(cfg.lab,b.x+14,b.y+24);
    ctx.fillStyle='rgba(255,255,255,0.82)';ctx.font='13px sans-serif';
    ctx.fillText(cfg.sub,b.x+14,b.y+42);
    ctx.textAlign='right';ctx.fillStyle='rgba(255,255,255,0.4)';ctx.font='bold 15px sans-serif';
    ctx.fillText('['+cfg.key+']',b.x+b.w-12,b.y+30);
  }
  ctx.globalAlpha=1;ctx.textAlign='left';
}

function render(){
  ctx.save();
  if(shake>0)ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
  drawScene();
  drawCatcher();
  drawBatter();

  if(state==='play'&&phase==='pitch'&&pitch){
    const f=clamp(pitch.t/pitch.dur,0,1); const bp=ballAt(f); const r=5+f*7;
    for(let k=1;k<=3;k++){const ff=clamp(f-k*0.05,0,1);const t2=ballAt(ff);ctx.globalAlpha=0.18;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(t2.x,t2.y,r*0.7,0,6.28);ctx.fill();}
    ctx.globalAlpha=1;
    ctx.fillStyle=pitch.type==='F'?'#fff':'#ffe6a0';ctx.beginPath();ctx.arc(bp.x,bp.y,r,0,6.28);ctx.fill();
    ctx.strokeStyle='#c33';ctx.lineWidth=1.3;ctx.beginPath();ctx.arc(bp.x,bp.y,r,0.4,2.3);ctx.stroke();
  }

  drawReads();

  for(const p of parts){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,3.2,0,6.28);ctx.fill();}
  ctx.globalAlpha=1;
  for(const p of pops){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.font='bold 21px sans-serif';ctx.textAlign='center';ctx.fillText(p.txt,p.x,p.y);}
  ctx.globalAlpha=1;

  // HUD
  ctx.textAlign='left';ctx.fillStyle='#fff';ctx.font='bold 26px sans-serif';ctx.fillText('SCORE '+score,20,36);
  ctx.textAlign='right';ctx.fillStyle='rgba(255,255,255,0.85)';ctx.font='14px sans-serif';ctx.fillText('奪三振 '+ks+'  Lv'+lvl,W-20,24);
  // count
  ctx.textAlign='left';ctx.font='bold 15px sans-serif';
  ctx.fillStyle='#8fe0ff';ctx.fillText('B',24,60);for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(48+i*20,55,7,0,6.28);ctx.fillStyle=i<balls?'#3ec6ff':'rgba(255,255,255,0.2)';ctx.fill();}
  ctx.fillStyle='#ffd24d';ctx.fillText('S',24,86);for(let i=0;i<2;i++){ctx.beginPath();ctx.arc(48+i*20,81,7,0,6.28);ctx.fillStyle=i<strikes?'#ffb15b':'rgba(255,255,255,0.2)';ctx.fill();}
  ctx.textAlign='right';ctx.fillStyle='rgba(255,255,255,0.85)';ctx.font='14px sans-serif';ctx.fillText('出塁許容',W-70,50);
  for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(W-58+i*20,70,7,0,6.28);ctx.fillStyle=i<dmg?'#ff5b5b':'rgba(255,255,255,0.22)';ctx.fill();}
  if(combo>=3){ctx.textAlign='center';ctx.fillStyle='#ffd24d';ctx.font='bold 17px sans-serif';ctx.fillText('コンボ x'+combo,ZCX,ZY1+30);}

  drawButtons();

  if(state==='play'&&msg&&phase==='resolve'){
    ctx.textAlign='center';
    const good=result==='whiff'||result==='chase'||result==='called';
    ctx.fillStyle=(result==='hit'||(result==='ball'&&balls>=4))?'#ff9a9a':(good?'#bfe8ff':'#dfe8ff');
    if(result==='whiff'&&strikes>=3||(result==='chase'&&strikes>=3))ctx.fillStyle='#9ff0b8';
    ctx.font='bold 24px sans-serif';ctx.fillText(msg,W/2,196);
    if(msg2){ctx.fillStyle='rgba(255,255,255,0.72)';ctx.font='14px sans-serif';ctx.fillText(msg2,W/2,220);}
  }
  if(state==='play'&&phase==='set'){
    ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,0.9)';ctx.font='16px sans-serif';
    ctx.fillText('読みを見て配球を選べ',W/2,196);
    ctx.fillStyle='rgba(255,255,255,0.6)';ctx.font='13px sans-serif';
    ctx.fillText('待ち球はゾーンで“逆の球種”／積極的なら“ボールで誘い”、慎重なら“ゾーンで勝負”',W/2,220);
  }

  if(state==='title'){
    ctx.fillStyle='rgba(6,10,18,0.68)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='bold 52px sans-serif';ctx.fillText('配球',W/2,150);
    ctx.fillStyle='#ffd24d';ctx.font='bold 22px sans-serif';ctx.fillText('Call the Game',W/2,186);
    ctx.fillStyle='rgba(255,255,255,0.9)';ctx.font='16px sans-serif';
    ctx.fillText('捕手の配球で打者を打ち取れ。打者の「待ち球（直球/変化球）」と',W/2,238);
    ctx.fillText('「姿勢（積極的/慎重）」を読み、4つの配球から最善を選ぶ',W/2,262);
    ctx.fillStyle='rgba(255,255,255,0.66)';ctx.font='14px sans-serif';
    ctx.fillText('待ち球をゾーンに投げると痛打→逆の球種をゾーンに投げれば打ち損じ／見逃しストライク',W/2,300);
    ctx.fillText('積極的な打者はボールで誘えば空振り、慎重な打者はゾーンで勝負（誘い球は四球になる）',W/2,324);
    ctx.fillText('3三振でスコア加算＆コンボ。痛打・四球で出塁を許し、3出塁で交代',W/2,348);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で開始',W/2,406);
    ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='14px sans-serif';ctx.fillText('BEST '+best+'　　操作：4つのボタン / キー 1〜4',W/2,440);
  }
  if(state==='over'){
    ctx.fillStyle='rgba(6,10,18,0.76)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#ff6b6b';ctx.font='bold 46px sans-serif';ctx.fillText('3出塁…交代',W/2,222);
    ctx.fillStyle='#fff';ctx.font='bold 40px sans-serif';ctx.fillText('SCORE '+score,W/2,290);
    ctx.fillStyle='rgba(255,255,255,0.85)';ctx.font='19px sans-serif';ctx.fillText('奪三振 '+ks+'   BEST '+best,W/2,330);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で もう一度',W/2,402);
  }

  if(flash>0.02){ctx.globalAlpha=flash*0.5;ctx.fillStyle=flashCol;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}
  ctx.restore();
}

function frame(ts){let dt=ts-last;last=ts;if(dt>60)dt=60;if(dt<0)dt=0;update(dt);render();requestAnimationFrame(frame);}
requestAnimationFrame(frame);

// ---------- test hook ----------
window.__pc={
  start, choose:(i)=>choose(i),
  get state(){return state;},
  get score(){return score;},
  get ks(){return ks;},
  get dmg(){return dmg;},
  get info(){return {state,phase,sit,aggro,balls,strikes,dmg,lvl,result,batters,
    canChoose:(phase==='set'&&choice==null)};}
};
})();
</script>
