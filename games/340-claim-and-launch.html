<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>キャッチ&スロー (Claim & Launch)</title>
<style>
  html,body{margin:0;height:100%;background:#0a0d08;overflow:hidden;
    font-family:-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  #stage{position:relative;width:100vw;height:100vh;max-width:calc(100vh*1.5);max-height:calc(100vw/1.5);aspect-ratio:900/600;}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;border-radius:6px;}
</style>
</head>
<body>
<div id="wrap"><div id="stage"><canvas id="cv"></canvas></div></div>
<script>
(function(){
const W=900,H=600,cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let DPR=1;
function fit(){DPR=Math.min(2,window.devicePixelRatio||1);cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
fit();addEventListener('resize',fit);

// ---------- audio ----------
let AC=null;function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function tone(f,d,type,v,sweep){const a=ac();if(!a)return;const t=a.currentTime,o=a.createOscillator(),g=a.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(sweep)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+sweep),t+d);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v||0.2,t+0.008);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+0.02);}
function noise(d,v,hp){const a=ac();if(!a)return;const t=a.currentTime,n=Math.floor(a.sampleRate*d),buf=a.createBuffer(1,n,a.sampleRate),ch=buf.getChannelData(0);
  for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource();s.buffer=buf;
  const f=a.createBiquadFilter();f.type='highpass';f.frequency.value=hp||600;const g=a.createGain();g.gain.value=v||0.2;
  s.connect(f);f.connect(g);g.connect(a.destination);s.start(t);s.stop(t+d+0.02);}
const S={
  cross:()=>{tone(360,0.14,'sine',0.05,120);},
  catch:()=>{noise(0.05,0.18,1200);tone(240,0.05,'square',0.07,-60);},
  throw:()=>{noise(0.05,0.14,700);tone(420,0.06,'triangle',0.08,160);},
  go:()=>{[620,880,1150].forEach((f,i)=>setTimeout(()=>tone(f,0.11,'triangle',0.16),i*58));},
  big:()=>{[600,800,1000,1250].forEach((f,i)=>setTimeout(()=>tone(f,0.12,'triangle',0.17),i*80));},
  lost:()=>{noise(0.18,0.2,300);tone(160,0.2,'sawtooth',0.12,-40);},
  streak:()=>{[700,930,1170,1400].forEach((f,i)=>setTimeout(()=>tone(f,0.1,'triangle',0.16),i*60));},
  over:()=>{[440,330,247,175].forEach((f,i)=>setTimeout(()=>tone(f,0.3,'triangle',0.2),i*160));}
};

// ---------- geometry ----------
const GK={x:452,y:452};            // keeper (catch point)
const CROSS0={x:812,y:96};         // cross comes in from the right wing
const OUT0={x:360,y:420}, OUT1={x:168,y:132};   // teammate breaking up the left flank

// ---------- state ----------
let state='title', phase='throw', plays=0;   // phase: throw=cross descending(beat1 catch), tag=throw to outlet(beat2)
let score=0, combo=0, best=+(localStorage.getItem('cl_best')||0);
let outs=0, fails=0, lvl=1;   // outs = counters launched
let clock=0, tagClock=0, caught=false, tough=false;   // caught = ball claimed
let catchIdeal=600, cw=140, tagIdeal=270, tw=130;
let decided=false, result=null, resultT=0, msg='', msgOk=false;
let ballU=0, throwU=0, runnerP=0;
let shake=0, flash=0, flashCol='#fff', last=performance.now();
let parts=[], pops=[];

function rnd(a,b){return a+Math.random()*(b-a);}
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function lerp(a,b,u){return a+(b-a)*u;}
function easeOut(u){return 1-Math.pow(1-u,2);}
function easeIn(u){return u*u;}

function reset(){state='title';score=0;combo=0;outs=0;fails=0;lvl=1;plays=0;result=null;parts=[];pops=[];}

function newPlay(){
  plays++; lvl=Math.min(7,1+Math.floor(outs/4));
  catchIdeal=clamp(600-lvl*28,380,600);
  cw=clamp(140-lvl*9,80,140);
  tagIdeal=clamp(280-lvl*14,170,280);
  tw=clamp(140-lvl*9,80,140);
  tough=Math.random()<clamp(0.2+lvl*0.05,0.2,0.5);
  if(tough){cw*=0.82;tw*=0.82;}
  phase='throw'; clock=0; tagClock=0; caught=false; decided=false; result=null; resultT=0; msg=''; msgOk=false;
  ballU=0; throwU=0; runnerP=0;
  S.cross();
}
function start(){ if(!ac())ac(); if(AC&&AC.state==='suspended')AC.resume(); reset(); state='play'; newPlay(); }

function act(){
  if(state==='title'){start();return;}
  if(state==='over'){ if(resultT>0.4){reset();start();} return; }
  if(state!=='play'||decided) return;
  if(phase==='throw'){
    if(clock<catchIdeal-cw){ decided=true; resolve('early-leave'); return; }
    if(clock<=catchIdeal+cw){ caught=true; phase='tag'; tagClock=0; S.catch(); return; }
  } else if(phase==='tag'){
    if(tagClock<tagIdeal-tw){ decided=true; resolve('early-slide'); return; }
    if(tagClock<=tagIdeal+tw){ decided=true; resolve('safe'); return; }
  }
}

function resolve(k){
  phase='result'; result=k; resultT=0; decided=true;
  if(k==='safe'){
    outs++; combo++;
    const q=1-Math.abs(tagClock-tagIdeal)/tw;
    const perfect=q>=0.75;
    let add=Math.round((tough?250:150)*(1+Math.min(9,combo-1)*0.14)); score+=add;
    S.throw(); setTimeout(S.go,140); if(tough||perfect)setTimeout(S.big,200);
    msgOk=true; flash=1;flashCol='#8affa0';shake=6; burst(OUT1.x,OUT1.y,'#8affa0',16,7);
    pop(W/2,240,(perfect?'完璧なキャッチ&スロー！ 速攻炸裂！ +':'キャッチから速攻を launch！ +')+add,'#d6ffe0');
    if(combo>=2)pop(W/2,160,'コンボ x'+combo,'#ffd24d');
    if(combo>0&&combo%5===0)S.streak();
    msg='クロスをがっちりキャッチ→走り出した味方の前へ鋭いスロー、一気にカウンター発動';
  } else {
    fails++; combo=0; msgOk=false; flash=1;flashCol='#ff5b5b';shake=9; S.lost();
    if(k==='early-leave') msg='早い…来る前に手を出してクロスをこぼした（キャッチ失敗）';
    else if(k==='no-leave') msg='キャッチが遅れた…クロスに competitor が触れてピンチ';
    else if(k==='early-slide') msg='スローが早い…味方が走り出す前に投げてカット';
    else msg='スローが遅い…味方が抜け出した先の帯を過ぎ、outlet が消えた';
    pop(W/2,240,(k==='early-leave'||k==='no-leave')?'キャッチ失敗…':'スロー失敗…','#ffb0b0');
  }
  if(fails>=3){ state='over'; resultT=0; S.over(); if(score>best){best=score;localStorage.setItem('cl_best',best);} }
}

// ---------- input ----------
cv.addEventListener('pointerdown',e=>{e.preventDefault();act();});
addEventListener('keydown',e=>{ if(e.repeat)return;
  if(e.code==='Space'||e.code==='ArrowUp'||e.code==='Enter'||e.code==='KeyF'||e.code==='KeyJ'){e.preventDefault();act();} });

// ---------- particles ----------
function burst(x,y,c,n,sp){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=rnd(sp*0.3,sp);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:1,c});}}
function pop(x,y,txt,c){pops.push({x,y,txt,c,life:1});}

// ---------- update ----------
function update(dt){
  shake*=Math.pow(0.86,dt/16.7); if(shake<0.3)shake=0;
  flash*=Math.pow(0.9,dt/16.7);
  for(const p of parts){p.vx*=0.96;p.vy=p.vy*0.96+0.28;p.x+=p.vx*dt/16.7;p.y+=p.vy*dt/16.7;p.life-=dt/16.7*0.026;}
  parts=parts.filter(p=>p.life>0);
  for(const p of pops){p.y-=dt/16.7*0.5;p.life-=dt/16.7*0.02;}
  pops=pops.filter(p=>p.life>0);

  if(state!=='play'){ if(state==='over')resultT+=dt/1000; return; }
  if(phase==='throw'){ clock+=dt;
    ballU=easeIn(clamp(clock/catchIdeal,0,1));
    if(!decided && clock>catchIdeal+cw){ decided=true; resolve('no-leave'); }
    return; }
  if(phase==='tag'){ tagClock+=dt; ballU=1;
    runnerP=easeOut(clamp(tagClock/(tagIdeal+tw),0,1));
    if(!decided && tagClock>tagIdeal+tw){ decided=true; resolve('late-slide'); }
    return; }
  if(phase==='result'){ resultT+=dt/1000;
    if(result==='safe'){ throwU=Math.min(1,throwU+dt/300); runnerP=Math.min(1,runnerP+dt/900); }
    else if(result==='early-slide'||result==='late-slide'){ throwU=Math.min(1,throwU+dt/360); }
    if(resultT>1.55) newPlay(); return; }
}

// ---------- render ----------
function drawField(){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#12703f');g.addColorStop(0.5,'#0f5e34');g.addColorStop(1,'#0c4c2b');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.globalAlpha=0.06;for(let i=0;i<7;i++){ctx.fillStyle=i%2?'#fff':'#000';ctx.fillRect(0,i*84,W,84);}ctx.globalAlpha=1;
  // own goal + box at the bottom
  ctx.strokeStyle='rgba(255,255,255,0.24)';ctx.lineWidth=2;ctx.strokeRect(300,430,304,150);
  const gx0=GK.x-110,gx1=GK.x+110;
  ctx.strokeStyle='#f4f4f4';ctx.lineWidth=6;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(gx0,540-34);ctx.lineTo(gx0,540);ctx.lineTo(gx1,540);ctx.lineTo(gx1,540-34);ctx.stroke();ctx.lineCap='butt';
}
function person(x,y,col,s){s=s||1;
  ctx.fillStyle=col;ctx.beginPath();ctx.ellipse(x,y-15*s,10*s,15*s,0,0,6.28);ctx.fill();
  ctx.fillStyle='#f0c9a0';ctx.beginPath();ctx.arc(x,y-34*s,7.5*s,0,6.28);ctx.fill();
}

function render(){
  ctx.save();
  if(shake>0)ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
  drawField();

  if(state==='play'||state==='over'){
    // crossing opponent (top-right)
    person(CROSS0.x,CROSS0.y,'#c0403a',0.86);
    // an attacker lurking near the GK (the danger)
    person(GK.x+40,GK.y-10,'#c0403a',0.82);

    // the cross ball descending to the keeper (beat 1)
    if(phase==='throw'){ const bx=lerp(CROSS0.x,GK.x-2,ballU), by=lerp(CROSS0.y,GK.y-30,ballU);
      ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(bx,by,7.5,0,6.28);ctx.fill();
      ctx.strokeStyle='#333';ctx.lineWidth=1.1;ctx.beginPath();ctx.arc(bx,by,7.5,0.3,2.0);ctx.stroke(); }

    // breaking teammate up the left flank (beat 2)
    let rx=OUT0.x,ry=OUT0.y;
    if(phase==='tag'||phase==='result'){ rx=lerp(OUT0.x,OUT1.x,runnerP); ry=lerp(OUT0.y,OUT1.y,runnerP); }
    person(rx,ry,'#2b6fd6',0.92);
    if(phase==='tag'){ ctx.fillStyle='rgba(150,255,170,0.85)';ctx.font='bold 12px sans-serif';ctx.textAlign='center';ctx.fillText('味方が抜け出す',rx,ry-46); }

    // keeper (claims, then throws)
    const claiming=(phase==='throw'&&clock>catchIdeal-cw*1.2)||caught;
    person(GK.x,GK.y,'#e8b23a',1.0);
    if(caught&&phase==='tag'){ ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(GK.x-14,GK.y-30,6.5,0,6.28);ctx.fill(); }

    // the thrown ball to the outlet (beat 2 result)
    if(phase==='result'&&result!=='early-leave'&&result!=='no-leave'){ const u=easeOut(throwU);
      let ex=rx,ey=ry; if(result==='early-slide'){ ex=OUT0.x+40; ey=OUT0.y-10; }
      const bx=lerp(GK.x-14,ex,u), by=lerp(GK.y-30,ey,u)-Math.sin(u*Math.PI)*20;
      ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(bx,by,7,0,6.28);ctx.fill();
      ctx.strokeStyle='#333';ctx.lineWidth=1.1;ctx.beginPath();ctx.arc(bx,by,7,0.3,2.0);ctx.stroke(); }

    // cue banner + beat window bar
    ctx.textAlign='center';
    if(state==='play'&&(phase==='throw'||phase==='tag')){
      const isCatch=phase==='throw';
      ctx.fillStyle=isCatch?'rgba(255,220,90,0.96)':'rgba(120,230,255,0.98)';ctx.font='bold 23px sans-serif';
      ctx.fillText(isCatch?'① クロスをキャッチ！':'② 走り出した味方へスロー！',W/2,44);
      const cur=isCatch?clock:tagClock, ideal=isCatch?catchIdeal:tagIdeal, hw=isCatch?cw:tw;
      const bw=260,x=W/2-bw/2,y=58, span=ideal+hw*1.4;
      ctx.fillStyle='rgba(255,255,255,0.15)';ctx.fillRect(x,y,bw,8);
      const gx0=x+bw*clamp((ideal-hw)/span,0,1), gx1=x+bw*clamp((ideal+hw)/span,0,1);
      ctx.fillStyle='rgba(90,240,130,0.5)';ctx.fillRect(gx0,y,gx1-gx0,8);
      const px=x+bw*clamp(cur/span,0,1);
      ctx.fillStyle='#ffe14d';ctx.fillRect(px-2,y-3,4,14);
      ctx.fillStyle=caught?'#8affa0':'rgba(255,255,255,0.4)';ctx.beginPath();ctx.arc(W/2-24,86,6,0,6.28);ctx.fill();
      ctx.fillStyle='rgba(255,255,255,0.4)';ctx.beginPath();ctx.arc(W/2+24,86,6,0,6.28);ctx.fill();
    }
    if(state==='play'){
      ctx.fillStyle='rgba(255,255,255,0.55)';ctx.font='13px sans-serif';ctx.textAlign='center';
      ctx.fillText('タップ / SPACE ＝ ①キャッチ → ②スロー の2拍',W/2,H-30);
    }
  }

  for(const p of parts){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,3.2,0,6.28);ctx.fill();}
  ctx.globalAlpha=1;
  for(const p of pops){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.font='bold 21px sans-serif';ctx.textAlign='center';ctx.fillText(p.txt,p.x,p.y);}
  ctx.globalAlpha=1;

  // HUD
  ctx.textAlign='left';ctx.fillStyle='#fff';ctx.font='bold 26px sans-serif';ctx.fillText('SCORE '+score,20,36);
  ctx.textAlign='right';ctx.fillStyle='rgba(255,255,255,0.9)';ctx.font='14px sans-serif';ctx.fillText('速攻 '+outs+'  Lv'+lvl,W-20,24);
  ctx.fillText('失敗',W-92,46);
  for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(W-60+i*20,41,7,0,6.28);ctx.fillStyle=i<fails?'#ff5b5b':'rgba(255,255,255,0.25)';ctx.fill();}
  if(combo>=2){ctx.textAlign='center';ctx.fillStyle='#ffd24d';ctx.font='bold 18px sans-serif';ctx.fillText('コンボ x'+combo,W/2,116);}

  if(state==='play'&&phase==='result'&&msg){ctx.textAlign='center';ctx.fillStyle=msgOk?'#9ff0b8':'#ff9a9a';ctx.font='bold 15px sans-serif';ctx.fillText(msg,W/2,300);}

  if(state==='title'){
    ctx.fillStyle='rgba(4,8,4,0.83)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='bold 40px sans-serif';ctx.fillText('キャッチ&スロー',W/2,84);
    ctx.fillStyle='#ffd23e';ctx.font='bold 22px sans-serif';ctx.fillText('Claim & Launch',W/2,120);
    ctx.fillStyle='rgba(255,255,255,0.92)';ctx.font='16px sans-serif';
    ctx.fillText('GKとして、クロスをキャッチ→走り出した味方へ素早くスローして速攻を発動する“キャッチ→スロー”の2拍',W/2,182);
    ctx.fillStyle='rgba(255,255,255,0.66)';ctx.font='14px sans-serif';
    ctx.fillText('①クロスが落ちてくる“その瞬間”の緑窓でタップ/SPACE＝キャッチ（早いとこぼす・遅いと competitor に触られる）',W/2,220);
    ctx.fillText('②味方がカウンターへ走り出す、outlet が空く緑窓で再度タップ＝スロー（早いとカット・遅いと outlet が消える）',W/2,244);
    ctx.fillText('2拍ともジャストで決めると鋭い速攻＝大量加点。上級ほど速く窓が狭い',W/2,268);
    ctx.fillText('3失敗で交代',W/2,292);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で開始',W/2,360);
    ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='14px sans-serif';ctx.fillText('BEST '+best,W/2,392);
  }
  if(state==='over'){
    ctx.fillStyle='rgba(4,8,4,0.85)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#ff6b6b';ctx.font='bold 46px sans-serif';ctx.fillText('3失敗…交代',W/2,222);
    ctx.fillStyle='#fff';ctx.font='bold 40px sans-serif';ctx.fillText('SCORE '+score,W/2,290);
    ctx.fillStyle='rgba(255,255,255,0.85)';ctx.font='19px sans-serif';ctx.fillText('速攻 '+outs+'   BEST '+best,W/2,330);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で もう一度',W/2,402);
  }

  if(flash>0.02){ctx.globalAlpha=flash*0.5;ctx.fillStyle=flashCol;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}
  ctx.restore();

  ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,0.4)';ctx.font='12px sans-serif';
  ctx.fillText('キャッチ&スロー：①クロスをキャッチ→②走り出した味方へスローで速攻。こぼし/被競/早スロー/遅スローは失敗、3つで交代',W/2,H-8);
}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

function frame(ts){let dt=ts-last;last=ts;if(dt>60)dt=60;if(dt<0)dt=0;update(dt);render();requestAnimationFrame(frame);}
requestAnimationFrame(frame);

// ---------- test hook ----------
window.__cl={
  start, act,
  get state(){return state;},
  get score(){return score;},
  get outs(){return outs;},
  get fails(){return fails;},
  get info(){return {state,phase,clock,tagClock,catchIdeal,cw,tagIdeal,tw,caught,tough,decided,result,outs,fails,lvl,
    inCatch:(phase==='throw'&&Math.abs(clock-catchIdeal)<=cw), inTag:(phase==='tag'&&Math.abs(tagClock-tagIdeal)<=tw)};}
};
})();
</script>
</body>
</html>
