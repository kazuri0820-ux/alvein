<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ゴール前の詰め — Poacher</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{width:100%;height:100%;background:#08160c;overflow:hidden;
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,system-ui,sans-serif;
    touch-action:none;user-select:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  #stage{position:relative;aspect-ratio:900/600;max-width:100%;max-height:100%;
    width:auto;height:auto;box-shadow:0 0 60px rgba(0,0,0,.6);}
  canvas{display:block;width:100%;height:100%;border-radius:6px;cursor:pointer;}
</style>
</head>
<body>
<div id="wrap"><div id="stage"><canvas id="c" width="900" height="600"></canvas></div></div>
<script>
(function(){
"use strict";
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
const W=900,H=600;
let dpr=Math.max(1,Math.min(2,window.devicePixelRatio||1));
function fit(){ dpr=Math.max(1,Math.min(2,window.devicePixelRatio||1)); cv.width=W*dpr; cv.height=H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0); }
fit(); window.addEventListener('resize',fit);

// ---------- audio ----------
let AC=null;
function ac(){ if(!AC){ try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){AC=null;} } return AC; }
function tone(f,d,type,g,f2){ const a=ac(); if(!a)return; const o=a.createOscillator(),gg=a.createGain();
  o.type=type||'sine'; o.frequency.setValueAtTime(f,a.currentTime); if(f2)o.frequency.exponentialRampToValueAtTime(Math.max(30,f2),a.currentTime+d);
  gg.gain.setValueAtTime(0.0001,a.currentTime); gg.gain.exponentialRampToValueAtTime(g||0.2,a.currentTime+0.01);
  gg.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+d); o.connect(gg); gg.connect(a.destination); o.start(); o.stop(a.currentTime+d+0.02); }
function noise(d,g,cut){ const a=ac(); if(!a)return; const n=Math.floor(a.sampleRate*d),buf=a.createBuffer(1,n,a.sampleRate),ch=buf.getChannelData(0);
  for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(1-i/n); const src=a.createBufferSource(); src.buffer=buf;
  const f=a.createBiquadFilter(); f.type='lowpass'; f.frequency.value=cut||1200; const gg=a.createGain(); gg.gain.value=g||0.2;
  src.connect(f); f.connect(gg); gg.connect(a.destination); src.start(); }
const S={
  strike(){ noise(0.05,0.4,3600); tone(300,0.06,'square',0.14,150); },
  goal(){ noise(0.12,0.3,2000); tone(300,0.16,'triangle',0.22,150); setTimeout(()=>tone(560,0.16,'square',0.16),50); setTimeout(()=>tone(840,0.2,'square',0.14),120); },
  save(){ noise(0.1,0.4,1400); tone(220,0.12,'square',0.16,120); },
  wide(){ tone(520,0.12,'sine',0.07,300); },
  whiff(){ noise(0.14,0.26,700); tone(150,0.2,'sawtooth',0.1,70); },
  lost(){ tone(200,0.18,'sawtooth',0.12,90); noise(0.16,0.16,600); },
  roll(){ tone(240,0.08,'sine',0.05,300); },
  over(){ noise(0.3,0.3,600); tone(150,0.4,'sawtooth',0.16,60); },
  cheer(){ const a=ac(); if(!a)return; noise(0.7,0.22,1900); for(let i=0;i<5;i++)setTimeout(()=>tone(500+Math.random()*320,0.3,'sine',0.05),i*46); }
};

// ---------- geometry ----------
const GY=98;                  // goal line (top)
const GX0=302, GX1=598;       // posts
const NETY=44;
const KY=132;                 // keeper row
const SY=452;                 // striker / strike line
const REACH=64;
const SXMIN=210, SXMAX=690;

// ---------- state ----------
let state='title';
let goals=0, lives=3, score=0, combo=0, bestCombo=0, chances=0;
let best=+(localStorage.getItem('pf_best')||0);
let ball=null, shot=null, nextTimer=0, gap=0, res=null, resT=0;
let keeper={x:(GX0+GX1)/2, tx:(GX0+GX1)/2};
let striker={x:(GX0+GX1)/2, tx:(GX0+GX1)/2, lunge:0, ldir:0};
let parts=[], floats=[], shake=0, flashG=0, flashR=0, netRip=0;
let last=performance.now();
const MAXLIFE=3;

function reset(){ goals=0; lives=MAXLIFE; score=0; combo=0; bestCombo=0; chances=0; ball=null; shot=null; res=null; nextTimer=400; parts=[]; floats=[];
  keeper.x=keeper.tx=(GX0+GX1)/2; striker.x=striker.tx=(GX0+GX1)/2; striker.lunge=0; }
function level(){ return Math.floor(goals/4); }
function rr(a,b){ return a+Math.random()*(b-a); }
function kw(){ return 36 + level()*2; }

function spawn(){
  const lv=level();
  const x0=rr(GX0+20,GX1-20);
  const D=Math.max(620, 1150 - lv*70);   // roll duration to strike line
  // loose ball settles in front of goal so a redirect can find an open side
  ball={ x:x0, y:170, x0, tx:Math.max(GX0+56,Math.min(GX1-56,x0+rr(-70,70))), y0:170, D, el:0, live:true, struck:false };
  S.roll();
}

function keeperTrack(dt){
  // while a ball is live, keeper drifts toward it; else returns to center
  keeper.tx = (ball&&ball.live)? Math.max(GX0+kw(),Math.min(GX1-kw(),ball.x)) : (GX0+GX1)/2;
  const maxsp=(0.16+level()*0.02)*dt;
  const d=keeper.tx-keeper.x; keeper.x += Math.max(-maxsp,Math.min(maxsp,d));
}

function doStrike(){
  if(state!=='play') return;
  if(!ball||!ball.live||ball.struck) return;   // no live ball → ignore the tap
  if(ball.y < SY-78) return;                    // too early → ignored, no penalty
  // ball is in the attempt zone: must be in reach and on time, else it's a whiff
  const reach = Math.abs(striker.x-ball.x)<REACH;
  if(!reach || ball.y>SY+30){ whiff(); return; }
  ball.struck=true; ball.live=false;
  striker.lunge=1; striker.ldir=Math.sign(ball.x-striker.x)||0;
  // redirect: meeting the ball on one side pushes it to the other
  const AIM=1.55;
  let targetX = ball.x + (ball.x - striker.x)*AIM;
  // timing quality: closer to SY = truer; poor adds scatter
  const timeErr=Math.abs(ball.y-SY)/78;
  targetX += rr(-1,1)*timeErr*60;
  targetX=Math.max(GX0-60,Math.min(GX1+60,targetX));
  const saved = Math.abs(targetX-keeper.x) < kw()+6;
  let kind = saved? 'save' : ((targetX>GX0+6 && targetX<GX1-6)? 'goal':'wide');
  shot={ x:ball.x, y:SY, tx:targetX, ty:GY, el:0, D:230, kind };
  S.strike();
  // keeper reaction dive toward save point on goal
  if(kind==='save'){ keeper.tx=targetX; }
}
function whiff(){ lives--; combo=0; chances++; flashR=0.4; shake=6; S.whiff(); floatText(striker.x,SY-30,'空振り…','#ff9a3c'); ball=null; gap=520; nextTimer=gap; if(lives<=0) setTimeout(gameOver,700); }

function resolveShot(){
  const k=shot.kind; const p=shot.tx; chances++;
  if(k==='goal'){
    goals++; combo++; if(combo>bestCombo)bestCombo=combo; const pts=100+combo*20; score+=pts;
    flashG=0.5; netRip=1; S.goal(); floatText(p,GY-16,'ゴール！ +'+pts,'#8effa8');
    for(let i=0;i<22;i++){ const a=Math.random()*Math.PI*2,s=rr(1,6); parts.push({x:p,y:GY,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:1,col:i%2?'#8effa8':'#fff',g:0.15,sz:rr(2,5)}); }
    if(combo>0&&combo%5===0) setTimeout(()=>S.cheer(),140);
  }else if(k==='save'){
    combo=0; S.save(); shake=4; floatText(p,KY+20,'セーブ','#5ad1ff');
    for(let i=0;i<10;i++){ const a=Math.random()*Math.PI*2,s=rr(1,4); parts.push({x:keeper.x,y:KY,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,col:'#cfe4ff',g:0.12,sz:rr(2,4)}); }
  }else{ combo=0; S.wide(); floatText(p,GY-10,'枠外','#cfd8e6'); }
  shot=null; ball=null; gap=k==='goal'?720:560; res=null; nextTimer=gap;
}
function showRes(){ /* reserved */ }
function gameOver(){ state='over'; if(score>best){ best=score; try{localStorage.setItem('pf_best',best);}catch(e){} } S.over(); }
function floatText(x,y,t,c){ floats.push({x,y,t,c:c||'#fff',life:1}); }

// ---------- input ----------
function evXY(e){ const r=cv.getBoundingClientRect(); return [(e.clientX-r.left)/r.width*W,(e.clientY-r.top)/r.height*H]; }
let ptId=null, downX=0, downY=0, downT=0, moved=false;
function press(){ ac(); if(state==='title'){ reset(); state='play'; return; } if(state==='over'){ state='title'; return; } }
cv.addEventListener('pointerdown',e=>{ e.preventDefault(); ac();
  if(state!=='play'){ press(); return; }
  ptId=e.pointerId; const [x,y]=evXY(e); downX=x; downY=y; downT=performance.now(); moved=false;
  striker.tx=Math.max(SXMIN,Math.min(SXMAX,x));
});
cv.addEventListener('pointermove',e=>{ if(state!=='play')return; const [x,y]=evXY(e);
  if(ptId!==null){ if(Math.abs(x-downX)>10)moved=true; striker.tx=Math.max(SXMIN,Math.min(SXMAX,x)); }
  else if(e.pointerType==='mouse'){ striker.tx=Math.max(SXMIN,Math.min(SXMAX,x)); }
});
cv.addEventListener('pointerup',e=>{ if(state==='play'&&ptId!==null){ const dt=performance.now()-downT; if(!moved&&dt<260) doStrike(); } ptId=null; });
window.addEventListener('keydown',e=>{
  if(e.code==='Space'||e.code==='Enter'){ e.preventDefault(); if(state==='play')doStrike(); else press(); }
  else if(e.code==='ArrowLeft'||e.code==='KeyA'){ striker.tx=Math.max(SXMIN,striker.tx-38); }
  else if(e.code==='ArrowRight'||e.code==='KeyD'){ striker.tx=Math.min(SXMAX,striker.tx+38); }
});

// ---------- update ----------
function update(dt){
  if(shake>0)shake=Math.max(0,shake-dt/24);
  if(flashG>0)flashG=Math.max(0,flashG-dt/280);
  if(flashR>0)flashR=Math.max(0,flashR-dt/360);
  if(netRip>0)netRip=Math.max(0,netRip-dt/500);
  if(striker.lunge>0)striker.lunge=Math.max(0,striker.lunge-dt/220);
  for(const p of parts){ p.x+=p.vx; p.y+=p.vy; p.vy+=p.g; p.life-=dt/900; } parts=parts.filter(p=>p.life>0);
  for(const f of floats){ f.y-=dt*0.02; f.life-=dt/1000; } floats=floats.filter(f=>f.life>0);
  if(state!=='play') return;

  // striker ease
  const sd=striker.tx-striker.x; striker.x+=Math.max(-0.6*dt,Math.min(0.6*dt,sd));
  keeperTrack(dt);

  if(shot){ shot.el+=dt; if(shot.el>=shot.D) resolveShot(); return; }

  if(ball&&ball.live){
    ball.el+=dt; const t=ball.el/ball.D;
    ball.x=ball.x0+(ball.tx-ball.x0)*t;
    ball.y=ball.y0+(SY+40-ball.y0)*t;
    if(ball.y>SY+34){ // rolled past — cleared / lost chance
      ball.live=false; lives--; combo=0; chances++; flashR=0.4; S.lost(); floatText(ball.x,SY,'クリアされた','#ff6b6b');
      ball=null; gap=560; nextTimer=gap; if(lives<=0) setTimeout(gameOver,700);
    }
    return;
  }
  if(!ball){ nextTimer-=dt; if(nextTimer<=0) spawn(); }
}

// ---------- render ----------
function field(){
  let g=ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,'#134020'); g.addColorStop(1,'#1c5a2c');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  for(let i=0;i<10;i++){ ctx.fillStyle=i%2?'rgba(255,255,255,0.025)':'rgba(0,0,0,0.04)'; ctx.fillRect(0,i*(H/10),W,H/20); }
  // penalty box
  ctx.strokeStyle='rgba(255,255,255,0.4)'; ctx.lineWidth=3;
  ctx.strokeRect(170,GY,560,372);
  ctx.strokeRect(300,GY,300,110);
  ctx.beginPath(); ctx.arc((GX0+GX1)/2,GY+372,60,Math.PI+0.3,-0.3,true); ctx.stroke();
  ctx.fillStyle='rgba(255,255,255,0.5)'; ctx.beginPath(); ctx.arc((GX0+GX1)/2,320,3,0,Math.PI*2); ctx.fill();
}
function goal(){
  // net
  ctx.fillStyle='rgba(255,255,255,0.07)'; ctx.fillRect(GX0,NETY,GX1-GX0,GY-NETY);
  ctx.strokeStyle='rgba(255,255,255,0.2)'; ctx.lineWidth=1;
  const rip=netRip>0?Math.sin(performance.now()*0.03)*3*netRip:0;
  for(let x=GX0;x<=GX1;x+=14){ ctx.beginPath(); ctx.moveTo(x,NETY); ctx.lineTo(x+rip,GY); ctx.stroke(); }
  for(let y=NETY;y<=GY;y+=11){ ctx.beginPath(); ctx.moveTo(GX0,y); ctx.lineTo(GX1,y); ctx.stroke(); }
  // posts + crossbar
  ctx.strokeStyle='#fff'; ctx.lineWidth=7; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(GX0,GY); ctx.lineTo(GX0,NETY); ctx.moveTo(GX1,GY); ctx.lineTo(GX1,NETY); ctx.moveTo(GX0-3,NETY); ctx.lineTo(GX1+3,NETY); ctx.stroke();
  ctx.lineWidth=5; ctx.beginPath(); ctx.moveTo(GX0-3,GY); ctx.lineTo(GX1+3,GY); ctx.stroke();
}
function keeperDraw(){
  const kx=keeper.x;
  ctx.fillStyle='rgba(0,0,0,0.2)'; ctx.beginPath(); ctx.ellipse(kx,KY+16,18,6,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#ffe14d'; ctx.beginPath(); ctx.ellipse(kx,KY-4,15,19,0,0,Math.PI*2); ctx.fill(); // keeper kit yellow
  ctx.fillStyle='#f0c9a0'; ctx.beginPath(); ctx.arc(kx,KY-26,10,0,Math.PI*2); ctx.fill();
  // gloves spread
  ctx.strokeStyle='#ffe14d'; ctx.lineWidth=7; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(kx-6,KY-6); ctx.lineTo(kx-kw(),KY-2); ctx.moveTo(kx+6,KY-6); ctx.lineTo(kx+kw(),KY-2); ctx.stroke();
  ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(kx-kw(),KY-2,5,0,Math.PI*2); ctx.arc(kx+kw(),KY-2,5,0,Math.PI*2); ctx.fill();
}
function strikerDraw(){
  const lx=striker.x + striker.lunge*striker.ldir*16;
  // reach ring (green when a ball is reachable)
  const reachable = ball&&ball.live&&Math.abs(striker.x-ball.x)<REACH && ball.y>SY-120;
  ctx.strokeStyle=reachable?'rgba(140,255,168,0.5)':'rgba(255,255,255,0.14)'; ctx.lineWidth=2; ctx.setLineDash([5,7]);
  ctx.beginPath(); ctx.arc(striker.x,SY,REACH,0,Math.PI*2); ctx.stroke(); ctx.setLineDash([]);
  ctx.fillStyle='rgba(0,0,0,0.22)'; ctx.beginPath(); ctx.ellipse(striker.x,SY+20,17,6,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#3aa0ff'; ctx.beginPath(); ctx.ellipse(lx,SY-6,13,19,0,0,Math.PI*2); ctx.fill(); // striker blue
  ctx.fillStyle='#f0c9a0'; ctx.beginPath(); ctx.arc(lx,SY-28,10,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle='#3aa0ff'; ctx.lineWidth=7; ctx.lineCap='round';
  const kick=striker.lunge*striker.ldir*20;
  ctx.beginPath(); ctx.moveTo(lx-3,SY+10); ctx.lineTo(lx-6+kick,SY+28); ctx.moveTo(lx+3,SY+10); ctx.lineTo(lx+8+kick,SY+26); ctx.stroke();
}
function ballDraw(){
  if(ball&&ball.live){ const b=ball;
    ctx.fillStyle='rgba(0,0,0,0.2)'; ctx.beginPath(); ctx.ellipse(b.x,b.y+8,8,3,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(b.x,b.y,9,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#222'; ctx.beginPath(); ctx.arc(b.x,b.y,3,0,Math.PI*2); ctx.fill();
  }
  if(shot){ const p=Math.min(1,shot.el/shot.D); const x=shot.x+(shot.tx-shot.x)*p, y=shot.y+(shot.ty-shot.y)*p;
    ctx.strokeStyle='rgba(255,255,255,0.35)'; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(shot.x,shot.y); ctx.lineTo(x,y); ctx.stroke();
    ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(x,y,7,0,Math.PI*2); ctx.fill();
  }
}
function hud(){
  ctx.save(); ctx.textBaseline='middle';
  ctx.fillStyle='rgba(6,20,10,0.5)'; ctx.fillRect(0,0,W,60);
  for(let i=0;i<MAXLIFE;i++){ ctx.fillStyle=i<lives?'#8effa8':'#334'; ctx.beginPath(); ctx.arc(26+i*24,H-26,8,0,Math.PI*2); ctx.fill(); }
  ctx.fillStyle='#9fdcb0'; ctx.font='bold 12px sans-serif'; ctx.textAlign='left'; ctx.fillText('チャンス',26+MAXLIFE*24,H-26);
  ctx.textAlign='center'; ctx.fillStyle='#fff'; ctx.font='bold 26px sans-serif'; ctx.fillText('SCORE '+score,W/2,26);
  ctx.fillStyle='#9fb0c8'; ctx.font='bold 13px sans-serif'; ctx.fillText('ゴール '+goals+'　BEST '+best,W/2,48);
  if(combo>=2){ ctx.textAlign='right'; ctx.fillStyle='#ffd23e'; ctx.font='bold 20px sans-serif'; ctx.fillText('連続 ×'+combo,W-20,26); }
  ctx.restore();
}
function drawTitle(){
  ctx.save(); ctx.fillStyle='rgba(4,14,8,0.6)'; ctx.fillRect(0,0,W,H);
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillStyle='#fff'; ctx.font='bold 58px sans-serif'; ctx.fillText('ゴール前の詰め',W/2,140);
  ctx.fillStyle='#8effa8'; ctx.font='bold 22px sans-serif'; ctx.fillText('Poacher — こぼれ球を押し込め',W/2,186);
  ctx.fillStyle='#dfe6f0'; ctx.font='16px sans-serif';
  const lines=['ゴール前のこぼれ球に詰めて一発で押し込め！','ドラッグ / マウス / ←→ でストライカーを動かす。','リング内でタップ / スペースでシュート。','ボールの左右どちら側で合わせるかで狙う方向が変わる。','GKの逆を突いて流し込め。空振り・クリアで3チャンス失うと終了。'];
  for(let i=0;i<lines.length;i++) ctx.fillText(lines[i],W/2,246+i*29);
  ctx.fillStyle='#ffd23e'; ctx.font='bold 22px sans-serif'; ctx.fillText('タップでキックオフ',W/2,H-74);
  if(best>0){ ctx.fillStyle='#9fb0c8'; ctx.font='15px sans-serif'; ctx.fillText('ベストスコア '+best,W/2,H-44); }
  ctx.restore();
}
function drawOver(){
  ctx.save(); ctx.fillStyle='rgba(4,14,8,0.76)'; ctx.fillRect(0,0,W,H);
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillStyle='#fff'; ctx.font='bold 46px sans-serif'; ctx.fillText('試合終了',W/2,130);
  ctx.fillStyle='#ffd23e'; ctx.font='bold 64px sans-serif'; ctx.fillText(score+' pts',W/2,204);
  const dc = chances>0? (goals/chances*100):0;
  const stats=[['ゴール数',goals+' 点'],['最高連続',bestCombo+' 連続'],['決定率',dc.toFixed(0)+' %']];
  ctx.font='19px sans-serif';
  for(let i=0;i<stats.length;i++){ const yy=270+i*36; ctx.textAlign='right'; ctx.fillStyle='#9fb0c8'; ctx.fillText(stats[i][0],W/2-14,yy); ctx.textAlign='left'; ctx.fillStyle='#fff'; ctx.fillText(''+stats[i][1],W/2+14,yy); }
  if(score>=best&&score>0){ ctx.textAlign='center'; ctx.fillStyle='#8effa8'; ctx.font='bold 20px sans-serif'; ctx.fillText('★ ベスト更新！ ★',W/2,270+stats.length*36+6); }
  ctx.textAlign='center'; ctx.fillStyle='#8effa8'; ctx.font='bold 20px sans-serif'; ctx.fillText('タップでもう一度',W/2,H-56);
  ctx.restore();
}
function render(){
  ctx.save(); if(shake>0) ctx.translate(rr(-shake,shake),rr(-shake,shake));
  field(); goal();
  if(state==='play'){ keeperDraw(); ballDraw(); strikerDraw(); }
  for(const p of parts){ ctx.globalAlpha=Math.max(0,p.life); ctx.fillStyle=p.col; ctx.fillRect(p.x,p.y,p.sz,p.sz); }
  ctx.globalAlpha=1;
  for(const f of floats){ ctx.globalAlpha=Math.max(0,f.life); ctx.fillStyle=f.c; ctx.font='bold 22px sans-serif'; ctx.textAlign='center'; ctx.fillText(f.t,f.x,f.y); }
  ctx.globalAlpha=1;
  if(state==='play') hud();
  ctx.restore();
  if(flashG>0){ ctx.fillStyle='rgba(140,255,168,'+(flashG*0.24)+')'; ctx.fillRect(0,0,W,H); }
  if(flashR>0){ ctx.fillStyle='rgba(255,60,60,'+(flashR*0.36)+')'; ctx.fillRect(0,0,W,H); }
  if(state==='title') drawTitle();
  if(state==='over') drawOver();
}
function frame(now){ let dt=now-last; last=now; if(dt>60)dt=60; update(dt); render(); requestAnimationFrame(frame); }
requestAnimationFrame(frame);

// ---------- test hook ----------
window.__pf={
  get state(){return state;},
  get goals(){return goals;}, get lives(){return lives;}, get score(){return score;}, get combo(){return combo;},
  get ball(){ return (ball&&ball.live)?{x:ball.x,y:ball.y,line:SY}:null; },
  get keeper(){ return {x:keeper.x,w:kw()}; },
  get sx(){ return striker.x; }, get reach(){ return REACH; }, get line(){ return SY; }, get posts(){ return [GX0,GX1]; },
  get shooting(){ return !!shot; },
  setX(x){ striker.tx=Math.max(SXMIN,Math.min(SXMAX,x)); }, strike(){ doStrike(); }, tap(){ press(); }, start(){ if(state!=='play')press(); }
};
})();
</script>
</body>
</html>
