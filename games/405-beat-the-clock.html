<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ピッチクロックで攻めろ (Beat the Pitch Clock)</title>
<style>
  html,body{margin:0;padding:0;background:#0a1220;overflow:hidden;font-family:'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif;-webkit-user-select:none;user-select:none;touch-action:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 30%,#132339,#080d16 70%);}
  #stage{position:relative;width:min(100vw,calc(100vh*1.5));aspect-ratio:900/600;max-width:900px;box-shadow:0 10px 60px rgba(0,0,0,.6);border-radius:8px;overflow:hidden;}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;}
</style>
</head>
<body>
<div id="wrap"><div id="stage"><canvas id="cv"></canvas></div></div>
<script>
(function(){
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const W=900,H=600;let DPR=Math.min(2,window.devicePixelRatio||1);
function fit(){const r=cv.getBoundingClientRect();DPR=Math.min(2,window.devicePixelRatio||1);cv.width=Math.round(r.width*DPR);cv.height=Math.round(r.height*DPR);ctx.setTransform(cv.width/W,0,0,cv.height/H,0,0);}
new ResizeObserver(fit).observe(cv);fit();

// ---------- audio ----------
let AC=null;function actx(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function tone(f,d,type,v,sweep){const a=actx();if(!a)return;const o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.value=f;if(sweep)o.frequency.linearRampToValueAtTime(sweep,a.currentTime+d);g.gain.value=0.0001;g.gain.exponentialRampToValueAtTime(v||0.2,a.currentTime+0.008);g.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+d);o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+d+0.02);}
function noise(d,v,hp){const a=actx();if(!a)return;const n=a.createBufferSource(),b=a.createBuffer(1,a.sampleRate*d,a.sampleRate),dt=b.getChannelData(0);for(let i=0;i<dt.length;i++)dt[i]=Math.random()*2-1;n.buffer=b;const f=a.createBiquadFilter();f.type='highpass';f.frequency.value=hp||800;const g=a.createGain();g.gain.value=0.0001;g.gain.exponentialRampToValueAtTime(v||0.2,a.currentTime+0.01);g.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+d);n.connect(f);f.connect(g);g.connect(a.destination);n.start();n.stop(a.currentTime+d+0.02);}
const S={
  tick(){tone(1400,0.03,'square',0.05);},
  tock(){tone(900,0.05,'square',0.09);},
  fire(){noise(0.16,0.28,1200);tone(320,0.16,'sawtooth',0.16,120);},
  froze(){tone(180,0.5,'sine',0.22,90);tone(300,0.4,'triangle',0.14);},
  crush(){noise(0.28,0.4,300);tone(120,0.4,'sawtooth',0.3,60);},
  viol(){tone(220,0.5,'square',0.18,140);setTimeout(function(){tone(160,0.4,'square',0.16,90);},130);},
  combo(n){tone(520+Math.min(n,8)*70,0.12,'triangle',0.16);},
  start(){tone(440,0.1,'triangle',0.18);setTimeout(function(){tone(660,0.16,'triangle',0.2);},110);},
  over(){tone(330,0.3,'sine',0.2,160);setTimeout(function(){tone(220,0.5,'sine',0.2,110);},180);},
};

function clamp(v,a,b){return v<a?a:v>b?b:v;}
function rnd(a,b){return a+Math.random()*(b-a);}

// ---------- state ----------
let state='title';
let outs=0,fails=0,score=0,best=0,combo=0,lvl=1;
try{best=parseInt(localStorage.getItem('pc_best')||'0')||0;}catch(e){}
const TARGET=26;
// round
let phase='wind';    // wind | watch | result
let pt=0;            // phase timer ms
let clock=0;         // ms within watch
let deadT=1100,win=500,effWin=500,winStart=600,tough=false;
let decided=false,released=false,result='',quality=0,relClock=0;
let parts=[];
let shakeT=0,flash=0;
let batX=640,batLean=0,batSwing=0; // batter animation
let ballShown=false,ballU=0,ballHit=false;
let msg='',msgCol='#fff',msgT=0;

function reset(){outs=0;fails=0;score=0;combo=0;lvl=1;parts=[];}
function newPitch(){
  lvl=Math.min(7,1+Math.floor(outs/4));
  deadT=clamp(1180-lvl*58,720,1180);
  win=clamp(520-lvl*30,300,520);
  tough=Math.random()<clamp(0.2+lvl*0.05,0.2,0.5);
  effWin=tough?win*0.82:win;
  winStart=deadT-effWin;
  phase='wind';pt=0;clock=0;decided=false;released=false;result='';quality=0;relClock=0;
  ballShown=false;ballU=0;ballHit=false;batLean=0;batSwing=0;
}
function startGame(){reset();state='play';newPitch();S.start();}

function burst(x,y,col,n,sp){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=rnd(0.4,1)*(sp||3);parts.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:1,col:col,r:rnd(2,5)});}}

function release(){
  if(state!=='play'||phase!=='watch'||decided)return;
  decided=true;released=true;relClock=clock;
  ballShown=true;ballU=0;
  const c=clock;
  if(c<winStart){
    result='early';ballHit=true;
    combo=0;fails++;
    S.fire();setTimeout(S.crush,220);
    flash=0.5;shakeT=1;
    msg='打たれた！ 早く投げすぎ';msgCol='#ff5a5a';msgT=1;
  }else{
    result='right';
    quality=clamp((c-winStart)/effWin,0,1);
    outs++;combo++;
    const base=100+Math.round(quality*180);
    const cm=1+Math.min(combo-1,6)*0.12;
    const add=Math.round(base*cm)*Math.max(1,lvl);
    score+=add;
    S.fire();
    setTimeout(function(){S.froze();},210);
    if(combo>1)setTimeout(function(){S.combo(combo);},260);
    flash=0.35;
    msg=(quality>0.72?'完全に泳がせた！ 見逃し三振':quality>0.4?'詰まらせた！ 凡打':'間に合った 打ち取り')+'  +'+add;
    msgCol=quality>0.72?'#5affa0':'#8fe0ff';msgT=1;
    lastAdd=add;
  }
  phase='result';pt=0;
}
let lastAdd=0;
function violation(){
  decided=true;result='late';combo=0;fails++;
  S.viol();flash=0.4;shakeT=0.7;
  msg='ピッチクロック違反！ 自動ボール';msgCol='#ffb14a';msgT=1;
  phase='result';pt=0;
}

// ---------- input ----------
function act(){
  if(!AC)actx();
  if(state==='title'){startGame();return;}
  if(state==='over'){startGame();return;}
  if(state==='play'&&phase==='watch')release();
}
cv.addEventListener('mousedown',function(e){e.preventDefault();act();});
cv.addEventListener('touchstart',function(e){e.preventDefault();act();},{passive:false});
window.addEventListener('keydown',function(e){
  if(e.code==='Space'||e.code==='ArrowUp'||e.code==='KeyP'||e.code==='Enter'){e.preventDefault();act();}
});

// ---------- update ----------
let last=0;
function update(dt){
  if(flash>0)flash=Math.max(0,flash-dt/300);
  if(shakeT>0)shakeT=Math.max(0,shakeT-dt/300);
  if(msgT>0)msgT=Math.max(0,msgT-dt/1400);
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.x+=p.vx;p.y+=p.vy;p.vy+=0.16;p.life-=dt/620;if(p.life<=0)parts.splice(i,1);}
  if(state!=='play')return;
  pt+=dt;
  if(phase==='wind'){
    if(pt>=560){phase='watch';pt=0;clock=0;lastTickSec=99;}
  }else if(phase==='watch'){
    const prev=clock;clock+=dt;
    // tick sound each displayed second
    const sec=Math.ceil(15*(deadT-clock)/deadT);
    if(sec!==lastTickSec&&sec>=0){lastTickSec=sec;if(sec<=5&&sec>0)S.tock();else S.tick();}
    // batter gets antsy
    const eag=clamp(clock/deadT,0,1);
    batLean=eag;
    if(clock>=deadT&&!decided)violation();
  }else if(phase==='result'){
    if(ballShown&&ballU<1)ballU=Math.min(1,ballU+dt/300);
    if(result==='early'&&ballU>0.5&&batSwing<1)batSwing=Math.min(1,batSwing+dt/160);
    // frozen "見逃し三振" (quality>0.72) does NOT swing; jammed/weak contact does
    if(result==='right'&&quality<=0.72){ if(ballU>0.6&&batSwing<0.42)batSwing=Math.min(0.42,batSwing+dt/240);}
    if(pt>=980){
      if(fails>=3){state='over';best=Math.max(best,score);try{localStorage.setItem('pc_best',String(best));}catch(e){}S.over();}
      else if(outs>=TARGET){state='over';best=Math.max(best,score);try{localStorage.setItem('pc_best',String(best));}catch(e){}S.start();}
      else newPitch();
    }
  }
}
let lastTickSec=99;

// ---------- render ----------
function roundRect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

function drawField(){
  // sky
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#16324f');g.addColorStop(0.5,'#1c4a34');g.addColorStop(1,'#123f2b');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  // outfield wall
  ctx.fillStyle='#0f2a1e';ctx.fillRect(0,150,W,30);
  ctx.fillStyle='#20402e';ctx.fillRect(0,180,W,H-180);
  // dirt infield (home area)
  ctx.fillStyle='#8a5a34';ctx.beginPath();ctx.ellipse(450,520,300,120,0,0,Math.PI*2);ctx.fill();
  // mound
  ctx.fillStyle='#9a663a';ctx.beginPath();ctx.ellipse(450,300,70,34,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#c9c2b6';ctx.fillRect(438,292,24,7);
  // home plate
  ctx.fillStyle='#eee';ctx.beginPath();ctx.moveTo(450,548);ctx.lineTo(468,536);ctx.lineTo(468,522);ctx.lineTo(432,522);ctx.lineTo(432,536);ctx.closePath();ctx.fill();
  // batter box
  ctx.strokeStyle='rgba(255,255,255,.5)';ctx.lineWidth=2;ctx.strokeRect(560,494,58,86);ctx.strokeRect(282,494,58,86);
}

function drawPitcher(){
  const cx=450,cy=290;
  let arm=0;
  if(phase==='result'&&released){arm=clamp(ballU*2.4,0,1);}
  else if(phase==='watch'){arm=-0.12+0.05*Math.sin(clock/120);}
  // shadow
  ctx.fillStyle='rgba(0,0,0,.25)';ctx.beginPath();ctx.ellipse(cx,cy+18,26,8,0,0,Math.PI*2);ctx.fill();
  // body
  ctx.fillStyle='#d8dde6';ctx.fillRect(cx-11,cy-30,22,34);
  ctx.fillStyle='#26406b';ctx.fillRect(cx-11,cy+2,22,14);
  // head
  ctx.fillStyle='#f0c9a0';ctx.beginPath();ctx.arc(cx,cy-38,10,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#26406b';ctx.beginPath();ctx.arc(cx,cy-40,11,Math.PI*1.05,Math.PI*2.05);ctx.fill();
  // throwing arm
  ctx.strokeStyle='#f0c9a0';ctx.lineWidth=6;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(cx+8,cy-22);
  const ax=cx+8+Math.cos(-1.2+arm*2.2)*26,ay=cy-22+Math.sin(-1.2+arm*2.2)*26;
  ctx.lineTo(ax,ay);ctx.stroke();
  // glove arm holding ball (before release)
  if(!(phase==='result'&&released)){
    ctx.fillStyle='#5a3a22';ctx.beginPath();ctx.arc(cx-10,cy-14,7,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(cx-10,cy-14,3.4,0,Math.PI*2);ctx.fill();
  }
}

function drawBall(){
  if(phase!=='result'||!ballShown)return;
  const sx=450,sy=272,ex=450,ey=520;
  const u=ballU;
  const x=sx+(ex-sx)*u, y=sy+(ey-sy)*u - Math.sin(u*Math.PI)*20;
  const r=6+u*3;
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='#d33';ctx.lineWidth=1;ctx.beginPath();ctx.arc(x-2,y,r*0.7,-0.7,0.7);ctx.stroke();
  if(result==='early'&&ballHit&&u>0.5){
    // line drive off
    const t=(u-0.5)*2;const lx=x+t*260,ly=y-t*120;
    ctx.strokeStyle='rgba(255,220,120,.6)';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(lx,ly);ctx.stroke();
  }
}

function drawBatter(){
  const bx=590,by=560;
  const lean=(state==='play'?batLean:0);
  const sw=batSwing;
  ctx.save();ctx.translate(bx,by);
  // shadow
  ctx.fillStyle='rgba(0,0,0,.25)';ctx.beginPath();ctx.ellipse(0,4,20,7,0,0,Math.PI*2);ctx.fill();
  // antsy jitter
  const j=(phase==='watch')?Math.sin(clock/70)*lean*2:0;
  ctx.translate(j,0);
  // legs
  ctx.fillStyle='#b32d2d';ctx.fillRect(-12,-30,10,30);ctx.fillRect(3,-30,10,30);
  // torso, leaning forward as antsy
  ctx.rotate(-lean*0.12);
  ctx.fillStyle='#e8e8ec';ctx.fillRect(-13,-64,26,36);
  // head
  ctx.fillStyle='#f0c9a0';ctx.beginPath();ctx.arc(0,-74,10,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#b32d2d';ctx.beginPath();ctx.arc(0,-76,11,Math.PI*1.0,Math.PI*2.1);ctx.fill();
  // bat
  ctx.save();
  let ba;
  if(sw>0){ba=-2.3+sw*3.2;}else{ba=-2.3-lean*0.25;}
  ctx.translate(-6,-58);ctx.rotate(ba);
  ctx.strokeStyle='#c98b3a';ctx.lineWidth=6;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(46,0);ctx.stroke();
  ctx.restore();
  ctx.restore();
}

function drawClock(){
  // big countdown top center
  const remMs=Math.max(0,deadT-clock);
  const sec=phase==='watch'?Math.ceil(15*remMs/deadT):(phase==='wind'?15:0);
  const danger=phase==='watch'&&clock>=winStart;
  const violZone=phase==='watch'&&clock>=deadT-70;
  // clock housing
  ctx.save();
  ctx.translate(450,66);
  roundRect(-70,-40,140,80,12);ctx.fillStyle='#05131f';ctx.fill();
  ctx.lineWidth=3;ctx.strokeStyle=violZone?'#ff5252':(danger?'#3ad07a':'#2a4560');ctx.stroke();
  ctx.font='bold 58px "Courier New",monospace';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillStyle=violZone?'#ff6a6a':(danger?'#5affa0':'#e6f0ff');
  if(danger&&Math.floor(clock/120)%2===0)ctx.fillStyle=violZone?'#ff9a9a':'#aaffcf';
  ctx.fillText(String(sec).padStart(2,'0'),0,4);
  ctx.restore();
  ctx.font='12px sans-serif';ctx.fillStyle='#8fb2cf';ctx.textAlign='center';
  ctx.fillText('PITCH CLOCK',450,116);

  // timing meter (bottom)
  const mx=150,mw=600,my=560,mh=18;
  roundRect(mx,my,mw,mh,9);ctx.fillStyle='rgba(0,0,0,.4)';ctx.fill();
  // early(red) region 0..winStart
  const wsX=mx+mw*(winStart/deadT);
  ctx.fillStyle='rgba(210,70,70,.32)';ctx.fillRect(mx,my,wsX-mx,mh);
  // green window winStart..deadT with gradient deepening
  const gg=ctx.createLinearGradient(wsX,0,mx+mw,0);gg.addColorStop(0,'rgba(90,220,150,.35)');gg.addColorStop(1,'rgba(60,255,150,.85)');
  ctx.fillStyle=gg;ctx.fillRect(wsX,my,(mx+mw)-wsX,mh);
  // frame
  roundRect(mx,my,mw,mh,9);ctx.strokeStyle='rgba(255,255,255,.4)';ctx.lineWidth=1.5;ctx.stroke();
  // labels
  ctx.font='11px sans-serif';ctx.textAlign='left';ctx.fillStyle='#ff9a9a';ctx.fillText('早い＝打たれる',mx+4,my-6);
  ctx.textAlign='right';ctx.fillStyle='#aaffcf';ctx.fillText('粘って泳がせろ →（限界まで）',mx+mw-4,my-6);
  // marker
  if(phase==='watch'||phase==='result'){
    const cc=phase==='watch'?clock:relClock;
    const px=mx+mw*clamp((result==='late'?deadT:cc)/deadT,0,1);
    ctx.fillStyle='#fff';ctx.fillRect(px-2,my-5,4,mh+10);
    ctx.beginPath();ctx.moveTo(px,my-8);ctx.lineTo(px-6,my-16);ctx.lineTo(px+6,my-16);ctx.closePath();ctx.fill();
  }
}

function drawHUD(){
  ctx.textAlign='left';ctx.textBaseline='alphabetic';
  ctx.font='bold 20px sans-serif';ctx.fillStyle='#fff';
  ctx.fillText('打ち取り '+outs+' / '+TARGET,20,32);
  // fails as bases/lights
  ctx.font='14px sans-serif';ctx.fillStyle='#ffb14a';
  ctx.fillText('許した '+fails+' / 3',20,54);
  ctx.textAlign='right';
  ctx.font='bold 20px sans-serif';ctx.fillStyle='#ffe08a';ctx.fillText('SCORE '+score,W-20,32);
  ctx.font='13px sans-serif';ctx.fillStyle='#8fb2cf';ctx.fillText('BEST '+Math.max(best,score)+'   Lv.'+lvl,W-20,52);
  if(combo>1){ctx.textAlign='center';ctx.font='bold 22px sans-serif';ctx.fillStyle='#5affa0';ctx.fillText(combo+' 連続打ち取り!',450,150);}
}

function drawMsg(){
  if(msgT<=0)return;
  ctx.save();ctx.globalAlpha=clamp(msgT*1.4,0,1);
  ctx.textAlign='center';ctx.font='bold 30px sans-serif';
  ctx.fillStyle='rgba(0,0,0,.55)';roundRect(450-260,196,520,50,10);ctx.fill();
  ctx.fillStyle=msgCol;ctx.fillText(msg,450,230);
  ctx.restore();
}

function drawTitle(){
  drawField();
  ctx.save();ctx.textAlign='center';
  ctx.fillStyle='rgba(0,0,0,.5)';roundRect(140,120,620,360,16);ctx.fill();
  ctx.fillStyle='#fff';ctx.font='bold 40px sans-serif';ctx.fillText('ピッチクロックで攻めろ',450,190);
  ctx.font='18px sans-serif';ctx.fillStyle='#9fe0ff';ctx.fillText('Beat the Pitch Clock',450,220);
  ctx.font='16px sans-serif';ctx.fillStyle='#e6eefc';
  const lines=[
    'あなたは投手。焦れた打者を「限界まで粘って」泳がせろ。',
    'クロックが進むほど打者は前のめり＝タイミングを外せる。',
    '緑ゾーンの奥＝ギリギリで投げるほど打ち取りは会心に！',
    '早すぎ＝ジャストミートで痛打。0秒＝ピッチクロック違反で自動ボール。',
    'タップ / クリック / SPACE / ↑ で投球。',
  ];
  for(let i=0;i<lines.length;i++)ctx.fillText(lines[i],450,270+i*30);
  ctx.fillStyle='#ffe08a';ctx.font='bold 22px sans-serif';
  ctx.fillText('タップ / SPACE でスタート',450,452);
  ctx.restore();
}

function drawOver(){
  drawField();drawBatter();
  ctx.save();ctx.textAlign='center';
  ctx.fillStyle='rgba(0,0,0,.6)';roundRect(190,150,520,300,16);ctx.fill();
  const win=outs>=TARGET;
  ctx.fillStyle=win?'#5affa0':'#ff8a5a';ctx.font='bold 40px sans-serif';
  ctx.fillText(win?'完投勝利！':'ノックアウト',450,222);
  ctx.fillStyle='#fff';ctx.font='20px sans-serif';
  ctx.fillText('打ち取り '+outs+' / '+TARGET,450,270);
  ctx.fillText('スコア '+score,450,304);
  ctx.fillStyle='#ffe08a';ctx.fillText('ベスト '+Math.max(best,score),450,336);
  ctx.fillStyle='#9fe0ff';ctx.font='bold 20px sans-serif';
  ctx.fillText('タップ / SPACE でもう一度',450,404);
  ctx.restore();
}

function render(){
  ctx.save();
  if(shakeT>0){const s=shakeT*8;ctx.translate(rnd(-s,s),rnd(-s,s));}
  if(state==='title'){drawTitle();}
  else if(state==='over'){drawOver();}
  else{
    drawField();
    drawPitcher();
    drawBatter();
    drawBall();
    drawClock();
    drawHUD();
    drawMsg();
  }
  // particles
  for(const p of parts){ctx.globalAlpha=clamp(p.life,0,1);ctx.fillStyle=p.col;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();}
  ctx.globalAlpha=1;
  ctx.restore();
  if(flash>0){ctx.fillStyle='rgba(255,255,255,'+(flash*0.5)+')';ctx.fillRect(0,0,W,H);}
}

function frame(ts){let dt=ts-last;last=ts;if(dt>60)dt=60;if(dt<0)dt=0;update(dt);render();requestAnimationFrame(frame);}
requestAnimationFrame(frame);

// spawn celebratory particles on resolve
let lastResultKey='';
setInterval(function(){
  if(phase==='result'&&result&&lastResultKey!==result+relClock){
    lastResultKey=result+relClock;
    if(result==='right')burst(450,510,'#5affa0',18,4);
    else if(result==='early')burst(590,520,'#ff6a6a',22,5);
    else burst(450,66,'#ffb14a',16,4);
  }
},30);

// ---------- test hook ----------
window.__pc={
  start:startGame,
  act:act,
  pitch:release,
  get state(){return state;},
  get outs(){return outs;},
  get fails(){return fails;},
  get score(){return score;},
  get info(){return {state:state,phase:phase,clock:clock,deadT:deadT,win:win,effWin:effWin,winStart:winStart,tough:tough,decided:decided,released:released,result:result,quality:quality,outs:outs,fails:fails,lvl:lvl,canAct:(state==='play'&&phase==='watch'&&!decided)};}
};
})();
</script>
</body>
</html>
