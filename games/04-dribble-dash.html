<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ドリブル・ダッシュ — Dribble Dash</title>
<style>
  :root{--pitch:#1a9a4f;--pitch-d:#127a3d;--chalk:#eaf7ee;--gold:#ffcf3a;--hot:#ff5a3c;--ink:#06210f;--cyan:#3ae8cf;}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:#04160c;font-family:"Arial Narrow","Roboto Condensed",system-ui,sans-serif;
    color:var(--chalk);display:flex;align-items:center;justify-content:center;overflow:hidden;
    -webkit-user-select:none;user-select:none;touch-action:manipulation;}
  #stage{position:relative;width:min(100vw,calc(100vh*0.667));aspect-ratio:2/3;max-height:100vh;
    box-shadow:0 30px 80px rgba(0,0,0,.6);overflow:hidden;background:#1a9a4f;}
  canvas{display:block;width:100%;height:100%}
  #hud{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;
    padding:clamp(6px,2vw,12px);pointer-events:none;gap:8px;}
  .board{background:rgba(6,33,15,.72);backdrop-filter:blur(6px);border:1px solid rgba(58,232,207,.35);
    border-radius:10px;padding:5px clamp(9px,2.5vw,15px);display:flex;flex-direction:column;line-height:1;}
  .board .label{font-size:clamp(9px,2.4vw,12px);letter-spacing:.16em;text-transform:uppercase;color:var(--cyan);opacity:.9}
  .board .value{font-family:"Courier New",monospace;font-weight:700;font-size:clamp(20px,6vw,34px);
    font-variant-numeric:tabular-nums;color:var(--chalk);}
  #best .value{color:var(--gold)}
  #hint{position:absolute;bottom:0;left:0;right:0;text-align:center;
    padding:8px 12px calc(10px + env(safe-area-inset-bottom));font-size:clamp(12px,3.4vw,17px);
    letter-spacing:.03em;color:var(--chalk);background:linear-gradient(transparent,rgba(6,33,15,.72));pointer-events:none;}
  #hint b{color:var(--cyan)}
  #overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:clamp(10px,3vw,20px);text-align:center;padding:22px;
    background:radial-gradient(120% 80% at 50% 25%,rgba(26,154,79,.4),rgba(4,22,12,.93));
    backdrop-filter:blur(3px);z-index:5;transition:opacity .35s;}
  #overlay.hidden{opacity:0;pointer-events:none}
  #overlay h1{font-size:clamp(34px,12vw,72px);font-weight:900;letter-spacing:.02em;line-height:.9;
    text-transform:uppercase;color:var(--chalk);text-shadow:0 5px 0 rgba(0,0,0,.35),0 0 36px rgba(58,232,207,.4);}
  #overlay h1 span{display:block;color:var(--gold);font-size:.5em;letter-spacing:.2em}
  #overlay p{max-width:26ch;font-size:clamp(14px,4vw,18px);line-height:1.45;opacity:.92}
  #playBtn{pointer-events:auto;cursor:pointer;border:none;border-radius:100px;
    padding:clamp(13px,3vw,18px) clamp(32px,9vw,56px);font-family:inherit;font-weight:900;
    font-size:clamp(18px,5vw,26px);letter-spacing:.12em;text-transform:uppercase;color:var(--ink);
    background:linear-gradient(180deg,var(--cyan),#12b79c);box-shadow:0 8px 0 #0a6a5a,0 14px 30px rgba(0,0,0,.5);
    transition:transform .08s,box-shadow .08s;}
  #playBtn:active{transform:translateY(5px);box-shadow:0 3px 0 #0a6a5a}
  #playBtn:focus-visible{outline:3px solid var(--hot);outline-offset:4px}
  .sub{font-size:clamp(11px,3vw,14px);letter-spacing:.2em;text-transform:uppercase;color:var(--cyan);opacity:.85}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div id="stage">
  <canvas id="c"></canvas>
  <div id="hud">
    <div class="board"><span class="label">Distance</span><span class="value" id="dist">0<small style="font-size:.5em;opacity:.6">m</small></span></div>
    <div class="board" id="best" style="text-align:right"><span class="label">Best</span><span class="value" id="best-v">0<small style="font-size:.5em;opacity:.6">m</small></span></div>
  </div>
  <div id="hint">◀ ▶ / タップ左右 でレーン移動。DFを避けて⚽を集めろ</div>
  <div id="overlay">
    <div class="sub">Soccer · Endless Run</div>
    <h1>ドリブル<span>Dash</span></h1>
    <p>左右キー or 画面タップでレーン移動。ディフェンダーをかわし続け、金の⚽で加点。ぶつかったら終了。どこまで走れる？</p>
    <button id="playBtn">Start</button>
    <div class="sub" style="opacity:.55">← → / Tap L-R</div>
  </div>
</div>

<script>
(()=>{
"use strict";
const cvs=document.getElementById('c'),ctx=cvs.getContext('2d');
const W=600,H=900;let dpr=Math.min(window.devicePixelRatio||1,2);
function resize(){const r=cvs.getBoundingClientRect();cvs.width=Math.round(r.width*dpr);cvs.height=Math.round(r.height*dpr);
  ctx.setTransform(cvs.width/W,0,0,cvs.height/H,0,0);}
new ResizeObserver(resize).observe(cvs);resize();

let AC=null;function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function tone(f,d,t='sine',v=.2,to=null){const a=ac();if(!a)return;const o=a.createOscillator(),g=a.createGain();
  o.type=t;o.frequency.setValueAtTime(f,a.currentTime);if(to)o.frequency.exponentialRampToValueAtTime(to,a.currentTime+d);
  g.gain.setValueAtTime(v,a.currentTime);g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+d);
  o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+d);}
function noise(d,v){const a=ac();if(!a)return;const n=a.createBuffer(1,a.sampleRate*d,a.sampleRate);const dt=n.getChannelData(0);
  for(let i=0;i<dt.length;i++)dt[i]=(Math.random()*2-1)*(1-i/dt.length);const s=a.createBufferSource();s.buffer=n;
  const g=a.createGain();g.gain.value=v;s.connect(g);g.connect(a.destination);s.start();}
const sSwitch=()=>tone(600,.06,'square',.12,760);
const sCoin=()=>{tone(880,.06,'square',.18);setTimeout(()=>tone(1320,.1,'square',.18),55);};
const sCrash=()=>{noise(.25,.35);tone(180,.3,'sawtooth',.28,60);};
const sBoost=()=>tone(300,.25,'sawtooth',.2,900);

const LANES=3, laneX=i=>110+i*190; // 110,300,490
const S={IDLE:'idle',RUN:'run',OVER:'over'};
let state=S.IDLE;
let player={lane:1,x:laneX(1),y:H-190,anim:0,tilt:0};
let obstacles=[], coins=[], speedLines=[], particles=[];
const store={get(k){try{return localStorage.getItem(k);}catch(e){return null;}},set(k,v){try{localStorage.setItem(k,v);}catch(e){}}};
let scroll=0, speed=0, dist=0, best=Number(store.get('dd_best')||0);
let spawnZ=0, tPrev=0, shake=0, boost=0, flash=0;

function reset(){player.lane=1;player.x=laneX(1);player.tilt=0;obstacles=[];coins=[];particles=[];
  scroll=0;speed=6.2;dist=0;spawnZ=0;shake=0;boost=0;flash=0;
  document.getElementById('best-v').innerHTML=Math.floor(best)+'<small style="font-size:.5em;opacity:.6">m</small>';}
function start(){reset();document.getElementById('overlay').classList.add('hidden');state=S.RUN;}
function move(dir){if(state!==S.RUN)return;const n=Math.max(0,Math.min(LANES-1,player.lane+dir));
  if(n!==player.lane){player.lane=n;player.tilt=dir*0.5;sSwitch();}}

// input
window.addEventListener('keydown',e=>{
  if(e.code==='ArrowLeft'||e.code==='KeyA'){e.preventDefault();move(-1);}
  else if(e.code==='ArrowRight'||e.code==='KeyD'){e.preventDefault();move(1);}
  else if(e.code==='Space'){e.preventDefault();if(state!==S.RUN){const a=ac();a&&a.resume&&a.resume();start();}}
});
cvs.addEventListener('pointerdown',e=>{const a=ac();a&&a.resume&&a.resume();
  if(state!==S.RUN){return;}const r=cvs.getBoundingClientRect();const rx=(e.clientX-r.left)/r.width;
  move(rx<0.5?-1:1);});
document.getElementById('playBtn').addEventListener('click',e=>{e.stopPropagation();ac()&&ac().resume&&ac().resume();start();});

function spawnRow(){
  // choose 1-2 lanes to block, leave >=1 free
  const nBlock=Math.random()<0.45?2:1;
  const lanesArr=[0,1,2];
  // shuffle
  for(let i=lanesArr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[lanesArr[i],lanesArr[j]]=[lanesArr[j],lanesArr[i]];}
  const blocked=lanesArr.slice(0,nBlock);
  const freeLanes=lanesArr.slice(nBlock);
  blocked.forEach(l=>obstacles.push({lane:l,x:laneX(l),y:-70,hit:false}));
  // coin in a free lane sometimes
  if(Math.random()<0.7){const cl=freeLanes[Math.floor(Math.random()*freeLanes.length)];
    coins.push({lane:cl,x:laneX(cl),y:-70,got:false,boost:Math.random()<0.12});}
}

function update(dt){
  if(state===S.RUN){
    const sp=speed*(boost>0?1.7:1);
    scroll+=sp*dt*60;
    dist+=sp*dt*3;
    speed+=dt*0.14; // ramp
    if(boost>0)boost=Math.max(0,boost-dt);
    // spawn rows by distance
    spawnZ-=sp*dt*60;
    if(spawnZ<=0){spawnRow();spawnZ=190+Math.random()*90;}
    // move entities down
    const move=sp*dt*60;
    obstacles.forEach(o=>o.y+=move);
    coins.forEach(c=>c.y+=move);
    // player x smooth
    const tx=laneX(player.lane);player.x+=(tx-player.x)*Math.min(1,dt*16);
    player.tilt*=0.86;player.anim+=dt*14;
    // collisions
    for(const o of obstacles){if(o.hit)continue;
      if(Math.abs(o.y-player.y)<52 && o.lane===player.lane){o.hit=true;crash();return;}}
    for(const c of coins){if(c.got)continue;
      if(Math.abs(c.y-player.y)<48 && c.lane===player.lane){c.got=true;
        if(c.boost){boost=2.2;flash=.6;sBoost();dist+=15;}else{dist+=8;sCoin();}
        for(let i=0;i<10;i++){const a=Math.random()*7,s=1+Math.random()*4;
          particles.push({x:c.x,y:c.y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,col:c.boost?'#3ae8cf':'#ffcf3a',r:2+Math.random()*3});}}}
    // cull
    obstacles=obstacles.filter(o=>o.y<H+80);
    coins=coins.filter(c=>c.y<H+80&&!c.got);
    // speed lines
    if(Math.random()<0.5)speedLines.push({x:Math.random()*W,y:-20,len:30+Math.random()*40});
    document.getElementById('dist').innerHTML=Math.floor(dist)+'<small style="font-size:.5em;opacity:.6">m</small>';
  }
  speedLines.forEach(s=>s.y+= (state===S.RUN?(speed*(boost>0?1.7:1)):4)*dt*60*1.4);
  speedLines=speedLines.filter(s=>s.y<H+40);
  for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.x+=p.vx;p.y+=p.vy;p.vy+=.2;p.life-=dt*1.3;if(p.life<=0)particles.splice(i,1);}
  if(shake>0)shake=Math.max(0,shake-dt*30);
  if(flash>0)flash=Math.max(0,flash-dt*1.5);
}
function crash(){sCrash();shake=16;flash=.8;state=S.OVER;
  for(let i=0;i<24;i++){const a=Math.random()*7,s=2+Math.random()*6;
    particles.push({x:player.x,y:player.y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,col:['#ff5a3c','#fff','#ffcf3a'][i%3],r:2+Math.random()*4});}
  if(dist>best){best=dist;store.set('dd_best',Math.floor(best));}
  setTimeout(showOver,700);}
function showOver(){const ov=document.getElementById('overlay');
  ov.querySelector('.sub').textContent='Tackled!';
  ov.querySelector('h1').innerHTML=Math.floor(dist)+'m<span>'+(dist>=best?'NEW BEST!':'GOOD RUN')+'</span>';
  ov.querySelector('p').textContent='ベスト '+Math.floor(best)+'m。もう一度ドリブル突破に挑戦！';
  ov.querySelector('#playBtn').textContent='Retry';
  ov.classList.remove('hidden');}

// ---- render ----
function drawField(){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#1aa054');g.addColorStop(1,'#127a3d');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  // scrolling stripes
  const stripeH=90, off=scroll%stripeH;
  for(let y=-stripeH+off;y<H;y+=stripeH){ctx.fillStyle='rgba(255,255,255,0.04)';ctx.fillRect(0,y,W,stripeH/2);}
  // lane divider lines
  ctx.strokeStyle='rgba(255,255,255,.18)';ctx.lineWidth=4;ctx.setLineDash([26,26]);
  const lo=scroll%52;
  for(let i=1;i<LANES;i++){const x=(laneX(i-1)+laneX(i))/2;ctx.beginPath();ctx.moveTo(x,-52+lo);ctx.lineTo(x,H);ctx.stroke();}
  ctx.setLineDash([]);
  // side lines
  ctx.strokeStyle='rgba(255,255,255,.4)';ctx.lineWidth=5;
  ctx.beginPath();ctx.moveTo(20,0);ctx.lineTo(20,H);ctx.moveTo(W-20,0);ctx.lineTo(W-20,H);ctx.stroke();
  // speed lines
  ctx.strokeStyle='rgba(255,255,255,.13)';ctx.lineWidth=3;
  for(const s of speedLines){ctx.beginPath();ctx.moveTo(s.x,s.y);ctx.lineTo(s.x,s.y+s.len);ctx.stroke();}
}
function drawDefender(o){
  ctx.save();ctx.translate(o.x,o.y);
  ctx.fillStyle='rgba(0,0,0,.28)';ctx.beginPath();ctx.ellipse(0,30,26,9,0,0,7);ctx.fill();
  // body (red kit)
  ctx.fillStyle='#d5342e';ctx.beginPath();roundRect(-18,-24,36,44,10);ctx.fill();
  ctx.fillStyle='#e8b88a';ctx.beginPath();ctx.arc(0,-34,13,0,7);ctx.fill();
  ctx.fillStyle='#0c2138';ctx.fillRect(-18,16,36,10);
  // arms out (blocking)
  ctx.strokeStyle='#d5342e';ctx.lineWidth=9;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(-14,-10);ctx.lineTo(-30,4);ctx.moveTo(14,-10);ctx.lineTo(30,4);ctx.stroke();
  ctx.restore();
}
function drawCoin(c){
  ctx.save();ctx.translate(c.x,c.y);
  const pulse=1+Math.sin((c.y+scroll)*0.05)*0.08;
  if(c.boost){ctx.fillStyle='#3ae8cf';ctx.font='bold 34px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('⚡',0,0);}
  else{ctx.scale(pulse,pulse);
    ctx.fillStyle='#ffcf3a';ctx.beginPath();ctx.arc(0,0,17,0,7);ctx.fill();
    ctx.fillStyle='#111';const rot=(c.y+scroll)*0.03;
    for(let i=0;i<5;i++){const a=rot+i*1.256;ctx.beginPath();ctx.arc(Math.cos(a)*8,Math.sin(a)*8,3.4,0,7);ctx.fill();}
    ctx.strokeStyle='rgba(0,0,0,.3)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,0,17,0,7);ctx.stroke();}
  ctx.restore();
}
function drawPlayer(){
  const bob=Math.sin(player.anim)*3;
  ctx.save();ctx.translate(player.x,player.y+bob);ctx.rotate(player.tilt*0.25);
  if(boost>0){ctx.shadowColor='#3ae8cf';ctx.shadowBlur=22;}
  ctx.fillStyle='rgba(0,0,0,.3)';ctx.shadowBlur=0;ctx.beginPath();ctx.ellipse(0,32,24,8,0,0,7);ctx.fill();
  // blue kit
  if(boost>0){ctx.shadowColor='#3ae8cf';ctx.shadowBlur=22;}
  ctx.fillStyle='#1f6fe0';ctx.beginPath();roundRect(-17,-24,34,44,10);ctx.fill();ctx.shadowBlur=0;
  ctx.fillStyle='#e8b88a';ctx.beginPath();ctx.arc(0,-34,13,0,7);ctx.fill();
  ctx.fillStyle='#fff';ctx.fillRect(-17,14,34,10);
  ctx.fillStyle='#fff';ctx.font='bold 13px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('10',0,-2);
  ctx.restore();
  // dribbled ball in front
  ctx.save();ctx.translate(player.x,player.y+42+Math.sin(player.anim*1.3)*4);
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(0,0,11,0,7);ctx.fill();
  ctx.strokeStyle='#0c2138';ctx.lineWidth=1.4;ctx.beginPath();ctx.arc(0,0,11,0,7);ctx.stroke();
  ctx.fillStyle='#111';ctx.beginPath();ctx.arc(0,0,3.4,0,7);ctx.fill();ctx.restore();
}
function roundRect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function render(){
  ctx.clearRect(0,0,W,H);ctx.save();
  if(shake>0)ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
  drawField();
  for(const c of coins)if(!c.got)drawCoin(c);
  for(const o of obstacles)drawDefender(o);
  if(state!==S.OVER||true)drawPlayer();
  for(const p of particles){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.col;
    ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill();}
  ctx.globalAlpha=1;ctx.restore();
  if(flash>0){ctx.fillStyle='rgba(58,232,207,'+(flash*0.3)+')';ctx.fillRect(0,0,W,H);}
}
function loop(t){if(!tPrev)tPrev=t;let dt=(t-tPrev)/1000;tPrev=t;if(dt>.05)dt=.05;update(dt);render();requestAnimationFrame(loop);}
reset();requestAnimationFrame(loop);state=S.IDLE;
})();
</script>
