<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>直接フリーキック (Over the Wall)</title>
<style>
  html,body{margin:0;height:100%;background:#0a1a10;overflow:hidden;
    font-family:-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  #stage{position:relative;width:100vw;height:100vh;max-width:calc(100vh*1.5);max-height:calc(100vw/1.5);aspect-ratio:900/600;}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;border-radius:6px;}
</style>
</head>
<body>
<div id="wrap"><div id="stage"><canvas id="cv"></canvas></div></div>
<script>
(function(){
const W=900,H=600,cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let DPR=1;
function fit(){DPR=Math.min(2,window.devicePixelRatio||1);cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
fit();addEventListener('resize',fit);

// ---------- audio ----------
let AC=null;function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function tone(f,d,type,v,sweep){const a=ac();if(!a)return;const t=a.currentTime,o=a.createOscillator(),g=a.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(sweep)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+sweep),t+d);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v||0.2,t+0.008);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+0.02);}
function noise(d,v,hp){const a=ac();if(!a)return;const t=a.currentTime,n=Math.floor(a.sampleRate*d),buf=a.createBuffer(1,n,a.sampleRate),ch=buf.getChannelData(0);
  for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource();s.buffer=buf;
  const f=a.createBiquadFilter();f.type='highpass';f.frequency.value=hp||600;const g=a.createGain();g.gain.value=v||0.2;
  s.connect(f);f.connect(g);g.connect(a.destination);s.start(t);s.stop(t+d+0.02);}
const S={
  lock:()=>{tone(720,0.06,'square',0.14);},
  kick:()=>{noise(0.08,0.3,700);tone(180,0.12,'sine',0.16,120);},
  goal:()=>{[660,880,1100,1320,1650].forEach((f,i)=>setTimeout(()=>tone(f,0.15,'triangle',0.2),i*80));noise(0.5,0.12,300);},
  save:()=>{noise(0.14,0.24,500);tone(300,0.16,'square',0.14,-90);},
  wall:()=>{noise(0.14,0.3,240);tone(150,0.16,'sawtooth',0.16,-60);},
  miss:()=>{tone(300,0.2,'sawtooth',0.14,-120);noise(0.12,0.1,300);},
  over:()=>{[440,330,247,175].forEach((f,i)=>setTimeout(()=>tone(f,0.3,'triangle',0.2),i*160));}
};

// ---------- geometry ----------
const PX0=306, PX1=594;        // goal posts (screen x)
const BAR_Y=98, GL_Y=150;      // crossbar / goal line (depth)
const BX=450, BY=470;          // ball spot
const WY=346;                  // wall field-depth
const VIS=0.44;                // visual lift scale (render only; logic uses raw liftAt)
const WALL_L=398, WALL_R=502;  // wall x span
const WALL_H=78;               // wall lift height (must exceed to clear)
const BAR_H=112;               // crossbar lift height (exceed = over the bar)

// ---------- state ----------
let state='title', phase='aim', t=0, kicks=0;
let score=0, combo=0, best=+(localStorage.getItem('freekick_best')||0);
let goals=0, misses=0, lvl=1;
let K=null; // current kick setup
let aimSweep=PX0+30, aimDir=1, powerSweep=0.2, powDir=1;
let keeperX=450, keeperLean=0, keeper={x:450,dx:0,dy:0};
let wallJump=0;
let ball=null, result=null, resultT=0, msg='', msg2='';
let shake=0, flash=0, flashCol='#fff', last=performance.now();
let parts=[], pops=[], trail=[];

function rnd(a,b){return a+Math.random()*(b-a);}
function chance(p){return Math.random()<p;}
function clamp(v,a,b){return v<a?a:v>b?b:v;}

function reset(){state='title';score=0;combo=0;goals=0;misses=0;lvl=1;kicks=0;K=null;ball=null;result=null;parts=[];pops=[];trail=[];}

function goodBand(){ const w=Math.max(0.20,0.40-lvl*0.02); const lo=0.44; return {lo, hi:lo+w}; }

function newKick(){
  kicks++;
  lvl=Math.min(6,1+Math.floor(kicks/3));
  // keeper pre-leans to a side (the read); becomes subtler at high level
  const side=chance(0.5)?-1:1;
  const lean=side*rnd(0.4,1)*(1-lvl*0.05);
  keeperLean=lean;
  keeperX=clamp(450+lean*120,PX0+34,PX1-34);
  keeper.x=keeperX; keeper.dx=0; keeper.dy=0;
  aimSweep=PX0+30; aimDir=1; powerSweep=0.15; powDir=1;
  K={lockedAim:null,lockedPower:null};
  ball=null; result=null; wallJump=0; trail=[];
  phase='aim'; t=0;
  msg='① 狙いをロック'; msg2='GKの重心の逆サイドへ';
}

function start(){ if(!ac())ac(); if(AC&&AC.state==='suspended')AC.resume(); reset(); state='play'; newKick(); }

// ---------- lock / kick ----------
function lock(){
  if(state==='title'){start();return;}
  if(state==='over'){ if(resultT>0.5){reset();start();} return; }
  if(state!=='play')return;
  if(phase==='aim'){ K.lockedAim=aimSweep; S.lock(); phase='power'; msg='② パワーをロック'; msg2='山なりで壁を越える強さに'; }
  else if(phase==='power'){ K.lockedPower=powerSweep; S.lock(); launch(); }
}

function launch(){
  S.kick();
  const aimX=K.lockedAim, power=K.lockedPower;
  const gb=goodBand();
  ball={x:BX,y:BY,fieldY:BY,lift:0,p:0,aimX,power,dur:900,t:0};
  // curve is cosmetic swerve toward the chosen side
  ball.curl=(aimX-450)*0.34*rnd(0.8,1.1);
  // outcome decided at end of flight in resolveKick via projection
  ball.gb=gb;
  phase='kick';
}

function liftAt(p,power){ return power*300*Math.sin(p*0.86*Math.PI); }
function fieldYat(p){ return BY+(GL_Y-BY)*p; }
function ballXat(p){ return BX+(ball.aimX-BX)*p + ball.curl*Math.sin(p*Math.PI); }

function resolveKick(){
  const aimX=ball.aimX, power=ball.power, gb=ball.gb;
  // wall clearance: lift at wall depth
  const pWall=(BY-WY)/(BY-GL_Y);
  const wallLift=liftAt(pWall,power);
  const xAtWall=ballXat(pWall);
  const throughWall = xAtWall>WALL_L-10 && xAtWall<WALL_R+10;
  const endLift=liftAt(1,power);
  let kind;
  if(throughWall && wallLift<WALL_H){ kind='wall'; }
  else if(endLift>BAR_H){ kind='over'; }
  else if(aimX<PX0+8 || aimX>PX1-8){ kind='wide'; }
  else if(power<gb.lo-0.02){ kind='short'; }  // too weak -> keeper gathers / falls short
  else {
    // keeper dives to aimX
    const reach=(58 + lvl*3) * (1 - clamp((power-gb.lo)/(gb.hi-gb.lo),0,1)*0.45);
    keeper.dx=aimX-keeper.x; keeper.dy=-liftAt(1,power)*0.5;
    if(Math.abs(aimX-keeperX)<reach){ kind='save'; }
    else kind='goal';
  }
  applyResult(kind,aimX,power);
}

function applyResult(kind,aimX,power){
  result=kind; resultT=0; phase='resolve';
  const corner = Math.min(aimX-PX0,PX1-aimX)<52;
  if(kind==='goal'){
    const great = corner && liftAt(1,power)>90;
    const base=great?260:150; combo++; const mult=1+Math.min(5,combo-1)*0.25; const add=Math.round(base*mult);
    score+=add; goals++;
    S.goal();
    flash=1;flashCol=great?'#ffe08a':'#8ff0b8';shake=great?16:10;
    burst(aimX,GL_Y+6,great?'#ffe08a':'#bfffd0',great?38:24,8);
    pop(aimX,GL_Y-6,(great?'ゴラッソ！ ':'ゴール！ ')+'+'+add,'#eaffef');
    if(combo>=2)pop(aimX,GL_Y-34,'コンボ x'+combo,'#ffe08a');
    msg=great?'ゴラッソ！ 壁越え隅ズバッ':'ゴール！ GKの逆を突いた'; msg2='';
  } else {
    combo=0; misses++;
    if(kind==='wall'){S.wall();msg='壁に阻まれた！';msg2='山なりに越える強さで';}
    else if(kind==='over'){S.miss();msg='枠を越えた！ 強すぎ';msg2='パワーを抑えて';}
    else if(kind==='wide'){S.miss();msg='枠外へ逸れた';msg2='ポストの内へ狙え';}
    else if(kind==='short'){S.save();msg='弱くてGKにキャッチされた';msg2='もう少し強く';}
    else {S.save();msg='GKにセーブされた！';msg2='重心の逆サイドを突け';}
    flash=1;flashCol='#ff6b6b';shake=9;
    burst(aimX,GL_Y+6,'#ff8a8a',16,5);
  }
}

// ---------- input ----------
cv.addEventListener('pointerdown',e=>{e.preventDefault();lock();});
addEventListener('keydown',e=>{ if(e.code==='Space'||e.code==='Enter'||e.code==='ArrowUp'){e.preventDefault();lock();}});

// ---------- particles ----------
function burst(x,y,c,n,sp){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=rnd(sp*0.3,sp);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:1,c});}}
function pop(x,y,txt,c){pops.push({x,y,txt,c,life:1});}

// ---------- update ----------
function update(dt){
  shake*=Math.pow(0.86,dt/16.7); if(shake<0.3)shake=0;
  flash*=Math.pow(0.9,dt/16.7);
  for(const p of parts){p.vx*=0.96;p.vy=p.vy*0.96+0.3;p.x+=p.vx*dt/16.7;p.y+=p.vy*dt/16.7;p.life-=dt/16.7*0.026;}
  parts=parts.filter(p=>p.life>0);
  for(const p of pops){p.y-=dt/16.7*0.5;p.life-=dt/16.7*0.018;}
  pops=pops.filter(p=>p.life>0);

  if(state!=='play'){ if(state==='over')resultT+=dt/1000; return; }
  t+=dt;
  const spd=1+lvl*0.14;

  if(phase==='aim'){
    aimSweep+=aimDir*dt*0.32*spd;
    if(aimSweep>PX1-26){aimSweep=PX1-26;aimDir=-1;} if(aimSweep<PX0+26){aimSweep=PX0+26;aimDir=1;}
    return;
  }
  if(phase==='power'){
    powerSweep+=powDir*dt*0.0013*spd;
    if(powerSweep>1){powerSweep=1;powDir=-1;} if(powerSweep<0.05){powerSweep=0.05;powDir=1;}
    return;
  }
  if(phase==='kick'){
    ball.t+=dt; const p=clamp(ball.t/ball.dur,0,1); ball.p=p;
    ball.fieldY=fieldYat(p); ball.lift=liftAt(p,ball.power); ball.x=ballXat(p);
    ball.y=ball.fieldY-ball.lift*VIS;
    trail.push({x:ball.x,y:ball.y}); if(trail.length>16)trail.shift();
    // wall jumps as ball nears
    if(p>0.12&&p<0.6) wallJump=Math.min(1,wallJump+dt/200);
    // keeper dive begins late
    if(p>0.55){ keeper.x += (( (ball.aimX) - keeper.x))*Math.min(1,dt/16.7*0.10); }
    if(p>=1){ resolveKick(); }
    return;
  }
  if(phase==='resolve'){
    resultT+=dt/1000;
    if(ball){ if(result==='goal'){ ball.y+=dt/16.7*1.2; } }
    if(resultT>1.15){
      if(misses>=3){ state='over'; resultT=0; S.over(); if(score>best){best=score;localStorage.setItem('freekick_best',best);} }
      else newKick();
    }
    return;
  }
}

// ---------- render ----------
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

function drawScene(){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#0f3322');g.addColorStop(0.5,'#1a5233');g.addColorStop(1,'#217a48');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='rgba(255,255,255,0.03)';
  for(let i=0;i<6;i++){ if(i%2) ctx.fillRect(0,120+i*80,W,80); }
  // goal net
  ctx.fillStyle='rgba(255,255,255,0.06)';ctx.fillRect(PX0,BAR_Y,PX1-PX0,GL_Y-BAR_Y);
  ctx.strokeStyle='rgba(255,255,255,0.16)';ctx.lineWidth=1;
  for(let x=PX0;x<=PX1;x+=16){ctx.beginPath();ctx.moveTo(x,BAR_Y);ctx.lineTo(x,GL_Y);ctx.stroke();}
  for(let y=BAR_Y;y<GL_Y;y+=14){ctx.beginPath();ctx.moveTo(PX0,y);ctx.lineTo(PX1,y);ctx.stroke();}
  // goal frame
  ctx.strokeStyle='#f4f4f4';ctx.lineWidth=7;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(PX0,GL_Y);ctx.lineTo(PX0,BAR_Y);ctx.lineTo(PX1,BAR_Y);ctx.lineTo(PX1,GL_Y);ctx.stroke();
  ctx.strokeStyle='rgba(255,255,255,0.8)';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(120,GL_Y);ctx.lineTo(780,GL_Y);ctx.stroke();
}

function drawKeeper(){
  const kx=keeper.x, ky=(phase==='kick'||phase==='resolve')? GL_Y-6 + keeper.dy*0 : GL_Y-4;
  let dive=0; if(phase==='kick'&&ball&&ball.p>0.6) dive=(ball.p-0.6)/0.4;
  if(phase==='resolve'&&result) dive=1;
  ctx.save();ctx.translate(kx,GL_Y-2);
  const lean = (phase==='aim'||phase==='power')? keeperLean*10 : 0;
  ctx.translate(lean,0);
  if(dive>0 && ball){ const dir=Math.sign(ball.aimX-keeperX)||1; ctx.rotate(dir*dive*0.9); }
  // body
  ctx.fillStyle='#22d3a6'; rr(-10,-30,20,30,6);ctx.fill();
  ctx.fillStyle='#f2c9a0';ctx.beginPath();ctx.arc(0,-38,8,0,6.28);ctx.fill();
  // arms out when diving
  ctx.strokeStyle='#22d3a6';ctx.lineWidth=6;ctx.lineCap='round';
  const spread=dive*22;
  ctx.beginPath();ctx.moveTo(-8,-22);ctx.lineTo(-8-spread,-30-spread*0.3);ctx.moveTo(8,-22);ctx.lineTo(8+spread,-30-spread*0.3);ctx.stroke();
  ctx.restore();
  // lean indicator (read) pre-kick
  if(phase==='aim'||phase==='power'){
    ctx.fillStyle='rgba(255,120,120,0.85)';ctx.font='bold 13px sans-serif';ctx.textAlign='center';
    ctx.fillText(keeperLean<0?'◀ 重心':'重心 ▶',kx,GL_Y+22);
  }
}

function drawWall(){
  const lift=wallJump*30;
  for(let i=0;i<3;i++){
    const x=WALL_L+18+i*((WALL_R-WALL_L-36)/2);
    const y=WY-lift;
    ctx.fillStyle='rgba(0,0,0,0.2)';ctx.beginPath();ctx.ellipse(x,WY+16,13,4,0,0,6.28);ctx.fill();
    ctx.fillStyle='#e8ebef'; rr(x-9,y-30,18,34,6);ctx.fill();
    ctx.fillStyle='#f2c9a0';ctx.beginPath();ctx.arc(x,y-38,7.5,0,6.28);ctx.fill();
    // arms up (protecting)
    if(lift>4){ctx.strokeStyle='#e8ebef';ctx.lineWidth=5;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x-6,y-26);ctx.lineTo(x-9,y-44);ctx.moveTo(x+6,y-26);ctx.lineTo(x+9,y-44);ctx.stroke();}
  }
}

function drawBall(){
  if(phase==='aim'||phase==='power'){
    // ball on the spot
    ctx.fillStyle='rgba(0,0,0,0.25)';ctx.beginPath();ctx.ellipse(BX,BY+8,12,5,0,0,6.28);ctx.fill();
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(BX,BY,11,0,6.28);ctx.fill();
    ctx.strokeStyle='#333';ctx.lineWidth=1.4;ctx.beginPath();ctx.arc(BX,BY,11,0,6.28);ctx.stroke();
    ctx.fillStyle='#222';ctx.beginPath();ctx.arc(BX-3,BY-2,2.6,0,6.28);ctx.fill();
    return;
  }
  if(!ball)return;
  // shadow on the field
  ctx.fillStyle='rgba(0,0,0,0.22)';ctx.beginPath();ctx.ellipse(ball.x,ball.fieldY+6,10-ball.p*3,4,0,0,6.28);ctx.fill();
  for(let i=0;i<trail.length;i++){const a=i/trail.length;ctx.globalAlpha=a*0.35;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(trail[i].x,trail[i].y,3+a*4,0,6.28);ctx.fill();}
  ctx.globalAlpha=1;
  const r=11-ball.p*3;
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(ball.x,ball.y,r,0,6.28);ctx.fill();
  ctx.strokeStyle='#333';ctx.lineWidth=1.3;ctx.beginPath();ctx.arc(ball.x,ball.y,r,0,6.28);ctx.stroke();
}

function drawUI(){
  // aim marker
  if(phase==='aim'){
    ctx.strokeStyle='#ffe08a';ctx.lineWidth=3;
    ctx.beginPath();ctx.moveTo(aimSweep,BAR_Y-6);ctx.lineTo(aimSweep,GL_Y+2);ctx.stroke();
    ctx.fillStyle='#ffe08a';ctx.beginPath();ctx.moveTo(aimSweep,BAR_Y-16);ctx.lineTo(aimSweep-8,BAR_Y-28);ctx.lineTo(aimSweep+8,BAR_Y-28);ctx.closePath();ctx.fill();
  }
  if(K&&K.lockedAim!=null&&(phase==='power')){
    ctx.strokeStyle='rgba(255,224,138,0.5)';ctx.setLineDash([5,5]);ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(K.lockedAim,BAR_Y);ctx.lineTo(K.lockedAim,GL_Y);ctx.stroke();ctx.setLineDash([]);
  }
  // power meter
  if(phase==='power'){
    const mx=760,my0=250,my1=470,h=my1-my0;
    ctx.fillStyle='rgba(0,0,0,0.3)';rr(mx-16,my0,32,h,8);ctx.fill();
    const gb=goodBand();
    ctx.fillStyle='rgba(120,240,150,0.35)';
    ctx.fillRect(mx-16,my1-gb.hi*h,32,(gb.hi-gb.lo)*h);
    // fill
    ctx.fillStyle='#ffe08a';ctx.fillRect(mx-13,my1-powerSweep*h,26,4);
    ctx.fillStyle='rgba(255,255,255,0.7)';ctx.font='12px sans-serif';ctx.textAlign='center';ctx.fillText('パワー',mx,my0-10);
  }
}

function drawHUD(){
  ctx.textAlign='left';ctx.fillStyle='#fff';ctx.font='bold 26px sans-serif';
  ctx.fillText('SCORE '+score,20,36);
  ctx.textAlign='right';ctx.fillStyle='rgba(255,255,255,0.85)';ctx.font='14px sans-serif';
  ctx.fillText('ゴール '+goals+'  Lv.'+lvl,W-20,26);
  ctx.fillText('ミス',W-92,50);
  for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(W-66+i*22,46,7,0,6.28);ctx.fillStyle=i<misses?'#ff5b5b':'rgba(255,255,255,0.25)';ctx.fill();}
  if(combo>=2){ctx.textAlign='left';ctx.fillStyle='#ffe08a';ctx.font='bold 18px sans-serif';ctx.fillText('コンボ x'+combo,20,60);}
}

function render(){
  ctx.save();
  if(shake>0)ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
  drawScene();
  drawKeeper();
  drawWall();
  drawUI();
  drawBall();

  for(const p of parts){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,3.2,0,6.28);ctx.fill();}
  ctx.globalAlpha=1;
  for(const p of pops){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.font='bold 22px sans-serif';ctx.textAlign='center';ctx.fillText(p.txt,p.x,p.y);}
  ctx.globalAlpha=1;

  drawHUD();

  if(state==='play'&&(msg||msg2)){
    ctx.textAlign='center';
    const good=result==='goal';
    ctx.fillStyle=result?(good?'#8ff0b8':'#ff9a9a'):'rgba(255,255,255,0.92)';
    ctx.font='bold 28px sans-serif';ctx.fillText(msg,W/2,H-64);
    if(msg2){ctx.fillStyle='rgba(255,255,255,0.72)';ctx.font='16px sans-serif';ctx.fillText(msg2,W/2,H-38);}
  }

  if(state==='title'){
    ctx.fillStyle='rgba(6,16,10,0.64)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='bold 46px sans-serif';ctx.fillText('直接フリーキック',W/2,206);
    ctx.fillStyle='#8ff0b8';ctx.font='bold 22px sans-serif';ctx.fillText('Over the Wall',W/2,240);
    ctx.fillStyle='rgba(255,255,255,0.9)';ctx.font='18px sans-serif';
    ctx.fillText('① 狙いを左右にスイープ→ロック（クリック/タップ/SPACE）',W/2,302);
    ctx.fillText('② パワー（山なりの強さ）を緑ゾーンでロック',W/2,330);
    ctx.fillStyle='rgba(255,255,255,0.66)';ctx.font='15px sans-serif';
    ctx.fillText('壁を越え、GKの重心（◀▶）の逆サイドへ。強すぎると枠上、弱いとキャッチ',W/2,372);
    ctx.fillText('隅へ決めればゴラッソで大量加点。3ミスで終了',W/2,396);
    ctx.fillStyle='#ffe08a';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で開始',W/2,452);
    ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='14px sans-serif';ctx.fillText('BEST '+best,W/2,484);
  }
  if(state==='over'){
    ctx.fillStyle='rgba(6,16,10,0.74)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#ff6b6b';ctx.font='bold 46px sans-serif';ctx.fillText('3ミス…終了',W/2,230);
    ctx.fillStyle='#fff';ctx.font='bold 40px sans-serif';ctx.fillText('SCORE '+score,W/2,296);
    ctx.fillStyle='rgba(255,255,255,0.85)';ctx.font='20px sans-serif';ctx.fillText('ゴール '+goals+'   BEST '+best,W/2,336);
    ctx.fillStyle='#8ff0b8';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で もう一度',W/2,408);
  }

  if(flash>0.02){ctx.globalAlpha=flash*0.5;ctx.fillStyle=flashCol;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}
  ctx.restore();

  ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,0.4)';ctx.font='13px sans-serif';
  ctx.fillText('①狙い→②パワーの2ロック。壁越え＋GKの逆を突いて決める。3ミスで終了',W/2,H-8);
}

function frame(ts){let dt=ts-last;last=ts;if(dt>60)dt=60;if(dt<0)dt=0;update(dt);render();requestAnimationFrame(frame);}
requestAnimationFrame(frame);

// ---------- test hook ----------
window.__fk={
  start, lock,
  get state(){return state;},
  get score(){return score;},
  get goals(){return goals;},
  get misses(){return misses;},
  get info(){const gb=goodBand();return {state,phase,
    aimSweep,powerSweep,keeperX,keeperLean,postL:PX0,postR:PX1,goodLo:gb.lo,goodHi:gb.hi,
    lockedAim:K?K.lockedAim:null,lockedPower:K?K.lockedPower:null,result,goals,misses,lvl};}
};
})();
