<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>スローイン (Find the Open Man)</title>
<style>
  html,body{margin:0;height:100%;background:#06110a;overflow:hidden;
    font-family:-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  #stage{position:relative;width:100vw;height:100vh;max-width:calc(100vh*1.5);max-height:calc(100vw/1.5);aspect-ratio:900/600;}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;border-radius:6px;}
</style>
</head>
<body>
<div id="wrap"><div id="stage"><canvas id="cv"></canvas></div></div>
<script>
(function(){
const W=900,H=600,cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let DPR=1;
function fit(){DPR=Math.min(2,window.devicePixelRatio||1);cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
fit();addEventListener('resize',fit);

// ---------- audio ----------
let AC=null;function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function tone(f,d,type,v,sweep){const a=ac();if(!a)return;const t=a.currentTime,o=a.createOscillator(),g=a.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(sweep)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+sweep),t+d);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v||0.2,t+0.008);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+0.02);}
function noise(d,v,hp){const a=ac();if(!a)return;const t=a.currentTime,n=Math.floor(a.sampleRate*d),buf=a.createBuffer(1,n,a.sampleRate),ch=buf.getChannelData(0);
  for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource();s.buffer=buf;
  const f=a.createBiquadFilter();f.type='highpass';f.frequency.value=hp||600;const g=a.createGain();g.gain.value=v||0.2;
  s.connect(f);f.connect(g);g.connect(a.destination);s.start(t);s.stop(t+d+0.02);}
const S={
  throw:()=>{noise(0.05,0.1,700);tone(480,0.08,'triangle',0.12,180);},
  recv:()=>{noise(0.04,0.12,1200);[640,900,1180].forEach((f,i)=>setTimeout(()=>tone(f,0.1,'triangle',0.16),i*55));},
  bad:()=>{noise(0.16,0.2,300);tone(170,0.2,'sawtooth',0.12,-55);},
  streak:()=>{[700,930,1170,1400].forEach((f,i)=>setTimeout(()=>tone(f,0.1,'triangle',0.16),i*60));},
  over:()=>{[440,330,247,175].forEach((f,i)=>setTimeout(()=>tone(f,0.3,'triangle',0.2),i*160));}
};

// ---------- geometry ----------
const THR={x:70,y:300};
const NEAR={x:430,y:452};    // short option (down)
const FAR={x:620,y:150};     // long option (up)
const DCENTER={x:470,y:300};

// ---------- state ----------
let state='title', phase='read', plays=0;
let score=0, combo=0, best=+(localStorage.getItem('throwin_best')||0);
let outs=0, fails=0, lvl=1;   // outs = completed throw-ins
let clock=0, commitT=400, windowMs=540, recoverT=940, grace=130;
let coverSide='near', openSide='far';
let decided=false, thrownDir=null, result=null, resultT=0, msg='', ballU=0, quick=false;
let shake=0, flash=0, flashCol='#fff', last=performance.now();
let parts=[], pops=[];

function rnd(a,b){return a+Math.random()*(b-a);}
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function lerp(a,b,u){return a+(b-a)*u;}
function easeOut(u){return 1-Math.pow(1-u,2);}

function reset(){state='title';score=0;combo=0;outs=0;fails=0;lvl=1;plays=0;result=null;parts=[];pops=[];}
function newPlay(){
  plays++; lvl=Math.min(7,1+Math.floor(outs/4));
  commitT=clamp(420-lvl*22,250,420);
  windowMs=clamp(580-lvl*30,330,580);
  recoverT=commitT+windowMs;
  coverSide=Math.random()<0.5?'near':'far';
  openSide=coverSide==='near'?'far':'near';
  phase='read'; clock=0; decided=false; thrownDir=null; result=null; resultT=0; msg=''; ballU=0; quick=false;
}
function start(){ if(!ac())ac(); if(AC&&AC.state==='suspended')AC.resume(); reset(); state='play'; newPlay(); }

function throwTo(dir){
  if(state==='title'){start();return;}
  if(state==='over'){ if(resultT>0.4){reset();start();} return; }
  if(state!=='play') return;
  if(phase!=='read'||decided) return;
  decided=true; thrownDir=dir; ballU=0; S.throw();
  if(clock<commitT){ resolve('rushed'); return; }        // threw before the run developed
  if(clock>recoverT){ resolve('stalled'); return; }        // defender recovered, both covered
  if(dir===openSide){ quick=(clock-commitT)<=windowMs*0.4; resolve('through'); }
  else resolve('cut');                                     // threw to the marked man
}

function resolve(k){
  phase='result'; result=k; resultT=0;
  if(k==='through'){
    outs++; combo++;
    let add=Math.round((quick?230:140)*(1+Math.min(9,combo-1)*0.14)); score+=add;
    S.recv(); flash=1;flashCol='#8affa0';shake=6;
    const tp=openSide==='far'?FAR:NEAR;
    burst(tp.x,tp.y,'#8affa0',20,7);
    pop(tp.x,tp.y-34,quick?'ドンピシャ！ フリーで前進！ +'+add:'ナイススロー！ フリーで受けた！ +'+add,'#d6ffe0');
    if(combo>=2&&!quick)pop(W/2,150,'コンボ x'+combo,'#ffd24d');
    if(combo>0&&combo%5===0)S.streak();
    msg=quick?'引きつけて空いた方へ素早く！フリーで前進！':'マークを見極め、空いた味方へ通した！';
  } else {
    fails++; combo=0; flash=1;flashCol='#ff5b5b';shake=9; S.bad();
    if(k==='rushed') msg='投げるのが早い…走り出す前で相手に読まれカット';
    else if(k==='cut') msg='マークされた味方へ…狙われてインターセプト';
    else msg='持ちすぎ…相手が戻って両方消され、苦し紛れに奪われた';
    const tp=(thrownDir==='far')?FAR:(thrownDir==='near'?NEAR:DCENTER);
    pop(tp.x,tp.y-30,'カットされた…','#ffb0b0');
  }
  if(fails>=3){ state='over'; resultT=0; S.over(); if(score>best){best=score;localStorage.setItem('throwin_best',best);} }
}

// ---------- input ----------
function pickDir(e){ const r=cv.getBoundingClientRect(); const y=(e.clientY-r.top)/r.height*H; return y<H/2?'far':'near'; }
cv.addEventListener('pointerdown',e=>{e.preventDefault();
  if(state!=='play'||phase!=='read'){ throwTo('far'); return; }   // title/over: any tap advances
  throwTo(pickDir(e));
});
addEventListener('keydown',e=>{ if(e.repeat)return;
  if(e.code==='ArrowUp'||e.code==='KeyW'){e.preventDefault();throwTo('far');}
  else if(e.code==='ArrowDown'||e.code==='KeyS'){e.preventDefault();throwTo('near');}
  else if(e.code==='Space'||e.code==='Enter'){e.preventDefault(); if(state!=='play')throwTo('far'); }
});

// ---------- particles ----------
function burst(x,y,c,n,sp){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=rnd(sp*0.3,sp);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:1,c});}}
function pop(x,y,txt,c){pops.push({x,y,txt,c,life:1});}

// ---------- update ----------
function update(dt){
  shake*=Math.pow(0.86,dt/16.7); if(shake<0.3)shake=0;
  flash*=Math.pow(0.9,dt/16.7);
  for(const p of parts){p.vx*=0.96;p.vy=p.vy*0.96+0.28;p.x+=p.vx*dt/16.7;p.y+=p.vy*dt/16.7;p.life-=dt/16.7*0.026;}
  parts=parts.filter(p=>p.life>0);
  for(const p of pops){p.y-=dt/16.7*0.5;p.life-=dt/16.7*0.02;}
  pops=pops.filter(p=>p.life>0);

  if(state!=='play'){ if(state==='over')resultT+=dt/1000; return; }
  if(phase==='read'){ clock+=dt; if(!decided && clock>recoverT+grace){ decided=true; thrownDir=null; resolve('stalled'); } return; }
  if(phase==='result'){ resultT+=dt/1000; ballU=Math.min(1,ballU+dt/300); if(resultT>1.2) newPlay(); return; }
}

// ---------- render ----------
function figure(x,y,col,sc){ sc=sc||1;
  ctx.fillStyle='rgba(0,0,0,0.22)';ctx.beginPath();ctx.ellipse(x,y+14*sc,12*sc,4*sc,0,0,6.28);ctx.fill();
  ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(x-7*sc,y-22*sc);ctx.lineTo(x+7*sc,y-22*sc);ctx.lineTo(x+6*sc,y+12*sc);ctx.lineTo(x-6*sc,y+12*sc);ctx.closePath();ctx.fill();
  ctx.fillStyle='#f2c9a0';ctx.beginPath();ctx.arc(x,y-28*sc,6*sc,0,6.28);ctx.fill();
}
function drawScene(){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#0f3d24');g.addColorStop(0.6,'#12653a');g.addColorStop(1,'#0c4d2c');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  for(let i=0;i<7;i++){ ctx.fillStyle=i%2?'rgba(255,255,255,0.03)':'rgba(0,0,0,0.03)'; ctx.fillRect(i*130,0,130,H); }
  // touchline (left)
  ctx.strokeStyle='rgba(255,255,255,0.55)';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(40,20);ctx.lineTo(40,H-20);ctx.stroke();
}
function defenderPos(){
  // defender slides from center toward covered man as clock advances (committed by commitT)
  let u=clamp(clock/recoverT,0,1); u=easeOut(u);
  const tgt=coverSide==='far'?FAR:NEAR;
  if(phase==='result'){ // settle
    if(result==='cut'||result==='rushed'||result==='stalled'){ const t2=(thrownDir==='far')?FAR:(thrownDir==='near'?NEAR:tgt); return {x:lerp(DCENTER.x,t2.x,0.7),y:lerp(DCENTER.y,t2.y,0.7)}; }
    return {x:lerp(DCENTER.x,tgt.x,0.8),y:lerp(DCENTER.y,tgt.y,0.8)};
  }
  return {x:lerp(DCENTER.x,tgt.x,u*0.82),y:lerp(DCENTER.y,tgt.y,u*0.82)};
}

function render(){
  ctx.save();
  if(shake>0)ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
  drawScene();

  if(state==='play'||state==='over'){
    const dcommit = clock>=commitT;
    // passing lanes (thrower -> each teammate) colored by open/cover once committed
    function lane(tp,side){
      let col='rgba(255,255,255,0.14)';
      if(state==='play'&&phase==='read'&&dcommit){ col = side===openSide?'rgba(120,255,150,0.30)':'rgba(255,80,70,0.24)'; }
      ctx.strokeStyle=col;ctx.lineWidth=8;ctx.beginPath();ctx.moveTo(THR.x+12,THR.y);ctx.lineTo(tp.x,tp.y);ctx.stroke();
    }
    lane(FAR,'far'); lane(NEAR,'near');

    // teammates
    figure(FAR.x,FAR.y,'#3aa0ff'); figure(NEAR.x,NEAR.y,'#3aa0ff');
    ctx.fillStyle='rgba(255,255,255,0.8)';ctx.font='13px sans-serif';ctx.textAlign='center';
    ctx.fillText('ロング↑（奥）',FAR.x,FAR.y+34); ctx.fillText('ショート↓（手前）',NEAR.x,NEAR.y+34);

    // defender
    const dp=defenderPos(); figure(dp.x,dp.y,'#d24b4b');

    // thrower
    figure(THR.x,THR.y,'#f4d03f');
    // ball
    if(phase==='read'){ ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(THR.x,THR.y-40,7,0,6.28);ctx.fill(); }
    else if(phase==='result'){
      const tp=(thrownDir==='far')?FAR:(thrownDir==='near'?NEAR:{x:dp.x,y:dp.y});
      const bx=lerp(THR.x,tp.x,easeOut(ballU)), by=lerp(THR.y-40,tp.y,easeOut(ballU));
      ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(bx,by,7,0,6.28);ctx.fill();
    }

    // release indicator + cue
    if(state==='play'&&phase==='read'){
      ctx.textAlign='center';
      if(!dcommit){ ctx.fillStyle='rgba(255,220,90,0.95)';ctx.font='bold 18px sans-serif';
        ctx.fillText('相手の寄せを見極めろ…（まだ投げるな）',W/2,44); }
      else { ctx.fillStyle='rgba(140,255,160,0.98)';ctx.font='bold 19px sans-serif';
        ctx.fillText('今だ！ 空いた味方へスロー（↑ロング / ↓ショート・上下タップ）',W/2,44); }
    }
  }

  for(const p of parts){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,3.2,0,6.28);ctx.fill();}
  ctx.globalAlpha=1;
  for(const p of pops){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.font='bold 20px sans-serif';ctx.textAlign='center';ctx.fillText(p.txt,p.x,p.y);}
  ctx.globalAlpha=1;

  // HUD
  ctx.textAlign='left';ctx.fillStyle='#fff';ctx.font='bold 26px sans-serif';ctx.fillText('SCORE '+score,20,36);
  ctx.textAlign='right';ctx.fillStyle='rgba(255,255,255,0.9)';ctx.font='14px sans-serif';ctx.fillText('成功 '+outs+'  Lv'+lvl,W-20,24);
  ctx.fillText('被カット',W-98,46);
  for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(W-60+i*20,41,7,0,6.28);ctx.fillStyle=i<fails?'#ff5b5b':'rgba(255,255,255,0.25)';ctx.fill();}
  if(combo>=2){ctx.textAlign='center';ctx.fillStyle='#ffd24d';ctx.font='bold 18px sans-serif';ctx.fillText('コンボ x'+combo,W/2,120);}

  if(state==='play'&&phase==='result'&&msg){ctx.textAlign='center';ctx.fillStyle=result==='through'?'#9ff0b8':'#ff9a9a';ctx.font='bold 19px sans-serif';ctx.fillText(msg,W/2,44);}

  if(state==='title'){
    ctx.fillStyle='rgba(4,10,7,0.80)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='bold 44px sans-serif';ctx.fillText('スローイン',W/2,104);
    ctx.fillStyle='#ffd23e';ctx.font='bold 22px sans-serif';ctx.fillText('Find the Open Man',W/2,140);
    ctx.fillStyle='rgba(255,255,255,0.92)';ctx.font='16px sans-serif';
    ctx.fillText('サイドのスローイン。相手はどちらかの味方をマークしに寄せる——空いた味方を見極めて通せ',W/2,192);
    ctx.fillStyle='rgba(255,255,255,0.66)';ctx.font='14px sans-serif';
    ctx.fillText('相手が寄せ切る（レーンが緑＝空き／赤＝マーク）のを引きつけてから、空いた味方へスロー',W/2,230);
    ctx.fillText('↑キー/画面上タップ＝ロング(奥)、↓キー/画面下タップ＝ショート(手前)',W/2,254);
    ctx.fillText('早すぎ＝走り出す前で読まれてカット、マークされた味方へ＝インターセプト、持ちすぎ＝両方消され奪われる',W/2,278);
    ctx.fillText('引きつけて素早く空いた方へ通すほど高得点。上級ほど寄せが速く判断の猶予が短い。3被カットで交代',W/2,302);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で開始',W/2,368);
    ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='14px sans-serif';ctx.fillText('BEST '+best,W/2,400);
  }
  if(state==='over'){
    ctx.fillStyle='rgba(4,10,7,0.84)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#ff6b6b';ctx.font='bold 46px sans-serif';ctx.fillText('3被カット…交代',W/2,222);
    ctx.fillStyle='#fff';ctx.font='bold 40px sans-serif';ctx.fillText('SCORE '+score,W/2,290);
    ctx.fillStyle='rgba(255,255,255,0.85)';ctx.font='19px sans-serif';ctx.fillText('成功 '+outs+'   BEST '+best,W/2,330);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で もう一度',W/2,402);
  }

  if(flash>0.02){ctx.globalAlpha=flash*0.5;ctx.fillStyle=flashCol;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}
  ctx.restore();

  ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,0.4)';ctx.font='12px sans-serif';
  ctx.fillText('スローイン：相手の寄せを引きつけ、空いた味方（緑レーン）へ↑ロング/↓ショートで通す。早すぎ/マーク側/持ちすぎは被カット。3つで交代',W/2,H-8);
}

function frame(ts){let dt=ts-last;last=ts;if(dt>60)dt=60;if(dt<0)dt=0;update(dt);render();requestAnimationFrame(frame);}
requestAnimationFrame(frame);

// ---------- test hook ----------
window.__ti={
  start, throwTo:(d)=>throwTo(d),
  get state(){return state;},
  get score(){return score;},
  get outs(){return outs;},
  get fails(){return fails;},
  get info(){return {state,phase,clock,commitT,recoverT,coverSide,openSide,decided,result,outs,fails,lvl,
    committed:(clock>=commitT),canAct:(phase==='read'&&!decided)};}
};
})();
</script>
</body>
</html>
