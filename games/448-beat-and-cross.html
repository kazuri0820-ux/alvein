<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>抜いてクロス (Beat and Cross)</title>
<style>
  html,body{margin:0;padding:0;background:#07130c;overflow:hidden;font-family:'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif;-webkit-user-select:none;user-select:none;touch-action:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 30%,#18361f,#050d08 72%);}
  #stage{position:relative;width:min(100vw,calc(100vh*1.5));aspect-ratio:900/600;max-width:900px;box-shadow:0 10px 60px rgba(0,0,0,.6);border-radius:8px;overflow:hidden;}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;}
</style>
</head>
<body>
<div id="wrap"><div id="stage"><canvas id="cv"></canvas></div></div>
<script>
(function(){
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const W=900,H=600;let DPR=Math.min(2,window.devicePixelRatio||1);
function fit(){const r=cv.getBoundingClientRect();DPR=Math.min(2,window.devicePixelRatio||1);cv.width=Math.round(r.width*DPR);cv.height=Math.round(r.height*DPR);ctx.setTransform(cv.width/W,0,0,cv.height/H,0,0);}
new ResizeObserver(fit).observe(cv);fit();

// ---------- audio ----------
let AC=null;function actx(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function tone(f,d,type,v,sweep){const a=actx();if(!a)return;const o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.value=f;if(sweep)o.frequency.linearRampToValueAtTime(sweep,a.currentTime+d);g.gain.value=0.0001;g.gain.exponentialRampToValueAtTime(v||0.2,a.currentTime+0.008);g.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+d);o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+d+0.02);}
function noise(d,v,hp){const a=actx();if(!a)return;const n=a.createBufferSource(),b=a.createBuffer(1,a.sampleRate*d,a.sampleRate),dt=b.getChannelData(0);for(let i=0;i<dt.length;i++)dt[i]=Math.random()*2-1;n.buffer=b;const f=a.createBiquadFilter();f.type='highpass';f.frequency.value=hp||800;const g=a.createGain();g.gain.value=0.0001;g.gain.exponentialRampToValueAtTime(v||0.2,a.currentTime+0.01);g.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+d);n.connect(f);f.connect(g);g.connect(a.destination);n.start();n.stop(a.currentTime+d+0.02);}
const S={
  set(){tone(300,0.08,'sine',0.1);},
  beat(){noise(0.05,0.14,600);tone(320,0.07,'square',0.12,180);},        // knock it past
  cross(){tone(560,0.08,'sine',0.14,760);noise(0.04,0.06,700);},          // whip the cross
  head(){noise(0.06,0.2,500);tone(240,0.09,'square',0.14,120);},
  goal(){tone(560,0.1,'triangle',0.2);setTimeout(function(){tone(760,0.14,'triangle',0.22);},110);setTimeout(function(){tone(1000,0.2,'triangle',0.22);},230);},
  roar(){noise(0.5,0.14,300);},
  lost(){tone(300,0.3,'sawtooth',0.16,150);setTimeout(function(){tone(190,0.4,'sawtooth',0.14,110);},150);},
  combo(n){tone(600+Math.min(n,8)*70,0.12,'triangle',0.16);},
  over(){tone(330,0.3,'sine',0.2,160);setTimeout(function(){tone(220,0.5,'sine',0.2,110);},180);},
  start(){tone(440,0.1,'triangle',0.18);setTimeout(function(){tone(660,0.16,'triangle',0.2);},110);},
};

function clamp(v,a,b){return v<a?a:v>b?b:v;}
function rnd(a,b){return a+Math.random()*(b-a);}

// ---------- state ----------
let state='title';
let outs=0,fails=0,score=0,combo=0,lvl=1;   // outs = crosses converted
let best=0;try{best=parseInt(localStorage.getItem('bc_best')||'0')||0;}catch(e){}
const TARGET=26;

let phase='wind';  // wind | combo(beat1: beat the fullback) | run(beat2: cross) | result
let pt=0, clock=0;
let arriveT1=850, w1=150, effW1=150, fireIdeal=520, fw=150, effFw=150, tough=false;
let breakClock=0, decided=false, result='', beat1done=false, q1=0,q2=0;
let parts=[];
let shakeT=0,flash=0;
let msg='',msgCol='#fff',msgT=0;
let lastAdd=0;
// scene points
const GOAL=[236,86];
const WING0=[706,442], WING1=[648,300], WING2=[596,190];   // you dribble up the wing to the byline
const STR0=[470,340], STR1=[338,206];                       // striker runs into the box
const FB0=[642,360], FB1=[612,246];                          // fullback tracks you
let wingX=706,wingY=442, strX=470,strY=340, fbX=642,fbY=360, ballX=706,ballY=442, headU=0;

function reset(){outs=0;fails=0;score=0;combo=0;lvl=1;parts=[];}
function lerp(a,b,t){return [a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t];}
function newPlay(){
  lvl=Math.min(7,1+Math.floor(outs/4));
  arriveT1=clamp(900-lvl*42,620,900);
  w1=clamp(150-lvl*10,90,150);
  fireIdeal=clamp(560-lvl*20,420,560);
  fw=clamp(150-lvl*10,90,150);
  tough=Math.random()<clamp(0.2+lvl*0.05,0.2,0.5);
  effW1=tough?w1*0.82:w1;
  effFw=tough?fw*0.82:fw;
  phase='wind';pt=0;clock=0;breakClock=0;decided=false;result='';beat1done=false;q1=0;q2=0;
  wingX=WING0[0];wingY=WING0[1];strX=STR0[0];strY=STR0[1];fbX=FB0[0];fbY=FB0[1];ballX=WING0[0]+8;ballY=WING0[1];headU=0;
}
function startGame(){reset();state='play';newPlay();S.start();}

function burst(x,y,col,n,sp){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=rnd(0.4,1)*(sp||3);parts.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:1,col:col,r:rnd(2,5)});}}

function finish(kind){
  decided=true;result=kind;
  if(kind==='goal'){
    outs++;combo++;
    const cm=1+Math.min(combo-1,6)*0.14;
    const add=Math.round((100+(q1+q2)*60)*cm)*Math.max(1,lvl);
    score+=add;lastAdd=add;
    S.cross();setTimeout(S.head,300);setTimeout(S.goal,360);setTimeout(S.roar,440);if(combo>1)setTimeout(function(){S.combo(combo);},560);
    flash=0.28;
    msg=((q1+q2)>1.4?'完璧に抜いてドンピシャのクロス！ ヘッドでゴール！':'縦を抜いてクロス！ 合わせてゴール！')+'  +'+add;msgCol='#5affa0';msgT=1;
    burst(STR1[0],STR1[1],'#5affa0',16,3.2);
  }else{
    combo=0;fails++;
    S.lost();flash=0.35;shakeT=0.7;
    if(result==='early1')msg='仕掛けが早い！ 読まれてタックルでカット';
    else if(result==='late1')msg='仕掛けが遅い！ 間合いを詰められてロスト';
    else if(result==='early2')msg='クロスが早い！ 味方が入る前でカット';
    else msg='クロスが遅い！ カバーに寄せられて奪われた';
    msgCol='#ff6a6a';msgT=1;
  }
  phase='result';pt=0;
}

function act(){
  if(!AC)actx();
  if(state==='title'){startGame();return;}
  if(state==='over'){startGame();return;}
  if(state!=='play'||decided)return;
  if(phase==='combo'){
    const c=clock;
    if(c<arriveT1-effW1){finish('early1');return;}
    beat1done=true;breakClock=clock;q1=clamp(1-Math.abs(c-arriveT1)/effW1,0,1);
    S.beat();phase='run';pt=0;
  }else if(phase==='run'){
    const rc=clock-breakClock;
    if(rc<fireIdeal-effFw){finish('early2');return;}
    q2=clamp(1-Math.abs(rc-fireIdeal)/effFw,0,1);
    headU=0.0001;finish('goal');
  }
}
cv.addEventListener('mousedown',function(e){e.preventDefault();act();});
cv.addEventListener('touchstart',function(e){e.preventDefault();act();},{passive:false});
window.addEventListener('keydown',function(e){
  if(e.code==='Space'||e.code==='ArrowUp'||e.code==='Enter'||e.code==='KeyJ'){e.preventDefault();act();}
});

// ---------- update ----------
let last=0;
function update(dt){
  if(flash>0)flash=Math.max(0,flash-dt/300);
  if(shakeT>0)shakeT=Math.max(0,shakeT-dt/320);
  if(msgT>0)msgT=Math.max(0,msgT-dt/1500);
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.x+=p.vx;p.y+=p.vy;p.vy+=0.16;p.life-=dt/640;if(p.life<=0)parts.splice(i,1);}
  if(state!=='play')return;
  pt+=dt;
  if(phase==='wind'){
    if(pt>=460){phase='combo';pt=0;clock=0;S.set();}
  }else if(phase==='combo'){
    clock+=dt;
    const u=clamp(clock/arriveT1,0,1);
    const wp=lerp(WING0,WING1,u); wingX=wp[0];wingY=wp[1]; ballX=wingX+8;ballY=wingY-2;
    const fp=lerp(FB0,FB1,u); fbX=fp[0];fbY=fp[1];       // fullback steps across to challenge
    if(clock>=arriveT1+effW1&&!decided)finish('late1');
  }else if(phase==='run'){
    clock+=dt;
    const rc=clock-breakClock;
    const ur=clamp(rc/fireIdeal,0,1);
    const wp=lerp(WING1,WING2,ur); wingX=wp[0];wingY=wp[1]; ballX=wingX+10;ballY=wingY-2;   // sprint to the byline
    const sp=lerp(STR0,STR1,ur); strX=sp[0];strY=sp[1];                                     // striker arrives in the box
    fbX=FB1[0]-6;fbY=FB1[1]+8;                                                              // beaten fullback trails
    if(rc>=fireIdeal+effFw&&!decided)finish('late2');
  }else if(phase==='result'){
    if(result==='goal'){
      if(headU<1){ headU=Math.min(1,headU+dt/300); }
      if(headU<0.62){ const p=lerp([wingX,wingY],[strX,strY-6],headU/0.62); ballX=p[0];ballY=p[1]-Math.sin((headU/0.62)*Math.PI)*46; }   // cross flies to the striker
      else { const h=(headU-0.62)/0.38; const p=lerp([strX,strY-6],[GOAL[0]+rnd(-18,18),GOAL[1]+16],h); ballX=p[0];ballY=p[1]; if(h<0.6&&Math.random()<0.2)burst(ballX,ballY,'#cfe',1,1.4); }
    }else if(result==='early1'||result==='late1'){ const p=lerp([ballX,ballY],[fbX,fbY],clamp(pt/300,0,1)); ballX=p[0];ballY=p[1]; }   // fullback wins it
    else if(result==='early2'){ const p=lerp([wingX,wingY],[STR1[0]+40,STR1[1]+30],clamp(pt/320,0,1)); ballX=p[0];ballY=p[1]-Math.sin(clamp(pt/320,0,1)*Math.PI)*30; } // cross to nobody
    else { const p=lerp([wingX,wingY],[560,120],clamp(pt/320,0,1)); ballX=p[0];ballY=p[1]; }   // late: runs out at the byline
    if(pt>=1150){
      if(fails>=3){state='over';best=Math.max(best,score);try{localStorage.setItem('bc_best',String(best));}catch(e){}S.over();}
      else if(outs>=TARGET){state='over';best=Math.max(best,score);try{localStorage.setItem('bc_best',String(best));}catch(e){}S.goal();}
      else newPlay();
    }
  }
}

// ---------- render ----------
function roundRect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

const GL=170,GR=302,GTOP=52,GLINE=120;
function drawField(){
  for(let i=0;i<9;i++){ctx.fillStyle=i%2?'#2b6b3d':'#256036';ctx.fillRect(0,i*(H/9),W,H/9);}
  // goal top-left
  ctx.fillStyle='rgba(255,255,255,.06)';ctx.fillRect(GL,GTOP,GR-GL,GLINE-GTOP);
  ctx.strokeStyle='rgba(255,255,255,.18)';ctx.lineWidth=1;
  for(let x=GL;x<=GR;x+=13){ctx.beginPath();ctx.moveTo(x,GTOP);ctx.lineTo(x,GLINE);ctx.stroke();}
  for(let y=GTOP+11;y<GLINE;y+=12){ctx.beginPath();ctx.moveTo(GL,y);ctx.lineTo(GR,y);ctx.stroke();}
  ctx.fillStyle='#f2f2f2';ctx.fillRect(GL-6,GTOP-5,6,GLINE-GTOP+6);ctx.fillRect(GR,GTOP-5,6,GLINE-GTOP+6);ctx.fillRect(GL-6,GTOP-5,GR-GL+12,6);
  ctx.fillStyle='#fff';ctx.fillRect(GL-6,GLINE,GR-GL+12,3);
  // byline down the right side + corner
  ctx.strokeStyle='rgba(255,255,255,.5)';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(GR,GLINE);ctx.lineTo(560,120);ctx.stroke();
  // penalty box
  ctx.strokeStyle='rgba(255,255,255,.4)';ctx.lineWidth=3;ctx.strokeRect(150,GLINE,300,150);
}

function person(x,y,col,glow,lean){
  ctx.save();ctx.translate(x,y);if(lean)ctx.rotate(lean);
  if(glow>0){ctx.strokeStyle='rgba(90,255,160,'+glow+')';ctx.lineWidth=4;ctx.beginPath();ctx.arc(0,-18,24,0,Math.PI*2);ctx.stroke();}
  ctx.fillStyle='rgba(0,0,0,.28)';ctx.beginPath();ctx.ellipse(0,4,13,5,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#222';ctx.fillRect(-7,-4,6,20);ctx.fillRect(1,-4,6,20);
  ctx.fillStyle=col;ctx.fillRect(-11,-28,22,26);
  ctx.fillStyle='#f0c9a0';ctx.beginPath();ctx.arc(0,-37,8,0,Math.PI*2);ctx.fill();
  ctx.restore();
}

function drawScene(){
  drawField();
  // keeper
  person(GOAL[0]+2,GTOP+40,'#e9d84a',0,0);
  // striker attacking the box (blue) — glows in the cross window
  const strun=(phase==='run'&&!decided&&(clock-breakClock)>=fireIdeal-effFw);
  person(strX,strY,'#2f6fd0',strun?0.9:0,0.08);
  // fullback (red)
  const fblean=(phase==='combo')?-0.1-clamp(clock/arriveT1,0,1)*0.2:0.25;
  person(fbX,fbY,'#c0343a',0,fblean);
  // you (winger, yellow) — glows in the beat window
  const beatwin=(phase==='combo'&&!decided&&clock>=arriveT1-effW1);
  person(wingX,wingY,'#e8d24a',beatwin?0.9:0,(phase==='run'||(phase==='result'&&result==='goal'))?0.16:0.08);
  // ball
  ctx.fillStyle='rgba(0,0,0,.2)';ctx.beginPath();ctx.ellipse(ballX,ballY+7,6,3,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(ballX,ballY,7,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#111';ctx.beginPath();ctx.arc(ballX,ballY,2.5,0,Math.PI*2);ctx.fill();
}

function drawBar(){
  if(state!=='play'||phase==='wind'||phase==='result')return;
  const mx=180,mw=540,my=560,mh=18;
  let end, gC, gH, marker, label, col;
  if(phase==='combo'){ end=arriveT1+effW1+200; gC=arriveT1; gH=effW1; marker=clock; label='① 抜け（DFの食いつく“今”縦へ運んで抜く）'; col='#ffe08a'; }
  else { end=fireIdeal+effFw+200; gC=fireIdeal; gH=effFw; marker=clock-breakClock; label='② クロス（味方が入る“今”上げる）'; col='#9fd7ff'; }
  roundRect(mx,my,mw,mh,9);ctx.fillStyle='rgba(0,0,0,.45)';ctx.fill();
  const gx0=mx+mw*clamp((gC-gH)/end,0,1), gx1=mx+mw*clamp((gC+gH)/end,0,1);
  const gg=ctx.createLinearGradient(gx0,0,gx1,0);gg.addColorStop(0,'rgba(90,220,150,.4)');gg.addColorStop(0.5,'rgba(60,255,150,.9)');gg.addColorStop(1,'rgba(90,220,150,.4)');
  ctx.fillStyle=gg;ctx.fillRect(gx0,my,gx1-gx0,mh);
  ctx.fillStyle='rgba(210,70,70,.26)';ctx.fillRect(mx,my,gx0-mx,mh);
  roundRect(mx,my,mw,mh,9);ctx.strokeStyle='rgba(255,255,255,.4)';ctx.lineWidth=1.5;ctx.stroke();
  const px=mx+mw*clamp(marker/end,0,1);
  ctx.fillStyle='#fff';ctx.fillRect(px-2,my-4,4,mh+8);
  ctx.textAlign='center';ctx.font='bold 14px sans-serif';ctx.fillStyle=col;ctx.fillText(label,450,my-8);
}

function drawHUD(){
  ctx.textAlign='left';ctx.textBaseline='alphabetic';
  ctx.font='bold 20px sans-serif';ctx.fillStyle='#fff';
  ctx.fillText('ゴール '+outs+' / '+TARGET,20,32);
  ctx.font='14px sans-serif';ctx.fillStyle='#ffb14a';ctx.fillText('失敗 '+fails+' / 3',20,54);
  ctx.textAlign='right';
  ctx.font='bold 20px sans-serif';ctx.fillStyle='#ffe08a';ctx.fillText('SCORE '+score,W-20,32);
  ctx.font='13px sans-serif';ctx.fillStyle='#bfe';ctx.fillText('BEST '+Math.max(best,score)+'   Lv.'+lvl,W-20,52);
  if(combo>1){ctx.textAlign='center';ctx.font='bold 20px sans-serif';ctx.fillStyle='#5affa0';ctx.fillText(combo+' 連続ゴール!',450,96);}
  if(phase==='combo'&&!decided){ctx.textAlign='center';ctx.font='bold 15px sans-serif';ctx.fillStyle='#ffe08a';ctx.fillText('サイドバックが食いつく——縦を抜く“その瞬間”に運べ',450,124);}
}

function drawMsg(){
  if(msgT<=0)return;
  ctx.save();ctx.globalAlpha=clamp(msgT*1.4,0,1);
  ctx.textAlign='center';ctx.font='bold 24px sans-serif';
  ctx.fillStyle='rgba(0,0,0,.55)';roundRect(450-290,150,580,44,10);ctx.fill();
  ctx.fillStyle=msgCol;ctx.fillText(msg,450,180);
  ctx.restore();
}

function drawTitle(){
  drawField();person(GOAL[0]+2,GTOP+40,'#e9d84a',0,0);person(STR0[0],STR0[1],'#2f6fd0',0,0);person(FB0[0],FB0[1],'#c0343a',0,0);person(WING0[0],WING0[1],'#e8d24a',0,0);
  ctx.save();ctx.textAlign='center';
  ctx.fillStyle='rgba(0,0,0,.64)';roundRect(96,96,708,404,16);ctx.fill();
  ctx.fillStyle='#fff';ctx.font='bold 34px sans-serif';ctx.fillText('抜いてクロス',450,152);
  ctx.font='18px sans-serif';ctx.fillStyle='#9fe0bf';ctx.fillText('Beat and Cross',450,182);
  ctx.font='16px sans-serif';ctx.fillStyle='#e6fcef';
  const lines=[
    'あなたはウインガー。サイドを2段で崩せ！',
    '①対面のサイドバックが食いつく“今”タップ＝縦を抜く。',
    '　早いと読まれてカット、遅いと間合いを詰められてロスト。',
    '②バイライン際で味方が入る“今”タップ＝クロスを上げる。',
    '　早いと味方が入る前でカット、遅いとカバーに奪われる。',
    '2つの「緑」を合わせて味方のヘッドで決めろ。3失敗で終了。',
    'タップ / クリック / SPACE で操作。',
  ];
  for(let i=0;i<lines.length;i++)ctx.fillText(lines[i],450,222+i*29);
  ctx.fillStyle='#ffe08a';ctx.font='bold 22px sans-serif';
  ctx.fillText('タップ / SPACE でスタート',450,476);
  ctx.restore();
}

function drawOver(){
  drawField();
  ctx.save();ctx.textAlign='center';
  ctx.fillStyle='rgba(0,0,0,.64)';roundRect(190,150,520,300,16);ctx.fill();
  const w2=outs>=TARGET;
  ctx.fillStyle=w2?'#5affa0':'#ff8a5a';ctx.font='bold 34px sans-serif';
  ctx.fillText(w2?'サイドの主役！':'崩し切れず…',450,222);
  ctx.fillStyle='#fff';ctx.font='20px sans-serif';
  ctx.fillText('ゴール '+outs+' / '+TARGET,450,270);
  ctx.fillText('スコア '+score,450,304);
  ctx.fillStyle='#ffe08a';ctx.fillText('ベスト '+Math.max(best,score),450,336);
  ctx.fillStyle='#9fe0bf';ctx.font='bold 20px sans-serif';
  ctx.fillText('タップ / SPACE でもう一度',450,404);
  ctx.restore();
}

function render(){
  ctx.save();
  if(shakeT>0){const s=shakeT*7;ctx.translate(rnd(-s,s),rnd(-s,s));}
  if(state==='title'){drawTitle();}
  else if(state==='over'){drawOver();}
  else{
    drawScene();
    drawBar();
    drawHUD();
    drawMsg();
  }
  for(const p of parts){ctx.globalAlpha=clamp(p.life,0,1);ctx.fillStyle=p.col;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();}
  ctx.globalAlpha=1;
  ctx.restore();
  if(flash>0){ctx.fillStyle='rgba(255,255,255,'+(flash*0.5)+')';ctx.fillRect(0,0,W,H);}
}

function frame(ts){let dt=ts-last;last=ts;if(dt>60)dt=60;if(dt<0)dt=0;update(dt);render();requestAnimationFrame(frame);}
requestAnimationFrame(frame);

// ---------- test hook ----------
window.__bc={
  start:startGame,
  act:act,
  get state(){return state;},
  get outs(){return outs;},
  get fails(){return fails;},
  get score(){return score;},
  get info(){return {state:state,phase:phase,clock:clock,arriveT1:arriveT1,effW1:effW1,fireIdeal:fireIdeal,effFw:effFw,breakClock:breakClock,tough:tough,decided:decided,result:result,beat1done:beat1done,outs:outs,fails:fails,lvl:lvl,collectClock:(clock-breakClock),canAct:(state==='play'&&(phase==='combo'||phase==='run')&&!decided)};}
};
})();
</script>
