<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>クロス処理 (Claim the Cross)</title>
<style>
  html,body{margin:0;height:100%;background:#0a1a10;overflow:hidden;
    font-family:-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  #stage{position:relative;width:100vw;height:100vh;max-width:calc(100vh*1.5);max-height:calc(100vw/1.5);aspect-ratio:900/600;}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;border-radius:6px;}
</style>
</head>
<body>
<div id="wrap"><div id="stage"><canvas id="cv"></canvas></div></div>
<script>
(function(){
const W=900,H=600,cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let DPR=1;
function fit(){DPR=Math.min(2,window.devicePixelRatio||1);cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
fit();addEventListener('resize',fit);

// ---------- audio ----------
let AC=null;function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function tone(f,d,type,v,sweep){const a=ac();if(!a)return;const t=a.currentTime,o=a.createOscillator(),g=a.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(sweep)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+sweep),t+d);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v||0.2,t+0.008);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+0.02);}
function noise(d,v,hp){const a=ac();if(!a)return;const t=a.currentTime,n=Math.floor(a.sampleRate*d),buf=a.createBuffer(1,n,a.sampleRate),ch=buf.getChannelData(0);
  for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource();s.buffer=buf;
  const f=a.createBiquadFilter();f.type='highpass';f.frequency.value=hp||600;const g=a.createGain();g.gain.value=v||0.2;
  s.connect(f);f.connect(g);g.connect(a.destination);s.start(t);s.stop(t+d+0.02);}
const S={
  catch:()=>{noise(0.06,0.22,500);tone(360,0.1,'square',0.14);},
  great:()=>{noise(0.05,0.2,700);[620,880,1180,1560].forEach((f,i)=>setTimeout(()=>tone(f,0.12,'triangle',0.2),i*60));},
  punch:()=>{noise(0.1,0.3,300);tone(240,0.12,'square',0.14,120);},
  goal:()=>{tone(220,0.32,'sawtooth',0.2,-110);setTimeout(()=>tone(160,0.32,'sawtooth',0.16,-70),130);noise(0.4,0.1,200);},
  whiff:()=>{noise(0.14,0.16,400);tone(200,0.16,'sawtooth',0.12,-70);},
  over:()=>{[440,330,247,175].forEach((f,i)=>setTimeout(()=>tone(f,0.3,'triangle',0.2),i*160));}
};

// ---------- geometry ----------
const PX0=330,PX1=570, BAR_Y=118, GL_Y=176;
const GK_Y=214;              // GK operating line (edge of 6-yard)
const DROP_Y=250;            // ball arrival depth
const REACH=48, CLAIM_H=44, CONTEST=52;

// ---------- state ----------
let state='title', phase='cross', t=0, plays=0;
let score=0, combo=0, best=+(localStorage.getItem('claim_best')||0);
let claims=0, conceded=0, lvl=1;
let gk={x:450,tx:450}, P=null, ball=null, atk=null, result=null, resultT=0, msg='', msg2='';
let shake=0, flash=0, flashCol='#fff', last=performance.now(), pointerActive=false;
let parts=[], pops=[];

function rnd(a,b){return a+Math.random()*(b-a);}
function chance(p){return Math.random()<p;}
function clamp(v,a,b){return v<a?a:v>b?b:v;}

function reset(){state='title';score=0;combo=0;claims=0;conceded=0;lvl=1;plays=0;P=null;ball=null;result=null;parts=[];pops=[];gk={x:450,tx:450};}

function newCross(){
  plays++;
  lvl=Math.min(6,1+Math.floor(plays/3));
  const wing=chance(0.5)?-1:1;
  const dropX=clamp(450+rnd(-140,140),PX0-30,PX1+30);
  const contested=chance(0.5);
  const attX = contested? dropX+rnd(-26,26) : dropX+ (chance(0.5)?-1:1)*rnd(90,150);
  const dur=Math.max(900,1400-lvl*84);
  const peak=150+rnd(-10,25);
  P={wing,dropX,contested,dur,peak,t:0,claimed:false};
  ball={sx: wing<0?120:780, sy:330, x:0,y:0,h:0};
  atk={x:clamp(attX,PX0-40,PX1+40), y:DROP_Y};
  gk.tx=gk.x;
  result=null; phase='cross'; t=0;
  msg='クロス！ 落下点へ入れ'; msg2='競り合い＝パンチ / クリア＝キャッチ';
}

function start(){ if(!ac())ac(); if(AC&&AC.state==='suspended')AC.resume(); reset(); state='play'; newCross(); }

// ---------- claim ----------
function claim(kind){ // 'catch' or 'punch'
  if(state==='title'){start();return;}
  if(state==='over'){ if(resultT>0.5){reset();start();} return; }
  if(state!=='play'||phase!=='cross'||!P||P.claimed) return;
  const p=P.t/P.dur;
  const windowOpen = p>0.66 && P.h<=CLAIM_H;
  const positioned = Math.abs(gk.x-P.dropX)<=REACH;
  P.claimed=true;
  if(!windowOpen){ // too early / late press
    result='whiff'; applyResult('whiff'); return;
  }
  if(!positioned){ applyResult('miss'); return; }
  if(P.contested){
    if(kind==='punch') applyResult('punch'); else applyResult('drop');
  } else {
    if(kind==='catch') applyResult('great'); else applyResult('punchok');
  }
}

function applyResult(kind){
  result=kind; resultT=0; phase='resolve';
  const good=(kind==='great'||kind==='punch'||kind==='punchok');
  if(good){
    const base=kind==='great'?180:(kind==='punch'?140:100);
    combo++; const mult=1+Math.min(6,combo-1)*0.24; const add=Math.round(base*mult);
    score+=add; claims++;
    if(kind==='great')S.great(); else if(kind==='punch')S.punch(); else S.catch();
    flash=1;flashCol=kind==='great'?'#ffe08a':'#8ff0b8'; shake=kind==='great'?12:8;
    burst(P.dropX,DROP_Y,kind==='great'?'#ffe08a':'#bfffd0',kind==='great'?26:18,7);
    const lab=kind==='great'?'ナイスキャッチ！ ':(kind==='punch'?'ナイスパンチ！ ':'キャッチ！ ');
    pop(P.dropX,DROP_Y-30,lab+'+'+add,'#eaffef');
    if(combo>=2)pop(P.dropX,DROP_Y-54,'コンボ x'+combo,'#ffe08a');
    msg=kind==='great'?'ナイスキャッチ！ クリアな球を確保':(kind==='punch'?'ナイスパンチング！ 競り合いを弾いた':'キャッチ！ 確保した'); msg2='';
  } else {
    combo=0; conceded++;
    S.goal();
    flash=1;flashCol='#ff6b6b'; shake=11;
    burst(P.dropX,DROP_Y,'#ff8a8a',16,5);
    if(kind==='drop'){msg='こぼした！ 競り合いでキャッチは危険';msg2='混戦はパンチングで弾け';}
    else if(kind==='miss'){msg='ポジション遅れ！ ヘディングを許した';msg2='落下点の真下へ入れ';}
    else {msg='空振り！ タイミングが早い';msg2='最高到達点で合わせろ';}
    pop(P.dropX,DROP_Y-24,'失点','#ffb3b3');
  }
}

// ---------- input ----------
function moveTo(x){ gk.tx=clamp(x,PX0-50,PX1+50); }
cv.addEventListener('pointerdown',e=>{
  e.preventDefault();
  if(state==='title'||state==='over'){claim('catch');return;}
  const r=cv.getBoundingClientRect(); const x=((e.clientX-r.left)/r.width)*W, y=((e.clientY-r.top)/r.height)*H;
  if(y<GK_Y+70){ // near the goal area: a tap = claim (upper=catch, lower=punch); but also allow move
    if(y<180) claim('catch'); else claim('punch');
  } else { pointerActive=true; moveTo(x); }
});
cv.addEventListener('pointermove',e=>{ if(pointerActive){const r=cv.getBoundingClientRect();moveTo(((e.clientX-r.left)/r.width)*W);} });
addEventListener('pointerup',()=>{pointerActive=false;});
addEventListener('keydown',e=>{
  if(e.code==='ArrowLeft'){moveTo(gk.tx-44);}
  else if(e.code==='ArrowRight'){moveTo(gk.tx+44);}
  else if(e.code==='ArrowUp'){e.preventDefault();claim('catch');}
  else if(e.code==='Space'){e.preventDefault();claim('punch');}
  else if(e.code==='Enter'){e.preventDefault(); if(state!=='play')claim('catch');}
});

// ---------- particles ----------
function burst(x,y,c,n,sp){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=rnd(sp*0.3,sp);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:1,c});}}
function pop(x,y,txt,c){pops.push({x,y,txt,c,life:1});}

// ---------- update ----------
function update(dt){
  shake*=Math.pow(0.86,dt/16.7); if(shake<0.3)shake=0;
  flash*=Math.pow(0.9,dt/16.7);
  for(const p of parts){p.vx*=0.96;p.vy=p.vy*0.96+0.3;p.x+=p.vx*dt/16.7;p.y+=p.vy*dt/16.7;p.life-=dt/16.7*0.026;}
  parts=parts.filter(p=>p.life>0);
  for(const p of pops){p.y-=dt/16.7*0.5;p.life-=dt/16.7*0.018;}
  pops=pops.filter(p=>p.life>0);
  gk.x+=(gk.tx-gk.x)*Math.min(1,dt/16.7*0.3);

  if(state!=='play'){ if(state==='over')resultT+=dt/1000; return; }
  t+=dt;

  if(phase==='cross'){
    P.t+=dt; const p=clamp(P.t/P.dur,0,1);
    ball.x=ball.sx+(P.dropX-ball.sx)*p;
    ball.y=ball.sy+(DROP_Y-ball.sy)*p;
    P.h=Math.sin(p*Math.PI)*P.peak;
    if(p>=1 && !P.claimed){ applyResult('miss'); }
    return;
  }
  if(phase==='resolve'){
    resultT+=dt/1000;
    if(resultT>1.05){
      if(conceded>=3){ state='over'; resultT=0; S.over(); if(score>best){best=score;localStorage.setItem('claim_best',best);} }
      else newCross();
    }
    return;
  }
}

// ---------- render ----------
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

function drawScene(){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#123b26');g.addColorStop(1,'#1f7040');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='rgba(255,255,255,0.03)';for(let i=0;i<6;i++){if(i%2)ctx.fillRect(0,i*100,W,100);}
  // goal + net
  ctx.fillStyle='rgba(255,255,255,0.06)';ctx.fillRect(PX0,BAR_Y,PX1-PX0,GL_Y-BAR_Y);
  ctx.strokeStyle='rgba(255,255,255,0.16)';ctx.lineWidth=1;
  for(let x=PX0;x<=PX1;x+=14){ctx.beginPath();ctx.moveTo(x,BAR_Y);ctx.lineTo(x,GL_Y);ctx.stroke();}
  for(let y=BAR_Y;y<GL_Y;y+=12){ctx.beginPath();ctx.moveTo(PX0,y);ctx.lineTo(PX1,y);ctx.stroke();}
  ctx.strokeStyle='#f4f4f4';ctx.lineWidth=6;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(PX0,GL_Y);ctx.lineTo(PX0,BAR_Y);ctx.lineTo(PX1,BAR_Y);ctx.lineTo(PX1,GL_Y);ctx.stroke();
  ctx.strokeStyle='rgba(255,255,255,0.8)';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(80,GL_Y);ctx.lineTo(820,GL_Y);ctx.stroke();
  // 6-yard box
  ctx.strokeStyle='rgba(255,255,255,0.25)';ctx.lineWidth=2;ctx.strokeRect(PX0-70,GL_Y,(PX1-PX0)+140,150);
}

function drawGK(){
  const x=gk.x,y=GK_Y;
  const claimReady = state==='play'&&P&&phase==='cross'&&(P.t/P.dur)>0.66&&P.h<=CLAIM_H&&Math.abs(x-P.dropX)<REACH;
  ctx.strokeStyle=claimReady?'rgba(126,240,176,0.9)':'rgba(255,255,255,0.2)';ctx.lineWidth=claimReady?4:2;
  ctx.beginPath();ctx.arc(x,y-4,REACH,0,6.28);ctx.stroke();
  ctx.fillStyle='rgba(0,0,0,0.24)';ctx.beginPath();ctx.ellipse(x,y+16,13,5,0,0,6.28);ctx.fill();
  ctx.fillStyle='#22d3a6'; rr(x-9,y-8,18,24,6);ctx.fill();
  ctx.fillStyle='#f2c9a0';ctx.beginPath();ctx.arc(x,y-16,8,0,6.28);ctx.fill();
  ctx.fillStyle='#12796a';ctx.beginPath();ctx.arc(x,y-18,8.5,Math.PI,0);ctx.fill();
  // gloves up
  ctx.strokeStyle='#22d3a6';ctx.lineWidth=5;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x-8,y-6);ctx.lineTo(x-12,y-22);ctx.moveTo(x+8,y-6);ctx.lineTo(x+12,y-22);ctx.stroke();
}

function render(){
  ctx.save();
  if(shake>0)ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
  drawScene();

  if(P&&ball&&atk){
    // drop marker
    const near=state==='play'&&phase==='cross'&&(P.t/P.dur)>0.66&&P.h<=CLAIM_H;
    if(lvl<4 || near){
      ctx.strokeStyle=near?'rgba(126,240,176,0.9)':'rgba(255,255,255,0.4)';ctx.lineWidth=near?4:2;ctx.setLineDash(near?[]:[5,6]);
      ctx.beginPath();ctx.ellipse(P.dropX,DROP_Y,34,16,0,0,6.28);ctx.stroke();ctx.setLineDash([]);
    }
    // attacker (contested shows near the drop)
    const ax=atk.x, ay=DROP_Y+4;
    ctx.fillStyle='rgba(0,0,0,0.2)';ctx.beginPath();ctx.ellipse(ax,ay+14,11,4,0,0,6.28);ctx.fill();
    ctx.fillStyle='#e2413a';rr(ax-8,ay-6,16,21,6);ctx.fill();
    ctx.fillStyle='#f2c9a0';ctx.beginPath();ctx.arc(ax,ay-14,6.5,0,6.28);ctx.fill();
    ctx.fillStyle='#8a1f1a';ctx.beginPath();ctx.arc(ax,ay-16,7,Math.PI,0);ctx.fill();
    // contested/clear tag
    if(state==='play'&&phase==='cross'){ ctx.textAlign='center';ctx.font='bold 14px sans-serif';
      ctx.fillStyle=P.contested?'#ff9a9a':'#8ff0b8';ctx.fillText(P.contested?'競り合い→パンチ':'クリア→キャッチ',P.dropX,DROP_Y+52); }
    drawGK();
    // ball with shadow (pseudo-3d)
    ctx.fillStyle='rgba(0,0,0,0.2)';ctx.beginPath();ctx.ellipse(ball.x,ball.y+6,8,3,0,0,6.28);ctx.fill();
    const by=ball.y-P.h;
    ctx.strokeStyle='rgba(255,255,255,0.14)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(ball.x,ball.y);ctx.lineTo(ball.x,by);ctx.stroke();
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(ball.x,by,8,0,6.28);ctx.fill();ctx.strokeStyle='#333';ctx.lineWidth=1.3;ctx.beginPath();ctx.arc(ball.x,by,8,0,6.28);ctx.stroke();
  }

  for(const p of parts){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,3.2,0,6.28);ctx.fill();}
  ctx.globalAlpha=1;
  for(const p of pops){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.font='bold 21px sans-serif';ctx.textAlign='center';ctx.fillText(p.txt,p.x,p.y);}
  ctx.globalAlpha=1;

  // HUD
  ctx.textAlign='left';ctx.fillStyle='#fff';ctx.font='bold 26px sans-serif';ctx.fillText('SCORE '+score,20,36);
  ctx.textAlign='right';ctx.fillStyle='rgba(255,255,255,0.85)';ctx.font='14px sans-serif';ctx.fillText('確保 '+claims+'  Lv.'+lvl,W-20,26);
  ctx.fillText('失点',W-92,50);
  for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(W-66+i*22,46,7,0,6.28);ctx.fillStyle=i<conceded?'#ff5b5b':'rgba(255,255,255,0.25)';ctx.fill();}
  if(combo>=2){ctx.textAlign='left';ctx.fillStyle='#ffe08a';ctx.font='bold 18px sans-serif';ctx.fillText('コンボ x'+combo,20,60);}

  if(state==='play'&&(msg||msg2)){
    ctx.textAlign='center';
    const good=result==='great'||result==='punch'||result==='punchok'||result==='catch';
    ctx.fillStyle=result?(good?'#8ff0b8':'#ff9a9a'):'rgba(255,255,255,0.92)';
    ctx.font='bold 26px sans-serif';ctx.fillText(msg,W/2,H-54);
    if(msg2){ctx.fillStyle='rgba(255,255,255,0.72)';ctx.font='15px sans-serif';ctx.fillText(msg2,W/2,H-30);}
  }

  if(state==='title'){
    ctx.fillStyle='rgba(6,16,10,0.66)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='bold 46px sans-serif';ctx.fillText('クロス処理',W/2,190);
    ctx.fillStyle='#8ff0b8';ctx.font='bold 22px sans-serif';ctx.fillText('Claim the Cross',W/2,226);
    ctx.fillStyle='rgba(255,255,255,0.9)';ctx.font='18px sans-serif';
    ctx.fillText('GKを横移動（ドラッグ / ← →）でクロスの落下点の真下へ入り',W/2,288);
    ctx.fillText('最高到達点で処理：クリアはキャッチ（↑）、競り合いはパンチ（SPACE）',W/2,316);
    ctx.fillStyle='rgba(255,255,255,0.66)';ctx.font='15px sans-serif';
    ctx.fillText('混戦でキャッチはこぼす／位置ズレはヘディング許す／早いと空振り',W/2,358);
    ctx.fillText('クリアな球をキャッチで確保＝高得点。3失点で終了',W/2,382);
    ctx.fillStyle='#ffe08a';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で開始',W/2,442);
    ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='14px sans-serif';ctx.fillText('BEST '+best,W/2,474);
  }
  if(state==='over'){
    ctx.fillStyle='rgba(6,16,10,0.74)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#ff6b6b';ctx.font='bold 46px sans-serif';ctx.fillText('3失点…終了',W/2,230);
    ctx.fillStyle='#fff';ctx.font='bold 40px sans-serif';ctx.fillText('SCORE '+score,W/2,296);
    ctx.fillStyle='rgba(255,255,255,0.85)';ctx.font='20px sans-serif';ctx.fillText('確保 '+claims+'   BEST '+best,W/2,336);
    ctx.fillStyle='#8ff0b8';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で もう一度',W/2,408);
  }

  if(flash>0.02){ctx.globalAlpha=flash*0.5;ctx.fillStyle=flashCol;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}
  ctx.restore();

  ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,0.4)';ctx.font='13px sans-serif';
  ctx.fillText('落下点の真下へ（←→）。クリア＝キャッチ（↑）、競り合い＝パンチ（SPACE）を最高到達点で。3失点で終了',W/2,H-8);
}

function frame(ts){let dt=ts-last;last=ts;if(dt>60)dt=60;if(dt<0)dt=0;update(dt);render();requestAnimationFrame(frame);}
requestAnimationFrame(frame);

// ---------- test hook ----------
window.__cc={
  start, moveTo, catchIt:()=>claim('catch'), punchIt:()=>claim('punch'),
  get state(){return state;},
  get score(){return score;},
  get claims(){return claims;},
  get conceded(){return conceded;},
  get info(){return {state,phase, p:P?P.t/P.dur:0, dropX:P?P.dropX:0, gkX:gk.x, contested:P?P.contested:false,
    h:P?P.h:0, claimH:CLAIM_H, reach:REACH, windowOpen: !!(P&&phase==='cross'&&(P.t/P.dur)>0.66&&P.h<=CLAIM_H),
    result, claims, conceded, lvl};}
};
})();
</script>
</body>
</html>
