<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>当たったか？ (Hit By Pitch?)</title>
<style>
  html,body{margin:0;padding:0;background:#0a1016;overflow:hidden;font-family:'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif;-webkit-user-select:none;user-select:none;touch-action:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 30%,#1b3450,#060b12 72%);}
  #stage{position:relative;width:min(100vw,calc(100vh*1.5));aspect-ratio:900/600;max-width:900px;box-shadow:0 10px 60px rgba(0,0,0,.6);border-radius:8px;overflow:hidden;}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;}
</style>
</head>
<body>
<div id="wrap"><div id="stage"><canvas id="cv"></canvas></div></div>
<script>
(function(){
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const W=900,H=600;let DPR=Math.min(2,window.devicePixelRatio||1);
function fit(){const r=cv.getBoundingClientRect();DPR=Math.min(2,window.devicePixelRatio||1);cv.width=Math.round(r.width*DPR);cv.height=Math.round(r.height*DPR);ctx.setTransform(cv.width/W,0,0,cv.height/H,0,0);}
new ResizeObserver(fit).observe(cv);fit();

// ---------- audio ----------
let AC=null;function actx(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function tone(f,d,type,v,sweep){const a=actx();if(!a)return;const o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.value=f;if(sweep)o.frequency.linearRampToValueAtTime(sweep,a.currentTime+d);g.gain.value=0.0001;g.gain.exponentialRampToValueAtTime(v||0.2,a.currentTime+0.008);g.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+d);o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+d+0.02);}
function noise(d,v,hp){const a=actx();if(!a)return;const n=a.createBufferSource(),b=a.createBuffer(1,a.sampleRate*d,a.sampleRate),dt=b.getChannelData(0);for(let i=0;i<dt.length;i++)dt[i]=Math.random()*2-1;n.buffer=b;const f=a.createBiquadFilter();f.type='highpass';f.frequency.value=hp||800;const g=a.createGain();g.gain.value=0.0001;g.gain.exponentialRampToValueAtTime(v||0.2,a.currentTime+0.01);g.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+d);n.connect(f);f.connect(g);g.connect(a.destination);n.start();n.stop(a.currentTime+d+0.02);}
const S={
  pitch(){tone(400,0.13,'sawtooth',0.13,180);},
  hit(){noise(0.08,0.22,500);tone(180,0.12,'sine',0.16,90);},
  mitt(){tone(1400,0.06,'square',0.13);noise(0.05,0.12,2000);},
  right(){tone(560,0.1,'triangle',0.2);setTimeout(function(){tone(760,0.14,'triangle',0.22);},110);},
  wrong(){tone(280,0.32,'sawtooth',0.18,150);setTimeout(function(){tone(180,0.4,'sawtooth',0.16,110);},150);},
  combo(n){tone(600+Math.min(n,8)*70,0.12,'triangle',0.16);},
  over(){tone(330,0.3,'sine',0.2,160);setTimeout(function(){tone(220,0.5,'sine',0.2,110);},180);},
  start(){tone(440,0.1,'triangle',0.18);setTimeout(function(){tone(660,0.16,'triangle',0.2);},110);},
};

function clamp(v,a,b){return v<a?a:v>b?b:v;}
function rnd(a,b){return a+Math.random()*(b-a);}

// ---------- state ----------
let state='title';
let outs=0,fails=0,score=0,combo=0,lvl=1;   // outs = correct calls
let best=0;try{best=parseInt(localStorage.getItem('hp_best')||'0')||0;}catch(e){}
const TARGET=26;

let phase='wind';  // wind | watch | result
let pt=0, clock=0;
let revealT=500, callWin=1000, tough=false, truth='no'; // hbp = grazed the batter ; no = missed
let decided=false, result='', called='';
const FRONTX=582, BODYY=372;   // batter's front (inside) edge
let contactX=560;
let parts=[];
let shakeT=0,flash=0;
let msg='',msgCol='#fff',msgT=0;
let ballX=390,ballY=232;

function reset(){outs=0;fails=0;score=0;combo=0;lvl=1;parts=[];}
function newPitch(){
  lvl=Math.min(7,1+Math.floor(outs/4));
  revealT=clamp(560-lvl*24,360,560);
  callWin=clamp(1020-lvl*70,560,1020);
  tough=Math.random()<clamp(0.2+lvl*0.05,0.2,0.5);
  truth=Math.random()<0.5?'hbp':'no';
  const g=tough?rnd(5,13):rnd(20,46);
  contactX=(truth==='hbp')?FRONTX+g:FRONTX-g; // hbp = ball reaches into the body ; no = ball short of the body
  phase='wind';pt=0;clock=0;decided=false;result='';called='';
  ballX=390;ballY=232;
}
function startGame(){reset();state='play';newPitch();S.start();}

function burst(x,y,col,n,sp){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=rnd(0.4,1)*(sp||3);parts.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:1,col:col,r:rnd(2,5)});}}

function resolve(kind){
  decided=true;result=kind;
  if(kind==='right'){
    outs++;combo++;
    const cm=1+Math.min(combo-1,6)*0.13;
    const add=Math.round((100+(tough?60:0))*cm)*Math.max(1,lvl);
    score+=add;lastAdd=add;
    S.right();if(combo>1)setTimeout(function(){S.combo(combo);},250);
    flash=0.28;
    msg='正しいジャッジ！ '+(truth==='hbp'?'死球——一塁へ！':'当たってない——ボール！')+'  +'+add;msgCol='#5affa0';msgT=1;
    burst(contactX,BODYY,'#5affa0',14,3.2);
  }else{
    combo=0;fails++;
    S.wrong();flash=0.4;shakeT=0.8;
    if(result==='early')msg='早すぎる！ まだ判定できない';
    else if(result==='late')msg='判定が遅い！ 両軍騒然';
    else msg='誤審！ 本当は'+(truth==='hbp'?'死球だった':'当たっていなかった');
    msgCol='#ff6a6a';msgT=1;
  }
  phase='result';pt=0;
}
let lastAdd=0;

function makeCall(c){
  if(state!=='play'||phase!=='watch'||decided)return;
  called=c;
  if(clock<revealT){resolve('early');return;}
  const correct=(c==='hbp'&&truth==='hbp')||(c==='no'&&truth==='no');
  resolve(correct?'right':'wrong');
}

// ---------- input ----------
function actH(){if(!AC)actx();if(state==='title'){startGame();return;}if(state==='over'){startGame();return;}makeCall('hbp');}
function actN(){if(!AC)actx();if(state==='title'){startGame();return;}if(state==='over'){startGame();return;}makeCall('no');}
cv.addEventListener('mousedown',function(e){e.preventDefault();
  if(state!=='play'){actH();return;}
  const r=cv.getBoundingClientRect();const x=(e.clientX-r.left)/r.width*W;
  if(x<450)actH();else actN();
});
cv.addEventListener('touchstart',function(e){e.preventDefault();
  if(state!=='play'){actH();return;}
  const r=cv.getBoundingClientRect();const t=e.changedTouches[0];const x=(t.clientX-r.left)/r.width*W;
  if(x<450)actH();else actN();
},{passive:false});
window.addEventListener('keydown',function(e){
  if(e.code==='ArrowLeft'||e.code==='KeyA'){e.preventDefault();actH();}
  else if(e.code==='ArrowRight'||e.code==='KeyD'){e.preventDefault();actN();}
  else if(e.code==='Space'||e.code==='Enter'){e.preventDefault();if(state!=='play')actH();}
});

// ---------- update ----------
let last=0;
function update(dt){
  if(flash>0)flash=Math.max(0,flash-dt/300);
  if(shakeT>0)shakeT=Math.max(0,shakeT-dt/320);
  if(msgT>0)msgT=Math.max(0,msgT-dt/1500);
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.x+=p.vx;p.y+=p.vy;p.vy+=0.16;p.life-=dt/640;if(p.life<=0)parts.splice(i,1);}
  if(state!=='play')return;
  pt+=dt;
  if(phase==='wind'){
    if(pt>=440){phase='watch';pt=0;clock=0;S.pitch();}
  }else if(phase==='watch'){
    clock+=dt;
    if(clock<revealT){
      const u=clamp(clock/revealT,0,1);
      ballX=390+(contactX-390)*u; ballY=232+(BODYY-232)*u;
    }else{
      if(clock<revealT+18){ if(truth==='hbp'){S.hit();burst(contactX,BODYY,'#ff9a9a',8,2.5);} else {S.mitt();} }
      // after reveal: hbp ball drops at body; no ball continues to catcher
      if(truth==='hbp'){ ballX=contactX; ballY=BODYY+clamp((clock-revealT)/200,0,1)*70; }
      else { const u=clamp((clock-revealT)/240,0,1); ballX=contactX+(600-contactX)*u; ballY=BODYY+(500-BODYY)*u; }
    }
    if(clock>=revealT+callWin&&!decided)resolve('late');
  }else if(phase==='result'){
    if(pt>=1080){
      if(fails>=3){state='over';best=Math.max(best,score);try{localStorage.setItem('hp_best',String(best));}catch(e){}S.over();}
      else if(outs>=TARGET){state='over';best=Math.max(best,score);try{localStorage.setItem('hp_best',String(best));}catch(e){}S.start();}
      else newPitch();
    }
  }
}

// ---------- render ----------
function roundRect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

function drawField(){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#2a5a3a');g.addColorStop(1,'#1c4a2c');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#8a5a34';ctx.beginPath();ctx.ellipse(520,430,260,120,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#9a663a';ctx.beginPath();ctx.ellipse(390,235,50,24,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#c9c2b6';ctx.fillRect(382,230,16,5);
  // batter box + home plate
  ctx.strokeStyle='rgba(255,255,255,.4)';ctx.lineWidth=2;ctx.strokeRect(560,410,66,110);
  ctx.fillStyle='#eee';ctx.beginPath();ctx.moveTo(560,472);ctx.lineTo(548,464);ctx.lineTo(548,456);ctx.lineTo(572,456);ctx.lineTo(572,464);ctx.closePath();ctx.fill();
}

function drawPitcher(){
  const cx=390,cy=214;
  ctx.fillStyle='#d8dde6';ctx.fillRect(cx-8,cy-18,16,22);
  ctx.fillStyle='#2a4a6b';ctx.fillRect(cx-8,cy+2,16,9);
  ctx.fillStyle='#f0c9a0';ctx.beginPath();ctx.arc(cx,cy-24,7,0,Math.PI*2);ctx.fill();
}

function drawBatter(){
  const cx=598,cy=BODYY;
  // shadow
  ctx.fillStyle='rgba(0,0,0,.25)';ctx.beginPath();ctx.ellipse(cx,cy+96,22,7,0,0,Math.PI*2);ctx.fill();
  // legs
  ctx.fillStyle='#2a2a2a';ctx.fillRect(cx-12,cy+52,10,44);ctx.fillRect(cx+3,cy+52,10,44);
  // torso (front edge ~ FRONTX)
  ctx.fillStyle='#c23b3b';ctx.fillRect(FRONTX,cy-8,30,64);
  // head + helmet
  ctx.fillStyle='#f0c9a0';ctx.beginPath();ctx.arc(cx-2,cy-24,11,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#7a2a22';ctx.beginPath();ctx.arc(cx-2,cy-26,12,Math.PI*0.9,Math.PI*2.1);ctx.fill();
  // bat over the shoulder
  ctx.strokeStyle='#c98b3a';ctx.lineWidth=6;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(cx+10,cy-6);ctx.lineTo(cx+34,cy-46);ctx.stroke();
  // catcher
  ctx.fillStyle='#3b6b9b';ctx.fillRect(586,470,28,28);ctx.fillStyle='#243a52';ctx.beginPath();ctx.arc(600,466,10,0,Math.PI*2);ctx.fill();
}

function drawBall(){
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(ballX,ballY,7,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='#d33';ctx.lineWidth=1;ctx.beginPath();ctx.arc(ballX-2,ballY,5,-0.7,0.7);ctx.stroke();
}

function drawReveal(){
  if(phase==='watch'&&clock>=revealT&&!decided){
    // contact/gap dot
    ctx.fillStyle=(truth==='hbp')?'#ff6a6a':'#7ab0ff';ctx.beginPath();ctx.arc(contactX,BODYY,9,0,Math.PI*2);ctx.fill();
    ctx.textAlign='center';ctx.font='bold 26px sans-serif';
    if(truth==='hbp'){ctx.fillStyle='#ff9a9a';ctx.fillText('ユニフォームをかすった！',450,120);}
    else{ctx.fillStyle='#9fd0ff';ctx.fillText('わずかに手前で外れた！',450,120);}
    ctx.font='14px sans-serif';ctx.fillStyle='#dfe';ctx.fillText('リプレイ検証 — さあ、ジャッジ！',450,146);
  }
}

function drawButtons(){
  if(state!=='play')return;
  const active=(phase==='watch'&&!decided&&clock>=revealT);
  ctx.globalAlpha=active?1:0.5;
  roundRect(70,520,320,64,12);ctx.fillStyle=(called==='hbp')?'#c24a4a':'rgba(160,50,50,.72)';ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,.5)';ctx.lineWidth=2;ctx.stroke();
  roundRect(510,520,320,64,12);ctx.fillStyle=(called==='no')?'#2f7db0':'rgba(30,90,140,.72)';ctx.fill();ctx.stroke();
  ctx.globalAlpha=1;
  ctx.textAlign='center';
  ctx.fillStyle='#ffd0d0';ctx.font='bold 24px sans-serif';ctx.fillText('死球',230,550);
  ctx.font='12px sans-serif';ctx.fillStyle='#e0b0b0';ctx.fillText('当たった → 一塁へ　← / A',230,572);
  ctx.fillStyle='#bfe0ff';ctx.font='bold 24px sans-serif';ctx.fillText('ボール',670,550);
  ctx.font='12px sans-serif';ctx.fillStyle='#a0c0e0';ctx.fillText('当たってない → 続行　→ / D',670,572);
}

function drawHUD(){
  ctx.textAlign='left';ctx.textBaseline='alphabetic';
  ctx.font='bold 20px sans-serif';ctx.fillStyle='#fff';
  ctx.fillText('正審 '+outs+' / '+TARGET,20,32);
  ctx.font='14px sans-serif';ctx.fillStyle='#ffb14a';ctx.fillText('誤審 '+fails+' / 3',20,54);
  ctx.textAlign='right';
  ctx.font='bold 20px sans-serif';ctx.fillStyle='#ffe08a';ctx.fillText('SCORE '+score,W-20,32);
  ctx.font='13px sans-serif';ctx.fillStyle='#bfe';ctx.fillText('BEST '+Math.max(best,score)+'   Lv.'+lvl,W-20,52);
  if(combo>1){ctx.textAlign='center';ctx.font='bold 20px sans-serif';ctx.fillStyle='#5affa0';ctx.fillText(combo+' 連続好ジャッジ!',450,84);}
}

function drawMsg(){
  if(msgT<=0)return;
  ctx.save();ctx.globalAlpha=clamp(msgT*1.4,0,1);
  ctx.textAlign='center';ctx.font='bold 25px sans-serif';
  ctx.fillStyle='rgba(0,0,0,.55)';roundRect(450-290,158,580,44,10);ctx.fill();
  ctx.fillStyle=msgCol;ctx.fillText(msg,450,188);
  ctx.restore();
}

function drawTitle(){
  drawField();drawBatter();drawPitcher();
  ctx.save();ctx.textAlign='center';
  ctx.fillStyle='rgba(0,0,0,.64)';roundRect(90,100,720,392,16);ctx.fill();
  ctx.fillStyle='#fff';ctx.font='bold 36px sans-serif';ctx.fillText('当たったか？',450,160);
  ctx.font='18px sans-serif';ctx.fillStyle='#9fe0bf';ctx.fillText('Hit By Pitch?',450,190);
  ctx.font='16px sans-serif';ctx.fillStyle='#e6fcef';
  const lines=[
    'あなたは球審。インコースの厳しい投球——',
    'ボールが打者に「当たった（死球）」のか、',
    '「わずかに外れた（ボール）」のかを一瞬で見極めろ！',
    '死球なら打者は一塁へ、外れていれば試合続行。',
    'リプレイ検証の一瞬を見てジャッジ。際どいかすりに注意。',
    '早すぎるコール・判定遅れは誤審。3誤審でクビ。',
    '左半分/← = 死球、右半分/→ = ボール。',
  ];
  for(let i=0;i<lines.length;i++)ctx.fillText(lines[i],450,226+i*28);
  ctx.fillStyle='#ffe08a';ctx.font='bold 22px sans-serif';
  ctx.fillText('タップ / SPACE でスタート',450,470);
  ctx.restore();
}

function drawOver(){
  drawField();
  ctx.save();ctx.textAlign='center';
  ctx.fillStyle='rgba(0,0,0,.64)';roundRect(190,150,520,300,16);ctx.fill();
  const w2=outs>=TARGET;
  ctx.fillStyle=w2?'#5affa0':'#ff8a5a';ctx.font='bold 36px sans-serif';
  ctx.fillText(w2?'名球審！':'誤審でクビ…',450,222);
  ctx.fillStyle='#fff';ctx.font='20px sans-serif';
  ctx.fillText('正審 '+outs+' / '+TARGET,450,270);
  ctx.fillText('スコア '+score,450,304);
  ctx.fillStyle='#ffe08a';ctx.fillText('ベスト '+Math.max(best,score),450,336);
  ctx.fillStyle='#9fe0bf';ctx.font='bold 20px sans-serif';
  ctx.fillText('タップ / SPACE でもう一度',450,404);
  ctx.restore();
}

function render(){
  ctx.save();
  if(shakeT>0){const s=shakeT*7;ctx.translate(rnd(-s,s),rnd(-s,s));}
  if(state==='title'){drawTitle();}
  else if(state==='over'){drawOver();}
  else{
    drawField();
    drawPitcher();
    drawBatter();
    drawBall();
    drawReveal();
    drawButtons();
    drawHUD();
    drawMsg();
  }
  for(const p of parts){ctx.globalAlpha=clamp(p.life,0,1);ctx.fillStyle=p.col;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();}
  ctx.globalAlpha=1;
  ctx.restore();
  if(flash>0){ctx.fillStyle='rgba(255,255,255,'+(flash*0.5)+')';ctx.fillRect(0,0,W,H);}
}

function frame(ts){let dt=ts-last;last=ts;if(dt>60)dt=60;if(dt<0)dt=0;update(dt);render();requestAnimationFrame(frame);}
requestAnimationFrame(frame);

// ---------- test hook ----------
window.__hp={
  start:startGame,
  hbp:function(){makeCall('hbp');},
  no:function(){makeCall('no');},
  get state(){return state;},
  get outs(){return outs;},
  get fails(){return fails;},
  get score(){return score;},
  get info(){return {state:state,phase:phase,clock:clock,revealT:revealT,callWin:callWin,tough:tough,decided:decided,result:result,called:called,truth:truth,outs:outs,fails:fails,lvl:lvl,isHBP:(truth==='hbp'),revealed:(clock>=revealT),canAct:(state==='play'&&phase==='watch'&&!decided)};}
};
})();
</script>
</body>
</html>
