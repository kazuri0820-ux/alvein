<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>サン・キャッチ (Lose It in the Sun)</title>
<style>
  html,body{margin:0;height:100%;background:#0a0d08;overflow:hidden;
    font-family:-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  #stage{position:relative;width:100vw;height:100vh;max-width:calc(100vh*1.5);max-height:calc(100vw/1.5);aspect-ratio:900/600;}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;border-radius:6px;}
</style>
</head>
<body>
<div id="wrap"><div id="stage"><canvas id="cv"></canvas></div></div>
<script>
(function(){
const W=900,H=600,cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let DPR=1;
function fit(){DPR=Math.min(2,window.devicePixelRatio||1);cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
fit();addEventListener('resize',fit);

// ---------- audio ----------
let AC=null;function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function tone(f,d,type,v,sweep){const a=ac();if(!a)return;const t=a.currentTime,o=a.createOscillator(),g=a.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(sweep)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+sweep),t+d);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v||0.2,t+0.008);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+0.02);}
function noise(d,v,hp){const a=ac();if(!a)return;const t=a.currentTime,n=Math.floor(a.sampleRate*d),buf=a.createBuffer(1,n,a.sampleRate),ch=buf.getChannelData(0);
  for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource();s.buffer=buf;
  const f=a.createBiquadFilter();f.type='highpass';f.frequency.value=hp||600;const g=a.createGain();g.gain.value=v||0.2;
  s.connect(f);f.connect(g);g.connect(a.destination);s.start(t);s.stop(t+d+0.02);}
const S={
  hit:()=>{noise(0.04,0.14,500);tone(240,0.06,'square',0.08,-40);},
  ready:()=>{tone(430,0.09,'sine',0.05,120);},
  mitt:()=>{noise(0.05,0.2,1200);tone(220,0.05,'square',0.08,-60);},
  catch:()=>{[620,860,1120].forEach((f,i)=>setTimeout(()=>tone(f,0.1,'triangle',0.16),i*55));},
  big:()=>{[600,800,1000,1250].forEach((f,i)=>setTimeout(()=>tone(f,0.12,'triangle',0.17),i*80));},
  drop:()=>{noise(0.12,0.16,300);setTimeout(()=>tone(180,0.16,'sawtooth',0.12,-40),40);},
  streak:()=>{[700,930,1170,1400].forEach((f,i)=>setTimeout(()=>tone(f,0.1,'triangle',0.16),i*60));},
  over:()=>{[440,330,247,175].forEach((f,i)=>setTimeout(()=>tone(f,0.3,'triangle',0.2),i*160));}
};

// ---------- geometry ----------
const GLV={x:452,y:432};       // fielder glove (catch height)
const SUN={x:726,y:118,r:52};  // the sun
const SUNBAND=[150,262];       // screen-y band where glare hides the ball on the way down
let launchX=250;

// ---------- state ----------
let state='title', phase='fly', plays=0;
let score=0, combo=0, best=+(localStorage.getItem('su_best')||0);
let outs=0, fails=0, lvl=1;   // outs = catches
let clock=0, catchT=980, w=150, apexU=0.42, tough=false;
let acted=false, actT=0, result=null, resultT=0, msg='', msgOk=false, quality=0, dropU=0;
let shake=0, flash=0, flashCol='#fff', last=performance.now();
let parts=[], pops=[];

function rnd(a,b){return a+Math.random()*(b-a);}
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function lerp(a,b,u){return a+(b-a)*u;}
function easeOut(u){return 1-Math.pow(1-u,2);}
function easeIn(u){return u*u;}

function reset(){state='title';score=0;combo=0;outs=0;fails=0;lvl=1;plays=0;result=null;parts=[];pops=[];}

function newPlay(){
  plays++; lvl=Math.min(7,1+Math.floor(outs/4));
  catchT=clamp(1080-lvl*62,640,1080);
  w=clamp(158-lvl*11,88,158);
  tough=Math.random()<clamp(0.2+lvl*0.05,0.2,0.5);
  if(tough)w*=0.8;
  launchX=rnd(180,360);
  phase='fly'; clock=0; acted=false; actT=0; result=null; resultT=0; msg=''; msgOk=false; quality=0; dropU=0;
  S.hit(); setTimeout(()=>{if(phase==='fly')S.ready();},120);
}
function start(){ if(!ac())ac(); if(AC&&AC.state==='suspended')AC.resume(); reset(); state='play'; newPlay(); }

function catchBall(){
  if(state==='title'){start();return;}
  if(state==='over'){ if(resultT>0.4){reset();start();} return; }
  if(state!=='play'||phase!=='fly'||acted) return;
  acted=true; actT=clock; S.mitt();
  if(clock<catchT-w){ resolve('early'); }
  else if(clock<=catchT+w){ quality=1-Math.abs(clock-catchT)/w; resolve('catch'); }
  else resolve('late');
}

function resolve(k){
  phase='result'; result=k; resultT=0; dropU=0;
  if(k==='catch'){
    outs++; combo++;
    const perfect=quality>=0.8;
    let add=Math.round((tough?250:150)*(1+Math.min(9,combo-1)*0.14)); score+=add;
    setTimeout(S.catch,40); if(perfect||tough)setTimeout(S.big,150);
    msgOk=true; flash=1;flashCol='#8affa0';shake=5; burst(GLV.x,GLV.y-6,'#8affa0',15,6);
    pop(W/2,250,(perfect?'グラブど真ん中！ナイスキャッチ！ +':'太陽越しに掴んだ！ +')+add,'#d6ffe0');
    if(combo>=2)pop(W/2,150,'コンボ x'+combo,'#ffd24d');
    if(combo>0&&combo%5===0)S.streak();
    msg='眩しい陽射しに消えた打球を、勘で位置を読み切ってグラブに収めた';
  } else {
    fails++; combo=0; msgOk=false; flash=1;shake=8; S.drop();
    if(k==='early'){ flashCol='#ff5b5b'; msg='早い…見えないボールに早くグラブを出し、頭上を越えて後逸'; pop(W/2,250,'お手玉…後逸','#ffb0b0'); }
    else if(k==='late'){ flashCol='#ff8b3b'; msg='遅い…陽射しから出た時にはもう落下、目測を誤って足元へ'; pop(W/2,250,'落球…','#ffcf9a'); }
    else { flashCol='#ff5b5b'; msg='見失った…太陽に消えたまま、ボールは無情に芝へ落ちた'; pop(W/2,250,'見失い落球…','#ffb0b0'); }
  }
  if(fails>=3){ state='over'; resultT=0; S.over(); if(score>best){best=score;localStorage.setItem('su_best',best);} }
}

// ---------- input ----------
cv.addEventListener('pointerdown',e=>{e.preventDefault();catchBall();});
addEventListener('keydown',e=>{ if(e.repeat)return;
  if(e.code==='Space'||e.code==='Enter'||e.code==='ArrowUp'||e.code==='KeyF'||e.code==='KeyJ'){e.preventDefault();catchBall();} });

// ---------- particles ----------
function burst(x,y,c,n,sp){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=rnd(sp*0.3,sp);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:1,c});}}
function pop(x,y,txt,c){pops.push({x,y,txt,c,life:1});}

// fly-ball position along its parabola (u = clock/catchT, 0..1)
function ballPos(u){
  u=clamp(u,0,1);
  let x=lerp(launchX,GLV.x,easeOut(clamp(u/apexU,0,1)));
  let y;
  if(u<apexU) y=lerp(540,86,easeOut(u/apexU));           // rising to apex
  else y=lerp(86,GLV.y,easeIn((u-apexU)/(1-apexU)));       // descending to glove
  return {x,y};
}
// is the ball hidden by the sun glare right now? (descending & within the band)
function ballHidden(){
  if(phase!=='fly') return false;
  const u=clock/catchT; if(u<apexU) return false;
  const p=ballPos(u); return p.y>=SUNBAND[0]&&p.y<=SUNBAND[1];
}

// ---------- update ----------
function update(dt){
  shake*=Math.pow(0.86,dt/16.7); if(shake<0.3)shake=0;
  flash*=Math.pow(0.9,dt/16.7);
  for(const q of parts){q.vx*=0.96;q.vy=q.vy*0.96+0.28;q.x+=q.vx*dt/16.7;q.y+=q.vy*dt/16.7;q.life-=dt/16.7*0.026;}
  parts=parts.filter(q=>q.life>0);
  for(const q of pops){q.y-=dt/16.7*0.5;q.life-=dt/16.7*0.02;}
  pops=pops.filter(q=>q.life>0);

  if(state!=='play'){ if(state==='over')resultT+=dt/1000; return; }
  if(phase==='fly'){ clock+=dt;
    if(!acted && clock>catchT+w*2){ acted=true; actT=clock; resolve('miss'); }
    return; }
  if(phase==='result'){ resultT+=dt/1000; dropU=Math.min(1,dropU+dt/520);
    if(resultT>1.55) newPlay(); return; }
}

// ---------- render ----------
function drawField(){
  // sky
  const sg=ctx.createLinearGradient(0,0,0,H*0.62);sg.addColorStop(0,'#7db6e8');sg.addColorStop(1,'#bfe0f2');
  ctx.fillStyle=sg;ctx.fillRect(0,0,W,H*0.62);
  // sun + glare
  const gr=ctx.createRadialGradient(SUN.x,SUN.y,10,SUN.x,SUN.y,240);
  gr.addColorStop(0,'rgba(255,250,210,0.95)');gr.addColorStop(0.35,'rgba(255,245,190,0.5)');gr.addColorStop(1,'rgba(255,245,190,0)');
  ctx.fillStyle=gr;ctx.fillRect(0,0,W,H*0.62);
  ctx.fillStyle='#fff6c8';ctx.beginPath();ctx.arc(SUN.x,SUN.y,SUN.r,0,6.28);ctx.fill();
  // glare band across the sky (where the ball is lost)
  const bg=ctx.createLinearGradient(0,SUNBAND[0],0,SUNBAND[1]);
  bg.addColorStop(0,'rgba(255,250,220,0)');bg.addColorStop(0.5,'rgba(255,250,220,0.42)');bg.addColorStop(1,'rgba(255,250,220,0)');
  ctx.fillStyle=bg;ctx.fillRect(0,SUNBAND[0],W,SUNBAND[1]-SUNBAND[0]);
  // grass
  const g=ctx.createLinearGradient(0,H*0.58,0,H);g.addColorStop(0,'#178a49');g.addColorStop(1,'#0c5a2e');
  ctx.fillStyle=g;ctx.fillRect(0,H*0.58,W,H*0.42);
  ctx.globalAlpha=0.08;for(let i=0;i<6;i++){ctx.fillStyle=i%2?'#fff':'#000';ctx.fillRect(0,360+i*40,W,40);}ctx.globalAlpha=1;
}
function drawFielder(reach){
  // fielder camped under the ball, glove up
  ctx.save();ctx.translate(GLV.x,GLV.y+44);
  ctx.fillStyle='rgba(0,0,0,0.18)';ctx.beginPath();ctx.ellipse(0,20,20,6,0,0,6.28);ctx.fill();
  ctx.fillStyle='#d8dde2';ctx.beginPath();ctx.ellipse(0,-8,13,19,0,0,6.28);ctx.fill();   // jersey
  ctx.fillStyle='#f0c9a0';ctx.beginPath();ctx.arc(0,-34,9,0,6.28);ctx.fill();             // head
  ctx.fillStyle='#12305c';ctx.beginPath();ctx.arc(0,-37,9.5,Math.PI,0);ctx.fill();        // cap
  ctx.fillStyle='#12305c';ctx.fillRect(-13,-38,10,3);                                     // brim (shading eyes)
  // arm reaching up to the glove
  ctx.strokeStyle='#d8dde2';ctx.lineWidth=6;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(-3,-22);ctx.lineTo(-8,-44-reach);ctx.stroke();ctx.lineCap='butt';
  // glove
  ctx.fillStyle='#6a3d16';ctx.beginPath();ctx.arc(-9,-52-reach,12,0,6.28);ctx.fill();
  ctx.fillStyle='#8a5320';ctx.beginPath();ctx.arc(-9,-52-reach,8,0,6.28);ctx.fill();
  ctx.restore();
}

function render(){
  ctx.save();
  if(shake>0)ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
  drawField();

  if(state==='play'||state==='over'){
    const reach=(phase==='fly'&&clock>catchT-w*1.4)?6:(phase==='result'&&result==='catch'?8:0);
    drawFielder(reach);

    // the fly ball
    let bx,by,hidden=false;
    if(phase==='fly'){
      const u=clock/catchT; const p=ballPos(u); bx=p.x; by=p.y; hidden=ballHidden();
    } else {
      const u=easeOut(dropU);
      const base=ballPos(clamp((actT||catchT)/catchT,0,1));
      if(result==='catch'){ bx=GLV.x-9; by=GLV.y-52-8; }
      else if(result==='early'){ bx=lerp(GLV.x,GLV.x-30,u); by=lerp(base.y,GLV.y+70,u); }   // over the glove, behind
      else if(result==='late'){ bx=lerp(GLV.x,GLV.x+18,u); by=lerp(Math.min(base.y,GLV.y),GLV.y+64,u); } // to the turf
      else { bx=GLV.x+4; by=lerp(200,GLV.y+64,u); }
    }
    if(!hidden){
      ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(bx,by,7.5,0,6.28);ctx.fill();
      ctx.strokeStyle='#c33';ctx.lineWidth=1.1;ctx.beginPath();ctx.arc(bx,by,7.5,0.4,2.2);ctx.stroke();
    } else {
      // faint shimmer where the ball is lost in the sun
      ctx.fillStyle='rgba(255,255,255,0.18)';ctx.beginPath();ctx.arc(bx,by,10,0,6.28);ctx.fill();
    }

    // cue banner + timing bar (marker hidden while lost in the sun)
    ctx.textAlign='center';
    if(state==='play'&&phase==='fly'){
      ctx.fillStyle='rgba(40,60,80,0.92)';ctx.font='bold 20px sans-serif';ctx.fillText('太陽に消える打球——“出てくる所”を読んで捕れ',W/2,42);
      const bw=280,x=W/2-bw/2,y=58, span=catchT+w*2.2;
      ctx.fillStyle='rgba(255,255,255,0.28)';ctx.fillRect(x,y,bw,9);
      const gx0=x+bw*clamp((catchT-w)/span,0,1), gx1=x+bw*clamp((catchT+w)/span,0,1);
      ctx.fillStyle='rgba(90,240,130,0.55)';ctx.fillRect(gx0,y,gx1-gx0,9);
      if(!hidden){ const px=x+bw*clamp(clock/span,0,1); ctx.fillStyle='#ffe14d';ctx.fillRect(px-2,y-3,4,15); }
      else { ctx.fillStyle='rgba(255,240,180,0.9)';ctx.font='bold 12px sans-serif';ctx.fillText('☀ 見失い中…',W/2,y+26); }
      ctx.fillStyle='rgba(30,50,70,0.7)';ctx.font='12px sans-serif';ctx.fillText('タップ / SPACE ＝ 捕球（早いと後逸・遅いと落球）',W/2,H-28);
    }
  }

  for(const q of parts){ctx.globalAlpha=Math.max(0,q.life);ctx.fillStyle=q.c;ctx.beginPath();ctx.arc(q.x,q.y,3.2,0,6.28);ctx.fill();}
  ctx.globalAlpha=1;
  for(const q of pops){ctx.globalAlpha=Math.max(0,q.life);ctx.fillStyle=q.c;ctx.font='bold 21px sans-serif';ctx.textAlign='center';ctx.fillText(q.txt,q.x,q.y);}
  ctx.globalAlpha=1;

  // HUD
  ctx.textAlign='left';ctx.fillStyle='#fff';ctx.font='bold 26px sans-serif';ctx.fillText('SCORE '+score,20,36);
  ctx.textAlign='right';ctx.fillStyle='rgba(255,255,255,0.95)';ctx.font='14px sans-serif';ctx.fillText('捕球 '+outs+'  Lv'+lvl,W-20,24);
  ctx.fillText('落球',W-92,46);
  for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(W-60+i*20,41,7,0,6.28);ctx.fillStyle=i<fails?'#ff5b5b':'rgba(255,255,255,0.3)';ctx.fill();}
  if(combo>=2){ctx.textAlign='center';ctx.fillStyle='#ffd24d';ctx.font='bold 18px sans-serif';ctx.fillText('コンボ x'+combo,W/2,112);}

  if(state==='play'&&phase==='result'&&msg){ctx.textAlign='center';ctx.fillStyle=msgOk?'#9ff0b8':'#ffb38a';ctx.font='bold 16px sans-serif';ctx.fillText(msg,W/2,516);}

  if(state==='title'){
    ctx.fillStyle='rgba(4,8,4,0.82)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='bold 42px sans-serif';ctx.fillText('サン・キャッチ',W/2,84);
    ctx.fillStyle='#ffd23e';ctx.font='bold 22px sans-serif';ctx.fillText('Lose It in the Sun',W/2,120);
    ctx.fillStyle='rgba(255,255,255,0.92)';ctx.font='16px sans-serif';
    ctx.fillText('晴天のデーゲーム。舞い上がったフライが“太陽に消える”——見えない間の落下を勘で読んで捕れ',W/2,180);
    ctx.fillStyle='rgba(255,255,255,0.66)';ctx.font='14px sans-serif';
    ctx.fillText('打球が上がる→落ちてくる、グラブに収まる“ちょうど”の緑窓でタップ/SPACE＝キャッチ',W/2,218);
    ctx.fillText('落下の途中でボールは陽射しに消える（タイマーの印も消える）ので、出てくる位置とタイミングを予測',W/2,242);
    ctx.fillText('早い＝見えず頭上を越えて後逸／遅い＝出てきた時には落下で落球／見失いも落球。窓ど真ん中で大量加点',W/2,266);
    ctx.fillText('上級ほど滞空が短く窓が狭い。3落球で交代',W/2,290);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で開始',W/2,358);
    ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='14px sans-serif';ctx.fillText('BEST '+best,W/2,390);
  }
  if(state==='over'){
    ctx.fillStyle='rgba(4,8,4,0.85)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#ff6b6b';ctx.font='bold 46px sans-serif';ctx.fillText('3落球…交代',W/2,222);
    ctx.fillStyle='#fff';ctx.font='bold 40px sans-serif';ctx.fillText('SCORE '+score,W/2,290);
    ctx.fillStyle='rgba(255,255,255,0.85)';ctx.font='19px sans-serif';ctx.fillText('捕球 '+outs+'   BEST '+best,W/2,330);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で もう一度',W/2,402);
  }

  if(flash>0.02){ctx.globalAlpha=flash*0.5;ctx.fillStyle=flashCol;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}
  ctx.restore();

  ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,0.4)';ctx.font='12px sans-serif';
  ctx.fillText('サン・キャッチ：太陽に消えるフライの落下を勘で読んで捕る。早い＝後逸/遅い＝落球/見失い＝落球、3落球で交代',W/2,H-8);
}

function frame(ts){let dt=ts-last;last=ts;if(dt>60)dt=60;if(dt<0)dt=0;update(dt);render();requestAnimationFrame(frame);}
requestAnimationFrame(frame);

// ---------- test hook ----------
window.__su={
  start, catchBall,
  get state(){return state;},
  get score(){return score;},
  get outs(){return outs;},
  get fails(){return fails;},
  get info(){return {state,phase,clock,catchT,w,tough,acted,actT,result,outs,fails,lvl,
    inFair:(phase==='fly'&&Math.abs(clock-catchT)<=w)};}
};
})();
</script>
</body>
</html>
