<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ラインクリア (Off the Line)</title>
<style>
  html,body{margin:0;height:100%;background:#0a1a10;overflow:hidden;
    font-family:-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  #stage{position:relative;width:100vw;height:100vh;max-width:calc(100vh*1.5);max-height:calc(100vw/1.5);aspect-ratio:900/600;}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;border-radius:6px;}
</style>
</head>
<body>
<div id="wrap"><div id="stage"><canvas id="cv"></canvas></div></div>
<script>
(function(){
const W=900,H=600,cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let DPR=1;
function fit(){DPR=Math.min(2,window.devicePixelRatio||1);cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
fit();addEventListener('resize',fit);

// ---------- audio ----------
let AC=null;function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function tone(f,d,type,v,sweep){const a=ac();if(!a)return;const t=a.currentTime,o=a.createOscillator(),g=a.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(sweep)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+sweep),t+d);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v||0.2,t+0.008);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+0.02);}
function noise(d,v,hp){const a=ac();if(!a)return;const t=a.currentTime,n=Math.floor(a.sampleRate*d),buf=a.createBuffer(1,n,a.sampleRate),ch=buf.getChannelData(0);
  for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource();s.buffer=buf;
  const f=a.createBiquadFilter();f.type='highpass';f.frequency.value=hp||600;const g=a.createGain();g.gain.value=v||0.2;
  s.connect(f);f.connect(g);g.connect(a.destination);s.start(t);s.stop(t+d+0.02);}
const S={
  clear:()=>{noise(0.14,0.3,500);tone(300,0.14,'square',0.16,240);setTimeout(()=>tone(680,0.12,'triangle',0.14),60);},
  great:()=>{noise(0.1,0.24,700);[700,980,1320,1760].forEach((f,i)=>setTimeout(()=>tone(f,0.13,'triangle',0.2),i*70));},
  whiff:()=>{noise(0.16,0.16,300);tone(220,0.18,'sawtooth',0.12,-90);},
  goal:()=>{tone(200,0.34,'sawtooth',0.2,-110);setTimeout(()=>tone(150,0.36,'sawtooth',0.18,-70),130);noise(0.4,0.12,200);},
  over:()=>{[440,330,247,175].forEach((f,i)=>setTimeout(()=>tone(f,0.3,'triangle',0.2),i*160));},
  swoosh:()=>{noise(0.09,0.1,800);}
};

// ---------- geometry ----------
const LINE=158;             // goal line y
const MX0=312, MX1=588;     // goal mouth x range
const DEF_Y=196;            // defender stands just in front of line
const CLEAR_Y0=224, CLEAR_Y1=172; // clearance band (ball must be here to clear)
const REACH=46;             // defender lateral reach
const DEF_MINX=MX0-24, DEF_MAXX=MX1+24;

// ---------- state ----------
let state='title', phase='ready', t=0, plays=0;
let score=0, combo=0, best=+(localStorage.getItem('offline_best')||0);
let clears=0, conceded=0, lvl=1;
let def={x:450,tx:450};
let ball=null, gk=null, atk=null, result=null, resultT=0, msg='', msg2='';
let shake=0, flash=0, flashCol='#fff', last=performance.now();
let parts=[], pops=[], trail=[];

function rnd(a,b){return a+Math.random()*(b-a);}
function chance(p){return Math.random()<p;}
function clamp(v,a,b){return v<a?a:v>b?b:v;}

function reset(){state='title';score=0;combo=0;clears=0;conceded=0;lvl=1;plays=0;ball=null;result=null;parts=[];pops=[];trail=[];def={x:450,tx:450};}

function newPlay(){
  plays++;
  lvl=Math.min(6,1+Math.floor(plays/3));
  const side=chance(0.5)?-1:1;
  const tx=clamp(450+side*rnd(20,140),MX0+18,MX1-18); // target point in mouth
  const x0=clamp(450 - side*rnd(0,120)+rnd(-40,40),120,780);
  const y0=rnd(452,486);
  const dur=Math.max(760,1180-lvl*74);               // travel time to line (ms) — faster w/ level
  const vy=(LINE-y0)/dur;                             // px per ms (negative, upward)
  const curl=(chance(0.6)? (chance(0.5)?-1:1):0)*rnd(0.06,0.10+lvl*0.02); // lateral curl accel feel
  ball={x:x0,y:y0,x0:x0,y0:y0,tx:tx,vy:vy,dur:dur, t:0, curlDir:curl, done:false};
  gk={x: clamp(tx + (chance(0.5)?-1:1)*rnd(120,200),40,860), y:LINE+6, beaten:true};
  atk={x:x0+rnd(-20,20), y:y0+30};
  phase='incoming'; t=0; result=null; trail=[];
  def.tx=def.x;
  msg='クリアしろ！'; msg2='';
}

function start(){ if(!ac())ac(); if(AC&&AC.state==='suspended')AC.resume(); reset(); state='play'; newPlay(); }

// ---------- clearance ----------
function tryClear(){
  if(!ball||ball.done||phase!=='incoming')return;
  const inBand = ball.y<=CLEAR_Y0 && ball.y>=CLEAR_Y1;
  const dx=Math.abs(def.x-ball.x);
  ball.done=true;
  if(inBand && dx<=REACH){
    const centered = Math.abs(ball.x - (MX0+MX1)/2) ; // not used for great; timing based
    const great = dx<18 && Math.abs(ball.y-(CLEAR_Y0+CLEAR_Y1)/2)<14;
    applyResult(great?'great':'clear');
  } else if(inBand && dx<=REACH+34){
    // just out of reach -> deflected but ball continues -> conceded
    ball.done=false; ball.deflect=true; applyPending('reach');
  } else if(ball.y>CLEAR_Y0){
    // too early: swung before ball arrived
    ball.done=false; ball.whiffed=true; S.whiff(); phase='whiffed';
  } else {
    // wrong position while in band, or too late
    ball.done=false; ball.whiffed=true; S.whiff(); phase='whiffed';
  }
}
let pendingReach=false;
function applyPending(k){ S.whiff(); phase='whiffed'; }

function applyResult(kind){
  result=kind; resultT=0; phase='resolve';
  if(kind==='clear'||kind==='great'){
    const base=kind==='great'?230:130;
    combo++; const mult=1+Math.min(5,combo-1)*0.25;
    const add=Math.round(base*mult);
    score+=add; clears++;
    S[kind==='great'?'great':'clear']();
    flash=1;flashCol=kind==='great'?'#8ff0b8':'#bfe8ff'; shake=kind==='great'?15:9;
    burst(ball.x,ball.y,kind==='great'?'#8ff0b8':'#cfe8ff',kind==='great'?36:22,8);
    pop(ball.x,ball.y-30,(kind==='great'?'ドンピシャ・クリア！ ':'クリア！ ')+'+'+add,'#eaffef');
    if(combo>=2)pop(ball.x,ball.y-56,'コンボ x'+combo,'#ffe08a');
    // hoof the ball away downfield
    ball.clearVX=rnd(-3,3); ball.clearVY=7; ball.cleared=true;
    msg=kind==='great'?'完璧なクリア！ ライン上で掻き出した':'ナイスクリア！ ライン割らせず'; msg2='';
  } else {
    combo=0; conceded++;
    S.goal();
    flash=1;flashCol='#ff5b5b'; shake=13;
    burst(ball.x,LINE,'#ff8a8a',22,6);
    msg='失点… ゴールに吸い込まれた'; msg2= kind==='reach'?'届かなかった — 早く軌道の前へ':'クリアできず';
    pop((MX0+MX1)/2,LINE-16,'GOAL','#ffb3b3');
  }
}

// ---------- input ----------
function press(){
  if(state==='title'){start();return;}
  if(state==='over'){ if(resultT>0.5){reset();start();} return; }
  if(state!=='play')return;
  tryClear();
}
function moveTo(x){
  def.tx=clamp(x,DEF_MINX,DEF_MAXX);
}
function pointer(e,down){
  const r=cv.getBoundingClientRect();
  const x=( (e.clientX-r.left)/r.width )*W;
  moveTo(x);
}
cv.addEventListener('pointerdown',e=>{e.preventDefault(); if(state==='title'||state==='over'){press();return;} pointer(e,true); pointerActive=true;});
cv.addEventListener('pointermove',e=>{e.preventDefault(); if(pointerActive)pointer(e,false);});
addEventListener('pointerup',e=>{pointerActive=false;});
let pointerActive=false;
addEventListener('keydown',e=>{
  if(e.code==='ArrowLeft'){e.preventDefault();moveTo(def.tx-46);}
  else if(e.code==='ArrowRight'){e.preventDefault();moveTo(def.tx+46);}
  else if(e.code==='Space'||e.code==='Enter'||e.code==='ArrowUp'){e.preventDefault();press();}
});

// ---------- particles ----------
function burst(x,y,c,n,sp){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=rnd(sp*0.3,sp);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:1,c});}}
function pop(x,y,txt,c){pops.push({x,y,txt,c,life:1});}

// ---------- update ----------
function update(dt){
  shake*=Math.pow(0.86,dt/16.7); if(shake<0.3)shake=0;
  flash*=Math.pow(0.9,dt/16.7);
  for(const p of parts){p.vx*=0.96;p.vy=p.vy*0.96+0.3;p.x+=p.vx*dt/16.7;p.y+=p.vy*dt/16.7;p.life-=dt/16.7*0.028;}
  parts=parts.filter(p=>p.life>0);
  for(const p of pops){p.y-=dt/16.7*0.6;p.life-=dt/16.7*0.02;}
  pops=pops.filter(p=>p.life>0);

  // ease defender
  def.x+=(def.tx-def.x)*Math.min(1,dt/16.7*0.34);

  if(state!=='play'){ if(state==='over')resultT+=dt/1000; return; }
  t+=dt;

  if(phase==='incoming'){
    ball.t+=dt;
    ball.y += ball.vy*dt;
    // lateral movement toward target + curl
    const prog=clamp(ball.t/ball.dur,0,1);
    const baseX = ball.x0 + (ball.tx-ball.x0)*prog;
    const curlOff = ball.curlDir*Math.sin(prog*Math.PI)*90;
    ball.x = baseX + curlOff;
    trail.push({x:ball.x,y:ball.y}); if(trail.length>14)trail.shift();
    if(ball.y<=LINE){
      // reached line without a clear
      const inMouth = ball.x>=MX0 && ball.x<=MX1;
      ball.done=true;
      if(inMouth) applyResult('goal'); else { // wide (rare due to targeting) -> treat as cleared danger, small
        result='wide'; phase='resolve'; resultT=0; msg='枠外へ逸れた'; msg2=''; }
    }
    return;
  }

  if(phase==='whiffed'){
    // ball continues past defender to the line
    ball.t+=dt; ball.y+=ball.vy*dt;
    const prog=clamp(ball.t/ball.dur,0,1);
    const baseX=ball.x0+(ball.tx-ball.x0)*prog; const curlOff=ball.curlDir*Math.sin(prog*Math.PI)*90;
    ball.x=baseX+curlOff;
    if(ball.y<=LINE){ const inMouth=ball.x>=MX0&&ball.x<=MX1; if(inMouth)applyResult('goal'); else {result='wide';phase='resolve';resultT=0;msg='枠外へ逸れた';msg2='';} }
    return;
  }

  if(phase==='resolve'){
    resultT+=dt/1000;
    if(ball&&ball.cleared){ ball.x+=ball.clearVX*dt/16.7; ball.y+=ball.clearVY*dt/16.7; }
    if(resultT>1.0){
      if(conceded>=3){ state='over'; resultT=0; S.over(); if(score>best){best=score;localStorage.setItem('offline_best',best);} }
      else newPlay();
    }
    return;
  }
}

// ---------- render ----------
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

function drawField(){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#123b26');g.addColorStop(1,'#1c6b3f');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='rgba(255,255,255,0.04)';
  for(let i=0;i<6;i++){ if(i%2) ctx.fillRect(0,LINE+i*80,W,80); }
  // goal net area behind line
  ctx.fillStyle='rgba(255,255,255,0.06)';ctx.fillRect(MX0,40,MX1-MX0,LINE-40);
  // net lines
  ctx.strokeStyle='rgba(255,255,255,0.18)';ctx.lineWidth=1;
  for(let x=MX0;x<=MX1;x+=18){ctx.beginPath();ctx.moveTo(x,44);ctx.lineTo(x,LINE);ctx.stroke();}
  for(let y=48;y<LINE;y+=16){ctx.beginPath();ctx.moveTo(MX0,y);ctx.lineTo(MX1,y);ctx.stroke();}
  // goal frame
  ctx.strokeStyle='#f4f4f4';ctx.lineWidth=7;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(MX0,LINE);ctx.lineTo(MX0,44);ctx.lineTo(MX1,44);ctx.lineTo(MX1,LINE);ctx.stroke();
  // goal line
  ctx.strokeStyle='rgba(255,255,255,0.85)';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(60,LINE);ctx.lineTo(840,LINE);ctx.stroke();
  // six-yard-ish box
  ctx.strokeStyle='rgba(255,255,255,0.28)';ctx.lineWidth=2;
  ctx.strokeRect(MX0-70,LINE,(MX1-MX0)+140,150);
}

function drawGK(){
  if(!gk)return;
  ctx.save();ctx.translate(gk.x,gk.y);
  // beaten keeper: on the ground, sprawled
  ctx.fillStyle='rgba(0,0,0,0.22)';ctx.beginPath();ctx.ellipse(0,10,20,6,0,0,6.28);ctx.fill();
  ctx.fillStyle='#f2d03a';ctx.save();ctx.rotate(1.35);rr(-8,-6,26,14,6);ctx.fill();ctx.restore();
  ctx.fillStyle='#f2c9a0';ctx.beginPath();ctx.arc(14,6,7,0,6.28);ctx.fill();
  ctx.restore();
}

function drawDefender(){
  const x=def.x,y=DEF_Y;
  const canClear = ball && phase==='incoming' && ball.y<=CLEAR_Y0 && ball.y>=CLEAR_Y1;
  // reach indicator
  ctx.strokeStyle=canClear?'rgba(143,240,184,0.9)':'rgba(255,255,255,0.22)';
  ctx.lineWidth=canClear?4:2;
  ctx.beginPath();ctx.moveTo(x-REACH,y+18);ctx.lineTo(x+REACH,y+18);ctx.stroke();
  // shadow
  ctx.fillStyle='rgba(0,0,0,0.28)';ctx.beginPath();ctx.ellipse(x,y+20,15,5,0,0,6.28);ctx.fill();
  // body (blue defender)
  ctx.fillStyle='#2b6cff'; rr(x-9,y-8,18,24,6);ctx.fill();
  ctx.fillStyle='#f2c9a0';ctx.beginPath();ctx.arc(x,y-16,8,0,6.28);ctx.fill();
  ctx.fillStyle='#1a3a8a';ctx.beginPath();ctx.arc(x,y-18,8.5,Math.PI,0);ctx.fill();
  // legs
  ctx.strokeStyle='#2b6cff';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(x-4,15);ctx.moveTo(x-4,y+15);ctx.lineTo(x-8,y+24);ctx.moveTo(x+4,y+15);ctx.lineTo(x+9,y+23);ctx.stroke();
}

function drawBall(){
  if(!ball)return;
  // trail
  for(let i=0;i<trail.length;i++){const a=i/trail.length; ctx.globalAlpha=a*0.4;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(trail[i].x,trail[i].y,3+a*3,0,6.28);ctx.fill();}
  ctx.globalAlpha=1;
  const r=8;
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(ball.x,ball.y,r,0,6.28);ctx.fill();
  ctx.strokeStyle='#2a2a2a';ctx.lineWidth=1.4;
  ctx.beginPath();ctx.arc(ball.x,ball.y,r,0,6.28);ctx.stroke();
  ctx.fillStyle='#222';ctx.beginPath();ctx.arc(ball.x-2,ball.y-2,2.4,0,6.28);ctx.fill();
}

function drawHUD(){
  ctx.textAlign='left';ctx.fillStyle='#fff';ctx.font='bold 26px sans-serif';
  ctx.fillText('SCORE '+score,20,36);
  ctx.textAlign='right';ctx.fillStyle='rgba(255,255,255,0.85)';ctx.font='14px sans-serif';
  ctx.fillText('クリア '+clears+'  Lv.'+lvl,W-20,26);
  ctx.fillText('失点',W-92,50);
  for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(W-66+i*22,46,7,0,6.28);ctx.fillStyle=i<conceded?'#ff5b5b':'rgba(255,255,255,0.25)';ctx.fill();}
  if(combo>=2){ctx.textAlign='left';ctx.fillStyle='#ffe08a';ctx.font='bold 18px sans-serif';ctx.fillText('コンボ x'+combo,20,60);}
}

function render(){
  ctx.save();
  if(shake>0)ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
  drawField();
  drawGK();
  drawBall();
  drawDefender();

  for(const p of parts){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,3.2,0,6.28);ctx.fill();}
  ctx.globalAlpha=1;
  for(const p of pops){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.font='bold 22px sans-serif';ctx.textAlign='center';ctx.fillText(p.txt,p.x,p.y);}
  ctx.globalAlpha=1;

  drawHUD();

  if(state==='play'&&(msg||msg2)){
    ctx.textAlign='center';
    ctx.fillStyle=result?((result==='clear'||result==='great'||result==='wide')?'#8ff0b8':'#ff9a9a'):'rgba(255,255,255,0.92)';
    ctx.font='bold 30px sans-serif';ctx.fillText(msg,W/2,H-92);
    if(msg2){ctx.fillStyle='rgba(255,255,255,0.75)';ctx.font='17px sans-serif';ctx.fillText(msg2,W/2,H-62);}
  }

  if(state==='title'){
    ctx.fillStyle='rgba(6,16,10,0.62)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='bold 50px sans-serif';ctx.fillText('ラインクリア',W/2,244);
    ctx.fillStyle='#8ff0b8';ctx.font='bold 23px sans-serif';ctx.fillText('Off the Line',W/2,280);
    ctx.fillStyle='rgba(255,255,255,0.9)';ctx.font='18px sans-serif';
    ctx.fillText('GKは破られた！ カバーのDFを左右に動かし（ドラッグ / ← →）',W/2,336);
    ctx.fillText('迫るボールの軌道の前に入り、ライン上でクリア（クリック/タップ/SPACE）',W/2,364);
    ctx.fillStyle='rgba(255,255,255,0.66)';ctx.font='15px sans-serif';
    ctx.fillText('早撃ちは空振り／軌道を外すと届かず／間に合わなければ失点。カーブに注意',W/2,404);
    ctx.fillStyle='#ffe08a';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で開始',W/2,462);
    ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='14px sans-serif';ctx.fillText('BEST '+best,W/2,494);
  }
  if(state==='over'){
    ctx.fillStyle='rgba(6,16,10,0.72)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#ff6b6b';ctx.font='bold 46px sans-serif';ctx.fillText('3失点…試合終了',W/2,232);
    ctx.fillStyle='#fff';ctx.font='bold 40px sans-serif';ctx.fillText('SCORE '+score,W/2,298);
    ctx.fillStyle='rgba(255,255,255,0.85)';ctx.font='20px sans-serif';ctx.fillText('クリア '+clears+'   BEST '+best,W/2,338);
    ctx.fillStyle='#8ff0b8';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で もう一度',W/2,410);
  }

  if(flash>0.02){ctx.globalAlpha=flash*0.5;ctx.fillStyle=flashCol;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}
  ctx.restore();

  ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,0.4)';ctx.font='13px sans-serif';
  ctx.fillText('DFをボールの軌道の前へ入れ、ライン手前の帯（緑）でクリア。カーブを読む。3失点で終了',W/2,H-12);
}

function frame(ts){let dt=ts-last;last=ts;if(dt>60)dt=60;if(dt<0)dt=0;update(dt);render();requestAnimationFrame(frame);}
requestAnimationFrame(frame);

// ---------- test hook ----------
window.__ol={
  start, press, moveTo,
  get state(){return state;},
  get score(){return score;},
  get clears(){return clears;},
  get conceded(){return conceded;},
  get info(){return {state,phase,t,
    ballX:ball?ball.x:0, ballY:ball?ball.y:0, defX:def.x,
    inBand: !!(ball&&phase==='incoming'&&ball.y<=CLEAR_Y0&&ball.y>=CLEAR_Y1),
    bandY0:CLEAR_Y0,bandY1:CLEAR_Y1,reach:REACH,line:LINE,defY:DEF_Y,
    result,clears,conceded,lvl};}
};
})();
</script>
</body>
</html>
