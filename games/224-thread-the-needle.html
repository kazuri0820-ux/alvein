<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>針の穴を通せ (Thread the Needle)</title>
<style>
  html,body{margin:0;height:100%;background:#08130c;overflow:hidden;
    font-family:-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  #stage{position:relative;width:100vw;height:100vh;max-width:calc(100vh*1.5);max-height:calc(100vw/1.5);aspect-ratio:900/600;}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;border-radius:6px;}
</style>
</head>
<body>
<div id="wrap"><div id="stage"><canvas id="cv"></canvas></div></div>
<script>
(function(){
const W=900,H=600,cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let DPR=1;
function fit(){DPR=Math.min(2,window.devicePixelRatio||1);cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
fit();addEventListener('resize',fit);

// ---------- audio ----------
let AC=null;function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function tone(f,d,type,v,sweep){const a=ac();if(!a)return;const t=a.currentTime,o=a.createOscillator(),g=a.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(sweep)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+sweep),t+d);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v||0.2,t+0.008);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+0.02);}
function noise(d,v,hp){const a=ac();if(!a)return;const t=a.currentTime,n=Math.floor(a.sampleRate*d),buf=a.createBuffer(1,n,a.sampleRate),ch=buf.getChannelData(0);
  for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource();s.buffer=buf;
  const f=a.createBiquadFilter();f.type='highpass';f.frequency.value=hp||600;const g=a.createGain();g.gain.value=v||0.2;
  s.connect(f);f.connect(g);g.connect(a.destination);s.start(t);s.stop(t+d+0.02);}
const S={
  lock:()=>{tone(660,0.06,'square',0.08);},
  kick:()=>{noise(0.03,0.1,800);tone(300,0.07,'triangle',0.1,-60);},
  complete:()=>{[660,880,1046,1320].forEach((f,i)=>setTimeout(()=>tone(f,0.12,'triangle',0.18),i*80));},
  fail:()=>{noise(0.13,0.2,380);tone(200,0.14,'sawtooth',0.12,-60);},
  streak:()=>{[660,880,1100,1320].forEach((f,i)=>setTimeout(()=>tone(f,0.1,'triangle',0.16),i*60));},
  over:()=>{[440,330,247,175].forEach((f,i)=>setTimeout(()=>tone(f,0.3,'triangle',0.2),i*160));}
};

// ---------- geometry ----------
const PX=450, PY=522, AMAX=0.72;

// ---------- state ----------
let state='title', phase='aim', t=0, plays=0;
let score=0, combo=0, best=+(localStorage.getItem('thread_best')||0);
let goals=0, fails=0, lvl=1;
let T={x:450,y:200}, angT=0, distT=300;
let sweep=0, sweepDir=1, sweepPeriod=1600, angTol=0.09;
let pv=0, pvPeriod=1200, powTol=32, PMAX=470;
let def={x:300,y:360,dir:1,spd:0.16};
let lockAngle=0, dirOK=false, clearOK=false, aligned=false, lockPow=0;
let clock=0, aimDeadline=3200, powDeadline=2600;
let ball=null, result=null, resultT=0, msg='';
let shake=0, flash=0, flashCol='#fff', last=performance.now();
let parts=[], pops=[];

function rnd(a,b){return a+Math.random()*(b-a);}
function chance(p){return Math.random()<p;}
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function lerp(a,b,u){return a+(b-a)*u;}
function easeOut(u){return 1-Math.pow(1-u,2);}
function ptFromAng(a,d){return {x:PX+Math.sin(a)*d, y:PY-Math.cos(a)*d};}
function segDist(px,py,ax,ay,bx,by){const dx=bx-ax,dy=by-ay;const l2=dx*dx+dy*dy||1;let tt=((px-ax)*dx+(py-ay)*dy)/l2;tt=clamp(tt,0,1);const cx=ax+tt*dx,cy=ay+tt*dy;return Math.hypot(px-cx,py-cy);}

function params(){ return { sweepP:Math.max(1050,1650-lvl*80), pvP:Math.max(820,1250-lvl*70), angTol:Math.max(0.06,0.11-lvl*0.006), powTol:Math.max(20,34-lvl*2.4), defSpd:0.12+lvl*0.02 }; }

function reset(){state='title';score=0;combo=0;goals=0;fails=0;lvl=1;plays=0;result=null;parts=[];pops=[];}
function newFeed(){
  plays++; lvl=Math.min(7,1+Math.floor(goals/4));
  const p=params(); sweepPeriod=p.sweepP; pvPeriod=p.pvP; angTol=p.angTol; powTol=p.powTol; def.spd=p.defSpd;
  const ty=rnd(150,250); const maxdx=Math.tan(0.55)*(PY-ty); const tx=PX+rnd(-maxdx,maxdx);
  T={x:tx,y:ty}; angT=Math.atan2(T.x-PX, PY-T.y); distT=Math.hypot(T.x-PX,PY-T.y);
  def={x:rnd(200,700), y:ty+(PY-ty)*rnd(0.42,0.58), dir:chance(0.5)?1:-1, spd:p.defSpd};
  sweep=-AMAX; sweepDir=1; pv=0;
  lockAngle=0; dirOK=false; clearOK=false; aligned=false; lockPow=0;
  clock=0; ball=null; result=null; phase='aim'; msg='';
  resultT=0;
}
function start(){ if(!ac())ac(); if(AC&&AC.state==='suspended')AC.resume(); reset(); state='play'; newFeed(); }

function laneClearNow(){ const e=ptFromAng(angT,distT); return segDist(def.x,def.y,PX,PY,e.x,e.y) > 30; }

function lock(){
  if(state==='title'){start();return;}
  if(state==='over'){ if(resultT>0.4){reset();start();} return; }
  if(state!=='play') return;
  if(phase==='aim'){
    lockAngle=sweep; aligned=Math.abs(sweep-angT)<angTol; clearOK=laneClearNow(); dirOK=aligned&&clearOK;
    S.lock(); phase='power'; clock=0; pv=0;
  } else if(phase==='power'){
    lockPow=pv; S.kick();
    const powOK=Math.abs(pv-distT)<powTol;
    // launch ball along locked angle for locked distance
    const land=ptFromAng(lockAngle, pv);
    ball={x:PX,y:PY,ex:land.x,ey:land.y,p:0};
    if(dirOK && powOK) resolve('complete');
    else if(!aligned) resolve('miss');
    else if(!clearOK) resolve('intercept');
    else resolve(pv<distT?'short':'long');
  }
}

function resolve(kind){
  phase='result'; result=kind; resultT=0;
  if(kind==='complete'){
    goals++; combo++; const tight=Math.abs(lockPow-distT)<powTol*0.5 && Math.abs(lockAngle-angT)<angTol*0.5;
    const add=Math.round((tight?170:110)*(1+Math.min(9,combo-1)*0.16)); score+=add;
    S.complete(); flash=1;flashCol='#ffe08a';shake=6; burst(T.x,T.y,'#ffe08a',18,6);
    pop(T.x,T.y-30,'ナイスフィード！ +'+add,'#fff3c4');
    if(tight)pop(T.x,T.y-56,'針の穴を通した！','#ffe08a');
    if(combo>=2)pop(T.x,T.y+6,'コンボ x'+combo,'#ffd24d');
    if(combo>0&&combo%5===0)S.streak();
    msg='味方にピタリ！ カウンター始動';
  } else {
    fails++; combo=0; flash=1;flashCol='#ff5b5b';shake=8; S.fail();
    if(kind==='miss') msg='方向がズレた！ 味方に通らず';
    else if(kind==='intercept') msg='コースを塞がれた！ カットされた';
    else if(kind==='short') msg='弱い！ 手前で相手に拾われた';
    else if(kind==='long') msg='強すぎ！ 味方を越えてライン割れ';
    else msg='遅い！ 出しどころを逃した';
    pop((ball?ball.ex:PX),(ball?ball.ey:PY)-20,'ロスト','#ffb0b0');
  }
  if(fails>=3){ state='over'; resultT=0; S.over(); if(score>best){best=score;localStorage.setItem('thread_best',best);} }
}

// ---------- input ----------
cv.addEventListener('pointerdown',e=>{e.preventDefault();lock();});
addEventListener('keydown',e=>{ if(e.code==='Space'||e.code==='Enter'||e.code==='ArrowUp'){e.preventDefault();lock();} });

// ---------- particles ----------
function burst(x,y,c,n,sp){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=rnd(sp*0.3,sp);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:1,c});}}
function pop(x,y,txt,c){pops.push({x,y,txt,c,life:1});}

// ---------- update ----------
function update(dt){
  shake*=Math.pow(0.86,dt/16.7); if(shake<0.3)shake=0;
  flash*=Math.pow(0.9,dt/16.7);
  for(const p of parts){p.vx*=0.96;p.vy=p.vy*0.96+0.28;p.x+=p.vx*dt/16.7;p.y+=p.vy*dt/16.7;p.life-=dt/16.7*0.026;}
  parts=parts.filter(p=>p.life>0);
  for(const p of pops){p.y-=dt/16.7*0.5;p.life-=dt/16.7*0.02;}
  pops=pops.filter(p=>p.life>0);

  if(state!=='play'){ if(state==='over')resultT+=dt/1000; return; }
  t+=dt;
  // defender patrols (both phases so the read stays live)
  if(phase==='aim'||phase==='power'){
    def.x += def.dir*def.spd*dt; if(def.x<170){def.x=170;def.dir=1;} if(def.x>730){def.x=730;def.dir=-1;}
  }
  if(phase==='aim'){
    clock+=dt;
    sweep += sweepDir*(2*AMAX)/sweepPeriod*dt;
    if(sweep>AMAX){sweep=AMAX;sweepDir=-1;} if(sweep<-AMAX){sweep=-AMAX;sweepDir=1;}
    if(clock>aimDeadline){ lockAngle=sweep;aligned=false;dirOK=false; ball=ptFromAng(sweep,distT); ball={x:PX,y:PY,ex:ball.x,ey:ball.y,p:0}; resolve('slow-aim'); }
    return;
  }
  if(phase==='power'){
    clock+=dt;
    pv += (PMAX)/pvPeriod*dt; if(pv>PMAX)pv=0;   // loops
    if(clock>powDeadline){ lockPow=pv; const land=ptFromAng(lockAngle,pv); ball={x:PX,y:PY,ex:land.x,ey:land.y,p:0}; resolve('slow-aim'); }
    return;
  }
  if(phase==='result'){
    resultT+=dt/1000;
    if(ball){ ball.p=Math.min(1,ball.p+dt/460); ball.x=lerp(PX,ball.ex,easeOut(ball.p)); ball.y=lerp(PY,ball.ey,easeOut(ball.p)); }
    if(resultT>1.2 && state==='play') newFeed();
    return;
  }
}

// ---------- render ----------
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function drawScene(){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#237236');g.addColorStop(1,'#18531f');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  for(let i=0;i<10;i++){ctx.fillStyle=i%2?'rgba(255,255,255,0.04)':'rgba(0,0,0,0.045)';ctx.fillRect(0,i*60,W,30);}
}
function drawFig(x,y,col){
  ctx.fillStyle='rgba(0,0,0,0.22)';ctx.beginPath();ctx.ellipse(x,y+14,13,5,0,0,6.28);ctx.fill();
  ctx.fillStyle=col;rr(x-10,y-12,20,28,7);ctx.fill();
  ctx.fillStyle='#f2c9a0';ctx.beginPath();ctx.arc(x,y-18,8,0,6.28);ctx.fill();
}

function render(){
  ctx.save();
  if(shake>0)ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
  drawScene();

  if(state==='play'){
    // target teammate marker
    ctx.strokeStyle='rgba(140,240,170,0.8)';ctx.lineWidth=2;ctx.setLineDash([5,5]);ctx.beginPath();ctx.arc(T.x,T.y,26,0,6.28);ctx.stroke();ctx.setLineDash([]);
    drawFig(T.x,T.y,'#2b6cff');
    // defender
    drawFig(def.x,def.y,'#e23c3c');
    // passer
    drawFig(PX,PY,'#2b6cff');

    // aim sweep line
    if(phase==='aim'){
      const e=ptFromAng(sweep, 470);
      const okNow=Math.abs(sweep-angT)<angTol && laneClearNow();
      ctx.strokeStyle=okNow?'rgba(150,240,170,0.95)':'rgba(255,255,255,0.5)';ctx.lineWidth=okNow?4:2;
      ctx.setLineDash([10,8]);ctx.beginPath();ctx.moveTo(PX,PY);ctx.lineTo(e.x,e.y);ctx.stroke();ctx.setLineDash([]);
    }
    // locked direction (during power) + power bar
    if(phase==='power'){
      const e=ptFromAng(lockAngle, Math.max(pv,40));
      ctx.strokeStyle=dirOK?'rgba(150,240,170,0.6)':'rgba(255,140,140,0.6)';ctx.lineWidth=3;ctx.setLineDash([8,8]);
      ctx.beginPath();ctx.moveTo(PX,PY);ctx.lineTo(e.x,e.y);ctx.stroke();ctx.setLineDash([]);
      // leading ball dot at current power
      const cp=ptFromAng(lockAngle,pv); ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(cp.x,cp.y,6,0,6.28);ctx.fill();
      // power gauge
      const mw=300,mx=PX-mw/2,my=H-40;
      ctx.fillStyle='rgba(0,0,0,0.35)';rr(mx-3,my-3,mw+6,16,8);ctx.fill();
      const gx=mx+mw*clamp((distT-powTol)/PMAX,0,1), gw=mw*(2*powTol/PMAX);
      ctx.fillStyle='rgba(150,240,170,0.5)';rr(gx,my,gw,10,4);ctx.fill();
      ctx.fillStyle='#7fd0ff';rr(mx,my,mw*clamp(pv/PMAX,0,1),10,5);ctx.fill();
      ctx.fillStyle='rgba(255,255,255,0.7)';ctx.font='12px sans-serif';ctx.textAlign='center';ctx.fillText('距離をロック：緑の帯で離す',PX,my-8);
    }
    // result ball
    if(phase==='result'&&ball){ ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(ball.x,ball.y,7,0,6.28);ctx.fill(); }
  }

  for(const p of parts){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,3.2,0,6.28);ctx.fill();}
  ctx.globalAlpha=1;
  for(const p of pops){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.font='bold 22px sans-serif';ctx.textAlign='center';ctx.fillText(p.txt,p.x,p.y);}
  ctx.globalAlpha=1;

  // HUD
  ctx.textAlign='left';ctx.fillStyle='#fff';ctx.font='bold 26px sans-serif';ctx.fillText('SCORE '+score,20,36);
  ctx.textAlign='right';ctx.fillStyle='rgba(255,255,255,0.9)';ctx.font='14px sans-serif';ctx.fillText('成功 '+goals+'  Lv'+lvl,W-20,24);
  ctx.fillText('失敗',W-92,46);
  for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(W-60+i*20,41,7,0,6.28);ctx.fillStyle=i<fails?'#ff5b5b':'rgba(255,255,255,0.25)';ctx.fill();}
  if(combo>=2){ctx.textAlign='center';ctx.fillStyle='#ffd24d';ctx.font='bold 18px sans-serif';ctx.fillText('コンボ x'+combo,PX,86);}

  if(state==='play'&&phase==='aim'){ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,0.9)';ctx.font='bold 15px sans-serif';
    ctx.fillText('狙いをロック：味方へ向き＆コースが空いた“今”で離す（クリック/タップ/SPACE）',PX,40);}
  if(state==='play'&&phase==='power'){ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,0.9)';ctx.font='bold 15px sans-serif';
    ctx.fillText('つぎに距離をロック：味方に届く緑の帯で離す',PX,40);}
  if(state==='play'&&phase==='result'&&msg){ctx.textAlign='center';ctx.fillStyle=result==='complete'?'#9ff0b8':'#ff9a9a';ctx.font='bold 21px sans-serif';ctx.fillText(msg,PX,40);}

  if(state==='title'){
    ctx.fillStyle='rgba(6,14,10,0.72)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='bold 44px sans-serif';ctx.fillText('針の穴を通せ',PX,128);
    ctx.fillStyle='#ffd23e';ctx.font='bold 22px sans-serif';ctx.fillText('Thread the Needle',PX,164);
    ctx.fillStyle='rgba(255,255,255,0.92)';ctx.font='16px sans-serif';
    ctx.fillText('司令塔の一本。狙いと距離を2段ロックして、味方へスルーパスを通せ',PX,214);
    ctx.fillStyle='rgba(255,255,255,0.66)';ctx.font='14px sans-serif';
    ctx.fillText('① 狙い：左右に振れる照準が“味方に向き＆コースが空いた瞬間”で離してロック（線が緑）',PX,252);
    ctx.fillText('② 距離：上下するパワーを、味方に届く“緑の帯”で離してロック',PX,274);
    ctx.fillText('方向がズレると通らず、コースを守備に塞がれるとカット、弱いと拾われ強いとライン割れ',PX,296);
    ctx.fillText('動く守備がコースを塞ぐので、空く瞬間を狙え。上級ほど照準が速く緑の帯も狭い。3失敗で交代',PX,318);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で開始',PX,398);
    ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='14px sans-serif';ctx.fillText('BEST '+best+'　　1回目=方向 / 2回目=距離',PX,430);
  }
  if(state==='over'){
    ctx.fillStyle='rgba(6,14,10,0.8)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#ff6b6b';ctx.font='bold 46px sans-serif';ctx.fillText('3失敗…交代',PX,222);
    ctx.fillStyle='#fff';ctx.font='bold 40px sans-serif';ctx.fillText('SCORE '+score,PX,290);
    ctx.fillStyle='rgba(255,255,255,0.85)';ctx.font='19px sans-serif';ctx.fillText('成功 '+goals+'   BEST '+best,PX,330);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で もう一度',PX,402);
  }

  if(flash>0.02){ctx.globalAlpha=flash*0.5;ctx.fillStyle=flashCol;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}
  ctx.restore();

  ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,0.4)';ctx.font='12px sans-serif';
  ctx.fillText('①狙い（味方へ向き＆コースが空いた瞬間）→②距離（緑の帯）を2段ロック。ズレ/被カット/弱強は失敗。3失敗で交代',PX,H-8);
}

function frame(ts){let dt=ts-last;last=ts;if(dt>60)dt=60;if(dt<0)dt=0;update(dt);render();requestAnimationFrame(frame);}
requestAnimationFrame(frame);

// ---------- test hook ----------
window.__tn={
  start, lock:()=>lock(),
  get state(){return state;},
  get score(){return score;},
  get goals(){return goals;},
  get fails(){return fails;},
  get info(){ const aimGood=(phase==='aim')&&(Math.abs(sweep-angT)<angTol)&&laneClearNow();
    const powGood=(phase==='power')&&(Math.abs(pv-distT)<powTol);
    return {state,phase,aimGood,powGood,sweep,angT,angTol,pv,distT,powTol,result,goals,fails,lvl}; }
};
})();
</script>
</body>
</html>
