<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>押し出すな (Don't Walk Him In)</title>
<style>
  html,body{margin:0;padding:0;background:#0a1016;overflow:hidden;font-family:'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif;-webkit-user-select:none;user-select:none;touch-action:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 30%,#183044,#060b12 72%);}
  #stage{position:relative;width:min(100vw,calc(100vh*1.5));aspect-ratio:900/600;max-width:900px;box-shadow:0 10px 60px rgba(0,0,0,.6);border-radius:8px;overflow:hidden;}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;}
</style>
</head>
<body>
<div id="wrap"><div id="stage"><canvas id="cv"></canvas></div></div>
<script>
(function(){
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const W=900,H=600;let DPR=Math.min(2,window.devicePixelRatio||1);
function fit(){const r=cv.getBoundingClientRect();DPR=Math.min(2,window.devicePixelRatio||1);cv.width=Math.round(r.width*DPR);cv.height=Math.round(r.height*DPR);ctx.setTransform(cv.width/W,0,0,cv.height/H,0,0);}
new ResizeObserver(fit).observe(cv);fit();

// ---------- audio ----------
let AC=null;function actx(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function tone(f,d,type,v,sweep){const a=actx();if(!a)return;const o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.value=f;if(sweep)o.frequency.linearRampToValueAtTime(sweep,a.currentTime+d);g.gain.value=0.0001;g.gain.exponentialRampToValueAtTime(v||0.2,a.currentTime+0.008);g.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+d);o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+d+0.02);}
function noise(d,v,hp){const a=actx();if(!a)return;const n=a.createBufferSource(),b=a.createBuffer(1,a.sampleRate*d,a.sampleRate),dt=b.getChannelData(0);for(let i=0;i<dt.length;i++)dt[i]=Math.random()*2-1;n.buffer=b;const f=a.createBiquadFilter();f.type='highpass';f.frequency.value=hp||800;const g=a.createGain();g.gain.value=0.0001;g.gain.exponentialRampToValueAtTime(v||0.2,a.currentTime+0.01);g.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+d);n.connect(f);f.connect(g);g.connect(a.destination);n.start();n.stop(a.currentTime+d+0.02);}
const S={
  set(){tone(300,0.1,'sine',0.08);},
  release(){noise(0.05,0.18,1200);tone(420,0.09,'sawtooth',0.13,220);},
  mitt(){tone(1500,0.06,'square',0.14);noise(0.05,0.14,2000);},
  strike(){tone(660,0.1,'triangle',0.2);setTimeout(function(){tone(880,0.16,'triangle',0.22);},90);},
  ball(){tone(300,0.3,'sawtooth',0.16,150);setTimeout(function(){tone(200,0.4,'sawtooth',0.14,110);},150);},
  combo(n){tone(620+Math.min(n,8)*70,0.12,'triangle',0.16);},
  win(){tone(520,0.12,'triangle',0.2);setTimeout(function(){tone(700,0.14,'triangle',0.22);},120);setTimeout(function(){tone(920,0.22,'triangle',0.24);},250);},
  over(){tone(330,0.3,'sine',0.2,160);setTimeout(function(){tone(220,0.5,'sine',0.2,110);},180);},
  start(){tone(440,0.1,'triangle',0.18);setTimeout(function(){tone(660,0.16,'triangle',0.2);},110);},
};

function clamp(v,a,b){return v<a?a:v>b?b:v;}
function rnd(a,b){return a+Math.random()*(b-a);}

// ---------- state ----------
let state='title';
let outs=0,fails=0,score=0,best=0,combo=0,lvl=1;   // outs = strikes thrown ; fails = walks (runs)
try{best=parseInt(localStorage.getItem('bl_best')||'0')||0;}catch(e){}
const TARGET=26;

let phase='wind';  // wind | watch | result
let pt=0, clock=0;
let arriveT=900, w=180, effW=180, deliveryEnd=1300, tough=false;
let decided=false, result='', relClock=0, quality=0;
let parts=[];
let shakeT=0,flash=0;
let msg='',msgCol='#fff',msgT=0;
let ballShown=false,ballU=0,ballEndY=435;
let runnerHome=0; // 3rd-base runner trots home on a walk

function reset(){outs=0;fails=0;score=0;combo=0;lvl=1;parts=[];}
function newPitch(){
  lvl=Math.min(7,1+Math.floor(outs/4));
  arriveT=clamp(1000-lvl*46,700,1000);
  w=clamp(200-lvl*16,100,200);
  tough=Math.random()<clamp(0.2+lvl*0.05,0.2,0.5);
  effW=tough?w*0.82:w;
  deliveryEnd=arriveT+effW+280;
  phase='wind';pt=0;clock=0;decided=false;result='';relClock=0;quality=0;
  ballShown=false;ballU=0;runnerHome=0;
}
function startGame(){reset();state='play';newPitch();S.start();}

function burst(x,y,col,n,sp){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=rnd(0.4,1)*(sp||3);parts.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:1,col:col,r:rnd(2,5)});}}

function resolve(kind){
  decided=true;result=kind;relClock=clock;ballShown=true;ballU=0;
  if(kind==='strike'){
    ballEndY=435;
    outs++;combo++;
    quality=clamp(1-Math.abs(clock-arriveT)/effW,0,1);
    const cm=1+Math.min(combo-1,6)*0.14;
    const add=Math.round((100+quality*120)*cm)*Math.max(1,lvl);
    score+=add;lastAdd=add;
    S.release();setTimeout(S.mitt,300);setTimeout(S.strike,340);
    if(combo>1)setTimeout(function(){S.combo(combo);},420);
    flash=0.28;
    msg=(quality>0.7?'ズバッと見逃し三振コース！':'ストライク！ 打ち取った')+'  +'+add;msgCol='#5affa0';msgT=1;
  }else{
    // ball -> walk in a run
    ballEndY=(result==='early')?350:520; // high or low
    combo=0;fails++;
    S.release();setTimeout(S.ball,320);flash=0.35;shakeT=0.7;
    if(result==='early')msg='抜け球！ 高めに外れて押し出し…1点';
    else if(result==='late')msg='引っかけた！ ワンバウンドで押し出し…1点';
    else msg='ボール！ 押し出し四球…1点';
    msgCol='#ff6a6a';msgT=1;
  }
  phase='result';pt=0;
}
let lastAdd=0;

function release(){
  if(state!=='play'||phase!=='watch'||decided)return;
  const c=clock;
  if(c<arriveT-effW)resolve('early');
  else resolve('strike');
}

// ---------- input ----------
function act(){if(!AC)actx();if(state==='title'){startGame();return;}if(state==='over'){startGame();return;}release();}
cv.addEventListener('mousedown',function(e){e.preventDefault();act();});
cv.addEventListener('touchstart',function(e){e.preventDefault();act();},{passive:false});
window.addEventListener('keydown',function(e){
  if(e.code==='Space'||e.code==='ArrowUp'||e.code==='Enter'||e.code==='KeyK'){e.preventDefault();act();}
});

// ---------- update ----------
let last=0;
function update(dt){
  if(flash>0)flash=Math.max(0,flash-dt/300);
  if(shakeT>0)shakeT=Math.max(0,shakeT-dt/320);
  if(msgT>0)msgT=Math.max(0,msgT-dt/1500);
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.x+=p.vx;p.y+=p.vy;p.vy+=0.16;p.life-=dt/640;if(p.life<=0)parts.splice(i,1);}
  if(state!=='play')return;
  pt+=dt;
  if(phase==='wind'){
    if(pt>=440){phase='watch';pt=0;clock=0;S.set();}
  }else if(phase==='watch'){
    clock+=dt;
    if(clock>=arriveT+effW&&!decided)resolve('late');
  }else if(phase==='result'){
    if(ballShown&&ballU<1)ballU=Math.min(1,ballU+dt/300);
    if(result!=='strike'){ runnerHome=Math.min(1,runnerHome+dt/700); }
    if(result==='strike'&&ballU>0.9)burst(450,435,'#fff',1,1);
    if(pt>=1080){
      if(fails>=3){state='over';best=Math.max(best,score);try{localStorage.setItem('bl_best',String(best));}catch(e){}S.over();}
      else if(outs>=TARGET){state='over';best=Math.max(best,score);try{localStorage.setItem('bl_best',String(best));}catch(e){}S.win();}
      else newPitch();
    }
  }
}

// ---------- render ----------
function roundRect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

function drawField(){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#1c4a30');g.addColorStop(1,'#123c26');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  // infield dirt
  ctx.fillStyle='#9a663a';ctx.beginPath();ctx.ellipse(450,300,270,180,0,0,Math.PI*2);ctx.fill();
  // bases diamond (home bottom, 1st right, 2nd top, 3rd left)
  const HB=[450,470],B1=[600,320],B2=[450,180],B3=[300,320];
  ctx.strokeStyle='rgba(255,255,255,.35)';ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(HB[0],HB[1]);ctx.lineTo(B1[0],B1[1]);ctx.lineTo(B2[0],B2[1]);ctx.lineTo(B3[0],B3[1]);ctx.closePath();ctx.stroke();
  function base(b){ctx.save();ctx.translate(b[0],b[1]);ctx.rotate(Math.PI/4);ctx.fillStyle='#eee';ctx.fillRect(-8,-8,16,16);ctx.restore();}
  base(B1);base(B2);base(B3);
  // home plate
  ctx.fillStyle='#eee';ctx.beginPath();ctx.moveTo(450,480);ctx.lineTo(462,472);ctx.lineTo(462,463);ctx.lineTo(438,463);ctx.lineTo(438,472);ctx.closePath();ctx.fill();
  // mound
  ctx.fillStyle='#a06a3c';ctx.beginPath();ctx.ellipse(450,285,44,22,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#c9c2b6';ctx.fillRect(442,280,16,5);
  // runners on all bases (loaded)
  ctx.fillStyle='#d64545';
  const runners=[B1,B2,B3];
  for(const b of runners){ctx.beginPath();ctx.arc(b[0],b[1]-16,8,0,Math.PI*2);ctx.fill();}
  // scoring runner from 3rd -> home on a walk
  if(phase==='result'&&result!=='strike'&&runnerHome>0){
    const x=300+(450-300)*runnerHome, y=320+(470-320)*runnerHome-16;
    ctx.fillStyle='#ff8a8a';ctx.beginPath();ctx.arc(x,y,8,0,Math.PI*2);ctx.fill();
  }
}

function drawPitcher(){
  const cx=450,cy=262;
  let arm=-0.2;
  if(phase==='watch')arm=-0.2+clamp(clock/arriveT,0,1)*0.5;
  else if(phase==='result')arm=clamp(0.3+ballU*1.4,0,1.9);
  ctx.fillStyle='rgba(0,0,0,.22)';ctx.beginPath();ctx.ellipse(cx,cy+14,18,5,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#d8dde6';ctx.fillRect(cx-9,cy-22,18,26);
  ctx.fillStyle='#2a4a6b';ctx.fillRect(cx-9,cy+0,18,10);
  ctx.fillStyle='#f0c9a0';ctx.beginPath();ctx.arc(cx,cy-28,8,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='#f0c9a0';ctx.lineWidth=5;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(cx+6,cy-18);ctx.lineTo(cx+6+Math.cos(-1.4+arm)*20,cy-18+Math.sin(-1.4+arm)*20);ctx.stroke();
}

function drawZoneAndCatcher(){
  // catcher
  ctx.fillStyle='rgba(0,0,0,.25)';ctx.beginPath();ctx.ellipse(450,505,26,7,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#3b6b9b';ctx.fillRect(435,470,30,30);
  ctx.fillStyle='#243a52';ctx.beginPath();ctx.arc(450,466,11,0,Math.PI*2);ctx.fill();
  // strike zone
  const zx=410,zy=396,zw=80,zh=64;
  ctx.strokeStyle='rgba(255,255,255,.7)';ctx.lineWidth=2;ctx.strokeRect(zx,zy,zw,zh);
  ctx.strokeStyle='rgba(255,255,255,.2)';ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(zx+zw/3,zy);ctx.lineTo(zx+zw/3,zy+zh);ctx.moveTo(zx+2*zw/3,zy);ctx.lineTo(zx+2*zw/3,zy+zh);
  ctx.moveTo(zx,zy+zh/3);ctx.lineTo(zx+zw,zy+zh/3);ctx.moveTo(zx,zy+2*zh/3);ctx.lineTo(zx+zw,zy+2*zh/3);ctx.stroke();
  // mitt target
  ctx.fillStyle='#5a3a22';ctx.beginPath();ctx.arc(450,428,9,0,Math.PI*2);ctx.fill();
}

function drawBall(){
  if(phase!=='result'||!ballShown)return;
  const sx=456,sy=250,ex=450,ey=ballEndY;
  const u=ballU;
  const x=sx+(ex-sx)*u, y=sy+(ey-sy)*u;
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(x,y,7,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='#d33';ctx.lineWidth=1;ctx.beginPath();ctx.arc(x-2,y,5,-0.7,0.7);ctx.stroke();
}

function drawTimingBar(){
  if(state!=='play')return;
  const mx=150,mw=600,my=556,mh=20;
  roundRect(mx,my,mw,mh,10);ctx.fillStyle='rgba(0,0,0,.45)';ctx.fill();
  // green release window
  const gx0=mx+mw*clamp((arriveT-effW)/deliveryEnd,0,1);
  const gx1=mx+mw*clamp((arriveT+effW)/deliveryEnd,0,1);
  const gg=ctx.createLinearGradient(gx0,0,gx1,0);gg.addColorStop(0,'rgba(90,220,150,.4)');gg.addColorStop(0.5,'rgba(60,255,150,.9)');gg.addColorStop(1,'rgba(90,220,150,.4)');
  ctx.fillStyle=gg;ctx.fillRect(gx0,my,gx1-gx0,mh);
  // early(red) region
  ctx.fillStyle='rgba(210,70,70,.28)';ctx.fillRect(mx,my,gx0-mx,mh);
  roundRect(mx,my,mw,mh,10);ctx.strokeStyle='rgba(255,255,255,.45)';ctx.lineWidth=1.5;ctx.stroke();
  ctx.font='11px sans-serif';ctx.textAlign='left';ctx.fillStyle='#ff9a9a';ctx.fillText('早い＝抜け球',mx+4,my-6);
  ctx.textAlign='center';ctx.fillStyle='#aaffcf';ctx.fillText('リリースはここ！',(gx0+gx1)/2,my-6);
  ctx.textAlign='right';ctx.fillStyle='#ff9a9a';ctx.fillText('遅い＝ワンバウンド',mx+mw-4,my-6);
  // marker
  if(phase==='watch'||phase==='result'){
    const cc=(phase==='watch')?clock:relClock;
    const px=mx+mw*clamp(cc/deliveryEnd,0,1);
    ctx.fillStyle=(phase==='result')?(result==='strike'?'#5affa0':'#ff6a6a'):'#fff';
    ctx.fillRect(px-2,my-5,4,mh+10);
    ctx.beginPath();ctx.moveTo(px,my-8);ctx.lineTo(px-6,my-16);ctx.lineTo(px+6,my-16);ctx.closePath();ctx.fill();
  }
}

function drawHUD(){
  ctx.textAlign='left';ctx.textBaseline='alphabetic';
  ctx.font='bold 20px sans-serif';ctx.fillStyle='#fff';
  ctx.fillText('打ち取り '+outs+' / '+TARGET,20,32);
  ctx.font='14px sans-serif';ctx.fillStyle='#ffb14a';ctx.fillText('押し出し '+fails+' / 3',20,54);
  ctx.textAlign='right';
  ctx.font='bold 20px sans-serif';ctx.fillStyle='#ffe08a';ctx.fillText('SCORE '+score,W-20,32);
  ctx.font='13px sans-serif';ctx.fillStyle='#bfe';ctx.fillText('BEST '+Math.max(best,score)+'   Lv.'+lvl,W-20,52);
  ctx.textAlign='center';ctx.font='bold 13px sans-serif';ctx.fillStyle='#ffd23a';ctx.fillText('満塁フルカウント — 一球勝負',450,32);
  if(combo>1){ctx.font='bold 20px sans-serif';ctx.fillStyle='#5affa0';ctx.fillText(combo+' 連続打ち取り!',450,112);}
}

function drawMsg(){
  if(msgT<=0)return;
  ctx.save();ctx.globalAlpha=clamp(msgT*1.4,0,1);
  ctx.textAlign='center';ctx.font='bold 25px sans-serif';
  ctx.fillStyle='rgba(0,0,0,.55)';roundRect(450-290,124,580,44,10);ctx.fill();
  ctx.fillStyle=msgCol;ctx.fillText(msg,450,154);
  ctx.restore();
}

function drawTitle(){
  drawField();
  ctx.save();ctx.textAlign='center';
  ctx.fillStyle='rgba(0,0,0,.62)';roundRect(110,110,680,392,16);ctx.fill();
  ctx.fillStyle='#fff';ctx.font='bold 38px sans-serif';ctx.fillText('押し出すな',450,174);
  ctx.font='18px sans-serif';ctx.fillStyle='#9fe0bf';ctx.fillText("Don't Walk Him In",450,204);
  ctx.font='16px sans-serif';ctx.fillStyle='#e6fcef';
  const lines=[
    '満塁フルカウント。ボールなら押し出しで1点を献上——',
    '絶対にストライクを投げ込め！',
    'リリースのタイミングバーを「緑」で離せば、ど真ん中ストライク。',
    '早すぎ＝高めに抜け球、遅すぎ＝ワンバウンド、どちらも押し出し。',
    'レベルが上がると球が速く（バーも速く）、緑は狭くなる。',
    'タップ / クリック / SPACE でリリース。3押し出しでKO。',
  ];
  for(let i=0;i<lines.length;i++)ctx.fillText(lines[i],450,248+i*30);
  ctx.fillStyle='#ffe08a';ctx.font='bold 22px sans-serif';
  ctx.fillText('タップ / SPACE でスタート',450,474);
  ctx.restore();
}

function drawOver(){
  drawField();
  ctx.save();ctx.textAlign='center';
  ctx.fillStyle='rgba(0,0,0,.62)';roundRect(190,150,520,300,16);ctx.fill();
  const w2=outs>=TARGET;
  ctx.fillStyle=w2?'#5affa0':'#ff8a5a';ctx.font='bold 36px sans-serif';
  ctx.fillText(w2?'無失点で切り抜けた！':'押し出しでKO…',450,222);
  ctx.fillStyle='#fff';ctx.font='20px sans-serif';
  ctx.fillText('打ち取り '+outs+' / '+TARGET,450,270);
  ctx.fillText('スコア '+score,450,304);
  ctx.fillStyle='#ffe08a';ctx.fillText('ベスト '+Math.max(best,score),450,336);
  ctx.fillStyle='#9fe0bf';ctx.font='bold 20px sans-serif';
  ctx.fillText('タップ / SPACE でもう一度',450,404);
  ctx.restore();
}

function render(){
  ctx.save();
  if(shakeT>0){const s=shakeT*7;ctx.translate(rnd(-s,s),rnd(-s,s));}
  if(state==='title'){drawTitle();}
  else if(state==='over'){drawOver();}
  else{
    drawField();
    drawZoneAndCatcher();
    drawPitcher();
    drawBall();
    drawTimingBar();
    drawHUD();
    drawMsg();
  }
  for(const p of parts){ctx.globalAlpha=clamp(p.life,0,1);ctx.fillStyle=p.col;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();}
  ctx.globalAlpha=1;
  ctx.restore();
  if(flash>0){ctx.fillStyle='rgba(255,255,255,'+(flash*0.5)+')';ctx.fillRect(0,0,W,H);}
}

function frame(ts){let dt=ts-last;last=ts;if(dt>60)dt=60;if(dt<0)dt=0;update(dt);render();requestAnimationFrame(frame);}
requestAnimationFrame(frame);

// ---------- test hook ----------
window.__bl={
  start:startGame,
  release:release,
  get state(){return state;},
  get outs(){return outs;},
  get fails(){return fails;},
  get score(){return score;},
  get info(){return {state:state,phase:phase,clock:clock,arriveT:arriveT,w:w,effW:effW,deliveryEnd:deliveryEnd,tough:tough,decided:decided,result:result,quality:quality,outs:outs,fails:fails,lvl:lvl,inWindow:(clock>=arriveT-effW&&clock<=arriveT+effW),canAct:(state==='play'&&phase==='watch'&&!decided)};}
};
})();
</script>
</body>
</html>
