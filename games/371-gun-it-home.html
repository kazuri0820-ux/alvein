<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ホームで刺せ (Gun It Home)</title>
<style>
  html,body{margin:0;height:100%;background:#0a0d08;overflow:hidden;
    font-family:-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  #stage{position:relative;width:100vw;height:100vh;max-width:calc(100vh*1.5);max-height:calc(100vw/1.5);aspect-ratio:900/600;}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;border-radius:6px;}
</style>
</head>
<body>
<div id="wrap"><div id="stage"><canvas id="cv"></canvas></div></div>
<script>
(function(){
const W=900,H=600,cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let DPR=1;
function fit(){DPR=Math.min(2,window.devicePixelRatio||1);cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
fit();addEventListener('resize',fit);

// ---------- audio ----------
let AC=null;function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function tone(f,d,type,v,sweep){const a=ac();if(!a)return;const t=a.currentTime,o=a.createOscillator(),g=a.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(sweep)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+sweep),t+d);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v||0.2,t+0.008);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+0.02);}
function noise(d,v,hp){const a=ac();if(!a)return;const t=a.currentTime,n=Math.floor(a.sampleRate*d),buf=a.createBuffer(1,n,a.sampleRate),ch=buf.getChannelData(0);
  for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource();s.buffer=buf;
  const f=a.createBiquadFilter();f.type='highpass';f.frequency.value=hp||600;const g=a.createGain();g.gain.value=v||0.2;
  s.connect(f);f.connect(g);g.connect(a.destination);s.start(t);s.stop(t+d+0.02);}
const S={
  charge:(p)=>{tone(300+p*400,0.03,'sawtooth',0.03);},
  fire:()=>{noise(0.05,0.16,900);tone(300,0.06,'square',0.08,240);},
  bang:()=>{[560,820,1080,1360].forEach((f,i)=>setTimeout(()=>tone(f,0.12,'triangle',0.18),i*52));},
  out:()=>{[620,880,1150].forEach((f,i)=>setTimeout(()=>tone(f,0.11,'triangle',0.16),i*56));},
  bad:()=>{noise(0.2,0.24,240);tone(150,0.26,'sawtooth',0.13,-60);},
  streak:()=>{[700,930,1170,1400].forEach((f,i)=>setTimeout(()=>tone(f,0.1,'triangle',0.16),i*60));},
  over:()=>{[440,330,247,175].forEach((f,i)=>setTimeout(()=>tone(f,0.3,'triangle',0.2),i*160));}
};

// ---------- geometry ----------
const HOME={x:214,y:452}, THIRD={x:300,y:250}, OF={x:720,y:170};   // home, third (runner rounds it), outfielder (you)
function runnerPos(fr){ // rounds third and sprints to the plate
  if(fr<0.28){ const u=fr/0.28; return {x:lerp(OF.x-360,THIRD.x,u), y:lerp(THIRD.y-40,THIRD.y,u)}; }
  const u=(fr-0.28)/0.72; return {x:lerp(THIRD.x,HOME.x+22,easeOut(u)), y:lerp(THIRD.y,HOME.y-6,easeOut(u))};
}

// ---------- state ----------
let state='title', phase='aim', plays=0;
let score=0, combo=0, best=+(localStorage.getItem('th_best')||0);
let outs=0, fails=0, lvl=1;   // outs = runners gunned down at the plate
let power=0, charging=false, chargeRate=0.00135, bandC=0.62, bandW=0.22, tough=false, runnerT=0, timeLeft=0;
let released=false, relP=0, quality=0, result=null, resultT=0, msg='', msgOk=false, anim=0, ballU=0;
let shake=0, flash=0, flashCol='#fff', last=performance.now();
let parts=[], pops=[];

function rnd(a,b){return a+Math.random()*(b-a);}
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function lerp(a,b,u){return a+(b-a)*u;}
function easeOut(u){return 1-Math.pow(1-u,2);}
function bandLo(){return bandC-bandW/2;}
function bandHi(){return bandC+bandW/2;}

function reset(){state='title';score=0;combo=0;outs=0;fails=0;lvl=1;plays=0;result=null;parts=[];pops=[];}

function newPlay(){
  plays++; lvl=Math.min(7,1+Math.floor(outs/4));
  chargeRate=clamp(0.00120+lvl*0.00010,0.0012,0.0020);   // faster charge at higher levels
  bandW=clamp(0.24-lvl*0.019,0.11,0.24);
  tough=Math.random()<clamp(0.2+lvl*0.05,0.2,0.5);
  if(tough)bandW*=0.82;
  bandC=rnd(0.46,0.74);
  runnerT=clamp(2200-lvl*70,1600,2200);                   // runner reaches the plate
  timeLeft=runnerT;
  phase='aim'; power=0; charging=false; released=false; relP=0; quality=0; result=null; resultT=0; msg=''; msgOk=false; anim=0; ballU=0;
}
function start(){ if(!ac())ac(); if(AC&&AC.state==='suspended')AC.resume(); reset(); state='play'; newPlay(); }

function press(){
  if(state==='title'){start();return;}
  if(state==='over'){ if(resultT>0.4){reset();start();} return; }
  if(state!=='play'||phase!=='aim'||released) return;
  charging=true;
}
function release(){
  if(state!=='play'||phase!=='aim'||released) return;
  if(!charging){ return; }
  released=true; charging=false; relP=power; S.fire();
  if(power>=bandLo()&&power<=bandHi()){ quality=1-Math.abs(power-bandC)/(bandW/2); resolve('out'); }
  else resolve(power<bandLo()?'short':'over');
}

function resolve(k){
  phase='result'; result=k; resultT=0; anim=0; ballU=0;
  if(k==='out'){
    outs++; combo++;
    const perfect=quality>=0.7;
    let add=Math.round((70+Math.round(quality*150)+(tough?70:0))*(1+Math.min(9,combo-1)*0.14)); score+=add;
    setTimeout(S.out,120); if(perfect||tough)setTimeout(S.bang,200);
    msgOk=true; flash=1;flashCol='#8affa0';shake=6; burst(HOME.x,HOME.y,'#8affa0',18,7);
    pop(W/2,250,(perfect?'ど真ん中のレーザービーム！本塁で刺した！ +':'ワンバウンドで本塁へストライク送球——アウト！ +')+add,'#d6ffe0');
    if(combo>=2)pop(W/2,214,'コンボ x'+combo,'#ffd24d');
    if(combo>0&&combo%5===0)S.streak();
    msg=perfect?'低い弾道の矢のような送球——ワンバウンドで捕手のミットへズバッ、滑り込む走者を本塁でタッチアウト！':'ちょうどよい強さで本塁へストライク送球——好返球で走者を刺した！';
  } else {
    fails++; combo=0; msgOk=false; flash=1;flashCol='#ff5b5b';shake=8; S.bad();
    if(k==='short') msg='弱い…球威が足りずショートバウンドを繰り返して失速、カットマンも切れず本塁に間に合わず生還';
    else msg='強すぎ…力み過ぎで送球が浮き、捕手の頭上を大きく越える暴投——走者生還、さらに後続も進塁';
    pop(W/2,250,(k==='short')?'弱い…生還':'暴投…生還','#ffb0b0');
  }
  if(fails>=3){ state='over'; resultT=0; S.over(); if(score>best){best=score;localStorage.setItem('th_best',best);} }
}

// ---------- input ----------
cv.addEventListener('pointerdown',e=>{e.preventDefault();press();});
cv.addEventListener('pointerup',e=>{e.preventDefault();release();});
cv.addEventListener('pointercancel',e=>{release();});
addEventListener('keydown',e=>{ if(e.repeat)return; if(e.code==='Space'||e.code==='Enter'||e.code==='ArrowUp'||e.code==='KeyF'){e.preventDefault();press();} });
addEventListener('keyup',e=>{ if(e.code==='Space'||e.code==='Enter'||e.code==='ArrowUp'||e.code==='KeyF'){e.preventDefault();release();} });

// ---------- particles ----------
function burst(x,y,c,n,sp){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=rnd(sp*0.3,sp);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:1,c});}}
function pop(x,y,txt,c){pops.push({x,y,txt,c,life:1});}

// ---------- update ----------
let sndClk=0;
function update(dt){
  shake*=Math.pow(0.86,dt/16.7); if(shake<0.3)shake=0;
  flash*=Math.pow(0.9,dt/16.7);
  for(const p of parts){p.vx*=0.96;p.vy=p.vy*0.96+0.28;p.x+=p.vx*dt/16.7;p.y+=p.vy*dt/16.7;p.life-=dt/16.7*0.026;}
  parts=parts.filter(p=>p.life>0);
  for(const p of pops){p.y-=dt/16.7*0.5;p.life-=dt/16.7*0.02;}
  pops=pops.filter(p=>p.life>0);

  if(state!=='play'){ if(state==='over')resultT+=dt/1000; return; }
  if(phase==='aim'){
    if(charging){ power+=chargeRate*dt; sndClk+=dt; if(sndClk>60){sndClk=0;S.charge(clamp(power,0,1));}
      if(power>=1){ power=1; release(); return; } }        // maxed out -> airmail
    timeLeft-=dt;
    if(!released && timeLeft<=0){ if(charging){release();} else { released=true; resolve('short'); } }  // too slow -> runner scores
    return;
  }
  if(phase==='result'){ resultT+=dt/1000; anim=Math.min(1,anim+dt/560); ballU=Math.min(1,ballU+dt/460); if(resultT>1.55) newPlay(); return; }
}

// ---------- render ----------
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function figure(x,y,col,sc,lean){ sc=sc||1;lean=lean||0;
  ctx.fillStyle='rgba(0,0,0,0.22)';ctx.beginPath();ctx.ellipse(x,y+13*sc,12*sc,4*sc,0,0,6.28);ctx.fill();
  ctx.save();ctx.translate(x,y);ctx.rotate(lean);
  ctx.fillStyle=col;rr(-7*sc,-22*sc,14*sc,24*sc,6*sc);ctx.fill();
  ctx.fillStyle='#f2c9a0';ctx.beginPath();ctx.arc(0,-27*sc,6*sc,0,6.28);ctx.fill();
  ctx.restore();
}
function slider(x,y,col,lean){ ctx.save();ctx.translate(x,y);ctx.rotate(lean);
  ctx.fillStyle=col;ctx.beginPath();ctx.ellipse(0,-6,17,9,0,0,6.28);ctx.fill();
  ctx.fillStyle='#f0c9a0';ctx.beginPath();ctx.arc(-19,-10,7,0,6.28);ctx.fill();
  ctx.strokeStyle=col;ctx.lineWidth=6;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(10,-4);ctx.lineTo(26,-2);ctx.stroke();ctx.restore(); }
function drawScene(){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#12703f');g.addColorStop(0.5,'#0f5e34');g.addColorStop(1,'#0c4c2b');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#6a4a30';ctx.beginPath();ctx.ellipse(HOME.x+30,HOME.y+6,220,140,0,0,6.28);ctx.fill();
  // basepath third -> home
  ctx.strokeStyle='rgba(230,210,150,0.5)';ctx.lineWidth=24;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(THIRD.x,THIRD.y);ctx.lineTo(HOME.x,HOME.y);ctx.stroke();ctx.lineCap='butt';
  // third base
  ctx.save();ctx.translate(THIRD.x,THIRD.y);ctx.rotate(0.785);ctx.fillStyle='#eef0f2';ctx.fillRect(-11,-11,22,22);ctx.restore();
  // home plate
  ctx.fillStyle='#eef0f2';ctx.beginPath();ctx.moveTo(HOME.x-14,HOME.y-8);ctx.lineTo(HOME.x+14,HOME.y-8);ctx.lineTo(HOME.x+14,HOME.y+2);ctx.lineTo(HOME.x,HOME.y+14);ctx.lineTo(HOME.x-14,HOME.y+2);ctx.closePath();ctx.fill();
}

function render(){
  ctx.save();
  if(shake>0)ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
  drawScene();

  if(state==='play'){
    // runner fraction: advances with elapsed time; on result freezes/continues
    let rf;
    const elapsed=runnerT-timeLeft;
    if(phase==='aim') rf=clamp(elapsed/runnerT*0.92,0,0.92);
    else {
      if(result==='out') rf=clamp((runnerT-timeLeft)/runnerT*0.92,0,0.9);   // tagged just short
      else rf=clamp(0.72+easeOut(anim)*0.28,0,1);                            // scores
    }
    const rp=runnerPos(rf);

    // catcher at the plate
    figure(HOME.x-2,HOME.y+30,'#c9782f',0.82,0);

    // the throw home
    if(phase==='result'){
      let bx,by;
      if(result==='out'){ const u=easeOut(ballU); // low one-hop line to the plate
        bx=lerp(OF.x,HOME.x,u); by=lerp(OF.y-16,HOME.y-6,u)- Math.sin(Math.PI*u)*10 + (u>0.5?Math.sin(Math.PI*(u-0.5)*2)*12:0);
      } else if(result==='short'){ const u=easeOut(ballU); bx=lerp(OF.x,HOME.x+120,Math.min(1,u*1.2)); by=lerp(OF.y-16,HOME.y+30,Math.min(1,u))+Math.abs(Math.sin(u*9))*18; }
      else { const u=easeOut(ballU); bx=lerp(OF.x,HOME.x-40,u); by=lerp(OF.y-16,HOME.y-120,u); } // airmail over the catcher
      ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(bx,by,7,0,6.28);ctx.fill();
      ctx.strokeStyle='#c33';ctx.lineWidth=1;ctx.beginPath();ctx.arc(bx,by,7,0.4,2.2);ctx.stroke();
    }

    // runner
    const sliding=(phase==='result');
    if(sliding) slider(rp.x,rp.y,(result==='out')?'#e0584a':'#4fa3ff',0.16);
    else figure(rp.x,rp.y,'#d0403a',0.95,0.14);

    // outfielder (you)
    figure(OF.x,OF.y,'#3aa0ff',1.0,charging?-0.2:(phase==='result'?0.24:0));

    // ---- power meter ----
    const mx=W-70, my=H-70, mw=32, mh=300;
    ctx.fillStyle='rgba(0,0,0,0.4)';rr(mx-6,my-mh-6,mw+12,mh+12,8);ctx.fill();
    ctx.fillStyle='rgba(255,255,255,0.12)';rr(mx,my-mh,mw,mh,6);ctx.fill();
    // green band
    const by0=my-bandHi()*mh, bh=(bandHi()-bandLo())*mh;
    ctx.fillStyle='rgba(120,255,150,0.7)';ctx.fillRect(mx,by0,mw,bh);
    ctx.fillStyle='rgba(255,255,255,0.85)';ctx.fillRect(mx,my-bandC*mh-1,mw,2);
    // current power fill
    const ph=clamp((released?relP:power),0,1)*mh;
    ctx.fillStyle=(phase==='result')?(result==='out'?'#8affa0':'#ff6b6b'):'#ffe14d';
    ctx.fillRect(mx,my-ph,mw,ph);
    ctx.strokeStyle='rgba(255,255,255,0.5)';ctx.lineWidth=1;ctx.strokeRect(mx,my-mh,mw,mh);
    ctx.save();ctx.translate(mx-12,my-mh/2);ctx.rotate(-Math.PI/2);ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,0.6)';ctx.font='12px sans-serif';ctx.fillText('送球パワー（強さ）',0,0);ctx.restore();

    // banner + runner-race bar
    ctx.textAlign='center';
    if(phase==='aim'){
      ctx.fillStyle='rgba(255,220,90,0.96)';ctx.font='bold 21px sans-serif';ctx.fillText(charging?'離すな…緑の帯（ちょうどの強さ）で離せ！':'長押しで送球パワーを溜めろ——本塁へ走者が突入！',W/2,44);
      const tp=clamp(timeLeft/runnerT,0,1),tw=200,tx=W/2-tw/2,ty=60;
      ctx.fillStyle='rgba(255,255,255,0.15)';ctx.fillRect(tx,ty,tw,6);ctx.fillStyle=tp<0.3?'#ff5b5b':'#ffd24d';ctx.fillRect(tx,ty,tw*tp,6);
      ctx.fillStyle='rgba(255,255,255,0.55)';ctx.font='12px sans-serif';ctx.fillText('長押し/SPACE長押しで溜め→緑の帯で離す＝ワンバウンドの好返球（弱い＝失速・強い＝暴投）',W/2,H-14);
    }
  }

  for(const p of parts){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,3.2,0,6.28);ctx.fill();}
  ctx.globalAlpha=1;
  for(const p of pops){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.font='bold 21px sans-serif';ctx.textAlign='center';ctx.fillText(p.txt,p.x,p.y);}
  ctx.globalAlpha=1;

  // HUD
  ctx.textAlign='left';ctx.fillStyle='#fff';ctx.font='bold 26px sans-serif';ctx.fillText('SCORE '+score,20,36);
  ctx.textAlign='right';ctx.fillStyle='rgba(255,255,255,0.9)';ctx.font='14px sans-serif';ctx.fillText('本塁刺 '+outs+'  Lv'+lvl,W-20,24);
  ctx.fillText('失点',W-92,46);
  for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(W-60+i*20,41,7,0,6.28);ctx.fillStyle=i<fails?'#ff5b5b':'rgba(255,255,255,0.25)';ctx.fill();}
  if(combo>=2){ctx.textAlign='center';ctx.fillStyle='#ffd24d';ctx.font='bold 18px sans-serif';ctx.fillText('コンボ x'+combo,W/2,112);}

  if(state==='play'&&phase==='result'&&msg){ctx.textAlign='center';ctx.fillStyle=msgOk?'#9ff0b8':'#ff9a9a';ctx.font='bold 15px sans-serif';ctx.fillText(msg,W/2,300);}

  if(state==='title'){
    ctx.fillStyle='rgba(4,8,4,0.83)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='bold 42px sans-serif';ctx.fillText('ホームで刺せ',W/2,84);
    ctx.fillStyle='#ffd23e';ctx.font='bold 22px sans-serif';ctx.fillText('Gun It Home',W/2,120);
    ctx.fillStyle='rgba(255,255,255,0.92)';ctx.font='16px sans-serif';
    ctx.fillText('外野手として、本塁へ突入する走者を“ちょうどよい強さ”のワンバウンド送球で刺せ',W/2,176);
    ctx.fillStyle='rgba(255,255,255,0.66)';ctx.font='14px sans-serif';
    ctx.fillText('長押し（タップ長押し/SPACE）で送球パワーを溜め→右の緑の帯（適正な強さ）で離す＝好返球で本塁タッチアウト',W/2,214);
    ctx.fillText('帯の中心ドンピシャは低い弾道の“レーザービーム”＝大量加点。弱い＝ショートバウンドで失速し生還',W/2,238);
    ctx.fillText('強すぎ（溜め過ぎ・振り切り）＝送球が浮いて捕手の頭上を越える暴投で生還＆後続進塁',W/2,262);
    ctx.fillText('溜めるのが遅い（走者が到達）＝間に合わず生還。上級ほど溜めが速く帯が狭い。3失点で交代',W/2,286);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で開始',W/2,352);
    ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='14px sans-serif';ctx.fillText('BEST '+best,W/2,384);
  }
  if(state==='over'){
    ctx.fillStyle='rgba(4,8,4,0.85)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#ff6b6b';ctx.font='bold 46px sans-serif';ctx.fillText('3失点…交代',W/2,222);
    ctx.fillStyle='#fff';ctx.font='bold 40px sans-serif';ctx.fillText('SCORE '+score,W/2,290);
    ctx.fillStyle='rgba(255,255,255,0.85)';ctx.font='19px sans-serif';ctx.fillText('本塁刺 '+outs+'   BEST '+best,W/2,330);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で もう一度',W/2,402);
  }

  if(flash>0.02){ctx.globalAlpha=flash*0.5;ctx.fillStyle=flashCol;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}
  ctx.restore();

  ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,0.4)';ctx.font='12px sans-serif';
  ctx.fillText('ホームで刺せ：長押しで送球パワーを溜め、緑の帯（ちょうどの強さ）で離してワンバウンドの好返球＝本塁アウト。3失点で交代',W/2,H-8);
}

function frame(ts){let dt=ts-last;last=ts;if(dt>60)dt=60;if(dt<0)dt=0;update(dt);render();requestAnimationFrame(frame);}
requestAnimationFrame(frame);

// ---------- test hook ----------
window.__th={
  start, press:()=>press(), release:()=>release(),
  get state(){return state;},
  get score(){return score;},
  get outs(){return outs;},
  get fails(){return fails;},
  get info(){return {state,phase,power,bandC,bandW,bandLo:bandLo(),bandHi:bandHi(),tough,charging,released,result,outs,fails,lvl,timeLeft,
    canAct:(phase==='aim'&&!released)};}
};
})();
</script>
</body>
</html>
