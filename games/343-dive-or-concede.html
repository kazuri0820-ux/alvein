<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ダイブか安全策か (Dive or Concede)</title>
<style>
  html,body{margin:0;height:100%;background:#0a0d08;overflow:hidden;
    font-family:-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  #stage{position:relative;width:100vw;height:100vh;max-width:calc(100vh*1.5);max-height:calc(100vw/1.5);aspect-ratio:900/600;}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;border-radius:6px;}
</style>
</head>
<body>
<div id="wrap"><div id="stage"><canvas id="cv"></canvas></div></div>
<script>
(function(){
const W=900,H=600,cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let DPR=1;
function fit(){DPR=Math.min(2,window.devicePixelRatio||1);cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
fit();addEventListener('resize',fit);

// ---------- audio ----------
let AC=null;function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function tone(f,d,type,v,sweep){const a=ac();if(!a)return;const t=a.currentTime,o=a.createOscillator(),g=a.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(sweep)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+sweep),t+d);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v||0.2,t+0.008);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+0.02);}
function noise(d,v,hp){const a=ac();if(!a)return;const t=a.currentTime,n=Math.floor(a.sampleRate*d),buf=a.createBuffer(1,n,a.sampleRate),ch=buf.getChannelData(0);
  for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource();s.buffer=buf;
  const f=a.createBiquadFilter();f.type='highpass';f.frequency.value=hp||600;const g=a.createGain();g.gain.value=v||0.2;
  s.connect(f);f.connect(g);g.connect(a.destination);s.start(t);s.stop(t+d+0.02);}
const S={
  crack:()=>{noise(0.04,0.14,500);tone(240,0.06,'square',0.08,-30);},
  glove:()=>{noise(0.05,0.2,1200);tone(230,0.05,'square',0.08,-60);},
  out:()=>{[620,880,1150].forEach((f,i)=>setTimeout(()=>tone(f,0.11,'triangle',0.16),i*56));},
  big:()=>{[600,800,1000,1250].forEach((f,i)=>setTimeout(()=>tone(f,0.12,'triangle',0.17),i*80));},
  safe:()=>{tone(360,0.07,'sine',0.05,-30);},
  bad:()=>{noise(0.16,0.18,300);setTimeout(()=>tone(180,0.16,'sawtooth',0.12,-40),20);},
  streak:()=>{[700,930,1170,1400].forEach((f,i)=>setTimeout(()=>tone(f,0.1,'triangle',0.16),i*60));},
  over:()=>{[440,330,247,175].forEach((f,i)=>setTimeout(()=>tone(f,0.3,'triangle',0.2),i*160));}
};

// ---------- geometry ----------
const FLD={x:452,y:236}, BAT={x:452,y:560};
const CATCHY=236, DROPY=352;   // where the sinking liner ends up

// ---------- state ----------
let state='title', phase='read', plays=0;
let score=0, combo=0, best=+(localStorage.getItem('dv_best')||0);
let outs=0, fails=0, lvl=1;   // outs = catches made
let clock=0, arriveT=880, w=140, revealT=420, kind='catch', tricky=false, laneX=452;
let decided=false, acted=false, actT=0, result=null, resultT=0, msg='', msgOk=false, quality=0, ballGone=0;
let shake=0, flash=0, flashCol='#fff', last=performance.now();
let parts=[], pops=[];

function rnd(a,b){return a+Math.random()*(b-a);}
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function lerp(a,b,u){return a+(b-a)*u;}
function easeOut(u){return 1-Math.pow(1-u,2);}
function easeIn(u){return u*u;}

function reset(){state='title';score=0;combo=0;outs=0;fails=0;lvl=1;plays=0;result=null;parts=[];pops=[];}

function newPlay(){
  plays++; lvl=Math.min(7,1+Math.floor(outs/4));
  arriveT=clamp(900-lvl*46,580,900);
  w=clamp(150-lvl*10,90,150);
  revealT=clamp(430-lvl*18,300,430);
  kind=(Math.random()<0.5?'catch':'drop');
  tricky=Math.random()<clamp(0.2+lvl*0.05,0.2,0.5);
  if(tricky){ revealT=Math.max(revealT,arriveT-w-70); w=Math.round(w*0.86); }
  laneX=FLD.x+rnd(-14,14);
  phase='read'; clock=0; decided=false; acted=false; actT=0; result=null; resultT=0; msg=''; msgOk=false; quality=0; ballGone=0;
  S.crack();
}
function start(){ if(!ac())ac(); if(AC&&AC.state==='suspended')AC.resume(); reset(); state='play'; newPlay(); }

function dive(){
  if(state==='title'){start();return;}
  if(state==='over'){ if(resultT>0.4){reset();start();} return; }
  if(state!=='play'||phase!=='read'||decided) return;
  decided=true; acted=true; actT=clock; S.glove();
  if(kind==='drop'){ resolve('overrun'); return; }        // dove at a ball that drops short -> it skips past
  if(clock<arriveT-w){ resolve('early'); }
  else if(clock<=arriveT+w){ quality=1-Math.abs(clock-arriveT)/w; resolve('out'); }
  else resolve('late');
}

function resolve(k){
  phase='result'; result=k; resultT=0; ballGone=0;
  if(k==='out'){
    outs++; combo++;
    const perfect=quality>=0.8;
    let add=Math.round((tricky?250:150)*(1+Math.min(9,combo-1)*0.14)); score+=add;
    setTimeout(S.out,40); if(perfect||tricky)setTimeout(S.big,150);
    msgOk=true; flash=1;flashCol='#8affa0';shake=6; burst(FLD.x,FLD.y,'#8affa0',16,7);
    pop(W/2,186,(perfect?'ジャストのタイミングで超美技！ +':'ダイビングキャッチ！アウト！ +')+add,'#d6ffe0');
    if(combo>=2)pop(W/2,150,'コンボ x'+combo,'#ffd24d');
    if(combo>0&&combo%5===0)S.streak();
    msg='沈む打球を見切って飛び込み、グラブに収めた——長打を消す好プレー';
  } else if(k==='safe'){
    msgOk=true; flash=0.5;flashCol='#7fd0ff';
    pop(W/2,186,'安全策で最少失点','#bfe4ff');
    msg='届かない打球——無理せず前で処理し、シングルヒットに抑えた（賢明な安全策）';
    S.safe();
  } else {
    fails++; combo=0; msgOk=false; flash=1;shake=8; S.bad();
    if(k==='overrun'){ flashCol='#ff5b5b'; msg='無謀なダイブ…届かない打球に飛び込み、頭上を抜かれて長打（余計な進塁）'; pop(W/2,186,'抜かれて長打…','#ffb0b0'); }
    else if(k==='dropped'){ flashCol='#ff8b3b'; msg='見送った…捕れる打球にダイブせず、目の前にポトリと落ちて安打を許した'; pop(W/2,186,'捕れたのに落球…','#ffcf9a'); }
    else if(k==='early'){ flashCol='#ff5b5b'; msg='早い…飛び込みが早すぎて打球の手前でグラブが伸び切り、抜かれた'; pop(W/2,186,'早い…抜かれた','#ffb0b0'); }
    else { flashCol='#ff8b3b'; msg='遅い…反応が遅れて飛び込みが間に合わず、打球が先に落ちた'; pop(W/2,186,'間に合わず…','#ffcf9a'); }
  }
  if(fails>=3){ state='over'; resultT=0; S.over(); if(score>best){best=score;localStorage.setItem('dv_best',best);} }
}

// ---------- input ----------
cv.addEventListener('pointerdown',e=>{e.preventDefault();dive();});
addEventListener('keydown',e=>{ if(e.repeat)return;
  if(e.code==='Space'||e.code==='Enter'||e.code==='ArrowUp'||e.code==='KeyF'||e.code==='KeyJ'){e.preventDefault();dive();} });

// ---------- particles ----------
function burst(x,y,c,n,sp){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=rnd(sp*0.3,sp);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:1,c});}}
function pop(x,y,txt,c){pops.push({x,y,txt,c,life:1});}

// the sinking liner: comes from the batter, sinks toward the field
function ballY(){ const endY=(kind==='catch')?CATCHY:DROPY; return lerp(BAT.y-40, endY, easeIn(clamp(clock/arriveT,0,1))); }
function ballX(){ return lerp(BAT.x, laneX, easeOut(clamp(clock/arriveT,0,1))); }

// ---------- update ----------
function update(dt){
  shake*=Math.pow(0.86,dt/16.7); if(shake<0.3)shake=0;
  flash*=Math.pow(0.9,dt/16.7);
  for(const q of parts){q.vx*=0.96;q.vy=q.vy*0.96+0.28;q.x+=q.vx*dt/16.7;q.y+=q.vy*dt/16.7;q.life-=dt/16.7*0.026;}
  parts=parts.filter(q=>q.life>0);
  for(const q of pops){q.y-=dt/16.7*0.5;q.life-=dt/16.7*0.02;}
  pops=pops.filter(q=>q.life>0);

  if(state!=='play'){ if(state==='over')resultT+=dt/1000; return; }
  if(phase==='read'){ clock+=dt;
    if(!decided && clock>arriveT+w*1.7){ decided=true; resolve(kind==='drop'?'safe':'dropped'); }
    return; }
  if(phase==='result'){ resultT+=dt/1000; ballGone=Math.min(1,ballGone+dt/460);
    if(resultT>1.5) newPlay(); return; }
}

// ---------- render ----------
function drawField(){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#12703f');g.addColorStop(0.5,'#0f5e34');g.addColorStop(1,'#0c4c2b');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.globalAlpha=0.06;for(let i=0;i<7;i++){ctx.fillStyle=i%2?'#fff':'#000';ctx.fillRect(0,i*84,W,84);}ctx.globalAlpha=1;
  // outfield arc (warning-track feel)
  ctx.strokeStyle='rgba(255,255,255,0.14)';ctx.lineWidth=3;ctx.beginPath();ctx.arc(452,640,470,1.15*Math.PI,1.85*Math.PI);ctx.stroke();
  // the fielder's dive reach line
  ctx.strokeStyle='rgba(255,255,255,0.18)';ctx.setLineDash([6,6]);ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(120,FLD.y+30);ctx.lineTo(784,FLD.y+30);ctx.stroke();ctx.setLineDash([]);
  ctx.fillStyle='rgba(255,255,255,0.4)';ctx.font='11px sans-serif';ctx.textAlign='left';ctx.fillText('ダイブ範囲の限界',126,FLD.y+26);
}
function fielder(x,y,diving,lean){
  ctx.save();ctx.translate(x,y);ctx.rotate(lean||0);
  if(diving){ ctx.fillStyle='#d8dde2';ctx.beginPath();ctx.ellipse(0,0,20,10,0,0,6.28);ctx.fill();
    ctx.fillStyle='#f0c9a0';ctx.beginPath();ctx.arc(-22,-4,7.5,0,6.28);ctx.fill();
    ctx.fillStyle='#6a3d16';ctx.beginPath();ctx.arc(22,-2,8,0,6.28);ctx.fill();   // glove extended
  } else { ctx.fillStyle='#d8dde2';ctx.beginPath();ctx.ellipse(0,-15,10,16,0,0,6.28);ctx.fill();
    ctx.fillStyle='#f0c9a0';ctx.beginPath();ctx.arc(0,-36,8,0,6.28);ctx.fill();
    ctx.fillStyle='#6a3d16';ctx.beginPath();ctx.arc(-2,-14,8,0,6.28);ctx.fill(); }
  ctx.restore();
}

function render(){
  ctx.save();
  if(shake>0)ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
  drawField();

  if(state==='play'||state==='over'){
    const revealed=(phase==='read'&&clock>=revealT)||phase==='result';

    // fielder: reads, then dives or stays
    let fx=FLD.x, fy=FLD.y, diving=false, flean=0;
    if(phase==='result'){
      if(result==='out'){ diving=true; fx=FLD.x; fy=FLD.y; }
      else if(result==='overrun'){ diving=true; fx=lerp(FLD.x,FLD.x,ballGone); fy=lerp(FLD.y,FLD.y-6,ballGone); }
      else if(result==='safe'){ fy=DROPY-14; }               // came in to field the hop
      else if(result==='early'||result==='late'){ diving=true; }
      else { /* dropped: stayed */ }
    }
    fielder(fx,fy,diving,flean);

    // the ball
    let bx,by;
    if(phase==='read'){ bx=ballX(); by=ballY(); }
    else {
      const u=easeOut(ballGone);
      if(result==='out'){ bx=FLD.x+18; by=FLD.y-2; }                         // in the glove
      else if(result==='dropped'){ bx=laneX; by=lerp(CATCHY,CATCHY+30,u); }   // drops in
      else if(result==='safe'){ bx=laneX; by=DROPY; }                        // fielded on the hop
      else if(result==='overrun'){ bx=lerp(laneX,laneX,u); by=lerp(DROPY,90,u); }  // skips past behind
      else { bx=laneX; by=lerp(CATCHY,CATCHY+40,u); }                        // early/late: gets by
    }
    let bc=revealed?((kind==='catch')?'#8affa0':'#7fd0ff'):'#fff';
    ctx.fillStyle=bc;ctx.beginPath();ctx.arc(bx,by,7.5,0,6.28);ctx.fill();
    ctx.strokeStyle='#c33';ctx.lineWidth=1.1;ctx.beginPath();ctx.arc(bx,by,7.5,0.4,2.2);ctx.stroke();

    // cue banner + timing bar
    ctx.textAlign='center';
    if(state==='play'&&phase==='read'){
      if(clock<revealT){ ctx.fillStyle='rgba(255,220,90,0.95)';ctx.font='bold 20px sans-serif';ctx.fillText('沈む打球！ 届くか届かないかを見極めろ',W/2,44); }
      else if(kind==='catch'){ ctx.fillStyle='rgba(120,240,150,0.98)';ctx.font='bold 22px sans-serif';ctx.fillText('届く！ ダイブしろ！',W/2,44);
        const bw=280,x=W/2-bw/2,y=58, span=arriveT+w*2.0;
        ctx.fillStyle='rgba(255,255,255,0.16)';ctx.fillRect(x,y,bw,9);
        const gx0=x+bw*clamp((arriveT-w)/span,0,1), gx1=x+bw*clamp((arriveT+w)/span,0,1);
        ctx.fillStyle='rgba(90,240,130,0.5)';ctx.fillRect(gx0,y,gx1-gx0,9);
        const px=x+bw*clamp(clock/span,0,1); ctx.fillStyle='#ffe14d';ctx.fillRect(px-2,y-3,4,15);
      } else { ctx.fillStyle='rgba(150,200,255,0.98)';ctx.font='bold 22px sans-serif';ctx.fillText('届かない…安全策（見送り）で',W/2,44); }
      ctx.fillStyle='rgba(255,255,255,0.55)';ctx.font='12px sans-serif';ctx.fillText('タップ / SPACE ＝ ダイブ（届かない打球に飛び込む/捕れる打球を見送ると失点）',W/2,H-28);
    }
  }

  for(const q of parts){ctx.globalAlpha=Math.max(0,q.life);ctx.fillStyle=q.c;ctx.beginPath();ctx.arc(q.x,q.y,3.2,0,6.28);ctx.fill();}
  ctx.globalAlpha=1;
  for(const q of pops){ctx.globalAlpha=Math.max(0,q.life);ctx.fillStyle=q.c;ctx.font='bold 21px sans-serif';ctx.textAlign='center';ctx.fillText(q.txt,q.x,q.y);}
  ctx.globalAlpha=1;

  // HUD
  ctx.textAlign='left';ctx.fillStyle='#fff';ctx.font='bold 26px sans-serif';ctx.fillText('SCORE '+score,20,36);
  ctx.textAlign='right';ctx.fillStyle='rgba(255,255,255,0.9)';ctx.font='14px sans-serif';ctx.fillText('好捕 '+outs+'  Lv'+lvl,W-20,24);
  ctx.fillText('失点',W-92,46);
  for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(W-60+i*20,41,7,0,6.28);ctx.fillStyle=i<fails?'#ff5b5b':'rgba(255,255,255,0.25)';ctx.fill();}
  if(combo>=2){ctx.textAlign='center';ctx.fillStyle='#ffd24d';ctx.font='bold 18px sans-serif';ctx.fillText('コンボ x'+combo,W/2,112);}

  if(state==='play'&&phase==='result'&&msg){ctx.textAlign='center';ctx.fillStyle=msgOk?'#9ff0b8':'#ffb38a';ctx.font='bold 15px sans-serif';ctx.fillText(msg,W/2,470);}

  if(state==='title'){
    ctx.fillStyle='rgba(4,8,4,0.83)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='bold 40px sans-serif';ctx.fillText('ダイブか安全策か',W/2,84);
    ctx.fillStyle='#ffd23e';ctx.font='bold 22px sans-serif';ctx.fillText('Dive or Concede',W/2,120);
    ctx.fillStyle='rgba(255,255,255,0.92)';ctx.font='16px sans-serif';
    ctx.fillText('外野手として、沈む打球が“届く（ダイブで捕れる）”か“届かない（安全策）”かを見極める守備判断',W/2,180);
    ctx.fillStyle='rgba(255,255,255,0.66)';ctx.font='14px sans-serif';
    ctx.fillText('打球が来る→軌道が判明（緑＝届く／青＝届かない）。届くなら緑窓でタップ/SPACE＝ダイブでアウト',W/2,218);
    ctx.fillText('届かない打球にダイブ＝頭上を抜かれて長打（余計な進塁）／届く打球を見送る＝目の前に落ちて安打',W/2,242);
    ctx.fillText('ダイブが早い＝手前で伸び切って抜かれ・遅い＝間に合わず。ジャストの美技ほど大量加点',W/2,266);
    ctx.fillText('届かない打球は安全策（何もしない）で前で処理＝最少失点でOK。上級ほど速く見極めが難しい。3失点で交代',W/2,290);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で開始',W/2,356);
    ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='14px sans-serif';ctx.fillText('BEST '+best,W/2,388);
  }
  if(state==='over'){
    ctx.fillStyle='rgba(4,8,4,0.85)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#ff6b6b';ctx.font='bold 46px sans-serif';ctx.fillText('3失点…交代',W/2,222);
    ctx.fillStyle='#fff';ctx.font='bold 40px sans-serif';ctx.fillText('SCORE '+score,W/2,290);
    ctx.fillStyle='rgba(255,255,255,0.85)';ctx.font='19px sans-serif';ctx.fillText('好捕 '+outs+'   BEST '+best,W/2,330);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で もう一度',W/2,402);
  }

  if(flash>0.02){ctx.globalAlpha=flash*0.5;ctx.fillStyle=flashCol;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}
  ctx.restore();

  ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,0.4)';ctx.font='12px sans-serif';
  ctx.fillText('ダイブか安全策か：届く打球はダイブでアウト、届かない打球は安全策。無謀ダイブ/見送り/早遅は失点、3つで交代',W/2,H-8);
}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

function frame(ts){let dt=ts-last;last=ts;if(dt>60)dt=60;if(dt<0)dt=0;update(dt);render();requestAnimationFrame(frame);}
requestAnimationFrame(frame);

// ---------- test hook ----------
window.__dv={
  start, dive,
  get state(){return state;},
  get score(){return score;},
  get outs(){return outs;},
  get fails(){return fails;},
  get info(){return {state,phase,clock,contactT:arriveT,arriveT,w,revealT,kind,tricky,decided,acted,result,outs,fails,lvl,
    revealed:(clock>=revealT),isCatch:(kind==='catch'),inWin:(phase==='read'&&kind==='catch'&&Math.abs(clock-arriveT)<=w)};}
};
})();
</script>
</body>
</html>
