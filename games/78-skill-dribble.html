<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>スキルドリブル — Skill Dribble</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{width:100%;height:100%;background:#0a1420;overflow:hidden;
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,system-ui,sans-serif;
    touch-action:none;user-select:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  #stage{position:relative;aspect-ratio:900/600;max-width:100%;max-height:100%;
    width:auto;height:auto;box-shadow:0 0 60px rgba(0,0,0,.6);}
  canvas{display:block;width:100%;height:100%;border-radius:6px;}
</style>
</head>
<body>
<div id="wrap"><div id="stage"><canvas id="c" width="900" height="600"></canvas></div></div>
<script>
(function(){
"use strict";
const TEST=location.hash.indexOf('test')>=0;
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
const W=900,H=600;
let dpr=Math.max(1,Math.min(2,window.devicePixelRatio||1));
function fit(){ dpr=Math.max(1,Math.min(2,window.devicePixelRatio||1)); cv.width=W*dpr; cv.height=H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0); }
fit(); window.addEventListener('resize',fit);

// ---- audio ----
let AC=null;
function ac(){ if(!AC){ try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){AC=null;} } return AC; }
function tone(f,d,type,g,f2){ const a=ac(); if(!a)return; const o=a.createOscillator(),gg=a.createGain();
  o.type=type||'sine'; o.frequency.setValueAtTime(f,a.currentTime); if(f2)o.frequency.exponentialRampToValueAtTime(f2,a.currentTime+d);
  gg.gain.setValueAtTime(0.0001,a.currentTime); gg.gain.exponentialRampToValueAtTime(g||0.2,a.currentTime+0.01);
  gg.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+d); o.connect(gg); gg.connect(a.destination); o.start(); o.stop(a.currentTime+d+0.02); }
function noise(d,g,cut){ const a=ac(); if(!a)return; const n=Math.floor(a.sampleRate*d),buf=a.createBuffer(1,n,a.sampleRate),ch=buf.getChannelData(0);
  for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(1-i/n); const src=a.createBufferSource(); src.buffer=buf;
  const f=a.createBiquadFilter(); f.type='lowpass'; f.frequency.value=cut||1200; const gg=a.createGain(); gg.gain.value=g||0.2;
  src.connect(f); f.connect(gg); gg.connect(a.destination); src.start(); }
const S={
  good(c){ tone(420+Math.min(12,c)*30,0.06,'square',0.07,560); },
  perfect(c){ tone(560+Math.min(12,c)*30,0.06,'square',0.09,760); setTimeout(()=>tone(900,0.06,'sine',0.06),30); },
  miss(){ noise(0.14,0.3,700); tone(160,0.2,'sawtooth',0.14,80); },
  empty(){ tone(200,0.05,'sine',0.05,150); },
  beat(){ noise(0.05,0.2,2600); tone(300,0.08,'triangle',0.1,160); },
  goal(){ tone(300,0.16,'triangle',0.24,150); setTimeout(()=>tone(560,0.16,'square',0.14),40); setTimeout(()=>tone(760,0.2,'square',0.12),100); },
  over(){ noise(0.3,0.34,600); tone(150,0.4,'sawtooth',0.16,60); },
  cheer(){ const a=ac(); if(!a)return; noise(0.7,0.22,1900); for(let i=0;i<5;i++)setTimeout(()=>tone(500+Math.random()*320,0.3,'sine',0.05),i*46); }
};

// ---- lanes ----
const LANES=4;                       // 0=左 1=上 2=下 3=右
const LANEW=96, LANEGAP=8;
const LANE_TOTAL=LANES*LANEW+(LANES-1)*LANEGAP;
const LANE_X0=(W-LANE_TOTAL)/2 + 90;  // shift right, leave left for pitch/dribbler art
const HITY=470;
const ARROWS=['←','↑','↓','→'];
const LANECOL=['#5cc9f0','#8effa8','#ffd23e','#ff8a5a'];
const KEYMAP={ArrowLeft:0,ArrowUp:1,ArrowDown:2,ArrowRight:3, KeyA:0,KeyW:1,KeyS:2,KeyD:3};
function laneX(i){ return LANE_X0 + i*(LANEW+LANEGAP) + LANEW/2; }

// ---- state ----
let state='ready';   // ready, play, over
let score=0, combo=0, bestCombo=0, hits=0, miss=0, momentum=62, level=0, timeAlive=0, goals=0, progress=0;
let best=0; try{ best=parseInt(localStorage.getItem('sk_best')||'0',10)||0; }catch(e){}

let notes=[];        // {lane,y,hit}
let spawnT=0, spawnGap=0.62, fallSpd=300;
let laneFlash=[0,0,0,0], laneJudge=['','','',''], laneJudgeT=[0,0,0,0];
let msg='',msgT=0, popText='',popT=0,popCol='#fff';
let flash=0,flashCol='#fff',shakeT=0,shakeM=0, dribbleT=0, beaten=[];
let parts=[], crowd=[], t=0;
const PERF=17, GOOD=36, MISSPASS=42;

for(let i=0;i<64;i++) crowd.push({x:Math.random()*W,y:2+Math.random()*20,c:['#e8544e','#f0c14b','#4a90d9','#fff','#5cc98a','#c98af0'][i%6]});

function saveBest(){ try{localStorage.setItem('sk_best',''+best);}catch(e){} }

function reset(){ score=0;combo=0;hits=0;miss=0;momentum=62;level=0;timeAlive=0;goals=0;progress=0; notes=[];parts=[];beaten=[];
  spawnT=0;spawnGap=0.62;fallSpd=300; laneFlash=[0,0,0,0];laneJudge=['','','',''];laneJudgeT=[0,0,0,0];
  state='play'; msg='矢印がラインに来たら同じ方向を入力！ 華麗に抜き去れ'; msgT=220; }

function spawnNote(){
  level=Math.floor(timeAlive/14);
  // avoid immediate same-lane stack
  let lane=Math.floor(Math.random()*LANES);
  const last=notes[notes.length-1];
  if(last && last.lane===lane && Math.random()<0.6) lane=(lane+1+Math.floor(Math.random()*(LANES-1)))%LANES;
  notes.push({lane,y:-30,hit:false});
}

function press(lane){
  if(state!=='play')return;
  laneFlash[lane]=1;
  // nearest unhit note in this lane within good window
  let target=null,bestErr=999;
  for(const n of notes){ if(n.lane===lane && !n.hit){ const e=Math.abs(n.y-HITY); if(e<=GOOD && e<bestErr){ bestErr=e; target=n; } } }
  if(target){
    target.hit=true; hits++;
    const perfect=bestErr<=PERF; combo++; if(combo>bestCombo)bestCombo=combo;
    const pts=(perfect?12:7)+combo*1; score+=pts; if(score>best){best=score;saveBest();}
    momentum=Math.min(100,momentum+(perfect?5:3));
    laneJudge[lane]=perfect?'PERFECT':'GOOD'; laneJudgeT[lane]=0.7;
    dribbleT=0.35; addBeaten();
    burst(laneX(lane),HITY, perfect?'#ffd23e':LANECOL[lane], perfect?12:7);
    if(perfect)S.perfect(combo); else S.good(combo);
    // advance toward goal
    progress+=perfect?3.4:2.2;
    if(progress>=100){ scoreGoal(); }
    if(combo>0&&combo%15===0){ flash=0.2;flashCol='#eafff0'; setTimeout(S.cheer,20); }
  } else {
    // empty / mistimed press -> penalty + combo reset (punishes spamming)
    combo=0; momentum=Math.max(0,momentum-4); laneJudge[lane]='×'; laneJudgeT[lane]=0.5; S.empty();
    if(momentum<=0){ gameOver(); }
  }
}
function addBeaten(){ beaten.push({x:LANE_X0-70,y:HITY+ (Math.random()*40-20),vx:-2-Math.random()*2,vy:-1,life:1}); if(beaten.length>6)beaten.shift(); }
function scoreGoal(){ goals++; progress=0; score+=40; if(score>best){best=score;saveBest();}
  popText='ゴール！ +40'; popCol='#8effa8'; popT=1.4; flash=0.34;flashCol='#eafff0'; shakeT=10;shakeM=3; S.goal(); setTimeout(S.cheer,50);
  momentum=Math.min(100,momentum+16); burst(LANE_X0-70,HITY-20,'#eaffe0',24);
}
function noteMissed(n){
  miss++; combo=0; momentum=Math.max(0,momentum-14); S.miss(); shakeT=7;shakeM=2; flash=0.16;flashCol='#ffdede';
  laneJudge[n.lane]='MISS'; laneJudgeT[n.lane]=0.6;
  popText='見切られた！'; popCol='#ff6a5a'; popT=0.8;
  if(momentum<=0){ gameOver(); }
}
function gameOver(){ state='over'; if(score>best){best=score;saveBest();} S.over(); msg='';msgT=99999; }

function burst(x,y,col,n){ for(let i=0;i<n;i++){ const a=Math.random()*6.28,sp=1+Math.random()*4;
  parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:1,col,r:2+Math.random()*3}); } }

// ---- input ----
function toCanvas(e){ const rect=cv.getBoundingClientRect(); return {x:(e.clientX-rect.left)/rect.width*W, y:(e.clientY-rect.top)/rect.height*H}; }
cv.addEventListener('pointerdown',e=>{ e.preventDefault(); const a=ac(); if(a&&a.state==='suspended')a.resume();
  if(state==='ready'||state==='over'){ reset(); return; }
  const p=toCanvas(e);
  // on-screen buttons row at bottom OR tap within a lane column
  for(let i=0;i<LANES;i++){ const bx=laneX(i); if(Math.abs(p.x-bx)<LANEW/2 && p.y>HITY-40){ press(i); return; } }
  // also allow tapping anywhere in a lane column
  for(let i=0;i<LANES;i++){ const bx=laneX(i); if(Math.abs(p.x-bx)<LANEW/2){ press(i); return; } }
});
window.addEventListener('keydown',e=>{ if(state==='ready'||state==='over'){ if(e.code==='Space'||e.code==='Enter'){e.preventDefault();reset();} return; }
  if(e.code in KEYMAP){ e.preventDefault(); if(!e.repeat) press(KEYMAP[e.code]); } });

// ---- update ----
function update(dt){
  t+=dt; if(msgT>0)msgT--; if(flash>0)flash=Math.max(0,flash-dt*2); if(shakeT>0)shakeT--; if(popT>0)popT=Math.max(0,popT-dt*1.0);
  if(dribbleT>0)dribbleT=Math.max(0,dribbleT-dt*3);
  for(let i=0;i<LANES;i++){ if(laneFlash[i]>0)laneFlash[i]=Math.max(0,laneFlash[i]-dt*4); if(laneJudgeT[i]>0)laneJudgeT[i]=Math.max(0,laneJudgeT[i]-dt); }
  if(state==='play'){
    timeAlive+=dt; level=Math.floor(timeAlive/14);
    fallSpd=300+timeAlive*7; spawnGap=Math.max(0.30,0.62-timeAlive*0.006);
    // slow momentum bleed keeps pressure
    momentum=Math.max(0,momentum-dt*1.2); if(momentum<=0){ gameOver(); }
    spawnT+=dt; if(spawnT>=spawnGap){ spawnT=0; spawnNote(); }
    for(let i=notes.length-1;i>=0;i--){ const n=notes[i]; n.y+=fallSpd*dt;
      if(n.hit){ if(n.y>HITY+60)notes.splice(i,1); continue; }
      if(n.y>HITY+MISSPASS){ noteMissed(n); notes.splice(i,1); }
    }
  }
  for(let i=beaten.length-1;i>=0;i--){ const bd=beaten[i]; bd.x+=bd.vx; bd.y+=bd.vy; bd.vy+=0.05; bd.life-=dt*0.8; if(bd.life<=0)beaten.splice(i,1); }
  for(let i=parts.length-1;i>=0;i--){ const q=parts[i]; q.x+=q.vx;q.y+=q.vy;q.vx*=0.94;q.vy*=0.94;q.life-=dt*1.1; if(q.life<=0)parts.splice(i,1); }
}

// ---- draw ----
function rr(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }

function drawBg(){
  ctx.fillStyle='#0c1728'; ctx.fillRect(0,0,W,H);
  for(const c of crowd){ ctx.fillStyle=c.c; ctx.globalAlpha=.28; ctx.fillRect(c.x,c.y,4,3);} ctx.globalAlpha=1;
  // left pitch strip with dribbler
  const g=ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,'#1a5a34'); g.addColorStop(1,'#227a41');
  ctx.fillStyle=g; ctx.fillRect(0,90,LANE_X0-70+30,H-90);
  for(let i=0;i<8;i++){ ctx.fillStyle=i%2?'rgba(255,255,255,.04)':'rgba(0,0,0,.05)'; ctx.fillRect(0,90+i*(H-90)/8,LANE_X0-40,(H-90)/8); }
  // beaten defenders tumbling away
  for(const bd of beaten){ ctx.globalAlpha=Math.max(0,bd.life); ctx.fillStyle='#d64f48'; rr(bd.x-8,bd.y-14,16,20,5); ctx.fill(); ctx.fillStyle='#f0c39a'; ctx.beginPath(); ctx.arc(bd.x,bd.y-18,5,0,6.28); ctx.fill(); ctx.globalAlpha=1; }
  // dribbler at hit line (left of lanes)
  const dxo=dribbleT>0?Math.sin(dribbleT*10)*4:0;
  ctx.save(); ctx.translate(LANE_X0-70+dxo,HITY);
  ctx.fillStyle='rgba(0,0,0,.25)'; ctx.beginPath(); ctx.ellipse(0,20,20,6,0,0,6.28); ctx.fill();
  const rn=Math.sin(t*16)*5;
  ctx.strokeStyle='#20304a'; ctx.lineWidth=6; ctx.lineCap='round'; ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(-5-rn*0.3,20); ctx.stroke(); ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(5+rn*0.3,20); ctx.stroke();
  ctx.fillStyle='#2f7fd6'; rr(-12,-22,24,26,7); ctx.fill(); ctx.fillStyle='#f0c39a'; ctx.beginPath(); ctx.arc(0,-28,7,0,6.28); ctx.fill();
  // ball at feet
  ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(10+dxo*1.5,20,7,0,6.28); ctx.fill(); ctx.fillStyle='#1a2233'; ctx.beginPath(); ctx.arc(10+dxo*1.5,20,2.6,0,6.28); ctx.fill();
  ctx.restore();
}
function drawLanes(){
  for(let i=0;i<LANES;i++){ const cx=laneX(i), x=cx-LANEW/2;
    ctx.fillStyle='rgba(255,255,255,.04)'; rr(x,90,LANEW,H-96,6); ctx.fill();
    // hit target
    const fl=laneFlash[i];
    ctx.strokeStyle= fl>0? LANECOL[i] : 'rgba(255,255,255,.35)'; ctx.lineWidth= fl>0?4:2.5;
    rr(x+6,HITY-26,LANEW-12,52,10); ctx.stroke();
    ctx.globalAlpha=0.35+fl*0.5; ctx.fillStyle=LANECOL[i]; ctx.font='bold 30px sans-serif'; ctx.textAlign='center'; ctx.fillText(ARROWS[i],cx,HITY+11); ctx.globalAlpha=1;
    // judge text
    if(laneJudgeT[i]>0){ ctx.globalAlpha=Math.min(1,laneJudgeT[i]*2); ctx.fillStyle= laneJudge[i]==='PERFECT'?'#ffd23e':(laneJudge[i]==='GOOD'?'#8effa8':(laneJudge[i]==='MISS'?'#ff6a5a':'#c9d2dc')); ctx.font='bold 15px sans-serif'; ctx.fillText(laneJudge[i],cx,HITY-40); ctx.globalAlpha=1; }
    ctx.textAlign='left';
  }
  // notes
  for(const n of notes){ if(n.hit)continue; const cx=laneX(n.lane);
    ctx.fillStyle=LANECOL[n.lane]; rr(cx-LANEW/2+8,n.y-22,LANEW-16,44,10); ctx.fill();
    ctx.fillStyle='#0a1420'; ctx.font='bold 26px sans-serif'; ctx.textAlign='center'; ctx.fillText(ARROWS[n.lane],cx,n.y+9); ctx.textAlign='left';
  }
}
function drawPop(){ if(popT>0&&popText){ ctx.textAlign='center'; ctx.globalAlpha=Math.min(1,popT*1.1); ctx.font='bold 30px sans-serif'; ctx.fillStyle=popCol; ctx.fillText(popText,W/2,180); ctx.globalAlpha=1; ctx.textAlign='left'; } }
function drawHUD(){
  ctx.fillStyle='rgba(6,14,24,.6)'; rr(20,18,160,54,9); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.6)'; ctx.font='11px sans-serif'; ctx.fillText('スコア SCORE',32,37); ctx.fillStyle='#8effa8'; ctx.font='bold 24px sans-serif'; ctx.fillText(''+score,32,62);
  ctx.textAlign='center'; ctx.fillStyle='rgba(255,255,255,.85)'; ctx.font='bold 15px sans-serif'; ctx.fillText('ゴール '+goals,W/2,32);
  if(combo>=3){ ctx.fillStyle='#ffd23e'; ctx.font='bold 20px sans-serif'; ctx.fillText(combo+' COMBO',W/2,58); } ctx.textAlign='left';
  // momentum bar (possession)
  ctx.fillStyle='rgba(6,14,24,.6)'; rr(W-230,18,210,54,9); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.6)'; ctx.font='11px sans-serif'; ctx.fillText('キープ MOMENTUM',W-218,36);
  ctx.fillStyle='rgba(0,0,0,.4)'; rr(W-218,44,186,12,6); ctx.fill();
  const mc= momentum<25?'#ff6a5a':(momentum<55?'#ffd23e':'#8effa8'); ctx.fillStyle=mc; rr(W-218,44,186*momentum/100,12,6); ctx.fill();
  // progress toward goal
  ctx.fillStyle='rgba(255,255,255,.5)'; ctx.font='11px sans-serif'; ctx.textAlign='right'; ctx.fillText('自己ベスト '+best,W-24,86); ctx.textAlign='left';
  // goal progress vertical hint on far left
  ctx.fillStyle='rgba(0,0,0,.35)'; rr(14,100,8,H-120,4); ctx.fill(); ctx.fillStyle='#8effa8'; rr(14,100+(H-120)*(1-progress/100),8,(H-120)*progress/100,4); ctx.fill();
}
function drawMsg(){ if(msgT>0&&msg){ ctx.textAlign='center'; ctx.font='bold 17px sans-serif'; const w=ctx.measureText(msg).width;
  ctx.fillStyle='rgba(6,14,24,.72)'; rr(W/2-w/2-14,H-30,w+28,24,8); ctx.fillStyle='rgba(6,14,24,.72)'; ctx.fill(); ctx.fillStyle='#fff'; ctx.fillText(msg,W/2,H-13); ctx.textAlign='left'; } }
function drawOverlay(){
  ctx.fillStyle='rgba(6,12,22,.82)'; ctx.fillRect(0,0,W,H); ctx.textAlign='center';
  ctx.fillStyle='rgba(140,255,168,.9)'; ctx.font='600 15px sans-serif'; ctx.fillText('SOCCER · SKILL DRIBBLE',450,108);
  ctx.fillStyle='#fff'; ctx.font='bold 50px sans-serif'; ctx.fillText('スキルドリブル',450,166);
  ctx.fillStyle='#ffd23e'; ctx.font='bold 21px sans-serif'; ctx.fillText('Skill Dribble', 450,198);
  ctx.fillStyle='rgba(255,255,255,.9)'; ctx.font='16px sans-serif';
  const L=['落ちてくる矢印がラインに重なった瞬間に同じ方向を入力！',
    '←↑↓→キー、または各レーンをタップ。ジャストで PERFECT。',
    '決めるほどキープ（勢い）が上がり、抜き去って前進。',
    'ゲージが満タンでゴール＝大量得点。連続でボーナス。',
    '見切られる（ミス）や空打ちでキープ減少。0でタックル＝終了。'];
  for(let i=0;i<L.length;i++) ctx.fillText(L[i],450,238+i*25);
  ctx.fillStyle='#e8544e'; rr(450-95,392,190,54,27); ctx.fill();
  ctx.fillStyle='#fff'; ctx.font='bold 24px sans-serif'; ctx.fillText('キックオフ',450,426);
  ctx.fillStyle='rgba(255,255,255,.6)'; ctx.font='14px sans-serif'; ctx.fillText('タップ／スペースで開始',450,470);
  ctx.textAlign='left';
}
function drawOver(){
  ctx.fillStyle='rgba(6,12,22,.88)'; ctx.fillRect(0,0,W,H); ctx.textAlign='center';
  ctx.fillStyle='#fff'; ctx.font='bold 46px sans-serif'; ctx.fillText('タックルされた', 450,206);
  ctx.fillStyle='#8effa8'; ctx.font='bold 34px sans-serif'; ctx.fillText('スコア '+score,450,266);
  ctx.fillStyle='#ffd23e'; ctx.font='19px sans-serif'; ctx.fillText('ゴール '+goals+'　最高コンボ '+bestCombo,450,300);
  ctx.fillStyle='#ffd23e'; ctx.font='20px sans-serif'; ctx.fillText('自己ベスト '+best,450,332);
  ctx.fillStyle='#2f7fd6'; rr(450-95,374,190,54,27); ctx.fill();
  ctx.fillStyle='#fff'; ctx.font='bold 22px sans-serif'; ctx.fillText('もう一度',450,408);
  ctx.textAlign='left';
}

function render(){
  ctx.save();
  if(shakeT>0){ ctx.translate((Math.random()*2-1)*shakeM,(Math.random()*2-1)*shakeM); }
  drawBg(); drawLanes();
  for(const q of parts){ ctx.globalAlpha=Math.max(0,q.life); ctx.fillStyle=q.col; ctx.beginPath(); ctx.arc(q.x,q.y,q.r,0,6.28); ctx.fill(); }
  ctx.globalAlpha=1;
  drawPop(); drawHUD(); drawMsg();
  ctx.restore();
  if(flash>0){ ctx.fillStyle=flashCol; ctx.globalAlpha=flash; ctx.fillRect(0,0,W,H); ctx.globalAlpha=1; }
  if(state==='ready') drawOverlay();
  if(state==='over') drawOver();
}
let last=0;
function loop(ts){ if(!last)last=ts; let dt=(ts-last)/1000; last=ts; if(dt>0.05)dt=0.05; update(dt); render(); requestAnimationFrame(loop); }
requestAnimationFrame(loop);

if(TEST){
  window.__sk={
    get state(){return state;},
    get notes(){return notes.filter(n=>!n.hit).map(n=>({lane:n.lane,y:n.y}));},
    get hitY(){return HITY;},
    get win(){return {PERF,GOOD,MISSPASS};},
    get count(){return {score,combo,hits,miss,momentum:+momentum.toFixed(1),goals,progress:+progress.toFixed(1)};},
    press(l){ press(l); },
    tap(){ if(state==='ready'||state==='over')reset(); }
  };
}
})();
</script>
</body>
</html>
