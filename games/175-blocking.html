<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ブロッキング (Block the Dirt)</title>
<style>
  html,body{margin:0;height:100%;background:#0a1018;overflow:hidden;
    font-family:-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  #stage{position:relative;width:100vw;height:100vh;max-width:calc(100vh*1.5);max-height:calc(100vw/1.5);aspect-ratio:900/600;}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;border-radius:6px;}
</style>
</head>
<body>
<div id="wrap"><div id="stage"><canvas id="cv"></canvas></div></div>
<script>
(function(){
const W=900,H=600,cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let DPR=1;
function fit(){DPR=Math.min(2,window.devicePixelRatio||1);cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
fit();addEventListener('resize',fit);

// ---------- audio ----------
let AC=null;function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function tone(f,d,type,v,sweep){const a=ac();if(!a)return;const t=a.currentTime,o=a.createOscillator(),g=a.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(sweep)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+sweep),t+d);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v||0.2,t+0.008);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+0.02);}
function noise(d,v,hp){const a=ac();if(!a)return;const t=a.currentTime,n=Math.floor(a.sampleRate*d),buf=a.createBuffer(1,n,a.sampleRate),ch=buf.getChannelData(0);
  for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource();s.buffer=buf;
  const f=a.createBiquadFilter();f.type='highpass';f.frequency.value=hp||600;const g=a.createGain();g.gain.value=v||0.2;
  s.connect(f);f.connect(g);g.connect(a.destination);s.start(t);s.stop(t+d+0.02);}
const S={
  block:()=>{noise(0.12,0.3,300);tone(180,0.12,'square',0.14,-40);},
  smother:()=>{noise(0.09,0.26,400);[520,700,920].forEach((f,i)=>setTimeout(()=>tone(f,0.11,'triangle',0.18),i*55));},
  katch:()=>{tone(420,0.07,'square',0.16);noise(0.05,0.14,900);},
  pass:()=>{tone(240,0.3,'sawtooth',0.2,-120);setTimeout(()=>tone(170,0.3,'sawtooth',0.16,-70),120);},
  bounce:()=>{tone(300,0.05,'sine',0.1);noise(0.04,0.1,600);},
  over:()=>{[440,330,247,175].forEach((f,i)=>setTimeout(()=>tone(f,0.3,'triangle',0.2),i*160));},
  pitch:()=>{noise(0.04,0.08,1400);}
};

// ---------- geometry ----------
const TOP={x:450,y:104};
const BOUNCE_Y=392, BLOCK_Y=458, CATCH_Y=414;
const LANDX={L:372, C:450, R:528};
const CAT_Y=498;

// ---------- state ----------
let state='title', phase='ready', t=0, pitchN=0;
let score=0, combo=0, best=+(localStorage.getItem('blocking_best')||0);
let stops=0, passes=0, lvl=1;
let P=null, chosen=null, chosenT=-1, result=null, resultT=0, msg='', msg2='';
let glove={x:450,y:CAT_Y-8,tx:450,ty:CAT_Y-8};
let shake=0, flash=0, flashCol='#fff', last=performance.now();
let parts=[], pops=[], trail=[];

function rnd(a,b){return a+Math.random()*(b-a);}
function chance(p){return Math.random()<p;}
function clamp(v,a,b){return v<a?a:v>b?b:v;}

function reset(){state='title';score=0;combo=0;stops=0;passes=0;lvl=1;pitchN=0;P=null;result=null;parts=[];pops=[];trail=[];}

function newPitch(){
  pitchN++;
  lvl=Math.min(6,1+Math.floor(pitchN/4));
  const chest=chance(0.22);
  let type,req,side='C';
  if(chest){ type='chest'; req='U'; }
  else { side=['L','C','R'][Math.floor(rnd(0,3))]; type='dirt'; req=side; }
  const dur=Math.max(560,940-lvl*66);
  const badhop = !chest && lvl>=4 && chance(0.22);
  P={type,req,side,dur,t:0,badhop,bounced:false,commitP:chest?0.58:0.70,
     bx:TOP.x,by:TOP.y,bounceHop:0};
  chosen=null; chosenT=-1; result=null; trail=[];
  phase='pitch'; t=0;
  msg=''; msg2='';
}

function start(){ if(!ac())ac(); if(AC&&AC.state==='suspended')AC.resume(); reset(); state='play'; newPitch(); }

// ---------- respond ----------
function respond(a){
  if(state==='title'){start();return;}
  if(state==='over'){ if(resultT>0.5){reset();start();} return; }
  if(state!=='play'||phase!=='pitch'||!P) return;
  chosen=a; chosenT=P.t/P.dur;
  // move glove toward chosen
  if(a==='U'){glove.tx=450;glove.ty=CATCH_Y;}
  else {glove.tx=LANDX[a];glove.ty=(a==='C')?BLOCK_Y-4:BLOCK_Y-2;}
}

function endY(){ return P.type==='chest'?CATCH_Y:BLOCK_Y; }
function reqLandX(){ return P.type==='chest'?450:LANDX[P.side]; }

function resolve(){
  phase='resolve'; resultT=0;
  const correct = chosen===P.req;
  const lx=reqLandX(), ly=endY();
  if(correct){
    const fast = chosenT>P.commitP && chosenT < P.commitP+0.14;
    const isCatch=P.type==='chest';
    result=isCatch?'catch':(fast?'smother':'stop');
    combo++; const mult=1+Math.min(5,combo-1)*0.22;
    const base=isCatch?90:(fast?170:120);
    const add=Math.round(base*mult);
    score+=add; stops++;
    if(isCatch)S.katch(); else if(fast)S.smother(); else S.block();
    flash=1;flashCol=fast?'#8ff0b8':'#bfe8ff'; shake=fast?12:7;
    burst(lx,ly,fast?'#8ff0b8':'#cfe8ff',fast?28:18,6);
    pop(lx,ly-30,(isCatch?'キャッチ！ ':(fast?'ナイスブロック！ ':'止めた！ '))+'+'+add, '#eaffef');
    if(combo>=2)pop(lx,ly-54,'コンボ x'+combo,'#ffe08a');
    msg=isCatch?'ズバッとキャッチ！':(fast?'見事なブロック！ 体で止めた':'ブロック成功！ 前に落とした'); msg2='';
  } else {
    combo=0; passes++;
    result='pass';
    S.pass();
    flash=1;flashCol='#ff5b5b'; shake=12;
    burst(lx,ly,'#ff8a8a',18,6);
    if(chosen==null) msg='後逸！ 反応できず';
    else if(P.type==='chest') msg='むだに落とした！ 胸元は捕球';
    else msg='逆をつかれた！ 後逸';
    msg2='走者を進塁させた';
    pop(lx,ly-26,'パスボール','#ffb3b3');
  }
}

// ---------- input ----------
addEventListener('keydown',e=>{
  if(e.code==='ArrowLeft'){e.preventDefault();respond('L');}
  else if(e.code==='ArrowRight'){e.preventDefault();respond('R');}
  else if(e.code==='ArrowDown'){e.preventDefault();respond('C');}
  else if(e.code==='ArrowUp'||e.code==='Space'){e.preventDefault();respond('U');}
});
cv.addEventListener('pointerdown',e=>{
  e.preventDefault();
  if(state==='title'||state==='over'){respond('X');return;}
  const r=cv.getBoundingClientRect();
  const x=((e.clientX-r.left)/r.width)*W, y=((e.clientY-r.top)/r.height)*H;
  if(y<H*0.5){ respond('U'); }
  else if(x<W*0.36){ respond('L'); }
  else if(x>W*0.64){ respond('R'); }
  else { respond('C'); }
});

// ---------- particles ----------
function burst(x,y,c,n,sp){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=rnd(sp*0.3,sp);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:1,c});}}
function pop(x,y,txt,c){pops.push({x,y,txt,c,life:1});}

// ---------- update ----------
function update(dt){
  shake*=Math.pow(0.86,dt/16.7); if(shake<0.3)shake=0;
  flash*=Math.pow(0.9,dt/16.7);
  for(const p of parts){p.vx*=0.96;p.vy=p.vy*0.96+0.3;p.x+=p.vx*dt/16.7;p.y+=p.vy*dt/16.7;p.life-=dt/16.7*0.028;}
  parts=parts.filter(p=>p.life>0);
  for(const p of pops){p.y-=dt/16.7*0.5;p.life-=dt/16.7*0.02;}
  pops=pops.filter(p=>p.life>0);
  // ease glove
  glove.x+=(glove.tx-glove.x)*Math.min(1,dt/16.7*0.4);
  glove.y+=(glove.ty-glove.y)*Math.min(1,dt/16.7*0.4);

  if(state!=='play'){ if(state==='over')resultT+=dt/1000; return; }
  t+=dt;

  if(phase==='pitch'){
    P.t+=dt; const p=clamp(P.t/P.dur,0,1);
    if(P.type==='chest'){
      P.bx=TOP.x; P.by=TOP.y+(CATCH_Y-TOP.y)*p;
    } else {
      const pb=0.70;
      if(p<pb){ P.bx=TOP.x+(LANDX[P.side]-TOP.x)*0.12*(p/pb); P.by=TOP.y+(BOUNCE_Y-TOP.y)*(p/pb); }
      else {
        if(!P.bounced){P.bounced=true;P.bounceHop=1;S.bounce();
          if(P.badhop && chance(1)){ /* flip side visually late */ }
        }
        const q=(p-pb)/(1-pb);
        // bad hop: change side at q=0.5
        let side=P.side;
        P.bx=TOP.x+(LANDX[side]-TOP.x)*(0.12+0.88*q);
        P.by=BOUNCE_Y+(BLOCK_Y-BOUNCE_Y)*q - Math.sin(q*Math.PI)*18;
      }
    }
    P.bounceHop*=Math.pow(0.9,dt/16.7);
    trail.push({x:P.bx,y:P.by}); if(trail.length>10)trail.shift();
    if(p>=1){ resolve(); }
    return;
  }
  if(phase==='resolve'){
    resultT+=dt/1000;
    if(resultT>0.9){
      if(passes>=3){ state='over'; resultT=0; S.over(); if(score>best){best=score;localStorage.setItem('blocking_best',best);} }
      else { glove.tx=450; glove.ty=CAT_Y-8; newPitch(); }
    }
    return;
  }
}

// ---------- render ----------
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

function drawScene(){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#14243a');g.addColorStop(0.55,'#3a2a1c');g.addColorStop(1,'#5a3a22');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  // dirt circle around plate
  ctx.fillStyle='rgba(150,95,55,0.55)';ctx.beginPath();ctx.ellipse(450,470,300,150,0,0,6.28);ctx.fill();
  // pitcher mound top
  ctx.fillStyle='rgba(160,110,70,0.6)';ctx.beginPath();ctx.ellipse(450,110,60,22,0,0,6.28);ctx.fill();
  // home plate
  ctx.fillStyle='#eee';ctx.beginPath();
  ctx.moveTo(450,494);ctx.lineTo(410,476);ctx.lineTo(410,462);ctx.lineTo(490,462);ctx.lineTo(490,476);ctx.closePath();ctx.fill();
  // batter box hints
  ctx.strokeStyle='rgba(255,255,255,0.18)';ctx.lineWidth=2;
  ctx.strokeRect(330,430,44,90);ctx.strokeRect(526,430,44,90);
  // zone lanes hint (subtle)
  if(state==='play'){
    ctx.fillStyle='rgba(255,255,255,0.04)';
    ctx.fillRect(300,BLOCK_Y-10,300,26);
  }
}

function drawPitcher(){
  ctx.save();ctx.translate(450,90);
  ctx.fillStyle='#e8ebef';rr(-9,-16,18,24,6);ctx.fill();
  ctx.fillStyle='#f2c9a0';ctx.beginPath();ctx.arc(0,-22,7,0,6.28);ctx.fill();
  ctx.restore();
}

function drawCatcher(){
  // catcher at bottom center, gear
  const cx=450, cy=CAT_Y;
  ctx.fillStyle='rgba(0,0,0,0.25)';ctx.beginPath();ctx.ellipse(cx,cy+22,26,7,0,0,6.28);ctx.fill();
  // legs squat
  ctx.fillStyle='#1f6d8c';
  rr(cx-24,cy+2,16,20,5);ctx.fill(); rr(cx+8,cy+2,16,20,5);ctx.fill();
  // body
  ctx.fillStyle='#2a86a8'; rr(cx-18,cy-20,36,30,8);ctx.fill();
  // chest protector
  ctx.fillStyle='#1c5f78';rr(cx-13,cy-16,26,22,6);ctx.fill();
  // head/mask
  ctx.fillStyle='#f2c9a0';ctx.beginPath();ctx.arc(cx,cy-28,9,0,6.28);ctx.fill();
  ctx.strokeStyle='#333';ctx.lineWidth=1.6;
  for(let i=-1;i<=1;i++){ctx.beginPath();ctx.moveTo(cx+i*5,cy-36);ctx.lineTo(cx+i*5,cy-20);ctx.stroke();}
  ctx.beginPath();ctx.moveTo(cx-8,cy-30);ctx.lineTo(cx+8,cy-30);ctx.stroke();
  // glove/mitt (reacts)
  ctx.fillStyle='#6a3f22';ctx.beginPath();ctx.arc(glove.x,glove.y,13,0,6.28);ctx.fill();
  ctx.fillStyle='#5a3218';ctx.beginPath();ctx.arc(glove.x,glove.y,13,-0.4,1.6);ctx.fill();
}

function drawBall(){
  if(state!=='play'||!P)return;
  for(let i=0;i<trail.length;i++){const a=i/trail.length;ctx.globalAlpha=a*0.3;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(trail[i].x,trail[i].y,4+a*2,0,6.28);ctx.fill();}
  ctx.globalAlpha=1;
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(P.bx,P.by,8,0,6.28);ctx.fill();
  ctx.strokeStyle='#c33';ctx.lineWidth=1.4;ctx.beginPath();ctx.arc(P.bx,P.by,8,0.4,2.3);ctx.stroke();
  // bounce splash
  if(P.bounced && P.bounceHop>0.1){ ctx.globalAlpha=P.bounceHop*0.6;ctx.strokeStyle='#e8c48a';ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(LANDX[P.side]*0+TOP.x+(LANDX[P.side]-TOP.x)*0.12, BOUNCE_Y, 14*(1.2-P.bounceHop),0,6.28);ctx.stroke();ctx.globalAlpha=1; }
}

function drawCueArrows(){
  if(state!=='play'||!P||phase!=='pitch')return;
  const p=P.t/P.dur;
  if(p<P.commitP)return; // cue appears once committed (bounce / recognized)
  // show which response is needed as a fading hint (fades out at high lvl)
  if(lvl>=4)return;
  ctx.globalAlpha=0.5;
  ctx.fillStyle=P.req==='U'?'#8ff0b8':'#ffe08a';
  ctx.font='bold 30px sans-serif';ctx.textAlign='center';
  const map={L:'◀ 左',R:'右 ▶',C:'▼ 中',U:'▲ 捕'};
  ctx.fillText(map[P.req], P.req==='L'?250:P.req==='R'?650:450, 250);
  ctx.globalAlpha=1;
}

function drawHUD(){
  ctx.textAlign='left';ctx.fillStyle='#fff';ctx.font='bold 26px sans-serif';
  ctx.fillText('SCORE '+score,20,36);
  ctx.textAlign='right';ctx.fillStyle='rgba(255,255,255,0.85)';ctx.font='14px sans-serif';
  ctx.fillText('ストップ '+stops+'  Lv.'+lvl,W-20,26);
  ctx.fillText('後逸',W-92,50);
  for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(W-66+i*22,46,7,0,6.28);ctx.fillStyle=i<passes?'#ff5b5b':'rgba(255,255,255,0.25)';ctx.fill();}
  if(combo>=2){ctx.textAlign='left';ctx.fillStyle='#ffe08a';ctx.font='bold 18px sans-serif';ctx.fillText('コンボ x'+combo,20,60);}
}

function render(){
  ctx.save();
  if(shake>0)ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
  drawScene();
  drawPitcher();
  drawCueArrows();
  drawBall();
  drawCatcher();

  for(const p of parts){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,3.2,0,6.28);ctx.fill();}
  ctx.globalAlpha=1;
  for(const p of pops){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.font='bold 22px sans-serif';ctx.textAlign='center';ctx.fillText(p.txt,p.x,p.y);}
  ctx.globalAlpha=1;

  drawHUD();

  if(state==='play'&&(msg||msg2)){
    ctx.textAlign='center';
    const good=result==='';
    ctx.fillStyle=result?((result==='pass')?'#ff9a9a':'#8ff0b8'):'rgba(255,255,255,0.92)';
    // color by pass vs success
    if(msg.indexOf('後逸')>=0||msg.indexOf('むだ')>=0||msg.indexOf('逆')>=0) ctx.fillStyle='#ff9a9a'; else if(result) ctx.fillStyle='#8ff0b8';
    ctx.font='bold 28px sans-serif';ctx.fillText(msg,W/2,150);
    if(msg2){ctx.fillStyle='rgba(255,255,255,0.72)';ctx.font='16px sans-serif';ctx.fillText(msg2,W/2,180);}
  }

  if(state==='title'){
    ctx.fillStyle='rgba(6,10,18,0.66)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='bold 50px sans-serif';ctx.fillText('ブロッキング',W/2,206);
    ctx.fillStyle='#8ff0b8';ctx.font='bold 22px sans-serif';ctx.fillText('Block the Dirt',W/2,242);
    ctx.fillStyle='rgba(255,255,255,0.9)';ctx.font='18px sans-serif';
    ctx.fillText('ワンバウンドが跳ねた方向へ即ブロック！',W/2,304);
    ctx.fillText('← 左 / ▼下 中 / → 右 、胸元の球は ↑/SPACE で捕球',W/2,332);
    ctx.fillStyle='rgba(255,255,255,0.66)';ctx.font='15px sans-serif';
    ctx.fillText('タップ：下段の左/中/右でブロック、上半分で捕球。逆・遅れ・むだ落としは後逸',W/2,374);
    ctx.fillText('素早い正面ブロックはスマザーで高得点。3後逸で交代',W/2,398);
    ctx.fillStyle='#ffe08a';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で開始',W/2,454);
    ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='14px sans-serif';ctx.fillText('BEST '+best,W/2,486);
  }
  if(state==='over'){
    ctx.fillStyle='rgba(6,10,18,0.74)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#ff6b6b';ctx.font='bold 46px sans-serif';ctx.fillText('3後逸…交代',W/2,230);
    ctx.fillStyle='#fff';ctx.font='bold 40px sans-serif';ctx.fillText('SCORE '+score,W/2,296);
    ctx.fillStyle='rgba(255,255,255,0.85)';ctx.font='20px sans-serif';ctx.fillText('ストップ '+stops+'   BEST '+best,W/2,336);
    ctx.fillStyle='#8ff0b8';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で もう一度',W/2,408);
  }

  if(flash>0.02){ctx.globalAlpha=flash*0.5;ctx.fillStyle=flashCol;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}
  ctx.restore();

  ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,0.4)';ctx.font='13px sans-serif';
  ctx.fillText('跳ねた方向へ ←/▼/→ でブロック、胸元は ↑ で捕球。逆・遅れは後逸。3後逸で交代',W/2,H-8);
}

function frame(ts){let dt=ts-last;last=ts;if(dt>60)dt=60;if(dt<0)dt=0;update(dt);render();requestAnimationFrame(frame);}
requestAnimationFrame(frame);

// ---------- test hook ----------
window.__bk={
  start, respond,
  get state(){return state;},
  get score(){return score;},
  get stops(){return stops;},
  get passes(){return passes;},
  get info(){return {state,phase,t:P?P.t/P.dur:0, req:P?P.req:null, type:P?P.type:null,
    commitP:P?P.commitP:0, chosen, passes, stops, lvl, result};}
};
})();
</script>
</body>
</html>
