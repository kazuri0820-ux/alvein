<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>コースを突け (Pick Your Spot)</title>
<style>
  html,body{margin:0;height:100%;background:#07100a;overflow:hidden;
    font-family:-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  #stage{position:relative;width:100vw;height:100vh;max-width:calc(100vh*1.5);max-height:calc(100vw/1.5);aspect-ratio:900/600;}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;border-radius:6px;}
</style>
</head>
<body>
<div id="wrap"><div id="stage"><canvas id="cv"></canvas></div></div>
<script>
(function(){
const W=900,H=600,cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let DPR=1;
function fit(){DPR=Math.min(2,window.devicePixelRatio||1);cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
fit();addEventListener('resize',fit);

// ---------- audio ----------
let AC=null;function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function tone(f,d,type,v,sweep){const a=ac();if(!a)return;const t=a.currentTime,o=a.createOscillator(),g=a.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(sweep)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+sweep),t+d);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v||0.2,t+0.008);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+0.02);}
function noise(d,v,hp){const a=ac();if(!a)return;const t=a.currentTime,n=Math.floor(a.sampleRate*d),buf=a.createBuffer(1,n,a.sampleRate),ch=buf.getChannelData(0);
  for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource();s.buffer=buf;
  const f=a.createBiquadFilter();f.type='highpass';f.frequency.value=hp||600;const g=a.createGain();g.gain.value=v||0.2;
  s.connect(f);f.connect(g);g.connect(a.destination);s.start(t);s.stop(t+d+0.02);}
const S={
  tick:()=>{tone(1150,0.015,'square',0.03);},
  kick:()=>{noise(0.05,0.15,380);tone(300,0.06,'square',0.09,150);},
  goal:()=>{[620,880,1150].forEach((f,i)=>setTimeout(()=>tone(f,0.11,'triangle',0.16),i*54));},
  screamer:()=>{noise(0.06,0.16,600);[560,820,1080,1360].forEach((f,i)=>setTimeout(()=>tone(f,0.12,'triangle',0.18),i*52));},
  save:()=>{noise(0.16,0.22,240);tone(160,0.24,'sawtooth',0.13,-60);},
  streak:()=>{[700,930,1170,1400].forEach((f,i)=>setTimeout(()=>tone(f,0.1,'triangle',0.16),i*60));},
  over:()=>{[440,330,247,175].forEach((f,i)=>setTimeout(()=>tone(f,0.3,'triangle',0.2),i*160));}
};

// ---------- geometry ----------
const GOAL_L=262, GOAL_R=638, GOAL_TOP=96, GOAL_LINE=158;
const SHOOT={x:450,y:558};
const BARX=W/2-190, BARY=468, BARW=380, BARH=22;
function goalX(p){return lerp(GOAL_L+10,GOAL_R-10,p);}

// ---------- state ----------
let state='title', phase='aim', plays=0;
let score=0, combo=0, best=+(localStorage.getItem('ps_best')||0);
let outs=0, fails=0, lvl=1;   // outs = goals
let clock=0, oscT=0, P=1000, hb=0.15, Tdl=1650;
let pos=0.5, bandC=0.5, gkSide='left', released=false, relPos=0, result=null, resultT=0, msg='', msgOk=false, quality=0, gone=0;
let shake=0, flash=0, flashCol='#fff', last=performance.now(), lastTick=-1;
let parts=[], pops=[], netR=0;

function rnd(a,b){return a+Math.random()*(b-a);}
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function lerp(a,b,u){return a+(b-a)*u;}
function easeOut(u){return 1-Math.pow(1-u,2);}

function reset(){state='title';score=0;combo=0;outs=0;fails=0;lvl=1;plays=0;result=null;parts=[];pops=[];}

function newPlay(){
  plays++; lvl=Math.min(7,1+Math.floor(outs/4));
  P=clamp(1250-lvl*45,940,1250);            // sweep period (ms) — faster at high lvl
  hb=clamp(0.23-lvl*0.009,0.17,0.23);       // open-band half width — narrower at high lvl
  Tdl=clamp(2000-lvl*80,1400,2000);         // GK closes down (deadline)
  gkSide=Math.random()<0.5?'left':'right';
  bandC=(gkSide==='left')?0.68:0.32;        // GK covers one side -> open band on the other
  phase='aim'; clock=0; oscT=rnd(0,P); pos=0.5; released=false; relPos=0; result=null; resultT=0; msg=''; msgOk=false; quality=0; gone=0; netR=0;
}
function start(){ if(!ac())ac(); if(AC&&AC.state==='suspended')AC.resume(); reset(); state='play'; newPlay(); }

function fire(){
  if(state==='title'){start();return;}
  if(state==='over'){ if(resultT>0.4){reset();start();} return; }
  if(state!=='play'||phase!=='aim'||released) return;
  released=true; relPos=pos; S.kick();
  const off=Math.abs(pos-bandC);
  if(off<=hb){ quality=1-off/hb; resolve('goal'); }
  else if((gkSide==='left'&&pos<bandC-hb)||(gkSide==='right'&&pos>bandC+hb)) resolve('save');
  else resolve('wide');
}

function resolve(k){
  phase='result'; result=k; resultT=0; gone=0;
  if(k==='goal'){
    outs++; combo++;
    const perfect=quality>=0.72;
    let add=Math.round((perfect?240:130)*(1+Math.min(9,combo-1)*0.14)); score+=add;
    setTimeout(perfect?S.screamer:S.goal,90); if(perfect)setTimeout(S.streak,0);
    msgOk=true; flash=1;flashCol='#8affa0';shake=5;
    pop(W/2,246,(perfect?'空いた隅へ矢のような一撃！ゴール！ +':'GKの逆を突いてゴール！ +')+add,'#d6ffe0');
    if(combo>=2&&!perfect)pop(W/2,210,'コンボ x'+combo,'#ffd24d');
    msg=perfect?'GKが触れない隅へズドン——完璧なコースへ突き刺した！':'空いた逆サイドへ冷静に流し込み——GKの届かないコースへ！';
  } else {
    fails++; combo=0; msgOk=false; flash=1;flashCol='#ff5b5b';shake=8; S.save();
    if(k==='save') msg='GKの正面……守った側へ飛ばしてしまい、弾かれてセーブ。';
    else if(k==='wide') msg='狙いすぎて枠の外へ……ポストの脇へ外した。';
    else msg='撃ち遅れ……飛び出したGKに間合いを詰められて防がれた。';
    pop(W/2,246,(k==='save')?'セーブ…':(k==='wide')?'枠外…':'詰められた…','#ffb0b0');
  }
  if(fails>=3){ state='over'; resultT=0; S.over(); if(score>best){best=score;localStorage.setItem('ps_best',best);} }
}

// ---------- input ----------
cv.addEventListener('pointerdown',e=>{e.preventDefault();fire();});
addEventListener('keydown',e=>{ if(e.repeat)return;
  if(e.code==='Space'||e.code==='Enter'||e.code==='ArrowUp'||e.code==='KeyF'||e.code==='KeyJ'){e.preventDefault();fire();} });

// ---------- particles ----------
function burst(x,y,c,n,sp){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=rnd(sp*0.3,sp);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:1,c});}}
function pop(x,y,txt,c){pops.push({x,y,txt,c,life:1});}

// covered-zone center (where the GK stands)
function gkCenter(){ return (gkSide==='left') ? (bandC-hb)*0.5 : (bandC+hb+1)*0.5; }

// ---------- update ----------
function update(dt){
  shake*=Math.pow(0.86,dt/16.7); if(shake<0.3)shake=0;
  flash*=Math.pow(0.9,dt/16.7); if(netR>0)netR*=Math.pow(0.9,dt/16.7);
  for(const q of parts){q.vx*=0.96;q.vy=q.vy*0.96+0.28;q.x+=q.vx*dt/16.7;q.y+=q.vy*dt/16.7;q.life-=dt/16.7*0.026;}
  parts=parts.filter(q=>q.life>0);
  for(const q of pops){q.y-=dt/16.7*0.5;q.life-=dt/16.7*0.02;}
  pops=pops.filter(q=>q.life>0);

  if(state!=='play'){ if(state==='over')resultT+=dt/1000; return; }
  if(phase==='aim'){ clock+=dt; oscT+=dt;
    const ph=(oscT%P)/P; pos=1-Math.abs(2*ph-1);   // triangle sweep 0->1->0
    const inb=Math.abs(pos-bandC)<=hb; const tk=inb?1:0; if(tk!==lastTick){lastTick=tk; if(inb)S.tick();}
    if(!released && clock>=Tdl){ released=true; relPos=pos; resolve('smother'); }
    return; }
  if(phase==='result'){ resultT+=dt/1000; const pg=gone; gone=Math.min(1,gone+dt/380);
    if(pg<1&&gone>=1&&result==='goal'){ netR=1; burst(goalX(relPos),GOAL_LINE-4,'#8affa0',16,6); }
    if(resultT>1.4) newPlay(); return; }
}

// ---------- render ----------
function figure(x,y,col,sc,lean){ sc=sc||1;lean=lean||0;
  ctx.fillStyle='rgba(0,0,0,0.22)';ctx.beginPath();ctx.ellipse(x,y+13*sc,12*sc,4*sc,0,0,6.28);ctx.fill();
  ctx.save();ctx.translate(x,y);ctx.rotate(lean);
  ctx.fillStyle=col;ctx.beginPath();ctx.ellipse(0,-15*sc,10*sc,15*sc,0,0,6.28);ctx.fill();
  ctx.fillStyle='#f0c9a0';ctx.beginPath();ctx.arc(0,-34*sc,7.5*sc,0,6.28);ctx.fill();
  ctx.restore();
}
function drawGK(x,dive,cover){
  // arms-out keeper; dive = horizontal lean during a save
  ctx.save();ctx.translate(x,GOAL_LINE-6);ctx.rotate(dive*0.5);
  ctx.strokeStyle='#ffd23e';ctx.lineWidth=5;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(-16,-20);ctx.lineTo(16,-20);ctx.stroke();   // arms
  ctx.fillStyle='#ff5b3a';ctx.beginPath();ctx.ellipse(0,-14,10,17,0,0,6.28);ctx.fill();  // body
  ctx.fillStyle='#f0c9a0';ctx.beginPath();ctx.arc(0,-36,7.5,0,6.28);ctx.fill();          // head
  ctx.restore();
}
function drawScene(){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#123f26');g.addColorStop(0.45,'#187038');g.addColorStop(1,'#0f5a2c');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  // mow stripes
  ctx.fillStyle='rgba(255,255,255,0.03)';
  for(let i=0;i<6;i++)ctx.fillRect(0,200+i*70,W,35);
  // penalty box
  ctx.strokeStyle='rgba(255,255,255,0.35)';ctx.lineWidth=3;
  ctx.strokeRect(GOAL_L-96,GOAL_LINE,GOAL_R-GOAL_L+192,214);
  ctx.strokeRect(GOAL_L+58,GOAL_LINE,GOAL_R-GOAL_L-116,74);
  // goal: net, posts, crossbar
  ctx.fillStyle='rgba(255,255,255,0.08)';ctx.fillRect(GOAL_L,GOAL_TOP,GOAL_R-GOAL_L,GOAL_LINE-GOAL_TOP);
  ctx.strokeStyle='rgba(255,255,255,0.18)';ctx.lineWidth=1;
  for(let x=GOAL_L+14;x<GOAL_R;x+=14){ctx.beginPath();ctx.moveTo(x,GOAL_TOP);ctx.lineTo(x,GOAL_LINE);ctx.stroke();}
  for(let y=GOAL_TOP+12;y<GOAL_LINE;y+=12){ctx.beginPath();ctx.moveTo(GOAL_L,y);ctx.lineTo(GOAL_R,y);ctx.stroke();}
  ctx.strokeStyle='#f4f4f4';ctx.lineWidth=6;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(GOAL_L,GOAL_LINE);ctx.lineTo(GOAL_L,GOAL_TOP);ctx.lineTo(GOAL_R,GOAL_TOP);ctx.lineTo(GOAL_R,GOAL_LINE);ctx.stroke();
  ctx.lineCap='butt';
}

function render(){
  ctx.save();
  if(shake>0)ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
  drawScene();

  if(state==='play'||state==='over'){
    // open-band highlight on the goal line (the gap the GK left)
    if(phase==='aim'||phase==='result'){
      const bx0=goalX(bandC-hb), bx1=goalX(bandC+hb);
      const gg=ctx.createLinearGradient(0,GOAL_TOP,0,GOAL_LINE);gg.addColorStop(0,'rgba(140,255,160,0.02)');gg.addColorStop(1,'rgba(140,255,160,0.22)');
      ctx.fillStyle=gg;ctx.fillRect(bx0,GOAL_TOP,bx1-bx0,GOAL_LINE-GOAL_TOP);
      ctx.strokeStyle='rgba(140,255,160,0.6)';ctx.lineWidth=2;ctx.strokeRect(bx0,GOAL_TOP+2,bx1-bx0,GOAL_LINE-GOAL_TOP-2);
    }

    // GK — smothers (comes out) on a late shot, dives on a save
    let gkx=goalX(gkCenter()), gky=0, dive=0;
    if(phase==='result'){
      if(result==='smother'){ const u=easeOut(gone); gkx=lerp(goalX(gkCenter()),goalX(relPos),u*0.7); }
      else if(result==='save'){ dive=(relPos<gkCenter()?-1:1)*easeOut(gone)*0.6; gkx=lerp(goalX(gkCenter()),goalX(relPos),0.5*easeOut(gone)); }
    }
    if(result==='smother'&&phase==='result'){ const u=easeOut(gone); ctx.save();ctx.translate(gkx,lerp(GOAL_LINE-6,SHOOT.y-70,u*0.55)); ctx.rotate(0);
      ctx.strokeStyle='#ffd23e';ctx.lineWidth=5;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(-18,-18);ctx.lineTo(18,-18);ctx.stroke();
      ctx.fillStyle='#ff5b3a';ctx.beginPath();ctx.ellipse(0,-14,11,18,0,0,6.28);ctx.fill();
      ctx.fillStyle='#f0c9a0';ctx.beginPath();ctx.arc(0,-36,7.5,0,6.28);ctx.fill();ctx.restore();
    } else { drawGK(gkx,dive); }

    // shooter
    figure(SHOOT.x,SHOOT.y,'#3aa0ff',0.8,(phase==='result')?-0.28:0);

    // ball
    let bx=SHOOT.x-2, by=SHOOT.y-18;
    if(phase==='result'&&result){
      const u=easeOut(gone);
      let tx,ty=GOAL_LINE-6;
      if(result==='goal'){ tx=goalX(relPos); ty=lerp(GOAL_LINE-6,GOAL_TOP+18,(1-quality)*0.0+ (relPos!=null?0:0)); ty=GOAL_TOP+14+(1-quality)*(GOAL_LINE-GOAL_TOP-24); }
      else if(result==='save'){ tx=goalX(gkCenter()); ty=GOAL_LINE-10; }
      else if(result==='wide'){ tx=(gkSide==='left')?GOAL_R+26:GOAL_L-26; ty=GOAL_TOP+30; }
      else { tx=SHOOT.x; ty=SHOOT.y-40; }   // smother — ball snuffed near feet
      bx=lerp(SHOOT.x-2,tx,u); by=lerp(SHOOT.y-18,ty,u)-Math.sin(u*Math.PI)*22;
    }
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(bx,by,7,0,6.28);ctx.fill();
    ctx.strokeStyle='#111';ctx.lineWidth=1;ctx.beginPath();ctx.arc(bx,by,7,0.4,2.2);ctx.stroke();
    if(netR>0.05){ctx.globalAlpha=netR*0.5;ctx.fillStyle='#8affa0';ctx.beginPath();ctx.arc(goalX(relPos),GOAL_LINE-6,16,0,6.28);ctx.fill();ctx.globalAlpha=1;}

    // aim bar (placement cursor)
    if(state==='play'&&(phase==='aim'||phase==='result')){
      ctx.textAlign='center';
      if(phase==='aim'){ctx.fillStyle='rgba(255,255,255,0.92)';ctx.font='bold 16px sans-serif';ctx.fillText('往復する照準が緑（GKが空けた逆サイド）に来た瞬間にタップ＝流し込む',W/2,BARY-24);}
      ctx.fillStyle='rgba(0,0,0,0.35)';rr(BARX-6,BARY-6,BARW+12,BARH+12,8);ctx.fill();
      // GK-covered zone (red) + wide zones + open band (green)
      ctx.fillStyle='rgba(255,120,110,0.16)';ctx.fillRect(BARX,BARY,BARW,BARH);
      const gx0=BARX+BARW*(bandC-hb), gw=BARW*(2*hb);
      ctx.fillStyle='rgba(140,255,160,0.30)';ctx.fillRect(gx0,BARY,gw,BARH);
      ctx.strokeStyle='rgba(140,255,160,0.85)';ctx.lineWidth=2;ctx.strokeRect(gx0,BARY,gw,BARH);
      // GK marker on the bar (covered side)
      const gkbx=BARX+BARW*gkCenter();
      ctx.fillStyle='rgba(255,91,58,0.9)';ctx.beginPath();ctx.arc(gkbx,BARY+BARH/2,6,0,6.28);ctx.fill();
      ctx.strokeStyle='rgba(255,255,255,0.4)';ctx.lineWidth=1;ctx.strokeRect(BARX,BARY,BARW,BARH);
      // marker
      const mpos=(phase==='aim')?pos:relPos;
      const mx=BARX+BARW*mpos; const inb=Math.abs(mpos-bandC)<=hb;
      ctx.fillStyle=inb?'#8fe0a0':'#ff7a7a';ctx.fillRect(mx-3,BARY-6,6,BARH+12);
      // labels
      ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='11px sans-serif';
      ctx.fillText('GKが守る側',gkbx,BARY+BARH+16);
      // deadline bar (GK closing down)
      if(phase==='aim'){ const rw=BARW*0.7, rmx=W/2-rw/2, rmy=BARY-42;
        ctx.fillStyle='rgba(0,0,0,0.3)';rr(rmx,rmy,rw,7,3);ctx.fill();
        ctx.fillStyle='#ffb020';rr(rmx,rmy,rw*clamp(clock/Tdl,0,1),7,3);ctx.fill();
        ctx.fillStyle='rgba(255,200,120,0.85)';ctx.font='10px sans-serif';ctx.textAlign='left';ctx.fillText('GKの詰め',rmx,rmy-3);ctx.textAlign='center'; }
    }
  }

  for(const q of parts){ctx.globalAlpha=Math.max(0,q.life);ctx.fillStyle=q.c;ctx.beginPath();ctx.arc(q.x,q.y,3.2,0,6.28);ctx.fill();}
  ctx.globalAlpha=1;
  for(const q of pops){ctx.globalAlpha=Math.max(0,q.life);ctx.fillStyle=q.c;ctx.font='bold 21px sans-serif';ctx.textAlign='center';ctx.fillText(q.txt,q.x,q.y);}
  ctx.globalAlpha=1;

  // HUD
  ctx.textAlign='left';ctx.fillStyle='#fff';ctx.font='bold 26px sans-serif';ctx.fillText('SCORE '+score,20,36);
  ctx.textAlign='right';ctx.fillStyle='rgba(255,255,255,0.9)';ctx.font='14px sans-serif';ctx.fillText('ゴール '+outs+'  Lv'+lvl,W-20,24);
  ctx.fillText('失敗',W-92,46);
  for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(W-60+i*20,41,7,0,6.28);ctx.fillStyle=i<fails?'#ff5b5b':'rgba(255,255,255,0.25)';ctx.fill();}
  if(combo>=2){ctx.textAlign='center';ctx.fillStyle='#ffd24d';ctx.font='bold 18px sans-serif';ctx.fillText('コンボ x'+combo,W/2,300);}

  if(state==='play'&&phase==='result'&&msg){ctx.textAlign='center';ctx.fillStyle=msgOk?'#9ff0b8':'#ffb38a';ctx.font='bold 16px sans-serif';ctx.fillText(msg,W/2,352);}

  if(state==='title'){
    ctx.fillStyle='rgba(4,10,6,0.83)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='bold 42px sans-serif';ctx.fillText('コースを突け',W/2,90);
    ctx.fillStyle='#ffd23e';ctx.font='bold 22px sans-serif';ctx.fillText('Pick Your Spot',W/2,126);
    ctx.fillStyle='rgba(255,255,255,0.92)';ctx.font='16px sans-serif';
    ctx.fillText('GKと1対1——GKが片側に寄って構える。空いた逆サイドの隅へ、往復する照準を止めて流し込め',W/2,182);
    ctx.fillStyle='rgba(255,255,255,0.66)';ctx.font='14px sans-serif';
    ctx.fillText('照準バーが左右に往復——緑の帯（GKが空けた側）に来た瞬間にタップ/クリック/SPACE＝シュート',W/2,220);
    ctx.fillText('GKが守る側（赤）へ飛ばすとセーブ／枠の外へ外すと枠外／迷うと飛び出したGKに詰められる',W/2,244);
    ctx.fillText('緑のど真ん中はGKの届かない隅へズドン＝大量加点。空く側は毎回変わる（左右）',W/2,268);
    ctx.fillText('上級ほど照準が速く緑の帯が狭い。3失敗で交代',W/2,292);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で開始',W/2,360);
    ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='14px sans-serif';ctx.fillText('BEST '+best,W/2,392);
  }
  if(state==='over'){
    ctx.fillStyle='rgba(4,10,6,0.85)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#ff6b6b';ctx.font='bold 46px sans-serif';ctx.fillText('3失敗…交代',W/2,222);
    ctx.fillStyle='#fff';ctx.font='bold 40px sans-serif';ctx.fillText('SCORE '+score,W/2,290);
    ctx.fillStyle='rgba(255,255,255,0.85)';ctx.font='19px sans-serif';ctx.fillText('ゴール '+outs+'   BEST '+best,W/2,330);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で もう一度',W/2,402);
  }

  if(flash>0.02){ctx.globalAlpha=flash*0.5;ctx.fillStyle=flashCol;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}
  ctx.restore();

  ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,0.4)';ctx.font='12px sans-serif';
  ctx.fillText('コースを突け：往復する照準を緑（GKが空けた逆サイド）で止めて流し込む。GK正面はセーブ・迷うと詰められる、3失敗で交代',W/2,H-8);
}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

function frame(ts){let dt=ts-last;last=ts;if(dt>60)dt=60;if(dt<0)dt=0;update(dt);render();requestAnimationFrame(frame);}
requestAnimationFrame(frame);

// ---------- test hook ----------
window.__ps={
  start, fire,
  get state(){return state;},
  get score(){return score;},
  get outs(){return outs;},
  get fails(){return fails;},
  get info(){return {state,phase,pos,bandC,bandLo:bandC-hb,bandHi:bandC+hb,hb,gkSide,clock,Tdl,released,result,outs,fails,lvl,
    canAct:(phase==='aim'&&!released)};}
};
})();
</script>
