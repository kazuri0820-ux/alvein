<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>壁を巻け (Curl It Round the Wall)</title>
<style>
  html,body{margin:0;height:100%;background:#07100a;overflow:hidden;
    font-family:-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  #stage{position:relative;width:100vw;height:100vh;max-width:calc(100vh*1.5);max-height:calc(100vw/1.5);aspect-ratio:900/600;}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;border-radius:6px;}
</style>
</head>
<body>
<div id="wrap"><div id="stage"><canvas id="cv"></canvas></div></div>
<script>
(function(){
const W=900,H=600,cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let DPR=1;
function fit(){DPR=Math.min(2,window.devicePixelRatio||1);cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
fit();addEventListener('resize',fit);

// ---------- audio ----------
let AC=null;function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function tone(f,d,type,v,sweep){const a=ac();if(!a)return;const t=a.currentTime,o=a.createOscillator(),g=a.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(sweep)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+sweep),t+d);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v||0.2,t+0.008);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+0.02);}
function noise(d,v,hp){const a=ac();if(!a)return;const t=a.currentTime,n=Math.floor(a.sampleRate*d),buf=a.createBuffer(1,n,a.sampleRate),ch=buf.getChannelData(0);
  for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource();s.buffer=buf;
  const f=a.createBiquadFilter();f.type='highpass';f.frequency.value=hp||600;const g=a.createGain();g.gain.value=v||0.2;
  s.connect(f);f.connect(g);g.connect(a.destination);s.start(t);s.stop(t+d+0.02);}
const S={
  tick:()=>{tone(1300,0.015,'square',0.02);},
  kick:()=>{noise(0.05,0.16,700);tone(240,0.06,'square',0.09,-70);},
  good:()=>{[680,940,1220].forEach((f,i)=>setTimeout(()=>tone(f,0.11,'triangle',0.16),i*56));},
  big:()=>{[600,800,1000,1250].forEach((f,i)=>setTimeout(()=>tone(f,0.12,'triangle',0.17),i*80));},
  bad:()=>{noise(0.2,0.24,240);tone(150,0.24,'sawtooth',0.13,-50);},
  streak:()=>{[700,930,1170,1400].forEach((f,i)=>setTimeout(()=>tone(f,0.1,'triangle',0.16),i*60));},
  over:()=>{[440,330,247,175].forEach((f,i)=>setTimeout(()=>tone(f,0.3,'triangle',0.2),i*160));}
};

// ---------- geometry ----------
const GOAL={x:452,y:118}, GW=300, GH=74;
const GK={x:452,y:170};
const BALL={x:322,y:486};                 // free-kick spot (down-left)
const WALLc={x:452,y:296};                 // the defensive wall (blocks the direct line)
function corner(){ return {x:GOAL.x+GW/2-26, y:GOAL.y+16}; }   // far top corner target
function bez(p0,c,p1,u){ const k=1-u; return {x:k*k*p0.x+2*k*u*c.x+u*u*p1.x, y:k*k*p0.y+2*k*u*c.y+u*u*p1.y}; }

// ---------- state ----------
let state='title', phase='meter', plays=0;
let score=0, combo=0, best=+(localStorage.getItem('cw_best')||0);
let outs=0, fails=0, lvl=1;   // outs = goals
let swp=0, period=1500, pos=0, bandC=0.55, bandW=0.24, tough=false, timeLeft=0;
let acted=false, stopPos=0, quality=0, result=null, resultT=0, msg='', msgOk=false, anim=0, sndClk=0;
let EP={x:0,y:0}, CP={x:0,y:0}, gkSide=1;
let shake=0, flash=0, flashCol='#fff', last=performance.now();
let parts=[], pops=[];

function rnd(a,b){return a+Math.random()*(b-a);}
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function lerp(a,b,u){return a+(b-a)*u;}
function easeOut(u){return 1-Math.pow(1-u,2);}
function bandLo(){return bandC-bandW/2;}
function bandHi(){return bandC+bandW/2;}

function reset(){state='title';score=0;combo=0;outs=0;fails=0;lvl=1;plays=0;result=null;parts=[];pops=[];}

function newPlay(){
  plays++; lvl=Math.min(7,1+Math.floor(outs/4));
  period=clamp(1560-lvl*110,860,1560);
  bandW=clamp(0.26-lvl*0.02,0.11,0.26);
  tough=Math.random()<clamp(0.2+lvl*0.05,0.2,0.5);
  if(tough)bandW*=0.82;
  bandC=rnd(0.36,0.70);
  timeLeft=clamp(3200-lvl*150,2200,3200);   // strike before the setup breaks down
  gkSide=(Math.random()<0.5?-1:1);
  phase='meter'; swp=Math.random()*period; pos=0;
  acted=false; stopPos=0; quality=0; result=null; resultT=0; msg=''; msgOk=false; anim=0;
  S.tick();
}
function start(){ if(!ac())ac(); if(AC&&AC.state==='suspended')AC.resume(); reset(); state='play'; newPlay(); }

function kick(){   // strike the free kick with the selected curve
  if(state==='title'){start();return;}
  if(state==='over'){ if(resultT>0.4){reset();start();} return; }
  if(state!=='play'||phase!=='meter'||acted) return;
  acted=true; stopPos=pos; S.kick();
  const c=corner();
  if(pos>=bandLo()&&pos<=bandHi()){ quality=1-Math.abs(pos-bandC)/(bandW/2);
    EP={x:c.x,y:c.y}; CP={x:300,y:250}; resolve('curl'); }
  else if(pos<bandLo()){ EP={x:WALLc.x+24,y:WALLc.y-6}; CP={x:360,y:380}; resolve('wall'); }
  else { EP={x:770,y:150}; CP={x:300,y:210}; resolve('wide'); }
}

function resolve(k){
  phase='result'; result=k; resultT=0; anim=0;
  if(k==='curl'){
    outs++; combo++;
    const perfect=quality>=0.7;
    let add=Math.round((60+Math.round(quality*150)+(tough?70:0))*(1+Math.min(9,combo-1)*0.14)); score+=add;
    setTimeout(S.good,120); if(perfect||tough)setTimeout(S.big,210);
    msgOk=true; flash=1;flashCol='#8affa0';shake=6; const c=corner(); burst(c.x,c.y,'#8affa0',18,7);
    pop(W/2,250,(perfect?'完璧なカーブ！壁を巻いてトップコーナーへ！ +':'壁を巻いてゴール！ +')+add,'#d6ffe0');
    if(combo>=2)pop(W/2,214,'コンボ x'+combo,'#ffd24d');
    if(combo>0&&combo%5===0)S.streak();
    msg=perfect?'ちょうどの回転で壁の外を巻き、伸びてきた球が逆サイドのトップコーナーへ突き刺さった——芸術的FK！':'壁を巻いてゴール左右の隅へ——GKの届かないコースへ曲げ切った直接FK！';
  } else {
    fails++; combo=0; msgOk=false; flash=1;flashCol='#ff5b5b';shake=8; S.bad();
    if(k==='wall') msg='曲がりが足りない…回転不足でボールが伸びず、跳んだ壁に直撃して弾かれた';
    else if(k==='wide') msg='曲げ過ぎた…回転をかけ過ぎてボールが巻き込み、ファーポストの外へ切れていった（枠外）';
    else msg='蹴るのが遅い…間合いを計りかねている間にGKと壁が守備を整え、蹴り込むも防がれた';
    pop(W/2,250,(k==='wall')?'壁に直撃…':(k==='wide')?'巻き過ぎ…枠外':'遅い…防がれた','#ffb0b0');
  }
  if(fails>=3){ state='over'; resultT=0; S.over(); if(score>best){best=score;localStorage.setItem('cw_best',best);} }
}

// ---------- input ----------
cv.addEventListener('pointerdown',e=>{e.preventDefault();kick();});
addEventListener('keydown',e=>{ if(e.repeat)return; if(e.code==='Space'||e.code==='Enter'||e.code==='ArrowUp'||e.code==='KeyF'){e.preventDefault();kick();} });

// ---------- particles ----------
function burst(x,y,c,n,sp){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=rnd(sp*0.3,sp);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:1,c});}}
function pop(x,y,txt,c){pops.push({x,y,txt,c,life:1});}

// ---------- update ----------
function update(dt){
  shake*=Math.pow(0.86,dt/16.7); if(shake<0.3)shake=0;
  flash*=Math.pow(0.9,dt/16.7);
  for(const p of parts){p.vx*=0.96;p.vy=p.vy*0.96+0.28;p.x+=p.vx*dt/16.7;p.y+=p.vy*dt/16.7;p.life-=dt/16.7*0.026;}
  parts=parts.filter(p=>p.life>0);
  for(const p of pops){p.y-=dt/16.7*0.5;p.life-=dt/16.7*0.02;}
  pops=pops.filter(p=>p.life>0);

  if(state!=='play'){ if(state==='over')resultT+=dt/1000; return; }
  if(phase==='meter'){ swp+=dt; const ph=(swp%period)/period; pos=1-Math.abs(2*ph-1);
    sndClk+=dt; if(sndClk>110){sndClk=0;S.tick();}
    timeLeft-=dt; if(!acted && timeLeft<=0){ acted=true; stopPos=-1; EP={x:GK.x,y:GK.y}; CP={x:400,y:330}; resolve('rushed'); }
    return; }
  if(phase==='result'){ resultT+=dt/1000; anim=Math.min(1,anim+dt/620); if(resultT>1.6) newPlay(); return; }
}

// ---------- render ----------
function drawField(){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#0f5e34');g.addColorStop(0.55,'#0e5230');g.addColorStop(1,'#0c4429');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='rgba(255,255,255,0.03)';for(let i=0;i<6;i++){ if(i%2===0)ctx.fillRect(0,80+i*95,W,95); }
  ctx.strokeStyle='rgba(255,255,255,0.26)';ctx.lineWidth=3;ctx.strokeRect(GOAL.x-250,GOAL.y+GH,500,250);ctx.strokeRect(GOAL.x-120,GOAL.y+GH,240,98);
  ctx.fillStyle='rgba(0,0,0,0.28)';ctx.fillRect(GOAL.x-GW/2-4,GOAL.y-4,GW+8,GH+4);
  ctx.strokeStyle='rgba(255,255,255,0.34)';ctx.lineWidth=1;
  for(let gx=GOAL.x-GW/2;gx<=GOAL.x+GW/2;gx+=16){ctx.beginPath();ctx.moveTo(gx,GOAL.y);ctx.lineTo(gx,GOAL.y+GH);ctx.stroke();}
  for(let gy=GOAL.y;gy<=GOAL.y+GH;gy+=13){ctx.beginPath();ctx.moveTo(GOAL.x-GW/2,gy);ctx.lineTo(GOAL.x+GW/2,gy);ctx.stroke();}
  ctx.strokeStyle='#f2f2f2';ctx.lineWidth=6;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(GOAL.x-GW/2,GOAL.y+GH);ctx.lineTo(GOAL.x-GW/2,GOAL.y);ctx.lineTo(GOAL.x+GW/2,GOAL.y);ctx.lineTo(GOAL.x+GW/2,GOAL.y+GH);ctx.stroke();
  ctx.lineCap='butt';
}
function person(x,y,col,s,arm){s=s||1;
  ctx.save();ctx.translate(x,y);
  ctx.fillStyle='rgba(0,0,0,0.2)';ctx.beginPath();ctx.ellipse(0,13*s,10*s,4*s,0,0,6.28);ctx.fill();
  ctx.fillStyle=col;ctx.beginPath();ctx.ellipse(0,-14*s,9*s,14*s,0,0,6.28);ctx.fill();
  ctx.fillStyle='#f0c9a0';ctx.beginPath();ctx.arc(0,-31*s,7*s,0,6.28);ctx.fill();
  ctx.restore();
}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

function render(){
  ctx.save();
  if(shake>0)ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
  drawField();

  if(state==='play'||state==='over'){
    const c=corner();
    // guide: the intended curl path (faint dashed) during aiming
    if(phase==='meter'){
      ctx.strokeStyle='rgba(140,255,160,0.28)';ctx.setLineDash([6,7]);ctx.lineWidth=2;
      ctx.beginPath(); for(let u=0;u<=1.001;u+=0.05){ const q=bez(BALL,{x:300,y:250},c,u); if(u===0)ctx.moveTo(q.x,q.y); else ctx.lineTo(q.x,q.y);} ctx.stroke();ctx.setLineDash([]);
    }

    // GK
    let gkx=GK.x;
    if(phase==='result'&&result==='curl') gkx=GK.x-gkSide*easeOut(anim)*70;
    else if(phase==='result') gkx=GK.x+ (result==='wall'?0: -gkSide*8);
    person(gkx,GK.y,'#e8c23a',0.92);

    // wall (4 defenders), small hop during result
    const hop=(phase==='result'&&(result==='curl'||result==='wide'))?easeOut(anim)*12:0;
    for(let i=0;i<4;i++){ person(WALLc.x-42+i*28, WALLc.y-hop, '#c85049',0.82); }

    // kicker + ball
    person(BALL.x-22,BALL.y+4,'#2b6fd6',0.95);
    let b=BALL;
    if(phase==='result'){ b=bez(BALL,CP,EP,easeOut(anim)); }
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(b.x,b.y,8,0,6.28);ctx.fill();
    ctx.strokeStyle='#333';ctx.lineWidth=1.1;ctx.beginPath();ctx.arc(b.x,b.y,8,0.4,2.2);ctx.stroke();

    // curve meter (bottom)
    if(state==='play'&&phase==='meter'){
      ctx.textAlign='center';
      ctx.fillStyle='rgba(255,220,90,0.96)';ctx.font='bold 21px sans-serif';
      ctx.fillText('カーブ量を合わせろ——壁を巻いて逆サイドの隅へ！',W/2,42);
      const bw=440,x=W/2-bw/2,y=520,bh=20;
      ctx.fillStyle='rgba(255,255,255,0.14)';rr(x,y,bw,bh,8);ctx.fill();
      // band
      const bl=x+bw*bandLo(), bwid=bw*bandW;
      ctx.fillStyle='rgba(120,255,150,0.55)';rr(bl,y,bwid,bh,6);ctx.fill();
      ctx.fillStyle='rgba(120,255,150,0.9)';rr(x+bw*bandC-1.5,y,3,bh,1);ctx.fill();
      // needle
      const nx=x+bw*pos;
      ctx.fillStyle='#ffe14d';rr(nx-3,y-5,6,bh+10,3);ctx.fill();
      ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='12px sans-serif';
      ctx.textAlign='left';ctx.fillText('曲がり小（壁に直撃）',x,y-8);
      ctx.textAlign='right';ctx.fillText('曲がり大（巻き過ぎ枠外）',x+bw,y-8);
      // time bar
      ctx.textAlign='center';const tl=clamp(timeLeft/ (clamp(3200-lvl*150,2200,3200)),0,1);
      ctx.fillStyle='rgba(255,255,255,0.16)';ctx.fillRect(x,y+bh+8,bw,5);ctx.fillStyle=tl<0.3?'#ff5b5b':'rgba(255,255,255,0.5)';ctx.fillRect(x,y+bh+8,bw*tl,5);
      ctx.fillStyle='rgba(255,255,255,0.55)';ctx.font='12px sans-serif';ctx.fillText('タップ / クリック / SPACE ＝ 緑帯でキック（曲がり過不足は失敗・蹴り遅れも失敗）',W/2,y+bh+30);
    }
  }

  for(const p of parts){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,3.2,0,6.28);ctx.fill();}
  ctx.globalAlpha=1;
  for(const p of pops){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.font='bold 21px sans-serif';ctx.textAlign='center';ctx.fillText(p.txt,p.x,p.y);}
  ctx.globalAlpha=1;

  // HUD
  ctx.textAlign='left';ctx.fillStyle='#fff';ctx.font='bold 26px sans-serif';ctx.fillText('SCORE '+score,20,36);
  ctx.textAlign='right';ctx.fillStyle='rgba(255,255,255,0.9)';ctx.font='14px sans-serif';ctx.fillText('ゴール '+outs+'  Lv'+lvl,W-20,24);
  ctx.fillText('失敗',W-92,46);
  for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(W-60+i*20,41,7,0,6.28);ctx.fillStyle=i<fails?'#ff5b5b':'rgba(255,255,255,0.25)';ctx.fill();}
  if(combo>=2){ctx.textAlign='center';ctx.fillStyle='#ffd24d';ctx.font='bold 18px sans-serif';ctx.fillText('コンボ x'+combo,W/2,112);}

  if(state==='play'&&phase==='result'&&msg){ctx.textAlign='center';ctx.fillStyle=msgOk?'#9ff0b8':'#ff9a9a';ctx.font='bold 15px sans-serif';ctx.fillText(msg,W/2,360);}

  if(state==='title'){
    ctx.fillStyle='rgba(3,10,6,0.84)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='bold 42px sans-serif';ctx.fillText('壁を巻け',W/2,80);
    ctx.fillStyle='#ffd23e';ctx.font='bold 22px sans-serif';ctx.fillText('Curl It Round the Wall',W/2,116);
    ctx.fillStyle='rgba(255,255,255,0.92)';ctx.font='16px sans-serif';
    ctx.fillText('直接フリーキック——左右に往復する“カーブ量”のメーターを緑帯で止め、壁を巻いて逆サイドの隅へ曲げ込め',W/2,172);
    ctx.fillStyle='rgba(255,255,255,0.66)';ctx.font='14px sans-serif';
    ctx.fillText('針が往復する“カーブ量”メーターが緑帯（壁を巻いて枠に入る回転）に来た瞬間にタップ/クリック/SPACE＝キック',W/2,212);
    ctx.fillText('帯の中心ドンピシャほどトップコーナーへズドン＝大量加点。曲がりが足りない＝壁に直撃／曲げ過ぎ＝枠外',W/2,236);
    ctx.fillText('蹴るのが遅い（時間切れ）＝守備を整えられて防がれる。際どい局面（tough）を決めるとボーナス',W/2,260);
    ctx.fillText('上級ほど針が速く緑帯が狭い。3失敗で交代',W/2,284);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で開始',W/2,350);
    ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='14px sans-serif';ctx.fillText('BEST '+best,W/2,382);
  }
  if(state==='over'){
    ctx.fillStyle='rgba(3,10,6,0.86)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#ff6b6b';ctx.font='bold 46px sans-serif';ctx.fillText('3失敗…交代',W/2,222);
    ctx.fillStyle='#fff';ctx.font='bold 40px sans-serif';ctx.fillText('SCORE '+score,W/2,290);
    ctx.fillStyle='rgba(255,255,255,0.85)';ctx.font='19px sans-serif';ctx.fillText('ゴール '+outs+'   BEST '+best,W/2,330);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で もう一度',W/2,402);
  }

  if(flash>0.02){ctx.globalAlpha=flash*0.5;ctx.fillStyle=flashCol;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}
  ctx.restore();

  ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,0.4)';ctx.font='12px sans-serif';
  ctx.fillText('壁を巻け：往復するカーブ量メーターを緑帯で止め、壁を巻いて逆サイドの隅へ。曲がり過不足・蹴り遅れは失敗、3失敗で交代',W/2,H-8);
}

function frame(ts){let dt=ts-last;last=ts;if(dt>60)dt=60;if(dt<0)dt=0;update(dt);render();requestAnimationFrame(frame);}
requestAnimationFrame(frame);

// ---------- test hook ----------
window.__cw={
  start, kick:()=>kick(),
  get state(){return state;},
  get score(){return score;},
  get outs(){return outs;},
  get fails(){return fails;},
  get info(){return {state,phase,pos,bandC,bandW,bandLo:bandLo(),bandHi:bandHi(),tough,timeLeft,acted,result,outs,fails,lvl,
    inBand:(phase==='meter'&&pos>=bandLo()&&pos<=bandHi()),canAct:(phase==='meter'&&!acted)};}
};
})();
</script>
</body>
</html>
