<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ワンタッチ (One-Touch)</title>
<style>
  html,body{margin:0;height:100%;background:#08120b;overflow:hidden;
    font-family:-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  #stage{position:relative;width:100vw;height:100vh;max-width:calc(100vh*1.5);max-height:calc(100vw/1.5);aspect-ratio:900/600;}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;border-radius:6px;}
</style>
</head>
<body>
<div id="wrap"><div id="stage"><canvas id="cv"></canvas></div></div>
<script>
(function(){
const W=900,H=600,cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let DPR=1;
function fit(){DPR=Math.min(2,window.devicePixelRatio||1);cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
fit();addEventListener('resize',fit);

// ---------- audio ----------
let AC=null;function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function tone(f,d,type,v,sweep){const a=ac();if(!a)return;const t=a.currentTime,o=a.createOscillator(),g=a.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(sweep)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+sweep),t+d);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v||0.2,t+0.008);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+0.02);}
function noise(d,v,hp){const a=ac();if(!a)return;const t=a.currentTime,n=Math.floor(a.sampleRate*d),buf=a.createBuffer(1,n,a.sampleRate),ch=buf.getChannelData(0);
  for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource();s.buffer=buf;
  const f=a.createBiquadFilter();f.type='highpass';f.frequency.value=hp||600;const g=a.createGain();g.gain.value=v||0.2;
  s.connect(f);f.connect(g);g.connect(a.destination);s.start(t);s.stop(t+d+0.02);}
const SCALE=[523,587,659,784,880,988,1046];
const S={
  pass:(i)=>{tone(SCALE[i%SCALE.length],0.09,'triangle',0.16);},
  great:(i)=>{tone(SCALE[i%SCALE.length],0.1,'triangle',0.2);setTimeout(()=>tone(SCALE[(i+2)%SCALE.length],0.08,'sine',0.12),40);},
  goal:()=>{[659,880,1046,1318].forEach((f,i)=>setTimeout(()=>tone(f,0.16,'triangle',0.22),i*90));noise(0.1,0.2,500);},
  miss:()=>{noise(0.12,0.2,500);tone(240,0.22,'sawtooth',0.16,-120);},
  over:()=>{[440,330,247,175].forEach((f,i)=>setTimeout(()=>tone(f,0.3,'triangle',0.2),i*160));}
};

// ---------- geometry ----------
const GOAL={x:450,y:88};

// ---------- state ----------
let state='title', phase='travel', t=0, seqN=0;
let score=0, combo=0, best=+(localStorage.getItem('onetouch_best')||0);
let goals=0, passes=0, misses=0, lvl=1;
let nodes=[], leg=0, ball=null, tArr=0, clock=0, acted=false, isShot=false;
let result=null, resultT=0, msg='', flashText='';
let shake=0, flash=0, flashCol='#fff', last=performance.now();
let parts=[], pops=[], waitT=0;

function rnd(a,b){return a+Math.random()*(b-a);}
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function lerp(a,b,u){return a+(b-a)*u;}

function params(){ return { travel:Math.max(340,640-lvl*44), window:Math.max(58,132-lvl*11), great:Math.max(26,56-lvl*4.5) }; }

function reset(){state='title';score=0;combo=0;goals=0;passes=0;misses=0;lvl=1;seqN=0;nodes=[];ball=null;result=null;parts=[];pops=[];}
function newSeq(){
  seqN++; lvl=Math.min(7,1+Math.floor(passes/10));
  const n=4+Math.floor(lvl/2);
  nodes=[]; let x=rnd(180,720), y=520;
  nodes.push({x,y});
  for(let i=1;i<=n;i++){ y=520-(500/(n+1))*i; x=clamp(x+rnd(-220,220),140,760); nodes.push({x,y}); }
  nodes.push({x:GOAL.x,y:GOAL.y+20}); // finish target (shot)
  leg=0; startLeg();
}
function startLeg(){
  const p=params();
  const a=nodes[leg], b=nodes[leg+1];
  isShot = (leg===nodes.length-2);
  ball={sx:a.x,sy:a.y,tx:b.x,ty:b.y,t:0,dur:isShot?p.travel*0.9:p.travel};
  tArr=ball.dur; clock=0; acted=false; phase='travel';
}
function start(){ if(!ac())ac(); if(AC&&AC.state==='suspended')AC.resume(); reset(); state='play'; newSeq(); }

function tap(){
  if(state==='title'){start();return;}
  if(state==='over'){ if(resultT>0.4){reset();start();} return; }
  if(state!=='play'||phase!=='travel'||acted) return;
  acted=true;
  const p=params(); const err=Math.abs(clock-tArr);
  if(err<=p.window){
    const great=err<=p.great;
    const b=nodes[leg+1];
    if(isShot){
      goals++; combo++; passes++; const add=Math.round(300*(1+Math.min(9,combo-1)*0.16)); score+=add;
      S.goal(); flash=1;flashCol='#8fe0a0';shake=13; burst(GOAL.x,GOAL.y,'#cfffe0',30,8);
      pop(GOAL.x,GOAL.y-16,'ゴール！ +'+add,'#dfffe6'); if(combo>=3)pop(GOAL.x,GOAL.y-42,'コンボ x'+combo,'#ffd24d');
      phase='resolve'; result='goal'; resultT=0; msg='ワンタッチで崩し切った！'; startWait(700,true);
    } else {
      passes++; combo++; const add=Math.round((great?24:14)*(1+Math.min(12,combo-1)*0.12)); score+=add;
      great?S.great(leg):S.pass(leg); if(great){pop(b.x,b.y-20,'ナイス！','#ffe08a');burst(b.x,b.y,'#ffe08a',8,4);}
      flash=great?0.3:0.15;flashCol='#8fe0a0';
      leg++; startLeg();
    }
  } else {
    miscontrol('mistime');
  }
}
function miscontrol(kind){
  misses++; combo=0; S.miss(); flash=0.9;flashCol='#ff5b5b';shake=9;
  const b=nodes[Math.min(leg+1,nodes.length-1)];
  burst(b.x,b.y,'#ff9a9a',14,6); pop(b.x,b.y-20,kind==='late'?'トラップミス':'ミスタッチ','#ffb0b0');
  phase='resolve'; result='miss'; resultT=0; msg = kind==='late'?'合わない！ 収まらず奪われた':'タイミングが早い！ 引っかけた';
  if(misses>=3){ state='over'; resultT=0; S.over(); if(score>best){best=score;localStorage.setItem('onetouch_best',best);} return; }
  startWait(560,false);
}
function startWait(ms,goal){ waitT=ms; phase='wait'; }

// ---------- input ----------
cv.addEventListener('pointerdown',e=>{e.preventDefault();tap();});
addEventListener('keydown',e=>{ if(e.code==='Space'||e.code==='Enter'||e.code==='ArrowUp'){e.preventDefault();tap();} });

// ---------- particles ----------
function burst(x,y,c,n,sp){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=rnd(sp*0.3,sp);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:1,c});}}
function pop(x,y,txt,c){pops.push({x,y,txt,c,life:1});}

// ---------- update ----------
function update(dt){
  shake*=Math.pow(0.86,dt/16.7); if(shake<0.3)shake=0;
  flash*=Math.pow(0.9,dt/16.7);
  for(const p of parts){p.vx*=0.96;p.vy=p.vy*0.96+0.28;p.x+=p.vx*dt/16.7;p.y+=p.vy*dt/16.7;p.life-=dt/16.7*0.028;}
  parts=parts.filter(p=>p.life>0);
  for(const p of pops){p.y-=dt/16.7*0.5;p.life-=dt/16.7*0.02;}
  pops=pops.filter(p=>p.life>0);

  if(state!=='play'){ if(state==='over')resultT+=dt/1000; return; }
  t+=dt;
  if(phase==='travel'){
    ball.t+=dt; clock+=dt;
    if(!acted && clock>tArr+params().window){ acted=true; miscontrol('late'); }
    return;
  }
  if(phase==='wait'){ waitT-=dt; if(waitT<=0){ newSeq(); } return; }
  if(phase==='resolve'){ resultT+=dt/1000; return; }
}

// ---------- render ----------
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function drawPitch(){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#1c5a2c');g.addColorStop(1,'#164a24');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  for(let i=0;i<9;i++){ctx.fillStyle=i%2?'rgba(255,255,255,0.03)':'rgba(0,0,0,0.04)';ctx.fillRect(0,i*66,W,66);}
  ctx.fillStyle='#eef3f5';ctx.fillRect(360-7,54,7,GOAL.y-54+2);ctx.fillRect(540,54,7,GOAL.y-54+2);ctx.fillRect(353,54,194,7);
  ctx.strokeStyle='rgba(255,255,255,0.22)';ctx.lineWidth=1;for(let x=360;x<=540;x+=15){ctx.beginPath();ctx.moveTo(x,60);ctx.lineTo(x,GOAL.y);ctx.stroke();}
  ctx.strokeStyle='rgba(255,255,255,0.25)';ctx.lineWidth=3;ctx.strokeRect(250,GOAL.y,400,220);
}

function render(){
  ctx.save();
  if(shake>0)ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
  drawPitch();

  if(state==='play'){
    // pass lanes + nodes
    for(let i=0;i<nodes.length;i++){ const nd=nodes[i];
      if(i<nodes.length-1){ctx.strokeStyle='rgba(255,255,255,0.10)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(nd.x,nd.y);ctx.lineTo(nodes[i+1].x,nodes[i+1].y);ctx.stroke();}
      const isRecv = (phase==='travel'&&i===leg+1);
      const isFin = (i===nodes.length-1);
      ctx.fillStyle='rgba(0,0,0,0.2)';ctx.beginPath();ctx.ellipse(nd.x,nd.y+12,12,4,0,0,6.28);ctx.fill();
      if(!isFin){ ctx.fillStyle=i<=leg?'#3a6bbf':'#2b8cff';rr(nd.x-8,nd.y-8,16,22,6);ctx.fill();ctx.fillStyle='#f2c9a0';ctx.beginPath();ctx.arc(nd.x,nd.y-15,6.5,0,6.28);ctx.fill(); }
      if(isRecv){ // timing ring shrinking to indicate arrival
        const p=params(); const rem=clamp((tArr-clock)/tArr,0,1); const rr2=14+rem*40;
        ctx.strokeStyle=Math.abs(clock-tArr)<=p.great?'#8fe0a0':(Math.abs(clock-tArr)<=p.window?'#ffe08a':'rgba(255,255,255,0.4)');
        ctx.lineWidth=3;ctx.beginPath();ctx.arc(nd.x,nd.y,rr2,0,6.28);ctx.stroke();
        ctx.beginPath();ctx.arc(nd.x,nd.y,14,0,6.28);ctx.stroke();
      }
    }
    // ball
    if(ball&&phase==='travel'){ const f=clamp(ball.t/ball.dur,0,1); const bx=lerp(ball.sx,ball.tx,f),by=lerp(ball.sy,ball.ty,f)-Math.sin(f*Math.PI)*18;
      ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(bx,by,8,0,6.28);ctx.fill();ctx.fillStyle='#222';ctx.beginPath();ctx.arc(bx,by,2.4,0,6.28);ctx.fill(); }
  }

  for(const p of parts){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,3.2,0,6.28);ctx.fill();}
  ctx.globalAlpha=1;
  for(const p of pops){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.font='bold 20px sans-serif';ctx.textAlign='center';ctx.fillText(p.txt,p.x,p.y);}
  ctx.globalAlpha=1;

  // HUD
  ctx.textAlign='left';ctx.fillStyle='#fff';ctx.font='bold 26px sans-serif';ctx.fillText('SCORE '+score,20,36);
  ctx.textAlign='right';ctx.fillStyle='rgba(255,255,255,0.85)';ctx.font='14px sans-serif';ctx.fillText('得点 '+goals+' パス '+passes+'  Lv'+lvl,W-20,24);
  ctx.fillText('ミス',W-92,46);
  for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(W-60+i*20,41,7,0,6.28);ctx.fillStyle=i<misses?'#ff5b5b':'rgba(255,255,255,0.22)';ctx.fill();}
  if(combo>=2){ctx.textAlign='center';ctx.fillStyle='#ffd24d';ctx.font='bold 18px sans-serif';ctx.fillText('コンボ x'+combo,450,H-70);}

  if(state==='play'&&(phase==='travel')){ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,0.82)';ctx.font='bold 16px sans-serif';
    ctx.fillText(isShot?'最後はシュート！ 届く瞬間にタップ':'ボールが味方に届く“瞬間”にタップ！',450,44);}
  if(state==='play'&&phase==='resolve'&&msg){ctx.textAlign='center';ctx.fillStyle=result==='goal'?'#9ff0b8':'#ff9a9a';ctx.font='bold 22px sans-serif';ctx.fillText(msg,450,44);}

  if(state==='title'){
    ctx.fillStyle='rgba(6,14,10,0.68)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='bold 52px sans-serif';ctx.fillText('ワンタッチ',W/2,150);
    ctx.fillStyle='#ffd23e';ctx.font='bold 22px sans-serif';ctx.fillText('One-Touch',W/2,186);
    ctx.fillStyle='rgba(255,255,255,0.9)';ctx.font='16px sans-serif';
    ctx.fillText('味方を素早く繋ぐワンタッチ・パスの連続でゴールまで崩すリズムゲーム',W/2,240);
    ctx.fillStyle='rgba(255,255,255,0.66)';ctx.font='14px sans-serif';
    ctx.fillText('ボールが次の味方に“届く瞬間”にタップ＝ワンタッチでダイレクトに繋ぐ（縮む輪が目安）',W/2,280);
    ctx.fillText('早すぎると引っかけ、遅れると収まらず奪われる。最後の1本はシュートで決める',W/2,302);
    ctx.fillText('テンポよく繋ぐほどコンボ＆高得点。上級ほどパスが速くタイミングもシビア。3ミスで交代',W/2,324);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で開始',W/2,404);
    ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='14px sans-serif';ctx.fillText('BEST '+best+'　　届く瞬間にタップ／SPACE',W/2,436);
  }
  if(state==='over'){
    ctx.fillStyle='rgba(6,14,10,0.76)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#ff6b6b';ctx.font='bold 46px sans-serif';ctx.fillText('3ミス…試合終了',W/2,222);
    ctx.fillStyle='#fff';ctx.font='bold 40px sans-serif';ctx.fillText('SCORE '+score,W/2,290);
    ctx.fillStyle='rgba(255,255,255,0.85)';ctx.font='19px sans-serif';ctx.fillText('得点 '+goals+' パス '+passes+'   BEST '+best,W/2,330);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で もう一度',W/2,402);
  }

  if(flash>0.02){ctx.globalAlpha=flash*0.5;ctx.fillStyle=flashCol;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}
  ctx.restore();

  ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,0.4)';ctx.font='12px sans-serif';
  ctx.fillText('ボールが味方に届く瞬間にタップしてワンタッチで繋ぐ。早い=引っかけ、遅い=奪われる。最後はシュート。3ミスで交代',W/2,H-8);
}

function frame(ts){let dt=ts-last;last=ts;if(dt>60)dt=60;if(dt<0)dt=0;update(dt);render();requestAnimationFrame(frame);}
requestAnimationFrame(frame);

// ---------- test hook ----------
window.__ot={
  start, tap:()=>tap(),
  get state(){return state;},
  get score(){return score;},
  get goals(){return goals;},
  get passes(){return passes;},
  get misses(){return misses;},
  get info(){const p=params(); return {state,phase, clock, tArr, window:p.window, great:p.great, leg, isShot, passes, goals, misses, lvl};}
};
})();
</script>
</body>
</html>
