<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ヘッドスライディング (Leg It Out)</title>
<style>
  html,body{margin:0;height:100%;background:#0c1119;overflow:hidden;
    font-family:-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  #stage{position:relative;width:100vw;height:100vh;max-width:calc(100vh*1.5);max-height:calc(100vw/1.5);aspect-ratio:900/600;}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;border-radius:6px;}
</style>
</head>
<body>
<div id="wrap"><div id="stage"><canvas id="cv"></canvas></div></div>
<script>
(function(){
const W=900,H=600,cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let DPR=1;
function fit(){DPR=Math.min(2,window.devicePixelRatio||1);cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
fit();addEventListener('resize',fit);

// ---------- audio ----------
let AC=null;function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function tone(f,d,type,v,sweep){const a=ac();if(!a)return;const t=a.currentTime,o=a.createOscillator(),g=a.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(sweep)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+sweep),t+d);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v||0.2,t+0.008);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+0.02);}
function noise(d,v,hp){const a=ac();if(!a)return;const t=a.currentTime,n=Math.floor(a.sampleRate*d),buf=a.createBuffer(1,n,a.sampleRate),ch=buf.getChannelData(0);
  for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource();s.buffer=buf;
  const f=a.createBiquadFilter();f.type='highpass';f.frequency.value=hp||600;const g=a.createGain();g.gain.value=v||0.2;
  s.connect(f);f.connect(g);g.connect(a.destination);s.start(t);s.stop(t+d+0.02);}
const S={
  step:()=>{noise(0.02,0.05,1700);},
  dive:()=>{noise(0.16,0.24,500);tone(200,0.14,'sawtooth',0.12,90);},
  safe:()=>{[600,820,1040].forEach((f,i)=>setTimeout(()=>tone(f,0.13,'triangle',0.2),i*80));},
  out:()=>{tone(300,0.26,'sawtooth',0.2,-150);setTimeout(()=>tone(190,0.26,'sawtooth',0.16,-70),120);},
  throw:()=>{noise(0.04,0.1,900);},
  over:()=>{[440,330,247,175].forEach((f,i)=>setTimeout(()=>tone(f,0.3,'triangle',0.2),i*160));}
};

// ---------- geometry ----------
const HOME={x:196,y:520}, FIRST={x:724,y:432};
const FIELDER={x:392,y:228};

// ---------- state ----------
let state='title', phase='set', t=0, plays=0;
let score=0, combo=0, best=+(localStorage.getItem('legit_best')||0);
let safes=0, outs=0, lvl=1;
let pos=0, throttle=0, diving=false, diveT=0, dived=false, reachT=-1;
let tElapsed=0, tThrow=1800, ballArrived=false;
let result=null, resultT=0, msg='', msg2='';
let shake=0, flash=0, flashCol='#fff', last=performance.now(), dust=0;
let parts=[], pops=[];

function rnd(a,b){return a+Math.random()*(b-a);}
function chance(p){return Math.random()<p;}
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function lerp(a,b,u){return a+(b-a)*u;}

function reset(){state='title';score=0;combo=0;safes=0;outs=0;lvl=1;plays=0;result=null;parts=[];pops=[];}
function newPlay(){
  plays++; lvl=Math.min(7,1+Math.floor(safes/4));
  pos=0; throttle=0; diving=false; diveT=0; dived=false; reachT=-1;
  tElapsed=0; ballArrived=false;
  tThrow = 1980 - lvl*54 + rnd(-40,40);   // ms for the throw to reach first
  phase='run'; result=null; msg=''; msg2=''; S.throw();
}
function start(){ if(!ac())ac(); if(AC&&AC.state==='suspended')AC.resume(); reset(); state='play'; countdown(); }
let cdT=0;
function countdown(){ phase='set'; cdT=650; }

const SPD=0.075;
function sprint(){
  if(state==='title'){start();return;}
  if(state==='over'){ if(resultT>0.4){reset();start();} return; }
  if(state!=='play'||phase!=='run'||diving||dived) return;
  throttle=Math.min(1,throttle+0.16); S.step();
}
function dive(){
  if(state!=='play'||phase!=='run'||diving||dived) return;
  diving=true; dived=true; diveT=0; S.dive(); dust=1;
}

function finishReach(){
  reachT=tElapsed;
  phase='resolve'; resultT=0;
  const safe = reachT <= tThrow;
  if(safe){
    safes++; combo++; const marg=Math.round(tThrow-reachT);
    const add=Math.round((marg<90?90:60)*(1+Math.min(9,combo-1)*0.16)); score+=add;
    S.safe(); flash=1;flashCol='#8fe0a0';shake=10; burst(FIRST.x,FIRST.y,'#cfffe0',24,7);
    pop(FIRST.x,FIRST.y-30,'セーフ！ +'+add,'#dfffe6');
    if(marg<90)pop(FIRST.x,FIRST.y-56,'際どい内野安打！','#fff3c4');
    if(combo>=2)pop(FIRST.x,FIRST.y-80,'コンボ x'+combo,'#ffd24d');
    msg='セーフ！ 全力疾走でもぎ取った'; msg2='';
  } else {
    outs++; combo=0; S.out(); flash=1;flashCol='#ff5b5b';shake=11; burst(FIRST.x,FIRST.y,'#ff9a9a',14,6);
    pop(FIRST.x,FIRST.y-30,'アウト','#ffb0b0');
    msg='アウト… 送球に負けた'; msg2 = outs>=3?'':'あと'+(3-outs)+'アウトで交代';
  }
  if(outs>=3){ state='over'; resultT=0; S.over(); if(score>best){best=score;localStorage.setItem('legit_best',best);} }
}
function whiffOut(kind){ // failed dive / timeout
  outs++; combo=0; S.out(); flash=1;flashCol='#ff5b5b';shake=11;
  phase='resolve'; resultT=0; result='out';
  msg = kind==='early'?'早すぎるダイブ！ ベースに届かず':'間に合わない！ 走り負けた';
  msg2 = outs>=3?'':'あと'+(3-outs)+'アウトで交代';
  pop(FIRST.x,FIRST.y-30,'アウト','#ffb0b0');
  if(outs>=3){ state='over'; resultT=0; S.over(); if(score>best){best=score;localStorage.setItem('legit_best',best);} }
}

// ---------- input ----------
cv.addEventListener('pointerdown',e=>{
  e.preventDefault();
  if(state==='title'||state==='over'){sprint();return;}
  if(state!=='play'||phase!=='run'){return;}
  const r=cv.getBoundingClientRect(); const x=((e.clientX-r.left)/r.width)*W;
  if(x>W*0.62) dive(); else sprint();
});
addEventListener('keydown',e=>{
  if(state!=='play'){ if(e.code==='Space'||e.code==='Enter')sprint(); return; }
  if(e.code==='Space'||e.code==='ArrowUp'||e.code==='KeyF'||e.code==='KeyJ'){e.preventDefault(); sprint();}
  else if(e.code==='KeyD'||e.code==='ArrowDown'||e.code==='ShiftLeft'||e.code==='Enter'){e.preventDefault(); dive();}
});

// ---------- particles ----------
function burst(x,y,c,n,sp){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=rnd(sp*0.3,sp);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:1,c});}}
function pop(x,y,txt,c){pops.push({x,y,txt,c,life:1});}

// ---------- update ----------
const DIVE_LUNGE=15;   // pos units gained by a dive lunge
function update(dt){
  shake*=Math.pow(0.86,dt/16.7); if(shake<0.3)shake=0;
  flash*=Math.pow(0.9,dt/16.7); if(dust>0)dust-=dt/400;
  for(const p of parts){p.vx*=0.96;p.vy=p.vy*0.96+0.3;p.x+=p.vx*dt/16.7;p.y+=p.vy*dt/16.7;p.life-=dt/16.7*0.03;}
  parts=parts.filter(p=>p.life>0);
  for(const p of pops){p.y-=dt/16.7*0.5;p.life-=dt/16.7*0.02;}
  pops=pops.filter(p=>p.life>0);

  if(state!=='play'){ if(state==='over')resultT+=dt/1000; return; }
  t+=dt;

  if(phase==='set'){ cdT-=dt; if(cdT<=0) newPlay(); return; }
  if(phase==='run'){
    tElapsed+=dt;
    if(!diving){
      throttle*=Math.pow(0.90,dt/16.7);
      pos=Math.min(96,pos+throttle*SPD*dt);
    } else {
      diveT+=dt; const dl=Math.min(1,diveT/150);
      // lunge adds DIVE_LUNGE over ~150ms from the pos where dive started
      if(!diving._base){ diving={_base:pos}; }
      pos=Math.min(100, diving._base + DIVE_LUNGE*dl);
      if(dl>=1){ // dive completed
        if(pos>=99.5) finishReach();
        else whiffOut('early'); // dove short of the bag
        return;
      }
    }
    if(pos>=100){ finishReach(); return; }
    if(tElapsed>tThrow+700){ whiffOut('slow'); return; } // never got there
    if(tElapsed>=tThrow && !ballArrived){ ballArrived=true; } // ball is in; keep going but you're likely out
    return;
  }
  if(phase==='resolve'){ resultT+=dt/1000; if(resultT>1.1 && state==='play') countdown(); return; }
}

// ---------- render ----------
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

function drawField(){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#1c5a2c');g.addColorStop(1,'#164a24');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  // baseline dirt (home -> first)
  ctx.strokeStyle='#7a5230';ctx.lineWidth=44;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(HOME.x,HOME.y);ctx.lineTo(FIRST.x,FIRST.y);ctx.stroke();
  ctx.strokeStyle='rgba(255,255,255,0.5)';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(HOME.x,HOME.y-24);ctx.lineTo(FIRST.x,FIRST.y-24);ctx.stroke();
  // home plate
  ctx.fillStyle='#eee';ctx.beginPath();ctx.moveTo(HOME.x,HOME.y+8);ctx.lineTo(HOME.x-12,HOME.y);ctx.lineTo(HOME.x-12,HOME.y-8);ctx.lineTo(HOME.x+12,HOME.y-8);ctx.lineTo(HOME.x+12,HOME.y);ctx.closePath();ctx.fill();
  // first base bag
  ctx.fillStyle='#eef2f4';ctx.save();ctx.translate(FIRST.x,FIRST.y);ctx.rotate(0.78);rr(-15,-15,30,30,3);ctx.fill();ctx.restore();
  // fielder
  ctx.fillStyle='rgba(0,0,0,0.2)';ctx.beginPath();ctx.ellipse(FIELDER.x,FIELDER.y+12,13,5,0,0,6.28);ctx.fill();
  ctx.fillStyle='#e23c3c';rr(FIELDER.x-9,FIELDER.y-8,18,24,7);ctx.fill();ctx.fillStyle='#f2c9a0';ctx.beginPath();ctx.arc(FIELDER.x,FIELDER.y-16,7,0,6.28);ctx.fill();
  // first baseman
  ctx.fillStyle='#e23c3c';rr(FIRST.x+18,FIRST.y-40,18,26,7);ctx.fill();ctx.fillStyle='#f2c9a0';ctx.beginPath();ctx.arc(FIRST.x+27,FIRST.y-48,7,0,6.28);ctx.fill();
}
function drawRunner(){
  const u=pos/100; const x=lerp(HOME.x,FIRST.x,u), y=lerp(HOME.y,FIRST.y,u);
  ctx.fillStyle='rgba(0,0,0,0.24)';ctx.beginPath();ctx.ellipse(x,y+13,15,5,0,0,6.28);ctx.fill();
  ctx.save();ctx.translate(x,y);
  if(diving){ ctx.rotate(0.9);
    ctx.fillStyle='#2b6cff';rr(-6,-6,30,16,7);ctx.fill();
    ctx.fillStyle='#f2c9a0';ctx.beginPath();ctx.arc(24,-2,7,0,6.28);ctx.fill();
  } else {
    ctx.fillStyle='#2b6cff';rr(-9,-10,18,26,7);ctx.fill();
    ctx.fillStyle='#f2c9a0';ctx.beginPath();ctx.arc(0,-18,7.5,0,6.28);ctx.fill();
    const sw=Math.sin(tElapsed*0.03)*6;
    ctx.strokeStyle='#2b6cff';ctx.lineWidth=5;ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(0,10);ctx.lineTo(sw,20);ctx.moveTo(0,10);ctx.lineTo(-sw,20);ctx.stroke();
  }
  ctx.restore();
}
function drawThrow(){
  if(phase!=='run'&&phase!=='resolve')return;
  const f=clamp(tElapsed/tThrow,0,1);
  const x=lerp(FIELDER.x,FIRST.x+6,f), y=lerp(FIELDER.y,FIRST.y-6,f)-Math.sin(f*Math.PI)*40;
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(x,y,7,0,6.28);ctx.fill();
  ctx.strokeStyle='#c33';ctx.lineWidth=1.2;ctx.beginPath();ctx.arc(x,y,7,0.4,2.3);ctx.stroke();
}

function render(){
  ctx.save();
  if(shake>0)ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
  drawField();
  if(dust>0){ctx.globalAlpha=Math.max(0,dust)*0.6;ctx.fillStyle='#caa176';
    const u=pos/100,x=lerp(HOME.x,FIRST.x,u),y=lerp(HOME.y,FIRST.y,u);
    ctx.beginPath();ctx.ellipse(x-10,y+8,26*(1.4-dust),10,0,0,6.28);ctx.fill();ctx.globalAlpha=1;}
  if(state==='play'||state==='over'){ drawThrow(); drawRunner(); }

  for(const p of parts){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,3.2,0,6.28);ctx.fill();}
  ctx.globalAlpha=1;
  for(const p of pops){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.font='bold 21px sans-serif';ctx.textAlign='center';ctx.fillText(p.txt,p.x,p.y);}
  ctx.globalAlpha=1;

  // progress + throw race bar
  if(state==='play'&&(phase==='run')){
    const bx=250,bw=400,by=70;
    ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,0.85)';ctx.font='bold 15px sans-serif';
    ctx.fillText(pos>=86?'今だ！ ヘッドスライディング（右/D）':'連打で全力疾走！（左連打/SPACE）',450,44);
    // dive-ready marker on progress
    ctx.fillStyle='rgba(0,0,0,0.4)';rr(bx,by,bw,14,7);ctx.fill();
    ctx.fillStyle='#8fd0ff';rr(bx,by,bw*(pos/100),14,7);ctx.fill();
    ctx.fillStyle='rgba(255,220,120,0.9)';ctx.fillRect(bx+bw*0.86-2,by-4,4,22);
    ctx.strokeStyle='rgba(255,255,255,0.3)';ctx.lineWidth=2;rr(bx,by,bw,14,7);ctx.stroke();
  }
  if(state==='play'&&phase==='set'){
    ctx.textAlign='center';ctx.fillStyle='#ffe08a';ctx.font='bold 30px sans-serif';ctx.fillText('打った！ 走れ！',450,300);
  }
  if(state==='play'&&phase==='resolve'&&msg){
    ctx.textAlign='center';ctx.fillStyle=result==='out'||(msg&&msg.indexOf('アウト')>=0)?'#ff9a9a':'#9ff0b8';ctx.font='bold 24px sans-serif';ctx.fillText(msg,450,300);
  }

  // HUD
  ctx.textAlign='left';ctx.fillStyle='#fff';ctx.font='bold 26px sans-serif';ctx.fillText('SCORE '+score,20,36);
  ctx.textAlign='right';ctx.fillStyle='rgba(255,255,255,0.85)';ctx.font='14px sans-serif';ctx.fillText('内野安打 '+safes+'  Lv'+lvl,W-20,24);
  ctx.fillText('アウト',W-96,46);
  for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(W-60+i*20,41,7,0,6.28);ctx.fillStyle=i<outs?'#ff5b5b':'rgba(255,255,255,0.22)';ctx.fill();}
  if(combo>=2){ctx.textAlign='center';ctx.fillStyle='#ffd24d';ctx.font='bold 18px sans-serif';ctx.fillText('コンボ x'+combo,450,H-96);}

  if(state==='title'){
    ctx.fillStyle='rgba(6,10,18,0.68)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='bold 40px sans-serif';ctx.fillText('ヘッドスライディング',W/2,150);
    ctx.fillStyle='#ffd24d';ctx.font='bold 22px sans-serif';ctx.fillText('Leg It Out',W/2,186);
    ctx.fillStyle='rgba(255,255,255,0.9)';ctx.font='17px sans-serif';
    ctx.fillText('内野ゴロを全力疾走で駆け抜ける、送球との際どい競走',W/2,244);
    ctx.fillStyle='rgba(255,255,255,0.66)';ctx.font='14px sans-serif';
    ctx.fillText('連打（画面左を連打／SPACE連打）でダッシュ、ゲージが◆を越えたら',W/2,284);
    ctx.fillText('ヘッドスライディング（画面右／D）でベースへ飛び込む＝送球より先ならセーフ',W/2,306);
    ctx.fillText('飛び込みが早すぎるとベースに届かず、連打が遅いと走り負ける。上級ほど送球が速い。3アウトで交代',W/2,328);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で開始',W/2,404);
    ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='14px sans-serif';ctx.fillText('BEST '+best+'　　左連打=走る / 右=ダイブ',W/2,436);
  }
  if(state==='over'){
    ctx.fillStyle='rgba(6,10,18,0.76)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#ff6b6b';ctx.font='bold 46px sans-serif';ctx.fillText('3アウト…交代',W/2,222);
    ctx.fillStyle='#fff';ctx.font='bold 40px sans-serif';ctx.fillText('SCORE '+score,W/2,290);
    ctx.fillStyle='rgba(255,255,255,0.85)';ctx.font='19px sans-serif';ctx.fillText('内野安打 '+safes+'   BEST '+best,W/2,330);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で もう一度',W/2,402);
  }

  if(flash>0.02){ctx.globalAlpha=flash*0.5;ctx.fillStyle=flashCol;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}
  ctx.restore();

  ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,0.4)';ctx.font='12px sans-serif';
  ctx.fillText('左連打（SPACE）で全力疾走、ゲージが◆超えで右／Dのヘッドスライディング。送球より先でセーフ。3アウトで交代',W/2,H-8);
}

function frame(ts){let dt=ts-last;last=ts;if(dt>60)dt=60;if(dt<0)dt=0;update(dt);render();requestAnimationFrame(frame);}
requestAnimationFrame(frame);

// ---------- test hook ----------
window.__li={
  start, sprint:()=>sprint(), dive:()=>dive(),
  get state(){return state;},
  get score(){return score;},
  get safes(){return safes;},
  get outs(){return outs;},
  get info(){return {state,phase,pos,throttle,tElapsed,tThrow,diving,dived, safes,outs,lvl};}
};
})();
</script>
</body>
</html>
