<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ゲッツー崩し (Break Up the Two)</title>
<style>
  html,body{margin:0;height:100%;background:#0b100a;overflow:hidden;
    font-family:-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  #stage{position:relative;width:100vw;height:100vh;max-width:calc(100vh*1.5);max-height:calc(100vw/1.5);aspect-ratio:900/600;}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;border-radius:6px;}
</style>
</head>
<body>
<div id="wrap"><div id="stage"><canvas id="cv"></canvas></div></div>
<script>
(function(){
const W=900,H=600,cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let DPR=1;
function fit(){DPR=Math.min(2,window.devicePixelRatio||1);cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
fit();addEventListener('resize',fit);

// ---------- audio ----------
let AC=null;function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function tone(f,d,type,v,sweep){const a=ac();if(!a)return;const t=a.currentTime,o=a.createOscillator(),g=a.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(sweep)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+sweep),t+d);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v||0.2,t+0.008);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+0.02);}
function noise(d,v,hp){const a=ac();if(!a)return;const t=a.currentTime,n=Math.floor(a.sampleRate*d),buf=a.createBuffer(1,n,a.sampleRate),ch=buf.getChannelData(0);
  for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource();s.buffer=buf;
  const f=a.createBiquadFilter();f.type='highpass';f.frequency.value=hp||600;const g=a.createGain();g.gain.value=v||0.2;
  s.connect(f);f.connect(g);g.connect(a.destination);s.start(t);s.stop(t+d+0.02);}
const S={
  flip:()=>{tone(520,0.05,'square',0.06);},
  slide:()=>{noise(0.15,0.18,300);tone(200,0.1,'sine',0.08,-40);},
  broke:()=>{noise(0.06,0.16,500);[680,900,1120].forEach((f,i)=>setTimeout(()=>tone(f,0.11,'triangle',0.18),i*70));},
  dp:()=>{noise(0.13,0.2,420);tone(200,0.14,'sawtooth',0.12,-60);},
  streak:()=>{[660,880,1100,1320].forEach((f,i)=>setTimeout(()=>tone(f,0.1,'triangle',0.16),i*60));},
  over:()=>{[440,330,247,175].forEach((f,i)=>setTimeout(()=>tone(f,0.3,'triangle',0.2),i*160));}
};

// ---------- geometry ----------
const BAG={x:452,y:262}, SS={x:300,y:176}, FIRST={x:706,y:430}, RUNSTART={x:660,y:432};

// ---------- state ----------
let state='title', phase='play', t=0, plays=0;
let score=0, combo=0, best=+(localStorage.getItem('breakup_best')||0);
let breaks=0, fails=0, lvl=1;
let clock=0, catchT=900, pivotTime=360, releaseT=1260, preW=120, deadline=1360, acted=false, slideT=0;
let flipP=0, relayP=0, runP=0, batter=0, pivotThrew=false, caught=false;
let result=null, resultT=0, msg='';
let shake=0, flash=0, flashCol='#fff', last=performance.now();
let parts=[], pops=[];

function rnd(a,b){return a+Math.random()*(b-a);}
function chance(p){return Math.random()<p;}
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function lerp(a,b,u){return a+(b-a)*u;}
function easeOut(u){return 1-Math.pow(1-u,2);}

function params(){ return { catch:Math.max(620,1020-lvl*56), pivot:Math.max(210,430-lvl*30), preW:Math.max(70,130-lvl*8) }; }

function reset(){state='title';score=0;combo=0;breaks=0;fails=0;lvl=1;plays=0;result=null;parts=[];pops=[];}
function newPlay(){
  plays++; lvl=Math.min(7,1+Math.floor(breaks/4));
  const p=params(); catchT=rnd(p.catch-90,p.catch+90); pivotTime=p.pivot; releaseT=catchT+pivotTime; preW=p.preW; deadline=releaseT+110;
  clock=0; acted=false; slideT=0; flipP=0; relayP=0; runP=0; batter=0; pivotThrew=false; caught=false;
  result=null; phase='play'; msg=''; resultT=0;
}
function start(){ if(!ac())ac(); if(AC&&AC.state==='suspended')AC.resume(); reset(); state='play'; newPlay(); }

function slide(){
  if(state==='title'){start();return;}
  if(state==='over'){ if(resultT>0.4){reset();start();} return; }
  if(state!=='play'||phase!=='play'||acted) return;
  acted=true; slideT=clock; runP=1; S.slide();
  if(clock < catchT-preW){ resolve('early'); return; }        // slid under before he had it
  if(clock > releaseT){ resolve('late'); return; }            // already relayed
  resolve('broke');
}

function resolve(kind){
  phase='result'; result=kind; resultT=0;
  if(kind==='broke'){
    breaks++; combo++; const mid=(catchT+releaseT)/2; const tight=Math.abs(slideT-mid)<pivotTime*0.35;
    const add=Math.round((tight?150:105)*(1+Math.min(9,combo-1)*0.16)); score+=add;
    S.broke(); flash=1;flashCol='#ffe08a';shake=8; burst(BAG.x,BAG.y,'#ffe08a',20,6.5);
    pop(BAG.x,BAG.y-40,'併殺崩し！ +'+add,'#fff3c4');
    if(tight)pop(BAG.x,BAG.y-66,'ドンピシャのスライド！','#ffe08a');
    if(combo>=2)pop(BAG.x,BAG.y-14,'コンボ x'+combo,'#ffd24d');
    if(combo>0&&combo%5===0)S.streak();
    msg='スライドで送球を乱した！ 一塁セーフ';
  } else {
    fails++; combo=0; flash=1;flashCol='#ff5b5b';shake=8; S.dp();
    if(kind==='early') msg='早い！ 捕る前に滑ってすり抜け＝併殺';
    else if(kind==='late') msg='遅い！ 送球された後で無意味＝併殺';
    else msg='無反応…楽に転がされて併殺';
    pop(FIRST.x,FIRST.y-30,'ダブルプレー','#ffb0b0');
  }
  if(fails>=3){ state='over'; resultT=0; S.over(); if(score>best){best=score;localStorage.setItem('breakup_best',best);} }
}

// ---------- input ----------
cv.addEventListener('pointerdown',e=>{e.preventDefault();slide();});
addEventListener('keydown',e=>{ if(e.code==='Space'||e.code==='Enter'||e.code==='ArrowUp'||e.code==='ArrowLeft'){e.preventDefault();slide();} });

// ---------- particles ----------
function burst(x,y,c,n,sp){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=rnd(sp*0.3,sp);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:1,c});}}
function pop(x,y,txt,c){pops.push({x,y,txt,c,life:1});}

// ---------- update ----------
function update(dt){
  shake*=Math.pow(0.86,dt/16.7); if(shake<0.3)shake=0;
  flash*=Math.pow(0.9,dt/16.7);
  for(const p of parts){p.vx*=0.96;p.vy=p.vy*0.96+0.28;p.x+=p.vx*dt/16.7;p.y+=p.vy*dt/16.7;p.life-=dt/16.7*0.026;}
  parts=parts.filter(p=>p.life>0);
  for(const p of pops){p.y-=dt/16.7*0.5;p.life-=dt/16.7*0.02;}
  pops=pops.filter(p=>p.life>0);

  if(state!=='play'){ if(state==='over')resultT+=dt/1000; return; }
  t+=dt;
  if(phase==='play'){
    clock+=dt;
    flipP = clamp(clock/catchT,0,1);
    if(clock>=catchT && !caught){ caught=true; S.flip(); }
    if(clock>=releaseT && !pivotThrew){ pivotThrew=true; }
    if(pivotThrew) relayP=clamp((clock-releaseT)/300,0,1);
    // runner slides in a bit as it develops (visual)
    if(!acted) runP = clamp((clock-(catchT-260))/360,0,0.55);
    if(!acted && clock>deadline){ resolve('nothing'); }
    return;
  }
  if(phase==='result'){
    resultT+=dt/1000;
    runP=Math.min(1,runP+dt/300);
    if(result==='broke'){ /* relay sails wide: handled in render */ }
    else { relayP=Math.min(1,relayP+dt/360); batter=Math.min(1,batter+dt/700); }
    if(resultT>1.25 && state==='play') newPlay();
    return;
  }
}

// ---------- render ----------
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function drawScene(){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#2c7a3b');g.addColorStop(1,'#1d5726');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  // dirt infield
  ctx.fillStyle='#7a5230';ctx.beginPath();ctx.ellipse(470,320,330,240,0,0,6.28);ctx.fill();
  ctx.fillStyle='#2c7a3b';ctx.beginPath();ctx.ellipse(470,330,250,180,0,0,6.28);ctx.fill();
  // basepath second->first
  ctx.strokeStyle='rgba(240,220,180,0.7)';ctx.lineWidth=22;ctx.beginPath();ctx.moveTo(BAG.x,BAG.y);ctx.lineTo(FIRST.x,FIRST.y);ctx.stroke();
  // bases
  for(const b of [BAG,FIRST]){ ctx.save();ctx.translate(b.x,b.y);ctx.rotate(Math.PI/4);ctx.fillStyle='#f2f4f6';ctx.fillRect(-12,-12,24,24);ctx.restore(); }
  ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='12px sans-serif';ctx.textAlign='center';
  ctx.fillText('二塁',BAG.x,BAG.y-22); ctx.fillText('一塁',FIRST.x,FIRST.y+30);
}
function drawFig(x,y,col,r){
  ctx.fillStyle='rgba(0,0,0,0.22)';ctx.beginPath();ctx.ellipse(x,y+13,12,4,0,0,6.28);ctx.fill();
  ctx.fillStyle=col;rr(x-9,y-11,18,26,6);ctx.fill();
  ctx.fillStyle='#f2c9a0';ctx.beginPath();ctx.arc(x,y-16,7,0,6.28);ctx.fill();
}

function render(){
  ctx.save();
  if(shake>0)ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
  drawScene();

  if(state==='play'){
    // shortstop + flip ball
    drawFig(SS.x,SS.y,'#c23c3c',false);
    // pivot man at the bag
    const disrupt=(phase==='result'&&result==='broke');
    ctx.save();ctx.translate(BAG.x,BAG.y-6); if(disrupt)ctx.rotate(0.5*Math.min(1,resultT*3)); drawFig(0,0,'#e2683c',false); ctx.restore();
    // first baseman
    drawFig(FIRST.x,FIRST.y,'#c23c3c',false);

    // flip ball (SS -> bag)
    if(clock<catchT || (phase==='play')){
      if(!caught){ const bx=lerp(SS.x,BAG.x,easeOut(flipP)), by=lerp(SS.y,BAG.y,easeOut(flipP));
        ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(bx,by,6,0,6.28);ctx.fill(); }
    }
    // relay ball (bag -> first)
    if(pivotThrew){
      let ex=FIRST.x,ey=FIRST.y;
      if(phase==='result'&&result==='broke'){ ex=FIRST.x+80; ey=FIRST.y-90; }  // sails wide
      const bx=lerp(BAG.x,ex,easeOut(relayP)), by=lerp(BAG.y,ey,easeOut(relayP));
      ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(bx,by,6,0,6.28);ctx.fill();
    }
    // runner sliding from first toward second
    const rx=lerp(RUNSTART.x,BAG.x+14,easeOut(runP)), ry=lerp(RUNSTART.y,BAG.y+12,easeOut(runP));
    ctx.save();ctx.translate(rx,ry); if(acted||phase==='result')ctx.rotate(-0.5*Math.min(1,runP*2)); drawFig(0,0,'#2b6cff',false); ctx.restore();

    // timing ring at the bag (green = disrupt window)
    if(phase==='play'){ const inWin=(clock>=catchT-preW&&clock<=releaseT);
      const u=clock/releaseT; const rad=lerp(66,22,clamp(u,0,1));
      ctx.strokeStyle=inWin?'rgba(150,240,170,0.9)':'rgba(255,255,255,0.3)';ctx.lineWidth=3;
      ctx.beginPath();ctx.arc(BAG.x,BAG.y,rad,0,6.28);ctx.stroke();
      ctx.fillStyle=inWin?'#9ff0b8':'rgba(255,255,255,0.7)';ctx.font='bold 15px sans-serif';ctx.textAlign='center';
      ctx.fillText(clock<catchT-preW?'…ボールが来る':(inWin?'今だ！ スライド':''),BAG.x,BAG.y-40); }

    // batter-to-first progress (context)
    const bw=200,bx0=20,by0=H-70;
    ctx.fillStyle='rgba(0,0,0,0.3)';rr(bx0-3,by0-3,bw+6,14,7);ctx.fill();
    const bp=(phase==='result')?(result==='broke'?0.7:batter):clamp(clock/deadline,0,0.75);
    ctx.fillStyle='#7fd0ff';rr(bx0,by0,bw*bp,8,4);ctx.fill();
    ctx.fillStyle='rgba(255,255,255,0.6)';ctx.font='11px sans-serif';ctx.textAlign='left';ctx.fillText('打者走者→一塁',bx0,by0-6);
  }

  for(const p of parts){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,3.2,0,6.28);ctx.fill();}
  ctx.globalAlpha=1;
  for(const p of pops){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.font='bold 22px sans-serif';ctx.textAlign='center';ctx.fillText(p.txt,p.x,p.y);}
  ctx.globalAlpha=1;

  // HUD
  ctx.textAlign='left';ctx.fillStyle='#fff';ctx.font='bold 26px sans-serif';ctx.fillText('SCORE '+score,20,36);
  ctx.textAlign='right';ctx.fillStyle='rgba(255,255,255,0.9)';ctx.font='14px sans-serif';ctx.fillText('崩し '+breaks+'  Lv'+lvl,W-20,24);
  ctx.fillText('失敗',W-92,46);
  for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(W-60+i*20,41,7,0,6.28);ctx.fillStyle=i<fails?'#ff5b5b':'rgba(255,255,255,0.25)';ctx.fill();}
  if(combo>=2){ctx.textAlign='center';ctx.fillStyle='#ffd24d';ctx.font='bold 18px sans-serif';ctx.fillText('コンボ x'+combo,W/2,86);}

  if(state==='play'&&phase==='play'){ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,0.9)';ctx.font='bold 15px sans-serif';
    ctx.fillText('二塁で中継が“送球する瞬間”にスライドで突入＝送球を乱して併殺を防ぐ（タップ/SPACE）',W/2,42);}
  if(state==='play'&&phase==='result'&&msg){ctx.textAlign='center';ctx.fillStyle=result==='broke'?'#9ff0b8':'#ff9a9a';ctx.font='bold 21px sans-serif';ctx.fillText(msg,W/2,42);}

  if(state==='title'){
    ctx.fillStyle='rgba(6,10,6,0.72)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='bold 46px sans-serif';ctx.fillText('ゲッツー崩し',W/2,132);
    ctx.fillStyle='#ffd23e';ctx.font='bold 22px sans-serif';ctx.fillText('Break Up the Two',W/2,168);
    ctx.fillStyle='rgba(255,255,255,0.92)';ctx.font='16px sans-serif';
    ctx.fillText('走者の見せ場。二塁で中継に滑り込み、送球を乱して併殺を防げ',W/2,218);
    ctx.fillStyle='rgba(255,255,255,0.66)';ctx.font='14px sans-serif';
    ctx.fillText('遊撃手のトスが二塁の野手に“収まって送球する瞬間”に合わせてスライド（タップ/クリック/SPACE）',W/2,256);
    ctx.fillText('その瞬間に突入すれば中継が乱れて一塁セーフ＝ダブルプレー阻止',W/2,278);
    ctx.fillText('捕る前に滑るとすり抜け、送球後だと無意味、無反応も楽に併殺される',W/2,300);
    ctx.fillText('リングが緑の“今だ”がスライドの合図。上級ほど中継が速く窓も短い。3失敗で交代',W/2,322);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で開始',W/2,400);
    ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='14px sans-serif';ctx.fillText('BEST '+best+'　　緑リングの瞬間にスライド',W/2,432);
  }
  if(state==='over'){
    ctx.fillStyle='rgba(6,10,6,0.8)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#ff6b6b';ctx.font='bold 46px sans-serif';ctx.fillText('3失敗…交代',W/2,222);
    ctx.fillStyle='#fff';ctx.font='bold 40px sans-serif';ctx.fillText('SCORE '+score,W/2,290);
    ctx.fillStyle='rgba(255,255,255,0.85)';ctx.font='19px sans-serif';ctx.fillText('崩し '+breaks+'   BEST '+best,W/2,330);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で もう一度',W/2,402);
  }

  if(flash>0.02){ctx.globalAlpha=flash*0.5;ctx.fillStyle=flashCol;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}
  ctx.restore();

  ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,0.4)';ctx.font='12px sans-serif';
  ctx.fillText('中継が送球する瞬間（緑リング）にスライド＝送球を乱し併殺阻止。早い=すり抜け/遅い=無意味。3失敗で交代',W/2,H-8);
}

function frame(ts){let dt=ts-last;last=ts;if(dt>60)dt=60;if(dt<0)dt=0;update(dt);render();requestAnimationFrame(frame);}
requestAnimationFrame(frame);

// ---------- test hook ----------
window.__bu={
  start, slide:()=>slide(),
  get state(){return state;},
  get score(){return score;},
  get breaks(){return breaks;},
  get fails(){return fails;},
  get info(){return {state,phase,clock,catchT,releaseT,preW,deadline,acted,result,breaks,fails,lvl,
    inWindow:(phase==='play'&&clock>=catchT-preW&&clock<=releaseT)};}
};
})();
</script>
</body>
</html>
