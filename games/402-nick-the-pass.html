<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>パスを狩れ (Nick the Pass)</title>
<style>
  html,body{margin:0;height:100%;background:#07100a;overflow:hidden;
    font-family:-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  #stage{position:relative;width:100vw;height:100vh;max-width:calc(100vh*1.5);max-height:calc(100vw/1.5);aspect-ratio:900/600;}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;border-radius:6px;}
</style>
</head>
<body>
<div id="wrap"><div id="stage"><canvas id="cv"></canvas></div></div>
<script>
(function(){
const W=900,H=600,cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let DPR=1;
function fit(){DPR=Math.min(2,window.devicePixelRatio||1);cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
fit();addEventListener('resize',fit);

// ---------- audio ----------
let AC=null;function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function tone(f,d,type,v,sweep){const a=ac();if(!a)return;const t=a.currentTime,o=a.createOscillator(),g=a.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(sweep)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+sweep),t+d);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v||0.2,t+0.008);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+0.02);}
function noise(d,v,hp){const a=ac();if(!a)return;const t=a.currentTime,n=Math.floor(a.sampleRate*d),buf=a.createBuffer(1,n,a.sampleRate),ch=buf.getChannelData(0);
  for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource();s.buffer=buf;
  const f=a.createBiquadFilter();f.type='highpass';f.frequency.value=hp||600;const g=a.createGain();g.gain.value=v||0.2;
  s.connect(f);f.connect(g);g.connect(a.destination);s.start(t);s.stop(t+d+0.02);}
const S={
  pass:()=>{tone(300,0.05,'sine',0.05,-30);},
  nick:()=>{noise(0.05,0.18,1100);tone(420,0.06,'square',0.09,60);},
  good:()=>{[660,900,1180].forEach((f,i)=>setTimeout(()=>tone(f,0.11,'triangle',0.16),i*56));},
  big:()=>{[600,800,1000,1250].forEach((f,i)=>setTimeout(()=>tone(f,0.12,'triangle',0.17),i*80));},
  bad:()=>{noise(0.2,0.24,240);tone(150,0.24,'sawtooth',0.13,-50);},
  streak:()=>{[700,930,1170,1400].forEach((f,i)=>setTimeout(()=>tone(f,0.1,'triangle',0.16),i*60));},
  over:()=>{[440,330,247,175].forEach((f,i)=>setTimeout(()=>tone(f,0.3,'triangle',0.2),i*160));}
};

// ---------- geometry ----------
const PASS={x:168,y:242}, RECV={x:734,y:360};   // opponent passer -> receiver
const INT={x:452,y:(242+360)/2};                 // your interception point (mid-lane)
const YOU={x:452,y:470};                          // you start below the lane, step up to nick it

// ---------- state ----------
let state='title', phase='pass', plays=0;
let score=0, combo=0, best=+(localStorage.getItem('np_best')||0);
let outs=0, fails=0, lvl=1;   // outs = interceptions
let clk=0, arriveT=1000, w=200, travelDur=2000, tough=false;
let decided=false, result=null, resultT=0, msg='', msgOk=false, anim=0, relErr=0;
let shake=0, flash=0, flashCol='#fff', last=performance.now();
let parts=[], pops=[];

function rnd(a,b){return a+Math.random()*(b-a);}
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function lerp(a,b,u){return a+(b-a)*u;}
function easeOut(u){return 1-Math.pow(1-u,2);}

function reset(){state='title';score=0;combo=0;outs=0;fails=0;lvl=1;plays=0;result=null;parts=[];pops=[];}

function newPlay(){
  plays++; lvl=Math.min(7,1+Math.floor(outs/4));
  arriveT=clamp(1000-lvl*46,700,1000);
  w=clamp(200-lvl*16,100,200);
  tough=Math.random()<clamp(0.2+lvl*0.05,0.2,0.5); if(tough)w*=0.82;
  travelDur=arriveT*2;    // ball reaches the mid-lane interception point at arriveT
  clk=0; decided=false; result=null; resultT=0; msg=''; msgOk=false; anim=0; relErr=0;
  phase='pass'; S.pass();
}
function start(){ if(!ac())ac(); if(AC&&AC.state==='suspended')AC.resume(); reset(); state='play'; newPlay(); }

function act(){
  if(state==='title'){start();return;}
  if(state==='over'){ if(resultT>0.4){reset();start();} return; }
  if(state!=='play'||phase!=='pass'||decided) return;
  decided=true; relErr=clk-arriveT;
  if(clk<arriveT-w){ resolve('early'); }
  else if(clk<=arriveT+w){ resolve('nick'); }
  else { resolve('late'); }
}

function resolve(k){
  phase='result'; result=k; resultT=0; anim=0;
  if(k==='nick'){
    outs++; combo++;
    const clean=Math.abs(relErr)<=w*0.32;
    let add=Math.round((60+Math.round((1-Math.abs(relErr)/(w||1))*140)+(tough?70:0))*(1+Math.min(9,combo-1)*0.14)); score+=add;
    S.nick(); setTimeout(S.good,140); if(clean||tough)setTimeout(S.big,220);
    msgOk=true; flash=1;flashCol='#8affa0';shake=6; burst(INT.x,INT.y,'#8affa0',18,7);
    pop(W/2,236,(clean?'ドンピシャで足を出しカット——カウンター発動！ +':'パスコースを読み切ってインターセプト！ +')+add,'#d6ffe0');
    if(combo>=2)pop(W/2,204,'コンボ x'+combo,'#ffd24d');
    if(combo>0&&combo%5===0)S.streak();
    msg=clean?'パスコースにドンピシャで足を差し込みカット——奪ったボールでそのままカウンター発動！':'パスが通る一瞬に読んで足を出しインターセプト——マイボールにした！';
  } else {
    fails++; combo=0; msgOk=false; flash=1;flashCol='#ff5b5b';shake=8; S.bad();
    if(k==='early') msg='飛び出しが早い…パスが来る前に足を出して抜かれ、背後のスペースを突かれた';
    else msg='反応が遅い…足を出すのが間に合わず、パスは受け手に通ってしまった';
    pop(W/2,236,(k==='early')?'早い…背後を突かれた':'遅い…パスを通された','#ffb0b0');
  }
  if(fails>=3){ state='over'; resultT=0; S.over(); if(score>best){best=score;localStorage.setItem('np_best',best);} }
}

// ---------- input ----------
cv.addEventListener('pointerdown',e=>{e.preventDefault();act();});
addEventListener('keydown',e=>{ if(e.repeat)return; if(e.code==='Space'||e.code==='Enter'||e.code==='ArrowUp'||e.code==='KeyF'||e.code==='KeyJ'){e.preventDefault();act();} });

// ---------- particles ----------
function burst(x,y,c,n,sp){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=rnd(sp*0.3,sp);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:1,c});}}
function pop(x,y,txt,c){pops.push({x,y,txt,c,life:1});}

// ---------- update ----------
function update(dt){
  shake*=Math.pow(0.86,dt/16.7); if(shake<0.3)shake=0;
  flash*=Math.pow(0.9,dt/16.7);
  for(const p of parts){p.vx*=0.96;p.vy=p.vy*0.96+0.28;p.x+=p.vx*dt/16.7;p.y+=p.vy*dt/16.7;p.life-=dt/16.7*0.026;}
  parts=parts.filter(p=>p.life>0);
  for(const p of pops){p.y-=dt/16.7*0.5;p.life-=dt/16.7*0.02;}
  pops=pops.filter(p=>p.life>0);

  if(state!=='play'){ if(state==='over')resultT+=dt/1000; return; }
  if(phase==='pass'){ clk+=dt;
    if(!decided && clk>travelDur){ decided=true; relErr=clk-arriveT; resolve('late'); }
    return; }
  if(phase==='result'){ resultT+=dt/1000; anim=Math.min(1,anim+dt/420); if(resultT>1.5) newPlay(); return; }
}

// ---------- render ----------
function ballPos(cl){ const u=clamp(cl/travelDur,0,1); return {x:lerp(PASS.x,RECV.x,u), y:lerp(PASS.y,RECV.y,u)}; }
function drawField(){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#0f5e34');g.addColorStop(0.55,'#0e5230');g.addColorStop(1,'#0c4429');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='rgba(255,255,255,0.03)';for(let i=0;i<6;i++){ if(i%2===0)ctx.fillRect(0,60+i*95,W,95); }
  // penalty box outline (top) to frame the lane
  ctx.strokeStyle='rgba(255,255,255,0.14)';ctx.lineWidth=2;ctx.strokeRect(190,40,520,150);
}
function person(x,y,col,s,lean){s=s||1;lean=lean||0;
  ctx.save();ctx.translate(x,y);ctx.rotate(lean);
  ctx.fillStyle='rgba(0,0,0,0.2)';ctx.beginPath();ctx.ellipse(0,13*s,10*s,4*s,0,0,6.28);ctx.fill();
  ctx.fillStyle=col;ctx.beginPath();ctx.ellipse(0,-14*s,9*s,14*s,0,0,6.28);ctx.fill();
  ctx.fillStyle='#f0c9a0';ctx.beginPath();ctx.arc(0,-31*s,7*s,0,6.28);ctx.fill();
  ctx.restore();
}
function rr(x,y,w2,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w2,y,x+w2,y+h,r);ctx.arcTo(x+w2,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w2,y,r);ctx.closePath();}

function render(){
  ctx.save();
  if(shake>0)ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
  drawField();

  if(state==='play'||state==='over'){
    // passing lane
    ctx.strokeStyle='rgba(255,255,255,0.16)';ctx.lineWidth=2;ctx.setLineDash([7,7]);
    ctx.beginPath();ctx.moveTo(PASS.x,PASS.y);ctx.lineTo(RECV.x,RECV.y);ctx.stroke();ctx.setLineDash([]);
    // opponents
    person(PASS.x,PASS.y,'#c85049',0.96,0);
    person(RECV.x,RECV.y,'#c85049',0.96,0);
    // interception zone marker (the window around INT)
    const winFrac=w/travelDur; // half-window in ball-fraction
    const a=ballPos(arriveT-w), b=ballPos(arriveT+w);
    ctx.strokeStyle='rgba(140,255,160,0.5)';ctx.lineWidth=8;ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();ctx.lineCap='butt';
    ctx.strokeStyle='rgba(255,255,255,0.3)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(INT.x,INT.y,24,0,6.28);ctx.stroke();

    // you — step up to the lane on nick, lunge past on early, stay on late
    let yx=YOU.x, yy=YOU.y, ylean=0;
    if(phase==='result'){ const u=easeOut(anim);
      if(result==='nick'){ yy=lerp(YOU.y,INT.y+18,u); }
      else if(result==='early'){ yy=lerp(YOU.y,INT.y-20,u); ylean=-0.2; }   // lunged past/through
      else { yy=lerp(YOU.y,YOU.y-24,u*0.5); }                               // late: half-committed
    }
    person(yx,yy,'#2b6fd6',1.02,ylean);

    // ball
    let b2;
    if(phase==='pass'){ b2=ballPos(clk); }
    else { const u=easeOut(anim);
      if(result==='nick'){ b2={x:lerp(INT.x,YOU.x,u), y:lerp(INT.y,YOU.y-40,u)}; }       // won, brought down to you
      else { const decisionClk=clamp(arriveT+relErr,0,travelDur); b2=ballPos(lerp(decisionClk,travelDur,u)); } // early/late: slips through to the receiver
    }
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(b2.x,b2.y,8,0,6.28);ctx.fill();
    ctx.strokeStyle='#333';ctx.lineWidth=1.1;ctx.beginPath();ctx.arc(b2.x,b2.y,8,0.4,2.2);ctx.stroke();

    if(state==='play'&&phase==='pass'){
      ctx.textAlign='center';ctx.fillStyle='rgba(255,220,90,0.95)';ctx.font='bold 21px sans-serif';
      ctx.fillText('パスコースを読め——通る一瞬に足を出してカット！',W/2,40);
      // window progress
      const p=clamp(clk/travelDur,0,1), bw=300, bx=W/2-bw/2, by=58;
      const wl=(arriveT-w)/travelDur, wr=(arriveT+w)/travelDur;
      ctx.fillStyle='rgba(255,255,255,0.16)';rr(bx,by,bw,8,4);ctx.fill();
      ctx.fillStyle='rgba(140,255,160,0.5)';rr(bx+bw*wl,by,bw*(wr-wl),8,4);ctx.fill();
      ctx.fillStyle='#ffd24d';rr(bx+bw*p-1.5,by-2,3,12,1);ctx.fill();
    }
    if(state==='play'){ ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,0.55)';ctx.font='12px sans-serif';
      ctx.fillText('パスが緑帯（自分の間合い）を通る瞬間にタップ/クリック/SPACE＝足を出してインターセプト',W/2,H-16); }
  }

  for(const p of parts){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,3.2,0,6.28);ctx.fill();}
  ctx.globalAlpha=1;
  for(const p of pops){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.font='bold 20px sans-serif';ctx.textAlign='center';ctx.fillText(p.txt,p.x,p.y);}
  ctx.globalAlpha=1;

  // HUD
  ctx.textAlign='left';ctx.fillStyle='#fff';ctx.font='bold 26px sans-serif';ctx.fillText('SCORE '+score,20,36);
  ctx.textAlign='right';ctx.fillStyle='rgba(255,255,255,0.9)';ctx.font='14px sans-serif';ctx.fillText('カット '+outs+'  Lv'+lvl,W-20,24);
  ctx.fillText('失敗',W-92,46);
  for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(W-60+i*20,41,7,0,6.28);ctx.fillStyle=i<fails?'#ff5b5b':'rgba(255,255,255,0.25)';ctx.fill();}
  if(combo>=2){ctx.textAlign='center';ctx.fillStyle='#ffd24d';ctx.font='bold 18px sans-serif';ctx.fillText('コンボ x'+combo,W/2,H-40);}

  if(state==='play'&&phase==='result'&&msg){ctx.textAlign='center';ctx.fillStyle=msgOk?'#9ff0b8':'#ff9a9a';ctx.font='bold 14px sans-serif';ctx.fillText(msg,W/2,300);}

  if(state==='title'){
    ctx.fillStyle='rgba(3,10,6,0.84)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='bold 42px sans-serif';ctx.fillText('パスを狩れ',W/2,80);
    ctx.fillStyle='#ffd23e';ctx.font='bold 22px sans-serif';ctx.fillText('Nick the Pass',W/2,116);
    ctx.fillStyle='rgba(255,255,255,0.92)';ctx.font='16px sans-serif';
    ctx.fillText('守備者として、相手の横パスのコースを読み、通る一瞬に足を出してインターセプト＝カウンターを発動しろ',W/2,170);
    ctx.fillStyle='rgba(255,255,255,0.66)';ctx.font='14px sans-serif';
    ctx.fillText('パスがあなたの間合い（緑帯）を通過する“その瞬間”にタップ/クリック/SPACE/↑＝足を出してカット',W/2,210);
    ctx.fillText('ドンピシャで刺せばボールを奪ってそのままカウンター＝大量加点＆コンボ',W/2,234);
    ctx.fillText('飛び出しが早い＝パスの前で足を出して抜かれ背後を突かれる／遅い＝受け手にパスを通される',W/2,258);
    ctx.fillText('速いパス（tough）ほど間合いが狭い。上級ほどパスが速く窓が短い。3失敗で交代',W/2,282);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で開始',W/2,350);
    ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='14px sans-serif';ctx.fillText('BEST '+best,W/2,382);
  }
  if(state==='over'){
    ctx.fillStyle='rgba(3,10,6,0.86)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#ff6b6b';ctx.font='bold 46px sans-serif';ctx.fillText('3失敗…交代',W/2,222);
    ctx.fillStyle='#fff';ctx.font='bold 40px sans-serif';ctx.fillText('SCORE '+score,W/2,290);
    ctx.fillStyle='rgba(255,255,255,0.85)';ctx.font='19px sans-serif';ctx.fillText('カット '+outs+'   BEST '+best,W/2,330);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で もう一度',W/2,402);
  }

  if(flash>0.02){ctx.globalAlpha=flash*0.5;ctx.fillStyle=flashCol;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}
  ctx.restore();

  ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,0.4)';ctx.font='12px sans-serif';
  ctx.fillText('パスを狩れ：相手の横パスが自分の間合い（緑帯）を通る瞬間に足を出してインターセプト。早い＝背後を突かれ、遅い＝通される、3失敗で交代',W/2,H-8);
}

function frame(ts){let dt=ts-last;last=ts;if(dt>60)dt=60;if(dt<0)dt=0;update(dt);render();requestAnimationFrame(frame);}
requestAnimationFrame(frame);

// ---------- test hook ----------
window.__np={
  start, act:()=>act(),
  get state(){return state;},
  get score(){return score;},
  get outs(){return outs;},
  get fails(){return fails;},
  get info(){return {state,phase,clk,arriveT,w,travelDur,tough,decided,result,outs,fails,lvl,
    inWindow:(phase==='pass'&&Math.abs(clk-arriveT)<=w),canAct:(phase==='pass'&&!decided)};}
};
})();
</script>
</body>
</html>
