<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ランニングホームラン (Inside the Park)</title>
<style>
  html,body{margin:0;height:100%;background:#0a1018;overflow:hidden;
    font-family:-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  #stage{position:relative;width:100vw;height:100vh;max-width:calc(100vh*1.5);max-height:calc(100vw/1.5);aspect-ratio:900/600;}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;border-radius:6px;}
</style>
</head>
<body>
<div id="wrap"><div id="stage"><canvas id="cv"></canvas></div></div>
<script>
(function(){
const W=900,H=600,cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let DPR=1;
function fit(){DPR=Math.min(2,window.devicePixelRatio||1);cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
fit();addEventListener('resize',fit);

// ---------- audio ----------
let AC=null;function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function tone(f,d,type,v,sweep){const a=ac();if(!a)return;const t=a.currentTime,o=a.createOscillator(),g=a.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(sweep)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+sweep),t+d);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v||0.2,t+0.008);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+0.02);}
function noise(d,v,hp){const a=ac();if(!a)return;const t=a.currentTime,n=Math.floor(a.sampleRate*d),buf=a.createBuffer(1,n,a.sampleRate),ch=buf.getChannelData(0);
  for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource();s.buffer=buf;
  const f=a.createBiquadFilter();f.type='highpass';f.frequency.value=hp||600;const g=a.createGain();g.gain.value=v||0.2;
  s.connect(f);f.connect(g);g.connect(a.destination);s.start(t);s.stop(t+d+0.02);}
const S={
  turn:()=>{tone(560,0.07,'square',0.12,120);noise(0.03,0.06,600);},
  wide:()=>{tone(240,0.1,'sawtooth',0.1,-60);},
  safe:()=>{[660,880,1100,1320,1650].forEach((f,i)=>setTimeout(()=>tone(f,0.13,'triangle',0.2),i*70));noise(0.4,0.1,300);},
  out:()=>{tone(240,0.3,'sawtooth',0.2,-120);setTimeout(()=>tone(170,0.28,'sawtooth',0.16,-70),120);},
  slide:()=>{noise(0.2,0.2,300);},
  over:()=>{[440,330,247,175].forEach((f,i)=>setTimeout(()=>tone(f,0.3,'triangle',0.2),i*160));}
};

// ---------- geometry ----------
const PTS=[{x:450,y:500},{x:664,y:342},{x:450,y:188},{x:236,y:342},{x:450,y:500}];
const BNAME=['','一塁','二塁','三塁','本塁'];

// ---------- state ----------
let state='title', phase='run', t=0, plays=0;
let score=0, best=+(localStorage.getItem('itp_best')||0);
let scores=0, outs=0, lvl=1;
let R=null, thr=null, result=null, resultT=0, msg='', msg2='';
let shake=0, flash=0, flashCol='#fff', last=performance.now();
let parts=[], pops=[];

function rnd(a,b){return a+Math.random()*(b-a);}
function chance(p){return Math.random()<p;}
function clamp(v,a,b){return v<a?a:v>b?b:v;}

function reset(){state='title';score=0;scores=0;outs=0;lvl=1;plays=0;R=null;result=null;parts=[];pops=[];}

function newPlay(){
  plays++;
  lvl=Math.min(6,1+Math.floor(plays/2));
  const vBase=0.00120;
  R={pos:0.001, vBase, slow:0, boost:0, armed:false, tights:0, wides:0, curBase:1, done:[false,false,false,false,false]};
  const throwT=Math.max(3320, 3760-lvl*70);   // ms for relay to reach home (perfect circuit always beats it)
  thr={t:0, T:throwT, pos:0};
  result=null; phase='run'; t=0;
  msg='一気に回れ！ 各塁でタイトにターン'; msg2='ベース手前の緑でタップ＝減速せず回る';
}

function start(){ if(!ac())ac(); if(AC&&AC.state==='suspended')AC.resume(); reset(); state='play'; newPlay(); }

// window: approaching base k when pos in [k-0.17, k-0.01]
function turnWindow(){
  const k=R.curBase; if(k>4)return null;
  const c=k-0.095, hw=0.078-lvl*0.006;           // window narrows with level
  const lo=c-hw, hi=c+hw, perfLo=c-hw*0.5, perfHi=c+hw*0.5;
  return {k,lo,hi,perfLo,perfHi, inW:R.pos>=lo&&R.pos<=hi, inPerf:R.pos>=perfLo&&R.pos<=perfHi};
}

// ---------- tap ----------
function tap(){
  if(state==='title'){start();return;}
  if(state==='over'){ if(resultT>0.5){reset();start();} return; }
  if(state!=='play'||phase!=='run'||!R) return;
  const w=turnWindow(); if(!w||R.armed)return;
  if(w.inW){ R.armed=true; R.armPerf=w.inPerf; S.turn();
    const p=PTS[Math.min(4,R.curBase)]; pop(p.x,p.y-24, w.inPerf?'タイト！':'ターン','#eaffef');
    burst(p.x,p.y,w.inPerf?'#8ff0b8':'#cfe8ff',10,4);
  }
}

// ---------- update ----------
function update(dt){
  shake*=Math.pow(0.86,dt/16.7); if(shake<0.3)shake=0;
  flash*=Math.pow(0.9,dt/16.7);
  for(const p of parts){p.vx*=0.96;p.vy=p.vy*0.96+0.3;p.x+=p.vx*dt/16.7;p.y+=p.vy*dt/16.7;p.life-=dt/16.7*0.026;}
  parts=parts.filter(p=>p.life>0);
  for(const p of pops){p.y-=dt/16.7*0.5;p.life-=dt/16.7*0.02;}
  pops=pops.filter(p=>p.life>0);

  if(state!=='play'){ if(state==='over')resultT+=dt/1000; return; }
  t+=dt;

  if(phase==='run'){
    // relay throw racing home
    thr.t+=dt; thr.pos=clamp(thr.t/thr.T,0,1);
    // runner speed
    if(R.slow>0)R.slow-=dt;
    if(R.boost>0)R.boost-=dt;
    let sp=R.vBase*(R.slow>0?0.46:1)*(R.boost>0?1.16:1);
    R.pos+=sp*dt;
    // crossing a base
    const k=R.curBase;
    if(k<=4 && R.pos>=k-0.005 && !R.done[k]){
      R.done[k]=true;
      if(R.armed){ R.tights++; R.boost=220; if(R.armPerf){R.boost=300;} }
      else { R.wides++; R.slow=440; S.wide(); const p=PTS[Math.min(4,k)]; pop(p.x,p.y-24,'膨らんだ','#ffb3b3'); burst(p.x,p.y,'#caa',8,4);}
      R.armed=false; R.armPerf=false; R.curBase=k+1;
      if(k===4){ // reached home
        const rp=PTS[4]; phase='resolve';
        if(thr.pos<1.0){ applyResult(R.wides===0?'safeperfect':'safe'); }
        else applyResult('out');
        return;
      }
    }
    // if throw beats runner home before arrival (runner still on 4th leg and throw done and runner far)
    if(thr.pos>=1 && R.curBase>=4 && R.pos<3.86){ /* still coming, will be out at home */ }
    return;
  }
  if(phase==='resolve'){
    resultT+=dt/1000;
    if(resultT>1.25){
      if(outs>=3){ state='over'; resultT=0; S.over(); if(score>best){best=score;localStorage.setItem('itp_best',best);} }
      else newPlay();
    }
    return;
  }
}

function applyResult(kind){
  result=kind; resultT=0; phase='resolve';
  const rp=PTS[4];
  if(kind==='safe'||kind==='safeperfect'){
    const bonus=R.tights*30 + (kind==='safeperfect'?200:0);
    const add=300+bonus; score+=add; scores++;
    (kind==='safeperfect')?S.safe():S.safe();
    flash=1;flashCol=kind==='safeperfect'?'#ffe08a':'#8ff0b8'; shake=14;
    burst(rp.x,rp.y,kind==='safeperfect'?'#ffe08a':'#bfffd0',34,8);
    pop(rp.x,rp.y-34,(kind==='safeperfect'?'完璧な走塁！ ':'生還！ ')+'+'+add,'#eaffef');
    msg=kind==='safeperfect'?'ランニングホームラン！ 全塁タイトで快足':'生還！ ランニングホームラン'; msg2='タイト '+R.tights+'/4';
  } else {
    outs++; S.out(); S.slide();
    flash=1;flashCol='#ff6b6b'; shake=12;
    burst(rp.x,rp.y,'#ff8a8a',18,6);
    msg='本塁タッチアウト！ 返球に刺された'; msg2='膨らんだターンでロス（ワイド '+R.wides+'）';
    pop(rp.x,rp.y-28,'アウト','#ffb3b3');
  }
}

// ---------- input ----------
cv.addEventListener('pointerdown',e=>{e.preventDefault();tap();});
addEventListener('keydown',e=>{ if(e.code==='Space'||e.code==='Enter'||e.code==='ArrowUp'){e.preventDefault();tap();}});

// ---------- particles ----------
function burst(x,y,c,n,sp){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=rnd(sp*0.3,sp);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:1,c});}}
function pop(x,y,txt,c){pops.push({x,y,txt,c,life:1});}

// ---------- render ----------
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

function runnerXY(){
  const seg=clamp(Math.floor(R.pos),0,3), fr=clamp(R.pos-seg,0,1);
  return {x:PTS[seg].x+(PTS[seg+1].x-PTS[seg].x)*fr, y:PTS[seg].y+(PTS[seg+1].y-PTS[seg].y)*fr};
}

function drawScene(){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#16273e');g.addColorStop(0.5,'#1d5233');g.addColorStop(1,'#227a46');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  // infield dirt
  ctx.fillStyle='rgba(150,95,55,0.5)';ctx.beginPath();ctx.moveTo(PTS[0].x,PTS[0].y);ctx.lineTo(PTS[1].x,PTS[1].y);ctx.lineTo(PTS[2].x,PTS[2].y);ctx.lineTo(PTS[3].x,PTS[3].y);ctx.closePath();ctx.fill();
  ctx.fillStyle='rgba(34,120,64,0.6)';ctx.beginPath();ctx.moveTo(PTS[0].x,PTS[0].y-8);ctx.lineTo(PTS[1].x-10,PTS[1].y);ctx.lineTo(PTS[2].x,PTS[2].y+8);ctx.lineTo(PTS[3].x+10,PTS[3].y);ctx.closePath();ctx.fill();
  // base path
  ctx.strokeStyle='rgba(220,200,160,0.55)';ctx.lineWidth=9;ctx.lineCap='round';ctx.lineJoin='round';
  ctx.beginPath();ctx.moveTo(PTS[0].x,PTS[0].y);for(let i=1;i<PTS.length;i++)ctx.lineTo(PTS[i].x,PTS[i].y);ctx.stroke();
  // bases
  for(let i=1;i<=4;i++){const b=PTS[i%4===0?4:i]; ctx.save();ctx.translate(b.x,b.y);ctx.rotate(Math.PI/4);ctx.fillStyle='#f0f0f0';ctx.fillRect(-11,-11,22,22);ctx.restore();}
  // home plate
  const hp=PTS[0];ctx.fillStyle='#eee';ctx.beginPath();ctx.moveTo(hp.x,hp.y+10);ctx.lineTo(hp.x-13,hp.y);ctx.lineTo(hp.x-13,hp.y-9);ctx.lineTo(hp.x+13,hp.y-9);ctx.lineTo(hp.x+13,hp.y);ctx.closePath();ctx.fill();
}

function render(){
  ctx.save();
  if(shake>0)ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
  drawScene();

  if(R){
    // turn window ring at the upcoming base
    const w=turnWindow();
    if(state==='play'&&phase==='run'&&w&&w.k<=4){
      const b=PTS[w.k]; const on=w.inW;
      ctx.strokeStyle=on?(w.inPerf?'rgba(126,240,176,0.95)':'rgba(126,240,176,0.7)'):'rgba(255,255,255,0.25)';
      ctx.lineWidth=on?5:2;ctx.beginPath();ctx.arc(b.x,b.y,26,0,6.28);ctx.stroke();
      if(on){ctx.fillStyle='#8ff0b8';ctx.font='bold 13px sans-serif';ctx.textAlign='center';ctx.fillText('今！',b.x,b.y-32);}
    }
    // relay ball approaching home
    if(thr){ const from={x:640,y:150}; const to=PTS[4];
      const bx=from.x+(to.x-from.x)*thr.pos, by=from.y+(to.y-from.y)*thr.pos - Math.sin(thr.pos*Math.PI)*30;
      ctx.strokeStyle='rgba(255,255,255,0.12)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(from.x,from.y);ctx.lineTo(bx,by);ctx.stroke();
      ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(bx,by,6,0,6.28);ctx.fill();ctx.strokeStyle='#c33';ctx.lineWidth=1.2;ctx.beginPath();ctx.arc(bx,by,6,0.4,2.3);ctx.stroke();
      // catcher at home
      const c=PTS[4];ctx.fillStyle='#22d3a6';rr(c.x+16,c.y-24,16,22,6);ctx.fill();ctx.fillStyle='#f2c9a0';ctx.beginPath();ctx.arc(c.x+24,c.y-30,6,0,6.28);ctx.fill();
    }
    // runner
    const rp=runnerXY();
    const sliding=phase==='resolve';
    ctx.fillStyle='rgba(0,0,0,0.24)';ctx.beginPath();ctx.ellipse(rp.x,rp.y+14,13,5,0,0,6.28);ctx.fill();
    // speed lines when boosting
    if(R.boost>0){ ctx.strokeStyle='rgba(255,255,255,0.3)';ctx.lineWidth=2;for(let i=0;i<3;i++){ctx.beginPath();ctx.moveTo(rp.x-14-i*8,rp.y-6+i*6);ctx.lineTo(rp.x-24-i*8,rp.y-6+i*6);ctx.stroke();}}
    ctx.save();ctx.translate(rp.x,rp.y);if(sliding&&result&&result.indexOf('safe')>=0)ctx.rotate(0.7);
    ctx.fillStyle='#2b6cff';rr(-8,-6,16,22,6);ctx.fill();
    ctx.fillStyle='#f2c9a0';ctx.beginPath();ctx.arc(0,-14,7,0,6.28);ctx.fill();
    ctx.fillStyle='#1a3a8a';ctx.beginPath();ctx.arc(0,-16,7.5,Math.PI,0);ctx.fill();
    ctx.restore();
  }

  for(const p of parts){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,3.2,0,6.28);ctx.fill();}
  ctx.globalAlpha=1;
  for(const p of pops){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.font='bold 21px sans-serif';ctx.textAlign='center';ctx.fillText(p.txt,p.x,p.y);}
  ctx.globalAlpha=1;

  // relay progress bar
  if(state==='play'){ const bx=300,by=44,bw=300;
    ctx.fillStyle='rgba(0,0,0,0.3)';rr(bx,by,bw,9,4);ctx.fill();
    ctx.fillStyle=thr&&thr.pos>0.8?'#ff5b5b':'#ffb15b';rr(bx,by,bw*(thr?thr.pos:0),9,4);ctx.fill();
    ctx.fillStyle='rgba(255,255,255,0.6)';ctx.font='11px sans-serif';ctx.textAlign='left';ctx.fillText('返球',bx-34,by+9);
  }

  // HUD
  ctx.textAlign='left';ctx.fillStyle='#fff';ctx.font='bold 26px sans-serif';ctx.fillText('SCORE '+score,20,36);
  ctx.textAlign='right';ctx.fillStyle='rgba(255,255,255,0.85)';ctx.font='14px sans-serif';ctx.fillText('生還 '+scores+'  Lv.'+lvl,W-20,26);
  ctx.fillText('アウト',W-100,50);
  for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(W-70+i*22,46,7,0,6.28);ctx.fillStyle=i<outs?'#ff5b5b':'rgba(255,255,255,0.25)';ctx.fill();}

  if(state==='play'&&(msg||msg2)){
    ctx.textAlign='center';
    const good=result&&result.indexOf('safe')>=0;
    ctx.fillStyle=result?(good?'#8ff0b8':'#ff9a9a'):'rgba(255,255,255,0.92)';
    ctx.font='bold 25px sans-serif';ctx.fillText(msg,W/2,H-52);
    if(msg2){ctx.fillStyle='rgba(255,255,255,0.72)';ctx.font='15px sans-serif';ctx.fillText(msg2,W/2,H-28);}
  }

  if(state==='title'){
    ctx.fillStyle='rgba(6,10,18,0.66)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='bold 40px sans-serif';ctx.fillText('ランニングホームラン',W/2,180);
    ctx.fillStyle='#8ff0b8';ctx.font='bold 22px sans-serif';ctx.fillText('Inside the Park',W/2,216);
    ctx.fillStyle='rgba(255,255,255,0.9)';ctx.font='18px sans-serif';
    ctx.fillText('ダイヤモンドを一周！ 各塁の手前の“緑の輪”でタップ＝タイトなターン',W/2,278);
    ctx.fillText('（クリック / タップ / SPACE）＝減速せず加速して回る',W/2,306);
    ctx.fillStyle='rgba(255,255,255,0.66)';ctx.font='15px sans-serif';
    ctx.fillText('外すと膨らんで減速＝タイムロス。中継返球が本塁に届く前に生還せよ',W/2,348);
    ctx.fillText('全塁タイトなら快足で余裕の生還＝高得点。3アウトで交代',W/2,372);
    ctx.fillStyle='#ffe08a';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で開始',W/2,434);
    ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='14px sans-serif';ctx.fillText('BEST '+best,W/2,466);
  }
  if(state==='over'){
    ctx.fillStyle='rgba(6,10,18,0.74)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#ff6b6b';ctx.font='bold 46px sans-serif';ctx.fillText('3アウト…交代',W/2,230);
    ctx.fillStyle='#fff';ctx.font='bold 40px sans-serif';ctx.fillText('SCORE '+score,W/2,296);
    ctx.fillStyle='rgba(255,255,255,0.85)';ctx.font='20px sans-serif';ctx.fillText('生還 '+scores+'   BEST '+best,W/2,336);
    ctx.fillStyle='#8ff0b8';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で もう一度',W/2,408);
  }

  if(flash>0.02){ctx.globalAlpha=flash*0.5;ctx.fillStyle=flashCol;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}
  ctx.restore();

  ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,0.4)';ctx.font='13px sans-serif';
  ctx.fillText('各塁手前の緑の輪でタップ＝タイトに回って加速。膨らむと減速。返球より先に生還。3アウトで交代',W/2,H-8);
}

function frame(ts){let dt=ts-last;last=ts;if(dt>60)dt=60;if(dt<0)dt=0;update(dt);render();requestAnimationFrame(frame);}
requestAnimationFrame(frame);

// ---------- test hook ----------
window.__ip={
  start, tap,
  get state(){return state;},
  get score(){return score;},
  get scores(){return scores;},
  get outs(){return outs;},
  get info(){const w=R?turnWindow():null; return {state,phase, pos:R?R.pos:0, curBase:R?R.curBase:0,
    inW:w?w.inW:false, inPerf:w?w.inPerf:false, armed:R?R.armed:false, throwPos:thr?thr.pos:0,
    tights:R?R.tights:0, wides:R?R.wides:0, result, scores, outs, lvl};}
};
})();
</script>
</body>
</html>
