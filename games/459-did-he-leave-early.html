<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>離塁は早かったか？ (Did He Leave Early?)</title>
<style>
  html,body{margin:0;padding:0;background:#0a1016;overflow:hidden;font-family:'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif;-webkit-user-select:none;user-select:none;touch-action:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 22%,#24405c,#060a12 72%);}
  #stage{position:relative;width:min(100vw,calc(100vh*1.5));aspect-ratio:900/600;max-width:900px;box-shadow:0 10px 60px rgba(0,0,0,.6);border-radius:8px;overflow:hidden;}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;}
</style>
</head>
<body>
<div id="wrap"><div id="stage"><canvas id="cv"></canvas></div></div>
<script>
(function(){
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const W=900,H=600;let DPR=Math.min(2,window.devicePixelRatio||1);
function fit(){const r=cv.getBoundingClientRect();DPR=Math.min(2,window.devicePixelRatio||1);cv.width=Math.round(r.width*DPR);cv.height=Math.round(r.height*DPR);ctx.setTransform(cv.width/W,0,0,cv.height/H,0,0);}
new ResizeObserver(fit).observe(cv);fit();

// ---------- audio ----------
let AC=null;function actx(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function tone(f,d,type,v,sweep){const a=actx();if(!a)return;const o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.value=f;if(sweep)o.frequency.linearRampToValueAtTime(sweep,a.currentTime+d);g.gain.value=0.0001;g.gain.exponentialRampToValueAtTime(v||0.2,a.currentTime+0.008);g.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+d);o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+d+0.02);}
function noise(d,v,hp){const a=actx();if(!a)return;const n=a.createBufferSource(),b=a.createBuffer(1,a.sampleRate*d,a.sampleRate),dt=b.getChannelData(0);for(let i=0;i<dt.length;i++)dt[i]=Math.random()*2-1;n.buffer=b;const f=a.createBiquadFilter();f.type='highpass';f.frequency.value=hp||800;const g=a.createGain();g.gain.value=0.0001;g.gain.exponentialRampToValueAtTime(v||0.2,a.currentTime+0.01);g.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+d);n.connect(f);f.connect(g);g.connect(a.destination);n.start();n.stop(a.currentTime+d+0.02);}
const S={
  glove(){noise(0.05,0.2,900);tone(300,0.05,'square',0.14);},        // ball into the glove
  right(){tone(560,0.1,'triangle',0.2);setTimeout(function(){tone(760,0.14,'triangle',0.22);},110);},
  wrong(){tone(280,0.32,'sawtooth',0.18,150);setTimeout(function(){tone(180,0.4,'sawtooth',0.16,110);},150);},
  roar(){noise(0.5,0.14,300);},
  combo(n){tone(600+Math.min(n,8)*70,0.12,'triangle',0.16);},
  over(){tone(330,0.3,'sine',0.2,160);setTimeout(function(){tone(220,0.5,'sine',0.2,110);},180);},
  start(){tone(440,0.1,'triangle',0.18);setTimeout(function(){tone(660,0.16,'triangle',0.2);},110);},
};

function clamp(v,a,b){return v<a?a:v>b?b:v;}
function rnd(a,b){return a+Math.random()*(b-a);}

// ---------- state ----------
// truth 'safe' = still touching third at the catch (legal tag-up) ; 'out' = foot lifted before the catch (left early)
let state='title';
let outs=0,fails=0,score=0,combo=0,lvl=1;   // outs = correct calls
let best=0;try{best=parseInt(localStorage.getItem('tu_best')||'0')||0;}catch(e){}
const TARGET=26;

let phase='wind';  // wind | watch | result
let pt=0, clock=0;
let revealT=500, callWin=1000, tough=false, truth='safe';
let decided=false, result='', called='';
let margin=20, footOff=0;                    // how far the foot is from the bag at the catch instant
// scene geometry
const OF=[430,176], THIRD=[664,378], HOME=[452,528];
let bx=412,by=64, caught=0, runU=0;
let parts=[];
let shakeT=0,flash=0;
let msg='',msgCol='#fff',msgT=0;
let lastAdd=0;

function reset(){outs=0;fails=0;score=0;combo=0;lvl=1;parts=[];}
function newPlay(){
  lvl=Math.min(7,1+Math.floor(outs/4));
  revealT=clamp(560-lvl*24,360,560);
  callWin=clamp(1020-lvl*70,560,1020);
  tough=Math.random()<clamp(0.2+lvl*0.05,0.2,0.5);
  truth=Math.random()<0.5?'safe':'out';
  margin=tough?rnd(4,11):rnd(16,32);
  footOff=(truth==='out')?margin:-margin;    // out: foot lifted (above the bag) ; safe: still pressing on it
  phase='wind';pt=0;clock=0;decided=false;result='';called='';caught=0;runU=0;
  bx=412;by=64;
}
function startGame(){reset();state='play';newPlay();S.start();}

function burst(x,y,col,n,sp){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=rnd(0.4,1)*(sp||3);parts.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:1,col:col,r:rnd(2,5)});}}

function resolve(kind){
  decided=true;result=kind;
  if(kind==='right'){
    outs++;combo++;
    const cm=1+Math.min(combo-1,6)*0.13;
    const add=Math.round((100+(tough?60:0))*cm)*Math.max(1,lvl);
    score+=add;lastAdd=add;
    S.right();if(combo>1)setTimeout(function(){S.combo(combo);},250);
    flash=0.26;burst(THIRD[0],THIRD[1],truth==='out'?'#ff9a5a':'#5affa0',13,3);
    msg='正しいジャッジ！ '+(truth==='out'?'捕球より早く離塁——アピールアウト！':'正当な離塁——セーフで生還！')+'  +'+add;msgCol='#5affa0';msgT=1;
  }else{
    combo=0;fails++;
    S.wrong();flash=0.36;shakeT=0.7;
    if(result==='early')msg='早すぎる！ まだ外野手が捕球していない';
    else if(result==='late')msg='判定が遅い！ 両ベンチがもめ出す';
    else msg='誤審！ 本当は'+(truth==='out'?'早い離塁（アピールアウト）だった':'正当な離塁（セーフ）だった');
    msgCol='#ff6a6a';msgT=1;
  }
  phase='result';pt=0;
}

function makeCall(c){
  if(state!=='play'||phase!=='watch'||decided)return;
  called=c;
  if(clock<revealT){resolve('early');return;}
  const correct=(c===truth);
  resolve(correct?'right':'wrong');
}

// ---------- input ----------
// left button / A = セーフ（正当） ; right button / D = アウト（早い離塁）
function actSafe(){if(!AC)actx();if(state==='title'){startGame();return;}if(state==='over'){startGame();return;}makeCall('safe');}
function actOut(){if(!AC)actx();if(state==='title'){startGame();return;}if(state==='over'){startGame();return;}makeCall('out');}
cv.addEventListener('mousedown',function(e){e.preventDefault();
  if(state!=='play'){actSafe();return;}
  const r=cv.getBoundingClientRect();const x=(e.clientX-r.left)/r.width*W;
  if(x<450)actSafe();else actOut();
});
cv.addEventListener('touchstart',function(e){e.preventDefault();
  if(state!=='play'){actSafe();return;}
  const r=cv.getBoundingClientRect();const t=e.changedTouches[0];const x=(t.clientX-r.left)/r.width*W;
  if(x<450)actSafe();else actOut();
},{passive:false});
window.addEventListener('keydown',function(e){
  if(e.code==='ArrowLeft'||e.code==='KeyA'){e.preventDefault();actSafe();}
  else if(e.code==='ArrowRight'||e.code==='KeyD'){e.preventDefault();actOut();}
  else if(e.code==='Space'||e.code==='Enter'){e.preventDefault();if(state!=='play')actSafe();}
});

// ---------- update ----------
let last=0;
function update(dt){
  if(flash>0)flash=Math.max(0,flash-dt/300);
  if(shakeT>0)shakeT=Math.max(0,shakeT-dt/320);
  if(msgT>0)msgT=Math.max(0,msgT-dt/1500);
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.x+=p.vx;p.y+=p.vy;p.vy+=0.16;p.life-=dt/640;if(p.life<=0)parts.splice(i,1);}
  if(state!=='play')return;
  pt+=dt;
  if(phase==='wind'){
    if(pt>=440){phase='watch';pt=0;clock=0;}
  }else if(phase==='watch'){
    clock+=dt;
    if(clock<revealT){
      // fly ball descends into the outfielder's glove
      const u=clamp(clock/revealT,0,1);
      bx=412+(OF[0]+8-412)*u;
      by=64+(OF[1]-16-64)*u;
    }else{
      if(caught<0.02)S.glove();
      caught=Math.min(1,caught+dt/200);
      bx=OF[0]+8;by=OF[1]-16;
      runU=Math.min(1,runU+dt/900);   // the runner breaks for home the instant of the catch
    }
    if(clock>=revealT+callWin&&!decided)resolve('late');
  }else if(phase==='result'){
    caught=Math.min(1,caught+dt/200);
    if(result==='right'||result==='wrong'||result==='late'){
      if(truth==='safe'||result==='wrong')runU=Math.min(1,runU+dt/700);   // safe runner keeps going home
    }
    if(pt>=1080){
      if(fails>=3){state='over';best=Math.max(best,score);try{localStorage.setItem('tu_best',String(best));}catch(e){}S.over();}
      else if(outs>=TARGET){state='over';best=Math.max(best,score);try{localStorage.setItem('tu_best',String(best));}catch(e){}S.roar();}
      else newPlay();
    }
  }
}

// ---------- render ----------
function roundRect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

function drawField(){
  // outfield grass beyond
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#2f7d45');g.addColorStop(1,'#215c33');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#1f6b39';ctx.fillRect(0,96,W,10);   // outfield wall hint
  for(let i=0;i<10;i++){ctx.fillStyle=i%2?'rgba(255,255,255,.03)':'rgba(0,0,0,.04)';ctx.fillRect(i*90,106,90,H-106);}
  // infield dirt: third-base line home<->third
  ctx.strokeStyle='rgba(255,255,255,.7)';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(HOME[0],HOME[1]);ctx.lineTo(THIRD[0],THIRD[1]);ctx.stroke();
  ctx.fillStyle='#8a5a34';ctx.beginPath();ctx.ellipse(THIRD[0],THIRD[1],54,34,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#8a5a34';ctx.beginPath();ctx.ellipse(HOME[0],HOME[1],70,40,0,0,Math.PI*2);ctx.fill();
  // third base
  ctx.save();ctx.translate(THIRD[0],THIRD[1]);ctx.rotate(Math.PI/4);ctx.fillStyle='#eee';ctx.fillRect(-11,-11,22,22);ctx.restore();
  ctx.fillStyle='rgba(255,255,255,.6)';ctx.font='bold 13px sans-serif';ctx.textAlign='center';ctx.fillText('三塁',THIRD[0],THIRD[1]-26);
  // home plate
  ctx.fillStyle='#eee';ctx.beginPath();ctx.moveTo(HOME[0],HOME[1]+12);ctx.lineTo(HOME[0]+11,HOME[1]+2);ctx.lineTo(HOME[0]+11,HOME[1]-6);ctx.lineTo(HOME[0]-11,HOME[1]-6);ctx.lineTo(HOME[0]-11,HOME[1]+2);ctx.closePath();ctx.fill();
}

function drawPlay(){
  // outfielder making the catch (glove up), flashes at the catch
  const cx=OF[0],cy=OF[1];
  ctx.save();ctx.translate(cx,cy);
  ctx.fillStyle='rgba(0,0,0,.25)';ctx.beginPath();ctx.ellipse(0,26,16,5,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#222';ctx.fillRect(-8,8,7,20);ctx.fillRect(1,8,7,20);
  ctx.fillStyle='#2f5f8f';ctx.fillRect(-11,-14,22,26);
  ctx.fillStyle='#f0c9a0';ctx.beginPath();ctx.arc(0,-24,8,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='#2f5f8f';ctx.lineWidth=6;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(6,-8);ctx.lineTo(12,-30);ctx.stroke();
  ctx.fillStyle=caught>0?'#8a5a2a':'#7a4e24';ctx.beginPath();ctx.arc(14,-34,9+caught*2,0,Math.PI*2);ctx.fill();
  if(caught>0){ctx.strokeStyle='rgba(255,240,180,'+clamp(1-caught,0,1)+')';ctx.lineWidth=3;ctx.beginPath();ctx.arc(14,-34,10+caught*12,0,Math.PI*2);ctx.stroke();}
  ctx.restore();
  // ball (in flight, then in the glove)
  if(caught<1){
    ctx.strokeStyle='rgba(255,255,255,.3)';ctx.lineWidth=4;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(bx-6,by-10);ctx.lineTo(bx,by);ctx.stroke();
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(bx,by,6,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='#d33';ctx.lineWidth=1;ctx.beginPath();ctx.arc(bx-2,by,4,-0.7,0.7);ctx.stroke();
  }
  // third-base runner tagging up, then breaking for home on the catch
  const rp=[THIRD[0]+(HOME[0]-THIRD[0])*runU*0.9, THIRD[1]+(HOME[1]-THIRD[1])*runU*0.9];
  ctx.save();ctx.translate(rp[0],rp[1]);
  ctx.fillStyle='rgba(0,0,0,.28)';ctx.beginPath();ctx.ellipse(0,4,13,5,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#222';ctx.fillRect(-8,-4,7,20);ctx.fillRect(1,-4,7,20);
  ctx.fillStyle='#c0343a';ctx.fillRect(-11,-30,22,28);
  ctx.fillStyle='#f0c9a0';ctx.beginPath();ctx.arc(0,-40,8,0,Math.PI*2);ctx.fill();
  ctx.restore();
}

function drawReveal(){
  if(!(phase==='watch'&&clock>=revealT&&!decided)&&!(phase==='result'&&pt<900))return;
  ctx.textAlign='center';ctx.font='bold 22px sans-serif';
  if(truth==='out'){ctx.fillStyle='#ff9a5a';ctx.fillText('捕球の瞬間、足は塁を離れていた',450,52);}
  else{ctx.fillStyle='#9fe0bf';ctx.fillText('捕球の瞬間、足はまだ三塁に触れていた',450,52);}
  // replay inset: the runner's foot vs the base surface at the exact catch instant
  const ix=636,iy=80,iw=240,ih=172;
  roundRect(ix,iy,iw,ih,10);ctx.fillStyle='rgba(6,14,24,.94)';ctx.fill();ctx.strokeStyle='rgba(255,255,255,.4)';ctx.lineWidth=2;ctx.stroke();
  ctx.save();ctx.beginPath();roundRect(ix,iy,iw,ih,10);ctx.clip();
  const lineY=iy+ih*0.5, sc=3.0;
  ctx.fillStyle='rgba(200,90,90,.16)';ctx.fillRect(ix,iy,iw,lineY-iy);          // above the bag = left early
  ctx.fillStyle='rgba(70,150,90,.18)';ctx.fillRect(ix,lineY,iw,ih);             // touching the bag = legal
  // the base surface (a white plate) at the reference line
  ctx.fillStyle='#dfe6ee';ctx.fillRect(ix+iw/2-40,lineY-3,80,10);
  ctx.fillStyle='#ffd23a';ctx.fillRect(ix,lineY-2,iw,3);                        // "捕球の瞬間" reference
  const lim=ih/2-16-8;
  const off=clamp(-footOff*sc,-lim,lim);   // out: footOff>0 -> above (negative y offset)
  const fx2=ix+iw/2, fy2=lineY+off;
  // the runner's foot (a shoe)
  ctx.fillStyle='#20242c';ctx.beginPath();ctx.ellipse(fx2,fy2,15,8,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#3a3f48';ctx.fillRect(fx2-15,fy2-3,30,4);
  ctx.restore();
  ctx.fillStyle='#cfe';ctx.font='12px sans-serif';ctx.fillText('リプレー検証（捕球の瞬間）',ix+iw/2,iy-8);
  ctx.fillStyle='rgba(230,150,150,.95)';ctx.font='10px sans-serif';ctx.textAlign='left';ctx.fillText('上＝離れている（早い）',ix+8,iy+16);
  ctx.textAlign='right';ctx.fillStyle='rgba(150,220,170,.95)';ctx.fillText('下＝塁に触れている',ix+iw-8,iy+ih-8);
}

function drawButtons(){
  if(state!=='play')return;
  const active=(phase==='watch'&&!decided&&clock>=revealT);
  ctx.globalAlpha=active?1:0.5;
  roundRect(70,520,320,64,12);ctx.fillStyle=(called==='safe')?'#2f9b5a':'rgba(40,130,80,.72)';ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,.5)';ctx.lineWidth=2;ctx.stroke();
  roundRect(510,520,320,64,12);ctx.fillStyle=(called==='out')?'#c87a2a':'rgba(150,100,50,.72)';ctx.fill();ctx.stroke();
  ctx.globalAlpha=1;
  ctx.textAlign='center';
  ctx.fillStyle='#c9ffd8';ctx.font='bold 24px sans-serif';ctx.fillText('セーフ',230,550);
  ctx.font='12px sans-serif';ctx.fillStyle='#a0e0b8';ctx.fillText('正当な離塁（捕球後）　← / A',230,572);
  ctx.fillStyle='#ffe0b0';ctx.font='bold 24px sans-serif';ctx.fillText('アウト',670,550);
  ctx.font='12px sans-serif';ctx.fillStyle='#e0c8a0';ctx.fillText('早い離塁（捕球前）　→ / D',670,572);
}

function drawHUD(){
  ctx.textAlign='left';ctx.textBaseline='alphabetic';
  ctx.font='bold 20px sans-serif';ctx.fillStyle='#fff';
  ctx.fillText('正審 '+outs+' / '+TARGET,20,32);
  ctx.font='14px sans-serif';ctx.fillStyle='#ffb14a';ctx.fillText('誤審 '+fails+' / 3',20,54);
  ctx.textAlign='right';
  ctx.font='bold 20px sans-serif';ctx.fillStyle='#ffe08a';ctx.fillText('SCORE '+score,W-20,32);
  ctx.font='13px sans-serif';ctx.fillStyle='#bfe';ctx.fillText('BEST '+Math.max(best,score)+'   Lv.'+lvl,W-20,52);
  if(combo>1){ctx.textAlign='center';ctx.font='bold 20px sans-serif';ctx.fillStyle='#5affa0';ctx.fillText(combo+' 連続好ジャッジ!',450,150);}
  if(phase==='watch'&&!decided&&clock<revealT){ctx.textAlign='center';ctx.font='bold 15px sans-serif';ctx.fillStyle='#ffe08a';ctx.fillText('犠飛のタッチアップ——捕球の瞬間に足が離れていたか見極めろ',450,150);}
}

function drawMsg(){
  if(msgT<=0)return;
  ctx.save();ctx.globalAlpha=clamp(msgT*1.4,0,1);
  ctx.textAlign='center';ctx.font='bold 23px sans-serif';
  ctx.fillStyle='rgba(0,0,0,.6)';roundRect(450-310,438,620,42,10);ctx.fill();
  ctx.fillStyle=msgCol;ctx.fillText(msg,450,466);
  ctx.restore();
}

function drawTitle(){
  drawField();
  ctx.save();ctx.textAlign='center';
  ctx.fillStyle='rgba(0,0,0,.72)';roundRect(96,92,708,416,16);ctx.fill();
  ctx.fillStyle='#fff';ctx.font='bold 30px sans-serif';ctx.fillText('離塁は早かったか？',450,150);
  ctx.font='18px sans-serif';ctx.fillStyle='#9fe0bf';ctx.fillText('Did He Leave Early?',450,180);
  ctx.font='16px sans-serif';ctx.fillStyle='#e6fcef';
  const lines=[
    'あなたは塁審。犠牲フライのタッチアップ（リタッチ）を裁け！',
    '外野手が捕球した“その瞬間”に三塁走者の足が',
    'まだ塁に触れていた＝正当な離塁（セーフ）、',
    'すでに塁を離れていた＝早い離塁（アピールでアウト）。',
    'リプレー検証で、捕球の瞬間の足が塁の上か離れているか見極めて判定。',
    '早すぎるコール・判定遅れ・誤審は失点。3誤審でクビ。',
    '左半分/← = セーフ、右半分/→ = アウト。',
  ];
  for(let i=0;i<lines.length;i++)ctx.fillText(lines[i],450,220+i*30);
  ctx.fillStyle='#ffe08a';ctx.font='bold 22px sans-serif';
  ctx.fillText('タップ / キーでスタート',450,480);
  ctx.restore();
}

function drawOver(){
  drawField();
  ctx.save();ctx.textAlign='center';
  ctx.fillStyle='rgba(0,0,0,.72)';roundRect(190,150,520,300,16);ctx.fill();
  const w2=outs>=TARGET;
  ctx.fillStyle=w2?'#5affa0':'#ff8a5a';ctx.font='bold 34px sans-serif';
  ctx.fillText(w2?'名塁審！':'誤審でクビ…',450,222);
  ctx.fillStyle='#fff';ctx.font='20px sans-serif';
  ctx.fillText('正審 '+outs+' / '+TARGET,450,270);
  ctx.fillText('スコア '+score,450,304);
  ctx.fillStyle='#ffe08a';ctx.fillText('ベスト '+Math.max(best,score),450,336);
  ctx.fillStyle='#9fe0bf';ctx.font='bold 20px sans-serif';
  ctx.fillText('タップ / キー でもう一度',450,404);
  ctx.restore();
}

function render(){
  ctx.save();
  if(shakeT>0){const s=shakeT*7;ctx.translate(rnd(-s,s),rnd(-s,s));}
  if(state==='title'){drawTitle();}
  else if(state==='over'){drawOver();}
  else{
    drawField();
    drawPlay();
    drawReveal();
    drawButtons();
    drawHUD();
    drawMsg();
  }
  for(const p of parts){ctx.globalAlpha=clamp(p.life,0,1);ctx.fillStyle=p.col;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();}
  ctx.globalAlpha=1;
  ctx.restore();
  if(flash>0){ctx.fillStyle='rgba(255,255,255,'+(flash*0.5)+')';ctx.fillRect(0,0,W,H);}
}

function frame(ts){let dt=ts-last;last=ts;if(dt>60)dt=60;if(dt<0)dt=0;update(dt);render();requestAnimationFrame(frame);}
requestAnimationFrame(frame);

// ---------- test hook ----------
