<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>送りバント (Lay It Down)</title>
<style>
  html,body{margin:0;height:100%;background:#0a0c12;overflow:hidden;
    font-family:-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  #stage{position:relative;width:100vw;height:100vh;max-width:calc(100vh*1.5);max-height:calc(100vw/1.5);aspect-ratio:900/600;}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;border-radius:6px;}
</style>
</head>
<body>
<div id="wrap"><div id="stage"><canvas id="cv"></canvas></div></div>
<script>
(function(){
const W=900,H=600,cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let DPR=1;
function fit(){DPR=Math.min(2,window.devicePixelRatio||1);cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
fit();addEventListener('resize',fit);

// ---------- audio ----------
let AC=null;function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function tone(f,d,type,v,sweep){const a=ac();if(!a)return;const t=a.currentTime,o=a.createOscillator(),g=a.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(sweep)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+sweep),t+d);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v||0.2,t+0.008);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+0.02);}
function noise(d,v,hp){const a=ac();if(!a)return;const t=a.currentTime,n=Math.floor(a.sampleRate*d),buf=a.createBuffer(1,n,a.sampleRate),ch=buf.getChannelData(0);
  for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource();s.buffer=buf;
  const f=a.createBiquadFilter();f.type='highpass';f.frequency.value=hp||600;const g=a.createGain();g.gain.value=v||0.2;
  s.connect(f);f.connect(g);g.connect(a.destination);s.start(t);s.stop(t+d+0.02);}
const S={
  tick:()=>{tone(880,0.02,'square',0.05);},
  bunt:()=>{noise(0.04,0.12,700);tone(320,0.05,'sine',0.09);},
  good:()=>{noise(0.04,0.11,500);[600,860,1120].forEach((f,i)=>setTimeout(()=>tone(f,0.11,'triangle',0.17),i*60));},
  take:()=>{tone(560,0.08,'sine',0.09);},
  bad:()=>{noise(0.16,0.22,320);tone(170,0.18,'sawtooth',0.12,-50);},
  streak:()=>{[700,930,1170,1400].forEach((f,i)=>setTimeout(()=>tone(f,0.1,'triangle',0.16),i*60));},
  over:()=>{[440,330,247,175].forEach((f,i)=>setTimeout(()=>tone(f,0.3,'triangle',0.2),i*160));}
};

// ---------- geometry ----------
const HOME={x:450,y:496}, FIRST={x:648,y:404}, SECOND={x:450,y:300}, THIRD={x:252,y:404}, PIT={x:450,y:372};
// meter bar (vertical) on the right
const MB={x:812,y:150,w:34,h:300};

// ---------- state ----------
let state='title', phase='set', t=0, plays=0;
let score=0, combo=0, best=+(localStorage.getItem('sacbunt_best')||0);
let outs=0, fails=0, lvl=1;   // outs = successful sacrifices
let clock=0, pitchDur=2300, period=600;
let buntable=true, pitchX=450, bandC=0.5, bandHalf=0.1, crash='3B';
let acted=false, lockM=0, result=null, resultT=0, msg='', rollU=0, runU=0;
let shake=0, flash=0, flashCol='#fff', last=performance.now();
let parts=[], pops=[];

function rnd(a,b){return a+Math.random()*(b-a);}
function chance(p){return Math.random()<p;}
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function lerp(a,b,u){return a+(b-a)*u;}
function easeOut(u){return 1-Math.pow(1-u,2);}

function params(){ return {
  dur:Math.max(1750,2700-lvl*120),
  per:Math.max(760,1060-lvl*44),
  half:Math.max(0.118,0.172-lvl*0.0075)
};}

// oscillating strength 0..1 (triangle wave)
function meterVal(){ if(pitchDur<=0)return 0; const ph=(clock% period)/period; return ph<0.5? ph*2 : 2-ph*2; }

function reset(){state='title';score=0;combo=0;outs=0;fails=0;lvl=1;plays=0;result=null;parts=[];pops=[];}
function newPlay(){
  plays++; lvl=Math.min(7,1+Math.floor(outs/4));
  const p=params();
  pitchDur=p.dur; period=p.per; bandHalf=p.half;
  bandC=rnd(0.40,0.60);
  buntable = !chance(0.26);
  pitchX = buntable ? ZC()+rnd(-42,42) : ZC()+ (chance(0.5)?1:-1)*rnd(88,150);
  crash = chance(0.5)?'3B':'1B';
  clock=0; acted=false; lockM=0; result=null; phase='set'; msg=''; resultT=0; rollU=0; runU=0;
}
function ZC(){return 450;}
function start(){ if(!ac())ac(); if(AC&&AC.state==='suspended')AC.resume(); reset(); state='play'; newPlay(); }

function bunt(){
  if(state==='title'){start();return;}
  if(state==='over'){ if(resultT>0.4){reset();start();} return; }
  if(state!=='play'||phase!=='set'||acted) return;
  acted=true; lockM=meterVal(); S.bunt();
  if(!buntable){ resolve('popfoul'); return; }   // bunted a ball -> foul pop
  const d=lockM-bandC;
  if(Math.abs(d)<=bandHalf) resolve('sac');
  else if(d<0) resolve('weak');
  else resolve('hard');
}

function resolve(kind){
  phase='result'; result=kind; resultT=0;
  const good=(kind==='sac'||kind==='take');
  if(good){
    outs++; combo++;
    let add=Math.round((kind==='sac'?130:70)*(1+Math.min(9,combo-1)*0.16)); score+=add;
    if(kind==='sac'){ S.good(); flash=1;flashCol='#ffe08a';shake=5; burst(HOME.x,HOME.y-40,'#ffe08a',14,5);
      pop(SECOND.x,SECOND.y-24,'走者を送った！ +'+add,'#fff3c4'); }
    else { S.take(); pop(HOME.x,HOME.y-60,'ボールを見送り +'+add,'#bfe3ff'); }
    if(combo>=2)pop(450,150,'コンボ x'+combo,'#ffd24d');
    if(combo>0&&combo%5===0)S.streak();
    msg=kind==='sac'?'絶妙の転がし！ 二塁へ走者を進めた':'際どいボールを見送り！ 無駄なバントを避けた';
  } else {
    fails++; combo=0; flash=1;flashCol='#ff5b5b';shake=8; S.bad();
    if(kind==='weak') msg='弱すぎ…投手/捕手が前で処理、二塁封殺！';
    else if(kind==='hard') msg='強すぎ…突っ込む野手の正面、併殺の危機！';
    else if(kind==='popfoul') msg='ボール球にバント…ポップフライで凡退';
    else msg='サインを見送ってしまった…バントできず';
    pop(HOME.x,HOME.y-60,kind==='popfoul'?'ポップ':'失敗','#ffb0b0');
  }
  if(fails>=3){ state='over'; resultT=0; S.over(); if(score>best){best=score;localStorage.setItem('sacbunt_best',best);} }
}

// ---------- input ----------
cv.addEventListener('pointerdown',e=>{e.preventDefault();bunt();});
addEventListener('keydown',e=>{ if(e.code==='Space'||e.code==='Enter'||e.code==='ArrowDown'||e.code==='KeyZ'){e.preventDefault();bunt();} });

// ---------- particles ----------
function burst(x,y,c,n,sp){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=rnd(sp*0.3,sp);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:1,c});}}
function pop(x,y,txt,c){pops.push({x,y,txt,c,life:1});}

// ---------- update ----------
let lastTick=-1;
function update(dt){
  shake*=Math.pow(0.86,dt/16.7); if(shake<0.3)shake=0;
  flash*=Math.pow(0.9,dt/16.7);
  for(const p of parts){p.vx*=0.96;p.vy=p.vy*0.96+0.28;p.x+=p.vx*dt/16.7;p.y+=p.vy*dt/16.7;p.life-=dt/16.7*0.026;}
  parts=parts.filter(p=>p.life>0);
  for(const p of pops){p.y-=dt/16.7*0.5;p.life-=dt/16.7*0.02;}
  pops=pops.filter(p=>p.life>0);

  if(state!=='play'){ if(state==='over')resultT+=dt/1000; return; }
  t+=dt;
  if(phase==='set'){
    clock+=dt;
    if(!acted && clock>pitchDur){ resolve(buntable?'missed':'take'); }
    return;
  }
  if(phase==='result'){
    resultT+=dt/1000;
    rollU=Math.min(1,rollU+dt/360);
    if(result==='sac')runU=Math.min(1,runU+dt/540);
    if(resultT>1.2 && state==='play') newPlay();
    return;
  }
}

// ---------- render ----------
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function drawScene(){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#1f2f1c');g.addColorStop(1,'#173f20');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#7a5230';ctx.beginPath();ctx.moveTo(HOME.x,HOME.y);ctx.lineTo(THIRD.x,THIRD.y);ctx.lineTo(SECOND.x,SECOND.y);ctx.lineTo(FIRST.x,FIRST.y);ctx.closePath();ctx.fill();
  ctx.fillStyle='#2c7a3b';ctx.beginPath();ctx.moveTo(HOME.x,HOME.y-8);ctx.lineTo(THIRD.x+22,THIRD.y-6);ctx.lineTo(SECOND.x,SECOND.y+24);ctx.lineTo(FIRST.x-22,FIRST.y-6);ctx.closePath();ctx.fill();
  // foul lines
  ctx.strokeStyle='rgba(255,255,255,0.5)';ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(HOME.x,HOME.y);ctx.lineTo(HOME.x-380,HOME.y-300);ctx.moveTo(HOME.x,HOME.y);ctx.lineTo(HOME.x+380,HOME.y-300);ctx.stroke();
  // bases
  for(const bb of [[HOME,'本'],[FIRST,'一'],[SECOND,'二'],[THIRD,'三']]){ const b=bb[0];
    ctx.save();ctx.translate(b.x,b.y);ctx.rotate(Math.PI/4);ctx.fillStyle='#f2f4f6';ctx.fillRect(-9,-9,18,18);ctx.restore(); }
}
function drawFig(x,y,col,r){ ctx.fillStyle='rgba(0,0,0,0.22)';ctx.beginPath();ctx.ellipse(x,y+12,10,3.5,0,0,6.28);ctx.fill();
  ctx.fillStyle=col;rr(x-7,y-9,14,22,6);ctx.fill();
  ctx.fillStyle='#f2c9a0';ctx.beginPath();ctx.arc(x,y-13,5.5,0,6.28);ctx.fill(); }

function render(){
  ctx.save();
  if(shake>0)ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
  drawScene();

  if(state==='play'){
    // fielders (charging corners) + pitcher
    drawFig(PIT.x,PIT.y,'#2b6cff');
    const c3=crash==='3B', c1=crash==='1B';
    drawFig(THIRD.x+(c3? (phase==='result'?60:34):8), THIRD.y+(c3?70:0),'#2b6cff');
    drawFig(FIRST.x-(c1? (phase==='result'?60:34):8), FIRST.y+(c1?70:0),'#2b6cff');
    // runner on first
    const rx=lerp(FIRST.x,SECOND.x,easeOut(runU)), ry=lerp(FIRST.y,SECOND.y,easeOut(runU));
    drawFig(rx,ry,'#e23c3c');
    // batter at home
    drawFig(HOME.x+20,HOME.y-8,'#e2b23c');
    // bat held out (bunt posture)
    ctx.strokeStyle='#caa15a';ctx.lineWidth=4;ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(HOME.x+10,HOME.y-14);ctx.lineTo(HOME.x-8,HOME.y-20);ctx.stroke();

    // pitch ball (read strike/ball by position vs zone) during set
    const zx=ZC(), zTop=HOME.y-150, zBot=HOME.y-70, zL=zx-46, zR=zx+46;
    ctx.strokeStyle='rgba(255,255,255,0.45)';ctx.lineWidth=2;ctx.strokeRect(zL,zTop,zR-zL,zBot-zTop);
    if(phase==='set'){
      ctx.fillStyle= buntable?'#eafff0':'#ffd6d6';
      ctx.beginPath();ctx.arc(pitchX,(zTop+zBot)/2,8,0,6.28);ctx.fill();
      ctx.strokeStyle=buntable?'rgba(150,240,170,0.9)':'rgba(255,120,120,0.9)';ctx.lineWidth=2;
      ctx.beginPath();ctx.arc(pitchX,(zTop+zBot)/2,8,0,6.28);ctx.stroke();
    } else {
      // bunted ball rolls to a spot based on lockM (or foul pop)
      if(result==='popfoul'||result==='missed'){ /* nothing rolls */ }
      else {
        const dist=lerp(30,150,clamp(lockM,0,1));
        const dir = crash==='3B'? 1 : -1; // push away from crash side (toward opposite line a touch)
        const tx=HOME.x - dir*lerp(6,40,clamp(lockM,0,1)), ty=HOME.y-20-dist;
        const bx=lerp(HOME.x,tx,easeOut(rollU)), by=lerp(HOME.y-20,ty,easeOut(rollU));
        let bc = result==='sac'?'#fff':(result==='weak'?'#ffd0d0':'#ffd0d0');
        ctx.fillStyle=bc;ctx.beginPath();ctx.arc(bx,by,7,0,6.28);ctx.fill();
        if(result==='sac'){ ctx.strokeStyle='rgba(150,240,170,0.8)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(bx,by,12+Math.sin(resultT*8)*2,0,6.28);ctx.stroke(); }
      }
    }

    // ---------- strength meter ----------
    ctx.fillStyle='rgba(0,0,0,0.35)';rr(MB.x-6,MB.y-24,MB.w+12,MB.h+44,10);ctx.fill();
    ctx.fillStyle='rgba(255,255,255,0.85)';ctx.font='bold 12px sans-serif';ctx.textAlign='center';
    ctx.fillText('強さ',MB.x+MB.w/2,MB.y-10);
    // bar background
    ctx.fillStyle='rgba(255,255,255,0.12)';rr(MB.x,MB.y,MB.w,MB.h,7);ctx.fill();
    // safe band (green) — value maps bottom(0)->top(1)
    const bandTopY=MB.y+MB.h*(1-(bandC+bandHalf)), bandH=MB.h*(2*bandHalf);
    ctx.fillStyle='rgba(120,235,150,0.4)';ctx.fillRect(MB.x,bandTopY,MB.w,bandH);
    ctx.strokeStyle='rgba(150,240,170,0.95)';ctx.lineWidth=2;ctx.strokeRect(MB.x,bandTopY,MB.w,bandH);
    ctx.fillStyle='rgba(150,240,170,0.9)';ctx.font='10px sans-serif';ctx.fillText('セーフ',MB.x+MB.w/2,bandTopY+bandH/2+3);
    // marker (only oscillates while awaiting)
    const mv = phase==='set'? meterVal() : lockM;
    const my = MB.y+MB.h*(1-mv);
    ctx.fillStyle= (phase==='set')?'#ffd24d':(result==='sac'?'#8affa0':'#ff7b7b');
    ctx.beginPath();ctx.moveTo(MB.x-10,my);ctx.lineTo(MB.x-2,my-7);ctx.lineTo(MB.x-2,my+7);ctx.closePath();ctx.fill();
    ctx.fillRect(MB.x,my-2,MB.w,4);
    // labels
    ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='10px sans-serif';
    ctx.fillText('強',MB.x+MB.w/2,MB.y-0+2); ctx.fillText('弱',MB.x+MB.w/2,MB.y+MB.h+14);
    // time-left tick under meter
    if(phase==='set'){ const u=clamp(clock/pitchDur,0,1);
      ctx.fillStyle='rgba(255,255,255,0.25)';rr(MB.x-6,MB.y+MB.h+20,MB.w+12,6,3);ctx.fill();
      ctx.fillStyle='rgba(255,210,77,0.9)';rr(MB.x-6,MB.y+MB.h+20,(MB.w+12)*(1-u),6,3);ctx.fill(); }
  }

  for(const p of parts){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,3.2,0,6.28);ctx.fill();}
  ctx.globalAlpha=1;
  for(const p of pops){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.font='bold 22px sans-serif';ctx.textAlign='center';ctx.fillText(p.txt,p.x,p.y);}
  ctx.globalAlpha=1;

  // HUD
  ctx.textAlign='left';ctx.fillStyle='#fff';ctx.font='bold 26px sans-serif';ctx.fillText('SCORE '+score,20,36);
  ctx.textAlign='right';ctx.fillStyle='rgba(255,255,255,0.9)';ctx.font='14px sans-serif';ctx.fillText('成功 '+outs+'  Lv'+lvl,W-20,24);
  ctx.fillText('失敗',W-92,46);
  for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(W-60+i*20,41,7,0,6.28);ctx.fillStyle=i<fails?'#ff5b5b':'rgba(255,255,255,0.25)';ctx.fill();}
  if(combo>=2){ctx.textAlign='center';ctx.fillStyle='#ffd24d';ctx.font='bold 18px sans-serif';ctx.fillText('コンボ x'+combo,360,44);}

  if(state==='play'&&phase==='set'){ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,0.9)';ctx.font='bold 15px sans-serif';
    ctx.fillText('ストライク（白球）はバント：強さメーターが緑“セーフ帯”の時に押す／ボール（赤球）は見送れ',W/2,H-30);}
  if(state==='play'&&phase==='result'&&msg){ctx.textAlign='center';ctx.fillStyle=(result==='sac'||result==='take')?'#9ff0b8':'#ff9a9a';ctx.font='bold 20px sans-serif';ctx.fillText(msg,W/2,H-30);}

  if(state==='title'){
    ctx.fillStyle='rgba(6,9,14,0.76)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='bold 44px sans-serif';ctx.fillText('送りバント',W/2,112);
    ctx.fillStyle='#ffd23e';ctx.font='bold 22px sans-serif';ctx.fillText('Lay It Down',W/2,148);
    ctx.fillStyle='rgba(255,255,255,0.92)';ctx.font='16px sans-serif';
    ctx.fillText('走者を確実に送れ。“転がしの強さ”を見極める犠打の職人技',W/2,198);
    ctx.fillStyle='rgba(255,255,255,0.66)';ctx.font='14px sans-serif';
    ctx.fillText('右の「強さメーター」の矢印が上下に振動している',W/2,236);
    ctx.fillText('ストライク（白球）ならバント：矢印が緑の“セーフ帯”に来た瞬間に押す（タップ/クリック/SPACE）',W/2,258);
    ctx.fillText('緑帯＝絶妙な弱さで前に殺し、走者を二塁へ送る',W/2,280);
    ctx.fillText('弱すぎ＝投手/捕手が前で処理して二塁封殺、強すぎ＝突っ込む野手の正面で併殺',W/2,302);
    ctx.fillText('ボール球（赤球）は見送る（押さない）。ボールにバントするとポップで凡退',W/2,324);
    ctx.fillText('上級ほど振動が速く緑帯が狭い。3失敗で交代',W/2,346);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で開始',W/2,404);
    ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='14px sans-serif';ctx.fillText('BEST '+best,W/2,436);
  }
  if(state==='over'){
    ctx.fillStyle='rgba(6,9,14,0.82)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#ff6b6b';ctx.font='bold 46px sans-serif';ctx.fillText('3失敗…交代',W/2,222);
    ctx.fillStyle='#fff';ctx.font='bold 40px sans-serif';ctx.fillText('SCORE '+score,W/2,290);
    ctx.fillStyle='rgba(255,255,255,0.85)';ctx.font='19px sans-serif';ctx.fillText('送り成功 '+outs+'   BEST '+best,W/2,330);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で もう一度',W/2,402);
  }

  if(flash>0.02){ctx.globalAlpha=flash*0.5;ctx.fillStyle=flashCol;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}
  ctx.restore();

  ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,0.4)';ctx.font='12px sans-serif';
  ctx.fillText('強さメーターの矢印が緑“セーフ帯”の時に押して犠打成功。弱/強は失敗、ボール球は見送り。3失敗で交代',W/2,H-8);
}

function frame(ts){let dt=ts-last;last=ts;if(dt>60)dt=60;if(dt<0)dt=0;update(dt);render();requestAnimationFrame(frame);}
requestAnimationFrame(frame);

// ---------- test hook ----------
window.__sb={
  start, bunt:()=>bunt(),
  get state(){return state;},
  get score(){return score;},
  get outs(){return outs;},
  get fails(){return fails;},
  get info(){return {state,phase,buntable,meter:(phase==='set'?meterVal():lockM),bandC,bandHalf,
    bandLo:bandC-bandHalf,bandHi:bandC+bandHalf,canAct:(phase==='set'&&!acted),acted,result,outs,fails,lvl,clock,pitchDur};}
};
})();
</script>
</body>
</html>
