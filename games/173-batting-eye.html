<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>選球眼 (Batting Eye)</title>
<style>
  html,body{margin:0;height:100%;background:#0a1018;overflow:hidden;
    font-family:-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  #stage{position:relative;width:100vw;height:100vh;max-width:calc(100vh*1.5);max-height:calc(100vw/1.5);aspect-ratio:900/600;}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;border-radius:6px;}
</style>
</head>
<body>
<div id="wrap"><div id="stage"><canvas id="cv"></canvas></div></div>
<script>
(function(){
const W=900,H=600,cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let DPR=1;
function fit(){DPR=Math.min(2,window.devicePixelRatio||1);cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
fit();addEventListener('resize',fit);

// ---------- audio ----------
let AC=null;function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function tone(f,d,type,v,sweep){const a=ac();if(!a)return;const t=a.currentTime,o=a.createOscillator(),g=a.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(sweep)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+sweep),t+d);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v||0.2,t+0.008);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+0.02);}
function noise(d,v,hp){const a=ac();if(!a)return;const t=a.currentTime,n=Math.floor(a.sampleRate*d),buf=a.createBuffer(1,n,a.sampleRate),ch=buf.getChannelData(0);
  for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource();s.buffer=buf;
  const f=a.createBiquadFilter();f.type='highpass';f.frequency.value=hp||600;const g=a.createGain();g.gain.value=v||0.2;
  s.connect(f);f.connect(g);g.connect(a.destination);s.start(t);s.stop(t+d+0.02);}
const S={
  hit:()=>{noise(0.05,0.3,1200);tone(240,0.16,'square',0.2,320);setTimeout(()=>tone(520,0.14,'triangle',0.16),40);},
  walk:()=>{[660,880,990,1320].forEach((f,i)=>setTimeout(()=>tone(f,0.14,'triangle',0.2),i*90));},
  ball:()=>{tone(560,0.09,'sine',0.12);},
  cstrike:()=>{tone(330,0.14,'sawtooth',0.16,-60);},
  whiff:()=>{noise(0.14,0.18,500);tone(200,0.16,'sawtooth',0.12,-70);},
  strikeout:()=>{tone(240,0.3,'sawtooth',0.2,-120);setTimeout(()=>tone(170,0.3,'sawtooth',0.18,-70),130);},
  over:()=>{[440,330,247,175].forEach((f,i)=>setTimeout(()=>tone(f,0.3,'triangle',0.2),i*160));},
  pitch:()=>{noise(0.05,0.08,1400);}
};

// ---------- zone geometry ----------
const ZX0=372, ZX1=528, ZY0=214, ZY1=392;           // strike zone box (screen)
const ZCX=(ZX0+ZX1)/2, ZCY=(ZY0+ZY1)/2;
const REL={x:452, y:96};                              // release point (top)
const T_COMMIT=0.70;                                  // must decide before this flight fraction

// ---------- state ----------
let state='title', phase='ready', t=0, pitchN=0;
let score=0, combo=0, best=+(localStorage.getItem('battingeye_best')||0);
let hits=0, walks=0, outs=0;
let balls=0, strikes=0, lvl=1, atbats=0;
let P=null, result=null, resultT=0, msg='', msg2='';
let shake=0, flash=0, flashCol='#fff', last=performance.now();
let parts=[], pops=[], trail=[];

function rnd(a,b){return a+Math.random()*(b-a);}
function chance(p){return Math.random()<p;}
function clamp(v,a,b){return v<a?a:v>b?b:v;}

function reset(){state='title';score=0;combo=0;hits=0;walks=0;outs=0;balls=0;strikes=0;lvl=1;pitchN=0;atbats=0;P=null;result=null;parts=[];pops=[];trail=[];}

const TYPES=[
  {name:'ストレート',col:'#ff5555',curl:0.0},
  {name:'スライダー',col:'#5bd0ff',curl:1.0},
  {name:'カーブ',col:'#ffd24d',curl:0.8},
  {name:'チェンジアップ',col:'#8fe08a',curl:0.35}
];

function newPitch(){
  pitchN++;
  lvl=Math.min(6,1+Math.floor(pitchN/5));
  const type=TYPES[Math.floor(rnd(0,TYPES.length))];
  // decide strike or ball; borderline temptation weighted
  const isStrike=chance(0.46);
  let fx,fy;
  if(isStrike){ fx=rnd(ZX0+16,ZX1-16); fy=rnd(ZY0+18,ZY1-18); }
  else {
    // land just outside (tempting) most of the time; occasionally clearly off
    const edge=chance(0.7);
    const band=edge? rnd(14,54): rnd(60,110);
    const side=Math.floor(rnd(0,4));
    if(side===0){fx=ZX0-band; fy=rnd(ZY0-20,ZY1+20);}
    else if(side===1){fx=ZX1+band; fy=rnd(ZY0-20,ZY1+20);}
    else if(side===2){fy=ZY0-band; fx=rnd(ZX0-20,ZX1+20);}
    else {fy=ZY1+band; fx=rnd(ZX0-20,ZX1+20);}
  }
  fx=clamp(fx,120,780); fy=clamp(fy,120,520);
  const dur=Math.max(620,1000-lvl*66);
  const curlDir=(chance(0.5)?-1:1);
  const breakAmt=type.curl*rnd(36,58)*(1+lvl*0.06);
  P={type,isStrike,fx,fy,dur,t:0,curlDir,breakAmt, swung:false, swingT:-1, decided:false,
     bx:REL.x,by:REL.y,br:4};
  phase='pitch'; t=0; result=null; trail=[];
  msg=''; msg2='';
}

function start(){ if(!ac())ac(); if(AC&&AC.state==='suspended')AC.resume(); reset(); state='play'; startAtBat(); }
function startAtBat(){ atbats++; balls=0; strikes=0; newPitch(); }

// ---------- swing ----------
function swing(){
  if(state==='title'){start();return;}
  if(state==='over'){ if(resultT>0.5){reset();start();} return; }
  if(state!=='play'||phase!=='pitch'||!P||P.decided) return;
  if(P.t/P.dur > T_COMMIT+0.06){ return; } // too late to start a swing -> becomes a take
  P.swung=true; P.decided=true; P.swingT=P.t/P.dur;
}

function ballPosAt(frac){
  const f=clamp(frac,0,1);
  const x=REL.x+(P.fx-REL.x)*f;
  const y=REL.y+(P.fy-REL.y)*f;
  // break: perpendicular-ish lateral offset that grows after breakStart
  const bs=0.45; const bf=f<bs?0:((f-bs)/(1-bs));
  const off=P.curlDir*P.breakAmt*bf*bf;
  return {x:x+off, y:y - Math.sin(f*Math.PI)*8};
}

function resolve(){
  phase='resolve'; resultT=0;
  const strike=P.isStrike, swung=P.swung;
  if(swung && strike){
    // squared up
    result='hit'; hits++; combo++;
    const mult=1+Math.min(5,combo-1)*0.2; const add=Math.round(150*mult);
    score+=add; S.hit();
    flash=1;flashCol='#ffe08a';shake=13;
    const bp=ballPosAt(1); burst(bp.x,bp.y,'#ffe08a',30,8);
    pop(ZCX,ZY0-24,'ジャストミート！ +'+add,'#fff3c4');
    if(combo>=2)pop(ZCX,ZY0-52,'コンボ x'+combo,'#ffd24d');
    msg='打った！ 芯で捉えた'; msg2='';
    endAtBat();
  } else if(swung && !strike){
    // chase -> whiff
    result='whiff'; strikes++; combo=0; S.whiff();
    flash=1;flashCol='#ff6b6b';shake=8;
    pop(ballPosAt(1).x,ballPosAt(1).y,'空振り','#ffb3b3');
    msg='空振り！ ボール球を振らされた'; msg2='ゾーンの外に手を出すな';
    checkK();
  } else if(!swung && strike){
    // took a strike
    result='cstrike'; strikes++; combo=0; S.cstrike();
    flash=0.7;flashCol='#ffb15b';shake=5;
    pop(ballPosAt(1).x,ballPosAt(1).y,'見逃し','#ffcf9a');
    msg='見逃しストライク！ ゾーンは振れ'; msg2='';
    checkK();
  } else {
    // took a ball (good)
    result='ball'; balls++; combo=Math.max(combo,combo); S.ball();
    pop(ballPosAt(1).x,ballPosAt(1).y,'ボール','#8fe0ff');
    msg='ボール、よく見た'; msg2='';
    checkBB();
  }
}
function checkK(){
  if(strikes>=3){ result='K'; outs++; combo=0; S.strikeout();
    flash=1;flashCol='#ff5b5b';shake=12; msg='三振…アウト'; msg2='';
    endAtBat(true);
  }
}
function checkBB(){
  if(balls>=4){ result='BB'; walks++; combo++; const add=Math.round(120*(1+Math.min(5,combo-1)*0.2));
    score+=add; S.walk();
    flash=1;flashCol='#8fe08a';shake=8; pop(ZCX,ZY0-24,'四球で出塁！ +'+add,'#c9ffd0');
    msg='四球を選んだ！ ナイスセレクト'; msg2=''; endAtBat();
  }
}
let atBatEnded=false;
function endAtBat(strikeout){ atBatEnded=true; }

// ---------- input ----------
cv.addEventListener('pointerdown',e=>{e.preventDefault();swing();});
addEventListener('keydown',e=>{ if(e.code==='Space'||e.code==='Enter'||e.code==='ArrowUp'){e.preventDefault();swing();}});

// ---------- particles ----------
function burst(x,y,c,n,sp){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=rnd(sp*0.3,sp);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:1,c});}}
function pop(x,y,txt,c){pops.push({x,y,txt,c,life:1});}

// ---------- update ----------
function update(dt){
  shake*=Math.pow(0.86,dt/16.7); if(shake<0.3)shake=0;
  flash*=Math.pow(0.9,dt/16.7);
  for(const p of parts){p.vx*=0.96;p.vy=p.vy*0.96+0.3;p.x+=p.vx*dt/16.7;p.y+=p.vy*dt/16.7;p.life-=dt/16.7*0.028;}
  parts=parts.filter(p=>p.life>0);
  for(const p of pops){p.y-=dt/16.7*0.5;p.life-=dt/16.7*0.018;}
  pops=pops.filter(p=>p.life>0);

  if(state!=='play'){ if(state==='over')resultT+=dt/1000; return; }
  t+=dt;

  if(phase==='pitch'){
    P.t+=dt;
    const f=clamp(P.t/P.dur,0,1);
    const bp=ballPosAt(f);
    P.bx=bp.x; P.by=bp.y; P.br=4+f*11;
    trail.push({x:bp.x,y:bp.y,r:P.br}); if(trail.length>12)trail.shift();
    if(P.t>=P.dur){ resolve(); }
    return;
  }

  if(phase==='resolve'){
    resultT+=dt/1000;
    if(resultT>0.95){
      if(atBatEnded){
        atBatEnded=false;
        if(outs>=3){ state='over'; resultT=0; S.over(); if(score>best){best=score;localStorage.setItem('battingeye_best',best);} return; }
        startAtBat();
      } else {
        newPitch();
      }
    }
    return;
  }
}

// ---------- render ----------
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

function drawScene(){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#16233a');g.addColorStop(0.5,'#1b2f22');g.addColorStop(1,'#20402c');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  // dirt behind plate
  ctx.fillStyle='rgba(150,95,55,0.5)';ctx.beginPath();ctx.ellipse(450,470,240,120,0,0,6.28);ctx.fill();
  // home plate
  ctx.fillStyle='#f2f2f2';ctx.beginPath();
  ctx.moveTo(450,506);ctx.lineTo(410,486);ctx.lineTo(410,468);ctx.lineTo(490,468);ctx.lineTo(490,486);ctx.closePath();ctx.fill();
  // strike zone
  ctx.strokeStyle='rgba(255,255,255,0.7)';ctx.lineWidth=3;ctx.setLineDash([]);
  ctx.strokeRect(ZX0,ZY0,ZX1-ZX0,ZY1-ZY0);
  // 3x3 grid
  ctx.strokeStyle='rgba(255,255,255,0.16)';ctx.lineWidth=1;
  for(let i=1;i<3;i++){ ctx.beginPath();ctx.moveTo(ZX0+(ZX1-ZX0)*i/3,ZY0);ctx.lineTo(ZX0+(ZX1-ZX0)*i/3,ZY1);ctx.stroke();
    ctx.beginPath();ctx.moveTo(ZX0,ZY0+(ZY1-ZY0)*i/3);ctx.lineTo(ZX1,ZY0+(ZY1-ZY0)*i/3);ctx.stroke();}
  // faint target hint (fades out at higher levels)
  if(P && phase==='pitch' && lvl<3){
    ctx.fillStyle='rgba(255,255,255,'+(0.16*(1-P.t/P.dur))+')';
    ctx.beginPath();ctx.arc(P.fx,P.fy,10,0,6.28);ctx.fill();
  }
}

function drawCommitRing(){
  if(!P||phase!=='pitch')return;
  const f=P.t/P.dur;
  if(f<=T_COMMIT+0.06 && !P.decided){
    // decision window indicator around the plate
    const a=clamp((T_COMMIT-f)/T_COMMIT,0,1);
    ctx.strokeStyle='rgba(143,224,255,'+(0.25+0.4*a)+')';ctx.lineWidth=3;
    ctx.beginPath();ctx.arc(ZCX,ZY1+70,26,-Math.PI/2,-Math.PI/2+6.28*a);ctx.stroke();
    ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='11px sans-serif';ctx.textAlign='center';
    ctx.fillText('見極め',ZCX,ZY1+74);
  }
}

function drawBall(){
  if(!P)return;
  for(let i=0;i<trail.length;i++){const a=i/trail.length;ctx.globalAlpha=a*0.35;ctx.fillStyle=P.type.col;ctx.beginPath();ctx.arc(trail[i].x,trail[i].y,trail[i].r*0.8,0,6.28);ctx.fill();}
  ctx.globalAlpha=1;
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(P.bx,P.by,P.br,0,6.28);ctx.fill();
  ctx.strokeStyle=P.type.col;ctx.lineWidth=2;ctx.beginPath();ctx.arc(P.bx,P.by,P.br,0,6.28);ctx.stroke();
  ctx.strokeStyle='rgba(200,40,40,0.8)';ctx.lineWidth=1.2;ctx.beginPath();ctx.arc(P.bx,P.by,P.br*0.6,0.5,2.4);ctx.stroke();
}

function drawBat(){
  // batter's bat, swings on P.swung during resolve
  const bx=560, by=430;
  let ang=0.7;
  if(phase==='resolve'&&P&&P.swung){ ang = -0.9 - Math.min(1,resultT*6)*0.6; }
  else if(P&&P.swung){ ang=-0.4; }
  ctx.save();ctx.translate(bx,by);ctx.rotate(ang);
  ctx.strokeStyle='#c8a15a';ctx.lineWidth=8;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(0,-92);ctx.stroke();
  ctx.strokeStyle='#e0be78';ctx.lineWidth=11;ctx.beginPath();ctx.moveTo(0,-52);ctx.lineTo(0,-92);ctx.stroke();
  ctx.restore();
}

function drawHUD(){
  ctx.textAlign='left';ctx.fillStyle='#fff';ctx.font='bold 26px sans-serif';
  ctx.fillText('SCORE '+score,20,36);
  ctx.textAlign='right';ctx.fillStyle='rgba(255,255,255,0.85)';ctx.font='14px sans-serif';
  ctx.fillText('安打 '+hits+'  四球 '+walks+'  Lv.'+lvl,W-20,26);
  // count B-S
  ctx.textAlign='left';ctx.font='bold 15px sans-serif';
  ctx.fillStyle='#8fe0ff';ctx.fillText('B',22,64);
  for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(46+i*20,59,7,0,6.28);ctx.fillStyle=i<balls?'#3ec6ff':'rgba(255,255,255,0.2)';ctx.fill();}
  ctx.fillStyle='#ffd24d';ctx.fillText('S',22,90);
  for(let i=0;i<2;i++){ctx.beginPath();ctx.arc(46+i*20,85,7,0,6.28);ctx.fillStyle=i<strikes?'#ffb15b':'rgba(255,255,255,0.2)';ctx.fill();}
  // outs
  ctx.textAlign='right';ctx.fillStyle='rgba(255,255,255,0.85)';ctx.font='14px sans-serif';ctx.fillText('アウト',W-64,54);
  for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(W-40+i*0,0,0,0,0);}
  for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(W-96+i*20+40,72,7,0,6.28);ctx.fillStyle=i<outs?'#ff5b5b':'rgba(255,255,255,0.22)';ctx.fill();}
  // pitch type label (fades at high lvl)
  if(P&&phase==='pitch'&&lvl<4){ ctx.textAlign='center';ctx.fillStyle=P.type.col;ctx.font='bold 15px sans-serif';ctx.globalAlpha=0.8;ctx.fillText(P.type.name,ZCX,ZY0-14);ctx.globalAlpha=1; }
  if(combo>=2){ctx.textAlign='center';ctx.fillStyle='#ffd24d';ctx.font='bold 18px sans-serif';ctx.fillText('コンボ x'+combo,ZCX,H-96);}
}

function render(){
  ctx.save();
  if(shake>0)ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
  drawScene();
  drawCommitRing();
  drawBall();
  drawBat();

  for(const p of parts){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,3.2,0,6.28);ctx.fill();}
  ctx.globalAlpha=1;
  for(const p of pops){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.font='bold 22px sans-serif';ctx.textAlign='center';ctx.fillText(p.txt,p.x,p.y);}
  ctx.globalAlpha=1;

  drawHUD();

  if(state==='play'&&(msg||msg2)){
    ctx.textAlign='center';
    const good=result==='hit'||result==='ball'||result==='BB';
    ctx.fillStyle= result? (good?'#8ff0b8':'#ff9a9a') : 'rgba(255,255,255,0.92)';
    ctx.font='bold 28px sans-serif';ctx.fillText(msg,W/2,H-52);
    if(msg2){ctx.fillStyle='rgba(255,255,255,0.72)';ctx.font='16px sans-serif';ctx.fillText(msg2,W/2,H-26);}
  }

  if(state==='title'){
    ctx.fillStyle='rgba(6,10,18,0.66)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='bold 52px sans-serif';ctx.fillText('選球眼',W/2,214);
    ctx.fillStyle='#ffd24d';ctx.font='bold 23px sans-serif';ctx.fillText('Batting Eye',W/2,250);
    ctx.fillStyle='rgba(255,255,255,0.9)';ctx.font='18px sans-serif';
    ctx.fillText('ストライクは振る（クリック/タップ/SPACE）、ボールは見送る',W/2,312);
    ctx.fillText('ゾーンに来る球だけを振り、ボール球のチェイスは我慢',W/2,340);
    ctx.fillStyle='rgba(255,255,255,0.66)';ctx.font='15px sans-serif';
    ctx.fillText('見逃し三振も空振りもアウト／四球を選べば出塁で加点。変化球の曲がりを読め',W/2,382);
    ctx.fillStyle='#ffe08a';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で開始',W/2,446);
    ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='14px sans-serif';ctx.fillText('BEST '+best,W/2,480);
  }
  if(state==='over'){
    ctx.fillStyle='rgba(6,10,18,0.74)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#ff6b6b';ctx.font='bold 46px sans-serif';ctx.fillText('3アウト…チェンジ',W/2,228);
    ctx.fillStyle='#fff';ctx.font='bold 40px sans-serif';ctx.fillText('SCORE '+score,W/2,294);
    ctx.fillStyle='rgba(255,255,255,0.85)';ctx.font='20px sans-serif';ctx.fillText('安打 '+hits+'  四球 '+walks+'   BEST '+best,W/2,334);
    ctx.fillStyle='#8ff0b8';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で もう一度',W/2,406);
  }

  if(flash>0.02){ctx.globalAlpha=flash*0.5;ctx.fillStyle=flashCol;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}
  ctx.restore();

  ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,0.4)';ctx.font='13px sans-serif';
  ctx.fillText('ゾーン内=振る／外=見送る。見極めの窓（青）が閉じる前に決断。3アウトで終了',W/2,H-6);
}

function frame(ts){let dt=ts-last;last=ts;if(dt>60)dt=60;if(dt<0)dt=0;update(dt);render();requestAnimationFrame(frame);}
requestAnimationFrame(frame);

// ---------- test hook ----------
window.__be={
  start, swing,
  get state(){return state;},
  get score(){return score;},
  get hits(){return hits;},
  get walks(){return walks;},
  get outs(){return outs;},
  get info(){return {state,phase,t:P?P.t/P.dur:0, willStrike:P?P.isStrike:false, tCommit:T_COMMIT,
    swung:P?P.swung:false, decided:P?P.decided:false, balls,strikes,outs,result,lvl,
    fx:P?P.fx:0,fy:P?P.fy:0,type:P?P.type.name:''};}
};
})();
</script>
</body>
</html>
