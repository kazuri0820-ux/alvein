<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>盗塁阻止 — Gun Down the Stealer</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{width:100%;height:100%;background:#08131f;overflow:hidden;
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,system-ui,sans-serif;
    touch-action:none;user-select:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  #stage{position:relative;aspect-ratio:900/600;max-width:100%;max-height:100%;
    width:auto;height:auto;box-shadow:0 0 60px rgba(0,0,0,.6);}
  canvas{display:block;width:100%;height:100%;border-radius:6px;}
</style>
</head>
<body>
<div id="wrap"><div id="stage"><canvas id="c" width="900" height="600"></canvas></div></div>
<script>
(function(){
"use strict";
const TEST=location.hash.indexOf('test')>=0;
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
const W=900,H=600;
let dpr=Math.max(1,Math.min(2,window.devicePixelRatio||1));
function fit(){ dpr=Math.max(1,Math.min(2,window.devicePixelRatio||1)); cv.width=W*dpr; cv.height=H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0); }
fit(); window.addEventListener('resize',fit);

// ---- audio ----
let AC=null;
function ac(){ if(!AC){ try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){AC=null;} } return AC; }
function tone(f,d,type,g,f2){ const a=ac(); if(!a)return; const o=a.createOscillator(),gg=a.createGain();
  o.type=type||'sine'; o.frequency.setValueAtTime(f,a.currentTime); if(f2)o.frequency.exponentialRampToValueAtTime(f2,a.currentTime+d);
  gg.gain.setValueAtTime(0.0001,a.currentTime); gg.gain.exponentialRampToValueAtTime(g||0.2,a.currentTime+0.01);
  gg.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+d); o.connect(gg); gg.connect(a.destination); o.start(); o.stop(a.currentTime+d+0.02); }
function noise(d,g,cut){ const a=ac(); if(!a)return; const n=Math.floor(a.sampleRate*d),buf=a.createBuffer(1,n,a.sampleRate),ch=buf.getChannelData(0);
  for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(1-i/n); const src=a.createBufferSource(); src.buffer=buf;
  const f=a.createBiquadFilter(); f.type='lowpass'; f.frequency.value=cut||1200; const gg=a.createGain(); gg.gain.value=g||0.2;
  src.connect(f); f.connect(gg); gg.connect(a.destination); src.start(); }
const S={
  mitt(){ noise(0.06,0.34,1300); tone(220,0.07,'triangle',0.16,150); },
  release(){ noise(0.05,0.28,1900); tone(420,0.08,'square',0.16,720); },
  tag(){ noise(0.09,0.3,1200); tone(260,0.08,'triangle',0.18,150); },
  out(){ tone(520,0.12,'sine',0.2,760); setTimeout(()=>tone(780,0.18,'sine',0.16),100); },
  cheer(){ const a=ac(); if(!a)return; noise(0.7,0.24,1900); for(let i=0;i<5;i++)setTimeout(()=>tone(480+Math.random()*300,0.3,'sine',0.05),i*44); },
  safe(){ tone(300,0.26,'square',0.14,150); },
  wild(){ tone(240,0.32,'sawtooth',0.16,90); noise(0.16,0.2,700); },
  pitch(){ noise(0.04,0.12,2200); },
  tick(){ tone(660,0.03,'square',0.06); }
};

// ---- geometry (diamond, catcher bottom / 2nd top) ----
const HOME={x:450,y:508}, SECOND={x:450,y:150}, FIRST={x:648,y:344}, THIRD={x:252,y:344};
const MOUND={x:450,y:344};
const RETICLE_Y=150, RETICLE_SPAN=70;

// ---- state ----
let state='ready';   // ready, pitch, throw, fly, result, over
let outs=0,safes=0,streak=0,best=0,level=0,playN=0;
let clock=0, pitchArrive=0.44, runTime=1.4;
let reticle=0, retDir=1, retSpd=2.4;
let tapAbs=-1, popTime=0, acc=0, wild=false, throwTravel=0.55, ballArriveAbs=0;
let runnerP=0, throwP=0, throwStart=0;
let result=null;     // 'out'|'safe'|'error'
let pitchBall={x:MOUND.x,y:MOUND.y};
let msg='',msgT=0;
let shakeT=0,shakeM=0,flash=0,flashCol='#fff';
let parts=[]; let crowd=[]; let t=0; let caught=false;

try{ best=parseInt(localStorage.getItem('ct_best')||'0',10)||0; }catch(e){}
for(let i=0;i<70;i++) crowd.push({x:Math.random()*W,y:6+Math.random()*40,c:['#e8544e','#f0c14b','#4a90d9','#fff','#5cc98a','#c98af0'][i%6],b:Math.random()*6.28});

function reset(){ outs=0;safes=0;streak=0;level=0;playN=0; parts=[]; nextPlay(); }
function levelUp(){ level=Math.min(9,Math.floor(outs/3)); }

function nextPlay(){
  levelUp(); playN++;
  clock=0; caught=false; tapAbs=-1; result=null; runnerP=0; throwP=0;
  pitchArrive=0.40+Math.random()*0.10;
  runTime=Math.max(1.02,1.52-level*0.05);       // steal time (smaller = faster runner)
  reticle=0; retDir=Math.random()<0.5?1:-1; retSpd=2.2+level*0.16;
  pitchBall={x:MOUND.x,y:MOUND.y};
  state='pitch';
  if(playN<=2){ msg='走者スタート！ 捕球後、二塁の的が中央の瞬間に素早くタップ送球！'; msgT=150; }
  else { msg=''; msgT=0; }
}

function doThrow(){
  if(state!=='throw'||tapAbs>=0) return;
  tapAbs=clock;
  _tapRetSign = reticle<0?-1:1;
  popTime=clock-pitchArrive;
  acc=Math.abs(reticle);
  wild = acc>0.52;
  throwTravel = 0.48 + acc*0.42;
  ballArriveAbs = tapAbs + throwTravel;
  throwStart=clock;
  S.release();
  state='fly';
}

function resolve(){
  if(wild){ result='error'; onResult('error','大暴投！ 走者は三塁へ！'); return; }
  const margin = runTime - ballArriveAbs;   // >0 : ball beats runner
  if(margin>0.04){ result='out'; onResult('out', (popTime<0.16&&acc<0.14)?'ズドン！ 完璧な送球でアウト！':'アウト！ 盗塁刺し！'); }
  else if(margin>-0.09){ result='out'; onResult('out','際どい… 判定アウト！'); }
  else { result='safe'; onResult('safe','セーフ！ 一歩及ばず'); }
}

function onResult(kind,message){
  result=kind; state='result'; msg=message; msgT=130;
  if(kind==='out'){
    outs++; streak++; if(streak>best){best=streak; save();}
    if(streak>=3) msg+=`（${streak}連続）`;
    S.out(); setTimeout(S.cheer,80); flash=0.4; flashCol='#eafff0'; shakeT=12; shakeM=4;
    burst(SECOND.x,SECOND.y,'#ffe14d',22); burst(SECOND.x,SECOND.y,'#5cc98a',12);
  } else if(kind==='safe'){
    safes++; streak=0; S.safe(); flash=0.24; flashCol='#ffd0a0'; shakeT=8; shakeM=3;
  } else {
    safes++; streak=0; S.wild(); flash=0.3; flashCol='#ff9060'; shakeT=13; shakeM=5;
    burst(SECOND.x-40,SECOND.y-20,'#ff9060',14);
  }
  if(safes>=3){ setTimeout(()=>{ state='over'; msg='スリーアウト・チェンジ'; msgT=99999; }, 900); }
  else setTimeout(()=>{ if(state==='result') nextPlay(); }, 1050);
}
function save(){ try{localStorage.setItem('ct_best',''+best);}catch(e){} }
function burst(x,y,col,n){ for(let i=0;i<n;i++){ const a=Math.random()*6.28,sp=1+Math.random()*5;
  parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-2,life:1,col,r:2+Math.random()*3}); } }

// ---- input ----
function press(){
  const a=ac(); if(a&&a.state==='suspended')a.resume();
  if(state==='ready'||state==='over'){ reset(); return; }
  if(state==='throw'){ doThrow(); }
}
cv.addEventListener('pointerdown',e=>{ e.preventDefault(); press(); });
window.addEventListener('keydown',e=>{ if(e.code==='Space'||e.code==='Enter'){ e.preventDefault(); press(); } });

// ---- update ----
let last=0;
function update(dt){
  t+=dt; if(msgT>0)msgT--; if(flash>0)flash=Math.max(0,flash-dt*2); if(shakeT>0)shakeT--;
  if(state==='pitch'){
    clock+=dt;
    const p=Math.min(1,clock/pitchArrive);
    pitchBall.x=MOUND.x; pitchBall.y=MOUND.y+(HOME.y-24-MOUND.y)*p;
    runnerP=Math.min(1, clock/runTime);
    if(clock>=pitchArrive){ caught=true; S.mitt(); state='throw'; burst(HOME.x,HOME.y-20,'#fff',8); }
  }
  else if(state==='throw'){
    clock+=dt;
    reticle+=retDir*retSpd*dt;
    if(reticle>1){reticle=1;retDir=-1;} if(reticle<-1){reticle=-1;retDir=1;}
    if(Math.abs(reticle)<0.06 && ((clock*18|0)!==((clock-dt)*18|0))) S.tick();
    runnerP=Math.min(1, clock/runTime);
    if(runnerP>=1 && tapAbs<0){ result='safe'; onResult('safe','送球できず… 楽々セーフ'); }
  }
  else if(state==='fly'){
    clock+=dt;
    runnerP=Math.min(1, clock/runTime);
    throwP=Math.min(1,(clock-throwStart)/throwTravel);
    if(throwP>=1){ resolve(); }
  }
  for(let i=parts.length-1;i>=0;i--){ const q=parts[i]; q.x+=q.vx;q.y+=q.vy;q.vy+=0.16;q.life-=dt*1.1; if(q.life<=0)parts.splice(i,1); }
}

// ---- draw ----
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function lerp(a,b,p){return a+(b-a)*p;}

function drawField(){
  ctx.fillStyle='#0c1c28'; ctx.fillRect(0,0,W,44);
  for(const c of crowd){ const yy=c.y+Math.sin(t*3+c.b)*1.2; ctx.fillStyle=c.c; ctx.globalAlpha=.8; ctx.fillRect(c.x,yy,5,5); }
  ctx.globalAlpha=1;
  const g=ctx.createLinearGradient(0,44,0,H); g.addColorStop(0,'#1c6f39'); g.addColorStop(1,'#20844a');
  ctx.fillStyle=g; ctx.fillRect(0,44,W,H-44);
  // dirt diamond
  ctx.fillStyle='#b5763e';
  ctx.beginPath(); ctx.moveTo(HOME.x,HOME.y+16); ctx.lineTo(FIRST.x+18,FIRST.y); ctx.lineTo(SECOND.x,SECOND.y-18); ctx.lineTo(THIRD.x-18,THIRD.y); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#1f7a3f';
  ctx.beginPath(); ctx.moveTo(HOME.x,HOME.y-24); ctx.lineTo(FIRST.x-26,FIRST.y); ctx.lineTo(SECOND.x,SECOND.y+24); ctx.lineTo(THIRD.x+26,THIRD.y); ctx.closePath(); ctx.fill();
  // baselines
  ctx.strokeStyle='rgba(255,255,255,.65)'; ctx.lineWidth=3;
  ctx.beginPath(); ctx.moveTo(HOME.x,HOME.y); ctx.lineTo(FIRST.x,FIRST.y); ctx.lineTo(SECOND.x,SECOND.y); ctx.lineTo(THIRD.x,THIRD.y); ctx.closePath(); ctx.stroke();
  // runner path highlight 1st->2nd
  ctx.strokeStyle='rgba(255,220,80,.5)'; ctx.lineWidth=3; ctx.setLineDash([8,8]);
  ctx.beginPath(); ctx.moveTo(FIRST.x,FIRST.y); ctx.lineTo(SECOND.x,SECOND.y); ctx.stroke(); ctx.setLineDash([]);
  base(FIRST,'一塁'); base(THIRD,'三塁');
  // mound
  ctx.fillStyle='#a86a37'; ctx.beginPath(); ctx.arc(MOUND.x,MOUND.y,26,0,6.28); ctx.fill();
  // home plate
  ctx.fillStyle='#fff'; ctx.beginPath();
  ctx.moveTo(HOME.x-11,HOME.y-6); ctx.lineTo(HOME.x+11,HOME.y-6); ctx.lineTo(HOME.x+11,HOME.y+4); ctx.lineTo(HOME.x,HOME.y+12); ctx.lineTo(HOME.x-11,HOME.y+4); ctx.closePath(); ctx.fill();
}
function base(b,label){ ctx.save(); ctx.translate(b.x,b.y); ctx.rotate(Math.PI/4); ctx.fillStyle='#f4f8ff'; ctx.fillRect(-9,-9,18,18); ctx.restore();
  ctx.fillStyle='rgba(255,255,255,.5)'; ctx.font='10px sans-serif'; ctx.textAlign='center'; ctx.fillText(label,b.x,b.y+24); }

function drawSecond(){
  // 2nd base + fielder covering
  ctx.save(); ctx.translate(SECOND.x,SECOND.y); ctx.rotate(Math.PI/4);
  ctx.fillStyle='#f4f8ff'; ctx.fillRect(-10,-10,20,20); ctx.restore();
  // covering infielder
  const f={x:SECOND.x+22,y:SECOND.y-6};
  ctx.fillStyle='rgba(0,0,0,.2)'; ctx.beginPath(); ctx.ellipse(f.x,f.y+16,13,4,0,0,6.28); ctx.fill();
  ctx.fillStyle='#4a90d9'; rr(f.x-10,f.y-8,20,26,6); ctx.fill();
  ctx.fillStyle='#f0c39a'; ctx.beginPath(); ctx.arc(f.x,f.y-14,7,0,6.28); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.5)'; ctx.font='10px sans-serif'; ctx.textAlign='center'; ctx.fillText('二塁',SECOND.x,SECOND.y+26);
}

function drawReticle(){
  if(state!=='throw' && state!=='pitch') return;
  const cx=SECOND.x+reticle*RETICLE_SPAN, cy=RETICLE_Y;
  const centered=Math.abs(reticle)<0.14;
  // target zone
  ctx.strokeStyle='rgba(255,255,255,.25)'; ctx.lineWidth=2; ctx.setLineDash([4,4]);
  ctx.beginPath(); ctx.moveTo(SECOND.x-RETICLE_SPAN,cy-26); ctx.lineTo(SECOND.x-RETICLE_SPAN,cy+26); ctx.moveTo(SECOND.x+RETICLE_SPAN,cy-26); ctx.lineTo(SECOND.x+RETICLE_SPAN,cy+26); ctx.stroke(); ctx.setLineDash([]);
  // center good band
  ctx.fillStyle='rgba(92,201,138,.16)'; ctx.fillRect(SECOND.x-RETICLE_SPAN*0.14,cy-30,RETICLE_SPAN*0.28,60);
  if(state==='throw'){
    ctx.strokeStyle=centered?'rgba(92,201,138,.95)':'rgba(255,235,120,.85)'; ctx.lineWidth=3;
    ctx.beginPath(); ctx.arc(cx,cy,16,0,6.28); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx-22,cy); ctx.lineTo(cx+22,cy); ctx.moveTo(cx,cy-22); ctx.lineTo(cx,cy+22); ctx.stroke();
  }
}

function drawRunner(){
  if(state==='ready') return;
  // runner from 1st toward 2nd
  const x=lerp(FIRST.x,SECOND.x,runnerP), y=lerp(FIRST.y,SECOND.y,runnerP);
  const sliding = runnerP>0.82;
  ctx.save(); ctx.translate(x,y);
  ctx.fillStyle='rgba(0,0,0,.22)'; ctx.beginPath(); ctx.ellipse(0,14,13,5,0,0,6.28); ctx.fill();
  ctx.rotate(sliding?-0.7:0.5);
  ctx.strokeStyle='#20304a'; ctx.lineWidth=6; ctx.lineCap='round';
  const sw=Math.sin(t*20)*(sliding?0:6);
  ctx.beginPath(); ctx.moveTo(-2,-6); ctx.lineTo(-5+sw,14); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(2,-6); ctx.lineTo(5-sw,14); ctx.stroke();
  ctx.fillStyle='#e8544e'; rr(-11,-30,22,24,6); ctx.fill();
  ctx.fillStyle='#f0c39a'; ctx.beginPath(); ctx.arc(0,-36,7,0,6.28); ctx.fill();
  ctx.restore();
}

function drawCatcher(){
  const c={x:HOME.x,y:HOME.y-4};
  ctx.save(); ctx.translate(c.x,c.y);
  ctx.fillStyle='rgba(0,0,0,.24)'; ctx.beginPath(); ctx.ellipse(0,16,15,5,0,0,6.28); ctx.fill();
  const throwing=(state==='fly'||state==='result');
  if(throwing) ctx.rotate(-0.2);
  ctx.strokeStyle='#20304a'; ctx.lineWidth=7; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(-4,-8); ctx.lineTo(-9,14); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(4,-8); ctx.lineTo(9,14); ctx.stroke();
  ctx.fillStyle='#c94a44'; rr(-14,-40,28,34,8); ctx.fill();
  ctx.fillStyle='#8a3530'; ctx.fillRect(-14,-24,28,7);
  ctx.fillStyle='#f0c39a'; ctx.beginPath(); ctx.arc(0,-48,9,0,6.28); ctx.fill();
  ctx.fillStyle='#333'; ctx.beginPath(); ctx.arc(0,-49,9,Math.PI*0.9,Math.PI*2.1); ctx.fill(); // mask
  // throwing arm up
  ctx.strokeStyle='#c94a44'; ctx.lineWidth=7;
  const ax=throwing?14:-16, ay=throwing?-56:-30;
  ctx.beginPath(); ctx.moveTo(0,-34); ctx.lineTo(ax,ay); ctx.stroke();
  ctx.fillStyle='#7a4a24'; ctx.beginPath(); ctx.arc(ax,ay,8,0,6.28); ctx.fill();
  ctx.restore();
}

function drawBalls(){
  if(state==='pitch'){
    ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(pitchBall.x,pitchBall.y,7,0,6.28); ctx.fill();
    ctx.strokeStyle='#d33'; ctx.lineWidth=1; ctx.beginPath(); ctx.arc(pitchBall.x-1,pitchBall.y-1,7,0.4,1.9); ctx.stroke();
  }
  if(state==='fly'){
    const fromx=HOME.x+14, fromy=HOME.y-60;
    const tx=SECOND.x+ (wild? (reticle<0?-1:1)*54 : (acc*(tapReticleSign())* 54)), ty=SECOND.y;
    const x=lerp(fromx,tx,throwP), y=lerp(fromy,ty,throwP)-Math.sin(throwP*Math.PI)*22;
    ctx.strokeStyle='rgba(255,255,255,.25)'; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(fromx,fromy); ctx.lineTo(x,y); ctx.stroke();
    ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(x,y,7,0,6.28); ctx.fill();
    ctx.strokeStyle='#d33'; ctx.lineWidth=1; ctx.beginPath(); ctx.arc(x-1,y-1,7,0.4,1.9); ctx.stroke();
  }
}
let _tapRetSign=0;
function tapReticleSign(){ return _tapRetSign; }

function drawPopMeter(){
  if(state!=='throw' && state!=='fly' && state!=='pitch') return;
  // runner-progress bar (urgency)
  const rw=300,rx=(W-rw)/2,ry=560;
  ctx.fillStyle='rgba(6,18,28,.6)'; rr(rx,ry,rw,12,6); ctx.fill();
  ctx.fillStyle= runnerP>0.8?'#ff5a4a':'#ff9060'; rr(rx,ry,rw*runnerP,12,6); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.55)'; ctx.font='11px sans-serif'; ctx.textAlign='left'; ctx.fillText('走者',rx,ry-4);
  ctx.textAlign='right'; ctx.fillText('二塁到達',rx+rw,ry-4);
}

function drawHUD(){
  ctx.textAlign='left'; hud(14,10,'刺殺 OUTS',outs,'#5cc98a');
  ctx.textAlign='center'; hudC(W/2,10,'連続 STREAK',streak,'#7fd0ff');
  ctx.textAlign='right'; hudR(W-14,10,'許盗 SAFE',safes+' /3','#ff7d6b');
  ctx.fillStyle='rgba(255,255,255,.5)'; ctx.font='12px sans-serif'; ctx.textAlign='right';
  ctx.fillText('自己ベスト連続 '+best, W-16, 78);
}
function hud(x,y,l,v,c){ ctx.fillStyle='rgba(6,18,28,.72)'; rr(x,y,112,48,9); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.6)'; ctx.font='11px sans-serif'; ctx.textAlign='left'; ctx.fillText(l,x+10,y+17);
  ctx.fillStyle=c; ctx.font='bold 21px sans-serif'; ctx.fillText(v,x+10,y+40); }
function hudC(x,y,l,v,c){ const w=112; ctx.fillStyle='rgba(6,18,28,.72)'; rr(x-w/2,y,w,48,9); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.6)'; ctx.font='11px sans-serif'; ctx.textAlign='center'; ctx.fillText(l,x,y+17);
  ctx.fillStyle=c; ctx.font='bold 21px sans-serif'; ctx.fillText(v,x,y+40); }
function hudR(x,y,l,v,c){ const w=112; ctx.fillStyle='rgba(6,18,28,.72)'; rr(x-w,y,w,48,9); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.6)'; ctx.font='11px sans-serif'; ctx.textAlign='right'; ctx.fillText(l,x-10,y+17);
  ctx.fillStyle=c; ctx.font='bold 21px sans-serif'; ctx.fillText(v,x-10,y+40); }

function drawMsg(){ if(msgT>0&&msg){ const my=108; ctx.textAlign='center'; ctx.font='bold 19px sans-serif';
  const tw=ctx.measureText(msg).width; ctx.fillStyle='rgba(4,10,18,.62)'; rr(W/2-tw/2-14,my-23,tw+30,32,10); ctx.fill();
  ctx.fillStyle='#fff'; ctx.fillText(msg,W/2,my); } }

function drawOverlay(){
  ctx.fillStyle='rgba(4,10,18,.76)'; ctx.fillRect(0,0,W,H); ctx.textAlign='center';
  ctx.fillStyle='rgba(255,255,255,.55)'; ctx.font='14px sans-serif'; ctx.fillText('BASEBALL · CATCHER',W/2,128);
  ctx.fillStyle='#fff'; ctx.font='bold 52px sans-serif'; ctx.fillText('盗塁阻止',W/2,188);
  ctx.fillStyle='#ffe14d'; ctx.font='bold 22px sans-serif'; ctx.fillText('Gun Down the Stealer',W/2,222);
  ctx.fillStyle='rgba(255,255,255,.82)'; ctx.font='16px sans-serif';
  const lines=['投球と同時に走者がスタート！ ボールを捕ったら','二塁上の照準が左右に動く。中央（緑）で、かつ','できるだけ速くタップして送球。','速さ＝ポップタイム、中央＝正確性。両立で盗塁刺し！','遅い/大きく外すとセーフ。3許盗で交代。'];
  lines.forEach((l,i)=>ctx.fillText(l,W/2,262+i*25));
  const bw=220,bh=54,bx=(W-bw)/2,by=446; ctx.fillStyle='#e8544e'; rr(bx,by,bw,bh,12); ctx.fill();
  ctx.fillStyle='#fff'; ctx.font='bold 24px sans-serif'; ctx.fillText('プレイボール',W/2,by+35);
  ctx.fillStyle='rgba(255,255,255,.5)'; ctx.font='13px sans-serif'; ctx.fillText('タップ / Space',W/2,by+bh+22);
}
function drawOver(){
  ctx.fillStyle='rgba(4,10,18,.8)'; ctx.fillRect(0,0,W,H); ctx.textAlign='center';
  ctx.fillStyle='#fff'; ctx.font='bold 44px sans-serif'; ctx.fillText('スリーアウト・チェンジ',W/2,222);
  ctx.fillStyle='#5cc98a'; ctx.font='bold 28px sans-serif'; ctx.fillText('盗塁刺 '+outs,W/2,276);
  ctx.fillStyle='#ffe14d'; ctx.font='20px sans-serif'; ctx.fillText('自己ベスト連続 '+best,W/2,312);
  const bw=220,bh=54,bx=(W-bw)/2,by=360; ctx.fillStyle='#e8544e'; rr(bx,by,bw,bh,12); ctx.fill();
  ctx.fillStyle='#fff'; ctx.font='bold 24px sans-serif'; ctx.fillText('もう一度',W/2,by+35);
  ctx.fillStyle='rgba(255,255,255,.5)'; ctx.font='13px sans-serif'; ctx.fillText('タップ / Space',W/2,by+bh+22);
}

function render(){
  ctx.save(); if(shakeT>0){ const s=shakeM*(shakeT/13); ctx.translate((Math.random()*2-1)*s,(Math.random()*2-1)*s); }
  drawField(); drawSecond(); drawReticle(); drawRunner(); drawCatcher(); drawBalls();
  for(const q of parts){ ctx.globalAlpha=Math.max(0,q.life); ctx.fillStyle=q.col; ctx.beginPath(); ctx.arc(q.x,q.y,q.r,0,6.28); ctx.fill(); }
  ctx.globalAlpha=1;
  drawPopMeter(); drawHUD(); drawMsg();
  ctx.restore();
  if(flash>0){ ctx.fillStyle=flashCol; ctx.globalAlpha=flash; ctx.fillRect(0,0,W,H); ctx.globalAlpha=1; }
  if(state==='ready') drawOverlay();
  if(state==='over') drawOver();
}
function loop(ts){ if(!last)last=ts; let dt=(ts-last)/1000; last=ts; if(dt>0.05)dt=0.05; update(dt); render(); requestAnimationFrame(loop); }
requestAnimationFrame(loop);

if(TEST){
  window.__ct={
    get state(){return state;},
    get reticle(){return reticle;},
    get clock(){return clock;},
    get pitchArrive(){return pitchArrive;},
    get runnerP(){return runnerP;},
    get result(){return result;},
    get count(){return {outs,safes,streak,level};},
    tap(){ press(); }
  };
}
})();
</script>
