<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>跳ね返し続けろ (Weather the Siege)</title>
<style>
  html,body{margin:0;padding:0;background:#0a1016;overflow:hidden;font-family:'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif;-webkit-user-select:none;user-select:none;touch-action:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 30%,#1f3a2a,#06100a 72%);}
  #stage{position:relative;width:min(100vw,calc(100vh*1.5));aspect-ratio:900/600;max-width:900px;box-shadow:0 10px 60px rgba(0,0,0,.6);border-radius:8px;overflow:hidden;}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;}
</style>
</head>
<body>
<div id="wrap"><div id="stage"><canvas id="cv"></canvas></div></div>
<script>
(function(){
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const W=900,H=600;let DPR=Math.min(2,window.devicePixelRatio||1);
function fit(){const r=cv.getBoundingClientRect();DPR=Math.min(2,window.devicePixelRatio||1);cv.width=Math.round(r.width*DPR);cv.height=Math.round(r.height*DPR);ctx.setTransform(cv.width/W,0,0,cv.height/H,0,0);}
new ResizeObserver(fit).observe(cv);fit();

// ---------- audio ----------
let AC=null;function actx(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function tone(f,d,type,v,sweep){const a=actx();if(!a)return;const o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.value=f;if(sweep)o.frequency.linearRampToValueAtTime(sweep,a.currentTime+d);g.gain.value=0.0001;g.gain.exponentialRampToValueAtTime(v||0.2,a.currentTime+0.008);g.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+d);o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+d+0.02);}
function noise(d,v,hp){const a=actx();if(!a)return;const n=a.createBufferSource(),b=a.createBuffer(1,a.sampleRate*d,a.sampleRate),dt=b.getChannelData(0);for(let i=0;i<dt.length;i++)dt[i]=Math.random()*2-1;n.buffer=b;const f=a.createBiquadFilter();f.type='highpass';f.frequency.value=hp||800;const g=a.createGain();g.gain.value=0.0001;g.gain.exponentialRampToValueAtTime(v||0.2,a.currentTime+0.01);g.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+d);n.connect(f);f.connect(g);g.connect(a.destination);n.start();n.stop(a.currentTime+d+0.02);}
const S={
  // "ドンッ" solid clearance — thud (low body) + noise burst
  clrN(){noise(0.06,0.22,500);tone(150,0.10,'sine',0.16,90);},
  clrC(){noise(0.06,0.24,600);tone(138,0.10,'sine',0.16,84);},
  clrF(){noise(0.06,0.22,700);tone(166,0.10,'sine',0.16,96);},
  perfect(){tone(680,0.08,'triangle',0.16);setTimeout(function(){tone(1020,0.1,'triangle',0.12);},50);noise(0.05,0.18,1800);},
  danger(){noise(0.2,0.2,300);tone(200,0.26,'sawtooth',0.12,120);},   // chance conceded
  swoosh(){noise(0.1,0.05,700);},                                     // ball dropping in
  roar(){for(let i=0;i<8;i++)setTimeout(function(){tone(300+Math.random()*500,0.25,'triangle',0.05);},i*50);noise(0.6,0.14,300);},
  over(){tone(330,0.3,'sine',0.2,160);setTimeout(function(){tone(220,0.5,'sine',0.2,110);},180);},
  start(){tone(440,0.1,'triangle',0.18);setTimeout(function(){tone(660,0.16,'triangle',0.2);},110);},
};

function clamp(v,a,b){return v<a?a:v>b?b:v;}
function rnd(a,b){return a+Math.random()*(b-a);}

// ---------- state ----------
let state='title';
let outs=0,fails=0,score=0,combo=0,lvl=1;   // outs = clean clearances
let best=0;try{best=parseInt(localStorage.getItem('ws_best')||'0')||0;}catch(e){}
const TARGET=26;

const LANEX=[300,450,600], HITY=470, SPAWNY=120;
// three areas the balls rain into: near post / center / far post
const LANEINFO=[{name:'ニアポスト',col:'#ffd23a',key:'ニア'},{name:'中央',col:'#5ad0ff',key:'中央'},{name:'ファーポスト',col:'#ff8a3a',key:'ファー'}];
let travelT=1500, spawnInt=900, winP=0.16, graceP=0.26;
let notes=[], gameClock=0, spawnTimer=0, lastLane=-1;
let focus=0.4;              // 「集中ゲージ」— holding the line
let parts=[];
let flash=0, shakeT=0, laneFx=[0,0,0], hitFx=[0,0,0], hitPerfect=[0,0,0];
let msg='',msgCol='#fff',msgT=0;
let pops=[];               // clearance shock rings
let crossT=0;              // attacker's cross-swing animation timer
let clears=[];             // flying cleared balls (visual)

function reset(){outs=0;fails=0;score=0;combo=0;lvl=1;notes=[];gameClock=0;spawnTimer=0;lastLane=-1;focus=0.4;parts=[];pops=[];crossT=0;clears=[];}
function recalc(){
  lvl=Math.min(7,1+Math.floor(outs/4));
  travelT=clamp(1700-lvl*90,1150,1700);
  spawnInt=clamp(940-lvl*56,560,940);
  winP=clamp(0.17-lvl*0.008,0.11,0.17);
  graceP=winP*1.6;
}
function startGame(){reset();recalc();state='play';spawnTimer=spawnInt*0.6;S.start();}

function burst(x,y,col,n,sp){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=rnd(0.4,1)*(sp||3);parts.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:1,col:col,r:rnd(2,5)});}}

function prog(n){return (gameClock-n.t0)/travelT;}

function spawnNote(){
  let lane;do{lane=Math.floor(Math.random()*3);}while(lane===lastLane&&Math.random()<0.7);
  lastLane=lane;
  notes.push({lane:lane,t0:gameClock,judged:false});
  crossT=1;   // attacker whips in a cross
  S.swoosh();
}

function clrSound(l){if(l===0)S.clrN();else if(l===1)S.clrC();else S.clrF();}

function tapLane(lane){
  if(state==='title'){startGame();return;}
  if(state==='over'){startGame();return;}
  if(state!=='play')return;
  // find the most imminent un-judged ball in this area (prog<=1+graceP)
  let best=null,bp=-9;
  for(const n of notes){ if(n.lane!==lane||n.judged)continue; const p=prog(n); if(p<=1+graceP && p>bp){best=n;bp=p;} }
  laneFx[lane]=1;
  if(best && Math.abs(bp-1)<=graceP){
    best.judged=true;
    const perfect=Math.abs(bp-1)<=winP;
    outs++;combo++;hitFx[lane]=1;hitPerfect[lane]=perfect?1:0;
    focus=clamp(focus+0.05,0,1);
    const cm=1+Math.min(combo-1,9)*0.12;
    const add=Math.round((perfect?120:80)*cm)*Math.max(1,lvl);
    score+=add;
    clrSound(lane);if(perfect)setTimeout(S.perfect,10);
    // launch the cleared ball up-field
    clears.push({x:LANEX[lane],y:HITY,vx:(lane===0?-1:lane===2?1:0)*rnd(1.5,3)+rnd(-0.6,0.6),vy:-rnd(6,9),life:1,perfect:perfect});
    pops.push({x:LANEX[lane],y:HITY,r:12,life:1,perfect:perfect,col:perfect?'#fff2b0':LANEINFO[lane].col});
    burst(LANEX[lane],HITY,perfect?'#fff2b0':LANEINFO[lane].col,perfect?12:7,perfect?3.4:2.4);
    if(perfect)flash=0.15;
    if(combo>0&&combo%10===0){msg=combo+' 連続クリア！ 壁は崩れない！';msgCol='#ffe08a';msgT=1;}
    if(outs>=TARGET){state='over';finishGame();return;}
  }else{
    // swung at nothing — a wasted clearance leaves the line exposed
    combo=0;fails++;focus=clamp(focus-0.12,0,1);
    S.danger();flash=0.2;shakeT=0.28;
    msg='クリアが空振り！ 体勢を崩した';msgCol='#ff6a6a';msgT=1;
    if(fails>=3){state='over';finishGame();return;}
  }
}
function finishGame(){best=Math.max(best,score);try{localStorage.setItem('ws_best',String(best));}catch(e){}if(outs>=TARGET)S.roar();else S.over();}

// ---------- input ----------
function lfrom(x){return x<375?0:(x<525?1:2);}
cv.addEventListener('mousedown',function(e){e.preventDefault();if(!AC)actx();
  if(state!=='play'){tapLane(0);return;}
  const r=cv.getBoundingClientRect();const x=(e.clientX-r.left)/r.width*W;tapLane(lfrom(x));
});
cv.addEventListener('touchstart',function(e){e.preventDefault();if(!AC)actx();
  if(state!=='play'){tapLane(0);return;}
  const r=cv.getBoundingClientRect();const t=e.changedTouches[0];const x=(t.clientX-r.left)/r.width*W;tapLane(lfrom(x));
},{passive:false});
window.addEventListener('keydown',function(e){
  if(!AC)actx();
  if(e.code==='ArrowLeft'||e.code==='KeyA'){e.preventDefault();tapLane(0);}
  else if(e.code==='ArrowDown'||e.code==='KeyS'||e.code==='Space'){e.preventDefault();tapLane(1);}
  else if(e.code==='ArrowRight'||e.code==='KeyD'){e.preventDefault();tapLane(2);}
  else if(e.code==='Enter'){e.preventDefault();if(state!=='play')tapLane(0);}
});

// ---------- update ----------
let last=0;
function update(dt){
  if(flash>0)flash=Math.max(0,flash-dt/300);
  if(shakeT>0)shakeT=Math.max(0,shakeT-dt/320);
  if(msgT>0)msgT=Math.max(0,msgT-dt/1400);
  if(crossT>0)crossT=Math.max(0,crossT-dt/280);
  for(let k=0;k<3;k++){if(laneFx[k]>0)laneFx[k]=Math.max(0,laneFx[k]-dt/200);if(hitFx[k]>0)hitFx[k]=Math.max(0,hitFx[k]-dt/300);}
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.x+=p.vx;p.y+=p.vy;p.vy+=0.14;p.life-=dt/700;if(p.life<=0)parts.splice(i,1);}
  for(let i=pops.length-1;i>=0;i--){const h=pops[i];h.r+=dt*0.06;h.life-=dt/420;if(h.life<=0)pops.splice(i,1);}
  for(let i=clears.length-1;i>=0;i--){const c=clears[i];c.x+=c.vx;c.y+=c.vy;c.vy+=0.16;c.life-=dt/900;if(c.life<=0||c.y>H+30)clears.splice(i,1);}
  if(state!=='play')return;
  gameClock+=dt;
  spawnTimer+=dt;
  if(spawnTimer>=spawnInt){spawnTimer-=spawnInt;spawnNote();}
  // balls that dropped past the line un-cleared = a chance conceded
  for(const n of notes){ if(!n.judged && prog(n)>1+graceP){ n.judged=true;combo=0;fails++;focus=clamp(focus-0.12,0,1);S.danger();shakeT=0.45;msg='抜けた！ ゴール前がガラ空き';msgCol='#ff6a6a';msgT=1; if(fails>=3){state='over';finishGame();return;} } }
  notes=notes.filter(n=>prog(n)<1.7);
  recalc();
  focus=clamp(focus-dt/38000,0,1);
}

// ---------- render ----------
function roundRect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

function ballShape(x,y,r,glow){
  ctx.save();
  if(glow){ctx.shadowColor=glow;ctx.shadowBlur=10;}
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();
  ctx.shadowBlur=0;
  // soccer patches
  ctx.fillStyle='#1b2028';
  ctx.beginPath();
  const R=r*0.42;for(let i=0;i<5;i++){const a=-Math.PI/2+i*Math.PI*2/5;const px=x+Math.cos(a)*R,py=y+Math.sin(a)*R;if(i===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);}
  ctx.closePath();ctx.fill();
  ctx.strokeStyle='rgba(0,0,0,.4)';ctx.lineWidth=1.2;
  for(let i=0;i<5;i++){const a=-Math.PI/2+i*Math.PI*2/5;ctx.beginPath();ctx.moveTo(x+Math.cos(a)*R,y+Math.sin(a)*R);ctx.lineTo(x+Math.cos(a)*r,y+Math.sin(a)*r);ctx.stroke();}
  if(glow){ctx.strokeStyle=glow;ctx.lineWidth=2;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.stroke();}
  ctx.restore();
}

function drawAttack(){
  // top banner: the pressing attackers + pressure readout
  ctx.fillStyle='#241018';ctx.fillRect(0,0,W,100);
  // pressure mesh brightens with the siege
  ctx.strokeStyle='rgba(200,120,120,'+(0.10+(1-focus)*0.18)+')';ctx.lineWidth=1;
  for(let x=0;x<W;x+=26){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x+16,100);ctx.stroke();}
  for(let x=0;x<W;x+=26){ctx.beginPath();ctx.moveTo(x,100);ctx.lineTo(x+16,0);ctx.stroke();}
  // three attackers hovering above each area, one whips a cross when a ball spawns
  for(let l=0;l<3;l++){
    const ax=LANEX[l], ay=58, swing=(lastLane===l)?crossT*crossT:0;
    ctx.save();ctx.translate(ax,ay);
    ctx.fillStyle='#20303f';ctx.fillRect(-8,10,6,20);ctx.fillRect(2,10,6,20);
    ctx.fillStyle='#c33742';roundRect(-11,-14,22,26,4);ctx.fill();
    ctx.fillStyle='#e9c39a';ctx.beginPath();ctx.arc(0,-24,8,0,Math.PI*2);ctx.fill();
    // crossing leg swing
    ctx.strokeStyle='#20303f';ctx.lineWidth=6;ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(0,20);ctx.lineTo(10+swing*14,30-swing*10);ctx.stroke();
    ctx.restore();
  }
  ctx.fillStyle='#ff9a9a';ctx.font='bold 13px sans-serif';ctx.textAlign='center';
  ctx.fillText('波状攻撃',450,26);
}

function drawField(){
  // penalty-box turf, darker toward the goal at the bottom
  for(let i=0;i<6;i++){ctx.fillStyle=i%2?'#2b6b3d':'#256036';ctx.fillRect(0,100+i*((H-100)/6),W,(H-100)/6);}
  // penalty arc / box lines (defensive view)
  ctx.strokeStyle='rgba(255,255,255,.28)';ctx.lineWidth=3;
  ctx.strokeRect(150,HITY+18,600,150);
  ctx.beginPath();ctx.arc(450,HITY+18,86,0.15*Math.PI,0.85*Math.PI);ctx.stroke();
  // goal at the very bottom
  ctx.fillStyle='rgba(255,255,255,.10)';ctx.fillRect(330,560,240,40);
  ctx.strokeStyle='#eef';ctx.lineWidth=5;ctx.strokeRect(332,560,236,36);
  ctx.strokeStyle='rgba(255,255,255,.22)';ctx.lineWidth=1;
  for(let x=340;x<568;x+=14){ctx.beginPath();ctx.moveTo(x,562);ctx.lineTo(x,596);ctx.stroke();}
  for(let y=566;y<596;y+=10){ctx.beginPath();ctx.moveTo(334,y);ctx.lineTo(566,y);ctx.stroke();}
  // keeper in the goal
  ctx.fillStyle='#2fd07a';ctx.fillRect(438,548,24,26);ctx.fillStyle='#f0c9a0';ctx.beginPath();ctx.arc(450,544,7,0,Math.PI*2);ctx.fill();
}

function drawTargets(){
  for(let l=0;l<3;l++){
    ctx.fillStyle='rgba(0,0,0,'+(0.14+laneFx[l]*0.2)+')';ctx.fillRect(LANEX[l]-52,100,104,HITY+18-100);
    ctx.strokeStyle=hitFx[l]>0?(hitPerfect[l]?'#fff2b0':LANEINFO[l].col):'rgba(255,255,255,.5)';
    ctx.lineWidth=hitFx[l]>0?5:3;
    ctx.strokeRect(LANEX[l]-26,HITY-30,52,60);
    if(hitFx[l]>0){ctx.beginPath();ctx.arc(LANEX[l],HITY,34+hitFx[l]*16,0,Math.PI*2);ctx.stroke();}
    ctx.fillStyle='rgba(255,255,255,.72)';ctx.font='bold 14px sans-serif';ctx.textAlign='center';ctx.fillText(LANEINFO[l].key,LANEX[l],HITY-40);
  }
  // clearing line
  ctx.strokeStyle='rgba(255,255,255,.4)';ctx.lineWidth=2;ctx.setLineDash([8,7]);
  ctx.beginPath();ctx.moveTo(230,HITY);ctx.lineTo(670,HITY);ctx.stroke();ctx.setLineDash([]);
}

function drawNotes(){
  for(const n of notes){
    if(n.judged)continue;
    const p=prog(n);if(p<0)continue;
    const y=SPAWNY+(HITY-SPAWNY)*p;
    const li=LANEINFO[n.lane];
    // dropping ball with a downward streak
    ctx.strokeStyle='rgba(255,255,255,.16)';ctx.lineWidth=6;ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(LANEX[n.lane],y-24*Math.min(1,p+.2));ctx.lineTo(LANEX[n.lane],y);ctx.stroke();
    ballShape(LANEX[n.lane],y,14,li.col);
  }
}

function drawClears(){
  for(const c of clears){ctx.globalAlpha=clamp(c.life,0,1);ballShape(c.x,c.y,10,c.perfect?'#fff2b0':null);}
  ctx.globalAlpha=1;
}

function drawPops(){
  for(const h of pops){
    ctx.globalAlpha=clamp(h.life,0,1)*0.8;
    ctx.strokeStyle=h.col;ctx.lineWidth=h.perfect?4:3;
    ctx.beginPath();ctx.arc(h.x,h.y,h.r,0,Math.PI*2);ctx.stroke();
  }
  ctx.globalAlpha=1;
}

function drawDefender(){
  // the defender at the line lunges/heads toward the area that just got cleared
  let sl=1,sv=0;for(let l=0;l<3;l++){if(hitFx[l]>sv){sv=hitFx[l];sl=l;}}
  const baseX=450, cx=baseX+(LANEX[sl]-baseX)*(0.35+sv*0.4), cy=HITY+40;
  ctx.save();ctx.translate(cx,cy);
  ctx.fillStyle='rgba(0,0,0,.25)';ctx.beginPath();ctx.ellipse(0,20,24,7,0,0,Math.PI*2);ctx.fill();
  // legs (spring up on a header)
  const lift=sv*10;
  ctx.fillStyle='#16304f';ctx.fillRect(-11,2-lift,8,20);ctx.fillRect(3,2-lift,8,20);
  // body in defending kit
  ctx.fillStyle='#2f6fd0';roundRect(-14,-22-lift,28,28,6);ctx.fill();
  ctx.fillStyle='#1b4a94';ctx.fillRect(-14,-22-lift,28,6);
  // head, tilts toward the ball
  const hx=(sl===0)?-6:(sl===2?6:0);
  ctx.fillStyle='#f0c9a0';ctx.beginPath();ctx.arc(hx,-32-lift-sv*6,10,0,Math.PI*2);ctx.fill();
  // arms out for balance
  ctx.strokeStyle='#2f6fd0';ctx.lineWidth=6;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(-12,-14-lift);ctx.lineTo(-24,-4-lift-sv*8);ctx.stroke();
  ctx.beginPath();ctx.moveTo(12,-14-lift);ctx.lineTo(24,-4-lift-sv*8);ctx.stroke();
  ctx.restore();
}

function drawHUD(){
  ctx.textAlign='left';ctx.textBaseline='alphabetic';
  ctx.font='bold 20px sans-serif';ctx.fillStyle='#fff';
  ctx.fillText('クリア '+outs+' / '+TARGET,20,128);
  ctx.font='14px sans-serif';ctx.fillStyle='#ffb14a';ctx.fillText('被決定機 '+fails+' / 3',20,150);
  ctx.textAlign='right';
  ctx.font='bold 20px sans-serif';ctx.fillStyle='#ffe08a';ctx.fillText('SCORE '+score,W-20,128);
  ctx.font='13px sans-serif';ctx.fillStyle='#bfe';ctx.fillText('BEST '+Math.max(best,score)+'   Lv.'+lvl,W-20,150);
  // focus bar
  ctx.fillStyle='rgba(0,0,0,.4)';roundRect(330,118,240,14,7);ctx.fill();
  const eg=ctx.createLinearGradient(330,0,570,0);eg.addColorStop(0,'#3ad0a0');eg.addColorStop(1,'#ffd23a');
  ctx.fillStyle=eg;roundRect(330,118,240*focus,14,7);ctx.fill();
  ctx.textAlign='center';ctx.font='11px sans-serif';ctx.fillStyle='#fff';ctx.fillText('集中ゲージ',450,129);
  if(combo>1){ctx.font='bold 20px sans-serif';ctx.fillStyle='#5affa0';ctx.fillText(combo+' 連続クリア!',450,178);}
}

function drawMsg(){
  if(msgT<=0)return;
  ctx.save();ctx.globalAlpha=clamp(msgT*1.4,0,1);
  ctx.textAlign='center';ctx.font='bold 23px sans-serif';
  ctx.fillStyle='rgba(0,0,0,.55)';roundRect(450-270,204,540,42,10);ctx.fill();
  ctx.fillStyle=msgCol;ctx.fillText(msg,450,232);
  ctx.restore();
}

function drawTitle(){
  drawAttack();drawField();drawTargets();drawDefender();
  ctx.save();ctx.textAlign='center';
  ctx.fillStyle='rgba(0,0,0,.7)';roundRect(84,108,732,408,16);ctx.fill();
  ctx.fillStyle='#fff';ctx.font='bold 32px sans-serif';ctx.fillText('跳ね返し続けろ',450,166);
  ctx.font='18px sans-serif';ctx.fillStyle='#9fe0bf';ctx.fillText('Weather the Siege',450,196);
  ctx.font='16px sans-serif';ctx.fillStyle='#e6fcef';
  const lines=[
    '押し込まれ、ゴール前に次々ボールが放り込まれる波状攻撃。',
    'ボールがニア／中央／ファーの“クリアライン”に重なる“今”ジャストで',
    'そのエリアをタップ＝力強く跳ね返せ！ 壁を崩されるな。',
    'ニア＝左/←、中央＝中央/↓/SPACE、ファー＝右/→。',
    'タイミングがズレる＝空振り、見送る＝ゴール前ガラ空き。',
    '26本クリアで攻撃をしのぎ切る。3被決定機で終了。',
  ];
  for(let i=0;i<lines.length;i++)ctx.fillText(lines[i],450,236+i*30);
  ctx.fillStyle='#ffe08a';ctx.font='bold 22px sans-serif';
  ctx.fillText('タップ / キーでスタート',450,492);
  ctx.restore();
}

function drawOver(){
  drawAttack();drawField();
  ctx.save();ctx.textAlign='center';
  ctx.fillStyle='rgba(0,0,0,.7)';roundRect(190,150,520,300,16);ctx.fill();
  const w2=outs>=TARGET;
  ctx.fillStyle=w2?'#5affa0':'#ff8a5a';ctx.font='bold 34px sans-serif';
  ctx.fillText(w2?'守り切った！':'ゴールを割られた…',450,222);
  ctx.fillStyle='#fff';ctx.font='20px sans-serif';
  ctx.fillText('クリア '+outs+' / '+TARGET,450,270);
  ctx.fillText('スコア '+score,450,304);
  ctx.fillStyle='#ffe08a';ctx.fillText('ベスト '+Math.max(best,score),450,336);
  ctx.fillStyle='#9fe0bf';ctx.font='bold 20px sans-serif';
  ctx.fillText('タップ / キー でもう一度',450,404);
  ctx.restore();
}

function render(){
  ctx.save();
  if(shakeT>0){const s=shakeT*7;ctx.translate(rnd(-s,s),rnd(-s,s));}
  if(state==='title'){drawTitle();}
  else if(state==='over'){drawOver();}
  else{
    drawAttack();drawField();drawTargets();drawNotes();drawClears();drawPops();drawDefender();drawHUD();drawMsg();
  }
  for(const p of parts){ctx.globalAlpha=clamp(p.life,0,1);ctx.fillStyle=p.col;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();}
  ctx.globalAlpha=1;
  ctx.restore();
  if(flash>0){ctx.fillStyle='rgba(255,240,180,'+(flash*0.4)+')';ctx.fillRect(0,0,W,H);}
}

function frame(ts){let dt=ts-last;last=ts;if(dt>60)dt=60;if(dt<0)dt=0;update(dt);render();requestAnimationFrame(frame);}
requestAnimationFrame(frame);

// ---------- test hook ----------
window.__ws={
  start:startGame,
  tap:tapLane,
  get state(){return state;},
  get outs(){return outs;},
  get fails(){return fails;},
  get score(){return score;},
  get info(){
    const ns=[];for(const n of notes){if(!n.judged){const p=(gameClock-n.t0)/travelT;if(p<=1.5)ns.push({lane:n.lane,prog:p});}}
    return {state:state,outs:outs,fails:fails,score:score,lvl:lvl,winP:winP,graceP:graceP,notes:ns};
  }
};
})();
</script>
