<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>クリアリング (Clear the Danger)</title>
<style>
  html,body{margin:0;height:100%;background:#0a1410;overflow:hidden;
    font-family:-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  #stage{position:relative;width:100vw;height:100vh;max-width:calc(100vh*1.5);max-height:calc(100vw/1.5);aspect-ratio:900/600;}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;border-radius:6px;}
</style>
</head>
<body>
<div id="wrap"><div id="stage"><canvas id="cv"></canvas></div></div>
<script>
(function(){
const W=900,H=600,cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let DPR=1;
function fit(){DPR=Math.min(2,window.devicePixelRatio||1);cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
fit();addEventListener('resize',fit);

// ---------- audio ----------
let AC=null;function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function tone(f,d,type,v,sweep){const a=ac();if(!a)return;const t=a.currentTime,o=a.createOscillator(),g=a.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(sweep)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+sweep),t+d);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v||0.2,t+0.008);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+0.02);}
function noise(d,v,hp){const a=ac();if(!a)return;const t=a.currentTime,n=Math.floor(a.sampleRate*d),buf=a.createBuffer(1,n,a.sampleRate),ch=buf.getChannelData(0);
  for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource();s.buffer=buf;
  const f=a.createBiquadFilter();f.type='highpass';f.frequency.value=hp||600;const g=a.createGain();g.gain.value=v||0.2;
  s.connect(f);f.connect(g);g.connect(a.destination);s.start(t);s.stop(t+d+0.02);}
const S={
  clear:()=>{noise(0.06,0.16,500);tone(300,0.08,'square',0.1,300);},
  big:()=>{noise(0.06,0.14,450);[520,780,1040,1300].forEach((f,i)=>setTimeout(()=>tone(f,0.12,'triangle',0.18),i*55));},
  bad:()=>{noise(0.18,0.24,300);tone(160,0.2,'sawtooth',0.13,-60);},
  steal:()=>{noise(0.14,0.2,360);tone(200,0.16,'sawtooth',0.1,-50);},
  streak:()=>{[700,930,1170,1400].forEach((f,i)=>setTimeout(()=>tone(f,0.1,'triangle',0.16),i*60));},
  over:()=>{[440,330,247,175].forEach((f,i)=>setTimeout(()=>tone(f,0.3,'triangle',0.2),i*160));}
};

// ---------- geometry ----------
const GOAL={x:450,y:556}, BALL={x:450,y:432};
const MB={x:812,y:150,w:34,h:300};

// ---------- state ----------
let state='title', phase='wind', t=0, plays=0;
let score=0, combo=0, best=+(localStorage.getItem('clearit_best')||0);
let outs=0, fails=0, lvl=1;   // outs = clears
let clock=0, fullT=1300, bandC=0.6, bandHalf=0.1, stealT=1400;
let attackerSide='L', safeSide='R';
let acted=false, lockP=0, lockSide=null, result=null, resultT=0, msg='', clearU=0, attU=0;
let shake=0, flash=0, flashCol='#fff', last=performance.now();
let parts=[], pops=[];

function rnd(a,b){return a+Math.random()*(b-a);}
function chance(p){return Math.random()<p;}
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function lerp(a,b,u){return a+(b-a)*u;}
function easeOut(u){return 1-Math.pow(1-u,2);}

function params(){ return {
  full:Math.max(920,1460-lvl*74),
  half:Math.max(0.076,0.122-lvl*0.0065),
  buf:Math.max(120,430-lvl*44)
};}
function powerVal(){ return clamp(clock/fullT,0,1); }

function reset(){state='title';score=0;combo=0;outs=0;fails=0;lvl=1;plays=0;result=null;parts=[];pops=[];}
function newPlay(){
  plays++; lvl=Math.min(7,1+Math.floor(outs/4));
  const p=params();
  fullT=p.full; bandHalf=p.half; bandC=rnd(0.46,0.72);
  stealT=(bandC+bandHalf)*fullT + p.buf;
  attackerSide=chance(0.5)?'L':'R'; safeSide=attackerSide==='L'?'R':'L';
  clock=0; acted=false; lockP=0; lockSide=null; result=null; phase='wind'; msg=''; resultT=0; clearU=0; attU=0;
}
function start(){ if(!ac())ac(); if(AC&&AC.state==='suspended')AC.resume(); reset(); state='play'; newPlay(); }

function clearBall(side){
  if(state==='title'){start();return;}
  if(state==='over'){ if(resultT>0.4){reset();start();} return; }
  if(state!=='play'||phase!=='wind'||acted) return;
  acted=true; lockP=powerVal(); lockSide=side;
  if(side!==safeSide){ S.bad(); resolve('wrongside'); return; }   // cleared toward the attacker / across goal
  const d=lockP-bandC;
  if(Math.abs(d)<=bandHalf){ resolve(Math.abs(d)<=bandHalf*0.4?'big':'clear'); }
  else if(d<0){ S.bad(); resolve('weak'); }
  else { S.bad(); resolve('shank'); }
}

function resolve(kind){
  phase='result'; result=kind; resultT=0;
  const good=(kind==='clear'||kind==='big');
  if(good){
    outs++; combo++;
    let add=Math.round((kind==='big'?170:110)*(1+Math.min(9,combo-1)*0.15)); score+=add;
    if(kind==='big'){ S.big(); flash=1;flashCol='#8affa0';shake=8; burst(BALL.x,BALL.y,'#8affa0',22,7);
      pop(BALL.x,BALL.y-40,'ビッグクリア！ +'+add,'#d6ffe0'); pop(450,180,'完璧にかき出した！','#8affa0'); }
    else { S.clear(); flash=1;flashCol='#ffe08a';shake=5; burst(BALL.x,BALL.y,'#ffe08a',12,5);
      pop(BALL.x,BALL.y-40,'クリア！ +'+add,'#fff3c4'); }
    if(combo>=2)pop(450,220,'コンボ x'+combo,'#ffd24d');
    if(combo>0&&combo%5===0)S.streak();
    msg=kind==='big'?'完璧なクリア！ 危険を大きくかき出した！':'ナイスクリア！ ピンチを脱した';
  } else {
    fails++; combo=0; flash=1;flashCol='#ff5b5b';shake=9;
    if(kind==='wrongside'){ msg='逆サイドへ！ 詰めてきた相手に当ててしまった…'; }
    else if(kind==='weak'){ msg='弱い…ボールが box に残り、相手に押し込まれた'; }
    else if(kind==='shank'){ msg='当たり損ない…力み過ぎて危険な浮き球に'; }
    else { S.steal(); msg='遅い！ 相手に詰められてボールを奪われた'; }
    pop(BALL.x,BALL.y-40,kind==='stolen'?'奪われた…':'失敗','#ffb0b0');
  }
  if(fails>=3){ state='over'; resultT=0; S.over(); if(score>best){best=score;localStorage.setItem('clearit_best',best);} }
}

// ---------- input ----------
cv.addEventListener('pointerdown',e=>{e.preventDefault();
  if(state==='title'){start();return;}
  if(state==='over'){ if(resultT>0.4){reset();start();} return; }
  const r=cv.getBoundingClientRect(); const x=(e.clientX-r.left)/r.width;
  clearBall(x<0.5?'L':'R');
});
addEventListener('keydown',e=>{
  if(e.code==='ArrowLeft'||e.code==='KeyA'){e.preventDefault();clearBall('L');}
  else if(e.code==='ArrowRight'||e.code==='KeyD'){e.preventDefault();clearBall('R');}
  else if(e.code==='Space'||e.code==='Enter'){e.preventDefault(); if(state!=='play')clearBall('L');}
});

// ---------- particles ----------
function burst(x,y,c,n,sp){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=rnd(sp*0.3,sp);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:1,c});}}
function pop(x,y,txt,c){pops.push({x,y,txt,c,life:1});}

// ---------- update ----------
function update(dt){
  shake*=Math.pow(0.86,dt/16.7); if(shake<0.3)shake=0;
  flash*=Math.pow(0.9,dt/16.7);
  for(const p of parts){p.vx*=0.96;p.vy=p.vy*0.96+0.28;p.x+=p.vx*dt/16.7;p.y+=p.vy*dt/16.7;p.life-=dt/16.7*0.026;}
  parts=parts.filter(p=>p.life>0);
  for(const p of pops){p.y-=dt/16.7*0.5;p.life-=dt/16.7*0.02;}
  pops=pops.filter(p=>p.life>0);

  if(state!=='play'){ if(state==='over')resultT+=dt/1000; return; }
  t+=dt;
  if(phase==='wind'){
    clock+=dt;
    attU=clamp(clock/stealT,0,1);
    if(!acted && clock>=stealT){ resolve('stolen'); }
    return;
  }
  if(phase==='result'){
    resultT+=dt/1000;
    clearU=Math.min(1,clearU+dt/340);
    if(resultT>1.15 && state==='play') newPlay();
    return;
  }
}

// ---------- render ----------
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function drawScene(){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#215f2c');g.addColorStop(1,'#123a1b');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='rgba(255,255,255,0.035)';
  for(let i=0;i<7;i++){ if(i%2===0)ctx.fillRect(i*W/7,0,W/7,H); }
  // own goal at bottom
  ctx.fillStyle='rgba(255,255,255,0.10)';ctx.fillRect(GOAL.x-120,GOAL.y-6,240,50);
  ctx.strokeStyle='#f2f4f6';ctx.lineWidth=6;
  ctx.beginPath();ctx.moveTo(GOAL.x-120,GOAL.y-6);ctx.lineTo(GOAL.x-120,GOAL.y+44);ctx.lineTo(GOAL.x+120,GOAL.y+44);ctx.lineTo(GOAL.x+120,GOAL.y-6);ctx.stroke();
  // penalty box
  ctx.strokeStyle='rgba(255,255,255,0.28)';ctx.lineWidth=2;ctx.strokeRect(GOAL.x-220,GOAL.y-150,440,150);
  ctx.beginPath();ctx.arc(GOAL.x,GOAL.y-150,70,3.55,5.87);ctx.stroke();
}
function drawFig(x,y,col){ ctx.fillStyle='rgba(0,0,0,0.22)';ctx.beginPath();ctx.ellipse(x,y+13,12,4,0,0,6.28);ctx.fill();
  ctx.fillStyle=col;rr(x-9,y-11,18,26,7);ctx.fill();
  ctx.fillStyle='#f2c9a0';ctx.beginPath();ctx.arc(x,y-16,6.5,0,6.28);ctx.fill(); }

function render(){
  ctx.save();
  if(shake>0)ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
  drawScene();

  if(state==='play'){
    // safe-side arrow (open lane) hint
    const sgn = safeSide==='L'?-1:1;
    // attacker rushing toward the ball from attackerSide
    const aSgn = attackerSide==='L'?-1:1;
    const ax = lerp(BALL.x+aSgn*250, BALL.x+aSgn*34, easeOut(phase==='wind'?attU:1));
    const ay = lerp(BALL.y-70, BALL.y, easeOut(phase==='wind'?attU:1));
    if(!(phase==='result'&&(result==='clear'||result==='big'))) drawFig(ax,ay,'#e23c3c');

    // defender at the ball
    drawFig(BALL.x - sgn*4, BALL.y-2, '#2b6cff');

    // ball
    if(phase==='wind'){
      ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(BALL.x,BALL.y+8,8,0,6.28);ctx.fill();
      ctx.strokeStyle='#333';ctx.lineWidth=1.2;ctx.beginPath();ctx.arc(BALL.x,BALL.y+8,8,0.6,2.4);ctx.stroke();
      // open-lane arrow
      ctx.fillStyle='rgba(150,240,170,0.85)';ctx.font='bold 14px sans-serif';ctx.textAlign='center';
      ctx.fillText(safeSide==='L'?'◀ 空いている左へ':'空いている右へ ▶', BALL.x + sgn*130, BALL.y-40);
    } else {
      // cleared ball flies to safe side (up) or fails
      let bx,by;
      if(result==='clear'||result==='big'){ bx=BALL.x+sgn*lerp(0,300,easeOut(clearU)); by=BALL.y-lerp(0,300,easeOut(clearU)); }
      else if(result==='wrongside'){ bx=BALL.x-sgn*lerp(0,120,easeOut(clearU)); by=BALL.y-lerp(0,40,Math.sin(clearU*3.14)); }
      else if(result==='shank'){ bx=BALL.x+lerp(0,40,clearU); by=BALL.y-lerp(0,180,easeOut(clearU)); }
      else { bx=BALL.x; by=BALL.y+8; }
      ctx.globalAlpha=(result==='clear'||result==='big')?1:clamp(1.2-resultT,0,1);
      ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(bx,by,8,0,6.28);ctx.fill();ctx.globalAlpha=1;
    }

    // ---------- power meter ----------
    ctx.fillStyle='rgba(0,0,0,0.35)';rr(MB.x-6,MB.y-24,MB.w+12,MB.h+44,10);ctx.fill();
    ctx.fillStyle='rgba(255,255,255,0.85)';ctx.font='bold 12px sans-serif';ctx.textAlign='center';ctx.fillText('パワー',MB.x+MB.w/2,MB.y-10);
    ctx.fillStyle='rgba(255,255,255,0.12)';rr(MB.x,MB.y,MB.w,MB.h,7);ctx.fill();
    // over zone (red) above band
    const overTopY=MB.y+MB.h*(1-(1));
    ctx.fillStyle='rgba(226,60,60,0.22)';ctx.fillRect(MB.x,MB.y,MB.w,MB.h*(1-(bandC+bandHalf)));
    // safe band (green)
    const bandTopY=MB.y+MB.h*(1-(bandC+bandHalf)), bandH=MB.h*(2*bandHalf);
    ctx.fillStyle='rgba(120,235,150,0.4)';ctx.fillRect(MB.x,bandTopY,MB.w,bandH);
    ctx.strokeStyle='rgba(150,240,170,0.95)';ctx.lineWidth=2;ctx.strokeRect(MB.x,bandTopY,MB.w,bandH);
    ctx.fillStyle='rgba(150,240,170,0.9)';ctx.font='10px sans-serif';ctx.fillText('セーフ',MB.x+MB.w/2,bandTopY+bandH/2+3);
    // marker
    const pv=phase==='wind'?powerVal():lockP; const my=MB.y+MB.h*(1-pv);
    ctx.fillStyle=(phase==='wind')?'#ffd24d':((result==='clear'||result==='big')?'#8affa0':'#ff7b7b');
    ctx.fillRect(MB.x,my-2,MB.w,4);
    ctx.beginPath();ctx.moveTo(MB.x-10,my);ctx.lineTo(MB.x-2,my-7);ctx.lineTo(MB.x-2,my+7);ctx.closePath();ctx.fill();
    ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='10px sans-serif';ctx.fillText('強',MB.x+MB.w/2,MB.y+8);ctx.fillText('弱',MB.x+MB.w/2,MB.y+MB.h+14);
    // steal timer
    if(phase==='wind'){ const u=clamp(clock/stealT,0,1);
      ctx.fillStyle='rgba(255,255,255,0.25)';rr(MB.x-6,MB.y+MB.h+20,MB.w+12,6,3);ctx.fill();
      ctx.fillStyle='rgba(255,120,120,0.9)';rr(MB.x-6,MB.y+MB.h+20,(MB.w+12)*u,6,3);ctx.fill(); }
  }

  for(const p of parts){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,3.2,0,6.28);ctx.fill();}
  ctx.globalAlpha=1;
  for(const p of pops){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.font='bold 22px sans-serif';ctx.textAlign='center';ctx.fillText(p.txt,p.x,p.y);}
  ctx.globalAlpha=1;

  // HUD
  ctx.textAlign='left';ctx.fillStyle='#fff';ctx.font='bold 26px sans-serif';ctx.fillText('SCORE '+score,20,36);
  ctx.textAlign='right';ctx.fillStyle='rgba(255,255,255,0.9)';ctx.font='14px sans-serif';ctx.fillText('クリア '+outs+'  Lv'+lvl,W-20,24);
  ctx.fillText('失点',W-92,46);
  for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(W-60+i*20,41,7,0,6.28);ctx.fillStyle=i<fails?'#ff5b5b':'rgba(255,255,255,0.25)';ctx.fill();}
  if(combo>=2){ctx.textAlign='center';ctx.fillStyle='#ffd24d';ctx.font='bold 18px sans-serif';ctx.fillText('コンボ x'+combo,360,44);}

  if(state==='play'&&phase==='wind'){ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,0.9)';ctx.font='bold 15px sans-serif';
    ctx.fillText('相手と逆＝空いたサイド（左/右）へ、パワーが緑“セーフ帯”の時にクリア！ 詰められる前に',W/2,44);}
  if(state==='play'&&phase==='result'&&msg){ctx.textAlign='center';ctx.fillStyle=(result==='clear'||result==='big')?'#9ff0b8':'#ff9a9a';ctx.font='bold 20px sans-serif';ctx.fillText(msg,W/2,44);}

  if(state==='title'){
    ctx.fillStyle='rgba(5,14,9,0.78)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='bold 44px sans-serif';ctx.fillText('クリアリング',W/2,110);
    ctx.fillStyle='#ffd23e';ctx.font='bold 22px sans-serif';ctx.fillText('Clear the Danger',W/2,146);
    ctx.fillStyle='rgba(255,255,255,0.92)';ctx.font='16px sans-serif';
    ctx.fillText('自陣ゴール前のピンチ。詰めてくる相手より先に、危険を大きくかき出せ',W/2,196);
    ctx.fillStyle='rgba(255,255,255,0.66)';ctx.font='14px sans-serif';
    ctx.fillText('相手（赤）がボールに詰めてくる。奪われる前にクリアする',W/2,236);
    ctx.fillText('クリア方向＝相手と逆の“空いたサイド”（左半分/←キー or 右半分/→キー）',W/2,258);
    ctx.fillText('右の「パワー」が上昇中。緑の“セーフ帯”に来た瞬間に、空いた側へクリア',W/2,280);
    ctx.fillText('相手側へ蹴ると跳ね返されて危険、弱いと box に残る、強すぎると危険な浮き球',W/2,302);
    ctx.fillText('セーフ帯の中心なら“ビッグクリア”で大量得点。上級ほど速く帯が狭い。3失点で交代',W/2,324);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で開始',W/2,390);
    ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='14px sans-serif';ctx.fillText('BEST '+best+'　　左/右へクリア',W/2,422);
  }
  if(state==='over'){
    ctx.fillStyle='rgba(5,14,9,0.84)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#ff6b6b';ctx.font='bold 46px sans-serif';ctx.fillText('3失点…交代',W/2,222);
    ctx.fillStyle='#fff';ctx.font='bold 40px sans-serif';ctx.fillText('SCORE '+score,W/2,290);
    ctx.fillStyle='rgba(255,255,255,0.85)';ctx.font='19px sans-serif';ctx.fillText('クリア '+outs+'   BEST '+best,W/2,330);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で もう一度',W/2,402);
  }

  if(flash>0.02){ctx.globalAlpha=flash*0.5;ctx.fillStyle=flashCol;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}
  ctx.restore();

  ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,0.4)';ctx.font='12px sans-serif';
  ctx.fillText('相手と逆の空いたサイドへ、パワーが緑セーフ帯の時にクリア（左/右）。逆/弱/強/遅れは失点。3失点で交代',W/2,H-8);
}

function frame(ts){let dt=ts-last;last=ts;if(dt>60)dt=60;if(dt<0)dt=0;update(dt);render();requestAnimationFrame(frame);}
requestAnimationFrame(frame);

// ---------- test hook ----------
window.__cl={
  start, clear:(s)=>clearBall(s),
  get state(){return state;},
  get score(){return score;},
  get outs(){return outs;},
  get fails(){return fails;},
  get info(){return {state,phase,attackerSide,safeSide,power:(phase==='wind'?powerVal():lockP),bandC,bandHalf,
    bandLo:bandC-bandHalf,bandHi:bandC+bandHalf,canAct:(phase==='wind'&&!acted),acted,lockSide,result,
    clock,fullT,stealT,outs,fails,lvl};}
};
})();
</script>
</body>
</html>
