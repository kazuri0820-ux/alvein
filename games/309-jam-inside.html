<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>内角攻め (Jam Him Inside)</title>
<style>
  html,body{margin:0;height:100%;background:#0a1207;overflow:hidden;
    font-family:-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  #stage{position:relative;width:100vw;height:100vh;max-width:calc(100vh*1.5);max-height:calc(100vw/1.5);aspect-ratio:900/600;}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;border-radius:6px;}
</style>
</head>
<body>
<div id="wrap"><div id="stage"><canvas id="cv"></canvas></div></div>
<script>
(function(){
const W=900,H=600,cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let DPR=1;
function fit(){DPR=Math.min(2,window.devicePixelRatio||1);cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
fit();addEventListener('resize',fit);

// ---------- audio ----------
let AC=null;function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function tone(f,d,type,v,sweep){const a=ac();if(!a)return;const t=a.currentTime,o=a.createOscillator(),g=a.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(sweep)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+sweep),t+d);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v||0.2,t+0.008);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+0.02);}
function noise(d,v,hp){const a=ac();if(!a)return;const t=a.currentTime,n=Math.floor(a.sampleRate*d),buf=a.createBuffer(1,n,a.sampleRate),ch=buf.getChannelData(0);
  for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource();s.buffer=buf;
  const f=a.createBiquadFilter();f.type='highpass';f.frequency.value=hp||600;const g=a.createGain();g.gain.value=v||0.2;
  s.connect(f);f.connect(g);g.connect(a.destination);s.start(t);s.stop(t+d+0.02);}
const S={
  set:()=>{tone(300,0.06,'sine',0.05,90);},
  jam:()=>{noise(0.05,0.16,900);tone(240,0.06,'square',0.06,-30);},
  out:()=>{[680,940,1220].forEach((f,i)=>setTimeout(()=>tone(f,0.1,'triangle',0.16),i*55));},
  big:()=>{[640,860,1100,1400].forEach((f,i)=>setTimeout(()=>tone(f,0.12,'triangle',0.17),i*80));},
  crush:()=>{noise(0.05,0.2,400);tone(200,0.14,'square',0.14,-60);},
  hbp:()=>{noise(0.09,0.2,500);tone(160,0.14,'sawtooth',0.12,-40);},
  bad:()=>{noise(0.16,0.2,300);tone(150,0.2,'sawtooth',0.11,-40);},
  streak:()=>{[700,930,1170,1400].forEach((f,i)=>setTimeout(()=>tone(f,0.1,'triangle',0.16),i*60));},
  over:()=>{[440,330,247,175].forEach((f,i)=>setTimeout(()=>tone(f,0.3,'triangle',0.2),i*160));}
};

// ---------- geometry ----------
const PIT={x:180,y:250}, PLATE={x:600,y:430};
const ZX=560, ZW=120, ZTOP=250, ZBOT=380;   // strike zone box
const ZL=ZX-ZW/2, ZR=ZX+ZW/2;
const BATX=ZR+34;                             // batter stands just inside (right of zone = inside for RHB view)

// ---------- state ----------
let state='title', phase='pitch', plays=0;
let score=0, combo=0, best=+(localStorage.getItem('ji_best')||0);
let outs=0, fails=0, lvl=1;    // outs = jam outs
let t=0, jamT=620, w=460, crowd=false, tough=false;
let decided=false, result=null, resultT=0, msg='', msgOk=false, relAt=0, finishX=0;
let ballU=0, batU=0;
let shake=0, flash=0, flashCol='#fff', last=performance.now();
let parts=[], pops=[];

function rnd(a,b){return a+Math.random()*(b-a);}
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function lerp(a,b,u){return a+(b-a)*u;}
function easeOut(u){return 1-Math.pow(1-u,2);}
function jamW(){return crowd?w*0.82:w;}

function reset(){state='title';score=0;combo=0;outs=0;fails=0;lvl=1;plays=0;result=null;parts=[];pops=[];}

function newPlay(){
  plays++; lvl=Math.min(7,1+Math.floor(outs/4));
  jamT=clamp(640-lvl*28,440,640);
  w=clamp(470-lvl*24,300,470);
  crowd=Math.random()<0.42;
  tough=Math.random()<clamp(0.18+lvl*0.05,0.18,0.5);
  phase='pitch'; t=0; decided=false; result=null; resultT=0; msg=''; msgOk=false; relAt=0; finishX=0;
  ballU=0; batU=0;
  S.set();
}
function start(){ if(!ac())ac(); if(AC&&AC.state==='suspended')AC.resume(); reset(); state='play'; newPlay(); }

function act(){
  if(state==='title'){start();return;}
  if(state==='over'){ if(resultT>0.4){reset();start();} return; }
  if(state!=='play'||phase!=='pitch'||decided) return;
  decided=true; relAt=t; const jw=jamW();
  if(t<jamT){ finishX=lerp(ZX-6,ZR-8,clamp(t/jamT,0,1)); resolve('fat'); return; }        // early: over the plate (fat)
  if(t<=jamT+jw){ finishX=ZR+4; resolve('jam'); return; }                                   // window: inside corner (jam)
  finishX=BATX+6; resolve('hbp'); return;                                                    // late: hits the batter
}

function resolve(k){
  phase='result'; result=k; resultT=0;
  if(k==='jam'){
    outs++; combo++;
    const onthehands=(relAt>=jamT+jamW()*0.5);
    let base=(tough||crowd)?250:150; if(onthehands)base+=70;
    let add=Math.round(base*(1+Math.min(9,combo-1)*0.14)); score+=add;
    S.jam(); setTimeout(S.out,90); if(onthehands||tough)setTimeout(S.big,150);
    msgOk=true; flash=1;flashCol='#8affa0';shake=5; burst(ZR,ZTOP+ (ZBOT-ZTOP)/2,'#8affa0',16,7);
    pop(ZX,ZTOP-24,(crowd?'踏み込む打者を差し込んだ！ +':'詰まらせた！ +')+add,'#d6ffe0');
    if(combo>=2)pop(W/2,150,'コンボ x'+combo,'#ffd24d');
    if(combo>0&&combo%5===0)S.streak();
    msg=crowd?'踏み込んできた打者の懐を突いてバットを折った——会心の内角':'内角ギリギリで差し込み、詰まった打球で凡退——ナイスピッチ';
  } else {
    fails++; combo=0; msgOk=false; flash=1;flashCol='#ff5b5b';shake=9;
    if(k==='fat'){ S.crush(); msg='甘い…真ん中に入って痛打された'; pop(ZX,ZTOP+40,'痛打…','#ffb0b0'); }
    else { S.hbp(); msg='突っ込みすぎ…打者に当ててデッドボール（四死球）'; pop(BATX,ZTOP+30,'死球…','#ffb0b0'); }
  }
  if(fails>=3){ state='over'; resultT=0; setTimeout(S.over,200); if(score>best){best=score;localStorage.setItem('ji_best',best);} }
}

// ---------- input ----------
cv.addEventListener('pointerdown',e=>{e.preventDefault();act();});
addEventListener('keydown',e=>{ if(e.repeat)return;
  if(e.code==='Space'||e.code==='Enter'||e.code==='ArrowUp'||e.code==='KeyF'){e.preventDefault();act();} });

// ---------- particles ----------
function burst(x,y,c,n,sp){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=rnd(sp*0.3,sp);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:1,c});}}
function pop(x,y,txt,c){pops.push({x,y,txt,c,life:1});}

// ---------- update ----------
function update(dt){
  shake*=Math.pow(0.86,dt/16.7); if(shake<0.3)shake=0;
  flash*=Math.pow(0.9,dt/16.7);
  for(const p of parts){p.vx*=0.96;p.vy=p.vy*0.96+0.28;p.x+=p.vx*dt/16.7;p.y+=p.vy*dt/16.7;p.life-=dt/16.7*0.026;}
  parts=parts.filter(p=>p.life>0);
  for(const p of pops){p.y-=dt/16.7*0.5;p.life-=dt/16.7*0.02;}
  pops=pops.filter(p=>p.life>0);

  if(state!=='play'){ if(state==='over')resultT+=dt/1000; return; }
  if(phase==='pitch'){ t+=dt;
    ballU=clamp(t/(jamT+jamW()*0.6),0,1);
    if(!decided && t>jamT+jamW()){ decided=true; relAt=t; finishX=BATX+6; resolve('hbp'); }
    return; }
  if(phase==='result'){ resultT+=dt/1000; if(result!=='fat'&&result!=='hbp')batU=Math.min(1,batU+dt/240); else batU=Math.min(1,batU+dt/200);
    if(resultT>1.5) newPlay(); return; }
}

// ---------- render ----------
function drawField(){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#123f22');g.addColorStop(0.5,'#0f5e34');g.addColorStop(1,'#0b3f24');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='rgba(122,84,51,0.5)';ctx.beginPath();ctx.ellipse(PIT.x,PIT.y+30,66,24,0,0,6.28);ctx.fill();
  // plate
  ctx.fillStyle='#eee';ctx.beginPath();ctx.moveTo(ZX-16,PLATE.y-4);ctx.lineTo(ZX+16,PLATE.y-4);ctx.lineTo(ZX+16,PLATE.y+3);ctx.lineTo(ZX,PLATE.y+11);ctx.lineTo(ZX-16,PLATE.y+3);ctx.closePath();ctx.fill();
}
function person(x,y,col,s){s=s||1;ctx.fillStyle=col;ctx.beginPath();ctx.ellipse(x,y-16*s,11*s,18*s,0,0,6.28);ctx.fill();
  ctx.fillStyle='#f0c9a0';ctx.beginPath();ctx.arc(x,y-38*s,8.5*s,0,6.28);ctx.fill();}

function render(){
  ctx.save();
  if(shake>0)ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
  drawField();

  // strike zone; inside-corner jam band highlighted (right edge = inside for this batter)
  ctx.strokeStyle='rgba(255,255,255,0.55)';ctx.lineWidth=2;ctx.strokeRect(ZL,ZTOP,ZW,ZBOT-ZTOP);
  // fat middle
  ctx.fillStyle='rgba(255,90,80,0.08)';ctx.fillRect(ZL,ZTOP,ZW-26,ZBOT-ZTOP);
  // inside-corner jam band
  ctx.fillStyle='rgba(120,255,150,0.16)';ctx.fillRect(ZR-26,ZTOP,26,ZBOT-ZTOP);
  ctx.strokeStyle='rgba(120,255,150,0.6)';ctx.lineWidth=2;ctx.strokeRect(ZR-26,ZTOP,26,ZBOT-ZTOP);
  ctx.fillStyle='rgba(150,255,170,0.85)';ctx.font='12px sans-serif';ctx.textAlign='center';ctx.fillText('内角',ZR-13,ZTOP-8);
  ctx.fillStyle='rgba(255,150,140,0.65)';ctx.fillText('甘い',ZX-16,ZTOP-8);

  if(state==='play'||state==='over'){
    person(PIT.x,PIT.y,'#c23b34',1);
    // batter (crowding the inside)
    const bx=BATX + (crowd?-10:0);
    ctx.save();ctx.translate(bx,PLATE.y-6);
    person(0,0,'#2b6fd6',1);
    let ba=-2.3; if(phase==='result'&&result==='fat') ba=-2.3+easeOut(batU)*2.6;
    ctx.strokeStyle='#cebb88';ctx.lineWidth=6;ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(-4,-30);ctx.lineTo(-4+Math.cos(ba)*44,-30+Math.sin(ba)*44);ctx.stroke();ctx.lineCap='butt';
    ctx.restore();
    if(crowd&&phase==='pitch'){ctx.fillStyle='rgba(255,210,90,0.9)';ctx.font='bold 12px sans-serif';ctx.textAlign='center';ctx.fillText('踏み込む打者（死球注意・高得点）',W/2,H-46);}

    // ball: from pitcher, tailing inside (toward the batter) with time
    let ballx,bally;
    const u=easeOut(ballU);
    const tailTarget=(phase==='pitch')?ZR+2:finishX;
    ballx=lerp(PIT.x+14, tailTarget, u);
    bally=lerp(PIT.y-8, (ZTOP+ZBOT)/2, u);
    if(!(phase==='result'&&result==='fat'&&batU>0.6)){
      ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(ballx,bally,8,0,6.28);ctx.fill();
      ctx.strokeStyle='#c33';ctx.lineWidth=1.2;ctx.beginPath();ctx.arc(ballx-2,bally-2,5,0.6,2.6);ctx.stroke();
      ctx.strokeStyle='rgba(255,255,255,0.3)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(ballx-14,bally-6);ctx.lineTo(ballx,bally);ctx.stroke();
    }
    if(phase==='result'&&result==='fat'&&batU>0.6){ const cx=lerp(ZX,ZX-260,batU),cy=lerp((ZTOP+ZBOT)/2,(ZTOP+ZBOT)/2-120,batU);
      ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(cx,cy,8,0,6.28);ctx.fill(); }

    // release timing bar
    ctx.textAlign='center';
    if(state==='play'&&phase==='pitch'){
      ctx.fillStyle='rgba(255,220,90,0.95)';ctx.font='bold 20px sans-serif';
      ctx.fillText(t<jamT?'内角を突け！ 差し込んで詰まらせろ':'今だ！ 内角ギリギリへ',W/2,54);
      const jw=jamW(),tot=jamT+jw+120,bw=300,x=W/2-bw/2,y=66;
      ctx.fillStyle='rgba(255,255,255,0.16)';ctx.fillRect(x,y,bw,9);
      ctx.fillStyle='rgba(120,255,150,0.55)';ctx.fillRect(x+bw*(jamT/tot),y,bw*(jw/tot),9);
      ctx.fillStyle='rgba(255,90,80,0.5)';ctx.fillRect(x+bw*((jamT+jw)/tot),y,bw*(1-(jamT+jw)/tot),9); // HBP zone
      const p=clamp(t/tot,0,1);ctx.fillStyle='#fff';ctx.fillRect(x+bw*p-2,y-3,4,15);
    }
    if(state==='play'){ ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='12px sans-serif';ctx.textAlign='center';
      ctx.fillText('タップ / SPACE / ↑：内角ギリギリで差し込む（早いと真ん中で痛打・遅いと死球）',W/2,H-26); }
  }

  for(const p of parts){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,3.2,0,6.28);ctx.fill();}
  ctx.globalAlpha=1;
  for(const p of pops){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.font='bold 21px sans-serif';ctx.textAlign='center';ctx.fillText(p.txt,p.x,p.y);}
  ctx.globalAlpha=1;

  // HUD
  ctx.textAlign='left';ctx.fillStyle='#fff';ctx.font='bold 26px sans-serif';ctx.fillText('SCORE '+score,20,36);
  ctx.textAlign='right';ctx.fillStyle='rgba(255,255,255,0.9)';ctx.font='14px sans-serif';ctx.fillText('凡退 '+outs+'  Lv'+lvl,W-20,24);
  ctx.fillText('失',W-92,46);
  for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(W-60+i*20,41,7,0,6.28);ctx.fillStyle=i<fails?'#ff5b5b':'rgba(255,255,255,0.25)';ctx.fill();}
  if(combo>=2){ctx.textAlign='center';ctx.fillStyle='#ffd24d';ctx.font='bold 18px sans-serif';ctx.fillText('コンボ x'+combo,W/2,120);}

  if(state==='play'&&phase==='result'&&msg){ctx.textAlign='center';ctx.fillStyle=msgOk?'#9ff0b8':'#ff9a9a';ctx.font='bold 16px sans-serif';ctx.fillText(msg,W/2,470);}

  if(state==='title'){
    ctx.fillStyle='rgba(4,10,7,0.82)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='bold 42px sans-serif';ctx.fillText('内角攻め',W/2,92);
    ctx.fillStyle='#ffd23e';ctx.font='bold 22px sans-serif';ctx.fillText('Jam Him Inside',W/2,128);
    ctx.fillStyle='rgba(255,255,255,0.92)';ctx.font='16px sans-serif';
    ctx.fillText('投手として、内角ギリギリへ差し込むストレートで打者のバットを詰まらせ、凡打に打ち取れ',W/2,184);
    ctx.fillStyle='rgba(255,255,255,0.66)';ctx.font='14px sans-serif';
    ctx.fillText('球は内へ食い込む。リリースのタイミングが緑の“内角”に来た瞬間にタップ／SPACE＝詰まらせて凡退',W/2,222);
    ctx.fillText('早いと真ん中（甘い）に入って痛打され、突っ込みすぎると打者に当てて死球（どちらも失敗）',W/2,246);
    ctx.fillText('踏み込んでくる打者ほど懐が狭く死球のリスクも高いが、差し込めば大量加点',W/2,270);
    ctx.fillText('上級ほど球が速く内角も狭い。3失敗で交代',W/2,294);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で開始',W/2,362);
    ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='14px sans-serif';ctx.fillText('BEST '+best,W/2,394);
  }
  if(state==='over'){
    ctx.fillStyle='rgba(4,10,7,0.84)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#ff6b6b';ctx.font='bold 46px sans-serif';ctx.fillText('3失敗…交代',W/2,224);
    ctx.fillStyle='#fff';ctx.font='bold 40px sans-serif';ctx.fillText('SCORE '+score,W/2,292);
    ctx.fillStyle='rgba(255,255,255,0.85)';ctx.font='19px sans-serif';ctx.fillText('凡退 '+outs+'   BEST '+best,W/2,332);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で もう一度',W/2,404);
  }

  if(flash>0.02){ctx.globalAlpha=flash*0.5;ctx.fillStyle=flashCol;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}
  ctx.restore();

  ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,0.4)';ctx.font='12px sans-serif';
  ctx.fillText('内角攻め：内角ギリギリへ差し込んで詰まらせる＝凡退。早いと真ん中で痛打、突っ込みすぎると死球、3失敗で交代',W/2,H-8);
}

function frame(ts){let dt=ts-last;last=ts;if(dt>60)dt=60;if(dt<0)dt=0;update(dt);render();requestAnimationFrame(frame);}
requestAnimationFrame(frame);

// ---------- test hook ----------
window.__ji={
  start, act:()=>act(),
  get state(){return state;},
  get score(){return score;},
  get outs(){return outs;},
  get fails(){return fails;},
  get info(){return {state,phase,t,jamT,w:jamW(),crowd,tough,decided,result,outs,fails,lvl,
    pre:(t<jamT),jamWin:(phase==='pitch'&&t>=jamT&&t<=jamT+jamW()),canAct:(phase==='pitch'&&!decided)};}
};
})();
</script>
</body>
</html>
