<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ストラックアウト9 — Strike Out 9</title>
<style>
  :root{--sky:#3a7bd5;--grass:#2fa055;--dirt:#c8823c;--chalk:#f4f7f2;--ink:#0c2138;
    --gold:#ffcf3a;--hot:#ff5a3c;--cyan:#3ae8cf;--panel:#e9e2cf;--panel2:#d3c9ac;}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:#04121f;font-family:"Arial Narrow","Roboto Condensed",system-ui,sans-serif;color:var(--chalk);
    display:flex;align-items:center;justify-content:center;overflow:hidden;-webkit-user-select:none;user-select:none;touch-action:manipulation;}
  #stage{position:relative;width:min(100vw,calc(100vh*1.5));aspect-ratio:3/2;max-height:100vh;
    box-shadow:0 30px 80px rgba(0,0,0,.6);overflow:hidden;background:#2fa055;}
  canvas{display:block;width:100%;height:100%}
  #hud{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;padding:clamp(6px,1.4vw,14px);gap:8px;pointer-events:none;}
  .board{background:rgba(12,33,56,.78);backdrop-filter:blur(6px);border:1px solid rgba(255,207,58,.4);
    border-radius:10px;padding:6px clamp(10px,1.6vw,18px);display:flex;flex-direction:column;line-height:1;}
  .board .label{font-size:clamp(9px,1.3vw,12px);letter-spacing:.2em;text-transform:uppercase;color:var(--gold);opacity:.9}
  .board .value{font-family:"Courier New",monospace;font-weight:700;font-size:clamp(20px,4.2vw,36px);font-variant-numeric:tabular-nums;color:var(--chalk);}
  #msg{position:absolute;top:20%;left:0;right:0;text-align:center;pointer-events:none;font-weight:900;letter-spacing:.03em;
    text-transform:uppercase;font-size:clamp(28px,7vw,64px);color:#fff;opacity:0;transition:opacity .16s;
    text-shadow:0 4px 0 rgba(0,0,0,.35),0 0 30px currentColor;}
  #hint{position:absolute;bottom:0;left:0;right:0;text-align:center;padding:8px 12px calc(9px + env(safe-area-inset-bottom));
    font-size:clamp(12px,2.2vw,17px);letter-spacing:.04em;color:var(--chalk);background:linear-gradient(transparent,rgba(12,33,56,.72));pointer-events:none;}
  #hint b{color:var(--cyan)}
  #overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(10px,2vw,20px);
    text-align:center;padding:20px;background:radial-gradient(120% 90% at 50% 22%,rgba(58,123,213,.35),rgba(4,18,31,.92));backdrop-filter:blur(3px);z-index:5;transition:opacity .4s;}
  #overlay.hidden{opacity:0;pointer-events:none}
  #overlay h1{font-size:clamp(32px,9vw,80px);font-weight:900;letter-spacing:.02em;line-height:.9;text-transform:uppercase;color:var(--chalk);
    text-shadow:0 6px 0 rgba(0,0,0,.3),0 0 40px rgba(255,207,58,.4);}
  #overlay h1 span{display:block;color:var(--gold);font-size:.5em;letter-spacing:.22em}
  #overlay p{max-width:34ch;font-size:clamp(14px,2.6vw,19px);line-height:1.45;opacity:.92}
  #playBtn{pointer-events:auto;cursor:pointer;border:none;border-radius:100px;padding:clamp(12px,2vw,18px) clamp(30px,6vw,56px);
    font-family:inherit;font-weight:900;font-size:clamp(18px,3.4vw,26px);letter-spacing:.12em;text-transform:uppercase;color:var(--ink);
    background:linear-gradient(180deg,var(--gold),#e0a81f);box-shadow:0 8px 0 #a8790f,0 14px 30px rgba(0,0,0,.5);transition:transform .08s,box-shadow .08s;}
  #playBtn:active{transform:translateY(5px);box-shadow:0 3px 0 #a8790f}
  #playBtn:focus-visible{outline:3px solid var(--hot);outline-offset:4px}
  .sub{font-size:clamp(11px,2vw,14px);letter-spacing:.2em;text-transform:uppercase;color:var(--gold);opacity:.85}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div id="stage">
  <canvas id="c"></canvas>
  <div id="hud">
    <div class="board"><span class="label">Score</span><span class="value" id="score">0</span></div>
    <div class="board" style="text-align:center"><span class="label">残りパネル</span><span class="value" id="left">9</span></div>
    <div class="board" style="text-align:right"><span class="label">Pitches</span><span class="value" id="pitch">15</span></div>
  </div>
  <div id="msg"></div>
  <div id="hint">タップ / <b>SPACE</b> で 横 → 縦 の照準を止めて投球</div>
  <div id="overlay">
    <div class="sub">Baseball · Precision</div>
    <h1>ストラック<span>Out 9</span></h1>
    <p>スイープする照準を<b style="color:var(--cyan)">横→縦</b>の2段階で止めて狙い撃ち。9枚のパネルを全部撃ち抜け。持ち球は15球！</p>
    <button id="playBtn">Play Ball</button>
    <div class="sub" style="opacity:.55">Tap / Space</div>
  </div>
</div>

<script>
(()=>{
"use strict";
const cvs=document.getElementById('c'),ctx=cvs.getContext('2d');
const W=900,H=600;let dpr=Math.min(window.devicePixelRatio||1,2);
function resize(){const r=cvs.getBoundingClientRect();cvs.width=Math.round(r.width*dpr);cvs.height=Math.round(r.height*dpr);
  ctx.setTransform(cvs.width/W,0,0,cvs.height/H,0,0);}
new ResizeObserver(resize).observe(cvs);resize();

let AC=null;function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function tone(f,d,t='sine',v=.22,to=null){const a=ac();if(!a)return;const o=a.createOscillator(),g=a.createGain();
  o.type=t;o.frequency.setValueAtTime(f,a.currentTime);if(to)o.frequency.exponentialRampToValueAtTime(to,a.currentTime+d);
  g.gain.setValueAtTime(v,a.currentTime);g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+d);
  o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+d);}
function noise(d,v){const a=ac();if(!a)return;const n=a.createBuffer(1,a.sampleRate*d,a.sampleRate);const dd=n.getChannelData(0);
  for(let i=0;i<dd.length;i++)dd[i]=(Math.random()*2-1)*(1-i/dd.length);const s=a.createBufferSource();s.buffer=n;const g=a.createGain();
  g.gain.value=v;s.connect(g);g.connect(a.destination);s.start();}
const sTick=()=>tone(660,.03,'square',.12);
const sThrow=()=>tone(420,.08,'sine',.14,240);
const sBreak=()=>{noise(.12,.3);tone(900,.1,'square',.2,300);};
const sMiss=()=>tone(150,.22,'sawtooth',.2,80);
const sWin=()=>{tone(523,.1,'square',.24);setTimeout(()=>tone(659,.1,'square',.24),100);setTimeout(()=>tone(1047,.24,'square',.26),200);};

// board geometry
const B={x:330,y:120,w:300,h:300};const cellW=B.w/3, cellH=B.h/3;
const layout=[7,1,9,4,5,6,8,2,3]; // numbering
let panels=[]; // {alive,num,shatter}
const S={IDLE:'idle',AIMX:'aimx',AIMY:'aimy',THROW:'throw',RESULT:'result',OVER:'over'};
let state=S.IDLE;
let score=0, pitches=15, combo=0;
let aimX=B.x, aimDirX=1, aimY=B.y, aimDirY=1, lockX=0;
let ball=null, particles=[], shake=0, flash=0, tPrev=0;
const mound={x:760,y:470};

function reset(){panels=layout.map(n=>({alive:true,num:n,shatter:0}));
  score=0;pitches=15;combo=0;particles=[];ball=null;updateHUD();}
function start(){reset();document.getElementById('overlay').classList.add('hidden');beginAim();}
function beginAim(){
  if(pitches<=0||panelsLeft()===0){return endGame();}
  aimX=B.x;aimDirX=1;aimY=B.y;aimDirY=1;state=S.AIMX;
  setHint('<b>横</b>の位置をタップで決める');
}
function panelsLeft(){return panels.filter(p=>p.alive).length;}
function act(){const a=ac();if(a&&a.state==='suspended')a.resume();
  if(state===S.IDLE||state===S.OVER){start();return;}
  if(state===S.AIMX){lockX=aimX;state=S.AIMY;sTick();setHint('<b>縦</b>の位置をタップで投球！');}
  else if(state===S.AIMY){throwBall();}
}
window.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();act();}});
cvs.addEventListener('pointerdown',e=>{e.preventDefault();act();});
document.getElementById('playBtn').addEventListener('click',e=>{e.stopPropagation();ac()&&ac().resume&&ac().resume();start();});

function throwBall(){
  state=S.THROW;pitches--;updateHUD();sThrow();
  ball={sx:mound.x,sy:mound.y,tx:lockX,ty:aimY,t:0,dur:0.42};
}
function resolve(){
  const col=Math.floor((ball.tx-B.x)/cellW), row=Math.floor((ball.ty-B.y)/cellH);
  let hit=false;
  if(col>=0&&col<3&&row>=0&&row<3){
    const idx=row*3+col, pn=panels[idx];
    if(pn.alive){pn.alive=false;pn.shatter=1;hit=true;
      combo++;const gain=100+ (combo-1)*40;score+=gain;
      sBreak();shake=8;
      shatter(B.x+col*cellW+cellW/2, B.y+row*cellH+cellH/2);
      showMsg(combo>1?('COMBO ×'+combo+'!'):'STRIKE!', '#ffcf3a');
    }
  }
  if(!hit){combo=0;sMiss();shake=4;showMsg('BALL…','#8fb0c8');}
  updateHUD();
  if(panelsLeft()===0){setTimeout(endGame,700);state=S.RESULT;return;}
  state=S.RESULT;
  setTimeout(beginAim,650);
}
function endGame(){
  state=S.OVER;const cleared=9-panelsLeft();
  if(panelsLeft()===0){score+=pitches*150;flash=1;sWin();bigShatter();}
  const ov=document.getElementById('overlay');
  const perfect=panelsLeft()===0;
  const rating=perfect?'PERFECT!':cleared>=7?'NICE PITCHING':cleared>=4?'NOT BAD':'KEEP PRACTICING';
  ov.querySelector('.sub').textContent=perfect?'Strike Out!':'Game over';
  ov.querySelector('h1').innerHTML=(perfect?'STRIKE OUT':cleared+' / 9')+'<span>'+rating+'</span>';
  ov.querySelector('p').innerHTML='スコア <b style="color:var(--gold)">'+score+'</b>'+(perfect?'（残り球ボーナス込み！）':'')+'<br>9枚コンプリートを目指せ！';
  ov.querySelector('#playBtn').textContent='Play Again';
  ov.classList.remove('hidden');
}

function shatter(x,y){for(let i=0;i<20;i++){const a=Math.random()*7,s=2+Math.random()*6;
  particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-2,life:1,col:['#e9e2cf','#d3c9ac','#fff','#ffcf3a'][i%4],r:2+Math.random()*5,rot:Math.random()*7,vr:(Math.random()-.5)*.4,sq:true});}}
function bigShatter(){for(let i=0;i<80;i++){particles.push({x:B.x+Math.random()*B.w,y:B.y+Math.random()*B.h,
  vx:(Math.random()-.5)*8,vy:(Math.random()-.5)*8-3,life:1.2,col:['#ffcf3a','#3ae8cf','#fff','#ff5a3c'][i%4],r:3+Math.random()*5,rot:Math.random()*7,vr:(Math.random()-.5)*.5,sq:true});}}

function updateHUD(){document.getElementById('score').textContent=score;
  document.getElementById('left').textContent=panelsLeft();
  document.getElementById('pitch').textContent=pitches;}
let msgT=null;function showMsg(t,c){const m=document.getElementById('msg');m.textContent=t;m.style.color=c;m.style.opacity='1';
  clearTimeout(msgT);msgT=setTimeout(()=>m.style.opacity='0',900);}
function setHint(h){document.getElementById('hint').innerHTML=h;}

function update(dt){
  if(state===S.AIMX){aimX+=aimDirX*380*dt;if(aimX>B.x+B.w){aimX=B.x+B.w;aimDirX=-1;}if(aimX<B.x){aimX=B.x;aimDirX=1;}}
  else if(state===S.AIMY){aimY+=aimDirY*360*dt;if(aimY>B.y+B.h){aimY=B.y+B.h;aimDirY=-1;}if(aimY<B.y){aimY=B.y;aimDirY=1;}}
  else if(state===S.THROW){ball.t+=dt;if(ball.t>=ball.dur){resolve();}}
  panels.forEach(p=>{if(p.shatter>0)p.shatter=Math.max(0,p.shatter-dt*2);});
  for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.x+=p.vx;p.y+=p.vy;p.vy+=.3;p.vx*=.99;if(p.rot!=null)p.rot+=p.vr;p.life-=dt*1.0;if(p.life<=0)particles.splice(i,1);}
  if(shake>0)shake=Math.max(0,shake-dt*30);
  if(flash>0)flash=Math.max(0,flash-dt*1.5);
}
function roundRect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function drawScene(){
  const sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#3a7bd5');sky.addColorStop(.5,'#8fd0f2');sky.addColorStop(.5,'#2fa055');sky.addColorStop(1,'#1c7a40');
  ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
  // stands
  ctx.fillStyle='#2c4a63';ctx.fillRect(0,120,W,60);ctx.save();ctx.globalAlpha=.4;
  for(let i=0;i<200;i++){const x=i*29%W,y=125+(i*17%50);ctx.fillStyle=['#dfe7ee','#b7c4d0','#e6c07e'][i%3];ctx.fillRect(x,y,4,4);}ctx.restore();
  // mound + pitcher
  ctx.fillStyle='#b5732b';ctx.beginPath();ctx.ellipse(mound.x,mound.y+34,80,24,0,0,7);ctx.fill();
  ctx.save();ctx.translate(mound.x,mound.y);
  ctx.fillStyle='#1b3a8f';roundRect(-13,-46,26,40,7);ctx.fill();
  ctx.fillStyle='#e8b88a';ctx.beginPath();ctx.arc(0,-56,10,0,7);ctx.fill();
  ctx.fillStyle='#0c2138';ctx.fillRect(-11,-8,22,10);
  ctx.strokeStyle='#1b3a8f';ctx.lineWidth=7;ctx.lineCap='round';
  const armA=(state===S.THROW)?(-2.4+ball.t*3):-0.7;
  ctx.beginPath();ctx.moveTo(0,-38);ctx.lineTo(Math.cos(armA)*22,-38+Math.sin(armA)*22);ctx.stroke();
  ctx.restore();
}
function drawBoard(){
  // frame
  ctx.save();ctx.fillStyle='#5a3d22';roundRect(B.x-16,B.y-16,B.w+32,B.h+32,10);ctx.fill();
  ctx.strokeStyle='#3a2713';ctx.lineWidth=4;roundRect(B.x-16,B.y-16,B.w+32,B.h+32,10);ctx.stroke();
  // support poles
  ctx.fillStyle='#4a3319';ctx.fillRect(B.x-8,B.y+B.h+16,12,120);ctx.fillRect(B.x+B.w-4,B.y+B.h+16,12,120);
  ctx.restore();
  for(let i=0;i<9;i++){
    const col=i%3,row=Math.floor(i/3),px=B.x+col*cellW,py=B.y+row*cellH,p=panels[i];
    if(p.alive){
      const g=ctx.createLinearGradient(px,py,px,py+cellH);g.addColorStop(0,'#efe8d4');g.addColorStop(1,'#d3c9ac');
      ctx.fillStyle=g;roundRect(px+4,py+4,cellW-8,cellH-8,8);ctx.fill();
      ctx.strokeStyle='#b3a887';ctx.lineWidth=3;roundRect(px+4,py+4,cellW-8,cellH-8,8);ctx.stroke();
      // number
      ctx.fillStyle='#c62d2d';ctx.font='900 '+(cellH*0.5)+'px "Arial Black",system-ui';ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText(p.num,px+cellW/2,py+cellH/2+2);
    } else {
      // empty slot (dark)
      ctx.fillStyle='rgba(10,20,14,.5)';roundRect(px+4,py+4,cellW-8,cellH-8,8);ctx.fill();
      ctx.strokeStyle='rgba(255,255,255,.08)';ctx.lineWidth=2;roundRect(px+4,py+4,cellW-8,cellH-8,8);ctx.stroke();
    }
  }
}
function drawAim(){
  if(state===S.AIMX||state===S.AIMY){
    ctx.save();
    // locked X column
    const lx=(state===S.AIMY)?lockX:aimX;
    if(state===S.AIMY){ctx.strokeStyle='rgba(255,90,60,.55)';ctx.lineWidth=3;ctx.setLineDash([6,6]);
      ctx.beginPath();ctx.moveTo(lx,B.y-16);ctx.lineTo(lx,B.y+B.h+16);ctx.stroke();ctx.setLineDash([]);}
    // sweeping line
    ctx.strokeStyle='#3ae8cf';ctx.lineWidth=3;
    if(state===S.AIMX){ctx.beginPath();ctx.moveTo(aimX,B.y-16);ctx.lineTo(aimX,B.y+B.h+16);ctx.stroke();}
    else{ctx.beginPath();ctx.moveTo(B.x-16,aimY);ctx.lineTo(B.x+B.w+16,aimY);ctx.stroke();
      // crosshair dot
      ctx.fillStyle='rgba(58,232,207,.95)';ctx.beginPath();ctx.arc(lockX,aimY,8,0,7);ctx.fill();
      ctx.strokeStyle='#04121f';ctx.lineWidth=2;ctx.stroke();}
    ctx.restore();
  }
}
function drawBall(){
  if(state!==S.THROW||!ball)return;
  const k=ball.t/ball.dur;
  const x=ball.sx+(ball.tx-ball.sx)*k, y=ball.sy+(ball.ty-ball.sy)*k - Math.sin(k*Math.PI)*40;
  const r=13-6*k;
  ctx.save();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();
  ctx.strokeStyle='#c62d2d';ctx.lineWidth=1.4;ctx.beginPath();ctx.arc(x-r*.3,y,r*.8,-.6,.6);ctx.stroke();ctx.restore();
}
function render(){
  ctx.clearRect(0,0,W,H);ctx.save();
  if(shake>0)ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
  drawScene();drawBoard();drawAim();drawBall();
  for(const p of particles){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.col;
    if(p.sq){ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot||0);ctx.fillRect(-p.r,-p.r,p.r*2,p.r*2);ctx.restore();}
    else{ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill();}}
  ctx.globalAlpha=1;ctx.restore();
  if(flash>0){ctx.fillStyle='rgba(255,207,58,'+(flash*0.3)+')';ctx.fillRect(0,0,W,H);}
}
function loop(t){if(!tPrev)tPrev=t;let dt=(t-tPrev)/1000;tPrev=t;if(dt>.05)dt=.05;update(dt);render();requestAnimationFrame(loop);}
reset();requestAnimationFrame(loop);state=S.IDLE;
})();
</script>
