<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ベアハンド (Bare-Hand Play)</title>
<style>
  html,body{margin:0;height:100%;background:#0a0f0a;overflow:hidden;
    font-family:-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  #stage{position:relative;width:100vw;height:100vh;max-width:calc(100vh*1.5);max-height:calc(100vw/1.5);aspect-ratio:900/600;}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;border-radius:6px;}
</style>
</head>
<body>
<div id="wrap"><div id="stage"><canvas id="cv"></canvas></div></div>
<script>
(function(){
const W=900,H=600,cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let DPR=1;
function fit(){DPR=Math.min(2,window.devicePixelRatio||1);cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
fit();addEventListener('resize',fit);

// ---------- audio ----------
let AC=null;function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function tone(f,d,type,v,sweep){const a=ac();if(!a)return;const t=a.currentTime,o=a.createOscillator(),g=a.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(sweep)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+sweep),t+d);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v||0.2,t+0.008);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+0.02);}
function noise(d,v,hp){const a=ac();if(!a)return;const t=a.currentTime,n=Math.floor(a.sampleRate*d),buf=a.createBuffer(1,n,a.sampleRate),ch=buf.getChannelData(0);
  for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource();s.buffer=buf;
  const f=a.createBiquadFilter();f.type='highpass';f.frequency.value=hp||600;const g=a.createGain();g.gain.value=v||0.2;
  s.connect(f);f.connect(g);g.connect(a.destination);s.start(t);s.stop(t+d+0.02);}
const S={
  grab:()=>{noise(0.03,0.1,800);tone(360,0.05,'sine',0.08);},
  fire:()=>{noise(0.05,0.14,600);tone(420,0.06,'square',0.1,260);},
  out:()=>{noise(0.05,0.12,600);[720,980,1240].forEach((f,i)=>setTimeout(()=>tone(f,0.11,'triangle',0.17),i*66));},
  bad:()=>{noise(0.16,0.22,320);tone(170,0.18,'sawtooth',0.12,-50);},
  streak:()=>{[700,930,1170,1400].forEach((f,i)=>setTimeout(()=>tone(f,0.1,'triangle',0.16),i*60));},
  over:()=>{[440,330,247,175].forEach((f,i)=>setTimeout(()=>tone(f,0.3,'triangle',0.2),i*160));}
};

// ---------- geometry ----------
const HOME={x:250,y:180}, FIELD={x:392,y:318}, FIRST={x:684,y:436};

// ---------- state ----------
let state='title', phase='roll', t=0, plays=0;
let score=0, combo=0, best=+(localStorage.getItem('barehand_best')||0);
let outs=0, fails=0, lvl=1;   // outs = runners thrown out
let clock=0, grabT=760, cw=150, transferGap=120, vw=170, throwFlight=250, runnerT=1900;
let grabbed=false, grabClock=0, fired=false, fireClock=0, throwArrive=0;
let result=null, resultT=0, msg='', bang=false, throwU=0, runU=0;
let shake=0, flash=0, flashCol='#fff', last=performance.now();
let parts=[], pops=[];

function rnd(a,b){return a+Math.random()*(b-a);}
function chance(p){return Math.random()<p;}
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function lerp(a,b,u){return a+(b-a)*u;}
function easeOut(u){return 1-Math.pow(1-u,2);}

function params(){ return {
  roll:Math.max(560,860-lvl*44),
  cw:Math.max(104,158-lvl*8),
  vw:Math.max(152,208-lvl*8),
  run:Math.max(1560,2020-lvl*66)    // runner time to first (faster at higher lvl)
};}

function reset(){state='title';score=0;combo=0;outs=0;fails=0;lvl=1;plays=0;result=null;parts=[];pops=[];}
function newPlay(){
  plays++; lvl=Math.min(7,1+Math.floor(outs/4));
  const p=params();
  grabT=p.roll; cw=p.cw; vw=p.vw; transferGap=120; throwFlight=250;
  runnerT=p.run + rnd(-70,70);
  clock=0; grabbed=false; grabClock=0; fired=false; fireClock=0; throwArrive=0;
  result=null; phase='roll'; msg=''; resultT=0; bang=false; throwU=0; runU=0;
}
function start(){ if(!ac())ac(); if(AC&&AC.state==='suspended')AC.resume(); reset(); state='play'; newPlay(); }

function act(){
  if(state==='title'){start();return;}
  if(state==='over'){ if(resultT>0.4){reset();start();} return; }
  if(state!=='play') return;
  if(phase==='roll'){
    if(grabbed) return;
    if(Math.abs(clock-grabT)<=cw){ grabbed=true; grabClock=clock; phase='throw'; S.grab();
      burst(FIELD.x,FIELD.y,'#bfe3ff',7,3); }
    else { resolve(clock<grabT?'early':'through'); }
    return;
  }
  if(phase==='throw'){
    if(fired) return;
    const rel=clock-grabClock;
    if(rel<transferGap){ resolve('fumble'); return; }   // rushed the transfer
    if(rel<=transferGap+vw){ fired=true; fireClock=clock; S.fire();
      throwArrive=fireClock+throwFlight;
      bang=(runnerT-throwArrive)<=170;
      resolve(throwArrive<=runnerT?'out':'late'); }
    else { resolve('held'); }
    return;
  }
}

function resolve(kind){
  phase='result'; result=kind; resultT=0;
  const good=(kind==='out');
  if(good){
    outs++; combo++;
    let add=Math.round((bang?170:110)*(1+Math.min(9,combo-1)*0.15)); score+=add;
    S.out(); flash=1;flashCol=bang?'#8affa0':'#ffe08a';shake=bang?8:5;
    burst(FIRST.x,FIRST.y,bang?'#8affa0':'#ffe08a',bang?20:12,6);
    pop(FIRST.x,FIRST.y-30,'アウト！ +'+add,'#fff3c4');
    if(bang)pop(450,150,'際どい！ バンバンプレー！','#8affa0');
    if(combo>=2)pop(450,190,'コンボ x'+combo,'#ffd24d');
    if(combo>0&&combo%5===0)S.streak();
    msg=bang?'間一髪の素手さばき！ 俊足を刺した！':'素手でつかんで一塁アウト！';
  } else {
    fails++; combo=0; flash=1;flashCol='#ff5b5b';shake=8; S.bad();
    if(kind==='early') msg='早すぎ！ ボールが来る前に掴みにいって空振り';
    else if(kind==='through') msg='掴み損ね…ボールが股を抜けた';
    else if(kind==='fumble') msg='慌てた！ 握り替えをしくじって落球';
    else if(kind==='held') msg='送球が遅い…持ち過ぎてセーフ';
    else msg='送球が間に合わず…俊足に負けた';
    pop(kind==='held'||kind==='late'?FIRST.x:FIELD.x, (kind==='held'||kind==='late'?FIRST.y:FIELD.y)-26,'セーフ','#ffb0b0');
  }
  if(fails>=3){ state='over'; resultT=0; S.over(); if(score>best){best=score;localStorage.setItem('barehand_best',best);} }
}

// ---------- input ----------
cv.addEventListener('pointerdown',e=>{e.preventDefault();act();});
addEventListener('keydown',e=>{ if(e.repeat)return; if(e.code==='Space'||e.code==='Enter'||e.code==='ArrowUp'||e.code==='KeyZ'){e.preventDefault();act();} });

// ---------- particles ----------
function burst(x,y,c,n,sp){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=rnd(sp*0.3,sp);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:1,c});}}
function pop(x,y,txt,c){pops.push({x,y,txt,c,life:1});}

// ---------- update ----------
function update(dt){
  shake*=Math.pow(0.86,dt/16.7); if(shake<0.3)shake=0;
  flash*=Math.pow(0.9,dt/16.7);
  for(const p of parts){p.vx*=0.96;p.vy=p.vy*0.96+0.28;p.x+=p.vx*dt/16.7;p.y+=p.vy*dt/16.7;p.life-=dt/16.7*0.026;}
  parts=parts.filter(p=>p.life>0);
  for(const p of pops){p.y-=dt/16.7*0.5;p.life-=dt/16.7*0.02;}
  pops=pops.filter(p=>p.life>0);

  if(state!=='play'){ if(state==='over')resultT+=dt/1000; return; }
  t+=dt;
  if(phase==='roll'||phase==='throw'){
    clock+=dt;
    if(phase==='roll' && !grabbed && clock>grabT+cw){ resolve('through'); return; }
    if(phase==='throw' && !fired && (clock-grabClock)>transferGap+vw){ resolve('held'); return; }
    return;
  }
  if(phase==='result'){
    resultT+=dt/1000;
    throwU=Math.min(1,throwU+dt/ (throwFlight));
    runU=Math.min(1,runU+dt/300);
    if(resultT>1.2 && state==='play') newPlay();
    return;
  }
}

// ---------- render ----------
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function drawScene(){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#1f5f2a');g.addColorStop(1,'#123a1b');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#7a5230';ctx.beginPath();ctx.moveTo(HOME.x,HOME.y);ctx.lineTo(FIRST.x+30,FIRST.y);ctx.lineTo(FIRST.x-20,FIRST.y+60);ctx.lineTo(HOME.x-30,HOME.y+60);ctx.closePath();ctx.fill();
  // baseline home->first
  ctx.strokeStyle='rgba(240,220,180,0.5)';ctx.lineWidth=14;
  ctx.beginPath();ctx.moveTo(HOME.x,HOME.y);ctx.lineTo(FIRST.x,FIRST.y);ctx.stroke();
  // bases
  for(const bb of [[HOME,'本'],[FIRST,'一']]){ const b=bb[0];
    ctx.save();ctx.translate(b.x,b.y);ctx.rotate(Math.PI/4);ctx.fillStyle='#f2f4f6';ctx.fillRect(-11,-11,22,22);ctx.restore(); }
}
function drawFig(x,y,col,s){ s=s||1; ctx.fillStyle='rgba(0,0,0,0.22)';ctx.beginPath();ctx.ellipse(x,y+12*s,10*s,3.5*s,0,0,6.28);ctx.fill();
  ctx.fillStyle=col;rr(x-8*s,y-10*s,16*s,24*s,6);ctx.fill();
  ctx.fillStyle='#f2c9a0';ctx.beginPath();ctx.arc(x,y-14*s,6*s,0,6.28);ctx.fill(); }

function render(){
  ctx.save();
  if(shake>0)ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
  drawScene();

  if(state==='play'){
    // runner racing home -> first
    let ru;
    if(phase==='roll'||phase==='throw') ru=clamp(clock/runnerT,0,1);
    else ru=clamp((fired?fireClock:clock)/runnerT + runU*0.12,0,1);
    const rx=lerp(HOME.x,FIRST.x,ru), ry=lerp(HOME.y,FIRST.y,ru);
    drawFig(rx,ry,'#e23c3c',1.0);

    // fielder
    drawFig(FIELD.x, FIELD.y, '#2b6cff',1.1);

    // ball
    if(phase==='roll'){
      const u=clamp(clock/grabT,0,1); const bx=lerp(HOME.x+10,FIELD.x,easeOut(u)), by=lerp(HOME.y+20,FIELD.y+6,easeOut(u));
      ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(bx,by,7,0,6.28);ctx.fill();
      ctx.strokeStyle='#333';ctx.lineWidth=1.2;ctx.beginPath();ctx.arc(bx,by,7,0.6,2.4);ctx.stroke();
      // grab window ring
      if(clock>grabT-cw*1.7){ const uu=clamp((clock-(grabT-cw))/(2*cw),0,1); const inw=Math.abs(clock-grabT)<=cw;
        ctx.strokeStyle=inw?'rgba(150,210,255,0.95)':'rgba(255,255,255,0.35)';ctx.lineWidth=3;
        ctx.beginPath();ctx.arc(FIELD.x,FIELD.y+6,lerp(42,16,clamp(uu,0,1)),0,6.28);ctx.stroke(); }
      ctx.fillStyle='rgba(191,227,255,0.9)';ctx.font='bold 14px sans-serif';ctx.textAlign='center';ctx.fillText('①素手でつかめ',FIELD.x,FIELD.y-40);
    } else if(phase==='throw'){
      // ball in hand; fire window
      ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(FIELD.x+8,FIELD.y-4,7,0,6.28);ctx.fill();
      const rel=clock-grabClock;
      const ready=rel>=transferGap;
      if(rel>transferGap-40){ const uu=clamp((rel-transferGap)/vw,0,1); const inw=ready&&rel<=transferGap+vw;
        ctx.strokeStyle=inw?'rgba(150,240,170,0.95)':'rgba(255,255,255,0.35)';ctx.lineWidth=3;
        ctx.beginPath();ctx.arc(FIELD.x,FIELD.y+6,lerp(40,16,clamp(uu,0,1)),0,6.28);ctx.stroke(); }
      ctx.fillStyle= ready?'rgba(159,240,184,0.95)':'rgba(255,255,255,0.6)';ctx.font='bold 14px sans-serif';ctx.textAlign='center';
      ctx.fillText(ready?'②今だ！ 一塁へファイア！':'握り替え中…',FIELD.x,FIELD.y-40);
    } else {
      // result: throw flying to first
      if(result==='out'||result==='late'){
        const bx=lerp(FIELD.x+8,FIRST.x,easeOut(throwU)), by=lerp(FIELD.y-4,FIRST.y,easeOut(throwU));
        ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(bx,by,7,0,6.28);ctx.fill();
      } else {
        // dropped/through ball near fielder
        ctx.globalAlpha=clamp(1.2-resultT,0,1);ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(FIELD.x+ (result==='through'?40:6),FIELD.y+ (result==='through'?24:6),7,0,6.28);ctx.fill();ctx.globalAlpha=1;
      }
    }

    // race bar: runner vs (implied) throw
    const bw=250,bx0=W/2-bw/2,byy=H-46;
    ctx.fillStyle='rgba(0,0,0,0.3)';rr(bx0-3,byy-3,bw+6,16,7);ctx.fill();
    let ruBar=(phase==='result')?clamp((fired?fireClock:runnerT)/runnerT,0,1):clamp(clock/runnerT,0,1);
    ctx.fillStyle='#ff9a5b';rr(bx0,byy,bw*ruBar,10,4);ctx.fill();
    ctx.fillStyle='rgba(255,255,255,0.75)';ctx.font='11px sans-serif';ctx.textAlign='right';ctx.fillText('走者→一塁',bx0-8,byy+9);
  }

  for(const p of parts){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,3.2,0,6.28);ctx.fill();}
  ctx.globalAlpha=1;
  for(const p of pops){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.font='bold 22px sans-serif';ctx.textAlign='center';ctx.fillText(p.txt,p.x,p.y);}
  ctx.globalAlpha=1;

  // HUD
  ctx.textAlign='left';ctx.fillStyle='#fff';ctx.font='bold 26px sans-serif';ctx.fillText('SCORE '+score,20,36);
  ctx.textAlign='right';ctx.fillStyle='rgba(255,255,255,0.9)';ctx.font='14px sans-serif';ctx.fillText('アウト '+outs+'  Lv'+lvl,W-20,24);
  ctx.fillText('失敗',W-92,46);
  for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(W-60+i*20,41,7,0,6.28);ctx.fillStyle=i<fails?'#ff5b5b':'rgba(255,255,255,0.25)';ctx.fill();}
  if(combo>=2){ctx.textAlign='center';ctx.fillStyle='#ffd24d';ctx.font='bold 18px sans-serif';ctx.fillText('コンボ x'+combo,W/2,120);}

  if(state==='play'&&(phase==='roll'||phase==='throw')){ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,0.9)';ctx.font='bold 15px sans-serif';
    ctx.fillText('緩いゴロを①素手でつかみ→②素早く一塁へ送球。俊足に負ける前に2拍で刺せ',W/2,44);}
  if(state==='play'&&phase==='result'&&msg){ctx.textAlign='center';ctx.fillStyle=(result==='out')?'#9ff0b8':'#ff9a9a';ctx.font='bold 20px sans-serif';ctx.fillText(msg,W/2,44);}

  if(state==='title'){
    ctx.fillStyle='rgba(5,10,6,0.78)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='bold 44px sans-serif';ctx.fillText('ベアハンド',W/2,112);
    ctx.fillStyle='#ffd23e';ctx.font='bold 22px sans-serif';ctx.fillText('Bare-Hand Play',W/2,148);
    ctx.fillStyle='rgba(255,255,255,0.92)';ctx.font='16px sans-serif';
    ctx.fillText('緩いゴロを素手でつかんで矢のような送球。俊足を間一髪で刺す華麗な守備',W/2,198);
    ctx.fillStyle='rgba(255,255,255,0.66)';ctx.font='14px sans-serif';
    ctx.fillText('緩いゴロが転がってくる。① 手元に来る瞬間（青リング）にタップ＝素手でつかむ',W/2,238);
    ctx.fillText('② 握り替えができたら（緑リング）すぐタップ＝一塁へ送球',W/2,260);
    ctx.fillText('走者が一塁に着く前に送球を到達させればアウト。際どいほど“バンバンプレー”で高得点',W/2,282);
    ctx.fillText('早すぎ＝空振り、掴み損ね＝股抜け、握り替え失敗＝落球、持ち過ぎ＝セーフ',W/2,304);
    ctx.fillText('上級ほどゴロが速く走者も俊足、猶予が短い。3失敗で交代',W/2,326);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で開始',W/2,388);
    ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='14px sans-serif';ctx.fillText('BEST '+best,W/2,420);
  }
  if(state==='over'){
    ctx.fillStyle='rgba(5,10,6,0.84)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#ff6b6b';ctx.font='bold 46px sans-serif';ctx.fillText('3失敗…交代',W/2,222);
    ctx.fillStyle='#fff';ctx.font='bold 40px sans-serif';ctx.fillText('SCORE '+score,W/2,290);
    ctx.fillStyle='rgba(255,255,255,0.85)';ctx.font='19px sans-serif';ctx.fillText('アウト '+outs+'   BEST '+best,W/2,330);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で もう一度',W/2,402);
  }

  if(flash>0.02){ctx.globalAlpha=flash*0.5;ctx.fillStyle=flashCol;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}
  ctx.restore();

  ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,0.4)';ctx.font='12px sans-serif';
  ctx.fillText('①青リングで素手つかみ→②緑リングで一塁送球の2拍。走者より速く到達でアウト。早/落球/遅れは失敗。3失敗で交代',W/2,H-8);
}

function frame(ts){let dt=ts-last;last=ts;if(dt>60)dt=60;if(dt<0)dt=0;update(dt);render();requestAnimationFrame(frame);}
requestAnimationFrame(frame);

// ---------- test hook ----------
window.__bh={
  start, act:()=>act(),
  get state(){return state;},
  get score(){return score;},
  get outs(){return outs;},
  get fails(){return fails;},
  get info(){return {state,phase,grabbed,fired,clock,grabT,cw,transferGap,vw,runnerT,
    rel:(phase==='throw'?clock-grabClock:null),
    canGrab:(phase==='roll'&&!grabbed),canFire:(phase==='throw'&&!fired),
    result,outs,fails,lvl};}
};
})();
</script>
</body>
</html>
