<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>振り逃げ (Dropped Third Strike)</title>
<style>
  html,body{margin:0;height:100%;background:#0a0c12;overflow:hidden;
    font-family:-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  #stage{position:relative;width:100vw;height:100vh;max-width:calc(100vh*1.5);max-height:calc(100vw/1.5);aspect-ratio:900/600;}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;border-radius:6px;}
</style>
</head>
<body>
<div id="wrap"><div id="stage"><canvas id="cv"></canvas></div></div>
<script>
(function(){
const W=900,H=600,cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let DPR=1;
function fit(){DPR=Math.min(2,window.devicePixelRatio||1);cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
fit();addEventListener('resize',fit);

// ---------- audio ----------
let AC=null;function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function tone(f,d,type,v,sweep){const a=ac();if(!a)return;const t=a.currentTime,o=a.createOscillator(),g=a.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(sweep)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+sweep),t+d);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v||0.2,t+0.008);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+0.02);}
function noise(d,v,hp){const a=ac();if(!a)return;const t=a.currentTime,n=Math.floor(a.sampleRate*d),buf=a.createBuffer(1,n,a.sampleRate),ch=buf.getChannelData(0);
  for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource();s.buffer=buf;
  const f=a.createBiquadFilter();f.type='highpass';f.frequency.value=hp||600;const g=a.createGain();g.gain.value=v||0.2;
  s.connect(f);f.connect(g);g.connect(a.destination);s.start(t);s.stop(t+d+0.02);}
const S={
  drop:()=>{noise(0.08,0.16,400);tone(220,0.09,'square',0.09,-60);},
  safe:()=>{noise(0.06,0.12,500);[520,760,1010].forEach((f,i)=>setTimeout(()=>tone(f,0.11,'triangle',0.16),i*55));},
  great:()=>{noise(0.06,0.16,600);[540,780,1040,1320].forEach((f,i)=>setTimeout(()=>tone(f,0.12,'triangle',0.18),i*52));},
  stay:()=>{tone(520,0.08,'sine',0.09);tone(660,0.09,'sine',0.07);},
  bad:()=>{noise(0.18,0.22,300);tone(160,0.2,'sawtooth',0.12,-50);},
  streak:()=>{[700,930,1170,1400].forEach((f,i)=>setTimeout(()=>tone(f,0.1,'triangle',0.16),i*60));},
  over:()=>{[440,330,247,175].forEach((f,i)=>setTimeout(()=>tone(f,0.3,'triangle',0.2),i*160));}
};

// ---------- geometry ----------
const HOME={x:250,y:474}, FIRST={x:726,y:352}, CAT={x:250,y:528};

// ---------- state ----------
let state='title', phase='wind', t=0, plays=0;
let score=0, combo=0, best=+(localStorage.getItem('dropthird_best')||0);
let outs=0, fails=0, lvl=1;   // outs = successful plays (reached base / correct read)
let sitOuts=0, onFirst=false, live=true;
let windT=0, pitchT=0, dropClock=0, decWin=900, safeWin=320, sweet=110;
let acted=false, pressed=false, reactR=0, result=null, resultT=0, msg='';
let shake=0, flash=0, flashCol='#fff', last=performance.now();
let parts=[], pops=[];

function rnd(a,b){return a+Math.random()*(b-a);}
function chance(p){return Math.random()<p;}
function ri(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function lerp(a,b,u){return a+(b-a)*u;}
function easeOut(u){return 1-Math.pow(1-u,2);}

function params(){ return {
  safeWin:Math.max(210,360-lvl*22),
  decWin:Math.max(660,960-lvl*44)
};}

function reset(){state='title';score=0;combo=0;outs=0;fails=0;lvl=1;plays=0;result=null;parts=[];pops=[];}
function newPlay(){
  plays++; lvl=Math.min(7,1+Math.floor(outs/4));
  const p=params(); safeWin=p.safeWin; decWin=p.decWin; sweet=safeWin*0.34;
  sitOuts=ri(0,2); onFirst=chance(0.5); live=(!onFirst)||(sitOuts===2);
  phase='wind'; windT=0; pitchT=0; dropClock=0; acted=false; pressed=false; reactR=0; result=null; resultT=0; msg='';
}
function start(){ if(!ac())ac(); if(AC&&AC.state==='suspended')AC.resume(); reset(); state='play'; newPlay(); }

function act(){
  if(state==='title'){start();return;}
  if(state==='over'){ if(resultT>0.4){reset();start();} return; }
  if(state!=='play'||phase!=='loose'||acted) return;
  acted=true; pressed=true; reactR=dropClock;
  if(!live){ resolve('blunder'); return; }
  if(reactR<=sweet) resolve('safe_great');
  else if(reactR<=safeWin) resolve('safe');
  else resolve('out_thrown');
}

function resolve(k){
  phase='result'; result=k; resultT=0;
  const good=(k==='safe'||k==='safe_great'||k==='stay_ok');
  if(good){
    outs++; combo++;
    let add;
    if(k==='safe_great'){ add=Math.round(240*(1+Math.min(9,combo-1)*0.14)); S.great();
      flash=1;flashCol='#8affa0';shake=9; burst(FIRST.x,FIRST.y,'#8affa0',24,8); pop(FIRST.x,FIRST.y-46,'好スタートで悠々セーフ！ +'+add,'#d6ffe0'); pop(W/2,150,'一瞬の反応で振り逃げ成功！','#8affa0'); }
    else if(k==='safe'){ add=Math.round(130*(1+Math.min(9,combo-1)*0.16)); S.safe();
      flash=1;flashCol='#ffe08a';shake=5; burst(FIRST.x,FIRST.y,'#ffe08a',12,5); pop(FIRST.x,FIRST.y-46,'セーフ！振り逃げ成功 +'+add,'#fff3c4'); }
    else { add=Math.round(70*(1+Math.min(9,combo-1)*0.16)); S.stay(); pop(HOME.x+120,HOME.y-40,'好判断・自重 +'+add,'#bfe3ff'); }
    score+=add;
    if(combo>=2&&k!=='safe_great')pop(W/2,150,'コンボ x'+combo,'#ffd24d');
    if(combo>0&&combo%5===0)S.streak();
    msg=k==='safe_great'?'ドロップに一瞬で反応！悠々セーフ':(k==='safe'?'振り逃げ成功！一塁セーフ':'一塁が埋まり振り逃げ不可——正しく自重');
  } else {
    fails++; combo=0; flash=1;flashCol='#ff5b5b';shake=8; S.bad();
    if(result==='out_thrown') msg='スタート遅れ…一塁で刺された';
    else if(result==='blunder') msg='振り逃げ不可なのに走った…飛び出しアウト';
    else msg='ドロップを見逃した…走らず三振アウト';
    pop(HOME.x+140,HOME.y-40,result==='blunder'?'飛び出し！':(result==='missed'?'見逃し…':'アウト…'),'#ffb0b0');
  }
  if(fails>=3){ state='over'; resultT=0; S.over(); if(score>best){best=score;localStorage.setItem('dropthird_best',best);} }
}

// ---------- input ----------
cv.addEventListener('pointerdown',e=>{e.preventDefault();act();});
addEventListener('keydown',e=>{ if(e.repeat)return; if(e.code==='Space'||e.code==='Enter'||e.code==='ArrowRight'||e.code==='KeyZ'){e.preventDefault();act();} });

// ---------- particles ----------
function burst(x,y,c,n,sp){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=rnd(sp*0.3,sp);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:1,c});}}
function pop(x,y,txt,c){pops.push({x,y,txt,c,life:1});}

// ---------- update ----------
function update(dt){
  shake*=Math.pow(0.86,dt/16.7); if(shake<0.3)shake=0;
  flash*=Math.pow(0.9,dt/16.7);
  for(const p of parts){p.vx*=0.96;p.vy=p.vy*0.96+0.28;p.x+=p.vx*dt/16.7;p.y+=p.vy*dt/16.7;p.life-=dt/16.7*0.026;}
  parts=parts.filter(p=>p.life>0);
  for(const p of pops){p.y-=dt/16.7*0.5;p.life-=dt/16.7*0.02;}
  pops=pops.filter(p=>p.life>0);

  if(state!=='play'){ if(state==='over')resultT+=dt/1000; return; }
  t+=dt;
  if(phase==='wind'){ windT+=dt; if(windT>=680) phase='pitch'; return; }
  if(phase==='pitch'){ pitchT+=dt; if(pitchT>=460){ phase='loose'; dropClock=0; S.drop(); } return; }
  if(phase==='loose'){ dropClock+=dt; if(!acted && dropClock>=decWin){ acted=true; resolve(live?'missed':'stay_ok'); } return; }
  if(phase==='result'){ resultT+=dt/1000; if(resultT>1.35 && state==='play') newPlay(); return; }
}

// ---------- render ----------
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function baseM(x,y,r,on){ ctx.save();ctx.translate(x,y);ctx.rotate(0.785);ctx.fillStyle=on?'#eef0f2':'rgba(238,240,242,0.85)';ctx.fillRect(-r,-r,r*2,r*2);ctx.restore(); }

function drawScene(){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#183a22');g.addColorStop(0.55,'#1c5233');g.addColorStop(1,'#7a5230');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  // dirt infield arc
  ctx.fillStyle='#7a5230';ctx.beginPath();ctx.moveTo(HOME.x,HOME.y+8);ctx.lineTo(FIRST.x+40,FIRST.y+30);ctx.lineTo(FIRST.x+80,FIRST.y-120);ctx.lineTo(HOME.x-40,HOME.y-160);ctx.closePath();ctx.fill();
  // baseline home->first
  ctx.strokeStyle='rgba(255,255,255,0.5)';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(HOME.x,HOME.y);ctx.lineTo(FIRST.x,FIRST.y);ctx.stroke();
  // home plate
  ctx.fillStyle='#eef0f2';ctx.beginPath();ctx.moveTo(HOME.x-14,HOME.y-8);ctx.lineTo(HOME.x+14,HOME.y-8);ctx.lineTo(HOME.x+14,HOME.y+4);ctx.lineTo(HOME.x,HOME.y+12);ctx.lineTo(HOME.x-14,HOME.y+4);ctx.closePath();ctx.fill();
  // batter box
  ctx.strokeStyle='rgba(255,255,255,0.3)';ctx.lineWidth=2;ctx.strokeRect(HOME.x-52,HOME.y-34,30,66);ctx.strokeRect(HOME.x+22,HOME.y-34,30,66);
  // first base
  baseM(FIRST.x,FIRST.y,13,true);
}

function drawFigure(x,y,col,scale){ scale=scale||1;
  ctx.fillStyle='rgba(0,0,0,0.22)';ctx.beginPath();ctx.ellipse(x,y+14*scale,14*scale,4.5*scale,0,0,6.28);ctx.fill();
  ctx.fillStyle=col;rr(x-8*scale,y-24*scale,16*scale,26*scale,6*scale);ctx.fill();
  ctx.fillStyle='#f2c9a0';ctx.beginPath();ctx.arc(x,y-30*scale,6.5*scale,0,6.28);ctx.fill();
}

function render(){
  ctx.save();
  if(shake>0)ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
  drawScene();

  if(state==='play'){
    // runner already on first (occupancy cue)
    if(onFirst){ drawFigure(FIRST.x-4,FIRST.y-6,'#2b6cff',0.92); }
    // first baseman waiting
    drawFigure(FIRST.x+34,FIRST.y-14,'#d24b4b',0.92);
    // catcher
    drawFigure(CAT.x,CAT.y,'#c9782f',0.95);

    // batter position (runs on safe/out/blunder animations)
    let bx=HOME.x-4, by=HOME.y-6, run=0;
    if(phase==='result'&&(result==='safe'||result==='safe_great'||result==='out_thrown'||result==='blunder')){
      run=clamp(resultT/0.9,0,1); bx=lerp(HOME.x-4,FIRST.x-6,easeOut(run)); by=lerp(HOME.y-6,FIRST.y-4,easeOut(run));
    }
    drawFigure(bx,by,'#ffcf3a',0.96);
    // bat (before running)
    if(phase!=='result'||run<0.05){ ctx.save();ctx.translate(HOME.x+6,HOME.y-18);ctx.rotate(-0.5);
      ctx.strokeStyle='#caa15a';ctx.lineWidth=5;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(30,-20);ctx.stroke();ctx.restore(); }

    // ball
    if(phase==='pitch'){ const u=clamp(pitchT/460,0,1); const bxx=lerp(HOME.x-2,HOME.x+2,u),byy=lerp(180,HOME.y-14,easeOut(u));
      ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(bxx,byy,7,0,6.28);ctx.fill(); }
    else if(phase==='loose'){ // dropped ball skitters near catcher
      const j=Math.sin(dropClock*0.03)*4; ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(CAT.x+18+j,CAT.y+6,7,0,6.28);ctx.fill();
      ctx.fillStyle='#ffe08a';ctx.font='bold 15px sans-serif';ctx.textAlign='center';ctx.fillText('捕手が弾いた！',CAT.x+30,CAT.y-24);
      // decision timer ring
      const rem=clamp(1-dropClock/decWin,0,1);
      ctx.strokeStyle=live?'rgba(140,255,160,0.85)':'rgba(255,150,150,0.85)';ctx.lineWidth=5;
      ctx.beginPath();ctx.arc(W/2,120,26,-1.57,-1.57+6.28*rem);ctx.stroke();
    }
    else if(phase==='result'&&(result==='safe'||result==='safe_great'||result==='out_thrown'||result==='blunder')){
      // throw from catcher to first
      const u=clamp(resultT/0.82,0,1); const tbx=lerp(CAT.x+18,FIRST.x+30,u),tby=lerp(CAT.y+6,FIRST.y-10,u);
      ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(tbx,tby,6,0,6.28);ctx.fill();
    }

    // situation panel
    ctx.textAlign='left';ctx.fillStyle='rgba(0,0,0,0.35)';rr(W-232,64,212,58,10);ctx.fill();
    ctx.fillStyle='#fff';ctx.font='bold 15px sans-serif';ctx.fillText('アウト',W-222,86);
    for(let i=0;i<2;i++){ctx.beginPath();ctx.arc(W-150+i*22,81,8,0,6.28);ctx.fillStyle=i<sitOuts?'#ffd24d':'rgba(255,255,255,0.25)';ctx.fill();}
    ctx.fillStyle='#fff';ctx.font='bold 15px sans-serif';ctx.fillText('一塁走者: '+(onFirst?'あり':'なし'),W-222,110);
    ctx.textAlign='right';ctx.fillStyle=live?'#8fe0a0':'#ff9a9a';ctx.font='bold 15px sans-serif';
    ctx.fillText(live?'振り逃げ OK':'振り逃げ 不可',W-24,100);
  }

  for(const p of parts){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,3.2,0,6.28);ctx.fill();}
  ctx.globalAlpha=1;
  for(const p of pops){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.font='bold 22px sans-serif';ctx.textAlign='center';ctx.fillText(p.txt,p.x,p.y);}
  ctx.globalAlpha=1;

  // HUD
  ctx.textAlign='left';ctx.fillStyle='#fff';ctx.font='bold 26px sans-serif';ctx.fillText('SCORE '+score,20,36);
  ctx.textAlign='right';ctx.fillStyle='rgba(255,255,255,0.9)';ctx.font='14px sans-serif';ctx.fillText('好走塁 '+outs+'  Lv'+lvl,W-20,24);
  ctx.fillText('失敗',W-92,46);
  for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(W-60+i*20,41,7,0,6.28);ctx.fillStyle=i<fails?'#ff5b5b':'rgba(255,255,255,0.25)';ctx.fill();}
  if(combo>=2){ctx.textAlign='center';ctx.fillStyle='#ffd24d';ctx.font='bold 18px sans-serif';ctx.fillText('コンボ x'+combo,W/2,180);}

  if(state==='play'&&(phase==='wind'||phase==='pitch')){ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,0.92)';ctx.font='bold 15px sans-serif';
    ctx.fillText('状況を確認——一塁走者なし か 2アウトなら“振り逃げOK”。三振の瞬間、捕手の落球に備えろ',W/2,44);}
  if(state==='play'&&phase==='loose'){ctx.textAlign='center';ctx.fillStyle=live?'#8fe0a0':'#ff9a9a';ctx.font='bold 18px sans-serif';
    ctx.fillText(live?'今だ！一塁へ走れ（タップ/クリック/SPACE）':'振り逃げ不可——走るな！（自重）',W/2,44);}
  if(state==='play'&&phase==='result'&&msg){ctx.textAlign='center';ctx.fillStyle=(result==='safe'||result==='safe_great'||result==='stay_ok')?'#9ff0b8':'#ff9a9a';ctx.font='bold 20px sans-serif';ctx.fillText(msg,W/2,44);}

  if(state==='title'){
    ctx.fillStyle='rgba(6,9,14,0.78)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='bold 44px sans-serif';ctx.fillText('振り逃げ',W/2,104);
    ctx.fillStyle='#ffd23e';ctx.font='bold 22px sans-serif';ctx.fillText('Dropped Third Strike',W/2,140);
    ctx.fillStyle='rgba(255,255,255,0.92)';ctx.font='16px sans-serif';
    ctx.fillText('第3ストライクを捕手が“落球”したら一塁へ走れる——振り逃げの好機を逃すな',W/2,190);
    ctx.fillStyle='rgba(255,255,255,0.66)';ctx.font='14px sans-serif';
    ctx.fillText('まず状況を読め：一塁走者が「なし」、または「2アウト」なら振り逃げOK',W/2,228);
    ctx.fillText('（一塁走者がいて2アウト未満のときは振り逃げ不可＝走ると飛び出しアウト）',W/2,250);
    ctx.fillText('捕手が弾いた瞬間（緑リング＝OK）にすかさず一塁へ（タップ/クリック/SPACE）＝セーフ',W/2,272);
    ctx.fillText('反応が速いほど余裕でセーフ、遅れると刺される。不可の場面は走らず“自重”が正解',W/2,294);
    ctx.fillText('見逃して走らない／不可なのに走る／スタート遅れ＝失敗。上級ほど送球が速い。3失敗で交代',W/2,316);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で開始',W/2,384);
    ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='14px sans-serif';ctx.fillText('BEST '+best,W/2,416);
  }
  if(state==='over'){
    ctx.fillStyle='rgba(6,9,14,0.84)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#ff6b6b';ctx.font='bold 46px sans-serif';ctx.fillText('3失敗…交代',W/2,222);
    ctx.fillStyle='#fff';ctx.font='bold 40px sans-serif';ctx.fillText('SCORE '+score,W/2,290);
    ctx.fillStyle='rgba(255,255,255,0.85)';ctx.font='19px sans-serif';ctx.fillText('好走塁 '+outs+'   BEST '+best,W/2,330);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で もう一度',W/2,402);
  }

  if(flash>0.02){ctx.globalAlpha=flash*0.5;ctx.fillStyle=flashCol;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}
  ctx.restore();

  ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,0.4)';ctx.font='12px sans-serif';
  ctx.fillText('一塁走者なし or 2アウトなら振り逃げOK。捕手の落球に即反応して一塁へ、不可の場面は自重。3失敗で交代',W/2,H-8);
}

function frame(ts){let dt=ts-last;last=ts;if(dt>60)dt=60;if(dt<0)dt=0;update(dt);render();requestAnimationFrame(frame);}
requestAnimationFrame(frame);

// ---------- test hook ----------
window.__dt={
  start, act:()=>act(),
  get state(){return state;},
  get score(){return score;},
  get outs(){return outs;},
  get fails(){return fails;},
  get info(){return {state,phase,live,onFirst,sitOuts,dropClock,decWin,safeWin,sweet,
    canAct:(phase==='loose'&&!acted),acted,pressed,reactR,result,outs,fails,lvl};}
};
})();
</script>
</body>
</html>
