<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ゴール裏の指揮者 (Lead the Chant)</title>
<style>
  html,body{margin:0;padding:0;background:#0a1018;overflow:hidden;font-family:'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif;-webkit-user-select:none;user-select:none;touch-action:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 24%,#20305a,#060912 72%);}
  #stage{position:relative;width:min(100vw,calc(100vh*1.5));aspect-ratio:900/600;max-width:900px;box-shadow:0 10px 60px rgba(0,0,0,.6);border-radius:8px;overflow:hidden;}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;}
</style>
</head>
<body>
<div id="wrap"><div id="stage"><canvas id="cv"></canvas></div></div>
<script>
(function(){
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const W=900,H=600;let DPR=Math.min(2,window.devicePixelRatio||1);
function fit(){const r=cv.getBoundingClientRect();DPR=Math.min(2,window.devicePixelRatio||1);cv.width=Math.round(r.width*DPR);cv.height=Math.round(r.height*DPR);ctx.setTransform(cv.width/W,0,0,cv.height/H,0,0);}
new ResizeObserver(fit).observe(cv);fit();

// ---------- audio ----------
let AC=null;function actx(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function tone(f,d,type,v,sweep){const a=actx();if(!a)return;const o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.value=f;if(sweep)o.frequency.linearRampToValueAtTime(sweep,a.currentTime+d);g.gain.value=0.0001;g.gain.exponentialRampToValueAtTime(v||0.2,a.currentTime+0.008);g.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+d);o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+d+0.02);}
function noise(d,v,hp){const a=actx();if(!a)return;const n=a.createBufferSource(),b=a.createBuffer(1,a.sampleRate*d,a.sampleRate),dt=b.getChannelData(0);for(let i=0;i<dt.length;i++)dt[i]=Math.random()*2-1;n.buffer=b;const f=a.createBiquadFilter();f.type='highpass';f.frequency.value=hp||800;const g=a.createGain();g.gain.value=0.0001;g.gain.exponentialRampToValueAtTime(v||0.2,a.currentTime+0.01);g.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+d);n.connect(f);f.connect(g);g.connect(a.destination);n.start();n.stop(a.currentTime+d+0.02);}
const S={
  clap(){noise(0.05,0.24,1500);},
  call(){tone(520,0.12,'triangle',0.18,640);},
  drum(){tone(120,0.14,'sine',0.28,70);noise(0.05,0.12,200);},
  perfect(){tone(880,0.1,'triangle',0.16);},
  miss(){tone(200,0.2,'sawtooth',0.16,120);},
  roar(){for(let i=0;i<8;i++)setTimeout(function(){tone(300+Math.random()*500,0.25,'triangle',0.05);},i*50);noise(0.6,0.14,300);},
  over(){tone(330,0.3,'sine',0.2,160);setTimeout(function(){tone(220,0.5,'sine',0.2,110);},180);},
  start(){tone(440,0.1,'triangle',0.18);setTimeout(function(){tone(660,0.16,'triangle',0.2);},110);},
};

function clamp(v,a,b){return v<a?a:v>b?b:v;}
function rnd(a,b){return a+Math.random()*(b-a);}

// ---------- state ----------
let state='title';
let outs=0,fails=0,score=0,combo=0,lvl=1;   // outs = beats nailed
let best=0;try{best=parseInt(localStorage.getItem('ch_best')||'0')||0;}catch(e){}
const TARGET=26;

const LANEX=[300,450,600], HITY=468, SPAWNY=96;
const LANEINFO=[{name:'手拍子',col:'#ffd23a',key:'手'},{name:'コール',col:'#5ad0ff',key:'声'},{name:'太鼓',col:'#ff8a3a',key:'太'}];
let travelT=1500, spawnInt=900, winP=0.16, graceP=0.26;
let notes=[], gameClock=0, spawnTimer=0, lastLane=-1;
let energy=0.4;
let parts=[];
let flash=0, shakeT=0, laneFx=[0,0,0], hitFx=[0,0,0];
let msg='',msgCol='#fff',msgT=0;

function reset(){outs=0;fails=0;score=0;combo=0;lvl=1;notes=[];gameClock=0;spawnTimer=0;lastLane=-1;energy=0.4;parts=[];}
function recalc(){
  lvl=Math.min(7,1+Math.floor(outs/4));
  travelT=clamp(1700-lvl*90,1150,1700);
  spawnInt=clamp(940-lvl*56,560,940);
  winP=clamp(0.17-lvl*0.008,0.11,0.17);
  graceP=winP*1.6;
}
function startGame(){reset();recalc();state='play';spawnTimer=spawnInt*0.6;S.start();}

function burst(x,y,col,n,sp){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=rnd(0.4,1)*(sp||3);parts.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:1,col:col,r:rnd(2,5)});}}

function prog(n){return (gameClock-n.t0)/travelT;}

function spawnNote(){
  let lane;do{lane=Math.floor(Math.random()*3);}while(lane===lastLane&&Math.random()<0.7);
  lastLane=lane;
  notes.push({lane:lane,t0:gameClock,judged:false});
}

function laneSound(l){if(l===0)S.clap();else if(l===1)S.call();else S.drum();}

function tapLane(lane){
  if(state==='title'){startGame();return;}
  if(state==='over'){startGame();return;}
  if(state!=='play')return;
  // find the most imminent un-judged note in this lane (prog<=1+graceP)
  let best=null,bp=-9;
  for(const n of notes){ if(n.lane!==lane||n.judged)continue; const p=prog(n); if(p<=1+graceP && p>bp){best=n;bp=p;} }
  laneFx[lane]=1;
  if(best && Math.abs(bp-1)<=graceP){
    best.judged=true;
    const perfect=Math.abs(bp-1)<=winP;
    outs++;combo++;hitFx[lane]=1;
    energy=clamp(energy+0.05,0,1);
    const cm=1+Math.min(combo-1,9)*0.12;
    const add=Math.round((perfect?120:80)*cm)*Math.max(1,lvl);
    score+=add;
    laneSound(lane);if(perfect)setTimeout(S.perfect,10);
    burst(LANEX[lane],HITY,LANEINFO[lane].col,perfect?12:7,perfect?3.5:2.5);
    if(combo>0&&combo%10===0){msg=combo+' 連続！ スタンドが揺れる！';msgCol='#ffe08a';msgT=1;}
    if(outs>=TARGET){state='over';best2();return;}
  }else{
    // whiff (tapped off-beat / nothing at the line)
    combo=0;fails++;energy=clamp(energy-0.12,0,1);
    S.miss();flash=0.25;
    msg='リズムがズレた！';msgCol='#ff6a6a';msgT=1;
    if(fails>=3){state='over';best2();return;}
  }
}
function best2(){best=Math.max(best,score);try{localStorage.setItem('ch_best',String(best));}catch(e){}if(outs>=TARGET)S.roar();else S.over();}

// ---------- input ----------
function lfrom(x){return x<375?0:(x<525?1:2);}
cv.addEventListener('mousedown',function(e){e.preventDefault();if(!AC)actx();
  if(state!=='play'){tapLane(0);return;}
  const r=cv.getBoundingClientRect();const x=(e.clientX-r.left)/r.width*W;tapLane(lfrom(x));
});
cv.addEventListener('touchstart',function(e){e.preventDefault();if(!AC)actx();
  if(state!=='play'){tapLane(0);return;}
  const r=cv.getBoundingClientRect();const t=e.changedTouches[0];const x=(t.clientX-r.left)/r.width*W;tapLane(lfrom(x));
},{passive:false});
window.addEventListener('keydown',function(e){
  if(!AC)actx();
  if(e.code==='ArrowLeft'||e.code==='KeyA'){e.preventDefault();tapLane(0);}
  else if(e.code==='ArrowDown'||e.code==='KeyS'||e.code==='Space'){e.preventDefault();tapLane(1);}
  else if(e.code==='ArrowRight'||e.code==='KeyD'){e.preventDefault();tapLane(2);}
  else if(e.code==='Enter'){e.preventDefault();if(state!=='play')tapLane(0);}
});

// ---------- update ----------
let last=0;
function update(dt){
  if(flash>0)flash=Math.max(0,flash-dt/300);
  if(shakeT>0)shakeT=Math.max(0,shakeT-dt/320);
  if(msgT>0)msgT=Math.max(0,msgT-dt/1400);
  for(let k=0;k<3;k++){if(laneFx[k]>0)laneFx[k]=Math.max(0,laneFx[k]-dt/200);if(hitFx[k]>0)hitFx[k]=Math.max(0,hitFx[k]-dt/300);}
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.x+=p.vx;p.y+=p.vy;p.vy+=0.14;p.life-=dt/700;if(p.life<=0)parts.splice(i,1);}
  if(state!=='play')return;
  gameClock+=dt;
  spawnTimer+=dt;
  if(spawnTimer>=spawnInt){spawnTimer-=spawnInt;spawnNote();}
  // misses
  for(const n of notes){ if(!n.judged && prog(n)>1+graceP){ n.judged=true;combo=0;fails++;energy=clamp(energy-0.12,0,1);S.miss();shakeT=0.4;msg='コールを外した！';msgCol='#ff6a6a';msgT=1; if(fails>=3){state='over';best2();return;} } }
  // cull
  notes=notes.filter(n=>prog(n)<1.7);
  recalc();
  energy=clamp(energy-dt/38000,0,1);
}

// ---------- render ----------
function roundRect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

function drawStands(){
  // stadium crowd stands at top, brightness with energy
  ctx.fillStyle='#101828';ctx.fillRect(0,0,W,90);
  const rows=4;
  for(let r=0;r<rows;r++){
    for(let c=0;c<36;c++){
      const on=((c*7+r*13+Math.floor(gameClock/120))%5===0);
      const br=clamp(energy*(on?1:0.5)+(on?0.25:0.05),0,1);
      ctx.fillStyle='rgba('+Math.round(120+br*135)+','+Math.round(120+br*120)+','+Math.round(150+br*90)+','+(0.35+br*0.6)+')';
      ctx.fillRect(6+c*24.7,8+r*20,7,7);
    }
  }
  // banner
  ctx.fillStyle='rgba(0,0,0,.3)';ctx.fillRect(0,86,W,6);
}

function drawField(){
  ctx.fillStyle='#256036';ctx.fillRect(0,92,W,H-92);
  for(let i=0;i<6;i++){if(i%2)ctx.fillStyle='#2b6b3d';else ctx.fillStyle='#256036';ctx.fillRect(0,92+i*((H-92)/6),W,(H-92)/6);}
}

function drawLanes(){
  for(let l=0;l<3;l++){
    ctx.fillStyle='rgba(0,0,0,'+(0.16+laneFx[l]*0.2)+')';ctx.fillRect(LANEX[l]-52,92,104,H-92);
    // hit ring
    ctx.strokeStyle=hitFx[l]>0?LANEINFO[l].col:'rgba(255,255,255,.5)';ctx.lineWidth=hitFx[l]>0?5:3;
    ctx.beginPath();ctx.arc(LANEX[l],HITY,30+hitFx[l]*14,0,Math.PI*2);ctx.stroke();
    ctx.fillStyle='rgba(255,255,255,.7)';ctx.font='bold 15px sans-serif';ctx.textAlign='center';ctx.fillText(LANEINFO[l].key,LANEX[l],HITY+6);
  }
  // hit line
  ctx.strokeStyle='rgba(255,255,255,.35)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(240,HITY);ctx.lineTo(660,HITY);ctx.stroke();
}

function drawNotes(){
  for(const n of notes){
    if(n.judged)continue;
    const p=prog(n);if(p<0)continue;
    const y=SPAWNY+(HITY-SPAWNY)*p;
    const li=LANEINFO[n.lane];
    ctx.fillStyle=li.col;ctx.beginPath();ctx.arc(LANEX[n.lane],y,16,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='rgba(0,0,0,.6)';ctx.font='bold 15px sans-serif';ctx.textAlign='center';ctx.fillText(li.key,LANEX[n.lane],y+5);
  }
}

function drawConductor(){
  ctx.save();ctx.translate(450,540);
  ctx.fillStyle='rgba(0,0,0,.25)';ctx.beginPath();ctx.ellipse(0,8,20,6,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#222';ctx.fillRect(-10,-14,8,22);ctx.fillRect(2,-14,8,22);
  ctx.fillStyle='#1a4a8a';ctx.fillRect(-13,-40,26,28);
  ctx.fillStyle='#f0c9a0';ctx.beginPath();ctx.arc(0,-50,10,0,Math.PI*2);ctx.fill();
  // arms up (megaphone)
  const w=Math.sin(gameClock/150)*0.3;
  ctx.strokeStyle='#f0c9a0';ctx.lineWidth=5;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(-8,-34);ctx.lineTo(-20,-52+w*8);ctx.stroke();
  ctx.beginPath();ctx.moveTo(8,-34);ctx.lineTo(20,-52-w*8);ctx.stroke();
  ctx.restore();
}

function drawHUD(){
  ctx.textAlign='left';ctx.textBaseline='alphabetic';
  ctx.font='bold 20px sans-serif';ctx.fillStyle='#fff';
  ctx.fillText('コール成功 '+outs+' / '+TARGET,20,116);
  ctx.font='14px sans-serif';ctx.fillStyle='#ffb14a';ctx.fillText('ミス '+fails+' / 3',20,138);
  ctx.textAlign='right';
  ctx.font='bold 20px sans-serif';ctx.fillStyle='#ffe08a';ctx.fillText('SCORE '+score,W-20,116);
  ctx.font='13px sans-serif';ctx.fillStyle='#bfe';ctx.fillText('BEST '+Math.max(best,score)+'   Lv.'+lvl,W-20,138);
  // energy bar
  ctx.fillStyle='rgba(0,0,0,.4)';roundRect(330,110,240,14,7);ctx.fill();
  const eg=ctx.createLinearGradient(330,0,570,0);eg.addColorStop(0,'#ff8a3a');eg.addColorStop(1,'#ffd23a');
  ctx.fillStyle=eg;roundRect(330,110,240*energy,14,7);ctx.fill();
  ctx.textAlign='center';ctx.font='11px sans-serif';ctx.fillStyle='#fff';ctx.fillText('声援ボルテージ',450,121);
  if(combo>1){ctx.font='bold 20px sans-serif';ctx.fillStyle='#5affa0';ctx.fillText(combo+' 連続コール!',450,166);}
}

function drawMsg(){
  if(msgT<=0)return;
  ctx.save();ctx.globalAlpha=clamp(msgT*1.4,0,1);
  ctx.textAlign='center';ctx.font='bold 24px sans-serif';
  ctx.fillStyle='rgba(0,0,0,.55)';roundRect(450-240,196,480,42,10);ctx.fill();
  ctx.fillStyle=msgCol;ctx.fillText(msg,450,224);
  ctx.restore();
}

function drawTitle(){
  drawStands();drawField();drawLanes();drawConductor();
  ctx.save();ctx.textAlign='center';
  ctx.fillStyle='rgba(0,0,0,.66)';roundRect(90,110,720,392,16);ctx.fill();
  ctx.fillStyle='#fff';ctx.font='bold 34px sans-serif';ctx.fillText('ゴール裏の指揮者',450,168);
  ctx.font='18px sans-serif';ctx.fillStyle='#9fe0bf';ctx.fillText('Lead the Chant  🎉420',450,198);
  ctx.font='16px sans-serif';ctx.fillStyle='#e6fcef';
  const lines=[
    'あなたはゴール裏の指揮者（12番目の選手）。',
    'スタンドへ降ってくるコール＝手拍子/声/太鼓のビートを、',
    '判定リングに重なる“今”ジャストで叩いてスタジアムを鼓舞しろ！',
    '手拍子＝左/←、声＝中央/↓/SPACE、太鼓＝右/→（レーンをタップ）。',
    'リズムがズレる・見逃すと声援が萎む。ドンピシャで連続コンボ＆加点。',
    '26コール成功でスタジアム大合唱。3ミスで終了。',
  ];
  for(let i=0;i<lines.length;i++)ctx.fillText(lines[i],450,236+i*30);
  ctx.fillStyle='#ffe08a';ctx.font='bold 22px sans-serif';
  ctx.fillText('タップ / キーでスタート',450,476);
  ctx.restore();
}

function drawOver(){
  drawStands();drawField();
  ctx.save();ctx.textAlign='center';
  ctx.fillStyle='rgba(0,0,0,.66)';roundRect(190,150,520,300,16);ctx.fill();
  const w2=outs>=TARGET;
  ctx.fillStyle=w2?'#5affa0':'#ff8a5a';ctx.font='bold 34px sans-serif';
  ctx.fillText(w2?'スタジアム大合唱！':'コール失敗…',450,222);
  ctx.fillStyle='#fff';ctx.font='20px sans-serif';
  ctx.fillText('コール成功 '+outs+' / '+TARGET,450,270);
  ctx.fillText('スコア '+score,450,304);
  ctx.fillStyle='#ffe08a';ctx.fillText('ベスト '+Math.max(best,score),450,336);
  ctx.fillStyle='#9fe0bf';ctx.font='bold 20px sans-serif';
  ctx.fillText('タップ / キー でもう一度',450,404);
  ctx.restore();
}

function render(){
  ctx.save();
  if(shakeT>0){const s=shakeT*7;ctx.translate(rnd(-s,s),rnd(-s,s));}
  if(state==='title'){drawTitle();}
  else if(state==='over'){drawOver();}
  else{
    drawStands();drawField();drawLanes();drawNotes();drawConductor();drawHUD();drawMsg();
  }
  for(const p of parts){ctx.globalAlpha=clamp(p.life,0,1);ctx.fillStyle=p.col;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();}
  ctx.globalAlpha=1;
  ctx.restore();
  if(flash>0){ctx.fillStyle='rgba(255,120,120,'+(flash*0.4)+')';ctx.fillRect(0,0,W,H);}
}

function frame(ts){let dt=ts-last;last=ts;if(dt>60)dt=60;if(dt<0)dt=0;update(dt);render();requestAnimationFrame(frame);}
requestAnimationFrame(frame);

// ---------- test hook ----------
window.__ch={
  start:startGame,
  tap:tapLane,
  get state(){return state;},
  get outs(){return outs;},
  get fails(){return fails;},
  get score(){return score;},
  get info(){
    const ns=[];for(const n of notes){if(!n.judged){const p=(gameClock-n.t0)/travelT;if(p<=1.5)ns.push({lane:n.lane,prog:p});}}
    return {state:state,outs:outs,fails:fails,score:score,lvl:lvl,winP:winP,graceP:graceP,notes:ns};
  }
};
})();
</script>
</body>
</html>
