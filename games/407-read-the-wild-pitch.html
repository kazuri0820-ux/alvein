<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>逸らしたら還れ (Read the Wild Pitch)</title>
<style>
  html,body{margin:0;padding:0;background:#0a1410;overflow:hidden;font-family:'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif;-webkit-user-select:none;user-select:none;touch-action:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 32%,#173525,#060d09 72%);}
  #stage{position:relative;width:min(100vw,calc(100vh*1.5));aspect-ratio:900/600;max-width:900px;box-shadow:0 10px 60px rgba(0,0,0,.6);border-radius:8px;overflow:hidden;}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;}
</style>
</head>
<body>
<div id="wrap"><div id="stage"><canvas id="cv"></canvas></div></div>
<script>
(function(){
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const W=900,H=600;let DPR=Math.min(2,window.devicePixelRatio||1);
function fit(){const r=cv.getBoundingClientRect();DPR=Math.min(2,window.devicePixelRatio||1);cv.width=Math.round(r.width*DPR);cv.height=Math.round(r.height*DPR);ctx.setTransform(cv.width/W,0,0,cv.height/H,0,0);}
new ResizeObserver(fit).observe(cv);fit();

// ---------- audio ----------
let AC=null;function actx(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function tone(f,d,type,v,sweep){const a=actx();if(!a)return;const o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.value=f;if(sweep)o.frequency.linearRampToValueAtTime(sweep,a.currentTime+d);g.gain.value=0.0001;g.gain.exponentialRampToValueAtTime(v||0.2,a.currentTime+0.008);g.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+d);o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+d+0.02);}
function noise(d,v,hp){const a=actx();if(!a)return;const n=a.createBufferSource(),b=a.createBuffer(1,a.sampleRate*d,a.sampleRate),dt=b.getChannelData(0);for(let i=0;i<dt.length;i++)dt[i]=Math.random()*2-1;n.buffer=b;const f=a.createBiquadFilter();f.type='highpass';f.frequency.value=hp||800;const g=a.createGain();g.gain.value=0.0001;g.gain.exponentialRampToValueAtTime(v||0.2,a.currentTime+0.01);g.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+d);n.connect(f);f.connect(g);g.connect(a.destination);n.start();n.stop(a.currentTime+d+0.02);}
const S={
  pitch(){tone(400,0.14,'sawtooth',0.14,180);},
  block(){noise(0.12,0.3,500);tone(120,0.14,'sine',0.2,80);},
  skip(){noise(0.1,0.2,1600);tone(700,0.08,'square',0.12,1200);setTimeout(function(){noise(0.09,0.16,1400);},110);},
  run(){tone(300,0.08,'square',0.12);},
  safe(){tone(520,0.1,'triangle',0.2);setTimeout(function(){tone(700,0.12,'triangle',0.2);},100);setTimeout(function(){tone(920,0.2,'triangle',0.22);},210);},
  out(){tone(300,0.3,'sawtooth',0.18,150);setTimeout(function(){tone(190,0.4,'sawtooth',0.16,110);},150);},
  combo(n){tone(560+Math.min(n,8)*70,0.12,'triangle',0.16);},
  over(){tone(330,0.3,'sine',0.2,160);setTimeout(function(){tone(220,0.5,'sine',0.2,110);},180);},
  start(){tone(440,0.1,'triangle',0.18);setTimeout(function(){tone(660,0.16,'triangle',0.2);},110);},
};

function clamp(v,a,b){return v<a?a:v>b?b:v;}
function rnd(a,b){return a+Math.random()*(b-a);}

// ---------- state ----------
let state='title';
let outs=0,fails=0,score=0,best=0,combo=0,lvl=1;   // outs = correct reads
try{best=parseInt(localStorage.getItem('wp_best')||'0')||0;}catch(e){}
const TARGET=26;

let phase='wind';  // wind | watch | result
let pt=0, clock=0;
let revealT=500, callWin=1000, tough=false, truth='blocked';
let decided=false, result='', called='';
let ballX=450,ballY=250,ballShown=false;
let runnerU=0;      // runner progress 3rd -> home (0..1)
let parts=[];
let shakeT=0,flash=0;
let msg='',msgCol='#fff',msgT=0;

function reset(){outs=0;fails=0;score=0;combo=0;lvl=1;parts=[];}
function newPitch(){
  lvl=Math.min(7,1+Math.floor(outs/4));
  revealT=clamp(560-lvl*24,360,560);
  callWin=clamp(1020-lvl*70,560,1020);
  tough=Math.random()<clamp(0.2+lvl*0.05,0.2,0.5);
  truth=Math.random()<0.5?'past':'blocked';
  phase='wind';pt=0;clock=0;decided=false;result='';called='';
  ballShown=false;ballX=450;ballY=250;runnerU=0;
}
function startGame(){reset();state='play';newPitch();S.start();}

function burst(x,y,col,n,sp){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=rnd(0.4,1)*(sp||3);parts.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:1,col:col,r:rnd(2,5)});}}

function resolve(kind){
  decided=true;result=kind;
  if(kind==='right'){
    outs++;combo++;
    const runScored=(truth==='past');
    const base=runScored?150:80;
    const cm=1+Math.min(combo-1,6)*0.13;
    const add=Math.round(base*cm)*Math.max(1,lvl);
    score+=add;lastAdd=add;runScored2=runScored;
    if(runScored){S.run();setTimeout(S.safe,140);}else S.safe();
    if(combo>1)setTimeout(function(){S.combo(combo);},250);
    flash=0.3;
    msg=(runScored?'後逸を見て一気に生還！':'よく我慢した——好判断')+'  +'+add;
    msgCol=runScored?'#5affa0':'#8fe0ff';msgT=1;
  }else{
    combo=0;fails++;
    S.out();flash=0.4;shakeT=0.8;
    if(result==='early')msg='フライング！ 飛び出して憤死';
    else if(result==='late')msg='判断が遅い…チャンスを逃した';
    else if(called==='GO')msg='ブロックされてた！ 本塁で憤死';
    else msg='後逸を見逃した…還れず';
    msgCol='#ff6a6a';msgT=1;
  }
  phase='result';pt=0;
}
let lastAdd=0,runScored2=false;

function makeCall(c){
  if(state!=='play'||phase!=='watch'||decided)return;
  called=c;
  if(clock<revealT){resolve('early');return;}
  const correct=(c==='GO'&&truth==='past')||(c==='STAY'&&truth==='blocked');
  resolve(correct?'right':'wrong');
}

// ---------- input ----------
function actGO(){if(!AC)actx();if(state==='title'){startGame();return;}if(state==='over'){startGame();return;}makeCall('GO');}
function actSTAY(){if(!AC)actx();if(state==='title'){startGame();return;}if(state==='over'){startGame();return;}makeCall('STAY');}
cv.addEventListener('mousedown',function(e){e.preventDefault();
  if(state!=='play'){actGO();return;}
  const r=cv.getBoundingClientRect();const x=(e.clientX-r.left)/r.width*W;
  if(x<450)actSTAY();else actGO();
});
cv.addEventListener('touchstart',function(e){e.preventDefault();
  if(state!=='play'){actGO();return;}
  const r=cv.getBoundingClientRect();const t=e.changedTouches[0];const x=(t.clientX-r.left)/r.width*W;
  if(x<450)actSTAY();else actGO();
},{passive:false});
window.addEventListener('keydown',function(e){
  if(e.code==='ArrowLeft'||e.code==='KeyA'){e.preventDefault();actSTAY();}
  else if(e.code==='ArrowRight'||e.code==='KeyD'||e.code==='ArrowUp'||e.code==='Space'||e.code==='Enter'){e.preventDefault();actGO();}
});

// ---------- update ----------
let last=0;
function update(dt){
  if(flash>0)flash=Math.max(0,flash-dt/300);
  if(shakeT>0)shakeT=Math.max(0,shakeT-dt/320);
  if(msgT>0)msgT=Math.max(0,msgT-dt/1500);
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.x+=p.vx;p.y+=p.vy;p.vy+=0.16;p.life-=dt/640;if(p.life<=0)parts.splice(i,1);}
  if(state!=='play')return;
  pt+=dt;
  if(phase==='wind'){
    if(pt>=460){phase='watch';pt=0;clock=0;ballShown=true;S.pitch();}
  }else if(phase==='watch'){
    clock+=dt;
    // ball travels toward plate; reaches catcher around revealT
    const u=clamp(clock/revealT,0,1);
    ballX=450; ballY=250+(535-250)*u;
    if(clock>=revealT){
      // reveal outcome once
      if(clock<revealT+18){ if(truth==='blocked')S.block(); else S.skip(); if(truth==='past')burst(470,545,'#ddd',10,3);}
    }
    if(clock>=revealT+callWin&&!decided)resolve('late');
  }else if(phase==='result'){
    // ball after reveal
    if(truth==='blocked'){ballX=450;ballY=535;}
    else{ const t=clamp(pt/360,0,1); ballX=450+t*120; ballY=535+t*38; }
    // runner animation
    if(result==='right'&&truth==='past'){runnerU=Math.min(1,runnerU+dt/520);}
    else if(result==='wrong'&&called==='GO'){runnerU=Math.min(0.82,runnerU+dt/540);}
    else if(result==='early'){runnerU=Math.min(0.5,runnerU+dt/520);}
    if(pt>=1050){
      if(fails>=3){state='over';best=Math.max(best,score);try{localStorage.setItem('wp_best',String(best));}catch(e){}S.over();}
      else if(outs>=TARGET){state='over';best=Math.max(best,score);try{localStorage.setItem('wp_best',String(best));}catch(e){}S.start();}
      else newPitch();
    }
  }
}

// ---------- render ----------
function roundRect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

function drawField(){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#1c4a30');g.addColorStop(1,'#123c26');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  // backstop arc
  ctx.strokeStyle='rgba(255,255,255,.12)';ctx.lineWidth=8;ctx.beginPath();ctx.arc(450,600,240,Math.PI*1.15,Math.PI*1.85);ctx.stroke();
  // dirt: home circle + third-base line
  ctx.fillStyle='#9a663a';ctx.beginPath();ctx.ellipse(450,520,180,90,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#8a5a34';ctx.save();ctx.beginPath();ctx.moveTo(140,410);ctx.lineTo(180,398);ctx.lineTo(470,516);ctx.lineTo(438,540);ctx.closePath();ctx.fill();ctx.restore();
  // mound
  ctx.fillStyle='#9a663a';ctx.beginPath();ctx.ellipse(450,250,54,26,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#c9c2b6';ctx.fillRect(440,244,20,6);
  // home plate
  ctx.fillStyle='#eee';ctx.beginPath();ctx.moveTo(450,540);ctx.lineTo(466,530);ctx.lineTo(466,518);ctx.lineTo(434,518);ctx.lineTo(434,530);ctx.closePath();ctx.fill();
  // third base
  ctx.save();ctx.translate(140,410);ctx.rotate(Math.PI/4);ctx.fillStyle='#eee';ctx.fillRect(-9,-9,18,18);ctx.restore();
}

function drawPitcher(){
  const cx=450,cy=228;
  ctx.fillStyle='rgba(0,0,0,.22)';ctx.beginPath();ctx.ellipse(cx,cy+16,20,6,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#d8dde6';ctx.fillRect(cx-9,cy-24,18,28);
  ctx.fillStyle='#2a4a6b';ctx.fillRect(cx-9,cy+0,18,10);
  ctx.fillStyle='#f0c9a0';ctx.beginPath();ctx.arc(cx,cy-30,8,0,Math.PI*2);ctx.fill();
}

function drawCatcher(){
  const cx=450,cy=560;
  ctx.fillStyle='rgba(0,0,0,.25)';ctx.beginPath();ctx.ellipse(cx,cy+8,26,7,0,0,Math.PI*2);ctx.fill();
  // crouched body
  const blocking=(phase==='result'&&truth==='blocked')||(phase==='watch'&&clock>=revealT&&truth==='blocked');
  ctx.fillStyle='#3b6b9b';
  if(blocking){ctx.fillRect(cx-20,cy-26,40,30);}else{ctx.fillRect(cx-15,cy-24,30,28);}
  // helmet
  ctx.fillStyle='#243a52';ctx.beginPath();ctx.arc(cx,cy-30,11,0,Math.PI*2);ctx.fill();
  // mitt
  ctx.fillStyle='#5a3a22';ctx.beginPath();ctx.arc(cx-(blocking?0:14),cy-8,8,0,Math.PI*2);ctx.fill();
}

function drawRunner(){
  // interpolate along third-base line to home
  const x=140+(450-140)*runnerU, y=410+(520-410)*runnerU;
  ctx.save();ctx.translate(x,y);
  ctx.fillStyle='rgba(0,0,0,.28)';ctx.beginPath();ctx.ellipse(0,6,16,6,0,0,Math.PI*2);ctx.fill();
  const run=runnerU>0?Math.sin(runnerU*40)*7:0;
  ctx.fillStyle='#222';ctx.fillRect(-9+run*0.3,-24,8,24);ctx.fillRect(2-run*0.3,-24,8,24);
  ctx.fillStyle='#d64545';ctx.fillRect(-12,-52,24,30);
  ctx.fillStyle='#f0c9a0';ctx.beginPath();ctx.arc(0,-60,9,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#b32d2d';ctx.beginPath();ctx.arc(0,-62,10,Math.PI,Math.PI*2.1);ctx.fill();
  ctx.restore();
}

function drawBall(){
  if(!ballShown)return;
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(ballX,ballY,7,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='#d33';ctx.lineWidth=1;ctx.beginPath();ctx.arc(ballX-2,ballY,5,-0.7,0.7);ctx.stroke();
}

function drawButtons(){
  if(state!=='play')return;
  const active=(phase==='watch'&&!decided&&clock>=revealT);
  // STAY (left)
  ctx.globalAlpha=active?1:0.5;
  roundRect(70,470,320,72,12);ctx.fillStyle=(called==='STAY')?'#2f6fb0':'rgba(30,70,110,.75)';ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,.5)';ctx.lineWidth=2;ctx.stroke();
  roundRect(510,470,320,72,12);ctx.fillStyle=(called==='GO')?'#2f9a5a':'rgba(30,110,60,.75)';ctx.fill();ctx.stroke();
  ctx.globalAlpha=1;
  ctx.textAlign='center';ctx.fillStyle='#dff';ctx.font='bold 26px sans-serif';
  ctx.fillText('自重 STAY',230,505);ctx.font='13px sans-serif';ctx.fillStyle='#bcd';ctx.fillText('← / A（ブロックされたら）',230,528);
  ctx.fillStyle='#dfd';ctx.font='bold 26px sans-serif';ctx.fillText('本塁へ GO',670,505);ctx.font='13px sans-serif';ctx.fillStyle='#bdb';ctx.fillText('→ / ↑ / SPACE（後逸したら）',670,528);
}

function drawReveal(){
  if(phase==='watch'&&clock>=revealT&&!decided){
    ctx.textAlign='center';ctx.font='bold 30px sans-serif';
    if(truth==='past'){ctx.fillStyle='#ffe08a';ctx.fillText('後逸！ ボールが逸れた！',450,150);}
    else{ctx.fillStyle='#9fd7ff';ctx.fillText('ブロック！ 捕手が抑えた',450,150);}
  }
}

function drawHUD(){
  ctx.textAlign='left';ctx.textBaseline='alphabetic';
  ctx.font='bold 20px sans-serif';ctx.fillStyle='#fff';
  ctx.fillText('好判断 '+outs+' / '+TARGET,20,32);
  ctx.font='14px sans-serif';ctx.fillStyle='#ffb14a';ctx.fillText('憤死 '+fails+' / 3',20,54);
  ctx.textAlign='right';
  ctx.font='bold 20px sans-serif';ctx.fillStyle='#ffe08a';ctx.fillText('SCORE '+score,W-20,32);
  ctx.font='13px sans-serif';ctx.fillStyle='#bfe';ctx.fillText('BEST '+Math.max(best,score)+'   Lv.'+lvl,W-20,52);
  if(combo>1){ctx.textAlign='center';ctx.font='bold 20px sans-serif';ctx.fillStyle='#5affa0';ctx.fillText(combo+' 連続好判断!',450,86);}
}

function drawMsg(){
  if(msgT<=0)return;
  ctx.save();ctx.globalAlpha=clamp(msgT*1.4,0,1);
  ctx.textAlign='center';ctx.font='bold 27px sans-serif';
  ctx.fillStyle='rgba(0,0,0,.55)';roundRect(450-270,108,540,44,10);ctx.fill();
  ctx.fillStyle=msgCol;ctx.fillText(msg,450,138);
  ctx.restore();
}

function drawTitle(){
  drawField();drawCatcher();drawPitcher();
  ctx.save();ctx.textAlign='center';
  ctx.fillStyle='rgba(0,0,0,.55)';roundRect(120,96,660,392,16);ctx.fill();
  ctx.fillStyle='#fff';ctx.font='bold 40px sans-serif';ctx.fillText('逸らしたら還れ',450,162);
  ctx.font='18px sans-serif';ctx.fillStyle='#9fe0bf';ctx.fillText('Read the Wild Pitch',450,192);
  ctx.font='16px sans-serif';ctx.fillStyle='#e6fcef';
  const lines=[
    'あなたは三塁走者。ワンバウンドの投球を捕手が',
    '「ブロック」するか「後逸」するかを一瞬で読み、',
    '後逸＝本塁へGO！／ブロック＝自重STAY！を選べ。',
    '後逸を見て還れば得点。ブロックで飛び出すと本塁憤死。',
    '早すぎる飛び出し・判断遅れもアウト。3憤死で交代。',
    '左半分/← = STAY、右半分/→/SPACE = GO。',
  ];
  for(let i=0;i<lines.length;i++)ctx.fillText(lines[i],450,232+i*29);
  ctx.fillStyle='#ffe08a';ctx.font='bold 22px sans-serif';
  ctx.fillText('タップ / SPACE でスタート',450,462);
  ctx.restore();
}

function drawOver(){
  drawField();drawCatcher();
  ctx.save();ctx.textAlign='center';
  ctx.fillStyle='rgba(0,0,0,.6)';roundRect(190,150,520,300,16);ctx.fill();
  const w=outs>=TARGET;
  ctx.fillStyle=w?'#5affa0':'#ff8a5a';ctx.font='bold 40px sans-serif';
  ctx.fillText(w?'走塁の達人！':'憤死しすぎ…',450,222);
  ctx.fillStyle='#fff';ctx.font='20px sans-serif';
  ctx.fillText('好判断 '+outs+' / '+TARGET,450,270);
  ctx.fillText('スコア '+score,450,304);
  ctx.fillStyle='#ffe08a';ctx.fillText('ベスト '+Math.max(best,score),450,336);
  ctx.fillStyle='#9fe0bf';ctx.font='bold 20px sans-serif';
  ctx.fillText('タップ / SPACE でもう一度',450,404);
  ctx.restore();
}

function render(){
  ctx.save();
  if(shakeT>0){const s=shakeT*7;ctx.translate(rnd(-s,s),rnd(-s,s));}
  if(state==='title'){drawTitle();}
  else if(state==='over'){drawOver();}
  else{
    drawField();
    drawRunner();
    drawPitcher();
    drawCatcher();
    drawBall();
    drawButtons();
    drawReveal();
    drawHUD();
    drawMsg();
  }
  for(const p of parts){ctx.globalAlpha=clamp(p.life,0,1);ctx.fillStyle=p.col;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();}
  ctx.globalAlpha=1;
  ctx.restore();
  if(flash>0){ctx.fillStyle='rgba(255,255,255,'+(flash*0.5)+')';ctx.fillRect(0,0,W,H);}
}

function frame(ts){let dt=ts-last;last=ts;if(dt>60)dt=60;if(dt<0)dt=0;update(dt);render();requestAnimationFrame(frame);}
requestAnimationFrame(frame);

// ---------- test hook ----------
window.__wp={
  start:startGame,
  go:function(){makeCall('GO');},
  stay:function(){makeCall('STAY');},
  get state(){return state;},
  get outs(){return outs;},
  get fails(){return fails;},
  get score(){return score;},
  get info(){return {state:state,phase:phase,clock:clock,revealT:revealT,callWin:callWin,truth:truth,tough:tough,decided:decided,result:result,called:called,outs:outs,fails:fails,lvl:lvl,isPast:(truth==='past'),revealed:(clock>=revealT),canAct:(state==='play'&&phase==='watch'&&!decided)};}
};
})();
</script>
</body>
</html>
