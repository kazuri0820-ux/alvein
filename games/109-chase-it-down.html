<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>パスボール・リカバリー (Chase It Down)</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;background:#0a1410;overflow:hidden;font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",system-ui,sans-serif}
  #wrap{width:100%;height:100%;display:flex;align-items:center;justify-content:center}
  #stage{position:relative;width:min(100vw,calc(100vh*1.5));aspect-ratio:900/600;max-width:900px;
    box-shadow:0 10px 60px rgba(0,0,0,.6);border-radius:10px;overflow:hidden;touch-action:none}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
  #hint{position:absolute;left:0;bottom:6px;width:100%;text-align:center;color:#cfe;
    font-size:12px;opacity:.55;pointer-events:none;text-shadow:0 1px 3px #000}
</style>
</head>
<body>
<div id="wrap"><div id="stage">
  <canvas id="cv"></canvas>
  <div id="hint">← → / A D で捕手を動かしボールに追いつけ ・ 重なったら SPACE / タップ で捕球 → 自動で本塁送球 ・ 走者より速く</div>
</div></div>
<script>
(()=>{
const cv=document.getElementById('cv'), g=cv.getContext('2d');
const W=900,H=600;
let DPR=1;
function fit(){ DPR=Math.min(2,window.devicePixelRatio||1); cv.width=W*DPR; cv.height=H*DPR; g.setTransform(DPR,0,0,DPR,0,0); }
fit(); addEventListener('resize',fit);

// ---------- audio ----------
let AC=null;
function ac(){ if(!AC){ try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){} } return AC; }
function tone(f,d,t,v,sweep){ const a=ac(); if(!a)return; const o=a.createOscillator(),gg=a.createGain();
  o.type=t||'sine'; o.frequency.value=f; if(sweep) o.frequency.exponentialRampToValueAtTime(Math.max(20,sweep),a.currentTime+d);
  gg.gain.setValueAtTime(0.0001,a.currentTime); gg.gain.exponentialRampToValueAtTime(v||0.2,a.currentTime+0.012);
  gg.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+d); o.connect(gg).connect(a.destination);
  o.start(); o.stop(a.currentTime+d+0.02); }
function noise(d,v,hp){ const a=ac(); if(!a)return; const n=a.createBuffer(1,a.sampleRate*d,a.sampleRate); const ch=n.getChannelData(0);
  for(let i=0;i<ch.length;i++) ch[i]=(Math.random()*2-1)*(1-i/ch.length);
  const s=a.createBufferSource(); s.buffer=n; const f=a.createBiquadFilter(); f.type='highpass'; f.frequency.value=hp||600;
  const gg=a.createGain(); gg.gain.value=v||0.15; s.connect(f).connect(gg).connect(a.destination); s.start(); }
const S={
  bounce(){ tone(300,0.05,'square',0.06,180); },
  scoop(){ noise(0.06,0.12,600); tone(420,0.08,'sine',0.1,700); },
  bobble(){ tone(240,0.1,'sawtooth',0.08,140); noise(0.1,0.08,400); },
  throw(){ tone(520,0.1,'triangle',0.1,820); },
  out(){ tone(660,0.12,'square',0.16,900); setTimeout(()=>tone(990,0.18,'square',0.14,1300),90); },
  safe(){ noise(0.24,0.2,240); tone(180,0.32,'sawtooth',0.16,60); },
  over(){ tone(300,0.5,'sawtooth',0.16,90); setTimeout(()=>tone(200,0.6,'sawtooth',0.14,60),160); },
  tick(){ tone(900,0.03,'square',0.04); },
};

// ---------- state ----------
let state='title';
let parts=[], pops=[];
let score, outs, runsIn, combo, best, lvl;
let pl=null;
let dir=0;
let flash=0, shakeT=0;
try{ best=+localStorage.getItem('cd_best')||0; }catch(e){ best=0; }

const HOME={x:450,y:520};
const WALLL=90, WALLR=810, BALLY=250;   // backstop band (ball caroms here)
const CATY=300;                          // catcher row

function reset(){ parts=[]; pops=[]; score=0; outs=0; runsIn=0; combo=0; lvl=0; pl=null; dir=0; flash=0; shakeT=0; nextPlay(); }

function nextPlay(){
  lvl=Math.floor(outs/3);
  const speedBias=1+lvl*0.12;
  const bx=200+Math.random()*500;
  const bvx=(Math.random()<0.5?-1:1)*(0.28+Math.random()*0.22)*speedBias;
  const runnerSpeed=0.9+Math.random()*0.4+lvl*0.06;      // higher = arrives sooner
  const deadline=2700/runnerSpeed;                        // ms until runner reaches home
  pl={
    phase:'chase', t:0, deadline,
    bx, by:BALLY, bvx, bvy:(Math.random()-0.5)*0.05, spin:0,
    catX:450, gathered:false, gatherT:0, bobbleUntil:0,
    res:null, resT:0, throwP:0, runnerP:0, ticked:-1,
    clutch: lvl>=2 && Math.random()<0.18
  };
}
function catchRange(){ return 30; }

// ---------- action ----------
function scoop(){
  if(!pl||pl.phase!=='chase'||pl.gathered) return;
  if(pl.t<pl.bobbleUntil) return;
  const d=Math.abs(pl.catX-pl.bx);
  if(d<=catchRange()){
    pl.gathered=true; pl.gatherT=pl.t; pl.phase='resolve'; pl.resT=0; S.scoop();
    burst(pl.bx,pl.by,'#8fffb0',12);
    // in time to throw home?
    const throwNeed=560-Math.min(180,lvl*20);
    pl.res = (pl.deadline - pl.gatherT) >= throwNeed ? 'out' : 'safe';
    S.throw();
  } else {
    // whiffed scoop -> bobble delay
    pl.bobbleUntil=pl.t+360; S.bobble(); shakeT=0.15;
    pops.push({txt:'お手玉！', x:pl.catX, y:CATY-40, life:0.7, small:true});
  }
}
function applyResult(){
  const r=pl.res;
  if(r==='out'){ outs++; combo++; let gained=Math.round((100+combo*14)*(pl.clutch?2:1)); score+=gained;
    pops.push({txt:(pl.clutch?'値千金の補殺！ +':'本塁タッチアウト！ +')+gained, big:true, y:150, life:1.1, c:'#ffe15a'});
    flash=Math.max(flash,0.45); S.out(); burst(HOME.x,HOME.y,'#ffe15a',28);
  } else if(r==='safe'){ runsIn++; combo=0; shakeT=0.35; flash=Math.max(flash,0.4);
    pops.push({txt:'間に合わず生還…', big:true, y:180, life:1.05, c:'#ff6a6a', bad:true}); S.safe(); burst(HOME.x,HOME.y,'#ff6a6a',22);
  } else if(r==='notgathered'){ runsIn++; combo=0; shakeT=0.35; flash=Math.max(flash,0.4);
    pops.push({txt:'後逸で生還！', big:true, y:180, life:1.05, c:'#ff6a6a', bad:true}); S.safe(); burst(HOME.x,HOME.y,'#ff6a6a',22);
  }
  if(runsIn>=3) gameOver();
}
function gameOver(){ state='over'; S.over(); if(score>best){ best=score; try{localStorage.setItem('cd_best',best);}catch(e){} } }
function burst(x,y,c,n){ for(let i=0;i<n;i++) parts.push({x,y,vx:(Math.random()-0.5)*7,vy:(Math.random()-0.5)*7-1,life:1,c}); }

// ---------- input ----------
function start(){ ac(); reset(); state='play'; }
function scoopPress(){ if(state==='title'||state==='over'){ start(); return; } if(state!=='play') return; scoop(); }
addEventListener('keydown',e=>{ const k=e.key.toLowerCase();
  if(state!=='play'){ if((k===' '||k==='enter')&&!e.repeat) start(); return; }
  if(k==='arrowleft'||k==='a'){ dir=-1; e.preventDefault(); }
  else if(k==='arrowright'||k==='d'){ dir=1; e.preventDefault(); }
  else if(k===' '||k==='arrowup'||k==='w'){ if(!e.repeat) scoopPress(); e.preventDefault(); } });
addEventListener('keyup',e=>{ const k=e.key.toLowerCase();
  if((k==='arrowleft'||k==='a')&&dir<0) dir=0; else if((k==='arrowright'||k==='d')&&dir>0) dir=0; });
// pointer: tap upper area near ball to move toward it + scoop when close; hold to move
let ptrX=null;
cv.addEventListener('pointerdown',e=>{ ac(); if(state!=='play'){ start(); return; } const r=cv.getBoundingClientRect(); ptrX=(e.clientX-r.left)/r.width*W;
  // if tapping near the ball/catcher, treat as scoop
  if(pl && Math.abs((ptrX)-pl.bx)<=catchRange() && Math.abs(pl.catX-pl.bx)<=catchRange()) scoopPress();
  e.preventDefault(); });
cv.addEventListener('pointermove',e=>{ if(ptrX===null) return; const r=cv.getBoundingClientRect(); ptrX=(e.clientX-r.left)/r.width*W; });
addEventListener('pointerup',()=>{ ptrX=null; dir=0; });

// ---------- update ----------
function update(dt){
  if(flash>0) flash=Math.max(0,flash-dt*0.003);
  if(shakeT>0) shakeT-=dt*0.001;
  parts.forEach(q=>{q.x+=q.vx;q.y+=q.vy;q.vy+=0.12;q.life-=dt*0.0022;});
  parts=parts.filter(q=>q.life>0);
  pops.forEach(q=>{q.y-=dt*0.03;q.life-=dt*0.0016;});
  pops=pops.filter(q=>q.life>0);
  if(state!=='play'||!pl) return;

  if(pl.phase==='chase'){
    pl.t+=dt;
    // ball carom physics
    pl.bx+=pl.bvx*dt; pl.by+=pl.bvy*dt;
    if(pl.bx<WALLL){ pl.bx=WALLL; pl.bvx=Math.abs(pl.bvx)*0.84; S.bounce(); }
    if(pl.bx>WALLR){ pl.bx=WALLR; pl.bvx=-Math.abs(pl.bvx)*0.84; S.bounce(); }
    if(pl.by<BALLY-40){ pl.by=BALLY-40; pl.bvy=Math.abs(pl.bvy); }
    if(pl.by>BALLY+40){ pl.by=BALLY+40; pl.bvy=-Math.abs(pl.bvy); }
    pl.bvx*=Math.pow(0.9975,dt/16); pl.spin+=pl.bvx*dt*0.02;
    // catcher move
    let d=dir;
    if(ptrX!==null){ d = ptrX<pl.catX-6?-1: ptrX>pl.catX+6?1:0; }
    pl.catX+=d*0.52*dt;
    pl.catX=Math.max(WALLL-10,Math.min(WALLR+10,pl.catX));
    // runner progress + deadline
    const rt=pl.t/pl.deadline;
    if(Math.floor(rt*8)!==pl.ticked && rt>0.4){ pl.ticked=Math.floor(rt*8); S.tick(); }
    if(pl.t>=pl.deadline){ pl.res='notgathered'; pl.phase='resolve'; pl.resT=0; }
  } else if(pl.phase==='resolve'){
    pl.resT+=dt;
    if(pl.res==='out'||pl.res==='safe'){ pl.throwP=Math.min(1,pl.resT/480); }
    if(pl.res==='notgathered'){ }
    if(pl.resT>=560 && !pl.applied){ pl.applied=true; applyResult(); }
    if(pl.resT>=1200){ if(state==='play') nextPlay(); }
  }
}

// ---------- render ----------
function roundRect(x,y,w,h,r){ g.beginPath(); g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r); g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath(); }
function lerp(a,b,t){ return a+(b-a)*t; }

function drawField(){
  const gr=g.createLinearGradient(0,0,0,H); gr.addColorStop(0,'#173a24'); gr.addColorStop(0.5,'#1c6b39'); gr.addColorStop(1,'#2c9350'); g.fillStyle=gr; g.fillRect(0,0,W,H);
  // backstop wall (top)
  g.fillStyle='#3a4652'; g.fillRect(WALLL-16,BALLY-70,WALLR-WALLL+32,20);
  g.strokeStyle='rgba(255,255,255,0.12)'; g.lineWidth=1;
  for(let x=WALLL-16;x<=WALLR+16;x+=18){ g.beginPath(); g.moveTo(x,BALLY-70); g.lineTo(x,BALLY-50); g.stroke(); }
  // dirt band where ball caroms
  g.fillStyle='#b6793f'; g.fillRect(WALLL-16,BALLY-50,WALLR-WALLL+32,120);
  g.strokeStyle='rgba(255,255,255,0.5)'; g.lineWidth=3; g.strokeRect(WALLL-16,BALLY-50,WALLR-WALLL+32,120);
  // home plate + foul lines
  g.strokeStyle='rgba(255,255,255,0.5)'; g.lineWidth=3;
  g.beginPath(); g.moveTo(HOME.x,HOME.y); g.lineTo(180,300); g.moveTo(HOME.x,HOME.y); g.lineTo(720,300); g.stroke();
  g.fillStyle='#fff'; g.beginPath(); g.moveTo(HOME.x-13,HOME.y-8); g.lineTo(HOME.x+13,HOME.y-8); g.lineTo(HOME.x+13,HOME.y+2); g.lineTo(HOME.x,HOME.y+12); g.lineTo(HOME.x-13,HOME.y+2); g.closePath(); g.fill();
}
function drawFigure(x,y,col,sc,run,dive){
  g.save(); g.translate(x,y); g.scale(sc,sc);
  g.fillStyle='rgba(0,0,0,0.24)'; g.beginPath(); g.ellipse(0,8,15,5,0,0,6.28); g.fill();
  g.strokeStyle='#20303a'; g.lineWidth=6; g.lineCap='round'; const ph=run||0;
  g.beginPath(); g.moveTo(-4,-2); g.lineTo(-7+Math.sin(ph)*7,18); g.moveTo(4,-2); g.lineTo(7-Math.sin(ph)*7,18); g.stroke();
  g.fillStyle=col; roundRect(-10,-28,20,28,6); g.fill();
  g.strokeStyle=col; g.lineWidth=6;
  if(dive){ g.beginPath(); g.moveTo(-8,-20); g.lineTo(-22,-24); g.moveTo(8,-20); g.lineTo(20,-16); g.stroke(); }
  else { g.beginPath(); g.moveTo(-8,-20); g.lineTo(-16,-10+Math.sin(ph)*5); g.moveTo(8,-20); g.lineTo(16,-10-Math.sin(ph)*5); g.stroke(); }
  g.fillStyle='#f2c9a0'; g.beginPath(); g.arc(0,-38,8,0,6.28); g.fill();
  g.restore();
}
function drawBall(x,y,r){ r=r||8; g.fillStyle='#fff'; g.beginPath(); g.arc(x,y,r,0,6.28); g.fill();
  g.strokeStyle='#c33'; g.lineWidth=1.4; g.beginPath(); g.arc(x,y,r,0,6.28); g.stroke(); }

function drawScene(){
  if(!pl) return;
  // runner racing 3rd(-> upper-left) to home
  const rp = pl.phase==='chase'? Math.min(1,pl.t/pl.deadline) : (pl.res==='safe'||pl.res==='notgathered'? Math.min(1,0.9+pl.resT/1500):0.9);
  const rx=lerp(200,HOME.x-14,rp), ry=lerp(300,HOME.y-10,rp);
  drawFigure(rx,ry,'#e8433a',1.05,pl.t*0.03,false);
  // pitcher covering home
  drawFigure(HOME.x+22,HOME.y-14,'#3a6ee8',1.0,0,false);
  // catcher (player)
  const dive = pl.phase==='resolve'&&pl.gathered&&pl.resT<200;
  drawFigure(pl.catX, CATY, '#1746c8', 1.12, pl.phase==='chase'?Math.abs(dir||0)*(pl.t*0.05):0, dive);
  // catcher reach range indicator
  if(pl.phase==='chase'){ g.strokeStyle= Math.abs(pl.catX-pl.bx)<=catchRange()?'rgba(143,255,176,0.8)':'rgba(255,255,255,0.25)'; g.lineWidth= Math.abs(pl.catX-pl.bx)<=catchRange()?4:2;
    g.beginPath(); g.arc(pl.catX,CATY-6,catchRange()+8,0,6.28); g.stroke(); }
  // ball
  if(pl.phase==='chase'){ drawBall(pl.bx,pl.by,8); }
  else if(pl.res==='out'||pl.res==='safe'){ // thrown home
    const tx=lerp(pl.catX,HOME.x,pl.throwP), ty=lerp(CATY,HOME.y-16,pl.throwP)-Math.sin(pl.throwP*Math.PI)*40; drawBall(tx,ty,8); }
  else { drawBall(pl.bx,pl.by,8); }

  // cue + deadline bar
  if(pl.phase==='chase'){
    g.textAlign='center';
    const close=Math.abs(pl.catX-pl.bx)<=catchRange();
    if(pl.t<pl.bobbleUntil){ g.fillStyle='#ffb36a'; g.font='bold 24px sans-serif'; g.fillText('お手玉…立て直せ！',W/2,120); }
    else if(close){ g.fillStyle='#8fffb0'; g.font='bold 30px sans-serif'; g.strokeStyle='#000'; g.lineWidth=5; g.strokeText('重なった！ 捕れ！',W/2,120); g.fillText('重なった！ 捕れ！',W/2,120); }
    else { g.fillStyle='#cfe'; g.font='bold 20px sans-serif'; g.fillText('ボールに追いつけ！',W/2,120); }
    if(pl.clutch){ g.fillStyle='#ffe15a'; g.font='bold 18px sans-serif'; g.fillText('★ チャンス！ 2倍 ★',W/2,146); }
    // deadline (runner) bar
    const frac=1-pl.t/pl.deadline;
    g.fillStyle='rgba(0,0,0,0.4)'; roundRect(W/2-160,H-42,320,14,7); g.fill();
    g.fillStyle=frac>0.35?'#ffe15a':'#ff5a5a'; roundRect(W/2-158,H-40,316*Math.max(0,frac),10,5); g.fill();
    g.fillStyle='#cfe'; g.font='bold 12px sans-serif'; g.fillText('走者 本塁まで',W/2,H-48);
  }
}

function render(){
  g.clearRect(0,0,W,H);
  g.save(); if(shakeT>0){ const s=shakeT*13; g.translate((Math.random()-0.5)*s,(Math.random()-0.5)*s); }
  drawField();
  if(state!=='title') drawScene();
  for(const q of parts){ g.globalAlpha=Math.max(0,q.life); g.fillStyle=q.c; g.fillRect(q.x-2,q.y-2,4,4); }
  g.globalAlpha=1;
  g.restore();

  if(state==='play') drawHUD();
  for(const q of pops){ g.globalAlpha=Math.max(0,q.life); g.textAlign='center';
    if(q.big){ g.font='bold 36px sans-serif'; g.fillStyle=q.c; g.strokeStyle='#000'; g.lineWidth=5; g.strokeText(q.txt,W/2,q.y); g.fillText(q.txt,W/2,q.y); }
    else { g.font='bold 20px sans-serif'; g.fillStyle=q.c||'#fff'; g.strokeStyle='#000'; g.lineWidth=4; g.strokeText(q.txt,q.x||W/2,q.y); g.fillText(q.txt,q.x||W/2,q.y); } }
  g.globalAlpha=1;
  if(flash>0){ g.fillStyle='rgba(255,255,255,'+(flash*0.5)+')'; g.fillRect(0,0,W,H); }
  if(state==='title') drawTitle();
  if(state==='over') drawOver();
}
function drawHUD(){
  g.textAlign='left'; g.font='bold 26px sans-serif'; g.fillStyle='#fff'; g.strokeStyle='rgba(0,0,0,0.5)'; g.lineWidth=4;
  g.strokeText('SCORE '+score,20,36); g.fillText('SCORE '+score,20,36);
  g.font='bold 16px sans-serif'; g.strokeText('補殺 '+outs,22,60); g.fillText('補殺 '+outs,22,60);
  if(combo>1){ g.textAlign='center'; g.font='bold 20px sans-serif'; g.fillStyle='#ffe15a'; g.strokeText(combo+' 連続',W/2,40); g.fillText(combo+' 連続',W/2,40); }
  g.textAlign='right'; g.font='22px sans-serif'; g.fillStyle='#fff'; g.strokeText('失点',W-118,34); g.fillText('失点',W-118,34);
  for(let i=0;i<3;i++){ g.fillStyle=i<runsIn?'#ff5a5a':'rgba(255,255,255,0.28)'; g.beginPath(); g.arc(W-78+i*26,27,9,0,6.28); g.fill(); }
}
function drawTitle(){
  g.fillStyle='rgba(4,12,8,0.72)'; g.fillRect(0,0,W,H); g.textAlign='center';
  g.fillStyle='#8fffb0'; g.font='bold 46px sans-serif'; g.fillText('パスボール・リカバリー',W/2,H/2-100);
  g.fillStyle='#cfe'; g.font='20px sans-serif'; g.fillText('Chase It Down — 後逸を追って本塁で刺せ',W/2,H/2-62);
  g.font='17px sans-serif'; g.fillStyle='#bcd';
  g.fillText('後逸したボールがバックネットで跳ね回る。',W/2,H/2-26);
  g.fillText('捕手を動かして跳ね返りを読み、追いついて捕球。',W/2,H/2-2);
  g.fillText('外すとお手玉でロス。捕ったら自動で本塁送球。',W/2,H/2+22);
  g.fillText('走者が還る前に刺せ。3失点で終了。',W/2,H/2+46);
  g.fillStyle='#ffe15a'; g.font='bold 24px sans-serif'; g.fillText('クリック / タップ / SPACE で スタート',W/2,H/2+98);
  if(best>0){ g.fillStyle='#9fd'; g.font='16px sans-serif'; g.fillText('BEST '+best,W/2,H/2+128); }
}
function drawOver(){
  g.fillStyle='rgba(4,12,8,0.8)'; g.fillRect(0,0,W,H); g.textAlign='center';
  g.fillStyle='#ff6a6a'; g.font='bold 56px sans-serif'; g.fillText('3失点…降板',W/2,H/2-60);
  g.fillStyle='#fff'; g.font='bold 34px sans-serif'; g.fillText('SCORE '+score,W/2,H/2);
  g.font='20px sans-serif'; g.fillStyle='#cfe'; g.fillText('本塁補殺 '+outs+' 回',W/2,H/2+34);
  const nb=score>0&&score>=best; g.fillStyle=nb?'#ffe15a':'#9fd'; g.font='18px sans-serif';
  g.fillText(nb?'🎉 ベスト更新！ BEST '+best:'BEST '+best,W/2,H/2+64);
  g.fillStyle='#8fffb0'; g.font='bold 22px sans-serif'; g.fillText('クリック / タップ で もう一度',W/2,H/2+110);
}

let last=0;
function frame(t){ let dt=t-last; last=t; if(dt>60)dt=60; if(dt<0)dt=0; update(dt); render(); requestAnimationFrame(frame); }
requestAnimationFrame(frame);

// ---------- test hook ----------
window.__cd={
  start, scoop, setDir:(d)=>{ dir=d; },
  get state(){return state;}, get score(){return score;}, get outs(){return outs;}, get runsIn(){return runsIn;},
  get info(){ if(!pl) return null; return {
    phase:pl.phase, bx:Math.round(pl.bx), catX:Math.round(pl.catX), dist:Math.round(Math.abs(pl.catX-pl.bx)),
    canScoop:Math.abs(pl.catX-pl.bx)<=catchRange() && pl.t>=pl.bobbleUntil,
    timeLeft:Math.round(pl.deadline-pl.t), res:pl.res, clutch:!!pl.clutch, gathered:pl.gathered
  }; }
};
})();
</script>
</body>
</html>
