<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>変化球で仕留めろ (Filthy Breaker)</title>
<style>
  html,body{margin:0;padding:0;background:#0a1016;overflow:hidden;font-family:'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif;-webkit-user-select:none;user-select:none;touch-action:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 30%,#1b3450,#060b12 72%);}
  #stage{position:relative;width:min(100vw,calc(100vh*1.5));aspect-ratio:900/600;max-width:900px;box-shadow:0 10px 60px rgba(0,0,0,.6);border-radius:8px;overflow:hidden;}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;}
</style>
</head>
<body>
<div id="wrap"><div id="stage"><canvas id="cv"></canvas></div></div>
<script>
(function(){
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const W=900,H=600;let DPR=Math.min(2,window.devicePixelRatio||1);
function fit(){const r=cv.getBoundingClientRect();DPR=Math.min(2,window.devicePixelRatio||1);cv.width=Math.round(r.width*DPR);cv.height=Math.round(r.height*DPR);ctx.setTransform(cv.width/W,0,0,cv.height/H,0,0);}
new ResizeObserver(fit).observe(cv);fit();

// ---------- audio ----------
let AC=null;function actx(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function tone(f,d,type,v,sweep){const a=actx();if(!a)return;const o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.value=f;if(sweep)o.frequency.linearRampToValueAtTime(sweep,a.currentTime+d);g.gain.value=0.0001;g.gain.exponentialRampToValueAtTime(v||0.2,a.currentTime+0.008);g.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+d);o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+d+0.02);}
function noise(d,v,hp){const a=actx();if(!a)return;const n=a.createBufferSource(),b=a.createBuffer(1,a.sampleRate*d,a.sampleRate),dt=b.getChannelData(0);for(let i=0;i<dt.length;i++)dt[i]=Math.random()*2-1;n.buffer=b;const f=a.createBiquadFilter();f.type='highpass';f.frequency.value=hp||800;const g=a.createGain();g.gain.value=0.0001;g.gain.exponentialRampToValueAtTime(v||0.2,a.currentTime+0.01);g.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+d);n.connect(f);f.connect(g);g.connect(a.destination);n.start();n.stop(a.currentTime+d+0.02);}
const S={
  swish(){tone(700,0.05,'sine',0.05);},
  release(){noise(0.05,0.16,1200);tone(420,0.09,'sawtooth',0.12,240);},
  whiff(){noise(0.12,0.2,1000);},
  froze(){tone(180,0.5,'sine',0.22,90);tone(300,0.4,'triangle',0.14);},
  crush(){noise(0.28,0.4,300);tone(120,0.4,'sawtooth',0.3,60);},
  ball(){tone(240,0.24,'square',0.14,150);},
  strikeSet(){tone(660,0.1,'triangle',0.2);setTimeout(function(){tone(880,0.16,'triangle',0.22);},90);},
  combo(n){tone(560+Math.min(n,8)*70,0.12,'triangle',0.16);},
  over(){tone(330,0.3,'sine',0.2,160);setTimeout(function(){tone(220,0.5,'sine',0.2,110);},180);},
  start(){tone(440,0.1,'triangle',0.18);setTimeout(function(){tone(660,0.16,'triangle',0.2);},110);},
};

function clamp(v,a,b){return v<a?a:v>b?b:v;}
function rnd(a,b){return a+Math.random()*(b-a);}

// ---------- state ----------
let state='title';
let outs=0,fails=0,score=0,combo=0,lvl=1;   // outs = filthy breakers (K's)
let best=0;try{best=parseInt(localStorage.getItem('nb_best')||'0')||0;}catch(e){}
const TARGET=26;

let phase='wind';  // wind | aim | result
let pt=0, swp=0;
let period=1400, bandW=0.24, bandC=0.5, deadT=3000, tough=false;
let pos=0;
let decided=false, result='', stopPos=0, quality=0;
let parts=[];
let shakeT=0,flash=0;
let msg='',msgCol='#fff',msgT=0;
let ballU=0, breakAmt=0;
// gauge geometry (vertical, left)
const GX=140, GY0=150, GY1=470;

function reset(){outs=0;fails=0;score=0;combo=0;lvl=1;parts=[];}
function newPitch(){
  lvl=Math.min(7,1+Math.floor(outs/4));
  period=clamp(1560-lvl*110,860,1560);
  tough=Math.random()<clamp(0.2+lvl*0.05,0.2,0.5);
  bandW=clamp(0.26-lvl*0.02,0.12,0.26)*(tough?0.8:1);
  bandC=rnd(0.24,0.76);
  deadT=clamp(3200-lvl*180,1900,3200);
  phase='wind';pt=0;swp=0;pos=0;decided=false;result='';stopPos=0;quality=0;ballU=0;
}
function startGame(){reset();state='play';newPitch();S.start();}

function burst(x,y,col,n,sp){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=rnd(0.4,1)*(sp||3);parts.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:1,col:col,r:rnd(2,5)});}}

function gaugeY(p){return GY1+(GY0-GY1)*p;} // p=0 bottom, p=1 top

function resolve(kind){
  decided=true;result=kind;stopPos=pos;ballU=0;
  breakAmt=(pos-0.5); // -0.5..0.5, controls curve for the anim
  if(kind==='strike'){
    outs++;combo++;
    const half=bandW/2;quality=clamp(1-Math.abs(pos-bandC)/half,0,1);
    const cm=1+Math.min(combo-1,6)*0.14;
    const add=Math.round((100+quality*120)*cm)*Math.max(1,lvl);
    score+=add;lastAdd=add;
    S.release();setTimeout(function(){S.whiff();S.froze();},360);
    if(combo>1)setTimeout(function(){S.combo(combo);},520);
    flash=0.3;
    msg=(quality>0.7?'えぐいキレ！ 完全に泳がせた！':'鋭く曲がった！ 空振り三振コース')+'  +'+add;
    msgCol='#5affa0';msgT=1;
  }else{
    combo=0;fails++;
    S.release();flash=0.32;shakeT=0.7;
    if(result==='timeout'){msg='溜めすぎ！ タイミングを計られた';setTimeout(S.ball,300);}
    else if(pos<bandC){msg='甘い！ 変化しきれず棒球で痛打';setTimeout(S.crush,320);}
    else{msg='抜けた！ 曲がりすぎてボール';setTimeout(S.ball,300);}
    msgCol='#ff6a6a';msgT=1;
  }
  phase='result';pt=0;
}
let lastAdd=0;

function release(){
  if(state!=='play'||phase!=='aim'||decided)return;
  const half=bandW/2;
  if(Math.abs(pos-bandC)<=half)resolve('strike');
  else resolve('miss');
}

// ---------- input ----------
function act(){if(!AC)actx();if(state==='title'){startGame();return;}if(state==='over'){startGame();return;}release();}
cv.addEventListener('mousedown',function(e){e.preventDefault();act();});
cv.addEventListener('touchstart',function(e){e.preventDefault();act();},{passive:false});
window.addEventListener('keydown',function(e){
  if(e.code==='Space'||e.code==='ArrowUp'||e.code==='Enter'||e.code==='KeyK'){e.preventDefault();act();}
});

// ---------- update ----------
let last=0;
function update(dt){
  if(flash>0)flash=Math.max(0,flash-dt/300);
  if(shakeT>0)shakeT=Math.max(0,shakeT-dt/320);
  if(msgT>0)msgT=Math.max(0,msgT-dt/1500);
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.x+=p.vx;p.y+=p.vy;p.vy+=0.16;p.life-=dt/640;if(p.life<=0)parts.splice(i,1);}
  if(state!=='play')return;
  pt+=dt;
  if(phase==='wind'){
    if(pt>=420){phase='aim';pt=0;swp=0;}
  }else if(phase==='aim'){
    swp+=dt;
    const ph=(swp%period)/period;
    pos=1-Math.abs(2*ph-1);
    if(Math.floor(swp/(period/2))!==Math.floor((swp-dt)/(period/2)))S.swish();
    if(swp>=deadT&&!decided)resolve('timeout');
  }else if(phase==='result'){
    if(ballU<1)ballU=Math.min(1,ballU+dt/420);
    if(result==='strike'&&ballU>0.9&&Math.random()<0.2)burst(600,430,'#fff',1,1);
    if(pt>=1150){
      if(fails>=3){state='over';best=Math.max(best,score);try{localStorage.setItem('nb_best',String(best));}catch(e){}S.over();}
      else if(outs>=TARGET){state='over';best=Math.max(best,score);try{localStorage.setItem('nb_best',String(best));}catch(e){}S.start();}
      else newPitch();
    }
  }
}

// ---------- render ----------
function roundRect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

function drawField(){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#2a5a3a');g.addColorStop(1,'#1c4a2c');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#8a5a34';ctx.beginPath();ctx.ellipse(520,430,250,110,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#9a663a';ctx.beginPath();ctx.ellipse(460,200,52,24,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#c9c2b6';ctx.fillRect(452,196,16,5);
  // strike zone at plate
  const zx=430,zy=372,zw=64,zh=76;
  ctx.strokeStyle='rgba(255,255,255,.6)';ctx.lineWidth=2;ctx.strokeRect(zx,zy,zw,zh);
  ctx.strokeStyle='rgba(255,255,255,.18)';ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(zx+zw/3,zy);ctx.lineTo(zx+zw/3,zy+zh);ctx.moveTo(zx+2*zw/3,zy);ctx.lineTo(zx+2*zw/3,zy+zh);
  ctx.moveTo(zx,zy+zh/3);ctx.lineTo(zx+zw,zy+zh/3);ctx.moveTo(zx,zy+2*zh/3);ctx.lineTo(zx+zw,zy+2*zh/3);ctx.stroke();
  // catcher + batter
  ctx.fillStyle='#3b6b9b';ctx.fillRect(448,452,30,28);ctx.fillStyle='#243a52';ctx.beginPath();ctx.arc(463,448,10,0,Math.PI*2);ctx.fill();
  // batter
  ctx.save();ctx.translate(560,428);
  let sw=0;if(phase==='result'){ if(result==='strike')sw=clamp(ballU*1.5,0,1); else if(result==='miss'&&stopPos<bandC)sw=clamp(ballU*1.2,0,1); }
  ctx.fillStyle='#2a2a2a';ctx.fillRect(-10,26,9,28);ctx.fillRect(3,26,9,28);
  ctx.rotate(-sw*0.4);
  ctx.fillStyle='#c23b3b';ctx.fillRect(-13,-8,26,36);
  ctx.fillStyle='#f0c9a0';ctx.beginPath();ctx.arc(0,-20,10,0,Math.PI*2);ctx.fill();
  ctx.save();ctx.translate(-8,-4);let ba=-2.2+sw*3.0;ctx.rotate(ba);ctx.strokeStyle='#c98b3a';ctx.lineWidth=6;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(44,0);ctx.stroke();ctx.restore();
  ctx.restore();
}

function drawPitcher(){
  const cx=460,cy=180;
  ctx.fillStyle='#d8dde6';ctx.fillRect(cx-8,cy-18,16,22);
  ctx.fillStyle='#2a4a6b';ctx.fillRect(cx-8,cy+2,16,9);
  ctx.fillStyle='#f0c9a0';ctx.beginPath();ctx.arc(cx,cy-24,7,0,Math.PI*2);ctx.fill();
}

function drawBall(){
  if(phase!=='result')return;
  // ball path from mound (460,200) to the plate, curving by breakAmt; strike lands on the corner
  const u=ballU;
  const sx=460,sy=200;
  let ex,ey;
  if(result==='strike'){ ex=bandC<0.5?438:486; ey=440; } // paints a corner low
  else if(result==='miss'&&stopPos<bandC){ ex=462; ey=392; } // hangs middle (crushed)
  else { ex=520; ey=420; } // breaks out of zone (ball) / timeout
  const cx=(sx+ex)/2 + breakAmt*160;
  const x=(1-u)*(1-u)*sx+2*(1-u)*u*cx+u*u*ex;
  const y=(1-u)*(1-u)*sy+2*(1-u)*u*((sy+ey)/2)+u*u*ey;
  ctx.strokeStyle='rgba(255,255,255,.25)';ctx.lineWidth=2;ctx.setLineDash([4,5]);ctx.beginPath();
  for(let t=0;t<=u;t+=0.08){const xx=(1-t)*(1-t)*sx+2*(1-t)*t*cx+t*t*ex,yy=(1-t)*(1-t)*sy+2*(1-t)*t*((sy+ey)/2)+t*t*ey;if(t===0)ctx.moveTo(xx,yy);else ctx.lineTo(xx,yy);}
  ctx.stroke();ctx.setLineDash([]);
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(x,y,7,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='#d33';ctx.lineWidth=1;ctx.beginPath();ctx.arc(x-2,y,5,-0.7,0.7);ctx.stroke();
}

function drawGauge(){
  if(state!=='play')return;
  // vertical SNAP gauge on the left
  const gw=30;
  roundRect(GX-gw/2,GY0,gw,GY1-GY0,12);ctx.fillStyle='rgba(0,0,0,.45)';ctx.fill();
  // band
  const by0=gaugeY(clamp(bandC+bandW/2,0,1)), by1=gaugeY(clamp(bandC-bandW/2,0,1));
  const gg=ctx.createLinearGradient(0,by0,0,by1);gg.addColorStop(0,'rgba(90,220,150,.5)');gg.addColorStop(0.5,'rgba(60,255,150,.95)');gg.addColorStop(1,'rgba(90,220,150,.5)');
  ctx.fillStyle=gg;ctx.fillRect(GX-gw/2,by0,gw,by1-by0);
  roundRect(GX-gw/2,GY0,gw,GY1-GY0,12);ctx.strokeStyle='rgba(255,255,255,.45)';ctx.lineWidth=1.5;ctx.stroke();
  // labels
  ctx.textAlign='center';ctx.font='11px sans-serif';
  ctx.fillStyle='#ff9a9a';ctx.fillText('抜け(ボール)',GX,GY0-8);
  ctx.fillStyle='#ff9a9a';ctx.fillText('甘い(棒球)',GX,GY1+18);
  ctx.fillStyle='#9fffcf';ctx.font='bold 12px sans-serif';ctx.fillText('キレ',GX+gw/2+22,(by0+by1)/2+4);
  // marker
  if(phase==='aim'&&!decided){
    const my=gaugeY(pos);
    ctx.fillStyle='#fff';ctx.fillRect(GX-gw/2-6,my-2,gw+12,4);
    ctx.beginPath();ctx.moveTo(GX+gw/2+6,my);ctx.lineTo(GX+gw/2+16,my-6);ctx.lineTo(GX+gw/2+16,my+6);ctx.closePath();ctx.fill();
  }else if(phase==='result'){
    const my=gaugeY(stopPos);
    ctx.fillStyle=result==='strike'?'#5affa0':'#ff6a6a';ctx.fillRect(GX-gw/2-6,my-2,gw+12,4);
  }
  // timer
  if(phase==='aim'){const tl=clamp((deadT-swp)/deadT,0,1);roundRect(GX-gw/2,GY1+26,gw,6,3);ctx.fillStyle='rgba(0,0,0,.4)';ctx.fill();ctx.fillStyle=tl<0.28?'#ff6a6a':'#ffd23a';ctx.fillRect(GX-gw/2,GY1+26,gw*tl,6);}
}

function drawHUD(){
  ctx.textAlign='left';ctx.textBaseline='alphabetic';
  ctx.font='bold 20px sans-serif';ctx.fillStyle='#fff';
  ctx.fillText('三振 '+outs+' / '+TARGET,20,32);
  ctx.font='14px sans-serif';ctx.fillStyle='#ffb14a';ctx.fillText('被安打/四球 '+fails+' / 3',20,54);
  ctx.textAlign='right';
  ctx.font='bold 20px sans-serif';ctx.fillStyle='#ffe08a';ctx.fillText('SCORE '+score,W-20,32);
  ctx.font='13px sans-serif';ctx.fillStyle='#bfe';ctx.fillText('BEST '+Math.max(best,score)+'   Lv.'+lvl,W-20,52);
  if(combo>1){ctx.textAlign='center';ctx.font='bold 20px sans-serif';ctx.fillStyle='#5affa0';ctx.fillText(combo+' 連続奪三振!',450,300);}
  if(phase==='aim'&&!decided){ctx.textAlign='center';ctx.font='bold 16px sans-serif';ctx.fillStyle='#ffe08a';ctx.fillText('スナップ（キレ）を緑で止めて投げ込め！',450,300);}
}

function drawMsg(){
  if(msgT<=0)return;
  ctx.save();ctx.globalAlpha=clamp(msgT*1.4,0,1);
  ctx.textAlign='center';ctx.font='bold 24px sans-serif';
  ctx.fillStyle='rgba(0,0,0,.55)';roundRect(450-290,330,580,42,10);ctx.fill();
  ctx.fillStyle=msgCol;ctx.fillText(msg,450,358);
  ctx.restore();
}

function drawTitle(){
  drawField();
  ctx.save();ctx.textAlign='center';
  ctx.fillStyle='rgba(0,0,0,.64)';roundRect(100,104,700,392,16);ctx.fill();
  ctx.fillStyle='#fff';ctx.font='bold 34px sans-serif';ctx.fillText('変化球で仕留めろ',450,162);
  ctx.font='18px sans-serif';ctx.fillStyle='#9fe0bf';ctx.fillText('Filthy Breaker',450,192);
  ctx.font='16px sans-serif';ctx.fillStyle='#e6fcef';
  const lines=[
    'あなたはエース。上下に往復する“スナップ（キレ）”ゲージを、',
    '緑の「キレ」帯でピタリと止めて、えぐい変化球を投げ込め！',
    '緑ど真ん中＝鋭い変化で打者を泳がせて奪三振。',
    'ゲージが下（甘い）＝変化しきれず棒球で痛打。',
    'ゲージが上（抜け）＝曲がりすぎてボール。溜めすぎも見透かされる。',
    'タップ / クリック / SPACE で投球。3被安打/四球で交代。',
  ];
  for(let i=0;i<lines.length;i++)ctx.fillText(lines[i],450,236+i*30);
  ctx.fillStyle='#ffe08a';ctx.font='bold 22px sans-serif';
  ctx.fillText('タップ / SPACE でスタート',450,472);
  ctx.restore();
}

function drawOver(){
  drawField();
  ctx.save();ctx.textAlign='center';
  ctx.fillStyle='rgba(0,0,0,.64)';roundRect(190,150,520,300,16);ctx.fill();
  const w2=outs>=TARGET;
  ctx.fillStyle=w2?'#5affa0':'#ff8a5a';ctx.font='bold 34px sans-serif';
  ctx.fillText(w2?'奪三振の鬼！':'つかまった…',450,222);
  ctx.fillStyle='#fff';ctx.font='20px sans-serif';
  ctx.fillText('三振 '+outs+' / '+TARGET,450,270);
  ctx.fillText('スコア '+score,450,304);
  ctx.fillStyle='#ffe08a';ctx.fillText('ベスト '+Math.max(best,score),450,336);
  ctx.fillStyle='#9fe0bf';ctx.font='bold 20px sans-serif';
  ctx.fillText('タップ / SPACE でもう一度',450,404);
  ctx.restore();
}

function render(){
  ctx.save();
  if(shakeT>0){const s=shakeT*7;ctx.translate(rnd(-s,s),rnd(-s,s));}
  if(state==='title'){drawTitle();}
  else if(state==='over'){drawOver();}
  else{
    drawField();
    drawPitcher();
    drawBall();
    drawGauge();
    drawHUD();
    drawMsg();
  }
  for(const p of parts){ctx.globalAlpha=clamp(p.life,0,1);ctx.fillStyle=p.col;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();}
  ctx.globalAlpha=1;
  ctx.restore();
  if(flash>0){ctx.fillStyle='rgba(255,255,255,'+(flash*0.5)+')';ctx.fillRect(0,0,W,H);}
}

function frame(ts){let dt=ts-last;last=ts;if(dt>60)dt=60;if(dt<0)dt=0;update(dt);render();requestAnimationFrame(frame);}
requestAnimationFrame(frame);

// ---------- test hook ----------
window.__nb={
  start:startGame,
  pitch:release,
  get state(){return state;},
  get outs(){return outs;},
  get fails(){return fails;},
  get score(){return score;},
  get info(){return {state:state,phase:phase,swp:swp,pos:pos,bandC:bandC,bandW:bandW,period:period,deadT:deadT,timeLeft:(deadT-swp),tough:tough,decided:decided,result:result,quality:quality,outs:outs,fails:fails,lvl:lvl,inBand:(Math.abs(pos-bandC)<=bandW/2),dist:Math.abs(pos-bandC),canAct:(state==='play'&&phase==='aim'&&!decided)};}
};
})();
</script>
</body>
</html>
