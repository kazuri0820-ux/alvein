<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ねじ込め！ (Bundle It In)</title>
<style>
  html,body{margin:0;height:100%;background:#07120b;overflow:hidden;
    font-family:-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  #stage{position:relative;width:100vw;height:100vh;max-width:calc(100vh*1.5);max-height:calc(100vw/1.5);aspect-ratio:900/600;}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;border-radius:6px;}
</style>
</head>
<body>
<div id="wrap"><div id="stage"><canvas id="cv"></canvas></div></div>
<script>
(function(){
const W=900,H=600,cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let DPR=1;
function fit(){DPR=Math.min(2,window.devicePixelRatio||1);cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
fit();addEventListener('resize',fit);

// ---------- audio ----------
let AC=null;function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function tone(f,d,type,v,sweep){const a=ac();if(!a)return;const t=a.currentTime,o=a.createOscillator(),g=a.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(sweep)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+sweep),t+d);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v||0.2,t+0.008);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+0.02);}
function noise(d,v,hp){const a=ac();if(!a)return;const t=a.currentTime,n=Math.floor(a.sampleRate*d),buf=a.createBuffer(1,n,a.sampleRate),ch=buf.getChannelData(0);
  for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource();s.buffer=buf;
  const f=a.createBiquadFilter();f.type='highpass';f.frequency.value=hp||600;const g=a.createGain();g.gain.value=v||0.2;
  s.connect(f);f.connect(g);g.connect(a.destination);s.start(t);s.stop(t+d+0.02);}
let lastMashSnd=0;
const S={
  scuff:()=>{const now=performance.now(); if(now-lastMashSnd<28)return; lastMashSnd=now; noise(0.02,0.06,900);tone(220+Math.random()*80,0.03,'square',0.05);},
  goal:()=>{noise(0.06,0.14,500);[520,780,1040,1300].forEach((f,i)=>setTimeout(()=>tone(f,0.12,'triangle',0.18),i*55));},
  clear:()=>{noise(0.16,0.2,360);tone(200,0.16,'sawtooth',0.1,-50);},
  streak:()=>{[700,930,1170,1400].forEach((f,i)=>setTimeout(()=>tone(f,0.1,'triangle',0.16),i*60));},
  over:()=>{[440,330,247,175].forEach((f,i)=>setTimeout(()=>tone(f,0.3,'triangle',0.2),i*160));}
};

// ---------- geometry ----------
const LINEY=140;       // goal line (top); ball pushed up toward it
const STARTY=420;      // ball scramble start height

// ---------- state ----------
let state='title', phase='scramble', t=0, plays=0;
let score=0, combo=0, best=+(localStorage.getItem('bundle_best')||0);
let outs=0, fails=0, lvl=1;   // outs = goals bundled in
let clock=0, timeLimit=2600, defForce=0.24, impulse=0.06, p=0.42;
let result=null, resultT=0, msg='', tapKick=0, jostle=0, taps=0, recentTaps=[];
let shake=0, flash=0, flashCol='#fff', last=performance.now();
let parts=[], pops=[];

function rnd(a,b){return a+Math.random()*(b-a);}
function chance(pp){return Math.random()<pp;}
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function lerp(a,b,u){return a+(b-a)*u;}

function params(){ return {
  def:0.224+lvl*0.0055,
  time:Math.max(2320,2700-lvl*40),
  start:0.45-lvl*0.004
};}

function reset(){state='title';score=0;combo=0;outs=0;fails=0;lvl=1;plays=0;result=null;parts=[];pops=[];}
function newPlay(){
  plays++; lvl=Math.min(7,1+Math.floor(outs/4));
  const pa=params();
  defForce=pa.def; timeLimit=pa.time; impulse=0.06; p=pa.start;
  clock=0; result=null; phase='scramble'; msg=''; resultT=0; tapKick=0; jostle=0; taps=0; recentTaps=[];
}
function start(){ if(!ac())ac(); if(AC&&AC.state==='suspended')AC.resume(); reset(); state='play'; newPlay(); }

function mash(){
  if(state==='title'){start();return;}
  if(state==='over'){ if(resultT>0.4){reset();start();} return; }
  if(state!=='play'||phase!=='scramble') return;
  taps++; const now=performance.now(); recentTaps.push(now); if(recentTaps.length>10)recentTaps.shift();
  p=clamp(p+impulse,0,1.2); tapKick=1; jostle=Math.min(1,jostle+0.4); S.scuff();
  burst(W/2+rnd(-30,30), lerp(STARTY,LINEY,p), '#ffe08a', 3, 4);
  if(p>=1){ resolve('goal'); }
}

function resolve(kind){
  phase='result'; result=kind; resultT=0;
  if(kind==='goal'){
    outs++; combo++;
    let add=Math.round(120*(1+Math.min(9,combo-1)*0.15)); score+=add;
    S.goal(); flash=1;flashCol='#8affa0';shake=8; burst(W/2,LINEY+10,'#8affa0',26,8);
    pop(W/2,LINEY-6,'ねじ込んだ！ +'+add,'#d6ffe0');
    if(combo>=2)pop(W/2,LINEY+40,'コンボ x'+combo,'#ffd24d');
    if(combo>0&&combo%5===0)S.streak();
    msg='泥臭くねじ込んだ！ 混戦を制してゴール！';
  } else {
    fails++; combo=0; flash=1;flashCol='#ff5b5b';shake=8; S.clear();
    msg='かき出された…押し負けてクリアされた';
    pop(W/2,lerp(STARTY,LINEY,p),'クリア','#ffb0b0');
  }
  if(fails>=3){ state='over'; resultT=0; S.over(); if(score>best){best=score;localStorage.setItem('bundle_best',best);} }
}

// ---------- input ----------
cv.addEventListener('pointerdown',e=>{e.preventDefault();mash();});
addEventListener('keydown',e=>{ if(e.repeat)return; if(e.code==='Space'||e.code==='Enter'||e.code==='ArrowUp'||e.code==='KeyZ'||e.code==='KeyX'){e.preventDefault();mash();} });

// ---------- particles ----------
function burst(x,y,c,n,sp){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=rnd(sp*0.3,sp);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:1,c});}}
function pop(x,y,txt,c){pops.push({x,y,txt,c,life:1});}

// ---------- update ----------
function update(dt){
  shake*=Math.pow(0.86,dt/16.7); if(shake<0.3)shake=0;
  flash*=Math.pow(0.9,dt/16.7); tapKick*=Math.pow(0.82,dt/16.7); jostle*=Math.pow(0.86,dt/16.7);
  for(const pt of parts){pt.vx*=0.96;pt.vy=pt.vy*0.96+0.28;pt.x+=pt.vx*dt/16.7;pt.y+=pt.vy*dt/16.7;pt.life-=dt/16.7*0.03;}
  parts=parts.filter(pt=>pt.life>0);
  for(const pt of pops){pt.y-=dt/16.7*0.5;pt.life-=dt/16.7*0.02;}
  pops=pops.filter(pt=>pt.life>0);

  if(state!=='play'){ if(state==='over')resultT+=dt/1000; return; }
  t+=dt;
  if(phase==='scramble'){
    clock+=dt;
    p=clamp(p - defForce*dt/1000, 0, 1.2);
    if(p<=0.001){ resolve('clear'); return; }
    if(clock>=timeLimit){ resolve(p>=1?'goal':'clear'); return; }
    return;
  }
  if(phase==='result'){
    resultT+=dt/1000;
    if(resultT>1.1 && state==='play') newPlay();
    return;
  }
}

// ---------- render ----------
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function drawScene(){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#2a7a38');g.addColorStop(1,'#184a22');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='rgba(255,255,255,0.035)';
  for(let i=0;i<7;i++){ if(i%2===0)ctx.fillRect(0,i*H/7,W,H/7); }
  // goal (top)
  ctx.fillStyle='rgba(255,255,255,0.10)';ctx.fillRect(W/2-150,LINEY-56,300,56);
  ctx.strokeStyle='#f2f4f6';ctx.lineWidth=6;
  ctx.beginPath();ctx.moveTo(W/2-150,LINEY);ctx.lineTo(W/2-150,LINEY-56);ctx.lineTo(W/2+150,LINEY-56);ctx.lineTo(W/2+150,LINEY);ctx.stroke();
  ctx.strokeStyle='rgba(255,255,255,0.14)';ctx.lineWidth=1;
  for(let x=W/2-150;x<=W/2+150;x+=16){ctx.beginPath();ctx.moveTo(x,LINEY-54);ctx.lineTo(x,LINEY-2);ctx.stroke();}
  // goal line
  ctx.strokeStyle='rgba(255,255,255,0.85)';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(W/2-150,LINEY);ctx.lineTo(W/2+150,LINEY);ctx.stroke();
}
function drawFig(x,y,col,s){ s=s||1; ctx.fillStyle='rgba(0,0,0,0.22)';ctx.beginPath();ctx.ellipse(x,y+12*s,10*s,3.5*s,0,0,6.28);ctx.fill();
  ctx.fillStyle=col;rr(x-8*s,y-10*s,16*s,24*s,6);ctx.fill();
  ctx.fillStyle='#f2c9a0';ctx.beginPath();ctx.arc(x,y-14*s,6*s,0,6.28);ctx.fill(); }

function render(){
  ctx.save();
  if(shake>0)ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
  drawScene();

  if(state==='play'){
    const by = lerp(STARTY, LINEY, clamp(p,0,1));
    const jx = (Math.random()-0.5)*jostle*14;
    // scrum of bodies around the ball
    drawFig(W/2-34+jx*0.5, by+18, '#2b6cff',1.05);  // you (attacker)
    drawFig(W/2+30-jx*0.5, by+10, '#e23c3c',1.05);  // defender pushing
    drawFig(W/2+2, by+34, '#e23c3c',0.95);          // keeper/defender
    // the ball
    ctx.save();ctx.translate(W/2+jx, by);
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(0,0,11+tapKick*3,0,6.28);ctx.fill();
    ctx.strokeStyle='#333';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(0,0,11+tapKick*3,0.5,2.2);ctx.stroke();
    ctx.restore();

    // progress bar (ball toward the line)
    const bw=360,bx0=W/2-bw/2,byy=H-64;
    ctx.fillStyle='rgba(0,0,0,0.3)';rr(bx0-4,byy-4,bw+8,22,9);ctx.fill();
    ctx.fillStyle='rgba(255,255,255,0.12)';rr(bx0,byy,bw,14,6);ctx.fill();
    ctx.fillStyle= p>0.75?'#8affa0':(p<0.25?'#ff8a8a':'#ffd24d');rr(bx0,byy,bw*clamp(p,0,1),14,6);ctx.fill();
    ctx.strokeStyle='rgba(150,240,170,0.9)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(bx0+bw,byy-4);ctx.lineTo(bx0+bw,byy+18);ctx.stroke();
    ctx.fillStyle='rgba(255,255,255,0.7)';ctx.font='11px sans-serif';ctx.textAlign='left';ctx.fillText('押し返し',bx0,byy-8);
    ctx.textAlign='right';ctx.fillStyle='rgba(150,240,170,0.9)';ctx.fillText('ゴールライン',bx0+bw,byy-8);
    // time bar
    if(phase==='scramble'){ const u=clamp(clock/timeLimit,0,1);
      ctx.fillStyle='rgba(255,255,255,0.2)';rr(bx0,byy+24,bw,6,3);ctx.fill();
      ctx.fillStyle= u>0.7?'#ff6b6b':'#7fd0ff';rr(bx0,byy+24,bw*(1-u),6,3);ctx.fill(); }
  }

  for(const pt of parts){ctx.globalAlpha=Math.max(0,pt.life);ctx.fillStyle=pt.c;ctx.beginPath();ctx.arc(pt.x,pt.y,3.2,0,6.28);ctx.fill();}
  ctx.globalAlpha=1;
  for(const pt of pops){ctx.globalAlpha=Math.max(0,pt.life);ctx.fillStyle=pt.c;ctx.font='bold 22px sans-serif';ctx.textAlign='center';ctx.fillText(pt.txt,pt.x,pt.y);}
  ctx.globalAlpha=1;

  // HUD
  ctx.textAlign='left';ctx.fillStyle='#fff';ctx.font='bold 26px sans-serif';ctx.fillText('SCORE '+score,20,36);
  ctx.textAlign='right';ctx.fillStyle='rgba(255,255,255,0.9)';ctx.font='14px sans-serif';ctx.fillText('ゴール '+outs+'  Lv'+lvl,W-20,24);
  ctx.fillText('失敗',W-92,46);
  for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(W-60+i*20,41,7,0,6.28);ctx.fillStyle=i<fails?'#ff5b5b':'rgba(255,255,255,0.25)';ctx.fill();}
  if(combo>=2){ctx.textAlign='center';ctx.fillStyle='#ffd24d';ctx.font='bold 18px sans-serif';ctx.fillText('コンボ x'+combo,W/2,H-88);}

  if(state==='play'&&phase==='scramble'){ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,0.92)';ctx.font='bold 17px sans-serif';
    ctx.fillText('連打！ 連打で押し返しに競り勝ってゴールラインへねじ込め！',W/2,44);}
  if(state==='play'&&phase==='result'&&msg){ctx.textAlign='center';ctx.fillStyle=(result==='goal')?'#9ff0b8':'#ff9a9a';ctx.font='bold 20px sans-serif';ctx.fillText(msg,W/2,44);}

  if(state==='title'){
    ctx.fillStyle='rgba(5,12,7,0.78)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='bold 46px sans-serif';ctx.fillText('ねじ込め！',W/2,116);
    ctx.fillStyle='#ffd23e';ctx.font='bold 22px sans-serif';ctx.fillText('Bundle It In',W/2,152);
    ctx.fillStyle='rgba(255,255,255,0.92)';ctx.font='16px sans-serif';
    ctx.fillText('ゴール前の混戦。こぼれ球を泥臭く連打で押し込め',W/2,204);
    ctx.fillStyle='rgba(255,255,255,0.66)';ctx.font='14px sans-serif';
    ctx.fillText('相手（赤）がボールを押し返してくる。あなたは連打でゴールライン側へ押し込む',W/2,244);
    ctx.fillText('タップ / クリック / 連打キー（SPACE等）を速く連打するほどボールが前進',C(),268);
    ctx.fillText('押し返しに競り勝ってボールをゴールラインまで押し込めば“ねじ込みゴール”',W/2,292);
    ctx.fillText('連打が遅いと押し返されてクリア（＝失敗）。制限時間内に押し込め',W/2,316);
    ctx.fillText('上級ほど相手の押し返しが強く時間も短い。3失敗で交代',W/2,340);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で開始（そのまま連打！）',W/2,398);
    ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='14px sans-serif';ctx.fillText('BEST '+best,W/2,430);
  }
  if(state==='over'){
    ctx.fillStyle='rgba(5,12,7,0.84)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#ff6b6b';ctx.font='bold 46px sans-serif';ctx.fillText('3失敗…交代',W/2,222);
    ctx.fillStyle='#fff';ctx.font='bold 40px sans-serif';ctx.fillText('SCORE '+score,W/2,290);
    ctx.fillStyle='rgba(255,255,255,0.85)';ctx.font='19px sans-serif';ctx.fillText('ゴール '+outs+'   BEST '+best,W/2,330);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で もう一度',W/2,402);
  }

  if(flash>0.02){ctx.globalAlpha=flash*0.5;ctx.fillStyle=flashCol;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}
  ctx.restore();

  ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,0.4)';ctx.font='12px sans-serif';
  ctx.fillText('連打で相手の押し返しに競り勝ち、こぼれ球をゴールラインへねじ込む。押し負け/時間切れは失敗。3失敗で交代',W/2,H-8);
}
function C(){return W/2;}

function frame(ts){let dt=ts-last;last=ts;if(dt>60)dt=60;if(dt<0)dt=0;update(dt);render();requestAnimationFrame(frame);}
requestAnimationFrame(frame);

// ---------- test hook ----------
window.__bi={
  start, mash:()=>mash(),
  get state(){return state;},
  get score(){return score;},
  get outs(){return outs;},
  get fails(){return fails;},
  get info(){return {state,phase,p,clock,timeLimit,defForce,impulse,canMash:(phase==='scramble'),result,outs,fails,lvl};}
};
})();
</script>
</body>
</html>
