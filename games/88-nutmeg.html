<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>股抜きドリブル — Nutmeg Run</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{width:100%;height:100%;background:#08160c;overflow:hidden;
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,system-ui,sans-serif;
    touch-action:none;user-select:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  #stage{position:relative;aspect-ratio:900/600;max-width:100%;max-height:100%;
    width:auto;height:auto;box-shadow:0 0 60px rgba(0,0,0,.6);}
  canvas{display:block;width:100%;height:100%;border-radius:6px;cursor:pointer;}
</style>
</head>
<body>
<div id="wrap"><div id="stage"><canvas id="c" width="900" height="600"></canvas></div></div>
<script>
(function(){
"use strict";
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
const W=900,H=600;
let dpr=Math.max(1,Math.min(2,window.devicePixelRatio||1));
function fit(){ dpr=Math.max(1,Math.min(2,window.devicePixelRatio||1)); cv.width=W*dpr; cv.height=H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0); }
fit(); window.addEventListener('resize',fit);

// ---------- audio ----------
let AC=null;
function ac(){ if(!AC){ try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){AC=null;} } return AC; }
function tone(f,d,type,g,f2){ const a=ac(); if(!a)return; const o=a.createOscillator(),gg=a.createGain();
  o.type=type||'sine'; o.frequency.setValueAtTime(f,a.currentTime); if(f2)o.frequency.exponentialRampToValueAtTime(Math.max(30,f2),a.currentTime+d);
  gg.gain.setValueAtTime(0.0001,a.currentTime); gg.gain.exponentialRampToValueAtTime(g||0.2,a.currentTime+0.01);
  gg.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+d); o.connect(gg); gg.connect(a.destination); o.start(); o.stop(a.currentTime+d+0.02); }
function noise(d,g,cut){ const a=ac(); if(!a)return; const n=Math.floor(a.sampleRate*d),buf=a.createBuffer(1,n,a.sampleRate),ch=buf.getChannelData(0);
  for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(1-i/n); const src=a.createBufferSource(); src.buffer=buf;
  const f=a.createBiquadFilter(); f.type='lowpass'; f.frequency.value=cut||1200; const gg=a.createGain(); gg.gain.value=g||0.2;
  src.connect(f); f.connect(gg); gg.connect(a.destination); src.start(); }
const S={
  meg(c){ tone(420+Math.min(12,c)*26,0.06,'square',0.09,640); setTimeout(()=>tone(760,0.06,'sine',0.06),30); },
  push(){ tone(260,0.05,'sine',0.05,180); },
  tackle(){ noise(0.22,0.32,600); tone(160,0.28,'sawtooth',0.14,70); },
  combo(){ tone(700,0.08,'square',0.08,980); },
  over(){ noise(0.3,0.3,600); tone(150,0.4,'sawtooth',0.16,60); },
  cheer(){ const a=ac(); if(!a)return; noise(0.7,0.2,1900); for(let i=0;i<5;i++)setTimeout(()=>tone(500+Math.random()*320,0.3,'sine',0.05),i*46); }
};

// ---------- geometry ----------
const PY=470, PX=450;
const MEGY=410;                   // contact point (in front of the player, kept visible)
const ENGAGE=112, MEGWIN=27;

// ---------- state ----------
let state='title';
let megs=0, tackles=0, score=0, combo=0, bestCombo=0;
let best=+(localStorage.getItem('nm_best')||0);
let defs=[], nextSpawnY=0, scroll=0;
let parts=[], floats=[], shake=0, flashG=0, flashR=0, stumble=0, ballThru=0;
let last=performance.now();
const MAXTAK=3;

function reset(){ megs=0; tackles=0; score=0; combo=0; bestCombo=0; defs=[]; parts=[]; floats=[]; stumble=0; ballThru=0;
  // seed a couple defenders
  spawnDef(120); spawnDef(-90);
}
function level(){ return Math.floor(megs/5); }
function rr(a,b){ return a+Math.random()*(b-a); }
function scrollSpd(){ return 0.15+level()*0.018; }
function spawnGap(){ return Math.max(155, 300-level()*16); }

function spawnDef(y){
  const feint=Math.random()<Math.min(0.5,0.12+level()*0.06);
  defs.push({ y, feint, resolved:false, beaten:false, beatEl:0, color:['#e0524a','#d94f8a','#c94fd9'][ (Math.random()*3)|0 ] });
}

function legOpen(d){
  const dy=Math.abs(d.y-MEGY);
  if(dy<34) return true;                        // real open window at the contact point
  if(d.feint && d.y<MEGY-58 && d.y>MEGY-96) return true;  // fake early flash
  return false;
}

function nearestEngaged(){
  let best=null,bd=1e9; for(const d of defs){ if(d.resolved)continue; const dy=Math.abs(d.y-MEGY); if(dy<ENGAGE && dy<bd){bd=dy;best=d;} } return best;
}

function nutmeg(){
  if(state!=='play') return;
  const d=nearestEngaged(); if(!d) return;      // nothing to beat -> ignore
  const dy=Math.abs(d.y-MEGY);
  if(dy<MEGWIN && legOpen(d)){
    d.resolved=true; d.beaten=true; d.beatEl=0; megs++; combo++; if(combo>bestCombo)bestCombo=combo;
    const pts=100+combo*15; score+=pts; ballThru=1; flashG=0.3; S.meg(combo);
    floatText(PX,PY-40,'股抜き！ +'+pts,'#8effa8');
    for(let k=0;k<12;k++){ const a=Math.random()*Math.PI*2,s=rr(1,4); parts.push({x:PX,y:PY-10,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:1,col:k%2?'#8effa8':'#fff',g:0.13,sz:rr(2,4)}); }
    if(combo>=2){ S.combo(); } if(combo>0&&combo%6===0) setTimeout(()=>S.cheer(),140);
  }else{
    d.resolved=true; tackled(d);                 // mistimed poke -> tackled
  }
}
function tackled(d){
  tackles++; combo=0; flashR=0.6; shake=10; stumble=1; S.tackle();
  floatText(PX,PY-40,'奪われた…','#ff6b6b');
  for(let k=0;k<12;k++){ const a=Math.random()*Math.PI*2,s=rr(1,4); parts.push({x:PX,y:PY,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,col:'#ff6b6b',g:0.15,sz:rr(2,4)}); }
  if(tackles>=MAXTAK) setTimeout(gameOver,760);
}
function gameOver(){ state='over'; if(score>best){ best=score; try{localStorage.setItem('nm_best',best);}catch(e){} } S.over(); }
function floatText(x,y,t,c){ floats.push({x,y,t,c:c||'#fff',life:1}); }

// ---------- input ----------
function press(){ ac(); if(state==='title'){ reset(); state='play'; return; } if(state==='over'){ state='title'; return; } if(state==='play') nutmeg(); }
cv.addEventListener('pointerdown',e=>{ e.preventDefault(); ac(); press(); });
window.addEventListener('keydown',e=>{ if(e.code==='Space'||e.code==='Enter'||e.code==='ArrowUp'){ e.preventDefault(); press(); } });

// ---------- update ----------
function update(dt){
  if(shake>0)shake=Math.max(0,shake-dt/24);
  if(flashG>0)flashG=Math.max(0,flashG-dt/280);
  if(flashR>0)flashR=Math.max(0,flashR-dt/360);
  if(stumble>0)stumble=Math.max(0,stumble-dt/400);
  if(ballThru>0)ballThru=Math.max(0,ballThru-dt/300);
  for(const p of parts){ p.x+=p.vx; p.y+=p.vy; p.vy+=p.g; p.life-=dt/900; } parts=parts.filter(p=>p.life>0);
  for(const f of floats){ f.y-=dt*0.02; f.life-=dt/1000; } floats=floats.filter(f=>f.life>0);
  if(state!=='play') return;
  const sp=scrollSpd()*dt; scroll+=sp;
  for(const d of defs){ d.y+=sp; if(d.beaten) d.beatEl+=dt; }
  // unresolved defender passes the contact point -> tackled (didn't beat them)
  for(const d of defs){ if(!d.resolved && d.y>MEGY+MEGWIN+2){ d.resolved=true; tackled(d); } }
  // cull passed defenders
  defs=defs.filter(d=> d.y<H+80);
  // keep the stream fed: spawn a new defender above whenever the topmost has descended past the gap
  let topy=9999; for(const d of defs) if(d.y<topy)topy=d.y;
  if(defs.length===0) topy=PY;
  if(topy > -spawnGap()){ spawnDef(topy - spawnGap()); }
}

// ---------- render ----------
function pitch(){
  let g=ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,'#134020'); g.addColorStop(1,'#1c5a2c');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  // scrolling stripes for motion
  const off=scroll%80;
  for(let i=-1;i<9;i++){ const y=i*80+off; ctx.fillStyle=(i%2===0)?'rgba(255,255,255,0.03)':'rgba(0,0,0,0.05)'; ctx.fillRect(0,y,W,40); }
  // channel guides
  ctx.strokeStyle='rgba(255,255,255,0.12)'; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(PX-120,0); ctx.lineTo(PX-120,H); ctx.moveTo(PX+120,0); ctx.lineTo(PX+120,H); ctx.stroke();
}
function drawDefender(d){
  const beaten=d.beaten; const open=legOpen(d);
  ctx.save(); ctx.translate(PX, d.y);
  if(beaten){ const e=Math.min(1,d.beatEl/300); ctx.globalAlpha=Math.max(0,1-e); ctx.rotate(e*0.8); ctx.translate(0,e*10); }
  // shadow
  ctx.fillStyle='rgba(0,0,0,0.2)'; ctx.beginPath(); ctx.ellipse(0,20,15,5,0,0,Math.PI*2); ctx.fill();
  // legs (spread when open)
  const spread=open&&!beaten?17:6;
  ctx.strokeStyle=d.color; ctx.lineWidth=7; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(-4,4); ctx.lineTo(-spread,22); ctx.moveTo(4,4); ctx.lineTo(spread,22); ctx.stroke();
  // body + head
  ctx.fillStyle=d.color; ctx.beginPath(); ctx.ellipse(0,-8,13,17,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#f0c9a0'; ctx.beginPath(); ctx.arc(0,-30,9,0,Math.PI*2); ctx.fill();
  // open-window highlight between legs
  if(open&&!beaten){ const gg=ctx.createRadialGradient(0,16,1,0,16,20); gg.addColorStop(0,'rgba(140,255,168,0.5)'); gg.addColorStop(1,'rgba(140,255,168,0)'); ctx.fillStyle=gg; ctx.fillRect(-20,-4,40,40); }
  ctx.restore();
}
function player(){
  const sx=stumble>0?Math.sin(stumble*40)*4:0;
  ctx.save(); ctx.translate(PX+sx,PY);
  ctx.fillStyle='rgba(0,0,0,0.22)'; ctx.beginPath(); ctx.ellipse(0,22,15,5,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#3aa0ff'; ctx.beginPath(); ctx.ellipse(0,-6,13,18,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#f0c9a0'; ctx.beginPath(); ctx.arc(0,-30,9,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle='#3aa0ff'; ctx.lineWidth=7; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(-3,10); ctx.lineTo(-7,26); ctx.moveTo(3,10); ctx.lineTo(7,26); ctx.stroke();
  ctx.restore();
  // ball (pushed ahead; darts forward through legs on a meg)
  const by=PY-26-ballThru*40;
  ctx.fillStyle='rgba(0,0,0,0.2)'; ctx.beginPath(); ctx.ellipse(PX,PY-8,7,3,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(PX,by,8,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#222'; ctx.beginPath(); ctx.arc(PX,by,2.5,0,Math.PI*2); ctx.fill();
}
function hud(){
  ctx.save(); ctx.textBaseline='middle';
  ctx.fillStyle='rgba(6,20,10,0.4)'; ctx.fillRect(0,0,W,42);
  for(let i=0;i<MAXTAK;i++){ ctx.fillStyle=i<(MAXTAK-tackles)?'#8effa8':'#334'; ctx.beginPath(); ctx.arc(24+i*24,15,8,0,Math.PI*2); ctx.fill(); }
  ctx.fillStyle='#9fdcb0'; ctx.font='bold 12px sans-serif'; ctx.textAlign='left'; ctx.fillText('キープ',24+MAXTAK*24-4,15);
  ctx.textAlign='center'; ctx.fillStyle='#fff'; ctx.font='bold 24px sans-serif'; ctx.fillText('SCORE '+score,W/2,17);
  ctx.fillStyle='#cfe0ee'; ctx.font='bold 12px sans-serif'; ctx.fillText('股抜き '+megs+'　BEST '+best,W/2,35);
  if(combo>=2){ ctx.textAlign='right'; ctx.fillStyle='#ffd23e'; ctx.font='bold 19px sans-serif'; ctx.fillText('連続 ×'+combo,W-18,18); }
  ctx.restore();
}
function drawTitle(){
  ctx.save(); ctx.fillStyle='rgba(4,14,8,0.6)'; ctx.fillRect(0,0,W,H);
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillStyle='#fff'; ctx.font='bold 56px sans-serif'; ctx.fillText('股抜きドリブル',W/2,124);
  ctx.fillStyle='#ffd23e'; ctx.font='bold 21px sans-serif'; ctx.fillText('Nutmeg Run — 股を抜いて抜き去れ',W/2,168);
  ctx.fillStyle='#dfe6f0'; ctx.font='16px sans-serif';
  const lines=['向かってくるDFの股（足の間）を抜いて突破！','タップ / スペースでボールを通す。','足が開いて緑に光った“今”に合わせろ。','早すぎ・遅すぎ、フェイントの空き（早い開き）に釣られると奪われる。','ボールを3回失うとゲームオーバー。'];
  for(let i=0;i<lines.length;i++) ctx.fillText(lines[i],W/2,228+i*29);
  ctx.fillStyle='#8effa8'; ctx.font='bold 22px sans-serif'; ctx.fillText('タップでキックオフ',W/2,H-72);
  if(best>0){ ctx.fillStyle='#9fb0c8'; ctx.font='15px sans-serif'; ctx.fillText('ベストスコア '+best,W/2,H-44); }
  ctx.restore();
}
function drawOver(){
  ctx.save(); ctx.fillStyle='rgba(4,14,8,0.76)'; ctx.fillRect(0,0,W,H);
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillStyle='#fff'; ctx.font='bold 46px sans-serif'; ctx.fillText('ボールロスト',W/2,132);
  ctx.fillStyle='#ffd23e'; ctx.font='bold 64px sans-serif'; ctx.fillText(score+' pts',W/2,206);
  const stats=[['股抜き数',megs+' 回'],['最高連続',bestCombo+' 連続'],['被奪取',tackles]];
  ctx.font='19px sans-serif';
  for(let i=0;i<stats.length;i++){ const yy=272+i*36; ctx.textAlign='right'; ctx.fillStyle='#9fb0c8'; ctx.fillText(stats[i][0],W/2-14,yy); ctx.textAlign='left'; ctx.fillStyle='#fff'; ctx.fillText(''+stats[i][1],W/2+14,yy); }
  if(score>=best&&score>0){ ctx.textAlign='center'; ctx.fillStyle='#8effa8'; ctx.font='bold 20px sans-serif'; ctx.fillText('★ ベスト更新！ ★',W/2,272+stats.length*36+6); }
  ctx.textAlign='center'; ctx.fillStyle='#8effa8'; ctx.font='bold 20px sans-serif'; ctx.fillText('タップでもう一度',W/2,H-54);
  ctx.restore();
}
function render(){
  ctx.save(); if(shake>0) ctx.translate(rr(-shake,shake),rr(-shake,shake));
  pitch();
  if(state==='play'){ for(const d of defs) drawDefender(d); player(); }
  for(const p of parts){ ctx.globalAlpha=Math.max(0,p.life); ctx.fillStyle=p.col; ctx.fillRect(p.x,p.y,p.sz,p.sz); }
  ctx.globalAlpha=1;
  for(const f of floats){ ctx.globalAlpha=Math.max(0,f.life); ctx.fillStyle=f.c; ctx.font='bold 22px sans-serif'; ctx.textAlign='center'; ctx.fillText(f.t,f.x,f.y); }
  ctx.globalAlpha=1;
  if(state==='play') hud();
  ctx.restore();
  if(flashG>0){ ctx.fillStyle='rgba(140,255,168,'+(flashG*0.18)+')'; ctx.fillRect(0,0,W,H); }
  if(flashR>0){ ctx.fillStyle='rgba(255,60,60,'+(flashR*0.32)+')'; ctx.fillRect(0,0,W,H); }
  if(state==='title') drawTitle();
  if(state==='over') drawOver();
}
function frame(now){ let dt=now-last; last=now; if(dt>60)dt=60; update(dt); render(); requestAnimationFrame(frame); }
requestAnimationFrame(frame);

// ---------- test hook ----------
window.__nm={
  get state(){return state;},
  get megs(){return megs;}, get tackles(){return tackles;}, get score(){return score;}, get combo(){return combo;},
  get next(){ const d=nearestEngaged(); if(!d)return null; return {dy:d.y-MEGY, ady:Math.abs(d.y-MEGY), open:legOpen(d), feint:d.feint, megwin:MEGWIN}; },
  nutmeg(){ nutmeg(); }, tap(){ press(); }, start(){ if(state!=='play')press(); }
};
})();
</script>
</body>
</html>
