<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>コーナーデリバリー (Corner Delivery)</title>
<style>
  html,body{margin:0;height:100%;background:#07120b;overflow:hidden;
    font-family:-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  #stage{position:relative;width:100vw;height:100vh;max-width:calc(100vh*1.5);max-height:calc(100vw/1.5);aspect-ratio:900/600;}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;border-radius:6px;}
</style>
</head>
<body>
<div id="wrap"><div id="stage"><canvas id="cv"></canvas></div></div>
<script>
(function(){
const W=900,H=600,cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let DPR=1;
function fit(){DPR=Math.min(2,window.devicePixelRatio||1);cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
fit();addEventListener('resize',fit);

// ---------- audio ----------
let AC=null;function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function tone(f,d,type,v,sweep){const a=ac();if(!a)return;const t=a.currentTime,o=a.createOscillator(),g=a.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(sweep)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+sweep),t+d);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v||0.2,t+0.008);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+0.02);}
function noise(d,v,hp){const a=ac();if(!a)return;const t=a.currentTime,n=Math.floor(a.sampleRate*d),buf=a.createBuffer(1,n,a.sampleRate),ch=buf.getChannelData(0);
  for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource();s.buffer=buf;
  const f=a.createBiquadFilter();f.type='highpass';f.frequency.value=hp||600;const g=a.createGain();g.gain.value=v||0.2;
  s.connect(f);f.connect(g);g.connect(a.destination);s.start(t);s.stop(t+d+0.02);}
const S={
  whip:()=>{noise(0.12,0.14,700);tone(360,0.1,'sine',0.06,240);},
  head:()=>{noise(0.05,0.18,1200);tone(220,0.05,'square',0.07,-60);},
  good:()=>{[680,940,1220].forEach((f,i)=>setTimeout(()=>tone(f,0.1,'triangle',0.16),i*55));},
  big:()=>{[600,800,1000,1250].forEach((f,i)=>setTimeout(()=>tone(f,0.12,'triangle',0.17),i*80));},
  bad:()=>{noise(0.18,0.2,300);tone(150,0.22,'sawtooth',0.11,-50);},
  streak:()=>{[700,930,1170,1400].forEach((f,i)=>setTimeout(()=>tone(f,0.1,'triangle',0.16),i*60));},
  over:()=>{[440,330,247,175].forEach((f,i)=>setTimeout(()=>tone(f,0.3,'triangle',0.2),i*160));}
};

// ---------- geometry ----------
const GOAL={lx:330,rx:570,top:96,mouth:150};
const NEAR={x:372,y:172};   // near post target zone
const FAR={x:528,y:172};    // far post target zone
const GKY=126;
const KICK={x:70,y:512};    // corner taker
const BTN=[
  {k:'near', x:150,label:'ニアへ ←',sub:'手前のポスト',col:'#3fc46b'},
  {k:'far',  x:520,label:'ファーへ →',sub:'奥のポスト',col:'#3fc46b'}
];
const BW=230, BY=508, BH=64;

// ---------- state ----------
let state='title', phase='set', plays=0;
let score=0, combo=0, best=+(localStorage.getItem('cdel_best')||0);
let outs=0, fails=0, lvl=1;   // outs = goals created
let clock=0, revealT=520, callWin=980, gkGuard='near', tough=false;
let decided=false, call=null, result=null, resultT=0, msg='', msgOk=false;
let gkU=0, ballFly=0; // gkU: gk slide 0..1 toward guarded post ; ballFly: whipped ball progress
let shake=0, flash=0, flashCol='#fff', last=performance.now();
let parts=[], pops=[];

function rnd(a,b){return a+Math.random()*(b-a);}
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function lerp(a,b,u){return a+(b-a)*u;}
function easeOut(u){return 1-Math.pow(1-u,2);}

function openPost(){return gkGuard==='near'?'far':'near';}
function reset(){state='title';score=0;combo=0;outs=0;fails=0;lvl=1;plays=0;result=null;parts=[];pops=[];gkU=0;ballFly=0;}

function newPlay(){
  plays++; lvl=Math.min(7,1+Math.floor(outs/4));
  revealT=clamp(560-lvl*24,360,560);
  callWin=clamp(1020-lvl*70,560,1020);
  tough=Math.random()<clamp(0.2+lvl*0.05,0.2,0.5);
  gkGuard=(Math.random()<0.5?'near':'far');
  phase='set'; clock=0; decided=false; call=null; result=null; resultT=0; msg=''; msgOk=false;
  gkU=0; ballFly=0;
  S.whip();
}
function start(){ if(!ac())ac(); if(AC&&AC.state==='suspended')AC.resume(); reset(); state='play'; newPlay(); }

function makeCall(c){
  if(state==='title'){start();return;}
  if(state==='over'){ if(resultT>0.4){reset();start();} return; }
  if(state!=='play'||phase!=='set'||decided) return;
  if(clock<revealT){ decided=true; call=c; resolve('early'); return; }
  decided=true; call=c;
  resolve(c===openPost()?'good':'wrong');
}

function resolve(k){
  phase='result'; result=k; resultT=0;
  if(k==='good'){
    outs++; combo++;
    let add=Math.round((tough?250:150)*(1+Math.min(9,combo-1)*0.14)); score+=add;
    S.whip(); setTimeout(S.head,360); setTimeout(S.good,440); if(tough)setTimeout(S.big,520);
    msgOk=true; flash=1;flashCol='#8affa0';shake=5;
    const tp=(call==='near')?NEAR:FAR; burst(tp.x,tp.y,'#8affa0',16,7);
    pop(W/2,250,(tough?'ピンポイント！ ヘッドでゴール！ +':'ドンピシャ！ ヘッドでゴール！ +')+add,'#d6ffe0');
    if(combo>=2)pop(W/2,150,'コンボ x'+combo,'#ffd24d');
    if(combo>0&&combo%5===0)S.streak();
    msg=(call==='near')?'GKはファーを固めた——空いたニアへ速いボールを送って味方がヘッドで正解':'GKはニアを固めた——空いたファーへ流し込んで味方がヘッドで正解';
  } else {
    fails++; combo=0; msgOk=false; flash=1;flashCol='#ff5b5b';shake=9; S.bad();
    if(k==='early'){ msg='早い…GKがどちらのポストを固めるか見極める前に蹴るな'; pop(W/2,250,'早すぎ…','#ffb0b0'); }
    else { msg=(gkGuard==='near')?'GKが固めたニアへ蹴ってしまい弾かれた——空いていたのはファー':'GKが固めたファーへ蹴ってしまい弾かれた——空いていたのはニア'; pop(W/2,250,'GKにキャッチ…','#ffb0b0'); }
  }
  if(fails>=3){ state='over'; resultT=0; S.over(); if(score>best){best=score;localStorage.setItem('cdel_best',best);} }
}

// ---------- input ----------
cv.addEventListener('pointerdown',e=>{e.preventDefault();
  if(state!=='play'||phase!=='set'){ makeCall('near'); return; }
  const r=cv.getBoundingClientRect(); const x=(e.clientX-r.left)/r.width*W, y=(e.clientY-r.top)/r.height*H;
  for(const b of BTN){ if(x>=b.x&&x<=b.x+BW&&y>=BY&&y<=BY+BH){ makeCall(b.k); return; } }
  makeCall(x<W*0.5?'near':'far');
});
addEventListener('keydown',e=>{ if(e.repeat)return;
  if(e.code==='ArrowLeft'||e.code==='KeyA'){e.preventDefault();makeCall('near');}
  else if(e.code==='ArrowRight'||e.code==='KeyD'){e.preventDefault();makeCall('far');}
  else if(e.code==='Space'||e.code==='Enter'){e.preventDefault(); if(state!=='play')makeCall('near');} });

// ---------- particles ----------
function burst(x,y,c,n,sp){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=rnd(sp*0.3,sp);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:1,c});}}
function pop(x,y,txt,c){pops.push({x,y,txt,c,life:1});}

// ---------- update ----------
function update(dt){
  shake*=Math.pow(0.86,dt/16.7); if(shake<0.3)shake=0;
  flash*=Math.pow(0.9,dt/16.7);
  for(const p of parts){p.vx*=0.96;p.vy=p.vy*0.96+0.28;p.x+=p.vx*dt/16.7;p.y+=p.vy*dt/16.7;p.life-=dt/16.7*0.026;}
  parts=parts.filter(p=>p.life>0);
  for(const p of pops){p.y-=dt/16.7*0.5;p.life-=dt/16.7*0.02;}
  pops=pops.filter(p=>p.life>0);

  if(state!=='play'){ if(state==='over')resultT+=dt/1000; return; }
  if(phase==='set'){ clock+=dt;
    // GK slides to guarded post after reveal
    if(clock>=revealT) gkU=lerp(gkU,1,0.16);
    if(!decided && clock>revealT+callWin){ decided=true; call=null; resolve('late'); }
    return; }
  if(phase==='result'){ resultT+=dt/1000; gkU=lerp(gkU,1,0.16);
    if(result==='good') ballFly=lerp(ballFly,1,0.12);
    if(resultT>1.6) newPlay(); return; }
}

// ---------- render ----------
function drawField(){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#12703f');g.addColorStop(0.5,'#0f5e34');g.addColorStop(1,'#0c4c2b');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  for(let i=0;i<8;i++){ctx.fillStyle=i%2?'rgba(255,255,255,0.03)':'rgba(0,0,0,0.03)';ctx.fillRect(0,i*80,W,80);}
  // penalty box
  ctx.strokeStyle='rgba(255,255,255,0.28)';ctx.lineWidth=2;
  ctx.strokeRect(230,GOAL.mouth,440,190);
  ctx.strokeRect(330,GOAL.mouth,240,80);
  ctx.beginPath();ctx.arc(450,GOAL.mouth+190,54,0.15*Math.PI,0.85*Math.PI);ctx.stroke();
  // corner arc
  ctx.beginPath();ctx.arc(30,540,26,-0.5*Math.PI,0);ctx.stroke();
}
function drawGoal(){
  // net
  ctx.fillStyle='rgba(255,255,255,0.06)';ctx.fillRect(GOAL.lx,GOAL.top,GOAL.rx-GOAL.lx,GOAL.mouth-GOAL.top);
  ctx.strokeStyle='rgba(255,255,255,0.22)';ctx.lineWidth=1;
  for(let x=GOAL.lx+10;x<GOAL.rx;x+=14){ctx.beginPath();ctx.moveTo(x,GOAL.top);ctx.lineTo(x,GOAL.mouth);ctx.stroke();}
  for(let y=GOAL.top+8;y<GOAL.mouth;y+=12){ctx.beginPath();ctx.moveTo(GOAL.lx,y);ctx.lineTo(GOAL.rx,y);ctx.stroke();}
  // frame
  ctx.strokeStyle='#f4f4f4';ctx.lineWidth=5;
  ctx.beginPath();ctx.moveTo(GOAL.lx,GOAL.mouth);ctx.lineTo(GOAL.lx,GOAL.top);ctx.lineTo(GOAL.rx,GOAL.top);ctx.lineTo(GOAL.rx,GOAL.mouth);ctx.stroke();
}
function person(x,y,col,s){s=s||1;
  ctx.fillStyle=col;ctx.beginPath();ctx.ellipse(x,y-16*s,10*s,16*s,0,0,6.28);ctx.fill();
  ctx.fillStyle='#f0c9a0';ctx.beginPath();ctx.arc(x,y-36*s,7.5*s,0,6.28);ctx.fill();
}
function drawGK(){
  const cx=lerp(450,(gkGuard==='near'?NEAR.x-6:FAR.x+6),(phase==='set'||phase==='result')?gkU:0);
  const arm=(phase==='result'&&result!=='good')?1:0;
  ctx.save();ctx.translate(cx,GKY);
  ctx.fillStyle='#ffd23e';ctx.beginPath();ctx.ellipse(0,-14,11,17,0,0,6.28);ctx.fill();
  ctx.fillStyle='#f0c9a0';ctx.beginPath();ctx.arc(0,-36,8,0,6.28);ctx.fill();
  ctx.strokeStyle='#ffd23e';ctx.lineWidth=6;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(-8,-24);ctx.lineTo(-18,-40+arm*10);ctx.moveTo(8,-24);ctx.lineTo(18,-40+arm*10);ctx.stroke();
  ctx.restore();
}

function render(){
  ctx.save();
  if(shake>0)ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
  drawField();
  drawGoal();

  if(state==='play'||state==='over'){
    const revealed=(phase==='set'&&clock>=revealT)||phase==='result';

    // target attackers at both posts (blue). Highlight the OPEN one once revealed.
    for(const pt of [{p:'near',o:NEAR},{p:'far',o:FAR}]){
      const isOpen=revealed&&openPost()===pt.p;
      // defender marking (red) at the guarded post
      if(revealed&&gkGuard===pt.p){ person(pt.o.x+16,pt.o.y+4,'#d0403a',0.82); }
      person(pt.o.x,pt.o.y,'#2b6fd6',0.9);
      if(isOpen){ ctx.strokeStyle='rgba(140,255,170,0.95)';ctx.lineWidth=3;ctx.setLineDash([6,5]);
        ctx.beginPath();ctx.arc(pt.o.x,pt.o.y-20,26+Math.sin(clock*0.02)*2,0,6.28);ctx.stroke();ctx.setLineDash([]);
        ctx.fillStyle='rgba(150,255,170,0.95)';ctx.font='bold 13px sans-serif';ctx.textAlign='center';ctx.fillText('フリー！',pt.o.x,pt.o.y-46); }
    }

    // corner taker
    person(KICK.x,KICK.y,'#2b6fd6',0.95);

    // ball
    let bx=KICK.x-6,by=KICK.y-14;
    if(phase==='result'&&result==='good'){
      const tp=(call==='near')?NEAR:FAR; const u=easeOut(ballFly);
      // whipped arc from corner to post then dip into goal
      if(u<0.7){ const uu=u/0.7; bx=lerp(KICK.x-6,tp.x,uu); by=lerp(KICK.y-14,tp.y-18,uu)-Math.sin(uu*Math.PI)*70; }
      else { const uu=(u-0.7)/0.3; bx=lerp(tp.x,tp.x+(call==='near'?18:-18),uu); by=lerp(tp.y-18,GOAL.top+22,uu); }
    }
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(bx,by,7.5,0,6.28);ctx.fill();
    ctx.strokeStyle='#222';ctx.lineWidth=1.2;
    ctx.beginPath();ctx.moveTo(bx-6,by-4);ctx.lineTo(bx+2,by-9);ctx.lineTo(bx+7,by-2);ctx.lineTo(bx+3,by+6);ctx.lineTo(bx-6,by+5);ctx.closePath();ctx.stroke();

    // cue banner + timer
    ctx.textAlign='center';
    if(state==='play'&&phase==='set'){
      if(clock<revealT){ ctx.fillStyle='rgba(255,220,90,0.95)';ctx.font='bold 21px sans-serif';ctx.fillText('コーナー！ GKがどちらのポストを固めるか見極めろ',W/2,54); }
      else { ctx.fillStyle='rgba(255,220,120,0.98)';ctx.font='bold 23px sans-serif';ctx.fillText('空いたポストへ蹴り込め！',W/2,54);
        const p=clamp((clock-revealT)/callWin,0,1),bw=250,x=W/2-bw/2,y=66;
        ctx.fillStyle='rgba(255,255,255,0.18)';ctx.fillRect(x,y,bw,7);ctx.fillStyle=p<0.7?'#8affa0':(p<1?'#ffd24d':'#ff5b5b');ctx.fillRect(x,y,bw*p,7); }
    }

    if(state==='play'){
      for(const b of BTN){ const active=phase==='set'&&clock>=revealT;
        ctx.fillStyle=active?b.col:'rgba(255,255,255,0.10)';rr(b.x,BY,BW,BH,10);ctx.fill();
        ctx.fillStyle=active?'#08130c':'rgba(255,255,255,0.5)';ctx.textAlign='center';ctx.font='bold 19px sans-serif';ctx.fillText(b.label,b.x+BW/2,BY+27);
        ctx.font='11px sans-serif';ctx.fillText(b.sub,b.x+BW/2,BY+47); }
      ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='12px sans-serif';ctx.textAlign='center';ctx.fillText('タップ / ←=ニア ・ →=ファー',W/2,BY+BH+18);
    }
  }

  for(const p of parts){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,3.2,0,6.28);ctx.fill();}
  ctx.globalAlpha=1;
  for(const p of pops){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.font='bold 21px sans-serif';ctx.textAlign='center';ctx.fillText(p.txt,p.x,p.y);}
  ctx.globalAlpha=1;

  // HUD
  ctx.textAlign='left';ctx.fillStyle='#fff';ctx.font='bold 26px sans-serif';ctx.fillText('SCORE '+score,20,36);
  ctx.textAlign='right';ctx.fillStyle='rgba(255,255,255,0.9)';ctx.font='14px sans-serif';ctx.fillText('お膳立て '+outs+'  Lv'+lvl,W-20,24);
  ctx.fillText('失敗',W-92,46);
  for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(W-60+i*20,41,7,0,6.28);ctx.fillStyle=i<fails?'#ff5b5b':'rgba(255,255,255,0.25)';ctx.fill();}
  if(combo>=2){ctx.textAlign='center';ctx.fillStyle='#ffd24d';ctx.font='bold 18px sans-serif';ctx.fillText('コンボ x'+combo,W/2,112);}

  if(state==='play'&&phase==='result'&&msg){ctx.textAlign='center';ctx.fillStyle=msgOk?'#9ff0b8':'#ff9a9a';ctx.font='bold 16px sans-serif';ctx.fillText(msg,W/2,470);}

  if(state==='title'){
    ctx.fillStyle='rgba(4,10,7,0.82)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='bold 40px sans-serif';ctx.fillText('コーナーデリバリー',W/2,86);
    ctx.fillStyle='#ffd23e';ctx.font='bold 22px sans-serif';ctx.fillText('Corner Delivery',W/2,122);
    ctx.fillStyle='rgba(255,255,255,0.92)';ctx.font='16px sans-serif';
    ctx.fillText('キッカーとして、GKが固めたポストの“逆”＝空いたポストへコーナーを蹴り込み、味方のヘッドをお膳立てしろ',W/2,180);
    ctx.fillStyle='rgba(255,255,255,0.66)';ctx.font='14px sans-serif';
    ctx.fillText('GKがファーを固めたら＝ニアへ（←/画面左）／GKがニアを固めたら＝ファーへ（→/画面右）',W/2,220);
    ctx.fillText('GKがどちらへ動くか分かる前に蹴る＝早すぎ、固めた側へ蹴る＝キャッチ、際どい判断は大量加点',W/2,244);
    ctx.fillText('空いたポストへ速く正確に送るほど良い。上級ほどGKの初動が速く猶予も短い。3失敗で交代',W/2,268);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で開始',W/2,352);
    ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='14px sans-serif';ctx.fillText('BEST '+best,W/2,384);
  }
  if(state==='over'){
    ctx.fillStyle='rgba(4,10,7,0.84)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#ff6b6b';ctx.font='bold 46px sans-serif';ctx.fillText('3失敗…キッカー交代',W/2,222);
    ctx.fillStyle='#fff';ctx.font='bold 40px sans-serif';ctx.fillText('SCORE '+score,W/2,290);
    ctx.fillStyle='rgba(255,255,255,0.85)';ctx.font='19px sans-serif';ctx.fillText('お膳立て '+outs+'   BEST '+best,W/2,330);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で もう一度',W/2,402);
  }

  if(flash>0.02){ctx.globalAlpha=flash*0.5;ctx.fillStyle=flashCol;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}
  ctx.restore();

  ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,0.4)';ctx.font='12px sans-serif';
  ctx.fillText('コーナーデリバリー：GKが固めたポストの逆＝空いた側へ蹴り込み味方のヘッドをお膳立て。早蹴り/固めた側は失敗、3つで交代',W/2,H-8);
}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

function frame(ts){let dt=ts-last;last=ts;if(dt>60)dt=60;if(dt<0)dt=0;update(dt);render();requestAnimationFrame(frame);}
requestAnimationFrame(frame);

// ---------- test hook ----------
window.__cd={
  start, makeCall:(c)=>makeCall(c),
  get state(){return state;},
  get score(){return score;},
  get outs(){return outs;},
  get fails(){return fails;},
  get info(){return {state,phase,clock,revealT,callWin,gkGuard,tough,decided,call,result,outs,fails,lvl,
    revealed:(clock>=revealT),openPost:openPost(),correctCall:openPost(),canAct:(phase==='set'&&!decided)};}
};
})();
</script>
</body>
</html>
