<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>コーナーを突け (Paint the Corner)</title>
<style>
  html,body{margin:0;height:100%;background:#07110b;overflow:hidden;
    font-family:-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  #stage{position:relative;width:100vw;height:100vh;max-width:calc(100vh*1.5);max-height:calc(100vw/1.5);aspect-ratio:900/600;}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;border-radius:6px;}
</style>
</head>
<body>
<div id="wrap"><div id="stage"><canvas id="cv"></canvas></div></div>
<script>
(function(){
const W=900,H=600,cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let DPR=1;
function fit(){DPR=Math.min(2,window.devicePixelRatio||1);cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
fit();addEventListener('resize',fit);

// ---------- audio ----------
let AC=null;function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function tone(f,d,type,v,sweep){const a=ac();if(!a)return;const t=a.currentTime,o=a.createOscillator(),g=a.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(sweep)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+sweep),t+d);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v||0.2,t+0.008);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+0.02);}
function noise(d,v,hp){const a=ac();if(!a)return;const t=a.currentTime,n=Math.floor(a.sampleRate*d),buf=a.createBuffer(1,n,a.sampleRate),ch=buf.getChannelData(0);
  for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource();s.buffer=buf;
  const f=a.createBiquadFilter();f.type='highpass';f.frequency.value=hp||600;const g=a.createGain();g.gain.value=v||0.2;
  s.connect(f);f.connect(g);g.connect(a.destination);s.start(t);s.stop(t+d+0.02);}
const S={
  sweep:()=>{tone(300,0.04,'sine',0.03);},
  pitch:()=>{noise(0.06,0.12,900);tone(520,0.07,'triangle',0.12,220);},
  mitt:()=>{noise(0.05,0.16,1400);tone(240,0.05,'square',0.07);},
  strike:()=>{[720,980,1240].forEach((f,i)=>setTimeout(()=>tone(f,0.1,'triangle',0.17),i*60));},
  hit:()=>{noise(0.14,0.22,300);tone(180,0.22,'sawtooth',0.13,-60);},
  walk:()=>{tone(300,0.14,'sine',0.14,-90);tone(230,0.2,'sine',0.1,-60);},
  streak:()=>{[700,930,1170,1400].forEach((f,i)=>setTimeout(()=>tone(f,0.1,'triangle',0.16),i*60));},
  over:()=>{[440,330,247,175].forEach((f,i)=>setTimeout(()=>tone(f,0.3,'triangle',0.2),i*160));}
};

// ---------- zone geometry (screen) ----------
// strike-zone box mapped from meter m in [0,1] -> screen x
const BOXY=170, BOXH=250, BX=300, BW=300;              // strike-zone box on screen
const BARLO=BX-150, BARHI=BX+BW+150;                   // needle sweeps across ball zones too
function mToX(m){ return BARLO + m*(BARHI-BARLO); }
function xOfZone(v){ return BX + ((v-strikeLo)/(strikeHi-strikeLo))*BW; } // map strike-space [strikeLo,strikeHi]->box

// ---------- state ----------
let state='title', phase='aim', plays=0;
let score=0, combo=0, best=+(localStorage.getItem('corner_best')||0);
let outs=0, fails=0, lvl=1;   // outs = strikes painted
let m=0, aimT=0, dir=1, sweep=900;
let strikeLo=0.16, strikeHi=0.84, hotLo=0, hotHi=0, greenLo=0, greenHi=0, greenCenter=0.5, hotSide='left';
let decided=false, frozenM=0, result=null, resultT=0, msg='', ballU=0, painted=false;
let shake=0, flash=0, flashCol='#fff', last=performance.now();
let parts=[], pops=[];

function rnd(a,b){return a+Math.random()*(b-a);}
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function lerp(a,b,u){return a+(b-a)*u;}
function easeOut(u){return 1-Math.pow(1-u,2);}

function reset(){state='title';score=0;combo=0;outs=0;fails=0;lvl=1;plays=0;result=null;parts=[];pops=[];}
function newPlay(){
  plays++; lvl=Math.min(7,1+Math.floor(outs/4));
  const ballW=clamp(0.12+lvl*0.015,0.12,0.24);
  strikeLo=ballW; strikeHi=1-ballW;
  const hotW=clamp(0.22+lvl*0.02,0.22,0.36);
  hotSide=Math.random()<0.5?'left':'right';
  let hotC = hotSide==='left' ? strikeLo+hotW/2+0.03 : strikeHi-hotW/2-0.03;
  hotLo=hotC-hotW/2; hotHi=hotC+hotW/2;
  if(hotSide==='left'){ greenLo=hotHi; greenHi=strikeHi; } else { greenLo=strikeLo; greenHi=hotLo; }
  greenCenter=(greenLo+greenHi)/2;
  sweep=clamp(920-lvl*70,440,920);
  phase='aim'; aimT=rnd(0,sweep); dir=Math.random()<0.5?1:-1; m=aimT/sweep;
  decided=false; frozenM=0; result=null; resultT=0; msg=''; ballU=0; painted=false;
}
function start(){ if(!ac())ac(); if(AC&&AC.state==='suspended')AC.resume(); reset(); state='play'; newPlay(); }

function classify(v){
  if(v<strikeLo||v>strikeHi) return 'walk';
  if(v>=hotLo&&v<=hotHi) return 'hit';
  return 'strike';
}

function act(){
  if(state==='title'){start();return;}
  if(state==='over'){ if(resultT>0.4){reset();start();} return; }
  if(state!=='play') return;
  if(phase!=='aim'||decided) return;
  decided=true; frozenM=m; phase='pitch'; ballU=0; S.pitch();
  // resolve is finalized when ball arrives (in update)
}

function finalize(){
  const k=classify(frozenM); result=k; resultT=0;
  if(k==='strike'){
    outs++; combo++;
    // painted = near the far corner of the safe lane (nastier)
    const edge = hotSide==='left' ? strikeHi : strikeLo;
    painted = Math.abs(frozenM-edge) < (greenHi-greenLo)*0.34;
    let add=Math.round((painted?260:150)*(1+Math.min(9,combo-1)*0.14)); score+=add;
    S.mitt(); setTimeout(S.strike,60);
    flash=1;flashCol='#8affa0';shake=6;
    const px=mToX(frozenM);
    burst(px,BOXY+BOXH*0.5,'#8affa0',20,7);
    pop(px,BOXY-14,painted?'ズバッ！ 隅を突いた！ +'+add:'ストライク！ +'+add,'#d6ffe0');
    if(combo>=2&&!painted)pop(W/2,150,'コンボ x'+combo,'#ffd24d');
    if(combo>0&&combo%5===0)S.streak();
    msg=painted?'痛打コースを外し、際どい隅で見逃しストライク！':'ホットゾーンを避けてゾーンで勝負、痛打を封じた！';
  } else {
    fails++; combo=0; flash=1;flashCol='#ff5b5b';shake=9;
    const px=mToX(frozenM);
    if(k==='walk'){ S.walk(); msg='コースを外し過ぎ…四球で走者を進めてしまった'; pop(px,BOXY-14,'ボール…四球','#ffd0d0'); }
    else { S.hit(); msg='ホットゾーンど真ん中…痛烈に弾き返された'; burst(px,BOXY+BOXH*0.5,'#ff7b6b',22,9); pop(px,BOXY-14,'痛打された…','#ffb0b0'); }
  }
  if(fails>=3){ state='over'; resultT=0; S.over(); if(score>best){best=score;localStorage.setItem('corner_best',best);} }
}

// ---------- input ----------
cv.addEventListener('pointerdown',e=>{e.preventDefault();act();});
addEventListener('keydown',e=>{ if(e.repeat)return; if(e.code==='Space'||e.code==='Enter'||e.code==='ArrowUp'||e.code==='KeyZ'){e.preventDefault();act();} });

// ---------- particles ----------
function burst(x,y,c,n,sp){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=rnd(sp*0.3,sp);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:1,c});}}
function pop(x,y,txt,c){pops.push({x,y,txt,c,life:1});}

// ---------- update ----------
function update(dt){
  shake*=Math.pow(0.86,dt/16.7); if(shake<0.3)shake=0;
  flash*=Math.pow(0.9,dt/16.7);
  for(const p of parts){p.vx*=0.96;p.vy=p.vy*0.96+0.28;p.x+=p.vx*dt/16.7;p.y+=p.vy*dt/16.7;p.life-=dt/16.7*0.026;}
  parts=parts.filter(p=>p.life>0);
  for(const p of pops){p.y-=dt/16.7*0.5;p.life-=dt/16.7*0.02;}
  pops=pops.filter(p=>p.life>0);

  if(state!=='play'){ if(state==='over')resultT+=dt/1000; return; }

  if(phase==='aim'){
    aimT+=dir*dt;
    if(aimT>=sweep){aimT=sweep-(aimT-sweep);dir=-1;}
    if(aimT<=0){aimT=-aimT;dir=1;}
    m=aimT/sweep;
    return;
  }
  if(phase==='pitch'){
    ballU=Math.min(1,ballU+dt/300);
    if(ballU>=1 && result===null) finalize();
    if(result!==null){ resultT+=dt/1000; if(resultT>1.2) newPlay(); }
    return;
  }
}

// ---------- render ----------
function figureBatter(x,y,col,swing){
  ctx.fillStyle='rgba(0,0,0,0.22)';ctx.beginPath();ctx.ellipse(x,y+15,13,4,0,0,6.28);ctx.fill();
  ctx.save();ctx.translate(x,y);ctx.rotate(swing?-0.25:0);
  ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(-8,-24);ctx.lineTo(8,-24);ctx.lineTo(6,12);ctx.lineTo(-6,12);ctx.closePath();ctx.fill();
  ctx.fillStyle='#f2c9a0';ctx.beginPath();ctx.arc(0,-30,6,0,6.28);ctx.fill();
  // bat
  ctx.strokeStyle='#c8952f';ctx.lineWidth=4;ctx.beginPath();
  if(swing){ctx.moveTo(2,-18);ctx.lineTo(26,-6);}else{ctx.moveTo(-2,-24);ctx.lineTo(8,-46);}
  ctx.stroke();
  ctx.restore();
}
function drawScene(){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#123f27');g.addColorStop(0.6,'#0f5031');g.addColorStop(1,'#0b3f26');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='rgba(255,255,255,0.03)';ctx.fillRect(0,BOXY+BOXH+60,W,H);
  // home plate
  ctx.fillStyle='#eef3f0';ctx.beginPath();ctx.moveTo(W/2-26,H-70);ctx.lineTo(W/2+26,H-70);ctx.lineTo(W/2+26,H-56);ctx.lineTo(W/2,H-44);ctx.lineTo(W/2-26,H-56);ctx.closePath();ctx.fill();
}

function render(){
  ctx.save();
  if(shake>0)ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
  drawScene();

  if(state==='play'||state==='over'){
    // ball zones (outside the box, faint red-ish "四球")
    ctx.fillStyle='rgba(120,120,140,0.12)';
    ctx.fillRect(BARLO,BOXY,BX-BARLO,BOXH);
    ctx.fillRect(BX+BW,BOXY,BARHI-(BX+BW),BOXH);
    ctx.fillStyle='rgba(255,255,255,0.35)';ctx.font='12px sans-serif';ctx.textAlign='center';
    ctx.fillText('ボール(四球)',(BARLO+BX)/2,BOXY+BOXH+18);
    ctx.fillText('ボール(四球)',(BX+BW+BARHI)/2,BOXY+BOXH+18);

    // strike zone box
    ctx.strokeStyle='rgba(255,255,255,0.85)';ctx.lineWidth=3;ctx.strokeRect(BX,BOXY,BW,BOXH);
    ctx.strokeStyle='rgba(255,255,255,0.16)';ctx.lineWidth=1;
    for(let i=1;i<3;i++){ctx.beginPath();ctx.moveTo(BX+BW*i/3,BOXY);ctx.lineTo(BX+BW*i/3,BOXY+BOXH);ctx.stroke();
      ctx.beginPath();ctx.moveTo(BX,BOXY+BOXH*i/3);ctx.lineTo(BX+BW,BOXY+BOXH*i/3);ctx.stroke();}

    // safe green lane (aim here)
    const gx1=xOfZone(greenLo), gx2=xOfZone(greenHi);
    ctx.fillStyle='rgba(120,255,150,0.16)';ctx.fillRect(gx1,BOXY,gx2-gx1,BOXH);
    ctx.strokeStyle='rgba(120,255,150,0.5)';ctx.lineWidth=2;ctx.strokeRect(gx1,BOXY,gx2-gx1,BOXH);
    // hot zone (batter crushes here) - the read
    const hx1=xOfZone(hotLo), hx2=xOfZone(hotHi);
    ctx.fillStyle='rgba(255,70,60,0.30)';ctx.fillRect(hx1,BOXY,hx2-hx1,BOXH);
    ctx.strokeStyle='rgba(255,90,80,0.75)';ctx.lineWidth=2;ctx.strokeRect(hx1,BOXY,hx2-hx1,BOXH);
    ctx.fillStyle='rgba(255,150,140,0.95)';ctx.font='bold 13px sans-serif';ctx.textAlign='center';
    ctx.fillText('ホットゾーン',(hx1+hx2)/2,BOXY+BOXH/2-6);
    ctx.fillText('（痛打注意）',(hx1+hx2)/2,BOXY+BOXH/2+12);

    // batter beside hot side
    const batX = hotSide==='left' ? BX-42 : BX+BW+42;
    figureBatter(batX, BOXY+BOXH-18, '#3aa0ff', phase==='pitch'&&result==='hit'&&ballU>0.7);

    // needle (aim) or frozen ball flight
    if(phase==='aim'){
      const nx=mToX(m);
      ctx.strokeStyle='#ffe14d';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(nx,BOXY-24);ctx.lineTo(nx,BOXY+BOXH+24);ctx.stroke();
      ctx.fillStyle='#ffe14d';ctx.beginPath();ctx.moveTo(nx,BOXY-30);ctx.lineTo(nx-7,BOXY-42);ctx.lineTo(nx+7,BOXY-42);ctx.closePath();ctx.fill();
    } else {
      // ball travels from pitcher(top) to the frozen x at plate
      const nx=mToX(frozenM);
      const by=lerp(BOXY-70, BOXY+BOXH*0.5, easeOut(ballU));
      const bx=lerp(W/2, nx, easeOut(ballU));
      const r=lerp(10,7,ballU);
      ctx.strokeStyle='rgba(255,255,255,0.25)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(W/2,BOXY-70);ctx.lineTo(bx,by);ctx.stroke();
      ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(bx,by,r,0,6.28);ctx.fill();
      ctx.strokeStyle='#d33';ctx.lineWidth=1.4;ctx.beginPath();ctx.arc(bx,by,r,0.6,2.2);ctx.stroke();
    }
    // pitcher marker
    ctx.fillStyle='rgba(255,255,255,0.6)';ctx.beginPath();ctx.arc(W/2,BOXY-78,7,0,6.28);ctx.fill();

    // cue
    if(phase==='aim'){
      ctx.textAlign='center';ctx.fillStyle='rgba(140,255,160,0.95)';ctx.font='bold 17px sans-serif';
      ctx.fillText('針を緑のコースで止めろ（タップ/クリック/SPACE）— 赤=痛打, 外=四球',W/2,BOXY-52);
    }
  }

  for(const p of parts){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,3.2,0,6.28);ctx.fill();}
  ctx.globalAlpha=1;
  for(const p of pops){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.font='bold 21px sans-serif';ctx.textAlign='center';ctx.fillText(p.txt,p.x,p.y);}
  ctx.globalAlpha=1;

  // HUD
  ctx.textAlign='left';ctx.fillStyle='#fff';ctx.font='bold 26px sans-serif';ctx.fillText('SCORE '+score,20,36);
  ctx.textAlign='right';ctx.fillStyle='rgba(255,255,255,0.9)';ctx.font='14px sans-serif';ctx.fillText('見逃し '+outs+'  Lv'+lvl,W-20,24);
  ctx.fillText('痛打/四球',W-116,46);
  for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(W-60+i*20,41,7,0,6.28);ctx.fillStyle=i<fails?'#ff5b5b':'rgba(255,255,255,0.25)';ctx.fill();}
  if(combo>=2){ctx.textAlign='center';ctx.fillStyle='#ffd24d';ctx.font='bold 18px sans-serif';ctx.fillText('コンボ x'+combo,W/2,120);}

  if(state==='play'&&phase==='pitch'&&result&&msg){ctx.textAlign='center';ctx.fillStyle=result==='strike'?'#9ff0b8':'#ff9a9a';ctx.font='bold 19px sans-serif';ctx.fillText(msg,W/2,150);}

  if(state==='title'){
    ctx.fillStyle='rgba(4,10,7,0.80)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='bold 44px sans-serif';ctx.fillText('コーナーを突け',W/2,110);
    ctx.fillStyle='#ffd23e';ctx.font='bold 22px sans-serif';ctx.fillText('Paint the Corner',W/2,146);
    ctx.fillStyle='rgba(255,255,255,0.92)';ctx.font='16px sans-serif';
    ctx.fillText('走者を背負ったピンチ。相手の痛打コース（赤）を見極め、ゾーンの空いた隅で勝負しろ',W/2,196);
    ctx.fillStyle='rgba(255,255,255,0.66)';ctx.font='14px sans-serif';
    ctx.fillText('左右に走る針を、緑の安全コースで止める（タップ/クリック/SPACE）＝見逃しストライクで打者を封じる',W/2,232);
    ctx.fillText('赤いホットゾーンで止める＝痛打、ゾーンの外（左右端）で止める＝四球で走者を進めてしまう',W/2,256);
    ctx.fillText('緑の“隅ギリギリ”で止めるほど際どく高得点。上級ほど針が速く、ホットゾーンが広くゾーンが狭い',W/2,280);
    ctx.fillText('痛打か四球を3つ与えると降板',W/2,304);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で開始',W/2,372);
    ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='14px sans-serif';ctx.fillText('BEST '+best,W/2,404);
  }
  if(state==='over'){
    ctx.fillStyle='rgba(4,10,7,0.84)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#ff6b6b';ctx.font='bold 46px sans-serif';ctx.fillText('3失点相当…降板',W/2,222);
    ctx.fillStyle='#fff';ctx.font='bold 40px sans-serif';ctx.fillText('SCORE '+score,W/2,290);
    ctx.fillStyle='rgba(255,255,255,0.85)';ctx.font='19px sans-serif';ctx.fillText('見逃し '+outs+'   BEST '+best,W/2,330);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で もう一度',W/2,402);
  }

  if(flash>0.02){ctx.globalAlpha=flash*0.5;ctx.fillStyle=flashCol;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}
  ctx.restore();

  ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,0.4)';ctx.font='12px sans-serif';
  ctx.fillText('コーナーを突け：打者の痛打コース(赤)を避け、左右に動く針を緑の隅で止めて見逃しストライク。四球/痛打を3つで降板',W/2,H-8);
}

function frame(ts){let dt=ts-last;last=ts;if(dt>60)dt=60;if(dt<0)dt=0;update(dt);render();requestAnimationFrame(frame);}
requestAnimationFrame(frame);

// ---------- test hook ----------
window.__pc={
  start, act:()=>act(),
  get state(){return state;},
  get score(){return score;},
  get outs(){return outs;},
  get fails(){return fails;},
  get info(){return {state,phase,m,strikeLo,strikeHi,hotLo,hotHi,greenLo,greenHi,greenCenter,hotSide,decided,result,outs,fails,lvl,
    canAct:(phase==='aim'&&!decided)};}
};
})();
</script>
</body>
</html>
