<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>スライディング (Slide Tackle)</title>
<style>
  html,body{margin:0;height:100%;background:#0a1a10;overflow:hidden;
    font-family:-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  #stage{position:relative;width:100vw;height:100vh;max-width:calc(100vh*1.5);max-height:calc(100vw/1.5);aspect-ratio:900/600;}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;border-radius:6px;}
</style>
</head>
<body>
<div id="wrap"><div id="stage"><canvas id="cv"></canvas></div></div>
<script>
(function(){
const W=900,H=600,cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let DPR=1;
function fit(){DPR=Math.min(2,window.devicePixelRatio||1);cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
fit();addEventListener('resize',fit);

// ---------- audio ----------
let AC=null;function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function tone(f,d,type,v,sweep){const a=ac();if(!a)return;const t=a.currentTime,o=a.createOscillator(),g=a.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(sweep)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+sweep),t+d);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v||0.2,t+0.008);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+0.02);}
function noise(d,v,hp){const a=ac();if(!a)return;const t=a.currentTime,n=Math.floor(a.sampleRate*d),buf=a.createBuffer(1,n,a.sampleRate),ch=buf.getChannelData(0);
  for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource();s.buffer=buf;
  const f=a.createBiquadFilter();f.type='highpass';f.frequency.value=hp||600;const g=a.createGain();g.gain.value=v||0.2;
  s.connect(f);f.connect(g);g.connect(a.destination);s.start(t);s.stop(t+d+0.02);}
const S={
  slide:()=>{noise(0.16,0.24,300);},
  win:()=>{noise(0.06,0.2,600);tone(420,0.1,'square',0.13);setTimeout(()=>tone(680,0.12,'triangle',0.14),60);},
  great:()=>{[620,880,1180,1560].forEach((f,i)=>setTimeout(()=>tone(f,0.12,'triangle',0.2),i*60));},
  foul:()=>{tone(2100,0.14,'square',0.14);setTimeout(()=>tone(2100,0.14,'square',0.14),150);tone(240,0.3,'sawtooth',0.16,-100);},
  beaten:()=>{tone(240,0.3,'sawtooth',0.2,-120);setTimeout(()=>tone(170,0.28,'sawtooth',0.16,-70),120);},
  touch:()=>{tone(300,0.04,'sine',0.07);},
  over:()=>{[440,330,247,175].forEach((f,i)=>setTimeout(()=>tone(f,0.3,'triangle',0.2),i*160));}
};

// ---------- geometry ----------
const DEF={x:450,y:446};
const RANGE0=312, RANGE1=420;   // attacker y range where a tackle can reach
const EXPOSE=0.55, FEET=0.34;

// ---------- state ----------
let state='title', phase='approach', t=0, plays=0;
let score=0, combo=0, best=+(localStorage.getItem('slide_best')||0);
let wins=0, fails=0, lvl=1;
let A=null, slide=null, result=null, resultT=0, msg='', msg2='';
let shake=0, flash=0, flashCol='#fff', last=performance.now(), card=0;
let parts=[], pops=[];

function rnd(a,b){return a+Math.random()*(b-a);}
function chance(p){return Math.random()<p;}
function clamp(v,a,b){return v<a?a:v>b?b:v;}

function reset(){state='title';score=0;combo=0;wins=0;fails=0;lvl=1;plays=0;A=null;result=null;parts=[];pops=[];slide=null;card=0;}

function newPlay(){
  plays++;
  lvl=Math.min(6,1+Math.floor(plays/3));
  const dur=Math.max(1350,2150-lvl*130);
  const side=chance(0.5)?-1:1;
  // touch Ys: some out of range (rhythm), guaranteed exposures in range
  const touches=[{y:180},{y:250},{y:rnd(322,344)},{y:rnd(372,404)}];
  A={y:110, x:450, vBase:(RANGE1+18-110)/dur, e:0.16, eT:999, eDur:Math.max(200,300-lvl*18),
     touches, ti:0, jink:side, done:false};
  slide=null; result=null; card=0; phase='approach'; t=0;
  msg='タッチの隙を突け'; msg2='ボールが足元から離れた“晒し”の一瞬でスライディング';
}

function start(){ if(!ac())ac(); if(AC&&AC.state==='suspended')AC.resume(); reset(); state='play'; newPlay(); }

function ballPos(){
  // ball ahead of the attacker (toward goal/down) by exposure
  return {x:A.x + A.jink*A.e*10, y:A.y + 26 + A.e*40};
}

// ---------- tackle ----------
function tackle(){
  if(state==='title'){start();return;}
  if(state==='over'){ if(resultT>0.5){reset();start();} return; }
  if(state!=='play'||phase!=='approach'||!A||slide) return;
  const inRange = A.y>=RANGE0 && A.y<=RANGE1;
  const bp=ballPos();
  slide={x:DEF.x,y:DEF.y,tx:bp.x,ty:bp.y,tp:0};
  S.slide();
  if(!inRange){ // lunged too early / attacker not there
    slide.kind='beaten'; A.result='beaten'; phase='slide'; A.beatenEarly=true; return;
  }
  if(A.e>=EXPOSE){ slide.kind = A.e>0.78?'great':'win'; }
  else if(A.e<=FEET){ slide.kind='foul'; }
  else { slide.kind='beaten'; } // between — poked air, he goes by
  phase='slide';
}

function applyResult(kind){
  result=kind; resultT=0; phase='resolve';
  const bp=ballPos();
  if(kind==='win'||kind==='great'){
    combo++; const mult=1+Math.min(6,combo-1)*0.24; const base=kind==='great'?190:120; const add=Math.round(base*mult);
    score+=add; wins++;
    if(kind==='great')S.great(); else S.win();
    flash=1;flashCol=kind==='great'?'#ffe08a':'#8ff0b8'; shake=kind==='great'?12:8;
    burst(bp.x,bp.y,kind==='great'?'#ffe08a':'#bfffd0',kind==='great'?26:18,7);
    pop(bp.x,bp.y-28,(kind==='great'?'完璧なタックル！ ':'ボール奪取！ ')+'+'+add,'#eaffef');
    if(combo>=2)pop(bp.x,bp.y-52,'コンボ x'+combo,'#ffe08a');
    msg=kind==='great'?'完璧なスライディング！ 晒しを刈り取った':'ボール奪取！ 足先でクリーンに突いた'; msg2='';
  } else {
    combo=0; fails++;
    if(kind==='foul'){ card=1; S.foul(); msg='ファウル！ 足元へ飛び込んだ'; msg2='ボールが晒された瞬間を狙え'; }
    else { S.beaten(); msg = A.beatenEarly? '飛び込みが早い！ かわされた':'抜かれた！ タイミングを逃した'; msg2='晒しの一瞬まで我慢'; }
    flash=1;flashCol='#ff6b6b'; shake=10;
    burst(kind==='foul'?A.x:bp.x, kind==='foul'?A.y:bp.y,'#ff8a8a',16,5);
  }
}

// ---------- input ----------
cv.addEventListener('pointerdown',e=>{e.preventDefault();tackle();});
addEventListener('keydown',e=>{ if(e.code==='Space'||e.code==='Enter'||e.code==='ArrowUp'){e.preventDefault();tackle();}});

// ---------- particles ----------
function burst(x,y,c,n,sp){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=rnd(sp*0.3,sp);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:1,c});}}
function pop(x,y,txt,c){pops.push({x,y,txt,c,life:1});}

// ---------- update ----------
function update(dt){
  shake*=Math.pow(0.86,dt/16.7); if(shake<0.3)shake=0;
  flash*=Math.pow(0.9,dt/16.7);
  for(const p of parts){p.vx*=0.96;p.vy=p.vy*0.96+0.3;p.x+=p.vx*dt/16.7;p.y+=p.vy*dt/16.7;p.life-=dt/16.7*0.026;}
  parts=parts.filter(p=>p.life>0);
  for(const p of pops){p.y-=dt/16.7*0.5;p.life-=dt/16.7*0.018;}
  pops=pops.filter(p=>p.life>0);

  if(state!=='play'){ if(state==='over')resultT+=dt/1000; return; }
  t+=dt;

  if(phase==='approach'){
    A.y+=A.vBase*dt;
    A.x=450+A.jink*Math.sin(A.y/60)*10;
    // trigger touches
    if(A.ti<A.touches.length && A.y>=A.touches[A.ti].y){ A.eT=0; A.ti++; S.touch(); }
    A.eT+=dt;
    A.e = A.eT<A.eDur ? 0.16+(0.94-0.16)*Math.sin((A.eT/A.eDur)*Math.PI) : 0.16;
    if(A.y>RANGE1+18){ applyResult('beaten'); }
    return;
  }
  if(phase==='slide'){
    slide.tp=clamp(slide.tp+dt/200,0,1);
    if(slide.tp>=1){ applyResult(slide.kind); }
    return;
  }
  if(phase==='resolve'){
    resultT+=dt/1000;
    if(resultT>1.1){
      if(fails>=3){ state='over'; resultT=0; S.over(); if(score>best){best=score;localStorage.setItem('slide_best',best);} }
      else newPlay();
    }
    return;
  }
}

// ---------- render ----------
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

function drawScene(){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#164a2c');g.addColorStop(1,'#1f7040');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='rgba(255,255,255,0.03)';for(let i=0;i<6;i++){if(i%2)ctx.fillRect(0,i*100,W,100);}
  // reach band (where a tackle can connect)
  ctx.fillStyle='rgba(126,240,176,0.06)';ctx.fillRect(300,RANGE0,300,RANGE1-RANGE0);
  ctx.strokeStyle='rgba(126,240,176,0.18)';ctx.setLineDash([6,8]);ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(300,RANGE0);ctx.lineTo(600,RANGE0);ctx.moveTo(300,RANGE1);ctx.lineTo(600,RANGE1);ctx.stroke();ctx.setLineDash([]);
  // goal hint at bottom
  ctx.strokeStyle='rgba(255,255,255,0.2)';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(360,H-6);ctx.lineTo(540,H-6);ctx.stroke();
}

function drawAttacker(){
  if(!A)return;
  // exposure gauge over the attacker
  const exposed=A.e>=EXPOSE;
  ctx.save();ctx.translate(A.x,A.y);
  ctx.fillStyle='rgba(0,0,0,0.22)';ctx.beginPath();ctx.ellipse(0,15,11,4,0,0,6.28);ctx.fill();
  ctx.fillStyle='#e2413a';rr(-8,-6,16,22,6);ctx.fill();
  ctx.fillStyle='#f2c9a0';ctx.beginPath();ctx.arc(0,-14,7,0,6.28);ctx.fill();
  ctx.fillStyle='#8a1f1a';ctx.beginPath();ctx.arc(0,-16,7.5,Math.PI,0);ctx.fill();
  ctx.restore();
  // ball ahead
  const bp=ballPos();
  if(exposed && A.y>=RANGE0-10 && A.y<=RANGE1){ ctx.strokeStyle='rgba(126,240,176,0.9)';ctx.lineWidth=3;ctx.beginPath();ctx.arc(bp.x,bp.y,15,0,6.28);ctx.stroke();
    ctx.fillStyle='#8ff0b8';ctx.font='bold 12px sans-serif';ctx.textAlign='center';ctx.fillText('晒し！',bp.x,bp.y-20);}
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(bp.x,bp.y,7,0,6.28);ctx.fill();ctx.strokeStyle='#333';ctx.lineWidth=1.3;ctx.beginPath();ctx.arc(bp.x,bp.y,7,0,6.28);ctx.stroke();
}

function drawDefender(){
  let x=DEF.x,y=DEF.y,ang=0;
  if(slide){ x=DEF.x+(slide.tx-DEF.x)*slide.tp; y=DEF.y+(slide.ty-DEF.y)*slide.tp; ang=-0.9; }
  ctx.save();ctx.translate(x,y);ctx.rotate(ang);
  ctx.fillStyle='rgba(0,0,0,0.22)';ctx.beginPath();ctx.ellipse(0,15,13,5,0,0,6.28);ctx.fill();
  ctx.fillStyle='#2b6cff';rr(-8,-6,16,22,6);ctx.fill();
  ctx.fillStyle='#f2c9a0';ctx.beginPath();ctx.arc(0,-14,7,0,6.28);ctx.fill();
  ctx.fillStyle='#1a3a8a';ctx.beginPath();ctx.arc(0,-16,7.5,Math.PI,0);ctx.fill();
  // extended leg when sliding
  if(slide){ctx.strokeStyle='#2b6cff';ctx.lineWidth=6;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(0,6);ctx.lineTo(0,-22);ctx.stroke();}
  ctx.restore();
}

function render(){
  ctx.save();
  if(shake>0)ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
  drawScene();
  drawAttacker();
  drawDefender();

  // red card on foul
  if(card>0){ ctx.fillStyle='#ff3b3b';rr(A.x+18,A.y-40,20,28,3);ctx.fill(); }

  for(const p of parts){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,3.2,0,6.28);ctx.fill();}
  ctx.globalAlpha=1;
  for(const p of pops){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.font='bold 21px sans-serif';ctx.textAlign='center';ctx.fillText(p.txt,p.x,p.y);}
  ctx.globalAlpha=1;

  // HUD
  ctx.textAlign='left';ctx.fillStyle='#fff';ctx.font='bold 26px sans-serif';ctx.fillText('SCORE '+score,20,36);
  ctx.textAlign='right';ctx.fillStyle='rgba(255,255,255,0.85)';ctx.font='14px sans-serif';ctx.fillText('奪取 '+wins+'  Lv.'+lvl,W-20,26);
  ctx.fillText('失敗',W-92,50);
  for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(W-66+i*22,46,7,0,6.28);ctx.fillStyle=i<fails?'#ff5b5b':'rgba(255,255,255,0.25)';ctx.fill();}
  if(combo>=2){ctx.textAlign='left';ctx.fillStyle='#ffe08a';ctx.font='bold 18px sans-serif';ctx.fillText('コンボ x'+combo,20,60);}

  if(state==='play'&&(msg||msg2)){
    ctx.textAlign='center';
    const good=result==='win'||result==='great';
    ctx.fillStyle=result?(good?'#8ff0b8':'#ff9a9a'):'rgba(255,255,255,0.92)';
    ctx.font='bold 25px sans-serif';ctx.fillText(msg,W/2,H-54);
    if(msg2){ctx.fillStyle='rgba(255,255,255,0.72)';ctx.font='15px sans-serif';ctx.fillText(msg2,W/2,H-30);}
  }

  if(state==='title'){
    ctx.fillStyle='rgba(6,16,10,0.66)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='bold 48px sans-serif';ctx.fillText('スライディング',W/2,190);
    ctx.fillStyle='#8ff0b8';ctx.font='bold 22px sans-serif';ctx.fillText('Slide Tackle',W/2,226);
    ctx.fillStyle='rgba(255,255,255,0.9)';ctx.font='18px sans-serif';
    ctx.fillText('ドリブラーのタッチのリズムを読み、ボールが足元から離れて',W/2,288);
    ctx.fillText('“晒し”になった一瞬に足先でスライディング（クリック/タップ/SPACE）',W/2,316);
    ctx.fillStyle='rgba(255,255,255,0.66)';ctx.font='15px sans-serif';
    ctx.fillText('足元（相手本体）へ飛び込むとファウル／早すぎると抜かれる／届く間合いで',W/2,358);
    ctx.fillText('晒された瞬間をクリーンに刈れば高得点。3失敗で交代',W/2,382);
    ctx.fillStyle='#ffe08a';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で開始',W/2,442);
    ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='14px sans-serif';ctx.fillText('BEST '+best,W/2,474);
  }
  if(state==='over'){
    ctx.fillStyle='rgba(6,16,10,0.74)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#ff6b6b';ctx.font='bold 46px sans-serif';ctx.fillText('3失敗…交代',W/2,230);
    ctx.fillStyle='#fff';ctx.font='bold 40px sans-serif';ctx.fillText('SCORE '+score,W/2,296);
    ctx.fillStyle='rgba(255,255,255,0.85)';ctx.font='20px sans-serif';ctx.fillText('奪取 '+wins+'   BEST '+best,W/2,336);
    ctx.fillStyle='#8ff0b8';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で もう一度',W/2,408);
  }

  if(flash>0.02){ctx.globalAlpha=flash*0.5;ctx.fillStyle=flashCol;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}
  ctx.restore();

  ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,0.4)';ctx.font='13px sans-serif';
  ctx.fillText('ボールが足元から離れた“晒し（緑）”の一瞬に、届く間合い（帯）でスライディング。足元はファウル。3失敗で交代',W/2,H-8);
}

function frame(ts){let dt=ts-last;last=ts;if(dt>60)dt=60;if(dt<0)dt=0;update(dt);render();requestAnimationFrame(frame);}
requestAnimationFrame(frame);

// ---------- test hook ----------
window.__st={
  start, tackle,
  get state(){return state;},
  get score(){return score;},
  get wins(){return wins;},
  get fails(){return fails;},
  get info(){return {state,phase, ay:A?A.y:0, e:A?A.e:0, inRange: !!(A&&phase==='approach'&&A.y>=RANGE0&&A.y<=RANGE1),
    expose:EXPOSE, feet:FEET, result, wins, fails, lvl};}
};
})();
</script>
</body>
</html>
