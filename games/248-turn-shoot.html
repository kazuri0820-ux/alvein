<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>反転シュート (Turn & Shoot)</title>
<style>
  html,body{margin:0;height:100%;background:#07120b;overflow:hidden;
    font-family:-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  #stage{position:relative;width:100vw;height:100vh;max-width:calc(100vh*1.5);max-height:calc(100vw/1.5);aspect-ratio:900/600;}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;border-radius:6px;}
</style>
</head>
<body>
<div id="wrap"><div id="stage"><canvas id="cv"></canvas></div></div>
<script>
(function(){
const W=900,H=600,cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let DPR=1;
function fit(){DPR=Math.min(2,window.devicePixelRatio||1);cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
fit();addEventListener('resize',fit);

// ---------- audio ----------
let AC=null;function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function tone(f,d,type,v,sweep){const a=ac();if(!a)return;const t=a.currentTime,o=a.createOscillator(),g=a.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(sweep)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+sweep),t+d);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v||0.2,t+0.008);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+0.02);}
function noise(d,v,hp){const a=ac();if(!a)return;const t=a.currentTime,n=Math.floor(a.sampleRate*d),buf=a.createBuffer(1,n,a.sampleRate),ch=buf.getChannelData(0);
  for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource();s.buffer=buf;
  const f=a.createBiquadFilter();f.type='highpass';f.frequency.value=hp||600;const g=a.createGain();g.gain.value=v||0.2;
  s.connect(f);f.connect(g);g.connect(a.destination);s.start(t);s.stop(t+d+0.02);}
const S={
  turn:()=>{tone(300,0.08,'sine',0.1,180);noise(0.02,0.04,700);},
  shoot:()=>{noise(0.05,0.16,600);tone(340,0.06,'square',0.1,240);},
  goal:()=>{noise(0.06,0.14,500);[560,820,1080,1340].forEach((f,i)=>setTimeout(()=>tone(f,0.12,'triangle',0.18),i*55));},
  bad:()=>{noise(0.16,0.22,320);tone(170,0.18,'sawtooth',0.12,-50);},
  streak:()=>{[700,930,1170,1400].forEach((f,i)=>setTimeout(()=>tone(f,0.1,'triangle',0.16),i*60));},
  over:()=>{[440,330,247,175].forEach((f,i)=>setTimeout(()=>tone(f,0.3,'triangle',0.2),i*160));}
};

// ---------- geometry ----------
const PLAYER={x:450,y:396}, PASSER={x:450,y:558}, GOALY=92, GW=210, GL=450-GW/2, GR=450+GW/2;

// ---------- state ----------
let state='title', stg='turn', t=0, plays=0;
let score=0, combo=0, best=+(localStorage.getItem('turnshoot_best')||0);
let outs=0, fails=0, lvl=1;   // outs = goals
let clock=0, turnClock=0, turnT=820, cw=150, settle=200, shootT=520, vw=190, sweet=54;
let gkSide=0, shotX=450;
let acted2=false, result=null, resultT=0, msg='', turnGood=false, shotU=0, worldie=false;
let shake=0, flash=0, flashCol='#fff', last=performance.now();
let parts=[], pops=[];

function rnd(a,b){return a+Math.random()*(b-a);}
function chance(p){return Math.random()<p;}
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function lerp(a,b,u){return a+(b-a)*u;}
function easeOut(u){return 1-Math.pow(1-u,2);}

function params(){ return {
  pass:Math.max(560,900-lvl*50),
  cw:Math.max(100,156-lvl*8),
  shoot:Math.max(430,560-lvl*22),
  vw:Math.max(126,196-lvl*10),
  sweet:Math.max(36,60-lvl*3.4)
};}

function reset(){state='title';score=0;combo=0;outs=0;fails=0;lvl=1;plays=0;result=null;parts=[];pops=[];}
function newPlay(){
  plays++; lvl=Math.min(7,1+Math.floor(outs/4));
  const p=params();
  turnT=p.pass; cw=p.cw; settle=200; shootT=p.shoot; vw=p.vw; sweet=p.sweet;
  gkSide=chance(0.5)?-1:1;
  clock=0; turnClock=0; acted2=false; result=null; stg='turn'; msg=''; resultT=0; turnGood=false; shotU=0; worldie=false;
}
function start(){ if(!ac())ac(); if(AC&&AC.state==='suspended')AC.resume(); reset(); state='play'; newPlay(); }

function act(){
  if(state==='title'){start();return;}
  if(state==='over'){ if(resultT>0.4){reset();start();} return; }
  if(state!=='play') return;
  if(stg==='turn'){
    const err=Math.abs(clock-turnT);
    if(err<=cw){ turnGood=true; turnClock=clock; stg='shoot'; S.turn();
      flash=0.5;flashCol='#bfe3ff'; burst(PLAYER.x,PLAYER.y,'#bfe3ff',8,3); pop(PLAYER.x,PLAYER.y-34,'ターン！','#bfe3ff'); }
    else { resolve(clock<turnT?'earlyturn':'lostball'); }
    return;
  }
  if(stg==='shoot'){
    const rel=clock-turnClock;
    if(rel<settle){ resolve('rush'); return; }        // shot rushed before setting
    const err=Math.abs(rel-(settle+shootT-settle)); // center of shoot window = shootT
    const e=Math.abs(rel-shootT);
    S.shoot();
    if(e<=sweet){ worldie=true; shotX=450+gkSide*rnd(70,96); resolve('worldie'); }  // far corner past the diving keeper
    else if(e<=vw){ shotX=450+(chance(0.5)?1:-1)*rnd(30,66); resolve('goal'); }
    else { shotX=450+rnd(-30,30); resolve('miss'); }
    return;
  }
}

function resolve(kind){
  stg='result'; result=kind; resultT=0;
  const good=(kind==='goal'||kind==='worldie');
  if(good){
    outs++; combo++;
    let add=Math.round((kind==='worldie'?220:130)*(1+Math.min(9,combo-1)*0.15)); score+=add;
    S.goal(); flash=1;flashCol=kind==='worldie'?'#8affa0':'#ffe08a';shake=kind==='worldie'?9:6;
    burst(shotX,GOALY+24,kind==='worldie'?'#8affa0':'#ffe08a',kind==='worldie'?24:16,7);
    pop(shotX,GOALY+2,(kind==='worldie'?'反転ゴラッソ！ +':'反転シュート弾！ +')+add,kind==='worldie'?'#d6ffe0':'#fff3c4');
    if(kind==='worldie')pop(450,180,'振り向きざまに突き刺した！','#8affa0');
    if(combo>=2)pop(450,220,'コンボ x'+combo,'#ffd24d');
    if(combo>0&&combo%5===0)S.streak();
    msg=kind==='worldie'?'完璧な反転シュート！ 振り向きざまにゴラッソ！':'ターンから振り向きざまのシュート弾！';
  } else {
    fails++; combo=0; flash=1;flashCol='#ff5b5b';shake=8; S.bad();
    if(kind==='earlyturn') msg='早い！ ボールが収まる前にターンして失う';
    else if(kind==='lostball') msg='遅い！ 背後の相手にボールを奪われた';
    else if(kind==='rush') msg='慌てた！ 振り向き切る前に撃って空振り';
    else msg='シュートのタイミングがズレて枠を外した';
    pop(PLAYER.x,PLAYER.y-34,'ロスト…','#ffb0b0');
  }
  if(fails>=3){ state='over'; resultT=0; S.over(); if(score>best){best=score;localStorage.setItem('turnshoot_best',best);} }
}

// ---------- input ----------
cv.addEventListener('pointerdown',e=>{e.preventDefault();act();});
addEventListener('keydown',e=>{ if(e.repeat)return; if(e.code==='Space'||e.code==='Enter'||e.code==='ArrowUp'||e.code==='KeyZ'){e.preventDefault();act();} });

// ---------- particles ----------
function burst(x,y,c,n,sp){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=rnd(sp*0.3,sp);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:1,c});}}
function pop(x,y,txt,c){pops.push({x,y,txt,c,life:1});}

// ---------- update ----------
function update(dt){
  shake*=Math.pow(0.86,dt/16.7); if(shake<0.3)shake=0;
  flash*=Math.pow(0.9,dt/16.7);
  for(const p of parts){p.vx*=0.96;p.vy=p.vy*0.96+0.28;p.x+=p.vx*dt/16.7;p.y+=p.vy*dt/16.7;p.life-=dt/16.7*0.026;}
  parts=parts.filter(p=>p.life>0);
  for(const p of pops){p.y-=dt/16.7*0.5;p.life-=dt/16.7*0.02;}
  pops=pops.filter(p=>p.life>0);

  if(state!=='play'){ if(state==='over')resultT+=dt/1000; return; }
  t+=dt;
  if(stg==='turn'){
    clock+=dt;
    if(clock>turnT+cw){ resolve('lostball'); }
    return;
  }
  if(stg==='shoot'){
    clock+=dt;
    if((clock-turnClock)>shootT+vw){ resolve('miss'); }
    return;
  }
  if(stg==='result'){
    resultT+=dt/1000; shotU=Math.min(1,shotU+dt/220);
    if(resultT>1.15 && state==='play') newPlay();
    return;
  }
}

// ---------- render ----------
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function drawScene(){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#256d34');g.addColorStop(1,'#184a22');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='rgba(255,255,255,0.035)';
  for(let i=0;i<7;i++){ if(i%2===0)ctx.fillRect(0,i*H/7,W,H/7); }
  ctx.fillStyle='rgba(255,255,255,0.10)';ctx.fillRect(GL-6,GOALY-4,GW+12,42);
  ctx.strokeStyle='#f2f4f6';ctx.lineWidth=6;
  ctx.beginPath();ctx.moveTo(GL-6,GOALY+38);ctx.lineTo(GL-6,GOALY-4);ctx.lineTo(GR+6,GOALY-4);ctx.lineTo(GR+6,GOALY+38);ctx.stroke();
  ctx.strokeStyle='rgba(255,255,255,0.14)';ctx.lineWidth=1;
  for(let x=GL;x<=GR;x+=15){ctx.beginPath();ctx.moveTo(x,GOALY-2);ctx.lineTo(x,GOALY+36);ctx.stroke();}
  ctx.strokeStyle='rgba(255,255,255,0.12)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(450,GOALY+150,120,3.4,6.02);ctx.stroke();
}
function drawFig(x,y,col,s,rot){ s=s||1; ctx.save();ctx.translate(x,y);if(rot)ctx.rotate(rot);
  ctx.fillStyle='rgba(0,0,0,0.22)';ctx.beginPath();ctx.ellipse(0,12*s,10*s,3.5*s,0,0,6.28);ctx.fill();
  ctx.fillStyle=col;rr(-8*s,-10*s,16*s,24*s,6);ctx.fill();
  ctx.fillStyle='#f2c9a0';ctx.beginPath();ctx.arc(0,-14*s,6*s,0,6.28);ctx.fill();ctx.restore(); }

function render(){
  ctx.save();
  if(shake>0)ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
  drawScene();

  if(state==='play'){
    // GK
    const gkx = PLAYER.x*0+450 + ((stg==='result'&&(result==='goal'||result==='worldie'||result==='miss'))? gkSide*lerp(0,66,easeOut(shotU)) : 0);
    ctx.fillStyle='#e23c3c';rr(gkx-12,GOALY+2,24,30,6);ctx.fill();
    ctx.fillStyle='#f2c9a0';ctx.beginPath();ctx.arc(gkx,GOALY,7,0,6.28);ctx.fill();

    // defender behind the player (pressure)
    let defY=PLAYER.y+42;
    if(stg==='turn'){ defY=lerp(PLAYER.y+70,PLAYER.y+30,clamp(clock/turnT,0,1)); }
    else if(stg==='result'&&result==='lostball'){ defY=PLAYER.y+18; }
    drawFig(PLAYER.x, defY, '#d23a3a',1.0);

    // player: facing down (back to goal) during turn, faces up after
    let prot = (stg==='turn')?Math.PI : (stg==='result')?0 : lerp(Math.PI,0,clamp((clock-turnClock)/settle,0,1));
    if(stg==='shoot'||stg==='result') prot=0;
    drawFig(PLAYER.x, PLAYER.y, '#2b6cff',1.15, 0);

    // ball
    if(stg==='turn'){
      const u=clamp(clock/turnT,0,1); const bx=PLAYER.x, by=lerp(PASSER.y,PLAYER.y+10,easeOut(u));
      ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(bx,by,7,0,6.28);ctx.fill();
      // turn window ring
      if(clock>turnT-cw*1.7){ const uu=clamp((clock-(turnT-cw))/(2*cw),0,1); const inw=Math.abs(clock-turnT)<=cw;
        ctx.strokeStyle=inw?'rgba(150,210,255,0.95)':'rgba(255,255,255,0.35)';ctx.lineWidth=3;
        ctx.beginPath();ctx.arc(PLAYER.x,PLAYER.y+8,lerp(42,18,clamp(uu,0,1)),0,6.28);ctx.stroke(); }
      ctx.fillStyle='rgba(191,227,255,0.9)';ctx.font='bold 14px sans-serif';ctx.textAlign='center';ctx.fillText('①収めてターン',PLAYER.x,PLAYER.y-40);
    } else if(stg==='shoot'){
      ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(PLAYER.x+8,PLAYER.y+4,7,0,6.28);ctx.fill();
      const rel=clock-turnClock; const ready=rel>=settle;
      if(rel>settle-40){ const uu=clamp((rel-settle)/(shootT+vw-settle),0,1); const inw=ready&&Math.abs(rel-shootT)<=vw;
        ctx.strokeStyle=inw?'rgba(150,240,170,0.95)':'rgba(255,255,255,0.35)';ctx.lineWidth=3;
        ctx.beginPath();ctx.arc(PLAYER.x,PLAYER.y+8,lerp(44,18,clamp(uu,0,1)),0,6.28);ctx.stroke();
        if(inw){ ctx.strokeStyle='rgba(214,255,224,0.6)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(PLAYER.x,PLAYER.y+8,lerp(44,18,clamp(uu,0,1))*(sweet/vw),0,6.28);ctx.stroke(); } }
      ctx.fillStyle= ready?'rgba(159,240,184,0.95)':'rgba(255,255,255,0.6)';ctx.font='bold 14px sans-serif';ctx.textAlign='center';
      ctx.fillText(ready?'②今だ！ 振り向きざまに撃て！':'反転中…',PLAYER.x,PLAYER.y-40);
    } else {
      if(result==='goal'||result==='worldie'){ const fx=lerp(PLAYER.x,shotX,easeOut(shotU)), fy=lerp(PLAYER.y,GOALY+16,easeOut(shotU));
        ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(fx,fy,7,0,6.28);ctx.fill(); }
      else if(result==='miss'){ const fx=lerp(PLAYER.x,shotX,easeOut(shotU)), fy=lerp(PLAYER.y,GOALY-40,easeOut(shotU));
        ctx.globalAlpha=clamp(1.2-resultT,0,1);ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(fx,fy,7,0,6.28);ctx.fill();ctx.globalAlpha=1; }
      else { ctx.globalAlpha=clamp(1.2-resultT,0,1);ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(PLAYER.x+ (result==='lostball'?-30:8),PLAYER.y+10,7,0,6.28);ctx.fill();ctx.globalAlpha=1; }
    }
  }

  for(const p of parts){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,3.2,0,6.28);ctx.fill();}
  ctx.globalAlpha=1;
  for(const p of pops){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.font='bold 22px sans-serif';ctx.textAlign='center';ctx.fillText(p.txt,p.x,p.y);}
  ctx.globalAlpha=1;

  // HUD
  ctx.textAlign='left';ctx.fillStyle='#fff';ctx.font='bold 26px sans-serif';ctx.fillText('SCORE '+score,20,36);
  ctx.textAlign='right';ctx.fillStyle='rgba(255,255,255,0.9)';ctx.font='14px sans-serif';ctx.fillText('ゴール '+outs+'  Lv'+lvl,W-20,24);
  ctx.fillText('失敗',W-92,46);
  for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(W-60+i*20,41,7,0,6.28);ctx.fillStyle=i<fails?'#ff5b5b':'rgba(255,255,255,0.25)';ctx.fill();}
  if(combo>=2){ctx.textAlign='center';ctx.fillStyle='#ffd24d';ctx.font='bold 18px sans-serif';ctx.fillText('コンボ x'+combo,W/2,150);}

  if(state==='play'&&(stg==='turn'||stg==='shoot')){ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,0.9)';ctx.font='bold 15px sans-serif';
    ctx.fillText('縦パスを①収めてターン→②振り向きざまにシュート。2拍のタイミングで決めろ',W/2,44);}
  if(state==='play'&&stg==='result'&&msg){ctx.textAlign='center';ctx.fillStyle=(result==='goal'||result==='worldie')?'#9ff0b8':'#ff9a9a';ctx.font='bold 20px sans-serif';ctx.fillText(msg,W/2,44);}

  if(state==='title'){
    ctx.fillStyle='rgba(5,12,7,0.78)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='bold 44px sans-serif';ctx.fillText('反転シュート',W/2,112);
    ctx.fillStyle='#ffd23e';ctx.font='bold 22px sans-serif';ctx.fillText('Turn & Shoot',W/2,148);
    ctx.fillStyle='rgba(255,255,255,0.92)';ctx.font='16px sans-serif';
    ctx.fillText('背負ったポストプレーから、ターンで反転→振り向きざまに撃つ2段階フィニッシュ',W/2,198);
    ctx.fillStyle='rgba(255,255,255,0.66)';ctx.font='14px sans-serif';
    ctx.fillText('縦パスが足元へ入る。① ボールが収まる瞬間（青リング）にタップ＝反転ターン',W/2,238);
    ctx.fillText('② 振り向いたら（緑リング）すぐタップ＝振り向きざまにシュート',W/2,260);
    ctx.fillText('芯（内側リング）でジャストに撃つと“反転ゴラッソ”で大量得点',W/2,282);
    ctx.fillText('ターンが早い/遅いと背後の相手に奪われ、シュートがズレると枠外＝失敗',W/2,304);
    ctx.fillText('2拍のリズムが命。上級ほど速くリングが狭い。3失敗で交代',W/2,326);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で開始',W/2,390);
    ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='14px sans-serif';ctx.fillText('BEST '+best+'　　タップ/クリック/SPACE',W/2,422);
  }
  if(state==='over'){
    ctx.fillStyle='rgba(5,12,7,0.84)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#ff6b6b';ctx.font='bold 46px sans-serif';ctx.fillText('3失敗…交代',W/2,222);
    ctx.fillStyle='#fff';ctx.font='bold 40px sans-serif';ctx.fillText('SCORE '+score,W/2,290);
    ctx.fillStyle='rgba(255,255,255,0.85)';ctx.font='19px sans-serif';ctx.fillText('ゴール '+outs+'   BEST '+best,W/2,330);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で もう一度',W/2,402);
  }

  if(flash>0.02){ctx.globalAlpha=flash*0.5;ctx.fillStyle=flashCol;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}
  ctx.restore();

  ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,0.4)';ctx.font='12px sans-serif';
  ctx.fillText('①青リングで反転ターン→②緑リングで振り向きざまにシュートの2拍。芯ならゴラッソ。早/遅/ズレは失敗。3失敗で交代',W/2,H-8);
}

function frame(ts){let dt=ts-last;last=ts;if(dt>60)dt=60;if(dt<0)dt=0;update(dt);render();requestAnimationFrame(frame);}
requestAnimationFrame(frame);

// ---------- test hook ----------
window.__ts={
  start, act:()=>act(),
  get state(){return state;},
  get score(){return score;},
  get outs(){return outs;},
  get fails(){return fails;},
  get info(){const rel=(stg==='shoot')?(clock-turnClock):null;
    return {state,stg,clock,turnT,cw,settle,shootT,vw,sweet,rel,
      canTurn:(stg==='turn'),canShoot:(stg==='shoot'),
      result,outs,fails,lvl};}
};
})();
</script>
</body>
</html>
