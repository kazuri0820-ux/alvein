<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ピンポイントクロス — Pinpoint Cross</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{width:100%;height:100%;background:#07131e;overflow:hidden;
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,system-ui,sans-serif;
    touch-action:none;user-select:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  #stage{position:relative;aspect-ratio:900/600;max-width:100%;max-height:100%;
    width:auto;height:auto;box-shadow:0 0 60px rgba(0,0,0,.6);}
  canvas{display:block;width:100%;height:100%;border-radius:6px;}
</style>
</head>
<body>
<div id="wrap"><div id="stage"><canvas id="c" width="900" height="600"></canvas></div></div>
<script>
(function(){
"use strict";
const TEST=location.hash.indexOf('test')>=0;
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
const W=900,H=600;
let dpr=Math.max(1,Math.min(2,window.devicePixelRatio||1));
function fit(){ dpr=Math.max(1,Math.min(2,window.devicePixelRatio||1)); cv.width=W*dpr; cv.height=H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0); }
fit(); window.addEventListener('resize',fit);

// ---- audio ----
let AC=null;
function ac(){ if(!AC){ try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){AC=null;} } return AC; }
function tone(f,d,type,g,f2){ const a=ac(); if(!a)return; const o=a.createOscillator(),gg=a.createGain();
  o.type=type||'sine'; o.frequency.setValueAtTime(f,a.currentTime); if(f2)o.frequency.exponentialRampToValueAtTime(f2,a.currentTime+d);
  gg.gain.setValueAtTime(0.0001,a.currentTime); gg.gain.exponentialRampToValueAtTime(g||0.2,a.currentTime+0.01);
  gg.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+d); o.connect(gg); gg.connect(a.destination); o.start(); o.stop(a.currentTime+d+0.02); }
function noise(d,g,cut){ const a=ac(); if(!a)return; const n=Math.floor(a.sampleRate*d),buf=a.createBuffer(1,n,a.sampleRate),ch=buf.getChannelData(0);
  for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(1-i/n); const src=a.createBufferSource(); src.buffer=buf;
  const f=a.createBiquadFilter(); f.type='lowpass'; f.frequency.value=cut||1200; const gg=a.createGain(); gg.gain.value=g||0.2;
  src.connect(f); f.connect(gg); gg.connect(a.destination); src.start(); }
const S={
  cross(){ noise(0.05,0.24,1900); tone(360,0.08,'sine',0.14,520); },
  head(){ noise(0.06,0.32,1500); tone(300,0.08,'square',0.16,180); },
  net(){ noise(0.3,0.22,2600); tone(80,0.2,'sine',0.12,50); },
  cheer(){ const a=ac(); if(!a)return; noise(0.8,0.26,1900); for(let i=0;i<6;i++)setTimeout(()=>tone(480+Math.random()*320,0.34,'sine',0.05),i*44); },
  miss(){ tone(280,0.26,'sawtooth',0.14,110); },
  save(){ noise(0.12,0.4,700); tone(200,0.1,'square',0.18,120); },
  whistle(){ tone(2000,0.1,'square',0.1); }
};

// ---- geometry (top-down, goal at top) ----
const GOALY=78, GML=356, GMR=544;
const KEEPER={x:450,y:104};
const CROSSER={x:132,y:392};
const RUN_A={x:404,y:486}, RUN_B={x:588,y:150};   // striker run line
const ZONE_Y0=112, ZONE_Y1=250;                    // headable dangerous band

// ---- state ----
let state='ready';   // ready, run, fly, result, over
let goals=0, misses=0, streak=0, best=0, level=0, playN=0;
let s=0, runSpeed=0.4;                              // striker run progress + speed
let striker={x:RUN_A.x,y:RUN_A.y};
let defender={x:470,y:210, dir:1};
let fly=null;        // {from,to,t,dur}
let land=null;       // landing point
let result=null;
let hover=null;
let netRipple=0;
let msg='',msgT=0;
let flash=0,flashCol='#fff',shakeT=0,shakeM=0;
let parts=[]; let crowd=[]; let t=0;

try{ best=parseInt(localStorage.getItem('pc_best')||'0',10)||0; }catch(e){}
for(let i=0;i<64;i++) crowd.push({x:Math.random()*W,y:6+Math.random()*40,c:['#e8544e','#f0c14b','#4a90d9','#fff','#5cc98a','#c98af0'][i%6],b:Math.random()*6.28});

function reset(){ goals=0;misses=0;streak=0;level=0;playN=0; parts=[]; nextPlay(); }
function levelUp(){ level=Math.min(9,Math.floor(goals/3)); }

function nextPlay(){
  levelUp(); playN++;
  s=0; runSpeed=0.34+level*0.03+Math.random()*0.05;
  striker={x:RUN_A.x,y:RUN_A.y};
  defender={x:410+Math.random()*120,y:196+Math.random()*30, dir:Math.random()<0.5?1:-1};
  fly=null; land=null; result=null;
  state='run';
  if(playN<=2){ msg='走り込む味方の"先"を狙え！ 落とす場所をタップでクロス'; msgT=150; }
  else { msg=''; msgT=0; }
  S.whistle();
}
function strikerAt(ss){ ss=Math.max(0,Math.min(1,ss)); return {x:RUN_A.x+(RUN_B.x-RUN_A.x)*ss, y:RUN_A.y+(RUN_B.y-RUN_A.y)*ss}; }
function flightTime(from,to){ return Math.hypot(to.x-from.x,to.y-from.y)/560 + 0.12; }

function cross(tx,ty){
  if(state!=='run') return;
  land={x:tx,y:ty};
  fly={from:{x:CROSSER.x,y:CROSSER.y}, to:{x:tx,y:ty}, t:0, dur:flightTime(CROSSER,{x:tx,y:ty})};
  S.cross();
  state='fly';
}

function resolveCross(){
  const st=striker;   // striker position at ball arrival (advanced during flight)
  const d=Math.hypot(land.x-st.x, land.y-st.y);
  const inZone = land.y>=ZONE_Y0 && land.y<=ZONE_Y1 && land.x>GML-40 && land.x<GMR+40;
  const keeperReach = Math.hypot(land.x-KEEPER.x, land.y-KEEPER.y) < 48;
  const defReach = Math.hypot(land.x-defender.x, land.y-defender.y) < 30;
  if(d<44 && inZone && !keeperReach && !defReach){
    result='goal'; onResult('goal', d<20?'ドンピシャ！ ヘディング弾！':'ヘディングゴォール！');
  } else if(keeperReach){
    result='save'; onResult('save','キーパーがキャッチ！');
  } else if(defReach){
    result='clear'; onResult('clear','DFにクリアされた！');
  } else {
    result='miss'; onResult('miss', d>=44? '合わなかった…':'枠を捉えられず');
  }
}

function onResult(kind,message){
  result=kind; state='result'; msg=message; msgT=130;
  if(kind==='goal'){
    goals++; streak++; if(streak>best){best=streak; save();}
    if(streak>=3) msg+=`（${streak}連続）`;
    S.head(); setTimeout(S.net,70); setTimeout(S.cheer,150); netRipple=1; flash=0.5; flashCol='#eafff0'; shakeT=14; shakeM=5;
    burst(land.x,land.y,'#ffe14d',22); burst(land.x,land.y,'#5cc98a',14);
  } else {
    misses++; streak=0;
    if(kind==='save'){ S.save(); flash=0.26; flashCol='#88bbff'; }
    else if(kind==='clear'){ S.miss(); flash=0.24; flashCol='#9fb0ff'; burst(defender.x,defender.y,'#9fb0ff',12); }
    else { S.miss(); }
    shakeT=8; shakeM=3;
  }
  if(misses>=3){ setTimeout(()=>{ state='over'; msg='試合終了'; msgT=99999; }, 900); }
  else setTimeout(()=>{ if(state==='result') nextPlay(); }, 1050);
}
function save(){ try{localStorage.setItem('pc_best',''+best);}catch(e){} }
function burst(x,y,col,n){ for(let i=0;i<n;i++){ const a=Math.random()*6.28,sp=1+Math.random()*5;
  parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-2,life:1,col,r:2+Math.random()*3}); } }

// ---- input ----
function toStage(clientX,clientY){ const r=cv.getBoundingClientRect(); return {x:(clientX-r.left)/r.width*W,y:(clientY-r.top)/r.height*H}; }
cv.addEventListener('pointermove',e=>{ const p=toStage(e.clientX,e.clientY); hover=p; });
cv.addEventListener('pointerdown',e=>{ e.preventDefault();
  const a=ac(); if(a&&a.state==='suspended')a.resume();
  if(state==='ready'||state==='over'){ reset(); return; }
  if(state==='run'){ const p=toStage(e.clientX,e.clientY); cross(p.x,p.y); }
});
window.addEventListener('keydown',e=>{ if((e.code==='Space'||e.code==='Enter')&&(state==='ready'||state==='over')){ e.preventDefault(); reset(); } });

// ---- update ----
let last=0;
function update(dt){
  t+=dt; if(msgT>0)msgT--; if(flash>0)flash=Math.max(0,flash-dt*2); if(shakeT>0)shakeT--;
  if(netRipple>0)netRipple=Math.max(0,netRipple-dt*1.6);
  // defender patrols
  defender.x+=defender.dir*60*dt; if(defender.x<GML-30){defender.dir=1;} if(defender.x>GMR+30){defender.dir=-1;}
  if(state==='run'){
    s+=runSpeed*dt; const sp=strikerAt(s); striker.x=sp.x; striker.y=sp.y;
    if(s>=1.02){ result='miss'; onResult('miss','走り込みに合わせられず…'); }
  }
  else if(state==='fly' && fly){
    fly.t+=dt;
    // striker keeps running during flight
    s+=runSpeed*dt; const sp=strikerAt(s); striker.x=sp.x; striker.y=sp.y;
    if(fly.t>=fly.dur){ resolveCross(); fly=null; }
  }
  for(let i=parts.length-1;i>=0;i--){ const q=parts[i]; q.x+=q.vx;q.y+=q.vy;q.vy+=0.16;q.life-=dt*1.1; if(q.life<=0)parts.splice(i,1); }
}

// ---- draw ----
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function lerp(a,b,p){return a+(b-a)*p;}

function drawField(){
  const g=ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,'#20844a'); g.addColorStop(1,'#166237');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  for(let i=0;i<9;i++){ if(i%2){ ctx.fillStyle='rgba(255,255,255,.03)'; ctx.fillRect(0,i*H/9,W,H/9); } }
  ctx.fillStyle='#0c1c28'; ctx.fillRect(0,0,W,40);
  for(const c of crowd){ const yy=c.y+Math.sin(t*3+c.b)*1.1; ctx.fillStyle=c.c; ctx.globalAlpha=.7; ctx.fillRect(c.x,yy,5,5); }
  ctx.globalAlpha=1;
  ctx.strokeStyle='rgba(255,255,255,.5)'; ctx.lineWidth=3;
  ctx.strokeRect(250,GOALY,400,172);
  ctx.strokeRect(340,GOALY,220,68);
  ctx.beginPath(); ctx.arc(450,250,52,0.12*Math.PI,0.88*Math.PI); ctx.stroke();
  // headable zone hint
  ctx.fillStyle='rgba(92,201,138,.06)'; ctx.fillRect(GML-40,ZONE_Y0,(GMR+40)-(GML-40),ZONE_Y1-ZONE_Y0);
}

function drawGoal(){
  ctx.save(); ctx.strokeStyle='rgba(255,255,255,.16)'; ctx.lineWidth=1;
  const rip=netRipple>0?netRipple:0;
  for(let x=GML;x<=GMR;x+=12){ ctx.beginPath(); ctx.moveTo(x,GOALY-42); ctx.lineTo(x,GOALY); ctx.stroke(); }
  for(let y=GOALY-42;y<=GOALY;y+=11){ ctx.beginPath();
    for(let x=GML;x<=GMR;x+=6){ const sag=Math.sin((x-GML)/(GMR-GML)*Math.PI)*rip*6; if(x===GML)ctx.moveTo(x,y+sag); else ctx.lineTo(x,y+sag);} ctx.stroke(); }
  ctx.restore();
  ctx.strokeStyle='#f4f8ff'; ctx.lineWidth=6; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(GML,GOALY); ctx.lineTo(GML,GOALY-42); ctx.lineTo(GMR,GOALY-42); ctx.lineTo(GMR,GOALY); ctx.stroke();
}

function person(x,y,col,label){
  ctx.save(); ctx.translate(x,y);
  ctx.fillStyle='rgba(0,0,0,.22)'; ctx.beginPath(); ctx.ellipse(0,14,12,4,0,0,6.28); ctx.fill();
  ctx.strokeStyle='#20304a'; ctx.lineWidth=5; ctx.lineCap='round';
  const sw=Math.sin(t*18)*4;
  ctx.beginPath(); ctx.moveTo(-2,-4); ctx.lineTo(-5+sw,12); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(2,-4); ctx.lineTo(5-sw,12); ctx.stroke();
  ctx.fillStyle=col; rr(-11,-26,22,24,6); ctx.fill();
  ctx.fillStyle='#f0c39a'; ctx.beginPath(); ctx.arc(0,-32,7,0,6.28); ctx.fill();
  ctx.restore();
  if(label){ ctx.fillStyle='rgba(255,255,255,.6)'; ctx.font='11px sans-serif'; ctx.textAlign='center'; ctx.fillText(label,x,y+26); }
}

function drawKeeper(){ const k=KEEPER; ctx.save(); ctx.translate(k.x,k.y);
  ctx.fillStyle='rgba(0,0,0,.22)'; ctx.beginPath(); ctx.ellipse(0,12,12,4,0,0,6.28); ctx.fill();
  ctx.fillStyle='#22cc88'; rr(-11,-22,22,26,6); ctx.fill();
  ctx.fillStyle='#f0c39a'; ctx.beginPath(); ctx.arc(0,-28,7,0,6.28); ctx.fill();
  ctx.strokeStyle='#22cc88'; ctx.lineWidth=6; ctx.lineCap='round'; ctx.beginPath(); ctx.moveTo(0,-14); ctx.lineTo(-14,-20); ctx.moveTo(0,-14); ctx.lineTo(14,-20); ctx.stroke();
  ctx.restore(); }

function drawStrikerPath(){
  if(state!=='run' && state!=='fly') return;
  // faint run line + predicted meeting hint
  ctx.strokeStyle='rgba(255,235,120,.28)'; ctx.lineWidth=2; ctx.setLineDash([6,8]);
  ctx.beginPath(); ctx.moveTo(RUN_A.x,RUN_A.y); ctx.lineTo(RUN_B.x,RUN_B.y); ctx.stroke(); ctx.setLineDash([]);
  // hover preview: predicted striker meet point for the aimed landing
  if(state==='run' && hover){
    const ft=flightTime(CROSSER,hover);
    const sp=strikerAt(s+runSpeed*ft);
    // landing ring
    ctx.strokeStyle='rgba(255,255,255,.7)'; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(hover.x,hover.y,10,0,6.28); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(hover.x-14,hover.y); ctx.lineTo(hover.x+14,hover.y); ctx.moveTo(hover.x,hover.y-14); ctx.lineTo(hover.x,hover.y+14); ctx.stroke();
    // predicted striker position at arrival
    const near=Math.hypot(hover.x-sp.x,hover.y-sp.y)<44;
    ctx.fillStyle= near?'rgba(92,201,138,.85)':'rgba(255,140,90,.7)';
    ctx.beginPath(); ctx.arc(sp.x,sp.y,7,0,6.28); ctx.fill();
    // aim line
    ctx.strokeStyle='rgba(255,255,255,.2)'; ctx.lineWidth=1.5; ctx.beginPath(); ctx.moveTo(CROSSER.x,CROSSER.y); ctx.lineTo(hover.x,hover.y); ctx.stroke();
  }
}

function drawBall(){
  if(state==='fly' && fly){
    const p=Math.min(1,fly.t/fly.dur);
    const x=lerp(fly.from.x,fly.to.x,p), y=lerp(fly.from.y,fly.to.y,p)-Math.sin(p*Math.PI)*54;
    // shadow
    ctx.fillStyle='rgba(0,0,0,.2)'; const sx=lerp(fly.from.x,fly.to.x,p), sy=lerp(fly.from.y,fly.to.y,p);
    ctx.beginPath(); ctx.ellipse(sx,sy,7,3,0,0,6.28); ctx.fill();
    ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(x,y,8,0,6.28); ctx.fill();
    ctx.fillStyle='#1a1a1a'; for(let i=0;i<5;i++){ const a=i/5*6.28+t*3; ctx.beginPath(); ctx.arc(x+Math.cos(a)*4,y+Math.sin(a)*4,1.5,0,6.28); ctx.fill(); }
  } else if(state==='run'){
    ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(CROSSER.x+14,CROSSER.y-2,8,0,6.28); ctx.fill();
    ctx.strokeStyle='rgba(0,0,0,.2)'; ctx.lineWidth=1; ctx.beginPath(); ctx.arc(CROSSER.x+14,CROSSER.y-2,8,0,6.28); ctx.stroke();
  } else if(state==='result' && result==='goal' && land){
    ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(lerp(land.x,450,0.4),lerp(land.y,GOALY,0.5),7,0,6.28); ctx.fill();
  }
}

function drawHUD(){
  ctx.textAlign='left'; hud(14,10,'得点 GOALS',goals,'#ffe14d');
  ctx.textAlign='center'; hudC(W/2,10,'連続 STREAK',streak,'#7fd0ff');
  ctx.textAlign='right'; hudR(W-14,10,'ミス MISS',misses+' /3','#ff7d6b');
  ctx.fillStyle='rgba(255,255,255,.5)'; ctx.font='12px sans-serif'; ctx.textAlign='right';
  ctx.fillText('自己ベスト連続 '+best, W-16, 78);
}
function hud(x,y,l,v,c){ ctx.fillStyle='rgba(6,18,28,.72)'; rr(x,y,116,48,9); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.6)'; ctx.font='11px sans-serif'; ctx.textAlign='left'; ctx.fillText(l,x+10,y+17);
  ctx.fillStyle=c; ctx.font='bold 21px sans-serif'; ctx.fillText(v,x+10,y+40); }
function hudC(x,y,l,v,c){ const w=116; ctx.fillStyle='rgba(6,18,28,.72)'; rr(x-w/2,y,w,48,9); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.6)'; ctx.font='11px sans-serif'; ctx.textAlign='center'; ctx.fillText(l,x,y+17);
  ctx.fillStyle=c; ctx.font='bold 21px sans-serif'; ctx.fillText(v,x,y+40); }
function hudR(x,y,l,v,c){ const w=116; ctx.fillStyle='rgba(6,18,28,.72)'; rr(x-w,y,w,48,9); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.6)'; ctx.font='11px sans-serif'; ctx.textAlign='right'; ctx.fillText(l,x-10,y+17);
  ctx.fillStyle=c; ctx.font='bold 21px sans-serif'; ctx.fillText(v,x-10,y+40); }

function drawMsg(){ if(msgT>0&&msg){ const my=566; ctx.textAlign='center'; ctx.font='bold 20px sans-serif';
  const tw=ctx.measureText(msg).width; ctx.fillStyle='rgba(4,10,18,.62)'; rr(W/2-tw/2-14,my-24,tw+30,33,10); ctx.fill();
  ctx.fillStyle='#fff'; ctx.fillText(msg,W/2,my); } }

function drawOverlay(){
  ctx.fillStyle='rgba(4,10,18,.76)'; ctx.fillRect(0,0,W,H); ctx.textAlign='center';
  ctx.fillStyle='rgba(255,255,255,.55)'; ctx.font='14px sans-serif'; ctx.fillText('SOCCER · CROSSING',W/2,120);
  ctx.fillStyle='#fff'; ctx.font='bold 46px sans-serif'; ctx.fillText('ピンポイントクロス',W/2,180);
  ctx.fillStyle='#ffe14d'; ctx.font='bold 22px sans-serif'; ctx.fillText('Pinpoint Cross',W/2,214);
  ctx.fillStyle='rgba(255,255,255,.82)'; ctx.font='16px sans-serif';
  const lines=['味方がゴール前へ走り込む！ ボールの飛行時間を読み、','走者の"先"（到達点）をタップしてクロスを落とす。','緑の予測点と落下点が重なればドンピシャのヘディング弾。','キーパーの近く・DFの位置・枠外は失敗。','走り込みに間に合わないと不発。3ミスで終了。'];
  lines.forEach((l,i)=>ctx.fillText(l,W/2,252+i*25));
  const bw=220,bh=54,bx=(W-bw)/2,by=446; ctx.fillStyle='#e8544e'; rr(bx,by,bw,bh,12); ctx.fill();
  ctx.fillStyle='#fff'; ctx.font='bold 24px sans-serif'; ctx.fillText('キックオフ',W/2,by+35);
  ctx.fillStyle='rgba(255,255,255,.5)'; ctx.font='13px sans-serif'; ctx.fillText('タップ / Space',W/2,by+bh+22);
}
function drawOver(){
  ctx.fillStyle='rgba(4,10,18,.8)'; ctx.fillRect(0,0,W,H); ctx.textAlign='center';
  ctx.fillStyle='#fff'; ctx.font='bold 46px sans-serif'; ctx.fillText('試合終了',W/2,224);
  ctx.fillStyle='#ffe14d'; ctx.font='bold 28px sans-serif'; ctx.fillText('ゴール数 '+goals,W/2,278);
  ctx.fillStyle='#5cc98a'; ctx.font='20px sans-serif'; ctx.fillText('自己ベスト連続 '+best,W/2,314);
  const bw=220,bh=54,bx=(W-bw)/2,by=358; ctx.fillStyle='#e8544e'; rr(bx,by,bw,bh,12); ctx.fill();
  ctx.fillStyle='#fff'; ctx.font='bold 24px sans-serif'; ctx.fillText('もう一度',W/2,by+35);
  ctx.fillStyle='rgba(255,255,255,.5)'; ctx.font='13px sans-serif'; ctx.fillText('タップ / Space',W/2,by+bh+22);
}

function render(){
  ctx.save(); if(shakeT>0){ const s2=shakeM*(shakeT/14); ctx.translate((Math.random()*2-1)*s2,(Math.random()*2-1)*s2); }
  drawField(); drawGoal(); drawStrikerPath(); drawKeeper();
  person(defender.x,defender.y,'#2b2f38','DF');
  if(state!=='ready') person(striker.x,striker.y,'#e8544e','味方');
  person(CROSSER.x,CROSSER.y,'#4a90d9','自分');
  drawBall();
  for(const q of parts){ ctx.globalAlpha=Math.max(0,q.life); ctx.fillStyle=q.col; ctx.beginPath(); ctx.arc(q.x,q.y,q.r,0,6.28); ctx.fill(); }
  ctx.globalAlpha=1;
  drawHUD(); drawMsg();
  ctx.restore();
  if(flash>0){ ctx.fillStyle=flashCol; ctx.globalAlpha=flash; ctx.fillRect(0,0,W,H); ctx.globalAlpha=1; }
  if(state==='ready') drawOverlay();
  if(state==='over') drawOver();
}
function loop(ts){ if(!last)last=ts; let dt=(ts-last)/1000; last=ts; if(dt>0.05)dt=0.05; update(dt); render(); requestAnimationFrame(loop); }
requestAnimationFrame(loop);

if(TEST){
  window.__pc={
    get state(){return state;},
    get s(){return s;},
    get runSpeed(){return runSpeed;},
    get striker(){return {x:striker.x,y:striker.y};},
    get defender(){return {x:defender.x,y:defender.y};},
    strikerAt(ss){return strikerAt(ss);},
    flightTime(x,y){return flightTime(CROSSER,{x,y});},
    get crosser(){return {x:CROSSER.x,y:CROSSER.y};},
    get result(){return result;},
    get count(){return {goals,misses,streak,level};},
    cross(x,y){ cross(x,y); },
    tap(){ if(state==='ready'||state==='over')reset(); }
  };
}
})();
</script>
