<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>緩急ドリブル (Change of Pace)</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;background:#08120a;overflow:hidden;font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",system-ui,sans-serif}
  #wrap{width:100%;height:100%;display:flex;align-items:center;justify-content:center}
  #stage{position:relative;width:min(100vw,calc(100vh*1.5));aspect-ratio:900/600;max-width:900px;
    box-shadow:0 10px 60px rgba(0,0,0,.6);border-radius:10px;overflow:hidden;touch-action:none}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
  #hint{position:absolute;left:0;bottom:6px;width:100%;text-align:center;color:#cfe;
    font-size:12px;opacity:.55;pointer-events:none;text-shadow:0 1px 3px #000}
</style>
</head>
<body>
<div id="wrap"><div id="stage">
  <canvas id="cv"></canvas>
  <div id="hint">左右に揺さぶって（ドラッグ / ←→）DFをズラし、空いた側へバースト（下ボタン / SPACE）で抜き去れ！ 正面から仕掛けると寄せ切られる</div>
</div></div>
<script>
(()=>{
const cv=document.getElementById('cv'), g=cv.getContext('2d');
const W=900,H=600;
let DPR=1;
function fit(){ DPR=Math.min(2,window.devicePixelRatio||1); cv.width=W*DPR; cv.height=H*DPR; g.setTransform(DPR,0,0,DPR,0,0); }
fit(); addEventListener('resize',fit);

// ---------- audio ----------
let AC=null;
function ac(){ if(!AC){ try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){} } return AC; }
function tone(f,d,t,v,sweep){ const a=ac(); if(!a)return; const o=a.createOscillator(),gg=a.createGain();
  o.type=t||'sine'; o.frequency.value=f; if(sweep) o.frequency.exponentialRampToValueAtTime(Math.max(20,sweep),a.currentTime+d);
  gg.gain.setValueAtTime(0.0001,a.currentTime); gg.gain.exponentialRampToValueAtTime(v||0.2,a.currentTime+0.012);
  gg.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+d); o.connect(gg).connect(a.destination);
  o.start(); o.stop(a.currentTime+d+0.02); }
function noise(d,v,hp){ const a=ac(); if(!a)return; const n=a.createBuffer(1,a.sampleRate*d,a.sampleRate); const ch=n.getChannelData(0);
  for(let i=0;i<ch.length;i++) ch[i]=(Math.random()*2-1)*(1-i/ch.length);
  const s=a.createBufferSource(); s.buffer=n; const f=a.createBiquadFilter(); f.type='highpass'; f.frequency.value=hp||600;
  const gg=a.createGain(); gg.gain.value=v||0.15; s.connect(f).connect(gg).connect(a.destination); s.start(); }
const S={
  burst(){ noise(0.05,0.14,600); tone(300,0.07,'square',0.1,520); },
  beat(){ tone(520,0.08,'triangle',0.11,760); setTimeout(()=>tone(780,0.1,'triangle',0.1,1040),70); },
  goal(){ tone(520,0.1,'triangle',0.14,780); setTimeout(()=>tone(780,0.12,'triangle',0.12,1040),90); setTimeout(()=>tone(1040,0.14,'triangle',0.1,1320),190); noise(0.3,0.1,400); },
  tackle(){ noise(0.14,0.2,400); tone(200,0.16,'sawtooth',0.13,80); },
  over(){ tone(300,0.5,'sawtooth',0.16,90); setTimeout(()=>tone(200,0.6,'sawtooth',0.14,60),160); },
};

// ---------- geometry ----------
const PY=452, DY=352, GY=96, BEAT_GAP=88, TARGET=4;

// ---------- state ----------
let state='title';
let parts=[], pops=[];
let score, combo, best, lvl, tackles, runs;
let phase='drive', px=450, def=null, progress=0, t=0, resT=0, pend=null, pendDelay=0;
let burstT=0, tgt=null, dragging=false, keyDir={l:0,r:0};
let flash=0, shakeT=0;
try{ best=+localStorage.getItem('cp_best')||0; }catch(e){ best=0; }

const crowd=[]; { const cc=['#e6b48f','#9bd0e6','#e6dc8f','#c9a0d8','#8fd8bd','#f0f0f0']; for(let i=0;i<220;i++) crowd.push({x:(i*29.7)%W, y:2+((i*61)%54), c:cc[i%cc.length]}); }
function clamp(v,a,b){ return v<a?a:v>b?b:v; }
function rnd(a,b){ return a+Math.random()*(b-a); }
function chance(p){ return Math.random()<p; }

function reset(){ parts=[]; pops=[]; score=0; combo=0; lvl=0; tackles=0; runs=0; progress=0; px=450; newDefender(); }
function newDefender(){
  phase='drive'; t=0; resT=0; pend=null;
  const tm=clamp(2700 - lvl*190, 1150, 2700);
  def={ x:clamp(px+rnd(-30,30),120,780), lag:clamp(0.009+lvl*0.0012,0.009,0.02), timer:tm, tmax:tm, beaten:false };
}
function burst(){
  if(state!=='play'||phase!=='drive'||def.beaten) return;
  const gap=Math.abs(px-def.x); S.burst();
  for(let i=0;i<6;i++) parts.push({x:px,y:PY,vx:rnd(-3,3),vy:rnd(-4,-1),life:0.6,c:'#cfe'});
  if(gap>BEAT_GAP){ def.beaten=true; combo++; const gained=40+combo*8; score+=gained;
    S.beat(); pops.push({txt:'抜いた！ +'+gained,x:px,y:PY-30,big:false,life:0.8,c:'#8fffb0'});
    progress++; lvl=Math.min(6, Math.floor(runs*2 + progress/2));
    if(progress>=TARGET){ goalRun(); } else { phase='pass'; passT=0; }
  } else { tackled('正面から寄せ切られた！'); }
}
let passT=0;
function goalRun(){ phase='shoot'; shootT=0; }
let shootT=0;
function tackled(msg){ tackles++; combo=0; shakeT=0.3; flash=Math.max(flash,0.3); S.tackle();
  pops.push({txt:msg,x:W/2,y:180,big:true,life:1.05,c:'#ff6a6a'});
  for(let i=0;i<10;i++) parts.push({x:px,y:PY,vx:rnd(-6,6),vy:rnd(-5,2),life:0.9,c:'#ff9a6a'});
  phase='resolve'; resT=0; pendDelay=1000; pend = tackles>=3 ? 'over':'reset'; }
function scoreGoal(){ runs++; combo++; const gained=180+combo*12; score+=gained; S.goal(); flash=Math.max(flash,0.4);
  pops.push({txt:'ゴール！ 突破成功 +'+gained,x:W/2,y:150,big:true,life:1.2,c:'#8fffb0'});
  for(let i=0;i<24;i++) parts.push({x:450,y:GY,vx:rnd(-7,7),vy:rnd(-6,2),life:1.1,c:'#bfffcf'});
  phase='resolve'; resT=0; pendDelay=1050; pend='newrun'; }
function gameOver(){ state='over'; S.over(); if(score>best){ best=score; try{localStorage.setItem('cp_best',best);}catch(e){} } }

// ---------- input ----------
function start(){ ac(); reset(); state='play'; }
function pt(e){ const r=cv.getBoundingClientRect(); return {x:(e.clientX-r.left)/r.width*W, y:(e.clientY-r.top)/r.height*H}; }
cv.addEventListener('pointerdown',e=>{ ac(); if(state!=='play'){ start(); return; } const p=pt(e);
  if(p.y>H-78){ burst(); } else { dragging=true; tgt=p.x; } e.preventDefault(); });
cv.addEventListener('pointermove',e=>{ if(dragging){ tgt=pt(e).x; } });
window.addEventListener('pointerup',()=>{ dragging=false; });
addEventListener('keydown',e=>{ const k=e.key.toLowerCase();
  if(state!=='play'){ if(!e.repeat) start(); return; }
  if(k==='arrowleft'||k==='a'){ keyDir.l=1; tgt=null; e.preventDefault(); } else if(k==='arrowright'||k==='d'){ keyDir.r=1; tgt=null; e.preventDefault(); }
  else if(k===' '||k==='arrowup'||k==='w'||k==='enter'){ if(!e.repeat) burst(); e.preventDefault(); } });
addEventListener('keyup',e=>{ const k=e.key.toLowerCase(); if(k==='arrowleft'||k==='a')keyDir.l=0; else if(k==='arrowright'||k==='d')keyDir.r=0; });

// ---------- update ----------
function update(dt){
  if(flash>0) flash=Math.max(0,flash-dt*0.003);
  if(shakeT>0) shakeT-=dt*0.001;
  parts.forEach(q=>{q.x+=q.vx;q.y+=q.vy;q.vy+=0.14;q.life-=dt*0.0022;});
  parts=parts.filter(q=>q.life>0);
  pops.forEach(q=>{q.y-=dt*0.02;q.life-=dt*0.0014;});
  pops=pops.filter(q=>q.life>0);
  if(state!=='play') return;

  // player steering
  if(phase==='drive'||phase==='pass'){
    const kx=(keyDir.r-keyDir.l);
    if(kx){ px=clamp(px+kx*0.62*dt, 70, 830); }
    else if(dragging && tgt!=null){ const d=tgt-px; px=clamp(px+clamp(d,-0.7*dt,0.7*dt),70,830); }
    else if(tgt!=null){ const d=tgt-px; if(Math.abs(d)>2) px=clamp(px+clamp(d,-0.7*dt,0.7*dt),70,830); }
  }

  if(phase==='drive'){
    t+=dt; const d=def;
    d.x += (px-d.x)*d.lag*dt*0.06;   // jockey tracks with lag
    d.timer-=dt;
    if(d.timer<=0){ tackled('間合いを詰められた！'); }
  } else if(phase==='pass'){
    passT+=dt; if(passT>=260){ newDefender(); }
  } else if(phase==='shoot'){
    shootT+=dt; if(shootT>=420){ scoreGoal(); }
  } else if(phase==='resolve'){
    resT+=dt;
    if(resT>=pendDelay && pend){ const pp=pend; pend=null;
      if(pp==='over') gameOver(); else if(pp==='newrun'){ progress=0; px=450; newDefender(); } else { newDefender(); } }
  }
}

// ---------- render ----------
function man(x,y,col,r){ r=r||15; g.fillStyle=col; g.beginPath(); g.arc(x,y-r,r*0.7,0,6.28); g.fill();
  g.fillRect(x-r*0.55,y-r*0.6,r*1.1,r*1.4); g.fillStyle='rgba(0,0,0,0.18)'; g.beginPath(); g.ellipse(x,y+r*0.8,r*0.9,r*0.32,0,0,6.28); g.fill(); }
function drawField(){
  const gr=g.createLinearGradient(0,0,0,H); gr.addColorStop(0,'#1f7a42'); gr.addColorStop(1,'#2c9350'); g.fillStyle=gr; g.fillRect(0,0,W,H);
  g.globalAlpha=0.05; for(let i=0;i<10;i++){ g.fillStyle=i%2?'#fff':'#000'; g.fillRect(0,i*60,W,60); } g.globalAlpha=1;
  g.fillStyle='#14324a'; g.fillRect(0,0,W,60);
  for(const c of crowd){ g.fillStyle=c.c; g.globalAlpha=0.6; g.fillRect(c.x,c.y,3,3); } g.globalAlpha=1;
  g.strokeStyle='#fff'; g.lineWidth=5; g.beginPath(); g.moveTo(370,GY); g.lineTo(530,GY); g.stroke();
  g.strokeStyle='rgba(255,255,255,0.3)'; g.lineWidth=2; g.strokeRect(320,GY,260,120);
}
function drawScene(){
  const d=def;
  // progress-to-goal ladder
  for(let i=0;i<TARGET;i++){ g.fillStyle=i<progress?'#8fffb0':'rgba(255,255,255,0.2)'; g.beginPath(); g.arc(60, 150+i*40, 8,0,6.28); g.fill(); }
  g.save(); g.textAlign='left'; g.fillStyle='rgba(255,255,255,0.6)'; g.font='bold 12px sans-serif'; g.fillText('突破', 44, 128); g.restore();
  // player position adjustments for shoot
  let pyy=PY; let ball={x:px+12,y:PY+8};
  if(phase==='shoot'){ const s=clamp(shootT/420,0,1); pyy=PY-(PY-GY-30)*s; ball={x:px,y:pyy-8}; }
  // defender
  if(phase==='drive'||phase==='pass'){
    const beaten=phase==='pass';
    man(d.x, beaten?DY+40:DY, beaten?'rgba(211,78,78,0.5)':'#d34e4e',15);
    // reach zone
    if(phase==='drive'){ g.strokeStyle= Math.abs(px-d.x)>BEAT_GAP?'rgba(143,255,176,0.4)':'rgba(255,120,90,0.4)'; g.lineWidth=2;
      g.beginPath(); g.moveTo(d.x-BEAT_GAP,DY+26); g.lineTo(d.x-BEAT_GAP,DY-26); g.moveTo(d.x+BEAT_GAP,DY-26); g.lineTo(d.x+BEAT_GAP,DY+26); g.stroke(); }
  }
  // player + ball
  man(px,pyy,'#2f6fd0',15);
  g.fillStyle='#fff'; g.beginPath(); g.arc(ball.x,ball.y,7,0,6.28); g.fill();
  // gap indicator + prompt
  if(phase==='drive'){
    const gap=Math.abs(px-d.x); const ok=gap>BEAT_GAP;
    g.textAlign='center'; g.fillStyle=ok?'#8fffb0':'rgba(255,255,255,0.75)'; g.font='bold 20px sans-serif';
    g.fillText(ok?'空いた！バースト！':'DFを揺さぶれ…',W/2,84);
    // pressure timer bar
    const f=clamp(d.timer/ d.tmax,0,1);
    g.fillStyle='rgba(255,255,255,0.18)'; g.fillRect(W/2-150,98,300,7); g.fillStyle=f<0.3?'#ff6a6a':'#ffd84a'; g.fillRect(W/2-150,98,300*f,7);
    // burst button
    g.fillStyle='rgba(0,0,0,0.3)'; g.fillRect(W/2-100,H-70,200,46); g.fillStyle=ok?'#8fffb0':'#ffd84a'; g.font='bold 22px sans-serif'; g.fillText('バースト！',W/2,H-40);
  }
}
function drawHUD(){
  g.textAlign='left'; g.fillStyle='#fff'; g.font='bold 25px sans-serif'; g.fillText('SCORE '+score,20,34);
  if(combo>1){ g.fillStyle='#ffd84a'; g.font='bold 16px sans-serif'; g.fillText(combo+' 連続突破',20,56); }
  g.textAlign='right'; g.fillStyle='rgba(255,255,255,0.8)'; g.font='14px sans-serif'; g.fillText('ゴール '+runs+'  Lv.'+(lvl+1),W-20,32);
  g.fillStyle='#ff6a6a'; g.textAlign='right'; g.font='bold 14px sans-serif'; g.fillText('被タックル',W-104,H-18);
  for(let i=0;i<3;i++){ g.fillStyle=i<tackles?'#ff5a5a':'rgba(255,255,255,0.24)'; g.beginPath(); g.arc(W-80+i*22,H-23,8,0,6.28); g.fill(); }
}
function drawTitle(){
  g.fillStyle='rgba(0,0,0,0.5)'; g.fillRect(0,0,W,H);
  g.textAlign='center'; g.fillStyle='#8fffb0'; g.font='bold 54px sans-serif'; g.fillText('緩急ドリブル',W/2,158);
  g.fillStyle='#fff'; g.font='bold 22px sans-serif'; g.fillText('Change of Pace — 揺さぶって抜き去れ',W/2,196);
  g.fillStyle='#cfe'; g.font='18px sans-serif';
  g.fillText('DFは遅れて付いてくる。左右に大きく揺さぶって（ドラッグ / ←→）ズラし、',W/2,250);
  g.fillText('緑ラインより外＝空いた側へバースト（下ボタン / SPACE）で一気に抜く。',W/2,278);
  g.fillText('正面（DFの間合い内）で仕掛けると寄せ切られる。詰められる前に決断。',W/2,306);
  g.fillText('4人抜いてゴール＝突破成功。3被タックルで終了。',W/2,334);
  g.fillStyle='#ffd84a'; g.font='bold 22px sans-serif'; g.fillText('クリック / タップ / キー でスタート',W/2,402);
}
function drawOver(){
  g.fillStyle='rgba(0,0,0,0.62)'; g.fillRect(0,0,W,H);
  g.textAlign='center'; g.fillStyle='#ff6a6a'; g.font='bold 54px sans-serif'; g.fillText('3被タックル…終了',W/2,H/2-54);
  g.fillStyle='#fff'; g.font='bold 34px sans-serif'; g.fillText('SCORE '+score,W/2,H/2+2);
  g.fillStyle='#cfe'; g.font='20px sans-serif'; g.fillText('突破 '+runs+'　BEST '+best,W/2,H/2+40);
  g.fillStyle='#8fffb0'; g.font='bold 22px sans-serif'; g.fillText('クリック / タップ で もう一度',W/2,H/2+96);
}
function render(){
  g.setTransform(DPR,0,0,DPR,0,0);
  let sx=0,sy=0; if(shakeT>0){ sx=rnd(-6,6)*shakeT*3; sy=rnd(-6,6)*shakeT*3; g.translate(sx,sy); }
  drawField();
  if(state==='play'||state==='over') drawScene();
  parts.forEach(q=>{ g.globalAlpha=clamp(q.life,0,1); g.fillStyle=q.c; g.beginPath(); g.arc(q.x,q.y,3,0,6.28); g.fill(); }); g.globalAlpha=1;
  pops.forEach(q=>{ g.globalAlpha=clamp(q.life,0,1); g.textAlign='center'; g.fillStyle=q.c; g.font='bold '+(q.big?30:20)+'px sans-serif';
    const px2=(q.x==null)?W/2:q.x; g.fillText(q.txt,px2,q.y); }); g.globalAlpha=1;
  if(state==='play') drawHUD();
  if(flash>0){ g.fillStyle='rgba(255,255,255,'+(flash*0.6)+')'; g.fillRect(0,0,W,H); }
  if(state==='title') drawTitle();
  if(state==='over') drawOver();
  g.setTransform(DPR,0,0,DPR,0,0);
}

let last=0;
function frame(ts){ let dt=ts-last; last=ts; if(dt>60)dt=60; if(dt<0)dt=0; update(dt); render(); requestAnimationFrame(frame); }
requestAnimationFrame(frame);

// ---------- test hook ----------
window.__cp={
  start, burst:()=>burst(), steer:(x)=>{ tgt=clamp(x,70,830); dragging=false; },
  get state(){return state;}, get score(){return score;}, get tackles(){return tackles;}, get runs(){return runs;},
  get info(){ if(state!=='play') return {state,phase:'-'}; return {
    state, phase, px, defX:def&&def.x, gap:def?Math.abs(px-def.x):0, beatGap:BEAT_GAP, timer:def&&def.timer, progress, runs, tackles }; }
};
})();
</script>
</body>
</html>
