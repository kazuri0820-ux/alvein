<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>PK シュートアウト — Penalty Shootout</title>
<style>
  :root{
    --pitch-dark:#0b3a22; --pitch:#137a43; --pitch-light:#1c9a55;
    --chalk:#eaf3ec; --cream:#f5edcf; --kick:#ff5a3c; --cyan:#3ae8cf;
    --ink:#06210f; --night-top:#071a2e; --night-bot:#0b3a22;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:#04121f;
    font-family:"Arial Narrow","Roboto Condensed",system-ui,sans-serif;
    color:var(--chalk);
    display:flex;align-items:center;justify-content:center;
    overflow:hidden;-webkit-user-select:none;user-select:none;touch-action:manipulation;
  }
  #stage{
    position:relative;width:min(100vw,calc(100vh*1.5));aspect-ratio:3/2;
    max-height:100vh;box-shadow:0 30px 80px rgba(0,0,0,.6);overflow:hidden;
    background:linear-gradient(#071a2e,#0b3a22);
  }
  canvas{display:block;width:100%;height:100%}
  /* Scoreboard jumbotron */
  #hud{
    position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;
    align-items:stretch;padding:clamp(6px,1.4vw,14px);gap:8px;pointer-events:none;
    font-family:"Arial Narrow",system-ui,sans-serif;
  }
  .board{
    background:rgba(4,10,18,.72);backdrop-filter:blur(6px);
    border:1px solid rgba(58,232,207,.35);border-radius:10px;
    padding:6px clamp(10px,1.6vw,18px);display:flex;flex-direction:column;line-height:1;
  }
  .board .label{font-size:clamp(9px,1.3vw,12px);letter-spacing:.22em;text-transform:uppercase;color:var(--cyan);opacity:.85}
  .board .value{
    font-family:"Courier New",monospace;font-weight:700;
    font-size:clamp(20px,4.4vw,40px);font-variant-numeric:tabular-nums;color:var(--cream);
    text-shadow:0 0 14px rgba(245,237,207,.35);
  }
  #streak{color:var(--kick)}
  #msg{
    position:absolute;top:38%;left:0;right:0;text-align:center;pointer-events:none;
    font-weight:900;letter-spacing:.04em;text-transform:uppercase;
    font-size:clamp(30px,8vw,74px);color:#fff;opacity:0;transition:opacity .18s;
    text-shadow:0 4px 0 rgba(0,0,0,.4),0 0 30px currentColor;
  }
  #hint{
    position:absolute;bottom:0;left:0;right:0;text-align:center;
    padding:8px 12px calc(8px + env(safe-area-inset-bottom));
    font-size:clamp(12px,2.2vw,17px);letter-spacing:.06em;color:var(--chalk);
    background:linear-gradient(transparent,rgba(4,10,18,.7));pointer-events:none;
  }
  #hint b{color:var(--cyan)}
  /* Start / end overlay */
  #overlay{
    position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:clamp(10px,2vw,20px);text-align:center;padding:20px;
    background:radial-gradient(120% 90% at 50% 20%,rgba(7,26,46,.55),rgba(4,18,31,.92));
    backdrop-filter:blur(3px);z-index:5;transition:opacity .4s;
  }
  #overlay.hidden{opacity:0;pointer-events:none}
  #overlay h1{
    font-size:clamp(34px,9vw,84px);font-weight:900;letter-spacing:.02em;line-height:.92;
    text-transform:uppercase;color:var(--cream);
    text-shadow:0 6px 0 rgba(0,0,0,.35),0 0 40px rgba(58,232,207,.4);
  }
  #overlay h1 span{color:var(--kick);display:block;font-size:.55em;letter-spacing:.3em}
  #overlay p{max-width:34ch;font-size:clamp(14px,2.6vw,19px);line-height:1.45;color:var(--chalk);opacity:.9}
  #playBtn{
    pointer-events:auto;cursor:pointer;border:none;border-radius:100px;
    padding:clamp(12px,2vw,18px) clamp(30px,6vw,56px);
    font-family:inherit;font-weight:900;font-size:clamp(18px,3.4vw,26px);
    letter-spacing:.14em;text-transform:uppercase;color:var(--ink);
    background:linear-gradient(180deg,var(--cyan),#12b79c);
    box-shadow:0 8px 0 #0a6a5a,0 14px 30px rgba(0,0,0,.5);
    transition:transform .08s,box-shadow .08s;
  }
  #playBtn:active{transform:translateY(5px);box-shadow:0 3px 0 #0a6a5a,0 8px 16px rgba(0,0,0,.5)}
  #playBtn:focus-visible{outline:3px solid var(--kick);outline-offset:4px}
  .sub{font-size:clamp(11px,2vw,14px);letter-spacing:.24em;text-transform:uppercase;color:var(--cyan);opacity:.8}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div id="stage">
  <canvas id="c"></canvas>
  <div id="hud">
    <div class="board"><span class="label">Score</span><span class="value" id="score">0</span></div>
    <div class="board" style="text-align:center"><span class="label">Kick</span><span class="value" id="round">1<small style="font-size:.5em;opacity:.6">/5</small></span></div>
    <div class="board" style="text-align:right"><span class="label">Streak</span><span class="value" id="streak">0</span></div>
  </div>
  <div id="msg"></div>
  <div id="hint">タップ / <b>SPACE</b> でアイム → もう一度でシュート</div>
  <div id="overlay">
    <div class="sub">Soccer · Arcade</div>
    <h1>PK<span>Shootout</span></h1>
    <p>スイープするラインが<b style="color:var(--cyan)">狙い</b>、次のバーが<b style="color:var(--kick)">パワーと高さ</b>。キーパーの逆を突け。全5本、決めまくれ。</p>
    <button id="playBtn">Kick Off</button>
    <div class="sub" style="opacity:.55">Tap / Space to play</div>
  </div>
</div>

<script>
(()=>{
"use strict";
const cvs=document.getElementById('c'), ctx=cvs.getContext('2d');
const W=900,H=600; // internal resolution
let dpr=Math.min(window.devicePixelRatio||1,2);
function resize(){
  const r=cvs.getBoundingClientRect();
  cvs.width=Math.round(r.width*dpr); cvs.height=Math.round(r.height*dpr);
  ctx.setTransform(cvs.width/W,0,0,cvs.height/H,0,0);
}
new ResizeObserver(resize).observe(cvs); resize();

// ---------- audio (WebAudio, no assets) ----------
let AC=null;
function ac(){ if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}} return AC; }
function beep(freq,dur,type='sine',vol=.25,slideTo=null){
  const a=ac(); if(!a)return;
  const o=a.createOscillator(), g=a.createGain();
  o.type=type; o.frequency.setValueAtTime(freq,a.currentTime);
  if(slideTo)o.frequency.exponentialRampToValueAtTime(slideTo,a.currentTime+dur);
  g.gain.setValueAtTime(vol,a.currentTime);
  g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+dur);
  o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime+dur);
}
function sndKick(){beep(220,.12,'square',.3,90);}
function sndGoal(){beep(523,.12,'square',.28);setTimeout(()=>beep(659,.12,'square',.28),90);setTimeout(()=>beep(880,.22,'square',.3),180);}
function sndSave(){beep(180,.18,'sawtooth',.3,70);}
function sndMiss(){beep(120,.3,'sine',.25,60);}
function sndTick(){beep(660,.03,'square',.12);}

// ---------- game state ----------
const S={AIM:'aim',POWER:'power',FLY:'fly',RESULT:'result',OVER:'over',IDLE:'idle'};
let state=S.IDLE;
let score=0, kick=1, streak=0, best=0;
const TOTAL=5;
let keeperSkill=0.32; // grows

// goal geometry (screen)
const goal={x:225,y:150,w:450,h:190}; // posts area
// aim marker
let aimX=0, aimDir=1, aimSpeed=7.2;
// power bar
let power=0, powDir=1, powSpeed=1.9;
// resolved shot
let target={x:0,y:0}, ball, keeper, result='', shake=0, particles=[], flash=0;
let tPrev=0;

function resetBall(){
  ball={x:W/2,y:520,z:0,vx:0,vy:0,vz:0,scale:1,flying:false,alpha:1};
}
function resetKeeper(){
  keeper={x:W/2,y:goal.y+goal.h-6,dive:0,diveTarget:0,armSpread:0,jump:0,decided:false,zone:1};
}
resetBall(); resetKeeper();

function startGame(){
  score=0;kick=1;streak=0;keeperSkill=0.32;
  resetBall();resetKeeper();
  document.getElementById('overlay').classList.add('hidden');
  updateHUD();
  beginAim();
}
function beginAim(){
  if(kick>TOTAL){ endGame(); return; }
  resetBall(); resetKeeper();
  aimX=goal.x; aimDir=1; power=0; powDir=1;
  result=''; flash=0;
  state=S.AIM;
  setHint('スイープするラインで<b>狙い</b>を定めてタップ');
}
function lockAim(){
  target.x=aimX; // horizontal target set
  power=0; powDir=1; state=S.POWER; sndTick();
  setHint('バーで<b>パワー＆高さ</b>を決めてシュート！');
}
function shoot(){
  state=S.FLY; sndKick();
  // vertical target from power: low power -> low & weak, mid -> good, high -> risk of over
  const p=power; // 0..1
  // target height inside goal, plus overshoot chance
  const goalTopY=goal.y+18, goalBotY=goal.y+goal.h-18;
  let ty = goalBotY - p*(goalBotY-goalTopY)*1.15; // higher power aims higher
  target.y=ty;
  const overshoot = p>0.9 ? (p-0.9)*10 : 0; // too much power -> sails over
  const flightTime = 0.62 - p*0.12; // stronger = faster
  ball.flying=true;
  ball.sx=ball.x; ball.sy=ball.y;
  ball.tx=target.x; ball.ty=ty - overshoot*40;
  ball.t=0; ball.dur=flightTime;
  ball.power=p;
  ball.overshoot=overshoot;
  // keeper decides
  keeperDecide();
}
function keeperDecide(){
  // zones: 0 left,1 center,2 right based on target.x
  const rel=(target.x-goal.x)/goal.w; // 0..1
  const shotZone = rel<0.36?0 : rel>0.64?2 : 1;
  // keeper guesses; skill = chance to guess the right zone
  let guess;
  if(Math.random()<keeperSkill){ guess=shotZone; }
  else { guess = [0,1,2][Math.floor(Math.random()*3)]; }
  keeper.zone=guess;
  keeper.decided=true;
  const zx=[goal.x+goal.w*0.18, goal.x+goal.w*0.5, goal.x+goal.w*0.82][guess];
  keeper.diveTarget=zx;
  keeper.shotZone=shotZone;
}

function resolve(){
  // did keeper save?
  const rel=(ball.tx-goal.x)/goal.w;
  const inWide = ball.tx>goal.x+6 && ball.tx<goal.x+goal.w-6;
  const over = ball.overshoot>0.05;
  let goalScored=false, saved=false, missed=false;
  if(over || !inWide){ missed=true; }
  else if(keeper.zone===keeper.shotZone){
    // keeper in right zone: save unless shot very powerful & near corner
    const cornerness=Math.abs(rel-0.5)*2; // 0 center .. 1 corner
    const beat = (ball.power*0.5 + cornerness*0.6);
    saved = Math.random() > beat; // powerful corner shots can still beat him
    goalScored=!saved;
  } else { goalScored=true; }

  if(goalScored){
    score++; streak++; best=Math.max(best,streak);
    keeperSkill=Math.min(0.72,keeperSkill+0.05);
    result='GOAL!'; flash=1; shake=14; sndGoal();
    burst(ball.x, ball.y, ['#ffef6b','#3ae8cf','#ff5a3c','#ffffff'],46);
  } else if(saved){
    streak=0; result='SAVED!'; shake=10; sndSave();
    keeper.jump=1;
    burst(keeper.x, keeper.y-40, ['#3ae8cf','#ffffff'],20);
  } else {
    streak=0; result='MISS!'; shake=6; sndMiss();
  }
  showMsg(result, goalScored?'#ffef6b':(saved?'#3ae8cf':'#ff5a3c'));
  updateHUD();
  state=S.RESULT;
  setHint(goalScored?'ナイスシュート！':'ドンマイ、次だ');
  setTimeout(()=>{ kick++; beginAim(); }, 1500);
}

function endGame(){
  state=S.OVER;
  const ov=document.getElementById('overlay');
  const rating = score>=5?'PERFECT!':score>=4?'WORLD CLASS':score>=3?'SOLID':score>=1?'KEEP TRYING':'OUCH';
  ov.querySelector('.sub').textContent='Full time';
  ov.querySelector('h1').innerHTML='SCORE<span>'+score+' / '+TOTAL+'</span>';
  ov.querySelector('p').innerHTML='判定: <b style="color:var(--cyan)">'+rating+'</b> ｜ 最高連続ゴール <b style="color:var(--kick)">'+best+'</b><br>キーパーを翻弄せよ。もう一度挑戦？';
  ov.querySelector('#playBtn').textContent='Play Again';
  ov.querySelector('.sub:last-child').textContent='Tap / Space';
  ov.classList.remove('hidden');
}

// ---------- particles ----------
function burst(x,y,cols,n){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2, sp=1+Math.random()*6;
    particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-2,life:1,
      col:cols[Math.floor(Math.random()*cols.length)],r:2+Math.random()*4});
  }
}

// ---------- HUD / msg ----------
function updateHUD(){
  document.getElementById('score').textContent=score;
  document.getElementById('round').innerHTML=Math.min(kick,TOTAL)+'<small style="font-size:.5em;opacity:.6">/'+TOTAL+'</small>';
  document.getElementById('streak').textContent=streak;
}
let msgTimer=null;
function showMsg(t,col){
  const m=document.getElementById('msg');
  m.textContent=t; m.style.color=col; m.style.opacity='1';
  clearTimeout(msgTimer);
  msgTimer=setTimeout(()=>m.style.opacity='0',1100);
}
function setHint(html){document.getElementById('hint').innerHTML=html;}

// ---------- input ----------
function act(){
  const a=ac(); if(a&&a.state==='suspended')a.resume();
  if(state===S.AIM){ lockAim(); }
  else if(state===S.POWER){ shoot(); }
}
window.addEventListener('keydown',e=>{
  if(e.code==='Space'){ e.preventDefault();
    if(state===S.IDLE||state===S.OVER){ startGame(); } else act(); }
});
cvs.addEventListener('pointerdown',e=>{ e.preventDefault(); act(); });
document.getElementById('playBtn').addEventListener('click',e=>{ e.stopPropagation(); ac()&&ac().resume&&ac().resume(); startGame(); });

// ---------- update ----------
function update(dt){
  if(state===S.AIM){
    aimX+=aimDir*aimSpeed*(dt*60/16.67);
    if(aimX>goal.x+goal.w-8){aimX=goal.x+goal.w-8;aimDir=-1;}
    if(aimX<goal.x+8){aimX=goal.x+8;aimDir=1;}
  } else if(state===S.POWER){
    power+=powDir*powSpeed*dt;
    if(power>=1){power=1;powDir=-1;} if(power<=0){power=0;powDir=1;}
  } else if(state===S.FLY){
    ball.t+=dt;
    let k=Math.min(1,ball.t/ball.dur);
    const ease=k;
    ball.x=ball.sx+(ball.tx-ball.sx)*ease;
    ball.y=ball.sy+(ball.ty-ball.sy)*ease;
    // arc height (parabola) + perspective shrink
    ball.z=Math.sin(k*Math.PI)*70*(0.6+ball.power*0.6);
    ball.scale=1-0.45*ease;
    // keeper dive animates
    keeper.dive+=(keeper.diveTarget-keeper.x-keeper.dive)*0.14;
    keeper.jump=Math.min(1,keeper.jump+dt*2);
    if(k>=1){ resolve(); }
  } else if(state===S.RESULT){
    keeper.jump=Math.max(0,keeper.jump-dt*1.5);
  }
  // particles
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.x+=p.vx; p.y+=p.vy; p.vy+=0.35; p.vx*=0.99; p.life-=dt*1.1;
    if(p.life<=0)particles.splice(i,1);
  }
  if(shake>0)shake=Math.max(0,shake-dt*30);
  if(flash>0)flash=Math.max(0,flash-dt*2);
}

// ---------- render ----------
function drawPitch(){
  // sky / stands
  const sky=ctx.createLinearGradient(0,0,0,goal.y+goal.h+40);
  sky.addColorStop(0,'#071a2e'); sky.addColorStop(1,'#0a2b1c');
  ctx.fillStyle=sky; ctx.fillRect(0,0,W,goal.y+goal.h+60);
  // crowd speckle
  ctx.save();
  for(let i=0;i<160;i++){
    const x=(i*53%W), y=20+(i*29%110);
    ctx.fillStyle=['#13314a','#1c4a30','#2a2f5a','#3a2f2f'][i%4];
    ctx.globalAlpha=.5; ctx.fillRect(x,y,6,5);
  }
  ctx.restore();
  // pitch
  const g=ctx.createLinearGradient(0,goal.y+goal.h-20,0,H);
  g.addColorStop(0,'#0e5e33'); g.addColorStop(1,'#0b3a22');
  ctx.fillStyle=g; ctx.fillRect(0,goal.y+goal.h-20,W,H);
  // mowing stripes (perspective)
  for(let i=0;i<8;i++){
    const y0=goal.y+goal.h-20+i* ( (H-(goal.y+goal.h-20))/8 );
    ctx.fillStyle= i%2? 'rgba(255,255,255,.045)':'rgba(0,0,0,.05)';
    ctx.fillRect(0,y0,W,(H-(goal.y+goal.h-20))/8+1);
  }
  // penalty arc
  ctx.strokeStyle='rgba(234,243,236,.5)';ctx.lineWidth=3;
  ctx.beginPath();ctx.arc(W/2,560,150,Math.PI*1.15,Math.PI*1.85);ctx.stroke();
  // spot
  ctx.fillStyle='rgba(234,243,236,.7)';ctx.beginPath();ctx.arc(W/2,520,4,0,7);ctx.fill();
}
function drawGoal(){
  const {x,y,w,h}=goal;
  // net
  ctx.save();
  ctx.strokeStyle='rgba(234,243,236,.18)';ctx.lineWidth=1;
  for(let i=0;i<=w;i+=14){ctx.beginPath();ctx.moveTo(x+i,y);ctx.lineTo(x+i,y+h);ctx.stroke();}
  for(let j=0;j<=h;j+=14){ctx.beginPath();ctx.moveTo(x,y+j);ctx.lineTo(x+w,y+j);ctx.stroke();}
  ctx.restore();
  // posts
  ctx.fillStyle='#f4f7f4';ctx.shadowColor='rgba(0,0,0,.4)';ctx.shadowBlur=8;
  ctx.fillRect(x-10,y-10,12,h+10);
  ctx.fillRect(x+w-2,y-10,12,h+10);
  ctx.fillRect(x-10,y-10,w+20,12);
  ctx.shadowBlur=0;
}
function drawKeeper(){
  const kx=keeper.x+keeper.dive, ky=keeper.y-keeper.jump*46;
  const spread=Math.min(1,Math.abs(keeper.dive)/120);
  ctx.save();
  ctx.translate(kx,ky);
  const lean=keeper.dive*0.0025;
  ctx.rotate(lean);
  // body
  ctx.fillStyle='#ffd21f';
  ctx.beginPath();ctx.roundRect(-16,-70,32,54,8);ctx.fill();
  // shorts
  ctx.fillStyle='#111';ctx.fillRect(-16,-22,32,16);
  // head
  ctx.fillStyle='#f2c79a';ctx.beginPath();ctx.arc(0,-80,12,0,7);ctx.fill();
  // arms spread when diving
  ctx.strokeStyle='#ffd21f';ctx.lineWidth=9;ctx.lineCap='round';
  const armY=-58, reach=18+spread*44;
  ctx.beginPath();ctx.moveTo(0,armY);ctx.lineTo(-reach,armY-18-spread*20);ctx.stroke();
  ctx.beginPath();ctx.moveTo(0,armY);ctx.lineTo(reach,armY-18-spread*20);ctx.stroke();
  // gloves
  ctx.fillStyle='#3ae8cf';
  ctx.beginPath();ctx.arc(-reach,armY-18-spread*20,7,0,7);ctx.fill();
  ctx.beginPath();ctx.arc(reach,armY-18-spread*20,7,0,7);ctx.fill();
  // legs
  ctx.strokeStyle='#f2c79a';ctx.lineWidth=8;
  ctx.beginPath();ctx.moveTo(-7,-8);ctx.lineTo(-10-spread*18,10);ctx.stroke();
  ctx.beginPath();ctx.moveTo(7,-8);ctx.lineTo(10+spread*18,10);ctx.stroke();
  ctx.restore();
}
function drawBall(){
  const r=15*ball.scale;
  const bx=ball.x, by=ball.y-ball.z;
  // shadow on ground
  ctx.save();
  ctx.globalAlpha=.28;ctx.fillStyle='#000';
  ctx.beginPath();ctx.ellipse(ball.x,ball.y+4,r*0.9,r*0.4,0,0,7);ctx.fill();
  ctx.restore();
  // ball
  ctx.save();ctx.translate(bx,by);
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(0,0,r,0,7);ctx.fill();
  ctx.fillStyle='#111';
  const rot=ball.t*22;
  for(let i=0;i<5;i++){
    const a=rot+i*Math.PI*2/5;
    ctx.beginPath();ctx.arc(Math.cos(a)*r*0.5,Math.sin(a)*r*0.5,r*0.22,0,7);ctx.fill();
  }
  ctx.strokeStyle='rgba(0,0,0,.25)';ctx.lineWidth=1;ctx.beginPath();ctx.arc(0,0,r,0,7);ctx.stroke();
  ctx.restore();
}
function drawAim(){
  if(state===S.AIM){
    // sweeping vertical aim line
    ctx.save();
    ctx.strokeStyle='var';ctx.strokeStyle='#3ae8cf';ctx.lineWidth=3;
    ctx.setLineDash([8,8]);
    ctx.beginPath();ctx.moveTo(aimX,goal.y);ctx.lineTo(aimX,goal.y+goal.h);ctx.stroke();
    ctx.setLineDash([]);
    // reticle
    ctx.fillStyle='rgba(58,232,207,.9)';
    ctx.beginPath();ctx.arc(aimX,goal.y+goal.h*0.5,10,0,7);ctx.fill();
    ctx.strokeStyle='#04121f';ctx.lineWidth=2;ctx.stroke();
    ctx.restore();
  }
  if(state===S.POWER){
    // fixed aim column
    ctx.save();ctx.strokeStyle='rgba(58,232,207,.55)';ctx.lineWidth=2;ctx.setLineDash([6,6]);
    ctx.beginPath();ctx.moveTo(target.x,goal.y);ctx.lineTo(target.x,goal.y+goal.h);ctx.stroke();ctx.restore();
    // power meter beside ball
    const bx=ball.x+34, by0=ball.y+30, bh=170;
    ctx.save();
    ctx.fillStyle='rgba(4,10,18,.6)';ctx.strokeStyle='rgba(255,255,255,.3)';
    ctx.lineWidth=2;
    ctx.beginPath();ctx.roundRect(bx,by0-bh,22,bh,6);ctx.fill();ctx.stroke();
    const ph=bh*power;
    const grd=ctx.createLinearGradient(0,by0,0,by0-bh);
    grd.addColorStop(0,'#3ae8cf');grd.addColorStop(.6,'#ffef6b');grd.addColorStop(1,'#ff5a3c');
    ctx.fillStyle=grd;
    ctx.beginPath();ctx.roundRect(bx+2,by0-ph,18,Math.max(2,ph-2),5);ctx.fill();
    ctx.restore();
  }
}

function render(){
  ctx.clearRect(0,0,W,H);
  ctx.save();
  if(shake>0){ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);}
  drawPitch();
  drawGoal();
  drawKeeper();
  drawAim();
  if(state!==S.IDLE&&state!==S.OVER) drawBall();
  // particles
  for(const p of particles){
    ctx.globalAlpha=Math.max(0,p.life);
    ctx.fillStyle=p.col;
    ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill();
  }
  ctx.globalAlpha=1;
  ctx.restore();
  // goal flash
  if(flash>0){ctx.fillStyle='rgba(255,239,107,'+(flash*0.3)+')';ctx.fillRect(0,0,W,H);}
}

function loop(t){
  if(!tPrev)tPrev=t;
  let dt=(t-tPrev)/1000; tPrev=t; if(dt>0.05)dt=0.05;
  update(dt); render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// idle demo state draws pitch
state=S.IDLE;
})();
</script>
