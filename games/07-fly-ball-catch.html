<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ダイビングキャッチ — Fly Ball Catch</title>
<style>
  :root{--sky:#5bb2ec;--grass:#2fa055;--grass-d:#227a41;--dirt:#c8823c;--chalk:#f4f7f2;--ink:#0c2138;
    --gold:#ffcf3a;--hot:#ff5a3c;--cyan:#3ae8cf;}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:#04121f;font-family:"Arial Narrow","Roboto Condensed",system-ui,sans-serif;color:var(--chalk);
    display:flex;align-items:center;justify-content:center;overflow:hidden;-webkit-user-select:none;user-select:none;touch-action:none;}
  #stage{position:relative;width:min(100vw,calc(100vh*1.5));aspect-ratio:3/2;max-height:100vh;
    box-shadow:0 30px 80px rgba(0,0,0,.6);overflow:hidden;background:#2fa055;}
  canvas{display:block;width:100%;height:100%}
  #hud{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;padding:clamp(6px,1.4vw,14px);gap:8px;pointer-events:none;align-items:flex-start;}
  .board{background:rgba(12,33,56,.78);backdrop-filter:blur(6px);border:1px solid rgba(58,232,207,.35);
    border-radius:10px;padding:6px clamp(10px,1.6vw,18px);display:flex;flex-direction:column;line-height:1;}
  .board .label{font-size:clamp(9px,1.3vw,12px);letter-spacing:.2em;text-transform:uppercase;color:var(--cyan);opacity:.9}
  .board .value{font-family:"Courier New",monospace;font-weight:700;font-size:clamp(20px,4.2vw,36px);font-variant-numeric:tabular-nums;color:var(--chalk);}
  #outs .value{color:var(--hot)}
  #msg{position:absolute;top:16%;left:0;right:0;text-align:center;pointer-events:none;font-weight:900;letter-spacing:.03em;
    text-transform:uppercase;font-size:clamp(28px,7vw,64px);color:#fff;opacity:0;transition:opacity .14s;
    text-shadow:0 4px 0 rgba(0,0,0,.35),0 0 30px currentColor;}
  #hint{position:absolute;bottom:0;left:0;right:0;text-align:center;padding:8px 12px calc(9px + env(safe-area-inset-bottom));
    font-size:clamp(12px,2.2vw,17px);letter-spacing:.04em;color:var(--chalk);background:linear-gradient(transparent,rgba(12,33,56,.72));pointer-events:none;}
  #hint b{color:var(--cyan)}
  #overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(10px,2vw,20px);
    text-align:center;padding:20px;background:radial-gradient(120% 90% at 50% 22%,rgba(91,178,236,.3),rgba(4,18,31,.92));backdrop-filter:blur(3px);z-index:5;transition:opacity .4s;}
  #overlay.hidden{opacity:0;pointer-events:none}
  #overlay h1{font-size:clamp(32px,9vw,78px);font-weight:900;letter-spacing:.02em;line-height:.9;text-transform:uppercase;color:var(--chalk);
    text-shadow:0 6px 0 rgba(0,0,0,.3),0 0 40px rgba(58,232,207,.4);}
  #overlay h1 span{display:block;color:var(--gold);font-size:.5em;letter-spacing:.22em}
  #overlay p{max-width:34ch;font-size:clamp(14px,2.6vw,19px);line-height:1.45;opacity:.92}
  #playBtn{pointer-events:auto;cursor:pointer;border:none;border-radius:100px;padding:clamp(12px,2vw,18px) clamp(30px,6vw,56px);
    font-family:inherit;font-weight:900;font-size:clamp(18px,3.4vw,26px);letter-spacing:.12em;text-transform:uppercase;color:var(--ink);
    background:linear-gradient(180deg,var(--cyan),#12b79c);box-shadow:0 8px 0 #0a6a5a,0 14px 30px rgba(0,0,0,.5);transition:transform .08s,box-shadow .08s;}
  #playBtn:active{transform:translateY(5px);box-shadow:0 3px 0 #0a6a5a}
  #playBtn:focus-visible{outline:3px solid var(--hot);outline-offset:4px}
  .sub{font-size:clamp(11px,2vw,14px);letter-spacing:.2em;text-transform:uppercase;color:var(--cyan);opacity:.85}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div id="stage">
  <canvas id="c"></canvas>
  <div id="hud">
    <div class="board"><span class="label">Catches</span><span class="value" id="score">0</span></div>
    <div class="board" style="text-align:center"><span class="label">Streak</span><span class="value" id="streak">0</span></div>
    <div class="board" id="outs" style="text-align:right"><span class="label">Drops</span><span class="value" id="outs-v">0<small style="font-size:.5em;opacity:.6">/3</small></span></div>
  </div>
  <div id="msg"></div>
  <div id="hint">ドラッグ / 矢印キー で野手を動かし、影の落下点で捕球！</div>
  <div id="overlay">
    <div class="sub">Baseball · Fielding</div>
    <h1>ダイビング<span>Catch</span></h1>
    <p>打球の<b style="color:var(--cyan)">影＝落下点</b>を読んで野手を移動。落ちる前にグラブを重ねてアウトを取れ。遠くから飛び込めば<b style="color:var(--gold)">ダイビングキャッチ</b>でボーナス！3落球でゲーム終了。</p>
    <button id="playBtn">Play Ball</button>
    <div class="sub" style="opacity:.55">Drag / Arrows</div>
  </div>
</div>

<script>
(()=>{
"use strict";
const cvs=document.getElementById('c'),ctx=cvs.getContext('2d');
const W=900,H=600;let dpr=Math.min(window.devicePixelRatio||1,2);
function resize(){const r=cvs.getBoundingClientRect();cvs.width=Math.round(r.width*dpr);cvs.height=Math.round(r.height*dpr);
  ctx.setTransform(cvs.width/W,0,0,cvs.height/H,0,0);}
new ResizeObserver(resize).observe(cvs);resize();

let AC=null;function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function tone(f,d,t='sine',v=.22,to=null){const a=ac();if(!a)return;const o=a.createOscillator(),g=a.createGain();
  o.type=t;o.frequency.setValueAtTime(f,a.currentTime);if(to)o.frequency.exponentialRampToValueAtTime(to,a.currentTime+d);
  g.gain.setValueAtTime(v,a.currentTime);g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+d);
  o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+d);}
function noise(d,v){const a=ac();if(!a)return;const n=a.createBuffer(1,a.sampleRate*d,a.sampleRate);const dd=n.getChannelData(0);
  for(let i=0;i<dd.length;i++)dd[i]=(Math.random()*2-1)*(1-i/dd.length);const s=a.createBufferSource();s.buffer=n;const g=a.createGain();
  g.gain.value=v;s.connect(g);g.connect(a.destination);s.start();}
const sCrack=()=>{noise(.08,.3);tone(200,.1,'square',.22,120);};
const sCatch=()=>{noise(.05,.2);tone(600,.1,'square',.2,300);};
const sDive=()=>{tone(500,.16,'sawtooth',.2,900);};
const sDrop=()=>tone(150,.28,'sawtooth',.24,60);
const sSt=()=>tone(880,.08,'square',.18);

const field={x0:55,y0:135,x1:845,y1:475};
const home={x:450,y:558};
const S={IDLE:'idle',PITCH:'pitch',FLY:'fly',RESULT:'result',OVER:'over'};
let state=S.IDLE;
let score=0,streak=0,drops=0,ballCount=0;
let fielder={x:450,y:330,tx:450,ty:330,dive:0,run:0};
let ball=null, marker=null, particles=[], shake=0, flash=0, flashCol='#3ae8cf', tPrev=0;
const CATCH_R=46;

function reset(){score=0;streak=0;drops=0;ballCount=0;fielder.x=fielder.tx=450;fielder.y=fielder.ty=330;fielder.dive=0;
  ball=null;marker=null;particles=[];updateHUD();}
function start(){reset();document.getElementById('overlay').classList.add('hidden');nextBall();}
function nextBall(){
  if(drops>=3)return endGame();
  ballCount++;
  const lx=field.x0+40+Math.random()*(field.x1-field.x0-80);
  const ly=field.y0+30+Math.random()*(field.y1-field.y0-40);
  const dur=Math.max(1.15,2.1-ballCount*0.05);
  state=S.PITCH;
  ball={phase:'wind',t:-0.35,dur,lx,ly,caught:false};
  marker={x:lx,y:ly};
  setHint('打球を待て…');
}
function launch(){ball.phase='fly';ball.t=0;state=S.FLY;sCrack();setHint('影の落下点へ急げ！');}

function updateHUD(){document.getElementById('score').textContent=score;
  document.getElementById('streak').textContent=streak;
  document.getElementById('outs-v').innerHTML=drops+'<small style="font-size:.5em;opacity:.6">/3</small>';}
let msgT=null;function showMsg(t,c){const m=document.getElementById('msg');m.textContent=t;m.style.color=c;m.style.opacity='1';
  clearTimeout(msgT);msgT=setTimeout(()=>m.style.opacity='0',900);}
function setHint(h){document.getElementById('hint').innerHTML=h;}

// input: drag / pointer to set target; arrows nudge
let dragging=false;
function ptToField(e){const r=cvs.getBoundingClientRect();return {x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H};}
cvs.addEventListener('pointerdown',e=>{e.preventDefault();const a=ac();a&&a.resume&&a.resume();
  if(state===S.IDLE||state===S.OVER){return;}
  dragging=true;const p=ptToField(e);setTarget(p.x,p.y);cvs.setPointerCapture&&cvs.setPointerCapture(e.pointerId);});
cvs.addEventListener('pointermove',e=>{if(!dragging)return;const p=ptToField(e);setTarget(p.x,p.y);});
cvs.addEventListener('pointerup',e=>{dragging=false;});
function setTarget(x,y){fielder.tx=Math.max(field.x0,Math.min(field.x1,x));fielder.ty=Math.max(field.y0,Math.min(field.y1,y));}
let keys={};
window.addEventListener('keydown',e=>{
  if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.code)){e.preventDefault();keys[e.code]=true;}
  else if(e.code==='Space'){e.preventDefault();if(state===S.IDLE||state===S.OVER){const a=ac();a&&a.resume&&a.resume();start();}}});
window.addEventListener('keyup',e=>{keys[e.code]=false;});
document.getElementById('playBtn').addEventListener('click',e=>{e.stopPropagation();ac()&&ac().resume&&ac().resume();start();});

function resolve(){
  const dx=fielder.x-ball.lx, dy=fielder.y-ball.ly, dist=Math.hypot(dx,dy);
  const speed=Math.hypot(fielder.x-fielder.px||0,fielder.y-fielder.py||0);
  if(dist<CATCH_R){
    const diving=dist>CATCH_R*0.55;
    score++;streak++;
    let bonus=diving?2:1;score+=diving?1:0;
    if(diving){fielder.dive=1;sDive();showMsg('DIVING CATCH! +2','#ffcf3a');flashCol='#ffcf3a';}
    else{sCatch();showMsg(streak>=3?('CATCH ×'+streak+'!'):'OUT!','#3ae8cf');flashCol='#3ae8cf';}
    flash=.6;shake=7;
    burst(ball.lx,ball.ly,diving?['#ffcf3a','#fff','#3ae8cf']:['#3ae8cf','#fff'],diving?28:18);
  } else {
    drops++;streak=0;sDrop();shake=12;flash=.6;flashCol='#ff5a3c';
    showMsg('DROP…','#ff5a3c');burst(ball.lx,ball.ly,['#c8823c','#fff'],16);
  }
  updateHUD();state=S.RESULT;
  setTimeout(()=>{fielder.dive=0;if(drops>=3)endGame();else nextBall();},850);
}
function endGame(){state=S.OVER;const ov=document.getElementById('overlay');
  const rating=score>=30?'GOLD GLOVE!':score>=20?'ELITE':score>=12?'SOLID':score>=5?'DECENT':'ROOKIE';
  ov.querySelector('.sub').textContent='Game over';
  ov.querySelector('h1').innerHTML=score+' 捕球<span>'+rating+'</span>';
  ov.querySelector('p').innerHTML='<b style="color:var(--gold)">'+rating+'</b> — 落下点を素早く読んで守備範囲を広げよう！';
  ov.querySelector('#playBtn').textContent='Retry';ov.classList.remove('hidden');}

function burst(x,y,cols,n){for(let i=0;i<n;i++){const a=Math.random()*7,s=1+Math.random()*6;
  particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-2,life:1,col:cols[i%cols.length],r:2+Math.random()*4});}}

function update(dt){
  // fielder movement
  fielder.px=fielder.x;fielder.py=fielder.y;
  const kv=360;
  if(keys.ArrowLeft)fielder.tx-=kv*dt; if(keys.ArrowRight)fielder.tx+=kv*dt;
  if(keys.ArrowUp)fielder.ty-=kv*dt; if(keys.ArrowDown)fielder.ty+=kv*dt;
  fielder.tx=Math.max(field.x0,Math.min(field.x1,fielder.tx));fielder.ty=Math.max(field.y0,Math.min(field.y1,fielder.ty));
  fielder.x+=(fielder.tx-fielder.x)*Math.min(1,dt*11);fielder.y+=(fielder.ty-fielder.y)*Math.min(1,dt*11);
  const mv=Math.hypot(fielder.x-fielder.px,fielder.y-fielder.py);fielder.run=mv;
  if(state===S.PITCH){ball.t+=dt;if(ball.t>=0)launch();}
  else if(state===S.FLY){ball.t+=dt;if(ball.t>=ball.dur)resolve();}
  for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.x+=p.vx;p.y+=p.vy;p.vy+=.3;p.vx*=.99;p.life-=dt*1.1;if(p.life<=0)particles.splice(i,1);}
  if(shake>0)shake=Math.max(0,shake-dt*30);if(flash>0)flash=Math.max(0,flash-dt*1.6);
}
function roundRect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function drawField(){
  const sky=ctx.createLinearGradient(0,0,0,150);sky.addColorStop(0,'#5bb2ec');sky.addColorStop(1,'#9fd8f4');
  ctx.fillStyle=sky;ctx.fillRect(0,0,W,150);
  // wall
  ctx.fillStyle='#1f6f3a';ctx.fillRect(0,120,W,28);ctx.fillStyle='#ffcf3a';for(let x=10;x<W;x+=100)ctx.fillRect(x,128,44,4);
  // grass
  const g=ctx.createLinearGradient(0,148,0,H);g.addColorStop(0,'#33ab5b');g.addColorStop(1,'#227a41');
  ctx.fillStyle=g;ctx.fillRect(0,148,W,H);
  // mow arcs
  ctx.save();ctx.globalAlpha=.06;ctx.strokeStyle='#fff';ctx.lineWidth=20;
  for(let r=120;r<1000;r+=64){ctx.beginPath();ctx.arc(home.x,home.y,r,Math.PI*1.15,Math.PI*1.85);ctx.stroke();}ctx.restore();
  // infield dirt
  ctx.fillStyle='#c8823c';ctx.beginPath();ctx.moveTo(home.x-150,H);ctx.arc(home.x,home.y,180,Math.PI*1.18,Math.PI*1.82);ctx.lineTo(home.x+150,H);ctx.closePath();ctx.fill();
  // home plate
  ctx.fillStyle='#f4f7f2';ctx.beginPath();ctx.moveTo(home.x-12,home.y);ctx.lineTo(home.x+12,home.y);ctx.lineTo(home.x+12,home.y+8);ctx.lineTo(home.x,home.y+16);ctx.lineTo(home.x-12,home.y+8);ctx.closePath();ctx.fill();
}
function drawMarker(){
  if(!marker||state===S.RESULT)return;
  if(state!==S.FLY&&state!==S.PITCH)return;
  const k=state==='fly'||state===S.FLY?Math.min(1,Math.max(0,ball.t)/ball.dur):0;
  ctx.save();ctx.translate(marker.x,marker.y);
  // target ring
  ctx.strokeStyle='rgba(255,90,60,.9)';ctx.lineWidth=3;ctx.setLineDash([6,6]);
  ctx.beginPath();ctx.arc(0,0,CATCH_R,0,7);ctx.stroke();ctx.setLineDash([]);
  // shrinking timer ring shows time-to-land
  ctx.strokeStyle='rgba(255,207,58,.95)';ctx.lineWidth=4;
  ctx.beginPath();ctx.arc(0,0,CATCH_R*(1-k)+6,0,7);ctx.stroke();
  // center cross
  ctx.strokeStyle='rgba(255,255,255,.7)';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(-8,0);ctx.lineTo(8,0);ctx.moveTo(0,-8);ctx.lineTo(0,8);ctx.stroke();
  ctx.restore();
}
function drawBall(){
  if(!ball)return;
  if(ball.phase==='fly'){
    const k=Math.min(1,ball.t/ball.dur);
    const x=home.x+(ball.lx-home.x)*k, y=home.y+(ball.ly-home.y)*k;
    const z=Math.sin(k*Math.PI)*180*(0.6+ (1-Math.abs(ball.ly-300)/300)*0.4);
    // ball shadow
    ctx.save();ctx.globalAlpha=.25;ctx.fillStyle='#000';ctx.beginPath();ctx.ellipse(x,y,10,4,0,0,7);ctx.fill();ctx.restore();
    const by=y-z, r=11;
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(x,by,r,0,7);ctx.fill();
    ctx.strokeStyle='#c62d2d';ctx.lineWidth=1.4;ctx.beginPath();ctx.arc(x-3,by,r*.8,-.6,.6);ctx.stroke();
    ctx.strokeStyle='rgba(0,0,0,.2)';ctx.beginPath();ctx.arc(x,by,r,0,7);ctx.stroke();
  }
}
function drawFielder(){
  const x=fielder.x,y=fielder.y,dive=fielder.dive;
  // shadow
  ctx.save();ctx.globalAlpha=.28;ctx.fillStyle='#000';ctx.beginPath();ctx.ellipse(x,y+18,24,7,0,0,7);ctx.fill();ctx.restore();
  ctx.save();ctx.translate(x,y);
  const lean=dive*0.9;ctx.rotate(lean* (fielder.x>=fielder.px?1:-1));
  // body (white home kit, navy)
  ctx.fillStyle='#e9edf2';roundRect(-15,-26,30,40,8);ctx.fill();
  ctx.fillStyle='#1b3a8f';ctx.fillRect(-15,-26,30,8); // shoulders
  ctx.fillStyle='#e8b88a';ctx.beginPath();ctx.arc(0,-36,11,0,7);ctx.fill();
  ctx.fillStyle='#1b3a8f';ctx.fillRect(-15,10,30,9);
  // glove arm (reaches when moving/diving)
  ctx.strokeStyle='#e9edf2';ctx.lineWidth=8;ctx.lineCap='round';
  const reach=14+dive*30+Math.min(16,fielder.run*3);
  ctx.beginPath();ctx.moveTo(6,-16);ctx.lineTo(6+reach,-24-dive*10);ctx.stroke();
  ctx.fillStyle='#8a5a2b';ctx.beginPath();ctx.arc(6+reach,-24-dive*10,10,0,7);ctx.fill(); // glove
  ctx.strokeStyle='#5a3a18';ctx.lineWidth=2;ctx.beginPath();ctx.arc(6+reach,-24-dive*10,10,0,7);ctx.stroke();
  ctx.restore();
}
function render(){
  ctx.clearRect(0,0,W,H);ctx.save();
  if(shake>0)ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
  drawField();drawMarker();
  // draw fielder & ball with simple depth (higher y = in front)
  if(fielder.y<= (ball?ball.ly:H)) {drawFielder();drawBall();} else {drawBall();drawFielder();}
  for(const p of particles){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.col;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill();}
  ctx.globalAlpha=1;ctx.restore();
  if(flash>0){ctx.fillStyle='rgba('+(flashCol==='#ff5a3c'?'255,90,60':flashCol==='#ffcf3a'?'255,207,58':'58,232,207')+','+(flash*0.26)+')';ctx.fillRect(0,0,W,H);}
}
function loop(t){if(!tPrev)tPrev=t;let dt=(t-tPrev)/1000;tPrev=t;if(dt>.05)dt=.05;update(dt);render();requestAnimationFrame(loop);}
reset();requestAnimationFrame(loop);state=S.IDLE;
// test-only hook (inert unless URL hash contains "test")
if(location.hash.indexOf('test')>=0){window.__fc={get lx(){return ball&&ball.lx;},get ly(){return ball&&ball.ly;},aim(){if(ball){setTarget(ball.lx,ball.ly);}}};}
})();
</script>
