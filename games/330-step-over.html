<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ステップオーバー (Step-Over)</title>
<style>
  html,body{margin:0;height:100%;background:#0a0d08;overflow:hidden;
    font-family:-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  #stage{position:relative;width:100vw;height:100vh;max-width:calc(100vh*1.5);max-height:calc(100vw/1.5);aspect-ratio:900/600;}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;border-radius:6px;}
</style>
</head>
<body>
<div id="wrap"><div id="stage"><canvas id="cv"></canvas></div></div>
<script>
(function(){
const W=900,H=600,cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let DPR=1;
function fit(){DPR=Math.min(2,window.devicePixelRatio||1);cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
fit();addEventListener('resize',fit);

// ---------- audio ----------
let AC=null;function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function tone(f,d,type,v,sweep){const a=ac();if(!a)return;const t=a.currentTime,o=a.createOscillator(),g=a.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(sweep)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+sweep),t+d);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v||0.2,t+0.008);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+0.02);}
function noise(d,v,hp){const a=ac();if(!a)return;const t=a.currentTime,n=Math.floor(a.sampleRate*d),buf=a.createBuffer(1,n,a.sampleRate),ch=buf.getChannelData(0);
  for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource();s.buffer=buf;
  const f=a.createBiquadFilter();f.type='highpass';f.frequency.value=hp||600;const g=a.createGain();g.gain.value=v||0.2;
  s.connect(f);f.connect(g);g.connect(a.destination);s.start(t);s.stop(t+d+0.02);}
const S={
  shuffle:()=>{tone(360,0.05,'square',0.04,60);},
  push:()=>{noise(0.05,0.16,900);tone(520,0.05,'square',0.08,180);},
  burst:()=>{[620,860,1120].forEach((f,i)=>setTimeout(()=>tone(f,0.11,'triangle',0.16),i*58));},
  big:()=>{[600,800,1000,1250].forEach((f,i)=>setTimeout(()=>tone(f,0.12,'triangle',0.17),i*80));},
  tackle:()=>{noise(0.18,0.2,300);tone(160,0.2,'sawtooth',0.12,-40);},
  streak:()=>{[700,930,1170,1400].forEach((f,i)=>setTimeout(()=>tone(f,0.1,'triangle',0.16),i*60));},
  over:()=>{[440,330,247,175].forEach((f,i)=>setTimeout(()=>tone(f,0.3,'triangle',0.2),i*160));}
};

// ---------- geometry ----------
const GOAL={x:452,y:70,w:210};
const DEF={x:452,y:292};    // defender (lunges left/right on the read)
const ATT={x:452,y:436};    // attacker with the ball
const BTN=[
  {k:'left', x:150,label:'左へ ←',sub:'左を抜く',col:'#5db4ff'},
  {k:'right',x:520,label:'右へ →',sub:'右を抜く',col:'#3fc46b'}
];
const BW=230, BY=505, BH=64;

// ---------- state ----------
let state='title', phase='read', plays=0;
let score=0, combo=0, best=+(localStorage.getItem('so_best')||0);
let outs=0, fails=0, lvl=1;   // outs = beaten defenders
let clock=0, revealT=520, callWin=900, kind='left', tough=false;
let decided=false, call=null, result=null, resultT=0, msg='', msgOk=false, moveU=0, defU=0;
let shake=0, flash=0, flashCol='#fff', last=performance.now();
let parts=[], pops=[];

function rnd(a,b){return a+Math.random()*(b-a);}
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function lerp(a,b,u){return a+(b-a)*u;}
function easeOut(u){return 1-Math.pow(1-u,2);}

function reset(){state='title';score=0;combo=0;outs=0;fails=0;lvl=1;plays=0;result=null;parts=[];pops=[];}

function newPlay(){
  plays++; lvl=Math.min(7,1+Math.floor(outs/4));
  revealT=clamp(560-lvl*24,360,560);
  callWin=clamp(940-lvl*66,520,940);
  tough=Math.random()<clamp(0.2+lvl*0.05,0.2,0.5);
  if(tough)callWin=Math.round(callWin*0.86);
  kind=(Math.random()<0.5?'left':'right');  // which way the defender lunges (bites)
  phase='read'; clock=0; decided=false; call=null; result=null; resultT=0; msg=''; msgOk=false; moveU=0; defU=0;
  S.shuffle();
}
function start(){ if(!ac())ac(); if(AC&&AC.state==='suspended')AC.resume(); reset(); state='play'; newPlay(); }

// go to the OPEN side (opposite where the defender lunged)
function correctCall(){ return kind==='left'?'right':'left'; }

function makeCall(c){
  if(state==='title'){start();return;}
  if(state==='over'){ if(resultT>0.4){reset();start();} return; }
  if(state!=='play'||phase!=='read'||decided) return;
  if(clock<revealT){ decided=true; call=c; resolve('early'); return; }
  decided=true; call=c;
  resolve(c===correctCall()?'good':'wrong');
}

function resolve(k){
  phase='result'; result=k; resultT=0; moveU=0; defU=0;
  if(k==='good'){
    outs++; combo++;
    let add=Math.round((tough?250:150)*(1+Math.min(9,combo-1)*0.14)); score+=add;
    S.push(); setTimeout(S.burst,120); if(tough)setTimeout(S.big,180);
    msgOk=true; flash=1;flashCol='#8affa0';shake=5;
    burst(ATT.x+(correctCall()==='right'?60:-60),ATT.y-40,'#8affa0',16,7);
    pop(W/2,250,(tough?'完全に置き去り！ +':'股を抜いた！ +')+add,'#d6ffe0');
    if(combo>=2)pop(W/2,150,'コンボ x'+combo,'#ffd24d');
    if(combo>0&&combo%5===0)S.streak();
    msg=(kind==='left')?'DFは左に食いついた——右の空いた側へ運んで置き去り':'DFは右に食いついた——左の空いた側へ運んで置き去り';
  } else {
    fails++; combo=0; msgOk=false; flash=1;flashCol='#ff5b5b';shake=9; S.tackle();
    if(k==='early') msg='早い…DFが食いつく前に仕掛けて、逆に対応されボールを奪われた';
    else msg='逆を突かれた…DFが動いた方へ運んでしまい、正面から潰された';
    pop(W/2,250,(k==='early')?'読まれた…':'奪われた…','#ffb0b0');
  }
  if(fails>=3){ state='over'; resultT=0; S.over(); if(score>best){best=score;localStorage.setItem('so_best',best);} }
}

// ---------- input ----------
cv.addEventListener('pointerdown',e=>{e.preventDefault();
  if(state!=='play'||phase!=='read'){ makeCall('left'); return; }
  const r=cv.getBoundingClientRect(); const x=(e.clientX-r.left)/r.width*W, y=(e.clientY-r.top)/r.height*H;
  for(const b of BTN){ if(x>=b.x&&x<=b.x+BW&&y>=BY&&y<=BY+BH){ makeCall(b.k); return; } }
  makeCall(x<W*0.5?'left':'right');
});
addEventListener('keydown',e=>{ if(e.repeat)return;
  if(e.code==='ArrowLeft'||e.code==='KeyA'){e.preventDefault();makeCall('left');}
  else if(e.code==='ArrowRight'||e.code==='KeyD'){e.preventDefault();makeCall('right');}
  else if(e.code==='Space'||e.code==='Enter'){e.preventDefault(); if(state!=='play')makeCall('left');} });

// ---------- particles ----------
function burst(x,y,c,n,sp){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=rnd(sp*0.3,sp);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:1,c});}}
function pop(x,y,txt,c){pops.push({x,y,txt,c,life:1});}

// ---------- update ----------
function update(dt){
  shake*=Math.pow(0.86,dt/16.7); if(shake<0.3)shake=0;
  flash*=Math.pow(0.9,dt/16.7);
  for(const q of parts){q.vx*=0.96;q.vy=q.vy*0.96+0.28;q.x+=q.vx*dt/16.7;q.y+=q.vy*dt/16.7;q.life-=dt/16.7*0.026;}
  parts=parts.filter(q=>q.life>0);
  for(const q of pops){q.y-=dt/16.7*0.5;q.life-=dt/16.7*0.02;}
  pops=pops.filter(q=>q.life>0);

  if(state!=='play'){ if(state==='over')resultT+=dt/1000; return; }
  if(phase==='read'){ clock+=dt;
    if(!decided && clock>revealT+callWin){ decided=true; call=null; resolve('wrong'); }
    return; }
  if(phase==='result'){ resultT+=dt/1000; moveU=Math.min(1,moveU+dt/460); defU=Math.min(1,defU+dt/380);
    if(resultT>1.6) newPlay(); return; }
}

// ---------- render ----------
function drawField(){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#12703f');g.addColorStop(0.5,'#0f5e34');g.addColorStop(1,'#0c4c2b');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.globalAlpha=0.06;for(let i=0;i<7;i++){ctx.fillStyle=i%2?'#fff':'#000';ctx.fillRect(0,60+i*80,W,80);}ctx.globalAlpha=1;
  // penalty arc + goal at the top
  ctx.strokeStyle='rgba(255,255,255,0.35)';ctx.lineWidth=3;
  ctx.beginPath();ctx.arc(W/2,150,120,0.15*Math.PI,0.85*Math.PI);ctx.stroke();
  const gx0=GOAL.x-GOAL.w/2,gx1=GOAL.x+GOAL.w/2;
  ctx.strokeStyle='#f4f4f4';ctx.lineWidth=6;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(gx0,GOAL.y+34);ctx.lineTo(gx0,GOAL.y);ctx.lineTo(gx1,GOAL.y);ctx.lineTo(gx1,GOAL.y+34);ctx.stroke();ctx.lineCap='butt';
  ctx.strokeStyle='rgba(255,255,255,0.15)';ctx.lineWidth=1;
  for(let x=gx0;x<=gx1;x+=14){ctx.beginPath();ctx.moveTo(x,GOAL.y);ctx.lineTo(x,GOAL.y+34);ctx.stroke();}
}
function player(x,y,col,s,lean){s=s||1;lean=lean||0;
  ctx.save();ctx.translate(x,y);ctx.rotate(lean);
  ctx.fillStyle=col;ctx.beginPath();ctx.ellipse(0,-15*s,10*s,16*s,0,0,6.28);ctx.fill();
  ctx.fillStyle='#f0c9a0';ctx.beginPath();ctx.arc(0,-35*s,7.5*s,0,6.28);ctx.fill();
  ctx.restore();
}

function render(){
  ctx.save();
  if(shake>0)ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
  drawField();

  if(state==='play'||state==='over'){
    const revealed=(phase==='read'&&clock>=revealT)||phase==='result';
    const openRight=(correctCall()==='right');

    // defender: shuffles, then lunges to its bitten side on reveal
    let dx=DEF.x, dy=DEF.y, dlean=0;
    if(revealed){
      const dir=(kind==='left')?-1:1;   // lunge screen-left or right
      const u=(phase==='result')?easeOut(defU):easeOut(clamp((clock-revealT)/220,0,1));
      dx=DEF.x+dir*70*u; dy=DEF.y+20*u; dlean=dir*0.5*u;
    } else {
      dx=DEF.x+Math.sin(clock/70)*5;   // small ready shuffle
    }
    player(dx,dy,'#2b6fd6',1.0,dlean);

    // attacker: step-overs, then bursts to the open side past the defender on 'good'
    let ax=ATT.x, ay=ATT.y, alean=0, bx=ATT.x, by=ATT.y-30;
    if(phase==='read'){
      const so=Math.sin(clock/60)*7; ax=ATT.x+so;   // feet shuffling over the ball
      bx=ATT.x+Math.sin(clock/60+1)*4; by=ATT.y-30;
    } else if(phase==='result'){
      const u=easeOut(moveU);
      if(result==='good'){
        const sx=openRight?1:-1;
        ax=lerp(ATT.x,DEF.x+sx*54,u); ay=lerp(ATT.y,DEF.y-40,u); alean=sx*0.4;
        bx=lerp(ATT.x+sx*18,DEF.x+sx*78,u); by=lerp(ATT.y-30,DEF.y-70,u);
      } else if(result==='wrong'){
        const sx=(kind==='left')?-1:1;   // ran into the defender's side
        ax=lerp(ATT.x,DEF.x+sx*30,u*0.6); ay=lerp(ATT.y,DEF.y+30,u*0.6);
        bx=lerp(ATT.x,DEF.x+sx*40,u*0.5); by=lerp(ATT.y-30,DEF.y+20,u*0.5);
      } else { // early: dispossessed in place
        ax=ATT.x; ay=ATT.y; bx=lerp(ATT.x,DEF.x,u*0.4); by=lerp(ATT.y-30,DEF.y+10,u*0.4);
      }
    }
    player(ax,ay,'#d0403a',1.0,alean);
    // the ball
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(bx,by,7.5,0,6.28);ctx.fill();
    ctx.strokeStyle='#333';ctx.lineWidth=1.1;ctx.beginPath();ctx.arc(bx,by,7.5,0.3,2.0);ctx.stroke();

    // reveal marker + open-side arrow
    if(revealed){
      ctx.textAlign='center';
      ctx.fillStyle=(kind==='left')?'rgba(120,200,255,0.98)':'rgba(90,240,130,0.98)';ctx.font='bold 15px sans-serif';
      ctx.fillText((kind==='left')?'DFは左へ食いついた！':'DFは右へ食いついた！',DEF.x,DEF.y-52);
    }

    // cue banner + timer
    ctx.textAlign='center';
    if(state==='play'&&phase==='read'){
      if(clock<revealT){ ctx.fillStyle='rgba(255,220,90,0.95)';ctx.font='bold 20px sans-serif';ctx.fillText('シザースで揺さぶれ！ DFが食いつく側を見極めろ',W/2,44); }
      else { ctx.fillStyle=openRight?'rgba(90,240,130,0.98)':'rgba(120,200,255,0.98)';ctx.font='bold 22px sans-serif';
        ctx.fillText(openRight?'右が空いた！ 右へ抜け！':'左が空いた！ 左へ抜け！',W/2,44);
        const p=clamp((clock-revealT)/callWin,0,1),bw=250,x=W/2-bw/2,y=56;
        ctx.fillStyle='rgba(255,255,255,0.18)';ctx.fillRect(x,y,bw,7);ctx.fillStyle=p<0.7?'#8affa0':(p<1?'#ffd24d':'#ff5b5b');ctx.fillRect(x,y,bw*p,7); }
    }

    if(state==='play'){
      for(const b of BTN){ const active=phase==='read'&&clock>=revealT;
        ctx.fillStyle=active?b.col:'rgba(255,255,255,0.10)';rr(b.x,BY,BW,BH,10);ctx.fill();
        ctx.fillStyle=active?'#08130c':'rgba(255,255,255,0.5)';ctx.textAlign='center';ctx.font='bold 19px sans-serif';ctx.fillText(b.label,b.x+BW/2,BY+27);
        ctx.font='11px sans-serif';ctx.fillText(b.sub,b.x+BW/2,BY+47); }
      ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='12px sans-serif';ctx.textAlign='center';ctx.fillText('タップ / ←=左へ ・ →=右へ（空いた側＝DFの逆へ）',W/2,BY+BH+18);
    }
  }

  for(const q of parts){ctx.globalAlpha=Math.max(0,q.life);ctx.fillStyle=q.c;ctx.beginPath();ctx.arc(q.x,q.y,3.2,0,6.28);ctx.fill();}
  ctx.globalAlpha=1;
  for(const q of pops){ctx.globalAlpha=Math.max(0,q.life);ctx.fillStyle=q.c;ctx.font='bold 21px sans-serif';ctx.textAlign='center';ctx.fillText(q.txt,q.x,q.y);}
  ctx.globalAlpha=1;

  // HUD
  ctx.textAlign='left';ctx.fillStyle='#fff';ctx.font='bold 26px sans-serif';ctx.fillText('SCORE '+score,20,36);
  ctx.textAlign='right';ctx.fillStyle='rgba(255,255,255,0.9)';ctx.font='14px sans-serif';ctx.fillText('突破 '+outs+'  Lv'+lvl,W-20,24);
  ctx.fillText('被奪取',W-104,46);
  for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(W-60+i*20,41,7,0,6.28);ctx.fillStyle=i<fails?'#ff5b5b':'rgba(255,255,255,0.25)';ctx.fill();}
  if(combo>=2){ctx.textAlign='center';ctx.fillStyle='#ffd24d';ctx.font='bold 18px sans-serif';ctx.fillText('コンボ x'+combo,W/2,112);}

  if(state==='play'&&phase==='result'&&msg){ctx.textAlign='center';ctx.fillStyle=msgOk?'#9ff0b8':'#ff9a9a';ctx.font='bold 16px sans-serif';ctx.fillText(msg,W/2,478);}

  if(state==='title'){
    ctx.fillStyle='rgba(4,8,4,0.83)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='bold 42px sans-serif';ctx.fillText('ステップオーバー',W/2,86);
    ctx.fillStyle='#ffd23e';ctx.font='bold 22px sans-serif';ctx.fillText('Step-Over',W/2,122);
    ctx.fillStyle='rgba(255,255,255,0.92)';ctx.font='16px sans-serif';
    ctx.fillText('ボールを跨ぐシザースでDFを揺さぶり、食いついた“逆”の空いた側へ運んで抜き去る1対1',W/2,182);
    ctx.fillStyle='rgba(255,255,255,0.66)';ctx.font='14px sans-serif';
    ctx.fillText('DFが左に食いつく＝右が空く（→/画面右）／DFが右に食いつく＝左が空く（←/画面左）',W/2,220);
    ctx.fillText('食いつく前に仕掛ける＝早すぎで読まれて奪われる／同じ側へ運ぶ＝正面から潰される',W/2,244);
    ctx.fillText('DFの動きを見てから素早く逆へ。際どい判断（tough）は大量加点。上級ほど速く猶予も短い',W/2,268);
    ctx.fillText('3被奪取で交代',W/2,292);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で開始',W/2,360);
    ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='14px sans-serif';ctx.fillText('BEST '+best,W/2,392);
  }
  if(state==='over'){
    ctx.fillStyle='rgba(4,8,4,0.85)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#ff6b6b';ctx.font='bold 46px sans-serif';ctx.fillText('3被奪取…交代',W/2,222);
    ctx.fillStyle='#fff';ctx.font='bold 40px sans-serif';ctx.fillText('SCORE '+score,W/2,290);
    ctx.fillStyle='rgba(255,255,255,0.85)';ctx.font='19px sans-serif';ctx.fillText('突破 '+outs+'   BEST '+best,W/2,330);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で もう一度',W/2,402);
  }

  if(flash>0.02){ctx.globalAlpha=flash*0.5;ctx.fillStyle=flashCol;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}
  ctx.restore();

  ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,0.4)';ctx.font='12px sans-serif';
  ctx.fillText('ステップオーバー：シザースでDFを食いつかせ、空いた逆へ抜く。早すぎ/同じ側は被奪取、3つで交代',W/2,H-8);
}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

function frame(ts){let dt=ts-last;last=ts;if(dt>60)dt=60;if(dt<0)dt=0;update(dt);render();requestAnimationFrame(frame);}
requestAnimationFrame(frame);

// ---------- test hook ----------
window.__so={
  start, makeCall:(c)=>makeCall(c),
  get state(){return state;},
  get score(){return score;},
  get outs(){return outs;},
  get fails(){return fails;},
  get info(){return {state,phase,clock,revealT,callWin,kind,tough,decided,call,result,outs,fails,lvl,
    revealed:(clock>=revealT),correctCall:correctCall(),canAct:(phase==='read'&&!decided)};}
};
})();
</script>
</body>
</html>
