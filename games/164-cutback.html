<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>カットバック (The Cutback)</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;background:#07110b;overflow:hidden;font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",system-ui,sans-serif}
  #wrap{width:100%;height:100%;display:flex;align-items:center;justify-content:center}
  #stage{position:relative;width:min(100vw,calc(100vh*1.5));aspect-ratio:900/600;max-width:900px;
    box-shadow:0 10px 60px rgba(0,0,0,.6);border-radius:10px;overflow:hidden;touch-action:none}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
  #hint{position:absolute;left:0;bottom:6px;width:100%;text-align:center;color:#cfe;
    font-size:12px;opacity:.55;pointer-events:none;text-shadow:0 1px 3px #000}
</style>
</head>
<body>
<div id="wrap"><div id="stage">
  <canvas id="cv"></canvas>
  <div id="hint">走り込む味方（青）がスポットに来る瞬間にマイナスの折り返し（クリック/タップ/SPACE）。早いと通り抜け、遅いとDF（赤）にクリアされる</div>
</div></div>
<script>
(()=>{
const cv=document.getElementById('cv'), g=cv.getContext('2d');
const W=900,H=600;
let DPR=1;
function fit(){ DPR=Math.min(2,window.devicePixelRatio||1); cv.width=W*DPR; cv.height=H*DPR; g.setTransform(DPR,0,0,DPR,0,0); }
fit(); addEventListener('resize',fit);

// ---------- audio ----------
let AC=null;
function ac(){ if(!AC){ try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){} } return AC; }
function tone(f,d,t,v,sweep){ const a=ac(); if(!a)return; const o=a.createOscillator(),gg=a.createGain();
  o.type=t||'sine'; o.frequency.value=f; if(sweep) o.frequency.exponentialRampToValueAtTime(Math.max(20,sweep),a.currentTime+d);
  gg.gain.setValueAtTime(0.0001,a.currentTime); gg.gain.exponentialRampToValueAtTime(v||0.2,a.currentTime+0.012);
  gg.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+d); o.connect(gg).connect(a.destination);
  o.start(); o.stop(a.currentTime+d+0.02); }
function noise(d,v,hp){ const a=ac(); if(!a)return; const n=a.createBuffer(1,a.sampleRate*d,a.sampleRate); const ch=n.getChannelData(0);
  for(let i=0;i<ch.length;i++) ch[i]=(Math.random()*2-1)*(1-i/ch.length);
  const s=a.createBufferSource(); s.buffer=n; const f=a.createBiquadFilter(); f.type='highpass'; f.frequency.value=hp||600;
  const gg=a.createGain(); gg.gain.value=v||0.15; s.connect(f).connect(gg).connect(a.destination); s.start(); }
const S={
  pass(){ noise(0.03,0.10,700); tone(300,0.05,'square',0.07,200); },
  goal(){ tone(520,0.1,'triangle',0.14,780); setTimeout(()=>tone(780,0.12,'triangle',0.12,1040),90); setTimeout(()=>tone(1040,0.15,'triangle',0.1,1360),190); noise(0.34,0.1,400); },
  great(){ tone(660,0.08,'triangle',0.13,1000); setTimeout(()=>tone(1000,0.1,'triangle',0.12,1360),80); setTimeout(()=>tone(1360,0.12,'triangle',0.1,1700),170); },
  fail(){ noise(0.16,0.2,350); tone(200,0.16,'sawtooth',0.13,80); },
  over(){ tone(300,0.5,'sawtooth',0.16,90); setTimeout(()=>tone(200,0.6,'sawtooth',0.14,60),160); },
};

// ---------- geometry ----------
const GX0=350,GX1=550,GY=100, WING={x:718,y:470}, ZONE={x:452,y:306}, STK0={x:236,y:512}, DEF0={x:196,y:486};

// ---------- state ----------
let state='title';
let parts=[], pops=[];
let score, combo, best, lvl, fails, goals;
let play=null, t=0;
let flash=0, shakeT=0;
try{ best=+localStorage.getItem('cb_best')||0; }catch(e){ best=0; }

const crowd=[]; { const cc=['#e6b48f','#9bd0e6','#e6dc8f','#c9a0d8','#8fd8bd','#f0f0f0']; for(let i=0;i<240;i++) crowd.push({x:(i*27.7)%W, y:2+((i*61)%54), c:cc[i%cc.length]}); }
function clamp(v,a,b){ return v<a?a:v>b?b:v; }
function rnd(a,b){ return a+Math.random()*(b-a); }
function chance(p){ return Math.random()<p; }
function lerp(a,b,u){ return {x:a.x+(b.x-a.x)*u, y:a.y+(b.y-a.y)*u}; }

function reset(){ parts=[]; pops=[]; score=0; combo=0; lvl=0; fails=0; goals=0; newPlay(); }
function newPlay(){
  t=0;
  const ballTravel=340;
  const tStk=clamp(1220 - lvl*74, 780, 1220);
  const win=clamp(205 - lvl*16, 96, 205);
  const tDef=tStk + clamp(300 - lvl*22, 150, 300);
  play={ phase:'live', ballTravel, tStk, win, tDef, deadline:tDef+40,
    released:false, tGo:0, arrival:0, result:null, applied:false, t2:0, resT:0, pend:null, pendDelay:0,
    stk:{...STK0}, def:{...DEF0}, ball:{...WING}, ballTo:null, gkX:rnd(0.36,0.64) };
  S.pass && 0;
}
function goodNow(){ const p=play; const arr=t+p.ballTravel; return arr>=p.tStk-p.win && arr<=Math.min(p.tStk+p.win,p.tDef); }

function release(){
  if(state!=='play'||play.phase!=='live'||play.released) return;
  const p=play; p.released=true; p.tGo=t; p.arrival=t+p.ballTravel; S.pass();
  const arr=p.arrival;
  if(arr < p.tStk-p.win) p.result='early';
  else if(arr > p.tDef) p.result='late';
  else if(arr <= Math.min(p.tStk+p.win,p.tDef)) p.result = (Math.abs(arr-p.tStk)<66)?'great':'goal';
  else p.result='behind';
  p.phase='exec'; p.t2=0; p.ballTo={...ZONE};
}
function applyResult(){
  const p=play; const R=p.result;
  if(R==='goal'||R==='great'){ goals++; combo++; const gr=(R==='great'); const gained=(gr?160:110)+combo*10; score+=gained;
    if(gr){ S.great(); flash=Math.max(flash,0.4); pops.push({txt:'ドンピシャの折り返し！ ゴール +'+gained,x:W/2,y:150,big:true,life:1.15,c:'#8fffb0'});
      pops.push({txt:'走り込みにピタリ！',x:W/2,y:192,big:false,life:1.0,c:'#7fd8ff'}); }
    else { S.goal(); flash=Math.max(flash,0.3); pops.push({txt:'決まった！ カットバック弾 +'+gained,x:W/2,y:152,big:true,life:1.1,c:'#bfffd0'}); }
    for(let i=0;i<22;i++) parts.push({x:goalX(p.gkX<0.5?0.75:0.25),y:GY,vx:rnd(-7,7),vy:rnd(-6,3),life:1.0,c:'#bfffcf'});
    lvl=Math.min(6, Math.floor(goals + Math.floor(score/900)));
    end(true);
  } else { fails++; combo=0; shakeT=0.26; flash=Math.max(flash,0.26); S.fail();
    const msg = R==='early'? '早い！ 味方の前を通過…GK処理' :
                R==='late'? '遅い！ DFにクリアされた' :
                R==='behind'? '後ろに逸れた…味方が追いつけず' :
                '出せず…好機を逃した';
    pops.push({txt:msg,x:W/2,y:152,big:true,life:1.08,c:'#ff6a6a'}); end(false);
  }
}
function goalX(a){ return GX0+(GX1-GX0)*a; }
function end(ok){ play.phase='resolve'; play.pendDelay=ok?1000:1000; play.pend = fails>=3 ? 'over':'next'; play.applied=true; }
function gameOver(){ state='over'; S.over(); if(score>best){ best=score; try{localStorage.setItem('cb_best',best);}catch(e){} } }

// ---------- input ----------
function start(){ ac(); reset(); state='play'; }
cv.addEventListener('pointerdown',e=>{ ac(); if(state!=='play'){ start(); return; } release(); e.preventDefault(); });
addEventListener('keydown',e=>{ const k=e.key.toLowerCase();
  if(state!=='play'){ if(!e.repeat) start(); return; }
  if(k===' '||k==='arrowup'||k==='enter'||e.code==='Space'){ if(!e.repeat) release(); e.preventDefault(); } });

// ---------- update ----------
function update(dt){
  if(flash>0) flash=Math.max(0,flash-dt*0.003);
  if(shakeT>0) shakeT-=dt*0.001;
  parts.forEach(q=>{q.x+=q.vx;q.y+=q.vy;q.vy+=0.16;q.life-=dt*0.0022;});
  parts=parts.filter(q=>q.life>0);
  pops.forEach(q=>{q.y-=dt*0.02;q.life-=dt*0.0014;});
  pops=pops.filter(q=>q.life>0);
  if(state!=='play') return;
  const p=play;
  // striker runs to the zone then continues toward goal; defender chases to the zone
  const sf=clamp(t/p.tStk,0,1.4); p.stk = sf<=1? lerp(STK0,ZONE,sf) : lerp(ZONE,{x:ZONE.x+40,y:GY+70},clamp(sf-1,0,1));
  const df=clamp(t/p.tDef,0,1.2); p.def = lerp(DEF0,ZONE,clamp(df,0,1));
  if(p.phase==='live'){
    t+=dt;
    if(t>=p.deadline && !p.released){ p.released=true; p.result='none'; p.phase='resolve'; p.resT=0; p.applied=false; }
  } else if(p.phase==='exec'){
    p.t2+=dt; const f=clamp(p.t2/p.ballTravel,0,1); p.ball=lerp(WING,p.ballTo,f);
    if(f>=1 && !p.applied){ p.applied=true;
      if(p.result==='goal'||p.result==='great'){ p.phase='finish'; p.t2=0; p.finFrom={...ZONE}; p.finTo={x:goalX(p.gkX<0.5?0.78:0.22),y:GY+8}; }
      else { applyResult(); } }
  } else if(p.phase==='finish'){
    p.t2+=dt; const f=clamp(p.t2/240,0,1); p.ball=lerp(p.finFrom,p.finTo,f);
    if(f>=1 && !p.applied2){ p.applied2=true; applyResult(); }
  } else if(p.phase==='resolve'){
    if(!p.applied) applyResult();
    p.resT+=dt; if(p.resT>=p.pendDelay && p.pend){ const pp=p.pend; p.pend=null; if(pp==='over') gameOver(); else newPlay(); }
  }
}

// ---------- render ----------
function player(x,y,col,r,ring){ r=r||14; if(ring){ g.strokeStyle=ring; g.lineWidth=3; g.beginPath(); g.arc(x,y-r*0.2,r+5,0,6.28); g.stroke(); }
  g.fillStyle=col; g.beginPath(); g.arc(x,y-r,r*0.62,0,6.28); g.fill();
  g.fillRect(x-r*0.5,y-r*0.55,r*1.0,r*1.25); g.fillStyle='rgba(0,0,0,0.2)'; g.beginPath(); g.ellipse(x,y+r*0.7,r*0.8,r*0.28,0,0,6.28); g.fill(); }
function drawField(){
  const gr=g.createLinearGradient(0,0,0,H); gr.addColorStop(0,'#2c9350'); gr.addColorStop(1,'#1f6f3b'); g.fillStyle=gr; g.fillRect(0,0,W,H);
  g.globalAlpha=0.05; for(let i=0;i<9;i++){ g.fillStyle=i%2?'#fff':'#000'; g.fillRect(0,i*66,W,66); } g.globalAlpha=1;
  g.fillStyle='#14324a'; g.fillRect(0,0,W,50);
  for(const c of crowd){ g.fillStyle=c.c; g.globalAlpha=0.6; g.fillRect(c.x,c.y,3,3); } g.globalAlpha=1;
  g.strokeStyle='#fff'; g.lineWidth=6; g.strokeRect(GX0,GY,GX1-GX0,68);
  g.strokeStyle='rgba(255,255,255,0.3)'; g.lineWidth=2; g.strokeRect(300,GY,300,150);
  // byline
  g.strokeStyle='rgba(255,255,255,0.25)'; g.lineWidth=2; g.beginPath(); g.moveTo(0,GY); g.lineTo(W,GY); g.stroke();
}
function drawScene(){
  const p=play;
  // cutback zone marker
  g.strokeStyle='rgba(255,255,255,0.25)'; g.setLineDash([5,6]); g.lineWidth=2; g.beginPath(); g.arc(ZONE.x,ZONE.y,26,0,6.28); g.stroke(); g.setLineDash([]);
  // keeper
  const gkpx=goalX(p.gkX); g.fillStyle='#f2c94c'; g.fillRect(gkpx-12,GY+18,24,40); g.fillStyle='#e8b47a'; g.beginPath(); g.arc(gkpx,GY+14,8,0,6.28); g.fill();
  // defender (chasing)
  player(p.def.x,p.def.y,'#d34e4e',14);
  // striker (arriving runner)
  player(p.stk.x,p.stk.y,'#3f8be0',14,'#ffe08a');
  // winger (you) at byline
  player(WING.x,WING.y,'#2f6fd0',14);
  // ball
  const bx=(p.phase==='live')?WING.x-2:p.ball.x, by=(p.phase==='live')?WING.y+2:p.ball.y;
  g.fillStyle='#fff'; g.beginPath(); g.arc(bx,by,7,0,6.28); g.fill();
  g.strokeStyle='#333'; g.lineWidth=1.2; g.beginPath(); g.arc(bx-2,by-1,5,0.3,2.2); g.stroke();

  if(p.phase==='live'){ g.textAlign='center';
    const gn=goodNow();
    if(lvl<3){ g.fillStyle=gn?'#8fffb0':'rgba(255,255,255,0.7)'; g.font='bold 22px sans-serif';
      g.fillText(gn?'今だ！ 折り返せ！':'味方の走り込みに合わせろ…',W/2,80); }
    else if(!gn){ g.fillStyle='rgba(255,255,255,0.6)'; g.font='bold 19px sans-serif'; g.fillText('走り込みを読め…',W/2,80); }
  }
}
function drawHUD(){
  g.textAlign='left'; g.fillStyle='#fff'; g.font='bold 25px sans-serif'; g.fillText('SCORE '+score,20,40);
  if(combo>1){ g.fillStyle='#ffd84a'; g.font='bold 16px sans-serif'; g.fillText(combo+' 連続弾',20,62); }
  g.textAlign='right'; g.fillStyle='rgba(255,255,255,0.85)'; g.font='14px sans-serif'; g.fillText('ゴール '+goals+'  Lv.'+(lvl+1),W-20,38);
  g.fillStyle='#ff6a6a'; g.font='bold 14px sans-serif'; g.fillText('ミス',W-90,62);
  for(let i=0;i<3;i++){ g.fillStyle=i<fails?'#ff5a5a':'rgba(255,255,255,0.24)'; g.beginPath(); g.arc(W-68+i*22,57,8,0,6.28); g.fill(); }
}
function drawTitle(){
  g.fillStyle='rgba(0,0,0,0.55)'; g.fillRect(0,0,W,H);
  g.textAlign='center'; g.fillStyle='#8fffb0'; g.font='bold 52px sans-serif'; g.fillText('カットバック',W/2,144);
  g.fillStyle='#fff'; g.font='bold 22px sans-serif'; g.fillText('The Cutback — マイナスの折り返しで崩せ',W/2,186);
  g.fillStyle='#cfe'; g.font='18px sans-serif';
  g.fillText('サイドを抜けてゴールライン際。走り込む味方（青）がスポット（点線）に',W/2,242);
  g.fillText('来る瞬間にマイナスの折り返し（クリック/タップ/SPACE）＝ワンタッチでゴール。',W/2,270);
  g.fillText('早いと味方の前を通過してGK処理、遅いと追うDF（赤）にクリアされる。',W/2,298);
  g.fillText('走り込みにピタリなら加点。上級は速く見極めも短い。3ミスで終了。',W/2,326);
  g.fillStyle='#ffd84a'; g.font='bold 22px sans-serif'; g.fillText('クリック / タップ / キー でスタート',W/2,398);
}
function drawOver(){
  g.fillStyle='rgba(0,0,0,0.64)'; g.fillRect(0,0,W,H);
  g.textAlign='center'; g.fillStyle='#ff6a6a'; g.font='bold 52px sans-serif'; g.fillText('3ミス…終了',W/2,H/2-54);
  g.fillStyle='#fff'; g.font='bold 34px sans-serif'; g.fillText('SCORE '+score,W/2,H/2+2);
  g.fillStyle='#cfe'; g.font='20px sans-serif'; g.fillText('ゴール '+goals+'　BEST '+best,W/2,H/2+40);
  g.fillStyle='#8fffb0'; g.font='bold 22px sans-serif'; g.fillText('クリック / タップ で もう一度',W/2,H/2+96);
}
function render(){
  g.setTransform(DPR,0,0,DPR,0,0);
  let sx=0,sy=0; if(shakeT>0){ sx=rnd(-6,6)*shakeT*3; sy=rnd(-6,6)*shakeT*3; g.translate(sx,sy); }
  drawField();
  if(state==='play') drawScene();
  parts.forEach(q=>{ g.globalAlpha=clamp(q.life,0,1); g.fillStyle=q.c; g.beginPath(); g.arc(q.x,q.y,3,0,6.28); g.fill(); }); g.globalAlpha=1;
  pops.forEach(q=>{ g.globalAlpha=clamp(q.life,0,1); g.textAlign='center'; g.fillStyle=q.c; g.font='bold '+(q.big?27:19)+'px sans-serif';
    const px=(q.x==null)?W/2:q.x; g.fillText(q.txt,px,q.y); }); g.globalAlpha=1;
  if(state==='play') drawHUD();
  if(flash>0){ g.fillStyle='rgba(255,255,255,'+(flash*0.6)+')'; g.fillRect(0,0,W,H); }
  if(state==='title') drawTitle();
  if(state==='over') drawOver();
  g.setTransform(DPR,0,0,DPR,0,0);
}

let last=0;
function frameLoop(ts){ let dt=ts-last; last=ts; if(dt>60)dt=60; if(dt<0)dt=0; update(dt); render(); requestAnimationFrame(frameLoop); }
requestAnimationFrame(frameLoop);

// ---------- test hook ----------
window.__cb={
  start, release,
  get state(){return state;}, get score(){return score;}, get fails(){return fails;}, get goals(){return goals;},
  get info(){ if(state!=='play') return {state,phase:'-'}; const p=play; return {
    state, phase:p.phase, t, tStk:p.tStk, tDef:p.tDef, win:p.win, ballTravel:p.ballTravel,
    goodNow:goodNow(), released:p.released, result:p.result, fails, goals, lvl }; }
};
})();
</script>
</body>
</html>
