<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>犠牲フライ (Sac Fly)</title>
<style>
  html,body{margin:0;height:100%;background:#0a0c12;overflow:hidden;
    font-family:-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  #stage{position:relative;width:100vw;height:100vh;max-width:calc(100vh*1.5);max-height:calc(100vw/1.5);aspect-ratio:900/600;}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;border-radius:6px;}
</style>
</head>
<body>
<div id="wrap"><div id="stage"><canvas id="cv"></canvas></div></div>
<script>
(function(){
const W=900,H=600,cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let DPR=1;
function fit(){DPR=Math.min(2,window.devicePixelRatio||1);cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
fit();addEventListener('resize',fit);

// ---------- audio ----------
let AC=null;function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function tone(f,d,type,v,sweep){const a=ac();if(!a)return;const t=a.currentTime,o=a.createOscillator(),g=a.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(sweep)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+sweep),t+d);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v||0.2,t+0.008);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+0.02);}
function noise(d,v,hp){const a=ac();if(!a)return;const t=a.currentTime,n=Math.floor(a.sampleRate*d),buf=a.createBuffer(1,n,a.sampleRate),ch=buf.getChannelData(0);
  for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource();s.buffer=buf;
  const f=a.createBiquadFilter();f.type='highpass';f.frequency.value=hp||600;const g=a.createGain();g.gain.value=v||0.2;
  s.connect(f);f.connect(g);g.connect(a.destination);s.start(t);s.stop(t+d+0.02);}
const S={
  hit:()=>{noise(0.05,0.14,600);tone(300,0.05,'square',0.09,120);},
  score:()=>{[540,760,1010,1300].forEach((f,i)=>setTimeout(()=>tone(f,0.12,'triangle',0.18),i*54));},
  take:()=>{tone(540,0.08,'sine',0.09);tone(680,0.08,'sine',0.06);},
  bad:()=>{noise(0.16,0.22,320);tone(170,0.18,'sawtooth',0.12,-50);},
  streak:()=>{[700,930,1170,1400].forEach((f,i)=>setTimeout(()=>tone(f,0.1,'triangle',0.16),i*60));},
  over:()=>{[440,330,247,175].forEach((f,i)=>setTimeout(()=>tone(f,0.3,'triangle',0.2),i*160));}
};

// ---------- geometry ----------
const PLATE={x:452,y:470}, REL={x:452,y:120}, THIRD={x:196,y:400};

// ---------- state ----------
let state='title', phase='pitch', t=0, plays=0;
let score=0, fails=0, lvl=1, combo=0, rbi=0;
let best=+(localStorage.getItem('sacfly_best')||0);
let clock=0, arrivalT=760, sacW=88, edge=170, kind='elev', zoneY=0;
let acted=false, result=null, resultT=0, msg='', animU=0;
let shake=0, flash=0, flashCol='#fff', last=performance.now();
let parts=[], pops=[];

function rnd(a,b){return a+Math.random()*(b-a);}
function chance(p){return Math.random()<p;}
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function lerp(a,b,u){return a+(b-a)*u;}
function easeOut(u){return 1-Math.pow(1-u,2);}

function params(){ return {
  arr:Math.max(540,800-lvl*36),
  sacW:Math.max(66,96-lvl*4),
  edge:Math.max(120,190-lvl*10)
};}

function reset(){state='title';score=0;fails=0;lvl=1;combo=0;rbi=0;plays=0;result=null;parts=[];pops=[];}
function newPlay(){
  plays++; lvl=Math.min(7,1+Math.floor(rbi/4));
  const p=params(); arrivalT=p.arr; sacW=p.sacW; edge=p.edge;
  kind=chance(0.6)?'elev':'sink';
  zoneY = kind==='elev' ? PLATE.y-96 : PLATE.y-30;  // high (elevatable) vs low (sinker)
  clock=0; acted=false; result=null; resultT=0; msg=''; animU=0; phase='pitch';
}
function start(){ if(!ac())ac(); if(AC&&AC.state==='suspended')AC.resume(); reset(); state='play'; newPlay(); }

function ballY(){ return lerp(REL.y,zoneY,easeOut(clamp(clock/arrivalT,0,1))); }

function swing(){
  if(state==='title'){start();return;}
  if(state==='over'){ if(resultT>0.4){reset();start();} return; }
  if(state!=='play'||phase!=='pitch'||acted) return;
  acted=true;
  if(kind==='sink'){ resolve('grounder_sink'); return; }
  const err=clock-arrivalT;
  if(Math.abs(err)<=sacW) resolve('sacfly');
  else if(err<0 && err>=-edge-sacW) resolve('popup');
  else if(err>0 && err<=edge+sacW) resolve('grounder');
  else resolve('whiff');
}

function resolve(k){
  phase='result'; result=k; resultT=0; animU=0;
  const good=(k==='sacfly'||k==='goodTake');
  if(good){
    if(k==='sacfly'){ rbi++; combo++;
      const err=Math.abs(clock-arrivalT); const deep=err<=sacW*0.45;
      let add=Math.round((deep?230:150)*(1+Math.min(9,combo-1)*0.14)); S.score();
      flash=1;flashCol='#8affa0';shake=9; burst(PLATE.x,PLATE.y-40,'#8affa0',22,8);
      burst(THIRD.x+80,PLATE.y+6,'#8affa0',14,6);
      pop(PLATE.x,PLATE.y-120,deep?'特大の犠飛！ 生還 +'+add:'犠牲フライ！ 生還 +'+add,'#d6ffe0'); pop(W/2,150,'走者タッチアップで生還！','#8affa0');
      score+=add;
      if(combo>=2)pop(W/2,190,'コンボ x'+combo,'#ffd24d');
      if(combo>0&&combo%5===0)S.streak();
      msg=deep?'大きな犠飛！悠々タッチアップで1点':'深いフライ！犠牲フライで走者生還';
    } else { // goodTake
      let add=Math.round(50*(1+Math.min(9,combo-1)*0.12)); S.take();
      pop(PLATE.x,PLATE.y-120,'低め見送り +'+add,'#bfe3ff'); score+=add;
      msg='低めの沈む球を見送り——ゴロを避けて好判断';
    }
  } else {
    fails++; combo=0; flash=1;flashCol='#ff5b5b';shake=8; S.bad();
    if(result==='popup') msg='差し込まれ気味に打ち上げ…浅い内野フライで走者は還れず';
    else if(result==='grounder') msg='上から叩いてゴロ…走者は本塁で憤死／進めず';
    else if(result==='grounder_sink') msg='低めの沈む球を打ってゴロ…併殺の危機で走者還れず';
    else if(result==='takeElev') msg='絶好球を見逃し…犠飛のチャンスを逃した';
    else msg='空振り…タイミングが大きく外れた';
    pop(PLATE.x,PLATE.y-120,result==='popup'?'内野フライ':(result==='whiff'?'空振り':'ゴロ'),'#ffb0b0');
  }
  if(fails>=3){ state='over'; resultT=0; S.over(); if(score>best){best=score;localStorage.setItem('sacfly_best',best);} }
}

// ---------- input ----------
cv.addEventListener('pointerdown',e=>{e.preventDefault();swing();});
addEventListener('keydown',e=>{ if(e.repeat)return; if(e.code==='Space'||e.code==='Enter'||e.code==='ArrowUp'||e.code==='KeyZ'){e.preventDefault();swing();} });

// ---------- particles ----------
function burst(x,y,c,n,sp){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=rnd(sp*0.3,sp);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:1,c});}}
function pop(x,y,txt,c){pops.push({x,y,txt,c,life:1});}

// ---------- update ----------
function update(dt){
  shake*=Math.pow(0.86,dt/16.7); if(shake<0.3)shake=0;
  flash*=Math.pow(0.9,dt/16.7);
  for(const p of parts){p.vx*=0.96;p.vy=p.vy*0.96+0.28;p.x+=p.vx*dt/16.7;p.y+=p.vy*dt/16.7;p.life-=dt/16.7*0.026;}
  parts=parts.filter(p=>p.life>0);
  for(const p of pops){p.y-=dt/16.7*0.5;p.life-=dt/16.7*0.02;}
  pops=pops.filter(p=>p.life>0);

  if(state!=='play'){ if(state==='over')resultT+=dt/1000; return; }
  t+=dt;
  if(phase==='pitch'){ clock+=dt;
    if(!acted && clock>arrivalT+edge){ acted=true; resolve(kind==='sink'?'goodTake':'takeElev'); }
    return;
  }
  if(phase==='result'){ resultT+=dt/1000; animU=Math.min(1,animU+dt/900); if(resultT>1.25 && state==='play') newPlay(); return; }
}

// ---------- render ----------
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function figure(x,y,col,sc){ sc=sc||1;
  ctx.fillStyle='rgba(0,0,0,0.22)';ctx.beginPath();ctx.ellipse(x,y+13*sc,12*sc,4*sc,0,0,6.28);ctx.fill();
  ctx.fillStyle=col;rr(x-7*sc,y-22*sc,14*sc,24*sc,6*sc);ctx.fill();
  ctx.fillStyle='#f2c9a0';ctx.beginPath();ctx.arc(x,y-27*sc,6*sc,0,6.28);ctx.fill();
}
function drawScene(){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#1b2740');g.addColorStop(0.5,'#22406b');g.addColorStop(1,'#2c7a3b');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#7a5230';ctx.beginPath();ctx.ellipse(PLATE.x,PLATE.y+18,150,60,0,0,6.28);ctx.fill();
  // third base + home
  ctx.save();ctx.translate(THIRD.x,PLATE.y+4);ctx.rotate(0.785);ctx.fillStyle='#eef0f2';ctx.fillRect(-11,-11,22,22);ctx.restore();
  ctx.fillStyle='#eef0f2';ctx.beginPath();ctx.moveTo(PLATE.x-13,PLATE.y-6);ctx.lineTo(PLATE.x+13,PLATE.y-6);ctx.lineTo(PLATE.x+13,PLATE.y+3);ctx.lineTo(PLATE.x,PLATE.y+11);ctx.lineTo(PLATE.x-13,PLATE.y+3);ctx.closePath();ctx.fill();
  // strike zone
  ctx.strokeStyle='rgba(255,255,255,0.4)';ctx.lineWidth=2;ctx.strokeRect(PLATE.x-56,PLATE.y-120,112,104);
  // elevatable band (upper) vs sinker band (lower) guide
  ctx.fillStyle='rgba(140,255,160,0.10)';ctx.fillRect(PLATE.x-56,PLATE.y-120,112,52);
  ctx.fillStyle='rgba(255,120,120,0.10)';ctx.fillRect(PLATE.x-56,PLATE.y-52,112,36);
}

function render(){
  ctx.save();
  if(shake>0)ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
  drawScene();

  if(state==='play'){
    // runner on third
    let runU=0;
    if(phase==='result'&&result==='sacfly') runU=clamp(animU,0,1);
    const rx=lerp(THIRD.x,PLATE.x-20,easeOut(runU)), ry=lerp(PLATE.y+4,PLATE.y-2,easeOut(runU));
    figure(rx,ry,'#ff8a3a',0.9);
    // batter + pitcher
    figure(PLATE.x+92,PLATE.y-14,'#2b6cff',0.95);
    ctx.fillStyle='#d24b4b';rr(REL.x-10,REL.y-13,20,26,6);ctx.fill();
    ctx.fillStyle='#f2c9a0';ctx.beginPath();ctx.arc(REL.x,REL.y-17,6.5,0,6.28);ctx.fill();

    if(phase==='pitch'){
      const by=ballY();
      const tint = kind==='elev' ? '#8affa0' : '#ff9a9a';
      ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(PLATE.x,by,7,0,6.28);ctx.fill();
      ctx.strokeStyle=tint;ctx.lineWidth=2;ctx.beginPath();ctx.arc(PLATE.x,by,10,0,6.28);ctx.stroke();
      if(clock>arrivalT*0.5){ ctx.fillStyle=tint;ctx.font='bold 14px sans-serif';ctx.textAlign='center';
        ctx.fillText(kind==='elev'?'高め＝上げられる！':'低め＝沈む（ゴロ）',PLATE.x,by-18); }
    } else if(phase==='result'){
      // ball flight by outcome
      let bx=PLATE.x, by=PLATE.y-40;
      if(result==='sacfly'){ bx=lerp(PLATE.x,PLATE.x+120,easeOut(animU)); by=PLATE.y-40-Math.sin(animU*3.14)*260; }
      else if(result==='popup'){ by=PLATE.y-40-Math.sin(animU*3.14)*150; bx=PLATE.x+20; }
      else if(result==='grounder'||result==='grounder_sink'){ bx=lerp(PLATE.x,PLATE.x-90,easeOut(animU)); by=PLATE.y-8; }
      if(result!=='takeElev'&&result!=='goodTake'&&result!=='whiff'){ ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(bx,by,7,0,6.28);ctx.fill(); }
    }
  }

  for(const p of parts){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,3.2,0,6.28);ctx.fill();}
  ctx.globalAlpha=1;
  for(const p of pops){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.font='bold 21px sans-serif';ctx.textAlign='center';ctx.fillText(p.txt,p.x,p.y);}
  ctx.globalAlpha=1;

  // HUD
  ctx.textAlign='left';ctx.fillStyle='#fff';ctx.font='bold 26px sans-serif';ctx.fillText('SCORE '+score,20,36);
  ctx.textAlign='right';ctx.fillStyle='rgba(255,255,255,0.9)';ctx.font='14px sans-serif';ctx.fillText('打点 '+rbi+'  Lv'+lvl,W-20,24);
  ctx.fillText('失敗',W-92,46);
  for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(W-60+i*20,41,7,0,6.28);ctx.fillStyle=i<fails?'#ff5b5b':'rgba(255,255,255,0.25)';ctx.fill();}
  if(combo>=2){ctx.textAlign='center';ctx.fillStyle='#ffd24d';ctx.font='bold 18px sans-serif';ctx.fillText('コンボ x'+combo,W/2,110);}

  if(state==='play'&&phase==='pitch'){ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,0.92)';ctx.font='bold 15px sans-serif';
    ctx.fillText('三塁走者を犠飛で還せ！ 高め（緑）は“芯で”振って深いフライ、低め（赤）は見送れ',W/2,42);}
  if(state==='play'&&phase==='result'&&msg){ctx.textAlign='center';ctx.fillStyle=(result==='sacfly'||result==='goodTake')?'#9ff0b8':'#ff9a9a';ctx.font='bold 19px sans-serif';ctx.fillText(msg,W/2,42);}

  if(state==='title'){
    ctx.fillStyle='rgba(6,9,14,0.78)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='bold 44px sans-serif';ctx.fillText('犠牲フライ',W/2,102);
    ctx.fillStyle='#ffd23e';ctx.font='bold 22px sans-serif';ctx.fillText('Sac Fly',W/2,138);
    ctx.fillStyle='rgba(255,255,255,0.92)';ctx.font='16px sans-serif';
    ctx.fillText('三塁走者・一死——“アウトになってもいい”深い犠牲フライで1点をもぎ取れ',W/2,186);
    ctx.fillStyle='rgba(255,255,255,0.66)';ctx.font='14px sans-serif';
    ctx.fillText('高め＝上げやすい球（緑）は、芯のタイミングで振れば深いフライ＝犠飛で走者生還',W/2,224);
    ctx.fillText('タイミングが早いと打ち上げて浅い内野フライ（還れず）、遅いと上から叩いてゴロ（憤死）',W/2,246);
    ctx.fillText('低め＝沈む球（赤）は振るとゴロになるだけ——見送って“ゴロ回避”が正解（絶好球の見逃しは失敗）',W/2,268);
    ctx.fillText('芯のど真ん中で捉えれば“特大の犠飛”で悠々生還＝大量得点。上級ほど球が速く芯が狭い',W/2,290);
    ctx.fillText('内野フライ／ゴロ／低め打ち／絶好球見逃し／空振り＝失敗。3失敗で交代',W/2,312);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で開始',W/2,380);
    ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='14px sans-serif';ctx.fillText('BEST '+best,W/2,412);
  }
  if(state==='over'){
    ctx.fillStyle='rgba(6,9,14,0.84)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#ff6b6b';ctx.font='bold 46px sans-serif';ctx.fillText('3失敗…交代',W/2,222);
    ctx.fillStyle='#fff';ctx.font='bold 40px sans-serif';ctx.fillText('SCORE '+score,W/2,290);
    ctx.fillStyle='rgba(255,255,255,0.85)';ctx.font='19px sans-serif';ctx.fillText('打点 '+rbi+'   BEST '+best,W/2,330);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で もう一度',W/2,402);
  }

  if(flash>0.02){ctx.globalAlpha=flash*0.5;ctx.fillStyle=flashCol;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}
  ctx.restore();

  ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,0.4)';ctx.font='12px sans-serif';
  ctx.fillText('犠牲フライ：高めの球を芯のタイミングで深いフライに上げて走者を還す。低めは見送り。早いと内野フライ・遅いとゴロ。3失敗で交代',W/2,H-8);
}

function frame(ts){let dt=ts-last;last=ts;if(dt>60)dt=60;if(dt<0)dt=0;update(dt);render();requestAnimationFrame(frame);}
requestAnimationFrame(frame);

// ---------- test hook ----------
window.__sf={
  start, swing:()=>swing(),
  get state(){return state;},
  get score(){return score;},
  get rbi(){return rbi;},
  get fails(){return fails;},
  get info(){return {state,phase,kind,clock,arrivalT,sacW,edge,acted,result,rbi,fails,lvl,
    canSwing:(phase==='pitch'&&!acted)};}
};
})();
</script>
</body>
</html>
