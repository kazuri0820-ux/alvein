<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>スイーパーキーパー (Sweeper Keeper)</title>
<style>
  html,body{margin:0;height:100%;background:#08130c;overflow:hidden;
    font-family:-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  #stage{position:relative;width:100vw;height:100vh;max-width:calc(100vh*1.5);max-height:calc(100vw/1.5);aspect-ratio:900/600;}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;border-radius:6px;}
</style>
</head>
<body>
<div id="wrap"><div id="stage"><canvas id="cv"></canvas></div></div>
<script>
(function(){
const W=900,H=600,cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let DPR=1;
function fit(){DPR=Math.min(2,window.devicePixelRatio||1);cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
fit();addEventListener('resize',fit);

// ---------- audio ----------
let AC=null;function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function tone(f,d,type,v,sweep){const a=ac();if(!a)return;const t=a.currentTime,o=a.createOscillator(),g=a.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(sweep)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+sweep),t+d);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v||0.2,t+0.008);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+0.02);}
function noise(d,v,hp){const a=ac();if(!a)return;const t=a.currentTime,n=Math.floor(a.sampleRate*d),buf=a.createBuffer(1,n,a.sampleRate),ch=buf.getChannelData(0);
  for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource();s.buffer=buf;
  const f=a.createBiquadFilter();f.type='highpass';f.frequency.value=hp||600;const g=a.createGain();g.gain.value=v||0.2;
  s.connect(f);f.connect(g);g.connect(a.destination);s.start(t);s.stop(t+d+0.02);}
const S={
  rush:()=>{tone(300,0.1,'sine',0.1,240);},
  clear:()=>{noise(0.05,0.16,600);tone(360,0.09,'triangle',0.12,-60);setTimeout(()=>[720,960,1200].forEach((f,i)=>setTimeout(()=>tone(f,0.1,'triangle',0.16),i*70)),80);},
  save:()=>{noise(0.06,0.16,500);[660,900,1120].forEach((f,i)=>setTimeout(()=>tone(f,0.1,'triangle',0.16),i*70));},
  concede:()=>{noise(0.16,0.18,300);tone(150,0.3,'sawtooth',0.14,-60);},
  streak:()=>{[660,880,1100,1320].forEach((f,i)=>setTimeout(()=>tone(f,0.1,'triangle',0.16),i*60));},
  over:()=>{[440,330,247,175].forEach((f,i)=>setTimeout(()=>tone(f,0.3,'triangle',0.2),i*160));}
};

// ---------- geometry ----------
const LANEY=312, GOALX=846, GKHOME=748, CLEARX=536;

// ---------- state ----------
let state='title', phase='race', t=0, plays=0;
let score=0, combo=0, best=+(localStorage.getItem('sweeper_best')||0);
let saves=0, fails=0, lvl=1;
let clock=0, ballT=1400, deadline=840, decisionEnd=1520, winnable=true, acted=false, rushed=false, pressT=0;
let ballX=170, strikerX=200, strikerStart=200, strikerT=1400, gkX=GKHOME, gkY=LANEY, gkRun=520;
let result=null, resultT=0, msg='';
let shake=0, flash=0, flashCol='#fff', last=performance.now();
let parts=[], pops=[];

function rnd(a,b){return a+Math.random()*(b-a);}
function chance(p){return Math.random()<p;}
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function lerp(a,b,u){return a+(b-a)*u;}
function easeOut(u){return 1-Math.pow(1-u,2);}

function params(){ return { ballT:Math.max(900,1420-lvl*72), gkRun:520, gap:Math.max(60,150-lvl*13) }; }

function reset(){state='title';score=0;combo=0;saves=0;fails=0;lvl=1;plays=0;result=null;parts=[];pops=[];}
function newPlay(){
  plays++; lvl=Math.min(7,1+Math.floor(saves/4));
  const p=params(); ballT=p.ballT; gkRun=p.gkRun; deadline=ballT-p.gkRun-40; decisionEnd=ballT+120;
  winnable=chance(0.5);
  // striker start (distance to the clear point): winnable -> far (long run), not -> close
  const near = 360 - (p.gap*0.0);   // reference
  strikerStart = winnable ? rnd(150,150+p.gap*0.9) : rnd(150+p.gap*1.5, 150+p.gap*2.4);
  // map strikerStart along its run so bigger start-number = closer to clear point (shorter run)
  strikerT = winnable ? rnd(ballT*0.98, ballT*1.12) : rnd(ballT*0.62, ballT*0.78);
  strikerX = 120; ballX=170; gkX=GKHOME; gkY=LANEY;
  clock=0; acted=false; rushed=false; pressT=0;
  result=null; phase='race'; msg='';
}
function start(){ if(!ac())ac(); if(AC&&AC.state==='suspended')AC.resume(); reset(); state='play'; newPlay(); }

function rush(){
  if(state==='title'){start();return;}
  if(state==='over'){ if(resultT>0.4){reset();start();} return; }
  if(state!=='play'||phase!=='race'||acted) return;
  acted=true; rushed=true; pressT=clock; S.rush();
  if(!winnable) resolve('beaten');
  else if(clock>deadline) resolve('late');
  else resolve('clear');
}

function resolve(kind){
  phase='result'; result=kind; resultT=0;
  const good=(kind==='clear'||kind==='save');
  if(good){
    saves++; combo++;
    const add=Math.round((kind==='clear'?130:110)*(1+Math.min(9,combo-1)*0.16)); score+=add;
    if(kind==='clear'){S.clear();pop(CLEARX,LANEY-40,'クリア！ +'+add,'#fff3c4');msg='飛び出して先に触った！';}
    else {S.save();pop(GKHOME,LANEY-40,'セーブ！ +'+add,'#dff3ff');msg='残って正解、シュートを止めた！';}
    flash=1;flashCol='#ffe08a';shake=6; burst(kind==='clear'?CLEARX:GKHOME,LANEY,'#ffe08a',16,5.5);
    if(combo>=2)pop(W/2,LANEY-70,'コンボ x'+combo,'#ffd24d');
    if(combo>0&&combo%5===0)S.streak();
  } else {
    fails++; combo=0; flash=1;flashCol='#ff5b5b';shake=8; S.concede();
    if(kind==='beaten') msg='飛び出し過ぎ！ 間に合わずかわされて失点';
    else if(kind==='late') msg='遅い！ 出るのが遅れて先に触られた';
    else msg='飛び出すべきだった！ 裏で決められた';   // exposed
    pop(GOALX-40,LANEY-30,'GOAL','#ffb0b0');
  }
  if(fails>=3){ state='over'; resultT=0; S.over(); if(score>best){best=score;localStorage.setItem('sweeper_best',best);} }
}

// ---------- input ----------
cv.addEventListener('pointerdown',e=>{e.preventDefault();rush();});
addEventListener('keydown',e=>{ if(e.code==='Space'||e.code==='Enter'||e.code==='ArrowUp'||e.code==='ArrowLeft'){e.preventDefault();rush();} });

// ---------- particles ----------
function burst(x,y,c,n,sp){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=rnd(sp*0.3,sp);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:1,c});}}
function pop(x,y,txt,c){pops.push({x,y,txt,c,life:1});}

// ---------- update ----------
function update(dt){
  shake*=Math.pow(0.86,dt/16.7); if(shake<0.3)shake=0;
  flash*=Math.pow(0.9,dt/16.7);
  for(const p of parts){p.vx*=0.96;p.vy=p.vy*0.96+0.28;p.x+=p.vx*dt/16.7;p.y+=p.vy*dt/16.7;p.life-=dt/16.7*0.026;}
  parts=parts.filter(p=>p.life>0);
  for(const p of pops){p.y-=dt/16.7*0.5;p.life-=dt/16.7*0.02;}
  pops=pops.filter(p=>p.life>0);

  if(state!=='play'){ if(state==='over')resultT+=dt/1000; return; }
  t+=dt;
  if(phase==='race'){
    clock+=dt;
    // ball rolls toward goal along the lane
    ballX = lerp(170, GOALX-20, easeOut(Math.min(1,clock/ballT)));
    // striker runs to the ball path (converges near CLEARX)
    strikerX = lerp(strikerStart-80, CLEARX-6, easeOut(Math.min(1,clock/strikerT)));
    if(!acted && clock>=decisionEnd){ resolve(winnable?'exposed':'save'); }
    return;
  }
  if(phase==='result'){
    resultT+=dt/1000;
    // animate outcomes
    if(result==='clear'){ gkX=lerp(GKHOME,CLEARX,easeOut(Math.min(1,resultT/0.45))); if(resultT>0.45){ballX=lerp(CLEARX,220,easeOut(Math.min(1,(resultT-0.45)/0.6)));} }
    else if(result==='save'){ ballX=lerp(ballX,GKHOME-6,Math.min(1,dt/16.7*0.14)); }
    else if(result==='beaten'||result==='late'){ gkX=lerp(GKHOME,CLEARX+30,easeOut(Math.min(1,resultT/0.5))); ballX=lerp(ballX,GOALX-8,Math.min(1,dt/16.7*0.10)); strikerX=lerp(strikerX,GOALX-30,Math.min(1,dt/16.7*0.08)); }
    else { ballX=lerp(ballX,GOALX-8,Math.min(1,dt/16.7*0.10)); strikerX=lerp(strikerX,GOALX-30,Math.min(1,dt/16.7*0.09)); } // exposed
    if(resultT>1.2 && state==='play') newPlay();
    return;
  }
}

// ---------- render ----------
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function drawScene(){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#227036');g.addColorStop(1,'#18551f');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  for(let i=0;i<10;i++){ctx.fillStyle=i%2?'rgba(255,255,255,0.04)':'rgba(0,0,0,0.045)';ctx.fillRect(i*90,0,45,H);}
  // penalty box (right)
  ctx.strokeStyle='rgba(255,255,255,0.3)';ctx.lineWidth=3;ctx.strokeRect(GOALX-176,150,176,320);
  ctx.strokeRect(GOALX-72,220,72,180);
  // goal
  ctx.strokeStyle='#eef3f5';ctx.lineWidth=6;ctx.strokeRect(GOALX,LANEY-70,26,140);
  ctx.strokeStyle='rgba(255,255,255,0.2)';ctx.lineWidth=1;for(let y=LANEY-66;y<LANEY+70;y+=11){ctx.beginPath();ctx.moveTo(GOALX+3,y);ctx.lineTo(GOALX+23,y);ctx.stroke();}
  // the through-ball lane
  ctx.strokeStyle='rgba(255,255,255,0.14)';ctx.setLineDash([8,8]);ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(120,LANEY);ctx.lineTo(GOALX,LANEY);ctx.stroke();ctx.setLineDash([]);
}
function drawFig(x,y,col,r){
  ctx.fillStyle='rgba(0,0,0,0.22)';ctx.beginPath();ctx.ellipse(x,y+15,13,5,0,0,6.28);ctx.fill();
  ctx.fillStyle=col;rr(x-10,y-12,20,30,7);ctx.fill();
  ctx.fillStyle='#f2c9a0';ctx.beginPath();ctx.arc(x,y-19,8,0,6.28);ctx.fill();
}

function render(){
  ctx.save();
  if(shake>0)ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
  drawScene();

  if(state==='play'){
    // striker (attacker) converging on the lane
    const sy = phase==='race'? lerp(470,LANEY,easeOut(Math.min(1,clock/strikerT))) : LANEY;
    drawFig(strikerX, sy, '#e23c3c');
    // ball
    ctx.fillStyle='rgba(0,0,0,0.2)';ctx.beginPath();ctx.ellipse(ballX,LANEY+8,7,3,0,0,6.28);ctx.fill();
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(ballX,LANEY,8,0,6.28);ctx.fill();ctx.fillStyle='#233';ctx.beginPath();ctx.arc(ballX,LANEY,2.6,0,6.28);ctx.fill();
    // GK
    drawFig(gkX,gkY,'#ffcf3e');
    // decision cue: reach marker (how far GK can rush in time) + read hint
    if(phase==='race'){
      // timing bar
      const mw=280,mx=W/2-mw/2,my=H-38, u=clamp(clock/decisionEnd,0,1);
      ctx.fillStyle='rgba(0,0,0,0.35)';rr(mx-3,my-3,mw+6,16,8);ctx.fill();
      ctx.fillStyle=clock>deadline?'#ff6b6b':'#7fd0ff';rr(mx,my,mw*u,10,5);ctx.fill();
      // deadline tick
      const dxp=mx+mw*clamp(deadline/decisionEnd,0,1);ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(dxp,my-4);ctx.lineTo(dxp,my+14);ctx.stroke();
      ctx.fillStyle='rgba(255,255,255,0.7)';ctx.font='12px sans-serif';ctx.textAlign='center';ctx.fillText('間に合うなら“今”飛び出す（クリック/SPACE）／間に合わないなら我慢',W/2,my-8);
      // low-level read hint
      if(lvl<=2){ctx.fillStyle=winnable?'rgba(150,240,170,0.9)':'rgba(255,150,150,0.9)';ctx.font='bold 16px sans-serif';
        ctx.fillText(winnable?'間に合う！ 飛び出せ':'間に合わない…我慢',W/2,120);}
    }
  }

  for(const p of parts){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,3.2,0,6.28);ctx.fill();}
  ctx.globalAlpha=1;
  for(const p of pops){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.font='bold 22px sans-serif';ctx.textAlign='center';ctx.fillText(p.txt,p.x,p.y);}
  ctx.globalAlpha=1;

  // HUD
  ctx.textAlign='left';ctx.fillStyle='#fff';ctx.font='bold 26px sans-serif';ctx.fillText('SCORE '+score,20,36);
  ctx.textAlign='right';ctx.fillStyle='rgba(255,255,255,0.9)';ctx.font='14px sans-serif';ctx.fillText('成功 '+saves+'  Lv'+lvl,W-20,24);
  ctx.fillText('失点',W-92,46);
  for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(W-60+i*20,41,7,0,6.28);ctx.fillStyle=i<fails?'#ff5b5b':'rgba(255,255,255,0.25)';ctx.fill();}
  if(combo>=2){ctx.textAlign='center';ctx.fillStyle='#ffd24d';ctx.font='bold 18px sans-serif';ctx.fillText('コンボ x'+combo,W/2,86);}

  if(state==='play'&&phase==='race'){ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,0.9)';ctx.font='bold 15px sans-serif';
    ctx.fillText('裏へのスルーパス。先に触れるなら飛び出してクリア、無理なら残ってセーブに備えろ',W/2,44);}
  if(state==='play'&&phase==='result'&&msg){ctx.textAlign='center';ctx.fillStyle=(result==='clear'||result==='save')?'#9ff0b8':'#ff9a9a';ctx.font='bold 21px sans-serif';ctx.fillText(msg,W/2,44);}

  if(state==='title'){
    ctx.fillStyle='rgba(6,14,10,0.72)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='bold 42px sans-serif';ctx.fillText('スイーパーキーパー',W/2,128);
    ctx.fillStyle='#ffd23e';ctx.font='bold 22px sans-serif';ctx.fillText('Sweeper Keeper',W/2,164);
    ctx.fillStyle='rgba(255,255,255,0.92)';ctx.font='16px sans-serif';
    ctx.fillText('裏へのスルーパスに“飛び出す”か“残る”か。GKの一瞬の判断',W/2,214);
    ctx.fillStyle='rgba(255,255,255,0.66)';ctx.font='14px sans-serif';
    ctx.fillText('ボールと相手FWの競争を読み、GKが先に触れるなら飛び出してクリア（クリック/タップ/SPACE）',W/2,252);
    ctx.fillText('間に合わない（FWが近い）なら我慢して残り、ゴール前でシュートに備える＝セーブ',W/2,274);
    ctx.fillText('間に合わないのに飛び出すとかわされて失点、飛び出すのが遅くても先に触られる',W/2,296);
    ctx.fillText('間に合うのに我慢すると裏で決められる。速い好判断ほど高得点。3失点で交代',W/2,318);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で開始',W/2,396);
    ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='14px sans-serif';ctx.fillText('BEST '+best+'　　飛び出す=クリック/SPACE、残る=何もしない',W/2,430);
  }
  if(state==='over'){
    ctx.fillStyle='rgba(6,14,10,0.8)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#ff6b6b';ctx.font='bold 46px sans-serif';ctx.fillText('3失点…交代',W/2,222);
    ctx.fillStyle='#fff';ctx.font='bold 40px sans-serif';ctx.fillText('SCORE '+score,W/2,290);
    ctx.fillStyle='rgba(255,255,255,0.85)';ctx.font='19px sans-serif';ctx.fillText('成功 '+saves+'   BEST '+best,W/2,330);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で もう一度',W/2,402);
  }

  if(flash>0.02){ctx.globalAlpha=flash*0.5;ctx.fillStyle=flashCol;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}
  ctx.restore();

  ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,0.4)';ctx.font='12px sans-serif';
  ctx.fillText('先に触れるなら飛び出しクリア、無理なら残ってセーブ。出過ぎ/遅れ=かわされ失点、我慢し過ぎ=裏で失点。3失点で交代',W/2,H-8);
}

function frame(ts){let dt=ts-last;last=ts;if(dt>60)dt=60;if(dt<0)dt=0;update(dt);render();requestAnimationFrame(frame);}
requestAnimationFrame(frame);

// ---------- test hook ----------
window.__sk={
  start, rush:()=>rush(),
  get state(){return state;},
  get score(){return score;},
  get saves(){return saves;},
  get fails(){return fails;},
  get info(){return {state,phase,winnable,clock,ballT,deadline,decisionEnd,acted,result,saves,fails,lvl};}
};
})();
</script>
</body>
</html>
