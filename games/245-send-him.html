<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>三塁コーチャー (Send Him!)</title>
<style>
  html,body{margin:0;height:100%;background:#0a0f0a;overflow:hidden;
    font-family:-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  #stage{position:relative;width:100vw;height:100vh;max-width:calc(100vh*1.5);max-height:calc(100vw/1.5);aspect-ratio:900/600;}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;border-radius:6px;}
</style>
</head>
<body>
<div id="wrap"><div id="stage"><canvas id="cv"></canvas></div></div>
<script>
(function(){
const W=900,H=600,cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let DPR=1;
function fit(){DPR=Math.min(2,window.devicePixelRatio||1);cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
fit();addEventListener('resize',fit);

// ---------- audio ----------
let AC=null;function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function tone(f,d,type,v,sweep){const a=ac();if(!a)return;const t=a.currentTime,o=a.createOscillator(),g=a.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(sweep)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+sweep),t+d);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v||0.2,t+0.008);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+0.02);}
function noise(d,v,hp){const a=ac();if(!a)return;const t=a.currentTime,n=Math.floor(a.sampleRate*d),buf=a.createBuffer(1,n,a.sampleRate),ch=buf.getChannelData(0);
  for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource();s.buffer=buf;
  const f=a.createBiquadFilter();f.type='highpass';f.frequency.value=hp||600;const g=a.createGain();g.gain.value=v||0.2;
  s.connect(f);f.connect(g);g.connect(a.destination);s.start(t);s.stop(t+d+0.02);}
const S={
  sign:()=>{tone(520,0.06,'square',0.09);},
  score:()=>{noise(0.05,0.12,500);[560,820,1080,1340].forEach((f,i)=>setTimeout(()=>tone(f,0.12,'triangle',0.18),i*55));},
  safe:()=>{[600,880].forEach((f,i)=>setTimeout(()=>tone(f,0.1,'triangle',0.15),i*70));},
  bad:()=>{noise(0.16,0.22,320);tone(170,0.18,'sawtooth',0.12,-50);},
  streak:()=>{[700,930,1170,1400].forEach((f,i)=>setTimeout(()=>tone(f,0.1,'triangle',0.16),i*60));},
  over:()=>{[440,330,247,175].forEach((f,i)=>setTimeout(()=>tone(f,0.3,'triangle',0.2),i*160));}
};

// ---------- geometry ----------
const HOME={x:450,y:512}, FIRST={x:648,y:360}, SECOND={x:450,y:236}, THIRD={x:252,y:360}, OF={x:250,y:110};

// ---------- state ----------
let state='title', phase='read', t=0, plays=0;
let score=0, combo=0, best=+(localStorage.getItem('sendhim_best')||0);
let outs=0, fails=0, lvl=1;   // outs = correct calls
let clock=0, coverT=760, pressT=1500, tell='clean', correct=0; // 0=HOLD,1=SEND
let acted=false, choice=-1, result=null, resultT=0, msg='', runU=0, homeU=0, throwU=0;
let shake=0, flash=0, flashCol='#fff', last=performance.now();
let parts=[], pops=[];

function rnd(a,b){return a+Math.random()*(b-a);}
function chance(p){return Math.random()<p;}
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function lerp(a,b,u){return a+(b-a)*u;}
function easeOut(u){return 1-Math.pow(1-u,2);}

function params(){ return {
  cover:Math.max(470,860-lvl*56),
  react:Math.max(400,800-lvl*58)
};}

function reset(){state='title';score=0;combo=0;outs=0;fails=0;lvl=1;plays=0;result=null;parts=[];pops=[];}
function newPlay(){
  plays++; lvl=Math.min(7,1+Math.floor(outs/4));
  const p=params();
  coverT=p.cover; pressT=coverT+p.react;
  tell = chance(0.5)?'clean':'bobble';
  correct = tell==='clean'?0:1;   // clean field -> HOLD, bobble -> SEND
  clock=0; acted=false; choice=-1; result=null; phase='read'; msg=''; resultT=0; runU=0; homeU=0; throwU=0;
}
function start(){ if(!ac())ac(); if(AC&&AC.state==='suspended')AC.resume(); reset(); state='play'; newPlay(); }

function call(dir){ // 0=HOLD, 1=SEND
  if(state==='title'){start();return;}
  if(state==='over'){ if(resultT>0.4){reset();start();} return; }
  if(state!=='play'||phase!=='read'||acted) return;
  acted=true; choice=dir; S.sign();
  if(dir===correct){ resolve(dir===1?'score':'held'); } else { resolve(dir===1?'thrownout':'missedrun'); }
}

function resolve(kind){
  phase='result'; result=kind; resultT=0;
  const good=(kind==='score'||kind==='held');
  if(good){
    outs++; combo++;
    let add=Math.round((kind==='score'?150:90)*(1+Math.min(9,combo-1)*0.16)); score+=add;
    S[kind==='score'?'score':'safe'](); flash=1;flashCol=kind==='score'?'#8affa0':'#ffe08a';shake=kind==='score'?7:4;
    burst(kind==='score'?HOME.x:THIRD.x, kind==='score'?HOME.y:THIRD.y, kind==='score'?'#8affa0':'#ffe08a', kind==='score'?18:10, 6);
    pop(450,150, kind==='score'?'ゴー！ 生還！ +'+add:'ストップ！ 好判断 +'+add, kind==='score'?'#d6ffe0':'#fff3c4');
    if(combo>=2)pop(450,190,'コンボ x'+combo,'#ffd24d');
    if(combo>0&&combo%5===0)S.streak();
    msg=kind==='score'?'もたつきを見てゴー！ 走者が生還！':'好返球を読んでストップ！ アウトを回避した';
  } else {
    fails++; combo=0; flash=1;flashCol='#ff5b5b';shake=8; S.bad();
    if(kind==='thrownout') msg='ゴーは無謀…好返球で本塁タッチアウト';
    else msg='止めて失敗…もたついた隙に回せば生還だった';
    pop(450,150, kind==='thrownout'?'本塁アウト':'走らせるべきだった','#ffb0b0');
  }
  if(fails>=3){ state='over'; resultT=0; S.over(); if(score>best){best=score;localStorage.setItem('sendhim_best',best);} }
}

// ---------- input ----------
cv.addEventListener('pointerdown',e=>{e.preventDefault();
  if(state==='title'){start();return;}
  if(state==='over'){ if(resultT>0.4){reset();start();} return; }
  const r=cv.getBoundingClientRect(); const x=(e.clientX-r.left)/r.width;
  call(x<0.5?0:1);
});
addEventListener('keydown',e=>{
  if(e.repeat)return;
  if(e.code==='ArrowLeft'||e.code==='KeyA'){e.preventDefault();call(0);}
  else if(e.code==='ArrowRight'||e.code==='KeyD'){e.preventDefault();call(1);}
  else if(e.code==='Space'||e.code==='Enter'){e.preventDefault(); if(state!=='play')call(0);}
});

// ---------- particles ----------
function burst(x,y,c,n,sp){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=rnd(sp*0.3,sp);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:1,c});}}
function pop(x,y,txt,c){pops.push({x,y,txt,c,life:1});}

// ---------- update ----------
function update(dt){
  shake*=Math.pow(0.86,dt/16.7); if(shake<0.3)shake=0;
  flash*=Math.pow(0.9,dt/16.7);
  for(const p of parts){p.vx*=0.96;p.vy=p.vy*0.96+0.28;p.x+=p.vx*dt/16.7;p.y+=p.vy*dt/16.7;p.life-=dt/16.7*0.026;}
  parts=parts.filter(p=>p.life>0);
  for(const p of pops){p.y-=dt/16.7*0.5;p.life-=dt/16.7*0.02;}
  pops=pops.filter(p=>p.life>0);

  if(state!=='play'){ if(state==='over')resultT+=dt/1000; return; }
  t+=dt;
  if(phase==='read'){
    clock+=dt; runU=clamp(clock/pressT,0,1);
    if(!acted && clock>=pressT){ resolve('missedrun'); } // frozen at the sign -> lost the chance
    return;
  }
  if(phase==='result'){
    resultT+=dt/1000;
    homeU=Math.min(1,homeU+dt/620); throwU=Math.min(1,throwU+dt/540);
    if(resultT>1.25 && state==='play') newPlay();
    return;
  }
}

// ---------- render ----------
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function drawScene(){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#1f5f2a');g.addColorStop(1,'#123a1b');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#7a5230';ctx.beginPath();ctx.moveTo(HOME.x,HOME.y);ctx.lineTo(FIRST.x+16,FIRST.y);ctx.lineTo(SECOND.x,SECOND.y-16);ctx.lineTo(THIRD.x-16,THIRD.y);ctx.closePath();ctx.fill();
  ctx.fillStyle='#2c7a3b';ctx.beginPath();ctx.moveTo(HOME.x,HOME.y-14);ctx.lineTo(FIRST.x-14,FIRST.y);ctx.lineTo(SECOND.x,SECOND.y+14);ctx.lineTo(THIRD.x+14,THIRD.y);ctx.closePath();ctx.fill();
  ctx.strokeStyle='rgba(240,220,180,0.5)';ctx.lineWidth=4;
  ctx.beginPath();ctx.moveTo(HOME.x,HOME.y);ctx.lineTo(FIRST.x,FIRST.y);ctx.lineTo(SECOND.x,SECOND.y);ctx.lineTo(THIRD.x,THIRD.y);ctx.closePath();ctx.stroke();
  for(const bb of [[HOME,'本'],[FIRST,'一'],[SECOND,'二'],[THIRD,'三']]){ const b=bb[0];
    ctx.save();ctx.translate(b.x,b.y);ctx.rotate(Math.PI/4);ctx.fillStyle='#f2f4f6';ctx.fillRect(-9,-9,18,18);ctx.restore(); }
}
function drawFig(x,y,col,s){ s=s||1; ctx.fillStyle='rgba(0,0,0,0.22)';ctx.beginPath();ctx.ellipse(x,y+12*s,10*s,3.5*s,0,0,6.28);ctx.fill();
  ctx.fillStyle=col;rr(x-7*s,y-9*s,14*s,22*s,6);ctx.fill();
  ctx.fillStyle='#f2c9a0';ctx.beginPath();ctx.arc(x,y-13*s,5.5*s,0,6.28);ctx.fill(); }

function render(){
  ctx.save();
  if(shake>0)ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
  drawScene();

  if(state==='play'){
    const committed = clock>=coverT || phase==='result';
    // runner: 2nd -> 3rd during read; on SEND, continues 3rd -> home
    let rp;
    if(phase==='read') rp=clamp(clock/pressT,0,1)*0.85;
    else rp=0.85;
    let rx=lerp(SECOND.x,THIRD.x,easeOut(clamp(rp/0.85,0,1))), ry=lerp(SECOND.y,THIRD.y,easeOut(clamp(rp/0.85,0,1)));
    if(phase==='result'&&(result==='score'||result==='thrownout')){ rx=lerp(THIRD.x,HOME.x,easeOut(homeU)); ry=lerp(THIRD.y,HOME.y,easeOut(homeU)); }
    else if(phase==='result'&&(result==='held'||result==='missedrun')){ rx=THIRD.x; ry=THIRD.y; }
    drawFig(rx,ry,'#e23c3c',1.05);

    // outfielder with the tell (clean vs bobble)
    ctx.save();ctx.translate(OF.x,OF.y);
    drawFig(0,0,'#2b6cff',1.05);
    if(committed){
      if(tell==='clean'){
        // ball secured, arm cocked (throw line to home appears)
        ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(10,-10,6,0,6.28);ctx.fill();
        ctx.strokeStyle='rgba(150,240,170,0.5)';ctx.lineWidth=2;ctx.setLineDash([5,5]);
        ctx.beginPath();ctx.moveTo(6,-8);ctx.lineTo(HOME.x-OF.x,HOME.y-OF.y);ctx.stroke();ctx.setLineDash([]);
      } else {
        // bobble: ball loose, wobbling
        const wob=Math.sin(clock*0.03)*8;
        ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(14+wob,6,6,0,6.28);ctx.fill();
      }
    } else {
      ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(6,-2,6,0,6.28);ctx.fill();
    }
    ctx.restore();
    if(committed){ ctx.fillStyle= tell==='clean'?'rgba(150,240,170,0.9)':'rgba(255,180,120,0.95)';ctx.font='bold 14px sans-serif';ctx.textAlign='center';
      ctx.fillText(tell==='clean'?'好捕→強い返球！':'もたついた！ 返球遅れる！',OF.x,OF.y-30); }

    // throw home on SEND (or on thrownout show throw beating him)
    if(phase==='result'&&(result==='score'||result==='thrownout')){
      const tu=throwU; const bx=lerp(OF.x,HOME.x,easeOut(tu)), by=lerp(OF.y,HOME.y,easeOut(tu));
      ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(bx,by,6,0,6.28);ctx.fill();
    }

    // coach at third
    drawFig(THIRD.x-40, THIRD.y-6, '#e2b23c',1.0);
    // sign arrows
    if(phase==='read'){
      ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='bold 13px sans-serif';ctx.textAlign='center';
      ctx.fillText('← ストップ',280,H-70); ctx.fillText('ゴー →',620,H-70);
    }

    // pressure timer
    const bw=200; ctx.fillStyle='rgba(0,0,0,0.3)';rr(W/2-bw/2-3,H-44,bw+6,12,6);ctx.fill();
    ctx.fillStyle= runU>0.7?'#ff6b6b':'#ffd24d';rr(W/2-bw/2,H-42,bw*(1-clamp(clock/pressT,0,1)),8,4);ctx.fill();
    ctx.fillStyle='rgba(255,255,255,0.6)';ctx.font='11px sans-serif';ctx.textAlign='center';ctx.fillText('判断の猶予',W/2,H-50);
  }

  for(const p of parts){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,3.2,0,6.28);ctx.fill();}
  ctx.globalAlpha=1;
  for(const p of pops){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.font='bold 22px sans-serif';ctx.textAlign='center';ctx.fillText(p.txt,p.x,p.y);}
  ctx.globalAlpha=1;

  // HUD
  ctx.textAlign='left';ctx.fillStyle='#fff';ctx.font='bold 26px sans-serif';ctx.fillText('SCORE '+score,20,36);
  ctx.textAlign='right';ctx.fillStyle='rgba(255,255,255,0.9)';ctx.font='14px sans-serif';ctx.fillText('好判断 '+outs+'  Lv'+lvl,W-20,24);
  ctx.fillText('失敗',W-92,46);
  for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(W-60+i*20,41,7,0,6.28);ctx.fillStyle=i<fails?'#ff5b5b':'rgba(255,255,255,0.25)';ctx.fill();}
  if(combo>=2){ctx.textAlign='center';ctx.fillStyle='#ffd24d';ctx.font='bold 18px sans-serif';ctx.fillText('コンボ x'+combo,W/2,250);}

  if(state==='play'&&phase==='read'){ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,0.9)';ctx.font='bold 15px sans-serif';
    ctx.fillText('三塁コーチャー！ 外野手の捕球を見て、ゴー（→/右）かストップ（←/左）を出せ',W/2,44);}
  if(state==='play'&&phase==='result'&&msg){ctx.textAlign='center';ctx.fillStyle=(result==='score'||result==='held')?'#9ff0b8':'#ff9a9a';ctx.font='bold 20px sans-serif';ctx.fillText(msg,W/2,44);}

  if(state==='title'){
    ctx.fillStyle='rgba(5,10,6,0.8)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='bold 42px sans-serif';ctx.fillText('三塁コーチャー',W/2,104);
    ctx.fillStyle='#ffd23e';ctx.font='bold 22px sans-serif';ctx.fillText('Send Him!',W/2,140);
    ctx.fillStyle='rgba(255,255,255,0.92)';ctx.font='16px sans-serif';
    ctx.fillText('三塁ベースコーチとして、走者を本塁へ“回す”か“止める”かを一瞬で判断せよ',W/2,190);
    ctx.fillStyle='rgba(255,255,255,0.66)';ctx.font='14px sans-serif';
    ctx.fillText('外野へのヒットで走者が三塁を回る。カギは外野手（青）の捕球',W/2,230);
    ctx.fillText('好捕して強い返球の構え → 止めろ（ストップ／←・左）＝本塁アウトを回避',W/2,252);
    ctx.fillText('捕球でもたついた（ボールがこぼれる） → 回せ（ゴー／→・右）＝走者が生還',W/2,274);
    ctx.fillText('好返球にゴーは本塁タッチアウト、もたつきに止めると得点機を逃す＝失敗',W/2,296);
    ctx.fillText('回して生還は高得点、正しく止めるのも好判断。上級ほど見極めが遅い。3失敗で交代',W/2,318);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で開始',W/2,384);
    ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='14px sans-serif';ctx.fillText('BEST '+best+'　　ストップ←／ゴー→',W/2,416);
  }
  if(state==='over'){
    ctx.fillStyle='rgba(5,10,6,0.84)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#ff6b6b';ctx.font='bold 46px sans-serif';ctx.fillText('3失敗…交代',W/2,222);
    ctx.fillStyle='#fff';ctx.font='bold 40px sans-serif';ctx.fillText('SCORE '+score,W/2,290);
    ctx.fillStyle='rgba(255,255,255,0.85)';ctx.font='19px sans-serif';ctx.fillText('好判断 '+outs+'   BEST '+best,W/2,330);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で もう一度',W/2,402);
  }

  if(flash>0.02){ctx.globalAlpha=flash*0.5;ctx.fillStyle=flashCol;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}
  ctx.restore();

  ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,0.4)';ctx.font='12px sans-serif';
  ctx.fillText('外野手の捕球を読み、好捕→ストップ（←）、もたつき→ゴー（→）。誤り/遅れは失敗。3失敗で交代',W/2,H-8);
}

function frame(ts){let dt=ts-last;last=ts;if(dt>60)dt=60;if(dt<0)dt=0;update(dt);render();requestAnimationFrame(frame);}
requestAnimationFrame(frame);

// ---------- test hook ----------
window.__sh={
  start, call:(d)=>call(d),
  get state(){return state;},
  get score(){return score;},
  get outs(){return outs;},
  get fails(){return fails;},
  get info(){return {state,phase,tell,correct,clock,coverT,pressT,committed:(clock>=coverT),
    canCall:(phase==='read'&&!acted),acted,choice,result,outs,fails,lvl};}
};
})();
</script>
</body>
</html>
