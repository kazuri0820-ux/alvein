<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>クイックモーション (Quick Pitch)</title>
<style>
  html,body{margin:0;height:100%;background:#0a0d06;overflow:hidden;
    font-family:-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  #stage{position:relative;width:100vw;height:100vh;max-width:calc(100vh*1.5);max-height:calc(100vw/1.5);aspect-ratio:900/600;}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;border-radius:6px;}
</style>
</head>
<body>
<div id="wrap"><div id="stage"><canvas id="cv"></canvas></div></div>
<script>
(function(){
const W=900,H=600,cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let DPR=1;
function fit(){DPR=Math.min(2,window.devicePixelRatio||1);cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
fit();addEventListener('resize',fit);

// ---------- audio ----------
let AC=null;function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function tone(f,d,type,v,sweep){const a=ac();if(!a)return;const t=a.currentTime,o=a.createOscillator(),g=a.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(sweep)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+sweep),t+d);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v||0.2,t+0.008);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+0.02);}
function noise(d,v,hp){const a=ac();if(!a)return;const t=a.currentTime,n=Math.floor(a.sampleRate*d),buf=a.createBuffer(1,n,a.sampleRate),ch=buf.getChannelData(0);
  for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource();s.buffer=buf;
  const f=a.createBiquadFilter();f.type='highpass';f.frequency.value=hp||600;const g=a.createGain();g.gain.value=v||0.2;
  s.connect(f);f.connect(g);g.connect(a.destination);s.start(t);s.stop(t+d+0.02);}
const S={
  go:()=>{tone(900,0.05,'square',0.12);noise(0.05,0.08,900);},
  fire:()=>{noise(0.05,0.14,900);tone(520,0.07,'triangle',0.12,220);},
  out:()=>{noise(0.05,0.16,1400);[660,940,1220].forEach((f,i)=>setTimeout(()=>tone(f,0.1,'triangle',0.16),i*55));},
  safe:()=>{noise(0.16,0.2,300);tone(160,0.2,'sawtooth',0.12,-45);},
  balk:()=>{tone(300,0.16,'sawtooth',0.14,-90);tone(220,0.2,'sine',0.1,-40);},
  streak:()=>{[700,930,1170,1400].forEach((f,i)=>setTimeout(()=>tone(f,0.1,'triangle',0.16),i*60));},
  over:()=>{[440,330,247,175].forEach((f,i)=>setTimeout(()=>tone(f,0.3,'triangle',0.2),i*160));}
};

// ---------- geometry ----------
const MOUND={x:450,y:340}, B1={x:700,y:420}, B2={x:300,y:180}, CAT={x:450,y:520};

// ---------- state ----------
let state='title', phase='set', plays=0;
let score=0, combo=0, best=+(localStorage.getItem('quick_best')||0);
let outs=0, fails=0, lvl=1;   // outs = caught stealing
let clock=0, goT=1000, broke=false, breakClock=0, maxReact=500, reactShown=0;
let decided=false, result=null, resultT=0, msg='', anim=0, fast=false;
let shake=0, flash=0, flashCol='#fff', last=performance.now();
let parts=[], pops=[];
let seedT=12345;

function rnd(a,b){return a+Math.random()*(b-a);}
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function lerp(a,b,u){return a+(b-a)*u;}
function easeOut(u){return 1-Math.pow(1-u,2);}

function reset(){state='title';score=0;combo=0;outs=0;fails=0;lvl=1;plays=0;result=null;parts=[];pops=[];}
function newPlay(){
  plays++; lvl=Math.min(7,1+Math.floor(outs/4));
  maxReact=clamp(520-lvl*28,340,520);
  goT=rnd(480,1950);
  phase='set'; clock=0; broke=false; breakClock=0; reactShown=0; decided=false; result=null; resultT=0; msg=''; anim=0; fast=false;
}
function start(){ if(!ac())ac(); if(AC&&AC.state==='suspended')AC.resume(); reset(); state='play'; newPlay(); }

function deliver(){
  if(state==='title'){start();return;}
  if(state==='over'){ if(resultT>0.4){reset();start();} return; }
  if(state!=='play'||phase!=='set'||decided) return;
  decided=true;
  if(!broke){ reactShown=0; resolve('balk'); return; }
  reactShown=Math.round(breakClock);
  fast=breakClock<=maxReact*0.45;
  resolve('out');
}

function resolve(k){
  phase='result'; result=k; resultT=0; anim=0;
  if(k==='out'){
    outs++; combo++;
    let add=Math.round((fast?240:150)*(1+Math.min(9,combo-1)*0.14)); score+=add;
    S.fire(); setTimeout(S.out,120); flash=1;flashCol='#8affa0';shake=6; burst(B2.x,B2.y,'#8affa0',20,7);
    pop(B2.x,B2.y-30,fast?'電光石火のクイック！ 楽々アウト！ +'+add:'クイックで刺した！ 盗塁失敗！ +'+add,'#d6ffe0');
    if(combo>=2&&!fast)pop(W/2,150,'コンボ x'+combo,'#ffd24d');
    if(combo>0&&combo%5===0)S.streak();
    msg=(fast?'一瞬の反応でクイックモーション、二塁で余裕のタッチアウト！':'素早いクイックで送球、際どいタイミングで刺した！')+'（反応 '+reactShown+'ms）';
  } else {
    fails++; combo=0; flash=1;flashCol='#ff5b5b';shake=8;
    if(k==='balk'){ S.balk(); msg='走る前に始動…フライング（ボーク）で走者を進めてしまった'; pop(MOUND.x,MOUND.y-30,'ボーク…','#ffb0b0'); }
    else { S.safe(); msg='始動が遅い…クイックが間に合わず盗塁を許した'; pop(B2.x,B2.y-30,'盗塁成功…','#ffb0b0'); }
  }
  if(fails>=3){ state='over'; resultT=0; S.over(); if(score>best){best=score;localStorage.setItem('quick_best',best);} }
}

// ---------- input ----------
cv.addEventListener('pointerdown',e=>{e.preventDefault();deliver();});
addEventListener('keydown',e=>{ if(e.repeat)return; if(e.code==='Space'||e.code==='Enter'||e.code==='ArrowUp'||e.code==='KeyZ'){e.preventDefault();deliver();} });

// ---------- particles ----------
function burst(x,y,c,n,sp){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=rnd(sp*0.3,sp);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:1,c});}}
function pop(x,y,txt,c){pops.push({x,y,txt,c,life:1});}

// ---------- update ----------
function update(dt){
  shake*=Math.pow(0.86,dt/16.7); if(shake<0.3)shake=0;
  flash*=Math.pow(0.9,dt/16.7);
  for(const p of parts){p.vx*=0.96;p.vy=p.vy*0.96+0.28;p.x+=p.vx*dt/16.7;p.y+=p.vy*dt/16.7;p.life-=dt/16.7*0.026;}
  parts=parts.filter(p=>p.life>0);
  for(const p of pops){p.y-=dt/16.7*0.5;p.life-=dt/16.7*0.02;}
  pops=pops.filter(p=>p.life>0);

  if(state!=='play'){ if(state==='over')resultT+=dt/1000; return; }
  if(phase==='set'){
    clock+=dt;
    if(!broke && clock>=goT){ broke=true; breakClock=0; flash=0.5; flashCol='#ffe14d'; S.go(); }
    if(broke){ breakClock+=dt; if(!decided && breakClock>maxReact){ decided=true; reactShown=Math.round(breakClock); resolve('stolen'); } }
    return;
  }
  if(phase==='result'){ resultT+=dt/1000; anim=Math.min(1,anim+dt/560); if(resultT>1.2) newPlay(); return; }
}

// ---------- render ----------
function figure(x,y,col,sc,lean){ sc=sc||1;lean=lean||0;
  ctx.fillStyle='rgba(0,0,0,0.24)';ctx.beginPath();ctx.ellipse(x,y+13*sc,12*sc,4*sc,0,0,6.28);ctx.fill();
  ctx.save();ctx.translate(x,y);ctx.rotate(lean);
  ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(-7*sc,-22*sc);ctx.lineTo(7*sc,-22*sc);ctx.lineTo(6*sc,12*sc);ctx.lineTo(-6*sc,12*sc);ctx.closePath();ctx.fill();
  ctx.fillStyle='#f2c9a0';ctx.beginPath();ctx.arc(0,-28*sc,6*sc,0,6.28);ctx.fill();
  ctx.restore();
}
function base(b,lit){ ctx.save();ctx.translate(b.x,b.y);ctx.rotate(Math.PI/4);ctx.fillStyle=lit?'#ffe98a':'#eef3f0';ctx.fillRect(-11,-11,22,22);ctx.restore(); }
function drawScene(){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#2f6a2c');g.addColorStop(0.55,'#357a34');g.addColorStop(1,'#2b5f29');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  // infield dirt
  ctx.fillStyle='#9a6b3f';ctx.beginPath();ctx.moveTo(CAT.x,CAT.y+30);ctx.lineTo(B1.x+40,B1.y);ctx.lineTo(MOUND.x,MOUND.y-120);ctx.lineTo(B2.x-40,B2.y);ctx.closePath();ctx.fill();
  ctx.fillStyle='#a97b4f';ctx.beginPath();ctx.arc(MOUND.x,MOUND.y,44,0,6.28);ctx.fill();
  // basepath 1st->2nd
  ctx.strokeStyle='rgba(255,255,255,0.4)';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(B1.x,B1.y);ctx.lineTo(B2.x,B2.y);ctx.stroke();
}

function render(){
  ctx.save();
  if(shake>0)ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
  drawScene();

  if(state==='play'||state==='over'){
    // runner progress from 1st toward 2nd once broke
    let ru=0;
    if(broke){ ru=clamp(breakClock/(maxReact*1.15),0,1); }
    if(phase==='result'){ if(result==='stolen') ru=1; else if(result==='out') ru=clamp(breakClock/(maxReact*1.15),0,0.82); }
    const rx=lerp(B1.x,B2.x,ru), ry=lerp(B1.y,B2.y,ru);

    base(B2, phase==='result'&&result==='out'); base(B1,false);

    // ball: pitcher -> catcher (deliver) -> 2nd (throw) on out
    if(phase==='result'&&(result==='out')){
      const u=easeOut(anim);
      let bx,by;
      if(u<0.5){ const uu=u/0.5; bx=lerp(MOUND.x,CAT.x,uu); by=lerp(MOUND.y,CAT.y,uu); }
      else { const uu=(u-0.5)/0.5; bx=lerp(CAT.x,B2.x,uu); by=lerp(CAT.y,B2.y,uu); }
      ctx.strokeStyle='rgba(255,255,255,0.25)';ctx.lineWidth=2;
      ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(bx,by,6,0,6.28);ctx.fill();
    }

    figure(CAT.x,CAT.y,'#c9a24b',1.0);                                  // catcher
    figure(MOUND.x,MOUND.y,'#3aa0ff',1.0, phase==='result'&&result==='out'?0.3:0);  // pitcher
    figure(rx,ry,'#d24b4b',1.0, broke?0.2:0);                          // runner
    // fielder at 2nd on out
    if(phase==='result'&&result==='out') figure(B2.x+18,B2.y,'#3aa0ff',1.0,0);

    // cue
    ctx.textAlign='center';
    if(state==='play'&&phase==='set'){
      if(!broke){ ctx.fillStyle='rgba(255,255,255,0.9)';ctx.font='bold 20px sans-serif';ctx.fillText('セットで静止——走者の“スタート”を待て（早撃ち＝ボーク）',W/2,52);
        ctx.fillStyle='rgba(255,255,255,0.6)';ctx.font='13px sans-serif';ctx.fillText('走った瞬間にクイックで即送球（クリック/タップ/SPACE）',W/2,74); }
      else { ctx.fillStyle='#ffe14d';ctx.font='bold 30px sans-serif';ctx.fillText('走った！ 今すぐクイック！',W/2,58);
        const p=clamp(breakClock/maxReact,0,1),bw=280,x=W/2-bw/2,y=74;
        ctx.fillStyle='rgba(255,255,255,0.18)';ctx.fillRect(x,y,bw,8);
        ctx.fillStyle=p<0.6?'#8affa0':(p<1?'#ffd24d':'#ff5b5b');ctx.fillRect(x,y,bw*p,8); }
    }
  }

  for(const p of parts){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,3.2,0,6.28);ctx.fill();}
  ctx.globalAlpha=1;
  for(const p of pops){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.font='bold 20px sans-serif';ctx.textAlign='center';ctx.fillText(p.txt,p.x,p.y);}
  ctx.globalAlpha=1;

  // HUD
  ctx.textAlign='left';ctx.fillStyle='#fff';ctx.font='bold 26px sans-serif';ctx.fillText('SCORE '+score,20,36);
  ctx.textAlign='right';ctx.fillStyle='rgba(255,255,255,0.9)';ctx.font='14px sans-serif';ctx.fillText('刺殺 '+outs+'  Lv'+lvl,W-20,24);
  ctx.fillText('失策',W-92,46);
  for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(W-60+i*20,41,7,0,6.28);ctx.fillStyle=i<fails?'#ff5b5b':'rgba(255,255,255,0.25)';ctx.fill();}
  if(combo>=2){ctx.textAlign='center';ctx.fillStyle='#ffd24d';ctx.font='bold 18px sans-serif';ctx.fillText('コンボ x'+combo,W/2,110);}

  if(state==='play'&&phase==='result'&&msg){ctx.textAlign='center';ctx.fillStyle=result==='out'?'#9ff0b8':'#ff9a9a';ctx.font='bold 18px sans-serif';ctx.fillText(msg,W/2,120);}

  if(state==='title'){
    ctx.fillStyle='rgba(4,8,4,0.80)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='bold 40px sans-serif';ctx.fillText('クイックモーション',W/2,100);
    ctx.fillStyle='#ffd23e';ctx.font='bold 22px sans-serif';ctx.fillText('Quick Pitch',W/2,136);
    ctx.fillStyle='rgba(255,255,255,0.92)';ctx.font='16px sans-serif';
    ctx.fillText('走者を背負う投手。盗塁のスタートに一瞬で反応し、クイックモーションで二塁を刺せ',W/2,188);
    ctx.fillStyle='rgba(255,255,255,0.66)';ctx.font='14px sans-serif';
    ctx.fillText('セットで静止し、走者が“走った瞬間”（黄フラッシュ＋合図）にすかさず即送球（クリック/タップ/SPACE）',W/2,226);
    ctx.fillText('スタートはランダム——合図より先に始動すると“ボーク（フライング）”で失敗',W/2,250);
    ctx.fillText('反応が遅いとクイックが間に合わず盗塁成功。速いほど楽々アウトで高得点（反応時間も表示）',W/2,274);
    ctx.fillText('上級ほど走者が速く、間に合う猶予（反応リミット）が短い。3失敗で交代',W/2,298);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で開始',W/2,364);
    ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='14px sans-serif';ctx.fillText('BEST '+best,W/2,396);
  }
  if(state==='over'){
    ctx.fillStyle='rgba(4,8,4,0.84)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#ff6b6b';ctx.font='bold 46px sans-serif';ctx.fillText('3失敗…交代',W/2,222);
    ctx.fillStyle='#fff';ctx.font='bold 40px sans-serif';ctx.fillText('SCORE '+score,W/2,290);
    ctx.fillStyle='rgba(255,255,255,0.85)';ctx.font='19px sans-serif';ctx.fillText('刺殺 '+outs+'   BEST '+best,W/2,330);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で もう一度',W/2,402);
  }

  if(flash>0.02){ctx.globalAlpha=flash*0.5;ctx.fillStyle=flashCol;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}
  ctx.restore();

  ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,0.4)';ctx.font='12px sans-serif';
  ctx.fillText('クイックモーション：走者のスタート（ランダム）に一瞬で反応して即送球。早撃ち＝ボーク、遅い＝盗塁成功。3失敗で交代',W/2,H-8);
}

function frame(ts){let dt=ts-last;last=ts;if(dt>60)dt=60;if(dt<0)dt=0;update(dt);render();requestAnimationFrame(frame);}
requestAnimationFrame(frame);

// ---------- test hook ----------
window.__qp={
  start, deliver:()=>deliver(),
  get state(){return state;},
  get score(){return score;},
  get outs(){return outs;},
  get fails(){return fails;},
  get info(){return {state,phase,clock,goT,broke,breakClock,maxReact,decided,result,outs,fails,lvl,
    cued:broke, canAct:(phase==='set'&&!decided)};}
};
})();
</script>
</body>
</html>
