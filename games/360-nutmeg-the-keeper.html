<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>股を抜け (Nutmeg the Keeper)</title>
<style>
  html,body{margin:0;height:100%;background:#07120b;overflow:hidden;
    font-family:-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  #stage{position:relative;width:100vw;height:100vh;max-width:calc(100vh*1.5);max-height:calc(100vw/1.5);aspect-ratio:900/600;}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;border-radius:6px;}
</style>
</head>
<body>
<div id="wrap"><div id="stage"><canvas id="cv"></canvas></div></div>
<script>
(function(){
const W=900,H=600,cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let DPR=1;
function fit(){DPR=Math.min(2,window.devicePixelRatio||1);cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
fit();addEventListener('resize',fit);

// ---------- audio ----------
let AC=null;function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function tone(f,d,type,v,sweep){const a=ac();if(!a)return;const t=a.currentTime,o=a.createOscillator(),g=a.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(sweep)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+sweep),t+d);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v||0.2,t+0.008);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+0.02);}
function noise(d,v,hp){const a=ac();if(!a)return;const t=a.currentTime,n=Math.floor(a.sampleRate*d),buf=a.createBuffer(1,n,a.sampleRate),ch=buf.getChannelData(0);
  for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource();s.buffer=buf;
  const f=a.createBiquadFilter();f.type='highpass';f.frequency.value=hp||600;const g=a.createGain();g.gain.value=v||0.2;
  s.connect(f);f.connect(g);g.connect(a.destination);s.start(t);s.stop(t+d+0.02);}
const S={
  set:()=>{tone(300,0.05,'sine',0.04);},
  strike:()=>{noise(0.05,0.16,500);tone(300,0.05,'square',0.09,-40);},
  goal:()=>{[620,880,1150].forEach((f,i)=>setTimeout(()=>tone(f,0.12,'triangle',0.17),i*58));},
  ole:()=>{[600,800,1000,1250].forEach((f,i)=>setTimeout(()=>tone(f,0.12,'triangle',0.17),i*80));},
  block:()=>{noise(0.16,0.18,300);tone(170,0.18,'sawtooth',0.12,-40);},
  streak:()=>{[700,930,1170,1400].forEach((f,i)=>setTimeout(()=>tone(f,0.1,'triangle',0.16),i*60));},
  over:()=>{[440,330,247,175].forEach((f,i)=>setTimeout(()=>tone(f,0.3,'triangle',0.2),i*160));}
};

// ---------- geometry ----------
const GX0=338, GX1=562, GY=150, GTOP=58;   // goal mouth
const GK={x:450, y:250};                    // keeper (spreads / advances)
const SHOOT={x:450, y:486};                 // you (striker) with the ball
const NET={x:450, y:120};

// ---------- state ----------
let state='title', phase='hit', plays=0;
let score=0, combo=0, best=+(localStorage.getItem('nm_best')||0);
let outs=0, fails=0, lvl=1;   // outs = goals (nutmegs)
let clock=0, arriveT=880, w=140, tough=false;
let acted=false, actT=0, result=null, resultT=0, msg='', msgOk=false, quality=0, gone=0;
let shake=0, flash=0, flashCol='#fff', last=performance.now();
let parts=[], pops=[];

function rnd(a,b){return a+Math.random()*(b-a);}
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function lerp(a,b,u){return a+(b-a)*u;}
function easeOut(u){return 1-Math.pow(1-u,2);}

function reset(){state='title';score=0;combo=0;outs=0;fails=0;lvl=1;plays=0;result=null;parts=[];pops=[];}

function newPlay(){
  plays++; lvl=Math.min(7,1+Math.floor(outs/4));
  arriveT=clamp(900-lvl*52,560,900);
  w=clamp(148-lvl*10,86,148);
  tough=Math.random()<clamp(0.2+lvl*0.05,0.2,0.5);
  if(tough)w*=0.8;
  phase='hit'; clock=0; acted=false; actT=0; result=null; resultT=0; msg=''; msgOk=false; quality=0; gone=0;
  S.set();
}
function start(){ if(!ac())ac(); if(AC&&AC.state==='suspended')AC.resume(); reset(); state='play'; newPlay(); }

function strike(){
  if(state==='title'){start();return;}
  if(state==='over'){ if(resultT>0.4){reset();start();} return; }
  if(state!=='play'||phase!=='hit'||acted) return;
  acted=true; actT=clock; S.strike();
  if(clock<arriveT-w){ resolve('early'); }
  else if(clock<=arriveT+w){ quality=1-Math.abs(clock-arriveT)/w; resolve('goal'); }
  else resolve('late');
}

function resolve(k){
  phase='result'; result=k; resultT=0; gone=0;
  if(k==='goal'){
    outs++; combo++;
    const perfect=quality>=0.8;
    let add=Math.round((tough?250:150)*(1+Math.min(9,combo-1)*0.14)); score+=add;
    setTimeout(S.goal,120); if(perfect||tough)setTimeout(S.ole,240);
    msgOk=true; flash=1;flashCol='#8affa0';shake=6; burst(NET.x,NET.y+10,'#8affa0',16,7);
    pop(W/2,320,(perfect?'ど真ん中の完璧な股抜き！オレ！ +':'GKの股下を抜いてゴール！ +')+add,'#d6ffe0');
    if(combo>=2)pop(W/2,286,'コンボ x'+combo,'#ffd24d');
    if(combo>0&&combo%5===0)S.streak();
    msg='開いた股のど真ん中へコロコロと通す——GKの股下を抜く屈辱の一撃！';
  } else {
    fails++; combo=0; msgOk=false; flash=1;shake=8; S.block();
    if(k==='early'){ flashCol='#ff5b5b'; msg='早い…GKがまだ足を閉じていて、正面で足に当てて止められた'; pop(W/2,320,'ブロック…','#ffb0b0'); }
    else if(k==='late'){ flashCol='#ff8b3b'; msg='遅い…GKに足を閉じられ、間合いを詰められてブロックされた'; pop(W/2,320,'詰められた…','#ffcf9a'); }
    else { flashCol='#ff5b5b'; msg='撃てず…GKに間合いを詰められてボールに覆いかぶさられた'; pop(W/2,320,'防がれた…','#ffb0b0'); }
  }
  if(fails>=3){ state='over'; resultT=0; S.over(); if(score>best){best=score;localStorage.setItem('nm_best',best);} }
}

// ---------- input ----------
cv.addEventListener('pointerdown',e=>{e.preventDefault();strike();});
addEventListener('keydown',e=>{ if(e.repeat)return;
  if(e.code==='Space'||e.code==='Enter'||e.code==='ArrowUp'||e.code==='KeyF'||e.code==='KeyJ'){e.preventDefault();strike();} });

// ---------- particles ----------
function burst(x,y,c,n,sp){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=rnd(sp*0.3,sp);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:1,c});}}
function pop(x,y,txt,c){pops.push({x,y,txt,c,life:1});}

// keeper: advances a touch and his stance widens to a peak at arriveT (five-hole opens)
function gkY(){ return GK.y + 44*clamp((acted?actT:clock)/(arriveT+w),0,1); }
function gapHalf(){ const c=(phase==='hit')?clock:actT; const openness=clamp(1-Math.abs(c-arriveT)/(w*1.5),0,1); return 5+openness*26; }

// ---------- update ----------
function update(dt){
  shake*=Math.pow(0.86,dt/16.7); if(shake<0.3)shake=0;
  flash*=Math.pow(0.9,dt/16.7);
  for(const q of parts){q.vx*=0.96;q.vy=q.vy*0.96+0.28;q.x+=q.vx*dt/16.7;q.y+=q.vy*dt/16.7;q.life-=dt/16.7*0.026;}
  parts=parts.filter(q=>q.life>0);
  for(const q of pops){q.y-=dt/16.7*0.5;q.life-=dt/16.7*0.02;}
  pops=pops.filter(q=>q.life>0);

  if(state!=='play'){ if(state==='over')resultT+=dt/1000; return; }
  if(phase==='hit'){ clock+=dt;
    if(!acted && clock>arriveT+w*2){ acted=true; actT=clock; resolve('miss'); }
    return; }
  if(phase==='result'){ resultT+=dt/1000; gone=Math.min(1,gone+dt/460);
    if(resultT>1.5) newPlay(); return; }
}

// ---------- render ----------
function drawField(){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#12703f');g.addColorStop(0.5,'#0f5e34');g.addColorStop(1,'#0c4c2b');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  for(let i=0;i<8;i++){ctx.fillStyle=i%2?'rgba(255,255,255,0.03)':'rgba(0,0,0,0.03)';ctx.fillRect(0,i*80,W,80);}
  ctx.strokeStyle='rgba(255,255,255,0.2)';ctx.lineWidth=2;ctx.strokeRect(250,GY,400,150);ctx.strokeRect(360,GY,180,66);
  // goal net + frame
  ctx.fillStyle='rgba(255,255,255,0.08)';ctx.fillRect(GX0,GTOP,GX1-GX0,GY-GTOP);
  ctx.strokeStyle='rgba(255,255,255,0.3)';ctx.lineWidth=1;
  for(let x=GX0;x<=GX1;x+=13){ctx.beginPath();ctx.moveTo(x,GTOP);ctx.lineTo(x,GY);ctx.stroke();}
  for(let y=GTOP;y<=GY;y+=11){ctx.beginPath();ctx.moveTo(GX0,y);ctx.lineTo(GX1,y);ctx.stroke();}
  ctx.strokeStyle='#f4f4f4';ctx.lineWidth=5;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(GX0,GY);ctx.lineTo(GX0,GTOP);ctx.lineTo(GX1,GTOP);ctx.lineTo(GX1,GY);ctx.stroke();ctx.lineCap='butt';
}
function drawKeeper(gx,gy,gh,openWin){
  // shadow
  ctx.fillStyle='rgba(0,0,0,0.22)';ctx.beginPath();ctx.ellipse(gx,gy+26,20,6,0,0,6.28);ctx.fill();
  // five-hole highlight between the legs
  if(gh>10){ ctx.fillStyle=openWin?'rgba(140,255,160,0.34)':'rgba(255,255,255,0.10)';
    ctx.beginPath();ctx.moveTo(gx-gh,gy+26);ctx.lineTo(gx+gh,gy+26);ctx.lineTo(gx+gh*0.4,gy-4);ctx.lineTo(gx-gh*0.4,gy-4);ctx.closePath();ctx.fill();
    if(openWin){ctx.strokeStyle='rgba(140,255,160,0.8)';ctx.lineWidth=2;ctx.stroke();} }
  // legs
  ctx.strokeStyle='#ffd23e';ctx.lineWidth=7;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(gx-4,gy-6);ctx.lineTo(gx-gh,gy+26);ctx.moveTo(gx+4,gy-6);ctx.lineTo(gx+gh,gy+26);ctx.stroke();
  // arms out (looks big)
  ctx.beginPath();ctx.moveTo(gx-24,gy-30);ctx.lineTo(gx+24,gy-30);ctx.stroke();
  // body + head
  ctx.fillStyle='#ffd23e';ctx.beginPath();ctx.ellipse(gx,gy-18,11,17,0,0,6.28);ctx.fill();
  ctx.fillStyle='#f0c9a0';ctx.beginPath();ctx.arc(gx,gy-40,8,0,6.28);ctx.fill();
  ctx.lineCap='butt';
}
function person(x,y,col,s,lean){s=s||1;lean=lean||0;
  ctx.save();ctx.translate(x,y);ctx.rotate(lean);
  ctx.fillStyle=col;ctx.beginPath();ctx.ellipse(0,-15*s,10*s,15*s,0,0,6.28);ctx.fill();
  ctx.fillStyle='#f0c9a0';ctx.beginPath();ctx.arc(0,-34*s,7.5*s,0,6.28);ctx.fill();
  ctx.restore();
}

function render(){
  ctx.save();
  if(shake>0)ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
  drawField();

  if(state==='play'||state==='over'){
    const gy=gkY(), gh=gapHalf();
    const openWin=(phase==='hit'&&Math.abs(clock-arriveT)<=w);
    // keeper (closes his legs on a block; frozen open on a goal)
    let drawGh=gh;
    if(phase==='result'&&(result==='early'||result==='late'||result==='miss')) drawGh=lerp(gh,4,easeOut(gone));  // snaps legs shut
    drawKeeper(GK.x,gy,drawGh,openWin);

    // striker
    const striking=(phase==='result');
    person(SHOOT.x-2, SHOOT.y+6, '#2b6fd6', 0.98, striking?-0.35:0);

    // the ball
    let bx=SHOOT.x-2, by=SHOOT.y-14;
    if(phase==='result'){
      const u=easeOut(gone);
      if(result==='goal'){ bx=lerp(SHOOT.x,NET.x,u); by=lerp(SHOOT.y-14,NET.y,u); }
      else { // blocked at the keeper's legs, rebounds
        const uu=Math.min(1,gone*1.6); bx=lerp(SHOOT.x-2, GK.x+(actT<arriveT?-14:14), uu);
        by=lerp(SHOOT.y-14, gy+18, uu) + (gone>0.62?(gone-0.62)*60:0); }
    }
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(bx,by,7.5,0,6.28);ctx.fill();
    ctx.strokeStyle='#222';ctx.lineWidth=1.1;ctx.beginPath();ctx.arc(bx,by,7.5,0.4,2.2);ctx.stroke();

    // cue + timing bar
    ctx.textAlign='center';
    if(state==='play'&&phase==='hit'){
      ctx.fillStyle='rgba(255,220,90,0.96)';ctx.font='bold 20px sans-serif';ctx.fillText('GKと1対1！ 足が開いた“股下”を抜け',W/2,42);
      const bw=280,x=W/2-bw/2,y=56, span=arriveT+w*2.2;
      ctx.fillStyle='rgba(255,255,255,0.16)';ctx.fillRect(x,y,bw,9);
      const gx0=x+bw*clamp((arriveT-w)/span,0,1), gx1=x+bw*clamp((arriveT+w)/span,0,1);
      ctx.fillStyle='rgba(90,240,130,0.5)';ctx.fillRect(gx0,y,gx1-gx0,9);
      const px=x+bw*clamp(clock/span,0,1);
      ctx.fillStyle='#ffe14d';ctx.fillRect(px-2,y-3,4,15);
      ctx.fillStyle='rgba(255,255,255,0.55)';ctx.font='12px sans-serif';ctx.fillText('タップ / SPACE ＝ 股下へ流し込む（早いと足に当て・遅いと詰められる）',W/2,H-28);
    }
  }

  for(const q of parts){ctx.globalAlpha=Math.max(0,q.life);ctx.fillStyle=q.c;ctx.beginPath();ctx.arc(q.x,q.y,3.2,0,6.28);ctx.fill();}
  ctx.globalAlpha=1;
  for(const q of pops){ctx.globalAlpha=Math.max(0,q.life);ctx.fillStyle=q.c;ctx.font='bold 21px sans-serif';ctx.textAlign='center';ctx.fillText(q.txt,q.x,q.y);}
  ctx.globalAlpha=1;

  // HUD
  ctx.textAlign='left';ctx.fillStyle='#fff';ctx.font='bold 26px sans-serif';ctx.fillText('SCORE '+score,20,36);
  ctx.textAlign='right';ctx.fillStyle='rgba(255,255,255,0.9)';ctx.font='14px sans-serif';ctx.fillText('股抜き '+outs+'  Lv'+lvl,W-20,24);
  ctx.fillText('失敗',W-92,46);
  for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(W-60+i*20,41,7,0,6.28);ctx.fillStyle=i<fails?'#ff5b5b':'rgba(255,255,255,0.25)';ctx.fill();}
  if(combo>=2){ctx.textAlign='center';ctx.fillStyle='#ffd24d';ctx.font='bold 18px sans-serif';ctx.fillText('コンボ x'+combo,W/2,H-52);}

  if(state==='play'&&phase==='result'&&msg){ctx.textAlign='center';ctx.fillStyle=msgOk?'#9ff0b8':'#ffb38a';ctx.font='bold 15px sans-serif';ctx.fillText(msg,W/2,430);}

  if(state==='title'){
    ctx.fillStyle='rgba(4,8,4,0.83)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='bold 42px sans-serif';ctx.fillText('股を抜け',W/2,84);
    ctx.fillStyle='#ffd23e';ctx.font='bold 22px sans-serif';ctx.fillText('Nutmeg the Keeper',W/2,120);
    ctx.fillStyle='rgba(255,255,255,0.92)';ctx.font='16px sans-serif';
    ctx.fillText('GKと1対1——飛び出すGKが足を広げて“股下（ファイブホール）”が開いた一瞬に、コロコロと通して抜け',W/2,178);
    ctx.fillStyle='rgba(255,255,255,0.66)';ctx.font='14px sans-serif';
    ctx.fillText('GKの足が最も開く“ちょうど”の緑窓でタップ/SPACE＝股下を抜くシュート',W/2,216);
    ctx.fillText('早い＝まだ足が閉じていて正面で止められる／遅い＝足を閉じられ詰められてブロック',W/2,240);
    ctx.fillText('開いた股のど真ん中を抜けば屈辱の股抜きゴール＝大量加点。上級ほど窓が短い',W/2,264);
    ctx.fillText('3失敗で交代',W/2,288);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で開始',W/2,356);
    ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='14px sans-serif';ctx.fillText('BEST '+best,W/2,388);
  }
  if(state==='over'){
    ctx.fillStyle='rgba(4,8,4,0.85)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#ff6b6b';ctx.font='bold 46px sans-serif';ctx.fillText('3失敗…交代',W/2,222);
    ctx.fillStyle='#fff';ctx.font='bold 40px sans-serif';ctx.fillText('SCORE '+score,W/2,290);
    ctx.fillStyle='rgba(255,255,255,0.85)';ctx.font='19px sans-serif';ctx.fillText('股抜き '+outs+'   BEST '+best,W/2,330);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で もう一度',W/2,402);
  }

  if(flash>0.02){ctx.globalAlpha=flash*0.5;ctx.fillStyle=flashCol;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}
  ctx.restore();

  ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,0.4)';ctx.font='12px sans-serif';
  ctx.fillText('股を抜け：GKの足が開いた緑窓ジャストで股下を抜いてゴール。早い＝足に当て/遅い＝詰められる、3失敗で交代',W/2,H-8);
}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

function frame(ts){let dt=ts-last;last=ts;if(dt>60)dt=60;if(dt<0)dt=0;update(dt);render();requestAnimationFrame(frame);}
requestAnimationFrame(frame);

// ---------- test hook ----------
window.__nm={
  start, strike,
  get state(){return state;},
  get score(){return score;},
  get outs(){return outs;},
  get fails(){return fails;},
  get info(){return {state,phase,clock,arriveT,w,tough,acted,actT,result,outs,fails,lvl,
    inWin:(phase==='hit'&&Math.abs(clock-arriveT)<=w)};}
};
})();
</script>
</body>
</html>
