<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>イエローかレッドか (Yellow or Red?)</title>
<style>
  html,body{margin:0;padding:0;background:#07130c;overflow:hidden;font-family:'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif;-webkit-user-select:none;user-select:none;touch-action:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 26%,#123a20,#050d07 72%);}
  #stage{position:relative;width:min(100vw,calc(100vh*1.5));aspect-ratio:900/600;max-width:900px;box-shadow:0 10px 60px rgba(0,0,0,.6);border-radius:8px;overflow:hidden;}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;}
</style>
</head>
<body>
<div id="wrap"><div id="stage"><canvas id="cv"></canvas></div></div>
<script>
(function(){
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const W=900,H=600;let DPR=Math.min(2,window.devicePixelRatio||1);
function fit(){const r=cv.getBoundingClientRect();DPR=Math.min(2,window.devicePixelRatio||1);cv.width=Math.round(r.width*DPR);cv.height=Math.round(r.height*DPR);ctx.setTransform(cv.width/W,0,0,cv.height/H,0,0);}
new ResizeObserver(fit).observe(cv);fit();

// ---------- audio ----------
let AC=null;function actx(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function tone(f,d,type,v,sweep){const a=actx();if(!a)return;const o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.value=f;if(sweep)o.frequency.linearRampToValueAtTime(sweep,a.currentTime+d);g.gain.value=0.0001;g.gain.exponentialRampToValueAtTime(v||0.2,a.currentTime+0.008);g.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+d);o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+d+0.02);}
function noise(d,v,hp){const a=actx();if(!a)return;const n=a.createBufferSource(),b=a.createBuffer(1,a.sampleRate*d,a.sampleRate),dt=b.getChannelData(0);for(let i=0;i<dt.length;i++)dt[i]=Math.random()*2-1;n.buffer=b;const f=a.createBiquadFilter();f.type='highpass';f.frequency.value=hp||800;const g=a.createGain();g.gain.value=0.0001;g.gain.exponentialRampToValueAtTime(v||0.2,a.currentTime+0.01);g.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+d);n.connect(f);f.connect(g);g.connect(a.destination);n.start();n.stop(a.currentTime+d+0.02);}
const S={
  challenge(){noise(0.08,0.2,500);tone(200,0.1,'square',0.14,90);},
  whistle(){tone(1500,0.12,'square',0.13);setTimeout(function(){tone(1700,0.14,'square',0.12);},130);},
  right(){tone(560,0.1,'triangle',0.2);setTimeout(function(){tone(760,0.14,'triangle',0.22);},110);},
  wrong(){tone(280,0.32,'sawtooth',0.18,150);setTimeout(function(){tone(180,0.4,'sawtooth',0.16,110);},150);},
  combo(n){tone(600+Math.min(n,8)*70,0.12,'triangle',0.16);},
  over(){tone(330,0.3,'sine',0.2,160);setTimeout(function(){tone(220,0.5,'sine',0.2,110);},180);},
  start(){tone(440,0.1,'triangle',0.18);setTimeout(function(){tone(660,0.16,'triangle',0.2);},110);},
};

function clamp(v,a,b){return v<a?a:v>b?b:v;}
function rnd(a,b){return a+Math.random()*(b-a);}

// ---------- state ----------
let state='title';
let outs=0,fails=0,score=0,combo=0,lvl=1;   // outs = correct calls
let best=0;try{best=parseInt(localStorage.getItem('yr_best')||'0')||0;}catch(e){}
const TARGET=26;

let phase='wind';  // wind | watch | result
let pt=0, clock=0;
let revealT=500, callWin=1000, tough=false, truth='yellow'; // red = studs up (over the ball) ; yellow = at/below the ball
let decided=false, result='', called='';
const CONTACT=[452,352], SHINY=336;   // contact point + reference shin/ball height
let bootY=336, margin=20, slideU=0;
let parts=[];
let shakeT=0,flash=0;
let msg='',msgCol='#fff',msgT=0;
let lastAdd=0;

function reset(){outs=0;fails=0;score=0;combo=0;lvl=1;parts=[];}
function newPlay(){
  lvl=Math.min(7,1+Math.floor(outs/4));
  revealT=clamp(560-lvl*24,360,560);
  callWin=clamp(1020-lvl*70,560,1020);
  tough=Math.random()<clamp(0.2+lvl*0.05,0.2,0.5);
  truth=Math.random()<0.5?'yellow':'red';
  margin=tough?rnd(4,11):rnd(16,32);
  bootY=(truth==='red')?SHINY-margin:SHINY+margin;   // above the shin line = studs up = red
  phase='wind';pt=0;clock=0;decided=false;result='';called='';slideU=0;
}
function startGame(){reset();state='play';newPlay();S.start();}

function burst(x,y,col,n,sp){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=rnd(0.4,1)*(sp||3);parts.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:1,col:col,r:rnd(2,5)});}}

function resolve(kind){
  decided=true;result=kind;
  if(kind==='right'){
    outs++;combo++;
    const cm=1+Math.min(combo-1,6)*0.13;
    const add=Math.round((100+(tough?60:0))*cm)*Math.max(1,lvl);
    score+=add;lastAdd=add;
    S.right();if(combo>1)setTimeout(function(){S.combo(combo);},250);
    flash=0.26;burst(CONTACT[0],CONTACT[1],truth==='red'?'#ff6a6a':'#ffd23a',13,3);
    msg='正しいジャッジ！ '+(truth==='red'?'一発レッド——退場！':'イエロー——警告！')+'  +'+add;msgCol='#5affa0';msgT=1;
  }else{
    combo=0;fails++;
    S.wrong();flash=0.36;shakeT=0.7;
    if(result==='early')msg='早すぎる！ まだ判定できない';
    else if(result==='late')msg='判定が遅い！ 選手が詰め寄る';
    else msg='誤審！ 本当は'+(truth==='red'?'レッド（退場）だった':'イエロー（警告）だった');
    msgCol='#ff6a6a';msgT=1;
  }
  phase='result';pt=0;
}

function makeCall(c){
  if(state!=='play'||phase!=='watch'||decided)return;
  called=c;
  if(clock<revealT){resolve('early');return;}
  const correct=(c===truth);
  resolve(correct?'right':'wrong');
}

// ---------- input ----------
function actY(){if(!AC)actx();if(state==='title'){startGame();return;}if(state==='over'){startGame();return;}makeCall('yellow');}
function actR(){if(!AC)actx();if(state==='title'){startGame();return;}if(state==='over'){startGame();return;}makeCall('red');}
cv.addEventListener('mousedown',function(e){e.preventDefault();
  if(state!=='play'){actY();return;}
  const r=cv.getBoundingClientRect();const x=(e.clientX-r.left)/r.width*W;
  if(x<450)actY();else actR();
});
cv.addEventListener('touchstart',function(e){e.preventDefault();
  if(state!=='play'){actY();return;}
  const r=cv.getBoundingClientRect();const t=e.changedTouches[0];const x=(t.clientX-r.left)/r.width*W;
  if(x<450)actY();else actR();
},{passive:false});
window.addEventListener('keydown',function(e){
  if(e.code==='ArrowLeft'||e.code==='KeyA'){e.preventDefault();actY();}
  else if(e.code==='ArrowRight'||e.code==='KeyD'){e.preventDefault();actR();}
  else if(e.code==='Space'||e.code==='Enter'){e.preventDefault();if(state!=='play')actY();}
});

// ---------- update ----------
let last=0;
function update(dt){
  if(flash>0)flash=Math.max(0,flash-dt/300);
  if(shakeT>0)shakeT=Math.max(0,shakeT-dt/320);
  if(msgT>0)msgT=Math.max(0,msgT-dt/1500);
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.x+=p.vx;p.y+=p.vy;p.vy+=0.16;p.life-=dt/640;if(p.life<=0)parts.splice(i,1);}
  if(state!=='play')return;
  pt+=dt;
  if(phase==='wind'){
    if(pt>=440){phase='watch';pt=0;clock=0;S.challenge();}
  }else if(phase==='watch'){
    clock+=dt;
    if(clock>=revealT){ slideU=Math.min(1,slideU+dt/200); if(clock<revealT+18){ if(truth==='red'){burst(CONTACT[0],CONTACT[1]-14,'#ff8a8a',6,2.4);} } }
    if(clock>=revealT+callWin&&!decided)resolve('late');
  }else if(phase==='result'){
    if(pt>=1080){
      if(fails>=3){state='over';best=Math.max(best,score);try{localStorage.setItem('yr_best',String(best));}catch(e){}S.over();}
      else if(outs>=TARGET){state='over';best=Math.max(best,score);try{localStorage.setItem('yr_best',String(best));}catch(e){}S.whistle();}
      else newPlay();
    }
  }
}

// ---------- render ----------
function roundRect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

function drawField(){
  for(let i=0;i<9;i++){ctx.fillStyle=i%2?'#2b6b3d':'#256036';ctx.fillRect(0,i*(H/9),W,H/9);}
}

function drawPlayers(){
  const revealed=(phase!=='wind'&&clock>=revealT);
  // attacker (blue) with the ball — goes down on reveal
  ctx.save();ctx.translate(CONTACT[0]+34,CONTACT[1]-6);
  const down=revealed?slideU:0;
  ctx.rotate(down*0.7);
  ctx.fillStyle='rgba(0,0,0,.24)';ctx.beginPath();ctx.ellipse(0,18,16,5,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#222';ctx.fillRect(-8,-2,7,22);ctx.fillRect(1,-2,7,22);
  ctx.fillStyle='#2f6fd0';ctx.fillRect(-11,-28,22,28);
  ctx.fillStyle='#f0c9a0';ctx.beginPath();ctx.arc(0,-38,8,0,Math.PI*2);ctx.fill();
  ctx.restore();
  // ball at the contact (ground)
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(CONTACT[0]+10,SHINY+18,7,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='rgba(0,0,0,.35)';ctx.lineWidth=1.2;ctx.stroke();
  // tackler (red) sliding in from the left; boot at bootY on reveal
  const tx=CONTACT[0]-70+ (revealed?slideU*40:0);
  ctx.save();ctx.translate(tx,CONTACT[1]+26);
  ctx.fillStyle='rgba(0,0,0,.22)';ctx.beginPath();ctx.ellipse(6,14,22,6,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#c0343a';ctx.fillRect(-14,-14,26,20);
  ctx.fillStyle='#f0c9a0';ctx.beginPath();ctx.arc(-16,-8,8,0,Math.PI*2);ctx.fill();
  ctx.restore();
  // the tackling leg + boot, drawn to the revealed height
  if(revealed){
    const by=bootY;
    ctx.strokeStyle='#222';ctx.lineWidth=8;ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(tx+10,CONTACT[1]+30);ctx.lineTo(CONTACT[0]-6,by);ctx.stroke();
    // boot / studs
    ctx.save();ctx.translate(CONTACT[0]-4,by);ctx.rotate(truth==='red'?-0.5:0.15);
    ctx.fillStyle='#111';ctx.fillRect(-4,-6,20,10);
    ctx.fillStyle=(truth==='red')?'#ff6a6a':'#ccc';
    for(let i=0;i<3;i++)ctx.fillRect(2+i*6,(truth==='red')?-10:4,3,5); // studs up (red) or down (yellow)
    ctx.restore();
    // shin reference line
    ctx.strokeStyle='rgba(255,255,255,.35)';ctx.setLineDash([5,5]);ctx.lineWidth=1.5;
    ctx.beginPath();ctx.moveTo(CONTACT[0]-60,SHINY);ctx.lineTo(CONTACT[0]+60,SHINY);ctx.stroke();ctx.setLineDash([]);
  }
}

function drawReveal(){
  if(!(phase==='watch'&&clock>=revealT&&!decided))return;
  ctx.textAlign='center';ctx.font='bold 24px sans-serif';
  if(truth==='red'){ctx.fillStyle='#ff9a9a';ctx.fillText('スタッド・アップ！ 足裏の危険な入り方',450,70);}
  else{ctx.fillStyle='#ffe08a';ctx.fillText('ボールに行った——だが無謀なチャージ',450,70);}
  // VAR inset: boot vs the shin line
  const bx=636,by=250,bw=240,bh=150;
  roundRect(bx,by,bw,bh,10);ctx.fillStyle='rgba(6,20,12,.94)';ctx.fill();ctx.strokeStyle='rgba(255,255,255,.4)';ctx.lineWidth=2;ctx.stroke();
  ctx.save();ctx.beginPath();roundRect(bx,by,bw,bh,10);ctx.clip();
  const lineY=by+bh/2, sc=3.2;
  ctx.fillStyle='rgba(180,60,60,.16)';ctx.fillRect(bx,by,bw,lineY-by);         // above line = red (studs up)
  ctx.fillStyle='rgba(200,180,60,.14)';ctx.fillRect(bx,lineY,bw,bh);           // at/below = yellow
  ctx.fillStyle='#fff';ctx.fillRect(bx,lineY-2,bw,4);                          // the shin/ball line
  const lim=bh/2-14-6;
  const off=clamp((bootY-SHINY)*sc,-lim,lim);
  const mbx=bx+bw/2, mby=lineY+off;
  // magnified boot
  ctx.save();ctx.translate(mbx,mby);ctx.rotate(truth==='red'?-0.5:0.15);
  ctx.fillStyle='#111';ctx.fillRect(-14,-8,34,16);
  ctx.fillStyle=(truth==='red')?'#ff6a6a':'#ddd';
  for(let i=0;i<3;i++)ctx.fillRect(-6+i*10,(truth==='red')?-18:8,5,10);
  ctx.restore();
  ctx.restore();
  ctx.fillStyle='#cfe';ctx.font='12px sans-serif';ctx.fillText('VAR 接触リプレイ',bx+bw/2,by-8);
  ctx.fillStyle='rgba(255,120,120,.9)';ctx.font='10px sans-serif';ctx.textAlign='left';ctx.fillText('上＝足裏（危険）',bx+8,by+16);
  ctx.textAlign='right';ctx.fillStyle='rgba(230,210,110,.9)';ctx.fillText('下＝ボール際',bx+bw-8,by+bh-8);
}

function drawButtons(){
  if(state!=='play')return;
  const active=(phase==='watch'&&!decided&&clock>=revealT);
  ctx.globalAlpha=active?1:0.5;
  roundRect(70,520,320,64,12);ctx.fillStyle=(called==='yellow')?'#c9a92a':'rgba(150,130,40,.72)';ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,.5)';ctx.lineWidth=2;ctx.stroke();
  roundRect(510,520,320,64,12);ctx.fillStyle=(called==='red')?'#c23b3b':'rgba(150,50,50,.72)';ctx.fill();ctx.stroke();
  ctx.globalAlpha=1;
  ctx.textAlign='center';
  ctx.fillStyle='#fff4c0';ctx.font='bold 24px sans-serif';ctx.fillText('イエロー（警告）',230,550);
  ctx.font='12px sans-serif';ctx.fillStyle='#e0d0a0';ctx.fillText('ボール際の無謀なファウル　← / A',230,572);
  ctx.fillStyle='#ffd0d0';ctx.font='bold 24px sans-serif';ctx.fillText('レッド（退場）',670,550);
  ctx.font='12px sans-serif';ctx.fillStyle='#e0b0b0';ctx.fillText('足裏の危険なタックル　→ / D',670,572);
}

function drawHUD(){
  ctx.textAlign='left';ctx.textBaseline='alphabetic';
  ctx.font='bold 20px sans-serif';ctx.fillStyle='#fff';
  ctx.fillText('正審 '+outs+' / '+TARGET,20,32);
  ctx.font='14px sans-serif';ctx.fillStyle='#ffb14a';ctx.fillText('誤審 '+fails+' / 3',20,54);
  ctx.textAlign='right';
  ctx.font='bold 20px sans-serif';ctx.fillStyle='#ffe08a';ctx.fillText('SCORE '+score,W-20,32);
  ctx.font='13px sans-serif';ctx.fillStyle='#bfe';ctx.fillText('BEST '+Math.max(best,score)+'   Lv.'+lvl,W-20,52);
  if(combo>1){ctx.textAlign='center';ctx.font='bold 20px sans-serif';ctx.fillStyle='#5affa0';ctx.fillText(combo+' 連続好ジャッジ!',450,116);}
}

function drawMsg(){
  if(msgT<=0)return;
  ctx.save();ctx.globalAlpha=clamp(msgT*1.4,0,1);
  ctx.textAlign='center';ctx.font='bold 24px sans-serif';
  ctx.fillStyle='rgba(0,0,0,.6)';roundRect(450-300,438,600,42,10);ctx.fill();
  ctx.fillStyle=msgCol;ctx.fillText(msg,450,466);
  ctx.restore();
}

function drawTitle(){
  drawField();
  ctx.save();ctx.textAlign='center';
  ctx.fillStyle='rgba(0,0,0,.68)';roundRect(96,100,708,398,16);ctx.fill();
  ctx.fillStyle='#fff';ctx.font='bold 34px sans-serif';ctx.fillText('イエローかレッドか',450,158);
  ctx.font='18px sans-serif';ctx.fillStyle='#9fe0bf';ctx.fillText('Yellow or Red?',450,188);
  ctx.font='16px sans-serif';ctx.fillStyle='#e6fcef';
  const lines=[
    'あなたは主審。激しいタックルの“入り方”を見極めろ！',
    '足裏を見せた危険なタックル（スタッド・アップ）＝一発レッド、',
    'ボール際の無謀だが足裏でないファウル＝イエロー。',
    'VARの接触リプレイで、ボールより上（足裏）か下（ボール際）かを判断。',
    '早すぎるコール・判定遅れ・誤審は失点。3誤審でクビ。',
    '左半分/← = イエロー、右半分/→ = レッド。',
  ];
  for(let i=0;i<lines.length;i++)ctx.fillText(lines[i],450,228+i*30);
  ctx.fillStyle='#ffe08a';ctx.font='bold 22px sans-serif';
  ctx.fillText('タップ / キーでスタート',450,472);
  ctx.restore();
}

function drawOver(){
  drawField();
  ctx.save();ctx.textAlign='center';
  ctx.fillStyle='rgba(0,0,0,.68)';roundRect(190,150,520,300,16);ctx.fill();
  const w2=outs>=TARGET;
  ctx.fillStyle=w2?'#5affa0':'#ff8a5a';ctx.font='bold 34px sans-serif';
  ctx.fillText(w2?'名主審！':'誤審でクビ…',450,222);
  ctx.fillStyle='#fff';ctx.font='20px sans-serif';
  ctx.fillText('正審 '+outs+' / '+TARGET,450,270);
  ctx.fillText('スコア '+score,450,304);
  ctx.fillStyle='#ffe08a';ctx.fillText('ベスト '+Math.max(best,score),450,336);
  ctx.fillStyle='#9fe0bf';ctx.font='bold 20px sans-serif';
  ctx.fillText('タップ / キー でもう一度',450,404);
  ctx.restore();
}

function render(){
  ctx.save();
  if(shakeT>0){const s=shakeT*7;ctx.translate(rnd(-s,s),rnd(-s,s));}
  if(state==='title'){drawTitle();}
  else if(state==='over'){drawOver();}
  else{
    drawField();
    drawPlayers();
    drawReveal();
    drawButtons();
    drawHUD();
    drawMsg();
  }
  for(const p of parts){ctx.globalAlpha=clamp(p.life,0,1);ctx.fillStyle=p.col;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();}
  ctx.globalAlpha=1;
  ctx.restore();
  if(flash>0){ctx.fillStyle='rgba(255,255,255,'+(flash*0.5)+')';ctx.fillRect(0,0,W,H);}
}

function frame(ts){let dt=ts-last;last=ts;if(dt>60)dt=60;if(dt<0)dt=0;update(dt);render();requestAnimationFrame(frame);}
requestAnimationFrame(frame);

// ---------- test hook ----------
window.__yr={
  start:startGame,
  yellow:function(){makeCall('yellow');},
  red:function(){makeCall('red');},
  get state(){return state;},
  get outs(){return outs;},
  get fails(){return fails;},
  get score(){return score;},
  get info(){return {state:state,phase:phase,clock:clock,revealT:revealT,callWin:callWin,tough:tough,decided:decided,result:result,called:called,truth:truth,outs:outs,fails:fails,lvl:lvl,isRed:(truth==='red'),revealed:(clock>=revealT),canAct:(state==='play'&&phase==='watch'&&!decided)};}
};
})();
</script>
</body>
</html>
