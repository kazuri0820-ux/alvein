<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ワンツー突破 — Give-and-Go</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{width:100%;height:100%;background:#07131e;overflow:hidden;
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,system-ui,sans-serif;
    touch-action:none;user-select:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  #stage{position:relative;aspect-ratio:900/600;max-width:100%;max-height:100%;
    width:auto;height:auto;box-shadow:0 0 60px rgba(0,0,0,.6);}
  canvas{display:block;width:100%;height:100%;border-radius:6px;}
</style>
</head>
<body>
<div id="wrap"><div id="stage"><canvas id="c" width="900" height="600"></canvas></div></div>
<script>
(function(){
"use strict";
const TEST=location.hash.indexOf('test')>=0;
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
const W=900,H=600;
let dpr=Math.max(1,Math.min(2,window.devicePixelRatio||1));
function fit(){ dpr=Math.max(1,Math.min(2,window.devicePixelRatio||1)); cv.width=W*dpr; cv.height=H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0); }
fit(); window.addEventListener('resize',fit);

// ---- audio ----
let AC=null;
function ac(){ if(!AC){ try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){AC=null;} } return AC; }
function tone(f,d,type,g,f2){ const a=ac(); if(!a)return; const o=a.createOscillator(),gg=a.createGain();
  o.type=type||'sine'; o.frequency.setValueAtTime(f,a.currentTime); if(f2)o.frequency.exponentialRampToValueAtTime(f2,a.currentTime+d);
  gg.gain.setValueAtTime(0.0001,a.currentTime); gg.gain.exponentialRampToValueAtTime(g||0.2,a.currentTime+0.01);
  gg.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+d); o.connect(gg); gg.connect(a.destination); o.start(); o.stop(a.currentTime+d+0.02); }
function noise(d,g,cut){ const a=ac(); if(!a)return; const n=Math.floor(a.sampleRate*d),buf=a.createBuffer(1,n,a.sampleRate),ch=buf.getChannelData(0);
  for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(1-i/n); const src=a.createBufferSource(); src.buffer=buf;
  const f=a.createBiquadFilter(); f.type='lowpass'; f.frequency.value=cut||1200; const gg=a.createGain(); gg.gain.value=g||0.2;
  src.connect(f); f.connect(gg); gg.connect(a.destination); src.start(); }
const S={
  pass(){ noise(0.04,0.2,1900); tone(360,0.07,'sine',0.14,540); },
  ret(){ noise(0.04,0.22,1500); tone(500,0.08,'sine',0.14,760); },
  beat(){ tone(680,0.08,'square',0.15,940); },
  combo(n){ tone(600+Math.min(8,n)*60,0.09,'square',0.14,1000); },
  goal(){ noise(0.3,0.22,2600); tone(80,0.2,'sine',0.12,50); setTimeout(()=>{const a=ac();if(a)noise(0.6,0.2,1900);},60); },
  tackle(){ noise(0.2,0.4,800); tone(150,0.2,'square',0.16,80); },
  intercept(){ noise(0.14,0.36,900); tone(180,0.14,'sawtooth',0.16,90); },
  whistle(){ tone(2000,0.1,'square',0.1); }
};

// ---- geometry ----
const PLY={x:450,y:436};
const WIN_LO=PLY.y-142, WIN_HI=PLY.y-56;

// ---- state ----
let state='ready';   // ready, play, beat, fail, over
let score=0, lives=3, best=0, combo=0, defsBeaten=0;
let def={y:60, side:1, active:false, speed:150};
let wall={x:600,y:250};
let anim=null;       // beat animation
let failAnim=null;
let msg='',msgT=0;
let flash=0,flashCol='#fff',shakeT=0,shakeM=0;
let parts=[]; let crowd=[]; let t=0; let scrollY=0;

try{ best=parseInt(localStorage.getItem('ot_best')||'0',10)||0; }catch(e){}
for(let i=0;i<50;i++) crowd.push({x:Math.random()*W,y:6+Math.random()*30,c:['#e8544e','#f0c14b','#4a90d9','#fff','#5cc98a','#c98af0'][i%6],b:Math.random()*6.28});

function reset(){ score=0;lives=3;combo=0;defsBeaten=0; parts=[]; spawnDef(true); state='play';
  msg='DFが【間合い】(緑)に入った瞬間タップでワンツー！'; msgT=170; S.whistle(); }
function spawnDef(first){
  const side=Math.random()<0.5?-1:1;
  def={ y:first?20:-30, side, active:true, speed:150+defsBeaten*8 };
  wall={ x:450+side*150, y:250 };
  anim=null; failAnim=null;
}

function window_(){ return def.active && def.y>=WIN_LO && def.y<=WIN_HI; }

function doOneTwo(){
  if(state!=='play'||!def.active) return;
  if(window_()){
    def.active=false; combo++; score++; defsBeaten++;
    S.pass(); setTimeout(S.ret,120); S.beat(); if(combo>1)S.combo(combo);
    burst(450,def.y,'#5cc98a',10);
    anim={t:0, phase:'toWall', wallX:wall.x, wallY:wall.y, defY:def.y};
    state='beat';
    if(score%5===0){ msg='ゴォール！ '+score; S.goal(); flash=0.4; flashCol='#eafff0'; shakeT=12; shakeM=5; burst(450,120,'#ffe14d',20);}
  } else {
    // fail: too early (intercept) or too late (tackle)
    if(def.y<WIN_LO){ fail('intercept','早すぎ！ 読まれてカット'); }
    else { fail('tackle','遅い！ タックルで奪われた'); }
  }
}
function fail(kind,message){
  def.active=false; lives--; combo=0;
  if(kind==='tackle')S.tackle(); else S.intercept();
  flash=0.3; flashCol='#ff9060'; shakeT=13; shakeM=5; burst(450,def.y,'#ff8f60',16);
  msg=message; msgT=110; failAnim={t:0}; state='fail';
}

function afterBeat(){ if(state==='beat') spawnDef(false), state==='beat'&&(state='play'); }
function burst(x,y,col,n){ for(let i=0;i<n;i++){ const a=Math.random()*6.28,sp=1+Math.random()*5;
  parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-2,life:1,col,r:2+Math.random()*3}); } }
function save(){ try{localStorage.setItem('ot_best',''+best);}catch(e){} }

// ---- input ----
function press(){
  const a=ac(); if(a&&a.state==='suspended')a.resume();
  if(state==='ready'||state==='over'){ reset(); return; }
  if(state==='play'){ doOneTwo(); }
}
cv.addEventListener('pointerdown',e=>{ e.preventDefault(); press(); });
window.addEventListener('keydown',e=>{ if(e.code==='Space'||e.code==='Enter'){ e.preventDefault(); press(); } });

// ---- update ----
let last=0;
function update(dt){
  t+=dt; if(msgT>0)msgT--; if(flash>0)flash=Math.max(0,flash-dt*2); if(shakeT>0)shakeT--;
  scrollY=(scrollY+ (state==='play'?90:20)*dt)%80;
  if(state==='play' && def.active){
    def.y+=def.speed*dt;
    if(def.y>=PLY.y-10){ fail('tackle','抜けなかった… タックル'); }
  }
  else if(state==='beat' && anim){
    anim.t+=dt;
    if(anim.phase==='toWall' && anim.t>=0.16){ anim.phase='return'; anim.t=0; }
    else if(anim.phase==='return' && anim.t>=0.18){ anim.phase='done'; anim.t=0; }
    else if(anim.phase==='done' && anim.t>=0.16){
      if(lives>0){ spawnDef(false); state='play'; } else { state='over'; }
    }
  }
  else if(state==='fail' && failAnim){
    failAnim.t+=dt;
    if(failAnim.t>=0.8){ if(lives>0){ spawnDef(false); state='play'; } else { state='over'; if(score>best){best=score;save();} } }
  }
  if(state==='over' && score>best){ best=score; save(); }
  for(let i=parts.length-1;i>=0;i--){ const q=parts[i]; q.x+=q.vx;q.y+=q.vy;q.vy+=0.16;q.life-=dt*1.1; if(q.life<=0)parts.splice(i,1); }
}

// ---- draw ----
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function lerp(a,b,p){return a+(b-a)*p;}
function figure(x,y,col,scale){ scale=scale||1; ctx.save(); ctx.translate(x,y); ctx.scale(scale,scale);
  ctx.fillStyle='rgba(0,0,0,.22)'; ctx.beginPath(); ctx.ellipse(0,16,13,5,0,0,6.28); ctx.fill();
  ctx.strokeStyle='#20304a'; ctx.lineWidth=6; ctx.lineCap='round';
  const sw=Math.sin(t*18+x)*4;
  ctx.beginPath(); ctx.moveTo(-2,-4); ctx.lineTo(-5+sw,16); ctx.stroke(); ctx.beginPath(); ctx.moveTo(2,-4); ctx.lineTo(5-sw,16); ctx.stroke();
  ctx.fillStyle=col; rr(-12,-30,24,26,7); ctx.fill();
  ctx.fillStyle='#f0c39a'; ctx.beginPath(); ctx.arc(0,-36,7,0,6.28); ctx.fill(); ctx.restore(); }
function ball(x,y){ ctx.save(); ctx.translate(x,y); ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(0,0,8,0,6.28); ctx.fill();
  ctx.fillStyle='#1a1a1a'; for(let i=0;i<5;i++){ const a=i/5*6.28+t*3; ctx.beginPath(); ctx.arc(Math.cos(a)*4,Math.sin(a)*4,1.5,0,6.28); ctx.fill(); } ctx.restore(); }

function drawField(){
  const g=ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,'#20844a'); g.addColorStop(1,'#166237');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  for(let y=-80+scrollY;y<H;y+=80){ ctx.fillStyle='rgba(255,255,255,.03)'; ctx.fillRect(0,y,W,40); }
  ctx.fillStyle='#0c1c28'; ctx.fillRect(0,0,W,34);
  for(const c of crowd){ const yy=c.y+Math.sin(t*3+c.b)*1.1; ctx.fillStyle=c.c; ctx.globalAlpha=.7; ctx.fillRect(c.x,yy,5,5); }
  ctx.globalAlpha=1;
  // engage band
  const win=window_();
  ctx.fillStyle= win? 'rgba(92,201,138,.18)':'rgba(255,255,255,.05)';
  ctx.fillRect(0,WIN_LO,W,WIN_HI-WIN_LO);
  ctx.strokeStyle= win? 'rgba(92,201,138,.7)':'rgba(255,255,255,.18)'; ctx.lineWidth=2; ctx.setLineDash([10,8]);
  ctx.beginPath(); ctx.moveTo(0,WIN_LO); ctx.lineTo(W,WIN_LO); ctx.moveTo(0,WIN_HI); ctx.lineTo(W,WIN_HI); ctx.stroke(); ctx.setLineDash([]);
  ctx.fillStyle='rgba(255,255,255,.4)'; ctx.font='12px sans-serif'; ctx.textAlign='left'; ctx.fillText('間合い（ここでタップ）',14,WIN_LO-8);
}

function drawScene(){
  // wall teammate
  if(state==='play'||state==='beat'){ figure(wall.x,wall.y,'#f5d23e'); ctx.fillStyle='rgba(255,255,255,.5)'; ctx.font='11px sans-serif'; ctx.textAlign='center'; ctx.fillText('壁(味方)',wall.x,wall.y+28); }
  // defender
  if(def.active){ figure(450,def.y,'#2b2f38'); }
  else if(state==='beat'){ // beaten defender slides down/back
    const p=Math.min(1,(anim?anim.t:0)); figure(450+ (Math.random()*2-1)*2, def.y+ (anim&&anim.phase!=='toWall'?40:0), '#2b2f38'); }
  // player
  figure(PLY.x,PLY.y,'#e8544e');
  // ball
  if(state==='play'){ ball(PLY.x+14,PLY.y+6); }
  else if(state==='beat' && anim){
    let bx,by;
    if(anim.phase==='toWall'){ const p=anim.t/0.16; bx=lerp(PLY.x,wall.x,p); by=lerp(PLY.y,wall.y,p); }
    else if(anim.phase==='return'){ const p=anim.t/0.18; bx=lerp(wall.x,450,p); by=lerp(wall.y,def.y-60,p); }
    else { const p=anim.t/0.16; bx=450; by=lerp(def.y-60,200,p); }
    ctx.strokeStyle='rgba(255,255,255,.25)'; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(PLY.x,PLY.y); ctx.lineTo(wall.x,wall.y); ctx.lineTo(bx,by); ctx.stroke();
    ball(bx,by);
  }
}

function drawHUD(){
  ctx.textAlign='left'; hud(14,44,'突破 SCORE',score,'#ffe14d');
  ctx.textAlign='center';
  ctx.fillStyle='rgba(6,18,28,.72)'; rr(W/2-70,44,140,44,9); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.6)'; ctx.font='11px sans-serif'; ctx.fillText('ライフ',W/2,62);
  for(let i=0;i<3;i++){ ctx.beginPath(); ctx.arc(W/2-24+i*24,78,8,0,6.28); ctx.fillStyle=i<lives?'#e8544e':'rgba(255,255,255,.15)'; ctx.fill(); }
  ctx.textAlign='right'; hudR(W-14,44,'自己ベスト',best,'#7fd0ff');
  if(combo>1){ ctx.textAlign='center'; ctx.fillStyle='#ffe14d'; ctx.font='bold 22px sans-serif'; ctx.fillText(combo+' コンボ！', W/2, 120); }
}
function hud(x,y,l,v,c){ ctx.fillStyle='rgba(6,18,28,.72)'; rr(x,y,120,44,9); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.6)'; ctx.font='11px sans-serif'; ctx.textAlign='left'; ctx.fillText(l,x+10,y+17);
  ctx.fillStyle=c; ctx.font='bold 20px sans-serif'; ctx.fillText(v,x+10,y+38); }
function hudR(x,y,l,v,c){ const w=120; ctx.fillStyle='rgba(6,18,28,.72)'; rr(x-w,y,w,44,9); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.6)'; ctx.font='11px sans-serif'; ctx.textAlign='right'; ctx.fillText(l,x-10,y+17);
  ctx.fillStyle=c; ctx.font='bold 20px sans-serif'; ctx.fillText(v,x-10,y+38); }

function drawMsg(){ if(msgT>0&&msg){ const my=560; ctx.textAlign='center'; ctx.font='bold 20px sans-serif';
  const tw=ctx.measureText(msg).width; ctx.fillStyle='rgba(4,10,18,.62)'; rr(W/2-tw/2-14,my-24,tw+30,33,10); ctx.fill();
  ctx.fillStyle='#fff'; ctx.fillText(msg,W/2,my); } }

function drawOverlay(){
  ctx.fillStyle='rgba(4,10,18,.76)'; ctx.fillRect(0,0,W,H); ctx.textAlign='center';
  ctx.fillStyle='rgba(255,255,255,.55)'; ctx.font='14px sans-serif'; ctx.fillText('SOCCER · GIVE-AND-GO',W/2,120);
  ctx.fillStyle='#fff'; ctx.font='bold 50px sans-serif'; ctx.fillText('ワンツー突破',W/2,182);
  ctx.fillStyle='#5cc98a'; ctx.font='bold 22px sans-serif'; ctx.fillText('Give-and-Go',W/2,216);
  ctx.fillStyle='rgba(255,255,255,.82)'; ctx.font='16px sans-serif';
  const lines=['向かってくるDFを壁パス（ワンツー）で置き去りに！','DFが【間合い】の緑ゾーンに入った瞬間にタップ。','味方に預けて、DFの背後で受け直して突破！','早すぎるとカット、遅いとタックル。テンポよく連続突破！','ライフ3。何人抜きできる？（5人ごとにゴール）'];
  lines.forEach((l,i)=>ctx.fillText(l,W/2,252+i*25));
  const bw=220,bh=54,bx=(W-bw)/2,by=450; ctx.fillStyle='#e8544e'; rr(bx,by,bw,bh,12); ctx.fill();
  ctx.fillStyle='#fff'; ctx.font='bold 24px sans-serif'; ctx.fillText('キックオフ',W/2,by+35);
  ctx.fillStyle='rgba(255,255,255,.5)'; ctx.font='13px sans-serif'; ctx.fillText('タップ / Space',W/2,by+bh+22);
}
function drawOver(){
  ctx.fillStyle='rgba(4,10,18,.8)'; ctx.fillRect(0,0,W,H); ctx.textAlign='center';
  ctx.fillStyle='#fff'; ctx.font='bold 46px sans-serif'; ctx.fillText('ゲームセット',W/2,224);
  ctx.fillStyle='#ffe14d'; ctx.font='bold 32px sans-serif'; ctx.fillText(score+' 人抜き',W/2,282);
  ctx.fillStyle='#7fd0ff'; ctx.font='20px sans-serif'; ctx.fillText('自己ベスト '+best,W/2,318);
  const bw=220,bh=54,bx=(W-bw)/2,by=360; ctx.fillStyle='#e8544e'; rr(bx,by,bw,bh,12); ctx.fill();
  ctx.fillStyle='#fff'; ctx.font='bold 24px sans-serif'; ctx.fillText('もう一度',W/2,by+35);
  ctx.fillStyle='rgba(255,255,255,.5)'; ctx.font='13px sans-serif'; ctx.fillText('タップ / Space',W/2,by+bh+22);
}

function render(){
  ctx.save(); if(shakeT>0){ const s2=shakeM*(shakeT/13); ctx.translate((Math.random()*2-1)*s2,(Math.random()*2-1)*s2); }
  drawField();
  if(state!=='ready') drawScene();
  for(const q of parts){ ctx.globalAlpha=Math.max(0,q.life); ctx.fillStyle=q.col; ctx.beginPath(); ctx.arc(q.x,q.y,q.r,0,6.28); ctx.fill(); }
  ctx.globalAlpha=1;
  drawHUD(); drawMsg();
  ctx.restore();
  if(flash>0){ ctx.fillStyle=flashCol; ctx.globalAlpha=flash; ctx.fillRect(0,0,W,H); ctx.globalAlpha=1; }
  if(state==='ready') drawOverlay();
  if(state==='over') drawOver();
}
function loop(ts){ if(!last)last=ts; let dt=(ts-last)/1000; last=ts; if(dt>0.05)dt=0.05; update(dt); render(); requestAnimationFrame(loop); }
requestAnimationFrame(loop);

if(TEST){
  window.__ot={
    get state(){return state;},
    get defY(){return def.y;},
    get winLo(){return WIN_LO;}, get winHi(){return WIN_HI;},
    get inWindow(){return window_();},
    get score(){return score;}, get lives(){return lives;},
    oneTwo(){ doOneTwo(); },
    tap(){ if(state==='ready'||state==='over')reset(); }
  };
}
})();
</script>
</body>
</html>
