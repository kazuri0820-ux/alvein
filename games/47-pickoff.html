<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>牽制 — Hold the Runner</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{width:100%;height:100%;background:#0a1622;overflow:hidden;
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,system-ui,sans-serif;
    touch-action:none;user-select:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  #stage{position:relative;aspect-ratio:900/600;max-width:100%;max-height:100%;
    width:auto;height:auto;box-shadow:0 0 60px rgba(0,0,0,.6);}
  canvas{display:block;width:100%;height:100%;border-radius:6px;}
</style>
</head>
<body>
<div id="wrap"><div id="stage"><canvas id="c" width="900" height="600"></canvas></div></div>
<script>
(function(){
"use strict";
const TEST=location.hash.indexOf('test')>=0;
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
const W=900,H=600;
let dpr=Math.max(1,Math.min(2,window.devicePixelRatio||1));
function fit(){ dpr=Math.max(1,Math.min(2,window.devicePixelRatio||1)); cv.width=W*dpr; cv.height=H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0); }
fit(); window.addEventListener('resize',fit);

// ---- audio ----
let AC=null;
function ac(){ if(!AC){ try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){AC=null;} } return AC; }
function tone(f,d,type,g,f2){ const a=ac(); if(!a)return; const o=a.createOscillator(),gg=a.createGain();
  o.type=type||'sine'; o.frequency.setValueAtTime(f,a.currentTime); if(f2)o.frequency.exponentialRampToValueAtTime(f2,a.currentTime+d);
  gg.gain.setValueAtTime(0.0001,a.currentTime); gg.gain.exponentialRampToValueAtTime(g||0.2,a.currentTime+0.01);
  gg.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+d); o.connect(gg); gg.connect(a.destination); o.start(); o.stop(a.currentTime+d+0.02); }
function noise(d,g,cut){ const a=ac(); if(!a)return; const n=Math.floor(a.sampleRate*d),buf=a.createBuffer(1,n,a.sampleRate),ch=buf.getChannelData(0);
  for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(1-i/n); const src=a.createBufferSource(); src.buffer=buf;
  const f=a.createBiquadFilter(); f.type='lowpass'; f.frequency.value=cut||1200; const gg=a.createGain(); gg.gain.value=g||0.2;
  src.connect(f); f.connect(gg); gg.connect(a.destination); src.start(); }
const S={
  throw(){ noise(0.05,0.28,1900); tone(360,0.08,'square',0.14,600); },
  tag(){ noise(0.1,0.34,1200); tone(260,0.08,'triangle',0.2,150); },
  out(){ tone(520,0.12,'sine',0.2,760); setTimeout(()=>tone(780,0.18,'sine',0.16),100); },
  cheer(){ const a=ac(); if(!a)return; noise(0.6,0.22,1900); for(let i=0;i<4;i++)setTimeout(()=>tone(500+Math.random()*280,0.28,'sine',0.05),i*44); },
  safe(){ tone(300,0.28,'square',0.14,150); },
  steal(){ noise(0.3,0.24,1200); tone(200,0.2,'sawtooth',0.14,90); },
  pitch(){ noise(0.05,0.2,1600); tone(300,0.08,'sine',0.12,420); },
  whistle(){ tone(2000,0.1,'square',0.1); }, tick(){ tone(1000,0.03,'square',0.06); }
};

// ---- geometry ----
const B1={x:718,y:378}, B2={x:182,y:378}, MOUND={x:450,y:150};

// ---- state ----
let state='ready';   // ready, read, resolve, result, over
let outs=0, allowed=0, streak=0, best=0, level=0, playN=0;
let intent='hold', leanShown=-1, feet=-1, lead=0.4, fake=false;
let clock=0, decideT=1.9, choice=null, result=null;
let anim=null, runnerX=B1.x, ballPos=null;
let msg='',msgT=0;
let flash=0,flashCol='#fff',shakeT=0,shakeM=0;
let parts=[]; let crowd=[]; let t=0;

try{ best=parseInt(localStorage.getItem('pk_best')||'0',10)||0; }catch(e){}
for(let i=0;i<64;i++) crowd.push({x:Math.random()*W,y:6+Math.random()*36,c:['#e8544e','#f0c14b','#4a90d9','#fff','#5cc98a','#c98af0'][i%6],b:Math.random()*6.28});

function reset(){ outs=0;allowed=0;streak=0;level=0;playN=0; parts=[]; nextPlay(); }
function levelUp(){ level=Math.min(9,Math.floor(outs/4)); }

function nextPlay(){
  levelUp(); playN++;
  intent = Math.random()<0.5?'steal':'hold';
  feet = intent==='steal'? 1 : -1;                 // subtle honest cue
  fake = level>=2 && Math.random()<Math.min(0.5,0.16+level*0.05);
  leanShown = fake? -feet : feet;                  // obvious lean can lie
  lead = intent==='steal'? 0.62+Math.random()*0.34 : 0.22+Math.random()*0.3;
  if(fake) lead=0.42+Math.random()*0.2;            // fakes: ambiguous lead
  clock=0; decideT=Math.max(1.1,2.0-level*0.09); choice=null; result=null; anim=null;
  runnerX=B1.x-lead*118; ballPos=null;
  state='read';
  if(playN<=2){ msg='走者の意図を読め！ 盗塁なら【牽制】、自重なら【投球】。足元(重心)は嘘をつかない'; msgT=180; }
  else { msg=''; msgT=0; }
  S.whistle();
}

function choose(a){
  if(state!=='read'||choice) return;
  choice=a;
  const correct = (intent==='steal' && a==='pickoff') || (intent==='hold' && a==='pitch');
  // set up animation
  if(a==='pickoff'){ S.throw(); anim={kind:'pickoff',t:0}; ballPos={x:MOUND.x,y:MOUND.y}; }
  else { S.pitch(); anim={kind:'pitch',t:0}; ballPos={x:MOUND.x,y:MOUND.y}; }
  result = correct? 'good' : 'bad';
  state='resolve';
}

function onResolve(){
  if(result==='good'){
    outs++; streak++; if(streak>best){best=streak;save();}
    if(choice==='pickoff'){ msg = streak>=3?`牽制アウト！ ${streak}連続`:'牽制アウト！ 完璧な読み'; S.tag(); setTimeout(S.out,90); }
    else { msg = streak>=3?`自重を見抜き投球！ ${streak}連続`:'走らせず投球！ ナイス判断'; S.out(); }
    setTimeout(S.cheer,80); flash=0.36; flashCol='#eafff0'; shakeT=10; shakeM=4; burst(runnerX,B1.y,'#ffe14d',18);
  } else {
    allowed++; streak=0;
    if(choice==='pitch'){ msg='盗塁を許した！ 走者は二塁へ'; S.steal(); }
    else { msg='自重の走者に無駄な牽制… 隙を突かれ進塁'; S.safe(); }
    flash=0.3; flashCol='#ff9060'; shakeT=12; shakeM=5; burst(runnerX,B1.y,'#ff8f60',14);
  }
  state='result'; msgT=140;
  if(allowed>=3){ setTimeout(()=>{ state='over'; msg='3進塁許した… ゲームセット'; msgT=99999; }, 950); }
  else setTimeout(()=>{ if(state==='result') nextPlay(); }, 1100);
}
function save(){ try{localStorage.setItem('pk_best',''+best);}catch(e){} }
function burst(x,y,col,n){ for(let i=0;i<n;i++){ const a=Math.random()*6.28,sp=1+Math.random()*5;
  parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-2,life:1,col,r:2+Math.random()*3}); } }

// ---- input ----
function toStage(clientX,clientY){ const r=cv.getBoundingClientRect(); return {x:(clientX-r.left)/r.width*W,y:(clientY-r.top)/r.height*H}; }
cv.addEventListener('pointerdown',e=>{ e.preventDefault();
  const a=ac(); if(a&&a.state==='suspended')a.resume();
  if(state==='ready'||state==='over'){ reset(); return; }
  if(state==='read'){ const q=toStage(e.clientX,e.clientY); choose(q.x<W/2?'pickoff':'pitch'); }
});
window.addEventListener('keydown',e=>{
  if(state==='ready'||state==='over'){ if(e.code==='Space'||e.code==='Enter'){e.preventDefault();reset();} return; }
  if(state==='read'){ if(e.code==='ArrowLeft'||e.code==='KeyK'){choose('pickoff');} else if(e.code==='ArrowRight'||e.code==='Space'||e.code==='KeyP'){e.preventDefault();choose('pitch');} }
});

// ---- update ----
let last=0;
function update(dt){
  t+=dt; if(msgT>0)msgT--; if(flash>0)flash=Math.max(0,flash-dt*2); if(shakeT>0)shakeT--;
  if(state==='read'){
    clock+=dt;
    if(clock>decideT-0.6 && ((clock*10|0)!==((clock-dt)*10|0))) S.tick();
    if(clock>=decideT && !choice){ // delay of game -> if stealer, they go; treat as steal allowed
      choice='none'; result= intent==='steal'?'bad':'bad'; anim={kind: intent==='steal'?'pitch':'pickoff', t:0, dawdle:true}; ballPos={x:MOUND.x,y:MOUND.y};
      msg=''; state='resolve';
      if(intent==='steal'){ /* steal */ }
    }
  }
  else if(state==='resolve' && anim){
    anim.t+=dt;
    const k=anim.kind;
    if(k==='pickoff'){
      const p=Math.min(1,anim.t/0.32); ballPos.x=MOUND.x+(B1.x-MOUND.x)*p; ballPos.y=MOUND.y+(B1.y-MOUND.y)*p;
      // runner dives back to 1st
      runnerX += (B1.x-14-runnerX)*Math.min(1,dt*8);
      if(anim.t>=0.5){ onResolve(); anim=null; }
    } else { // pitch
      const p=Math.min(1,anim.t/0.3); ballPos.x=MOUND.x; ballPos.y=MOUND.y+(560-MOUND.y)*p;
      if(intent==='steal'){ runnerX += (B2.x-runnerX)*Math.min(1,dt*3.4); } // runner breaks for 2nd
      if(anim.t>=0.5){ onResolve(); anim=null; }
    }
  }
  for(let i=parts.length-1;i>=0;i--){ const q=parts[i]; q.x+=q.vx;q.y+=q.vy;q.vy+=0.16;q.life-=dt*1.1; if(q.life<=0)parts.splice(i,1); }
}

// ---- draw ----
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

function drawField(){
  const g=ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,'#1f7a3f'); g.addColorStop(1,'#176033');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  for(let i=0;i<9;i++){ if(i%2){ ctx.fillStyle='rgba(255,255,255,.03)'; ctx.fillRect(0,i*H/9,W,H/9); } }
  ctx.fillStyle='#0c1c28'; ctx.fillRect(0,0,W,38);
  for(const c of crowd){ const yy=c.y+Math.sin(t*3+c.b)*1.1; ctx.fillStyle=c.c; ctx.globalAlpha=.7; ctx.fillRect(c.x,yy,5,5); }
  ctx.globalAlpha=1;
  // basepath
  ctx.strokeStyle='#b5763e'; ctx.lineWidth=26; ctx.lineCap='round'; ctx.beginPath(); ctx.moveTo(B2.x,B2.y); ctx.lineTo(B1.x,B1.y); ctx.stroke();
  // mound
  ctx.fillStyle='#a86a37'; ctx.beginPath(); ctx.arc(MOUND.x,MOUND.y,30,0,6.28); ctx.fill();
  // bases
  for(const [bb,lab] of [[B1,'一塁'],[B2,'二塁']]){ ctx.save(); ctx.translate(bb.x,bb.y); ctx.rotate(Math.PI/4); ctx.fillStyle='#f4f8ff'; ctx.fillRect(-12,-12,24,24); ctx.restore();
    ctx.fillStyle='rgba(255,255,255,.5)'; ctx.font='12px sans-serif'; ctx.textAlign='center'; ctx.fillText(lab,bb.x,bb.y+34); }
}

function drawPitcher(){
  ctx.save(); ctx.translate(MOUND.x,MOUND.y);
  ctx.fillStyle='rgba(0,0,0,.2)'; ctx.beginPath(); ctx.ellipse(0,14,13,4,0,0,6.28); ctx.fill();
  ctx.fillStyle='#4a90d9'; rr(-12,-28,24,26,7); ctx.fill(); ctx.fillStyle='#f0c39a'; ctx.beginPath(); ctx.arc(0,-34,7,0,6.28); ctx.fill();
  ctx.restore();
  // first baseman near 1st
  ctx.save(); ctx.translate(B1.x+22,B1.y-4);
  ctx.fillStyle='#4a90d9'; rr(-10,-24,20,22,6); ctx.fill(); ctx.fillStyle='#f0c39a'; ctx.beginPath(); ctx.arc(0,-30,6,0,6.28); ctx.fill();
  ctx.restore();
}

function drawRunner(){
  if(state==='ready') return;
  const rx=runnerX, ry=B1.y;
  ctx.save(); ctx.translate(rx,ry);
  const tilt = state==='read'? leanShown*0.35 : (result==='good'&&choice==='pickoff'?0.6: (intent==='steal'&&choice!=='pickoff'? -0.4:0));
  ctx.fillStyle='rgba(0,0,0,.22)'; ctx.beginPath(); ctx.ellipse(0,14,13,5,0,0,6.28); ctx.fill();
  ctx.rotate(tilt*0.5);
  ctx.strokeStyle='#20304a'; ctx.lineWidth=6; ctx.lineCap='round'; const sw=Math.sin(t*10)*3;
  ctx.beginPath(); ctx.moveTo(-2,-4); ctx.lineTo(-6+sw,14); ctx.stroke(); ctx.beginPath(); ctx.moveTo(2,-4); ctx.lineTo(6-sw,14); ctx.stroke();
  ctx.fillStyle='#e8544e'; rr(-11,-30,22,26,7); ctx.fill(); ctx.fillStyle='#f0c39a'; ctx.beginPath(); ctx.arc(0,-36,7,0,6.28); ctx.fill();
  ctx.restore();
  if(state==='read'){
    // obvious lean arrow (can lie)
    ctx.fillStyle='rgba(255,235,120,.85)'; ctx.font='bold 22px sans-serif'; ctx.textAlign='center';
    ctx.fillText(leanShown>0?'◀ リード':'リード ▶', rx, ry-46);
    // subtle honest weight cue at the feet
    ctx.fillStyle='rgba(120,220,255,.85)'; ctx.font='bold 12px sans-serif';
    ctx.fillText(feet>0?'‹重心›':'‹重心›', rx+feet*20, ry+30);
    ctx.strokeStyle='rgba(120,220,255,.9)'; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(rx,ry+24); ctx.lineTo(rx+feet*20,ry+24); ctx.stroke();
    // lead bar
    ctx.fillStyle='rgba(6,18,28,.5)'; rr(rx-40,ry-64,80,8,4); ctx.fill();
    ctx.fillStyle= lead>0.6?'#ff7d6b':'#5cc98a'; rr(rx-40,ry-64,80*lead,8,4); ctx.fill();
  }
}

function drawBall(){
  if(ballPos && state==='resolve'){ ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(ballPos.x,ballPos.y,7,0,6.28); ctx.fill();
    ctx.strokeStyle='#d33'; ctx.lineWidth=1; ctx.beginPath(); ctx.arc(ballPos.x-1,ballPos.y-1,7,0.4,1.9); ctx.stroke(); }
}

function drawTimer(){
  if(state!=='read') return;
  const fr=Math.max(0,1-clock/decideT);
  ctx.fillStyle='rgba(6,18,28,.5)'; ctx.fillRect(0,38,W,6);
  ctx.fillStyle= fr<0.3?'#ff5a4a':'#ffd23e'; ctx.fillRect(0,38,W*fr,6);
}

function drawButtons(){
  if(state!=='read') return;
  const by=548,bh=42;
  ctx.fillStyle='rgba(232,84,78,.9)'; rr(40,by,W/2-60,bh,10); ctx.fill();
  ctx.fillStyle='#fff'; ctx.font='bold 22px sans-serif'; ctx.textAlign='center'; ctx.fillText('◀ 牽制（盗塁を刺す）',W/4,by+28);
  ctx.fillStyle='rgba(74,144,217,.9)'; rr(W/2+20,by,W/2-60,bh,10); ctx.fill();
  ctx.fillStyle='#fff'; ctx.fillText('投球（自重に対応）▶',W*3/4,by+28);
}

function drawHUD(){
  ctx.textAlign='left'; hud(14,10,'アウト OUTS',outs,'#5cc98a');
  ctx.textAlign='center'; hudC(W/2,10,'連続 STREAK',streak,'#7fd0ff');
  ctx.textAlign='right'; hudR(W-14,10,'進塁許 ALLOW',allowed+' /3','#ff7d6b');
  ctx.fillStyle='rgba(255,255,255,.5)'; ctx.font='12px sans-serif'; ctx.textAlign='left'; ctx.fillText('自己ベスト連続 '+best, 16, 78);
}
function hud(x,y,l,v,c){ ctx.fillStyle='rgba(6,18,28,.72)'; rr(x,y,118,48,9); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.6)'; ctx.font='11px sans-serif'; ctx.textAlign='left'; ctx.fillText(l,x+10,y+17);
  ctx.fillStyle=c; ctx.font='bold 22px sans-serif'; ctx.fillText(v,x+10,y+41); }
function hudC(x,y,l,v,c){ const w=118; ctx.fillStyle='rgba(6,18,28,.72)'; rr(x-w/2,y,w,48,9); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.6)'; ctx.font='11px sans-serif'; ctx.textAlign='center'; ctx.fillText(l,x,y+17);
  ctx.fillStyle=c; ctx.font='bold 22px sans-serif'; ctx.fillText(v,x,y+41); }
function hudR(x,y,l,v,c){ const w=126; ctx.fillStyle='rgba(6,18,28,.72)'; rr(x-w,y,w,48,9); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.6)'; ctx.font='11px sans-serif'; ctx.textAlign='right'; ctx.fillText(l,x-10,y+17);
  ctx.fillStyle=c; ctx.font='bold 22px sans-serif'; ctx.fillText(v,x-10,y+41); }

function drawMsg(){ if(msgT>0&&msg){ const my=500; ctx.textAlign='center'; ctx.font='bold 19px sans-serif';
  const tw=ctx.measureText(msg).width; ctx.fillStyle='rgba(4,10,18,.66)'; rr(W/2-tw/2-14,my-24,tw+30,33,10); ctx.fill();
  ctx.fillStyle='#fff'; ctx.fillText(msg,W/2,my); } }

function drawOverlay(){
  ctx.fillStyle='rgba(4,10,18,.76)'; ctx.fillRect(0,0,W,H); ctx.textAlign='center';
  ctx.fillStyle='rgba(255,255,255,.55)'; ctx.font='14px sans-serif'; ctx.fillText('BASEBALL · HOLD THE RUNNER',W/2,118);
  ctx.fillStyle='#fff'; ctx.font='bold 54px sans-serif'; ctx.fillText('牽制',W/2,178);
  ctx.fillStyle='#ffe14d'; ctx.font='bold 22px sans-serif'; ctx.fillText('Read the Runner',W/2,212);
  ctx.fillStyle='rgba(255,255,255,.82)'; ctx.font='16px sans-serif';
  const lines=['一塁走者の意図を読む心理戦！','盗塁を狙う走者には【牽制】でアウト、','自重（走らない）走者には【投球】で対応。','大きな"リード表示"は嘘のことも。青い足元の"重心"は正直。','どちらの読み違いも1つ進塁を許す。3進塁で終了。'];
  lines.forEach((l,i)=>ctx.fillText(l,W/2,248+i*25));
  const bw=220,bh=52,bx=(W-bw)/2,by=448; ctx.fillStyle='#e8544e'; rr(bx,by,bw,bh,12); ctx.fill();
  ctx.fillStyle='#fff'; ctx.font='bold 24px sans-serif'; ctx.fillText('プレイボール',W/2,by+34);
  ctx.fillStyle='rgba(255,255,255,.5)'; ctx.font='13px sans-serif'; ctx.fillText('タップ / Space',W/2,by+bh+22);
}
function drawOver(){
  ctx.fillStyle='rgba(4,10,18,.8)'; ctx.fillRect(0,0,W,H); ctx.textAlign='center';
  ctx.fillStyle='#fff'; ctx.font='bold 44px sans-serif'; ctx.fillText('ゲームセット',W/2,224);
  ctx.fillStyle='#5cc98a'; ctx.font='bold 30px sans-serif'; ctx.fillText('アウト '+outs,W/2,280);
  ctx.fillStyle='#7fd0ff'; ctx.font='20px sans-serif'; ctx.fillText('自己ベスト連続 '+best,W/2,316);
  const bw=220,bh=54,bx=(W-bw)/2,by=358; ctx.fillStyle='#e8544e'; rr(bx,by,bw,bh,12); ctx.fill();
  ctx.fillStyle='#fff'; ctx.font='bold 24px sans-serif'; ctx.fillText('もう一度',W/2,by+35);
  ctx.fillStyle='rgba(255,255,255,.5)'; ctx.font='13px sans-serif'; ctx.fillText('タップ / Space',W/2,by+bh+22);
}

function render(){
  ctx.save(); if(shakeT>0){ const s2=shakeM*(shakeT/12); ctx.translate((Math.random()*2-1)*s2,(Math.random()*2-1)*s2); }
  drawField(); drawTimer(); drawPitcher(); drawRunner(); drawBall();
  for(const q of parts){ ctx.globalAlpha=Math.max(0,q.life); ctx.fillStyle=q.col; ctx.beginPath(); ctx.arc(q.x,q.y,q.r,0,6.28); ctx.fill(); }
  ctx.globalAlpha=1;
  drawButtons(); drawHUD(); drawMsg();
  ctx.restore();
  if(flash>0){ ctx.fillStyle=flashCol; ctx.globalAlpha=flash; ctx.fillRect(0,0,W,H); ctx.globalAlpha=1; }
  if(state==='ready') drawOverlay();
  if(state==='over') drawOver();
}
function loop(ts){ if(!last)last=ts; let dt=(ts-last)/1000; last=ts; if(dt>0.05)dt=0.05; update(dt); render(); requestAnimationFrame(loop); }
requestAnimationFrame(loop);

if(TEST){
  window.__pk={
    get state(){return state;},
    get intent(){return intent;},
    get leanShown(){return leanShown;},
    get feet(){return feet;},
    get fake(){return fake;},
    get result(){return result;},
    get count(){return {outs,allowed,streak};},
    choose(a){ choose(a); },
    tap(){ if(state==='ready'||state==='over')reset(); }
  };
}
})();
</script>
</body>
</html>
