<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>頭上を越えろ (Dink It Over)</title>
<style>
  html,body{margin:0;height:100%;background:#07100a;overflow:hidden;
    font-family:-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  #stage{position:relative;width:100vw;height:100vh;max-width:calc(100vh*1.5);max-height:calc(100vw/1.5);aspect-ratio:900/600;}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;border-radius:6px;}
</style>
</head>
<body>
<div id="wrap"><div id="stage"><canvas id="cv"></canvas></div></div>
<script>
(function(){
const W=900,H=600,cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let DPR=1;
function fit(){DPR=Math.min(2,window.devicePixelRatio||1);cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
fit();addEventListener('resize',fit);

// ---------- audio ----------
let AC=null;function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function tone(f,d,type,v,sweep){const a=ac();if(!a)return;const t=a.currentTime,o=a.createOscillator(),g=a.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(sweep)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+sweep),t+d);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v||0.2,t+0.008);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+0.02);}
function noise(d,v,hp){const a=ac();if(!a)return;const t=a.currentTime,n=Math.floor(a.sampleRate*d),buf=a.createBuffer(1,n,a.sampleRate),ch=buf.getChannelData(0);
  for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource();s.buffer=buf;
  const f=a.createBiquadFilter();f.type='highpass';f.frequency.value=hp||600;const g=a.createGain();g.gain.value=v||0.2;
  s.connect(f);f.connect(g);g.connect(a.destination);s.start(t);s.stop(t+d+0.02);}
const S={
  rush:()=>{tone(220,0.05,'sine',0.04,-40);},
  dink:()=>{tone(720,0.08,'sine',0.09,120);noise(0.02,0.04,1800);},
  good:()=>{[660,900,1180].forEach((f,i)=>setTimeout(()=>tone(f,0.11,'triangle',0.16),i*56));},
  big:()=>{[600,800,1000,1250,1500].forEach((f,i)=>setTimeout(()=>tone(f,0.12,'triangle',0.17),i*80));},
  bad:()=>{noise(0.2,0.24,240);tone(150,0.24,'sawtooth',0.13,-50);},
  streak:()=>{[700,930,1170,1400].forEach((f,i)=>setTimeout(()=>tone(f,0.1,'triangle',0.16),i*60));},
  over:()=>{[440,330,247,175].forEach((f,i)=>setTimeout(()=>tone(f,0.3,'triangle',0.2),i*160));}
};

// ---------- geometry ----------
const GOAL={x:452,y:104}, GW=300, GH=70;
const GK0={x:452,y:190};                    // keeper starts near his line
const YOU={x:452,y:470};                    // you, 1-on-1 with the ball

// ---------- state ----------
let state='title', phase='rush', plays=0;
let score=0, combo=0, best=+(localStorage.getItem('dk_best')||0);
let outs=0, fails=0, lvl=1;   // outs = goals
let clock=0, deadT=1160, win=460, winStart=700, tough=false;
let decided=false, result=null, resultT=0, msg='', msgOk=false, anim=0, relClock=0, quality=0;
let shake=0, flash=0, flashCol='#fff', last=performance.now();
let parts=[], pops=[];

function rnd(a,b){return a+Math.random()*(b-a);}
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function lerp(a,b,u){return a+(b-a)*u;}
function easeOut(u){return 1-Math.pow(1-u,2);}

function reset(){state='title';score=0;combo=0;outs=0;fails=0;lvl=1;plays=0;result=null;parts=[];pops=[];}

function newPlay(){
  plays++; lvl=Math.min(7,1+Math.floor(outs/4));
  deadT=clamp(1180-lvl*58,720,1180);
  win=clamp(520-lvl*30,300,520);
  tough=Math.random()<clamp(0.2+lvl*0.05,0.2,0.5); if(tough)win*=0.82;
  winStart=deadT-win;
  clock=0; decided=false; result=null; resultT=0; msg=''; msgOk=false; anim=0; relClock=0; quality=0;
  phase='rush'; S.rush();
}
function start(){ if(!ac())ac(); if(AC&&AC.state==='suspended')AC.resume(); reset(); state='play'; newPlay(); }

function act(){
  if(state==='title'){start();return;}
  if(state==='over'){ if(resultT>0.4){reset();start();} return; }
  if(state!=='play'||phase!=='rush'||decided) return;
  decided=true; relClock=clock;
  if(clock<winStart){ resolve('early'); }
  else { quality=clamp((clock-winStart)/win,0,1); resolve('goal'); }
}

function resolve(k){
  phase='result'; result=k; resultT=0; anim=0;
  if(k==='goal'){
    outs++; combo++;
    const gala=quality>=0.72;
    let add=Math.round((70+Math.round(quality*170)+(tough?60:0))*(1+Math.min(9,combo-1)*0.14)); score+=add;
    S.dink(); setTimeout(S.good,150); if(gala||tough)setTimeout(S.big,240);
    msgOk=true; flash=1;flashCol='#8affa0';shake=6;
    pop(W/2,236,(gala?'完璧に引きつけてループ——ゴラッソ！ +':'GKの頭上をふわりと越えてゴール！ +')+add,'#d6ffe0');
    if(combo>=2)pop(W/2,204,'コンボ x'+combo,'#ffd24d');
    if(combo>0&&combo%5===0)S.streak();
    msg=gala?'飛び出したGKを限界まで引きつけ、抑えられる寸前にふわりとループ——頭上を越えて無人のゴールへ沈めた！':'詰めてくるGKを引きつけてから、頭上を越える繊細なチップで流し込んだ！';
  } else {
    fails++; combo=0; msgOk=false; flash=1;flashCol='#ff5b5b';shake=8; S.bad();
    if(k==='early') msg='仕掛けが早い…まだGKが立って構えている所へループを上げ、正面でキャッチされた';
    else msg='引きつけ過ぎ…GKが足元まで詰めてボールを抑え込み、ループを上げる前に潰された';
    pop(W/2,236,(k==='early')?'早い…GK正面でキャッチ':'粘り過ぎ…足元で潰された','#ffb0b0');
  }
  if(fails>=3){ state='over'; resultT=0; S.over(); if(score>best){best=score;localStorage.setItem('dk_best',best);} }
}

// ---------- input ----------
cv.addEventListener('pointerdown',e=>{e.preventDefault();act();});
addEventListener('keydown',e=>{ if(e.repeat)return; if(e.code==='Space'||e.code==='Enter'||e.code==='ArrowUp'||e.code==='KeyF'||e.code==='KeyJ'){e.preventDefault();act();} });

// ---------- particles ----------
function burst(x,y,c,n,sp){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=rnd(sp*0.3,sp);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:1,c});}}
function pop(x,y,txt,c){pops.push({x,y,txt,c,life:1});}

// keeper advance fraction (0=on line, 1=at your feet) by clock
function gkFrac(cl){ return clamp(cl/(deadT+90),0,1); }
function gkPos(cl){ const f=gkFrac(cl); return {x:GK0.x, y:lerp(GK0.y,YOU.y-40,easeOut(f)), f}; }

// ---------- update ----------
function update(dt){
  shake*=Math.pow(0.86,dt/16.7); if(shake<0.3)shake=0;
  flash*=Math.pow(0.9,dt/16.7);
  for(const p of parts){p.vx*=0.96;p.vy=p.vy*0.96+0.28;p.x+=p.vx*dt/16.7;p.y+=p.vy*dt/16.7;p.life-=dt/16.7*0.026;}
  parts=parts.filter(p=>p.life>0);
  for(const p of pops){p.y-=dt/16.7*0.5;p.life-=dt/16.7*0.02;}
  pops=pops.filter(p=>p.life>0);

  if(state!=='play'){ if(state==='over')resultT+=dt/1000; return; }
  if(phase==='rush'){ clock+=dt;
    if(!decided && clock>deadT){ decided=true; relClock=clock; resolve('smothered'); }
    return; }
  if(phase==='result'){ resultT+=dt/1000; anim=Math.min(1,anim+dt/620); if(resultT>1.6) newPlay(); return; }
}

// ---------- render ----------
function drawField(){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#0f5e34');g.addColorStop(0.55,'#0e5230');g.addColorStop(1,'#0c4429');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='rgba(255,255,255,0.03)';for(let i=0;i<6;i++){ if(i%2===0)ctx.fillRect(0,60+i*95,W,95); }
  ctx.strokeStyle='rgba(255,255,255,0.26)';ctx.lineWidth=3;ctx.strokeRect(GOAL.x-250,GOAL.y+GH,500,320);ctx.strokeRect(GOAL.x-120,GOAL.y+GH,240,120);
  ctx.beginPath();ctx.arc(GOAL.x,GOAL.y+GH+320,52,Math.PI*0.08,Math.PI*0.92);ctx.stroke();
  ctx.fillStyle='rgba(0,0,0,0.28)';ctx.fillRect(GOAL.x-GW/2-4,GOAL.y-4,GW+8,GH+4);
  ctx.strokeStyle='rgba(255,255,255,0.34)';ctx.lineWidth=1;
  for(let gx=GOAL.x-GW/2;gx<=GOAL.x+GW/2;gx+=16){ctx.beginPath();ctx.moveTo(gx,GOAL.y);ctx.lineTo(gx,GOAL.y+GH);ctx.stroke();}
  for(let gy=GOAL.y;gy<=GOAL.y+GH;gy+=13){ctx.beginPath();ctx.moveTo(GOAL.x-GW/2,gy);ctx.lineTo(GOAL.x+GW/2,gy);ctx.stroke();}
  ctx.strokeStyle='#f2f2f2';ctx.lineWidth=6;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(GOAL.x-GW/2,GOAL.y+GH);ctx.lineTo(GOAL.x-GW/2,GOAL.y);ctx.lineTo(GOAL.x+GW/2,GOAL.y);ctx.lineTo(GOAL.x+GW/2,GOAL.y+GH);ctx.stroke();
  ctx.lineCap='butt';
}
function person(x,y,col,s,lean){s=s||1;lean=lean||0;
  ctx.save();ctx.translate(x,y);ctx.rotate(lean);
  ctx.fillStyle='rgba(0,0,0,0.2)';ctx.beginPath();ctx.ellipse(0,13*s,10*s,4*s,0,0,6.28);ctx.fill();
  ctx.fillStyle=col;ctx.beginPath();ctx.ellipse(0,-14*s,9*s,14*s,0,0,6.28);ctx.fill();
  ctx.fillStyle='#f0c9a0';ctx.beginPath();ctx.arc(0,-31*s,7*s,0,6.28);ctx.fill();
  ctx.restore();
}
function keeper(x,y,spread){ ctx.save();ctx.translate(x,y);
  ctx.fillStyle='rgba(0,0,0,0.2)';ctx.beginPath();ctx.ellipse(0,13,12,4,0,0,6.28);ctx.fill();
  ctx.fillStyle='#e8c23a';ctx.beginPath();ctx.ellipse(0,-13,9,14,0,0,6.28);ctx.fill();
  ctx.fillStyle='#f0c9a0';ctx.beginPath();ctx.arc(0,-30,7,0,6.28);ctx.fill();
  const a=0.7+spread*0.8;   // arms spread wider as he commits
  ctx.strokeStyle='#e8c23a';ctx.lineWidth=6;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(-6,-16);ctx.lineTo(-6-14*a,-8-6*a);ctx.moveTo(6,-16);ctx.lineTo(6+14*a,-8-6*a);ctx.stroke();
  ctx.fillStyle='#eef2f0';ctx.beginPath();ctx.arc(-6-14*a,-8-6*a,5,0,6.28);ctx.arc(6+14*a,-8-6*a,5,0,6.28);ctx.fill();
  ctx.restore(); }
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

function render(){
  ctx.save();
  if(shake>0)ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
  drawField();

  if(state==='play'||state==='over'){
    const cl = phase==='rush'? clock : relClock;
    const gk = gkPos(cl);
    // striker
    let sx=YOU.x, sy=YOU.y, slean=0;
    if(phase==='result'&&result==='smothered'){ slean=0.2; }
    person(sx,sy,'#2b6fd6',1.02,slean);

    // keeper (advances; on goal he's beaten/grounded, on early he's tall, on smother he's at feet)
    let gky=gk.y, spread=gk.f;
    if(phase==='result'){ const u=easeOut(anim);
      if(result==='goal'){ gky=gk.y+lerp(0,16,u); spread=1; }
      else if(result==='smothered'){ gky=lerp(gk.y,YOU.y-26,u); spread=1; }
      else { spread=Math.max(0.2,gk.f); }
    }
    keeper(gk.x,gky,spread);

    // ball
    let b, r=8;
    if(phase==='rush'){ b={x:YOU.x, y:YOU.y-16}; }
    else {
      const u=easeOut(anim);
      if(result==='goal'){ // loops over the keeper into the net; higher arc when dinked later
        const arcH=120+quality*70; const tx=GOAL.x+(quality>=0.72? rnd(-40,40):0);
        b={x:lerp(YOU.x,tx,u), y:lerp(YOU.y-16,GOAL.y+GH*0.5,u)-Math.sin(Math.PI*u)*arcH}; r=8-u*1.5;
      } else if(result==='early'){ // chip goes up but keeper (tall) catches it
        b={x:lerp(YOU.x,gk.x,u*0.8), y:lerp(YOU.y-16,gk.y-30,u*0.8)-Math.sin(Math.PI*u*0.8)*70};
      } else { // smothered: keeper on the ball at feet
        b={x:lerp(YOU.x,gk.x,u*0.6), y:lerp(YOU.y-16,YOU.y-26,u*0.6)};
      }
    }
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(b.x,b.y,r,0,6.28);ctx.fill();
    ctx.strokeStyle='#333';ctx.lineWidth=1.1;ctx.beginPath();ctx.arc(b.x,b.y,r,0.4,2.2);ctx.stroke();

    // reward-lateness gauge (how long you've drawn the keeper)
    if(state==='play'){
      const gx=W/2-150, gy=64, gw=300;
      ctx.fillStyle='rgba(255,255,255,0.16)';rr(gx,gy,gw,10,5);ctx.fill();
      // green window region
      const ws=gx+gw*(winStart/(deadT+90)), we=gx+gw*(deadT/(deadT+90));
      ctx.fillStyle='rgba(120,255,150,0.5)';rr(ws,gy,we-ws,10,4);ctx.fill();
      const p=clamp(cl/(deadT+90),0,1);
      ctx.fillStyle=cl<winStart?'#ffd24d':(cl<=deadT?'#8affa0':'#ff5b5b');rr(gx,gy,gw*p,10,5);ctx.fill();
      ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,0.6)';ctx.font='11px sans-serif';ctx.fillText('引きつけ（緑帯でループ！遅らせるほど良い）',W/2,gy-6);
    }

    if(state==='play'&&phase==='rush'){
      ctx.textAlign='center';
      if(clock<winStart){ ctx.fillStyle='rgba(255,220,90,0.95)';ctx.font='bold 21px sans-serif';ctx.fillText('まだ！ GKを引きつけろ…',W/2,40); }
      else { ctx.fillStyle='rgba(140,255,160,0.98)';ctx.font='bold 23px sans-serif';ctx.fillText('今だ！ 頭上へループ！',W/2,40); }
    }
    if(state==='play'){
      ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,0.55)';ctx.font='12px sans-serif';
      ctx.fillText('飛び出すGKを引きつけ、抑えられる寸前にタップ/クリック/SPACE＝頭上へループ（遅らせるほど大量点）',W/2,H-16);
    }
  }

  for(const p of parts){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,3.2,0,6.28);ctx.fill();}
  ctx.globalAlpha=1;
  for(const p of pops){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.font='bold 20px sans-serif';ctx.textAlign='center';ctx.fillText(p.txt,p.x,p.y);}
  ctx.globalAlpha=1;

  // HUD
  ctx.textAlign='left';ctx.fillStyle='#fff';ctx.font='bold 26px sans-serif';ctx.fillText('SCORE '+score,20,36);
  ctx.textAlign='right';ctx.fillStyle='rgba(255,255,255,0.9)';ctx.font='14px sans-serif';ctx.fillText('ゴール '+outs+'  Lv'+lvl,W-20,24);
  ctx.fillText('失敗',W-92,46);
  for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(W-60+i*20,41,7,0,6.28);ctx.fillStyle=i<fails?'#ff5b5b':'rgba(255,255,255,0.25)';ctx.fill();}
  if(combo>=2){ctx.textAlign='center';ctx.fillStyle='#ffd24d';ctx.font='bold 18px sans-serif';ctx.fillText('コンボ x'+combo,W/2,108);}

  if(state==='play'&&phase==='result'&&msg){ctx.textAlign='center';ctx.fillStyle=msgOk?'#9ff0b8':'#ff9a9a';ctx.font='bold 14px sans-serif';ctx.fillText(msg,W/2,268);}

  if(state==='title'){
    ctx.fillStyle='rgba(3,10,6,0.84)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='bold 40px sans-serif';ctx.fillText('頭上を越えろ',W/2,76);
    ctx.fillStyle='#ffd23e';ctx.font='bold 22px sans-serif';ctx.fillText('Dink It Over  ·  #400',W/2,112);
    ctx.fillStyle='rgba(255,255,255,0.92)';ctx.font='16px sans-serif';
    ctx.fillText('GKと1対1——飛び出してくるキーパーを限界まで引きつけ、抑えられる寸前に頭上へループで沈めろ',W/2,166);
    ctx.fillStyle='rgba(255,255,255,0.66)';ctx.font='14px sans-serif';
    ctx.fillText('GKが詰めてくる→抑えられる直前の緑帯でタップ/クリック/SPACE/↑＝繊細なチップでGKの頭上を越える',W/2,206);
    ctx.fillText('引きつける（緑帯の後半で放つ）ほど頭上が大きく空いて大量加点＝“ゴラッソ”のループ',W/2,230);
    ctx.fillText('早い＝まだ立っているGKの正面でキャッチ／引きつけ過ぎ＝足元まで詰められて潰される',W/2,254);
    ctx.fillText('反応の速いGK（tough）ほど窓が短い。上級ほど詰めが速い。3失敗で交代',W/2,278);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で開始',W/2,348);
    ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='14px sans-serif';ctx.fillText('BEST '+best,W/2,380);
  }
  if(state==='over'){
    ctx.fillStyle='rgba(3,10,6,0.86)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#ff6b6b';ctx.font='bold 46px sans-serif';ctx.fillText('3失敗…交代',W/2,222);
    ctx.fillStyle='#fff';ctx.font='bold 40px sans-serif';ctx.fillText('SCORE '+score,W/2,290);
    ctx.fillStyle='rgba(255,255,255,0.85)';ctx.font='19px sans-serif';ctx.fillText('ゴール '+outs+'   BEST '+best,W/2,330);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で もう一度',W/2,402);
  }

  if(flash>0.02){ctx.globalAlpha=flash*0.5;ctx.fillStyle=flashCol;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}
  ctx.restore();

  ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,0.4)';ctx.font='12px sans-serif';
  ctx.fillText('頭上を越えろ：飛び出すGKを引きつけ、抑えられる寸前に頭上へループで沈める。遅らせるほど大量点、早い・粘り過ぎは失敗、3失敗で交代',W/2,H-8);
}

function frame(ts){let dt=ts-last;last=ts;if(dt>60)dt=60;if(dt<0)dt=0;update(dt);render();requestAnimationFrame(frame);}
requestAnimationFrame(frame);

// ---------- test hook ----------
window.__dk={
  start, act:()=>act(),
  get state(){return state;},
  get score(){return score;},
  get outs(){return outs;},
  get fails(){return fails;},
  get info(){return {state,phase,clock,winStart,deadT,win,tough,decided,result,outs,fails,lvl,
    inWindow:(phase==='rush'&&clock>=winStart&&clock<=deadT),canAct:(phase==='rush'&&!decided)};}
};
})();
</script>
</body>
</html>
