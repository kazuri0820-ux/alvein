<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ヒールパス (Backheel Pass)</title>
<style>
  html,body{margin:0;height:100%;background:#07120b;overflow:hidden;
    font-family:-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  #stage{position:relative;width:100vw;height:100vh;max-width:calc(100vh*1.5);max-height:calc(100vw/1.5);aspect-ratio:900/600;}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;border-radius:6px;}
</style>
</head>
<body>
<div id="wrap"><div id="stage"><canvas id="cv"></canvas></div></div>
<script>
(function(){
const W=900,H=600,cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let DPR=1;
function fit(){DPR=Math.min(2,window.devicePixelRatio||1);cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
fit();addEventListener('resize',fit);

// ---------- audio ----------
let AC=null;function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function tone(f,d,type,v,sweep){const a=ac();if(!a)return;const t=a.currentTime,o=a.createOscillator(),g=a.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(sweep)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+sweep),t+d);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v||0.2,t+0.008);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+0.02);}
function noise(d,v,hp){const a=ac();if(!a)return;const t=a.currentTime,n=Math.floor(a.sampleRate*d),buf=a.createBuffer(1,n,a.sampleRate),ch=buf.getChannelData(0);
  for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource();s.buffer=buf;
  const f=a.createBiquadFilter();f.type='highpass';f.frequency.value=hp||600;const g=a.createGain();g.gain.value=v||0.2;
  s.connect(f);f.connect(g);g.connect(a.destination);s.start(t);s.stop(t+d+0.02);}
const S={
  run:()=>{tone(300,0.05,'sine',0.03);},
  heel:()=>{noise(0.05,0.14,700);tone(360,0.06,'triangle',0.07,120);},
  shot:()=>{noise(0.05,0.16,600);tone(300,0.05,'square',0.07,-40);},
  goal:()=>{[620,860,1120].forEach((f,i)=>setTimeout(()=>tone(f,0.11,'triangle',0.16),i*58));},
  big:()=>{[600,800,1000,1250].forEach((f,i)=>setTimeout(()=>tone(f,0.12,'triangle',0.17),i*80));},
  lost:()=>{noise(0.18,0.2,300);tone(160,0.2,'sawtooth',0.12,-40);},
  streak:()=>{[700,930,1170,1400].forEach((f,i)=>setTimeout(()=>tone(f,0.1,'triangle',0.16),i*60));},
  over:()=>{[440,330,247,175].forEach((f,i)=>setTimeout(()=>tone(f,0.3,'triangle',0.2),i*160));}
};

// ---------- geometry ----------
const GOAL={lx:334,rx:566,top:92,mouth:150};
const GKY=124;
const YOU={x:452,y:322};      // you, back to goal, ball at feet
const DEF={x:452,y:242};      // marker in front
const LP={x:344,y:456}, RP={x:560,y:456};   // trailing runner pockets (behind you)
const BTN=[
  {k:'left', x:150,label:'左へ ←',sub:'左に流れた味方へ',col:'#3fc46b'},
  {k:'right',x:520,label:'右へ →',sub:'右に流れた味方へ',col:'#3fc46b'}
];
const BW=230, BY=508, BH=64;

// ---------- state ----------
let state='title', phase='read', plays=0;
let score=0, combo=0, best=+(localStorage.getItem('bh_best')||0);
let outs=0, fails=0, lvl=1;   // outs = assists
let clock=0, revealT=520, callWin=900, finalDir='left', tough=false;
let decided=false, call=null, result=null, resultT=0, msg='', msgOk=false;
let flyU=0;
let shake=0, flash=0, flashCol='#fff', last=performance.now();
let parts=[], pops=[];

function rnd(a,b){return a+Math.random()*(b-a);}
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function lerp(a,b,u){return a+(b-a)*u;}
function easeOut(u){return 1-Math.pow(1-u,2);}
function easeIn(u){return u*u;}

function reset(){state='title';score=0;combo=0;outs=0;fails=0;lvl=1;plays=0;result=null;parts=[];pops=[];}

function newPlay(){
  plays++; lvl=Math.min(7,1+Math.floor(outs/4));
  revealT=clamp(560-lvl*24,360,560);
  callWin=clamp(940-lvl*66,520,940);
  tough=Math.random()<clamp(0.2+lvl*0.05,0.2,0.5);
  if(tough)callWin=Math.round(callWin*0.86);
  finalDir=(Math.random()<0.5?'left':'right');
  phase='read'; clock=0; decided=false; call=null; result=null; resultT=0; msg=''; msgOk=false; flyU=0;
  S.run();
}
function start(){ if(!ac())ac(); if(AC&&AC.state==='suspended')AC.resume(); reset(); state='play'; newPlay(); }

function makeCall(c){
  if(state==='title'){start();return;}
  if(state==='over'){ if(resultT>0.4){reset();start();} return; }
  if(state!=='play'||phase!=='read'||decided) return;
  if(clock<revealT){ decided=true; call=c; resolve('early'); return; }
  decided=true; call=c;
  resolve(c===finalDir?'good':'wrong');
}

function resolve(k){
  phase='result'; result=k; resultT=0; flyU=0;
  if(k==='good'){
    outs++; combo++;
    let add=Math.round((tough?250:150)*(1+Math.min(9,combo-1)*0.14)); score+=add;
    S.heel(); setTimeout(S.shot,340); setTimeout(S.goal,430); if(tough)setTimeout(S.big,520);
    msgOk=true; flash=1;flashCol='#8affa0';shake=5;
    const p=(finalDir==='left')?LP:RP; burst(p.x,p.y,'#8affa0',14,6);
    pop(W/2,250,(tough?'ノールックの絶妙ヒール！ +':'バックヒール成功！ +')+add,'#d6ffe0');
    if(combo>=2)pop(W/2,150,'コンボ x'+combo,'#ffd24d');
    if(combo>0&&combo%5===0)S.streak();
    msg=(finalDir==='left'?'左':'右')+'へ流れた味方の足元へノールックの背面ヒール——走り込みを決めさせた';
  } else {
    fails++; combo=0; msgOk=false; flash=1;shake=8;
    if(k==='early'){ flashCol='#ff5b5b'; S.lost(); msg='早い…味方がどちらへ流れるか見る前に出してマークにカットされた'; pop(W/2,250,'カット…','#ffb0b0'); }
    else { flashCol='#ff5b5b'; S.lost(); msg='逆へ流した…味方がいたのは'+(finalDir==='left'?'左':'右')+'、誰もいない所へ転がした'; pop(W/2,250,'誰もいない…','#ffb0b0'); }
  }
  if(fails>=3){ state='over'; resultT=0; S.over(); if(score>best){best=score;localStorage.setItem('bh_best',best);} }
}

// ---------- input ----------
cv.addEventListener('pointerdown',e=>{e.preventDefault();
  if(state!=='play'||phase!=='read'){ makeCall('left'); return; }
  const r=cv.getBoundingClientRect(); const x=(e.clientX-r.left)/r.width*W, y=(e.clientY-r.top)/r.height*H;
  for(const b of BTN){ if(x>=b.x&&x<=b.x+BW&&y>=BY&&y<=BY+BH){ makeCall(b.k); return; } }
  makeCall(x<W*0.5?'left':'right');
});
addEventListener('keydown',e=>{ if(e.repeat)return;
  if(e.code==='ArrowLeft'||e.code==='KeyA'){e.preventDefault();makeCall('left');}
  else if(e.code==='ArrowRight'||e.code==='KeyD'){e.preventDefault();makeCall('right');}
  else if(e.code==='Space'||e.code==='Enter'){e.preventDefault(); if(state!=='play')makeCall('left');} });

// ---------- particles ----------
function burst(x,y,c,n,sp){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=rnd(sp*0.3,sp);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:1,c});}}
function pop(x,y,txt,c){pops.push({x,y,txt,c,life:1});}

// runner position: approaches centrally, commits to a side at revealT
function runnerPos(){
  const preU=clamp((phase==='read'?clock:revealT)/revealT,0,1);
  const base={x:lerp(452,452,preU), y:lerp(512,486,preU)};
  if((phase==='read'&&clock<revealT)) return base;
  const p=(finalDir==='left')?LP:RP;
  const u=easeOut(clamp(((phase==='read'?clock:revealT+resultT*400)-revealT)/300,0,1));
  return {x:lerp(452,p.x,u), y:lerp(486,p.y,u)};
}

// ---------- update ----------
function update(dt){
  shake*=Math.pow(0.86,dt/16.7); if(shake<0.3)shake=0;
  flash*=Math.pow(0.9,dt/16.7);
  for(const q of parts){q.vx*=0.96;q.vy=q.vy*0.96+0.28;q.x+=q.vx*dt/16.7;q.y+=q.vy*dt/16.7;q.life-=dt/16.7*0.026;}
  parts=parts.filter(q=>q.life>0);
  for(const q of pops){q.y-=dt/16.7*0.5;q.life-=dt/16.7*0.02;}
  pops=pops.filter(q=>q.life>0);

  if(state!=='play'){ if(state==='over')resultT+=dt/1000; return; }
  if(phase==='read'){ clock+=dt;
    if(!decided && clock>revealT+callWin){ decided=true; call=null; resolve('wrong'); }
    return; }
  if(phase==='result'){ resultT+=dt/1000; flyU=Math.min(1,flyU+dt/520);
    if(resultT>1.6) newPlay(); return; }
}

// ---------- render ----------
function drawField(){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#12703f');g.addColorStop(0.5,'#0f5e34');g.addColorStop(1,'#0c4c2b');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  for(let i=0;i<8;i++){ctx.fillStyle=i%2?'rgba(255,255,255,0.03)':'rgba(0,0,0,0.03)';ctx.fillRect(0,i*80,W,80);}
  ctx.strokeStyle='rgba(255,255,255,0.24)';ctx.lineWidth=2;ctx.strokeRect(250,GOAL.mouth,400,250);
}
function drawGoal(){
  ctx.fillStyle='rgba(255,255,255,0.06)';ctx.fillRect(GOAL.lx,GOAL.top,GOAL.rx-GOAL.lx,GOAL.mouth-GOAL.top);
  ctx.strokeStyle='rgba(255,255,255,0.22)';ctx.lineWidth=1;
  for(let x=GOAL.lx+10;x<GOAL.rx;x+=14){ctx.beginPath();ctx.moveTo(x,GOAL.top);ctx.lineTo(x,GOAL.mouth);ctx.stroke();}
  for(let y=GOAL.top+8;y<GOAL.mouth;y+=12){ctx.beginPath();ctx.moveTo(GOAL.lx,y);ctx.lineTo(GOAL.rx,y);ctx.stroke();}
  ctx.strokeStyle='#f4f4f4';ctx.lineWidth=5;
  ctx.beginPath();ctx.moveTo(GOAL.lx,GOAL.mouth);ctx.lineTo(GOAL.lx,GOAL.top);ctx.lineTo(GOAL.rx,GOAL.top);ctx.lineTo(GOAL.rx,GOAL.mouth);ctx.stroke();
}
function person(x,y,col,s){s=s||1;
  ctx.fillStyle=col;ctx.beginPath();ctx.ellipse(x,y-15*s,10*s,15*s,0,0,6.28);ctx.fill();
  ctx.fillStyle='#f0c9a0';ctx.beginPath();ctx.arc(x,y-34*s,7.5*s,0,6.28);ctx.fill();
}

function render(){
  ctx.save();
  if(shake>0)ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
  drawField();
  drawGoal();

  if(state==='play'||state==='over'){
    const revealed=(phase==='read'&&clock>=revealT)||phase==='result';
    // GK
    ctx.fillStyle='#ffd23e';ctx.beginPath();ctx.ellipse(450,GKY,11,16,0,0,6.28);ctx.fill();
    ctx.fillStyle='#f0c9a0';ctx.beginPath();ctx.arc(450,GKY-22,7.5,0,6.28);ctx.fill();
    // defender marking in front
    person(DEF.x,DEF.y,'#d0403a',0.95);
    // trailing runner
    const rp=runnerPos(); person(rp.x,rp.y,'#2b6fd6',0.92);
    if(revealed){ ctx.fillStyle='rgba(150,255,170,0.9)';ctx.font='bold 12px sans-serif';ctx.textAlign='center';ctx.fillText('走り込み',rp.x,rp.y-44); }
    // you (back to goal)
    person(YOU.x,YOU.y,'#1f56b0',0.98);

    // ball
    let bx=YOU.x+10,by=YOU.y-6;
    if(phase==='result'&&result==='good'){
      const p=(finalDir==='left')?LP:RP; const u=easeOut(flyU);
      if(u<0.45){ const uu=u/0.45; bx=lerp(YOU.x+10,p.x,uu); by=lerp(YOU.y-6,p.y-6,uu); }   // backheel to pocket
      else { const uu=(u-0.45)/0.55; const gk=(finalDir==='left')?GOAL.lx+30:GOAL.rx-30;      // runner's shot to goal
        bx=lerp(p.x,gk,uu); by=lerp(p.y-6,GOAL.top+24,uu)-Math.sin(uu*Math.PI)*30; }
    } else if(phase==='result'&&result==='wrong'){
      const p=(finalDir==='left')?RP:LP; const u=easeOut(flyU);   // to the empty side
      bx=lerp(YOU.x+10,p.x,u); by=lerp(YOU.y-6,p.y-6,u);
    } else if(phase==='result'&&result==='early'){
      const u=easeOut(flyU); bx=lerp(YOU.x+10,DEF.x,u); by=lerp(YOU.y-6,DEF.y,u);   // cut by marker
    }
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(bx,by,7.5,0,6.28);ctx.fill();
    ctx.strokeStyle='#222';ctx.lineWidth=1.2;
    ctx.beginPath();ctx.moveTo(bx-6,by-4);ctx.lineTo(bx+2,by-9);ctx.lineTo(bx+7,by-2);ctx.lineTo(bx+3,by+6);ctx.lineTo(bx-6,by+5);ctx.closePath();ctx.stroke();

    // cue banner + timer
    ctx.textAlign='center';
    if(state==='play'&&phase==='read'){
      if(clock<revealT){ ctx.fillStyle='rgba(255,220,90,0.95)';ctx.font='bold 20px sans-serif';ctx.fillText('背後から味方が走り込む！ どちらへ流れるか見極めろ',W/2,52); }
      else { ctx.fillStyle='rgba(150,255,170,0.98)';ctx.font='bold 23px sans-serif';ctx.fillText((finalDir==='left'?'左':'右')+'へ走った！ 背面ヒール！',W/2,52);
        const p=clamp((clock-revealT)/callWin,0,1),bw=250,x=W/2-bw/2,y=64;
        ctx.fillStyle='rgba(255,255,255,0.18)';ctx.fillRect(x,y,bw,7);ctx.fillStyle=p<0.7?'#8affa0':(p<1?'#ffd24d':'#ff5b5b');ctx.fillRect(x,y,bw*p,7); }
    }

    if(state==='play'){
      for(const b of BTN){ const active=phase==='read'&&clock>=revealT;
        ctx.fillStyle=active?b.col:'rgba(255,255,255,0.10)';rr(b.x,BY,BW,BH,10);ctx.fill();
        ctx.fillStyle=active?'#08130c':'rgba(255,255,255,0.5)';ctx.textAlign='center';ctx.font='bold 19px sans-serif';ctx.fillText(b.label,b.x+BW/2,BY+27);
        ctx.font='11px sans-serif';ctx.fillText(b.sub,b.x+BW/2,BY+47); }
      ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='12px sans-serif';ctx.textAlign='center';ctx.fillText('タップ / ←=左 ・ →=右 へバックヒール',W/2,BY+BH+18);
    }
  }

  for(const q of parts){ctx.globalAlpha=Math.max(0,q.life);ctx.fillStyle=q.c;ctx.beginPath();ctx.arc(q.x,q.y,3.2,0,6.28);ctx.fill();}
  ctx.globalAlpha=1;
  for(const q of pops){ctx.globalAlpha=Math.max(0,q.life);ctx.fillStyle=q.c;ctx.font='bold 21px sans-serif';ctx.textAlign='center';ctx.fillText(q.txt,q.x,q.y);}
  ctx.globalAlpha=1;

  // HUD
  ctx.textAlign='left';ctx.fillStyle='#fff';ctx.font='bold 26px sans-serif';ctx.fillText('SCORE '+score,20,36);
  ctx.textAlign='right';ctx.fillStyle='rgba(255,255,255,0.9)';ctx.font='14px sans-serif';ctx.fillText('アシスト '+outs+'  Lv'+lvl,W-20,24);
  ctx.fillText('ロスト',W-98,46);
  for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(W-60+i*20,41,7,0,6.28);ctx.fillStyle=i<fails?'#ff5b5b':'rgba(255,255,255,0.25)';ctx.fill();}
  if(combo>=2){ctx.textAlign='center';ctx.fillStyle='#ffd24d';ctx.font='bold 18px sans-serif';ctx.fillText('コンボ x'+combo,W/2,108);}

  if(state==='play'&&phase==='result'&&msg){ctx.textAlign='center';ctx.fillStyle=msgOk?'#9ff0b8':'#ff9a9a';ctx.font='bold 16px sans-serif';ctx.fillText(msg,W/2,474);}

  if(state==='title'){
    ctx.fillStyle='rgba(4,10,7,0.83)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='bold 42px sans-serif';ctx.fillText('ヒールパス',W/2,86);
    ctx.fillStyle='#ffd23e';ctx.font='bold 22px sans-serif';ctx.fillText('Backheel Pass',W/2,122);
    ctx.fillStyle='rgba(255,255,255,0.92)';ctx.font='16px sans-serif';
    ctx.fillText('ゴールに背を向けたあなたの背後へ味方が走り込む。流れた側へノールックの背面ヒールで通せ',W/2,182);
    ctx.fillStyle='rgba(255,255,255,0.66)';ctx.font='14px sans-serif';
    ctx.fillText('走り込む味方が左右どちらへ流れるかを見極め→その側へバックヒール（左＝←/画面左・右＝→/画面右）',W/2,220);
    ctx.fillText('流れる前に出す＝マークに読まれてカット、逆へ流すと誰もいない所へ、際どいノールックは大量加点',W/2,244);
    ctx.fillText('味方の走り込みを見てから素早く決めるのがコツ。上級ほど走り込みが速く猶予も短い',W/2,268);
    ctx.fillText('3ロストで交代',W/2,292);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で開始',W/2,360);
    ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='14px sans-serif';ctx.fillText('BEST '+best,W/2,392);
  }
  if(state==='over'){
    ctx.fillStyle='rgba(4,10,7,0.85)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#ff6b6b';ctx.font='bold 46px sans-serif';ctx.fillText('3ロスト…交代',W/2,222);
    ctx.fillStyle='#fff';ctx.font='bold 40px sans-serif';ctx.fillText('SCORE '+score,W/2,290);
    ctx.fillStyle='rgba(255,255,255,0.85)';ctx.font='19px sans-serif';ctx.fillText('アシスト '+outs+'   BEST '+best,W/2,330);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で もう一度',W/2,402);
  }

  if(flash>0.02){ctx.globalAlpha=flash*0.5;ctx.fillStyle=flashCol;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}
  ctx.restore();

  ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,0.4)';ctx.font='12px sans-serif';
  ctx.fillText('ヒールパス：背後に走り込む味方が流れた側へ背面ヒールで通す。早出し＝カット/逆へ流すは失敗、3ロストで交代',W/2,H-8);
}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

function frame(ts){let dt=ts-last;last=ts;if(dt>60)dt=60;if(dt<0)dt=0;update(dt);render();requestAnimationFrame(frame);}
requestAnimationFrame(frame);

// ---------- test hook ----------
window.__bh={
  start, makeCall:(c)=>makeCall(c),
  get state(){return state;},
  get score(){return score;},
  get outs(){return outs;},
  get fails(){return fails;},
  get info(){return {state,phase,clock,revealT,callWin,finalDir,tough,decided,call,result,outs,fails,lvl,
    revealed:(clock>=revealT),correctCall:finalDir,canAct:(phase==='read'&&!decided)};}
};
})();
</script>
</body>
</html>
