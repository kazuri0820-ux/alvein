<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>どっちの裏か (Read the Gap)</title>
<style>
  html,body{margin:0;padding:0;background:#07130c;overflow:hidden;font-family:'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif;-webkit-user-select:none;user-select:none;touch-action:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 26%,#123a20,#050d07 72%);}
  #stage{position:relative;width:min(100vw,calc(100vh*1.5));aspect-ratio:900/600;max-width:900px;box-shadow:0 10px 60px rgba(0,0,0,.6);border-radius:8px;overflow:hidden;}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;}
</style>
</head>
<body>
<div id="wrap"><div id="stage"><canvas id="cv"></canvas></div></div>
<script>
(function(){
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const W=900,H=600;let DPR=Math.min(2,window.devicePixelRatio||1);
function fit(){const r=cv.getBoundingClientRect();DPR=Math.min(2,window.devicePixelRatio||1);cv.width=Math.round(r.width*DPR);cv.height=Math.round(r.height*DPR);ctx.setTransform(cv.width/W,0,0,cv.height/H,0,0);}
new ResizeObserver(fit).observe(cv);fit();

// ---------- audio ----------
let AC=null;function actx(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function tone(f,d,type,v,sweep){const a=actx();if(!a)return;const o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.value=f;if(sweep)o.frequency.linearRampToValueAtTime(sweep,a.currentTime+d);g.gain.value=0.0001;g.gain.exponentialRampToValueAtTime(v||0.2,a.currentTime+0.008);g.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+d);o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+d+0.02);}
function noise(d,v,hp){const a=actx();if(!a)return;const n=a.createBufferSource(),b=a.createBuffer(1,a.sampleRate*d,a.sampleRate),dt=b.getChannelData(0);for(let i=0;i<dt.length;i++)dt[i]=Math.random()*2-1;n.buffer=b;const f=a.createBiquadFilter();f.type='highpass';f.frequency.value=hp||800;const g=a.createGain();g.gain.value=0.0001;g.gain.exponentialRampToValueAtTime(v||0.2,a.currentTime+0.01);g.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+d);n.connect(f);f.connect(g);g.connect(a.destination);n.start();n.stop(a.currentTime+d+0.02);}
const S={
  thread(){tone(600,0.09,'sine',0.12,820);noise(0.03,0.05,700);},
  step(){noise(0.05,0.16,600);tone(240,0.07,'square',0.1,140);},
  goal(){tone(520,0.1,'triangle',0.2);setTimeout(function(){tone(760,0.14,'triangle',0.22);},110);setTimeout(function(){tone(1000,0.2,'triangle',0.22);},230);},
  roar(){noise(0.5,0.14,300);},
  fail(){tone(300,0.3,'sawtooth',0.16,150);setTimeout(function(){tone(190,0.4,'sawtooth',0.14,110);},150);},
  flag(){tone(1500,0.1,'square',0.12);setTimeout(function(){tone(1500,0.1,'square',0.12);},150);},
  combo(n){tone(600+Math.min(n,8)*70,0.12,'triangle',0.16);},
  over(){tone(330,0.3,'sine',0.2,160);setTimeout(function(){tone(220,0.5,'sine',0.2,110);},180);},
  start(){tone(440,0.1,'triangle',0.18);setTimeout(function(){tone(660,0.16,'triangle',0.2);},110);},
};

function clamp(v,a,b){return v<a?a:v>b?b:v;}
function rnd(a,b){return a+Math.random()*(b-a);}

// ---------- state ----------
// NOTE: internally 'near' = LEFT channel, 'far' = RIGHT channel (labels kept for the shared read+dir scaffold; UI shows 左/右).
let state='title';
let outs=0,fails=0,score=0,combo=0,lvl=1;   // outs = breakaways scored
let best=0;try{best=parseInt(localStorage.getItem('rg_best')||'0')||0;}catch(e){}
const TARGET=26;

let phase='wind';  // wind | watch | result
let pt=0, clock=0;
let revealT=500, callWin=1000, tough=false, truth='near'; // which channel the through-ball splits
let decided=false, result='', called='';
const LGAP=300, RGAP=600, LINEY=300;   // left/right channels, defensive-line y
const GOALY=150, GTOP=64, GLINE=150;
const PASSER=[450,486], STRIKER0=[450,392];
let ballX=450,ballY=486, runU=0;
let parts=[];
let shakeT=0,flash=0;
let msg='',msgCol='#fff',msgT=0;
let lastAdd=0;

function reset(){outs=0;fails=0;score=0;combo=0;lvl=1;parts=[];}
function newBall(){
  lvl=Math.min(7,1+Math.floor(outs/4));
  revealT=clamp(560-lvl*24,360,560);
  callWin=clamp(1020-lvl*70,560,1020);
  tough=Math.random()<clamp(0.2+lvl*0.05,0.2,0.5);
  truth=Math.random()<0.5?'near':'far';
  phase='wind';pt=0;clock=0;decided=false;result='';called='';
  ballX=PASSER[0];ballY=PASSER[1];runU=0;
}
function startGame(){reset();state='play';newBall();S.start();}

function burst(x,y,col,n,sp){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=rnd(0.4,1)*(sp||3);parts.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:1,col:col,r:rnd(2,5)});}}

function tx(){return truth==='near'?LGAP:RGAP;}
function cx(){return called==='near'?LGAP:RGAP;}

function resolve(kind){
  decided=true;result=kind;runU=0;
  if(kind==='right'){
    outs++;combo++;
    const cm=1+Math.min(combo-1,6)*0.13;
    const add=Math.round((100+(tough?60:0))*cm)*Math.max(1,lvl);
    score+=add;lastAdd=add;
    S.step();setTimeout(S.goal,180);setTimeout(S.roar,260);if(combo>1)setTimeout(function(){S.combo(combo);},360);
    flash=0.26;burst(tx(),LINEY-30,'#5affa0',13,3.2);
    msg='読み勝ち！ '+(truth==='near'?'左の裏を取って抜け出した！':'右の裏を取って抜け出した！')+'  +'+add;msgCol='#5affa0';msgT=1;
  }else{
    combo=0;fails++;
    if(result==='early'){S.flag();}else{S.fail();}
    flash=0.32;shakeT=0.6;
    if(result==='early')msg='飛び出しが早い！ オフサイドの旗';
    else if(result==='late')msg='反応が遅い！ 戻ったDFにカットされた';
    else msg='読み違い！ 逆の裏へ出たボールに追いつけず';
    msgCol='#ff6a6a';msgT=1;
  }
  phase='result';pt=0;
}

function makeCall(c){
  if(state!=='play'||phase!=='watch'||decided)return;
  called=c;
  if(clock<revealT){resolve('early');return;}
  const correct=(c===truth);
  resolve(correct?'right':'wrong');
}

// ---------- input ----------
function actL(){if(!AC)actx();if(state==='title'){startGame();return;}if(state==='over'){startGame();return;}makeCall('near');}
function actR(){if(!AC)actx();if(state==='title'){startGame();return;}if(state==='over'){startGame();return;}makeCall('far');}
cv.addEventListener('mousedown',function(e){e.preventDefault();
  if(state!=='play'){actL();return;}
  const r=cv.getBoundingClientRect();const x=(e.clientX-r.left)/r.width*W;
  if(x<450)actL();else actR();
});
cv.addEventListener('touchstart',function(e){e.preventDefault();
  if(state!=='play'){actL();return;}
  const r=cv.getBoundingClientRect();const t=e.changedTouches[0];const x=(t.clientX-r.left)/r.width*W;
  if(x<450)actL();else actR();
},{passive:false});
window.addEventListener('keydown',function(e){
  if(e.code==='ArrowLeft'||e.code==='KeyA'){e.preventDefault();actL();}
  else if(e.code==='ArrowRight'||e.code==='KeyD'){e.preventDefault();actR();}
  else if(e.code==='Space'||e.code==='Enter'){e.preventDefault();if(state!=='play')actL();}
});

// ---------- update ----------
let last=0;
function update(dt){
  if(flash>0)flash=Math.max(0,flash-dt/300);
  if(shakeT>0)shakeT=Math.max(0,shakeT-dt/320);
  if(msgT>0)msgT=Math.max(0,msgT-dt/1500);
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.x+=p.vx;p.y+=p.vy;p.vy+=0.16;p.life-=dt/640;if(p.life<=0)parts.splice(i,1);}
  if(state!=='play')return;
  pt+=dt;
  if(phase==='wind'){
    if(pt>=440){phase='watch';pt=0;clock=0;S.thread();}
  }else if(phase==='watch'){
    clock+=dt;
    // through-ball is threaded from the passer up into a channel behind the line
    const u=clamp(clock/(revealT+callWin*0.5),0,1);
    const ex=tx();
    // before reveal the ball tracks up the middle, then breaks to the channel
    const bx=(clock<revealT)?PASSER[0]:PASSER[0]+(ex-PASSER[0])*clamp((clock-revealT)/(callWin*0.5),0,1);
    ballX=bx; ballY=PASSER[1]+(LINEY-40-PASSER[1])*u;
    if(clock>=revealT+callWin&&!decided)resolve('late');
  }else if(phase==='result'){
    runU=Math.min(1,runU+dt/300);
    if(result==='right'){ ballX=tx()+(450-tx())*runU*0.4; ballY=(LINEY-40)-runU*((LINEY-40)-(GTOP+30)); }   // onto the ball, in on goal
    else if(result==='wrong'){ ballX=tx(); ballY=(LINEY-40)-runU*40; }   // ball ran into the empty channel
    else if(result==='late'){ ballX=tx()+runU*(tx()<450?60:-60); ballY=(LINEY-30); }   // DF cuts it out
    else { ballX=PASSER[0]; ballY=PASSER[1]-runU*20; }   // early/offside: pass not yet on
    if(result==='right'&&runU<0.6&&Math.random()<0.2)burst(ballX,ballY,'#cfe',1,1.4);
    if(pt>=1120){
      if(fails>=3){state='over';best=Math.max(best,score);try{localStorage.setItem('rg_best',String(best));}catch(e){}S.over();}
      else if(outs>=TARGET){state='over';best=Math.max(best,score);try{localStorage.setItem('rg_best',String(best));}catch(e){}S.goal();}
      else newBall();
    }
  }
}

// ---------- render ----------
function roundRect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

const GL=330, GR=570;
function drawField(){
  for(let i=0;i<9;i++){ctx.fillStyle=i%2?'#2b6b3d':'#256036';ctx.fillRect(0,i*(H/9),W,H/9);}
  // goal at top
  ctx.fillStyle='rgba(255,255,255,.06)';ctx.fillRect(GL,GTOP,GR-GL,GLINE-GTOP);
  ctx.strokeStyle='rgba(255,255,255,.18)';ctx.lineWidth=1;
  for(let x=GL;x<=GR;x+=15){ctx.beginPath();ctx.moveTo(x,GTOP);ctx.lineTo(x,GLINE);ctx.stroke();}
  for(let y=GTOP+10;y<GLINE;y+=13){ctx.beginPath();ctx.moveTo(GL,y);ctx.lineTo(GR,y);ctx.stroke();}
  ctx.fillStyle='#f2f2f2';ctx.fillRect(GL-7,GTOP-6,7,GLINE-GTOP+8);ctx.fillRect(GR,GTOP-6,7,GLINE-GTOP+8);ctx.fillRect(GL-7,GTOP-6,GR-GL+14,7);
  ctx.fillStyle='#fff';ctx.fillRect(GL-7,GLINE,GR-GL+14,4);
  // defensive line (dashed) with the two channels marked
  ctx.strokeStyle='rgba(255,225,120,.5)';ctx.setLineDash([12,9]);ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(0,LINEY);ctx.lineTo(W,LINEY);ctx.stroke();ctx.setLineDash([]);
  ctx.fillStyle='rgba(255,225,120,.7)';ctx.font='bold 12px sans-serif';ctx.textAlign='left';ctx.fillText('最終ライン',12,LINEY-6);
  ctx.fillStyle='rgba(255,255,255,.5)';ctx.font='bold 13px sans-serif';ctx.textAlign='center';
  ctx.fillText('左の裏',LGAP,LINEY+22);ctx.fillText('右の裏',RGAP,LINEY+22);
}

function person(x,y,col,glow,lean){
  ctx.save();ctx.translate(x,y);if(lean)ctx.rotate(lean);
  if(glow>0){ctx.strokeStyle='rgba(90,255,160,'+glow+')';ctx.lineWidth=4;ctx.beginPath();ctx.arc(0,-20,28,0,Math.PI*2);ctx.stroke();}
  ctx.fillStyle='rgba(0,0,0,.26)';ctx.beginPath();ctx.ellipse(0,4,15,5,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#222';ctx.fillRect(-8,-4,7,22);ctx.fillRect(1,-4,7,22);
  ctx.fillStyle=col;ctx.fillRect(-12,-32,24,30);
  ctx.fillStyle='#f0c9a0';ctx.beginPath();ctx.arc(0,-42,9,0,Math.PI*2);ctx.fill();
  ctx.restore();
}

function drawScene(){
  drawField();
  // keeper
  person(450,GTOP+52,'#e9d84a',0,0);
  // two center-backs on the line, leaving the wide channels
  person(402,LINEY,'#c0343a',0,0);person(498,LINEY,'#c0343a',0,0);
  // a covering fullback that recovers into the threatened channel on a late run
  if(phase==='result'&&result==='late'){person(tx(),LINEY-10,'#c0343a',0,0);}
  // passer (teammate)
  let plean=(phase==='watch'&&clock<revealT)?-0.15:0;
  person(PASSER[0],PASSER[1],'#2f6fd0',0,plean);
  // you (striker): drift, then burst to the called channel
  let sx=STRIKER0[0],sy=STRIKER0[1];
  if(phase==='watch'&&clock>=revealT&&called){ }   // still central until a call
  if(decided&&result!=='early'){ const gx=cx(); sx=STRIKER0[0]+(gx-STRIKER0[0])*clamp(runU,0,1); sy=STRIKER0[1]+((LINEY-24)-STRIKER0[1])*clamp(runU,0,1); }
  else if(result==='early'){ sx=STRIKER0[0]+(cx()-STRIKER0[0])*0.5*clamp(runU,0,1); sy=LINEY-30-runU*20; }   // beyond the line (offside)
  const srun=(phase==='watch'&&clock>=revealT&&!decided);
  person(sx,sy,'#e8d24a',srun?0.9:0,0);
  // ball
  ctx.fillStyle='rgba(0,0,0,.2)';ctx.beginPath();ctx.ellipse(ballX,ballY+7,7,3,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(ballX,ballY,7,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='rgba(0,0,0,.35)';ctx.lineWidth=1.2;ctx.stroke();
  // offside flag
  if(phase==='result'&&result==='early'){
    ctx.save();ctx.translate(sx+22,sy-58);
    ctx.strokeStyle='#eee';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(0,-40);ctx.stroke();
    ctx.fillStyle='#ffcf3a';ctx.beginPath();ctx.moveTo(0,-40);ctx.lineTo(26,-32);ctx.lineTo(0,-24);ctx.closePath();ctx.fill();
    ctx.restore();
  }
}

function drawReveal(){
  if(!(phase==='watch'&&clock>=revealT&&!decided))return;
  ctx.textAlign='center';ctx.font='bold 25px sans-serif';ctx.fillStyle='#ffd27a';
  ctx.fillText(truth==='near'?'左の裏へ通った！':'右の裏へ通った！',450,44);
  const ex=tx();
  ctx.strokeStyle='#ffd27a';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(450,LINEY-70);ctx.lineTo(ex,LINEY-70);ctx.stroke();
  ctx.fillStyle='#ffd27a';ctx.beginPath();const d=(ex<450)?-1:1;ctx.moveTo(ex,LINEY-70);ctx.lineTo(ex-d*12,LINEY-78);ctx.lineTo(ex-d*12,LINEY-62);ctx.closePath();ctx.fill();
}

function drawButtons(){
  if(state!=='play')return;
  const active=(phase==='watch'&&!decided&&clock>=revealT);
  ctx.globalAlpha=active?1:0.5;
  roundRect(70,520,320,64,12);ctx.fillStyle=(called==='near')?'#2f7db0':'rgba(30,90,140,.72)';ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,.5)';ctx.lineWidth=2;ctx.stroke();
  roundRect(510,520,320,64,12);ctx.fillStyle=(called==='far')?'#2f9d5a':'rgba(40,140,80,.72)';ctx.fill();ctx.stroke();
  ctx.globalAlpha=1;
  ctx.textAlign='center';
  ctx.fillStyle='#bfe0ff';ctx.font='bold 24px sans-serif';ctx.fillText('左へ抜ける',230,550);
  ctx.font='12px sans-serif';ctx.fillStyle='#a0c0e0';ctx.fillText('左の裏へ　← / A',230,572);
  ctx.fillStyle='#d5ffe2';ctx.font='bold 24px sans-serif';ctx.fillText('右へ抜ける',670,550);
  ctx.font='12px sans-serif';ctx.fillStyle='#b0e0c0';ctx.fillText('右の裏へ　→ / D',670,572);
}

function drawHUD(){
  ctx.textAlign='left';ctx.textBaseline='alphabetic';
  ctx.font='bold 20px sans-serif';ctx.fillStyle='#fff';
  ctx.fillText('抜け出し '+outs+' / '+TARGET,20,32);
  ctx.font='14px sans-serif';ctx.fillStyle='#ffb14a';ctx.fillText('失敗 '+fails+' / 3',20,54);
  ctx.textAlign='right';
  ctx.font='bold 20px sans-serif';ctx.fillStyle='#ffe08a';ctx.fillText('SCORE '+score,W-20,32);
  ctx.font='13px sans-serif';ctx.fillStyle='#bfe';ctx.fillText('BEST '+Math.max(best,score)+'   Lv.'+lvl,W-20,52);
  if(combo>1){ctx.textAlign='center';ctx.font='bold 20px sans-serif';ctx.fillStyle='#5affa0';ctx.fillText(combo+' 連続抜け出し!',450,84);}
  if(phase==='watch'&&!decided&&clock<revealT){ctx.textAlign='center';ctx.font='bold 15px sans-serif';ctx.fillStyle='#ffe08a';ctx.fillText('スルーパスが出る！ どちらの裏へ通るか読め',450,112);}
}

function drawMsg(){
  if(msgT<=0)return;
  ctx.save();ctx.globalAlpha=clamp(msgT*1.4,0,1);
  ctx.textAlign='center';ctx.font='bold 24px sans-serif';
  ctx.fillStyle='rgba(0,0,0,.6)';roundRect(450-300,436,600,42,10);ctx.fill();
  ctx.fillStyle=msgCol;ctx.fillText(msg,450,464);
  ctx.restore();
}

function drawTitle(){
  drawField();person(450,GTOP+52,'#e9d84a',0,0);person(402,LINEY,'#c0343a',0,0);person(498,LINEY,'#c0343a',0,0);person(STRIKER0[0],STRIKER0[1],'#e8d24a',0,0);person(PASSER[0],PASSER[1],'#2f6fd0',0,0);
  ctx.save();ctx.textAlign='center';
  ctx.fillStyle='rgba(0,0,0,.68)';roundRect(96,96,708,404,16);ctx.fill();
  ctx.fillStyle='#fff';ctx.font='bold 34px sans-serif';ctx.fillText('どっちの裏か',450,152);
  ctx.font='18px sans-serif';ctx.fillStyle='#9fe0bf';ctx.fillText('Read the Gap',450,182);
  ctx.font='16px sans-serif';ctx.fillStyle='#e6fcef';
  const lines=[
    'あなたはストライカー。味方が最終ラインの裏へスルーパス！',
    'ボールが「左の裏」か「右の裏」どちらのチャンネルに通るかを',
    '一瞬で読み、そのサイドへ飛び出してボールに追いつき抜け出せ！',
    'パスが通った瞬間、そのサイドへ走り出せ。',
    'パス前の飛び出し＝オフサイド、逆サイドへ走る＝好機逸、遅い＝カット。',
    '左半分/← = 左の裏、右半分/→ = 右の裏。3失敗で終了。',
  ];
  for(let i=0;i<lines.length;i++)ctx.fillText(lines[i],450,226+i*30);
  ctx.fillStyle='#ffe08a';ctx.font='bold 22px sans-serif';
  ctx.fillText('タップ / キーでスタート',450,480);
  ctx.restore();
}

function drawOver(){
  drawField();
  ctx.save();ctx.textAlign='center';
  ctx.fillStyle='rgba(0,0,0,.68)';roundRect(190,150,520,300,16);ctx.fill();
  const w2=outs>=TARGET;
  ctx.fillStyle=w2?'#5affa0':'#ff8a5a';ctx.font='bold 34px sans-serif';
  ctx.fillText(w2?'裏抜けの名手！':'裏を取れず…',450,222);
  ctx.fillStyle='#fff';ctx.font='20px sans-serif';
  ctx.fillText('抜け出し '+outs+' / '+TARGET,450,270);
  ctx.fillText('スコア '+score,450,304);
  ctx.fillStyle='#ffe08a';ctx.fillText('ベスト '+Math.max(best,score),450,336);
  ctx.fillStyle='#9fe0bf';ctx.font='bold 20px sans-serif';
  ctx.fillText('タップ / キー でもう一度',450,404);
  ctx.restore();
}

function render(){
  ctx.save();
  if(shakeT>0){const s=shakeT*7;ctx.translate(rnd(-s,s),rnd(-s,s));}
  if(state==='title'){drawTitle();}
  else if(state==='over'){drawOver();}
  else{
    drawScene();
    drawReveal();
    drawButtons();
    drawHUD();
    drawMsg();
  }
  for(const p of parts){ctx.globalAlpha=clamp(p.life,0,1);ctx.fillStyle=p.col;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();}
  ctx.globalAlpha=1;
  ctx.restore();
  if(flash>0){ctx.fillStyle='rgba(255,255,255,'+(flash*0.5)+')';ctx.fillRect(0,0,W,H);}
}

function frame(ts){let dt=ts-last;last=ts;if(dt>60)dt=60;if(dt<0)dt=0;update(dt);render();requestAnimationFrame(frame);}
requestAnimationFrame(frame);

// ---------- test hook ----------
window.__rg={
  start:startGame,
  near:function(){makeCall('near');},   // near = LEFT channel
  far:function(){makeCall('far');},     // far  = RIGHT channel
  get state(){return state;},
  get outs(){return outs;},
  get fails(){return fails;},
  get score(){return score;},
  get info(){return {state:state,phase:phase,clock:clock,revealT:revealT,callWin:callWin,tough:tough,decided:decided,result:result,called:called,truth:truth,outs:outs,fails:fails,lvl:lvl,isNear:(truth==='near'),revealed:(clock>=revealT),canAct:(state==='play'&&phase==='watch'&&!decided)};}
};
})();
</script>
