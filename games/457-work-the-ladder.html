<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>高低で仕留めろ (Work the Ladder)</title>
<style>
  html,body{margin:0;padding:0;background:#0a1016;overflow:hidden;font-family:'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif;-webkit-user-select:none;user-select:none;touch-action:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 26%,#20364a,#060a12 72%);}
  #stage{position:relative;width:min(100vw,calc(100vh*1.5));aspect-ratio:900/600;max-width:900px;box-shadow:0 10px 60px rgba(0,0,0,.6);border-radius:8px;overflow:hidden;}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;}
</style>
</head>
<body>
<div id="wrap"><div id="stage"><canvas id="cv"></canvas></div></div>
<script>
(function(){
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const W=900,H=600;let DPR=Math.min(2,window.devicePixelRatio||1);
function fit(){const r=cv.getBoundingClientRect();DPR=Math.min(2,window.devicePixelRatio||1);cv.width=Math.round(r.width*DPR);cv.height=Math.round(r.height*DPR);ctx.setTransform(cv.width/W,0,0,cv.height/H,0,0);}
new ResizeObserver(fit).observe(cv);fit();

// ---------- audio ----------
let AC=null;function actx(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function tone(f,d,type,v,sweep){const a=actx();if(!a)return;const o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.value=f;if(sweep)o.frequency.linearRampToValueAtTime(sweep,a.currentTime+d);g.gain.value=0.0001;g.gain.exponentialRampToValueAtTime(v||0.2,a.currentTime+0.008);g.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+d);o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+d+0.02);}
function noise(d,v,hp){const a=actx();if(!a)return;const n=a.createBufferSource(),b=a.createBuffer(1,a.sampleRate*d,a.sampleRate),dt=b.getChannelData(0);for(let i=0;i<dt.length;i++)dt[i]=Math.random()*2-1;n.buffer=b;const f=a.createBiquadFilter();f.type='highpass';f.frequency.value=hp||800;const g=a.createGain();g.gain.value=0.0001;g.gain.exponentialRampToValueAtTime(v||0.2,a.currentTime+0.01);g.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+d);n.connect(f);f.connect(g);g.connect(a.destination);n.start();n.stop(a.currentTime+d+0.02);}
const S={
  tick(){tone(660,0.04,'sine',0.045);},
  mitt(){noise(0.05,0.24,900);tone(300,0.06,'square',0.14);},          // into the mitt
  whiff(){noise(0.14,0.18,1000);tone(300,0.14,'sawtooth',0.1,180);},   // swings and misses
  strike(){tone(680,0.09,'triangle',0.18);setTimeout(function(){tone(960,0.12,'triangle',0.2);},80);},
  roar(){noise(0.5,0.14,300);},
  crack(){noise(0.06,0.28,600);tone(230,0.1,'square',0.16,110);},      // fat pitch crushed
  ball(){tone(300,0.16,'sawtooth',0.12,200);},                         // out of the zone = ball
  combo(n){tone(560+Math.min(n,8)*70,0.12,'triangle',0.16);},
  over(){tone(330,0.3,'sine',0.2,160);setTimeout(function(){tone(220,0.5,'sine',0.2,110);},180);},
  start(){tone(440,0.1,'triangle',0.18);setTimeout(function(){tone(660,0.16,'triangle',0.2);},110);},
};

function clamp(v,a,b){return v<a?a:v>b?b:v;}
function rnd(a,b){return a+Math.random()*(b-a);}

// ---------- state ----------
let state='title';
let outs=0,fails=0,score=0,combo=0,lvl=1;   // outs = put-aways (fooled the batter with location)
let best=0;try{best=parseInt(localStorage.getItem('ld_best')||'0')||0;}catch(e){}
const TARGET=26;

let phase='wind';  // wind | aim(height meter sweeps) | result
let pt=0, swp=0;
let period=1400, bandW=0.24, bandC=0.5, deadT=3000, tough=false, highTarget=true;
let pos=0;
let decided=false, result='', stopPos=0, quality=0, lastAdd=0;
let parts=[];
let shakeT=0,flash=0;
let msg='',msgCol='#fff',msgT=0;
let ballU=0, endY=334;
// scene
const PITCHER=[470,116];
const ZX=470, ZTOP=238, ZW=150, ZH=190;   // strike zone box
const ZBOT=ZTOP+ZH, ZMID=ZTOP+ZH/2;
// height meter (vertical, left)
const MX=54, MW=30, MTOP=132, MBOT=474;
function meterY(p){return MBOT+(MTOP-MBOT)*clamp(p,0,1);}   // p=1 top (high) ... p=0 bottom (low)
function zoneY(p){return ZTOP+ZH*(1-clamp(p,0,1));}          // pitch height in the zone

function reset(){outs=0;fails=0;score=0;combo=0;lvl=1;parts=[];}
function newPitch(){
  lvl=Math.min(7,1+Math.floor(outs/4));
  period=clamp(1560-lvl*110,860,1560);
  tough=Math.random()<clamp(0.2+lvl*0.05,0.2,0.5);
  bandW=clamp(0.26-lvl*0.02,0.12,0.26)*(tough?0.8:1);
  highTarget=Math.random()<0.5;                       // the catcher sets up high or low — climb the ladder
  bandC=highTarget?rnd(0.66,0.80):rnd(0.20,0.34);
  deadT=clamp(3200-lvl*180,1900,3200);
  phase='wind';pt=0;swp=0;pos=0;decided=false;result='';stopPos=0;quality=0;ballU=0;endY=zoneY(bandC);
}
function startGame(){reset();state='play';newPitch();S.start();}

function burst(x,y,col,n,sp){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=rnd(0.4,1)*(sp||3);parts.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:1,col:col,r:rnd(2,5)});}}

function resolve(kind){
  decided=true;stopPos=pos;ballU=0;
  if(kind==='strike'){
    result='strike';outs++;combo++;
    endY=zoneY(pos);
    const half=bandW/2;quality=clamp(1-Math.abs(pos-bandC)/half,0,1);
    const cm=1+Math.min(combo-1,6)*0.14;
    const add=Math.round((100+quality*130)*cm)*Math.max(1,lvl);
    score+=add;lastAdd=add;
    S.mitt();setTimeout(S.whiff,40);setTimeout(S.strike,120);setTimeout(S.roar,320);if(combo>1)setTimeout(function(){S.combo(combo);},500);
    flash=0.26;
    if(highTarget)msg=(quality>0.7?'ズバッ！ 高めの釣り球で空振り！':'高めいっぱい！ 目線を上げて空振り！')+'  +'+add;
    else msg=(quality>0.7?'ズバッ！ 低めいっぱいで泳がせて打ち取った！':'低めに集めて打ち取った！')+'  +'+add;
    msgCol='#5affa0';msgT=1;
  }else if(kind==='take'){
    result='fat';combo=0;fails++;S.crack();flash=0.32;shakeT=0.6;endY=zoneY(0.5);
    msg='置きにいった！ 甘く入って痛打';msgCol='#ff6a6a';msgT=1;
  }else{ // miss
    combo=0;fails++;flash=0.3;shakeT=0.5;
    const towardMiddle=highTarget?(pos<bandC):(pos>bandC);
    if(towardMiddle){result='fat';endY=zoneY(0.5);setTimeout(S.crack,90);msg='甘く入った！ 真ん中で痛打';}
    else{result='ball';endY=highTarget?(ZTOP-22):(ZBOT+22);setTimeout(S.ball,90);msg=highTarget?'高めに抜けた！ ボール':'低すぎてワンバウンド！ ボール';}
    msgCol='#ff6a6a';msgT=1;
  }
  phase='result';pt=0;
}

function swing(){
  if(state!=='play'||phase!=='aim'||decided)return;
  const half=bandW/2;
  if(Math.abs(pos-bandC)<=half)resolve('strike');
  else resolve('miss');
}

// ---------- input ----------
function act(){if(!AC)actx();if(state==='title'){startGame();return;}if(state==='over'){startGame();return;}swing();}
cv.addEventListener('mousedown',function(e){e.preventDefault();act();});
cv.addEventListener('touchstart',function(e){e.preventDefault();act();},{passive:false});
window.addEventListener('keydown',function(e){
  if(e.code==='Space'||e.code==='ArrowUp'||e.code==='Enter'||e.code==='KeyK'){e.preventDefault();act();}
});

// ---------- update ----------
let last=0;
function update(dt){
  if(flash>0)flash=Math.max(0,flash-dt/300);
  if(shakeT>0)shakeT=Math.max(0,shakeT-dt/320);
  if(msgT>0)msgT=Math.max(0,msgT-dt/1500);
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.x+=p.vx;p.y+=p.vy;p.vy+=0.16;p.life-=dt/640;if(p.life<=0)parts.splice(i,1);}
  if(state!=='play')return;
  pt+=dt;
  if(phase==='wind'){
    if(pt>=420){phase='aim';pt=0;swp=0;}
  }else if(phase==='aim'){
    swp+=dt;
    const ph=(swp%period)/period;
    pos=1-Math.abs(2*ph-1);
    if(Math.floor(swp/(period/2))!==Math.floor((swp-dt)/(period/2)))S.tick();
    if(swp>=deadT&&!decided)resolve('take');
  }else if(phase==='result'){
    if(ballU<1)ballU=Math.min(1,ballU+dt/560);
    if(result==='strike'&&ballU>0.55&&ballU<0.98&&Math.random()<0.3){const b=pitchPos(ballU);burst(b[0],b[1],'#bfe9ff',1,1.2);}
    if(pt>=1240){
      if(fails>=3){state='over';best=Math.max(best,score);try{localStorage.setItem('ld_best',String(best));}catch(e){}S.over();}
      else if(outs>=TARGET){state='over';best=Math.max(best,score);try{localStorage.setItem('ld_best',String(best));}catch(e){}S.strike();}
      else newPitch();
    }
  }
}

// pitch trajectory: from the mound to the chosen height; fat pitches get crushed away
function pitchPos(u){
  u=clamp(u,0,1);
  const arriveU=Math.min(u/0.6,1);
  const x=PITCHER[0]+(ZX-PITCHER[0])*arriveU;
  const y=PITCHER[1]+(endY-PITCHER[1])*arriveU;
  if((result==='fat')&&u>0.6){ const h=(u-0.6)/0.4; return [x-h*430, y-h*150+h*h*40]; }   // crushed line drive
  if(result==='ball'&&u>0.6){ const h=(u-0.6)/0.4; return [x, y+(endY<ZTOP?-h*16:h*36)]; }  // sails high / into the dirt
  return [x,y];
}

// ---------- render ----------
function roundRect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

function drawField(){
  const sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#233c58');sky.addColorStop(0.6,'#2f5540');sky.addColorStop(1,'#20402c');
  ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#8a5a34';ctx.beginPath();ctx.ellipse(PITCHER[0],PITCHER[1]+18,70,22,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#c9c2b6';ctx.fillRect(PITCHER[0]-18,PITCHER[1]+14,36,5);
  ctx.save();ctx.translate(PITCHER[0],PITCHER[1]);
  ctx.fillStyle='#222';ctx.fillRect(-7,-2,6,18);ctx.fillRect(1,-2,6,18);
  ctx.fillStyle='#d8dde6';ctx.fillRect(-10,-24,20,24);
  ctx.fillStyle='#f0c9a0';ctx.beginPath();ctx.arc(0,-32,8,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#2a4a6b';ctx.beginPath();ctx.arc(0,-34,9,Math.PI,0);ctx.fill();
  ctx.restore();
  // catcher behind the plate, mitt set high or low
  ctx.save();ctx.translate(ZX,536);
  ctx.fillStyle='#2f4a6e';roundRect(-22,-30,44,34,8);ctx.fill();
  ctx.fillStyle='#1b2740';ctx.beginPath();ctx.arc(0,-40,13,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='#8aa0c0';ctx.lineWidth=1.4;for(let i=-1;i<=1;i++){ctx.beginPath();ctx.moveTo(-9,-40+i*5);ctx.lineTo(9,-40+i*5);ctx.stroke();}
  ctx.restore();
}

function drawZone(){
  ctx.strokeStyle='rgba(255,255,255,.55)';ctx.lineWidth=3;
  ctx.strokeRect(ZX-ZW/2,ZTOP,ZW,ZH);
  ctx.strokeStyle='rgba(255,255,255,.16)';ctx.lineWidth=1;
  for(let i=1;i<3;i++){ctx.beginPath();ctx.moveTo(ZX-ZW/2+ZW/3*i,ZTOP);ctx.lineTo(ZX-ZW/2+ZW/3*i,ZTOP+ZH);ctx.stroke();ctx.beginPath();ctx.moveTo(ZX-ZW/2,ZTOP+ZH/3*i);ctx.lineTo(ZX+ZW/2,ZTOP+ZH/3*i);ctx.stroke();}
  // the catcher's target (high or low) — glows green when the meter is in the band
  const targetY=zoneY(bandC);
  const inWin=(phase==='aim'&&!decided&&Math.abs(pos-bandC)<=bandW/2);
  ctx.fillStyle=inWin?'rgba(90,255,150,.30)':'rgba(255,225,120,.16)';
  ctx.beginPath();ctx.ellipse(ZX,targetY,30,24,0,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle=inWin?'#5affa0':'rgba(255,225,120,.7)';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(ZX,targetY,30,24,0,0,Math.PI*2);ctx.stroke();
  // mitt inside the target
  ctx.fillStyle=inWin?'rgba(90,255,150,.5)':'rgba(200,150,80,.5)';ctx.beginPath();ctx.arc(ZX,targetY,11,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=inWin?'#5affa0':'rgba(255,225,120,.9)';ctx.font='bold 12px sans-serif';ctx.textAlign='center';
  ctx.fillText(highTarget?'ねらい：高め':'ねらい：低め',ZX,ZTOP-10);
}

function drawBatter(){
  const bx=ZX-ZW/2-40, by=ZMID+90;
  const sw=(phase==='result'&&(result==='strike'||result==='fat'));
  ctx.save();ctx.translate(bx,by);
  ctx.fillStyle='rgba(0,0,0,.26)';ctx.beginPath();ctx.ellipse(0,8,18,6,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#222';ctx.fillRect(-10,-16,8,24);ctx.fillRect(2,-16,8,24);
  ctx.fillStyle='#c0343a';ctx.fillRect(-13,-48,26,34);
  ctx.fillStyle='#f0c9a0';ctx.beginPath();ctx.arc(0,-58,10,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#1b2740';ctx.beginPath();ctx.arc(0,-60,10,Math.PI,0);ctx.fill();
  const ang=sw? (result==='fat'?0.5:1.7) : -2.1;
  ctx.save();ctx.translate(8,-46);ctx.rotate(ang);
  ctx.strokeStyle='#c98b3a';ctx.lineWidth=6;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(48,0);ctx.stroke();ctx.restore();
  ctx.restore();
}

function drawMeter(){
  if(state!=='play')return;
  roundRect(MX,MTOP,MW,MBOT-MTOP,8);ctx.fillStyle='rgba(0,0,0,.42)';ctx.fill();
  const yBandTop=meterY(bandC+bandW/2), yBandBot=meterY(bandC-bandW/2);
  ctx.fillStyle='rgba(90,110,150,.18)';ctx.fillRect(MX,MTOP,MW,yBandTop-MTOP);
  ctx.fillStyle='rgba(90,110,150,.18)';ctx.fillRect(MX,yBandBot,MW,MBOT-yBandBot);
  const gg=ctx.createLinearGradient(0,yBandTop,0,yBandBot);gg.addColorStop(0,'rgba(90,220,150,.5)');gg.addColorStop(0.5,'rgba(60,255,150,.95)');gg.addColorStop(1,'rgba(90,220,150,.5)');
  ctx.fillStyle=gg;ctx.fillRect(MX,yBandTop,MW,yBandBot-yBandTop);
  roundRect(MX,MTOP,MW,MBOT-MTOP,8);ctx.strokeStyle='rgba(255,255,255,.4)';ctx.lineWidth=1.5;ctx.stroke();
  ctx.textAlign='center';ctx.font='11px sans-serif';
  ctx.fillStyle='#bcd';ctx.fillText('高め',MX+MW/2,MTOP-6);
  ctx.fillStyle='#5affa0';ctx.font='bold 12px sans-serif';ctx.fillText('決め球',MX+MW/2,(yBandTop+yBandBot)/2+4);
  ctx.fillStyle='#bcd';ctx.font='11px sans-serif';ctx.fillText('低め',MX+MW/2,MBOT+14);
  const p=(phase==='aim'&&!decided)?pos:stopPos;
  const py=meterY(p);
  const col=(phase==='result')?(result==='strike'?'#5affa0':'#ff6a6a'):'#fff';
  ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(MX-8,py);ctx.lineTo(MX-1,py-6);ctx.lineTo(MX-1,py+6);ctx.closePath();ctx.fill();
  ctx.fillStyle=col;ctx.fillRect(MX,py-2,MW,4);
  ctx.beginPath();ctx.moveTo(MX+MW+8,py);ctx.lineTo(MX+MW+1,py-6);ctx.lineTo(MX+MW+1,py+6);ctx.closePath();ctx.fill();
  if(phase==='aim'){const tl=clamp((deadT-swp)/deadT,0,1);roundRect(MX-6,MBOT+22,MW+12,7,3);ctx.fillStyle='rgba(0,0,0,.4)';ctx.fill();ctx.fillStyle=tl<0.28?'#ff6a6a':'#ffd23a';ctx.fillRect(MX-6,MBOT+22,(MW+12)*tl,7);}
  ctx.textAlign='center';ctx.font='bold 10px sans-serif';ctx.fillStyle='#cfe';ctx.fillText('球の高さ',MX+MW/2,MTOP-22);
}

function drawBall(){
  if(phase==='wind'){
    const u=clamp(pt/420,0,1);const bx=PITCHER[0], by=PITCHER[1]-6+u*6;
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(bx,by,6,0,Math.PI*2);ctx.fill();
    return;
  }
  if(phase==='aim'){
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(PITCHER[0],PITCHER[1]-2,6,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='#d33';ctx.lineWidth=1;ctx.beginPath();ctx.arc(PITCHER[0]-1,PITCHER[1]-2,4,-0.7,0.7);ctx.stroke();
    return;
  }
  const b=pitchPos(ballU);
  const b2=pitchPos(Math.max(0,ballU-0.05));
  ctx.strokeStyle='rgba(255,255,255,.4)';ctx.lineWidth=4;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(b2[0],b2[1]);ctx.lineTo(b[0],b[1]);ctx.stroke();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(b[0],b[1],7,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='#d33';ctx.lineWidth=1.2;ctx.beginPath();ctx.arc(b[0]-2,b[1],5,-0.7,0.7);ctx.stroke();
}

function drawScene(){
  drawField();
  drawZone();
  drawBatter();
  drawBall();
  drawMeter();
  if(phase==='result'&&ballU>0.7){
    let t='',tc='#fff',tx=ZX,ty=zoneY(bandC)-40;
    if(result==='strike'){t=highTarget?'空振り！':'打ち取り！';tc='#5affa0';}
    else if(result==='ball'){t='ボール';tc='#ff8a8a';ty=(endY<ZTOP?ZTOP-30:ZBOT+30);}
    else{t='痛打！';tc='#ff8a8a';tx=ZX-120;ty=ZMID-60;}
    ctx.textAlign='center';ctx.font='bold 17px sans-serif';ctx.fillStyle=tc;ctx.fillText(t,tx,ty);
  }
}

function drawHUD(){
  ctx.textAlign='left';ctx.textBaseline='alphabetic';
  ctx.font='bold 20px sans-serif';ctx.fillStyle='#fff';
  ctx.fillText('仕留め '+outs+' / '+TARGET,120,32);
  ctx.font='14px sans-serif';ctx.fillStyle='#ffb14a';ctx.fillText('失投 '+fails+' / 3',120,54);
  ctx.textAlign='right';
  ctx.font='bold 20px sans-serif';ctx.fillStyle='#ffe08a';ctx.fillText('SCORE '+score,W-20,32);
  ctx.font='13px sans-serif';ctx.fillStyle='#bfe';ctx.fillText('BEST '+Math.max(best,score)+'   Lv.'+lvl,W-20,52);
  if(combo>1){ctx.textAlign='center';ctx.font='bold 20px sans-serif';ctx.fillStyle='#5affa0';ctx.fillText(combo+' 連続仕留め!',470,84);}
  if(phase==='aim'&&!decided){ctx.textAlign='center';ctx.font='bold 15px sans-serif';ctx.fillStyle='#ffe08a';ctx.fillText('上下に動く“球の高さ”を、狙い（高め/低め）の緑帯でピタッと止めてリリース！',480,110);}
}

function drawMsg(){
  if(msgT<=0)return;
  ctx.save();ctx.globalAlpha=clamp(msgT*1.4,0,1);
  ctx.textAlign='center';ctx.font='bold 23px sans-serif';
  ctx.fillStyle='rgba(0,0,0,.62)';roundRect(470-300,506,600,42,10);ctx.fill();
  ctx.fillStyle=msgCol;ctx.fillText(msg,470,534);
  ctx.restore();
}

function drawTitle(){
  drawField();drawZone();drawBatter();
  ctx.save();ctx.textAlign='center';
  ctx.fillStyle='rgba(0,0,0,.74)';roundRect(150,96,660,410,16);ctx.fill();
  ctx.fillStyle='#fff';ctx.font='bold 34px sans-serif';ctx.fillText('高低で仕留めろ',480,152);
  ctx.font='18px sans-serif';ctx.fillStyle='#9fe0bf';ctx.fillText('Work the Ladder',480,182);
  ctx.font='16px sans-serif';ctx.fillStyle='#e6fcef';
  const lines=[
    'あなたは投手。打者の“目線”を高低で揺さぶって仕留めろ！',
    '左のメーターは“球の高さ”。針が上下に往復する。',
    'キャッチャーの狙い（高め/低め）の緑の「決め球」帯でピタッと止めて',
    'リリース＝目線を外してズバッと仕留める（空振り/打ち取り）。',
    '狙いより甘い（真ん中寄り）＝痛打される失投。',
    '狙いを外して抜ける＝ボール。',
    'タップ / SPACE でリリース。26仕留めで達成、3失投で終了。',
  ];
  for(let i=0;i<lines.length;i++)ctx.fillText(lines[i],480,222+i*30);
  ctx.fillStyle='#ffe08a';ctx.font='bold 22px sans-serif';
  ctx.fillText('タップ / SPACE でスタート',480,486);
  ctx.restore();
}

function drawOver(){
  drawField();
  ctx.save();ctx.textAlign='center';
  ctx.fillStyle='rgba(0,0,0,.74)';roundRect(190,150,520,300,16);ctx.fill();
  const w2=outs>=TARGET;
  ctx.fillStyle=w2?'#5affa0':'#ff8a5a';ctx.font='bold 34px sans-serif';
  ctx.fillText(w2?'高低の揺さぶり完璧！':'甘く入りすぎ…',450,222);
  ctx.fillStyle='#fff';ctx.font='20px sans-serif';
  ctx.fillText('仕留め '+outs+' / '+TARGET,450,270);
  ctx.fillText('スコア '+score,450,304);
  ctx.fillStyle='#ffe08a';ctx.fillText('ベスト '+Math.max(best,score),450,336);
  ctx.fillStyle='#9fe0bf';ctx.font='bold 20px sans-serif';
  ctx.fillText('タップ / SPACE でもう一度',450,404);
  ctx.restore();
}

function render(){
  ctx.save();
  if(shakeT>0){const s=shakeT*7;ctx.translate(rnd(-s,s),rnd(-s,s));}
  if(state==='title'){drawTitle();}
  else if(state==='over'){drawOver();}
  else{
    drawScene();
    drawHUD();
    drawMsg();
  }
  for(const p of parts){ctx.globalAlpha=clamp(p.life,0,1);ctx.fillStyle=p.col;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();}
  ctx.globalAlpha=1;
  ctx.restore();
  if(flash>0){ctx.fillStyle='rgba(255,255,180,'+(flash*0.4)+')';ctx.fillRect(0,0,W,H);}
}

function frame(ts){let dt=ts-last;last=ts;if(dt>60)dt=60;if(dt<0)dt=0;update(dt);render();requestAnimationFrame(frame);}
requestAnimationFrame(frame);

// ---------- test hook ----------
window.__ld={
  start:startGame,
  swing:swing,   // swing() = release the pitch
  get state(){return state;},
  get outs(){return outs;},
  get fails(){return fails;},
  get score(){return score;},
  get info(){return {state:state,phase:phase,swp:swp,pos:pos,bandC:bandC,bandW:bandW,period:period,deadT:deadT,timeLeft:(deadT-swp),tough:tough,highTarget:highTarget,decided:decided,result:result,quality:quality,outs:outs,fails:fails,lvl:lvl,inBand:(Math.abs(pos-bandC)<=bandW/2),dist:Math.abs(pos-bandC),canAct:(state==='play'&&phase==='aim'&&!decided)};}
};
})();
</script>
