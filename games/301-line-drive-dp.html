<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ライナーゲッツー (Line-Drive Double Play)</title>
<style>
  html,body{margin:0;height:100%;background:#0a1207;overflow:hidden;
    font-family:-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  #stage{position:relative;width:100vw;height:100vh;max-width:calc(100vh*1.5);max-height:calc(100vw/1.5);aspect-ratio:900/600;}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;border-radius:6px;}
</style>
</head>
<body>
<div id="wrap"><div id="stage"><canvas id="cv"></canvas></div></div>
<script>
(function(){
const W=900,H=600,cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let DPR=1;
function fit(){DPR=Math.min(2,window.devicePixelRatio||1);cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
fit();addEventListener('resize',fit);

// ---------- audio ----------
let AC=null;function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function tone(f,d,type,v,sweep){const a=ac();if(!a)return;const t=a.currentTime,o=a.createOscillator(),g=a.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(sweep)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+sweep),t+d);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v||0.2,t+0.008);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+0.02);}
function noise(d,v,hp){const a=ac();if(!a)return;const t=a.currentTime,n=Math.floor(a.sampleRate*d),buf=a.createBuffer(1,n,a.sampleRate),ch=buf.getChannelData(0);
  for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource();s.buffer=buf;
  const f=a.createBiquadFilter();f.type='highpass';f.frequency.value=hp||600;const g=a.createGain();g.gain.value=v||0.2;
  s.connect(f);f.connect(g);g.connect(a.destination);s.start(t);s.stop(t+d+0.02);}
const S={
  crack:()=>{noise(0.05,0.18,500);tone(240,0.06,'square',0.09,-70);},
  snag:()=>{noise(0.05,0.16,900);tone(360,0.06,'square',0.07);},
  fire:()=>{noise(0.05,0.13,700);tone(520,0.06,'square',0.07,-160);},
  dp:()=>{[680,940,1220].forEach((f,i)=>setTimeout(()=>tone(f,0.1,'triangle',0.16),i*55));},
  big:()=>{[600,800,1050,1350].forEach((f,i)=>setTimeout(()=>tone(f,0.12,'triangle',0.17),i*80));},
  bad:()=>{noise(0.18,0.22,300);tone(150,0.22,'sawtooth',0.12,-40);},
  streak:()=>{[700,930,1170,1400].forEach((f,i)=>setTimeout(()=>tone(f,0.1,'triangle',0.16),i*60));},
  over:()=>{[440,330,247,175].forEach((f,i)=>setTimeout(()=>tone(f,0.3,'triangle',0.2),i*160));}
};

// ---------- geometry ----------
const HOME={x:150,y:492}, FLD={x:452,y:322}, FIRST={x:742,y:432}, SECOND={x:470,y:150};

// ---------- state ----------
let state='title', phase='liner', plays=0;
let score=0, combo=0, best=+(localStorage.getItem('ldp_best')||0);
let outs=0, fails=0, lvl=1;
let t=0, catchT=500, cw=440, throwT=260, tw=430, tough=false;
let caught=false, decided=false, result=null, resultT=0, msg='', msgOk=false;
let runnerU=0, throwU=0, catchAt=0, throwAt=0;
let shake=0, flash=0, flashCol='#fff', last=performance.now();
let parts=[], pops=[];

function rnd(a,b){return a+Math.random()*(b-a);}
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function lerp(a,b,u){return a+(b-a)*u;}
function easeOut(u){return 1-Math.pow(1-u,2);}

function reset(){state='title';score=0;combo=0;outs=0;fails=0;lvl=1;plays=0;result=null;parts=[];pops=[];}

function newPlay(){
  plays++; lvl=Math.min(7,1+Math.floor(outs/4));
  catchT=clamp(520-lvl*22,360,520);
  cw=clamp(470-lvl*22,340,470);
  throwT=clamp(300-lvl*10,230,300);
  tw=clamp(460-lvl*22,340,460);
  tough=Math.random()<clamp(0.18+lvl*0.05,0.18,0.5);
  phase='liner'; t=0; caught=false; decided=false; result=null; resultT=0; msg=''; msgOk=false;
  runnerU=0; throwU=0; catchAt=0; throwAt=0;
  S.crack();
}
function start(){ if(!ac())ac(); if(AC&&AC.state==='suspended')AC.resume(); reset(); state='play'; newPlay(); }

function act(){
  if(state==='title'){start();return;}
  if(state==='over'){ if(resultT>0.4){reset();start();} return; }
  if(state!=='play'||decided) return;
  if(phase==='liner'){
    if(t<catchT){ resolve('whiff'); return; }
    if(t<=catchT+cw){ caught=true; catchAt=t; phase='throw'; t=0; S.snag(); flash=0.5;flashCol='#bfe9ff'; return; }
    // past window handled by update
  } else if(phase==='throw'){
    if(t<throwT){ resolve('rushed'); return; }
    if(t<=throwT+tw){ throwAt=t; S.fire(); resolve('dp'); return; }
  }
}

function resolve(k){
  decided=true; result=k; resultT=0;
  if(k==='dp'){
    phase='result';
    outs++; combo++;
    const snap=(throwAt<=throwT+tw*0.4);
    let base=tough?250:150; if(snap)base+=70;
    let add=Math.round(base*(1+Math.min(9,combo-1)*0.14)); score+=add;
    setTimeout(S.dp,60); if(snap||tough)setTimeout(S.big,140);
    msgOk=true; flash=1;flashCol='#8affa0';shake=6; burst(FIRST.x,FIRST.y,'#8affa0',18,7);
    pop(FLD.x,FLD.y-70,(snap?'鮮やかな併殺！ +':'ゲッツー成立！ +')+add,'#d6ffe0');
    if(combo>=2)pop(W/2,150,'コンボ x'+combo,'#ffd24d');
    if(combo>0&&combo%5===0)S.streak();
    msg=snap?'ライナーを掴んで矢のような送球——電光石火のダブルプレー':'ライナーを好捕→一塁へ送球で飛び出した走者を刺した——併殺完成';
  } else {
    phase='result';
    fails++; combo=0; msgOk=false; flash=1;flashCol='#ff5b5b';shake=9; S.bad();
    if(k==='whiff'){ msg='早すぎ…ライナーが到達する前にグラブを出して弾いた'; pop(FLD.x,FLD.y-50,'弾いた…','#ffb0b0'); }
    else if(k==='through'){ msg='捕り遅れ…痛烈なライナーが左右を抜けてヒット'; pop(FLD.x,FLD.y-50,'抜かれた…','#ffb0b0'); }
    else if(k==='rushed'){ msg='送球が早い…捕ってすぐの悪送球で走者を戻せず（DP不成立）'; pop(FIRST.x,FIRST.y-40,'悪送球…','#ffb0b0'); }
    else { msg='送球が遅い…飛び出した走者が一塁へ戻り、ダブルプレーならず'; pop(FIRST.x,FIRST.y-40,'戻られた…','#ffb0b0'); }
    if(fails>=3){ state='over'; resultT=0; setTimeout(S.over,180); if(score>best){best=score;localStorage.setItem('ldp_best',best);} }
  }
}

// ---------- input ----------
cv.addEventListener('pointerdown',e=>{e.preventDefault();act();});
addEventListener('keydown',e=>{ if(e.repeat)return;
  if(e.code==='Space'||e.code==='Enter'||e.code==='ArrowUp'||e.code==='KeyF'||e.code==='KeyJ'){e.preventDefault();act();} });

// ---------- particles ----------
function burst(x,y,c,n,sp){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=rnd(sp*0.3,sp);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:1,c});}}
function pop(x,y,txt,c){pops.push({x,y,txt,c,life:1});}

// ---------- update ----------
function update(dt){
  shake*=Math.pow(0.86,dt/16.7); if(shake<0.3)shake=0;
  flash*=Math.pow(0.9,dt/16.7);
  for(const p of parts){p.vx*=0.96;p.vy=p.vy*0.96+0.28;p.x+=p.vx*dt/16.7;p.y+=p.vy*dt/16.7;p.life-=dt/16.7*0.026;}
  parts=parts.filter(p=>p.life>0);
  for(const p of pops){p.y-=dt/16.7*0.5;p.life-=dt/16.7*0.02;}
  pops=pops.filter(p=>p.life>0);

  if(state!=='play'){ if(state==='over')resultT+=dt/1000; return; }
  if(phase==='liner'){ t+=dt;
    runnerU=clamp(t/(catchT+cw+300),0,0.5);   // runner breaking toward second
    if(!decided&&!caught&&t>catchT+cw){ resolve('through'); }
    return; }
  if(phase==='throw'){ t+=dt;
    throwU=0;
    if(!decided&&t>throwT+tw){ resolve('late'); }
    return; }
  if(phase==='result'){ resultT+=dt/1000;
    if(result==='dp'){ throwU=clamp(throwU+dt/220,0,1); }
    else if(result==='late'||result==='rushed'){ runnerU=clamp(runnerU-dt/300,0,0.5); } // scrambles back
    if(resultT>1.55) newPlay();
    return; }
}

// ---------- render ----------
function drawField(){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#0f5e34');g.addColorStop(0.5,'#12703f');g.addColorStop(1,'#0c4c2b');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  // infield dirt diamond
  ctx.fillStyle='#7a5433';ctx.beginPath();
  ctx.moveTo(HOME.x,HOME.y);ctx.lineTo(FIRST.x,FIRST.y);ctx.lineTo(SECOND.x,SECOND.y);ctx.lineTo(210,250);ctx.closePath();ctx.fill();
  // basepaths
  ctx.strokeStyle='rgba(255,255,255,0.4)';ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(HOME.x,HOME.y);ctx.lineTo(FIRST.x,FIRST.y);ctx.lineTo(SECOND.x,SECOND.y);ctx.stroke();
  // bases
  ctx.fillStyle='#fff';
  ctx.save();ctx.translate(FIRST.x,FIRST.y);ctx.rotate(0.78);ctx.fillRect(-9,-9,18,18);ctx.restore();
  ctx.save();ctx.translate(SECOND.x,SECOND.y);ctx.rotate(0.78);ctx.fillRect(-9,-9,18,18);ctx.restore();
}
function person(x,y,col,scale){scale=scale||1;
  ctx.fillStyle=col;ctx.beginPath();ctx.ellipse(x,y-16*scale,11*scale,18*scale,0,0,6.28);ctx.fill();
  ctx.fillStyle='#f0c9a0';ctx.beginPath();ctx.arc(x,y-38*scale,8.5*scale,0,6.28);ctx.fill();
}

function render(){
  ctx.save();
  if(shake>0)ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
  drawField();

  if(state==='play'||state==='over'){
    // batter at home
    person(HOME.x,HOME.y,'#c23b34',0.95);
    // first baseman waiting at first
    person(FIRST.x+16,FIRST.y-6,'#2b6fd6',0.9);

    // runner (breaking from first toward second)
    const rx=lerp(FIRST.x,SECOND.x,runnerU), ry=lerp(FIRST.y,SECOND.y,runnerU);
    person(rx,ry,'#e8e8e8',0.9);
    ctx.fillStyle='rgba(255,255,255,0.6)';ctx.font='11px sans-serif';ctx.textAlign='center';ctx.fillText('走者',rx,ry-50);

    // fielder
    person(FLD.x,FLD.y,'#2b6fd6',1);
    // glove
    ctx.fillStyle='#5b3a1c';ctx.beginPath();ctx.arc(FLD.x-16,FLD.y-24,10,0,6.28);ctx.fill();

    // ball
    let bx,by;
    if(phase==='liner'){ const u=clamp(t/catchT,0,1); bx=lerp(HOME.x+12,FLD.x-14,easeOut(u)); by=lerp(HOME.y-24,FLD.y-24,easeOut(u))- Math.sin(u*Math.PI)*10; }
    else if(phase==='throw'||(phase==='result'&&result==='dp')){ const u=easeOut(throwU); bx=lerp(FLD.x-14,FIRST.x,u); by=lerp(FLD.y-24,FIRST.y-14,u)-Math.sin(u*Math.PI)*24; }
    else { bx=FLD.x-14; by=FLD.y-24; }
    if(!(phase==='result'&&result!=='dp'&&result!=='rushed'&&false)){
      ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(bx,by,8,0,6.28);ctx.fill();
      ctx.strokeStyle='#c33';ctx.lineWidth=1.2;ctx.beginPath();ctx.arc(bx-2,by-2,5,0.6,2.6);ctx.stroke();
      if(phase==='liner'){ctx.strokeStyle='rgba(255,255,255,0.4)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(bx+10,by+4);ctx.lineTo(bx+26,by+10);ctx.stroke();}
    }

    // timing window ring at fielder (catch) / first (throw)
    if(phase==='liner'&&t>=catchT&&t<=catchT+cw){ ctx.strokeStyle='rgba(140,255,160,0.9)';ctx.lineWidth=3;ctx.beginPath();ctx.arc(FLD.x-14,FLD.y-24,17,0,6.28);ctx.stroke(); }
    if(phase==='throw'&&t>=throwT&&t<=throwT+tw){ ctx.strokeStyle='rgba(140,255,160,0.9)';ctx.lineWidth=3;ctx.beginPath();ctx.arc(FIRST.x,FIRST.y,18,0,6.28);ctx.stroke(); }

    // cue banner + timer
    ctx.textAlign='center';
    if(state==='play'&&(phase==='liner'||phase==='throw')){
      if(phase==='liner'){
        if(t<catchT){ ctx.fillStyle='rgba(255,220,90,0.95)';ctx.font='bold 21px sans-serif';ctx.fillText('痛烈なライナー！ 走者は飛び出した——捕れ',W/2,50); }
        else { ctx.fillStyle='rgba(150,255,170,0.98)';ctx.font='bold 22px sans-serif';ctx.fillText('今だ！ 好捕！',W/2,50);
          bar((t-catchT)/cw); }
      } else {
        if(t<throwT){ ctx.fillStyle='rgba(255,220,90,0.95)';ctx.font='bold 21px sans-serif';ctx.fillText('掴んだ！ 一塁へ送って走者を刺せ',W/2,50); }
        else { ctx.fillStyle='rgba(150,255,170,0.98)';ctx.font='bold 22px sans-serif';ctx.fillText('送球！ ダブルプレー！',W/2,50);
          bar((t-throwT)/tw); }
      }
    }
    if(state==='play'){
      ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='13px sans-serif';ctx.textAlign='center';
      ctx.fillText('タップ / SPACE：① ライナー好捕 → ② 一塁へ送球（2ビート）',W/2,H-30);
    }
  }

  for(const p of parts){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,3.2,0,6.28);ctx.fill();}
  ctx.globalAlpha=1;
  for(const p of pops){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.font='bold 21px sans-serif';ctx.textAlign='center';ctx.fillText(p.txt,p.x,p.y);}
  ctx.globalAlpha=1;

  // HUD
  ctx.textAlign='left';ctx.fillStyle='#fff';ctx.font='bold 26px sans-serif';ctx.fillText('SCORE '+score,20,36);
  ctx.textAlign='right';ctx.fillStyle='rgba(255,255,255,0.9)';ctx.font='14px sans-serif';ctx.fillText('併殺 '+outs+'  Lv'+lvl,W-20,24);
  ctx.fillText('失',W-92,46);
  for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(W-60+i*20,41,7,0,6.28);ctx.fillStyle=i<fails?'#ff5b5b':'rgba(255,255,255,0.25)';ctx.fill();}
  if(combo>=2){ctx.textAlign='center';ctx.fillStyle='#ffd24d';ctx.font='bold 18px sans-serif';ctx.fillText('コンボ x'+combo,W/2,110);}

  if(state==='play'&&phase==='result'&&msg){ctx.textAlign='center';ctx.fillStyle=msgOk?'#9ff0b8':'#ff9a9a';ctx.font='bold 16px sans-serif';ctx.fillText(msg,W/2,H-56);}

  if(state==='title'){
    ctx.fillStyle='rgba(4,10,7,0.82)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='bold 40px sans-serif';ctx.fillText('ライナーゲッツー',W/2,92);
    ctx.fillStyle='#ffd23e';ctx.font='bold 20px sans-serif';ctx.fillText('Line-Drive Double Play',W/2,126);
    ctx.fillStyle='rgba(255,255,255,0.92)';ctx.font='16px sans-serif';
    ctx.fillText('エンドランで走者が飛び出した——痛烈なライナーを好捕し、一塁へ送って“ゲッツー”を完成させろ',W/2,182);
    ctx.fillStyle='rgba(255,255,255,0.66)';ctx.font='14px sans-serif';
    ctx.fillText('①ライナーがグラブに届く“緑リング”の瞬間にタップ／SPACEで好捕（早すぎると弾き、遅いと抜かれる）',W/2,220);
    ctx.fillText('②掴んだら一塁の“緑リング”で再びタップ＝送球で飛び出した走者を刺してダブルプレー完成',W/2,244);
    ctx.fillText('送球が早いと悪送球、遅いと走者が戻る。素早い送球ほど大量加点。2ビートを両方決めろ',W/2,268);
    ctx.fillText('上級ほどライナーが速く窓も短い。3失敗で交代',W/2,292);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で開始',W/2,360);
    ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='14px sans-serif';ctx.fillText('BEST '+best,W/2,392);
  }
  if(state==='over'){
    ctx.fillStyle='rgba(4,10,7,0.84)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#ff6b6b';ctx.font='bold 46px sans-serif';ctx.fillText('3失敗…交代',W/2,222);
    ctx.fillStyle='#fff';ctx.font='bold 40px sans-serif';ctx.fillText('SCORE '+score,W/2,290);
    ctx.fillStyle='rgba(255,255,255,0.85)';ctx.font='19px sans-serif';ctx.fillText('併殺 '+outs+'   BEST '+best,W/2,330);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で もう一度',W/2,402);
  }

  if(flash>0.02){ctx.globalAlpha=flash*0.5;ctx.fillStyle=flashCol;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}
  ctx.restore();

  ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,0.4)';ctx.font='12px sans-serif';
  ctx.fillText('ライナーゲッツー：①ライナーを緑リングで好捕→②一塁の緑リングで送球＝併殺。早捕り/捕り遅れ/悪送球/送球遅れは失敗、3つで交代',W/2,H-8);
}
function bar(p){p=clamp(p,0,1);const bw=250,x=W/2-bw/2,y=62;
  ctx.fillStyle='rgba(255,255,255,0.18)';ctx.fillRect(x,y,bw,7);
  ctx.fillStyle=p<0.42?'#8affa0':(p<1?'#ffd24d':'#ff5b5b');ctx.fillRect(x,y,bw*p,7);}

function frame(ts){let dt=ts-last;last=ts;if(dt>60)dt=60;if(dt<0)dt=0;update(dt);render();requestAnimationFrame(frame);}
requestAnimationFrame(frame);

// ---------- test hook ----------
window.__ldp={
  start, act:()=>act(),
  get state(){return state;},
  get score(){return score;},
  get outs(){return outs;},
  get fails(){return fails;},
  get info(){return {state,phase,t,catchT,cw,throwT,tw,tough,caught,decided,result,outs,fails,lvl,
    catchWin:(phase==='liner'&&t>=catchT&&t<=catchT+cw),
    throwWin:(phase==='throw'&&t>=throwT&&t<=throwT+tw),
    canAct:((phase==='liner'||phase==='throw')&&!decided)};}
};
})();
</script>
</body>
</html>
