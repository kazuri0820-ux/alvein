<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ダイヤモンド一周 (Inside-the-Park!)</title>
<style>
  html,body{margin:0;height:100%;background:#0a0d08;overflow:hidden;
    font-family:-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  #stage{position:relative;width:100vw;height:100vh;max-width:calc(100vh*1.5);max-height:calc(100vw/1.5);aspect-ratio:900/600;}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;border-radius:6px;}
</style>
</head>
<body>
<div id="wrap"><div id="stage"><canvas id="cv"></canvas></div></div>
<script>
(function(){
const W=900,H=600,cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let DPR=1;
function fit(){DPR=Math.min(2,window.devicePixelRatio||1);cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
fit();addEventListener('resize',fit);

// ---------- audio ----------
let AC=null;function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function tone(f,d,type,v,sweep){const a=ac();if(!a)return;const t=a.currentTime,o=a.createOscillator(),g=a.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(sweep)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+sweep),t+d);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v||0.2,t+0.008);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+0.02);}
function noise(d,v,hp){const a=ac();if(!a)return;const t=a.currentTime,n=Math.floor(a.sampleRate*d),buf=a.createBuffer(1,n,a.sampleRate),ch=buf.getChannelData(0);
  for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource();s.buffer=buf;
  const f=a.createBiquadFilter();f.type='highpass';f.frequency.value=hp||600;const g=a.createGain();g.gain.value=v||0.2;
  s.connect(f);f.connect(g);g.connect(a.destination);s.start(t);s.stop(t+d+0.02);}
const S={
  step:()=>{tone(180+Math.random()*40,0.03,'square',0.04);},
  base:()=>{tone(560,0.05,'triangle',0.10);},
  safe:()=>{[620,880,1150].forEach((f,i)=>setTimeout(()=>tone(f,0.11,'triangle',0.16),i*56));},
  big:()=>{[600,800,1000,1250,1500].forEach((f,i)=>setTimeout(()=>tone(f,0.12,'triangle',0.17),i*80));},
  out:()=>{noise(0.2,0.24,240);tone(150,0.24,'sawtooth',0.13,-50);},
  streak:()=>{[700,930,1170,1400].forEach((f,i)=>setTimeout(()=>tone(f,0.1,'triangle',0.16),i*60));},
  over:()=>{[440,330,247,175].forEach((f,i)=>setTimeout(()=>tone(f,0.3,'triangle',0.2),i*160));}
};

// ---------- geometry (diamond) ----------
const HOME={x:452,y:470}, FIRST={x:632,y:320}, SECOND={x:452,y:190}, THIRD={x:272,y:320};
const BASES=[HOME,FIRST,SECOND,THIRD,HOME];   // path 0..1 wraps home->1st->2nd->3rd->home
const OFELD={x:452,y:70};                       // outfield (relay origin)
function pathPos(fr){ fr=clamp(fr,0,1); const seg=Math.min(3,Math.floor(fr*4)); const u=fr*4-seg; const a=BASES[seg],b=BASES[seg+1]; return {x:lerp(a.x,b.x,u),y:lerp(a.y,b.y,u)}; }

// ---------- state ----------
let state='title', phase='run', plays=0;
let score=0, combo=0, best=+(localStorage.getItem('rb_best')||0);
let outs=0, fails=0, lvl=1;   // outs = inside-the-park home runs (runs scored)
let rp=0, tp=0, throwT=3000, lastTap=-999, tclk=0, margin=0;
const STEP=0.05, TAPCD=52;
let result=null, resultT=0, msg='', msgOk=false, anim=0, tapPulse=0;
let shake=0, flash=0, flashCol='#fff', last=performance.now();
let parts=[], pops=[];

function rnd(a,b){return a+Math.random()*(b-a);}
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function lerp(a,b,u){return a+(b-a)*u;}
function easeOut(u){return 1-Math.pow(1-u,2);}

function reset(){state='title';score=0;combo=0;outs=0;fails=0;lvl=1;plays=0;result=null;parts=[];pops=[];}

function newPlay(){
  plays++; lvl=Math.min(7,1+Math.floor(outs/4));
  throwT=clamp(3100-lvl*70,2650,3100);      // relay reaches home sooner at higher levels
  rp=0; tp=0; lastTap=-999; tclk=0; margin=0;
  phase='run'; result=null; resultT=0; msg=''; msgOk=false; anim=0;
}
function start(){ if(!ac())ac(); if(AC&&AC.state==='suspended')AC.resume(); reset(); state='play'; newPlay(); }

function tap(){
  if(state==='title'){start();return;}
  if(state==='over'){ if(resultT>0.4){reset();start();} return; }
  if(state!=='play'||phase!=='run') return;
  if(tclk-lastTap<TAPCD) return;             // rate cap (no superhuman mashing)
  lastTap=tclk; const prevSeg=Math.floor(rp*4); rp=clamp(rp+STEP,0,1); tapPulse=1; S.step();
  if(Math.floor(rp*4)>prevSeg && rp<1) S.base();   // rounded a base
  if(rp>=1){ margin=clamp(1-tp,0,1); resolve('safe'); }
}

function resolve(k){
  phase='result'; result=k; resultT=0; anim=0;
  if(k==='safe'){
    outs++; combo++;
    const close=margin<0.14;
    let add=Math.round((90+Math.round((1-margin)*140))*(1+Math.min(9,combo-1)*0.14)); score+=add;
    setTimeout(S.safe,120); if(close||margin>0.4)setTimeout(S.big,200);
    msgOk=true; flash=1;flashCol='#8affa0';shake=7; burst(HOME.x,HOME.y,'#8affa0',22,8);
    pop(W/2,250,(close?'際どいクロスプレーを制して生還！ランニング本塁打！ +':'一気に生還——ランニング本塁打！ +')+add,'#d6ffe0');
    if(combo>=2)pop(W/2,214,'コンボ x'+combo,'#ffd24d');
    if(combo>0&&combo%5===0)S.streak();
    msg=close?'返球と同時に頭から本塁へ滑り込みセーフ——痺れるクロスプレーをもぎ取った！':'快足を飛ばしてダイヤモンドを一周、返球より先に生還——ランニング本塁打！';
  } else {
    fails++; combo=0; msgOk=false; flash=1;flashCol='#ff5b5b';shake=8; S.out();
    msg='中継返球が先に本塁へ——タッチアウト。ダッシュ（連打）が足りず一周を回りきれなかった';
    pop(W/2,250,'本塁で憤死…','#ffb0b0');
  }
  if(fails>=3){ state='over'; resultT=0; S.over(); if(score>best){best=score;localStorage.setItem('rb_best',best);} }
}

// ---------- input ----------
cv.addEventListener('pointerdown',e=>{e.preventDefault();tap();});
addEventListener('keydown',e=>{ if(e.repeat)return; if(e.code==='Space'||e.code==='Enter'||e.code==='ArrowRight'||e.code==='KeyF'||e.code==='KeyJ'){e.preventDefault();tap();} });

// ---------- particles ----------
function burst(x,y,c,n,sp){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=rnd(sp*0.3,sp);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:1,c});}}
function pop(x,y,txt,c){pops.push({x,y,txt,c,life:1});}

// ---------- update ----------
function update(dt){
  shake*=Math.pow(0.86,dt/16.7); if(shake<0.3)shake=0;
  flash*=Math.pow(0.9,dt/16.7); tapPulse*=Math.pow(0.8,dt/16.7);
  for(const p of parts){p.vx*=0.96;p.vy=p.vy*0.96+0.28;p.x+=p.vx*dt/16.7;p.y+=p.vy*dt/16.7;p.life-=dt/16.7*0.026;}
  parts=parts.filter(p=>p.life>0);
  for(const p of pops){p.y-=dt/16.7*0.5;p.life-=dt/16.7*0.02;}
  pops=pops.filter(p=>p.life>0);

  if(state!=='play'){ if(state==='over')resultT+=dt/1000; return; }
  if(phase==='run'){ tclk+=dt; tp=clamp(tp+dt/throwT,0,1);
    if(tp>=1 && rp<1){ margin=0; resolve('out'); }
    return; }
  if(phase==='result'){ resultT+=dt/1000; anim=Math.min(1,anim+dt/500); if(resultT>1.6) newPlay(); return; }
}

// ---------- render ----------
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function runnerDot(x,y,col,r){ ctx.fillStyle='rgba(0,0,0,0.25)';ctx.beginPath();ctx.ellipse(x,y+8,9,3,0,0,6.28);ctx.fill();
  ctx.fillStyle=col;ctx.beginPath();ctx.arc(x,y,r||8,0,6.28);ctx.fill(); }
function drawScene(){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#12703f');g.addColorStop(0.5,'#0f5e34');g.addColorStop(1,'#0c4c2b');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  // infield dirt diamond
  ctx.fillStyle='#6a4a30';ctx.beginPath();ctx.moveTo(HOME.x,HOME.y+24);ctx.lineTo(FIRST.x+24,FIRST.y);ctx.lineTo(SECOND.x,SECOND.y-24);ctx.lineTo(THIRD.x-24,THIRD.y);ctx.closePath();ctx.fill();
  // basepaths
  ctx.strokeStyle='rgba(230,210,150,0.55)';ctx.lineWidth=8;
  ctx.beginPath();ctx.moveTo(HOME.x,HOME.y);ctx.lineTo(FIRST.x,FIRST.y);ctx.lineTo(SECOND.x,SECOND.y);ctx.lineTo(THIRD.x,THIRD.y);ctx.closePath();ctx.stroke();
  // bags
  for(const B of [FIRST,SECOND,THIRD]){ ctx.save();ctx.translate(B.x,B.y);ctx.rotate(0.785);ctx.fillStyle='#eef0f2';ctx.fillRect(-9,-9,18,18);ctx.restore(); }
  ctx.fillStyle='#eef0f2';ctx.beginPath();ctx.moveTo(HOME.x-12,HOME.y-7);ctx.lineTo(HOME.x+12,HOME.y-7);ctx.lineTo(HOME.x+12,HOME.y+1);ctx.lineTo(HOME.x,HOME.y+12);ctx.lineTo(HOME.x-12,HOME.y+1);ctx.closePath();ctx.fill();
}

function render(){
  ctx.save();
  if(shake>0)ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
  drawScene();

  if(state==='play'){
    // relay ball travels from outfield to home as tp -> 1
    const relFr=(phase==='run')?tp:(result==='out'?1:tp);
    const relx=lerp(OFELD.x,HOME.x,easeOut(relFr)), rely=lerp(OFELD.y,HOME.y-4,easeOut(relFr));

    // runner around the diamond
    let rfr=(phase==='run')?rp:(result==='safe'?1:rp);
    const rpos=pathPos(rfr);

    // trailing path already run
    ctx.strokeStyle='rgba(120,255,150,0.5)';ctx.lineWidth=5;
    ctx.beginPath();const N=Math.max(1,Math.floor(rfr*40));for(let i=0;i<=N;i++){const q=pathPos(rfr*i/N);if(i===0)ctx.moveTo(q.x,q.y);else ctx.lineTo(q.x,q.y);}ctx.stroke();

    // relay ball
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(relx,rely,7,0,6.28);ctx.fill();
    ctx.strokeStyle='#c33';ctx.lineWidth=1;ctx.beginPath();ctx.arc(relx,rely,7,0.4,2.2);ctx.stroke();

    // catcher waiting at home
    runnerDot(HOME.x-2,HOME.y-16,'#c9782f',7);
    // runner
    runnerDot(rpos.x,rpos.y,(result==='out')?'#e0584a':'#4fa3ff',9+tapPulse*2);

    // ---- progress bars ----
    const bx=W/2-230, bw=460;
    ctx.fillStyle='rgba(255,255,255,0.12)';rr(bx,H-70,bw,14,7);ctx.fill();
    ctx.fillStyle='#8affa0';rr(bx,H-70,bw*clamp(rp,0,1),14,7);ctx.fill();
    ctx.fillStyle='rgba(255,255,255,0.12)';rr(bx,H-48,bw,10,5);ctx.fill();
    ctx.fillStyle='#ffb24d';rr(bx,H-48,bw*clamp(tp,0,1),10,5);ctx.fill();
    ctx.textAlign='left';ctx.fillStyle='rgba(140,255,170,0.9)';ctx.font='12px sans-serif';ctx.fillText('走者（連打で加速）',bx,H-74);
    ctx.textAlign='right';ctx.fillStyle='rgba(255,190,110,0.9)';ctx.fillText('中継返球',bx+bw,H-74);

    // banner
    ctx.textAlign='center';
    if(phase==='run'){ ctx.fillStyle='rgba(255,220,90,0.96)';ctx.font='bold 22px sans-serif';
      ctx.fillText('連打で激走！ 返球が本塁に届く前にダイヤモンドを一周しろ！',W/2,44);
      ctx.fillStyle='rgba(255,255,255,0.55)';ctx.font='12px sans-serif';ctx.fillText('タップ / SPACE / → を速く連打＝全力疾走（連打が速いほど加速）',W/2,H-14);
    }
  }

  for(const p of parts){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,3.2,0,6.28);ctx.fill();}
  ctx.globalAlpha=1;
  for(const p of pops){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.font='bold 21px sans-serif';ctx.textAlign='center';ctx.fillText(p.txt,p.x,p.y);}
  ctx.globalAlpha=1;

  // HUD
  ctx.textAlign='left';ctx.fillStyle='#fff';ctx.font='bold 26px sans-serif';ctx.fillText('SCORE '+score,20,36);
  ctx.textAlign='right';ctx.fillStyle='rgba(255,255,255,0.9)';ctx.font='14px sans-serif';ctx.fillText('生還 '+outs+'  Lv'+lvl,W-20,24);
  ctx.fillText('憤死',W-92,46);
  for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(W-60+i*20,41,7,0,6.28);ctx.fillStyle=i<fails?'#ff5b5b':'rgba(255,255,255,0.25)';ctx.fill();}
  if(combo>=2){ctx.textAlign='center';ctx.fillStyle='#ffd24d';ctx.font='bold 18px sans-serif';ctx.fillText('コンボ x'+combo,W/2,112);}

  if(state==='play'&&phase==='result'&&msg){ctx.textAlign='center';ctx.fillStyle=msgOk?'#9ff0b8':'#ff9a9a';ctx.font='bold 15px sans-serif';ctx.fillText(msg,W/2,300);}

  if(state==='title'){
    ctx.fillStyle='rgba(4,8,4,0.83)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='bold 40px sans-serif';ctx.fillText('ダイヤモンド一周',W/2,82);
    ctx.fillStyle='#ffd23e';ctx.font='bold 22px sans-serif';ctx.fillText('Inside-the-Park!',W/2,118);
    ctx.fillStyle='rgba(255,255,255,0.92)';ctx.font='16px sans-serif';
    ctx.fillText('外野の間を破る大飛球——タップ/SPACEを速く連打して激走し、返球が届く前にダイヤモンドを一周して生還！',W/2,176);
    ctx.fillStyle='rgba(255,255,255,0.66)';ctx.font='14px sans-serif';
    ctx.fillText('連打が速いほど走者バー（緑）が伸びて加速、外野→中継→本塁の返球バー（橙）と競走',W/2,214);
    ctx.fillText('返球が本塁に届く（橙が満タン）前に一周（緑を満タン）＝ランニング本塁打で生還＝加点',W/2,238);
    ctx.fillText('返球より遅い＝本塁で憤死（タッチアウト）。際どいクロスプレーで生還するほど大量加点＆コンボ',W/2,262);
    ctx.fillText('上級ほど返球が速い。3憤死で交代',W/2,286);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で開始',W/2,352);
    ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='14px sans-serif';ctx.fillText('BEST '+best,W/2,384);
  }
  if(state==='over'){
    ctx.fillStyle='rgba(4,8,4,0.85)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#ff6b6b';ctx.font='bold 46px sans-serif';ctx.fillText('3憤死…交代',W/2,222);
    ctx.fillStyle='#fff';ctx.font='bold 40px sans-serif';ctx.fillText('SCORE '+score,W/2,290);
    ctx.fillStyle='rgba(255,255,255,0.85)';ctx.font='19px sans-serif';ctx.fillText('生還 '+outs+'   BEST '+best,W/2,330);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で もう一度',W/2,402);
  }

  if(flash>0.02){ctx.globalAlpha=flash*0.5;ctx.fillStyle=flashCol;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}
  ctx.restore();

  ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,0.4)';ctx.font='12px sans-serif';
  ctx.fillText('ダイヤモンド一周：連打で激走し、中継返球が本塁に届く前に一周＝ランニング本塁打で生還。返球に負けると憤死、3憤死で交代',W/2,H-8);
}

function frame(ts){let dt=ts-last;last=ts;if(dt>60)dt=60;if(dt<0)dt=0;update(dt);render();requestAnimationFrame(frame);}
requestAnimationFrame(frame);

// ---------- test hook ----------
window.__rb={
  start, tap:()=>tap(),
  get state(){return state;},
  get score(){return score;},
  get outs(){return outs;},
  get fails(){return fails;},
  get info(){return {state,phase,rp,tp,throwT,tclk,lastTap,TAPCD,result,outs,fails,lvl,
    canAct:(phase==='run')};}
};
})();
</script>
</body>
</html>
