<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>対人守備 縦か中か (Contain the Winger)</title>
<style>
  html,body{margin:0;height:100%;background:#07120b;overflow:hidden;
    font-family:-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  #stage{position:relative;width:100vw;height:100vh;max-width:calc(100vh*1.5);max-height:calc(100vw/1.5);aspect-ratio:900/600;}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;border-radius:6px;}
</style>
</head>
<body>
<div id="wrap"><div id="stage"><canvas id="cv"></canvas></div></div>
<script>
(function(){
const W=900,H=600,cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let DPR=1;
function fit(){DPR=Math.min(2,window.devicePixelRatio||1);cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
fit();addEventListener('resize',fit);

// ---------- audio ----------
let AC=null;function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function tone(f,d,type,v,sweep){const a=ac();if(!a)return;const t=a.currentTime,o=a.createOscillator(),g=a.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(sweep)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+sweep),t+d);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v||0.2,t+0.008);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+0.02);}
function noise(d,v,hp){const a=ac();if(!a)return;const t=a.currentTime,n=Math.floor(a.sampleRate*d),buf=a.createBuffer(1,n,a.sampleRate),ch=buf.getChannelData(0);
  for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource();s.buffer=buf;
  const f=a.createBiquadFilter();f.type='highpass';f.frequency.value=hp||600;const g=a.createGain();g.gain.value=v||0.2;
  s.connect(f);f.connect(g);g.connect(a.destination);s.start(t);s.stop(t+d+0.02);}
const S={
  jockey:()=>{tone(300,0.05,'sine',0.04);},
  tackle:()=>{noise(0.06,0.16,600);tone(300,0.05,'square',0.08,-40);},
  win:()=>{[640,900,1180].forEach((f,i)=>setTimeout(()=>tone(f,0.11,'triangle',0.16),i*56));},
  big:()=>{[600,800,1000,1250].forEach((f,i)=>setTimeout(()=>tone(f,0.12,'triangle',0.17),i*80));},
  beat:()=>{noise(0.18,0.22,300);tone(160,0.22,'sawtooth',0.12,-50);},
  streak:()=>{[700,930,1170,1400].forEach((f,i)=>setTimeout(()=>tone(f,0.1,'triangle',0.16),i*60));},
  over:()=>{[440,330,247,175].forEach((f,i)=>setTimeout(()=>tone(f,0.3,'triangle',0.2),i*160));}
};

// ---------- geometry ----------
const YOU={x:452,y:334}, WING={x:452,y:486}, IN_T={x:356,y:148}, LN_T={x:766,y:432};
const GX0=380, GX1=520, GY=92;
const BTN=[
  {k:'inside', x:150,label:'中を止める ←',sub:'カットインを止める',col:'#3f99e0'},
  {k:'line',   x:520,label:'縦を止める →',sub:'ライン突破を止める',col:'#e0704b'}
];
const BW=230, BY=505, BH=64;

// ---------- state ----------
let state='title', phase='read', plays=0;
let score=0, combo=0, best=+(localStorage.getItem('cw_best')||0);
let outs=0, fails=0, lvl=1;   // outs = balls won
let clock=0, revealT=520, callWin=980, kind='inside', tough=false;
let decided=false, call=null, result=null, resultT=0, msg='', msgOk=false, anim=0, feint=1;
let shake=0, flash=0, flashCol='#fff', last=performance.now();
let parts=[], pops=[];

function rnd(a,b){return a+Math.random()*(b-a);}
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function lerp(a,b,u){return a+(b-a)*u;}
function easeOut(u){return 1-Math.pow(1-u,2);}

function reset(){state='title';score=0;combo=0;outs=0;fails=0;lvl=1;plays=0;result=null;parts=[];pops=[];}

function newPlay(){
  plays++; lvl=Math.min(7,1+Math.floor(outs/4));
  revealT=clamp(560-lvl*24,360,560);
  callWin=clamp(1020-lvl*70,560,1020);
  tough=Math.random()<clamp(0.2+lvl*0.05,0.2,0.5);
  kind=(Math.random()<0.5?'inside':'line');
  feint=Math.random()<0.5?-1:1;   // which way he shows before breaking
  phase='read'; clock=0; decided=false; call=null; result=null; resultT=0; msg=''; msgOk=false; anim=0;
  S.jockey();
}
function start(){ if(!ac())ac(); if(AC&&AC.state==='suspended')AC.resume(); reset(); state='play'; newPlay(); }

function correctCall(){ return kind; }

function makeCall(c){
  if(state==='title'){start();return;}
  if(state==='over'){ if(resultT>0.4){reset();start();} return; }
  if(state!=='play'||phase!=='read'||decided) return;
  if(clock<revealT){ decided=true; call=c; resolve('early'); return; }
  decided=true; call=c;
  resolve(c===correctCall()?'good':'wrong');
}

function resolve(k){
  phase='result'; result=k; resultT=0; anim=0;
  if(k==='good'){
    outs++; combo++;
    let add=Math.round((tough?250:150)*(1+Math.min(9,combo-1)*0.14)); score+=add;
    S.tackle(); setTimeout(S.win,90); if(tough)setTimeout(S.big,150);
    msgOk=true; flash=1;flashCol='#8affa0';shake=6; burst((YOU.x+ (kind==='inside'?IN_T.x:LN_T.x))/2,(YOU.y+ (kind==='inside'?IN_T.y:LN_T.y))/2,'#8affa0',16,7);
    pop(W/2,150,(tough?'鋭い仕掛けを止めた！ボール奪取！ +':'進路を切ってボール奪取！ +')+add,'#d6ffe0');
    if(combo>=2)pop(W/2,112,'コンボ x'+combo,'#ffd24d');
    if(combo>0&&combo%5===0)S.streak();
    msg=(kind==='inside')?'カットインを読んで内を切り、足を出してクリーンにボールを奪った':'縦突破を読んでライン側を切り、足を出してボールを奪った';
  } else {
    fails++; combo=0; msgOk=false; flash=1;flashCol='#ff5b5b';shake=9; S.beat();
    if(k==='early') msg='仕掛けが早い…フェイントに釣られて逆を突かれた';
    else msg=(kind==='inside')?'逆…中へカットインされて置き去りにされた':'逆…縦を突破されてクロスを上げられた';
    pop(W/2,150,'抜かれた…','#ffb0b0');
  }
  if(fails>=3){ state='over'; resultT=0; S.over(); if(score>best){best=score;localStorage.setItem('cw_best',best);} }
}

// ---------- input ----------
cv.addEventListener('pointerdown',e=>{e.preventDefault();
  if(state!=='play'||phase!=='read'){ makeCall('inside'); return; }
  const r=cv.getBoundingClientRect(); const x=(e.clientX-r.left)/r.width*W, y=(e.clientY-r.top)/r.height*H;
  for(const b of BTN){ if(x>=b.x&&x<=b.x+BW&&y>=BY&&y<=BY+BH){ makeCall(b.k); return; } }
  makeCall(x<W*0.5?'inside':'line');
});
addEventListener('keydown',e=>{ if(e.repeat)return;
  if(e.code==='ArrowLeft'||e.code==='KeyA'){e.preventDefault();makeCall('inside');}
  else if(e.code==='ArrowRight'||e.code==='KeyD'){e.preventDefault();makeCall('line');}
  else if(e.code==='Space'||e.code==='Enter'){e.preventDefault(); if(state!=='play')makeCall('inside');} });

// ---------- particles ----------
function burst(x,y,c,n,sp){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=rnd(sp*0.3,sp);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:1,c});}}
function pop(x,y,txt,c){pops.push({x,y,txt,c,life:1});}

// ---------- update ----------
function update(dt){
  shake*=Math.pow(0.86,dt/16.7); if(shake<0.3)shake=0;
  flash*=Math.pow(0.9,dt/16.7);
  for(const q of parts){q.vx*=0.96;q.vy=q.vy*0.96+0.28;q.x+=q.vx*dt/16.7;q.y+=q.vy*dt/16.7;q.life-=dt/16.7*0.026;}
  parts=parts.filter(q=>q.life>0);
  for(const q of pops){q.y-=dt/16.7*0.5;q.life-=dt/16.7*0.02;}
  pops=pops.filter(q=>q.life>0);

  if(state!=='play'){ if(state==='over')resultT+=dt/1000; return; }
  if(phase==='read'){ clock+=dt;
    if(clock>=revealT) anim=Math.min(1,anim+dt/300);
    if(!decided && clock>revealT+callWin){ decided=true; call=null; resolve('late'); }
    return; }
  if(phase==='result'){ resultT+=dt/1000; anim=Math.min(1,anim+dt/360); if(resultT>1.5) newPlay(); return; }
}

// ---------- render ----------
function drawField(){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#12703f');g.addColorStop(0.5,'#0f5e34');g.addColorStop(1,'#0c4c2b');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  for(let i=0;i<8;i++){ctx.fillStyle=i%2?'rgba(255,255,255,0.03)':'rgba(0,0,0,0.03)';ctx.fillRect(0,i*80,W,80);}
  // goal top-center (the danger the winger cuts toward)
  ctx.fillStyle='rgba(255,255,255,0.07)';ctx.fillRect(GX0,58,GX1-GX0,GY-58);
  ctx.strokeStyle='rgba(255,255,255,0.3)';ctx.lineWidth=1;
  for(let x=GX0;x<=GX1;x+=13){ctx.beginPath();ctx.moveTo(x,58);ctx.lineTo(x,GY);ctx.stroke();}
  for(let y=58;y<=GY;y+=11){ctx.beginPath();ctx.moveTo(GX0,y);ctx.lineTo(GX1,y);ctx.stroke();}
  ctx.strokeStyle='#f4f4f4';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(GX0,GY);ctx.lineTo(GX1,GY);ctx.stroke();
  // touchline on the right (the "line")
  ctx.strokeStyle='rgba(255,255,255,0.25)';ctx.lineWidth=2;ctx.setLineDash([7,7]);ctx.beginPath();ctx.moveTo(820,60);ctx.lineTo(820,H-40);ctx.stroke();ctx.setLineDash([]);
  ctx.fillStyle='rgba(255,255,255,0.4)';ctx.font='11px sans-serif';ctx.textAlign='right';ctx.fillText('タッチライン',812,80);
}
function person(x,y,col,s,lean){s=s||1;lean=lean||0;
  ctx.save();ctx.translate(x,y);ctx.rotate(lean);
  ctx.fillStyle=col;ctx.beginPath();ctx.ellipse(0,-15*s,10*s,15*s,0,0,6.28);ctx.fill();
  ctx.fillStyle='#f0c9a0';ctx.beginPath();ctx.arc(0,-34*s,7.5*s,0,6.28);ctx.fill();
  ctx.restore();
}

function render(){
  ctx.save();
  if(shake>0)ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
  drawField();

  if(state==='play'||state==='over'){
    const revealed=(phase==='read'&&clock>=revealT)||phase==='result';
    const T=(kind==='inside')?IN_T:LN_T;

    // winger with the ball
    let wx=WING.x, wy=WING.y;
    if(!revealed){ wx=WING.x + feint*Math.sin(clock/90)*8; }   // jockeying feint wobble
    else {
      let p=easeOut(anim);
      if(phase==='result'&&result==='good') p=easeOut(anim)*0.42;   // stopped by the tackle
      wx=lerp(WING.x,T.x,p); wy=lerp(WING.y,T.y,p);
    }

    // you (defender): step toward the called side; goal-side of the winger
    let dx=YOU.x, dy=YOU.y, dl=0;
    if(phase==='result'){
      const CT=(call==='inside')?IN_T:(call==='line')?LN_T:null;
      if(result==='good'){ dx=lerp(YOU.x,(wx+YOU.x)/2 + (T.x-YOU.x)*0.12, easeOut(anim)); dy=lerp(YOU.y,wy+8,easeOut(anim)); dl=(kind==='inside'?-0.4:0.4); }
      else if(result==='wrong'&&CT){ dx=lerp(YOU.x,YOU.x+(CT.x-YOU.x)*0.4,easeOut(anim)); dy=lerp(YOU.y,YOU.y+(CT.y-YOU.y)*0.4,easeOut(anim)); dl=(call==='inside'?-0.5:0.5); }
      else if(result==='early'&&CT){ dx=lerp(YOU.x,YOU.x+(CT.x-YOU.x)*0.5,easeOut(anim)); dl=(call==='inside'?-0.8:0.8); }  // lunged, off balance
    }
    person(dx,dy,'#2b6fd6',1.0,dl);
    person(wx,wy,'#d0403a',0.96,revealed?(kind==='inside'?-0.2:0.2):0);
    // ball at winger's feet
    const bxo=(kind==='inside'?-14:14);
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(wx+(revealed?bxo:0),wy+8,7,0,6.28);ctx.fill();
    ctx.strokeStyle='#222';ctx.lineWidth=1;ctx.beginPath();ctx.arc(wx+(revealed?bxo:0),wy+8,7,0.4,2.2);ctx.stroke();

    // reveal direction arrow + label
    if(revealed){
      ctx.strokeStyle=(kind==='inside')?'rgba(120,200,255,0.9)':'rgba(255,150,110,0.9)';ctx.lineWidth=4;
      const ax=lerp(WING.x,T.x,0.3), ay=lerp(WING.y,T.y,0.3);
      ctx.beginPath();ctx.moveTo(WING.x,WING.y-30);ctx.lineTo(ax,ay-20);ctx.stroke();
      ctx.textAlign='center';ctx.fillStyle=(kind==='inside')?'rgba(150,210,255,0.98)':'rgba(255,170,130,0.98)';ctx.font='bold 18px sans-serif';
      ctx.fillText(kind==='inside'?'カットイン！（中へ）':'縦へ！（ライン側）',clamp(wx,120,780),wy-52);
    }

    // cue banner + timer
    ctx.textAlign='center';
    if(state==='play'&&phase==='read'){
      if(clock<revealT){ ctx.fillStyle='rgba(255,220,90,0.95)';ctx.font='bold 20px sans-serif';ctx.fillText('1対1！ 縦か中か——仕掛けを読んで進路を切れ',W/2,44); }
      else { ctx.fillStyle='rgba(255,220,120,0.98)';ctx.font='bold 22px sans-serif';ctx.fillText('どっちだ！ 中か、縦か',W/2,44);
        const p=clamp((clock-revealT)/callWin,0,1),bw=250,x=W/2-bw/2,y=58;
        ctx.fillStyle='rgba(255,255,255,0.18)';ctx.fillRect(x,y,bw,7);ctx.fillStyle=p<0.7?'#8affa0':(p<1?'#ffd24d':'#ff5b5b');ctx.fillRect(x,y,bw*p,7); }
    }

    if(state==='play'){
      for(const b of BTN){ const active=phase==='read'&&clock>=revealT;
        ctx.fillStyle=active?b.col:'rgba(255,255,255,0.10)';rr(b.x,BY,BW,BH,10);ctx.fill();
        ctx.fillStyle=active?'#08130c':'rgba(255,255,255,0.5)';ctx.textAlign='center';ctx.font='bold 19px sans-serif';ctx.fillText(b.label,b.x+BW/2,BY+27);
        ctx.font='11px sans-serif';ctx.fillText(b.sub,b.x+BW/2,BY+47); }
      ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='12px sans-serif';ctx.textAlign='center';ctx.fillText('タップ / ←=中を止める ・ →=縦を止める',W/2,BY+BH+18);
    }
  }

  for(const q of parts){ctx.globalAlpha=Math.max(0,q.life);ctx.fillStyle=q.c;ctx.beginPath();ctx.arc(q.x,q.y,3.2,0,6.28);ctx.fill();}
  ctx.globalAlpha=1;
  for(const q of pops){ctx.globalAlpha=Math.max(0,q.life);ctx.fillStyle=q.c;ctx.font='bold 21px sans-serif';ctx.textAlign='center';ctx.fillText(q.txt,q.x,q.y);}
  ctx.globalAlpha=1;

  // HUD
  ctx.textAlign='left';ctx.fillStyle='#fff';ctx.font='bold 26px sans-serif';ctx.fillText('SCORE '+score,20,36);
  ctx.textAlign='right';ctx.fillStyle='rgba(255,255,255,0.9)';ctx.font='14px sans-serif';ctx.fillText('奪取 '+outs+'  Lv'+lvl,W-20,24);
  ctx.fillText('被突破',W-116,46);
  for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(W-60+i*20,41,7,0,6.28);ctx.fillStyle=i<fails?'#ff5b5b':'rgba(255,255,255,0.25)';ctx.fill();}

  if(state==='play'&&phase==='result'&&msg){ctx.textAlign='center';ctx.fillStyle=msgOk?'#9ff0b8':'#ff9a9a';ctx.font='bold 15px sans-serif';ctx.fillText(msg,W/2,474);}

  if(state==='title'){
    ctx.fillStyle='rgba(4,8,4,0.83)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='bold 38px sans-serif';ctx.fillText('対人守備 縦か中か',W/2,84);
    ctx.fillStyle='#ffd23e';ctx.font='bold 22px sans-serif';ctx.fillText('Contain the Winger',W/2,120);
    ctx.fillStyle='rgba(255,255,255,0.92)';ctx.font='16px sans-serif';
    ctx.fillText('1対1守備——仕掛けてくるウインガーが“縦（ライン）”か“中（カットイン）”かを読み、進路を切ってボールを奪え',W/2,178);
    ctx.fillStyle='rgba(255,255,255,0.66)';ctx.font='14px sans-serif';
    ctx.fillText('仕掛けが判明した瞬間、行った方向へ足を出す＝中へ来たら「中を止める」（←）／縦へ来たら「縦を止める」（→）',W/2,216);
    ctx.fillText('正しい側を切ればクリーンにボール奪取（際どい鋭い仕掛けを止めると大量加点）',W/2,240);
    ctx.fillText('逆を選ぶと置き去り／仕掛け前に動くとフェイントに釣られる／反応が遅いと抜かれる',W/2,264);
    ctx.fillText('上級ほど仕掛けが速く鋭く猶予も短い。3被突破で交代',W/2,288);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で開始',W/2,356);
    ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='14px sans-serif';ctx.fillText('BEST '+best,W/2,388);
  }
  if(state==='over'){
    ctx.fillStyle='rgba(4,8,4,0.85)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#ff6b6b';ctx.font='bold 46px sans-serif';ctx.fillText('3被突破…交代',W/2,222);
    ctx.fillStyle='#fff';ctx.font='bold 40px sans-serif';ctx.fillText('SCORE '+score,W/2,290);
    ctx.fillStyle='rgba(255,255,255,0.85)';ctx.font='19px sans-serif';ctx.fillText('奪取 '+outs+'   BEST '+best,W/2,330);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で もう一度',W/2,402);
  }

  if(flash>0.02){ctx.globalAlpha=flash*0.5;ctx.fillStyle=flashCol;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}
  ctx.restore();

  ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,0.4)';ctx.font='12px sans-serif';
  ctx.fillText('対人守備 縦か中か：ウインガーの仕掛け（中/縦）を読んで進路を切りボール奪取。逆/早/遅は被突破、3つで交代',W/2,H-8);
}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

function frame(ts){let dt=ts-last;last=ts;if(dt>60)dt=60;if(dt<0)dt=0;update(dt);render();requestAnimationFrame(frame);}
requestAnimationFrame(frame);

// ---------- test hook ----------
window.__cw={
  start, makeCall:(c)=>makeCall(c),
  get state(){return state;},
  get score(){return score;},
  get outs(){return outs;},
  get fails(){return fails;},
  get info(){return {state,phase,clock,revealT,callWin,kind,tough,decided,call,result,outs,fails,lvl,
    revealed:(clock>=revealT),correctCall:correctCall(),canAct:(phase==='read'&&!decided)};}
};
})();
</script>
</body>
</html>
