<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ライナーで弾き返せ (Launch Angle)</title>
<style>
  html,body{margin:0;padding:0;background:#0a1016;overflow:hidden;font-family:'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif;-webkit-user-select:none;user-select:none;touch-action:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 26%,#20364a,#060a12 72%);}
  #stage{position:relative;width:min(100vw,calc(100vh*1.5));aspect-ratio:900/600;max-width:900px;box-shadow:0 10px 60px rgba(0,0,0,.6);border-radius:8px;overflow:hidden;}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;}
</style>
</head>
<body>
<div id="wrap"><div id="stage"><canvas id="cv"></canvas></div></div>
<script>
(function(){
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const W=900,H=600;let DPR=Math.min(2,window.devicePixelRatio||1);
function fit(){const r=cv.getBoundingClientRect();DPR=Math.min(2,window.devicePixelRatio||1);cv.width=Math.round(r.width*DPR);cv.height=Math.round(r.height*DPR);ctx.setTransform(cv.width/W,0,0,cv.height/H,0,0);}
new ResizeObserver(fit).observe(cv);fit();

// ---------- audio ----------
let AC=null;function actx(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function tone(f,d,type,v,sweep){const a=actx();if(!a)return;const o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.value=f;if(sweep)o.frequency.linearRampToValueAtTime(sweep,a.currentTime+d);g.gain.value=0.0001;g.gain.exponentialRampToValueAtTime(v||0.2,a.currentTime+0.008);g.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+d);o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+d+0.02);}
function noise(d,v,hp){const a=actx();if(!a)return;const n=a.createBufferSource(),b=a.createBuffer(1,a.sampleRate*d,a.sampleRate),dt=b.getChannelData(0);for(let i=0;i<dt.length;i++)dt[i]=Math.random()*2-1;n.buffer=b;const f=a.createBiquadFilter();f.type='highpass';f.frequency.value=hp||800;const g=a.createGain();g.gain.value=0.0001;g.gain.exponentialRampToValueAtTime(v||0.2,a.currentTime+0.01);g.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+d);n.connect(f);f.connect(g);g.connect(a.destination);n.start();n.stop(a.currentTime+d+0.02);}
const S={
  tick(){tone(660,0.04,'sine',0.045);},
  crack(){noise(0.05,0.26,600);tone(240,0.08,'square',0.16,120);},
  liner(){tone(680,0.09,'triangle',0.18);setTimeout(function(){tone(960,0.12,'triangle',0.2);},80);setTimeout(function(){tone(1180,0.14,'triangle',0.16);},180);},
  roar(){noise(0.5,0.14,300);},
  grnd(){noise(0.09,0.16,300);tone(150,0.14,'square',0.14,90);},
  glove(){noise(0.06,0.24,900);tone(300,0.06,'square',0.12);},
  take(){tone(300,0.16,'sawtooth',0.12,180);},
  combo(n){tone(560+Math.min(n,8)*70,0.12,'triangle',0.16);},
  over(){tone(330,0.3,'sine',0.2,160);setTimeout(function(){tone(220,0.5,'sine',0.2,110);},180);},
  start(){tone(440,0.1,'triangle',0.18);setTimeout(function(){tone(660,0.16,'triangle',0.2);},110);},
};

function clamp(v,a,b){return v<a?a:v>b?b:v;}
function rnd(a,b){return a+Math.random()*(b-a);}

// ---------- state ----------
let state='title';
let outs=0,fails=0,score=0,combo=0,lvl=1;   // outs = clean line-drive hits
let best=0;try{best=parseInt(localStorage.getItem('la_best')||'0')||0;}catch(e){}
const TARGET=26;

let phase='wind';  // wind | aim(swing-plane sweeps) | result
let pt=0, swp=0;
let period=1400, bandW=0.24, bandC=0.5, deadT=3000, tough=false;
let pos=0;
let decided=false, result='', stopPos=0, quality=0;
let parts=[];
let shakeT=0,flash=0;
let msg='',msgCol='#fff',msgT=0;
let ballU=0;
// scene (side view)
const GROUND=452, PLATE=[150,GROUND], BALL0=[178,GROUND-40];
const INF=[392,GROUND], OFX=690, FENCEX=858;
// launch-angle meter (vertical, left)
const MX=54, MW=30, MTOP=132, MBOT=474;
function meterY(p){return MBOT+(MTOP-MBOT)*clamp(p,0,1);}

function reset(){outs=0;fails=0;score=0;combo=0;lvl=1;parts=[];}
function newPitch(){
  lvl=Math.min(7,1+Math.floor(outs/4));
  period=clamp(1560-lvl*110,860,1560);
  tough=Math.random()<clamp(0.2+lvl*0.05,0.2,0.5);
  bandW=clamp(0.26-lvl*0.02,0.12,0.26)*(tough?0.8:1);
  bandC=rnd(0.30,0.70);   // ideal swing plane varies with the pitch
  deadT=clamp(3200-lvl*180,1900,3200);
  phase='wind';pt=0;swp=0;pos=0;decided=false;result='';stopPos=0;quality=0;ballU=0;
}
function startGame(){reset();state='play';newPitch();S.start();}

function burst(x,y,col,n,sp){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=rnd(0.4,1)*(sp||3);parts.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:1,col:col,r:rnd(2,5)});}}

function resolve(kind){
  decided=true;stopPos=pos;ballU=0;
  if(kind==='hit'){
    result='hit';outs++;combo++;
    const half=bandW/2;quality=clamp(1-Math.abs(pos-bandC)/half,0,1);
    const cm=1+Math.min(combo-1,6)*0.14;
    const add=Math.round((100+quality*130)*cm)*Math.max(1,lvl);
    score+=add;lastAdd=add;
    S.crack();setTimeout(S.liner,90);setTimeout(S.roar,300);if(combo>1)setTimeout(function(){S.combo(combo);},500);
    flash=0.28;
    msg=(quality>0.7?'ど真ん中のライナー！ ギャップを真っ二つ！':'ライナーでクリーンヒット！')+'  +'+add;
    msgCol='#5affa0';msgT=1;
  }else if(kind==='take'){
    result='take';combo=0;fails++;S.take();flash=0.24;shakeT=0.5;
    msg='スイングを迷った！ 見逃し三振';msgCol='#ff6a6a';msgT=1;
  }else{ // miss: below band = grounder, above = flyout
    combo=0;fails++;S.crack();flash=0.3;shakeT=0.6;
    if(pos<bandC){result='grounder';setTimeout(S.grnd,90);msg='上から叩きすぎ！ 力ないゴロ';}
    else{result='flyout';setTimeout(S.glove,120);msg='下をこすった！ 平凡なフライ';}
    msgCol='#ff6a6a';msgT=1;
  }
  phase='result';pt=0;
}

function swing(){
  if(state!=='play'||phase!=='aim'||decided)return;
  const half=bandW/2;
  if(Math.abs(pos-bandC)<=half)resolve('hit');
  else resolve('miss');
}

// ---------- input ----------
function act(){if(!AC)actx();if(state==='title'){startGame();return;}if(state==='over'){startGame();return;}swing();}
cv.addEventListener('mousedown',function(e){e.preventDefault();act();});
cv.addEventListener('touchstart',function(e){e.preventDefault();act();},{passive:false});
window.addEventListener('keydown',function(e){
  if(e.code==='Space'||e.code==='ArrowUp'||e.code==='Enter'||e.code==='KeyK'){e.preventDefault();act();}
});

// ---------- update ----------
let last=0;
function update(dt){
  if(flash>0)flash=Math.max(0,flash-dt/300);
  if(shakeT>0)shakeT=Math.max(0,shakeT-dt/320);
  if(msgT>0)msgT=Math.max(0,msgT-dt/1500);
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.x+=p.vx;p.y+=p.vy;p.vy+=0.16;p.life-=dt/640;if(p.life<=0)parts.splice(i,1);}
  if(state!=='play')return;
  pt+=dt;
  if(phase==='wind'){
    if(pt>=420){phase='aim';pt=0;swp=0;}
  }else if(phase==='aim'){
    swp+=dt;
    const ph=(swp%period)/period;
    pos=1-Math.abs(2*ph-1);
    if(Math.floor(swp/(period/2))!==Math.floor((swp-dt)/(period/2)))S.tick();
    if(swp>=deadT&&!decided)resolve('take');
  }else if(phase==='result'){
    if(ballU<1)ballU=Math.min(1,ballU+dt/560);
    if(result==='hit'&&ballU>0.5&&ballU<0.98&&Math.random()<0.3){const b=ballPos(ballU);burst(b[0],b[1],'#fff',1,1.2);}
    if(pt>=1240){
      if(fails>=3){state='over';best=Math.max(best,score);try{localStorage.setItem('la_best',String(best));}catch(e){}S.over();}
      else if(outs>=TARGET){state='over';best=Math.max(best,score);try{localStorage.setItem('la_best',String(best));}catch(e){}S.liner();}
      else newPitch();
    }
  }
}

// batted-ball trajectory in the result phase
function ballPos(u){
  u=clamp(u,0,1);
  if(result==='hit'){
    const landX=560+quality*250;                       // deeper into the gap when squared up
    const x=BALL0[0]+(landX-BALL0[0])*u;
    const y=(BALL0[1])-Math.sin(u*Math.PI)*54 + u*30;  // low hard rope, drops in the outfield
    return [x,Math.min(GROUND-4,y)];
  }else if(result==='grounder'){
    const x=BALL0[0]+(INF[0]-BALL0[0])*Math.min(u*1.3,1);
    const y=GROUND-8-Math.sin(Math.min(u*1.3,1)*Math.PI)*10;
    return [x,y];
  }else if(result==='flyout'){
    const x=BALL0[0]+(OFX-BALL0[0])*u;
    const y=BALL0[1]-Math.sin(u*Math.PI)*250;          // lazy high fly
    return [x,y];
  }else{ // take
    const x=BALL0[0]-14-u*8;
    return [x,BALL0[1]+6];
  }
}

// ---------- render ----------
function roundRect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

function drawField(){
  // sky
  const sky=ctx.createLinearGradient(0,0,0,GROUND);sky.addColorStop(0,'#2a4a6e');sky.addColorStop(1,'#3f6f8f');
  ctx.fillStyle=sky;ctx.fillRect(0,0,W,GROUND);
  // outfield wall at the right
  ctx.fillStyle='#1f6b39';ctx.fillRect(FENCEX,GROUND-120,W-FENCEX,120);
  ctx.fillStyle='#123a20';ctx.fillRect(FENCEX-4,GROUND-120,4,120);
  // ground
  const gr=ctx.createLinearGradient(0,GROUND,0,H);gr.addColorStop(0,'#2f7d45');gr.addColorStop(1,'#256036');
  ctx.fillStyle=gr;ctx.fillRect(0,GROUND,W,H-GROUND);
  // infield dirt near the plate
  ctx.fillStyle='#b98a52';ctx.beginPath();ctx.moveTo(90,GROUND);ctx.lineTo(470,GROUND);ctx.lineTo(430,H);ctx.lineTo(60,H);ctx.closePath();ctx.fill();
  // ground line
  ctx.strokeStyle='rgba(255,255,255,.2)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,GROUND);ctx.lineTo(W,GROUND);ctx.stroke();
  // home plate
  ctx.fillStyle='#eee';ctx.beginPath();ctx.moveTo(PLATE[0]-10,GROUND+8);ctx.lineTo(PLATE[0]+10,GROUND+8);ctx.lineTo(PLATE[0]+10,GROUND+16);ctx.lineTo(PLATE[0],GROUND+22);ctx.lineTo(PLATE[0]-10,GROUND+16);ctx.closePath();ctx.fill();
}

function fielder(x,y,col,reach){
  ctx.save();ctx.translate(x,y);
  ctx.fillStyle='rgba(0,0,0,.24)';ctx.beginPath();ctx.ellipse(0,4,13,5,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#222';ctx.fillRect(-7,-4,6,22);ctx.fillRect(1,-4,6,22);
  ctx.fillStyle=col;ctx.fillRect(-10,-28,20,26);
  ctx.fillStyle='#f0c9a0';ctx.beginPath();ctx.arc(0,-37,8,0,Math.PI*2);ctx.fill();
  if(reach){ctx.strokeStyle=col;ctx.lineWidth=5;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(6,-22);ctx.lineTo(16,-38);ctx.stroke();ctx.fillStyle='#8a5a2a';ctx.beginPath();ctx.arc(18,-40,7,0,Math.PI*2);ctx.fill();}
  ctx.restore();
}

function drawBatter(){
  const swung=(phase==='result');
  ctx.save();ctx.translate(PLATE[0],GROUND);
  ctx.fillStyle='rgba(0,0,0,.26)';ctx.beginPath();ctx.ellipse(0,6,18,6,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#222';ctx.fillRect(-10,-16,8,22);ctx.fillRect(2,-16,8,22);
  ctx.fillStyle='#2f6fd0';ctx.fillRect(-13,-46,26,32);
  ctx.fillStyle='#f0c9a0';ctx.beginPath();ctx.arc(0,-56,10,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#1b2740';ctx.beginPath();ctx.arc(0,-58,10,Math.PI,0);ctx.fill();
  // bat: raised while aiming, swung level on contact
  const ang=swung? (result==='grounder'?-0.5:result==='flyout'?0.7:0.1) : -2.0;
  ctx.save();ctx.translate(-4,-44);ctx.rotate(ang);
  ctx.strokeStyle='#c98b3a';ctx.lineWidth=6;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(46,0);ctx.stroke();ctx.restore();
  ctx.restore();
}

function drawMeter(){
  if(state!=='play')return;
  // track
  roundRect(MX,MTOP,MW,MBOT-MTOP,8);ctx.fillStyle='rgba(0,0,0,.42)';ctx.fill();
  // zones: top=fly, band=liner(green), bottom=grounder
  const yBandTop=meterY(bandC+bandW/2), yBandBot=meterY(bandC-bandW/2);
  ctx.fillStyle='rgba(90,160,255,.22)';ctx.fillRect(MX,MTOP,MW,yBandTop-MTOP);          // fly zone (high)
  ctx.fillStyle='rgba(200,150,60,.22)';ctx.fillRect(MX,yBandBot,MW,MBOT-yBandBot);       // grounder zone (low)
  const gg=ctx.createLinearGradient(0,yBandTop,0,yBandBot);gg.addColorStop(0,'rgba(90,220,150,.5)');gg.addColorStop(0.5,'rgba(60,255,150,.95)');gg.addColorStop(1,'rgba(90,220,150,.5)');
  ctx.fillStyle=gg;ctx.fillRect(MX,yBandTop,MW,yBandBot-yBandTop);
  roundRect(MX,MTOP,MW,MBOT-MTOP,8);ctx.strokeStyle='rgba(255,255,255,.4)';ctx.lineWidth=1.5;ctx.stroke();
  // labels
  ctx.textAlign='center';ctx.font='11px sans-serif';
  ctx.fillStyle='#9fc4ff';ctx.fillText('フライ',MX+MW/2,MTOP-6);
  ctx.fillStyle='#5affa0';ctx.font='bold 12px sans-serif';ctx.fillText('ライナー',MX+MW/2,(yBandTop+yBandBot)/2+4);
  ctx.fillStyle='#e0b060';ctx.font='11px sans-serif';ctx.fillText('ゴロ',MX+MW/2,MBOT+14);
  // pointer
  const p=(phase==='aim'&&!decided)?pos:stopPos;
  const py=meterY(p);
  const col=(phase==='result')?(result==='hit'?'#5affa0':'#ff6a6a'):'#fff';
  ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(MX-8,py);ctx.lineTo(MX-1,py-6);ctx.lineTo(MX-1,py+6);ctx.closePath();ctx.fill();
  ctx.fillStyle=col;ctx.fillRect(MX,py-2,MW,4);
  ctx.beginPath();ctx.moveTo(MX+MW+8,py);ctx.lineTo(MX+MW+1,py-6);ctx.lineTo(MX+MW+1,py+6);ctx.closePath();ctx.fill();
  // dead-time bar
  if(phase==='aim'){const tl=clamp((deadT-swp)/deadT,0,1);roundRect(MX-6,MBOT+22,MW+12,7,3);ctx.fillStyle='rgba(0,0,0,.4)';ctx.fill();ctx.fillStyle=tl<0.28?'#ff6a6a':'#ffd23a';ctx.fillRect(MX-6,MBOT+22,(MW+12)*tl,7);}
}

function drawBall(){
  if(phase==='wind'){
    // pitch coming toward the plate
    const u=clamp(pt/420,0,1);const bx=PLATE[0]+340*(1-u)+30, by=GROUND-70+ (0)*u;
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(bx,by,7,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='#d33';ctx.lineWidth=1.2;ctx.beginPath();ctx.arc(bx-2,by,5,-0.7,0.7);ctx.stroke();
    return;
  }
  if(phase==='aim'){
    // ball hovers at the contact point, waiting
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(BALL0[0]+6,BALL0[1],7,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#1c1c1c';ctx.beginPath();ctx.arc(BALL0[0]+4,BALL0[1]-2,2.3,0,Math.PI*2);ctx.fill();
    return;
  }
  // result: flying ball
  const b=ballPos(ballU);
  // trail
  const b2=ballPos(Math.max(0,ballU-0.05));
  ctx.strokeStyle='rgba(255,255,255,.4)';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(b2[0],b2[1]);ctx.lineTo(b[0],b[1]);ctx.stroke();
  ctx.fillStyle='rgba(0,0,0,.18)';ctx.beginPath();ctx.ellipse(b[0],Math.min(GROUND-2,b[1]+ (GROUND-6-b[1])*0.0)+6,7,3,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=result==='hit'?'#fff':'#fff';ctx.beginPath();ctx.arc(b[0],b[1],7,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='#d33';ctx.lineWidth=1.2;ctx.beginPath();ctx.arc(b[0]-2,b[1],5,-0.7,0.7);ctx.stroke();
}

function drawScene(){
  drawField();
  // fielders: infielder (grounder) and outfielder (flyout / hit landing)
  const infReach=(phase==='result'&&result==='grounder'&&ballU>0.7);
  fielder(INF[0]+8,GROUND,'#c0343a',infReach);
  const ofReach=(phase==='result'&&result==='flyout'&&ballU>0.7);
  fielder(OFX+14,GROUND,'#c0343a',ofReach);
  drawBatter();
  drawBall();
  drawMeter();
  // outcome tag near landing
  if(phase==='result'&&ballU>0.85){
    let t='',tx=b_tagx(),ty=0,tc='#fff';
    if(result==='hit'){t='ヒット!';const b=ballPos(1);tx=b[0];ty=b[1]-18;tc='#5affa0';}
    else if(result==='grounder'){t='ゴロ アウト';tx=INF[0]+8;ty=GROUND-58;tc='#ff8a8a';}
    else if(result==='flyout'){t='フライ アウト';tx=OFX+14;ty=GROUND-58;tc='#ff8a8a';}
    if(t){ctx.textAlign='center';ctx.font='bold 16px sans-serif';ctx.fillStyle=tc;ctx.fillText(t,tx,ty);}
  }
}
function b_tagx(){return 450;}

function drawHUD(){
  ctx.textAlign='left';ctx.textBaseline='alphabetic';
  ctx.font='bold 20px sans-serif';ctx.fillStyle='#fff';
  ctx.fillText('ヒット '+outs+' / '+TARGET,120,32);
  ctx.font='14px sans-serif';ctx.fillStyle='#ffb14a';ctx.fillText('アウト '+fails+' / 3',120,54);
  ctx.textAlign='right';
  ctx.font='bold 20px sans-serif';ctx.fillStyle='#ffe08a';ctx.fillText('SCORE '+score,W-20,32);
  ctx.font='13px sans-serif';ctx.fillStyle='#bfe';ctx.fillText('BEST '+Math.max(best,score)+'   Lv.'+lvl,W-20,52);
  if(combo>1){ctx.textAlign='center';ctx.font='bold 20px sans-serif';ctx.fillStyle='#5affa0';ctx.fillText(combo+' 連続ヒット!',470,84);}
  if(phase==='aim'&&!decided){ctx.textAlign='center';ctx.font='bold 15px sans-serif';ctx.fillStyle='#ffe08a';ctx.fillText('上下に動く“スイング軌道”を、緑のライナー帯でピタッと止めて振れ！',480,110);}
}

function drawMsg(){
  if(msgT<=0)return;
  ctx.save();ctx.globalAlpha=clamp(msgT*1.4,0,1);
  ctx.textAlign='center';ctx.font='bold 23px sans-serif';
  ctx.fillStyle='rgba(0,0,0,.62)';roundRect(470-300,506,600,42,10);ctx.fill();
  ctx.fillStyle=msgCol;ctx.fillText(msg,470,534);
  ctx.restore();
}

function drawTitle(){
  drawField();fielder(INF[0]+8,GROUND,'#c0343a',0);fielder(OFX+14,GROUND,'#c0343a',0);drawBatter();
  ctx.save();ctx.textAlign='center';
  ctx.fillStyle='rgba(0,0,0,.72)';roundRect(150,96,660,404,16);ctx.fill();
  ctx.fillStyle='#fff';ctx.font='bold 34px sans-serif';ctx.fillText('ライナーで弾き返せ',480,152);
  ctx.font='18px sans-serif';ctx.fillStyle='#9fe0bf';ctx.fillText('Launch Angle',480,182);
  ctx.font='16px sans-serif';ctx.fillStyle='#e6fcef';
  const lines=[
    'あなたは打者。左のメーターは“スイングの軌道（打球角度）”。',
    '針が上下に往復する——緑の「ライナー」帯でピタッと止めて振れば',
    '弾丸ライナーがギャップを抜けてクリーンヒット！',
    '帯より上で振る＝下をこすって平凡なフライ（アウト）。',
    '帯より下で振る＝上から叩きすぎて力ないゴロ（アウト）。',
    'タップ / クリック / SPACE で振る。26ヒットで達成、3アウトで終了。',
  ];
  for(let i=0;i<lines.length;i++)ctx.fillText(lines[i],480,224+i*30);
  ctx.fillStyle='#ffe08a';ctx.font='bold 22px sans-serif';
  ctx.fillText('タップ / SPACE でスタート',480,478);
  ctx.restore();
}

function drawOver(){
  drawField();
  ctx.save();ctx.textAlign='center';
  ctx.fillStyle='rgba(0,0,0,.72)';roundRect(190,150,520,300,16);ctx.fill();
  const w2=outs>=TARGET;
  ctx.fillStyle=w2?'#5affa0':'#ff8a5a';ctx.font='bold 34px sans-serif';
  ctx.fillText(w2?'ライナーの申し子！':'打ち上げすぎ…',450,222);
  ctx.fillStyle='#fff';ctx.font='20px sans-serif';
  ctx.fillText('ヒット '+outs+' / '+TARGET,450,270);
  ctx.fillText('スコア '+score,450,304);
  ctx.fillStyle='#ffe08a';ctx.fillText('ベスト '+Math.max(best,score),450,336);
  ctx.fillStyle='#9fe0bf';ctx.font='bold 20px sans-serif';
  ctx.fillText('タップ / SPACE でもう一度',450,404);
  ctx.restore();
}

function render(){
  ctx.save();
  if(shakeT>0){const s=shakeT*7;ctx.translate(rnd(-s,s),rnd(-s,s));}
  if(state==='title'){drawTitle();}
  else if(state==='over'){drawOver();}
  else{
    drawScene();
    drawHUD();
    drawMsg();
  }
  for(const p of parts){ctx.globalAlpha=clamp(p.life,0,1);ctx.fillStyle=p.col;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();}
  ctx.globalAlpha=1;
  ctx.restore();
  if(flash>0){ctx.fillStyle='rgba(255,255,180,'+(flash*0.4)+')';ctx.fillRect(0,0,W,H);}
}

function frame(ts){let dt=ts-last;last=ts;if(dt>60)dt=60;if(dt<0)dt=0;update(dt);render();requestAnimationFrame(frame);}
requestAnimationFrame(frame);

// ---------- test hook ----------
window.__la={
  start:startGame,
  swing:swing,
  get state(){return state;},
  get outs(){return outs;},
  get fails(){return fails;},
  get score(){return score;},
  get info(){return {state:state,phase:phase,swp:swp,pos:pos,bandC:bandC,bandW:bandW,period:period,deadT:deadT,timeLeft:(deadT-swp),tough:tough,decided:decided,result:result,quality:quality,outs:outs,fails:fails,lvl:lvl,inBand:(Math.abs(pos-bandC)<=bandW/2),dist:Math.abs(pos-bandC),canAct:(state==='play'&&phase==='aim'&&!decided)};}
};
})();
</script>
