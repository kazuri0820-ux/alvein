<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>第二リード (Secondary Lead)</title>
<style>
  html,body{margin:0;height:100%;background:#0a0d08;overflow:hidden;
    font-family:-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  #stage{position:relative;width:100vw;height:100vh;max-width:calc(100vh*1.5);max-height:calc(100vw/1.5);aspect-ratio:900/600;}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;border-radius:6px;}
</style>
</head>
<body>
<div id="wrap"><div id="stage"><canvas id="cv"></canvas></div></div>
<script>
(function(){
const W=900,H=600,cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let DPR=1;
function fit(){DPR=Math.min(2,window.devicePixelRatio||1);cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
fit();addEventListener('resize',fit);

// ---------- audio ----------
let AC=null;function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function tone(f,d,type,v,sweep){const a=ac();if(!a)return;const t=a.currentTime,o=a.createOscillator(),g=a.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(sweep)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+sweep),t+d);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v||0.2,t+0.008);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+0.02);}
function noise(d,v,hp){const a=ac();if(!a)return;const t=a.currentTime,n=Math.floor(a.sampleRate*d),buf=a.createBuffer(1,n,a.sampleRate),ch=buf.getChannelData(0);
  for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource();s.buffer=buf;
  const f=a.createBiquadFilter();f.type='highpass';f.frequency.value=hp||600;const g=a.createGain();g.gain.value=v||0.2;
  s.connect(f);f.connect(g);g.connect(a.destination);s.start(t);s.stop(t+d+0.02);}
const S={
  pitch:()=>{tone(430,0.07,'sawtooth',0.05,220);},
  snap:()=>{noise(0.05,0.16,900);tone(520,0.05,'square',0.08,180);},
  through:()=>{noise(0.14,0.14,400);tone(240,0.1,'sine',0.06,-120);},
  safe:()=>{[620,860,1120].forEach((f,i)=>setTimeout(()=>tone(f,0.11,'triangle',0.16),i*58));},
  big:()=>{[600,800,1000,1250].forEach((f,i)=>setTimeout(()=>tone(f,0.12,'triangle',0.17),i*80));},
  out:()=>{noise(0.18,0.2,300);tone(160,0.2,'sawtooth',0.12,-40);},
  streak:()=>{[700,930,1170,1400].forEach((f,i)=>setTimeout(()=>tone(f,0.1,'triangle',0.16),i*60));},
  over:()=>{[440,330,247,175].forEach((f,i)=>setTimeout(()=>tone(f,0.3,'triangle',0.2),i*160));}
};

// ---------- geometry ----------
const FIRST={x:236,y:452}, SECOND={x:632,y:196}, HOME={x:300,y:548};
const LEAD={x:404,y:356};   // runner's secondary-lead position
const BTN=[
  {k:'back', x:150,label:'帰塁 ←',sub:'一塁へ戻る',col:'#e0a23b'},
  {k:'go',   x:520,label:'進塁 →',sub:'二塁へ走る',col:'#3fc46b'}
];
const BW=230, BY=505, BH=64;

// ---------- state ----------
let state='title', phase='read', plays=0;
let score=0, combo=0, best=+(localStorage.getItem('sl_best')||0);
let outs=0, fails=0, lvl=1;   // outs = good reads
let clock=0, revealT=520, callWin=900, kind='snap', tough=false;
let decided=false, call=null, result=null, resultT=0, msg='', msgOk=false, flyU=0, runU=0;
let shake=0, flash=0, flashCol='#fff', last=performance.now();
let parts=[], pops=[];

function rnd(a,b){return a+Math.random()*(b-a);}
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function lerp(a,b,u){return a+(b-a)*u;}
function easeOut(u){return 1-Math.pow(1-u,2);}

function reset(){state='title';score=0;combo=0;outs=0;fails=0;lvl=1;plays=0;result=null;parts=[];pops=[];}

function newPlay(){
  plays++; lvl=Math.min(7,1+Math.floor(outs/4));
  revealT=clamp(560-lvl*24,360,560);
  callWin=clamp(940-lvl*66,520,940);
  tough=Math.random()<clamp(0.2+lvl*0.05,0.2,0.5);
  if(tough)callWin=Math.round(callWin*0.86);
  kind=(Math.random()<0.5?'snap':'through');  // snap=catcher pickoff behind you / through=ball gets away
  phase='read'; clock=0; decided=false; call=null; result=null; resultT=0; msg=''; msgOk=false; flyU=0; runU=0;
  S.pitch();
}
function start(){ if(!ac())ac(); if(AC&&AC.state==='suspended')AC.resume(); reset(); state='play'; newPlay(); }

function correctCall(){ return kind==='snap'?'back':'go'; }

function makeCall(c){
  if(state==='title'){start();return;}
  if(state==='over'){ if(resultT>0.4){reset();start();} return; }
  if(state!=='play'||phase!=='read'||decided) return;
  if(clock<revealT){ decided=true; call=c; resolve('early'); return; }
  decided=true; call=c;
  resolve(c===correctCall()?'good':'wrong');
}

function resolve(k){
  phase='result'; result=k; resultT=0; flyU=0;
  if(k==='good'){
    outs++; combo++;
    let add=Math.round((tough?250:150)*(1+Math.min(9,combo-1)*0.14)); score+=add;
    if(kind==='snap')S.snap(); else S.through(); setTimeout(S.safe,120); if(tough)setTimeout(S.big,180);
    msgOk=true; flash=1;flashCol='#8affa0';shake=5;
    const at=(kind==='snap')?FIRST:SECOND; burst(at.x,at.y,'#8affa0',16,7);
    pop(W/2,250,(tough?'際どい判断でセーフ！ +':'好走塁！ +')+add,'#d6ffe0');
    if(combo>=2)pop(W/2,150,'コンボ x'+combo,'#ffd24d');
    if(combo>0&&combo%5===0)S.streak();
    msg=(kind==='snap')?'捕手のスナップ送球——素早く帰塁して刺されずセーフ':'捕手が後逸——大きな二次リードから一気に進塁して正解';
  } else {
    fails++; combo=0; msgOk=false; flash=1;flashCol='#ff5b5b';shake=9; S.out();
    if(k==='early') msg='早い…捕手が投げるか後逸か見極める前に動いて刺された';
    else msg=(kind==='snap')?'誤走塁…捕手のスナップ送球なのに飛び出してタッチアウト':'誤走塁…ボールは後逸していたのに戻ってしまい絶好機を逃した';
    pop(W/2,250,(kind==='snap'&&k==='wrong')?'タッチアウト…':'走塁ミス…','#ffb0b0');
  }
  if(fails>=3){ state='over'; resultT=0; S.over(); if(score>best){best=score;localStorage.setItem('sl_best',best);} }
}

// ---------- input ----------
cv.addEventListener('pointerdown',e=>{e.preventDefault();
  if(state!=='play'||phase!=='read'){ makeCall('back'); return; }
  const r=cv.getBoundingClientRect(); const x=(e.clientX-r.left)/r.width*W, y=(e.clientY-r.top)/r.height*H;
  for(const b of BTN){ if(x>=b.x&&x<=b.x+BW&&y>=BY&&y<=BY+BH){ makeCall(b.k); return; } }
  makeCall(x<W*0.5?'back':'go');
});
addEventListener('keydown',e=>{ if(e.repeat)return;
  if(e.code==='ArrowLeft'||e.code==='KeyA'){e.preventDefault();makeCall('back');}
  else if(e.code==='ArrowRight'||e.code==='KeyD'){e.preventDefault();makeCall('go');}
  else if(e.code==='Space'||e.code==='Enter'){e.preventDefault(); if(state!=='play')makeCall('back');} });

// ---------- particles ----------
function burst(x,y,c,n,sp){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=rnd(sp*0.3,sp);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:1,c});}}
function pop(x,y,txt,c){pops.push({x,y,txt,c,life:1});}

// ---------- update ----------
function update(dt){
  shake*=Math.pow(0.86,dt/16.7); if(shake<0.3)shake=0;
  flash*=Math.pow(0.9,dt/16.7);
  for(const q of parts){q.vx*=0.96;q.vy=q.vy*0.96+0.28;q.x+=q.vx*dt/16.7;q.y+=q.vy*dt/16.7;q.life-=dt/16.7*0.026;}
  parts=parts.filter(q=>q.life>0);
  for(const q of pops){q.y-=dt/16.7*0.5;q.life-=dt/16.7*0.02;}
  pops=pops.filter(q=>q.life>0);

  if(state!=='play'){ if(state==='over')resultT+=dt/1000; return; }
  if(phase==='read'){ clock+=dt;
    if(!decided && clock>revealT+callWin){ decided=true; call=null; resolve('wrong'); }
    return; }
  if(phase==='result'){ resultT+=dt/1000; flyU=Math.min(1,flyU+dt/380); runU=Math.min(1,runU+dt/520);
    if(resultT>1.6) newPlay(); return; }
}

// ---------- render ----------
function drawField(){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#12703f');g.addColorStop(0.5,'#0f5e34');g.addColorStop(1,'#0c4c2b');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  // infield dirt (diamond)
  ctx.fillStyle='#6a4a30';ctx.beginPath();ctx.moveTo(HOME.x,HOME.y);ctx.lineTo(FIRST.x-40,FIRST.y-30);ctx.lineTo(SECOND.x-20,SECOND.y-40);ctx.lineTo(SECOND.x+120,SECOND.y+120);ctx.closePath();ctx.fill();
  // basepath 1st<->2nd
  ctx.strokeStyle='rgba(210,180,140,0.5)';ctx.lineWidth=20;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(FIRST.x,FIRST.y);ctx.lineTo(SECOND.x,SECOND.y);ctx.stroke();ctx.lineCap='butt';
  // bases
  for(const bs of [FIRST,SECOND]){ ctx.fillStyle='#f2f2f2';ctx.save();ctx.translate(bs.x,bs.y);ctx.rotate(0.785);ctx.fillRect(-13,-13,26,26);ctx.restore(); }
  // home plate
  ctx.fillStyle='#e8e4d8';ctx.beginPath();ctx.moveTo(HOME.x-12,HOME.y-8);ctx.lineTo(HOME.x+12,HOME.y-8);ctx.lineTo(HOME.x+12,HOME.y+2);ctx.lineTo(HOME.x,HOME.y+12);ctx.lineTo(HOME.x-12,HOME.y+2);ctx.closePath();ctx.fill();
}
function person(x,y,col,s){s=s||1;
  ctx.fillStyle=col;ctx.beginPath();ctx.ellipse(x,y-15*s,10*s,15*s,0,0,6.28);ctx.fill();
  ctx.fillStyle='#f0c9a0';ctx.beginPath();ctx.arc(x,y-34*s,7.5*s,0,6.28);ctx.fill();
}

function render(){
  ctx.save();
  if(shake>0)ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
  drawField();

  if(state==='play'||state==='over'){
    const revealed=(phase==='read'&&clock>=revealT)||phase==='result';
    // catcher at home
    person(HOME.x,HOME.y-8,'#3a5a8c',0.9);
    // first baseman near first
    person(FIRST.x+18,FIRST.y-6,'#2b6fd6',0.82);

    // runner: lead, then dive back / advance on result
    let rx=LEAD.x,ry=LEAD.y;
    if(phase==='result'&&result){
      if(result==='good'&&kind==='snap' || result==='wrong'&&kind==='through'){ rx=lerp(LEAD.x,FIRST.x,easeOut(runU)); ry=lerp(LEAD.y,FIRST.y,easeOut(runU)); }
      else if(result==='good'&&kind==='through'){ rx=lerp(LEAD.x,SECOND.x,easeOut(runU)); ry=lerp(LEAD.y,SECOND.y,easeOut(runU)); }
      else if(result==='wrong'&&kind==='snap'){ rx=lerp(LEAD.x,SECOND.x-30,easeOut(runU)*0.5); ry=lerp(LEAD.y,SECOND.y+40,easeOut(runU)*0.5); }
      else if(result==='early'){ rx=LEAD.x; ry=LEAD.y; }
    }
    person(rx,ry,'#d0403a',0.95);

    // reveal marker on the catcher
    if(revealed){
      const snap=(kind==='snap');
      ctx.fillStyle=snap?'rgba(255,110,90,0.98)':'rgba(150,220,255,0.98)';ctx.font='bold 15px sans-serif';ctx.textAlign='center';
      ctx.fillText(snap?'スナップ送球！':'後逸！ 抜けた',HOME.x,HOME.y-58);
      // snap-throw ball to first / passed ball trickling away
      if(phase==='result'||phase==='read'){
        if(snap){ const u=easeOut(flyU); const bx=lerp(HOME.x,FIRST.x,u),by=lerp(HOME.y-16,FIRST.y,u);
          ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(bx,by,7,0,6.28);ctx.fill(); }
        else { const u=easeOut(flyU); const bx=lerp(HOME.x,HOME.x-70,u),by=lerp(HOME.y-16,H-20,u);
          ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(bx,by,7,0,6.28);ctx.fill(); }
      }
    }

    // cue banner + timer
    ctx.textAlign='center';
    if(state==='play'&&phase==='read'){
      if(clock<revealT){ ctx.fillStyle='rgba(255,220,90,0.95)';ctx.font='bold 20px sans-serif';ctx.fillText('第二リード！ 捕手が投げるか後逸か見極めろ',W/2,52); }
      else { ctx.fillStyle=kind==='snap'?'rgba(255,120,110,0.98)':'rgba(150,220,255,0.98)';ctx.font='bold 22px sans-serif';
        ctx.fillText(kind==='snap'?'送球だ！ 帰塁！':'抜けた！ 進塁！',W/2,52);
        const p=clamp((clock-revealT)/callWin,0,1),bw=250,x=W/2-bw/2,y=64;
        ctx.fillStyle='rgba(255,255,255,0.18)';ctx.fillRect(x,y,bw,7);ctx.fillStyle=p<0.7?'#8affa0':(p<1?'#ffd24d':'#ff5b5b');ctx.fillRect(x,y,bw*p,7); }
    }

    if(state==='play'){
      for(const b of BTN){ const active=phase==='read'&&clock>=revealT;
        ctx.fillStyle=active?b.col:'rgba(255,255,255,0.10)';rr(b.x,BY,BW,BH,10);ctx.fill();
        ctx.fillStyle=active?'#08130c':'rgba(255,255,255,0.5)';ctx.textAlign='center';ctx.font='bold 19px sans-serif';ctx.fillText(b.label,b.x+BW/2,BY+27);
        ctx.font='11px sans-serif';ctx.fillText(b.sub,b.x+BW/2,BY+47); }
      ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='12px sans-serif';ctx.textAlign='center';ctx.fillText('タップ / ←=帰塁 ・ →=進塁',W/2,BY+BH+18);
    }
  }

  for(const q of parts){ctx.globalAlpha=Math.max(0,q.life);ctx.fillStyle=q.c;ctx.beginPath();ctx.arc(q.x,q.y,3.2,0,6.28);ctx.fill();}
  ctx.globalAlpha=1;
  for(const q of pops){ctx.globalAlpha=Math.max(0,q.life);ctx.fillStyle=q.c;ctx.font='bold 21px sans-serif';ctx.textAlign='center';ctx.fillText(q.txt,q.x,q.y);}
  ctx.globalAlpha=1;

  // HUD
  ctx.textAlign='left';ctx.fillStyle='#fff';ctx.font='bold 26px sans-serif';ctx.fillText('SCORE '+score,20,36);
  ctx.textAlign='right';ctx.fillStyle='rgba(255,255,255,0.9)';ctx.font='14px sans-serif';ctx.fillText('好走塁 '+outs+'  Lv'+lvl,W-20,24);
  ctx.fillText('走塁死',W-104,46);
  for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(W-60+i*20,41,7,0,6.28);ctx.fillStyle=i<fails?'#ff5b5b':'rgba(255,255,255,0.25)';ctx.fill();}
  if(combo>=2){ctx.textAlign='center';ctx.fillStyle='#ffd24d';ctx.font='bold 18px sans-serif';ctx.fillText('コンボ x'+combo,W/2,112);}

  if(state==='play'&&phase==='result'&&msg){ctx.textAlign='center';ctx.fillStyle=msgOk?'#9ff0b8':'#ff9a9a';ctx.font='bold 16px sans-serif';ctx.fillText(msg,W/2,478);}

  if(state==='title'){
    ctx.fillStyle='rgba(4,8,4,0.83)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='bold 42px sans-serif';ctx.fillText('第二リード',W/2,86);
    ctx.fillStyle='#ffd23e';ctx.font='bold 22px sans-serif';ctx.fillText('Secondary Lead',W/2,122);
    ctx.fillStyle='rgba(255,255,255,0.92)';ctx.font='16px sans-serif';
    ctx.fillText('一塁走者として投球に合わせて“第二リード”を取り、捕手の動きを読んで帰塁か進塁かを即断しろ',W/2,182);
    ctx.fillStyle='rgba(255,255,255,0.66)';ctx.font='14px sans-serif';
    ctx.fillText('捕手がスナップ送球（背後の一塁へ牽制）＝すぐ帰塁（←/画面左）で刺されるのを回避',W/2,220);
    ctx.fillText('捕手が後逸（ボールが抜けた）＝一気に進塁（→/画面右）で二塁を陥れる',W/2,244);
    ctx.fillText('捕手の動きが分かる前に動く＝早すぎ、逆を選ぶと走塁死、際どい判断は大量加点',W/2,268);
    ctx.fillText('捕手を見てから素早く反応するのがコツ。上級ほど速く猶予も短い。3走塁死で交代',W/2,292);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で開始',W/2,360);
    ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='14px sans-serif';ctx.fillText('BEST '+best,W/2,392);
  }
  if(state==='over'){
    ctx.fillStyle='rgba(4,8,4,0.85)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#ff6b6b';ctx.font='bold 46px sans-serif';ctx.fillText('3走塁死…交代',W/2,222);
    ctx.fillStyle='#fff';ctx.font='bold 40px sans-serif';ctx.fillText('SCORE '+score,W/2,290);
    ctx.fillStyle='rgba(255,255,255,0.85)';ctx.font='19px sans-serif';ctx.fillText('好走塁 '+outs+'   BEST '+best,W/2,330);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で もう一度',W/2,402);
  }

  if(flash>0.02){ctx.globalAlpha=flash*0.5;ctx.fillStyle=flashCol;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}
  ctx.restore();

  ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,0.4)';ctx.font='12px sans-serif';
  ctx.fillText('第二リード：捕手のスナップ送球＝帰塁／後逸＝進塁を見極める。早すぎ/逆選択は走塁死、3つで交代',W/2,H-8);
}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

function frame(ts){let dt=ts-last;last=ts;if(dt>60)dt=60;if(dt<0)dt=0;update(dt);render();requestAnimationFrame(frame);}
requestAnimationFrame(frame);

// ---------- test hook ----------
window.__sl={
  start, makeCall:(c)=>makeCall(c),
  get state(){return state;},
  get score(){return score;},
  get outs(){return outs;},
  get fails(){return fails;},
  get info(){return {state,phase,clock,revealT,callWin,kind,tough,decided,call,result,outs,fails,lvl,
    revealed:(clock>=revealT),correctCall:correctCall(),canAct:(phase==='read'&&!decided)};}
};
})();
</script>
</body>
</html>
