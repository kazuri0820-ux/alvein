<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>パンチング (Punch It Clear)</title>
<style>
  html,body{margin:0;height:100%;background:#06110a;overflow:hidden;
    font-family:-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  #stage{position:relative;width:100vw;height:100vh;max-width:calc(100vh*1.5);max-height:calc(100vw/1.5);aspect-ratio:900/600;}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;border-radius:6px;}
</style>
</head>
<body>
<div id="wrap"><div id="stage"><canvas id="cv"></canvas></div></div>
<script>
(function(){
const W=900,H=600,cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let DPR=1;
function fit(){DPR=Math.min(2,window.devicePixelRatio||1);cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
fit();addEventListener('resize',fit);

// ---------- audio ----------
let AC=null;function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function tone(f,d,type,v,sweep){const a=ac();if(!a)return;const t=a.currentTime,o=a.createOscillator(),g=a.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(sweep)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+sweep),t+d);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v||0.2,t+0.008);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+0.02);}
function noise(d,v,hp){const a=ac();if(!a)return;const t=a.currentTime,n=Math.floor(a.sampleRate*d),buf=a.createBuffer(1,n,a.sampleRate),ch=buf.getChannelData(0);
  for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource();s.buffer=buf;
  const f=a.createBiquadFilter();f.type='highpass';f.frequency.value=hp||600;const g=a.createGain();g.gain.value=v||0.2;
  s.connect(f);f.connect(g);g.connect(a.destination);s.start(t);s.stop(t+d+0.02);}
const S={
  load:()=>{tone(300,0.1,'sine',0.05,120);},
  punch:()=>{noise(0.09,0.22,500);tone(360,0.1,'square',0.14,-120);[700,980].forEach((f,i)=>setTimeout(()=>tone(f,0.09,'triangle',0.14),i*55));},
  weak:()=>{noise(0.06,0.1,400);tone(220,0.12,'sine',0.1,-40);},
  goal:()=>{noise(0.2,0.24,250);tone(150,0.3,'sawtooth',0.14,-50);},
  streak:()=>{[700,930,1170,1400].forEach((f,i)=>setTimeout(()=>tone(f,0.1,'triangle',0.16),i*60));},
  over:()=>{[440,330,247,175].forEach((f,i)=>setTimeout(()=>tone(f,0.3,'triangle',0.2),i*160));}
};

// ---------- geometry ----------
const PUNCH={x:450,y:392};        // where the ball meets the keeper's fists
const GK={x:450,y:452};
const GOALY=470;

// ---------- state ----------
let state='title', phase='cross', plays=0;
let score=0, combo=0, best=+(localStorage.getItem('punch_best')||0);
let outs=0, fails=0, lvl=1;   // outs = clears
let clock=0, contactT=700, win=170, grace=150, powerFull=460, minPow=0.45;
let fromX=820, crossType='normal';
let held=false, holdStart=0, power=0, released=false, result=null, resultT=0, msg='', anim=0, strong=false;
let atkX=520;
let shake=0, flash=0, flashCol='#fff', last=performance.now();
let parts=[], pops=[];

function rnd(a,b){return a+Math.random()*(b-a);}
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function lerp(a,b,u){return a+(b-a)*u;}
function easeOut(u){return 1-Math.pow(1-u,2);}

function reset(){state='title';score=0;combo=0;outs=0;fails=0;lvl=1;plays=0;result=null;parts=[];pops=[];}
function newPlay(){
  plays++; lvl=Math.min(7,1+Math.floor(outs/4));
  const r=Math.random(); crossType = r<0.34?'driven':(r<0.67?'floated':'normal');
  contactT = crossType==='driven'?clamp(560-lvl*22,380,560)
           : crossType==='floated'?clamp(920-lvl*30,660,920)
           : clamp(730-lvl*26,520,730);
  win=clamp(180-lvl*9,115,180);
  fromX = Math.random()<0.5?820:80;
  atkX = PUNCH.x + rnd(-40,40);
  phase='cross'; clock=0; held=false; holdStart=0; power=0; released=false; result=null; resultT=0; msg=''; anim=0; strong=false;
  S.load();
}
function start(){ if(!ac())ac(); if(AC&&AC.state==='suspended')AC.resume(); reset(); state='play'; newPlay(); }

function hold(){
  if(state==='title'){start();return;}
  if(state==='over'){ if(resultT>0.4){reset();start();} return; }
  if(state!=='play'||phase!=='cross'||held||released) return;
  held=true; holdStart=clock;
}
function release(){
  if(state!=='play'||phase!=='cross'||!held||released) return;
  released=true; power=clamp((clock-holdStart)/powerFull,0,1);
  const d=clock-contactT;
  if(d < -win){ resolve('early'); }
  else if(d > win){ resolve('late'); }
  else if(power < minPow){ resolve('weak'); }
  else { strong=(Math.abs(d)<=win*0.4 && power>=0.8); resolve('clear'); }
}

function resolve(k){
  phase='result'; result=k; resultT=0; anim=0;
  if(k==='clear'){
    outs++; combo++;
    let add=Math.round((strong?230:150)*(1+Math.min(9,combo-1)*0.14)); score+=add;
    S.punch(); flash=1;flashCol='#8affa0';shake=strong?9:6; burst(PUNCH.x,PUNCH.y,'#cfe8ff',22,strong?10:7);
    pop(PUNCH.x,PUNCH.y-34,strong?'ビッグパンチ！ 大きくクリア！ +'+add:'パンチング成功！ +'+add,'#d6ffe0');
    if(combo>=2&&!strong)pop(W/2,150,'コンボ x'+combo,'#ffd24d');
    if(combo>0&&combo%5===0)S.streak();
    msg=strong?'早めに構えてタイミングばっちり——拳で弾き返した！':'クロスを拳で叩いてピンチをしのいだ！';
  } else {
    fails++; combo=0; flash=1;flashCol='#ff5b5b';shake=9;
    if(k==='weak'){ S.weak(); msg='力が溜まっていない…手打ちのパンチが前に落ちて詰められた'; }
    else if(k==='early'){ S.goal(); msg='拳を出すのが早い…空振りしてフリーで頭に合わされた'; }
    else { S.goal(); msg='拳が届かず…頭上を越されてゴールネットへ'; }
    pop(PUNCH.x,PUNCH.y-30,k==='weak'?'こぼれ球を押し込まれた…':'失点…','#ffb0b0');
  }
  if(fails>=3){ state='over'; resultT=0; S.over(); if(score>best){best=score;localStorage.setItem('punch_best',best);} }
}

// ---------- input ----------
cv.addEventListener('pointerdown',e=>{e.preventDefault(); if(state!=='play'){hold();return;} hold();});
cv.addEventListener('pointerup',e=>{e.preventDefault(); release();});
cv.addEventListener('pointercancel',e=>{release();});
addEventListener('keydown',e=>{ if(e.code==='Space'||e.code==='Enter'||e.code==='ArrowUp'){e.preventDefault(); if(!e.repeat) hold();} });
addEventListener('keyup',e=>{ if(e.code==='Space'||e.code==='Enter'||e.code==='ArrowUp'){e.preventDefault(); release();} });

// ---------- particles ----------
function burst(x,y,c,n,sp){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=rnd(sp*0.3,sp);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:1,c});}}
function pop(x,y,txt,c){pops.push({x,y,txt,c,life:1});}

// ---------- update ----------
function update(dt){
  shake*=Math.pow(0.86,dt/16.7); if(shake<0.3)shake=0;
  flash*=Math.pow(0.9,dt/16.7);
  for(const p of parts){p.vx*=0.96;p.vy=p.vy*0.96+0.28;p.x+=p.vx*dt/16.7;p.y+=p.vy*dt/16.7;p.life-=dt/16.7*0.026;}
  parts=parts.filter(p=>p.life>0);
  for(const p of pops){p.y-=dt/16.7*0.5;p.life-=dt/16.7*0.02;}
  pops=pops.filter(p=>p.life>0);

  if(state!=='play'){ if(state==='over')resultT+=dt/1000; return; }
  if(phase==='cross'){
    clock+=dt;
    if(held&&!released) power=clamp((clock-holdStart)/powerFull,0,1);
    if(!released && clock>contactT+win+grace){ released=true; if(!held){ resolve('late'); } else { resolve('late'); } }
    return;
  }
  if(phase==='result'){ resultT+=dt/1000; anim=Math.min(1,anim+dt/560); if(resultT>1.2) newPlay(); return; }
}

// ---------- render ----------
function keeper(x,y,rise,punch){
  ctx.fillStyle='rgba(0,0,0,0.25)';ctx.beginPath();ctx.ellipse(x,y+14,14,4,0,0,6.28);ctx.fill();
  const ry=y-rise*26;
  ctx.fillStyle='#f4d03f';ctx.beginPath();ctx.moveTo(x-8,ry-24);ctx.lineTo(x+8,ry-24);ctx.lineTo(x+7,ry+14);ctx.lineTo(x-7,ry+14);ctx.closePath();ctx.fill();
  ctx.fillStyle='#f2c9a0';ctx.beginPath();ctx.arc(x,ry-30,6.5,0,6.28);ctx.fill();
  // fists up
  const fy=ry-38-rise*14 - (punch?10:0);
  ctx.fillStyle='#e8e8e8';ctx.beginPath();ctx.arc(x-8,fy,5,0,6.28);ctx.arc(x+8,fy,5,0,6.28);ctx.fill();
}
function drawScene(){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#0f3d24');g.addColorStop(0.6,'#12653a');g.addColorStop(1,'#0c4d2c');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  for(let i=0;i<7;i++){ ctx.fillStyle=i%2?'rgba(255,255,255,0.03)':'rgba(0,0,0,0.03)'; ctx.fillRect(0,30+i*80,W,80); }
  // goal
  ctx.strokeStyle='#eef3f0';ctx.lineWidth=5;ctx.strokeRect(300,GOALY,300,60);
  ctx.strokeStyle='rgba(255,255,255,0.14)';ctx.lineWidth=1;
  for(let i=1;i<8;i++){ctx.beginPath();ctx.moveTo(300+300*i/8,GOALY);ctx.lineTo(300+300*i/8,GOALY+60);ctx.stroke();}
  for(let i=1;i<3;i++){ctx.beginPath();ctx.moveTo(300,GOALY+60*i/3);ctx.lineTo(600,GOALY+60*i/3);ctx.stroke();}
}

function render(){
  ctx.save();
  if(shake>0)ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
  drawScene();

  if(state==='play'||state==='over'){
    const t = phase==='cross'? clamp(clock/contactT,0,1) : 1;
    // attacker lurking
    ctx.fillStyle='rgba(0,0,0,0.22)';ctx.beginPath();ctx.ellipse(atkX,PUNCH.y+26,12,4,0,0,6.28);ctx.fill();
    ctx.fillStyle='#d24b4b';ctx.beginPath();ctx.moveTo(atkX-7,PUNCH.y-2);ctx.lineTo(atkX+7,PUNCH.y-2);ctx.lineTo(atkX+6,PUNCH.y+24);ctx.lineTo(atkX-6,PUNCH.y+24);ctx.closePath();ctx.fill();
    ctx.fillStyle='#f2c9a0';ctx.beginPath();ctx.arc(atkX,PUNCH.y-8,5.5,0,6.28);ctx.fill();

    // keeper
    const rise = held? power : (phase==='result'&&(result==='clear')?1:0);
    keeper(GK.x,GK.y, rise, phase==='result'&&result==='clear'&&anim<0.5);

    // cross ball
    if(phase==='cross'||result==='early'||result==='late'||result==='weak'){
      let bx,by;
      if(phase==='cross'){
        bx=lerp(fromX,PUNCH.x,easeOut(t));
        const h=Math.sin(Math.PI*t)*120;
        by=lerp(140,PUNCH.y,t)-h*0.3;
        if(t>=1){ by=PUNCH.y; }
      } else {
        // missed -> ball continues into goal / drops
        const u=easeOut(anim);
        if(result==='weak'){ bx=lerp(PUNCH.x,atkX,u); by=lerp(PUNCH.y,PUNCH.y+30,u); }
        else { bx=PUNCH.x; by=lerp(PUNCH.y,GOALY+30,u); }
      }
      ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(bx,by,8,0,6.28);ctx.fill();
      ctx.strokeStyle='#d33';ctx.lineWidth=1.4;ctx.beginPath();ctx.arc(bx,by,8,0.6,2.2);ctx.stroke();
    }

    // timing ring at punch point
    if(state==='play'&&phase==='cross'){
      const inWin=Math.abs(clock-contactT)<=win;
      ctx.strokeStyle=inWin?'rgba(140,255,160,0.95)':'rgba(255,220,90,0.7)';ctx.lineWidth=4;
      const rem=clamp(1-clock/contactT,0,1);
      ctx.beginPath();ctx.arc(PUNCH.x,PUNCH.y,16+rem*54,0,6.28);ctx.stroke();
      // power gauge
      const gw=150,gx=W/2-gw/2,gy=120;
      ctx.fillStyle='rgba(255,255,255,0.16)';ctx.fillRect(gx,gy,gw,10);
      ctx.fillStyle=power>=minPow?'#8affa0':'#ffd24d';ctx.fillRect(gx,gy,gw*power,10);
      ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(gx+gw*minPow,gy-3);ctx.lineTo(gx+gw*minPow,gy+13);ctx.stroke();
      ctx.fillStyle='rgba(255,255,255,0.8)';ctx.font='12px sans-serif';ctx.textAlign='center';ctx.fillText('パンチ力（長押しで溜め）',W/2,gy-6);

      ctx.textAlign='center';ctx.fillStyle=inWin?'rgba(140,255,160,0.98)':'rgba(255,255,255,0.9)';ctx.font='bold 18px sans-serif';
      ctx.fillText(held?(inWin?'今だ！ 離してパンチ！':'溜めて…拳が届く瞬間で離せ'):'早めに長押しで構えろ（押し続けて溜める）',W/2,52);
    }
  }

  for(const p of parts){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,3.2,0,6.28);ctx.fill();}
  ctx.globalAlpha=1;
  for(const p of pops){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.font='bold 20px sans-serif';ctx.textAlign='center';ctx.fillText(p.txt,p.x,p.y);}
  ctx.globalAlpha=1;

  // HUD
  ctx.textAlign='left';ctx.fillStyle='#fff';ctx.font='bold 26px sans-serif';ctx.fillText('SCORE '+score,20,36);
  ctx.textAlign='right';ctx.fillStyle='rgba(255,255,255,0.9)';ctx.font='14px sans-serif';ctx.fillText('クリア '+outs+'  Lv'+lvl,W-20,24);
  ctx.fillText('失点',W-92,46);
  for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(W-60+i*20,41,7,0,6.28);ctx.fillStyle=i<fails?'#ff5b5b':'rgba(255,255,255,0.25)';ctx.fill();}
  if(combo>=2){ctx.textAlign='center';ctx.fillStyle='#ffd24d';ctx.font='bold 18px sans-serif';ctx.fillText('コンボ x'+combo,W/2,96);}

  if(state==='play'&&phase==='result'&&msg){ctx.textAlign='center';ctx.fillStyle=result==='clear'?'#9ff0b8':'#ff9a9a';ctx.font='bold 19px sans-serif';ctx.fillText(msg,W/2,52);}

  if(state==='title'){
    ctx.fillStyle='rgba(4,10,7,0.80)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='bold 44px sans-serif';ctx.fillText('パンチング',W/2,100);
    ctx.fillStyle='#ffd23e';ctx.font='bold 22px sans-serif';ctx.fillText('Punch It Clear',W/2,136);
    ctx.fillStyle='rgba(255,255,255,0.92)';ctx.font='16px sans-serif';
    ctx.fillText('GKとして、混戦のゴール前へ飛んでくるクロスを拳で弾き返せ',W/2,188);
    ctx.fillStyle='rgba(255,255,255,0.66)';ctx.font='14px sans-serif';
    ctx.fillText('早めに長押しで“構え”て溜め（パンチ力ゲージ）、ボールが拳に届く瞬間（緑リング）で離してパンチ',W/2,226);
    ctx.fillText('溜めが足りない手打ち＝前にこぼして詰められる／離すのが早い＝空振り／遅い＝頭上を越されて失点',W/2,250);
    ctx.fillText('速いクロス（低く速い）と山なりのクロスで“届く瞬間”が変わる。早く構えてジャストで離すほど大きくクリア',W/2,274);
    ctx.fillText('上級ほどクロスが速く猶予が短い。3失点で交代',W/2,298);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で開始',W/2,364);
    ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='14px sans-serif';ctx.fillText('BEST '+best,W/2,396);
  }
  if(state==='over'){
    ctx.fillStyle='rgba(4,10,7,0.84)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#ff6b6b';ctx.font='bold 46px sans-serif';ctx.fillText('3失点…交代',W/2,222);
    ctx.fillStyle='#fff';ctx.font='bold 40px sans-serif';ctx.fillText('SCORE '+score,W/2,290);
    ctx.fillStyle='rgba(255,255,255,0.85)';ctx.font='19px sans-serif';ctx.fillText('クリア '+outs+'   BEST '+best,W/2,330);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で もう一度',W/2,402);
  }

  if(flash>0.02){ctx.globalAlpha=flash*0.5;ctx.fillStyle=flashCol;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}
  ctx.restore();

  ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,0.4)';ctx.font='12px sans-serif';
  ctx.fillText('パンチング：早めに長押しで溜め、クロスが拳に届く瞬間（緑リング）で離してパンチ。手打ち/早い/遅いは失点。3失点で交代',W/2,H-8);
}

function frame(ts){let dt=ts-last;last=ts;if(dt>60)dt=60;if(dt<0)dt=0;update(dt);render();requestAnimationFrame(frame);}
requestAnimationFrame(frame);

// ---------- test hook ----------
window.__pn={
  start, hold:()=>hold(), release:()=>release(),
  get state(){return state;},
  get score(){return score;},
  get outs(){return outs;},
  get fails(){return fails;},
  get info(){return {state,phase,clock,contactT,win,powerFull,minPow,held,released,power,result,outs,fails,lvl,crossType,
    canAct:(phase==='cross'&&!released)};}
};
})();
</script>
</body>
</html>
