<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>カットオフ判断 (Cut It Off?)</title>
<style>
  html,body{margin:0;height:100%;background:#0b100a;overflow:hidden;
    font-family:-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  #stage{position:relative;width:100vw;height:100vh;max-width:calc(100vh*1.5);max-height:calc(100vw/1.5);aspect-ratio:900/600;}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;border-radius:6px;}
</style>
</head>
<body>
<div id="wrap"><div id="stage"><canvas id="cv"></canvas></div></div>
<script>
(function(){
const W=900,H=600,cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let DPR=1;
function fit(){DPR=Math.min(2,window.devicePixelRatio||1);cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
fit();addEventListener('resize',fit);

// ---------- audio ----------
let AC=null;function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function tone(f,d,type,v,sweep){const a=ac();if(!a)return;const t=a.currentTime,o=a.createOscillator(),g=a.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(sweep)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+sweep),t+d);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v||0.2,t+0.008);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+0.02);}
function noise(d,v,hp){const a=ac();if(!a)return;const t=a.currentTime,n=Math.floor(a.sampleRate*d),buf=a.createBuffer(1,n,a.sampleRate),ch=buf.getChannelData(0);
  for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource();s.buffer=buf;
  const f=a.createBiquadFilter();f.type='highpass';f.frequency.value=hp||600;const g=a.createGain();g.gain.value=v||0.2;
  s.connect(f);f.connect(g);g.connect(a.destination);s.start(t);s.stop(t+d+0.02);}
const S={
  cut:()=>{noise(0.04,0.12,800);tone(500,0.06,'square',0.08);},
  out:()=>{noise(0.05,0.14,600);[720,960,1200].forEach((f,i)=>setTimeout(()=>tone(f,0.11,'triangle',0.18),i*70));},
  bad:()=>{noise(0.14,0.2,360);tone(190,0.16,'sawtooth',0.12,-60);},
  streak:()=>{[660,880,1100,1320].forEach((f,i)=>setTimeout(()=>tone(f,0.1,'triangle',0.16),i*60));},
  over:()=>{[440,330,247,175].forEach((f,i)=>setTimeout(()=>tone(f,0.3,'triangle',0.2),i*160));}
};

// ---------- geometry ----------
const HOME={x:450,y:494}, CUT={x:450,y:300}, OF={x:196,y:112}, SECOND={x:648,y:300}, THIRD={x:262,y:300}, FIRST={x:640,y:452};

// ---------- state ----------
let state='title', phase='play', t=0, plays=0;
let score=0, combo=0, best=+(localStorage.getItem('cutoff_best')||0);
let outs=0, fails=0, lvl=1;
let clock=0, throwT=1300, runnerHomeT=1300, cutT=650, throwBeats=true, acted=false, choice=null;
let batterHomeT=1500, throwProg=0, runProg=0, batProg=0, relayProg=0;
let result=null, resultT=0, msg='';
let shake=0, flash=0, flashCol='#fff', last=performance.now();
let parts=[], pops=[];

function rnd(a,b){return a+Math.random()*(b-a);}
function chance(p){return Math.random()<p;}
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function lerp(a,b,u){return a+(b-a)*u;}
function easeOut(u){return 1-Math.pow(1-u,2);}

function params(){ return { base:Math.max(920,1360-lvl*70), margin:Math.max(60,220-lvl*22), cut:0.5 }; }

function reset(){state='title';score=0;combo=0;outs=0;fails=0;lvl=1;plays=0;result=null;parts=[];pops=[];}
function newPlay(){
  plays++; lvl=Math.min(7,1+Math.floor(outs/4));
  const p=params();
  throwT=rnd(p.base-120,p.base+120);
  const m=rnd(40,p.margin)*(chance(0.5)?1:-1);   // runner faster or slower than the throw
  runnerHomeT=throwT+m; throwBeats = throwT < runnerHomeT;
  batterHomeT = throwT + rnd(160,340);            // batter-runner would reach 2nd a bit after
  cutT=throwT*p.cut;
  clock=0; acted=false; choice=null; throwProg=0; runProg=0; batProg=0; relayProg=0;
  result=null; phase='play'; msg=''; resultT=0;
}
function start(){ if(!ac())ac(); if(AC&&AC.state==='suspended')AC.resume(); reset(); state='play'; newPlay(); }

function cut(){
  if(state==='title'){start();return;}
  if(state==='over'){ if(resultT>0.4){reset();start();} return; }
  if(state!=='play'||phase!=='play'||acted||clock>=cutT) return;
  acted=true; choice='cut'; S.cut();
  resolve(throwBeats? 'gaveup':'cutout');
}

function resolve(kind){
  phase='result'; result=kind; resultT=0;
  const good=(kind==='cutout'||kind==='homeout');
  if(good){
    outs++; combo++;
    const add=Math.round(120*(1+Math.min(9,combo-1)*0.16)); score+=add;
    S.out(); flash=1;flashCol='#ffe08a';shake=6;
    const tgt = kind==='cutout'? SECOND : HOME; burst(tgt.x,tgt.y,'#ffe08a',18,6);
    pop(tgt.x,tgt.y-30,'アウト！ +'+add,'#fff3c4');
    if(kind==='cutout')pop(tgt.x,tgt.y-56,'カットして二塁で刺した！','#ffe08a'); else pop(tgt.x,tgt.y-56,'通して本塁で刺した！','#ffe08a');
    if(combo>=2)pop(450,340,'コンボ x'+combo,'#ffd24d');
    if(combo>0&&combo%5===0)S.streak();
    msg=kind==='cutout'?'間に合わない送球をカット→二塁でアウト！':'通して正解！ 本塁で走者を刺した！';
  } else {
    fails++; combo=0; flash=1;flashCol='#ff5b5b';shake=8; S.bad();
    if(kind==='gaveup') msg='カット失敗！ 通せば本塁で刺せた送球を切ってしまった';
    else msg='通して失敗！ 間に合わず生還＋打者走者も進塁';
    pop(kind==='gaveup'?SECOND.x:HOME.x, 340,'失敗','#ffb0b0');
  }
  if(fails>=3){ state='over'; resultT=0; S.over(); if(score>best){best=score;localStorage.setItem('cutoff_best',best);} }
}

// ---------- input ----------
cv.addEventListener('pointerdown',e=>{e.preventDefault();cut();});
addEventListener('keydown',e=>{ if(e.code==='Space'||e.code==='Enter'||e.code==='ArrowLeft'||e.code==='KeyC'){e.preventDefault();cut();} });

// ---------- particles ----------
function burst(x,y,c,n,sp){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=rnd(sp*0.3,sp);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:1,c});}}
function pop(x,y,txt,c){pops.push({x,y,txt,c,life:1});}

// ---------- update ----------
function update(dt){
  shake*=Math.pow(0.86,dt/16.7); if(shake<0.3)shake=0;
  flash*=Math.pow(0.9,dt/16.7);
  for(const p of parts){p.vx*=0.96;p.vy=p.vy*0.96+0.28;p.x+=p.vx*dt/16.7;p.y+=p.vy*dt/16.7;p.life-=dt/16.7*0.026;}
  parts=parts.filter(p=>p.life>0);
  for(const p of pops){p.y-=dt/16.7*0.5;p.life-=dt/16.7*0.02;}
  pops=pops.filter(p=>p.life>0);

  if(state!=='play'){ if(state==='over')resultT+=dt/1000; return; }
  t+=dt;
  if(phase==='play'){
    clock+=dt;
    throwProg=clamp(clock/throwT,0,1);
    runProg=clamp(clock/runnerHomeT,0,1);
    batProg=clamp(clock/batterHomeT,0,1);
    // no cut by the window & the throw reaches home -> LET resolves
    if(!acted && clock>=throwT){ resolve(throwBeats?'homeout':'scored'); }
    return;
  }
  if(phase==='result'){
    resultT+=dt/1000;
    if(result==='cutout'||result==='gaveup'){ relayProg=Math.min(1,relayProg+dt/300); }
    else { throwProg=Math.min(1,throwProg+dt/220); runProg=Math.min(1,runProg+dt/220); batProg=Math.min(1,batProg+dt/240); }
    if(resultT>1.25 && state==='play') newPlay();
    return;
  }
}

// ---------- render ----------
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function drawScene(){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#2c7a3b');g.addColorStop(1,'#1d5726');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#7a5230';ctx.beginPath();ctx.ellipse(450,340,320,220,0,0,6.28);ctx.fill();
  ctx.fillStyle='#2c7a3b';ctx.beginPath();ctx.ellipse(450,352,230,160,0,0,6.28);ctx.fill();
  // basepaths third->home, first->second
  ctx.strokeStyle='rgba(240,220,180,0.55)';ctx.lineWidth=16;
  ctx.beginPath();ctx.moveTo(THIRD.x,THIRD.y);ctx.lineTo(HOME.x,HOME.y);ctx.stroke();
  ctx.beginPath();ctx.moveTo(FIRST.x,FIRST.y);ctx.lineTo(SECOND.x,SECOND.y);ctx.stroke();
  // bases
  for(const bb of [[HOME,'本'],[SECOND,'二'],[THIRD,'三'],[FIRST,'一']]){ const b=bb[0];
    ctx.save();ctx.translate(b.x,b.y);ctx.rotate(Math.PI/4);ctx.fillStyle='#f2f4f6';ctx.fillRect(-11,-11,22,22);ctx.restore();
    ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='11px sans-serif';ctx.textAlign='center';ctx.fillText(bb[1],b.x,b.y-18); }
}
function drawFig(x,y,col){
  ctx.fillStyle='rgba(0,0,0,0.22)';ctx.beginPath();ctx.ellipse(x,y+12,11,4,0,0,6.28);ctx.fill();
  ctx.fillStyle=col;rr(x-8,y-10,16,24,6);ctx.fill();
  ctx.fillStyle='#f2c9a0';ctx.beginPath();ctx.arc(x,y-15,6.5,0,6.28);ctx.fill();
}

function render(){
  ctx.save();
  if(shake>0)ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
  drawScene();

  if(state==='play'){
    // cutoff man
    drawFig(CUT.x,CUT.y,'#2b6cff');
    // OF thrower
    drawFig(OF.x,OF.y,'#2b6cff');
    // lead runner (third -> home)
    const rp=(phase==='result'&&(result==='homeout'||result==='cutout'))? runProg : runProg;
    const rx=lerp(THIRD.x,HOME.x,easeOut(runProg)), ry=lerp(THIRD.y,HOME.y,easeOut(runProg));
    drawFig(rx,ry,'#e23c3c');
    // batter-runner (first -> second)
    const bx=lerp(FIRST.x,SECOND.x,easeOut(batProg)), by=lerp(FIRST.y,SECOND.y,easeOut(batProg));
    drawFig(bx,by,'#e2683c');
    // ball
    let ballx,bally;
    if(phase==='play'){
      if(clock<cutT){ ballx=lerp(OF.x,CUT.x,easeOut(clamp(clock/cutT,0,1))); bally=lerp(OF.y,CUT.y,easeOut(clamp(clock/cutT,0,1))); }
      else { const u=clamp((clock-cutT)/(throwT-cutT),0,1); ballx=lerp(CUT.x,HOME.x,easeOut(u)); bally=lerp(CUT.y,HOME.y,easeOut(u)); }
    } else if(result==='cutout'||result==='gaveup'){ ballx=lerp(CUT.x,SECOND.x,easeOut(relayProg)); bally=lerp(CUT.y,SECOND.y,easeOut(relayProg)); }
    else { const u=clamp(throwProg,0,1); ballx=lerp(OF.x,HOME.x,easeOut(u)); bally=lerp(OF.y,HOME.y,easeOut(u)); }
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(ballx,bally,6,0,6.28);ctx.fill();

    // cut window ring on the cutoff man
    if(phase==='play'&&clock<cutT){ const u=clock/cutT; const rad=lerp(60,22,clamp(u,0,1));
      ctx.strokeStyle='rgba(150,240,170,0.85)';ctx.lineWidth=3;ctx.beginPath();ctx.arc(CUT.x,CUT.y,rad,0,6.28);ctx.stroke();
      ctx.fillStyle='#9ff0b8';ctx.font='bold 15px sans-serif';ctx.textAlign='center';ctx.fillText('カットするなら今（タップ）／通すなら何もしない',CUT.x,CUT.y-42); }

    // race bars: throw-to-home vs runner-to-home
    const bw=250, bx0=W/2-bw/2, byT=H-56, byR=H-40;
    ctx.fillStyle='rgba(0,0,0,0.3)';rr(bx0-3,byT-3,bw+6,30,8);ctx.fill();
    ctx.fillStyle='#7fd0ff';rr(bx0,byT,bw*throwProg,10,4);ctx.fill();
    ctx.fillStyle='#ff9a5b';rr(bx0,byR,bw*runProg,10,4);ctx.fill();
    ctx.fillStyle='rgba(255,255,255,0.75)';ctx.font='11px sans-serif';ctx.textAlign='right';
    ctx.fillText('送球→本塁',bx0-8,byT+9); ctx.fillText('走者→本塁',bx0-8,byR+9);
  }

  for(const p of parts){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,3.2,0,6.28);ctx.fill();}
  ctx.globalAlpha=1;
  for(const p of pops){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.font='bold 22px sans-serif';ctx.textAlign='center';ctx.fillText(p.txt,p.x,p.y);}
  ctx.globalAlpha=1;

  // HUD
  ctx.textAlign='left';ctx.fillStyle='#fff';ctx.font='bold 26px sans-serif';ctx.fillText('SCORE '+score,20,36);
  ctx.textAlign='right';ctx.fillStyle='rgba(255,255,255,0.9)';ctx.font='14px sans-serif';ctx.fillText('アウト '+outs+'  Lv'+lvl,W-20,24);
  ctx.fillText('失敗',W-92,46);
  for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(W-60+i*20,41,7,0,6.28);ctx.fillStyle=i<fails?'#ff5b5b':'rgba(255,255,255,0.25)';ctx.fill();}
  if(combo>=2){ctx.textAlign='center';ctx.fillStyle='#ffd24d';ctx.font='bold 18px sans-serif';ctx.fillText('コンボ x'+combo,W/2,88);}

  if(state==='play'&&phase==='play'){ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,0.9)';ctx.font='bold 15px sans-serif';
    ctx.fillText('送球が本塁に“間に合う”なら通す（本塁で刺す）、間に合わないならカット→二塁で打者走者を刺せ',W/2,44);}
  if(state==='play'&&phase==='result'&&msg){ctx.textAlign='center';ctx.fillStyle=(result==='cutout'||result==='homeout')?'#9ff0b8':'#ff9a9a';ctx.font='bold 20px sans-serif';ctx.fillText(msg,W/2,44);}

  if(state==='title'){
    ctx.fillStyle='rgba(6,10,6,0.72)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='bold 42px sans-serif';ctx.fillText('カットオフ判断',W/2,124);
    ctx.fillStyle='#ffd23e';ctx.font='bold 22px sans-serif';ctx.fillText('Cut It Off?',W/2,160);
    ctx.fillStyle='rgba(255,255,255,0.92)';ctx.font='16px sans-serif';
    ctx.fillText('中継の一瞬の判断。本塁への送球を“通す”か“カット”かを競争で読め',W/2,210);
    ctx.fillStyle='rgba(255,255,255,0.66)';ctx.font='14px sans-serif';
    ctx.fillText('外野から本塁へ送球。送球（青）と走者（橙）の“本塁への競争”を見て判断',W/2,248);
    ctx.fillText('送球が間に合う（走者より速い）＝通して本塁でアウト（何もしない）',W/2,270);
    ctx.fillText('間に合わない（走者が速い）＝カット（タップ/SPACE）して二塁で打者走者を刺す',W/2,292);
    ctx.fillText('通せる送球をカットすると本塁の刺しを逃し、間に合わない送球を通すと生還＋進塁で失敗',W/2,314);
    ctx.fillText('緑リングの間に判断。上級ほど競争が際どく速い。3失敗で交代',W/2,336);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で開始',W/2,398);
    ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='14px sans-serif';ctx.fillText('BEST '+best+'　　カット=タップ / 通す=何もしない',W/2,430);
  }
  if(state==='over'){
    ctx.fillStyle='rgba(6,10,6,0.8)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#ff6b6b';ctx.font='bold 46px sans-serif';ctx.fillText('3失敗…交代',W/2,222);
    ctx.fillStyle='#fff';ctx.font='bold 40px sans-serif';ctx.fillText('SCORE '+score,W/2,290);
    ctx.fillStyle='rgba(255,255,255,0.85)';ctx.font='19px sans-serif';ctx.fillText('アウト '+outs+'   BEST '+best,W/2,330);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で もう一度',W/2,402);
  }

  if(flash>0.02){ctx.globalAlpha=flash*0.5;ctx.fillStyle=flashCol;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}
  ctx.restore();

  ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,0.4)';ctx.font='12px sans-serif';
  ctx.fillText('送球が本塁に間に合うなら通す（何もしない）、間に合わないならカット（タップ）で二塁刺し。誤判断は失敗。3失敗で交代',W/2,H-8);
}

function frame(ts){let dt=ts-last;last=ts;if(dt>60)dt=60;if(dt<0)dt=0;update(dt);render();requestAnimationFrame(frame);}
requestAnimationFrame(frame);

// ---------- test hook ----------
window.__co={
  start, cut:()=>cut(),
  get state(){return state;},
  get score(){return score;},
  get outs(){return outs;},
  get fails(){return fails;},
  get info(){return {state,phase,throwBeats,clock,cutT,throwT,canCut:(phase==='play'&&clock<cutT&&!acted),acted,result,outs,fails,lvl};}
};
})();
</script>
</body>
</html>
