<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>冷静に流し込め (Round the Keeper)</title>
<style>
  html,body{margin:0;height:100%;background:#07100a;overflow:hidden;
    font-family:-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  #stage{position:relative;width:100vw;height:100vh;max-width:calc(100vh*1.5);max-height:calc(100vw/1.5);aspect-ratio:900/600;}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;border-radius:6px;}
</style>
</head>
<body>
<div id="wrap"><div id="stage"><canvas id="cv"></canvas></div></div>
<script>
(function(){
const W=900,H=600,cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let DPR=1;
function fit(){DPR=Math.min(2,window.devicePixelRatio||1);cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
fit();addEventListener('resize',fit);

// ---------- audio ----------
let AC=null;function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function tone(f,d,type,v,sweep){const a=ac();if(!a)return;const t=a.currentTime,o=a.createOscillator(),g=a.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(sweep)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+sweep),t+d);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v||0.2,t+0.008);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+0.02);}
function noise(d,v,hp){const a=ac();if(!a)return;const t=a.currentTime,n=Math.floor(a.sampleRate*d),buf=a.createBuffer(1,n,a.sampleRate),ch=buf.getChannelData(0);
  for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource();s.buffer=buf;
  const f=a.createBiquadFilter();f.type='highpass';f.frequency.value=hp||600;const g=a.createGain();g.gain.value=v||0.2;
  s.connect(f);f.connect(g);g.connect(a.destination);s.start(t);s.stop(t+d+0.02);}
const S={
  set:()=>{tone(220,0.05,'sine',0.03);},
  slot:()=>{noise(0.05,0.13,500);tone(320,0.06,'square',0.09,140);},
  goal:()=>{[620,860,1120].forEach((f,i)=>setTimeout(()=>tone(f,0.11,'triangle',0.16),i*58));},
  big:()=>{[600,800,1000,1250].forEach((f,i)=>setTimeout(()=>tone(f,0.12,'triangle',0.17),i*80));},
  save:()=>{noise(0.16,0.2,300);tone(160,0.22,'sawtooth',0.12,-40);},
  streak:()=>{[700,930,1170,1400].forEach((f,i)=>setTimeout(()=>tone(f,0.1,'triangle',0.16),i*60));},
  over:()=>{[440,330,247,175].forEach((f,i)=>setTimeout(()=>tone(f,0.3,'triangle',0.2),i*160));}
};

// ---------- geometry ----------
const GOAL={x:452,y:120}, GW=210, GH=56;      // goal mouth (top)
const STR={x:452,y:474};                       // striker (you) with the ball
const KGOAL={x:452,y:170};                     // keeper's starting spot (on his line)
const KMEET={x:452,y:404};                     // where the keeper reaches the ball at the deadline
function keeperPos(fr){ return {x:lerp(KGOAL.x,KMEET.x,easeOut(fr)), y:lerp(KGOAL.y,KMEET.y,easeOut(fr))}; }

// ---------- state ----------
let state='title', phase='hold', plays=0;
let score=0, combo=0, best=+(localStorage.getItem('rk_best')||0);
let outs=0, fails=0, lvl=1;   // outs = goals scored
let clock=0, deadT=1100, win=290, tough=false;
let released=false, relT=0, result=null, resultT=0, msg='', msgOk=false, quality=0, anim=0, sideSign=1;
let shake=0, flash=0, flashCol='#fff', last=performance.now();
let parts=[], pops=[];

function rnd(a,b){return a+Math.random()*(b-a);}
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function lerp(a,b,u){return a+(b-a)*u;}
function easeOut(u){return 1-Math.pow(1-u,2);}

function reset(){state='title';score=0;combo=0;outs=0;fails=0;lvl=1;plays=0;result=null;parts=[];pops=[];}
function winStart(){return deadT-win;}

function newPlay(){
  plays++; lvl=Math.min(7,1+Math.floor(outs/4));
  deadT=clamp(1160-lvl*58,720,1160);      // when the keeper reaches the ball
  win=clamp(300-lvl*18,160,300);          // how long the "net is open" before he smothers
  tough=Math.random()<clamp(0.2+lvl*0.05,0.2,0.5);
  if(tough)win*=0.8;
  sideSign=(Math.random()<0.5?-1:1);      // which side the finish rolls into
  phase='hold'; clock=0; released=false; relT=0; result=null; resultT=0; msg=''; msgOk=false; quality=0; anim=0;
  S.set();
}
function start(){ if(!ac())ac(); if(AC&&AC.state==='suspended')AC.resume(); reset(); state='play'; newPlay(); }

function slot(){   // roll the ball past the keeper
  if(state==='title'){start();return;}
  if(state==='over'){ if(resultT>0.4){reset();start();} return; }
  if(state!=='play'||phase!=='hold'||released) return;
  released=true; relT=clock; S.slot();
  if(clock<winStart()){ resolve('early'); }
  else { quality=clamp((clock-winStart())/win,0,1); resolve('goal'); }
}

function resolve(k){
  phase='result'; result=k; resultT=0; anim=0;
  if(k==='goal'){
    outs++; combo++;
    const perfect=quality>=0.82;
    let add=Math.round((60+Math.round(quality*140)+(tough?80:0))*(1+Math.min(9,combo-1)*0.14)); score+=add;
    setTimeout(S.goal,120); if(perfect||tough)setTimeout(S.big,210);
    msgOk=true; flash=1;flashCol=perfect?'#ffe08a':'#8affa0';shake=perfect?7:5;
    burst(GOAL.x+sideSign*40,GOAL.y+GH,perfect?'#ffe08a':'#8affa0',perfect?24:16,perfect?8:6);
    if(perfect)burst(GOAL.x-sideSign*30,GOAL.y+GH,'#fff2b0',12,7);
    pop(W/2,250,(perfect?'完全にGKを引きつけて流し込んだ！ゴラッソ！ +':'冷静にGKをかわして流し込む——ゴール！ +')+add,'#d6ffe0');
    if(combo>=2)pop(W/2,150,'コンボ x'+combo,'#ffd24d');
    if(combo>0&&combo%5===0)S.streak();
    msg=perfect?'ギリギリまで引きつけてGKを完全に外し、無人のゴールへ転がし込んだ——芸術的な決定力！':'あわてず引きつけてから逆へ流し込み、着実にネットを揺らした';
  } else {
    fails++; combo=0; msgOk=false; flash=1;shake=8; S.save();
    if(k==='early'){ flashCol='#ff5b5b'; msg='仕掛けが早い…GKがまだ立って角度を消しており、正面で弾かれてセーブ'; pop(W/2,250,'早すぎ…セーブ','#ffb0b0'); }
    else { flashCol='#ff8b3b'; msg='引きつけ過ぎ…足元に踏み込まれ、シュート前にボールを抑え込まれた（回収）'; pop(W/2,250,'詰められた…回収','#ffcf9a'); }
  }
  if(fails>=3){ state='over'; resultT=0; S.over(); if(score>best){best=score;localStorage.setItem('rk_best',best);} }
}

// ---------- input ----------
cv.addEventListener('pointerdown',e=>{e.preventDefault();slot();});
addEventListener('keydown',e=>{ if(e.repeat)return;
  if(e.code==='Space'||e.code==='Enter'||e.code==='ArrowUp'||e.code==='ArrowRight'||e.code==='KeyF'||e.code==='KeyJ'){e.preventDefault();slot();} });

// ---------- particles ----------
function burst(x,y,c,n,sp){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=rnd(sp*0.3,sp);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:1,c});}}
function pop(x,y,txt,c){pops.push({x,y,txt,c,life:1});}

// ---------- update ----------
function update(dt){
  shake*=Math.pow(0.86,dt/16.7); if(shake<0.3)shake=0;
  flash*=Math.pow(0.9,dt/16.7);
  for(const q of parts){q.vx*=0.96;q.vy=q.vy*0.96+0.28;q.x+=q.vx*dt/16.7;q.y+=q.vy*dt/16.7;q.life-=dt/16.7*0.026;}
  parts=parts.filter(q=>q.life>0);
  for(const q of pops){q.y-=dt/16.7*0.5;q.life-=dt/16.7*0.02;}
  pops=pops.filter(q=>q.life>0);

  if(state!=='play'){ if(state==='over')resultT+=dt/1000; return; }
  if(phase==='hold'){ clock+=dt;
    if(!released && clock>=deadT){ released=true; relT=deadT; resolve('smother'); }
    return; }
  if(phase==='result'){ resultT+=dt/1000; anim=Math.min(1,anim+dt/400);
    if(resultT>1.55) newPlay(); return; }
}

// ---------- render ----------
function drawField(){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#0f5e34');g.addColorStop(0.55,'#0e5230');g.addColorStop(1,'#0c4429');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  // mowing stripes
  ctx.fillStyle='rgba(255,255,255,0.03)';
  for(let i=0;i<6;i++){ if(i%2===0)ctx.fillRect(0,80+i*90,W,90); }
  // penalty box
  ctx.strokeStyle='rgba(255,255,255,0.30)';ctx.lineWidth=3;
  ctx.strokeRect(W/2-190,GOAL.y+GH,380,250);
  ctx.strokeRect(W/2-84,GOAL.y+GH,168,96);
  // penalty spot
  ctx.fillStyle='rgba(255,255,255,0.6)';ctx.beginPath();ctx.arc(W/2,GOAL.y+GH+180,3,0,6.28);ctx.fill();
  // goal frame
  ctx.fillStyle='rgba(0,0,0,0.28)';ctx.fillRect(GOAL.x-GW/2-4,GOAL.y-4,GW+8,GH+4);
  // net
  ctx.strokeStyle='rgba(255,255,255,0.35)';ctx.lineWidth=1;
  for(let gx=GOAL.x-GW/2;gx<=GOAL.x+GW/2;gx+=15){ctx.beginPath();ctx.moveTo(gx,GOAL.y);ctx.lineTo(gx,GOAL.y+GH);ctx.stroke();}
  for(let gy=GOAL.y;gy<=GOAL.y+GH;gy+=13){ctx.beginPath();ctx.moveTo(GOAL.x-GW/2,gy);ctx.lineTo(GOAL.x+GW/2,gy);ctx.stroke();}
  // posts + bar
  ctx.strokeStyle='#f2f2f2';ctx.lineWidth=6;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(GOAL.x-GW/2,GOAL.y+GH);ctx.lineTo(GOAL.x-GW/2,GOAL.y);ctx.lineTo(GOAL.x+GW/2,GOAL.y);ctx.lineTo(GOAL.x+GW/2,GOAL.y+GH);ctx.stroke();
  ctx.lineCap='butt';
}
function keeper(x,y,fr,dived){
  ctx.save();ctx.translate(x,y);
  const spread=easeOut(clamp(fr,0,1));
  if(dived){ // beaten: on the ground, sprawled to one side
    ctx.rotate(sideSign*0.9);
  }
  ctx.fillStyle='#e8c23a';ctx.beginPath();ctx.ellipse(0,-15,11,16,0,0,6.28);ctx.fill();
  ctx.fillStyle='#f0c9a0';ctx.beginPath();ctx.arc(0,-35,7.5,0,6.28);ctx.fill();
  // arms spread wider as he commits
  ctx.strokeStyle='#e8c23a';ctx.lineWidth=6;ctx.lineCap='round';
  const aw=14+spread*20;
  ctx.beginPath();ctx.moveTo(-4,-22);ctx.lineTo(-aw,-14-spread*6);ctx.stroke();
  ctx.beginPath();ctx.moveTo(4,-22);ctx.lineTo(aw,-14-spread*6);ctx.stroke();
  ctx.restore();
}
function person(x,y,col,s,lean){s=s||1;lean=lean||0;
  ctx.save();ctx.translate(x,y);ctx.rotate(lean);
  ctx.fillStyle=col;ctx.beginPath();ctx.ellipse(0,-15*s,10*s,15*s,0,0,6.28);ctx.fill();
  ctx.fillStyle='#f0c9a0';ctx.beginPath();ctx.arc(0,-34*s,7.5*s,0,6.28);ctx.fill();
  ctx.restore();
}

function render(){
  ctx.save();
  if(shake>0)ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
  drawField();

  if(state==='play'||state==='over'){
    let kf = clamp((phase==='hold'?clock:relT)/deadT,0,1);
    if(phase==='result'){
      if(result==='goal') kf = clamp(relT/deadT,0,1);       // frozen where he was drawn to
      else if(result==='smother') kf = 1;                    // reached the ball
      else kf = clamp(relT/deadT,0,1);                        // early: still upright, near his line
    }
    const kp=keeperPos(kf);

    // target corner of the goal the finish aims for
    const netX=GOAL.x+sideSign*(GW/2-26), netY=GOAL.y+GH-16;

    // ball path
    let bx=STR.x, by=STR.y-16;
    const beaten=(phase==='result'&&result==='goal');
    if(phase==='result'&&result==='goal'){ const u=easeOut(anim); bx=lerp(STR.x,netX,u); by=lerp(STR.y-16,netY,u); }
    else if(phase==='result'&&result==='early'){ const u=easeOut(anim); bx=lerp(STR.x,kp.x,u); by=lerp(STR.y-16,kp.y+4,u); } // into keeper
    else if(phase==='result'&&result==='smother'){ bx=kp.x; by=kp.y-2; } // under keeper

    // keeper (drawn before striker; sprawls when beaten)
    keeper(kp.x,kp.y,kf,beaten);

    // striker (you) with ball at feet during hold
    person(STR.x,STR.y,'#3aa0ff',1.02,phase==='result'&&result!=='early'?-0.12:0);

    // ball
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(bx,by,7.5,0,6.28);ctx.fill();
    ctx.strokeStyle='#333';ctx.lineWidth=1.1;ctx.beginPath();ctx.arc(bx,by,7.5,0.4,2.2);ctx.stroke();

    // aim guide toward the open corner while holding
    if(state==='play'&&phase==='hold'){
      ctx.strokeStyle='rgba(140,255,170,'+(0.15+0.28*clamp((clock-winStart())/win,0,1))+')';ctx.lineWidth=2;ctx.setLineDash([7,7]);
      ctx.beginPath();ctx.moveTo(STR.x,STR.y-16);ctx.lineTo(netX,netY);ctx.stroke();ctx.setLineDash([]);
    }

    // reward-lateness bar (draw the keeper, slot late)
    ctx.textAlign='center';
    if(state==='play'&&phase==='hold'){
      ctx.fillStyle='rgba(255,220,90,0.96)';ctx.font='bold 21px sans-serif';ctx.fillText('あわてるな！ GKを“引きつけて”から流し込め',W/2,44);
      const bw=300,x=W/2-bw/2,y=62;
      ctx.fillStyle='rgba(255,255,255,0.15)';ctx.fillRect(x,y,bw,9);
      const gx0=x+bw*clamp(winStart()/deadT,0,1);
      const grad=ctx.createLinearGradient(gx0,0,x+bw,0);grad.addColorStop(0,'rgba(90,240,130,0.35)');grad.addColorStop(1,'rgba(120,255,150,0.78)');
      ctx.fillStyle=grad;ctx.fillRect(gx0,y,(x+bw)-gx0,9);
      ctx.fillStyle='#ff5b5b';ctx.fillRect(x+bw-2,y-3,3,15);
      ctx.textAlign='right';ctx.fillStyle='rgba(255,120,110,0.9)';ctx.font='11px sans-serif';ctx.fillText('詰められる',x+bw,y+24);
      ctx.textAlign='center';ctx.fillStyle='rgba(150,255,175,0.9)';ctx.fillText('引きつけ→ネットが開く',(gx0+(x+bw-40))/2,y+24);
      const px=x+bw*clamp(clock/deadT,0,1);
      ctx.fillStyle='#ffe14d';ctx.fillRect(px-2,y-4,4,17);
      ctx.fillStyle='rgba(255,255,255,0.55)';ctx.font='12px sans-serif';ctx.fillText('タップ / SPACE / ↑ ＝ 流し込む（早いと正面でセーブ・引きつけ過ぎると詰められる）',W/2,H-30);
    }
  }

  for(const q of parts){ctx.globalAlpha=Math.max(0,q.life);ctx.fillStyle=q.c;ctx.beginPath();ctx.arc(q.x,q.y,3.2,0,6.28);ctx.fill();}
  ctx.globalAlpha=1;
  for(const q of pops){ctx.globalAlpha=Math.max(0,q.life);ctx.fillStyle=q.c;ctx.font='bold 21px sans-serif';ctx.textAlign='center';ctx.fillText(q.txt,q.x,q.y);}
  ctx.globalAlpha=1;

  // HUD
  ctx.textAlign='left';ctx.fillStyle='#fff';ctx.font='bold 26px sans-serif';ctx.fillText('SCORE '+score,20,36);
  ctx.textAlign='right';ctx.fillStyle='rgba(255,255,255,0.9)';ctx.font='14px sans-serif';ctx.fillText('ゴール '+outs+'  Lv'+lvl,W-20,24);
  ctx.fillText('失敗',W-92,46);
  for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(W-60+i*20,41,7,0,6.28);ctx.fillStyle=i<fails?'#ff5b5b':'rgba(255,255,255,0.25)';ctx.fill();}
  if(combo>=2){ctx.textAlign='center';ctx.fillStyle='#ffd24d';ctx.font='bold 18px sans-serif';ctx.fillText('コンボ x'+combo,W/2,112);}

  if(state==='play'&&phase==='result'&&msg){ctx.textAlign='center';ctx.fillStyle=msgOk?'#9ff0b8':'#ffb38a';ctx.font='bold 16px sans-serif';ctx.fillText(msg,W/2,540);}

  if(state==='title'){
    ctx.fillStyle='rgba(3,10,6,0.84)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='bold 44px sans-serif';ctx.fillText('冷静に流し込め',W/2,86);
    ctx.fillStyle='#ffd23e';ctx.font='bold 22px sans-serif';ctx.fillText('Round the Keeper',W/2,122);
    ctx.fillStyle='rgba(255,255,255,0.92)';ctx.font='16px sans-serif';
    ctx.fillText('GKと1対1。飛び出してくるGKを“引きつけて”から、あわてず逆へ流し込む決定力の技術',W/2,182);
    ctx.fillStyle='rgba(255,255,255,0.66)';ctx.font='14px sans-serif';
    ctx.fillText('GKが詰めてくる→抑え込まれる“寸前”の緑窓でタップ/SPACE/↑＝流し込む。引きつけるほどネットが開き高得点',W/2,220);
    ctx.fillText('仕掛けが早い＝GKがまだ角度を消していて正面でセーブ',W/2,244);
    ctx.fillText('引きつけ過ぎ＝足元に踏み込まれてボールを回収される。ギリギリで外すほど大量加点（ゴラッソ）',W/2,268);
    ctx.fillText('上級ほどGKが速く窓が短い。3失敗で交代',W/2,292);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で開始',W/2,360);
    ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='14px sans-serif';ctx.fillText('BEST '+best,W/2,392);
  }
  if(state==='over'){
    ctx.fillStyle='rgba(3,10,6,0.86)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#ff6b6b';ctx.font='bold 46px sans-serif';ctx.fillText('3失敗…交代',W/2,222);
    ctx.fillStyle='#fff';ctx.font='bold 40px sans-serif';ctx.fillText('SCORE '+score,W/2,290);
    ctx.fillStyle='rgba(255,255,255,0.85)';ctx.font='19px sans-serif';ctx.fillText('ゴール '+outs+'   BEST '+best,W/2,330);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で もう一度',W/2,402);
  }

  if(flash>0.02){ctx.globalAlpha=flash*0.5;ctx.fillStyle=flashCol;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}
  ctx.restore();

  ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,0.4)';ctx.font='12px sans-serif';
  ctx.fillText('冷静に流し込め：飛び出すGKを引きつけ、抑え込まれる寸前の緑窓で流し込み＝ゴール。早いとセーブ・遅いと回収、3失敗で交代',W/2,H-8);
}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

function frame(ts){let dt=ts-last;last=ts;if(dt>60)dt=60;if(dt<0)dt=0;update(dt);render();requestAnimationFrame(frame);}
requestAnimationFrame(frame);

// ---------- test hook ----------
window.__rk={
  start, slot,
  get state(){return state;},
  get score(){return score;},
  get outs(){return outs;},
  get fails(){return fails;},
  get info(){return {state,phase,clock,deadT,win,winStart:winStart(),tough,released,relT,result,outs,fails,lvl,sideSign,
    inWindow:(phase==='hold'&&clock>=winStart()&&clock<=deadT)};}
};
})();
</script>
</body>
</html>
