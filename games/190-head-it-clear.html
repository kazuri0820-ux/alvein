<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ヘディングでクリア (Head It Clear)</title>
<style>
  html,body{margin:0;height:100%;background:#0a1a10;overflow:hidden;
    font-family:-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  #stage{position:relative;width:100vw;height:100vh;max-width:calc(100vh*1.5);max-height:calc(100vw/1.5);aspect-ratio:900/600;}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;border-radius:6px;}
</style>
</head>
<body>
<div id="wrap"><div id="stage"><canvas id="cv"></canvas></div></div>
<script>
(function(){
const W=900,H=600,cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let DPR=1;
function fit(){DPR=Math.min(2,window.devicePixelRatio||1);cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
fit();addEventListener('resize',fit);

// ---------- audio ----------
let AC=null;function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function tone(f,d,type,v,sweep){const a=ac();if(!a)return;const t=a.currentTime,o=a.createOscillator(),g=a.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(sweep)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+sweep),t+d);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v||0.2,t+0.008);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+0.02);}
function noise(d,v,hp){const a=ac();if(!a)return;const t=a.currentTime,n=Math.floor(a.sampleRate*d),buf=a.createBuffer(1,n,a.sampleRate),ch=buf.getChannelData(0);
  for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource();s.buffer=buf;
  const f=a.createBiquadFilter();f.type='highpass';f.frequency.value=hp||600;const g=a.createGain();g.gain.value=v||0.2;
  s.connect(f);f.connect(g);g.connect(a.destination);s.start(t);s.stop(t+d+0.02);}
const S={
  head:()=>{noise(0.05,0.2,500);tone(360,0.09,'square',0.13);},
  great:()=>{noise(0.05,0.2,700);[620,880,1180,1560].forEach((f,i)=>setTimeout(()=>tone(f,0.12,'triangle',0.2),i*60));},
  goal:()=>{tone(220,0.32,'sawtooth',0.2,-110);setTimeout(()=>tone(160,0.32,'sawtooth',0.16,-70),130);noise(0.4,0.1,200);},
  whiff:()=>{noise(0.14,0.16,400);tone(200,0.16,'sawtooth',0.12,-70);},
  cross:()=>{tone(500,0.08,'square',0.1,120);},
  over:()=>{[440,330,247,175].forEach((f,i)=>setTimeout(()=>tone(f,0.3,'triangle',0.2),i*160));}
};

// ---------- geometry ----------
const HEAD={x:450,y:214};   // header point (CB's head)
const GOAL_Y=560;
const HEAD_H=66;            // ball height below which the header window opens (descending)

// ---------- state ----------
let state='title', phase='cross', t=0, plays=0;
let score=0, combo=0, best=+(localStorage.getItem('header_best')||0);
let clears=0, conceded=0, lvl=1;
let P=null, ball=null, atk=null, result=null, resultT=0, msg='', msg2='', headBall=null;
let shake=0, flash=0, flashCol='#fff', last=performance.now(), jump=0;
let parts=[], pops=[];

function rnd(a,b){return a+Math.random()*(b-a);}
function chance(p){return Math.random()<p;}
function clamp(v,a,b){return v<a?a:v>b?b:v;}

function reset(){state='title';score=0;combo=0;clears=0;conceded=0;lvl=1;plays=0;P=null;ball=null;result=null;parts=[];pops=[];headBall=null;jump=0;}

function newCross(){
  plays++;
  lvl=Math.min(6,1+Math.floor(plays/3));
  const wing=chance(0.5)?-1:1;
  const side=chance(0.5)?-1:1;                 // attacker side relative to head point
  const dur=Math.max(900,1400-lvl*84);
  const peak=150+rnd(-10,20);
  P={wing,side,dur,peak,t:0,done:false, safeDir: side<0?'R':'L'};
  ball={sx: wing<0?110:790, sy:300, x:0,y:0,h:0};
  atk={x:HEAD.x+side*rnd(26,46), y:HEAD.y+6};
  headBall=null; result=null; phase='cross'; t=0; jump=0;
  msg='クロス！ 競り勝ってクリア'; msg2='相手（赤）の逆＝安全な方向へ弾け';
}

function start(){ if(!ac())ac(); if(AC&&AC.state==='suspended')AC.resume(); reset(); state='play'; newCross(); }

// ---------- head ----------
function head(dir){ // 'L' or 'R'
  if(state==='title'){start();return;}
  if(state==='over'){ if(resultT>0.5){reset();start();} return; }
  if(state!=='play'||phase!=='cross'||!P||P.done) return;
  const p=P.t/P.dur;
  const windowOpen = p>0.66 && P.h<=HEAD_H;
  P.done=true; jump=1;
  if(!windowOpen){ S.whiff(); applyResult('whiff'); return; }
  if(dir===P.safeDir){ const great=Math.abs(P.h-8)<10 && p>0.8; applyResult(great?'great':'clear', dir); }
  else { applyResult('danger', dir); }
}

function applyResult(kind,dir){
  result=kind; resultT=0; phase='resolve';
  if(kind==='clear'||kind==='great'){
    combo++; const mult=1+Math.min(6,combo-1)*0.24; const base=kind==='great'?180:120; const add=Math.round(base*mult);
    score+=add; clears++;
    if(kind==='great')S.great(); else S.head();
    flash=1;flashCol=kind==='great'?'#ffe08a':'#8ff0b8'; shake=kind==='great'?12:8;
    // head the ball out to the safe side
    const dx=(dir==='R'?1:-1);
    headBall={x:HEAD.x,y:HEAD.y-20,vx:dx*7,vy:-4,life:1};
    burst(HEAD.x,HEAD.y-16,kind==='great'?'#ffe08a':'#bfffd0',kind==='great'?26:18,7);
    pop(HEAD.x,HEAD.y-46,(kind==='great'?'完璧なクリア！ ':'ヘディングでクリア！ ')+'+'+add,'#eaffef');
    if(combo>=2)pop(HEAD.x,HEAD.y-70,'コンボ x'+combo,'#ffe08a');
    msg=kind==='great'?'ど真ん中で競り勝った！ 完璧クリア':'ヘディングでクリア！ 危険を弾いた'; msg2='';
  } else {
    combo=0; conceded++;
    S.goal();
    flash=1;flashCol='#ff6b6b'; shake=11;
    burst(HEAD.x,HEAD.y,'#ff8a8a',16,5);
    if(kind==='danger'){msg='危険な方向へ！ 相手に触られた';msg2='相手の逆サイドへ弾け';}
    else {msg='競り負けた！ タイミングがズレた';msg2='最高到達点で合わせろ';}
    // ball goes into goal
    headBall={x:HEAD.x,y:HEAD.y, vx:rnd(-2,2), vy:9, life:1, danger:true};
  }
}

// ---------- input ----------
cv.addEventListener('pointerdown',e=>{
  e.preventDefault();
  if(state==='title'||state==='over'){head('L');return;}
  const r=cv.getBoundingClientRect(); const x=((e.clientX-r.left)/r.width)*W;
  head(x<W/2?'L':'R');
});
addEventListener('keydown',e=>{
  if(e.code==='ArrowLeft'){e.preventDefault();head('L');}
  else if(e.code==='ArrowRight'){e.preventDefault();head('R');}
  else if(e.code==='Space'||e.code==='Enter'||e.code==='ArrowUp'){e.preventDefault(); if(state!=='play')head('L');}
});

// ---------- particles ----------
function burst(x,y,c,n,sp){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=rnd(sp*0.3,sp);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:1,c});}}
function pop(x,y,txt,c){pops.push({x,y,txt,c,life:1});}

// ---------- update ----------
function update(dt){
  shake*=Math.pow(0.86,dt/16.7); if(shake<0.3)shake=0;
  flash*=Math.pow(0.9,dt/16.7);
  if(jump>0)jump-=dt/300;
  for(const p of parts){p.vx*=0.96;p.vy=p.vy*0.96+0.3;p.x+=p.vx*dt/16.7;p.y+=p.vy*dt/16.7;p.life-=dt/16.7*0.026;}
  parts=parts.filter(p=>p.life>0);
  for(const p of pops){p.y-=dt/16.7*0.5;p.life-=dt/16.7*0.018;}
  pops=pops.filter(p=>p.life>0);
  if(headBall){ headBall.x+=headBall.vx*dt/16.7; headBall.y+=headBall.vy*dt/16.7; if(!headBall.danger)headBall.vy+=0.2*dt/16.7; headBall.life-=dt/16.7*0.02; }

  if(state!=='play'){ if(state==='over')resultT+=dt/1000; return; }
  t+=dt;

  if(phase==='cross'){
    P.t+=dt; const p=clamp(P.t/P.dur,0,1);
    ball.x=ball.sx+(HEAD.x-ball.sx)*p;
    ball.y=ball.sy+(HEAD.y-ball.sy)*p;
    P.h=Math.sin(p*Math.PI)*P.peak;
    if(p>=1 && !P.done){ applyResult('whiff'); }
    return;
  }
  if(phase==='resolve'){
    resultT+=dt/1000;
    if(resultT>1.05){
      if(conceded>=3){ state='over'; resultT=0; S.over(); if(score>best){best=score;localStorage.setItem('header_best',best);} }
      else newCross();
    }
    return;
  }
}

// ---------- render ----------
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

function drawScene(){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#164a2c');g.addColorStop(1,'#1f7040');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='rgba(255,255,255,0.03)';for(let i=0;i<6;i++){if(i%2)ctx.fillRect(0,i*100,W,100);}
  // goal at bottom (behind the defender)
  ctx.strokeStyle='#f4f4f4';ctx.lineWidth=6;ctx.strokeRect(360,GOAL_Y,180,34);
  ctx.strokeStyle='rgba(255,255,255,0.8)';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(80,GOAL_Y);ctx.lineTo(820,GOAL_Y);ctx.stroke();
  ctx.strokeStyle='rgba(255,255,255,0.22)';ctx.lineWidth=2;ctx.strokeRect(250,GOAL_Y-150,400,150);
}

function render(){
  ctx.save();
  if(shake>0)ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
  drawScene();

  if(P&&ball&&atk){
    // safe-side hint arrow (fades at high lvl)
    if(state==='play'&&phase==='cross'&&lvl<4){
      const dx=P.safeDir==='R'?1:-1;
      ctx.strokeStyle='rgba(126,240,176,0.5)';ctx.lineWidth=3;
      ctx.beginPath();ctx.moveTo(HEAD.x+dx*30,HEAD.y-70);ctx.lineTo(HEAD.x+dx*60,HEAD.y-70);ctx.stroke();
      ctx.beginPath();ctx.moveTo(HEAD.x+dx*60,HEAD.y-70);ctx.lineTo(HEAD.x+dx*50,HEAD.y-76);ctx.moveTo(HEAD.x+dx*60,HEAD.y-70);ctx.lineTo(HEAD.x+dx*50,HEAD.y-64);ctx.stroke();
      ctx.fillStyle='rgba(126,240,176,0.7)';ctx.font='bold 12px sans-serif';ctx.textAlign='center';ctx.fillText('安全',HEAD.x+dx*45,HEAD.y-82);
    }
    // attacker
    ctx.fillStyle='rgba(0,0,0,0.2)';ctx.beginPath();ctx.ellipse(atk.x,atk.y+16,11,4,0,0,6.28);ctx.fill();
    ctx.fillStyle='#e2413a';rr(atk.x-8,atk.y-6,16,22,6);ctx.fill();
    ctx.fillStyle='#f2c9a0';ctx.beginPath();ctx.arc(atk.x,atk.y-14,6.5,0,6.28);ctx.fill();
    ctx.fillStyle='#8a1f1a';ctx.beginPath();ctx.arc(atk.x,atk.y-16,7,Math.PI,0);ctx.fill();
    // defender (you) — jumps to head
    const jy=HEAD.y+ (jump>0? -Math.sin(jump*Math.PI)*24 : 0) + 24;
    ctx.fillStyle='rgba(0,0,0,0.22)';ctx.beginPath();ctx.ellipse(HEAD.x,HEAD.y+20,13,5,0,0,6.28);ctx.fill();
    ctx.fillStyle='#2b6cff';rr(HEAD.x-9,jy-8,18,26,6);ctx.fill();
    ctx.fillStyle='#f2c9a0';ctx.beginPath();ctx.arc(HEAD.x,jy-18,8,0,6.28);ctx.fill();
    ctx.fillStyle='#1a3a8a';ctx.beginPath();ctx.arc(HEAD.x,jy-20,8.5,Math.PI,0);ctx.fill();
    // header-window ring
    const win = phase==='cross'&&(P.t/P.dur)>0.66&&P.h<=HEAD_H;
    if(win){ ctx.strokeStyle='rgba(126,240,176,0.9)';ctx.lineWidth=4;ctx.beginPath();ctx.arc(HEAD.x,HEAD.y-26,26,0,6.28);ctx.stroke();
      ctx.fillStyle='#8ff0b8';ctx.font='bold 13px sans-serif';ctx.textAlign='center';ctx.fillText('今！ ←/→',HEAD.x,HEAD.y-60);}
    // crossing ball
    if(phase==='cross'){ const by=ball.y-P.h; ctx.fillStyle='rgba(0,0,0,0.18)';ctx.beginPath();ctx.ellipse(ball.x,ball.y+4,7,3,0,0,6.28);ctx.fill();
      ctx.strokeStyle='rgba(255,255,255,0.14)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(ball.x,ball.y);ctx.lineTo(ball.x,by);ctx.stroke();
      ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(ball.x,by,8,0,6.28);ctx.fill();ctx.strokeStyle='#333';ctx.lineWidth=1.3;ctx.beginPath();ctx.arc(ball.x,by,8,0,6.28);ctx.stroke(); }
    // headed ball
    if(headBall){ ctx.globalAlpha=Math.max(0,headBall.life);ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(headBall.x,headBall.y,7,0,6.28);ctx.fill();ctx.strokeStyle='#333';ctx.lineWidth=1.2;ctx.beginPath();ctx.arc(headBall.x,headBall.y,7,0,6.28);ctx.stroke();ctx.globalAlpha=1; }
  }

  for(const p of parts){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,3.2,0,6.28);ctx.fill();}
  ctx.globalAlpha=1;
  for(const p of pops){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.font='bold 21px sans-serif';ctx.textAlign='center';ctx.fillText(p.txt,p.x,p.y);}
  ctx.globalAlpha=1;

  // HUD
  ctx.textAlign='left';ctx.fillStyle='#fff';ctx.font='bold 26px sans-serif';ctx.fillText('SCORE '+score,20,36);
  ctx.textAlign='right';ctx.fillStyle='rgba(255,255,255,0.85)';ctx.font='14px sans-serif';ctx.fillText('クリア '+clears+'  Lv.'+lvl,W-20,26);
  ctx.fillText('失点',W-92,50);
  for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(W-66+i*22,46,7,0,6.28);ctx.fillStyle=i<conceded?'#ff5b5b':'rgba(255,255,255,0.25)';ctx.fill();}
  if(combo>=2){ctx.textAlign='left';ctx.fillStyle='#ffe08a';ctx.font='bold 18px sans-serif';ctx.fillText('コンボ x'+combo,20,60);}

  if(state==='play'&&(msg||msg2)){
    ctx.textAlign='center';
    const good=result==='clear'||result==='great';
    ctx.fillStyle=result?(good?'#8ff0b8':'#ff9a9a'):'rgba(255,255,255,0.92)';
    ctx.font='bold 26px sans-serif';ctx.fillText(msg,W/2,H-54);
    if(msg2){ctx.fillStyle='rgba(255,255,255,0.72)';ctx.font='15px sans-serif';ctx.fillText(msg2,W/2,H-30);}
  }

  if(state==='title'){
    ctx.fillStyle='rgba(6,16,10,0.66)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='bold 42px sans-serif';ctx.fillText('ヘディングでクリア',W/2,190);
    ctx.fillStyle='#8ff0b8';ctx.font='bold 22px sans-serif';ctx.fillText('Head It Clear',W/2,226);
    ctx.fillStyle='rgba(255,255,255,0.9)';ctx.font='18px sans-serif';
    ctx.fillText('入ってくるクロスに対し、最高到達点（緑リング）で競り勝つタイミングに',W/2,288);
    ctx.fillText('相手（赤）の逆＝安全な方向へヘディング（← 左 / → 右）',W/2,316);
    ctx.fillStyle='rgba(255,255,255,0.66)';ctx.font='15px sans-serif';
    ctx.fillText('相手のいる危険な側へ弾くと触られて失点／タイミングがズレると競り負ける',W/2,358);
    ctx.fillText('ど真ん中で競り勝つほど高得点。3失点で終了',W/2,382);
    ctx.fillStyle='#ffe08a';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で開始',W/2,442);
    ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='14px sans-serif';ctx.fillText('BEST '+best,W/2,474);
  }
  if(state==='over'){
    ctx.fillStyle='rgba(6,16,10,0.74)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#ff6b6b';ctx.font='bold 46px sans-serif';ctx.fillText('3失点…終了',W/2,230);
    ctx.fillStyle='#fff';ctx.font='bold 40px sans-serif';ctx.fillText('SCORE '+score,W/2,296);
    ctx.fillStyle='rgba(255,255,255,0.85)';ctx.font='20px sans-serif';ctx.fillText('クリア '+clears+'   BEST '+best,W/2,336);
    ctx.fillStyle='#8ff0b8';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で もう一度',W/2,408);
  }

  if(flash>0.02){ctx.globalAlpha=flash*0.5;ctx.fillStyle=flashCol;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}
  ctx.restore();

  ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,0.4)';ctx.font='13px sans-serif';
  ctx.fillText('最高到達点（緑リング）で、相手（赤）の逆＝安全な方向へヘディング（←/→）。3失点で終了',W/2,H-8);
}

function frame(ts){let dt=ts-last;last=ts;if(dt>60)dt=60;if(dt<0)dt=0;update(dt);render();requestAnimationFrame(frame);}
requestAnimationFrame(frame);

// ---------- test hook ----------
window.__hd={
  start, headL:()=>head('L'), headR:()=>head('R'),
  get state(){return state;},
  get score(){return score;},
  get clears(){return clears;},
  get conceded(){return conceded;},
  get info(){return {state,phase, p:P?P.t/P.dur:0, h:P?P.h:0, headH:HEAD_H, safeDir:P?P.safeDir:null,
    windowOpen: !!(P&&phase==='cross'&&(P.t/P.dur)>0.66&&P.h<=HEAD_H), result, clears, conceded, lvl};}
};
})();
</script>
</body>
</html>
