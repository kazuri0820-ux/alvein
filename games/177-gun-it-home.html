<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>バックホーム (Gun It Home)</title>
<style>
  html,body{margin:0;height:100%;background:#0a1018;overflow:hidden;
    font-family:-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  #stage{position:relative;width:100vw;height:100vh;max-width:calc(100vh*1.5);max-height:calc(100vw/1.5);aspect-ratio:900/600;}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;border-radius:6px;}
</style>
</head>
<body>
<div id="wrap"><div id="stage"><canvas id="cv"></canvas></div></div>
<script>
(function(){
const W=900,H=600,cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let DPR=1;
function fit(){DPR=Math.min(2,window.devicePixelRatio||1);cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
fit();addEventListener('resize',fit);

// ---------- audio ----------
let AC=null;function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function tone(f,d,type,v,sweep){const a=ac();if(!a)return;const t=a.currentTime,o=a.createOscillator(),g=a.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(sweep)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+sweep),t+d);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v||0.2,t+0.008);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+0.02);}
function noise(d,v,hp){const a=ac();if(!a)return;const t=a.currentTime,n=Math.floor(a.sampleRate*d),buf=a.createBuffer(1,n,a.sampleRate),ch=buf.getChannelData(0);
  for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource();s.buffer=buf;
  const f=a.createBiquadFilter();f.type='highpass';f.frequency.value=hp||600;const g=a.createGain();g.gain.value=v||0.2;
  s.connect(f);f.connect(g);g.connect(a.destination);s.start(t);s.stop(t+d+0.02);}
const S={
  fire:()=>{noise(0.1,0.3,800);tone(200,0.14,'sawtooth',0.16,260);},
  out:()=>{tone(760,0.09,'square',0.18);setTimeout(()=>tone(1040,0.13,'square',0.2),80);setTimeout(()=>tone(1320,0.16,'triangle',0.18),190);},
  laser:()=>{[600,900,1250,1700].forEach((f,i)=>setTimeout(()=>tone(f,0.11,'triangle',0.2),i*55));noise(0.4,0.1,400);},
  safe:()=>{tone(240,0.3,'sawtooth',0.2,-120);setTimeout(()=>tone(170,0.3,'sawtooth',0.16,-70),120);},
  bounce:()=>{tone(280,0.05,'sine',0.1);noise(0.04,0.1,500);},
  over:()=>{[440,330,247,175].forEach((f,i)=>setTimeout(()=>tone(f,0.3,'triangle',0.2),i*160));}
};

// ---------- geometry ----------
const HP={x:450,y:150};       // home plate / catcher
const OFP={x:450,y:524};      // outfielder (you)
const R3={x:708,y:326};       // third base (runner start of dash)
const AIM_Y=182;              // aim marker line near plate
const AX0=372, AX1=528;       // aim sweep range
const PERF=22;                // perfect band half-width
const THROW_DUR=360;          // ms for throw to reach plate

// ---------- state ----------
let state='title', phase='aim', t=0, plays=0;
let score=0, combo=0, best=+(localStorage.getItem('gunhome_best')||0);
let outs=0, safes=0, lvl=1;
let P=null, result=null, resultT=0, msg='', msg2='';
let aimX=AX0, aimDir=1;
let runner={p:0}, ball=null, catcher={tag:0};
let shake=0, flash=0, flashCol='#fff', last=performance.now();
let parts=[], pops=[], trail=[];

function rnd(a,b){return a+Math.random()*(b-a);}
function chance(p){return Math.random()<p;}
function clamp(v,a,b){return v<a?a:v>b?b:v;}

function reset(){state='title';score=0;combo=0;outs=0;safes=0;lvl=1;plays=0;P=null;ball=null;result=null;parts=[];pops=[];trail=[];}

function newPlay(){
  plays++;
  lvl=Math.min(6,1+Math.floor(plays/3));
  const deadline=Math.max(1500,2650-lvl*180);   // ms for runner to reach home (faster w/ lvl)
  const sweepSpd=0.30+lvl*0.05;
  P={deadline,sweepSpd,released:false,tapT:-1,aimAt:0,arrival:0};
  runner={p:0}; ball=null; catcher={tag:0};
  aimX=AX0; aimDir=1;
  result=null; phase='aim'; t=0;
  msg='本塁へ送球！'; msg2='素早く正確に、走者より先へ';
}

function start(){ if(!ac())ac(); if(AC&&AC.state==='suspended')AC.resume(); reset(); state='play'; newPlay(); }

// ---------- release ----------
function release(){
  if(state==='title'){start();return;}
  if(state==='over'){ if(resultT>0.5){reset();start();} return; }
  if(state!=='play'||phase!=='aim'||!P||P.released) return;
  P.released=true; P.tapT=t; P.aimAt=aimX;
  S.fire();
  const off=Math.abs(aimX-HP.x);
  const perfect = off<PERF;
  ball={x:OFP.x,y:OFP.y,tx:aimX,ty:AIM_Y,tp:0,perfect};
  P.arrival=t+THROW_DUR;
  P.perfect=perfect; P.off=off;
  phase='throw';
}

function resolve(){
  phase='resolve'; resultT=0;
  const perfect=P.perfect;
  // runner position at throw arrival
  const runnerHomeT=P.deadline;
  const inTime = P.arrival < runnerHomeT;
  if(perfect && inTime){
    const margin = runnerHomeT - P.arrival;
    const great = margin>420;
    combo++; const mult=1+Math.min(5,combo-1)*0.25; const base=great?250:150; const add=Math.round(base*mult);
    score+=add; outs++;
    if(great)S.laser(); else S.out();
    catcher.tag=1;
    flash=1;flashCol=great?'#ffe08a':'#8ff0b8'; shake=great?15:10;
    burst(HP.x,HP.y,great?'#ffe08a':'#bfffd0',great?34:22,8);
    pop(HP.x,HP.y-28,(great?'レーザービーム！ ':'アウト！ ')+'+'+add,'#eaffef');
    if(combo>=2)pop(HP.x,HP.y-54,'コンボ x'+combo,'#ffe08a');
    msg=great?'レーザービーム！ ズバッと補殺':'アウト！ 本塁で刺した'; msg2='';
  } else {
    combo=0; safes++;
    S.safe();
    flash=1;flashCol='#ff6b6b'; shake=11;
    burst(HP.x,HP.y,'#ff8a8a',18,6);
    if(!perfect && P.off>PERF){ msg = ball&&ball.tx<HP.x-PERF? 'ショートバウンド！ 逸れた':'送球が逸れた！'; msg2='本塁のグラブへ正確に'; }
    else { msg='間に合わず…生還を許した'; msg2='もっと素早い送球を'; }
    pop(HP.x,HP.y-24,'セーフ','#ffb3b3');
  }
}

// ---------- input ----------
cv.addEventListener('pointerdown',e=>{e.preventDefault();release();});
addEventListener('keydown',e=>{ if(e.code==='Space'||e.code==='Enter'||e.code==='ArrowUp'){e.preventDefault();release();}});

// ---------- particles ----------
function burst(x,y,c,n,sp){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=rnd(sp*0.3,sp);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:1,c});}}
function pop(x,y,txt,c){pops.push({x,y,txt,c,life:1});}

// ---------- update ----------
function update(dt){
  shake*=Math.pow(0.86,dt/16.7); if(shake<0.3)shake=0;
  flash*=Math.pow(0.9,dt/16.7);
  for(const p of parts){p.vx*=0.96;p.vy=p.vy*0.96+0.3;p.x+=p.vx*dt/16.7;p.y+=p.vy*dt/16.7;p.life-=dt/16.7*0.026;}
  parts=parts.filter(p=>p.life>0);
  for(const p of pops){p.y-=dt/16.7*0.5;p.life-=dt/16.7*0.018;}
  pops=pops.filter(p=>p.life>0);

  if(state!=='play'){ if(state==='over')resultT+=dt/1000; return; }
  t+=dt;

  if(phase==='aim'){
    aimX+=aimDir*P.sweepSpd*dt;
    if(aimX>AX1){aimX=AX1;aimDir=-1;} if(aimX<AX0){aimX=AX0;aimDir=1;}
    runner.p=clamp(t/P.deadline,0,1);
    if(runner.p>=1){ // runner scored before you threw
      P.released=true; P.perfect=false; P.off=999; P.arrival=t+THROW_DUR; result='late'; resolve();
    }
    return;
  }
  if(phase==='throw'){
    ball.tp=clamp(ball.tp+dt/THROW_DUR,0,1);
    runner.p=clamp(t/P.deadline,0,1);
    if(!ball.bounced && ball.tp>0.55){ ball.bounced=true; S.bounce(); }
    if(ball.tp>=1){ resolve(); }
    return;
  }
  if(phase==='resolve'){
    resultT+=dt/1000;
    // runner keeps sliding a touch
    if(result!=='out'){ runner.p=clamp(runner.p+dt/1400,0,1.06); }
    if(resultT>1.1){
      if(safes>=3){ state='over'; resultT=0; S.over(); if(score>best){best=score;localStorage.setItem('gunhome_best',best);} }
      else newPlay();
    }
    return;
  }
}

// ---------- render ----------
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

function runnerPos(){
  const p=runner.p;
  return {x:R3.x+(HP.x-R3.x)*p, y:R3.y+(HP.y+8-R3.y)*p};
}

function drawScene(){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#16273e');g.addColorStop(0.5,'#1d5233');g.addColorStop(1,'#227a46');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  // infield dirt near home
  ctx.fillStyle='rgba(150,95,55,0.5)';ctx.beginPath();ctx.ellipse(450,190,220,110,0,0,6.28);ctx.fill();
  // base path 3rd -> home
  ctx.strokeStyle='rgba(220,200,160,0.5)';ctx.lineWidth=10;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(R3.x,R3.y);ctx.lineTo(HP.x,HP.y+8);ctx.stroke();
  // third base
  ctx.save();ctx.translate(R3.x,R3.y);ctx.rotate(Math.PI/4);ctx.fillStyle='#f0f0f0';ctx.fillRect(-10,-10,20,20);ctx.restore();
  // home plate
  ctx.fillStyle='#f2f2f2';ctx.beginPath();
  ctx.moveTo(450,168);ctx.lineTo(432,158);ctx.lineTo(432,146);ctx.lineTo(468,146);ctx.lineTo(468,158);ctx.closePath();ctx.fill();
}

function drawPlayer(x,y,col,dark,sc){
  sc=sc||1;
  ctx.save();ctx.translate(x,y);ctx.scale(sc,sc);
  ctx.fillStyle='rgba(0,0,0,0.22)';ctx.beginPath();ctx.ellipse(0,16,12,4,0,0,6.28);ctx.fill();
  ctx.fillStyle=col; rr(-8,-6,16,22,6);ctx.fill();
  ctx.fillStyle='#f2c9a0';ctx.beginPath();ctx.arc(0,-14,7,0,6.28);ctx.fill();
  ctx.fillStyle=dark;ctx.beginPath();ctx.arc(0,-16,7.5,Math.PI,0);ctx.fill();
  ctx.restore();
}

function drawAim(){
  if(state!=='play')return;
  // perfect band at catcher
  ctx.fillStyle='rgba(126,240,176,0.22)';ctx.fillRect(HP.x-PERF,AIM_Y-40,PERF*2,52);
  ctx.strokeStyle='rgba(126,240,176,0.6)';ctx.lineWidth=2;ctx.strokeRect(HP.x-PERF,AIM_Y-40,PERF*2,52);
  // aim track
  ctx.strokeStyle='rgba(255,255,255,0.18)';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(AX0,AIM_Y);ctx.lineTo(AX1,AIM_Y);ctx.stroke();
  if(phase==='aim'){
    // sweeping marker
    ctx.strokeStyle='#ffe08a';ctx.lineWidth=3;
    ctx.beginPath();ctx.moveTo(aimX,AIM_Y-18);ctx.lineTo(aimX,AIM_Y+14);ctx.stroke();
    ctx.fillStyle='#ffe08a';ctx.beginPath();ctx.moveTo(aimX,AIM_Y-24);ctx.lineTo(aimX-7,AIM_Y-34);ctx.lineTo(aimX+7,AIM_Y-34);ctx.closePath();ctx.fill();
  }
}

function drawBall(){
  if(!ball)return;
  const x=ball.x+(ball.tx-ball.x)*ball.tp;
  const y=ball.y+(ball.ty-ball.y)*ball.tp - Math.sin(ball.tp*Math.PI)*10 + (ball.tp>0.5?Math.sin((ball.tp-0.5)*Math.PI*2)*6:0);
  trail.push({x,y}); if(trail.length>10)trail.shift();
  for(let i=0;i<trail.length;i++){const a=i/trail.length;ctx.globalAlpha=a*0.4;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(trail[i].x,trail[i].y,3+a*3,0,6.28);ctx.fill();}
  ctx.globalAlpha=1;
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(x,y,7,0,6.28);ctx.fill();
  ctx.strokeStyle='#c33';ctx.lineWidth=1.3;ctx.beginPath();ctx.arc(x,y,7,0.4,2.3);ctx.stroke();
}

function drawHUD(){
  ctx.textAlign='left';ctx.fillStyle='#fff';ctx.font='bold 26px sans-serif';ctx.fillText('SCORE '+score,20,36);
  ctx.textAlign='right';ctx.fillStyle='rgba(255,255,255,0.85)';ctx.font='14px sans-serif';ctx.fillText('補殺 '+outs+'  Lv.'+lvl,W-20,26);
  ctx.fillText('生還',W-92,50);
  for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(W-66+i*22,46,7,0,6.28);ctx.fillStyle=i<safes?'#ff5b5b':'rgba(255,255,255,0.25)';ctx.fill();}
  if(combo>=2){ctx.textAlign='left';ctx.fillStyle='#ffe08a';ctx.font='bold 18px sans-serif';ctx.fillText('コンボ x'+combo,20,60);}
  // runner urgency bar
  if(state==='play'){
    const bx=300,by=H-38,bw=300;
    ctx.fillStyle='rgba(0,0,0,0.3)';rr(bx,by,bw,10,5);ctx.fill();
    const rp=clamp(runner.p,0,1);
    ctx.fillStyle=rp>0.8?'#ff5b5b':(rp>0.55?'#ffb15b':'#8ff0b8');rr(bx,by,bw*rp,10,5);ctx.fill();
    ctx.fillStyle='rgba(255,255,255,0.6)';ctx.font='11px sans-serif';ctx.textAlign='center';ctx.fillText('走者',bx+bw+22,by+9);
  }
}

function render(){
  ctx.save();
  if(shake>0)ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
  drawScene();
  drawAim();
  // catcher at plate
  drawPlayer(HP.x, HP.y-2, '#22d3a6', '#12796a', 1.05);
  // runner
  const rp=runnerPos();
  drawPlayer(rp.x, rp.y, '#e2413a', '#8a1f1a', 1.0);
  // outfielder (you)
  drawPlayer(OFP.x, OFP.y, '#2b6cff', '#1a3a8a', 1.05);
  drawBall();

  for(const p of parts){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,3.2,0,6.28);ctx.fill();}
  ctx.globalAlpha=1;
  for(const p of pops){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.font='bold 22px sans-serif';ctx.textAlign='center';ctx.fillText(p.txt,p.x,p.y);}
  ctx.globalAlpha=1;

  drawHUD();

  if(state==='play'&&(msg||msg2)){
    ctx.textAlign='center';
    const good=result==='out'||result==='great'||(result===null);
    ctx.fillStyle=result?((result==='out')?'#8ff0b8':'#ff9a9a'):'rgba(255,255,255,0.92)';
    ctx.font='bold 28px sans-serif';ctx.fillText(msg,W/2,H-70);
    if(msg2){ctx.fillStyle='rgba(255,255,255,0.72)';ctx.font='16px sans-serif';ctx.fillText(msg2,W/2,H-46);}
  }

  if(state==='title'){
    ctx.fillStyle='rgba(6,10,18,0.64)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='bold 50px sans-serif';ctx.fillText('バックホーム',W/2,198);
    ctx.fillStyle='#8ff0b8';ctx.font='bold 22px sans-serif';ctx.fillText('Gun It Home',W/2,234);
    ctx.fillStyle='rgba(255,255,255,0.9)';ctx.font='18px sans-serif';
    ctx.fillText('左右にスイープする照準が捕手のグラブ（緑）に来た瞬間に送球',W/2,296);
    ctx.fillText('（クリック / タップ / SPACE）＝ワンバウンドで本塁へ補殺',W/2,324);
    ctx.fillStyle='rgba(255,255,255,0.66)';ctx.font='15px sans-serif';
    ctx.fillText('コースを外すと逸れる／モタつくと走者が生還。速く正確に投げろ',W/2,366);
    ctx.fillText('早く芯を通すほどレーザービームで大量加点。3生還で交代',W/2,390);
    ctx.fillStyle='#ffe08a';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で開始',W/2,448);
    ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='14px sans-serif';ctx.fillText('BEST '+best,W/2,480);
  }
  if(state==='over'){
    ctx.fillStyle='rgba(6,10,18,0.74)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#ff6b6b';ctx.font='bold 46px sans-serif';ctx.fillText('3生還…交代',W/2,230);
    ctx.fillStyle='#fff';ctx.font='bold 40px sans-serif';ctx.fillText('SCORE '+score,W/2,296);
    ctx.fillStyle='rgba(255,255,255,0.85)';ctx.font='20px sans-serif';ctx.fillText('補殺 '+outs+'   BEST '+best,W/2,336);
    ctx.fillStyle='#8ff0b8';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で もう一度',W/2,408);
  }

  if(flash>0.02){ctx.globalAlpha=flash*0.5;ctx.fillStyle=flashCol;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}
  ctx.restore();

  ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,0.4)';ctx.font='13px sans-serif';
  ctx.fillText('照準が捕手のグラブ（緑）に来た瞬間に送球。速く正確に。走者が生還する前に。3生還で交代',W/2,H-8);
}

function frame(ts){let dt=ts-last;last=ts;if(dt>60)dt=60;if(dt<0)dt=0;update(dt);render();requestAnimationFrame(frame);}
requestAnimationFrame(frame);

// ---------- test hook ----------
window.__gh={
  start, release,
  get state(){return state;},
  get score(){return score;},
  get outs(){return outs;},
  get safes(){return safes;},
  get info(){return {state,phase,t,aimX,plateX:HP.x,perf:PERF,ax0:AX0,ax1:AX1,
    deadline:P?P.deadline:0, throwDur:THROW_DUR, runnerP:runner.p, released:P?P.released:false,
    result,outs,safes,lvl};}
};
})();
</script>
</body>
</html>
