<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>進塁打 (Move Him Over)</title>
<style>
  html,body{margin:0;height:100%;background:#0a0c12;overflow:hidden;
    font-family:-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  #stage{position:relative;width:100vw;height:100vh;max-width:calc(100vh*1.5);max-height:calc(100vw/1.5);aspect-ratio:900/600;}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;border-radius:6px;}
</style>
</head>
<body>
<div id="wrap"><div id="stage"><canvas id="cv"></canvas></div></div>
<script>
(function(){
const W=900,H=600,cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let DPR=1;
function fit(){DPR=Math.min(2,window.devicePixelRatio||1);cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
fit();addEventListener('resize',fit);

// ---------- audio ----------
let AC=null;function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function tone(f,d,type,v,sweep){const a=ac();if(!a)return;const t=a.currentTime,o=a.createOscillator(),g=a.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(sweep)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+sweep),t+d);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v||0.2,t+0.008);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+0.02);}
function noise(d,v,hp){const a=ac();if(!a)return;const t=a.currentTime,n=Math.floor(a.sampleRate*d),buf=a.createBuffer(1,n,a.sampleRate),ch=buf.getChannelData(0);
  for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource();s.buffer=buf;
  const f=a.createBiquadFilter();f.type='highpass';f.frequency.value=hp||600;const g=a.createGain();g.gain.value=v||0.2;
  s.connect(f);f.connect(g);g.connect(a.destination);s.start(t);s.stop(t+d+0.02);}
const S={
  hit:()=>{noise(0.05,0.14,600);tone(300,0.05,'square',0.09,120);},
  adv:()=>{noise(0.05,0.12,500);[520,760,1010,1300].forEach((f,i)=>setTimeout(()=>tone(f,0.11,'triangle',0.17),i*54));},
  base:()=>{tone(500,0.08,'sine',0.09);tone(660,0.08,'sine',0.06);},
  bad:()=>{noise(0.16,0.22,320);tone(170,0.18,'sawtooth',0.12,-50);},
  streak:()=>{[700,930,1170,1400].forEach((f,i)=>setTimeout(()=>tone(f,0.1,'triangle',0.16),i*60));},
  over:()=>{[440,330,247,175].forEach((f,i)=>setTimeout(()=>tone(f,0.3,'triangle',0.2),i*160));}
};

// ---------- geometry ----------
const PLATE={x:452,y:474}, REL={x:452,y:120}, SECOND={x:452,y:214}, THIRD={x:206,y:352}, FIRSTB={x:698,y:352};

// ---------- state ----------
let state='title', phase='pitch', t=0, plays=0;
let score=0, combo=0, adv=0, fails=0, lvl=1;   // adv = runners advanced
let best=+(localStorage.getItem('moveover_best')||0);
let clock=0, arrivalT=740, sacW=88, edge=150;
let acted=false, result=null, resultT=0, msg='', animU=0;
let shake=0, flash=0, flashCol='#fff', last=performance.now();
let parts=[], pops=[];

function rnd(a,b){return a+Math.random()*(b-a);}
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function lerp(a,b,u){return a+(b-a)*u;}
function easeOut(u){return 1-Math.pow(1-u,2);}

function params(){ return {
  arr:Math.max(540,780-lvl*34),
  sacW:Math.max(62,94-lvl*4.4),
  edge:Math.max(120,180-lvl*9)
};}

function reset(){state='title';score=0;combo=0;adv=0;fails=0;lvl=1;plays=0;result=null;parts=[];pops=[];}
function newPlay(){
  plays++; lvl=Math.min(7,1+Math.floor(adv/4));
  const p=params(); arrivalT=p.arr; sacW=p.sacW; edge=p.edge;
  clock=0; acted=false; result=null; resultT=0; msg=''; animU=0; phase='pitch';
}
function start(){ if(!ac())ac(); if(AC&&AC.state==='suspended')AC.resume(); reset(); state='play'; newPlay(); }

function ballY(){ return lerp(REL.y,PLATE.y-14,easeOut(clamp(clock/arrivalT,0,1))); }

function swing(){
  if(state==='title'){start();return;}
  if(state==='over'){ if(resultT>0.4){reset();start();} return; }
  if(state!=='play'||phase!=='pitch'||acted) return;
  acted=true;
  const err=clock-arrivalT;   // + = let it travel (go with it), - = pulled
  if(err< -sacW*0.35){ resolve('pulled'); return; }          // swung too early -> pulled to the left
  if(err<=sacW*1.9){ resolve(Math.abs(err-sacW*0.8)<=sacW*0.5?'linedrive':'advance'); return; } // go-with-it band
  resolve('weak');                                            // too late -> weak/rolled over
}

function resolve(k){
  phase='result'; result=k; resultT=0; animU=0;
  const good=(k==='advance'||k==='linedrive');
  if(good){
    adv++; combo++;
    let add;
    if(k==='linedrive'){ add=Math.round(220*(1+Math.min(9,combo-1)*0.14)); S.adv();
      flash=1;flashCol='#8affa0';shake=8; burst(FIRSTB.x-60,PLATE.y-20,'#8affa0',20,7); pop(PLATE.x,PLATE.y-120,'会心の右打ち！ライナーで進塁 +'+add,'#d6ffe0'); pop(W/2,150,'ゴロで転がし走者を三塁へ！','#8affa0'); }
    else { add=Math.round(120*(1+Math.min(9,combo-1)*0.16)); S.base();
      flash=1;flashCol='#ffe08a';shake=5; burst(FIRSTB.x-70,PLATE.y-4,'#ffe08a',12,5); pop(PLATE.x,PLATE.y-120,'右へゴロ！走者三塁へ進塁 +'+add,'#fff3c4'); }
    score+=add;
    if(combo>=2&&k!=='linedrive')pop(W/2,150,'コンボ x'+combo,'#ffd24d');
    if(combo>0&&combo%5===0)S.streak();
    msg=k==='linedrive'?'完璧に呼び込んで右へ！走者を三塁へ進めた':'右方向へゴロ——走者を確実に三塁へ進めた';
  } else {
    fails++; combo=0; flash=1;flashCol='#ff5b5b';shake=8; S.bad();
    if(result==='pulled') msg='引っ張った…三遊間ゴロで走者は釘付け（進塁できず）';
    else if(result==='weak') msg='呼び込み過ぎ…詰まった当たりで走者を進められず';
    else msg='空振り…走者を進める打撃ができなかった';
    pop(PLATE.x,PLATE.y-120,result==='pulled'?'引っ張り！':(result==='weak'?'詰まり…':'空振り'),'#ffb0b0');
  }
  if(fails>=3){ state='over'; resultT=0; S.over(); if(score>best){best=score;localStorage.setItem('moveover_best',best);} }
}

// ---------- input ----------
cv.addEventListener('pointerdown',e=>{e.preventDefault();swing();});
addEventListener('keydown',e=>{ if(e.repeat)return; if(e.code==='Space'||e.code==='Enter'||e.code==='ArrowUp'||e.code==='KeyZ'){e.preventDefault();swing();} });

// ---------- particles ----------
function burst(x,y,c,n,sp){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=rnd(sp*0.3,sp);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:1,c});}}
function pop(x,y,txt,c){pops.push({x,y,txt,c,life:1});}

// ---------- update ----------
function update(dt){
  shake*=Math.pow(0.86,dt/16.7); if(shake<0.3)shake=0;
  flash*=Math.pow(0.9,dt/16.7);
  for(const p of parts){p.vx*=0.96;p.vy=p.vy*0.96+0.28;p.x+=p.vx*dt/16.7;p.y+=p.vy*dt/16.7;p.life-=dt/16.7*0.026;}
  parts=parts.filter(p=>p.life>0);
  for(const p of pops){p.y-=dt/16.7*0.5;p.life-=dt/16.7*0.02;}
  pops=pops.filter(p=>p.life>0);

  if(state!=='play'){ if(state==='over')resultT+=dt/1000; return; }
  t+=dt;
  if(phase==='pitch'){ clock+=dt; if(!acted && clock>arrivalT+edge+sacW){ acted=true; resolve('weak'); } return; }
  if(phase==='result'){ resultT+=dt/1000; animU=Math.min(1,animU+dt/850); if(resultT>1.25 && state==='play') newPlay(); return; }
}

// ---------- render ----------
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function figure(x,y,col,sc){ sc=sc||1;
  ctx.fillStyle='rgba(0,0,0,0.22)';ctx.beginPath();ctx.ellipse(x,y+13*sc,12*sc,4*sc,0,0,6.28);ctx.fill();
  ctx.fillStyle=col;rr(x-7*sc,y-22*sc,14*sc,24*sc,6*sc);ctx.fill();
  ctx.fillStyle='#f2c9a0';ctx.beginPath();ctx.arc(x,y-27*sc,6*sc,0,6.28);ctx.fill();
}
function baseM(x,y,r){ ctx.save();ctx.translate(x,y);ctx.rotate(0.785);ctx.fillStyle='#eef0f2';ctx.fillRect(-r,-r,r*2,r*2);ctx.restore(); }
function drawScene(){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#1b2740');g.addColorStop(0.5,'#22406b');g.addColorStop(1,'#2c7a3b');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#7a5230';ctx.beginPath();ctx.moveTo(PLATE.x,PLATE.y+6);ctx.lineTo(FIRSTB.x+30,FIRSTB.y);ctx.lineTo(SECOND.x,SECOND.y-40);ctx.lineTo(THIRD.x-30,THIRD.y);ctx.closePath();ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,0.4)';ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(PLATE.x,PLATE.y);ctx.lineTo(FIRSTB.x,FIRSTB.y);ctx.lineTo(SECOND.x,SECOND.y);ctx.lineTo(THIRD.x,THIRD.y);ctx.closePath();ctx.stroke();
  baseM(FIRSTB.x,FIRSTB.y,11); baseM(SECOND.x,SECOND.y,11); baseM(THIRD.x,THIRD.y,11);
  ctx.fillStyle='#eef0f2';ctx.beginPath();ctx.moveTo(PLATE.x-12,PLATE.y-6);ctx.lineTo(PLATE.x+12,PLATE.y-6);ctx.lineTo(PLATE.x+12,PLATE.y+3);ctx.lineTo(PLATE.x,PLATE.y+10);ctx.lineTo(PLATE.x-12,PLATE.y+3);ctx.closePath();ctx.fill();
  // side hints
  ctx.textAlign='center';ctx.font='bold 13px sans-serif';
  ctx.fillStyle='rgba(255,120,120,0.5)';ctx.fillText('引っ張り＝三遊間（進めない）',THIRD.x+30,THIRD.y-24);
  ctx.fillStyle='rgba(140,255,160,0.55)';ctx.fillText('右打ち＝一二塁間（進塁）',FIRSTB.x-40,FIRSTB.y-24);
}

function render(){
  ctx.save();
  if(shake>0)ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
  drawScene();

  if(state==='play'){
    // runner on second -> to third on success
    let ru=0;
    if(phase==='result'&&(result==='advance'||result==='linedrive')) ru=clamp(animU,0,1);
    const rx=lerp(SECOND.x,THIRD.x,easeOut(ru)), ry=lerp(SECOND.y,THIRD.y,easeOut(ru));
    figure(rx,ry,'#ff8a3a',0.9);
    // batter + pitcher
    figure(PLATE.x+92,PLATE.y-14,'#2b6cff',0.95);
    ctx.fillStyle='#d24b4b';rr(REL.x-10,REL.y-13,20,26,6);ctx.fill();
    ctx.fillStyle='#f2c9a0';ctx.beginPath();ctx.arc(REL.x,REL.y-17,6.5,0,6.28);ctx.fill();

    if(phase==='pitch'){
      const by=ballY();
      ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(PLATE.x,by,7,0,6.28);ctx.fill();
      // "go with it" timing ring — turns green in the late band (at/after arrival)
      const inBand = clock>=arrivalT-sacW*0.35 && clock<=arrivalT+sacW*1.9;
      const rem=clamp(1-clock/(arrivalT+sacW*0.8),0,1);
      ctx.strokeStyle=inBand?'rgba(140,255,160,0.95)':'rgba(255,255,255,0.5)';ctx.lineWidth=4;
      ctx.beginPath();ctx.arc(PLATE.x,PLATE.y-14,15+rem*40,0,6.28);ctx.stroke();
      if(clock>arrivalT*0.55){ ctx.fillStyle='rgba(140,255,160,0.9)';ctx.font='bold 13px sans-serif';ctx.textAlign='center';ctx.fillText('呼び込め（引っ張るな）',PLATE.x,PLATE.y-64); }
    } else if(phase==='result'){
      let bx=PLATE.x, by=PLATE.y-10;
      if(result==='advance'||result==='linedrive'){ bx=lerp(PLATE.x,FIRSTB.x-40,easeOut(animU)); by=lerp(PLATE.y-10,FIRSTB.y+10,easeOut(animU)) - (result==='linedrive'?Math.sin(animU*3.14)*40:0); }
      else if(result==='pulled'){ bx=lerp(PLATE.x,THIRD.x+40,easeOut(animU)); by=lerp(PLATE.y-10,THIRD.y+10,easeOut(animU)); }
      else if(result==='weak'){ bx=lerp(PLATE.x,PLATE.x+30,easeOut(animU)); by=PLATE.y-6; }
      if(result!=='whiff'){ ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(bx,by,7,0,6.28);ctx.fill(); }
    }
  }

  for(const p of parts){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,3.2,0,6.28);ctx.fill();}
  ctx.globalAlpha=1;
  for(const p of pops){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.font='bold 21px sans-serif';ctx.textAlign='center';ctx.fillText(p.txt,p.x,p.y);}
  ctx.globalAlpha=1;

  // HUD
  ctx.textAlign='left';ctx.fillStyle='#fff';ctx.font='bold 26px sans-serif';ctx.fillText('SCORE '+score,20,36);
  ctx.textAlign='right';ctx.fillStyle='rgba(255,255,255,0.9)';ctx.font='14px sans-serif';ctx.fillText('進塁 '+adv+'  Lv'+lvl,W-20,24);
  ctx.fillText('失敗',W-92,46);
  for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(W-60+i*20,41,7,0,6.28);ctx.fillStyle=i<fails?'#ff5b5b':'rgba(255,255,255,0.25)';ctx.fill();}
  if(combo>=2){ctx.textAlign='center';ctx.fillStyle='#ffd24d';ctx.font='bold 18px sans-serif';ctx.fillText('コンボ x'+combo,W/2,110);}

  if(state==='play'&&phase==='pitch'){ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,0.92)';ctx.font='bold 15px sans-serif';
    ctx.fillText('二塁走者を三塁へ！ 引っ張らず“呼び込んで”右方向へゴロを転がせ（緑リングでスイング）',W/2,42);}
  if(state==='play'&&phase==='result'&&msg){ctx.textAlign='center';ctx.fillStyle=(result==='advance'||result==='linedrive')?'#9ff0b8':'#ff9a9a';ctx.font='bold 19px sans-serif';ctx.fillText(msg,W/2,42);}

  if(state==='title'){
    ctx.fillStyle='rgba(6,9,14,0.78)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='bold 44px sans-serif';ctx.fillText('進塁打',W/2,102);
    ctx.fillStyle='#ffd23e';ctx.font='bold 22px sans-serif';ctx.fillText('Move Him Over',W/2,138);
    ctx.fillStyle='rgba(255,255,255,0.92)';ctx.font='16px sans-serif';
    ctx.fillText('二塁走者・無死——“右方向への進塁打”で走者を三塁へ送る小技の打撃だ',W/2,186);
    ctx.fillStyle='rgba(255,255,255,0.66)';ctx.font='14px sans-serif';
    ctx.fillText('コツは“呼び込む”＝ボールを引きつけて逆らわず右（一二塁間）へゴロを転がすこと',W/2,224);
    ctx.fillText('緑リング（ボールを呼び込んだ“遅らせ”のタイミング）でスイング＝右へゴロ＝走者三塁へ進塁',W/2,248);
    ctx.fillText('早く振ると“引っ張って”三遊間ゴロ＝走者は釘付け（進めず）、呼び込み過ぎると詰まって失敗',W/2,272);
    ctx.fillText('ど真ん中で呼び込めば会心の右打ちライナー＝大量得点。上級ほど球が速く猶予が短い',W/2,294);
    ctx.fillText('引っ張り／詰まり／空振り＝失敗。3失敗で交代',W/2,316);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で開始',W/2,382);
    ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='14px sans-serif';ctx.fillText('BEST '+best,W/2,414);
  }
  if(state==='over'){
    ctx.fillStyle='rgba(6,9,14,0.84)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#ff6b6b';ctx.font='bold 46px sans-serif';ctx.fillText('3失敗…交代',W/2,222);
    ctx.fillStyle='#fff';ctx.font='bold 40px sans-serif';ctx.fillText('SCORE '+score,W/2,290);
    ctx.fillStyle='rgba(255,255,255,0.85)';ctx.font='19px sans-serif';ctx.fillText('進塁 '+adv+'   BEST '+best,W/2,330);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で もう一度',W/2,402);
  }

  if(flash>0.02){ctx.globalAlpha=flash*0.5;ctx.fillStyle=flashCol;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}
  ctx.restore();

  ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,0.4)';ctx.font='12px sans-serif';
  ctx.fillText('進塁打：引っ張らず呼び込んで右へゴロを転がし二塁走者を三塁へ。早い＝引っ張り・遅い＝詰まりで失敗。3失敗で交代',W/2,H-8);
}

function frame(ts){let dt=ts-last;last=ts;if(dt>60)dt=60;if(dt<0)dt=0;update(dt);render();requestAnimationFrame(frame);}
requestAnimationFrame(frame);

// ---------- test hook ----------
window.__adv={
  start, swing:()=>swing(),
  get state(){return state;},
  get score(){return score;},
  get adv(){return adv;},
  get fails(){return fails;},
  get info(){return {state,phase,clock,arrivalT,sacW,edge,acted,result,adv,fails,lvl,
    canSwing:(phase==='pitch'&&!acted)};}
};
})();
</script>
</body>
</html>
