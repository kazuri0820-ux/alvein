<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>GKをかわして流し込め (Round the Keeper)</title>
<style>
  html,body{margin:0;height:100%;background:#07120b;overflow:hidden;
    font-family:-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  #stage{position:relative;width:100vw;height:100vh;max-width:calc(100vh*1.5);max-height:calc(100vw/1.5);aspect-ratio:900/600;}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;border-radius:6px;}
</style>
</head>
<body>
<div id="wrap"><div id="stage"><canvas id="cv"></canvas></div></div>
<script>
(function(){
const W=900,H=600,cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let DPR=1;
function fit(){DPR=Math.min(2,window.devicePixelRatio||1);cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
fit();addEventListener('resize',fit);

// ---------- audio ----------
let AC=null;function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function tone(f,d,type,v,sweep){const a=ac();if(!a)return;const t=a.currentTime,o=a.createOscillator(),g=a.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(sweep)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+sweep),t+d);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v||0.2,t+0.008);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+0.02);}
function noise(d,v,hp){const a=ac();if(!a)return;const t=a.currentTime,n=Math.floor(a.sampleRate*d),buf=a.createBuffer(1,n,a.sampleRate),ch=buf.getChannelData(0);
  for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource();s.buffer=buf;
  const f=a.createBiquadFilter();f.type='highpass';f.frequency.value=hp||600;const g=a.createGain();g.gain.value=v||0.2;
  s.connect(f);f.connect(g);g.connect(a.destination);s.start(t);s.stop(t+d+0.02);}
const S={
  press:()=>{tone(220,0.05,'sine',0.03);},
  touch:()=>{noise(0.05,0.14,800);tone(480,0.06,'triangle',0.08,180);},
  net:()=>{[620,860,1120].forEach((f,i)=>setTimeout(()=>tone(f,0.11,'triangle',0.16),i*58));},
  big:()=>{[600,800,1000,1250].forEach((f,i)=>setTimeout(()=>tone(f,0.12,'triangle',0.17),i*80));},
  lost:()=>{noise(0.18,0.2,300);tone(160,0.2,'sawtooth',0.12,-40);},
  streak:()=>{[700,930,1170,1400].forEach((f,i)=>setTimeout(()=>tone(f,0.1,'triangle',0.16),i*60));},
  over:()=>{[440,330,247,175].forEach((f,i)=>setTimeout(()=>tone(f,0.3,'triangle',0.2),i*160));}
};

// ---------- geometry ----------
const GOAL={x0:372,x1:528,y:112};          // goal mouth at the top
const GK_FAR={x:450,y:170}, GK_NEAR={x:450,y:372};  // keeper charges out (up->down toward you)
const YOU={x:450,y:456};                    // you, carrying the ball up
const FEET={x:450,y:428};                   // ball at your feet
const NET={x:414,y:120};                    // where the rounded ball rolls into the open net

// ---------- state ----------
let state='title', phase='carry', plays=0;
let score=0, combo=0, best=+(localStorage.getItem('rk_best')||0);
let outs=0, fails=0, lvl=1;   // outs = goals scored by rounding the keeper
let clock=0, smotherT=1100, win=290, tough=false;
let pushed=false, relT=0, result=null, resultT=0, msg='', msgOk=false, quality=0, flyT=0;
let side=1;                    // which way the ball is rolled around the keeper (-1 left / +1 right)
let shake=0, flash=0, flashCol='#fff', last=performance.now();
let parts=[], pops=[];

function rnd(a,b){return a+Math.random()*(b-a);}
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function lerp(a,b,u){return a+(b-a)*u;}
function easeOut(u){return 1-Math.pow(1-u,2);}

function reset(){state='title';score=0;combo=0;outs=0;fails=0;lvl=1;plays=0;result=null;parts=[];pops=[];}
function winStart(){return smotherT-win;}

function newPlay(){
  plays++; lvl=Math.min(7,1+Math.floor(outs/4));
  smotherT=clamp(1160-lvl*58,720,1160);
  win=clamp(300-lvl*18,160,300);
  tough=Math.random()<clamp(0.2+lvl*0.05,0.2,0.5);
  if(tough)win*=0.8;
  side=Math.random()<0.5?-1:1;
  phase='carry'; clock=0; pushed=false; relT=0; result=null; resultT=0; msg=''; msgOk=false; quality=0; flyT=0;
  S.press();
}
function start(){ if(!ac())ac(); if(AC&&AC.state==='suspended')AC.resume(); reset(); state='play'; newPlay(); }

function push(){
  if(state==='title'){start();return;}
  if(state==='over'){ if(resultT>0.4){reset();start();} return; }
  if(state!=='play'||phase!=='carry'||pushed) return;
  pushed=true; relT=clock;
  if(clock<winStart()){ resolve('blocked'); }
  else { quality=clamp((clock-winStart())/win,0,1); resolve('rounded'); }
}

function resolve(k){
  phase='result'; result=k; resultT=0; flyT=0;
  if(k==='rounded'){
    outs++; combo++;
    const perfect=quality>=0.82;
    let add=Math.round((60+Math.round(quality*140)+(tough?80:0))*(1+Math.min(9,combo-1)*0.14)); score+=add;
    S.touch(); setTimeout(S.net,300); if(perfect||tough)setTimeout(S.big,380);
    msgOk=true; flash=1;flashCol='#8affa0';shake=4;
    pop(W/2,186,(perfect?'GKを完全に外して無人のゴールへ！ +':'GKをかわして流し込んだ！ +')+add,'#d6ffe0');
    if(combo>=2)pop(W/2,150,'コンボ x'+combo,'#ffd24d');
    if(combo>0&&combo%5===0)S.streak();
    msg=perfect?'ギリギリまで引きつけGKを完全に食いつかせ、横へ流し込んだ——冷静な決定機':'飛び出したGKを引きつけてから、横へかわして無人のゴールへ';
  } else {
    fails++; combo=0; msgOk=false; flash=1;shake=8; S.lost();
    if(k==='blocked'){ flashCol='#ff5b5b'; msg='早い…まだ食いついていない。正面で構えたGKにブロックされた'; pop(W/2,186,'ブロック…','#ffb0b0'); }
    else { flashCol='#ff8b3b'; msg='遅い…引っ張り過ぎ。飛び込んできたGKに足元でボールを抑えられた'; pop(W/2,186,'抑えられた…','#ffcf9a'); }
  }
  if(fails>=3){ state='over'; resultT=0; S.over(); if(score>best){best=score;localStorage.setItem('rk_best',best);} }
}

// ---------- input ----------
cv.addEventListener('pointerdown',e=>{e.preventDefault();push();});
addEventListener('keydown',e=>{ if(e.repeat)return;
  if(e.code==='Space'||e.code==='Enter'||e.code==='ArrowUp'||e.code==='KeyF'||e.code==='KeyJ'){e.preventDefault();push();} });

// ---------- particles ----------
function burst(x,y,c,n,sp){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=rnd(sp*0.3,sp);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:1,c});}}
function pop(x,y,txt,c){pops.push({x,y,txt,c,life:1});}

function gkY(){ const pr=clamp((phase==='carry'?clock:relT)/smotherT,0,1); return lerp(GK_FAR.y,GK_NEAR.y,pr); }

// ---------- update ----------
function update(dt){
  shake*=Math.pow(0.86,dt/16.7); if(shake<0.3)shake=0;
  flash*=Math.pow(0.9,dt/16.7);
  for(const q of parts){q.vx*=0.96;q.vy=q.vy*0.96+0.28;q.x+=q.vx*dt/16.7;q.y+=q.vy*dt/16.7;q.life-=dt/16.7*0.026;}
  parts=parts.filter(q=>q.life>0);
  for(const q of pops){q.y-=dt/16.7*0.5;q.life-=dt/16.7*0.02;}
  pops=pops.filter(q=>q.life>0);

  if(state!=='play'){ if(state==='over')resultT+=dt/1000; return; }
  if(phase==='carry'){ clock+=dt;
    if(!pushed && clock>=smotherT){ pushed=true; relT=smotherT; resolve('smothered'); }
    return; }
  if(phase==='result'){ resultT+=dt/1000; flyT=Math.min(1,flyT+dt/460);
    if(flyT>=1&&result==='rounded'&&parts.length<2)burst(NET.x,NET.y,'#8affa0',12,6);
    if(resultT>1.6) newPlay(); return; }
}

// ---------- render ----------
function drawField(){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#12703f');g.addColorStop(0.5,'#0f5e34');g.addColorStop(1,'#0c4c2b');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  for(let i=0;i<8;i++){ctx.fillStyle=i%2?'rgba(255,255,255,0.03)':'rgba(0,0,0,0.03)';ctx.fillRect(0,i*80,W,80);}
  // penalty box + 6yd box (toward the top goal)
  ctx.strokeStyle='rgba(255,255,255,0.22)';ctx.lineWidth=2;ctx.strokeRect(250,112,400,210);
  ctx.strokeRect(360,112,180,86);
  // penalty spot
  ctx.fillStyle='rgba(255,255,255,0.4)';ctx.beginPath();ctx.arc(450,270,3,0,6.28);ctx.fill();
  // goal: net mesh above the mouth line
  ctx.fillStyle='rgba(255,255,255,0.08)';ctx.fillRect(GOAL.x0,58,GOAL.x1-GOAL.x0,GOAL.y-58);
  ctx.strokeStyle='rgba(255,255,255,0.35)';ctx.lineWidth=1;
  for(let x=GOAL.x0;x<=GOAL.x1;x+=13){ctx.beginPath();ctx.moveTo(x,58);ctx.lineTo(x,GOAL.y);ctx.stroke();}
  for(let y=58;y<=GOAL.y;y+=12){ctx.beginPath();ctx.moveTo(GOAL.x0,y);ctx.lineTo(GOAL.x1,y);ctx.stroke();}
  // posts + crossbar
  ctx.strokeStyle='#f4f4f4';ctx.lineWidth=5;
  ctx.beginPath();ctx.moveTo(GOAL.x0,GOAL.y);ctx.lineTo(GOAL.x1,GOAL.y);ctx.stroke();
  ctx.beginPath();ctx.moveTo(GOAL.x0,58);ctx.lineTo(GOAL.x0,GOAL.y);ctx.moveTo(GOAL.x1,58);ctx.lineTo(GOAL.x1,GOAL.y);ctx.stroke();
}
function person(x,y,col,s){s=s||1;
  ctx.fillStyle=col;ctx.beginPath();ctx.ellipse(x,y-15*s,10*s,15*s,0,0,6.28);ctx.fill();
  ctx.fillStyle='#f0c9a0';ctx.beginPath();ctx.arc(x,y-34*s,7.5*s,0,6.28);ctx.fill();
}
function keeper(x,y,dive,s){s=s||1;
  // dive: -1..1 lateral sprawl amount when beaten
  if(dive){ ctx.save();ctx.translate(x,y);ctx.rotate(0.9*side);
    ctx.fillStyle='#ffd23e';ctx.beginPath();ctx.ellipse(0,-12*s,10*s,16*s,0,0,6.28);ctx.fill();
    ctx.fillStyle='#f0c9a0';ctx.beginPath();ctx.arc(0,-30*s,7*s,0,6.28);ctx.fill();
    ctx.restore(); return; }
  ctx.fillStyle='#ffd23e';ctx.beginPath();ctx.ellipse(x,y-15*s,11*s,15*s,0,0,6.28);ctx.fill();
  ctx.fillStyle='#f0c9a0';ctx.beginPath();ctx.arc(x,y-34*s,7.5*s,0,6.28);ctx.fill();
  // arms spread
  ctx.strokeStyle='#ffd23e';ctx.lineWidth=4*s;ctx.beginPath();
  ctx.moveTo(x-14*s,y-20*s);ctx.lineTo(x,y-24*s);ctx.lineTo(x+14*s,y-20*s);ctx.stroke();
}

function render(){
  ctx.save();
  if(shake>0)ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
  drawField();

  if(state==='play'||state==='over'){
    const gy=gkY();
    const beaten=(phase==='result'&&result==='rounded');
    const gx=beaten?GK_NEAR.x+side*10:GK_FAR.x;
    // keeper: charging out, or beaten/sprawling on a rounded finish
    keeper(gx, beaten?gy+8:gy, beaten, 0.98);

    // you: carry the ball up; drift to the side on a successful round
    let yx=YOU.x, yy=YOU.y;
    if(phase==='result'&&result==='rounded'){ const u=easeOut(flyT); yx=lerp(YOU.x,YOU.x+side*40,u); yy=lerp(YOU.y,yy-30,u); }
    person(yx,yy,'#2b6fd6',0.98);

    // ball
    let bx=FEET.x,by=FEET.y;
    if(phase==='carry'){ bx=FEET.x; by=FEET.y; }
    else {
      const u=easeOut(flyT);
      if(result==='rounded'){ const mx=FEET.x+side*70; bx=lerp(FEET.x,NET.x,u)+Math.sin(u*Math.PI)*side*40; by=lerp(FEET.y,NET.y,u); }
      else if(result==='blocked'){ bx=lerp(FEET.x,GK_FAR.x,u); by=lerp(FEET.y,gy,u); }
      else { bx=lerp(FEET.x,FEET.x,u); by=lerp(FEET.y,gy+6,u); }  // smothered: keeper reaches feet
    }
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(bx,by,8,0,6.28);ctx.fill();
    ctx.strokeStyle='#222';ctx.lineWidth=1.2;ctx.beginPath();ctx.arc(bx,by,8,0.4,2.2);ctx.stroke();

    // reward-lateness pressure bar
    ctx.textAlign='center';
    if(state==='play'&&phase==='carry'){
      ctx.fillStyle='rgba(255,220,90,0.96)';ctx.font='bold 21px sans-serif';ctx.fillText('GKを引きつけろ！ ギリギリでかわすほど無人のゴール',W/2,50);
      const bw=300,x=W/2-bw/2,y=66;
      ctx.fillStyle='rgba(255,255,255,0.15)';ctx.fillRect(x,y,bw,9);
      const gx0=x+bw*clamp(winStart()/smotherT,0,1);
      const grad=ctx.createLinearGradient(gx0,0,x+bw,0);grad.addColorStop(0,'rgba(90,240,130,0.35)');grad.addColorStop(1,'rgba(120,255,150,0.8)');
      ctx.fillStyle=grad;ctx.fillRect(gx0,y,(x+bw)-gx0,9);
      ctx.fillStyle='#ff5b5b';ctx.fillRect(x+bw-2,y-3,3,15);
      ctx.fillStyle='rgba(255,120,110,0.9)';ctx.font='11px sans-serif';ctx.fillText('GKが抑える',x+bw,y+24);
      const px=x+bw*clamp(clock/smotherT,0,1);
      ctx.fillStyle='#ffe14d';ctx.fillRect(px-2,y-4,4,17);
      ctx.fillStyle='rgba(255,255,255,0.55)';ctx.font='12px sans-serif';ctx.fillText('タップ / SPACE ＝ 横へかわす（早いと正面ブロック・粘り過ぎると抑えられる）',W/2,H-30);
    }
  }

  for(const q of parts){ctx.globalAlpha=Math.max(0,q.life);ctx.fillStyle=q.c;ctx.beginPath();ctx.arc(q.x,q.y,3.2,0,6.28);ctx.fill();}
  ctx.globalAlpha=1;
  for(const q of pops){ctx.globalAlpha=Math.max(0,q.life);ctx.fillStyle=q.c;ctx.font='bold 21px sans-serif';ctx.textAlign='center';ctx.fillText(q.txt,q.x,q.y);}
  ctx.globalAlpha=1;

  // HUD
  ctx.textAlign='left';ctx.fillStyle='#fff';ctx.font='bold 26px sans-serif';ctx.fillText('SCORE '+score,20,36);
  ctx.textAlign='right';ctx.fillStyle='rgba(255,255,255,0.9)';ctx.font='14px sans-serif';ctx.fillText('ゴール '+outs+'  Lv'+lvl,W-20,24);
  ctx.fillText('ロスト',W-98,46);
  for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(W-60+i*20,41,7,0,6.28);ctx.fillStyle=i<fails?'#ff5b5b':'rgba(255,255,255,0.25)';ctx.fill();}
  if(combo>=2){ctx.textAlign='center';ctx.fillStyle='#ffd24d';ctx.font='bold 18px sans-serif';ctx.fillText('コンボ x'+combo,W/2,112);}

  if(state==='play'&&phase==='result'&&msg){ctx.textAlign='center';ctx.fillStyle=msgOk?'#9ff0b8':'#ffb38a';ctx.font='bold 16px sans-serif';ctx.fillText(msg,W/2,472);}

  if(state==='title'){
    ctx.fillStyle='rgba(4,10,7,0.83)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='bold 38px sans-serif';ctx.fillText('GKをかわして流し込め',W/2,84);
    ctx.fillStyle='#ffd23e';ctx.font='bold 22px sans-serif';ctx.fillText('Round the Keeper',W/2,120);
    ctx.fillStyle='rgba(255,255,255,0.92)';ctx.font='16px sans-serif';
    ctx.fillText('抜け出して1対1。飛び出すGKを“引きつけて”から横へかわし、無人のゴールへ流し込む。待つほど決定機',W/2,180);
    ctx.fillStyle='rgba(255,255,255,0.66)';ctx.font='14px sans-serif';
    ctx.fillText('GKが正面へ飛び出してくる→引きつけて“抑えられる”直前の緑窓でタップ/SPACE＝横へかわす',W/2,218);
    ctx.fillText('早く出すと、まだ構えているGKに正面でブロックされる／粘り過ぎると足元でボールを抑えられる',W/2,242);
    ctx.fillText('抑えられる寸前ギリギリで外すほどGKが食いついて無人＝高得点。上級ほど飛び出しが速く窓が短い',W/2,266);
    ctx.fillText('3ロストで交代',W/2,290);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で開始',W/2,356);
    ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='14px sans-serif';ctx.fillText('BEST '+best,W/2,388);
  }
  if(state==='over'){
    ctx.fillStyle='rgba(4,10,7,0.85)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#ff6b6b';ctx.font='bold 46px sans-serif';ctx.fillText('3ロスト…交代',W/2,222);
    ctx.fillStyle='#fff';ctx.font='bold 40px sans-serif';ctx.fillText('SCORE '+score,W/2,290);
    ctx.fillStyle='rgba(255,255,255,0.85)';ctx.font='19px sans-serif';ctx.fillText('ゴール '+outs+'   BEST '+best,W/2,330);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で もう一度',W/2,402);
  }

  if(flash>0.02){ctx.globalAlpha=flash*0.5;ctx.fillStyle=flashCol;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}
  ctx.restore();

  ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,0.4)';ctx.font='12px sans-serif';
  ctx.fillText('GKをかわして流し込め：飛び出すGKを引きつけ、抑えられる直前ギリギリで横へかわして無人のゴールへ。早い＝正面ブロック/粘り過ぎ＝抑えられる、3ロストで交代',W/2,H-8);
}

function frame(ts){let dt=ts-last;last=ts;if(dt>60)dt=60;if(dt<0)dt=0;update(dt);render();requestAnimationFrame(frame);}
requestAnimationFrame(frame);

// ---------- test hook ----------
window.__rk={
  start, push,
  get state(){return state;},
  get score(){return score;},
  get outs(){return outs;},
  get fails(){return fails;},
  get info(){return {state,phase,clock,smotherT,win,winStart:winStart(),tough,pushed,relT,result,outs,fails,lvl,side,
    inWindow:(phase==='carry'&&clock>=winStart()&&clock<=smotherT)};}
};
})();
</script>
</body>
</html>
