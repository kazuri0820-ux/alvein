<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>プレス回避 (Break the Press)</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;background:#08120c;overflow:hidden;font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",system-ui,sans-serif}
  #wrap{width:100%;height:100%;display:flex;align-items:center;justify-content:center}
  #stage{position:relative;width:min(100vw,calc(100vh*1.5));aspect-ratio:900/600;max-width:900px;
    box-shadow:0 10px 60px rgba(0,0,0,.6);border-radius:10px;overflow:hidden;touch-action:none}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
  #hint{position:absolute;left:0;bottom:6px;width:100%;text-align:center;color:#cfe;
    font-size:12px;opacity:.55;pointer-events:none;text-shadow:0 1px 3px #000}
</style>
</head>
<body>
<div id="wrap"><div id="stage">
  <canvas id="cv"></canvas>
  <div id="hint">空いてる味方へパス（タップ / クリック）。相手が乗った/囮のレーンは危険。奪われる前に速く！（キー: ←/↑/→ ・1/2/3）</div>
</div></div>
<script>
(()=>{
const cv=document.getElementById('cv'), g=cv.getContext('2d');
const W=900,H=600;
let DPR=1;
function fit(){ DPR=Math.min(2,window.devicePixelRatio||1); cv.width=W*DPR; cv.height=H*DPR; g.setTransform(DPR,0,0,DPR,0,0); }
fit(); addEventListener('resize',fit);

// ---------- audio ----------
let AC=null;
function ac(){ if(!AC){ try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){} } return AC; }
function tone(f,d,t,v,sweep){ const a=ac(); if(!a)return; const o=a.createOscillator(),gg=a.createGain();
  o.type=t||'sine'; o.frequency.value=f; if(sweep) o.frequency.exponentialRampToValueAtTime(Math.max(20,sweep),a.currentTime+d);
  gg.gain.setValueAtTime(0.0001,a.currentTime); gg.gain.exponentialRampToValueAtTime(v||0.2,a.currentTime+0.012);
  gg.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+d); o.connect(gg).connect(a.destination);
  o.start(); o.stop(a.currentTime+d+0.02); }
function noise(d,v,hp){ const a=ac(); if(!a)return; const n=a.createBuffer(1,a.sampleRate*d,a.sampleRate); const ch=n.getChannelData(0);
  for(let i=0;i<ch.length;i++) ch[i]=(Math.random()*2-1)*(1-i/ch.length);
  const s=a.createBufferSource(); s.buffer=n; const f=a.createBiquadFilter(); f.type='highpass'; f.frequency.value=hp||600;
  const gg=a.createGain(); gg.gain.value=v||0.15; s.connect(f).connect(gg).connect(a.destination); s.start(); }
const S={
  pass(){ tone(440,0.06,'triangle',0.09,560); noise(0.03,0.05,900); },
  recv(){ tone(300,0.05,'sine',0.06,220); },
  brk(){ tone(520,0.1,'triangle',0.14,780); setTimeout(()=>tone(780,0.12,'triangle',0.12,1040),90); setTimeout(()=>tone(1040,0.14,'triangle',0.1,1320),190); noise(0.35,0.1,400); },
  steal(){ noise(0.14,0.2,500); tone(240,0.14,'sawtooth',0.13,90); },
  tackle(){ noise(0.1,0.22,300); tone(160,0.16,'square',0.14,70); },
  over(){ tone(300,0.5,'sawtooth',0.16,90); setTimeout(()=>tone(200,0.6,'sawtooth',0.14,60),160); },
};

// ---------- state ----------
const TARGETY=118, STARTY=520;
let state='title';
let parts=[], pops=[];
let score, combo, best, lvl, turnovers, breaks, passes;
let phase='decide', carrier={x:450,y:STARTY}, options=[], pressers=[], chaser=null;
let pressT=0, pressMax=1600;
let ball={x:450,y:STARTY}, passFrom=null, passTo=null, passT=0, passDur=260, chosen=-1;
let flash=0, shakeT=0, resT=0, pend=null, pendDelay=0;
let tPulse=0;
try{ best=+localStorage.getItem('bp_best')||0; }catch(e){ best=0; }

const crowd=[]; { const cc=['#e6b48f','#9bd0e6','#e6dc8f','#c9a0d8','#8fd8bd','#f0f0f0']; for(let i=0;i<180;i++) crowd.push({x:(i*33.1)%W, y:2+((i*61)%40), c:cc[i%cc.length]}); }
function clamp(v,a,b){ return v<a?a:v>b?b:v; }
function rnd(a,b){ return a+Math.random()*(b-a); }
function chance(p){ return Math.random()<p; }

function reset(){ parts=[]; pops=[]; score=0; combo=0; lvl=0; turnovers=0; breaks=0; passes=0; newPossession(); }
function newPossession(){ carrier={x:rnd(360,540),y:STARTY}; ball={x:carrier.x,y:carrier.y}; combo=combo; newDecision(); }

function newDecision(){
  phase='decide'; pressT=0; chosen=-1;
  pressMax=clamp(1650 - lvl*120, 760, 1650);
  // three option teammates spread ahead (upfield = smaller y)
  const spread = clamp(150 + lvl*8, 150, 220);
  const baseY = carrier.y - rnd(150,200);
  const xs=[ clamp(carrier.x-spread, 80, 820), clamp(carrier.x+rnd(-30,30), 200, 700), clamp(carrier.x+spread, 80, 820) ];
  options = xs.map((x,i)=>({ idx:i, x, y:clamp(baseY+rnd(-34,34), TARGETY-6, carrier.y-120), state:'safe' }));
  pressers=[];
  // guarantee one safe option
  const safeIdx = Math.floor(Math.random()*3);
  const allowBait = lvl>=2;
  const threatP = clamp(0.5 + lvl*0.06, 0.5, 0.8);
  for(let i=0;i<3;i++){
    if(i===safeIdx){ continue; }
    if(!chance(threatP)) continue; // leave as safe (multiple safe = easier)
    const o=options[i];
    const mx=(carrier.x+o.x)/2, my=(carrier.y+o.y)/2;
    let type;
    const r=Math.random();
    if(allowBait && r<0.4) type='bait';
    else if(r<0.7) type='blocked';
    else type='mark';
    o.state=type;
    if(type==='blocked'){ pressers.push({x:mx+rnd(-10,10), y:my+rnd(-8,8), type:'block', lane:i}); }
    else if(type==='mark'){ const dx=carrier.x-o.x, dy=carrier.y-o.y, d=Math.hypot(dx,dy)||1; pressers.push({x:o.x+dx/d*26, y:o.y+dy/d*26, type:'mark', lane:i}); }
    else { // bait: off the lane, arrow pointing at midpoint
      const dx=o.x-carrier.x, dy=o.y-carrier.y, d=Math.hypot(dx,dy)||1; const px=-dy/d, py=dx/d; const side=chance(0.5)?1:-1;
      pressers.push({x:mx+px*side*46, y:my+py*side*46, type:'bait', lane:i, tx:mx, ty:my}); }
  }
  // chaser closing on the carrier (pressure timer, cosmetic position)
  chaser={ x:carrier.x+rnd(-50,50), y:carrier.y+rnd(58,84), bx:0,by:0 };
}

let pickFrac=1;
function pick(i){
  if(state!=='play'||phase!=='decide'||i<0||i>2) return;
  const o=options[i]; chosen=i; pickFrac=clamp(pressT/pressMax,0,1); passFrom={x:carrier.x,y:carrier.y}; passTo={x:o.x,y:o.y}; passT=0; phase='pass'; S.pass();
  if(o.state==='safe'){ o.result='ok'; } else { o.result='cut'; }
}
function resolvePass(){
  const o=options[chosen];
  if(o.result==='ok'){
    passes++; combo++; S.recv();
    const quick = pickFrac<0.42;
    let gained=25+combo*5; if(quick){ gained+=18; }
    score+=gained;
    pops.push({txt:(quick?'ワンタッチ！ +':'+')+gained, x:o.x, y:o.y-26, big:false, life:0.8, c:quick?'#7fd8ff':'#bfffcf'});
    for(let k=0;k<(quick?9:6);k++) parts.push({x:o.x,y:o.y,vx:rnd(-3,3),vy:rnd(-3,3),life:0.7,c:quick?'#7fd8ff':'#8fffb0'});
    carrier={x:o.x,y:o.y}; ball={x:o.x,y:o.y};
    if(carrier.y<=TARGETY+8){ lineBreak(); }
    else { newDecision(); }
  } else { // intercepted
    turnover(o.state==='mark'?'マークされていた！':(o.state==='bait'?'囮に食いついた！':'コースを切られた！'));
  }
}
function lineBreak(){
  breaks++; combo++; const gained=140+combo*8; score+=gained;
  S.brk(); flash=Math.max(flash,0.4);
  pops.push({txt:'ライン突破！ +'+gained, x:W/2, y:170, big:true, life:1.2, c:'#8fffb0'});
  for(let k=0;k<26;k++) parts.push({x:carrier.x,y:carrier.y,vx:rnd(-7,7),vy:rnd(-8,-1),life:1.1,c:'#bfffcf'});
  lvl=Math.min(6, Math.floor(breaks/2 + Math.floor(passes/6)));
  phase='resolve'; pend='possess'; pendDelay=900; resT=0;
}
function turnover(msg){
  turnovers++; combo=0; S.steal(); shakeT=0.3; flash=Math.max(flash,0.34);
  pops.push({txt:msg, x:W/2, y:180, big:true, life:1.1, c:'#ff6a6a'});
  for(let k=0;k<14;k++) parts.push({x:ball.x,y:ball.y,vx:rnd(-6,6),vy:rnd(-6,3),life:0.9,c:'#ff9a6a'});
  phase='resolve'; resT=0; pendDelay=1050;
  pend = turnovers>=3 ? 'over' : 'possess';
}
function tackleOut(){
  turnovers++; combo=0; S.tackle(); shakeT=0.32; flash=Math.max(flash,0.34);
  pops.push({txt:'奪われた…（遅い）', x:W/2, y:180, big:true, life:1.1, c:'#ff6a6a'});
  for(let k=0;k<14;k++) parts.push({x:carrier.x,y:carrier.y,vx:rnd(-6,6),vy:rnd(-6,3),life:0.9,c:'#ff9a6a'});
  phase='resolve'; resT=0; pendDelay=1050;
  pend = turnovers>=3 ? 'over' : 'possess';
}
function gameOver(){ state='over'; S.over(); if(score>best){ best=score; try{localStorage.setItem('bp_best',best);}catch(e){} } }

// ---------- input ----------
function start(){ ac(); reset(); state='play'; }
function tapAt(x,y){ if(state!=='play'){ start(); return; } if(phase!=='decide') return;
  let bi=-1, bd=1e9; for(const o of options){ const d=Math.hypot(o.x-x,o.y-y); if(d<bd){bd=d;bi=o.idx;} }
  if(bi>=0 && bd<130) pick(bi); }
function pt(e){ const r=cv.getBoundingClientRect(); return {x:(e.clientX-r.left)/r.width*W, y:(e.clientY-r.top)/r.height*H}; }
cv.addEventListener('pointerdown',e=>{ ac(); const p=pt(e); tapAt(p.x,p.y); e.preventDefault(); });
addEventListener('keydown',e=>{ const k=e.key.toLowerCase();
  if(state!=='play'){ if(!e.repeat) start(); return; }
  if(phase!=='decide') return;
  const byX=[...options].sort((a,b)=>a.x-b.x); // left,center,right
  if(k==='arrowleft'||k==='a'||k==='1'){ pick(byX[0].idx); e.preventDefault(); }
  else if(k==='arrowup'||k==='w'||k==='2'||k===' '){ pick(byX[1].idx); e.preventDefault(); }
  else if(k==='arrowright'||k==='d'||k==='3'){ pick(byX[2].idx); e.preventDefault(); } });

// ---------- update ----------
function update(dt){
  tPulse+=dt*0.006;
  if(flash>0) flash=Math.max(0,flash-dt*0.003);
  if(shakeT>0) shakeT-=dt*0.001;
  parts.forEach(q=>{q.x+=q.vx;q.y+=q.vy;q.vy+=0.18;q.life-=dt*0.0022;});
  parts=parts.filter(q=>q.life>0);
  pops.forEach(q=>{q.y-=dt*0.02;q.life-=dt*0.0014;});
  pops=pops.filter(q=>q.life>0);
  if(state!=='play') return;

  if(phase==='decide'){
    pressT+=dt;
    if(chaser){ const f=clamp(pressT/pressMax,0,1); chaser.bx=chaser.x+(carrier.x-chaser.x)*f; chaser.by=chaser.y+(carrier.y-chaser.y)*f; }
    if(pressT>=pressMax){ tackleOut(); }
  } else if(phase==='pass'){
    passT+=dt; const f=clamp(passT/passDur,0,1); const e=f<0.5?2*f*f:1-Math.pow(-2*f+2,2)/2;
    ball.x=passFrom.x+(passTo.x-passFrom.x)*e; ball.y=passFrom.y+(passTo.y-passFrom.y)*e - Math.sin(f*Math.PI)*22;
    if(f>=1){ resolvePass(); }
  } else if(phase==='resolve'){
    resT+=dt;
    if(resT>=pendDelay && pend){ const p=pend; pend=null; if(p==='over') gameOver(); else newPossession(); }
  }
}

// ---------- render ----------
function drawPlayer(x,y,r,col,ring){
  g.fillStyle=col; g.beginPath(); g.arc(x,y,r,0,6.28); g.fill();
  g.fillStyle='rgba(0,0,0,0.18)'; g.beginPath(); g.ellipse(x,y+r*0.9,r*0.9,r*0.34,0,0,6.28); g.fill();
  if(ring){ g.strokeStyle=ring; g.lineWidth=3; g.beginPath(); g.arc(x,y,r+5,0,6.28); g.stroke(); }
}
function arrow(x1,y1,x2,y2,col,w){ g.strokeStyle=col; g.lineWidth=w||3; g.beginPath(); g.moveTo(x1,y1); g.lineTo(x2,y2); g.stroke();
  const a=Math.atan2(y2-y1,x2-x1); g.beginPath(); g.moveTo(x2,y2); g.lineTo(x2-Math.cos(a-0.5)*11,y2-Math.sin(a-0.5)*11); g.lineTo(x2-Math.cos(a+0.5)*11,y2-Math.sin(a+0.5)*11); g.closePath(); g.fillStyle=col; g.fill(); }
function drawField(){
  const gr=g.createLinearGradient(0,0,0,H); gr.addColorStop(0,'#1f7a42'); gr.addColorStop(1,'#2c9350'); g.fillStyle=gr; g.fillRect(0,0,W,H);
  g.globalAlpha=0.06; for(let i=0;i<9;i++){ g.fillStyle=i%2?'#fff':'#000'; g.fillRect(0,i*66,W,66); } g.globalAlpha=1;
  g.fillStyle='#0e2233'; g.fillRect(0,0,W,44);
  for(const c of crowd){ g.fillStyle=c.c; g.globalAlpha=0.6; g.fillRect(c.x,c.y,3,3); } g.globalAlpha=1;
  // target line to break
  const pul=0.5+0.5*Math.sin(tPulse*1.3);
  g.fillStyle='rgba(143,255,176,'+(0.10+0.10*pul)+')'; g.fillRect(0,44,W,TARGETY-44);
  g.strokeStyle='rgba(143,255,176,'+(0.55+0.3*pul)+')'; g.lineWidth=3; g.setLineDash([16,10]); g.beginPath(); g.moveTo(0,TARGETY); g.lineTo(W,TARGETY); g.stroke(); g.setLineDash([]);
  g.fillStyle='rgba(220,255,230,0.85)'; g.font='bold 15px sans-serif'; g.textAlign='center'; g.fillText('ここを越えろ（ライン突破）',W/2,66);
}
function drawScene(){
  // passing lanes (neutral — you must read the defenders, not the colour)
  for(const o of options){
    g.strokeStyle='rgba(230,240,235,0.22)'; g.lineWidth=4;
    g.beginPath(); g.moveTo(carrier.x,carrier.y); g.lineTo(o.x,o.y); g.stroke();
  }
  // pressers
  for(const p of pressers){
    if(p.type==='bait'){ const pul=0.5+0.5*Math.sin(tPulse*2.2); arrow(p.x,p.y,p.tx,p.ty,'rgba(255,170,60,'+(0.5+0.4*pul)+')',3); drawPlayer(p.x,p.y,14,'#d34e4e'); }
    else drawPlayer(p.x,p.y,15,'#d34e4e');
  }
  // chaser closing
  if(chaser && phase==='decide'){ drawPlayer(chaser.bx||chaser.x, chaser.by||chaser.y, 13, '#e06a6a'); }
  // option teammates (no safety hint — read the press)
  for(const o of options){ const hi=(phase==='pass'&&chosen===o.idx); drawPlayer(o.x,o.y,17,'#3f7bd6', hi?'#fff':null); }
  // carrier
  drawPlayer(carrier.x,carrier.y,18,'#2f6fd0','#dfe8ff');
  // pressure ring on carrier
  if(phase==='decide'){ const f=clamp(pressT/pressMax,0,1); g.strokeStyle=f>0.7?'#ff6a6a':'#ffd84a'; g.lineWidth=4; g.beginPath(); g.arc(carrier.x,carrier.y,25,-Math.PI/2,-Math.PI/2+f*6.283); g.stroke(); }
  // ball
  if(phase==='pass'){ g.fillStyle='#fff'; g.beginPath(); g.arc(ball.x,ball.y,7,0,6.28); g.fill(); }
  else { g.fillStyle='#fff'; g.beginPath(); g.arc(carrier.x+12,carrier.y+10,6,0,6.28); g.fill(); }
}
function drawHUD(){
  g.textAlign='left'; g.fillStyle='#fff'; g.font='bold 25px sans-serif'; g.fillText('SCORE '+score,20,74);
  if(combo>1){ g.fillStyle='#ffd84a'; g.font='bold 17px sans-serif'; g.fillText(combo+' 連続',20,97); }
  g.textAlign='right'; g.fillStyle='rgba(255,255,255,0.8)'; g.font='14px sans-serif'; g.fillText('突破 '+breaks+'  Lv.'+(lvl+1),W-20,72);
  // turnovers
  g.fillStyle='#ff6a6a'; g.textAlign='right'; g.font='bold 14px sans-serif'; g.fillText('LOSS',W-96,H-24);
  for(let i=0;i<3;i++){ g.fillStyle=i<turnovers?'#ff5a5a':'rgba(255,255,255,0.24)'; g.beginPath(); g.arc(W-74+i*22,H-29,8,0,6.28); g.fill(); }
}
function drawTitle(){
  g.fillStyle='rgba(0,0,0,0.5)'; g.fillRect(0,0,W,H);
  g.textAlign='center'; g.fillStyle='#8fffb0'; g.font='bold 60px sans-serif'; g.fillText('プレス回避',W/2,180);
  g.fillStyle='#fff'; g.font='bold 24px sans-serif'; g.fillText('Break the Press — 空いてる味方を見抜け',W/2,222);
  g.fillStyle='#cfe'; g.font='18px sans-serif';
  g.fillText('相手が「乗った」レーン・「囮（オレンジ矢印）」・マークされた味方は危険。',W/2,278);
  g.fillText('コースの空いた味方へパスして前進。ラインを越えれば突破で大量加点。',W/2,306);
  g.fillText('持ち手の“プレッシャーの輪”が満ちる前に判断。遅いと奪われる。',W/2,334);
  g.fillText('パスミスや奪われるとロス、3ロスで終了。',W/2,362);
  g.fillStyle='#ffd84a'; g.font='bold 22px sans-serif'; g.fillText('クリック / タップ / キー でスタート',W/2,420);
}
function drawOver(){
  g.fillStyle='rgba(0,0,0,0.62)'; g.fillRect(0,0,W,H);
  g.textAlign='center'; g.fillStyle='#ff6a6a'; g.font='bold 52px sans-serif'; g.fillText('ボールロスト',W/2,H/2-54);
  g.fillStyle='#fff'; g.font='bold 34px sans-serif'; g.fillText('SCORE '+score,W/2,H/2+2);
  g.fillStyle='#cfe'; g.font='20px sans-serif'; g.fillText('ライン突破 '+breaks+'　BEST '+best,W/2,H/2+40);
  g.fillStyle='#8fffb0'; g.font='bold 22px sans-serif'; g.fillText('クリック / タップ で もう一度',W/2,H/2+96);
}
function render(){
  g.setTransform(DPR,0,0,DPR,0,0);
  let sx=0,sy=0; if(shakeT>0){ sx=rnd(-6,6)*shakeT*3; sy=rnd(-6,6)*shakeT*3; g.translate(sx,sy); }
  drawField();
  if(state==='play'||(state==='over')) drawScene();
  parts.forEach(q=>{ g.globalAlpha=clamp(q.life,0,1); g.fillStyle=q.c; g.beginPath(); g.arc(q.x,q.y,3,0,6.28); g.fill(); }); g.globalAlpha=1;
  pops.forEach(q=>{ g.globalAlpha=clamp(q.life,0,1); g.textAlign='center'; g.fillStyle=q.c; g.font='bold '+(q.big?38:22)+'px sans-serif';
    const px=(q.x==null)?W/2:q.x; g.fillText(q.txt,px,q.y); }); g.globalAlpha=1;
  if(state==='play') drawHUD();
  if(flash>0){ g.fillStyle='rgba(255,255,255,'+(flash*0.6)+')'; g.fillRect(0,0,W,H); }
  if(state==='title') drawTitle();
  if(state==='over') drawOver();
  g.setTransform(DPR,0,0,DPR,0,0);
}

let last=0;
function frame(t){ let dt=t-last; last=t; if(dt>60)dt=60; if(dt<0)dt=0; update(dt); render(); requestAnimationFrame(frame); }
requestAnimationFrame(frame);

// ---------- test hook ----------
window.__bp={
  start, pick,
  get state(){return state;}, get score(){return score;}, get turnovers(){return turnovers;}, get breaks(){return breaks;}, get passes(){return passes;},
  get info(){ if(state!=='play') return {state,phase:'-'}; return {
    state, phase, pressT, pressMax, turnovers, breaks, passes,
    options:options.map(o=>({idx:o.idx,x:o.x,y:o.y,state:o.state})), carrier:{x:carrier.x,y:carrier.y} }; }
};
})();
</script>
</body>
</html>
