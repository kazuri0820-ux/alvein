<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>粘り (Battle at the Plate)</title>
<style>
  html,body{margin:0;height:100%;background:#0a1018;overflow:hidden;
    font-family:-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  #stage{position:relative;width:100vw;height:100vh;max-width:calc(100vh*1.5);max-height:calc(100vw/1.5);aspect-ratio:900/600;}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;border-radius:6px;}
</style>
</head>
<body>
<div id="wrap"><div id="stage"><canvas id="cv"></canvas></div></div>
<script>
(function(){
const W=900,H=600,cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let DPR=1;
function fit(){DPR=Math.min(2,window.devicePixelRatio||1);cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
fit();addEventListener('resize',fit);

// ---------- audio ----------
let AC=null;function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function tone(f,d,type,v,sweep){const a=ac();if(!a)return;const t=a.currentTime,o=a.createOscillator(),g=a.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(sweep)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+sweep),t+d);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v||0.2,t+0.008);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+0.02);}
function noise(d,v,hp){const a=ac();if(!a)return;const t=a.currentTime,n=Math.floor(a.sampleRate*d),buf=a.createBuffer(1,n,a.sampleRate),ch=buf.getChannelData(0);
  for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource();s.buffer=buf;
  const f=a.createBiquadFilter();f.type='highpass';f.frequency.value=hp||600;const g=a.createGain();g.gain.value=v||0.2;
  s.connect(f);f.connect(g);g.connect(a.destination);s.start(t);s.stop(t+d+0.02);}
const S={
  foul:()=>{noise(0.05,0.2,900);tone(360,0.08,'square',0.1);},
  ball:()=>{tone(560,0.09,'sine',0.12);},
  cstrike:()=>{tone(330,0.13,'sawtooth',0.14,-60);},
  whiff:()=>{noise(0.14,0.18,500);tone(200,0.16,'sawtooth',0.12,-70);},
  hit:()=>{noise(0.05,0.3,1100);tone(240,0.14,'square',0.2,320);setTimeout(()=>tone(520,0.12,'triangle',0.16),40);},
  walk:()=>{[660,880,990,1320].forEach((f,i)=>setTimeout(()=>tone(f,0.14,'triangle',0.2),i*90));},
  k:()=>{tone(240,0.3,'sawtooth',0.2,-120);setTimeout(()=>tone(170,0.3,'sawtooth',0.18,-70),130);},
  pitch:()=>{noise(0.04,0.07,1400);},
  over:()=>{[440,330,247,175].forEach((f,i)=>setTimeout(()=>tone(f,0.3,'triangle',0.2),i*160));}
};

// ---------- zone ----------
const ZX0=372,ZX1=528,ZY0=214,ZY1=392, ZCX=450,ZCY=303;
const REL={x:452,y:96}, T_WIN=0.80;

// ---------- state ----------
let state='title', phase='pitch', t=0, pitchN=0, atbats=0;
let score=0, combo=0, best=+(localStorage.getItem('battle_best')||0);
let hits=0, walks=0, fouls=0, outs=0;
let balls=0, strikes=0, lvl=1;
let P=null, result=null, resultT=0, msg='', msg2='';
let shake=0, flash=0, flashCol='#fff', last=performance.now(), batAng=0.7;
let parts=[], pops=[];

function rnd(a,b){return a+Math.random()*(b-a);}
function chance(p){return Math.random()<p;}
function clamp(v,a,b){return v<a?a:v>b?b:v;}

function reset(){state='title';score=0;combo=0;hits=0;walks=0;fouls=0;outs=0;balls=0;strikes=0;lvl=1;pitchN=0;atbats=0;P=null;result=null;parts=[];pops=[];}

function newPitch(){
  pitchN++;
  lvl=Math.min(6,1+Math.floor(pitchN/6));
  // type weighted: with 2 strikes, more tough/ball (nasty); mistakes are rarer
  let r=Math.random(), type;
  if(r<0.30) type='ball';
  else if(r<0.30+ (0.20+lvl*0.02)) type='mistake';
  else type='tough';
  let fx,fy;
  if(type==='mistake'){ fx=rnd(ZCX-30,ZCX+30); fy=rnd(ZCY-24,ZCY+24); }
  else if(type==='tough'){ const s=Math.floor(rnd(0,4)); const m=14;
    if(s===0){fx=ZX0+m;fy=rnd(ZY0+m,ZY1-m);} else if(s===1){fx=ZX1-m;fy=rnd(ZY0+m,ZY1-m);}
    else if(s===2){fy=ZY0+m;fx=rnd(ZX0+m,ZX1-m);} else {fy=ZY1-m;fx=rnd(ZX0+m,ZX1-m);} }
  else { const s=Math.floor(rnd(0,4)); const off=rnd(24,64);
    if(s===0){fx=ZX0-off;fy=rnd(ZY0,ZY1);} else if(s===1){fx=ZX1+off;fy=rnd(ZY0,ZY1);}
    else if(s===2){fy=ZY0-off;fx=rnd(ZX0,ZX1);} else {fy=ZY1+off;fx=rnd(ZX0,ZX1);} }
  const dur=(type==='mistake'?rnd(900,1050):rnd(680,820))-lvl*30;
  P={type,fx:clamp(fx,120,780),fy:clamp(fy,120,500),dur:Math.max(560,dur),t:0,acted:false,
     curl:(chance(0.6)?(chance(0.5)?-1:1):0)*(type==='ball'||type==='tough'?rnd(30,54):rnd(6,16))};
  result=null; phase='pitch'; t=0; batAng=0.7;
  S.pitch();
  msg=''; msg2='';
}

function startAtBat(){ atbats++; balls=0; strikes=0; newPitch(); }
function start(){ if(!ac())ac(); if(AC&&AC.state==='suspended')AC.resume(); reset(); state='play'; startAtBat(); }

function ballPos(f){ const bs=0.5, bf=f<bs?0:((f-bs)/(1-bs)); const off=P.curl*bf*bf;
  return {x:REL.x+(P.fx-REL.x)*f+off, y:REL.y+(P.fy-REL.y)*f}; }

// ---------- swing ----------
function respond(kind){ // 'contact' or 'power'
  if(state==='title'){start();return;}
  if(state==='over'){ if(resultT>0.5){reset();start();} return; }
  if(state!=='play'||phase!=='pitch'||!P||P.acted) return;
  P.acted=true; P.swing=kind; P.swingP=P.t/P.dur; batAng=kind==='power'?-1.0:-0.3;
  const timed = P.swingP>=T_WIN && P.swingP<=1.03;
  if(P.type==='ball'){ resolve('chase'); return; }         // swung at a ball
  if(!timed){ resolve('whiffmiss'); return; }               // mistimed swing at a strike
  if(kind==='power'){ resolve(P.type==='mistake'?'hit':'whiff'); }   // drive mistake / whiff on tough
  else { resolve('foul'); }                                 // contact = foul (survive) on any strike
}

function resolve(kind){
  phase='resolve'; resultT=0; result=kind;
  if(kind==='hit'){
    combo++; const add=Math.round(200*(1+Math.min(6,combo-1)*0.2)); score+=add; hits++;
    S.hit(); flash=1;flashCol='#ffe08a';shake=13;
    burst(ZCX,ZCY,'#ffe08a',30,8); pop(ZCX,ZY0-24,'痛打！ 失投を仕留めた +'+add,'#fff3c4');
    if(combo>=2)pop(ZCX,ZY0-50,'コンボ x'+combo,'#ffd24d');
    msg='痛打！ 甘い球を強振で仕留めた'; msg2=''; endAB();
  } else if(kind==='foul'){
    fouls++; const add=15; score+=add; S.foul();
    pop(ballPos(1).x,ballPos(1).y,'ファウルで粘る','#cfe8ff');
    msg='カット！ 際どい球をファウルで粘る'; msg2='ボールを待て／甘い球を狙え';
    // fouls don't change the count -> next pitch, same AB
  } else if(kind==='ball_take'){
    balls++; S.ball(); pop(ballPos(1).x,ballPos(1).y,'ボール','#8fe0ff');
    if(balls>=4){ walks++; combo++; const add=Math.round(120*(1+Math.min(6,combo-1)*0.2)); score+=add;
      S.walk(); flash=1;flashCol='#8fe08a';shake=8; pop(ZCX,ZY0-24,'四球で出塁！ +'+add,'#c9ffd0');
      msg='四球を選んだ！ 粘り勝ち'; msg2=''; endAB(); }
    else { msg='ボール、よく見た'; msg2='あと'+(4-balls)+'球で四球'; }
  } else {
    // strikeout paths: cstrike (took a strike), chase (swung at ball), whiff/whiffmiss (missed)
    strikes++; combo=0;
    if(kind==='cstrike'){S.cstrike();}else if(kind==='chase'){S.whiff();}else{S.whiff();}
    flash=0.7;flashCol='#ffb15b';shake=5;
    if(strikes>=3){ outs++; S.k(); flash=1;flashCol='#ff5b5b';shake=12; msg='三振…アウト'; msg2=''; endAB(true); }
    else {
      msg = kind==='cstrike'?'見逃しストライク！ 2ストライクからは振れ':(kind==='chase'?'ボール球に手を出した！':'空振り／打ち損じ');
      msg2='あと'+(3-strikes)+'球で三振';
    }
  }
}
let abEnded=false;
function endAB(k){ abEnded=true; }

// ---------- input ----------
cv.addEventListener('pointerdown',e=>{
  e.preventDefault();
  if(state==='title'||state==='over'){respond('contact');return;}
  const r=cv.getBoundingClientRect(); const x=((e.clientX-r.left)/r.width)*W;
  respond(x<W/2?'contact':'power');
});
addEventListener('keydown',e=>{
  if(e.code==='KeyC'||e.code==='ArrowLeft'){e.preventDefault();respond('contact');}
  else if(e.code==='Space'||e.code==='ArrowRight'){e.preventDefault(); if(state!=='play')respond('contact'); else respond('power');}
  else if(e.code==='Enter'){ if(state!=='play')respond('contact'); }
});

// ---------- particles ----------
function burst(x,y,c,n,sp){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=rnd(sp*0.3,sp);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:1,c});}}
function pop(x,y,txt,c){pops.push({x,y,txt,c,life:1});}

// ---------- update ----------
function update(dt){
  shake*=Math.pow(0.86,dt/16.7); if(shake<0.3)shake=0;
  flash*=Math.pow(0.9,dt/16.7);
  batAng+=(0.7-batAng)*Math.min(1,dt/16.7*0.18);
  for(const p of parts){p.vx*=0.96;p.vy=p.vy*0.96+0.3;p.x+=p.vx*dt/16.7;p.y+=p.vy*dt/16.7;p.life-=dt/16.7*0.028;}
  parts=parts.filter(p=>p.life>0);
  for(const p of pops){p.y-=dt/16.7*0.5;p.life-=dt/16.7*0.02;}
  pops=pops.filter(p=>p.life>0);

  if(state!=='play'){ if(state==='over')resultT+=dt/1000; return; }
  t+=dt;

  if(phase==='pitch'){
    P.t+=dt; const f=clamp(P.t/P.dur,0,1);
    if(f>=1 && !P.acted){ P.acted=true; // took the pitch
      if(P.type==='ball') resolve('ball_take'); else resolve('cstrike'); }
    return;
  }
  if(phase==='resolve'){
    resultT+=dt/1000;
    if(resultT>0.9){
      if(abEnded){ abEnded=false;
        if(outs>=3){ state='over'; resultT=0; S.over(); if(score>best){best=score;localStorage.setItem('battle_best',best);} return; }
        startAtBat();
      } else newPitch();
    }
    return;
  }
}

// ---------- render ----------
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

function drawScene(){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#16233a');g.addColorStop(0.5,'#1b2f22');g.addColorStop(1,'#20402c');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='rgba(150,95,55,0.45)';ctx.beginPath();ctx.ellipse(450,470,240,120,0,0,6.28);ctx.fill();
  ctx.fillStyle='#f2f2f2';ctx.beginPath();ctx.moveTo(450,506);ctx.lineTo(410,486);ctx.lineTo(410,468);ctx.lineTo(490,468);ctx.lineTo(490,486);ctx.closePath();ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,0.7)';ctx.lineWidth=3;ctx.strokeRect(ZX0,ZY0,ZX1-ZX0,ZY1-ZY0);
  ctx.strokeStyle='rgba(255,255,255,0.15)';ctx.lineWidth=1;
  for(let i=1;i<3;i++){ctx.beginPath();ctx.moveTo(ZX0+(ZX1-ZX0)*i/3,ZY0);ctx.lineTo(ZX0+(ZX1-ZX0)*i/3,ZY1);ctx.stroke();
    ctx.beginPath();ctx.moveTo(ZX0,ZY0+(ZY1-ZY0)*i/3);ctx.lineTo(ZX1,ZY0+(ZY1-ZY0)*i/3);ctx.stroke();}
}

function drawBatter(){
  const bx=560,by=430;
  ctx.save();ctx.translate(bx,by);
  ctx.fillStyle='#2b6cff';rr(-9,-8,18,26,6);ctx.fill();ctx.fillStyle='#f2c9a0';ctx.beginPath();ctx.arc(0,-18,8,0,6.28);ctx.fill();ctx.fillStyle='#1a3a8a';ctx.beginPath();ctx.arc(0,-20,8.5,Math.PI,0);ctx.fill();
  ctx.strokeStyle='#c8a15a';ctx.lineWidth=6;ctx.lineCap='round';ctx.save();ctx.rotate(batAng);ctx.beginPath();ctx.moveTo(0,-6);ctx.lineTo(0,-46);ctx.stroke();ctx.restore();
  ctx.restore();
}

function render(){
  ctx.save();
  if(shake>0)ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
  drawScene();
  drawBatter();

  if(state==='play'&&phase==='pitch'&&P){
    const f=clamp(P.t/P.dur,0,1); const bp=ballPos(f); const r=6+f*7;
    // mistake tell (fades at high lvl)
    if(P.type==='mistake'&&lvl<3&&f<0.5){ ctx.fillStyle='rgba(255,224,138,'+(0.5*(1-f*2))+')';ctx.font='bold 15px sans-serif';ctx.textAlign='center';ctx.fillText('甘い！',bp.x,bp.y-18); }
    for(let k=1;k<=3;k++){const ff=clamp(f-k*0.05,0,1);const t2=ballPos(ff);ctx.globalAlpha=0.2;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(t2.x,t2.y,r*0.7,0,6.28);ctx.fill();}
    ctx.globalAlpha=1;
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(bp.x,bp.y,r,0,6.28);ctx.fill();ctx.strokeStyle='#c33';ctx.lineWidth=1.4;ctx.beginPath();ctx.arc(bp.x,bp.y,r,0.4,2.3);ctx.stroke();
  }

  for(const p of parts){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,3.2,0,6.28);ctx.fill();}
  ctx.globalAlpha=1;
  for(const p of pops){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.font='bold 21px sans-serif';ctx.textAlign='center';ctx.fillText(p.txt,p.x,p.y);}
  ctx.globalAlpha=1;

  // HUD
  ctx.textAlign='left';ctx.fillStyle='#fff';ctx.font='bold 26px sans-serif';ctx.fillText('SCORE '+score,20,36);
  ctx.textAlign='right';ctx.fillStyle='rgba(255,255,255,0.85)';ctx.font='14px sans-serif';ctx.fillText('安打 '+hits+' 四球 '+walks+' 粘り '+fouls,W-20,24);
  // count
  ctx.textAlign='left';ctx.font='bold 15px sans-serif';
  ctx.fillStyle='#8fe0ff';ctx.fillText('B',22,60);for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(46+i*20,55,7,0,6.28);ctx.fillStyle=i<balls?'#3ec6ff':'rgba(255,255,255,0.2)';ctx.fill();}
  ctx.fillStyle='#ffd24d';ctx.fillText('S',22,86);for(let i=0;i<2;i++){ctx.beginPath();ctx.arc(46+i*20,81,7,0,6.28);ctx.fillStyle=i<strikes?'#ffb15b':'rgba(255,255,255,0.2)';ctx.fill();}
  ctx.textAlign='right';ctx.fillStyle='rgba(255,255,255,0.85)';ctx.font='14px sans-serif';ctx.fillText('アウト',W-64,50);
  for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(W-56+i*20,72,7,0,6.28);ctx.fillStyle=i<outs?'#ff5b5b':'rgba(255,255,255,0.22)';ctx.fill();}
  if(combo>=2){ctx.textAlign='center';ctx.fillStyle='#ffd24d';ctx.font='bold 18px sans-serif';ctx.fillText('コンボ x'+combo,ZCX,H-96);}

  if(state==='play'&&(msg||msg2)){
    ctx.textAlign='center';
    const good=result==='hit'||result==='foul'||result==='ball_take'||balls>=4;
    ctx.fillStyle=result?((result==='hit'||balls>=4)?'#8ff0b8':(result==='foul'||result==='ball_take'?'#cfe8ff':'#ff9a9a')):'rgba(255,255,255,0.92)';
    ctx.font='bold 26px sans-serif';ctx.fillText(msg,W/2,H-52);
    if(msg2){ctx.fillStyle='rgba(255,255,255,0.72)';ctx.font='15px sans-serif';ctx.fillText(msg2,W/2,H-28);}
  }

  if(state==='title'){
    ctx.fillStyle='rgba(6,10,18,0.66)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='bold 52px sans-serif';ctx.fillText('粘り',W/2,180);
    ctx.fillStyle='#ffd24d';ctx.font='bold 22px sans-serif';ctx.fillText('Battle at the Plate',W/2,216);
    ctx.fillStyle='rgba(255,255,255,0.9)';ctx.font='17px sans-serif';
    ctx.fillText('際どいストライク＝カット（軽打＝左クリック/C）でファウルにして粘る',W/2,270);
    ctx.fillText('ボール＝見送る（無反応）で四球狙い、甘い失投＝強振（右クリック/SPACE）で痛打',W/2,296);
    ctx.fillStyle='rgba(255,255,255,0.66)';ctx.font='14px sans-serif';
    ctx.fillText('ファウルは粘り（カウント変わらず）。ボール球を振る/見逃し/空振りはストライク',W/2,336);
    ctx.fillText('甘い球を強振で痛打、四球を選べば粘り勝ち。3三振で交代',W/2,358);
    ctx.fillStyle='#ffe08a';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で開始',W/2,420);
    ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='14px sans-serif';ctx.fillText('BEST '+best,W/2,452);
    ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='13px sans-serif';ctx.fillText('タップ：左半分=カット / 右半分=強振',W/2,478);
  }
  if(state==='over'){
    ctx.fillStyle='rgba(6,10,18,0.74)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#ff6b6b';ctx.font='bold 46px sans-serif';ctx.fillText('3三振…交代',W/2,224);
    ctx.fillStyle='#fff';ctx.font='bold 40px sans-serif';ctx.fillText('SCORE '+score,W/2,292);
    ctx.fillStyle='rgba(255,255,255,0.85)';ctx.font='19px sans-serif';ctx.fillText('安打 '+hits+' 四球 '+walks+' 粘り '+fouls+'   BEST '+best,W/2,332);
    ctx.fillStyle='#8ff0b8';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で もう一度',W/2,404);
  }

  if(flash>0.02){ctx.globalAlpha=flash*0.5;ctx.fillStyle=flashCol;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}
  ctx.restore();

  ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,0.4)';ctx.font='12px sans-serif';
  ctx.fillText('際どい=カット(左/C)でファウル粘り、ボール=見送り、甘い=強振(右/SPACE)で痛打。3三振で交代',W/2,H-8);
}

function frame(ts){let dt=ts-last;last=ts;if(dt>60)dt=60;if(dt<0)dt=0;update(dt);render();requestAnimationFrame(frame);}
requestAnimationFrame(frame);

// ---------- test hook ----------
window.__bp={
  start, contact:()=>respond('contact'), power:()=>respond('power'),
  get state(){return state;},
  get score(){return score;},
  get outs(){return outs;},
  get hits(){return hits;},
  get walks(){return walks;},
  get info(){return {state,phase, p:P?P.t/P.dur:0, type:P?P.type:null, tWin:T_WIN, acted:P?P.acted:false,
    balls, strikes, outs, result, lvl};}
};
})();
</script>
</body>
</html>
