<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>隠し球 (Hidden Ball Trick)</title>
<style>
  html,body{margin:0;height:100%;background:#0a0f0a;overflow:hidden;
    font-family:-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  #stage{position:relative;width:100vw;height:100vh;max-width:calc(100vh*1.5);max-height:calc(100vw/1.5);aspect-ratio:900/600;}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;border-radius:6px;}
</style>
</head>
<body>
<div id="wrap"><div id="stage"><canvas id="cv"></canvas></div></div>
<script>
(function(){
const W=900,H=600,cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let DPR=1;
function fit(){DPR=Math.min(2,window.devicePixelRatio||1);cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
fit();addEventListener('resize',fit);

// ---------- audio ----------
let AC=null;function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function tone(f,d,type,v,sweep){const a=ac();if(!a)return;const t=a.currentTime,o=a.createOscillator(),g=a.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(sweep)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+sweep),t+d);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v||0.2,t+0.008);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+0.02);}
function noise(d,v,hp){const a=ac();if(!a)return;const t=a.currentTime,n=Math.floor(a.sampleRate*d),buf=a.createBuffer(1,n,a.sampleRate),ch=buf.getChannelData(0);
  for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource();s.buffer=buf;
  const f=a.createBiquadFilter();f.type='highpass';f.frequency.value=hp||600;const g=a.createGain();g.gain.value=v||0.2;
  s.connect(f);f.connect(g);g.connect(a.destination);s.start(t);s.stop(t+d+0.02);}
const S={
  tag:()=>{noise(0.04,0.14,700);tone(520,0.06,'square',0.09);},
  out:()=>{noise(0.05,0.12,600);[720,980,1240].forEach((f,i)=>setTimeout(()=>tone(f,0.11,'triangle',0.17),i*70));},
  sneaky:()=>{tone(300,0.14,'sine',0.06,180);},
  bad:()=>{noise(0.16,0.22,320);tone(180,0.18,'sawtooth',0.12,-50);},
  streak:()=>{[700,930,1170,1400].forEach((f,i)=>setTimeout(()=>tone(f,0.1,'triangle',0.16),i*60));},
  over:()=>{[440,330,247,175].forEach((f,i)=>setTimeout(()=>tone(f,0.3,'triangle',0.2),i*160));}
};

// ---------- geometry ----------
const BASE={x:512,y:322};  // the base the runner leads off from
const NEXT={x:250,y:230};  // direction of the lead (toward next base)
const FIELDER={x:560,y:300};

// ---------- state ----------
let state='title', phase='lead', t=0, plays=0;
let score=0, combo=0, best=+(localStorage.getItem('hiddenball_best')||0);
let outs=0, fails=0, lvl=1;   // outs = runners tagged
let clock=0, leadUpT=800, holdT=520, retreatT=500, senseT=1320, peakLead=70, threshold=34;
let acted=false, tagLead=0, result=null, resultT=0, msg='', tagU=0, diveU=0;
let shake=0, flash=0, flashCol='#fff', last=performance.now();
let parts=[], pops=[];

function rnd(a,b){return a+Math.random()*(b-a);}
function chance(p){return Math.random()<p;}
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function lerp(a,b,u){return a+(b-a)*u;}
function easeOut(u){return 1-Math.pow(1-u,2);}
function easeIn(u){return u*u;}

function params(){ return {
  up:Math.max(480,880-lvl*54),
  hold:Math.max(230,600-lvl*52),
  retreat:Math.max(300,560-lvl*36),
  margin:Math.max(10,34-lvl*3.4)   // how far past threshold the peak lead goes (smaller=tighter)
};}

function leadDist(){
  if(clock<=leadUpT) return peakLead*easeOut(clamp(clock/leadUpT,0,1));
  if(clock<=senseT) return peakLead;
  const u=clamp((clock-senseT)/retreatT,0,1); return peakLead*(1-easeIn(u));
}

function reset(){state='title';score=0;combo=0;outs=0;fails=0;lvl=1;plays=0;result=null;parts=[];pops=[];}
function newPlay(){
  plays++; lvl=Math.min(7,1+Math.floor(outs/4));
  const p=params();
  leadUpT=p.up; holdT=p.hold; retreatT=p.retreat; senseT=leadUpT+holdT;
  threshold=34; peakLead=threshold+rnd(p.margin*0.5,p.margin);
  clock=0; acted=false; tagLead=0; result=null; phase='lead'; msg=''; resultT=0; tagU=0; diveU=0;
}
function start(){ if(!ac())ac(); if(AC&&AC.state==='suspended')AC.resume(); reset(); state='play'; newPlay(); }

function tagAct(){
  if(state==='title'){start();return;}
  if(state==='over'){ if(resultT>0.4){reset();start();} return; }
  if(state!=='play'||phase!=='lead'||acted) return;
  acted=true; tagLead=leadDist(); S.tag();
  if(tagLead>=threshold){ resolve(tagLead>=peakLead-6?'clean':'out'); }
  else { resolve(clock>senseT?'late':'early'); }
}

function resolve(kind){
  phase='result'; result=kind; resultT=0;
  const good=(kind==='out'||kind==='clean');
  if(good){
    outs++; combo++;
    let add=Math.round((kind==='clean'?150:100)*(1+Math.min(9,combo-1)*0.16)); score+=add;
    S.out(); flash=1;flashCol=kind==='clean'?'#8affa0':'#ffe08a';shake=6;
    burst(BASE.x-tagLead*2.2,BASE.y,kind==='clean'?'#8affa0':'#ffe08a',kind==='clean'?18:12,5);
    pop(BASE.x-60,BASE.y-40,'アウト！ +'+add,'#fff3c4');
    pop(450,150,kind==='clean'?'完璧に離塁を突いた！ 隠し球成功！':'隠し球成功！ 離塁を刺した！',kind==='clean'?'#8affa0':'#ffe08a');
    if(combo>=2)pop(450,190,'コンボ x'+combo,'#ffd24d');
    if(combo>0&&combo%5===0)S.streak();
    msg=kind==='clean'?'見事！ 走者が最も離れた瞬間を突いた！':'隠し球でタッチアウト！';
  } else {
    fails++; combo=0; flash=1;flashCol='#ff5b5b';shake=8; S.bad();
    if(kind==='early') msg='早すぎ！ まだ塁上…仕掛けがバレて戻られた';
    else if(kind==='late') msg='遅い！ 走者に気づかれて帰塁された';
    else msg='走者が戻ってしまった…好機を逃した';
    pop(BASE.x-40,BASE.y-40,kind==='early'?'まだ塁上':'戻られた','#ffb0b0');
  }
  if(fails>=3){ state='over'; resultT=0; S.over(); if(score>best){best=score;localStorage.setItem('hiddenball_best',best);} }
}

// ---------- input ----------
cv.addEventListener('pointerdown',e=>{e.preventDefault();tagAct();});
addEventListener('keydown',e=>{ if(e.code==='Space'||e.code==='Enter'||e.code==='ArrowUp'||e.code==='KeyZ'){e.preventDefault();tagAct();} });

// ---------- particles ----------
function burst(x,y,c,n,sp){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=rnd(sp*0.3,sp);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:1,c});}}
function pop(x,y,txt,c){pops.push({x,y,txt,c,life:1});}

// ---------- update ----------
function update(dt){
  shake*=Math.pow(0.86,dt/16.7); if(shake<0.3)shake=0;
  flash*=Math.pow(0.9,dt/16.7);
  for(const p of parts){p.vx*=0.96;p.vy=p.vy*0.96+0.28;p.x+=p.vx*dt/16.7;p.y+=p.vy*dt/16.7;p.life-=dt/16.7*0.026;}
  parts=parts.filter(p=>p.life>0);
  for(const p of pops){p.y-=dt/16.7*0.5;p.life-=dt/16.7*0.02;}
  pops=pops.filter(p=>p.life>0);

  if(state!=='play'){ if(state==='over')resultT+=dt/1000; return; }
  t+=dt;
  if(phase==='lead'){
    clock+=dt;
    if(!acted && clock>=senseT+retreatT){ resolve('safe'); }
    return;
  }
  if(phase==='result'){
    resultT+=dt/1000; tagU=Math.min(1,tagU+dt/180); diveU=Math.min(1,diveU+dt/260);
    if(resultT>1.15 && state==='play') newPlay();
    return;
  }
}

// ---------- render ----------
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function drawScene(){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#1f5f2a');g.addColorStop(1,'#123a1b');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#7a5230';ctx.beginPath();ctx.ellipse(BASE.x,BASE.y+6,150,86,0,0,6.28);ctx.fill();
  // basepath toward next base
  ctx.strokeStyle='rgba(240,220,180,0.5)';ctx.lineWidth=16;
  ctx.beginPath();ctx.moveTo(BASE.x,BASE.y);ctx.lineTo(NEXT.x,NEXT.y);ctx.stroke();
  // base
  ctx.save();ctx.translate(BASE.x,BASE.y);ctx.rotate(Math.PI/4);ctx.fillStyle='#f2f4f6';ctx.fillRect(-13,-13,26,26);ctx.restore();
}
function drawFig(x,y,col,s){ s=s||1; ctx.fillStyle='rgba(0,0,0,0.22)';ctx.beginPath();ctx.ellipse(x,y+13*s,11*s,4*s,0,0,6.28);ctx.fill();
  ctx.fillStyle=col;rr(x-8*s,y-10*s,16*s,24*s,6);ctx.fill();
  ctx.fillStyle='#f2c9a0';ctx.beginPath();ctx.arc(x,y-14*s,6*s,0,6.28);ctx.fill(); }

function render(){
  ctx.save();
  if(shake>0)ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
  drawScene();

  if(state==='play'){
    const d = (phase==='lead')?leadDist():tagLead;
    const dir={x:(NEXT.x-BASE.x),y:(NEXT.y-BASE.y)}; const dl=Math.hypot(dir.x,dir.y); dir.x/=dl;dir.y/=dl;
    // runner position along the lead direction
    let rd=d;
    if(phase==='result'&&(result==='out'||result==='clean')){ rd=d; }      // caught where tagged
    else if(phase==='result'&&(result==='late'||result==='safe')){ rd=lerp(d,0,easeOut(diveU)); } // dove back
    else if(phase==='result'&&result==='early'){ rd=lerp(d,0,easeOut(diveU)); }
    const rx=BASE.x+dir.x*rd, ry=BASE.y+dir.y*rd;

    // threshold marker (the "off the base" line)
    const tx=BASE.x+dir.x*threshold, ty=BASE.y+dir.y*threshold;
    ctx.strokeStyle='rgba(150,240,170,0.5)';ctx.lineWidth=2;ctx.setLineDash([5,5]);
    ctx.beginPath();ctx.moveTo(tx-dir.y*22,ty+dir.x*22);ctx.lineTo(tx+dir.y*22,ty-dir.x*22);ctx.stroke();ctx.setLineDash([]);

    // runner (red) — glows green when off past threshold during lead
    const off = (phase==='lead') && leadDist()>=threshold;
    if(off){ ctx.fillStyle='rgba(150,240,170,0.25)';ctx.beginPath();ctx.arc(rx,ry,26,0,6.28);ctx.fill(); }
    drawFig(rx,ry,'#e23c3c',1.05);

    // fielder (you) — lunges to tag on result
    let fx=FIELDER.x, fy=FIELDER.y;
    if(phase==='result'&&(result==='out'||result==='clean')){ fx=lerp(FIELDER.x,rx+16,easeOut(tagU)); fy=lerp(FIELDER.y,ry,easeOut(tagU)); }
    drawFig(fx,fy,'#2b6cff',1.05);
    // hidden ball in glove
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(fx-8,fy+2,5,0,6.28);ctx.fill();

    if(phase==='lead'){
      ctx.fillStyle= off?'#9ff0b8':'rgba(255,255,255,0.75)';ctx.font='bold 15px sans-serif';ctx.textAlign='center';
      ctx.fillText(off?'今だ！ 離塁を突いてタッチ！':'走者がリードするのを待て…',450,470);
      // lead gauge
      const bw=200,bx0=450-bw/2,by=490;
      ctx.fillStyle='rgba(0,0,0,0.3)';rr(bx0-3,by-3,bw+6,14,7);ctx.fill();
      const lu=clamp(leadDist()/(threshold+40),0,1);
      ctx.fillStyle=off?'#8affa0':'#ffd24d';rr(bx0,by,bw*lu,8,4);ctx.fill();
      // threshold tick on gauge
      const tk=bx0+bw*(threshold/(threshold+40));
      ctx.strokeStyle='rgba(150,240,170,0.9)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(tk,by-4);ctx.lineTo(tk,by+12);ctx.stroke();
      ctx.fillStyle='rgba(150,240,170,0.8)';ctx.font='10px sans-serif';ctx.fillText('離塁ライン',tk,by+26);
    }
  }

  for(const p of parts){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,3.2,0,6.28);ctx.fill();}
  ctx.globalAlpha=1;
  for(const p of pops){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.font='bold 22px sans-serif';ctx.textAlign='center';ctx.fillText(p.txt,p.x,p.y);}
  ctx.globalAlpha=1;

  // HUD
  ctx.textAlign='left';ctx.fillStyle='#fff';ctx.font='bold 26px sans-serif';ctx.fillText('SCORE '+score,20,36);
  ctx.textAlign='right';ctx.fillStyle='rgba(255,255,255,0.9)';ctx.font='14px sans-serif';ctx.fillText('アウト '+outs+'  Lv'+lvl,W-20,24);
  ctx.fillText('失敗',W-92,46);
  for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(W-60+i*20,41,7,0,6.28);ctx.fillStyle=i<fails?'#ff5b5b':'rgba(255,255,255,0.25)';ctx.fill();}
  if(combo>=2){ctx.textAlign='center';ctx.fillStyle='#ffd24d';ctx.font='bold 18px sans-serif';ctx.fillText('コンボ x'+combo,450,120);}

  if(state==='play'&&phase==='lead'){ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,0.9)';ctx.font='bold 15px sans-serif';
    ctx.fillText('ボールは内緒で手元に。走者が塁を離れた（緑ライン超え）瞬間にタッチ！ 早/遅は失敗',W/2,44);}
  if(state==='play'&&phase==='result'&&msg){ctx.textAlign='center';ctx.fillStyle=(result==='out'||result==='clean')?'#9ff0b8':'#ff9a9a';ctx.font='bold 20px sans-serif';ctx.fillText(msg,W/2,44);}

  if(state==='title'){
    ctx.fillStyle='rgba(5,10,6,0.78)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='bold 44px sans-serif';ctx.fillText('隠し球',W/2,110);
    ctx.fillStyle='#ffd23e';ctx.font='bold 22px sans-serif';ctx.fillText('Hidden Ball Trick',W/2,146);
    ctx.fillStyle='rgba(255,255,255,0.92)';ctx.font='16px sans-serif';
    ctx.fillText('ボールを持っていないフリ…油断した走者の離塁を突く、野球屈指の奇策',W/2,196);
    ctx.fillStyle='rgba(255,255,255,0.66)';ctx.font='14px sans-serif';
    ctx.fillText('あなたは秘かにボールを隠し持つ野手。走者は投手が持っていると思い、少しずつリードする',W/2,236);
    ctx.fillText('走者が“離塁ライン（緑）”を越えて塁を離れた瞬間にタッチ（タップ/クリック/SPACE）＝アウト',W/2,258);
    ctx.fillText('まだ塁上のうちに動くと仕掛けがバレて戻られる（早すぎ）',W/2,280);
    ctx.fillText('待ち過ぎると走者が気づいて帰塁（遅すぎ）。最も離れた瞬間を突けば高得点',W/2,302);
    ctx.fillText('上級ほどリードが浅く・戻りが速い。3失敗で交代',W/2,324);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で開始',W/2,388);
    ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='14px sans-serif';ctx.fillText('BEST '+best,W/2,420);
  }
  if(state==='over'){
    ctx.fillStyle='rgba(5,10,6,0.84)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#ff6b6b';ctx.font='bold 46px sans-serif';ctx.fillText('3失敗…交代',W/2,222);
    ctx.fillStyle='#fff';ctx.font='bold 40px sans-serif';ctx.fillText('SCORE '+score,W/2,290);
    ctx.fillStyle='rgba(255,255,255,0.85)';ctx.font='19px sans-serif';ctx.fillText('アウト '+outs+'   BEST '+best,W/2,330);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で もう一度',W/2,402);
  }

  if(flash>0.02){ctx.globalAlpha=flash*0.5;ctx.fillStyle=flashCol;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}
  ctx.restore();

  ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,0.4)';ctx.font='12px sans-serif';
  ctx.fillText('走者が離塁ライン（緑）を越えた瞬間にタッチ＝アウト。まだ塁上=早すぎ、戻られる=遅すぎ。3失敗で交代',W/2,H-8);
}

function frame(ts){let dt=ts-last;last=ts;if(dt>60)dt=60;if(dt<0)dt=0;update(dt);render();requestAnimationFrame(frame);}
requestAnimationFrame(frame);

// ---------- test hook ----------
window.__hb={
  start, tag:()=>tagAct(),
  get state(){return state;},
  get score(){return score;},
  get outs(){return outs;},
  get fails(){return fails;},
  get info(){const d=(phase==='lead')?leadDist():tagLead;
    return {state,phase,leadDist:d,threshold,peakLead,runnerOff:(phase==='lead'&&d>=threshold),
      atPeak:(clock>=leadUpT&&clock<=senseT),clock,leadUpT,senseT,retreatT,canTag:(phase==='lead'&&!acted),
      acted,result,outs,fails,lvl};}
};
})();
</script>
</body>
</html>
