<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>独走ブレイクアウェイ (Breakaway Sprint)</title>
<style>
  html,body{margin:0;height:100%;background:#07120b;overflow:hidden;
    font-family:-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  #stage{position:relative;width:100vw;height:100vh;max-width:calc(100vh*1.5);max-height:calc(100vw/1.5);aspect-ratio:900/600;}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;border-radius:6px;}
</style>
</head>
<body>
<div id="wrap"><div id="stage"><canvas id="cv"></canvas></div></div>
<script>
(function(){
const W=900,H=600,cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let DPR=1;
function fit(){DPR=Math.min(2,window.devicePixelRatio||1);cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
fit();addEventListener('resize',fit);

// ---------- audio ----------
let AC=null;function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function tone(f,d,type,v,sweep){const a=ac();if(!a)return;const t=a.currentTime,o=a.createOscillator(),g=a.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(sweep)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+sweep),t+d);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v||0.2,t+0.008);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+0.02);}
function noise(d,v,hp){const a=ac();if(!a)return;const t=a.currentTime,n=Math.floor(a.sampleRate*d),buf=a.createBuffer(1,n,a.sampleRate),ch=buf.getChannelData(0);
  for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource();s.buffer=buf;
  const f=a.createBiquadFilter();f.type='highpass';f.frequency.value=hp||600;const g=a.createGain();g.gain.value=v||0.2;
  s.connect(f);f.connect(g);g.connect(a.destination);s.start(t);s.stop(t+d+0.02);}
const S={
  whistle:()=>{tone(900,0.09,'square',0.05,120);},
  step:()=>{tone(210+Math.random()*60,0.03,'square',0.03);},
  goal:()=>{[620,880,1150].forEach((f,i)=>setTimeout(()=>tone(f,0.12,'triangle',0.17),i*60));},
  big:()=>{[600,800,1000,1250].forEach((f,i)=>setTimeout(()=>tone(f,0.12,'triangle',0.17),i*80));},
  caught:()=>{noise(0.16,0.2,300);setTimeout(()=>{[300,240,180].forEach((f,i)=>setTimeout(()=>tone(f,0.13,'sawtooth',0.12),i*80));},20);},
  streak:()=>{[700,930,1170,1400].forEach((f,i)=>setTimeout(()=>tone(f,0.1,'triangle',0.16),i*60));},
  over:()=>{[440,330,247,175].forEach((f,i)=>setTimeout(()=>tone(f,0.3,'triangle',0.2),i*160));}
};

// ---------- geometry ----------
const START={x:140,y:462}, SHOOT={x:678,y:300}, GOAL={x:824,y:300};
const GY0=250, GY1=350;   // goal mouth

// ---------- tuning (same as the proven mash-race) ----------
const STEP=0.165;   // sprint progress per accepted tap
const TAPCD=52;     // ms cooldown between accepted taps
const BURST=340;    // ms head start before the recovering defender closes

// ---------- state ----------
let state='title', phase='run', plays=0;
let score=0, combo=0, best=+(localStorage.getItem('bw_best')||0);
let outs=0, fails=0, lvl=1;   // outs = breakaway goals
let clock=0, chaseT=1120, tough=false;
let runD=0, lastTap=-999, taps=0, chaseP=0, result=null, resultT=0, msg='', msgOk=false, bob=0, finish=0;
let shake=0, flash=0, flashCol='#fff', last=performance.now();
let parts=[], pops=[];

function rnd(a,b){return a+Math.random()*(b-a);}
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function lerp(a,b,u){return a+(b-a)*u;}
function easeOut(u){return 1-Math.pow(1-u,2);}

function reset(){state='title';score=0;combo=0;outs=0;fails=0;lvl=1;plays=0;result=null;parts=[];pops=[];}

function newPlay(){
  plays++; lvl=Math.min(7,1+Math.floor(outs/4));
  chaseT=clamp(1150-lvl*64,760,1150)+rnd(-40,60);
  tough=Math.random()<clamp(0.2+lvl*0.05,0.2,0.5);
  if(tough)chaseT-=70;
  phase='run'; clock=0; runD=0; lastTap=-999; taps=0; chaseP=0; result=null; resultT=0; msg=''; msgOk=false; bob=0; finish=0;
  S.whistle();
}
function start(){ if(!ac())ac(); if(AC&&AC.state==='suspended')AC.resume(); reset(); state='play'; newPlay(); }

function tap(){
  if(state==='title'){start();return;}
  if(state==='over'){ if(resultT>0.4){reset();start();} return; }
  if(state!=='play'||phase!=='run') return;
  if(clock-lastTap<TAPCD) return;   // cap the effective mash rate
  lastTap=clock; taps++; runD=Math.min(1,runD+STEP); bob=1; if(taps%2===0)S.step();
  if(runD>=1) resolve('goal');
}

function resolve(k){
  phase='result'; result=k; resultT=0; finish=0;
  if(k==='goal'){
    outs++; combo++;
    const margin=1-clamp(chaseP,0,1);     // how clear of the defender you were
    const perfect=margin<0.16;            // caught him breathing down your neck
    let add=Math.round(((tough||perfect)?250:150)*(1+Math.min(9,combo-1)*0.14)); score+=add;
    setTimeout(S.goal,300); if(perfect||tough)setTimeout(S.big,420);
    msgOk=true; flash=1;flashCol='#8affa0';shake=6;
    pop(W/2,240,(perfect?'追走を振り切って独走ゴール！ +':'走り切ってブレイクアウェイ・ゴール！ +')+add,'#d6ffe0');
    if(combo>=2)pop(W/2,150,'コンボ x'+combo,'#ffd24d');
    if(combo>0&&combo%5===0)S.streak();
    msg='ボールを奪って独走——追走のDFを振り切り、GKを外して無人のゴールへ流し込んだ';
  } else {
    fails++; combo=0; msgOk=false; flash=1;flashCol='#ff5b5b';shake=8; S.caught();
    msg='追走のDFに背後から追いつかれ、スライディングでボールを刈られた…もっと速く腕を振れ！';
    pop(W/2,240,'追いつかれた…','#ffb0b0');
  }
  if(fails>=3){ state='over'; resultT=0; S.over(); if(score>best){best=score;localStorage.setItem('bw_best',best);} }
}

// ---------- input ----------
cv.addEventListener('pointerdown',e=>{e.preventDefault();tap();});
addEventListener('keydown',e=>{ if(e.repeat)return;
  if(e.code==='Space'||e.code==='Enter'||e.code==='ArrowRight'||e.code==='KeyF'||e.code==='KeyJ'){e.preventDefault();tap();} });

// ---------- particles ----------
function burst(x,y,c,n,sp){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=rnd(sp*0.3,sp);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:1,c});}}
function pop(x,y,txt,c){pops.push({x,y,txt,c,life:1});}

// ---------- update ----------
function update(dt){
  shake*=Math.pow(0.86,dt/16.7); if(shake<0.3)shake=0;
  flash*=Math.pow(0.9,dt/16.7); bob*=Math.pow(0.8,dt/16.7);
  for(const q of parts){q.vx*=0.96;q.vy=q.vy*0.96+0.28;q.x+=q.vx*dt/16.7;q.y+=q.vy*dt/16.7;q.life-=dt/16.7*0.026;}
  parts=parts.filter(q=>q.life>0);
  for(const q of pops){q.y-=dt/16.7*0.5;q.life-=dt/16.7*0.02;}
  pops=pops.filter(q=>q.life>0);

  if(state!=='play'){ if(state==='over')resultT+=dt/1000; return; }
  if(phase==='run'){ clock+=dt;
    chaseP=clamp((clock-BURST)/(chaseT-BURST),0,1);
    if(runD>=1){ resolve('goal'); return; }
    if(chaseP>=1){ resolve('caught'); return; }
    return; }
  if(phase==='result'){ resultT+=dt/1000; finish=Math.min(1,finish+dt/420);
    if(finish>=1&&result==='goal'&&parts.length<2)burst(GOAL.x,300,'#8affa0',14,6);
    if(resultT>1.6) newPlay(); return; }
}

// ---------- render ----------
function drawField(){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#12703f');g.addColorStop(0.5,'#0f5e34');g.addColorStop(1,'#0c4c2b');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  for(let i=0;i<9;i++){ctx.fillStyle=i%2?'rgba(255,255,255,0.03)':'rgba(0,0,0,0.03)';ctx.fillRect(i*100,0,100,H);}
  // penalty box near the goal (right)
  ctx.strokeStyle='rgba(255,255,255,0.22)';ctx.lineWidth=2;ctx.strokeRect(690,180,150,240);
  ctx.strokeRect(788,246,52,108);
  // goal
  ctx.fillStyle='rgba(255,255,255,0.08)';ctx.fillRect(GOAL.x,GY0,54,GY1-GY0);
  ctx.strokeStyle='rgba(255,255,255,0.32)';ctx.lineWidth=1;
  for(let y=GY0;y<=GY1;y+=11){ctx.beginPath();ctx.moveTo(GOAL.x,y);ctx.lineTo(GOAL.x+54,y);ctx.stroke();}
  for(let x=GOAL.x;x<=GOAL.x+54;x+=13){ctx.beginPath();ctx.moveTo(x,GY0);ctx.lineTo(x,GY1);ctx.stroke();}
  ctx.strokeStyle='#f4f4f4';ctx.lineWidth=5;
  ctx.beginPath();ctx.moveTo(GOAL.x,GY0);ctx.lineTo(GOAL.x,GY1);ctx.stroke();
  ctx.beginPath();ctx.moveTo(GOAL.x,GY0);ctx.lineTo(GOAL.x+54,GY0);ctx.moveTo(GOAL.x,GY1);ctx.lineTo(GOAL.x+54,GY1);ctx.stroke();
}
function runner(x,y,col,lean,tuck){
  ctx.save();ctx.translate(x,y);ctx.rotate(lean||0);
  ctx.fillStyle=col;ctx.beginPath();ctx.ellipse(0,tuck?0:-14,tuck?17:10,tuck?9:15,0,0,6.28);ctx.fill();
  ctx.fillStyle='#f0c9a0';ctx.beginPath();ctx.arc(tuck?-19:0,tuck?-3:-33,7,0,6.28);ctx.fill();
  ctx.restore();
}

function render(){
  ctx.save();
  if(shake>0)ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
  drawField();

  if(state==='play'||state==='over'){
    // keeper on the line
    const kx=GOAL.x-16, ky=lerp(300, (result==='goal'?230:300), (result==='goal'?easeOut(finish):0));
    runner(kx,ky,'#ffd23e',0.0,false);

    // your position along the counter
    const ax=lerp(START.x,SHOOT.x,runD), ay=lerp(START.y,SHOOT.y,runD);
    // recovering defender chasing from behind: trails you, drawing level as his bar fills
    const dp=clamp(chaseP,0,1);
    const dpr=clamp(runD-(1-dp)*0.5,-0.16,1);
    const dx=lerp(START.x,SHOOT.x,dpr)-12, dy=lerp(START.y,SHOOT.y,dpr)+16;
    const caught=(phase==='result'&&result==='caught');
    runner(dx,dy,'#d0403a',caught?0.5:-0.28,caught);

    // the ball at your feet, then into the net on a goal
    let bx=ax+16, by=ay-6;
    if(phase==='result'&&result==='goal'){ const u=easeOut(finish); bx=lerp(SHOOT.x+16,GOAL.x+30,u); by=lerp(SHOOT.y-6,300,u); }
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(bx,by,7.5,0,6.28);ctx.fill();
    ctx.strokeStyle='#222';ctx.lineWidth=1.1;ctx.beginPath();ctx.arc(bx,by,7.5,0.4,2.2);ctx.stroke();

    // you (attacker) sprinting
    runner(ax,ay-Math.abs(Math.sin(taps*1.3))*bob*3,'#2b6fd6',-0.42,false);

    // race bars
    if(state==='play'&&phase==='run'){
      ctx.textAlign='center';
      ctx.fillStyle='rgba(255,220,90,0.96)';ctx.font='bold 22px sans-serif';ctx.fillText('連打して独走！ 追走のDFに追いつかれる前にゴールへ',W/2,44);
      const bw=300,x=W/2-bw/2;
      ctx.fillStyle='rgba(255,255,255,0.14)';ctx.fillRect(x,64,bw,12);
      ctx.fillStyle='#8affa0';ctx.fillRect(x,64,bw*runD,12);
      ctx.fillStyle='rgba(255,255,255,0.85)';ctx.font='11px sans-serif';ctx.textAlign='left';ctx.fillText('あなた',x,60);
      ctx.fillStyle='rgba(255,255,255,0.14)';ctx.fillRect(x,84,bw,10);
      ctx.fillStyle='#ff9a5b';ctx.fillRect(x,84,bw*dp,10);
      ctx.fillStyle='rgba(255,180,120,0.9)';ctx.fillText('追走DF',x,106);
      ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,0.55)';ctx.font='12px sans-serif';ctx.fillText('タップ / SPACE 連打 ＝ 走る（速く連打するほど速く走る）',W/2,H-28);
    }
  }

  for(const q of parts){ctx.globalAlpha=Math.max(0,q.life);ctx.fillStyle=q.c;ctx.beginPath();ctx.arc(q.x,q.y,3.2,0,6.28);ctx.fill();}
  ctx.globalAlpha=1;
  for(const q of pops){ctx.globalAlpha=Math.max(0,q.life);ctx.fillStyle=q.c;ctx.font='bold 21px sans-serif';ctx.textAlign='center';ctx.fillText(q.txt,q.x,q.y);}
  ctx.globalAlpha=1;

  // HUD
  ctx.textAlign='left';ctx.fillStyle='#fff';ctx.font='bold 26px sans-serif';ctx.fillText('SCORE '+score,20,36);
  ctx.textAlign='right';ctx.fillStyle='rgba(255,255,255,0.9)';ctx.font='14px sans-serif';ctx.fillText('ゴール '+outs+'  Lv'+lvl,W-20,24);
  ctx.fillText('失敗',W-96,46);
  for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(W-60+i*20,41,7,0,6.28);ctx.fillStyle=i<fails?'#ff5b5b':'rgba(255,255,255,0.25)';ctx.fill();}
  if(combo>=2){ctx.textAlign='center';ctx.fillStyle='#ffd24d';ctx.font='bold 18px sans-serif';ctx.fillText('コンボ x'+combo,W/2,124);}

  if(state==='play'&&phase==='result'&&msg){ctx.textAlign='center';ctx.fillStyle=msgOk?'#9ff0b8':'#ffb38a';ctx.font='bold 16px sans-serif';ctx.fillText(msg,W/2,300);}

  if(state==='title'){
    ctx.fillStyle='rgba(4,8,4,0.83)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='bold 40px sans-serif';ctx.fillText('独走ブレイクアウェイ',W/2,82);
    ctx.fillStyle='#ffd23e';ctx.font='bold 22px sans-serif';ctx.fillText('Breakaway Sprint',W/2,118);
    ctx.fillStyle='rgba(255,255,255,0.92)';ctx.font='16px sans-serif';
    ctx.fillText('ボールを奪って独走——タップ/SPACEを“連打”して全力疾走、追走のDFに追いつかれる前にゴールへ持ち込め',W/2,178);
    ctx.fillStyle='rgba(255,255,255,0.66)';ctx.font='14px sans-serif';
    ctx.fillText('連打が速いほど自分バー（緑）が伸びる。追走DFバー（橙）が到達する前に緑を振り切ればブレイクアウェイ・ゴール',W/2,218);
    ctx.fillText('連打が遅いと背後から刈られて失敗。ギリギリで振り切るほど大量加点',W/2,242);
    ctx.fillText('上級ほどDFの戻りが速い（橙が速く伸びる）。3回奪われると交代',W/2,266);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で開始',W/2,352);
    ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='14px sans-serif';ctx.fillText('BEST '+best,W/2,386);
  }
  if(state==='over'){
    ctx.fillStyle='rgba(4,8,4,0.85)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#ff6b6b';ctx.font='bold 46px sans-serif';ctx.fillText('3回奪われた…交代',W/2,222);
    ctx.fillStyle='#fff';ctx.font='bold 40px sans-serif';ctx.fillText('SCORE '+score,W/2,290);
    ctx.fillStyle='rgba(255,255,255,0.85)';ctx.font='19px sans-serif';ctx.fillText('ゴール '+outs+'   BEST '+best,W/2,330);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で もう一度',W/2,402);
  }

  if(flash>0.02){ctx.globalAlpha=flash*0.5;ctx.fillStyle=flashCol;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}
  ctx.restore();

  ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,0.4)';ctx.font='12px sans-serif';
  ctx.fillText('独走ブレイクアウェイ：連打で全力疾走、追走DFに追いつかれる前にゴールへ持ち込めば得点。遅いと刈られて失敗、3回で交代',W/2,H-8);
}

function frame(ts){let dt=ts-last;last=ts;if(dt>60)dt=60;if(dt<0)dt=0;update(dt);render();requestAnimationFrame(frame);}
requestAnimationFrame(frame);

// ---------- test hook ----------
window.__bw={
  start, tap,
  get state(){return state;},
  get score(){return score;},
  get outs(){return outs;},
  get fails(){return fails;},
  get info(){return {state,phase,clock,chaseT,tough,runD,chaseP,taps,result,outs,fails,lvl};}
};
})();
</script>
</body>
</html>
