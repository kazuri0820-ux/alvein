<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>こぼれ球を読め (Read the Rebound)</title>
<style>
  html,body{margin:0;height:100%;background:#07100a;overflow:hidden;
    font-family:-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  #stage{position:relative;width:100vw;height:100vh;max-width:calc(100vh*1.5);max-height:calc(100vw/1.5);aspect-ratio:900/600;}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;border-radius:6px;}
</style>
</head>
<body>
<div id="wrap"><div id="stage"><canvas id="cv"></canvas></div></div>
<script>
(function(){
const W=900,H=600,cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let DPR=1;
function fit(){DPR=Math.min(2,window.devicePixelRatio||1);cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
fit();addEventListener('resize',fit);

// ---------- audio ----------
let AC=null;function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function tone(f,d,type,v,sweep){const a=ac();if(!a)return;const t=a.currentTime,o=a.createOscillator(),g=a.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(sweep)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+sweep),t+d);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v||0.2,t+0.008);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+0.02);}
function noise(d,v,hp){const a=ac();if(!a)return;const t=a.currentTime,n=Math.floor(a.sampleRate*d),buf=a.createBuffer(1,n,a.sampleRate),ch=buf.getChannelData(0);
  for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource();s.buffer=buf;
  const f=a.createBiquadFilter();f.type='highpass';f.frequency.value=hp||600;const g=a.createGain();g.gain.value=v||0.2;
  s.connect(f);f.connect(g);g.connect(a.destination);s.start(t);s.stop(t+d+0.02);}
const S={
  shot:()=>{noise(0.05,0.14,600);tone(240,0.05,'square',0.07,-60);},
  block:()=>{noise(0.05,0.18,1400);tone(320,0.04,'square',0.07);},
  pounce:()=>{tone(520,0.07,'triangle',0.09);},
  good:()=>{[660,900,1180].forEach((f,i)=>setTimeout(()=>tone(f,0.11,'triangle',0.16),i*56));},
  big:()=>{[600,800,1000,1250].forEach((f,i)=>setTimeout(()=>tone(f,0.12,'triangle',0.17),i*80));},
  bad:()=>{noise(0.2,0.24,240);tone(150,0.24,'sawtooth',0.13,-50);},
  streak:()=>{[700,930,1170,1400].forEach((f,i)=>setTimeout(()=>tone(f,0.1,'triangle',0.16),i*60));},
  over:()=>{[440,330,247,175].forEach((f,i)=>setTimeout(()=>tone(f,0.3,'triangle',0.2),i*160));}
};

// ---------- geometry ----------
const GOAL={x:452,y:118}, GW=300, GH=72;
const GK={x:452,y:172};
const BLOCK={x:452,y:300};                 // defender who blocks the shot
const YOU={x:452,y:452};                    // you, following up
const LOOSE_L={x:300,y:322}, LOOSE_R={x:604,y:322};
function loosePt(c){ return c==='LEFT'?LOOSE_L:LOOSE_R; }

// ---------- state ----------
let state='title', phase='set', plays=0;
let score=0, combo=0, best=+(localStorage.getItem('rl_best')||0);
let outs=0, fails=0, lvl=1;   // outs = rebounds buried
let clock=0, revealT=520, callWin=980, call='LEFT', tough=false;
let decided=false, pick=null, result=null, resultT=0, msg='', msgOk=false, anim=0;
let shake=0, flash=0, flashCol='#fff', last=performance.now();
let parts=[], pops=[];

function rnd(a,b){return a+Math.random()*(b-a);}
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function lerp(a,b,u){return a+(b-a)*u;}
function easeOut(u){return 1-Math.pow(1-u,2);}

function reset(){state='title';score=0;combo=0;outs=0;fails=0;lvl=1;plays=0;result=null;parts=[];pops=[];}

function newPlay(){
  plays++; lvl=Math.min(7,1+Math.floor(outs/4));
  revealT=clamp(560-lvl*24,360,560);
  callWin=clamp(1020-lvl*70,560,1020);
  tough=Math.random()<clamp(0.2+lvl*0.05,0.2,0.5);
  call=(Math.random()<0.5?'LEFT':'RIGHT');
  phase='set'; clock=0; decided=false; pick=null; result=null; resultT=0; msg=''; msgOk=false; anim=0;
  S.shot();
}
function start(){ if(!ac())ac(); if(AC&&AC.state==='suspended')AC.resume(); reset(); state='play'; newPlay(); }

// break LEFT (←) or RIGHT (→) toward where the ball breaks off the block
function makeCall(c){
  if(state==='title'){start();return;}
  if(state==='over'){ if(resultT>0.4){reset();start();} return; }
  if(state!=='play'||phase!=='set'||decided) return;
  if(clock<revealT){ decided=true; pick=c; resolve('early'); return; }
  decided=true; pick=c;
  resolve(c===call?'good':'wrong');
}

function resolve(k){
  phase='result'; result=k; resultT=0; anim=0;
  if(k==='good'){
    outs++; combo++;
    let add=Math.round((tough?250:150)*(1+Math.min(9,combo-1)*0.14)); score+=add;
    S.pounce(); setTimeout(S.good,140); if(tough)setTimeout(S.big,220);
    msgOk=true; flash=1;flashCol='#8affa0';shake=6; const c=loosePt(call); burst(c.x,c.y,'#8affa0',18,7);
    pop(W/2,250,(tough?'鋭い跳ね返りに反応！こぼれ球をねじ込んだ！ +':'こぼれた方向へ詰めて押し込み——ゴール！ +')+add,'#d6ffe0');
    if(combo>=2)pop(W/2,214,'コンボ x'+combo,'#ffd24d');
    if(combo>0&&combo%5===0)S.streak();
    msg=(call==='LEFT')?'ブロックされた球が左へこぼれた——一歩早く左へ詰め、無人の逆サイドへ流し込んだ！':'弾かれた球が右へ転がった——右へ素早く詰めて、空いたゴールへ押し込んだ！';
  } else {
    fails++; combo=0; msgOk=false; flash=1;flashCol='#ff5b5b';shake=8; S.bad();
    if(k==='early') msg='反応が早い…跳ね返る方向が分かる前に動き、逆へこぼれた球に届かずGKに処理された';
    else if(k==='wrong') msg='逆を突かれた…こぼれ球は反対側へ、詰めた先は無人でGK/DFにクリアされた';
    else msg='反応が遅い…こぼれ球にGKが先に飛び込み、押し込む前に抑えられた';
    pop(W/2,250,(k==='wrong')?'逆へこぼれた…':(k==='early')?'早い…見当違い':'遅い…先に処理された','#ffb0b0');
  }
  if(fails>=3){ state='over'; resultT=0; S.over(); if(score>best){best=score;localStorage.setItem('rl_best',best);} }
}

// ---------- input ----------
const BW=230, BY=506, BH=62, BL=150, BR=520;
cv.addEventListener('pointerdown',e=>{e.preventDefault();
  if(state!=='play'||phase!=='set'){ makeCall('LEFT'); return; }
  const r=cv.getBoundingClientRect(); const x=(e.clientX-r.left)/r.width*W, y=(e.clientY-r.top)/r.height*H;
  if(y>=BY&&y<=BY+BH){ if(x>=BL&&x<=BL+BW){ makeCall('LEFT'); return; } if(x>=BR&&x<=BR+BW){ makeCall('RIGHT'); return; } }
  makeCall(x<W*0.5?'LEFT':'RIGHT');
});
addEventListener('keydown',e=>{ if(e.repeat)return;
  if(e.code==='ArrowLeft'||e.code==='KeyA'){e.preventDefault();makeCall('LEFT');}
  else if(e.code==='ArrowRight'||e.code==='KeyD'){e.preventDefault();makeCall('RIGHT');}
  else if(e.code==='Space'||e.code==='Enter'){e.preventDefault(); if(state!=='play')makeCall('LEFT');} });

// ---------- particles ----------
function burst(x,y,c,n,sp){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=rnd(sp*0.3,sp);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:1,c});}}
function pop(x,y,txt,c){pops.push({x,y,txt,c,life:1});}

// ---------- update ----------
function update(dt){
  shake*=Math.pow(0.86,dt/16.7); if(shake<0.3)shake=0;
  flash*=Math.pow(0.9,dt/16.7);
  for(const p of parts){p.vx*=0.96;p.vy=p.vy*0.96+0.28;p.x+=p.vx*dt/16.7;p.y+=p.vy*dt/16.7;p.life-=dt/16.7*0.026;}
  parts=parts.filter(p=>p.life>0);
  for(const p of pops){p.y-=dt/16.7*0.5;p.life-=dt/16.7*0.02;}
  pops=pops.filter(p=>p.life>0);

  if(state!=='play'){ if(state==='over')resultT+=dt/1000; return; }
  if(phase==='set'){ const before=clock<revealT; clock+=dt;
    if(before&&clock>=revealT)S.block();
    if(!decided && clock>revealT+callWin){ decided=true; resolve('late'); }
    return; }
  if(phase==='result'){ resultT+=dt/1000; anim=Math.min(1,anim+dt/360); if(resultT>1.55) newPlay(); return; }
}

// ---------- render ----------
function drawField(){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#0f5e34');g.addColorStop(0.55,'#0e5230');g.addColorStop(1,'#0c4429');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='rgba(255,255,255,0.03)';for(let i=0;i<6;i++){ if(i%2===0)ctx.fillRect(0,80+i*95,W,95); }
  ctx.strokeStyle='rgba(255,255,255,0.26)';ctx.lineWidth=3;ctx.strokeRect(GOAL.x-250,GOAL.y+GH,500,300);ctx.strokeRect(GOAL.x-120,GOAL.y+GH,240,110);
  ctx.fillStyle='rgba(0,0,0,0.28)';ctx.fillRect(GOAL.x-GW/2-4,GOAL.y-4,GW+8,GH+4);
  ctx.strokeStyle='rgba(255,255,255,0.34)';ctx.lineWidth=1;
  for(let gx=GOAL.x-GW/2;gx<=GOAL.x+GW/2;gx+=16){ctx.beginPath();ctx.moveTo(gx,GOAL.y);ctx.lineTo(gx,GOAL.y+GH);ctx.stroke();}
  for(let gy=GOAL.y;gy<=GOAL.y+GH;gy+=13){ctx.beginPath();ctx.moveTo(GOAL.x-GW/2,gy);ctx.lineTo(GOAL.x+GW/2,gy);ctx.stroke();}
  ctx.strokeStyle='#f2f2f2';ctx.lineWidth=6;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(GOAL.x-GW/2,GOAL.y+GH);ctx.lineTo(GOAL.x-GW/2,GOAL.y);ctx.lineTo(GOAL.x+GW/2,GOAL.y);ctx.lineTo(GOAL.x+GW/2,GOAL.y+GH);ctx.stroke();
  ctx.lineCap='butt';
}
function person(x,y,col,s,lean){s=s||1;lean=lean||0;
  ctx.save();ctx.translate(x,y);ctx.rotate(lean);
  ctx.fillStyle='rgba(0,0,0,0.2)';ctx.beginPath();ctx.ellipse(0,13*s,10*s,4*s,0,0,6.28);ctx.fill();
  ctx.fillStyle=col;ctx.beginPath();ctx.ellipse(0,-14*s,9*s,14*s,0,0,6.28);ctx.fill();
  ctx.fillStyle='#f0c9a0';ctx.beginPath();ctx.arc(0,-31*s,7*s,0,6.28);ctx.fill();
  ctx.restore();
}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

function render(){
  ctx.save();
  if(shake>0)ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
  drawField();

  if(state==='play'||state==='over'){
    const revealed=(phase==='set'&&clock>=revealT)||phase==='result';
    const lp=loosePt(call);

    // GK — slides to cover on wrong/late; beaten on good
    let gkx=GK.x, gky=GK.y;
    if(phase==='result'){ const u=easeOut(anim);
      if(result==='good'){ gkx=GK.x - (call==='LEFT'?-1:1)*0; }                    // stays central, beaten to the side
      else if(result==='wrong'){ gkx=lerp(GK.x,lp.x,u*0.7); gky=lerp(GK.y,lp.y,u*0.5); }
      else if(result==='late'||result==='early'){ gkx=lerp(GK.x,lp.x,u*0.8); gky=lerp(GK.y,lp.y,u*0.6); }
    }
    person(gkx,gky,'#e8c23a',0.92,0);

    // blocking defender
    person(BLOCK.x,BLOCK.y,'#c85049',0.9,0);

    // you (striker) — break toward your pick
    let sp={x:YOU.x,y:YOU.y};
    if(phase==='result'){ const tgt=pick?loosePt(pick):YOU; const u=easeOut(anim);
      sp={x:lerp(YOU.x,tgt.x+ (pick===call?6:0),u), y:lerp(YOU.y,tgt.y+40,u)}; }
    person(sp.x,sp.y,'#2b6fd6',1.0, phase==='result'?(pick==='LEFT'?-0.25:0.25):0);

    // ball
    let b;
    if(phase==='set'){
      if(clock<revealT){ const u=clamp(clock/revealT,0,1); b={x:lerp(YOU.x,BLOCK.x,u), y:lerp(YOU.y-6,BLOCK.y+2,u)}; }     // shot toward the block
      else { const u=easeOut(clamp((clock-revealT)/300,0,1)); b={x:lerp(BLOCK.x,lp.x,u), y:lerp(BLOCK.y,lp.y,u)}; }         // caroms to the loose side
    } else {
      const u=easeOut(anim);
      if(result==='good'){ b={x:lerp(lp.x,GOAL.x+(call==='LEFT'?-70:70),u), y:lerp(lp.y,GOAL.y+GH*0.5,u)}; }               // buried into the open net
      else if(result==='wrong'||result==='late'){ b={x:lerp(lp.x,GK.x,u*0.8), y:lerp(lp.y,GK.y+8,u*0.8)}; }                // gathered by keeper
      else { const other=(call==='LEFT'?LOOSE_R:LOOSE_L); b={x:lerp(BLOCK.x,other.x,u), y:lerp(BLOCK.y,other.y,u)}; }      // early: broke the other way
    }
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(b.x,b.y,8,0,6.28);ctx.fill();
    ctx.strokeStyle='#333';ctx.lineWidth=1.1;ctx.beginPath();ctx.arc(b.x,b.y,8,0.4,2.2);ctx.stroke();

    // reveal arrow tell
    ctx.textAlign='center';
    if(revealed&&phase==='set'){
      ctx.fillStyle='rgba(140,255,160,0.98)';ctx.font='bold 30px sans-serif';
      ctx.fillText(call==='LEFT'?'◀ 左へこぼれた！':'右へこぼれた！ ▶', lp.x, lp.y-26);
    }
    if(state==='play'&&phase==='set'){
      if(clock<revealT){ ctx.fillStyle='rgba(255,220,90,0.95)';ctx.font='bold 20px sans-serif';ctx.fillText('シュートがブロックされる——こぼれる方向を読め！',W/2,44); }
      else { ctx.fillStyle='rgba(255,220,120,0.98)';ctx.font='bold 22px sans-serif';ctx.fillText('こぼれた方へ詰めろ！',W/2,44);
        const p=clamp((clock-revealT)/callWin,0,1),bw=250,x=W/2-bw/2,y=58;
        ctx.fillStyle='rgba(255,255,255,0.18)';ctx.fillRect(x,y,bw,7);ctx.fillStyle=p<0.7?'#8affa0':(p<1?'#ffd24d':'#ff5b5b');ctx.fillRect(x,y,bw*p,7); }
    }
    // guide buttons
    if(state==='play'){
      const active=phase==='set'&&clock>=revealT;
      ctx.fillStyle=active&&call==='LEFT'?'#3aa0ff':(active?'#2b6fd6':'rgba(255,255,255,0.10)');rr(BL,BY,BW,BH,10);ctx.fill();
      ctx.fillStyle=active?'#08130c':'rgba(255,255,255,0.5)';ctx.textAlign='center';ctx.font='bold 19px sans-serif';ctx.fillText('◀ 左へ詰める',BL+BW/2,BY+26);
      ctx.font='11px sans-serif';ctx.fillText('左へこぼれたら（←/A）',BL+BW/2,BY+45);
      ctx.fillStyle=active&&call==='RIGHT'?'#3aa0ff':(active?'#2b6fd6':'rgba(255,255,255,0.10)');rr(BR,BY,BW,BH,10);ctx.fill();
      ctx.fillStyle=active?'#08130c':'rgba(255,255,255,0.5)';ctx.fillText('右へ詰める ▶',BR+BW/2,BY+26);
      ctx.font='11px sans-serif';ctx.fillText('右へこぼれたら（→/D）',BR+BW/2,BY+45);
    }
  }

  for(const p of parts){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,3.2,0,6.28);ctx.fill();}
  ctx.globalAlpha=1;
  for(const p of pops){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.font='bold 21px sans-serif';ctx.textAlign='center';ctx.fillText(p.txt,p.x,p.y);}
  ctx.globalAlpha=1;

  // HUD
  ctx.textAlign='left';ctx.fillStyle='#fff';ctx.font='bold 26px sans-serif';ctx.fillText('SCORE '+score,20,36);
  ctx.textAlign='right';ctx.fillStyle='rgba(255,255,255,0.9)';ctx.font='14px sans-serif';ctx.fillText('押し込み '+outs+'  Lv'+lvl,W-20,24);
  ctx.fillText('失敗',W-92,46);
  for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(W-60+i*20,41,7,0,6.28);ctx.fillStyle=i<fails?'#ff5b5b':'rgba(255,255,255,0.25)';ctx.fill();}
  if(combo>=2){ctx.textAlign='center';ctx.fillStyle='#ffd24d';ctx.font='bold 18px sans-serif';ctx.fillText('コンボ x'+combo,W/2,112);}

  if(state==='play'&&phase==='result'&&msg){ctx.textAlign='center';ctx.fillStyle=msgOk?'#9ff0b8':'#ff9a9a';ctx.font='bold 15px sans-serif';ctx.fillText(msg,W/2,300);}

  if(state==='title'){
    ctx.fillStyle='rgba(3,10,6,0.84)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='bold 40px sans-serif';ctx.fillText('こぼれ球を読め',W/2,80);
    ctx.fillStyle='#ffd23e';ctx.font='bold 22px sans-serif';ctx.fillText('Read the Rebound',W/2,116);
    ctx.fillStyle='rgba(255,255,255,0.92)';ctx.font='16px sans-serif';
    ctx.fillText('シュートがDFにブロックされて“こぼれる”——左右どちらへ跳ね返るかを読み、その方向へ詰めて押し込め',W/2,172);
    ctx.fillStyle='rgba(255,255,255,0.66)';ctx.font='14px sans-serif';
    ctx.fillText('こぼれる方向が判明した瞬間、左へこぼれたら ← / A（左ボタン）・右へこぼれたら → / D（右ボタン）で詰める',W/2,210);
    ctx.fillText('正しい方へ詰めれば無人の逆サイドへ押し込みゴール。逆へ詰めるとGK/DFに処理される',W/2,234);
    ctx.fillText('方向が分かる前に動く＝見当違いで届かず／反応が遅い＝GKに先に抑えられる、いずれも失敗',W/2,258);
    ctx.fillText('鋭く不規則な跳ね返り（tough）を読み切ると大量加点。上級ほど跳ね返りが速く猶予が短い。3失敗で交代',W/2,282);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で開始',W/2,350);
    ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='14px sans-serif';ctx.fillText('BEST '+best,W/2,382);
  }
  if(state==='over'){
    ctx.fillStyle='rgba(3,10,6,0.86)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#ff6b6b';ctx.font='bold 46px sans-serif';ctx.fillText('3失敗…交代',W/2,222);
    ctx.fillStyle='#fff';ctx.font='bold 40px sans-serif';ctx.fillText('SCORE '+score,W/2,290);
    ctx.fillStyle='rgba(255,255,255,0.85)';ctx.font='19px sans-serif';ctx.fillText('押し込み '+outs+'   BEST '+best,W/2,330);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で もう一度',W/2,402);
  }

  if(flash>0.02){ctx.globalAlpha=flash*0.5;ctx.fillStyle=flashCol;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}
  ctx.restore();

  ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,0.4)';ctx.font='12px sans-serif';
  ctx.fillText('こぼれ球を読め：ブロックされた球が左右どちらへ跳ねるかを読んで詰め、無人の逆サイドへ押し込め。逆・早い・遅いは失敗、3失敗で交代',W/2,H-8);
}

function frame(ts){let dt=ts-last;last=ts;if(dt>60)dt=60;if(dt<0)dt=0;update(dt);render();requestAnimationFrame(frame);}
requestAnimationFrame(frame);

// ---------- test hook ----------
window.__rl={
  start, left:()=>makeCall('LEFT'), right:()=>makeCall('RIGHT'),
  get state(){return state;},
  get score(){return score;},
  get outs(){return outs;},
  get fails(){return fails;},
  get info(){return {state,phase,clock,revealT,callWin,call,tough,decided,result,outs,fails,lvl,
    goLeft:(call==='LEFT'),revealed:(clock>=revealT),canAct:(phase==='set'&&!decided)};}
};
})();
