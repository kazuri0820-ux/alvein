<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>フレーミング (Frame the Pitch)</title>
<style>
  html,body{margin:0;height:100%;background:#0a0d16;overflow:hidden;
    font-family:-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  #stage{position:relative;width:100vw;height:100vh;max-width:calc(100vh*1.5);max-height:calc(100vw/1.5);aspect-ratio:900/600;}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;border-radius:6px;}
</style>
</head>
<body>
<div id="wrap"><div id="stage"><canvas id="cv"></canvas></div></div>
<script>
(function(){
const W=900,H=600,cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let DPR=1;
function fit(){DPR=Math.min(2,window.devicePixelRatio||1);cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
fit();addEventListener('resize',fit);

// ---------- audio ----------
let AC=null;function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function tone(f,d,type,v,sweep){const a=ac();if(!a)return;const t=a.currentTime,o=a.createOscillator(),g=a.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(sweep)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+sweep),t+d);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v||0.2,t+0.008);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+0.02);}
function noise(d,v,hp){const a=ac();if(!a)return;const t=a.currentTime,n=Math.floor(a.sampleRate*d),buf=a.createBuffer(1,n,a.sampleRate),ch=buf.getChannelData(0);
  for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource();s.buffer=buf;
  const f=a.createBiquadFilter();f.type='highpass';f.frequency.value=hp||600;const g=a.createGain();g.gain.value=v||0.2;
  s.connect(f);f.connect(g);g.connect(a.destination);s.start(t);s.stop(t+d+0.02);}
const S={
  pop:()=>{noise(0.05,0.18,500);tone(180,0.09,'sine',0.12,-40);},          // mitt catch
  strike:()=>{tone(1500,0.09,'square',0.09);setTimeout(()=>tone(1150,0.13,'square',0.08),90);}, // ump ring-up
  steal:()=>{[720,960,1200].forEach((f,i)=>setTimeout(()=>tone(f,0.11,'triangle',0.18),i*70));},
  ball:()=>{tone(320,0.14,'sine',0.1,-60);},
  bad:()=>{noise(0.12,0.2,300);tone(190,0.16,'sawtooth',0.14,-70);},
  streak:()=>{[660,880,1100,1320].forEach((f,i)=>setTimeout(()=>tone(f,0.1,'triangle',0.16),i*60));},
  over:()=>{[440,330,247,175].forEach((f,i)=>setTimeout(()=>tone(f,0.3,'triangle',0.2),i*160));}
};

// ---------- geometry ----------
const ZX=372,ZY=250,ZW=156,ZH=152, ZR=ZX+ZW, CX=ZX+ZW/2, CY=ZY+ZH/2;
const RELY=96, CATCHY=ZY+ZH; // ball catch line = bottom of zone (plate)

// ---------- state ----------
let state='title', phase='pitch', t=0, plays=0;
let score=0, combo=0, best=+(localStorage.getItem('frame_best')||0);
let steals=0, fails=0, lvl=1;
let clock=0, catchT=980, window0=300, acted=false;
let kind='strike', side=1, decoy=0;                // kind: strike|edge|ball ; side: -1 left / +1 right
let ballX=CX, ballY=RELY, startX=CX, finalX=CX, mitt=0, mittTarget=0;
let result=null, resultT=0, msg='', umpCall='';
let shake=0, flash=0, flashCol='#fff', last=performance.now();
let parts=[], pops=[];

function rnd(a,b){return a+Math.random()*(b-a);}
function chance(p){return Math.random()<p;}
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function lerp(a,b,u){return a+(b-a)*u;}

function params(){ return { catchT:Math.max(560,1000-lvl*62), window:Math.max(128,300-lvl*24), feint:lvl>=3?0.28+lvl*0.05:0 }; }

function reset(){state='title';score=0;combo=0;steals=0;fails=0;lvl=1;plays=0;result=null;parts=[];pops=[];}
function newPitch(){
  plays++; lvl=Math.min(7,1+Math.floor(steals/4));
  const p=params(); catchT=p.catchT; window0=p.window;
  // pick pitch kind: edge (frameable) 42%, strike 29%, ball 29%
  const r=Math.random(); kind = r<0.42?'edge' : r<0.71?'strike':'ball';
  side = chance(0.5)?-1:1;
  if(kind==='strike'){ finalX = CX + rnd(-44,44); }
  else if(kind==='edge'){ finalX = side<0 ? ZX - rnd(6,19) : ZR + rnd(6,19); }
  else { finalX = side<0 ? ZX - rnd(40,64) : ZR + rnd(40,64); }
  startX = CX + rnd(-24,24);
  // decoy: late lateral drift that makes an edge look like a ball or vice-versa (visual only)
  decoy = (p.feint>0 && chance(0.55)) ? (side * rnd(26,44) * (kind==='edge'? -1: 1)) : 0;
  clock=0; acted=false; ballX=startX; ballY=RELY; mitt=0; mittTarget=0;
  result=null; phase='pitch'; msg=''; umpCall='';
}
function start(){ if(!ac())ac(); if(AC&&AC.state==='suspended')AC.resume(); reset(); state='play'; newPitch(); }

// act: 'quiet' (catch as-is) or 'frame' (stick toward zone)
function act(a){
  if(state==='title'){start();return;}
  if(state==='over'){ if(resultT>0.4){reset();start();} return; }
  if(state!=='play'||phase!=='pitch'||acted) return;
  const u=clock-catchT;
  if(u < -window0){ acted=true; resolve('early'); return; }   // stabbed way too early -> muffed
  acted=true; S.pop();
  if(a==='frame'){
    // sweep the mitt toward the zone center to sell the strike
    mittTarget = (CX - finalX)*0.62;
    if(kind==='edge') resolve('stole');
    else resolve('obvious');            // framed a pitch that didn't need it -> ump not fooled
  } else { // quiet
    if(kind==='strike') resolve('take-strike');
    else if(kind==='ball') resolve('take-ball');
    else resolve('missed');             // let a borderline strike go -> called a ball
  }
}

function resolve(kind2){
  phase='result'; result=kind2; resultT=0;
  if(kind2==='stole'){
    steals++; combo++; const fast=Math.abs(clock-catchT)<90;
    const add=Math.round((fast?150:105)*(1+Math.min(9,combo-1)*0.16)); score+=add;
    umpCall='ストライク！'; S.strike(); setTimeout(()=>S.steal(),120);
    flash=1;flashCol='#ffe08a';shake=8; burst(finalX,CATCHY,'#ffe08a',20,6.5);
    pop(CX,ZY-18,'際どい球を盗んだ！ +'+add,'#fff3c4');
    if(fast)pop(CX,ZY-44,'完璧なフレーミング','#ffe08a');
    if(combo>=2)pop(CX,ZY+8,'コンボ x'+combo,'#ffd24d');
    if(combo>0&&combo%5===0)S.streak();
    msg='スティール・ストライク！';
  } else if(kind2==='take-strike'){
    score+=40; umpCall='ストライク'; S.strike();
    burst(finalX,CATCHY,'#bfe6ff',10,4);
    pop(CX,ZY-16,'ど真ん中を確実に +40','#bfe6ff'); msg='ナイスキャッチ';
  } else if(kind2==='take-ball'){
    umpCall='ボール'; S.ball();
    pop(finalX,CATCHY-26,'見極めた','#cfe3ff'); msg='明らかなボールは無理せず';
  } else {
    fails++; combo=0; flash=1;flashCol='#ff5b5b';shake=9; S.bad();
    umpCall='ボール';
    if(kind2==='missed') msg='盗めず…際どい球をボール判定にされた';
    else if(kind2==='obvious') msg='動かしすぎ！露骨でボール判定';
    else if(kind2==='early') msg='早すぎてこぼした';
    else msg='捕り損ね';
    pop(finalX,CATCHY-26,kind2==='obvious'?'露骨！':(kind2==='missed'?'盗めず':'ミット外し'),'#ffb0b0');
  }
  if(fails>=3){ state='over'; resultT=0; S.over(); if(score>best){best=score;localStorage.setItem('frame_best',best);} }
}

// ---------- input ----------
function halfFromEvent(e){ const r=cv.getBoundingClientRect(); const x=(e.clientX-r.left)/r.width; return x<0.5?'quiet':'frame'; }
cv.addEventListener('pointerdown',e=>{e.preventDefault();
  if(state!=='play'){act('quiet');return;}
  act(halfFromEvent(e));
});
addEventListener('keydown',e=>{
  const c=e.code;
  if(c==='Space'||c==='Enter'){e.preventDefault(); if(state!=='play')act('quiet'); else act('quiet'); return;}
  if(c==='ArrowLeft'||c==='KeyA'){e.preventDefault();act('quiet');}
  if(c==='ArrowRight'||c==='KeyD'||c==='ArrowUp'){e.preventDefault();act('frame');}
});

// ---------- particles ----------
function burst(x,y,c,n,sp){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=rnd(sp*0.3,sp);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:1,c});}}
function pop(x,y,txt,c){pops.push({x,y,txt,c,life:1});}

// ---------- update ----------
function update(dt){
  shake*=Math.pow(0.86,dt/16.7); if(shake<0.3)shake=0;
  flash*=Math.pow(0.9,dt/16.7);
  mitt += (mittTarget-mitt)*Math.min(1,dt/16.7*0.18);
  for(const p of parts){p.vx*=0.96;p.vy=p.vy*0.96+0.28;p.x+=p.vx*dt/16.7;p.y+=p.vy*dt/16.7;p.life-=dt/16.7*0.028;}
  parts=parts.filter(p=>p.life>0);
  for(const p of pops){p.y-=dt/16.7*0.5;p.life-=dt/16.7*0.02;}
  pops=pops.filter(p=>p.life>0);

  if(state!=='play'){ if(state==='over')resultT+=dt/1000; return; }
  t+=dt;
  if(phase==='pitch'){
    clock+=dt;
    const u=clamp(clock/catchT,0,1.25);
    const ease=1-Math.pow(1-Math.min(1,u),2.0);
    ballY = lerp(RELY,CATCHY,Math.min(1,u));
    // lateral path -> finalX, with a late decoy bulge that fades out by the catch
    const bulge = decoy * Math.sin(Math.min(1,u)*Math.PI) * (1-Math.min(1,u)*0.85);
    ballX = lerp(startX,finalX,ease) + bulge;
    if(!acted && clock>catchT+window0){ acted=true; resolve('drop'); } // never acted -> muffed
    return;
  }
  if(phase==='result'){
    resultT+=dt/1000;
    if(resultT>1.15 && state==='play') newPitch();
    return;
  }
}

// ---------- render ----------
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function drawScene(){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#16233a');g.addColorStop(0.62,'#0f1a2c');g.addColorStop(1,'#0a1220');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  // dirt / plate area
  ctx.fillStyle='rgba(120,86,60,0.16)';ctx.beginPath();ctx.ellipse(CX,CATCHY+70,260,120,0,0,6.28);ctx.fill();
  // home plate
  ctx.fillStyle='#e9edf2';ctx.beginPath();
  ctx.moveTo(CX-46,CATCHY+40);ctx.lineTo(CX+46,CATCHY+40);ctx.lineTo(CX+46,CATCHY+62);ctx.lineTo(CX,CATCHY+80);ctx.lineTo(CX-46,CATCHY+62);ctx.closePath();ctx.fill();
}
function drawZone(){
  // strike zone box
  ctx.save();
  ctx.strokeStyle='rgba(255,255,255,0.5)';ctx.lineWidth=2.5;ctx.setLineDash([7,6]);
  ctx.strokeRect(ZX,ZY,ZW,ZH);
  ctx.setLineDash([]);
  ctx.strokeStyle='rgba(255,255,255,0.14)';ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(ZX+ZW/3,ZY);ctx.lineTo(ZX+ZW/3,ZY+ZH);ctx.moveTo(ZX+2*ZW/3,ZY);ctx.lineTo(ZX+2*ZW/3,ZY+ZH);
  ctx.moveTo(ZX,ZY+ZH/3);ctx.lineTo(ZR,ZY+ZH/3);ctx.moveTo(ZX,ZY+2*ZH/3);ctx.lineTo(ZR,ZY+2*ZH/3);ctx.stroke();
  ctx.restore();
  ctx.fillStyle='rgba(255,255,255,0.4)';ctx.font='12px sans-serif';ctx.textAlign='center';
  ctx.fillText('ストライクゾーン',CX,ZY-6);
}
function drawMitt(x,y){
  ctx.fillStyle='rgba(0,0,0,0.28)';ctx.beginPath();ctx.ellipse(x,y+16,26,8,0,0,6.28);ctx.fill();
  ctx.fillStyle='#6a4a2a';ctx.beginPath();ctx.arc(x,y,22,0,6.28);ctx.fill();
  ctx.fillStyle='#83602f';ctx.beginPath();ctx.arc(x,y,15,0,6.28);ctx.fill();
  ctx.fillStyle='#5a3d20';ctx.beginPath();ctx.arc(x-6,y-6,4,0,6.28);ctx.fill();
}

function render(){
  ctx.save();
  if(shake>0)ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
  drawScene();
  drawZone();

  if(state==='play'){
    const catching = (phase==='result');
    const mx = CX + mitt, my = CATCHY;
    // ball
    const bx = catching ? (result==='stole'||result==='take-strike'? finalX+mitt : finalX) : ballX;
    const by = catching ? CATCHY : ballY;
    if(!catching || result==='take-ball'){
      // shadow grows as it nears
      const sc=clamp(ballY/CATCHY,0.2,1);
      ctx.fillStyle='rgba(0,0,0,0.22)';ctx.beginPath();ctx.ellipse(bx,CATCHY+30,10*sc,4*sc,0,0,6.28);ctx.fill();
    }
    // draw mitt (behind ball on catch)
    drawMitt(mx,my);
    // ball
    const br=lerp(6,10,clamp(ballY/CATCHY,0,1));
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(bx,by,br,0,6.28);ctx.fill();
    ctx.strokeStyle='#d23c3c';ctx.lineWidth=1.4;ctx.beginPath();ctx.arc(bx-br*0.4,by,br*0.8,-0.7,0.7);ctx.stroke();ctx.beginPath();ctx.arc(bx+br*0.4,by,br*0.8,Math.PI-0.7,Math.PI+0.7);ctx.stroke();

    // catch-timing ring
    if(phase==='pitch'){
      const u=clock/catchT;
      const rad=lerp(70,22,clamp(u,0,1));
      ctx.strokeStyle=Math.abs(clock-catchT)<window0?'rgba(150,240,170,0.9)':'rgba(255,255,255,0.32)';
      ctx.lineWidth=3;ctx.beginPath();ctx.arc(CX,CATCHY,rad,0,6.28);ctx.stroke();
    }
    // ump call
    if(umpCall){ctx.textAlign='center';ctx.font='bold 30px sans-serif';
      ctx.fillStyle=umpCall==='ボール'?'#8fb7ff':'#ffe08a';ctx.fillText(umpCall,CX,ZY+ZH+92);}
  }

  for(const p of parts){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,3.2,0,6.28);ctx.fill();}
  ctx.globalAlpha=1;
  for(const p of pops){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.font='bold 22px sans-serif';ctx.textAlign='center';ctx.fillText(p.txt,p.x,p.y);}
  ctx.globalAlpha=1;

  // HUD
  ctx.textAlign='left';ctx.fillStyle='#fff';ctx.font='bold 26px sans-serif';ctx.fillText('SCORE '+score,20,36);
  ctx.textAlign='right';ctx.fillStyle='rgba(255,255,255,0.85)';ctx.font='14px sans-serif';ctx.fillText('スティール '+steals+'  Lv'+lvl,W-20,24);
  ctx.fillText('失敗',W-92,46);
  for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(W-60+i*20,41,7,0,6.28);ctx.fillStyle=i<fails?'#ff5b5b':'rgba(255,255,255,0.22)';ctx.fill();}
  if(combo>=2){ctx.textAlign='center';ctx.fillStyle='#ffd24d';ctx.font='bold 18px sans-serif';ctx.fillText('コンボ x'+combo,CX,H-64);}

  if(state==='play'&&phase==='pitch'){ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,0.85)';ctx.font='bold 15px sans-serif';
    ctx.fillText('際どい球＝流して盗む（右/→/D）　ど真ん中・明らかなボール＝そのまま捕る（左/←/A）',CX,44);}
  if(state==='play'&&phase==='result'&&msg){ctx.textAlign='center';ctx.fillStyle=(result==='stole'||result==='take-strike')?'#9ff0b8':(result==='take-ball'?'#cfe3ff':'#ff9a9a');
    ctx.font='bold 20px sans-serif';ctx.fillText(msg,CX,44);}

  if(state==='title'){
    ctx.fillStyle='rgba(6,10,18,0.72)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='bold 46px sans-serif';ctx.fillText('フレーミング',W/2,138);
    ctx.fillStyle='#ffd23e';ctx.font='bold 22px sans-serif';ctx.fillText('Frame the Pitch',W/2,174);
    ctx.fillStyle='rgba(255,255,255,0.9)';ctx.font='16px sans-serif';
    ctx.fillText('捕手のフレーミング。ミットの捕り方で“際どい球”をストライクに盗め',W/2,224);
    ctx.fillStyle='rgba(255,255,255,0.66)';ctx.font='14px sans-serif';
    ctx.fillText('ゾーンをかすめる“際どい球”はミットを枠へ静かに流して捕る（右クリック/→/D）＝ストライクを盗む',W/2,262);
    ctx.fillText('ど真ん中や明らかなボールは無理せずそのまま捕る（左クリック/←/A）',W/2,284);
    ctx.fillText('際どい球を見送るとボール判定、露骨に動かすと審判に見抜かれてボール、捕球が早すぎるとこぼす',W/2,306);
    ctx.fillText('ボールが枠に届く“瞬間”に判断。上級ほど速く、際どい球は揺れて紛らわしい。3失敗で交代',W/2,328);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で開始',W/2,398);
    ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='14px sans-serif';ctx.fillText('BEST '+best+'　　左=そのまま捕る / 右=流して盗む',W/2,432);
  }
  if(state==='over'){
    ctx.fillStyle='rgba(6,10,18,0.8)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#ff6b6b';ctx.font='bold 46px sans-serif';ctx.fillText('3失敗…交代',W/2,222);
    ctx.fillStyle='#fff';ctx.font='bold 40px sans-serif';ctx.fillText('SCORE '+score,W/2,290);
    ctx.fillStyle='rgba(255,255,255,0.85)';ctx.font='19px sans-serif';ctx.fillText('スティール '+steals+'   BEST '+best,W/2,330);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で もう一度',W/2,402);
  }

  if(flash>0.02){ctx.globalAlpha=flash*0.5;ctx.fillStyle=flashCol;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}
  ctx.restore();

  ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,0.4)';ctx.font='12px sans-serif';
  ctx.fillText('際どい球は右＝流して盗む、ど真ん中/明らかなボールは左＝そのまま捕る。見送り・露骨・早捕りは失敗。3失敗で交代',W/2,H-8);
}

function frame(ts){let dt=ts-last;last=ts;if(dt>60)dt=60;if(dt<0)dt=0;update(dt);render();requestAnimationFrame(frame);}
requestAnimationFrame(frame);

// ---------- test hook ----------
window.__fp={
  start, act:(a)=>act(a),
  get state(){return state;},
  get score(){return score;},
  get steals(){return steals;},
  get fails(){return fails;},
  get info(){return {state,phase,kind,side,clock,catchT,window0,acted,result,steals,fails,lvl,
    near:(phase==='pitch'&&Math.abs(clock-catchT)<window0)};}
};
})();
</script>
</body>
</html>
