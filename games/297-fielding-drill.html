<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ノック (Field 'Em)</title>
<style>
  html,body{margin:0;height:100%;background:#0b0a06;overflow:hidden;
    font-family:-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  #stage{position:relative;width:100vw;height:100vh;max-width:calc(100vh*1.5);max-height:calc(100vw/1.5);aspect-ratio:900/600;}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;border-radius:6px;}
</style>
</head>
<body>
<div id="wrap"><div id="stage"><canvas id="cv"></canvas></div></div>
<script>
(function(){
const W=900,H=600,cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let DPR=1;
function fit(){DPR=Math.min(2,window.devicePixelRatio||1);cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
fit();addEventListener('resize',fit);

// ---------- audio ----------
let AC=null;function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function tone(f,d,type,v,sweep){const a=ac();if(!a)return;const t=a.currentTime,o=a.createOscillator(),g=a.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(sweep)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+sweep),t+d);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v||0.2,t+0.008);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+0.02);}
function noise(d,v,hp){const a=ac();if(!a)return;const t=a.currentTime,n=Math.floor(a.sampleRate*d),buf=a.createBuffer(1,n,a.sampleRate),ch=buf.getChannelData(0);
  for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource();s.buffer=buf;
  const f=a.createBiquadFilter();f.type='highpass';f.frequency.value=hp||600;const g=a.createGain();g.gain.value=v||0.2;
  s.connect(f);f.connect(g);g.connect(a.destination);s.start(t);s.stop(t+d+0.02);}
const S={
  hit:()=>{noise(0.04,0.1,400);tone(240,0.05,'square',0.06);},
  field:(n)=>{noise(0.03,0.1,700);tone(520+Math.min(9,n)*36,0.05,'square',0.09);},
  streak:()=>{[700,930,1170,1400].forEach((f,i)=>setTimeout(()=>tone(f,0.1,'triangle',0.16),i*60));},
  err:()=>{noise(0.14,0.16,300);tone(160,0.16,'sawtooth',0.1,-40);},
  over:()=>{[440,330,247,175].forEach((f,i)=>setTimeout(()=>tone(f,0.3,'triangle',0.2),i*160));}
};

// ---------- geometry ----------
const ME={x:450,y:430}, HOME={x:450,y:96};
const SPD=150;   // lateral lane offset

// ---------- state ----------
let state='title', phase='live', plays=0;
let score=0, combo=0, best=+(localStorage.getItem('knk_best')||0);
let outs=0, fails=0, lvl=1;   // outs = clean fields, fails = errors
let ballT=0, fieldT=650, w=160, kind='C', tough=false;
let firstAct=null, actDir=null, resolved=null, quality=0;
let settleT=0, settleMs=0, msg='', msgOk=false, reachU=0;
let shake=0, flash=0, flashCol='#fff', last=performance.now();
let parts=[], pops=[];

function rnd(a,b){return a+Math.random()*(b-a);}
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function lerp(a,b,u){return a+(b-a)*u;}
function easeOut(u){return 1-Math.pow(1-u,2);}

const KINDS=['L','C','R','P'];
function target(k){ if(k==='L')return{x:ME.x-SPD,y:ME.y}; if(k==='R')return{x:ME.x+SPD,y:ME.y}; if(k==='P')return{x:ME.x,y:ME.y-130}; return{x:ME.x,y:ME.y}; }

function reset(){state='title';score=0;combo=0;outs=0;fails=0;lvl=1;plays=0;resolved=null;parts=[];pops=[];}

function newBall(){
  plays++; lvl=Math.min(7,1+Math.floor(outs/4));
  fieldT=clamp(720-lvl*32,480,720);
  w=clamp(168-lvl*10,100,168);
  tough=Math.random()<clamp(0.2+lvl*0.03,0.2,0.44);
  if(tough)w=Math.round(w*0.82);
  const r=Math.random();
  kind = r<0.24?'P': (r<0.49?'L': r<0.74?'R':'C');
  firstAct=null; actDir=null; resolved=null; quality=0; reachU=0;
  phase='live'; ballT=0; S.hit();
}
function start(){ if(!ac())ac(); if(AC&&AC.state==='suspended')AC.resume(); reset(); state='play'; newBall(); }

function act(dir){
  if(state==='title'){start();return;}
  if(state==='over'){ if(settleT>0.4){reset();start();} return; }
  if(state!=='play'||phase!=='live'||firstAct!==null) return;
  if(dir!=='L'&&dir!=='C'&&dir!=='R'&&dir!=='P') return;
  firstAct=ballT; actDir=dir;
  if(ballT<fieldT-w){ resolve('early'); return; }
  if(dir!==kind){ resolve('wrong'); return; }
  quality=1-Math.abs(ballT-fieldT)/w; resolve('good');
}

function resolve(k){
  const t=target(kind);
  if(k==='good'){
    outs++; combo++;
    const mult=1+Math.min(9,combo-1)*0.14;
    const add=Math.round((30+Math.round(quality*40)+(tough?25:0))*mult); score+=add;
    S.field(combo); resolved='good'; msgOk=true;
    burst(t.x,t.y,'#8affa0',10,5);
    if(combo>0&&combo%5===0){ S.streak(); pop(W/2,150,'ノーミス '+combo+'連続！','#ffd24d'); }
    settleMs=155;
  } else {
    fails++; combo=0; resolved=k; msgOk=false;
    S.err(); flash=0.8;flashCol='#ff5b5b';shake=7;
    burst(t.x,t.y,'#ff7a6a',14,6);
    msg = k==='early'?'突っ込み過ぎ…球が来る前にグラブを出してトンネル':(k==='wrong'?'逆をつかれた…方向を間違えて弾く':'一歩遅れて後逸…');
    pop(ME.x,ME.y-70,'エラー…','#ffb0b0');
    settleMs=380;
  }
  phase='settle'; settleT=0;
}

// ---------- input ----------
cv.addEventListener('pointerdown',e=>{e.preventDefault();
  if(state!=='play'){ act('C'); return; }
  const r=cv.getBoundingClientRect(); const x=(e.clientX-r.left)/r.width*W, y=(e.clientY-r.top)/r.height*H;
  if(y<H*0.42) act('P'); else if(x<W*0.38) act('L'); else if(x>W*0.62) act('R'); else act('C');
});
addEventListener('keydown',e=>{ if(e.repeat)return;
  if(e.code==='ArrowLeft'||e.code==='KeyA'){e.preventDefault();act('L');}
  else if(e.code==='ArrowRight'||e.code==='KeyD'){e.preventDefault();act('R');}
  else if(e.code==='ArrowUp'||e.code==='KeyW'){e.preventDefault();act('P');}
  else if(e.code==='ArrowDown'||e.code==='KeyS'||e.code==='Space'||e.code==='Enter'){e.preventDefault(); if(state!=='play')act('C'); else act('C');} });

// ---------- particles ----------
function burst(x,y,c,n,sp){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=rnd(sp*0.3,sp);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:1,c});}}
function pop(x,y,txt,c){pops.push({x,y,txt,c,life:1});}

// ---------- update ----------
function update(dt){
  shake*=Math.pow(0.86,dt/16.7); if(shake<0.3)shake=0;
  flash*=Math.pow(0.9,dt/16.7);
  for(const p of parts){p.vx*=0.96;p.vy=p.vy*0.96+0.28;p.x+=p.vx*dt/16.7;p.y+=p.vy*dt/16.7;p.life-=dt/16.7*0.026;}
  parts=parts.filter(p=>p.life>0);
  for(const p of pops){p.y-=dt/16.7*0.5;p.life-=dt/16.7*0.02;}
  pops=pops.filter(p=>p.life>0);

  if(state!=='play'){ if(state==='over')settleT+=dt/1000; return; }
  if(phase==='live'){ ballT+=dt;
    if(!firstAct && ballT>fieldT+w){ firstAct=ballT; resolve('late'); }
    return; }
  if(phase==='settle'){ settleT+=dt; reachU=Math.min(1,reachU+dt/180);
    if(settleT>=settleMs){
      if(fails>=3){ state='over'; settleT=0; S.over(); if(score>best){best=score;localStorage.setItem('knk_best',best);} return; }
      newBall();
    }
    return; }
}

// ---------- render ----------
function drawField(){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#1f6b38');g.addColorStop(0.5,'#176033');g.addColorStop(1,'#0f5029');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#8a5c33';ctx.beginPath();ctx.ellipse(ME.x,ME.y+10,250,120,0,0,6.28);ctx.fill();
  // lane guides
  ctx.strokeStyle='rgba(255,255,255,0.12)';ctx.lineWidth=2;ctx.setLineDash([6,8]);
  for(const k of ['L','C','R']){ const t=target(k); ctx.beginPath();ctx.moveTo(HOME.x,HOME.y);ctx.lineTo(t.x,t.y);ctx.stroke(); }
  ctx.setLineDash([]);
}

function render(){
  ctx.save();
  if(shake>0)ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
  drawField();

  if(state==='play'||state==='over'){
    // coach at home
    ctx.fillStyle='#e8e4d8';ctx.beginPath();ctx.ellipse(HOME.x,HOME.y,11,14,0,0,6.28);ctx.fill();
    ctx.fillStyle='#f0c9a0';ctx.beginPath();ctx.arc(HOME.x,HOME.y-20,8,0,6.28);ctx.fill();

    const t=target(kind);
    // fielder reaching on result
    let fx=ME.x,fy=ME.y;
    if(phase==='settle'&&resolved==='good'){ fx=lerp(ME.x,t.x,easeOut(reachU)); fy=lerp(ME.y,t.y,easeOut(reachU)); }
    ctx.fillStyle='#2b6fd6';ctx.beginPath();ctx.ellipse(fx,fy,13,17,0,0,6.28);ctx.fill();
    ctx.fillStyle='#f0c9a0';ctx.beginPath();ctx.arc(fx,fy-24,10,0,6.28);ctx.fill();

    // ball
    let bx,by;
    if(phase==='live'){ const u=clamp(ballT/fieldT,0,1); bx=lerp(HOME.x,t.x,easeOut(u)); by=lerp(HOME.y,t.y,easeOut(u)) - (kind==='P'? Math.sin(Math.min(1,u)*Math.PI)*90 : 0); }
    else { bx=(resolved==='good')?fx:(t.x); by=(resolved==='good')?fy-4:t.y; }
    ctx.fillStyle='rgba(0,0,0,0.18)';ctx.beginPath();ctx.ellipse(bx,by+9,7,3,0,0,6.28);ctx.fill();
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(bx,by,7,0,6.28);ctx.fill();
    ctx.strokeStyle='#c33';ctx.lineWidth=1.1;ctx.beginPath();ctx.arc(bx,by,7,0.4,2.2);ctx.stroke();

    // field window ring at the target
    if(state==='play'&&phase==='live'){ const near=ballT>=fieldT-w-100;
      if(near){ const open=ballT>=fieldT-w&&ballT<=fieldT+w;
        ctx.strokeStyle=open?'#7dff9a':'rgba(255,225,120,0.85)';ctx.lineWidth=3;
        ctx.beginPath();ctx.arc(t.x,t.y,20,0,6.28);ctx.stroke(); }
      // direction hint label
      ctx.fillStyle='rgba(255,255,255,0.85)';ctx.font='bold 13px sans-serif';ctx.textAlign='center';
      ctx.fillText(kind==='L'?'左':kind==='R'?'右':kind==='P'?'ポップ':'正面', t.x, t.y-28);
    }

    // cue
    ctx.textAlign='center';
    if(state==='play'&&phase==='live'){
      ctx.fillStyle='rgba(255,220,90,0.96)';ctx.font='bold 22px sans-serif';ctx.fillText('ノック！ 打球の方向に合わせて捕れ',W/2,44);
      ctx.fillStyle='rgba(255,255,255,0.6)';ctx.font='13px sans-serif';ctx.fillText('← 左 ・ ↓ 正面 ・ → 右 ・ ↑ ポップ（画面の左/中/右/上タップ）＝届く瞬間に',W/2,H-28);
    }
  }

  for(const p of parts){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,3.2,0,6.28);ctx.fill();}
  ctx.globalAlpha=1;
  for(const p of pops){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.font='bold 20px sans-serif';ctx.textAlign='center';ctx.fillText(p.txt,p.x,p.y);}
  ctx.globalAlpha=1;

  // HUD
  ctx.textAlign='left';ctx.fillStyle='#fff';ctx.font='bold 26px sans-serif';ctx.fillText('SCORE '+score,20,36);
  ctx.textAlign='right';ctx.fillStyle='rgba(255,255,255,0.9)';ctx.font='14px sans-serif';ctx.fillText('好捕 '+outs+'  Lv'+lvl,W-20,24);
  ctx.fillText('エラー',W-98,46);
  for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(W-60+i*20,41,7,0,6.28);ctx.fillStyle=i<fails?'#ff5b5b':'rgba(255,255,255,0.25)';ctx.fill();}
  if(combo>=2){ctx.textAlign='center';ctx.fillStyle='#ffd24d';ctx.font='bold 20px sans-serif';ctx.fillText('コンボ x'+combo,W/2,120);}

  if(state==='play'&&phase==='settle'&&!msgOk&&msg){ctx.textAlign='center';ctx.fillStyle='#ff9a9a';ctx.font='bold 17px sans-serif';ctx.fillText(msg,W/2,H-58);}

  if(state==='title'){
    ctx.fillStyle='rgba(6,5,3,0.82)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='bold 42px sans-serif';ctx.fillText('ノック',W/2,90);
    ctx.fillStyle='#ffd23e';ctx.font='bold 22px sans-serif';ctx.fillText("Field 'Em",W/2,126);
    ctx.fillStyle='rgba(255,255,255,0.92)';ctx.font='16px sans-serif';
    ctx.fillText('コーチのノック！ 次々に飛んでくる打球の方向に反応して、テンポよく捕り続けろ',W/2,182);
    ctx.fillStyle='rgba(255,255,255,0.66)';ctx.font='14px sans-serif';
    ctx.fillText('打球の方向（左/正面/右/ポップ）を見て、届く“緑リング”の瞬間に対応方向を押す',W/2,220);
    ctx.fillText('← 左ゴロ ・ ↓ 正面ゴロ ・ → 右ゴロ ・ ↑ ポップフライ（画面の左/中/右/上タップ）',W/2,244);
    ctx.fillText('ジャストで捕るほどテンポ（コンボ）が上がり、5連続ごとにノーミス・ボーナス',W/2,268);
    ctx.fillText('突っ込み過ぎ／方向ミス／後逸はエラー。上級ほど打球が速く窓が狭い。3エラーで交代',W/2,292);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で開始',W/2,360);
    ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='14px sans-serif';ctx.fillText('BEST '+best,W/2,392);
  }
  if(state==='over'){
    ctx.fillStyle='rgba(6,5,3,0.84)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#ff6b6b';ctx.font='bold 46px sans-serif';ctx.fillText('3エラー…交代',W/2,222);
    ctx.fillStyle='#fff';ctx.font='bold 40px sans-serif';ctx.fillText('SCORE '+score,W/2,290);
    ctx.fillStyle='rgba(255,255,255,0.85)';ctx.font='19px sans-serif';ctx.fillText('好捕 '+outs+'   BEST '+best,W/2,330);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で もう一度',W/2,402);
  }

  if(flash>0.02){ctx.globalAlpha=flash*0.5;ctx.fillStyle=flashCol;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}
  ctx.restore();

  ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,0.4)';ctx.font='12px sans-serif';
  ctx.fillText('ノック：飛んでくる打球の方向（左/正面/右/ポップ）に合わせ、届く瞬間（緑リング）に対応方向を押して捕る。突っ込み/方向ミス/後逸はエラー、3つで交代',W/2,H-8);
}

function frame(ts){let dt=ts-last;last=ts;if(dt>60)dt=60;if(dt<0)dt=0;update(dt);render();requestAnimationFrame(frame);}
requestAnimationFrame(frame);

// ---------- test hook ----------
window.__knk={
  start, act:(d)=>act(d),
  get state(){return state;},
  get score(){return score;},
  get outs(){return outs;},
  get fails(){return fails;},
  get info(){return {state,phase,ballT,fieldT,w,kind,firstAct,resolved,tough,outs,fails,lvl,
    canField:(phase==='live'&&firstAct===null&&ballT>=fieldT-w&&ballT<=fieldT+w)};}
};
})();
</script>
</body>
</html>
