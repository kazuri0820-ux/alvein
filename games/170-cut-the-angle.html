<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>アングルプレー (Cut the Angle)</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;background:#07110b;overflow:hidden;font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",system-ui,sans-serif}
  #wrap{width:100%;height:100%;display:flex;align-items:center;justify-content:center}
  #stage{position:relative;width:min(100vw,calc(100vh*1.5));aspect-ratio:900/600;max-width:900px;
    box-shadow:0 10px 60px rgba(0,0,0,.6);border-radius:10px;overflow:hidden;touch-action:none}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
  #hint{position:absolute;left:0;bottom:6px;width:100%;text-align:center;color:#cfe;
    font-size:12px;opacity:.55;pointer-events:none;text-shadow:0 1px 3px #000}
</style>
</head>
<body>
<div id="wrap"><div id="stage">
  <canvas id="cv"></canvas>
  <div id="hint">GKを操作（ドラッグ / 矢印）。ボールとゴール中央を結ぶ線上に、適度に前へ出て角度を消せ。深いと角度、出過ぎるとループ、ズレると逆を撃たれる</div>
</div></div>
<script>
(()=>{
const cv=document.getElementById('cv'), g=cv.getContext('2d');
const W=900,H=600;
let DPR=1;
function fit(){ DPR=Math.min(2,window.devicePixelRatio||1); cv.width=W*DPR; cv.height=H*DPR; g.setTransform(DPR,0,0,DPR,0,0); }
fit(); addEventListener('resize',fit);

// ---------- audio ----------
let AC=null;
function ac(){ if(!AC){ try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){} } return AC; }
function tone(f,d,t,v,sweep){ const a=ac(); if(!a)return; const o=a.createOscillator(),gg=a.createGain();
  o.type=t||'sine'; o.frequency.value=f; if(sweep) o.frequency.exponentialRampToValueAtTime(Math.max(20,sweep),a.currentTime+d);
  gg.gain.setValueAtTime(0.0001,a.currentTime); gg.gain.exponentialRampToValueAtTime(v||0.2,a.currentTime+0.012);
  gg.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+d); o.connect(gg).connect(a.destination);
  o.start(); o.stop(a.currentTime+d+0.02); }
function noise(d,v,hp){ const a=ac(); if(!a)return; const n=a.createBuffer(1,a.sampleRate*d,a.sampleRate); const ch=n.getChannelData(0);
  for(let i=0;i<ch.length;i++) ch[i]=(Math.random()*2-1)*(1-i/ch.length);
  const s=a.createBufferSource(); s.buffer=n; const f=a.createBiquadFilter(); f.type='highpass'; f.frequency.value=hp||600;
  const gg=a.createGain(); gg.gain.value=v||0.15; s.connect(f).connect(gg).connect(a.destination); s.start(); }
const S={
  dribble(){ noise(0.03,0.06,600); },
  shot(){ noise(0.05,0.2,300); tone(180,0.06,'square',0.1,80); },
  save(){ noise(0.08,0.24,500); tone(320,0.09,'square',0.11,140); setTimeout(()=>tone(560,0.09,'triangle',0.11,760),70); },
  great(){ tone(660,0.08,'triangle',0.13,1000); setTimeout(()=>tone(1000,0.1,'triangle',0.12,1360),80); setTimeout(()=>tone(1360,0.12,'triangle',0.1,1700),170); },
  goal(){ noise(0.2,0.22,300); tone(200,0.2,'sawtooth',0.14,70); },
  over(){ tone(300,0.5,'sawtooth',0.16,90); setTimeout(()=>tone(200,0.6,'sawtooth',0.14,60),160); },
};

// ---------- geometry ----------
const GX0=372, GX1=528, GY=560, GC={x:450,y:560};
const MIND=40, MAXD=98, COVTOL=42;

// ---------- state ----------
let state='title';
let parts=[], pops=[];
let score, combo, best, lvl, conceded, saves;
let play=null, t=0;
let flash=0, shakeT=0;
let ptr=null;
try{ best=+localStorage.getItem('ang_best')||0; }catch(e){ best=0; }

const crowd=[]; { const cc=['#e6b48f','#9bd0e6','#e6dc8f','#c9a0d8','#8fd8bd','#f0f0f0']; for(let i=0;i<200;i++) crowd.push({x:(i*31.3)%W, y:2+((i*57)%40), c:cc[i%cc.length]}); }
function clamp(v,a,b){ return v<a?a:v>b?b:v; }
function rnd(a,b){ return a+Math.random()*(b-a); }
function chance(p){ return Math.random()<p; }
function lerp(a,b,u){ return {x:a.x+(b.x-a.x)*u, y:a.y+(b.y-a.y)*u}; }
function segDist(px,py,ax,ay,bx,by){ const dx=bx-ax,dy=by-ay; const L=dx*dx+dy*dy||1; let u=((px-ax)*dx+(py-ay)*dy)/L; const cx=ax+dx*u,cy=ay+dy*u; return Math.hypot(px-cx,py-cy); }

function reset(){ parts=[]; pops=[]; score=0; combo=0; lvl=0; conceded=0; saves=0; newPlay(); }
function newPlay(){
  t=0;
  const approachT=clamp(2500 - lvl*180, 1300, 2500);
  const side=chance(0.5)?-1:1;
  const sx=450+side*rnd(180,340);
  const shootX=clamp(450+side*rnd(90,240), 280, 620), shootY=rnd(378,424);
  play={ phase:'approach', approachT, deadline:approachT,
    ball:{x:sx,y:190,sx,sy:190,tx:shootX,ty:shootY}, gk:{x:450,y:534,tx:450,ty:534},
    result:null, applied:false, resT:0, pend:null, pendDelay:0, shotTo:null, shotT:0 };
  S.dribble();
}
function optPos(){ const p=play; const B=p.ball; // point on B->GC line at depth ~66
  const dx=GC.x-B.x, dy=GC.y-B.y, L=Math.hypot(dx,dy)||1; const depth=(MIND+MAXD)/2;
  return { x: GC.x - dx/L*depth, y: GC.y - dy/L*depth }; }
function evalPos(){ const p=play; const B=p.ball, G=p.gk;
  const lateralErr=segDist(G.x,G.y,B.x,B.y,GC.x,GC.y);
  const depth=GC.y-G.y;
  return {lateralErr,depth, aligned:lateralErr<=COVTOL}; }

function moveTo(x,y){ if(state==='play'&&play.phase==='approach'){ play.gk.tx=clamp(x,GX0-60,GX1+60); play.gk.ty=clamp(y,GY-MAXD-14,GY-6); } }

function update(dt){
  if(flash>0) flash=Math.max(0,flash-dt*0.003);
  if(shakeT>0) shakeT-=dt*0.001;
  parts.forEach(q=>{q.x+=q.vx;q.y+=q.vy;q.vy+=0.2;q.life-=dt*0.0022;});
  parts=parts.filter(q=>q.life>0);
  pops.forEach(q=>{q.y-=dt*0.02;q.life-=dt*0.0014;});
  pops=pops.filter(q=>q.life>0);
  if(state!=='play') return;
  const p=play;
  if(p.phase==='approach'){
    t+=dt; const f=clamp(t/p.approachT,0,1);
    p.ball.x=p.ball.sx+(p.ball.tx-p.ball.sx)*f; p.ball.y=p.ball.sy+(p.ball.ty-p.ball.sy)*f;
    if(ptr){ p.gk.tx=clamp(ptr.x,GX0-60,GX1+60); p.gk.ty=clamp(ptr.y,GY-MAXD-14,GY-6); }
    if(keyL)p.gk.tx-=0.4*dt; if(keyR)p.gk.tx+=0.4*dt; if(keyU)p.gk.ty-=0.34*dt; if(keyD)p.gk.ty+=0.34*dt;
    p.gk.tx=clamp(p.gk.tx,GX0-60,GX1+60); p.gk.ty=clamp(p.gk.ty,GY-MAXD-14,GY-6);
    p.gk.x+=(p.gk.tx-p.gk.x)*0.24; p.gk.y+=(p.gk.ty-p.gk.y)*0.24;
    if(t>=p.deadline){ // striker shoots / dinks
      const e=evalPos(); S.shot();
      if(e.depth>MAXD){ p.result='chip'; p.shotTo={x:GC.x, y:GY-4}; }
      else if(e.depth<MIND){ p.result='angle'; p.shotTo={x:(p.ball.x<450?GX1-8:GX0+8), y:GY-8}; }
      else if(!e.aligned){ p.result='openside'; const open=(p.gk.x<GC.x)?GX1-8:GX0+8; p.shotTo={x:open,y:GY-8}; }
      else { p.result=(e.lateralErr<16 && e.depth>52 && e.depth<82)?'greatsave':'save'; p.shotTo={x:p.gk.x,y:p.gk.y-6}; }
      p.phase='shoot'; p.shotT=0; p.shotFrom={x:p.ball.x,y:p.ball.y};
    }
  } else if(p.phase==='shoot'){
    p.shotT+=dt; const f=clamp(p.shotT/260,0,1);
    p.ball.x=p.shotFrom.x+(p.shotTo.x-p.shotFrom.x)*f; p.ball.y=p.shotFrom.y+(p.shotTo.y-p.shotFrom.y)*f;
    if(p.result==='chip') p.ball.y-=Math.sin(f*Math.PI)*70;
    if(f>=1 && !p.applied){ p.applied=true; applyResult(); p.phase='resolve'; p.resT=0; }
  } else if(p.phase==='resolve'){
    p.resT+=dt; if(p.resT>=p.pendDelay && p.pend){ const pp=p.pend; p.pend=null; if(pp==='over') gameOver(); else newPlay(); }
  }
}
function applyResult(){
  const p=play; const R=p.result;
  if(R==='save'||R==='greatsave'){ saves++; combo++; const gr=(R==='greatsave'); const gained=(gr?140:90)+combo*10; score+=gained;
    if(gr){ S.great(); flash=Math.max(flash,0.34); pops.push({txt:'完璧なアングル！ セーブ +'+gained,x:W/2,y:150,big:true,life:1.15,c:'#8fffb0'});
      pops.push({txt:'角度を消し切った！',x:W/2,y:192,big:false,life:1.0,c:'#7fd8ff'}); }
    else { S.save(); flash=Math.max(flash,0.24); pops.push({txt:'セーブ！ 角度を消した +'+gained,x:W/2,y:152,big:true,life:1.1,c:'#bfffd0'}); }
    for(let i=0;i<12;i++) parts.push({x:p.gk.x,y:p.gk.y,vx:rnd(-6,6),vy:rnd(-6,1),life:1.0,c:'#cfe'});
    lvl=Math.min(6, Math.floor(saves/3 + Math.floor(score/700)));
    end(true);
  } else { conceded++; combo=0; shakeT=0.3; flash=Math.max(flash,0.32); S.goal();
    const msg = R==='chip'? '出過ぎ！ ループで頭上を抜かれた' : (R==='angle'? '深すぎ！ 角度を作られて失点' : 'ズレた！ 逆サイドを撃たれた');
    pops.push({txt:msg,x:W/2,y:152,big:true,life:1.1,c:'#ff6a6a'}); end(false);
  }
}
function end(ok){ play.phase='resolve'; play.pendDelay=ok?820:1050; play.pend = conceded>=3 ? 'over':'next'; play.applied=true; }
function gameOver(){ state='over'; S.over(); if(score>best){ best=score; try{localStorage.setItem('ang_best',best);}catch(e){} } }

// ---------- input ----------
function start(){ ac(); reset(); state='play'; }
function pt(e){ const r=cv.getBoundingClientRect(); return {x:(e.clientX-r.left)/r.width*W, y:(e.clientY-r.top)/r.height*H}; }
cv.addEventListener('pointerdown',e=>{ ac(); if(state!=='play'){ start(); return; } ptr=pt(e); e.preventDefault(); });
cv.addEventListener('pointermove',e=>{ if(state==='play'&&ptr) ptr=pt(e); });
addEventListener('pointerup',()=>{ ptr=null; });
let keyL=false,keyR=false,keyU=false,keyD=false;
addEventListener('keydown',e=>{ const k=e.key.toLowerCase();
  if(state!=='play'){ if(!e.repeat) start(); return; }
  if(k==='arrowleft'||k==='a')keyL=true; else if(k==='arrowright'||k==='d')keyR=true; else if(k==='arrowup'||k==='w')keyU=true; else if(k==='arrowdown'||k==='s')keyD=true;
  if(['arrowleft','arrowright','arrowup','arrowdown'].includes(e.key.toLowerCase()))e.preventDefault(); });
addEventListener('keyup',e=>{ const k=e.key.toLowerCase(); if(k==='arrowleft'||k==='a')keyL=false; if(k==='arrowright'||k==='d')keyR=false; if(k==='arrowup'||k==='w')keyU=false; if(k==='arrowdown'||k==='s')keyD=false; });

// ---------- render ----------
function drawField(){
  const gr=g.createLinearGradient(0,0,0,H); gr.addColorStop(0,'#2c9350'); gr.addColorStop(1,'#1f6f3b'); g.fillStyle=gr; g.fillRect(0,0,W,H);
  g.globalAlpha=0.05; for(let i=0;i<9;i++){ g.fillStyle=i%2?'#fff':'#000'; g.fillRect(0,i*66,W,66); } g.globalAlpha=1;
  g.fillStyle='#14324a'; g.fillRect(0,0,W,40);
  for(const c of crowd){ g.fillStyle=c.c; g.globalAlpha=0.5; g.fillRect(c.x,c.y,3,3); } g.globalAlpha=1;
  // penalty box + goal at bottom
  g.strokeStyle='rgba(255,255,255,0.25)'; g.lineWidth=2; g.strokeRect(230,GY-190,440,190);
  g.strokeStyle='#fff'; g.lineWidth=6; g.beginPath(); g.moveTo(GX0,GY); g.lineTo(GX1,GY); g.stroke();
  g.strokeStyle='rgba(255,255,255,0.5)'; g.lineWidth=3; g.strokeRect(GX0,GY-2,GX1-GX0,10);
}
function drawScene(){
  const p=play; const B=p.ball;
  // shooting angle lines (ball to posts)
  g.strokeStyle='rgba(255,255,255,0.16)'; g.lineWidth=2; g.beginPath(); g.moveTo(B.x,B.y); g.lineTo(GX0,GY); g.moveTo(B.x,B.y); g.lineTo(GX1,GY); g.stroke();
  // ideal position ghost (fades at higher levels)
  if(lvl<3 && p.phase==='approach'){ const o=optPos(); g.strokeStyle='rgba(143,255,176,0.5)'; g.lineWidth=2; g.setLineDash([4,4]); g.beginPath(); g.arc(o.x,o.y,16,0,6.28); g.stroke(); g.setLineDash([]); }
  // striker with ball
  g.fillStyle='#c94b4b'; g.beginPath(); g.arc(B.x,B.y-14,9,0,6.28); g.fill(); g.fillRect(B.x-7,B.y-16,14,20);
  g.fillStyle='#fff'; g.beginPath(); g.arc(B.x-2,B.y+8,7,0,6.28); g.fill();
  // GK
  const e=evalPos(); const good=(p.phase==='approach')&&e.aligned&&e.depth>=MIND&&e.depth<=MAXD;
  g.fillStyle=good?'#8fffb0':'#f2c94c'; g.fillRect(p.gk.x-12,p.gk.y-16,24,30); g.fillStyle='#e8b47a'; g.beginPath(); g.arc(p.gk.x,p.gk.y-20,8,0,6.28); g.fill();
  g.strokeStyle=good?'#8fffb0':'rgba(255,255,255,0.5)'; g.lineWidth=2; g.beginPath(); g.arc(p.gk.x,p.gk.y-4,20,0,6.28); g.stroke();

  g.textAlign='center';
  if(p.phase==='approach'){
    let msg,col;
    if(e.depth>MAXD){ msg='出過ぎ！ ループ注意'; col='#ff9a6a'; }
    else if(e.depth<MIND){ msg='深い！ 前へ出て角度を消せ'; col='#ff9a6a'; }
    else if(!e.aligned){ msg='ズレてる！ ボールとゴールの線上へ'; col='#ffd84a'; }
    else { msg='ナイスポジション！ 角度を消してる'; col='#8fffb0'; }
    g.fillStyle=col; g.font='bold 21px sans-serif'; g.fillText(msg,W/2,86);
    const rem=Math.max(0,(p.deadline-t)/1000); g.fillStyle='rgba(255,255,255,0.7)'; g.font='bold 14px sans-serif'; g.fillText('シュートまで '+rem.toFixed(1)+'s',W/2,110);
  }
}
function drawHUD(){
  g.textAlign='left'; g.fillStyle='#fff'; g.font='bold 25px sans-serif'; g.fillText('SCORE '+score,20,40);
  if(combo>1){ g.fillStyle='#ffd84a'; g.font='bold 16px sans-serif'; g.fillText(combo+' 連続セーブ',20,62); }
  g.textAlign='right'; g.fillStyle='rgba(255,255,255,0.85)'; g.font='14px sans-serif'; g.fillText('セーブ '+saves+'  Lv.'+(lvl+1),W-20,38);
  g.fillStyle='#ff6a6a'; g.font='bold 14px sans-serif'; g.fillText('失点',W-90,62);
  for(let i=0;i<3;i++){ g.fillStyle=i<conceded?'#ff5a5a':'rgba(255,255,255,0.24)'; g.beginPath(); g.arc(W-68+i*22,57,8,0,6.28); g.fill(); }
}
function drawTitle(){
  g.fillStyle='rgba(0,0,0,0.55)'; g.fillRect(0,0,W,H);
  g.textAlign='center'; g.fillStyle='#8fffb0'; g.font='bold 50px sans-serif'; g.fillText('アングルプレー',W/2,142);
  g.fillStyle='#fff'; g.font='bold 22px sans-serif'; g.fillText('Cut the Angle — 角度を消せ',W/2,184);
  g.fillStyle='#cfe'; g.font='18px sans-serif';
  g.fillText('あなたはGK。ドリブルで迫るFWに対し、ボールとゴール中央を結ぶ線上に',W/2,240);
  g.fillText('適度に前へ出て“角度を消す”（ドラッグ / 矢印でGKを操作）。',W/2,268);
  g.fillText('深すぎると角度を作られ、出過ぎるとループで抜かれ、線からズレると逆を撃たれる。',W/2,296);
  g.fillText('シュート時にベストポジションならセーブ＝加点。ドンピシャは大量加点。3失点で終了。',W/2,324);
  g.fillStyle='#ffd84a'; g.font='bold 22px sans-serif'; g.fillText('クリック / タップ / キー でスタート',W/2,398);
}
function drawOver(){
  g.fillStyle='rgba(0,0,0,0.64)'; g.fillRect(0,0,W,H);
  g.textAlign='center'; g.fillStyle='#ff6a6a'; g.font='bold 52px sans-serif'; g.fillText('3失点…終了',W/2,H/2-54);
  g.fillStyle='#fff'; g.font='bold 34px sans-serif'; g.fillText('SCORE '+score,W/2,H/2+2);
  g.fillStyle='#cfe'; g.font='20px sans-serif'; g.fillText('セーブ '+saves+'　BEST '+best,W/2,H/2+40);
  g.fillStyle='#8fffb0'; g.font='bold 22px sans-serif'; g.fillText('クリック / タップ で もう一度',W/2,H/2+96);
}
function render(){
  g.setTransform(DPR,0,0,DPR,0,0);
  let sx=0,sy=0; if(shakeT>0){ sx=rnd(-6,6)*shakeT*3; sy=rnd(-6,6)*shakeT*3; g.translate(sx,sy); }
  drawField();
  if(state==='play') drawScene();
  parts.forEach(q=>{ g.globalAlpha=clamp(q.life,0,1); g.fillStyle=q.c; g.beginPath(); g.arc(q.x,q.y,3,0,6.28); g.fill(); }); g.globalAlpha=1;
  pops.forEach(q=>{ g.globalAlpha=clamp(q.life,0,1); g.textAlign='center'; g.fillStyle=q.c; g.font='bold '+(q.big?27:19)+'px sans-serif';
    const px=(q.x==null)?W/2:q.x; g.fillText(q.txt,px,q.y); }); g.globalAlpha=1;
  if(state==='play') drawHUD();
  if(flash>0){ g.fillStyle='rgba(255,255,255,'+(flash*0.6)+')'; g.fillRect(0,0,W,H); }
  if(state==='title') drawTitle();
  if(state==='over') drawOver();
  g.setTransform(DPR,0,0,DPR,0,0);
}

let last=0;
function frameLoop(ts){ let dt=ts-last; last=ts; if(dt>60)dt=60; if(dt<0)dt=0; update(dt); render(); requestAnimationFrame(frameLoop); }
requestAnimationFrame(frameLoop);

// ---------- test hook ----------
window.__ang={
  start, moveTo,
  get state(){return state;}, get score(){return score;}, get conceded(){return conceded;}, get saves(){return saves;},
  get info(){ if(state!=='play') return {state,phase:'-'}; const p=play; const e=evalPos(); const o=optPos(); return {
    state, phase:p.phase, t, deadline:p.deadline, optX:o.x, optY:o.y, lateralErr:e.lateralErr, depth:e.depth,
    aligned:e.aligned, minD:MIND, maxD:MAXD, result:p.result, conceded, saves, lvl }; }
};
})();
</script>
</body>
</html>
