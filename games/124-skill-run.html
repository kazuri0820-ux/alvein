<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>スキルラン (Skill Run)</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;background:#0a1410;overflow:hidden;font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",system-ui,sans-serif}
  #wrap{width:100%;height:100%;display:flex;align-items:center;justify-content:center}
  #stage{position:relative;width:min(100vw,calc(100vh*1.5));aspect-ratio:900/600;max-width:900px;
    box-shadow:0 10px 60px rgba(0,0,0,.6);border-radius:10px;overflow:hidden;touch-action:none}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
  #hint{position:absolute;left:0;bottom:6px;width:100%;text-align:center;color:#cfe;
    font-size:12px;opacity:.55;pointer-events:none;text-shadow:0 1px 3px #000}
</style>
</head>
<body>
<div id="wrap"><div id="stage">
  <canvas id="cv"></canvas>
  <div id="hint">迫るDFの矢印に合わせて ← / ↑ / → （画面 左/中/右 タップ）をジャストで入力してかわせ！</div>
</div></div>
<script>
(()=>{
const cv=document.getElementById('cv'), g=cv.getContext('2d');
const W=900,H=600;
let DPR=1;
function fit(){ DPR=Math.min(2,window.devicePixelRatio||1); cv.width=W*DPR; cv.height=H*DPR; g.setTransform(DPR,0,0,DPR,0,0); }
fit(); addEventListener('resize',fit);

// ---------- audio ----------
let AC=null;
function ac(){ if(!AC){ try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){} } return AC; }
function tone(f,d,t,v,sweep){ const a=ac(); if(!a)return; const o=a.createOscillator(),gg=a.createGain();
  o.type=t||'sine'; o.frequency.value=f; if(sweep) o.frequency.exponentialRampToValueAtTime(Math.max(20,sweep),a.currentTime+d);
  gg.gain.setValueAtTime(0.0001,a.currentTime); gg.gain.exponentialRampToValueAtTime(v||0.2,a.currentTime+0.012);
  gg.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+d); o.connect(gg).connect(a.destination);
  o.start(); o.stop(a.currentTime+d+0.02); }
function noise(d,v,hp){ const a=ac(); if(!a)return; const n=a.createBuffer(1,a.sampleRate*d,a.sampleRate); const ch=n.getChannelData(0);
  for(let i=0;i<ch.length;i++) ch[i]=(Math.random()*2-1)*(1-i/ch.length);
  const s=a.createBufferSource(); s.buffer=n; const f=a.createBiquadFilter(); f.type='highpass'; f.frequency.value=hp||600;
  const gg=a.createGain(); gg.gain.value=v||0.15; s.connect(f).connect(gg).connect(a.destination); s.start(); }
const S={
  good(){ tone(520,0.06,'triangle',0.1,720); },
  perfect(){ tone(660,0.05,'square',0.1,980); setTimeout(()=>tone(990,0.07,'triangle',0.1,1400),45); },
  wiff(){ tone(180,0.08,'sawtooth',0.08,90); },
  tackle(){ noise(0.14,0.2,300); tone(150,0.18,'sawtooth',0.12,70); },
  goal(){ tone(520,0.1,'triangle',0.14,780); setTimeout(()=>tone(780,0.14,'triangle',0.12,1040),90); noise(0.4,0.12,400); },
  over(){ tone(300,0.5,'sawtooth',0.16,90); setTimeout(()=>tone(200,0.6,'sawtooth',0.14,60),160); },
  tick(){ tone(820,0.02,'square',0.03); },
};

// ---------- geometry ----------
const LANEX=[300,450,600];
const ARROW=['←','↑','→'];
const LINEY=468, SPAWNY=-24;
const PERFECT=20, GOOD=42, MISS=60;
const GOALREQ=8;

// ---------- state ----------
let state='title';
let parts=[], pops=[];
let score, taks, goals, combo, best, lvl, gauge, maxcombo;
let notes=[], spawnTimer=0, lastLane=-1, staggerT=0;
let flash=0, shakeT=0, dribbler={x:450, lean:0, cel:0};
let flowT=0;
try{ best=+localStorage.getItem('sr_best')||0; }catch(e){ best=0; }

const crowd=[]; { const cc=['#e6b48f','#9bd0e6','#e6dc8f','#c9a0d8','#8fd8bd','#f0f0f0']; for(let i=0;i<240;i++) crowd.push({x:(i*31.7)%W, y:3+((i*53)%34), c:cc[i%cc.length]}); }

function reset(){ parts=[]; pops=[]; score=0; taks=0; goals=0; combo=0; maxcombo=0; lvl=0; gauge=0; notes=[]; spawnTimer=0; lastLane=-1; staggerT=0; flash=0; shakeT=0; dribbler={x:450,lean:0,cel:0}; }
function clamp(v,a,b){ return v<a?a:v>b?b:v; }
function speed(){ return 0.30+lvl*0.028; }        // px per ms
function interval(){ return Math.max(360, 860-lvl*64); }
function spawnNote(){
  let lane=Math.floor(Math.random()*3);
  if(lane===lastLane && Math.random()<0.6) lane=(lane+1+Math.floor(Math.random()*2))%3;
  lastLane=lane;
  notes.push({lane, y:SPAWNY, hit:false, dead:false, missed:false});
  // double-note (two lanes at once) at higher levels for a quick both-sides beat
  if(lvl>=3 && Math.random()<0.20){ const l2=(lane+1+Math.floor(Math.random()*2))%3; notes.push({lane:l2, y:SPAWNY, hit:false, dead:false, missed:false}); }
}

// ---------- action ----------
function press(lane){
  if(state!=='play'||staggerT>0) return;   // input locked while off-balance
  // nearest un-hit note in this lane to the line
  let best=null, bd=1e9;
  for(const n of notes){ if(n.hit||n.dead||n.lane!==lane) continue; const d=Math.abs(n.y-LINEY); if(d<bd){ bd=d; best=n; } }
  dribbler.lean = lane===0?-1:lane===2?1:0; dribbler.leanT=180;
  if(best && bd<=GOOD){
    best.hit=true; best.dead=true;
    const perfect=bd<=PERFECT; combo++; maxcombo=Math.max(maxcombo,combo);
    const mult=1+Math.floor(combo/5)*0.5;
    const gained=Math.round((perfect?60:30)*mult); score+=gained;
    gauge+=perfect?1.4:1; dribbler.cel=1;
    pops.push({txt:(perfect?'PERFECT ':'nice ')+'+'+gained, x:LANEX[lane], y:LINEY-30, life:0.85, c:perfect?'#ffe15a':'#8fffb0', big:perfect});
    for(let i=0;i<(perfect?12:6);i++) parts.push({x:LANEX[lane],y:LINEY,vx:(Math.random()-0.5)*6,vy:(Math.random()-0.5)*6-1,life:0.8,c:perfect?'#ffe15a':'#8fffb0'});
    perfect?S.perfect():S.good();
    if(gauge>=GOALREQ){ scoreGoal(); }
  } else {
    combo=0; staggerT=210; S.wiff();       // mistimed/empty input -> off-balance lockout
    pops.push({txt:'体勢を崩した…', x:LANEX[lane], y:LINEY-24, life:0.7, c:'#ffb36a'});
  }
}
function scoreGoal(){
  goals++; gauge=0; lvl=Math.min(8,lvl+1);
  const bonus=200+combo*8; score+=bonus;
  pops.push({txt:'突破ゴール！ +'+bonus, x:450, y:200, life:1.3, c:'#ffe15a', big:true});
  flash=Math.max(flash,0.5); S.goal();
  for(let i=0;i<34;i++) parts.push({x:450,y:240,vx:(Math.random()-0.5)*8,vy:Math.random()*-6-1,life:1.3,c:['#ffe15a','#7dff9b','#7fd8ff'][i%3]});
}
function tackled(){
  taks++; combo=0; shakeT=0.4; flash=Math.max(flash,0.4); S.tackle();
  pops.push({txt:'タックルされた！', x:450, y:150, life:1.0, c:'#ff6a6a', big:true});
  if(taks>=3){ gameOver(); }
}
function gameOver(){ state='over'; S.over(); if(score>best){ best=score; try{localStorage.setItem('sr_best',best);}catch(e){} } }

// ---------- input ----------
function start(){ ac(); reset(); state='play'; }
addEventListener('keydown',e=>{ const k=e.key.toLowerCase();
  if(state!=='play'){ if(!e.repeat) start(); return; }
  if(e.repeat) return;
  if(k==='arrowleft'||k==='a'){ press(0); e.preventDefault(); }
  else if(k==='arrowup'||k==='w'||k===' '){ press(1); e.preventDefault(); }
  else if(k==='arrowright'||k==='d'){ press(2); e.preventDefault(); } });
cv.addEventListener('pointerdown',e=>{ ac(); if(state!=='play'){ start(); return; }
  const r=cv.getBoundingClientRect(); const x=(e.clientX-r.left)/r.width*W;
  press(x<W*0.4?0:x<W*0.62?1:2); e.preventDefault(); });

// ---------- update ----------
function update(dt){
  if(flash>0) flash=Math.max(0,flash-dt*0.003);
  if(shakeT>0) shakeT-=dt*0.001;
  if(dribbler.cel>0) dribbler.cel=Math.max(0,dribbler.cel-dt*0.004);
  if(dribbler.leanT>0){ dribbler.leanT-=dt; if(dribbler.leanT<=0) dribbler.lean=0; }
  if(staggerT>0) staggerT-=dt;
  flowT+=dt;
  parts.forEach(q=>{q.x+=q.vx;q.y+=q.vy;q.vy+=0.12;q.life-=dt*0.0024;});
  parts=parts.filter(q=>q.life>0);
  pops.forEach(q=>{q.y-=dt*0.03;q.life-=dt*0.0016;});
  pops=pops.filter(q=>q.life>0);
  if(state!=='play') return;

  spawnTimer+=dt;
  if(spawnTimer>=interval()){ spawnTimer-=interval(); spawnNote(); }
  const v=speed();
  for(const n of notes){ if(n.dead) continue; n.y+=v*dt;
    if(!n.hit && !n.missed && n.y>LINEY+MISS){ n.missed=true; n.dead=true; tackled(); } }
  notes=notes.filter(n=>!n.dead && n.y<H+40);
}

// ---------- render ----------
function roundRect(x,y,w,h,r){ g.beginPath(); g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r); g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath(); }

function drawField(){
  const gr=g.createLinearGradient(0,0,0,H); gr.addColorStop(0,'#1c6b39'); gr.addColorStop(1,'#2c9350'); g.fillStyle=gr; g.fillRect(0,0,W,H);
  // stands
  g.fillStyle='#14324a'; g.fillRect(0,0,W,38);
  for(const c of crowd){ g.fillStyle=c.c; g.globalAlpha=0.6; g.fillRect(c.x,c.y,3,3); } g.globalAlpha=1;
  // runway lanes
  g.save();
  for(let i=0;i<3;i++){ g.globalAlpha=0.10+(i%2?0.03:0); g.fillStyle='#fff'; g.fillRect(LANEX[i]-52,40,104,H-40); }
  g.globalAlpha=1;
  // scrolling yard lines for motion
  const off=(flowT*speed()*0.5)%40;
  g.strokeStyle='rgba(255,255,255,0.10)'; g.lineWidth=3;
  for(let y=40+off; y<H; y+=40){ g.beginPath(); g.moveTo(LANEX[0]-64,y); g.lineTo(LANEX[2]+64,y); g.stroke(); }
  g.restore();
  // hit line
  g.strokeStyle='rgba(255,225,90,0.8)'; g.lineWidth=3; g.beginPath(); g.moveTo(LANEX[0]-70,LINEY); g.lineTo(LANEX[2]+70,LINEY); g.stroke();
  for(let i=0;i<3;i++){ g.strokeStyle='rgba(255,255,255,0.5)'; g.lineWidth=2; g.beginPath(); g.arc(LANEX[i],LINEY,26,0,6.28); g.stroke();
    g.fillStyle='rgba(255,255,255,0.4)'; g.font='bold 20px sans-serif'; g.textAlign='center'; g.fillText(ARROW[i],LANEX[i],LINEY+7); }
}
function drawDefender(x,y,lane,near){
  g.save(); g.translate(x,y);
  g.fillStyle='rgba(0,0,0,0.22)'; g.beginPath(); g.ellipse(0,20,15,5,0,0,6.28); g.fill();
  g.strokeStyle='#20303a'; g.lineWidth=5; g.lineCap='round';
  g.beginPath(); g.moveTo(-4,0); g.lineTo(-8,20); g.moveTo(4,0); g.lineTo(8,20); g.stroke();
  g.fillStyle='#c62828'; roundRect(-11,-24,22,26,6); g.fill();
  g.fillStyle='#f2c9a0'; g.beginPath(); g.arc(0,-32,8,0,6.28); g.fill();
  // arrow prompt above
  g.fillStyle=near?'#ffe15a':'#fff'; g.font='bold 34px sans-serif'; g.textAlign='center';
  g.strokeStyle='#000'; g.lineWidth=5; g.strokeText(ARROW[lane],0,-46); g.fillText(ARROW[lane],0,-46);
  g.restore();
}
function drawDribbler(){
  const x=450+dribbler.lean*30, y=LINEY+34;
  g.save(); g.translate(x,y);
  if(staggerT>0){ g.fillStyle='rgba(255,90,90,'+(clamp(staggerT/210,0,1)*0.4)+')'; g.beginPath(); g.arc(0,-14,32,0,6.28); g.fill(); }
  if(dribbler.cel>0){ g.fillStyle='rgba(255,225,90,'+(dribbler.cel*0.4)+')'; g.beginPath(); g.arc(0,-14,30,0,6.28); g.fill(); }
  g.fillStyle='rgba(0,0,0,0.25)'; g.beginPath(); g.ellipse(0,20,16,5,0,0,6.28); g.fill();
  g.strokeStyle='#123'; g.lineWidth=5; g.lineCap='round';
  g.beginPath(); g.moveTo(-4,0); g.lineTo(-8+dribbler.lean*4,20); g.moveTo(4,0); g.lineTo(8+dribbler.lean*4,20); g.stroke();
  g.fillStyle='#1565c0'; roundRect(-11,-26,22,28,6); g.fill();
  g.fillStyle='#f2c9a0'; g.beginPath(); g.arc(0,-34,8,0,6.28); g.fill();
  // ball
  g.fillStyle='#fff'; g.beginPath(); g.arc(dribbler.lean*14,22,8,0,6.28); g.fill(); g.strokeStyle='#123'; g.lineWidth=1.3; g.stroke();
  g.restore();
}
function drawScene(){
  for(const n of notes){ if(n.dead) continue; const near=Math.abs(n.y-LINEY)<=GOOD; drawDefender(LANEX[n.lane], n.y, n.lane, near); }
  drawDribbler();
}

function render(){
  g.clearRect(0,0,W,H);
  g.save(); if(shakeT>0){ const s=shakeT*13; g.translate((Math.random()-0.5)*s,(Math.random()-0.5)*s); }
  drawField();
  if(state==='play') drawScene();
  for(const q of parts){ g.globalAlpha=Math.max(0,q.life); g.fillStyle=q.c; g.fillRect(q.x-2,q.y-2,4,4); }
  g.globalAlpha=1;
  g.restore();

  if(state==='play') drawHUD();
  for(const q of pops){ g.globalAlpha=Math.max(0,q.life); g.textAlign='center';
    const fs=q.big?32:20; g.font='bold '+fs+'px sans-serif'; g.fillStyle=q.c; g.strokeStyle='#000'; g.lineWidth=4;
    g.strokeText(q.txt,q.x,q.y); g.fillText(q.txt,q.x,q.y); }
  g.globalAlpha=1;
  if(flash>0){ g.fillStyle='rgba(255,255,255,'+(flash*0.5)+')'; g.fillRect(0,0,W,H); }
  if(state==='title') drawTitle();
  if(state==='over') drawOver();
}
function drawHUD(){
  g.textAlign='left'; g.font='bold 26px sans-serif'; g.fillStyle='#fff'; g.strokeStyle='rgba(0,0,0,0.5)'; g.lineWidth=4;
  g.strokeText('SCORE '+score,20,66); g.fillText('SCORE '+score,20,66);
  if(combo>1){ g.font='bold 18px sans-serif'; g.fillStyle='#ffe15a'; g.fillText(combo+' 連続突破 (x'+(1+Math.floor(combo/5)*0.5)+')',22,90); }
  // gauge
  g.textAlign='center'; g.font='bold 14px sans-serif'; g.fillStyle='#cfe'; g.fillText('突破ゲージ',W/2,54);
  g.fillStyle='rgba(0,0,0,0.35)'; roundRect(W/2-120,60,240,12,6); g.fill();
  g.fillStyle='#7dff9b'; roundRect(W/2-118,62,236*clamp(gauge/GOALREQ,0,1),8,4); g.fill();
  // lives
  g.textAlign='right'; g.font='bold 16px sans-serif'; g.fillStyle='#fff'; g.strokeText('被タックル',W-150,44); g.fillText('被タックル',W-150,44);
  for(let i=0;i<3;i++){ g.fillStyle=i<taks?'#ff5a5a':'rgba(255,255,255,0.28)'; g.beginPath(); g.arc(W-58+i*22,38,8,0,6.28); g.fill(); }
  g.fillStyle='#cfe'; g.font='bold 14px sans-serif'; g.textAlign='right'; g.fillText('突破 '+goals,W-30,66);
}
function drawTitle(){
  g.fillStyle='rgba(4,12,8,0.72)'; g.fillRect(0,0,W,H); g.textAlign='center';
  g.fillStyle='#8fffb0'; g.font='bold 54px sans-serif'; g.fillText('スキルラン',W/2,H/2-104);
  g.fillStyle='#cfe'; g.font='20px sans-serif'; g.fillText('Skill Run — 迫るDFをリズムよくかわして突破',W/2,H/2-66);
  g.font='17px sans-serif'; g.fillStyle='#bcd';
  g.fillText('DFがレーンを下りてくる。頭上の矢印＝かわす方向。',W/2,H/2-28);
  g.fillText('黄色いラインに重なった瞬間に ← / ↑ / → を入力（左/中/右タップ）。',W/2,H/2-4);
  g.fillText('ジャストでPERFECT、連続でコンボ倍率。ゲージ満タンで突破ゴール。',W/2,H/2+20);
  g.fillText('入力ミス／通過は被タックル。3回で終了。',W/2,H/2+44);
  g.fillStyle='#ffe15a'; g.font='bold 24px sans-serif'; g.fillText('クリック / タップ / キー で スタート',W/2,H/2+96);
  if(best>0){ g.fillStyle='#9fd'; g.font='16px sans-serif'; g.fillText('BEST '+best,W/2,H/2+126); }
}
function drawOver(){
  g.fillStyle='rgba(4,12,8,0.8)'; g.fillRect(0,0,W,H); g.textAlign='center';
  g.fillStyle='#ff6a6a'; g.font='bold 50px sans-serif'; g.fillText('3タックル…ロスト',W/2,H/2-64);
  g.fillStyle='#fff'; g.font='bold 34px sans-serif'; g.fillText('SCORE '+score,W/2,H/2-8);
  g.fillStyle='#cfe'; g.font='18px sans-serif'; g.fillText('突破 '+goals+'　最大コンボ '+maxcombo,W/2,H/2+24);
  const nb=score>0&&score>=best; g.fillStyle=nb?'#ffe15a':'#9fd'; g.font='18px sans-serif';
  g.fillText(nb?'🎉 ベスト更新！ BEST '+best:'BEST '+best,W/2,H/2+54);
  g.fillStyle='#8fffb0'; g.font='bold 22px sans-serif'; g.fillText('クリック / タップ で もう一度',W/2,H/2+104);
}

let last=0;
function frame(t){ let dt=t-last; last=t; if(dt>60)dt=60; if(dt<0)dt=0; update(dt); render(); requestAnimationFrame(frame); }
requestAnimationFrame(frame);

// ---------- test hook ----------
window.__sr={
  start, press,
  get state(){return state;}, get score(){return score;}, get taks(){return taks;}, get goals(){return goals;},
  get lineY(){return LINEY;}, get good(){return GOOD;}, get perfect(){return PERFECT;}, get staggered(){return staggerT>0;},
  get notes(){ return notes.filter(n=>!n.dead).map(n=>({lane:n.lane,y:n.y,hit:n.hit,dist:n.y-LINEY})); }
};
})();
</script>
</body>
</html>
