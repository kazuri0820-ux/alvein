<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>こぼれ球ドカン (Pounce the Rebound)</title>
<style>
  html,body{margin:0;height:100%;background:#07120b;overflow:hidden;
    font-family:-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  #stage{position:relative;width:100vw;height:100vh;max-width:calc(100vh*1.5);max-height:calc(100vw/1.5);aspect-ratio:900/600;}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;border-radius:6px;}
</style>
</head>
<body>
<div id="wrap"><div id="stage"><canvas id="cv"></canvas></div></div>
<script>
(function(){
const W=900,H=600,cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let DPR=1;
function fit(){DPR=Math.min(2,window.devicePixelRatio||1);cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
fit();addEventListener('resize',fit);

// ---------- audio ----------
let AC=null;function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function tone(f,d,type,v,sweep){const a=ac();if(!a)return;const t=a.currentTime,o=a.createOscillator(),g=a.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(sweep)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+sweep),t+d);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v||0.2,t+0.008);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+0.02);}
function noise(d,v,hp){const a=ac();if(!a)return;const t=a.currentTime,n=Math.floor(a.sampleRate*d),buf=a.createBuffer(1,n,a.sampleRate),ch=buf.getChannelData(0);
  for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource();s.buffer=buf;
  const f=a.createBiquadFilter();f.type='highpass';f.frequency.value=hp||600;const g=a.createGain();g.gain.value=v||0.2;
  s.connect(f);f.connect(g);g.connect(a.destination);s.start(t);s.stop(t+d+0.02);}
const S={
  parry:()=>{noise(0.05,0.14,500);tone(300,0.06,'square',0.08);},
  goal:()=>{noise(0.06,0.14,500);[560,820,1080,1340].forEach((f,i)=>setTimeout(()=>tone(f,0.12,'triangle',0.18),i*55));},
  save:()=>{noise(0.1,0.16,420);tone(230,0.12,'sawtooth',0.1,-40);},
  whiff:()=>{noise(0.12,0.16,700);tone(220,0.14,'sawtooth',0.1,-60);},
  streak:()=>{[700,930,1170,1400].forEach((f,i)=>setTimeout(()=>tone(f,0.1,'triangle',0.16),i*60));},
  over:()=>{[440,330,247,175].forEach((f,i)=>setTimeout(()=>tone(f,0.3,'triangle',0.2),i*160));}
};

// ---------- geometry ----------
const GOALY=110, GW=300, GL=450-GW/2, GR=450+GW/2;
const SPOTS=[{x:340,y:360},{x:450,y:388},{x:560,y:360}]; // L / C / R rebound spots
const SNAME=['左','中','右'];

// ---------- state ----------
let state='title', phase='parry', t=0, plays=0;
let score=0, combo=0, best=+(localStorage.getItem('pounce_best')||0);
let outs=0, fails=0, lvl=1;   // outs = rebounds bundled in
let clock=0, parryT=420, arriveT=640, coverT=1040, coverDelay=400, spot=1;
let acted=false, choice=-1, result=null, resultT=0, msg='', shotU=0, gkU=0, bang=false;
let shake=0, flash=0, flashCol='#fff', last=performance.now();
let parts=[], pops=[];

function rnd(a,b){return a+Math.random()*(b-a);}
function chance(p){return Math.random()<p;}
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function lerp(a,b,u){return a+(b-a)*u;}
function easeOut(u){return 1-Math.pow(1-u,2);}

function params(){ return {
  arrive:Math.max(360,560-lvl*30),   // time the ball flies out to the spot after parry
  cover:Math.max(370,600-lvl*40)     // reaction window before GK recovers to that spot
};}

function reset(){state='title';score=0;combo=0;outs=0;fails=0;lvl=1;plays=0;result=null;parts=[];pops=[];}
function newPlay(){
  plays++; lvl=Math.min(7,1+Math.floor(outs/4));
  const p=params();
  parryT=rnd(300,520); arriveT=parryT+p.arrive; coverDelay=p.cover; coverT=arriveT+coverDelay;
  spot=Math.floor(Math.random()*3);
  clock=0; acted=false; choice=-1; result=null; phase='parry'; msg=''; resultT=0; shotU=0; gkU=0; bang=false;
}
function start(){ if(!ac())ac(); if(AC&&AC.state==='suspended')AC.resume(); reset(); state='play'; newPlay(); }

function pounce(dir){
  if(state==='title'){start();return;}
  if(state==='over'){ if(resultT>0.4){reset();start();} return; }
  if(state!=='play'||phase!=='live'||acted) return;
  if(clock<arriveT) return;  // ball hasn't spilled out yet; ignore (no penalty for anticipating before it appears)
  acted=true; choice=dir;
  if(dir!==spot){ S.whiff(); resolve('whiff'); return; }
  const react=clock-arriveT;
  bang=react<=Math.min(200,coverDelay*0.4);
  S.goal(); resolve('goal');
}

function resolve(kind){
  phase='result'; result=kind; resultT=0;
  const good=(kind==='goal');
  if(good){
    outs++; combo++;
    let add=Math.round((bang?170:110)*(1+Math.min(9,combo-1)*0.15)); score+=add;
    flash=1;flashCol=bang?'#8affa0':'#ffe08a';shake=bang?8:5;
    burst(SPOTS[spot].x,GOALY+20,bang?'#8affa0':'#ffe08a',bang?20:12,6);
    pop(SPOTS[spot].x,GOALY+4,(bang?'電光石火のゴール！ +':'押し込んだ！ +')+add,bang?'#d6ffe0':'#fff3c4');
    if(combo>=2)pop(450,220,'コンボ x'+combo,'#ffd24d');
    if(combo>0&&combo%5===0)S.streak();
    msg=bang?'一瞬の反応でこぼれ球を仕留めた！':'こぼれ球にいち早く詰めてゴール！';
  } else {
    fails++; combo=0; flash=1;flashCol='#ff5b5b';shake=8;
    if(kind==='whiff') msg='逆へ飛び込んだ…こぼれた方向を見誤った';
    else { S.save(); msg='遅い！ GKが戻ってブロックされた'; }
    pop(SPOTS[spot].x,GOALY+40,kind==='whiff'?'空振り':'セーブ','#ffb0b0');
  }
  if(fails>=3){ state='over'; resultT=0; S.over(); if(score>best){best=score;localStorage.setItem('pounce_best',best);} }
}

// ---------- input ----------
cv.addEventListener('pointerdown',e=>{e.preventDefault();
  if(state==='title'){start();return;}
  if(state==='over'){ if(resultT>0.4){reset();start();} return; }
  const r=cv.getBoundingClientRect(); const x=(e.clientX-r.left)/r.width;
  pounce(x<0.4?0:x<0.6?1:2);
});
addEventListener('keydown',e=>{
  if(e.repeat)return;
  if(e.code==='ArrowLeft'||e.code==='KeyA'){e.preventDefault();pounce(0);}
  else if(e.code==='ArrowDown'||e.code==='ArrowUp'||e.code==='KeyS'||e.code==='KeyW'){e.preventDefault();pounce(1);}
  else if(e.code==='ArrowRight'||e.code==='KeyD'){e.preventDefault();pounce(2);}
  else if(e.code==='Space'||e.code==='Enter'){e.preventDefault(); if(state!=='play')pounce(1);}
});

// ---------- particles ----------
function burst(x,y,c,n,sp){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=rnd(sp*0.3,sp);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:1,c});}}
function pop(x,y,txt,c){pops.push({x,y,txt,c,life:1});}

// ---------- update ----------
function update(dt){
  shake*=Math.pow(0.86,dt/16.7); if(shake<0.3)shake=0;
  flash*=Math.pow(0.9,dt/16.7);
  for(const p of parts){p.vx*=0.96;p.vy=p.vy*0.96+0.28;p.x+=p.vx*dt/16.7;p.y+=p.vy*dt/16.7;p.life-=dt/16.7*0.026;}
  parts=parts.filter(p=>p.life>0);
  for(const p of pops){p.y-=dt/16.7*0.5;p.life-=dt/16.7*0.02;}
  pops=pops.filter(p=>p.life>0);

  if(state!=='play'){ if(state==='over')resultT+=dt/1000; return; }
  t+=dt;
  if(phase==='parry'||phase==='live'){
    clock+=dt;
    if(phase==='parry' && clock>=parryT){ phase='live'; S.parry(); }
    if(phase==='live' && !acted && clock>=coverT){ resolve('saved'); }
    return;
  }
  if(phase==='result'){
    resultT+=dt/1000;
    shotU=Math.min(1,shotU+dt/160); gkU=Math.min(1,gkU+dt/300);
    if(resultT>1.05 && state==='play') newPlay();
    return;
  }
}

// ---------- render ----------
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function drawScene(){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#256d34');g.addColorStop(1,'#184a22');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='rgba(255,255,255,0.035)';
  for(let i=0;i<7;i++){ if(i%2===0)ctx.fillRect(0,i*H/7,W,H/7); }
  // goal
  ctx.fillStyle='rgba(255,255,255,0.10)';ctx.fillRect(GL-6,GOALY-52,GW+12,52);
  ctx.strokeStyle='#f2f4f6';ctx.lineWidth=6;
  ctx.beginPath();ctx.moveTo(GL-6,GOALY);ctx.lineTo(GL-6,GOALY-52);ctx.lineTo(GR+6,GOALY-52);ctx.lineTo(GR+6,GOALY);ctx.stroke();
  ctx.strokeStyle='rgba(255,255,255,0.14)';ctx.lineWidth=1;
  for(let x=GL;x<=GR;x+=15){ctx.beginPath();ctx.moveTo(x,GOALY-50);ctx.lineTo(x,GOALY-2);ctx.stroke();}
  // 6-yard box
  ctx.strokeStyle='rgba(255,255,255,0.12)';ctx.lineWidth=2;ctx.strokeRect(GL-40,GOALY,GW+80,150);
}
function drawFig(x,y,col,s){ s=s||1; ctx.fillStyle='rgba(0,0,0,0.22)';ctx.beginPath();ctx.ellipse(x,y+12*s,10*s,3.5*s,0,0,6.28);ctx.fill();
  ctx.fillStyle=col;rr(x-8*s,y-10*s,16*s,24*s,6);ctx.fill();
  ctx.fillStyle='#f2c9a0';ctx.beginPath();ctx.arc(x,y-14*s,6*s,0,6.28);ctx.fill(); }

function render(){
  ctx.save();
  if(shake>0)ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
  drawScene();

  if(state==='play'){
    // GK: starts having just parried (center, on ground), recovers toward the spot in 'live'
    let gkx=450, gky=GOALY+14;
    if(phase==='live'){ const rec=clamp((clock-arriveT)/coverDelay,0,1); gkx=lerp(450, SPOTS[spot].x, easeOut(rec)); gky=lerp(GOALY+30, SPOTS[spot].y-10, easeOut(rec)); }
    else if(phase==='result'){ if(result==='saved'||result==='whiff'){ gkx=SPOTS[spot].x; gky=SPOTS[spot].y-10; } else { gkx=lerp(450,SPOTS[spot].x,0.4); gky=GOALY+20; } }
    else { gkx=450; gky=GOALY+18; }
    drawFig(gkx,gky,'#e23c3c',1.05);

    // rebound ball
    if(phase==='parry'){
      // ball being parried outward from goal
      const u=clamp(clock/parryT,0,1); const bx=lerp(450,SPOTS[spot].x*0.6+180,u), by=lerp(GOALY+10,GOALY+40,u);
      ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(bx,by,7,0,6.28);ctx.fill();
    } else if(phase==='live'){
      const u=clamp((clock-parryT)/(arriveT-parryT),0,1);
      const bx=lerp(450,SPOTS[spot].x,easeOut(u)), by=lerp(GOALY+40,SPOTS[spot].y,easeOut(u));
      // flash the spot once arrived
      if(clock>=arriveT){ const rw=clamp((clock-arriveT)/coverDelay,0,1);
        ctx.strokeStyle='rgba(150,240,170,'+(0.9*(1-rw))+')';ctx.lineWidth=3;ctx.beginPath();ctx.arc(SPOTS[spot].x,SPOTS[spot].y,20+rw*30,0,6.28);ctx.stroke();
        ctx.fillStyle='rgba(150,240,170,'+(0.85*(1-rw))+')';ctx.font='bold 15px sans-serif';ctx.textAlign='center';ctx.fillText(SNAME[spot]+'へこぼれた！ 詰めろ！',SPOTS[spot].x,SPOTS[spot].y+40);
      }
      ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(bx,by,8,0,6.28);ctx.fill();
      ctx.strokeStyle='#333';ctx.lineWidth=1.2;ctx.beginPath();ctx.arc(bx,by,8,0.6,2.4);ctx.stroke();
    } else {
      // result
      if(result==='goal'){ const bx=lerp(SPOTS[spot].x,SPOTS[spot].x,shotU), by=lerp(SPOTS[spot].y,GOALY-20,easeOut(shotU));
        ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(bx,by,7,0,6.28);ctx.fill();
        // attacker lunging in
        drawFig(SPOTS[spot].x-18, SPOTS[spot].y+6, '#2b6cff',1.0);
      } else {
        ctx.globalAlpha=clamp(1.2-resultT,0,1);ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(SPOTS[spot].x,SPOTS[spot].y,8,0,6.28);ctx.fill();ctx.globalAlpha=1;
        if(result==='whiff'){ drawFig(SPOTS[(choice+1)%3].x, SPOTS[1].y+30, '#2b6cff',1.0); }
      }
    }

    // three lane hint markers (bottom)
    for(let i=0;i<3;i++){ ctx.fillStyle='rgba(255,255,255,0.14)';rr(SPOTS[i].x-40,H-70,80,30,8);ctx.fill();
      ctx.fillStyle='rgba(255,255,255,0.6)';ctx.font='13px sans-serif';ctx.textAlign='center';ctx.fillText(SNAME[i]+(i===0?' ←':i===2?' →':' ↓'),SPOTS[i].x,H-50); }
  }

  for(const p of parts){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,3.2,0,6.28);ctx.fill();}
  ctx.globalAlpha=1;
  for(const p of pops){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.font='bold 22px sans-serif';ctx.textAlign='center';ctx.fillText(p.txt,p.x,p.y);}
  ctx.globalAlpha=1;

  // HUD
  ctx.textAlign='left';ctx.fillStyle='#fff';ctx.font='bold 26px sans-serif';ctx.fillText('SCORE '+score,20,36);
  ctx.textAlign='right';ctx.fillStyle='rgba(255,255,255,0.9)';ctx.font='14px sans-serif';ctx.fillText('ゴール '+outs+'  Lv'+lvl,W-20,24);
  ctx.fillText('失敗',W-92,46);
  for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(W-60+i*20,41,7,0,6.28);ctx.fillStyle=i<fails?'#ff5b5b':'rgba(255,255,255,0.25)';ctx.fill();}
  if(combo>=2){ctx.textAlign='center';ctx.fillStyle='#ffd24d';ctx.font='bold 18px sans-serif';ctx.fillText('コンボ x'+combo,450,250);}

  if(state==='play'&&(phase==='parry'||phase==='live')){ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,0.9)';ctx.font='bold 15px sans-serif';
    ctx.fillText('GKが弾く！ こぼれた方向（左/中/右）へ、GKが戻る前に素早く詰めろ',W/2,58);}
  if(state==='play'&&phase==='result'&&msg){ctx.textAlign='center';ctx.fillStyle=(result==='goal')?'#9ff0b8':'#ff9a9a';ctx.font='bold 20px sans-serif';ctx.fillText(msg,W/2,58);}

  if(state==='title'){
    ctx.fillStyle='rgba(5,12,7,0.78)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='bold 40px sans-serif';ctx.fillText('こぼれ球ドカン',W/2,110);
    ctx.fillStyle='#ffd23e';ctx.font='bold 22px sans-serif';ctx.fillText('Pounce the Rebound',W/2,146);
    ctx.fillStyle='rgba(255,255,255,0.92)';ctx.font='16px sans-serif';
    ctx.fillText('GKが弾いたこぼれ球に、誰よりも早く詰めて押し込む一瞬の反応勝負',W/2,196);
    ctx.fillStyle='rgba(255,255,255,0.66)';ctx.font='14px sans-serif';
    ctx.fillText('シュートをGKが弾く→こぼれ球が左・中・右のどこかへ不規則に転がる',W/2,236);
    ctx.fillText('こぼれた方向へ素早く詰める：左半分/←、中央/↓、右半分/→',W/2,258);
    ctx.fillText('GKが戻ってそのコースを塞ぐ前にタップできればゴール',W/2,280);
    ctx.fillText('逆方向へ飛び込むと空振り、遅れるとGKにブロックされる',W/2,302);
    ctx.fillText('速く反応するほど“電光石火”で高得点。上級ほど戻りが速い。3失敗で交代',W/2,324);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で開始',W/2,388);
    ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='14px sans-serif';ctx.fillText('BEST '+best,W/2,420);
  }
  if(state==='over'){
    ctx.fillStyle='rgba(5,12,7,0.84)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#ff6b6b';ctx.font='bold 46px sans-serif';ctx.fillText('3失敗…交代',W/2,222);
    ctx.fillStyle='#fff';ctx.font='bold 40px sans-serif';ctx.fillText('SCORE '+score,W/2,290);
    ctx.fillStyle='rgba(255,255,255,0.85)';ctx.font='19px sans-serif';ctx.fillText('ゴール '+outs+'   BEST '+best,W/2,330);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で もう一度',W/2,402);
  }

  if(flash>0.02){ctx.globalAlpha=flash*0.5;ctx.fillStyle=flashCol;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}
  ctx.restore();

  ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,0.4)';ctx.font='12px sans-serif';
  ctx.fillText('こぼれた方向（左/中/右）へGKが戻る前に素早く詰める。逆方向=空振り、遅れ=セーブ。3失敗で交代',W/2,H-8);
}

function frame(ts){let dt=ts-last;last=ts;if(dt>60)dt=60;if(dt<0)dt=0;update(dt);render();requestAnimationFrame(frame);}
requestAnimationFrame(frame);

// ---------- test hook ----------
window.__pn={
  start, pounce:(d)=>pounce(d),
  get state(){return state;},
  get score(){return score;},
  get outs(){return outs;},
  get fails(){return fails;},
  get info(){return {state,phase,spot,arriveT,coverT,coverDelay,clock,
    spilled:(phase==='live'&&clock>=arriveT),canPounce:(phase==='live'&&!acted&&clock>=arriveT),
    acted,choice,result,outs,fails,lvl};}
};
})();
</script>
</body>
</html>
