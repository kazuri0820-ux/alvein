<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ワンツー (Give-and-Go)</title>
<style>
  html,body{margin:0;height:100%;background:#0a1a10;overflow:hidden;
    font-family:-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  #stage{position:relative;width:100vw;height:100vh;max-width:calc(100vh*1.5);max-height:calc(100vw/1.5);aspect-ratio:900/600;}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;border-radius:6px;}
</style>
</head>
<body>
<div id="wrap"><div id="stage"><canvas id="cv"></canvas></div></div>
<script>
(function(){
const W=900,H=600,cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let DPR=1;
function fit(){DPR=Math.min(2,window.devicePixelRatio||1);cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
fit();addEventListener('resize',fit);

// ---------- audio ----------
let AC=null;function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function tone(f,d,type,v,sweep){const a=ac();if(!a)return;const t=a.currentTime,o=a.createOscillator(),g=a.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(sweep)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+sweep),t+d);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v||0.2,t+0.008);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+0.02);}
function noise(d,v,hp){const a=ac();if(!a)return;const t=a.currentTime,n=Math.floor(a.sampleRate*d),buf=a.createBuffer(1,n,a.sampleRate),ch=buf.getChannelData(0);
  for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource();s.buffer=buf;
  const f=a.createBiquadFilter();f.type='highpass';f.frequency.value=hp||600;const g=a.createGain();g.gain.value=v||0.2;
  s.connect(f);f.connect(g);g.connect(a.destination);s.start(t);s.stop(t+d+0.02);}
const S={
  pass:()=>{tone(440,0.09,'square',0.13,120);noise(0.05,0.1,700);},
  burst:()=>{noise(0.1,0.16,500);tone(300,0.1,'sine',0.1,160);},
  goal:()=>{[660,880,1100,1320,1650].forEach((f,i)=>setTimeout(()=>tone(f,0.15,'triangle',0.2),i*80));noise(0.5,0.12,300);},
  cut:()=>{noise(0.14,0.28,300);tone(200,0.16,'sawtooth',0.14,-70);},
  offside:()=>{tone(880,0.14,'square',0.14);setTimeout(()=>tone(880,0.14,'square',0.14),180);},
  late:()=>{tone(260,0.28,'sawtooth',0.18,-110);},
  over:()=>{[440,330,247,175].forEach((f,i)=>setTimeout(()=>tone(f,0.3,'triangle',0.2),i*160));}
};

// ---------- geometry ----------
const GX0=360,GX1=540, BAR_Y=86, GL_Y=150;
const P0={x:450,y:508};
const RP={x:450,y:222};      // return receive point (in behind)
const DY=398;                // defender line
const OFF_Y=DY;              // offside reference

// ---------- state ----------
let state='title', phase='setup', t=0, plays=0;
let score=0, combo=0, best=+(localStorage.getItem('give_best')||0);
let goals=0, fails=0, lvl=1;
let Wp={x:250,y:300,side:-1};
let D={x:450,dir:1,vx:0};
let P={x:450,y:508,run:0};
let gk={x:450,dx:0};
let ball={x:450,y:508,vis:true};
let trun=0, retDur=1400, burstAt=-1, wStrike=0.62, passLaneOpen=false;
let result=null, resultT=0, msg='', msg2='';
let shake=0, flash=0, flashCol='#fff', last=performance.now();
let parts=[], pops=[];

function rnd(a,b){return a+Math.random()*(b-a);}
function chance(p){return Math.random()<p;}
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function segDist(px,py,ax,ay,bx,by){const dx=bx-ax,dy=by-ay;const L=dx*dx+dy*dy||1;let tt=((px-ax)*dx+(py-ay)*dy)/L;tt=clamp(tt,0,1);const cx=ax+dx*tt,cy=ay+dy*tt;return Math.hypot(px-cx,py-cy);}

function reset(){state='title';score=0;combo=0;goals=0;fails=0;lvl=1;plays=0;result=null;parts=[];pops=[];}

function newPlay(){
  plays++;
  lvl=Math.min(6,1+Math.floor(plays/3));
  const side=chance(0.5)?-1:1;
  Wp={x:450+side*220, y:300, side};
  // defender guards the passing lane: oscillate centered on where the P->W lane crosses DY
  const frac=(P0.y-DY)/(P0.y-Wp.y);
  const laneX=P0.x+(Wp.x-P0.x)*frac;
  D={x:laneX, cx:laneX, dir:chance(0.5)?1:-1, vx:0, amp:92+lvl*8, spd:0.11+lvl*0.02};
  passLaneOpen=false;
  P={x:450,y:508,run:0};
  gk={x:450+ (chance(0.5)?-1:1)*rnd(20,60), dx:0};
  ball={x:P0.x,y:P0.y,vis:true};
  retDur=Math.max(900,1500-lvl*90);
  wStrike=Math.max(0.5,0.66-lvl*0.02);
  trun=0; burstAt=-1;
  phase='setup'; t=0; result=null;
  msg='① 壁パスを通せ'; msg2='DFがコースを切る、開いた瞬間に';
}

function start(){ if(!ac())ac(); if(AC&&AC.state==='suspended')AC.resume(); reset(); state='play'; newPlay(); }

// ---------- actions ----------
function act(){
  if(state==='title'){start();return;}
  if(state==='over'){ if(resultT>0.5){reset();start();} return; }
  if(state!=='play')return;
  if(phase==='setup'){
    // attempt the wall pass
    const dist=segDist(D.x,DY, P0.x,P0.y, Wp.x,Wp.y);
    if(dist<40){ // D cuts the lane
      S.cut(); passLaneOpen=false;
      ball.vis=true;
      applyResult('cut');
    } else {
      S.pass(); phase='return'; trun=0; ball.vis=true;
      msg='② リターンに抜け出せ'; msg2='壁が返す瞬間に走れ（早いとオフサイド）';
    }
  } else if(phase==='return'){
    if(burstAt<0){ burstAt=trun; S.burst();
      // evaluate
      if(burstAt < wStrike-0.16){ applyResult('offside'); }
      else { phase='run'; P.run=0; msg=''; msg2=''; }
    }
  }
}

function applyResult(kind){
  result=kind; resultT=0; phase='resolve';
  if(kind==='goal'||kind==='great'){
    const base=kind==='great'?240:150; combo++; const mult=1+Math.min(5,combo-1)*0.25; const add=Math.round(base*mult);
    score+=add; goals++;
    S.goal();
    flash=1;flashCol=kind==='great'?'#ffe08a':'#8ff0b8';shake=kind==='great'?15:10;
    burst(RP.x,GL_Y,kind==='great'?'#ffe08a':'#bfffd0',kind==='great'?34:22,8);
    pop(450,GL_Y+8,(kind==='great'?'完璧なワンツー！ ':'ゴール！ ')+'+'+add,'#eaffef');
    if(combo>=2)pop(450,GL_Y-18,'コンボ x'+combo,'#ffe08a');
    msg=kind==='great'?'完璧なワンツー！ 一気に抜けた':'ゴール！ 壁パスで崩した'; msg2='';
  } else {
    combo=0; fails++;
    if(kind==='cut'){S.cut();msg='カット！ パスコースを読まれた';msg2='DFが切っていない瞬間に通せ';}
    else if(kind==='offside'){S.offside();msg='オフサイド！ 飛び出しが早い';msg2='壁が返す瞬間に走れ';}
    else {S.late();msg='戻られた！ 抜け出しが遅い';msg2='もっと早くスタートを';}
    flash=1;flashCol='#ff6b6b';shake=9;
    burst(P.x,P.y,'#ff8a8a',16,5);
  }
}

// ---------- input ----------
cv.addEventListener('pointerdown',e=>{e.preventDefault();act();});
addEventListener('keydown',e=>{ if(e.code==='Space'||e.code==='Enter'||e.code==='ArrowUp'){e.preventDefault();act();}});

// ---------- particles ----------
function burst(x,y,c,n,sp){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=rnd(sp*0.3,sp);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:1,c});}}
function pop(x,y,txt,c){pops.push({x,y,txt,c,life:1});}

// ---------- update ----------
function update(dt){
  shake*=Math.pow(0.86,dt/16.7); if(shake<0.3)shake=0;
  flash*=Math.pow(0.9,dt/16.7);
  for(const p of parts){p.vx*=0.96;p.vy=p.vy*0.96+0.3;p.x+=p.vx*dt/16.7;p.y+=p.vy*dt/16.7;p.life-=dt/16.7*0.026;}
  parts=parts.filter(p=>p.life>0);
  for(const p of pops){p.y-=dt/16.7*0.5;p.life-=dt/16.7*0.018;}
  pops=pops.filter(p=>p.life>0);

  if(state!=='play'){ if(state==='over')resultT+=dt/1000; return; }
  t+=dt;

  if(phase==='setup'){
    D.x += D.dir*D.spd*dt;
    if(D.x>D.cx+D.amp){D.x=D.cx+D.amp;D.dir=-1;} if(D.x<D.cx-D.amp){D.x=D.cx-D.amp;D.dir=1;}
    passLaneOpen = segDist(D.x,DY, P0.x,P0.y, Wp.x,Wp.y) >= 40;
    ball.x=P0.x; ball.y=P0.y;
    return;
  }
  if(phase==='return'){
    trun += dt/retDur;
    // ball travels to W then W holds; D starts drifting to recover centrally toward RP
    if(trun<0.5){ // pass to wall
      const q=clamp(trun/0.5,0,1); ball.x=P0.x+(Wp.x-P0.x)*q; ball.y=P0.y+(Wp.y-P0.y)*q;
    } else { ball.x=Wp.x; ball.y=Wp.y; }
    // defender recovers toward central/RP as play develops
    D.x += (450 - D.x)*Math.min(1,dt/16.7*0.04);
    if(trun>=1.15 && burstAt<0){ applyResult('late'); }
    return;
  }
  if(phase==='run'){
    P.run += dt/ Math.max(420,700-lvl*40);
    const q=clamp(P.run,0,1);
    // P sprints to RP
    P.x=P0.x+(RP.x-P0.x)*q; P.y=P0.y+(RP.y-P0.y)*q;
    // return ball from W to RP timed to meet
    ball.x=Wp.x+(RP.x-Wp.x)*q; ball.y=Wp.y+(RP.y-Wp.y)*q;
    if(q>=1){
      // finish: was burst timed well?
      const err=Math.abs(burstAt-wStrike);
      if(err<0.10) finishShot('great'); else finishShot('goal');
    }
    return;
  }
  if(phase==='finish'){
    P.finishT += dt/500; const q=clamp(P.finishT,0,1);
    ball.x=RP.x+(gShot.x-RP.x)*q; ball.y=RP.y+(gShot.y-RP.y)*q - Math.sin(q*Math.PI)*20;
    gk.dx += ((gShot.x)-(gk.x+gk.dx))*Math.min(1,dt/16.7*0.06);
    if(q>=1){ applyResult(gRes); }
    return;
  }
  if(phase==='resolve'){
    resultT+=dt/1000;
    if(resultT>1.15){
      if(fails>=3){ state='over'; resultT=0; S.over(); if(score>best){best=score;localStorage.setItem('give_best',best);} }
      else newPlay();
    }
    return;
  }
}

let gShot={x:450,y:GL_Y}, gRes='goal', gk2=0;
function finishShot(kind){
  phase='finish'; P.finishT=0; gRes=kind;
  // aim to a corner away from gk
  const corner = gk.x<450 ? GX1-16 : GX0+16;
  gShot={x:corner, y:BAR_Y+18};
}

// ---------- render ----------
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

function drawScene(){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#0f3322');g.addColorStop(0.5,'#1a5233');g.addColorStop(1,'#218048');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='rgba(255,255,255,0.03)';for(let i=0;i<6;i++){if(i%2)ctx.fillRect(0,100+i*84,W,84);}
  // goal
  ctx.fillStyle='rgba(255,255,255,0.06)';ctx.fillRect(GX0,BAR_Y,GX1-GX0,GL_Y-BAR_Y);
  ctx.strokeStyle='rgba(255,255,255,0.15)';ctx.lineWidth=1;
  for(let x=GX0;x<=GX1;x+=15){ctx.beginPath();ctx.moveTo(x,BAR_Y);ctx.lineTo(x,GL_Y);ctx.stroke();}
  for(let y=BAR_Y;y<GL_Y;y+=13){ctx.beginPath();ctx.moveTo(GX0,y);ctx.lineTo(GX1,y);ctx.stroke();}
  ctx.strokeStyle='#f4f4f4';ctx.lineWidth=6;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(GX0,GL_Y);ctx.lineTo(GX0,BAR_Y);ctx.lineTo(GX1,BAR_Y);ctx.lineTo(GX1,GL_Y);ctx.stroke();
  ctx.strokeStyle='rgba(255,255,255,0.8)';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(120,GL_Y);ctx.lineTo(780,GL_Y);ctx.stroke();
  // offside line (subtle) during setup/return
  if(state==='play'&&(phase==='setup'||phase==='return')){
    ctx.strokeStyle='rgba(255,220,120,0.35)';ctx.setLineDash([8,8]);ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(150,OFF_Y);ctx.lineTo(750,OFF_Y);ctx.stroke();ctx.setLineDash([]);
    ctx.fillStyle='rgba(255,220,120,0.5)';ctx.font='11px sans-serif';ctx.textAlign='left';ctx.fillText('オフサイドライン',600,OFF_Y-6);
  }
}

function drawPlayer(x,y,col,dark,label){
  ctx.fillStyle='rgba(0,0,0,0.22)';ctx.beginPath();ctx.ellipse(x,y+16,12,4,0,0,6.28);ctx.fill();
  ctx.fillStyle=col; rr(x-8,y-6,16,22,6);ctx.fill();
  ctx.fillStyle='#f2c9a0';ctx.beginPath();ctx.arc(x,y-14,7,0,6.28);ctx.fill();
  ctx.fillStyle=dark;ctx.beginPath();ctx.arc(x,y-16,7.5,Math.PI,0);ctx.fill();
  if(label){ctx.fillStyle='rgba(255,255,255,0.85)';ctx.font='bold 11px sans-serif';ctx.textAlign='center';ctx.fillText(label,x,y+30);}
}

function drawLane(){
  if(state!=='play'||phase!=='setup')return;
  const open=passLaneOpen;
  ctx.strokeStyle=open?'rgba(126,240,176,0.7)':'rgba(255,120,120,0.5)';
  ctx.setLineDash([6,8]);ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(P0.x,P0.y-14);ctx.lineTo(Wp.x,Wp.y+6);ctx.stroke();ctx.setLineDash([]);
}

function drawWWindup(){
  if(state!=='play'||phase!=='return')return;
  // W winds up as trun approaches wStrike
  const near=clamp((trun-(wStrike-0.22))/0.22,0,1);
  if(near>0){
    ctx.strokeStyle='rgba(126,240,176,'+(0.4+0.5*near)+')';ctx.lineWidth=4;
    ctx.beginPath();ctx.arc(Wp.x,Wp.y,20+near*8,0,6.28*near);ctx.stroke();
    if(trun>=wStrike-0.05 && trun<wStrike+0.14){ ctx.fillStyle='#8ff0b8';ctx.font='bold 15px sans-serif';ctx.textAlign='center';ctx.fillText('今だ！',Wp.x,Wp.y-28); }
  }
}

function drawHUD(){
  ctx.textAlign='left';ctx.fillStyle='#fff';ctx.font='bold 26px sans-serif';ctx.fillText('SCORE '+score,20,36);
  ctx.textAlign='right';ctx.fillStyle='rgba(255,255,255,0.85)';ctx.font='14px sans-serif';ctx.fillText('ゴール '+goals+'  Lv.'+lvl,W-20,26);
  ctx.fillText('ミス',W-92,50);
  for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(W-66+i*22,46,7,0,6.28);ctx.fillStyle=i<fails?'#ff5b5b':'rgba(255,255,255,0.25)';ctx.fill();}
  if(combo>=2){ctx.textAlign='left';ctx.fillStyle='#ffe08a';ctx.font='bold 18px sans-serif';ctx.fillText('コンボ x'+combo,20,60);}
}

function drawBall(){
  if(!ball.vis)return;
  ctx.fillStyle='rgba(0,0,0,0.2)';ctx.beginPath();ctx.ellipse(ball.x,ball.y+7,7,3,0,0,6.28);ctx.fill();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(ball.x,ball.y,8,0,6.28);ctx.fill();
  ctx.strokeStyle='#333';ctx.lineWidth=1.3;ctx.beginPath();ctx.arc(ball.x,ball.y,8,0,6.28);ctx.stroke();
}

function render(){
  ctx.save();
  if(shake>0)ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
  drawScene();
  drawLane();
  drawWWindup();
  // keeper
  drawPlayer(gk.x+gk.dx, GL_Y-2, '#22d3a6', '#12796a');
  // wall teammate
  drawPlayer(Wp.x, Wp.y, '#2b6cff', '#1a3a8a', '壁');
  // defender
  drawPlayer(D.x, DY, '#e2413a', '#8a1f1a', 'DF');
  // you
  drawPlayer(P.x, P.y, '#2b6cff', '#1a3a8a', 'YOU');
  drawBall();

  for(const p of parts){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,3.2,0,6.28);ctx.fill();}
  ctx.globalAlpha=1;
  for(const p of pops){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.font='bold 22px sans-serif';ctx.textAlign='center';ctx.fillText(p.txt,p.x,p.y);}
  ctx.globalAlpha=1;

  drawHUD();

  if(state==='play'&&(msg||msg2)){
    ctx.textAlign='center';
    const good=result==='goal'||result==='great';
    ctx.fillStyle=result?(good?'#8ff0b8':'#ff9a9a'):'rgba(255,255,255,0.92)';
    ctx.font='bold 27px sans-serif';ctx.fillText(msg,W/2,H-58);
    if(msg2){ctx.fillStyle='rgba(255,255,255,0.72)';ctx.font='16px sans-serif';ctx.fillText(msg2,W/2,H-32);}
  }

  if(state==='title'){
    ctx.fillStyle='rgba(6,16,10,0.64)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='bold 50px sans-serif';ctx.fillText('ワンツー',W/2,200);
    ctx.fillStyle='#8ff0b8';ctx.font='bold 22px sans-serif';ctx.fillText('Give-and-Go',W/2,236);
    ctx.fillStyle='rgba(255,255,255,0.9)';ctx.font='18px sans-serif';
    ctx.fillText('① DFがパスコースを切る、開いた瞬間に壁パス（クリック/タップ/SPACE）',W/2,298);
    ctx.fillText('② 壁が返す“今だ！”に合わせて裏へ抜け出す（同ボタン）',W/2,326);
    ctx.fillStyle='rgba(255,255,255,0.66)';ctx.font='15px sans-serif';
    ctx.fillText('コースを読まれるとカット／飛び出しが早いとオフサイド／遅いと戻られる',W/2,368);
    ctx.fillText('リターンにドンピシャで完璧なワンツー＝大量加点。3ミスで終了',W/2,392);
    ctx.fillStyle='#ffe08a';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で開始',W/2,450);
    ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='14px sans-serif';ctx.fillText('BEST '+best,W/2,482);
  }
  if(state==='over'){
    ctx.fillStyle='rgba(6,16,10,0.74)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#ff6b6b';ctx.font='bold 46px sans-serif';ctx.fillText('3ミス…終了',W/2,230);
    ctx.fillStyle='#fff';ctx.font='bold 40px sans-serif';ctx.fillText('SCORE '+score,W/2,296);
    ctx.fillStyle='rgba(255,255,255,0.85)';ctx.font='20px sans-serif';ctx.fillText('ゴール '+goals+'   BEST '+best,W/2,336);
    ctx.fillStyle='#8ff0b8';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で もう一度',W/2,408);
  }

  if(flash>0.02){ctx.globalAlpha=flash*0.5;ctx.fillStyle=flashCol;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}
  ctx.restore();

  ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,0.4)';ctx.font='13px sans-serif';
  ctx.fillText('①コースが開いた瞬間に壁パス→②壁が返す瞬間に抜け出す。3ミスで終了',W/2,H-8);
}

function frame(ts){let dt=ts-last;last=ts;if(dt>60)dt=60;if(dt<0)dt=0;update(dt);render();requestAnimationFrame(frame);}
requestAnimationFrame(frame);

// ---------- test hook ----------
window.__gg={
  start, act,
  get state(){return state;},
  get score(){return score;},
  get goals(){return goals;},
  get fails(){return fails;},
  get info(){return {state,phase,trun,wStrike,laneOpen:passLaneOpen,burstAt,
    dfx:D.x,result,goals,fails,lvl};}
};
})();
</script>
</body>
</html>
