<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ショートコーナー (Work the Corner)</title>
<style>
  html,body{margin:0;height:100%;background:#06120a;overflow:hidden;
    font-family:-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  #stage{position:relative;width:100vw;height:100vh;max-width:calc(100vh*1.5);max-height:calc(100vw/1.5);aspect-ratio:900/600;}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;border-radius:6px;}
</style>
</head>
<body>
<div id="wrap"><div id="stage"><canvas id="cv"></canvas></div></div>
<script>
(function(){
const W=900,H=600,cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let DPR=1;
function fit(){DPR=Math.min(2,window.devicePixelRatio||1);cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
fit();addEventListener('resize',fit);

// ---------- audio ----------
let AC=null;function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function tone(f,d,type,v,sweep){const a=ac();if(!a)return;const t=a.currentTime,o=a.createOscillator(),g=a.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(sweep)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+sweep),t+d);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v||0.2,t+0.008);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+0.02);}
function noise(d,v,hp){const a=ac();if(!a)return;const t=a.currentTime,n=Math.floor(a.sampleRate*d),buf=a.createBuffer(1,n,a.sampleRate),ch=buf.getChannelData(0);
  for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource();s.buffer=buf;
  const f=a.createBiquadFilter();f.type='highpass';f.frequency.value=hp||600;const g=a.createGain();g.gain.value=v||0.2;
  s.connect(f);f.connect(g);g.connect(a.destination);s.start(t);s.stop(t+d+0.02);}
const S={
  pass:(n)=>{tone(520+ (n||0)*120,0.06,'triangle',0.11);},
  cross:()=>{noise(0.05,0.12,600);tone(360,0.06,'square',0.08,-60);},
  goal:()=>{[680,940,1220].forEach((f,i)=>setTimeout(()=>tone(f,0.11,'triangle',0.17),i*60));},
  worldy:()=>{[620,840,1080,1360,1650].forEach((f,i)=>setTimeout(()=>tone(f,0.12,'triangle',0.18),i*72));},
  bad:()=>{noise(0.18,0.22,300);tone(150,0.22,'sawtooth',0.12,-40);},
  streak:()=>{[700,930,1170,1400].forEach((f,i)=>setTimeout(()=>tone(f,0.1,'triangle',0.16),i*60));},
  over:()=>{[440,330,247,175].forEach((f,i)=>setTimeout(()=>tone(f,0.3,'triangle',0.2),i*160));}
};

// ---------- geometry ----------
const FLAG={x:110,y:520}, MATE1={x:250,y:452}, CROSS={x:320,y:360}, RUNNER={x:566,y:190};
const GL=430,GR=712,GBAR=118,GBOT=210;    // goal mouth (top)

// ---------- state ----------
let state='title', phase='b1', plays=0;
let score=0, combo=0, best=+(localStorage.getItem('sc_best')||0);
let outs=0, fails=0, lvl=1;   // outs = goals
let t=0, openT=290, w=440, tough=false;
let decided=false, result=null, resultT=0, msg='', msgOk=false, crisp=0, hitAt=0;
let ballSeg=0, ballU=0, goalU=0;
let shake=0, flash=0, flashCol='#fff', last=performance.now();
let parts=[], pops=[];

function rnd(a,b){return a+Math.random()*(b-a);}
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function lerp(a,b,u){return a+(b-a)*u;}
function easeOut(u){return 1-Math.pow(1-u,2);}
function beatNo(){return phase==='b1'?1:phase==='b2'?2:phase==='b3'?3:0;}

function reset(){state='title';score=0;combo=0;outs=0;fails=0;lvl=1;plays=0;result=null;parts=[];pops=[];}

function newPlay(){
  plays++; lvl=Math.min(7,1+Math.floor(outs/4));
  openT=clamp(300-lvl*8,220,300);
  w=clamp(450-lvl*24,320,450);
  tough=Math.random()<clamp(0.18+lvl*0.05,0.18,0.5);
  phase='b1'; t=0; decided=false; result=null; resultT=0; msg=''; msgOk=false; crisp=0; hitAt=0;
  ballSeg=0; ballU=0; goalU=0;
  S.pass(0);
}
function start(){ if(!ac())ac(); if(AC&&AC.state==='suspended')AC.resume(); reset(); state='play'; newPlay(); }

function nextBeat(n){
  if(t<=openT+w*0.45) crisp++;
  hitAt=t;
  if(n===1){ phase='b2'; t=0; ballSeg=1; S.pass(1); }
  else if(n===2){ phase='b3'; t=0; ballSeg=2; S.pass(2); }
  else { S.cross(); resolve('goal'); }
}

function act(){
  if(state==='title'){start();return;}
  if(state==='over'){ if(resultT>0.4){reset();start();} return; }
  if(state!=='play'||decided||phase==='result') return;
  const b=beatNo();
  if(t<openT){ resolve('early'); return; }
  if(t<=openT+w){ decidedGuard(); nextBeat(b); return; }
  resolve('late');
}
let _guard=false; function decidedGuard(){}

function resolve(k){
  phase='result'; result=k; resultT=0; decided=true;
  if(k==='goal'){
    outs++; combo++;
    const flow=(crisp>=3);
    let base=tough?250:150; if(flow)base+=90;
    let add=Math.round(base*(1+Math.min(9,combo-1)*0.14)); score+=add;
    setTimeout(S.goal,60); if(flow||tough)setTimeout(S.worldy,150);
    msgOk=true; flash=1;flashCol='#8affa0';shake=6; burst((GL+GR)/2,GBAR+40,'#8affa0',20,8);
    pop((GL+GR)/2,GBAR-16,(flow?'流れるようなショートコーナー！ +':'ニアで合わせてゴール！ +')+add,'#d6ffe0');
    if(combo>=2)pop(W/2,150,'コンボ x'+combo,'#ffd24d');
    if(combo>0&&combo%5===0)S.streak();
    msg=flow?'ワンツーからのクロスをニアでドンピシャ——澱みない崩し':'ショートコーナーの崩しからニアポストで合わせた——ゴール！';
  } else {
    fails++; combo=0; msgOk=false; flash=1;flashCol='#ff5b5b';shake=9; S.bad();
    const b=(phase==='result')?0:beatNo();
    if(k==='early') msg='タッチが早い…味方が動き出す前に触って合わずロスト';
    else msg='タッチが遅い…寄せてきた相手にカットされて崩し失敗';
    const seg=[MATE1,CROSS,RUNNER][Math.max(0,Math.min(2,ballSeg))];
    pop(seg.x,seg.y-24,k==='early'?'早い…':'カット…','#ffb0b0');
  }
  if(fails>=3){ state='over'; resultT=0; setTimeout(S.over,200); if(score>best){best=score;localStorage.setItem('sc_best',best);} }
}

// ---------- input ----------
cv.addEventListener('pointerdown',e=>{e.preventDefault();act();});
addEventListener('keydown',e=>{ if(e.repeat)return;
  if(e.code==='Space'||e.code==='Enter'||e.code==='ArrowUp'||e.code==='KeyF'){e.preventDefault();act();} });

// ---------- particles ----------
function burst(x,y,c,n,sp){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=rnd(sp*0.3,sp);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:1,c});}}
function pop(x,y,txt,c){pops.push({x,y,txt,c,life:1});}

// ---------- update ----------
function update(dt){
  shake*=Math.pow(0.86,dt/16.7); if(shake<0.3)shake=0;
  flash*=Math.pow(0.9,dt/16.7);
  for(const p of parts){p.vx*=0.96;p.vy=p.vy*0.96+0.28;p.x+=p.vx*dt/16.7;p.y+=p.vy*dt/16.7;p.life-=dt/16.7*0.026;}
  parts=parts.filter(p=>p.life>0);
  for(const p of pops){p.y-=dt/16.7*0.5;p.life-=dt/16.7*0.02;}
  pops=pops.filter(p=>p.life>0);

  if(state!=='play'){ if(state==='over')resultT+=dt/1000; return; }
  if(phase==='b1'||phase==='b2'||phase==='b3'){ t+=dt;
    ballU=clamp(t/(openT+w*0.6),0,1);
    if(!decided && t>openT+w){ resolve('late'); }
    return; }
  if(phase==='result'){ resultT+=dt/1000;
    if(result==='goal') goalU=Math.min(1,goalU+dt/300);
    if(resultT>1.5) newPlay(); return; }
}

// ---------- render ----------
function drawField(){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#0f5e34');g.addColorStop(0.5,'#12703f');g.addColorStop(1,'#0c4c2b');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  for(let i=0;i<7;i++){ctx.fillStyle=i%2?'rgba(255,255,255,0.03)':'rgba(0,0,0,0.03)';ctx.fillRect(0,i*86,W,86);}
  // goal + box (top)
  ctx.strokeStyle='rgba(255,255,255,0.28)';ctx.lineWidth=3;ctx.strokeRect(360,GBOT,420,150);
  ctx.fillStyle='rgba(255,255,255,0.06)';ctx.fillRect(GL,GBAR,GR-GL,GBOT-GBAR);
  ctx.strokeStyle='rgba(255,255,255,0.12)';ctx.lineWidth=1;
  for(let x=GL;x<=GR;x+=15){ctx.beginPath();ctx.moveTo(x,GBAR);ctx.lineTo(x,GBOT);ctx.stroke();}
  ctx.strokeStyle='#f2f2f2';ctx.lineWidth=6;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(GL,GBOT);ctx.lineTo(GL,GBAR);ctx.lineTo(GR,GBAR);ctx.lineTo(GR,GBOT);ctx.stroke();ctx.lineCap='butt';
  // corner flag
  ctx.strokeStyle='rgba(255,255,255,0.6)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(FLAG.x-4,FLAG.y+18);ctx.lineTo(FLAG.x-4,FLAG.y-14);ctx.stroke();
  ctx.fillStyle='#ffd24d';ctx.beginPath();ctx.moveTo(FLAG.x-4,FLAG.y-14);ctx.lineTo(FLAG.x+12,FLAG.y-9);ctx.lineTo(FLAG.x-4,FLAG.y-4);ctx.closePath();ctx.fill();
}
function person(x,y,col,s,label){s=s||1;ctx.fillStyle=col;ctx.beginPath();ctx.ellipse(x,y-15*s,10*s,16*s,0,0,6.28);ctx.fill();
  ctx.fillStyle='#f0c9a0';ctx.beginPath();ctx.arc(x,y-34*s,7.5*s,0,6.28);ctx.fill();
  if(label){ctx.fillStyle='rgba(255,255,255,0.7)';ctx.font='11px sans-serif';ctx.textAlign='center';ctx.fillText(label,x,y-48*s);}}

function render(){
  ctx.save();
  if(shake>0)ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
  drawField();

  if(state==='play'||state==='over'){
    // players
    person(FLAG.x+18,FLAG.y-6,'#2b6fd6',0.95,'自分');
    person(MATE1.x,MATE1.y,'#2b6fd6',0.95,'味方');
    person(RUNNER.x,RUNNER.y,'#2b6fd6',1,'ニア');
    // defenders (mark loosely)
    person(MATE1.x+42,MATE1.y+6,'#d0403a',0.9,null);
    person(RUNNER.x+40,RUNNER.y+2,'#d0403a',0.9,null);
    // GK
    person((GL+GR)/2+30,GBAR+30,'#23c36a',0.95,null);

    // pass path guides
    ctx.strokeStyle='rgba(255,255,255,0.12)';ctx.lineWidth=2;ctx.setLineDash([5,7]);
    const segs=[[FLAG.x+18,FLAG.y-14,MATE1.x,MATE1.y-10],[MATE1.x,MATE1.y-10,CROSS.x,CROSS.y-10],[CROSS.x,CROSS.y-10,RUNNER.x,RUNNER.y-8]];
    ctx.beginPath();for(const s of segs){ctx.moveTo(s[0],s[1]);ctx.lineTo(s[2],s[3]);}ctx.stroke();ctx.setLineDash([]);

    // ball
    let bx,by; const seg=segs[Math.min(2,ballSeg)];
    if(phase==='result'&&result==='goal'){ const u=easeOut(goalU); bx=lerp(RUNNER.x,(GL+GR)/2-30,u); by=lerp(RUNNER.y-8,GBAR+34,u); }
    else { const u=easeOut(ballU); bx=lerp(seg[0],seg[2],u); by=lerp(seg[1],seg[3],u); }
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(bx,by,7.5,0,6.28);ctx.fill();
    ctx.strokeStyle='#222';ctx.lineWidth=1.1;ctx.beginPath();ctx.arc(bx-2,by-2,4.5,0.6,2.6);ctx.stroke();

    // receiving ring for the active beat
    if((phase==='b1'||phase==='b2'||phase==='b3')&&t>=openT&&t<=openT+w){
      const rp=[MATE1,CROSS,RUNNER][beatNo()-1];
      ctx.strokeStyle='rgba(140,255,160,0.9)';ctx.lineWidth=3;ctx.beginPath();ctx.arc(rp.x,rp.y-8,18,0,6.28);ctx.stroke();
    }

    // cue + timer + beat pips
    ctx.textAlign='center';
    if(state==='play'&&(phase==='b1'||phase==='b2'||phase==='b3')){
      const names=['ショートパス！','リターン（ワンツー）！','ニアへクロス！'];
      if(t<openT){ ctx.fillStyle='rgba(255,220,90,0.95)';ctx.font='bold 21px sans-serif';ctx.fillText(['ショートで崩せ！ リズムよく3タッチ','ワンツーで前へ','走り込む味方へ合わせろ'][beatNo()-1],W/2,46); }
      else { ctx.fillStyle='rgba(150,255,170,0.98)';ctx.font='bold 22px sans-serif';ctx.fillText('今だ！ '+names[beatNo()-1],W/2,46);
        const p=clamp((t-openT)/w,0,1),bw=250,x=W/2-bw/2,y=58;
        ctx.fillStyle='rgba(255,255,255,0.18)';ctx.fillRect(x,y,bw,7);ctx.fillStyle=p<0.45?'#8affa0':(p<1?'#ffd24d':'#ff5b5b');ctx.fillRect(x,y,bw*p,7); }
      // beat pips
      for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(W/2-24+i*24,80,7,0,6.28);ctx.fillStyle=(i<beatNo()-1)?'#8affa0':(i===beatNo()-1?'#ffd24d':'rgba(255,255,255,0.25)');ctx.fill();}
    }
    if(state==='play'){ ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='12px sans-serif';ctx.textAlign='center';
      ctx.fillText('タップ／SPACE：① ショートパス → ② リターン → ③ クロス（3連続タイミング）',W/2,H-16); }
  }

  for(const p of parts){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,3.2,0,6.28);ctx.fill();}
  ctx.globalAlpha=1;
  for(const p of pops){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.font='bold 21px sans-serif';ctx.textAlign='center';ctx.fillText(p.txt,p.x,p.y);}
  ctx.globalAlpha=1;

  // HUD
  ctx.textAlign='left';ctx.fillStyle='#fff';ctx.font='bold 26px sans-serif';ctx.fillText('SCORE '+score,20,36);
  ctx.textAlign='right';ctx.fillStyle='rgba(255,255,255,0.9)';ctx.font='14px sans-serif';ctx.fillText('ゴール '+outs+'  Lv'+lvl,W-20,470);
  ctx.fillText('失',W-92,492);
  for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(W-60+i*20,487,7,0,6.28);ctx.fillStyle=i<fails?'#ff5b5b':'rgba(255,255,255,0.25)';ctx.fill();}
  if(combo>=2){ctx.textAlign='center';ctx.fillStyle='#ffd24d';ctx.font='bold 18px sans-serif';ctx.fillText('コンボ x'+combo,W/2,110);}

  if(state==='play'&&phase==='result'&&msg){ctx.textAlign='center';ctx.fillStyle=msgOk?'#9ff0b8':'#ff9a9a';ctx.font='bold 16px sans-serif';ctx.fillText(msg,W/2,H-44);}

  if(state==='title'){
    ctx.fillStyle='rgba(4,10,7,0.82)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='bold 40px sans-serif';ctx.fillText('ショートコーナー',W/2,90);
    ctx.fillStyle='#ffd23e';ctx.font='bold 20px sans-serif';ctx.fillText('Work the Corner',W/2,124);
    ctx.fillStyle='rgba(255,255,255,0.92)';ctx.font='16px sans-serif';
    ctx.fillText('コーナーを短く。ショートパス→ワンツー→クロスの3連続タッチをリズムよく決めて崩せ',W/2,180);
    ctx.fillStyle='rgba(255,255,255,0.66)';ctx.font='14px sans-serif';
    ctx.fillText('各タッチで、ボールが味方に届く“緑リング”の瞬間にタップ／SPACE＝つないで前進',W/2,218);
    ctx.fillText('触るのが早いと味方に合わずロスト、遅いと寄せてきた相手にカット（どちらも失敗）',W/2,242);
    ctx.fillText('3タッチ全てジャストで澱みなく決めるとニアで合わせて大量加点。3失敗で交代',W/2,266);
    ctx.fillText('上級ほどテンポが速く各リングも短い',W/2,290);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で開始',W/2,356);
    ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='14px sans-serif';ctx.fillText('BEST '+best,W/2,388);
  }
  if(state==='over'){
    ctx.fillStyle='rgba(4,10,7,0.84)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#ff6b6b';ctx.font='bold 46px sans-serif';ctx.fillText('3失敗…交代',W/2,224);
    ctx.fillStyle='#fff';ctx.font='bold 40px sans-serif';ctx.fillText('SCORE '+score,W/2,292);
    ctx.fillStyle='rgba(255,255,255,0.85)';ctx.font='19px sans-serif';ctx.fillText('ゴール '+outs+'   BEST '+best,W/2,332);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で もう一度',W/2,404);
  }

  if(flash>0.02){ctx.globalAlpha=flash*0.5;ctx.fillStyle=flashCol;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}
  ctx.restore();

  ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,0.4)';ctx.font='12px sans-serif';
  ctx.fillText('ショートコーナー：ショートパス→リターン→クロスの3タッチを各“緑リング”で決めてニアで合わせる。早い/遅いは失敗、3つで交代',W/2,H-2);
}

function frame(ts){let dt=ts-last;last=ts;if(dt>60)dt=60;if(dt<0)dt=0;update(dt);render();requestAnimationFrame(frame);}
requestAnimationFrame(frame);

// ---------- test hook ----------
window.__sc={
  start, act:()=>act(),
  get state(){return state;},
  get score(){return score;},
  get outs(){return outs;},
  get fails(){return fails;},
  get info(){return {state,phase,beat:beatNo(),t,openT,w,tough,decided,result,outs,fails,lvl,
    beatWin:((phase==='b1'||phase==='b2'||phase==='b3')&&t>=openT&&t<=openT+w),
    canAct:((phase==='b1'||phase==='b2'||phase==='b3')&&!decided)};}
};
})();
</script>
</body>
</html>
