<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ジャンピングキャッチ (Rob the Liner)</title>
<style>
  html,body{margin:0;height:100%;background:#0a0d06;overflow:hidden;
    font-family:-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  #stage{position:relative;width:100vw;height:100vh;max-width:calc(100vh*1.5);max-height:calc(100vw/1.5);aspect-ratio:900/600;}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;border-radius:6px;}
</style>
</head>
<body>
<div id="wrap"><div id="stage"><canvas id="cv"></canvas></div></div>
<script>
(function(){
const W=900,H=600,cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let DPR=1;
function fit(){DPR=Math.min(2,window.devicePixelRatio||1);cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
fit();addEventListener('resize',fit);

// ---------- audio ----------
let AC=null;function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function tone(f,d,type,v,sweep){const a=ac();if(!a)return;const t=a.currentTime,o=a.createOscillator(),g=a.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(sweep)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+sweep),t+d);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v||0.2,t+0.008);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+0.02);}
function noise(d,v,hp){const a=ac();if(!a)return;const t=a.currentTime,n=Math.floor(a.sampleRate*d),buf=a.createBuffer(1,n,a.sampleRate),ch=buf.getChannelData(0);
  for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource();s.buffer=buf;
  const f=a.createBiquadFilter();f.type='highpass';f.frequency.value=hp||600;const g=a.createGain();g.gain.value=v||0.2;
  s.connect(f);f.connect(g);g.connect(a.destination);s.start(t);s.stop(t+d+0.02);}
const S={
  crack:()=>{noise(0.05,0.18,400);tone(300,0.07,'square',0.1,120);},
  glove:()=>{noise(0.05,0.18,1400);[660,940,1220].forEach((f,i)=>setTimeout(()=>tone(f,0.1,'triangle',0.16),i*55));},
  hit:()=>{noise(0.16,0.2,300);tone(160,0.2,'sawtooth',0.12,-45);},
  streak:()=>{[700,930,1170,1400].forEach((f,i)=>setTimeout(()=>tone(f,0.1,'triangle',0.16),i*60));},
  over:()=>{[440,330,247,175].forEach((f,i)=>setTimeout(()=>tone(f,0.3,'triangle',0.2),i*160));}
};

// ---------- geometry ----------
const FLD={x:450,y:452}, BAT={x:450,y:110};
const ARR={ left:{x:360,y:392}, right:{x:540,y:392}, up:{x:450,y:344} };

// ---------- state ----------
let state='title', phase='live', plays=0;
let score=0, combo=0, best=+(localStorage.getItem('liner_best')||0);
let outs=0, fails=0, lvl=1;
let clock=0, contactT=640, win=200, grace=140, dir='up';
let committed=false, choice=null, result=null, resultT=0, msg='', anim=0, gem=false;
let shake=0, flash=0, flashCol='#fff', last=performance.now();
let parts=[], pops=[];

function rnd(a,b){return a+Math.random()*(b-a);}
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function lerp(a,b,u){return a+(b-a)*u;}
function easeOut(u){return 1-Math.pow(1-u,2);}

function reset(){state='title';score=0;combo=0;outs=0;fails=0;lvl=1;plays=0;result=null;parts=[];pops=[];}
function newPlay(){
  plays++; lvl=Math.min(7,1+Math.floor(outs/4));
  contactT=clamp(700-lvl*38,430,700);
  win=clamp(225-lvl*13,135,225);
  const r=Math.random(); dir = r<0.34?'left':(r<0.67?'right':'up');
  phase='live'; clock=0; committed=false; choice=null; result=null; resultT=0; msg=''; anim=0; gem=false;
  S.crack();
}
function start(){ if(!ac())ac(); if(AC&&AC.state==='suspended')AC.resume(); reset(); state='play'; newPlay(); }

function commit(c){   // c in 'left','right','up'
  if(state==='title'){start();return;}
  if(state==='over'){ if(resultT>0.4){reset();start();} return; }
  if(state!=='play'||phase!=='live'||committed) return;
  committed=true; choice=c; anim=0;
  const d=clock-contactT;
  if(c!==dir){ resolve('wrongdir'); return; }
  if(d < -win){ resolve('early'); return; }
  if(d > win){ resolve('late'); return; }
  gem=Math.abs(d)<=win*0.4; resolve('robbed');
}

function resolve(k){
  phase='result'; result=k; resultT=0; anim=0;
  if(k==='robbed'){
    outs++; combo++;
    let add=Math.round((gem?240:150)*(1+Math.min(9,combo-1)*0.14)); score+=add;
    S.glove(); flash=1;flashCol='#8affa0';shake=gem?9:6;
    const a=ARR[dir]; burst(a.x,a.y,'#8affa0',22,gem?10:7);
    pop(a.x,a.y-34,gem?'完全に読んだ！ 超美技！ +'+add:'ロブ！ ナイスキャッチ！ +'+add,'#d6ffe0');
    if(combo>=2&&!gem)pop(W/2,150,'コンボ x'+combo,'#ffd24d');
    if(combo>0&&combo%5===0)S.streak();
    msg=gem?'鋭いライナーを完璧に読んで横っ跳び／ジャンプ一閃！':'弾丸ライナーに好反応、抜けそうな当たりを掴んだ！';
  } else {
    fails++; combo=0; flash=1;flashCol='#ff5b5b';shake=9; S.hit();
    if(k==='wrongdir') msg='逆を突かれた…読み違いで横を抜かれた';
    else if(k==='early') msg='跳ぶのが早い…グラブが下りたところを抜かれた';
    else msg='反応が遅い…グラブが届く前に打球が抜けた';
    const a=ARR[dir];
    pop(a.x,a.y-24,'ヒット…','#ffb0b0');
  }
  if(fails>=3){ state='over'; resultT=0; S.over(); if(score>best){best=score;localStorage.setItem('liner_best',best);} }
}

// ---------- input ----------
function pickTap(e){ const r=cv.getBoundingClientRect(); const x=(e.clientX-r.left)/r.width*W, y=(e.clientY-r.top)/r.height*H;
  if(y<H*0.55) return 'up';
  return x<W/2?'left':'right';
}
cv.addEventListener('pointerdown',e=>{e.preventDefault();
  if(state!=='play'||phase!=='live'){ commit('up'); return; }
  commit(pickTap(e));
});
addEventListener('keydown',e=>{ if(e.repeat)return;
  if(e.code==='ArrowLeft'||e.code==='KeyA'){e.preventDefault();commit('left');}
  else if(e.code==='ArrowRight'||e.code==='KeyD'){e.preventDefault();commit('right');}
  else if(e.code==='ArrowUp'||e.code==='KeyW'||e.code==='Space'){e.preventDefault(); if(state==='play'&&phase==='live')commit('up'); else commit('up'); }
});

// ---------- particles ----------
function burst(x,y,c,n,sp){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=rnd(sp*0.3,sp);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:1,c});}}
function pop(x,y,txt,c){pops.push({x,y,txt,c,life:1});}

// ---------- update ----------
function update(dt){
  shake*=Math.pow(0.86,dt/16.7); if(shake<0.3)shake=0;
  flash*=Math.pow(0.9,dt/16.7);
  for(const p of parts){p.vx*=0.96;p.vy=p.vy*0.96+0.28;p.x+=p.vx*dt/16.7;p.y+=p.vy*dt/16.7;p.life-=dt/16.7*0.026;}
  parts=parts.filter(p=>p.life>0);
  for(const p of pops){p.y-=dt/16.7*0.5;p.life-=dt/16.7*0.02;}
  pops=pops.filter(p=>p.life>0);

  if(state!=='play'){ if(state==='over')resultT+=dt/1000; return; }
  if(phase==='live'){ clock+=dt; if(!committed && clock>contactT+win+grace){ committed=true; choice=null; resolve('late'); } return; }
  if(phase==='result'){ resultT+=dt/1000; anim=Math.min(1,anim+dt/520); if(resultT>1.15) newPlay(); return; }
}

// ---------- render ----------
function fielder(x,y,lean,leap){
  ctx.fillStyle='rgba(0,0,0,0.25)';ctx.beginPath();ctx.ellipse(x,y+14,14,4,0,0,6.28);ctx.fill();
  ctx.save();ctx.translate(x,y-(leap||0));ctx.rotate(lean||0);
  ctx.fillStyle='#3aa0ff';ctx.beginPath();ctx.moveTo(-7,-22);ctx.lineTo(7,-22);ctx.lineTo(6,12);ctx.lineTo(-6,12);ctx.closePath();ctx.fill();
  ctx.fillStyle='#f2c9a0';ctx.beginPath();ctx.arc(0,-28,6,0,6.28);ctx.fill();
  ctx.restore();
}
function glove(x,y){ ctx.fillStyle='#7a4a1e';ctx.beginPath();ctx.arc(x,y,8,0,6.28);ctx.fill();
  ctx.strokeStyle='#5a350f';ctx.lineWidth=2;ctx.beginPath();ctx.arc(x,y,8,0,6.28);ctx.stroke(); }
function drawScene(){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#2f6a2c');g.addColorStop(0.55,'#357a34');g.addColorStop(1,'#2b5f29');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  // infield dirt arc
  ctx.fillStyle='#9a6b3f';ctx.beginPath();ctx.arc(450,H+120,360,Math.PI,2*Math.PI);ctx.fill();
  for(let i=0;i<7;i++){ ctx.fillStyle=i%2?'rgba(255,255,255,0.025)':'rgba(0,0,0,0.025)'; ctx.fillRect(0,i*90,W,90); }
}

function render(){
  ctx.save();
  if(shake>0)ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
  drawScene();

  if(state==='play'||state==='over'){
    const t = phase==='live'? clamp(clock/contactT,0,1) : 1;
    const arr=ARR[dir];

    // fielder lean/leap based on commit
    let lean=0, leap=0, gx=FLD.x+9, gy=FLD.y-8;
    if(committed && choice){
      const u=easeOut(anim);
      if(choice==='left'){ lean=-0.6*u; gx=lerp(FLD.x+9,ARR.left.x,u); gy=lerp(FLD.y-8,ARR.left.y,u); }
      else if(choice==='right'){ lean=0.6*u; gx=lerp(FLD.x+9,ARR.right.x,u); gy=lerp(FLD.y-8,ARR.right.y,u); }
      else { leap=60*u; gx=FLD.x; gy=lerp(FLD.y-8,ARR.up.y,u); }
    }
    let fx=FLD.x, fy=FLD.y;
    if(committed&&choice==='left'){ fx=lerp(FLD.x,FLD.x-40,easeOut(anim)); }
    if(committed&&choice==='right'){ fx=lerp(FLD.x,FLD.x+40,easeOut(anim)); }
    fielder(fx,fy,lean,leap);
    glove(gx,gy);

    // ball: from bat toward arrival point (a rising line drive), continues past on miss
    let bx,by;
    if(phase==='live'){ bx=lerp(BAT.x,arr.x,t); by=lerp(BAT.y,arr.y,t); }
    else {
      if(result==='robbed'){ bx=gx; by=gy; }
      else { const u=easeOut(anim); bx=lerp(arr.x, arr.x+(dir==='left'?-120:dir==='right'?120:0), u); by=lerp(arr.y, arr.y+70, u); }
    }
    // motion streak
    ctx.strokeStyle='rgba(255,255,255,0.25)';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(lerp(BAT.x,arr.x,Math.max(0,t-0.12)),lerp(BAT.y,arr.y,Math.max(0,t-0.12)));ctx.lineTo(bx,by);ctx.stroke();
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(bx,by,7,0,6.28);ctx.fill();
    ctx.strokeStyle='#d33';ctx.lineWidth=1.3;ctx.beginPath();ctx.arc(bx,by,7,0.6,2.2);ctx.stroke();

    // direction hint arrow (early read) + timing ring
    if(state==='play'&&phase==='live'){
      // arrow toward arrival
      const inWin=Math.abs(clock-contactT)<=win;
      ctx.strokeStyle=inWin?'rgba(140,255,160,0.95)':'rgba(255,220,90,0.75)';ctx.lineWidth=4;
      const rem=clamp(1-clock/contactT,0,1);
      ctx.beginPath();ctx.arc(arr.x,arr.y,14+rem*44,0,6.28);ctx.stroke();

      ctx.textAlign='center';ctx.fillStyle=inWin?'rgba(140,255,160,0.98)':'rgba(255,255,255,0.9)';ctx.font='bold 18px sans-serif';
      ctx.fillText(inWin?'今だ！ 打球の方向へ跳べ！':'弾丸ライナー！ 抜ける方向を読め',W/2,48);
      ctx.fillStyle='rgba(255,255,255,0.66)';ctx.font='13px sans-serif';
      ctx.fillText('←左へ / →右へ / ↑正面ジャンプ（画面 左・右・上タップ）',W/2,70);
    }
  }

  for(const p of parts){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,3.2,0,6.28);ctx.fill();}
  ctx.globalAlpha=1;
  for(const p of pops){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.font='bold 20px sans-serif';ctx.textAlign='center';ctx.fillText(p.txt,p.x,p.y);}
  ctx.globalAlpha=1;

  // HUD
  ctx.textAlign='left';ctx.fillStyle='#fff';ctx.font='bold 26px sans-serif';ctx.fillText('SCORE '+score,20,36);
  ctx.textAlign='right';ctx.fillStyle='rgba(255,255,255,0.9)';ctx.font='14px sans-serif';ctx.fillText('美技 '+outs+'  Lv'+lvl,W-20,24);
  ctx.fillText('被安打',W-98,46);
  for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(W-60+i*20,41,7,0,6.28);ctx.fillStyle=i<fails?'#ff5b5b':'rgba(255,255,255,0.25)';ctx.fill();}
  if(combo>=2){ctx.textAlign='center';ctx.fillStyle='#ffd24d';ctx.font='bold 18px sans-serif';ctx.fillText('コンボ x'+combo,W/2,110);}

  if(state==='play'&&phase==='result'&&msg){ctx.textAlign='center';ctx.fillStyle=result==='robbed'?'#9ff0b8':'#ff9a9a';ctx.font='bold 19px sans-serif';ctx.fillText(msg,W/2,48);}

  if(state==='title'){
    ctx.fillStyle='rgba(4,8,4,0.80)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='bold 40px sans-serif';ctx.fillText('ジャンピングキャッチ',W/2,102);
    ctx.fillStyle='#ffd23e';ctx.font='bold 22px sans-serif';ctx.fillText('Rob the Liner',W/2,138);
    ctx.fillStyle='rgba(255,255,255,0.92)';ctx.font='16px sans-serif';
    ctx.fillText('二遊間の守備。抜けそうな弾丸ライナーに反応し、横っ跳び／ジャンプでもぎ取れ',W/2,190);
    ctx.fillStyle='rgba(255,255,255,0.66)';ctx.font='14px sans-serif';
    ctx.fillText('打球が抜ける方向を瞬時に読む：左へ抜ける＝←、右へ＝→、正面を襲う＝↑ジャンプ（画面 左/右/上タップ）',W/2,228);
    ctx.fillText('打球が届く瞬間（緑リング）に正しい方向へ跳べば好捕。素早く読み切るほど超美技で高得点',W/2,252);
    ctx.fillText('逆方向へ跳ぶ＝抜かれる、早すぎ＝グラブが下りて抜かれる、遅すぎ＝間に合わずヒット',W/2,276);
    ctx.fillText('上級ほどライナーが速く読む猶予が短い。3被安打で交代',W/2,300);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で開始',W/2,366);
    ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='14px sans-serif';ctx.fillText('BEST '+best,W/2,398);
  }
  if(state==='over'){
    ctx.fillStyle='rgba(4,8,4,0.84)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#ff6b6b';ctx.font='bold 46px sans-serif';ctx.fillText('3被安打…交代',W/2,222);
    ctx.fillStyle='#fff';ctx.font='bold 40px sans-serif';ctx.fillText('SCORE '+score,W/2,290);
    ctx.fillStyle='rgba(255,255,255,0.85)';ctx.font='19px sans-serif';ctx.fillText('美技 '+outs+'   BEST '+best,W/2,330);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で もう一度',W/2,402);
  }

  if(flash>0.02){ctx.globalAlpha=flash*0.5;ctx.fillStyle=flashCol;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}
  ctx.restore();

  ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,0.4)';ctx.font='12px sans-serif';
  ctx.fillText('ジャンピングキャッチ：弾丸ライナーの抜ける方向（左←/右→/正面↑）を読み、届く瞬間に跳んでもぎ取る。逆・早い・遅いは被安打、3つで交代',W/2,H-8);
}

function frame(ts){let dt=ts-last;last=ts;if(dt>60)dt=60;if(dt<0)dt=0;update(dt);render();requestAnimationFrame(frame);}
requestAnimationFrame(frame);

// ---------- test hook ----------
window.__jc={
  start, commit:(c)=>commit(c),
  get state(){return state;},
  get score(){return score;},
  get outs(){return outs;},
  get fails(){return fails;},
  get info(){return {state,phase,clock,contactT,win,dir,committed,choice,result,outs,fails,lvl,
    canAct:(phase==='live'&&!committed)};}
};
})();
</script>
</body>
</html>
