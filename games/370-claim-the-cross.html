<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>クロスをキャッチ (Claim the Cross)</title>
<style>
  html,body{margin:0;height:100%;background:#07100a;overflow:hidden;
    font-family:-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  #stage{position:relative;width:100vw;height:100vh;max-width:calc(100vh*1.5);max-height:calc(100vw/1.5);aspect-ratio:900/600;}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;border-radius:6px;}
</style>
</head>
<body>
<div id="wrap"><div id="stage"><canvas id="cv"></canvas></div></div>
<script>
(function(){
const W=900,H=600,cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let DPR=1;
function fit(){DPR=Math.min(2,window.devicePixelRatio||1);cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
fit();addEventListener('resize',fit);

// ---------- audio ----------
let AC=null;function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function tone(f,d,type,v,sweep){const a=ac();if(!a)return;const t=a.currentTime,o=a.createOscillator(),g=a.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(sweep)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+sweep),t+d);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v||0.2,t+0.008);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+0.02);}
function noise(d,v,hp){const a=ac();if(!a)return;const t=a.currentTime,n=Math.floor(a.sampleRate*d),buf=a.createBuffer(1,n,a.sampleRate),ch=buf.getChannelData(0);
  for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource();s.buffer=buf;
  const f=a.createBiquadFilter();f.type='highpass';f.frequency.value=hp||600;const g=a.createGain();g.gain.value=v||0.2;
  s.connect(f);f.connect(g);g.connect(a.destination);s.start(t);s.stop(t+d+0.02);}
const S={
  swing:()=>{tone(300,0.05,'sine',0.03);},
  claim:()=>{noise(0.05,0.16,700);tone(300,0.06,'square',0.08,-40);},
  good:()=>{[680,940,1220].forEach((f,i)=>setTimeout(()=>tone(f,0.1,'triangle',0.16),i*55));},
  big:()=>{[600,800,1000,1250].forEach((f,i)=>setTimeout(()=>tone(f,0.12,'triangle',0.17),i*80));},
  bad:()=>{noise(0.2,0.24,260);tone(150,0.24,'sawtooth',0.13,-50);},
  streak:()=>{[700,930,1170,1400].forEach((f,i)=>setTimeout(()=>tone(f,0.1,'triangle',0.16),i*60));},
  over:()=>{[440,330,247,175].forEach((f,i)=>setTimeout(()=>tone(f,0.3,'triangle',0.2),i*160));}
};

// ---------- geometry ----------
const GOAL={x:452,y:150}, GW=300, GH=70;      // goal mouth (top)
const GK={x:452,y:300};                         // keeper, in front of goal
const CLAIM={x:452,y:236};                      // apex claim point (above the keeper's head)
const CORNER={x:836,y:150};                     // ball swings in from the right corner

// ---------- state ----------
let state='title', phase='set', plays=0;
let score=0, combo=0, best=+(localStorage.getItem('cx_best')||0);
let outs=0, fails=0, lvl=1;   // outs = crosses claimed
let clock=0, apexT=900, pw=180, tough=false, attSide=1;
let decided=false, result=null, resultT=0, msg='', msgOk=false, quality=0, anim=0, jumpU=0;
let shake=0, flash=0, flashCol='#fff', last=performance.now();
let parts=[], pops=[];

function rnd(a,b){return a+Math.random()*(b-a);}
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function lerp(a,b,u){return a+(b-a)*u;}
function easeOut(u){return 1-Math.pow(1-u,2);}

function reset(){state='title';score=0;combo=0;outs=0;fails=0;lvl=1;plays=0;result=null;parts=[];pops=[];}

function newPlay(){
  plays++; lvl=Math.min(7,1+Math.floor(outs/4));
  apexT=clamp(1020-lvl*40,720,1020);              // ball reaches claim height sooner at higher levels
  pw=clamp(190-lvl*15,95,190);                     // apex window shrinks
  tough=Math.random()<clamp(0.2+lvl*0.05,0.2,0.5);
  if(tough)pw*=0.82;
  attSide=(Math.random()<0.5?-1:1);
  phase='set'; clock=0; decided=false; result=null; resultT=0; msg=''; msgOk=false; quality=0; anim=0; jumpU=0;
  S.swing();
}
function start(){ if(!ac())ac(); if(AC&&AC.state==='suspended')AC.resume(); reset(); state='play'; newPlay(); }

function claim(){   // leap and catch at the apex
  if(state==='title'){start();return;}
  if(state==='over'){ if(resultT>0.4){reset();start();} return; }
  if(state!=='play'||phase!=='set'||decided) return;
  decided=true;
  if(clock<apexT-pw){ resolve('early'); }
  else if(clock>apexT+pw){ resolve('late'); }
  else { quality=1-Math.abs(clock-apexT)/pw; resolve('catch'); }
}

function resolve(k){
  phase='result'; result=k; resultT=0; anim=0; jumpU=0;
  if(k==='catch'){
    outs++; combo++;
    const perfect=quality>=0.72;
    let add=Math.round((60+Math.round(quality*150)+(tough?70:0))*(1+Math.min(9,combo-1)*0.14)); score+=add;
    S.claim(); setTimeout(S.good,110); if(perfect||tough)setTimeout(S.big,190);
    msgOk=true; flash=1;flashCol='#8affa0';shake=5; burst(CLAIM.x,CLAIM.y,'#8affa0',18,7);
    pop(W/2,250,(perfect?'最高到達点でガッチリ！完璧なキャッチ！ +':'跳んでクロスをキャッチ！ +')+add,'#d6ffe0');
    if(combo>=2)pop(W/2,214,'コンボ x'+combo,'#ffd24d');
    if(combo>0&&combo%5===0)S.streak();
    msg=perfect?'密集の頂点でボールをガッチリ掴んだ——完璧なハイボール処理でピンチを摘み取った！':'跳躍の頂点でクロスを掴んで確保——好判断のキャッチ！';
  } else {
    fails++; combo=0; msgOk=false; flash=1;flashCol='#ff5b5b';shake=9; S.bad();
    if(k==='early') msg='跳ぶのが早い…手が落ちかけた所をボールが越え、頂点で待つ相手にヘッドで叩き込まれた';
    else if(k==='late') msg='跳ぶのが遅い…先に相手が最高到達点で触り、こぼれ球を押し込まれた';
    else msg='見送った…誰も跳ばず、落ちてきたクロスを詰めの相手に押し込まれた';
    pop(W/2,250,(k==='early')?'早い…被ヘッド':(k==='late')?'遅い…被弾':'見送り…失点','#ffb0b0');
  }
  if(fails>=3){ state='over'; resultT=0; S.over(); if(score>best){best=score;localStorage.setItem('cx_best',best);} }
}

// ---------- input ----------
cv.addEventListener('pointerdown',e=>{e.preventDefault();claim();});
addEventListener('keydown',e=>{ if(e.repeat)return; if(e.code==='Space'||e.code==='Enter'||e.code==='ArrowUp'||e.code==='KeyF'){e.preventDefault();claim();} });

// ---------- particles ----------
function burst(x,y,c,n,sp){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=rnd(sp*0.3,sp);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:1,c});}}
function pop(x,y,txt,c){pops.push({x,y,txt,c,life:1});}

// keeper hand-height arc (0 at ground, 1 at full stretch); peaks at apexT
function handArc(t){ const u=clamp(t/(apexT*2),0,1); return Math.max(0,Math.sin(Math.PI*u)); }
// ball height as it arcs in and drops to claim height at apexT
function ballPos(t){
  const u=clamp(t/apexT,0,1);
  const x=lerp(CORNER.x,CLAIM.x,easeOut(u));
  const y=lerp(CORNER.y-10,CLAIM.y,u*u);   // descends into the claim point
  return {x,y};
}

// ---------- update ----------
function update(dt){
  shake*=Math.pow(0.86,dt/16.7); if(shake<0.3)shake=0;
  flash*=Math.pow(0.9,dt/16.7);
  for(const p of parts){p.vx*=0.96;p.vy=p.vy*0.96+0.28;p.x+=p.vx*dt/16.7;p.y+=p.vy*dt/16.7;p.life-=dt/16.7*0.026;}
  parts=parts.filter(p=>p.life>0);
  for(const p of pops){p.y-=dt/16.7*0.5;p.life-=dt/16.7*0.02;}
  pops=pops.filter(p=>p.life>0);

  if(state!=='play'){ if(state==='over')resultT+=dt/1000; return; }
  if(phase==='set'){ clock+=dt;
    if(!decided && clock>apexT+pw+120){ decided=true; resolve('miss'); }
    return; }
  if(phase==='result'){ resultT+=dt/1000; anim=Math.min(1,anim+dt/360); jumpU=Math.min(1,jumpU+dt/300); if(resultT>1.55) newPlay(); return; }
}

// ---------- render ----------
function drawField(){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#0f5e34');g.addColorStop(0.55,'#0e5230');g.addColorStop(1,'#0c4429');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='rgba(255,255,255,0.03)';for(let i=0;i<6;i++){ if(i%2===0)ctx.fillRect(0,90+i*95,W,95); }
  // six-yard + penalty box
  ctx.strokeStyle='rgba(255,255,255,0.26)';ctx.lineWidth=3;
  ctx.strokeRect(GOAL.x-230,GOAL.y+GH,460,250);
  ctx.strokeRect(GOAL.x-110,GOAL.y+GH,220,96);
  // goal frame
  ctx.fillStyle='rgba(0,0,0,0.28)';ctx.fillRect(GOAL.x-GW/2-4,GOAL.y-4,GW+8,GH+4);
  ctx.strokeStyle='rgba(255,255,255,0.34)';ctx.lineWidth=1;
  for(let gx=GOAL.x-GW/2;gx<=GOAL.x+GW/2;gx+=16){ctx.beginPath();ctx.moveTo(gx,GOAL.y);ctx.lineTo(gx,GOAL.y+GH);ctx.stroke();}
  for(let gy=GOAL.y;gy<=GOAL.y+GH;gy+=13){ctx.beginPath();ctx.moveTo(GOAL.x-GW/2,gy);ctx.lineTo(GOAL.x+GW/2,gy);ctx.stroke();}
  ctx.strokeStyle='#f2f2f2';ctx.lineWidth=6;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(GOAL.x-GW/2,GOAL.y+GH);ctx.lineTo(GOAL.x-GW/2,GOAL.y);ctx.lineTo(GOAL.x+GW/2,GOAL.y);ctx.lineTo(GOAL.x+GW/2,GOAL.y+GH);ctx.stroke();
  ctx.lineCap='butt';
}
function person(x,y,col,s,rise){s=s||1;rise=rise||0;
  ctx.save();ctx.translate(x,y-rise);
  ctx.fillStyle='rgba(0,0,0,0.2)';ctx.beginPath();ctx.ellipse(0,(13*s)+rise,11*s,4*s,0,0,6.28);ctx.fill();
  ctx.fillStyle=col;ctx.beginPath();ctx.ellipse(0,-15*s,10*s,15*s,0,0,6.28);ctx.fill();
  ctx.fillStyle='#f0c9a0';ctx.beginPath();ctx.arc(0,-34*s,7.5*s,0,6.28);ctx.fill();
  if(rise>2){ ctx.strokeStyle=col;ctx.lineWidth=5*s;ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(-5,-26*s);ctx.lineTo(-9,-46*s);ctx.stroke();
    ctx.beginPath();ctx.moveTo(5,-26*s);ctx.lineTo(9,-46*s);ctx.stroke(); }
  ctx.restore();
}

function render(){
  ctx.save();
  if(shake>0)ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
  drawField();

  if(state==='play'||state==='over'){
    // contesting attacker + a covering defender, jostling near the claim point
    const attX=CLAIM.x+attSide*40, defX=CLAIM.x-attSide*46;
    let attRise=0;
    if(phase==='set') attRise=handArc(clock)*46*0.7;
    else if(result==='early'||result==='late'||result==='miss') attRise=easeOut(jumpU)*52;
    person(defX,GK.y+6,'#c85049',0.9, phase==='set'?handArc(clock)*20:0);
    person(attX,GK.y+2,'#d0403a',0.95, attRise);

    // keeper (you) — rises to the apex on a claim
    let gkRise=0;
    if(phase==='set') gkRise=handArc(clock)*54;
    else if(result==='catch') gkRise=lerp(54,58,easeOut(jumpU));
    else gkRise=lerp(handArc(clock)*54,0,easeOut(jumpU));
    person(GK.x,GK.y,'#e8c23a',1.04,gkRise);

    // ball
    let b=ballPos(phase==='set'?clock:apexT);
    if(phase==='result'){
      const u=easeOut(anim);
      if(result==='catch'){ b.x=GK.x; b.y=GK.y-gkRise-30; }                       // safe in the gloves at full stretch
      else if(result==='early'||result==='late'){ b.x=lerp(CLAIM.x,GOAL.x+attSide*70,u); b.y=lerp(CLAIM.y,GOAL.y+GH*0.5,u); } // headed into goal
      else { b.x=lerp(CLAIM.x,GOAL.x-40,u); b.y=lerp(CLAIM.y,GOAL.y+GH*0.5,u); }   // dropped, poked in
    }
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(b.x,b.y,8,0,6.28);ctx.fill();
    ctx.strokeStyle='#333';ctx.lineWidth=1.1;ctx.beginPath();ctx.arc(b.x,b.y,8,0.4,2.2);ctx.stroke();

    // apex claim ring (timing cue) + banner
    if(state==='play'&&phase==='set'){
      const near=Math.abs(clock-apexT)<=pw;
      ctx.strokeStyle=near?'rgba(140,255,160,0.95)':'rgba(255,220,90,0.7)';ctx.lineWidth=4;
      const rem=clamp(1-clock/apexT,0,1);
      ctx.beginPath();ctx.arc(CLAIM.x,CLAIM.y,14+rem*54,0,6.28);ctx.stroke();
      ctx.textAlign='center';
      ctx.fillStyle=near?'rgba(140,255,160,0.98)':'rgba(255,220,120,0.95)';ctx.font='bold 21px sans-serif';
      ctx.fillText(near?'今だ！ 跳んでキャッチ！':'クロスが来る——最高到達点で掴め',W/2,46);
      // apex timing bar
      const p=clamp(clock/(apexT+pw),0,1),bw=250,x=W/2-bw/2,y=62;
      ctx.fillStyle='rgba(255,255,255,0.16)';ctx.fillRect(x,y,bw,7);
      const wl=x+bw*((apexT-pw)/(apexT+pw)), ww=bw*(2*pw/(apexT+pw));
      ctx.fillStyle='rgba(120,255,150,0.5)';ctx.fillRect(wl,y,ww,7);
      ctx.fillStyle='#ffe14d';ctx.fillRect(x+bw*p-2,y-3,4,13);
    }
  }

  for(const p of parts){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,3.2,0,6.28);ctx.fill();}
  ctx.globalAlpha=1;
  for(const p of pops){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.font='bold 21px sans-serif';ctx.textAlign='center';ctx.fillText(p.txt,p.x,p.y);}
  ctx.globalAlpha=1;

  // HUD
  ctx.textAlign='left';ctx.fillStyle='#fff';ctx.font='bold 26px sans-serif';ctx.fillText('SCORE '+score,20,36);
  ctx.textAlign='right';ctx.fillStyle='rgba(255,255,255,0.9)';ctx.font='14px sans-serif';ctx.fillText('キャッチ '+outs+'  Lv'+lvl,W-20,24);
  ctx.fillText('失点',W-92,46);
  for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(W-60+i*20,41,7,0,6.28);ctx.fillStyle=i<fails?'#ff5b5b':'rgba(255,255,255,0.25)';ctx.fill();}
  if(combo>=2){ctx.textAlign='center';ctx.fillStyle='#ffd24d';ctx.font='bold 18px sans-serif';ctx.fillText('コンボ x'+combo,W/2,112);}

  if(state==='play'&&phase==='result'&&msg){ctx.textAlign='center';ctx.fillStyle=msgOk?'#9ff0b8':'#ff9a9a';ctx.font='bold 15px sans-serif';ctx.fillText(msg,W/2,410);}

  if(state==='title'){
    ctx.fillStyle='rgba(3,10,6,0.84)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='bold 42px sans-serif';ctx.fillText('クロスをキャッチ',W/2,84);
    ctx.fillStyle='#ffd23e';ctx.font='bold 22px sans-serif';ctx.fillText('Claim the Cross',W/2,120);
    ctx.fillStyle='rgba(255,255,255,0.92)';ctx.font='16px sans-serif';
    ctx.fillText('GKとして、密集したゴール前へ入るクロスを、跳躍の“最高到達点”でガッチリ掴んでピンチを摘み取れ',W/2,176);
    ctx.fillStyle='rgba(255,255,255,0.66)';ctx.font='14px sans-serif';
    ctx.fillText('ボールが落ちてくる→跳んだ手が届く“頂点（緑リング／緑帯）”の瞬間にタップ/クリック/SPACE/↑＝キャッチ',W/2,214);
    ctx.fillText('頂点ど真ん中で掴むほど完璧＝大量加点。跳ぶのが早い＝越えられて被ヘッド／遅い＝相手に先に触られる',W/2,238);
    ctx.fillText('見送り＝落ちてきた球を押し込まれる。際どい混戦（tough）を掴むとボーナス',W/2,262);
    ctx.fillText('上級ほどクロスが速く頂点の窓が狭い。3失点で交代',W/2,286);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で開始',W/2,352);
    ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='14px sans-serif';ctx.fillText('BEST '+best,W/2,384);
  }
  if(state==='over'){
    ctx.fillStyle='rgba(3,10,6,0.86)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#ff6b6b';ctx.font='bold 46px sans-serif';ctx.fillText('3失点…交代',W/2,222);
    ctx.fillStyle='#fff';ctx.font='bold 40px sans-serif';ctx.fillText('SCORE '+score,W/2,290);
    ctx.fillStyle='rgba(255,255,255,0.85)';ctx.font='19px sans-serif';ctx.fillText('キャッチ '+outs+'   BEST '+best,W/2,330);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で もう一度',W/2,402);
  }

  if(flash>0.02){ctx.globalAlpha=flash*0.5;ctx.fillStyle=flashCol;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}
  ctx.restore();

  ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,0.4)';ctx.font='12px sans-serif';
  ctx.fillText('クロスをキャッチ：落ちてくるクロスを跳躍の頂点（緑帯）で掴んで確保。早い/遅い/見送りは失点、3失点で交代',W/2,H-8);
}

function frame(ts){let dt=ts-last;last=ts;if(dt>60)dt=60;if(dt<0)dt=0;update(dt);render();requestAnimationFrame(frame);}
requestAnimationFrame(frame);

// ---------- test hook ----------
window.__cx={
  start, claim:()=>claim(),
  get state(){return state;},
  get score(){return score;},
  get outs(){return outs;},
  get fails(){return fails;},
  get info(){return {state,phase,clock,apexT,pw,tough,decided,result,outs,fails,lvl,
    inWindow:(phase==='set'&&clock>=apexT-pw&&clock<=apexT+pw),canAct:(phase==='set'&&!decided)};}
};
})();
</script>
</body>
</html>
