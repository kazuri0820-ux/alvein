<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>チェックスイング判定 (Check-Swing Call)</title>
<style>
  html,body{margin:0;height:100%;background:#0a0d12;overflow:hidden;
    font-family:-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  #stage{position:relative;width:100vw;height:100vh;max-width:calc(100vh*1.5);max-height:calc(100vw/1.5);aspect-ratio:900/600;}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;border-radius:6px;}
</style>
</head>
<body>
<div id="wrap"><div id="stage"><canvas id="cv"></canvas></div></div>
<script>
(function(){
const W=900,H=600,cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let DPR=1;
function fit(){DPR=Math.min(2,window.devicePixelRatio||1);cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
fit();addEventListener('resize',fit);

// ---------- audio ----------
let AC=null;function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function tone(f,d,type,v,sweep){const a=ac();if(!a)return;const t=a.currentTime,o=a.createOscillator(),g=a.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(sweep)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+sweep),t+d);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v||0.2,t+0.008);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+0.02);}
function noise(d,v,hp){const a=ac();if(!a)return;const t=a.currentTime,n=Math.floor(a.sampleRate*d),buf=a.createBuffer(1,n,a.sampleRate),ch=buf.getChannelData(0);
  for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource();s.buffer=buf;
  const f=a.createBiquadFilter();f.type='highpass';f.frequency.value=hp||600;const g=a.createGain();g.gain.value=v||0.2;
  s.connect(f);f.connect(g);g.connect(a.destination);s.start(t);s.stop(t+d+0.02);}
const S={
  pitch:()=>{tone(430,0.07,'sawtooth',0.05,220);},
  swing:()=>{noise(0.05,0.14,700);tone(300,0.05,'square',0.06,-40);},
  strike:()=>{tone(1500,0.12,'square',0.08);setTimeout(()=>tone(1750,0.1,'square',0.06),70);},
  ball:()=>{tone(520,0.1,'triangle',0.08,-80);},
  good:()=>{[680,940,1220].forEach((f,i)=>setTimeout(()=>tone(f,0.1,'triangle',0.16),i*55));},
  big:()=>{[600,800,1000,1250].forEach((f,i)=>setTimeout(()=>tone(f,0.12,'triangle',0.17),i*80));},
  bad:()=>{noise(0.18,0.22,300);tone(160,0.22,'sawtooth',0.12,-50);},
  streak:()=>{[700,930,1170,1400].forEach((f,i)=>setTimeout(()=>tone(f,0.1,'triangle',0.16),i*60));},
  over:()=>{[440,330,247,175].forEach((f,i)=>setTimeout(()=>tone(f,0.3,'triangle',0.2),i*160));}
};

// ---------- geometry ----------
const BAT={x:352,y:392};       // bat pivot (hands)
const BATLEN=106;
const THRESH=1.15;             // swing-amount threshold: past it (came around) = offered
function batRot(a){return -1.5+a;}   // -1.5 = ready (up), grows clockwise toward plate
function batTip(a){const r=batRot(a);return {x:BAT.x+BATLEN*Math.cos(r), y:BAT.y+BATLEN*Math.sin(r)};}
const BTN=[
  {k:'swing', x:150,label:'スイング ←',sub:'回った＝ストライク',col:'#e0704b'},
  {k:'hold',  x:520,label:'ノースイング →',sub:'止めた＝ボール',col:'#3f99e0'}
];
const BW=230, BY=505, BH=64;

// ---------- state ----------
let state='title', phase='pitch', plays=0;
let score=0, combo=0, best=+(localStorage.getItem('cs_best')||0);
let outs=0, fails=0, lvl=1;   // outs = correct calls
let clock=0, revealT=520, callWin=980, kind='held', tough=false;
let maxAngle=1.1;             // how far the bat travels (set per pitch)
let decided=false, call=null, result=null, resultT=0, msg='', msgOk=false;
let shake=0, flash=0, flashCol='#fff', last=performance.now();
let parts=[], pops=[];

function rnd(a,b){return a+Math.random()*(b-a);}
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function lerp(a,b,u){return a+(b-a)*u;}
function easeOut(u){return 1-Math.pow(1-u,2);}

function reset(){state='title';score=0;combo=0;outs=0;fails=0;lvl=1;plays=0;result=null;parts=[];pops=[];}

function newPlay(){
  plays++; lvl=Math.min(7,1+Math.floor(outs/4));
  revealT=clamp(560-lvl*24,360,560);
  callWin=clamp(1020-lvl*70,560,1020);
  tough=Math.random()<clamp(0.2+lvl*0.05,0.2,0.5);
  kind=(Math.random()<0.5?'swung':'held');
  // swung: bat comes around past the threshold; held: stops short. tough = borderline.
  if(kind==='swung') maxAngle = tough? 1.24 : rnd(1.40,1.72);
  else               maxAngle = tough? 1.06 : rnd(0.62,0.96);
  phase='pitch'; clock=0; decided=false; call=null; result=null; resultT=0; msg=''; msgOk=false;
  S.pitch(); setTimeout(()=>{if(phase==='pitch')S.swing();},revealT*0.5);
}
function start(){ if(!ac())ac(); if(AC&&AC.state==='suspended')AC.resume(); reset(); state='play'; newPlay(); }

function correctCall(){ return kind==='swung'?'swing':'hold'; }

function makeCall(c){
  if(state==='title'){start();return;}
  if(state==='over'){ if(resultT>0.4){reset();start();} return; }
  if(state!=='play'||phase!=='pitch'||decided) return;
  if(clock<revealT){ decided=true; call=c; resolve('early'); return; }
  decided=true; call=c;
  resolve(c===correctCall()?'good':'wrong');
}

function resolve(k){
  phase='result'; result=k; resultT=0;
  if(k==='good'){
    outs++; combo++;
    let add=Math.round((tough?250:150)*(1+Math.min(9,combo-1)*0.14)); score+=add;
    if(kind==='swung')S.strike(); else S.ball(); setTimeout(S.good,80); if(tough)setTimeout(S.big,140);
    const tp=batTip(maxAngle);
    msgOk=true; flash=1;flashCol='#8affa0';shake=5; burst(tp.x,tp.y,'#8affa0',16,7);
    pop(W/2,250,(tough?'際どいハーフスイングを的中！ +':'好判定！ +')+add,'#d6ffe0');
    if(combo>=2)pop(W/2,150,'コンボ x'+combo,'#ffd24d');
    if(combo>0&&combo%5===0)S.streak();
    msg=(kind==='swung')?'バットがプレートを越え手首も返った——回っている＝ストライクで正解':'寸前で止めて手首も返っていない——止めた＝ボールで正解';
  } else {
    fails++; combo=0; msgOk=false; flash=1;flashCol='#ff5b5b';shake=9; S.bad();
    if(k==='early') msg='判断が早い…スイングが止まるか振り切るか見極める前はダメ';
    else msg=(kind==='swung')?'誤審…バットは返っており“回っている”＝ストライクだった':'誤審…寸前で止めており“ノースイング”＝ボールだった';
    pop(W/2,250,'誤審…','#ffb0b0');
  }
  if(fails>=3){ state='over'; resultT=0; S.over(); if(score>best){best=score;localStorage.setItem('cs_best',best);} }
}

// ---------- input ----------
cv.addEventListener('pointerdown',e=>{e.preventDefault();
  if(state!=='play'||phase!=='pitch'){ makeCall('swing'); return; }
  const r=cv.getBoundingClientRect(); const x=(e.clientX-r.left)/r.width*W, y=(e.clientY-r.top)/r.height*H;
  for(const b of BTN){ if(x>=b.x&&x<=b.x+BW&&y>=BY&&y<=BY+BH){ makeCall(b.k); return; } }
  makeCall(x<W*0.5?'swing':'hold');
});
addEventListener('keydown',e=>{ if(e.repeat)return;
  if(e.code==='ArrowLeft'||e.code==='KeyA'){e.preventDefault();makeCall('swing');}
  else if(e.code==='ArrowRight'||e.code==='KeyD'){e.preventDefault();makeCall('hold');}
  else if(e.code==='Space'||e.code==='Enter'){e.preventDefault(); if(state!=='play')makeCall('swing');} });

// ---------- particles ----------
function burst(x,y,c,n,sp){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=rnd(sp*0.3,sp);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:1,c});}}
function pop(x,y,txt,c){pops.push({x,y,txt,c,life:1});}

// bat angle: 0 = ready (pointing up-back), grows toward the plate; crosses OFFER at ~1.15rad
function batAngle(){
  if(phase==='pitch'){ const u=easeOut(clamp(clock/revealT,0,1)); return lerp(0.15,maxAngle,u); }
  return maxAngle;
}

// ---------- update ----------
function update(dt){
  shake*=Math.pow(0.86,dt/16.7); if(shake<0.3)shake=0;
  flash*=Math.pow(0.9,dt/16.7);
  for(const p of parts){p.vx*=0.96;p.vy=p.vy*0.96+0.28;p.x+=p.vx*dt/16.7;p.y+=p.vy*dt/16.7;p.life-=dt/16.7*0.026;}
  parts=parts.filter(p=>p.life>0);
  for(const p of pops){p.y-=dt/16.7*0.5;p.life-=dt/16.7*0.02;}
  pops=pops.filter(p=>p.life>0);

  if(state!=='play'){ if(state==='over')resultT+=dt/1000; return; }
  if(phase==='pitch'){ clock+=dt;
    if(!decided && clock>revealT+callWin){ decided=true; call=null; resolve('late'); }
    return; }
  if(phase==='result'){ resultT+=dt/1000; if(resultT>1.6) newPlay(); return; }
}

// ---------- render ----------
function drawField(){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#123a1f');g.addColorStop(0.5,'#0f5e34');g.addColorStop(1,'#0c4c2b');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  // dirt around home
  ctx.fillStyle='#6a4a30';ctx.beginPath();ctx.ellipse(430,420,260,120,0,0,6.28);ctx.fill();
  // home plate
  ctx.fillStyle='#e8e4d8';ctx.beginPath();
  ctx.moveTo(430,430);ctx.lineTo(462,430);ctx.lineTo(462,446);ctx.lineTo(446,458);ctx.lineTo(430,446);ctx.closePath();ctx.fill();
}
function drawBatter(){
  const a=batAngle();
  // body
  ctx.save();ctx.translate(BAT.x-20,BAT.y+8);
  ctx.fillStyle='#c23a3a';ctx.beginPath();ctx.ellipse(0,-14,13,18,0,0,6.28);ctx.fill();
  ctx.fillStyle='#f0c9a0';ctx.beginPath();ctx.arc(2,-40,9,0,6.28);ctx.fill();
  ctx.fillStyle='#7a1f1f';ctx.beginPath();ctx.arc(2,-43,10,Math.PI,0);ctx.fill();  // helmet
  ctx.restore();
  // bat: pivot at hands, rotate from ready (up) around toward the plate (right/down)
  ctx.save();ctx.translate(BAT.x,BAT.y);
  ctx.rotate(batRot(a));
  ctx.strokeStyle='#caa25a';ctx.lineWidth=8;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(BATLEN,0);ctx.stroke();ctx.lineCap='butt';
  ctx.restore();
}

function render(){
  ctx.save();
  if(shake>0)ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
  drawField();

  if(state==='play'||state==='over'){
    const revealed=(phase==='pitch'&&clock>=revealT)||phase==='result';
    // threshold guide: swing PAST this line (comes around) = offered
    const gt=batTip(THRESH);
    ctx.strokeStyle='rgba(255,255,255,0.45)';ctx.lineWidth=2;ctx.setLineDash([6,6]);
    ctx.beginPath();ctx.moveTo(BAT.x,BAT.y);ctx.lineTo(gt.x+22,gt.y+10);ctx.stroke();ctx.setLineDash([]);
    ctx.fillStyle='rgba(255,255,255,0.55)';ctx.font='11px sans-serif';ctx.textAlign='left';ctx.fillText('この線を越えて振り切れば“回った”',gt.x+26,gt.y+14);

    drawBatter();

    // reveal verdict marker near the bat tip
    if(revealed){
      const swung=(kind==='swung'), tp=batTip(maxAngle);
      ctx.fillStyle=swung?'rgba(255,110,90,0.98)':'rgba(120,200,255,0.98)';ctx.font='bold 17px sans-serif';ctx.textAlign='center';
      ctx.fillText(swung?'バットが返った！':'寸前で止めた',tp.x+8,tp.y-24);
    }

    // cue banner + timer
    ctx.textAlign='center';
    if(state==='play'&&phase==='pitch'){
      if(clock<revealT){ ctx.fillStyle='rgba(255,220,90,0.95)';ctx.font='bold 20px sans-serif';ctx.fillText('チェックスイング！ 振り切ったか止めたか見極めろ',W/2,52); }
      else { ctx.fillStyle='rgba(255,220,120,0.98)';ctx.font='bold 22px sans-serif';ctx.fillText('アピール！ スイングか、ノースイングか',W/2,52);
        const p=clamp((clock-revealT)/callWin,0,1),bw=250,x=W/2-bw/2,y=64;
        ctx.fillStyle='rgba(255,255,255,0.18)';ctx.fillRect(x,y,bw,7);ctx.fillStyle=p<0.7?'#8affa0':(p<1?'#ffd24d':'#ff5b5b');ctx.fillRect(x,y,bw*p,7); }
    }

    if(state==='play'){
      for(const b of BTN){ const active=phase==='pitch'&&clock>=revealT;
        ctx.fillStyle=active?b.col:'rgba(255,255,255,0.10)';rr(b.x,BY,BW,BH,10);ctx.fill();
        ctx.fillStyle=active?'#08130c':'rgba(255,255,255,0.5)';ctx.textAlign='center';ctx.font='bold 19px sans-serif';ctx.fillText(b.label,b.x+BW/2,BY+27);
        ctx.font='11px sans-serif';ctx.fillText(b.sub,b.x+BW/2,BY+47); }
      ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='12px sans-serif';ctx.textAlign='center';ctx.fillText('タップ / ←=スイング ・ →=ノースイング',W/2,BY+BH+18);
    }
  }

  for(const p of parts){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,3.2,0,6.28);ctx.fill();}
  ctx.globalAlpha=1;
  for(const p of pops){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.font='bold 21px sans-serif';ctx.textAlign='center';ctx.fillText(p.txt,p.x,p.y);}
  ctx.globalAlpha=1;

  // HUD
  ctx.textAlign='left';ctx.fillStyle='#fff';ctx.font='bold 26px sans-serif';ctx.fillText('SCORE '+score,20,36);
  ctx.textAlign='right';ctx.fillStyle='rgba(255,255,255,0.9)';ctx.font='14px sans-serif';ctx.fillText('好判定 '+outs+'  Lv'+lvl,W-20,24);
  ctx.fillText('誤審',W-92,46);
  for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(W-60+i*20,41,7,0,6.28);ctx.fillStyle=i<fails?'#ff5b5b':'rgba(255,255,255,0.25)';ctx.fill();}
  if(combo>=2){ctx.textAlign='center';ctx.fillStyle='#ffd24d';ctx.font='bold 18px sans-serif';ctx.fillText('コンボ x'+combo,W/2,112);}

  if(state==='play'&&phase==='result'&&msg){ctx.textAlign='center';ctx.fillStyle=msgOk?'#9ff0b8':'#ff9a9a';ctx.font='bold 16px sans-serif';ctx.fillText(msg,W/2,474);}

  if(state==='title'){
    ctx.fillStyle='rgba(4,7,12,0.84)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='bold 38px sans-serif';ctx.fillText('チェックスイング判定',W/2,84);
    ctx.fillStyle='#ffd23e';ctx.font='bold 22px sans-serif';ctx.fillText('Check-Swing Call',W/2,120);
    ctx.fillStyle='rgba(255,255,255,0.92)';ctx.font='16px sans-serif';
    ctx.fillText('一塁塁審として、打者がハーフスイングを“振り切ったか止めたか”をアピールで判定しろ',W/2,178);
    ctx.fillStyle='rgba(255,255,255,0.66)';ctx.font='14px sans-serif';
    ctx.fillText('バットがプレート前の線を越え手首が返った＝「スイング」（←/画面左）＝ストライク',W/2,216);
    ctx.fillText('寸前で止め手首が返っていない＝「ノースイング」（→/画面右）＝ボール',W/2,240);
    ctx.fillText('止まるか振り切るか見える前の判定＝早すぎ、誤審は失格ポイント、際どいハーフスイングを当てると大量加点',W/2,264);
    ctx.fillText('上級ほどスイングが速く際どく猶予も短い。3誤審で交代',W/2,288);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で開始',W/2,356);
    ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='14px sans-serif';ctx.fillText('BEST '+best,W/2,388);
  }
  if(state==='over'){
    ctx.fillStyle='rgba(4,7,12,0.86)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#ff6b6b';ctx.font='bold 46px sans-serif';ctx.fillText('3誤審…交代',W/2,222);
    ctx.fillStyle='#fff';ctx.font='bold 40px sans-serif';ctx.fillText('SCORE '+score,W/2,290);
    ctx.fillStyle='rgba(255,255,255,0.85)';ctx.font='19px sans-serif';ctx.fillText('好判定 '+outs+'   BEST '+best,W/2,330);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で もう一度',W/2,402);
  }

  if(flash>0.02){ctx.globalAlpha=flash*0.5;ctx.fillStyle=flashCol;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}
  ctx.restore();

  ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,0.4)';ctx.font='12px sans-serif';
  ctx.fillText('チェックスイング判定：バットが返った＝スイング(ストライク)／寸前で止めた＝ノースイング(ボール)。早判定/誤審は失敗、3つで交代',W/2,H-8);
}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

function frame(ts){let dt=ts-last;last=ts;if(dt>60)dt=60;if(dt<0)dt=0;update(dt);render();requestAnimationFrame(frame);}
requestAnimationFrame(frame);

// ---------- test hook ----------
window.__cs={
  start, makeCall:(c)=>makeCall(c),
  get state(){return state;},
  get score(){return score;},
  get outs(){return outs;},
  get fails(){return fails;},
  get info(){return {state,phase,clock,revealT,callWin,kind,tough,decided,call,result,outs,fails,lvl,
    revealed:(clock>=revealT),correctCall:correctCall(),canAct:(phase==='pitch'&&!decided)};}
};
})();
</script>
</body>
</html>
