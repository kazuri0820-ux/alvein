<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ホームへ還れ (Race Home)</title>
<style>
  html,body{margin:0;height:100%;background:#0a0d08;overflow:hidden;
    font-family:-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  #stage{position:relative;width:100vw;height:100vh;max-width:calc(100vh*1.5);max-height:calc(100vw/1.5);aspect-ratio:900/600;}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;border-radius:6px;}
</style>
</head>
<body>
<div id="wrap"><div id="stage"><canvas id="cv"></canvas></div></div>
<script>
(function(){
const W=900,H=600,cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let DPR=1;
function fit(){DPR=Math.min(2,window.devicePixelRatio||1);cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
fit();addEventListener('resize',fit);

// ---------- audio ----------
let AC=null;function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function tone(f,d,type,v,sweep){const a=ac();if(!a)return;const t=a.currentTime,o=a.createOscillator(),g=a.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(sweep)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+sweep),t+d);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v||0.2,t+0.008);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+0.02);}
function noise(d,v,hp){const a=ac();if(!a)return;const t=a.currentTime,n=Math.floor(a.sampleRate*d),buf=a.createBuffer(1,n,a.sampleRate),ch=buf.getChannelData(0);
  for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource();s.buffer=buf;
  const f=a.createBiquadFilter();f.type='highpass';f.frequency.value=hp||600;const g=a.createGain();g.gain.value=v||0.2;
  s.connect(f);f.connect(g);g.connect(a.destination);s.start(t);s.stop(t+d+0.02);}
const S={
  crack:()=>{noise(0.05,0.16,420);tone(210,0.07,'square',0.09,-30);},
  step:()=>{tone(190+Math.random()*60,0.03,'square',0.03);},
  relay:()=>{tone(520,0.05,'triangle',0.08,120);},
  safe:()=>{[620,880,1150].forEach((f,i)=>setTimeout(()=>tone(f,0.11,'triangle',0.16),i*56));},
  big:()=>{[600,800,1000,1250].forEach((f,i)=>setTimeout(()=>tone(f,0.12,'triangle',0.17),i*80));},
  out:()=>{noise(0.14,0.18,300);setTimeout(()=>{[300,240,180].forEach((f,i)=>setTimeout(()=>tone(f,0.13,'sawtooth',0.12),i*80));},20);},
  streak:()=>{[700,930,1170,1400].forEach((f,i)=>setTimeout(()=>tone(f,0.1,'triangle',0.16),i*60));},
  over:()=>{[440,330,247,175].forEach((f,i)=>setTimeout(()=>tone(f,0.3,'triangle',0.2),i*160));}
};

// ---------- geometry (diamond) ----------
const HOME={x:450,y:508}, FIRST={x:648,y:372}, SECOND={x:450,y:236}, THIRD={x:252,y:372};
const OF={x:150,y:96}, CUT={x:336,y:300};   // outfielder (fielded) -> cutoff -> home

function runnerPos(d){ return d<0.5 ? lerpP(SECOND,THIRD,d/0.5) : lerpP(THIRD,HOME,(d-0.5)/0.5); }
function relayPos(p){ let q; if(p<0.5){q=lerpP(OF,CUT,p/0.5);q.y-=Math.sin((p/0.5)*Math.PI)*20;} else {q=lerpP(CUT,HOME,(p-0.5)/0.5);q.y-=Math.sin(((p-0.5)/0.5)*Math.PI)*16;} return q; }
function lerpP(a,b,u){return {x:a.x+(b.x-a.x)*u,y:a.y+(b.y-a.y)*u};}

// ---------- tuning ----------
const STEP=0.165;   // distance per accepted tap
const TAPCD=52;     // ms cooldown between accepted taps
const FIELDT=340;   // ms before the relay is released (runner's head start)

// ---------- state ----------
let state='title', phase='run', plays=0;
let score=0, combo=0, best=+(localStorage.getItem('rh_best')||0);
let outs=0, fails=0, lvl=1;   // outs = runs scored (safe)
let clock=0, throwT=1120, tough=false;
let runD=0, lastTap=-999, taps=0, relayP=0, result=null, resultT=0, msg='', msgOk=false, bob=0;
let handoffSeen=false;
let shake=0, flash=0, flashCol='#fff', last=performance.now();
let parts=[], pops=[];

function rnd(a,b){return a+Math.random()*(b-a);}
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function lerp(a,b,u){return a+(b-a)*u;}
function easeOut(u){return 1-Math.pow(1-u,2);}

function reset(){state='title';score=0;combo=0;outs=0;fails=0;lvl=1;plays=0;result=null;parts=[];pops=[];}

function newPlay(){
  plays++; lvl=Math.min(7,1+Math.floor(outs/4));
  throwT=clamp(1150-lvl*64,760,1150)+rnd(-40,60);   // slight per-play variety
  tough=Math.random()<clamp(0.2+lvl*0.05,0.2,0.5);
  if(tough)throwT-=70;
  phase='run'; clock=0; runD=0; lastTap=-999; taps=0; relayP=0; result=null; resultT=0; msg=''; msgOk=false; bob=0; handoffSeen=false;
  S.crack();
}
function start(){ if(!ac())ac(); if(AC&&AC.state==='suspended')AC.resume(); reset(); state='play'; newPlay(); }

function tap(){
  if(state==='title'){start();return;}
  if(state==='over'){ if(resultT>0.4){reset();start();} return; }
  if(state!=='play'||phase!=='run') return;
  if(clock-lastTap<TAPCD) return;   // cap the effective mash rate
  lastTap=clock; taps++; runD=Math.min(1,runD+STEP); bob=1; if(taps%2===0)S.step();
  if(runD>=1) resolve('safe');
}

function resolve(k){
  phase='result'; result=k; resultT=0;
  if(k==='safe'){
    outs++; combo++;
    const margin=1-clamp(relayP,0,1);   // how much you beat the relay by
    const perfect=margin<0.16;          // a bang-bang play at the plate
    let add=Math.round(((tough||perfect)?250:150)*(1+Math.min(9,combo-1)*0.14)); score+=add;
    setTimeout(S.safe,40); if(perfect||tough)setTimeout(S.big,150);
    msgOk=true; flash=1;flashCol='#8affa0';shake=6; burst(HOME.x,HOME.y,'#8affa0',16,7);
    pop(W/2,300,(perfect?'間一髪、際どいクロスプレーで生還！ +':'ヘッドスライディングで生還！ +')+add,'#d6ffe0');
    if(combo>=2)pop(W/2,150,'コンボ x'+combo,'#ffd24d');
    if(combo>0&&combo%5===0)S.streak();
    msg='二塁から一気に激走——中継返球より先に本塁を陥れて生還！';
  } else {
    fails++; combo=0; msgOk=false; flash=1;flashCol='#ff5b5b';shake=8; S.out();
    msg='中継返球が先に本塁へ…タッチアウトで憤死。もっと速く腕を振れ！';
    pop(W/2,300,'本塁タッチアウト…','#ffb0b0');
  }
  if(fails>=3){ state='over'; resultT=0; S.over(); if(score>best){best=score;localStorage.setItem('rh_best',best);} }
}

// ---------- input ----------
cv.addEventListener('pointerdown',e=>{e.preventDefault();tap();});
addEventListener('keydown',e=>{ if(e.repeat)return;
  if(e.code==='Space'||e.code==='Enter'||e.code==='ArrowRight'||e.code==='KeyF'||e.code==='KeyJ'){e.preventDefault();tap();} });

// ---------- particles ----------
function burst(x,y,c,n,sp){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=rnd(sp*0.3,sp);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:1,c});}}
function pop(x,y,txt,c){pops.push({x,y,txt,c,life:1});}

// ---------- update ----------
function update(dt){
  shake*=Math.pow(0.86,dt/16.7); if(shake<0.3)shake=0;
  flash*=Math.pow(0.9,dt/16.7); bob*=Math.pow(0.8,dt/16.7);
  for(const q of parts){q.vx*=0.96;q.vy=q.vy*0.96+0.28;q.x+=q.vx*dt/16.7;q.y+=q.vy*dt/16.7;q.life-=dt/16.7*0.026;}
  parts=parts.filter(q=>q.life>0);
  for(const q of pops){q.y-=dt/16.7*0.5;q.life-=dt/16.7*0.02;}
  pops=pops.filter(q=>q.life>0);

  if(state!=='play'){ if(state==='over')resultT+=dt/1000; return; }
  if(phase==='run'){ clock+=dt;
    relayP=clamp((clock-FIELDT)/(throwT-FIELDT),0,1);
    if(!handoffSeen&&relayP>=0.5){handoffSeen=true;S.relay();}   // cutoff man relays it home
    if(runD>=1){ resolve('safe'); return; }
    if(relayP>=1){ resolve('out'); return; }
    return; }
  if(phase==='result'){ resultT+=dt/1000;
    if(resultT>1.5) newPlay(); return; }
}

// ---------- render ----------
function drawBaseSquare(p,rot){ ctx.save();ctx.translate(p.x,p.y);ctx.rotate(rot||0.785);ctx.fillRect(-12,-12,24,24);ctx.restore(); }
function drawField(){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#12703f');g.addColorStop(0.5,'#0f5e34');g.addColorStop(1,'#0c4c2b');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  // infield dirt diamond
  ctx.fillStyle='#6a4a30';ctx.beginPath();
  ctx.moveTo(HOME.x,HOME.y+18);ctx.lineTo(FIRST.x+18,FIRST.y);ctx.lineTo(SECOND.x,SECOND.y-18);ctx.lineTo(THIRD.x-18,THIRD.y);ctx.closePath();ctx.fill();
  // basepaths (full diamond, faint)
  ctx.strokeStyle='rgba(230,210,150,0.28)';ctx.lineWidth=8;ctx.lineJoin='round';
  ctx.beginPath();ctx.moveTo(HOME.x,HOME.y);ctx.lineTo(FIRST.x,FIRST.y);ctx.lineTo(SECOND.x,SECOND.y);ctx.lineTo(THIRD.x,THIRD.y);ctx.closePath();ctx.stroke();
  // the running lane: SECOND -> THIRD -> HOME (highlighted)
  ctx.strokeStyle='rgba(255,225,150,0.6)';ctx.lineWidth=22;ctx.lineCap='round';ctx.lineJoin='round';
  ctx.beginPath();ctx.moveTo(SECOND.x,SECOND.y);ctx.lineTo(THIRD.x,THIRD.y);ctx.lineTo(HOME.x,HOME.y);ctx.stroke();ctx.lineCap='butt';
  // bases
  ctx.fillStyle='#f2f2f2';drawBaseSquare(FIRST);drawBaseSquare(SECOND);drawBaseSquare(THIRD);
  // home plate
  ctx.fillStyle='#e8e4d8';ctx.beginPath();ctx.moveTo(HOME.x-13,HOME.y-9);ctx.lineTo(HOME.x+13,HOME.y-9);ctx.lineTo(HOME.x+13,HOME.y+2);ctx.lineTo(HOME.x,HOME.y+14);ctx.lineTo(HOME.x-13,HOME.y+2);ctx.closePath();ctx.fill();
}

function render(){
  ctx.save();
  if(shake>0)ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
  drawField();

  if(state==='play'||state==='over'){
    // catcher guarding the plate
    ctx.fillStyle='#2b6fd6';ctx.beginPath();ctx.ellipse(HOME.x+2,HOME.y-24,11,15,0,0,6.28);ctx.fill();
    ctx.fillStyle='#f0c9a0';ctx.beginPath();ctx.arc(HOME.x+2,HOME.y-44,7,0,6.28);ctx.fill();
    // outfielder (source) and cutoff man
    ctx.fillStyle='#2b6fd6';ctx.beginPath();ctx.ellipse(OF.x,OF.y,9,14,0,0,6.28);ctx.fill();
    ctx.fillStyle='#f0c9a0';ctx.beginPath();ctx.arc(OF.x,OF.y-20,6.5,0,6.28);ctx.fill();
    ctx.fillStyle='#2b6fd6';ctx.beginPath();ctx.ellipse(CUT.x,CUT.y,9,14,0,0,6.28);ctx.fill();
    ctx.fillStyle='#f0c9a0';ctx.beginPath();ctx.arc(CUT.x,CUT.y-20,6.5,0,6.28);ctx.fill();

    // the relay ball (starts after FIELDT): OF -> cutoff -> home
    if(clock>FIELDT||phase==='result'){ const b=relayPos(clamp(relayP,0,1));
      ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(b.x,b.y,6.5,0,6.28);ctx.fill();
      ctx.strokeStyle='#c33';ctx.lineWidth=1.1;ctx.beginPath();ctx.arc(b.x,b.y,6.5,0.4,2.2);ctx.stroke(); }

    // runner sprinting SECOND -> THIRD -> HOME
    const rp=runnerPos(runD);
    const sliding=(phase==='result'&&runD>=1);
    ctx.save();ctx.translate(rp.x,rp.y-Math.abs(Math.sin(taps*1.3))*bob*3);ctx.rotate(sliding?0.5:-0.4);
    ctx.fillStyle='#d0403a';ctx.beginPath();ctx.ellipse(0,sliding?0:-13,sliding?18:9,sliding?10:15,0,0,6.28);ctx.fill();
    ctx.fillStyle='#f0c9a0';ctx.beginPath();ctx.arc(sliding?-20:0,sliding?-4:-31,7,0,6.28);ctx.fill();
    ctx.restore();

    // race bars (runner vs relay)
    if(state==='play'&&phase==='run'){
      ctx.textAlign='center';
      ctx.fillStyle='rgba(255,220,90,0.96)';ctx.font='bold 22px sans-serif';ctx.fillText('連打で本塁へ激走！ 中継返球より先に還れ',W/2,46);
      const bw=300,x=W/2-bw/2;
      // runner bar
      ctx.fillStyle='rgba(255,255,255,0.14)';ctx.fillRect(x,66,bw,12);
      ctx.fillStyle='#8affa0';ctx.fillRect(x,66,bw*runD,12);
      ctx.fillStyle='rgba(255,255,255,0.85)';ctx.font='11px sans-serif';ctx.textAlign='left';ctx.fillText('走者',x,62);
      // relay bar (with a tick at the cutoff handoff)
      ctx.fillStyle='rgba(255,255,255,0.14)';ctx.fillRect(x,86,bw,10);
      ctx.fillStyle='#ff9a5b';ctx.fillRect(x,86,bw*clamp(relayP,0,1),10);
      ctx.fillStyle='rgba(255,255,255,0.5)';ctx.fillRect(x+bw*0.5-1,84,2,14);
      ctx.fillStyle='rgba(255,180,120,0.9)';ctx.fillText('中継返球',x,108);
      ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,0.55)';ctx.font='12px sans-serif';ctx.fillText('タップ / SPACE 連打 ＝ 走る（速く連打するほど速く走る）',W/2,H-28);
    }
  }

  for(const q of parts){ctx.globalAlpha=Math.max(0,q.life);ctx.fillStyle=q.c;ctx.beginPath();ctx.arc(q.x,q.y,3.2,0,6.28);ctx.fill();}
  ctx.globalAlpha=1;
  for(const q of pops){ctx.globalAlpha=Math.max(0,q.life);ctx.fillStyle=q.c;ctx.font='bold 21px sans-serif';ctx.textAlign='center';ctx.fillText(q.txt,q.x,q.y);}
  ctx.globalAlpha=1;

  // HUD
  ctx.textAlign='left';ctx.fillStyle='#fff';ctx.font='bold 26px sans-serif';ctx.fillText('SCORE '+score,20,36);
  ctx.textAlign='right';ctx.fillStyle='rgba(255,255,255,0.9)';ctx.font='14px sans-serif';ctx.fillText('生還 '+outs+'  Lv'+lvl,W-20,24);
  ctx.fillText('アウト',W-108,46);
  for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(W-60+i*20,41,7,0,6.28);ctx.fillStyle=i<fails?'#ff5b5b':'rgba(255,255,255,0.25)';ctx.fill();}
  if(combo>=2){ctx.textAlign='center';ctx.fillStyle='#ffd24d';ctx.font='bold 18px sans-serif';ctx.fillText('コンボ x'+combo,W/2,128);}

  if(state==='play'&&phase==='result'&&msg){ctx.textAlign='center';ctx.fillStyle=msgOk?'#9ff0b8':'#ffb38a';ctx.font='bold 16px sans-serif';ctx.fillText(msg,W/2,470);}

  if(state==='title'){
    ctx.fillStyle='rgba(4,8,4,0.83)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='bold 44px sans-serif';ctx.fillText('ホームへ還れ',W/2,84);
    ctx.fillStyle='#ffd23e';ctx.font='bold 22px sans-serif';ctx.fillText('Race Home',W/2,120);
    ctx.fillStyle='rgba(255,255,255,0.92)';ctx.font='16px sans-serif';
    ctx.fillText('長打で二塁から本塁へ——タップ/SPACEを“連打”して激走、中継返球より先に生還しろ',W/2,180);
    ctx.fillStyle='rgba(255,255,255,0.66)';ctx.font='14px sans-serif';
    ctx.fillText('連打が速いほど走者バー（緑）が伸びる。外野→カットマン→本塁の中継返球バー（橙）が到達する前に振り切れば生還',W/2,220);
    ctx.fillText('連打が遅いと返球に刺されて本塁タッチアウト。ギリギリのクロスプレーで還るほど大量加点',W/2,244);
    ctx.fillText('上級ほど返球が速い（バーが速く伸びる）。3アウトで交代',W/2,268);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で開始',W/2,352);
    ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='14px sans-serif';ctx.fillText('BEST '+best,W/2,386);
  }
  if(state==='over'){
    ctx.fillStyle='rgba(4,8,4,0.85)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#ff6b6b';ctx.font='bold 46px sans-serif';ctx.fillText('3アウト…交代',W/2,222);
    ctx.fillStyle='#fff';ctx.font='bold 40px sans-serif';ctx.fillText('SCORE '+score,W/2,290);
    ctx.fillStyle='rgba(255,255,255,0.85)';ctx.font='19px sans-serif';ctx.fillText('生還 '+outs+'   BEST '+best,W/2,330);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で もう一度',W/2,402);
  }

  if(flash>0.02){ctx.globalAlpha=flash*0.5;ctx.fillStyle=flashCol;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}
  ctx.restore();

  ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,0.4)';ctx.font='12px sans-serif';
  ctx.fillText('ホームへ還れ：連打で二塁から本塁へ激走、中継返球より先に生還すれば得点。遅いと憤死、3アウトで交代',W/2,H-8);
}

function frame(ts){let dt=ts-last;last=ts;if(dt>60)dt=60;if(dt<0)dt=0;update(dt);render();requestAnimationFrame(frame);}
requestAnimationFrame(frame);

// ---------- test hook ----------
window.__rh={
  start, tap,
  get state(){return state;},
  get score(){return score;},
  get outs(){return outs;},
  get fails(){return fails;},
  get info(){return {state,phase,clock,throwT,tough,runD,relayP,taps,result,outs,fails,lvl};}
};
})();
</script>
</body>
</html>
