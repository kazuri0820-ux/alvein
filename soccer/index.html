<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>フットボール監督 - Gaffer</title>
<style>
  :root{
    --bg:#0d1117; --bg2:#161b22; --bg3:#1c2530; --line:#2b3441;
    --txt:#e6edf3; --muted:#9aa7b4; --accent:#3fb950; --accent2:#2f81f7;
    --warn:#e3b341; --danger:#f85149; --gold:#e3b341;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--txt);font-family:-apple-system,"Segoe UI",Roboto,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;font-size:14px;line-height:1.6}
  #app{max-width:960px;margin:0 auto;padding:0 12px 60px}
  header{position:sticky;top:0;z-index:10;background:linear-gradient(180deg,var(--bg2),rgba(22,27,34,.92));backdrop-filter:blur(6px);border-bottom:1px solid var(--line);margin:0 -12px 16px;padding:10px 14px}
  .brand{display:flex;align-items:center;gap:10px;margin-bottom:8px}
  .brand h1{font-size:18px;letter-spacing:.5px}
  .brand .pill{font-size:11px;color:var(--muted);border:1px solid var(--line);padding:2px 8px;border-radius:999px}
  nav{display:flex;gap:6px;flex-wrap:wrap}
  nav button{background:var(--bg3);color:var(--muted);border:1px solid var(--line);padding:6px 12px;border-radius:8px;cursor:pointer;font-size:13px}
  nav button:hover{color:var(--txt)}
  nav button.active{background:var(--accent);color:#04260f;border-color:var(--accent);font-weight:600}
  .card{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
  .card h2{font-size:15px;margin-bottom:12px;color:var(--txt);display:flex;align-items:center;gap:8px}
  .muted{color:var(--muted)}
  .row{display:flex;gap:12px;flex-wrap:wrap}
  .btn{background:var(--accent);color:#04260f;border:none;padding:10px 18px;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer}
  .btn:hover{filter:brightness(1.08)}
  .btn.sec{background:var(--bg3);color:var(--txt);border:1px solid var(--line)}
  .btn.blue{background:var(--accent2);color:#fff}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  select{background:var(--bg3);color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:7px 9px;font-size:13px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{padding:7px 8px;text-align:center;border-bottom:1px solid var(--line)}
  th{color:var(--muted);font-weight:500;font-size:12px}
  td.name,th.name{text-align:left}
  tr.me{background:rgba(63,185,80,.10)}
  .badge{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:middle;margin-right:6px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
  .club-card{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:16px;cursor:pointer;transition:.15s}
  .club-card:hover{border-color:var(--accent);transform:translateY(-2px)}
  .club-card .cn{font-size:16px;font-weight:600;margin-bottom:4px}
  .stat-bars .sb{display:flex;align-items:center;gap:8px;margin:6px 0}
  .stat-bars .sb span{width:34px;color:var(--muted);font-size:12px}
  .bar{flex:1;height:8px;background:var(--bg3);border-radius:4px;overflow:hidden}
  .bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--accent2),var(--accent))}
  .pos{display:inline-block;min-width:34px;text-align:center;font-size:11px;font-weight:600;padding:2px 4px;border-radius:5px;background:var(--bg3);color:var(--muted)}
  .pos.GK{color:#e3b341}.pos.DEF{color:#58a6ff}.pos.MID{color:#3fb950}.pos.ATT{color:#f85149}
  .ov{font-weight:700;font-variant-numeric:tabular-nums}
  .scoreboard{text-align:center;padding:18px 0}
  .scoreboard .teams{display:flex;justify-content:center;align-items:center;gap:20px}
  .scoreboard .tn{flex:1;font-size:16px;font-weight:600}
  .scoreboard .sc{font-size:40px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:2px}
  .scoreboard .clock{color:var(--muted);font-size:13px;margin-top:4px}
  .commentary{max-height:320px;overflow-y:auto;margin-top:8px}
  .ev{padding:6px 10px;border-left:3px solid var(--line);margin:4px 0;background:var(--bg3);border-radius:0 8px 8px 0;font-size:13px;animation:fade .3s}
  .ev .m{color:var(--muted);font-variant-numeric:tabular-nums;margin-right:8px}
  .ev.goal{border-color:var(--accent);background:rgba(63,185,80,.12);font-weight:600}
  .ev.chance{border-color:var(--warn)}
  .ev.card{border-color:var(--danger)}
  .ev.talk{border-color:var(--accent2);background:rgba(47,129,247,.10)}
  .ev.big{border-color:var(--gold);background:rgba(227,179,65,.14);font-weight:700;font-size:14px}
  .momentum{display:flex;height:12px;border-radius:6px;overflow:hidden;margin-top:14px;background:var(--bg3)}
  .momentum>i,.momentum>b{display:block;height:100%;transition:width .5s ease}
  .card.decision{border-color:var(--accent2);box-shadow:0 0 0 1px var(--accent2) inset,0 0 24px rgba(47,129,247,.25);animation:pop .35s}
  @keyframes pop{from{transform:scale(.96);opacity:0}to{transform:scale(1);opacity:1}}
  .ava{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;color:#fff;font-weight:800;vertical-align:middle;flex-shrink:0;box-shadow:0 1px 3px rgba(0,0,0,.4)}
  .mood{font-size:12px;padding:2px 10px;border-radius:999px;border:1px solid var(--line);display:inline-flex;gap:5px;align-items:center}
  @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1}}
  .stats-line{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);padding:3px 0;border-bottom:1px solid var(--line)}
  .stats-line b{color:var(--txt)}
  .lineup-slot{display:flex;align-items:center;gap:8px;margin:5px 0}
  .lineup-slot .pos{flex-shrink:0}
  .lineup-slot select{flex:1}
  .kpi{display:flex;gap:16px;flex-wrap:wrap}
  .kpi .k{background:var(--bg3);border:1px solid var(--line);border-radius:10px;padding:10px 14px;min-width:90px}
  .kpi .k .v{font-size:20px;font-weight:700}
  .kpi .k .l{font-size:11px;color:var(--muted)}
  .champ{text-align:center;padding:20px;background:radial-gradient(circle at 50% 0,rgba(227,179,65,.18),transparent 70%)}
  .champ .t{font-size:22px;font-weight:800;color:var(--gold)}
  a.gh{color:var(--muted);font-size:11px}
</style>
</head>

/* ---------- 2. 選手/クラブ整形 ---------- */
function groupOf(pos){
  if(pos==='GK')return 'GK';
  if(['CB','LB','RB','LWB','RWB'].includes(pos))return 'DEF';
  if(['CDM','CM','CAM','LM','RM','DM'].includes(pos))return 'MID';
  return 'ATT';
}
function overall(p){
  const{pac,sho,pas,dri,def,phy,grp}=p;
  if(grp==='GK')return Math.round(def*.5+phy*.2+pac*.2+pas*.1);
  if(grp==='DEF')return Math.round(def*.40+phy*.25+pac*.15+pas*.10+dri*.05+sho*.05);
  if(grp==='MID')return Math.round(pas*.30+dri*.25+def*.15+phy*.10+sho*.10+pac*.10);
  return Math.round(sho*.35+dri*.25+pac*.20+pas*.10+phy*.05+def*.05); // ATT
}
const CLUBS = CLUBS_RAW.map(c=>({
  id:c.id,name:c.name,short:c.short,color:c.color,
  squad:c.squad.map((a,i)=>{
    const p={id:c.id+i,name:a[0],pos:a[1],pac:a[2],sho:a[3],pas:a[4],dri:a[5],def:a[6],phy:a[7]};
    p.grp=groupOf(p.pos); p.ov=overall(p); return p;
  })
}));
const clubById=id=>CLUBS.find(c=>c.id===id);
function clubRating(c){ // 平均トップ11（ベース値）
  const s=c.squad.slice().sort((a,b)=>b.ov-a.ov).slice(0,11);
  return Math.round(s.reduce((t,p)=>t+p.ov,0)/s.length);
}

/* ---------- RPG: 選手の経験値・レベル・成長 ---------- */
const PLAYERS={}; CLUBS.forEach(c=>c.squad.forEach(p=>PLAYERS[p.id]=p));
// レベルアップ時に伸びやすい能力（ポジション別）: [主, 副, 副]
const GROW={GK:['def','phy','pas'],DEF:['def','phy','pac'],MID:['pas','dri','def'],ATT:['sho','dri','pac']};
function xpNeed(lvl){return 100+(lvl-1)*45;}         // 次レベルまでの必要XP（基準）
function prog(id){if(!state.prog)state.prog={};if(!state.prog[id])state.prog[id]={lvl:1,xp:0,add:{}};return state.prog[id];}
// 決定的ハッシュ（乱数不可のため id から安定生成）
function hashId(s){let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))>>>0;return h;}
function growthType(id){return ['早熟','標準','晩成'][hashId(id+'g')%3];}
function potentialOf(p){                              // OVR上限（ベースOVR＋伸びしろ）
  const base=(PLAYERS[p.id]||p).ov;
  const h=hashId(p.id)%1000/1000;
  let pot=base+Math.max(2,Math.round((99-base)*0.5+h*8));
  const gt=growthType(p.id);
  if(gt==='早熟')pot-=2; else if(gt==='晩成')pot+=3;
  if(personaOf(p.id).id==='genius')pot+=2;            // 天才肌は上限+2
  return Math.min(99,Math.max(base,pot));
}
function xpMult(id){const gt=growthType(id);return gt==='早熟'?0.9:gt==='晩成'?1.12:1;} // 晩成は伸びが遅いが上限高
function xpNeedFor(id,lvl){return Math.round(xpNeed(lvl)*xpMult(id));}
function growPlayer(id){
  const p=PLAYERS[id]; if(!p)return;
  if(eff(p).ov>=potentialOf(p))return;               // ポテンシャル到達で能力成長は停止
  const g=prog(id); const k=GROW[p.grp]||GROW.MID;
  g.add[k[0]]=(g.add[k[0]]||0)+2; g.add[k[1]]=(g.add[k[1]]||0)+1; g.add[k[2]]=(g.add[k[2]]||0)+1;
}
function eff(p){ // 成長ボーナス込みの実効選手（Lv/XP付き）
  const g=state&&state.prog&&state.prog[p.id];
  if(!g)return p;
  const e={...p};
  ['pac','sho','pas','dri','def','phy'].forEach(k=>e[k]=Math.min(99,p[k]+((g.add&&g.add[k])||0)));
  e.ov=overall(e); e.lvl=g.lvl; e.xp=g.xp; e.xpNeed=xpNeed(g.lvl);
  return e;
}
function gainXP(id,amount){
  const g=prog(id); g.xp+=amount; let ups=0;
  while(g.xp>=xpNeedFor(id,g.lvl)){g.xp-=xpNeedFor(id,g.lvl);g.lvl++;growPlayer(id);ups++;}
  return ups;
}
// 試合後、自クラブ先発にXPを付与。レベルアップした選手を返す
function awardMatchXP(res,homeC,awayC){
  const meHome=homeC.id===state.clubId;
  const myScore=meHome?res.hs:res.as, oppScore=meHome?res.as:res.hs;
  const result=myScore>oppScore?'W':myScore<oppScore?'L':'D';
  const goalsBy={},assistsBy={};
  (res.scorers||[]).filter(s=>s.clubId===state.clubId).forEach(s=>goalsBy[s.id]=(goalsBy[s.id]||0)+1);
  (res.assists||[]).filter(s=>s.clubId===state.clubId).forEach(s=>assistsBy[s.id]=(assistsBy[s.id]||0)+1);
  const club=clubById(state.clubId); const ups=[];
  const motiv=1+perkLv('motivator')*0.1;
  state.lineup.forEach(i=>{
    const p=club.squad[i]; let xp=40;
    xp+=(goalsBy[p.id]||0)*30; xp+=(assistsBy[p.id]||0)*20;
    xp+= result==='W'?25:result==='D'?10:0;
    if((p.grp==='GK'||p.grp==='DEF')&&oppScore===0)xp+=20;
    let mult=motiv; if(personaOf(p.id).id==='ambition')mult*=1.15;   // 野心家はXP+15%
    xp=Math.round(xp*mult);
    if(gainXP(p.id,xp)>0)ups.push({name:p.name,lvl:prog(p.id).lvl});
  });
  if(oppScore===0)state.cs=(state.cs||0)+1;   // クリーンシート集計
  // コンディション: 全員+30回復、先発は-40消耗（差引: 先発 純-10 / 控え +30）
  club.squad.forEach((p,i)=>{let c=condOf(p.id)+30; if(state.lineup.includes(i))c-=40; setCond(p.id,c);});
  // 調子(フォーム)更新: 得点/アシストで上昇・敗戦で下降・控えは中立へ。性格で振れ幅が変化
  club.squad.forEach((p,i)=>{
    const started=state.lineup.includes(i); let d=0;
    if(started){
      if(goalsBy[p.id]||assistsBy[p.id])d=1;
      else if((p.grp==='GK'||p.grp==='DEF')&&oppScore===0)d=1;   // クリーンシートは守備陣の好調材料
      else if(result==='L')d=-1;
    } else d=formOf(p.id)>0?-1:(formOf(p.id)<0?1:0);
    const pid=personaOf(p.id).id;
    if(pid==='hot')d*=2; else if(pid==='cool')d=Math.round(d/2);
    if(d)setForm(p.id,formOf(p.id)+d);
  });
  // 監督XP（結果＋得点）
  const mxp=(result==='W'?50:result==='D'?25:10)+myScore*5;
  const mgrUps=gainMgrXP(mxp);
  save();
  return {players:ups,mgrUps,mgrLvl:mgr().lvl};
}

}

/* ---------- 3. フォーメーション & ベストXI ---------- */
const FORMATIONS={
  '4-3-3':['GK','DEF','DEF','DEF','DEF','MID','MID','MID','ATT','ATT','ATT'],
  '4-4-2':['GK','DEF','DEF','DEF','DEF','MID','MID','MID','MID','ATT','ATT'],
  '4-2-3-1':['GK','DEF','DEF','DEF','DEF','MID','MID','MID','MID','MID','ATT'],
  '3-5-2':['GK','DEF','DEF','DEF','MID','MID','MID','MID','MID','ATT','ATT'],
};
function bestXI(club,formation){
  const slots=FORMATIONS[formation];
  const pool=club.squad.slice().sort((a,b)=>b.ov-a.ov);
  const used=new Set(), xi=[];
  for(const g of slots){
    let pick=pool.find(p=>p.grp===g&&!used.has(p.id));
    if(!pick)pick=pool.find(p=>!used.has(p.id));
    used.add(pick.id); xi.push(club.squad.indexOf(pick));
  }
  return xi;
}

/* ---------- 4. チーム力算出 ---------- */
function mean(a){return a.length?a.reduce((t,x)=>t+x,0)/a.length:55;}
function strength(club,lineup,tac){
  const xi=lineup.map(i=>eff(club.squad[i]));
  const cf=p=>condFactor(p.id)*formFactor(p.id);   // コンディション×調子（自クラブのみ実効。AIは×1）
  const gkp=xi.find(p=>p.grp==='GK');
  const gk=gkp?gkp.ov*cf(gkp):58;
  const defs=xi.filter(p=>p.grp==='DEF').map(p=>p.ov*cf(p));
  const mids=xi.filter(p=>p.grp==='MID').map(p=>p.ov*cf(p));
  const atts=xi.filter(p=>p.grp==='ATT').map(p=>p.ov*cf(p));
  let att=mean(atts)*.6+mean(mids)*.3+mean(defs)*.1;
  let mid=mean(mids)*.6+mean(atts)*.2+mean(defs)*.2;
  let def=mean(defs)*.6+gk*.25+mean(mids)*.15;
  // 特殊能力ボーナス
  xi.forEach(p=>abilitiesOf(p).forEach(a=>{att+=a.b.att;mid+=a.b.mid;def+=a.b.def;}));
  // 監督の采配パーク（自クラブのみ）
  if(club.id===state.clubId){att+=perkLv('attackCoach');mid+=perkLv('midCoach');def+=perkLv('defenseCoach');
    const mf=moraleFactor(); att*=mf; mid*=mf; def*=mf;}
  if(tac.style==='attack'){att*=1.10;def*=0.93;}
  else if(tac.style==='defend'){att*=0.92;def*=1.10;}
  if(tac.press==='high'){mid*=1.05;def*=0.97;}
  else if(tac.press==='low'){mid*=0.97;def*=1.03;}
  if(tac.line==='high'){att*=1.04;def*=0.96;}
  else if(tac.line==='low'){att*=0.97;def*=1.04;}
  return{att,mid,def,gk};
}

/* ---------- 5. 試合エンジン ---------- */
function rnd(){return Math.random();}
function pickScorer(club,lineup){
  const xi=lineup.map(i=>club.squad[i]).filter(p=>p.grp!=='GK');
  const weighted=[];
  xi.forEach(p=>{
    let w=p.sho*(p.grp==='ATT'?3:p.grp==='MID'?1.4:0.4);
    weighted.push({p,w});
  });
  const tot=weighted.reduce((t,x)=>t+x.w,0);
  let r=rnd()*tot;
  for(const x of weighted){r-=x.w;if(r<=0)return x.p;}
  return xi[0];
}
function pickAssister(club,lineup,scorerId){
  const xi=lineup.map(i=>club.squad[i]).filter(p=>p.grp!=='GK'&&p.id!==scorerId);
  if(!xi.length)return null;
  const weighted=xi.map(p=>({p,w:p.pas*(p.grp==='MID'?2:p.grp==='ATT'?1.6:0.6)}));
  const tot=weighted.reduce((t,x)=>t+x.w,0);
  let r=rnd()*tot;
  for(const x of weighted){r-=x.w;if(r<=0)return x.p;}
  return xi[0];
}
const GOAL_TXT=['ゴォォル！','ネットが揺れた！','決めた！','見事なフィニッシュ！','こじ開けた！'];
const MISS_TXT=['惜しい！枠の外','ポストを直撃！','GK好セーブ！','決定機を逃す','クロスバー！'];
function simulate(homeC,homeL,homeT,awayC,awayL,awayT,withEvents){
  const H=strength(homeC,homeL,homeT), A=strength(awayC,awayL,awayT);
  H.att*=1.06; H.def*=1.03; // ホームアドバンテージ
  let possH=H.mid/(H.mid+A.mid); possH=Math.max(.35,Math.min(.65,possH));
  const st={home:{sh:0,sot:0},away:{sh:0,sot:0}};
  let hs=0,as=0; const events=[]; const scorers=[]; const assists=[];
  const yc={home:0,away:0};
  for(let m=1;m<=90;m++){
    if(rnd()<0.30){
      const isH=rnd()<possH;
      const atkC=isH?homeC:awayC, atkL=isH?homeL:awayL;
      const atk=isH?H:A, dfn=isH?A:H; const side=isH?'home':'away';
      const q=atk.att/(atk.att+dfn.def); // 0.35〜0.65
      st[side].sh++;
      const onT=rnd()<0.32+q*0.35;
      if(onT){
        st[side].sot++;
        let gp=(q-0.24)*1.15*(1-dfn.gk/300);
        gp=Math.max(.03,Math.min(.60,gp));
        if(rnd()<gp){
          if(side==='home')hs++;else as++;
          const scorer=pickScorer(atkC,atkL);
          scorers.push({side,id:scorer.id,name:scorer.name,clubId:atkC.id});
          let assistTxt='';
          if(rnd()<0.65){
            const assister=pickAssister(atkC,atkL,scorer.id);
            if(assister){assists.push({side,id:assister.id,name:assister.name,clubId:atkC.id});assistTxt=`（A: ${assister.name}）`;}
          }
          if(withEvents)events.push({m,type:'goal',team:side,text:`⚽ ${scorer.name}！ ${GOAL_TXT[Math.floor(rnd()*GOAL_TXT.length)]}${assistTxt} (${atkC.short})`});
        }else if(withEvents&&rnd()<0.5){
          events.push({m,type:'chance',team:side,text:`${atkC.short} ${MISS_TXT[Math.floor(rnd()*MISS_TXT.length)]}`});
        }
      }
    }
    if(withEvents&&rnd()<0.012){
      const side=rnd()<0.5?'home':'away'; const c=side==='home'?homeC:awayC;
      yc[side]++; events.push({m,type:'card',team:side,text:`🟨 ${c.short} イエローカード`});
    }
  }
  return{hs,as,possH,stats:st,events,scorers,assists};
}

/* ---------- 6. リーグ日程 ---------- */
function genFixtures(ids){
  const arr=ids.slice(); const n=arr.length; const first=[];
  for(let r=0;r<n-1;r++){
    const pairs=[];
    for(let i=0;i<n/2;i++){
      let h=arr[i],a=arr[n-1-i];
      if(r%2===1)[h,a]=[a,h];
      pairs.push({h,a,played:false,hs:null,as:null});
    }
    first.push(pairs);
    arr.splice(1,0,arr.pop());
  }
  const second=first.map(rd=>rd.map(m=>({h:m.a,a:m.h,played:false,hs:null,as:null})));
  return first.concat(second);
}
function emptyTable(){const t={};CLUBS.forEach(c=>t[c.id]={p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0});return t;}
function standings(){
  return CLUBS.map(c=>({c,...state.table[c.id]}))
    .sort((a,b)=>b.pts-a.pts||(b.gf-b.ga)-(a.gf-a.ga)||b.gf-a.gf||a.c.name.localeCompare(b.c.name));
}

/* ---------- 7. 状態 & セーブ ---------- */
const SAVE_KEY='gaffer_save_v1';
let state=null;
function save(){localStorage.setItem(SAVE_KEY,JSON.stringify(state));}
function load(){try{const s=localStorage.getItem(SAVE_KEY);return s?JSON.parse(s):null;}catch(e){return null;}}
function newGame(clubId){
  const fx=genFixtures(CLUBS.map(c=>c.id));
  const club=clubById(clubId);
  state={season:1,round:0,clubId,fixtures:fx,table:emptyTable(),
    tactics:{formation:'4-3-3',style:'balanced',press:'mid',line:'mid'},
    lineup:bestXI(club,'4-3-3'),history:[],scorers:{},prog:{},tp:TP_MAX,trainFocus:'sho',
    mgr:{lvl:1,xp:0,points:0,perks:{}},quests:{},cs:0,cond:{},morale:60,pendingEvent:null,form:{}};
  save();
}

/* ---------- 8. 試合進行 ---------- */
function playerMatchOfRound(r){
  const rd=state.fixtures[r]; if(!rd)return null;
  return rd.find(m=>m.h===state.clubId||m.a===state.clubId);
}
function statEntry(s){
  if(!state.scorers)state.scorers={};
  if(!state.scorers[s.id])state.scorers[s.id]={name:s.name,clubId:s.clubId,goals:0,assists:0};
  if(state.scorers[s.id].assists===undefined)state.scorers[s.id].assists=0;
  return state.scorers[s.id];
}
function addGoals(scorers){(scorers||[]).forEach(s=>{statEntry(s).goals++;});}
function addAssists(assists){(assists||[]).forEach(s=>{statEntry(s).assists++;});}
function finalizeRound(r,playerResult){
  const rd=state.fixtures[r];
  rd.forEach(m=>{
    if(m.played)return;
    let hs,as;
    if(playerResult&&(m.h===state.clubId||m.a===state.clubId)){hs=playerResult.hs;as=playerResult.as;addGoals(playerResult.scorers);addAssists(playerResult.assists);}
    else{
      const hc=clubById(m.h),ac=clubById(m.a);
      const res=simulate(hc,bestXI(hc,'4-3-3'),{style:'balanced',press:'mid',line:'mid'},
                         ac,bestXI(ac,'4-3-3'),{style:'balanced',press:'mid',line:'mid'},false);
      hs=res.hs;as=res.as;addGoals(res.scorers);addAssists(res.assists);
    }
    m.hs=hs;m.as=as;m.played=true;
    const th=state.table[m.h],ta=state.table[m.a];
    th.p++;ta.p++;th.gf+=hs;th.ga+=as;ta.gf+=as;ta.ga+=hs;
    if(hs>as){th.w++;ta.l++;th.pts+=3;}else if(hs<as){ta.w++;th.l++;ta.pts+=3;}
    else{th.d++;ta.d++;th.pts++;ta.pts++;}
  });
  state.round++;
  state.tp=TP_MAX;   // 新しい節でトレーニングポイント回復
  save();
}

/* 試合演出 */
/* ===== インタラクティブ試合エンジン（RPGバトル風） ===== */
const AI_TAC={style:'balanced',press:'mid',line:'mid'};
let M=null, matchTimer=null;
function avatar(name,color,size){
  const init=(name||'?').split(' ').map(w=>w[0]||'').slice(0,2).join('').toUpperCase();
  return `<span class="ava" style="width:${size}px;height:${size}px;background:${color};font-size:${Math.round(size*0.4)}px">${init}</span>`;
}
function byPlayerSide(side){return (side==='home'&&M.isHome)||(side==='away'&&!M.isHome);}
function mom(d){M.momentum=Math.max(6,Math.min(94,M.momentum+d));}   // プレイヤー有利度 0-100
function pushLog(type,text){M.log.push({m:M.min,type,text});}
function startMatch(){
  const m=playerMatchOfRound(state.round);
  const club=clubById(state.clubId);
  const isHome=m.h===state.clubId;
  const opp=clubById(isHome?m.a:m.h);
  const homeC=isHome?club:opp, awayC=isHome?opp:club;
  const homeL=isHome?state.lineup:bestXI(opp,'4-3-3');
  const awayL=isHome?bestXI(opp,'4-3-3'):state.lineup;
  const H=strength(homeC,homeL,isHome?state.tactics:AI_TAC);
  const A=strength(awayC,awayL,isHome?AI_TAC:state.tactics);
  H.att*=1.06; H.def*=1.03;                          // ホームアドバンテージ
  const rival=isRivalOpp(opp.id);
  if(rival){const os=isHome?A:H; os.att*=1.03; os.mid*=1.03; os.def*=1.03;}  // ライバルも燃える＝ボス級
  let possH=H.mid/(H.mid+A.mid); possH=Math.max(.35,Math.min(.65,possH));
  M={homeC,awayC,homeL,awayL,isHome,H,A,possH,pStr:isHome?H:A,
     rival,derby:rival?derbyName(state.clubId,opp.id):null,
     min:0,hs:0,as:0,log:[],scorers:[],assists:[],
     st:{home:{sh:0,sot:0},away:{sh:0,sot:0}},
     momentum:50,keyLeft:3,halftimeDone:false,decision:null,over:false,fast:false};
  current='match'; setNav(); renderMatch();
  matchTimer=setTimeout(matchTick,700);
}
function matchTick(){
  if(M.decision||M.over)return;
  M.min++;
  if(M.min>90){finishMatch();return;}
  if(M.min===45&&!M.halftimeDone){M.halftimeDone=true;M.decision={type:'halftime'};renderMatch();return;}
  if(rnd()<0.30){
    const isH=rnd()<M.possH;
    const side=isH?'home':'away';
    const atk=isH?M.H:M.A, dfn=isH?M.A:M.H;
    const q=atk.att/(atk.att+dfn.def);
    M.st[side].sh++;
    if(byPlayerSide(side)&&M.keyLeft>0&&q>0.47&&M.min>8&&rnd()<0.55){
      M.keyLeft--; M.decision={type:'chance',side,q}; renderMatch(); return;   // 決断ポイント
    }
    resolveAuto(side,q);
  }
  renderMatch();
  matchTimer=setTimeout(matchTick, M.fast?18:170);
}
function goalScored(side,sc,asst,text,big){
  if(side==='home')M.hs++; else M.as++;
  const cid=(side==='home'?M.homeC:M.awayC).id;
  M.scorers.push({side,id:sc.id,name:sc.name,clubId:cid});
  if(asst)M.assists.push({side,id:asst.id,name:asst.name,clubId:cid});
  M.st[side].sot++;
  pushLog(big?'big':'goal',text);
  mom(byPlayerSide(side)?16:-16);
}
function resolveAuto(side,q){            // 自動処理（相手＆自軍の非決断チャンス）
  const atkC=side==='home'?M.homeC:M.awayC, atkL=side==='home'?M.homeL:M.awayL;
  const gk=(side==='home'?M.A:M.H).gk;
  const onT=rnd()<0.32+q*0.35;
  if(!onT){ mom(byPlayerSide(side)?2:-2); return; }
  M.st[side].sot++;
  let gp=(q-0.24)*1.15*(1-gk/300); gp=Math.max(.03,Math.min(.6,gp));
  if(rnd()<gp){
    const sc=pickScorer(atkC,atkL); const asst=(rnd()<0.65)?pickAssister(atkC,atkL,sc.id):null;
    goalScored(side,sc,asst,`⚽ ${sc.name}！ ${GOAL_TXT[Math.floor(rnd()*GOAL_TXT.length)]}${asst?`（A: ${asst.name}）`:''} (${atkC.short})`,false);
  }else{
    mom(byPlayerSide(side)?5:-5);
    if(byPlayerSide(side)&&rnd()<0.4)pushLog('chance',`${atkC.short} ${MISS_TXT[Math.floor(rnd()*MISS_TXT.length)]}`);
  }
}
function resolveKeyMoment(choice){
  if(!M.decision||M.decision.type!=='chance')return;
  const {side,q}=M.decision; M.decision=null;
  const atkC=side==='home'?M.homeC:M.awayC, atkL=side==='home'?M.homeL:M.awayL;
  const gk=(side==='home'?M.A:M.H).gk;
  const p=eff(pickScorer(atkC,atkL));
  const mf=morale()/100;
  let pGoal,verb,scorer=p,asst=null;
  if(choice==='shoot'){ pGoal=0.30+(p.sho-70)*0.010+q*0.15+mf*0.08-(gk-80)*0.004; verb='豪快なシュート'; }
  else if(choice==='through'){ const pass=Math.min(0.95,0.40+(p.pas-70)*0.013); pGoal=pass*0.85+mf*0.05;
    verb='スルーパス'; const tm=pickScorer(atkC,atkL); if(tm.id!==p.id){scorer=tm;asst=p;} }
  else { const dr=Math.min(0.92,0.34+(p.dri-70)*0.013); pGoal=dr*0.9+mf*0.05-(gk-80)*0.003; verb='ドリブル突破'; }
  pGoal=Math.max(0.08,Math.min(0.92,pGoal));
  M.st[side].sh++;
  if(rnd()<pGoal){
    goalScored(side,scorer,asst,`🔥 GOAL!! ${scorer.name} の${verb}が突き刺さった！${asst?`（${asst.name}の絶妙な演出）`:''}`,true);
  }else{
    M.st[side].sot++;
    mom(-10);
    const fail=choice==='shoot'?'枠を捉えきれず':choice==='through'?'パスはカットされ':'寄せられて奪われ';
    pushLog('chance',`💨 ${p.name} の${verb}、${fail}実らず…`);
  }
  renderMatch(); matchTimer=setTimeout(matchTick,850);
}
function teamTalk(kind){
  if(!M.decision||M.decision.type!=='halftime')return; M.decision=null;
  const diff=(M.isHome?M.hs-M.as:M.as-M.hs);
  let mult=1,dmom=0,txt='';
  if(kind==='rally'){ if(diff<=0){mult=1.06;dmom=12;txt='「まだ終わっちゃいない、行くぞ！」ベンチが沸き立った';} else {mult=0.99;dmom=-4;txt='「気を抜くな！」…選手はやや硬くなった';} }
  else if(kind==='calm'){ mult=1.02;dmom=4;txt='「落ち着いていこう」いつものリズムを取り戻した';}
  else { if(diff>0){mult=1.05;dmom=10;txt='「最高だ、この調子でいけ！」選手は自信に満ちている';} else {mult=1.0;dmom=3;txt='「顔を上げろ、君たちは強い」少し落ち着いた';} }
  M.pStr.att*=mult; M.pStr.mid*=mult; M.pStr.def*=mult; mom(dmom);
  pushLog('talk','🗣 '+txt);
  renderMatch(); matchTimer=setTimeout(matchTick,700);
}
function finishMatch(){
  if(matchTimer)clearTimeout(matchTimer);
  M.over=true;
  const my=M.isHome?M.hs:M.as, op=M.isHome?M.as:M.hs;
  const win=my>op, lose=my<op;
  const before=morale();
  chMorale(win?8:lose?-8:2);                         // 通常の士気変動
  if(win){const c=clubById(state.clubId); if(state.lineup.some(i=>personaOf(c.squad[i].id).id==='mood'))chMorale(2);} // ムードメーカー
  let rivalBox=null;
  if(M.rival){                                       // ダービー特別処理
    chMorale(win?6:lose?-6:0);
    if(win){
      const bonus=120; gainMgrXP(bonus); state.rivalWins=(state.rivalWins||0)+1;
      const heroId=(M.scorers.find(s=>s.clubId===state.clubId)||{}).id||topPlayer();
      gainXP(heroId,250);
      rivalBox=`🔥 ${M.derby} 制覇！ <b>${PLAYERS[heroId].name}</b> がダービーの英雄に（経験値+250）・監督XP+${bonus}・士気大幅UP`;
    }else if(lose){ rivalBox=`💔 ${M.derby} 敗北… この屈辱を糧に（士気ダウン）`; }
    else{ rivalBox=`🤝 ${M.derby} は痛み分け`; }
  }
  const res={hs:M.hs,as:M.as,possH:M.possH,stats:M.st,events:M.log,scorers:M.scorers,assists:M.assists};
  finalizeRound(state.round,{hs:res.hs,as:res.as,scorers:res.scorers,assists:res.assists});
  const xpres=awardMatchXP(res,M.homeC,M.awayC);
  const quests=checkQuests();
  maybeRollEvent();
  showResult(M.homeC,M.awayC,res,xpres,quests,{before,after:state.morale},rivalBox);
}

function showResult(homeC,awayC,res,xpres,quests,mor,rivalBox){
  current='match'; setNav();
  const poss=Math.round(res.possH*100);
  const mi=moraleInfo();
  const rBox=rivalBox?`<div class="card decision"><h2>⚔️ ダービー</h2><p>${rivalBox}</p></div>`:'';
  const morBox=mor?`<div class="card"><h2>チーム士気</h2><div class="stats-line"><span>試合前 ${mor.before}</span><b style="color:${mi.c}">${mi.e} ${mor.after} ${mi.l}</b></div></div>`:'';
  const ups=(xpres&&xpres.players)||[];
  const upBox=(ups.length)?`<div class="card"><h2>⬆️ レベルアップ</h2>${ups.map(u=>`<div class="stats-line"><b>${u.name}</b><span>Lv.${u.lvl} に上昇！</span></div>`).join('')}</div>`:'';
  const mgrBox=(xpres&&xpres.mgrUps>0)?`<div class="card"><h2>🎖️ 監督レベルアップ</h2><div class="stats-line"><b>監督 Lv.${xpres.mgrLvl}</b><span>パークポイント +${xpres.mgrUps}！采配パークを強化できます</span></div></div>`:'';
  const qBox=(quests&&quests.length)?`<div class="card"><h2>🎯 クエスト達成！</h2>${quests.map(q=>`<div class="stats-line"><b>${q.icon} ${q.name}</b><span>報酬: 監督XP+${q.reward.mgrXp||0}${q.reward.points?` / パーク+${q.reward.points}`:''}</span></div>`).join('')}</div>`:'';
  const line=(l,h,a)=>`<div class="stats-line"><b>${h}</b><span>${l}</span><b>${a}</b></div>`;
  const rd=state.fixtures[state.round-1];
  const involved=[homeC.id,awayC.id];
  const others=rd.filter(m=>!(involved.includes(m.h)&&involved.includes(m.a)))
    .map(m=>{const h=clubById(m.h),a=clubById(m.a);return `<div class="stats-line"><span>${h.short}</span><b>${m.hs} - ${m.as}</b><span>${a.short}</span></div>`;}).join('');
  $('#screen').innerHTML=`<div class="card">
    <h2>試合結果</h2>
    <div class="scoreboard"><div class="teams">
      <div class="tn"><span class="badge" style="background:${homeC.color}"></span>${homeC.name}</div>
      <div class="sc">${res.hs} - ${res.as}</div>
      <div class="tn"><span class="badge" style="background:${awayC.color}"></span>${awayC.name}</div>
    </div></div>
    ${line('ボール支配率',poss+'%',(100-poss)+'%')}
    ${line('シュート',res.stats.home.sh,res.stats.away.sh)}
    ${line('枠内',res.stats.home.sot,res.stats.away.sot)}
    </div>
    ${rBox}
    ${morBox}
    ${upBox}
    ${mgrBox}
    ${qBox}
    <div class="card"><h2>他会場の結果</h2>${others||'<span class="muted">なし</span>'}</div>
    <div class="card"><div class="row">
      <button class="btn" data-go="dashboard">続ける →</button>
      <button class="btn sec" data-go="standings">順位表を見る</button>
    </div></div>`;
  bindCommon();
}

function viewStandings(){
  const st=standings();
  const rows=st.map((x,i)=>`<tr class="${x.c.id===state.clubId?'me':''}">
    <td>${i+1}</td><td class="name"><span class="badge" style="background:${x.c.color}"></span>${x.c.name}</td>
    <td>${x.p}</td><td>${x.w}</td><td>${x.d}</td><td>${x.l}</td>
    <td>${x.gf}</td><td>${x.ga}</td><td>${x.gf-x.ga>0?'+':''}${x.gf-x.ga}</td><td><b>${x.pts}</b></td></tr>`).join('');
  return `<div class="card"><h2>順位表</h2><div style="overflow-x:auto"><table>
    <tr><th>#</th><th class="name">クラブ</th><th>試</th><th>勝</th><th>分</th><th>敗</th><th>得</th><th>失</th><th>差</th><th>点</th></tr>
    ${rows}</table></div></div>`;
}

function viewFixtures(){
  const blocks=state.fixtures.map((rd,ri)=>{
    const mine=rd.find(m=>m.h===state.clubId||m.a===state.clubId);
    const rows=rd.map(m=>{
      const h=clubById(m.h),a=clubById(m.a);
      const meRow=m.h===state.clubId||m.a===state.clubId;
      const score=m.played?`<b>${m.hs} - ${m.as}</b>`:'<span class="muted">- : -</span>';
      return `<div class="stats-line ${meRow?'':''}" style="${meRow?'background:rgba(63,185,80,.08)':''}">
        <span style="flex:1;text-align:right">${h.short}</span>
        <b style="min-width:70px;text-align:center">${score}</b>
        <span style="flex:1;text-align:left">${a.short}</span></div>`;
    }).join('');
    const cls=ri===state.round?' style="border-color:var(--accent)"':'';
    return `<div class="card"${cls}><h2>第${ri+1}節 ${ri===state.round?'<span class="muted" style="font-size:11px">(次節)</span>':''}</h2>${rows}</div>`;
  }).join('');
  return blocks;
}

let rankSort='goals';
function viewRanking(){
  const all=Object.values(state.scorers||{});
  if(all.length===0)return `<div class="card"><h2>ランキング</h2><p class="muted">まだ記録がありません。試合を進めましょう。</p></div>`;
  const key=rankSort;
  const arr=all.map(s=>({...s,assists:s.assists||0}))
    .sort((a,b)=>b[key]-a[key]||b.goals-a.goals||b.assists-a.assists).slice(0,20);
  const rows=arr.map((s,i)=>{
    const c=clubById(s.clubId);
    return `<tr class="${s.clubId===state.clubId?'me':''}"><td>${i+1}</td>
      <td class="name">${s.name}</td>
      <td class="name"><span class="badge" style="background:${c.color}"></span>${c.short}</td>
      <td class="${key==='goals'?'ov':''}">${s.goals}</td>
      <td class="${key==='assists'?'ov':''}">${s.assists}</td></tr>`;
  }).join('');
  const tab=(k,l)=>`<button class="btn ${rankSort===k?'':'sec'}" data-rank="${k}" style="padding:6px 14px">${l}</button>`;
  return `<div class="card"><h2>ランキング <span class="muted" style="font-weight:400;font-size:12px">（シーズン${state.season}）</span></h2>
    <div class="row" style="margin-bottom:10px">${tab('goals','得点王')}${tab('assists','アシスト王')}</div>
    <div style="overflow-x:auto"><table>
    <tr><th>#</th><th class="name">選手</th><th class="name">クラブ</th><th>G</th><th>A</th></tr>
    ${rows}</table></div></div>`;
}

function nextSeason(){
  checkQuests();            // シーズン終了時点の目標（優勝など）を判定してから
  state.season++; state.round=0;
  state.fixtures=genFixtures(CLUBS.map(c=>c.id));
  state.table=emptyTable();
  state.scorers={};
  state.quests={}; state.cs=0;   // シーズン目標をリセット
  save(); go('dashboard');
}

/* ---------- 10. 起動 ---------- */
state=load();
if(state&&!state.scorers)state.scorers={};
if(state&&!state.prog)state.prog={};
if(state&&state.tp===undefined)state.tp=TP_MAX;
if(state&&!state.mgr)state.mgr={lvl:1,xp:0,points:0,perks:{}};
if(state&&!state.quests)state.quests={};
if(state&&state.cs===undefined)state.cs=0;
if(state&&!state.cond)state.cond={};
if(state&&state.morale===undefined)state.morale=60;
if(state&&!state.form)state.form={};
render();
</script>
</body>
</html>
