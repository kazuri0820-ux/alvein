<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>サインプレー (Signs)</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;background:#0a1410;overflow:hidden;font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",system-ui,sans-serif}
  #wrap{width:100%;height:100%;display:flex;align-items:center;justify-content:center}
  #stage{position:relative;width:min(100vw,calc(100vh*1.5));aspect-ratio:900/600;max-width:900px;
    box-shadow:0 10px 60px rgba(0,0,0,.6);border-radius:10px;overflow:hidden;touch-action:none}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
  #hint{position:absolute;left:0;bottom:6px;width:100%;text-align:center;color:#cfe;
    font-size:12px;opacity:.55;pointer-events:none;text-shadow:0 1px 3px #000}
</style>
</head>
<body>
<div id="wrap"><div id="stage">
  <canvas id="cv"></canvas>
  <div id="hint">コーチのサインの順番を覚えて、同じ順で 帽子/胸/腕/ベルト（キー 1〜4・タップ）を入力！ 逆順ラウンドに注意</div>
</div></div>
<script>
(()=>{
const cv=document.getElementById('cv'), g=cv.getContext('2d');
const W=900,H=600;
let DPR=1;
function fit(){ DPR=Math.min(2,window.devicePixelRatio||1); cv.width=W*DPR; cv.height=H*DPR; g.setTransform(DPR,0,0,DPR,0,0); }
fit(); addEventListener('resize',fit);

// ---------- audio ----------
let AC=null;
function ac(){ if(!AC){ try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){} } return AC; }
function tone(f,d,t,v,sweep){ const a=ac(); if(!a)return; const o=a.createOscillator(),gg=a.createGain();
  o.type=t||'sine'; o.frequency.value=f; if(sweep) o.frequency.exponentialRampToValueAtTime(Math.max(20,sweep),a.currentTime+d);
  gg.gain.setValueAtTime(0.0001,a.currentTime); gg.gain.exponentialRampToValueAtTime(v||0.2,a.currentTime+0.012);
  gg.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+d); o.connect(gg).connect(a.destination);
  o.start(); o.stop(a.currentTime+d+0.02); }
function noise(d,v,hp){ const a=ac(); if(!a)return; const n=a.createBuffer(1,a.sampleRate*d,a.sampleRate); const ch=n.getChannelData(0);
  for(let i=0;i<ch.length;i++) ch[i]=(Math.random()*2-1)*(1-i/ch.length);
  const s=a.createBufferSource(); s.buffer=n; const f=a.createBiquadFilter(); f.type='highpass'; f.frequency.value=hp||600;
  const gg=a.createGain(); gg.gain.value=v||0.15; s.connect(f).connect(gg).connect(a.destination); s.start(); }
const SND=[520,650,780,930];
const S={
  show(i){ tone(SND[i]||500,0.12,'triangle',0.1,SND[i]*1.4); },
  tap(i){ tone(SND[i]||500,0.08,'square',0.09,SND[i]*1.2); },
  good(){ tone(660,0.06,'triangle',0.1,980); },
  success(){ tone(520,0.1,'triangle',0.14,780); setTimeout(()=>tone(780,0.12,'triangle',0.12,1040),80); setTimeout(()=>tone(1040,0.14,'square',0.1,1400),160); },
  miss(){ noise(0.14,0.16,300); tone(180,0.2,'sawtooth',0.12,80); },
  over(){ tone(300,0.5,'sawtooth',0.16,90); setTimeout(()=>tone(200,0.6,'sawtooth',0.14,60),160); },
  ready(){ tone(400,0.08,'sine',0.06,520); },
};

// ---------- signs ----------
const SIGNS=[
  {name:'帽子', col:'#ff6a6a', part:'head'},
  {name:'胸',   col:'#7fd8ff', part:'chest'},
  {name:'腕',   col:'#ffe15a', part:'arm'},
  {name:'ベルト',col:'#8fffb0', part:'belt'},
];
const PLAYS=['盗塁','エンドラン','バント','待て'];

// ---------- state ----------
let state='title';
let parts=[], pops=[];
let score, mistakes, rounds, combo, best, lvl;
let seq=[], reverse=false, phase='show';
let showIdx=0, showT=0, inputIdx=0, inputT=0, inputLimit=0, flashSign=-1, flashT=0;
let playName='', clutch=false;
let flash=0, shakeT=0;
try{ best=+localStorage.getItem('sg_best')||0; }catch(e){ best=0; }

const crowd=[]; { const cc=['#e6b48f','#9bd0e6','#e6dc8f','#c9a0d8','#8fd8bd','#f0f0f0']; for(let i=0;i<230;i++) crowd.push({x:(i*31.9)%W, y:3+((i*53)%30), c:cc[i%cc.length]}); }
const BTN=[]; for(let i=0;i<4;i++) BTN.push({x:150+i*200, y:470, w:170, h:96, i});

function reset(){ parts=[]; pops=[]; score=0; mistakes=0; rounds=0; combo=0; lvl=0; flash=0; shakeT=0; nextRound(); }
function clamp(v,a,b){ return v<a?a:v>b?b:v; }
function nextRound(){
  lvl=Math.min(7,Math.floor(rounds/2));
  const len=Math.min(8,3+Math.floor(rounds/2));
  seq=[]; for(let i=0;i<len;i++){ let s=Math.floor(Math.random()*4); if(i>0&&s===seq[i-1]&&Math.random()<0.6) s=(s+1)%4; seq.push(s); }
  reverse = lvl>=3 && Math.random()<0.4;
  playName = PLAYS[Math.floor(Math.random()*PLAYS.length)];
  clutch = lvl>=1 && Math.random()<0.2;
  phase='show'; showIdx=0; showT=0; flashSign=-1;
  inputIdx=0; inputT=0; inputLimit=len*1100 - lvl*40*len;
}
function showDur(){ return 460-lvl*36; }   // per-sign flash
function showGap(){ return 200-lvl*14; }

// ---------- action ----------
function tap(i){
  if(state!=='play'||phase!=='input') return;
  flashSign=i; flashT=160; S.tap(i);
  const target = reverse ? seq[seq.length-1-inputIdx] : seq[inputIdx];
  if(i===target){
    inputIdx++; S.good();
    pops.push({txt:'✓', x:BTN[i].x+BTN[i].w/2, y:BTN[i].y-10, life:0.6, c:'#8fffb0'});
    if(inputIdx>=seq.length){ succeed(); }
  } else {
    miss('サインミス！');
  }
}
function succeed(){
  rounds++; combo++;
  const base=40+seq.length*14 + (reverse?40:0);
  const gained=Math.round((base+combo*10)*(clutch?2:1)); score+=gained;
  pops.push({txt:playName+' 成功！ +'+gained, big:true, x:W/2, y:200, life:1.2, c:'#ffe15a'});
  pops.push({txt:(reverse?'逆順クリア！ ':'')+seq.length+' サイン', big:false, x:W/2, y:240, life:1.1, c:'#8fffb0'});
  flash=Math.max(flash,0.4); S.success();
  for(let i=0;i<26;i++) parts.push({x:W/2,y:220,vx:(Math.random()-0.5)*8,vy:Math.random()*-6-1,life:1.3,c:['#ffe15a','#7dff9b','#7fd8ff'][i%3]});
  phase='result'; showT=0;
}
function miss(msg){
  mistakes++; combo=0; shakeT=0.34; flash=Math.max(flash,0.34); S.miss();
  pops.push({txt:msg, big:true, x:W/2, y:200, life:1.1, c:'#ff6a6a'});
  phase='result'; showT=0;
  if(mistakes>=3){ phase='overpend'; }
}
function gameOver(){ state='over'; S.over(); if(score>best){ best=score; try{localStorage.setItem('sg_best',best);}catch(e){} } }

// ---------- input ----------
function start(){ ac(); reset(); state='play'; }
addEventListener('keydown',e=>{ const k=e.key.toLowerCase();
  if(state!=='play'){ if(!e.repeat) start(); return; }
  if(e.repeat) return;
  let idx=-1;
  if(k==='1'||k==='a'||k==='arrowleft') idx=0;
  else if(k==='2'||k==='s'||k==='arrowup') idx=1;
  else if(k==='3'||k==='d'||k==='arrowdown') idx=2;
  else if(k==='4'||k==='f'||k==='arrowright') idx=3;
  if(idx>=0){ tap(idx); e.preventDefault(); } });
cv.addEventListener('pointerdown',e=>{ ac(); if(state!=='play'){ start(); return; }
  const r=cv.getBoundingClientRect(); const x=(e.clientX-r.left)/r.width*W, y=(e.clientY-r.top)/r.height*H;
  for(const b of BTN){ if(x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h){ tap(b.i); break; } } e.preventDefault(); });

// ---------- update ----------
function update(dt){
  if(flash>0) flash=Math.max(0,flash-dt*0.003);
  if(shakeT>0) shakeT-=dt*0.001;
  if(flashT>0){ flashT-=dt; if(flashT<=0) flashSign=-1; }
  parts.forEach(q=>{q.x+=q.vx;q.y+=q.vy;q.vy+=0.12;q.life-=dt*0.0022;});
  parts=parts.filter(q=>q.life>0);
  pops.forEach(q=>{q.y-=dt*0.02;q.life-=dt*0.0015;});
  pops=pops.filter(q=>q.life>0);
  if(state!=='play') return;

  if(phase==='show'){
    showT+=dt;
    const cyc=showDur()+showGap();
    const idx=Math.floor(showT/cyc);
    const inFlash=(showT%cyc)<showDur();
    if(idx<seq.length){ flashSign = inFlash ? seq[idx] : -1;
      if(inFlash && idx!==showIdx){ showIdx=idx; S.show(seq[idx]); } }
    else { phase='input'; flashSign=-1; inputIdx=0; inputT=0; S.ready(); }
  } else if(phase==='input'){
    inputT+=dt;
    if(inputT>=inputLimit){ miss('時間切れ…'); }
  } else if(phase==='result'){
    showT+=dt; if(showT>=1150){ nextRound(); }
  } else if(phase==='overpend'){
    showT+=dt; if(showT>=1150){ gameOver(); }
  }
}

// ---------- render ----------
function roundRect(x,y,w,h,r){ g.beginPath(); g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r); g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath(); }

function drawCoach(){
  const cx=W/2, cy=250;
  // body
  g.strokeStyle='#20303a'; g.lineWidth=8; g.lineCap='round';
  const armLit=flashSign===2;
  g.beginPath(); g.moveTo(cx,cy-30); g.lineTo(cx-40,cy+(armLit?-30:10)); g.moveTo(cx,cy-30); g.lineTo(cx+40,cy+(armLit?-30:10)); g.stroke(); // arms
  g.beginPath(); g.moveTo(cx-14,cy+60); g.lineTo(cx-14,cy+110); g.moveTo(cx+14,cy+60); g.lineTo(cx+14,cy+110); g.stroke(); // legs
  // torso
  g.fillStyle=flashSign===1?'#7fd8ff':'#3a5f8a'; roundRect(cx-26,cy-30,52,90,10); g.fill();
  // belt
  g.fillStyle=flashSign===3?'#8fffb0':'#22344a'; g.fillRect(cx-26,cy+50,52,14);
  // head
  g.fillStyle='#f2c9a0'; g.beginPath(); g.arc(cx,cy-52,20,0,6.28); g.fill();
  // cap
  g.fillStyle=flashSign===0?'#ff6a6a':'#2a3a4a'; g.beginPath(); g.arc(cx,cy-58,21,Math.PI,0); g.fill(); g.fillRect(cx-21,cy-59,30,6);
  // highlight glow on active part
  if(flashSign>=0){ const parts2={0:[cx,cy-58],1:[cx,cy+10],2:[cx,cy+0],3:[cx,cy+57]}; const pp=parts2[flashSign];
    g.strokeStyle=SIGNS[flashSign].col; g.lineWidth=3; g.beginPath(); g.arc(pp[0],pp[1],34,0,6.28); g.stroke(); }
}
function drawButtons(){
  for(const b of BTN){ const s=SIGNS[b.i]; const lit=flashSign===b.i;   // mirror the coach's sign onto its button
    g.fillStyle=lit?s.col:'rgba(0,0,0,0.4)'; roundRect(b.x,b.y,b.w,b.h,14); g.fill();
    g.strokeStyle=s.col; g.lineWidth=3; roundRect(b.x,b.y,b.w,b.h,14); g.stroke();
    g.fillStyle=lit?'#0a1410':s.col; g.textAlign='center'; g.font='bold 30px sans-serif'; g.fillText(s.name,b.x+b.w/2,b.y+52);
    g.fillStyle=lit?'rgba(0,0,0,0.7)':'rgba(255,255,255,0.5)'; g.font='bold 15px sans-serif'; g.fillText((b.i+1)+'',b.x+b.w/2,b.y+78); }
}
function drawField(){
  const gr=g.createLinearGradient(0,0,0,H); gr.addColorStop(0,'#1c6b39'); gr.addColorStop(1,'#2c9350'); g.fillStyle=gr; g.fillRect(0,0,W,H);
  g.fillStyle='#14324a'; g.fillRect(0,0,W,34);
  for(const c of crowd){ g.fillStyle=c.c; g.globalAlpha=0.6; g.fillRect(c.x,c.y,3,3); } g.globalAlpha=1;
}
function drawScene(){
  drawCoach();
  drawButtons();
  g.textAlign='center';
  // status line
  if(phase==='show'){ g.fillStyle='#ffd76a'; g.font='bold 26px sans-serif'; g.fillText('サインを見て覚えろ…',W/2,120);
    g.fillStyle='#cfe'; g.font='16px sans-serif'; g.fillText('サイン数 '+seq.length+(reverse?'　★逆順ラウンド★':''),W/2,150); }
  else if(phase==='input'){ g.fillStyle=reverse?'#ff9a6a':'#8fffb0'; g.font='bold 26px sans-serif'; g.fillText(reverse?'逆順で入力！':'同じ順で入力！',W/2,120);
    // progress dots
    const n=seq.length, gx=W/2-(n*22)/2;
    for(let i=0;i<n;i++){ g.fillStyle=i<inputIdx?'#8fffb0':'rgba(255,255,255,0.3)'; g.beginPath(); g.arc(gx+i*22+8,150,7,0,6.28); g.fill(); }
    // timer bar
    const tl=Math.max(0,1-inputT/inputLimit); g.fillStyle='rgba(0,0,0,0.35)'; roundRect(W/2-140,166,280,10,5); g.fill();
    g.fillStyle=tl<0.3?'#ff5a5a':'#ffd23f'; roundRect(W/2-138,168,276*tl,6,3); g.fill(); }
  if(clutch&&(phase==='show'||phase==='input')){ g.fillStyle='#ffe15a'; g.font='bold 15px sans-serif'; g.fillText('★ 勝負どころ 2倍 ★',W/2,96); }
}

function render(){
  g.clearRect(0,0,W,H);
  g.save(); if(shakeT>0){ const s=shakeT*13; g.translate((Math.random()-0.5)*s,(Math.random()-0.5)*s); }
  drawField();
  if(state==='play') drawScene();
  for(const q of parts){ g.globalAlpha=Math.max(0,q.life); g.fillStyle=q.c; g.fillRect(q.x-2,q.y-2,4,4); }
  g.globalAlpha=1;
  g.restore();

  if(state==='play') drawHUD();
  for(const q of pops){ g.globalAlpha=Math.max(0,q.life); g.textAlign='center';
    const fs=q.big?32:20; g.font='bold '+fs+'px sans-serif'; g.fillStyle=q.c; g.strokeStyle='#000'; g.lineWidth=4;
    g.strokeText(q.txt,q.x,q.y); g.fillText(q.txt,q.x,q.y); }
  g.globalAlpha=1;
  if(flash>0){ g.fillStyle='rgba(255,255,255,'+(flash*0.5)+')'; g.fillRect(0,0,W,H); }
  if(state==='title') drawTitle();
  if(state==='over') drawOver();
}
function drawHUD(){
  g.textAlign='left'; g.font='bold 26px sans-serif'; g.fillStyle='#fff'; g.strokeStyle='rgba(0,0,0,0.5)'; g.lineWidth=4;
  g.strokeText('SCORE '+score,20,40); g.fillText('SCORE '+score,20,40);
  g.font='bold 15px sans-serif'; g.fillStyle='#cfe'; g.fillText('成功 '+rounds,22,62);
  if(combo>1){ g.textAlign='center'; g.font='bold 18px sans-serif'; g.fillStyle='#ffe15a'; g.fillText(combo+' 連続成功',W/2,40); }
  g.textAlign='right'; g.font='bold 16px sans-serif'; g.fillStyle='#fff'; g.strokeText('ミス',W-104,40); g.fillText('ミス',W-104,40);
  for(let i=0;i<3;i++){ g.fillStyle=i<mistakes?'#ff5a5a':'rgba(255,255,255,0.28)'; g.beginPath(); g.arc(W-78+i*24,34,8,0,6.28); g.fill(); }
}
function drawTitle(){
  g.fillStyle='rgba(4,12,8,0.72)'; g.fillRect(0,0,W,H); g.textAlign='center';
  g.fillStyle='#8fffb0'; g.font='bold 54px sans-serif'; g.fillText('サインプレー',W/2,H/2-104);
  g.fillStyle='#cfe'; g.font='20px sans-serif'; g.fillText('Signs — コーチのサインを記憶して再現しろ',W/2,H/2-66);
  g.font='17px sans-serif'; g.fillStyle='#bcd';
  g.fillText('コーチが 帽子→胸→腕→ベルト の順でサインを出す。順番を覚えろ。',W/2,H/2-28);
  g.fillText('同じ順で 帽子/胸/腕/ベルト を入力（キー 1〜4 ・ 下のボタンをタップ）。',W/2,H/2-4);
  g.fillText('サイン数は増え、上級は「逆順」ラウンドも。時間切れ・順番ミスは失敗。',W/2,H/2+20);
  g.fillText('連続成功でコンボ加点。3ミスで終了。',W/2,H/2+44);
  g.fillStyle='#ffe15a'; g.font='bold 24px sans-serif'; g.fillText('クリック / タップ / キー で スタート',W/2,H/2+96);
  if(best>0){ g.fillStyle='#9fd'; g.font='16px sans-serif'; g.fillText('BEST '+best,W/2,H/2+126); }
}
function drawOver(){
  g.fillStyle='rgba(4,12,8,0.8)'; g.fillRect(0,0,W,H); g.textAlign='center';
  g.fillStyle='#ff6a6a'; g.font='bold 50px sans-serif'; g.fillText('3ミス…サイン崩壊',W/2,H/2-60);
  g.fillStyle='#fff'; g.font='bold 34px sans-serif'; g.fillText('SCORE '+score,W/2,H/2);
  g.fillStyle='#cfe'; g.font='18px sans-serif'; g.fillText('成功したサイン '+rounds,W/2,H/2+32);
  const nb=score>0&&score>=best; g.fillStyle=nb?'#ffe15a':'#9fd'; g.font='18px sans-serif';
  g.fillText(nb?'🎉 ベスト更新！ BEST '+best:'BEST '+best,W/2,H/2+62);
  g.fillStyle='#8fffb0'; g.font='bold 22px sans-serif'; g.fillText('クリック / タップ で もう一度',W/2,H/2+112);
}

let last=0;
function frame(t){ let dt=t-last; last=t; if(dt>60)dt=60; if(dt<0)dt=0; update(dt); render(); requestAnimationFrame(frame); }
requestAnimationFrame(frame);

// ---------- test hook ----------
window.__sg={
  start, tap,
  get state(){return state;}, get score(){return score;}, get mistakes(){return mistakes;}, get rounds(){return rounds;},
  get info(){ if(state!=='play') return {state,phase:'-'}; return {
    state, phase, reverse, seq:seq.slice(), inputIdx, seqLen:seq.length, clutch }; }
};
})();
</script>
</body>
</html>
