<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>カーブ・フリーキック — Curve Free Kick</title>
<style>
  :root{--night:#071a2e;--pitch:#0e5f34;--pitch-l:#12793f;--chalk:#eaf3ec;--gold:#ffcf3a;
    --hot:#ff5a3c;--cyan:#3ae8cf;--ink:#06210f;}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:#04121f;font-family:"Arial Narrow","Roboto Condensed",system-ui,sans-serif;color:var(--chalk);
    display:flex;align-items:center;justify-content:center;overflow:hidden;-webkit-user-select:none;user-select:none;touch-action:manipulation;}
  #stage{position:relative;width:min(100vw,calc(100vh*1.5));aspect-ratio:3/2;max-height:100vh;
    box-shadow:0 30px 80px rgba(0,0,0,.6);overflow:hidden;background:#0e5f34;}
  canvas{display:block;width:100%;height:100%}
  #hud{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;padding:clamp(6px,1.4vw,14px);gap:8px;pointer-events:none;align-items:flex-start;}
  .board{background:rgba(4,10,18,.72);backdrop-filter:blur(6px);border:1px solid rgba(58,232,207,.35);
    border-radius:10px;padding:6px clamp(10px,1.6vw,18px);display:flex;flex-direction:column;line-height:1;}
  .board .label{font-size:clamp(9px,1.3vw,12px);letter-spacing:.2em;text-transform:uppercase;color:var(--cyan);opacity:.9}
  .board .value{font-family:"Courier New",monospace;font-weight:700;font-size:clamp(20px,4.2vw,36px);font-variant-numeric:tabular-nums;color:var(--chalk);}
  #goals .value{color:var(--gold)}
  #msg{position:absolute;top:52%;left:0;right:0;text-align:center;pointer-events:none;font-weight:900;letter-spacing:.03em;
    text-transform:uppercase;font-size:clamp(30px,8vw,72px);color:#fff;opacity:0;transition:opacity .14s;
    text-shadow:0 4px 0 rgba(0,0,0,.35),0 0 30px currentColor;}
  #hint{position:absolute;bottom:0;left:0;right:0;text-align:center;padding:8px 12px calc(9px + env(safe-area-inset-bottom));
    font-size:clamp(12px,2.2vw,17px);letter-spacing:.04em;color:var(--chalk);background:linear-gradient(transparent,rgba(4,10,18,.72));pointer-events:none;}
  #hint b{color:var(--cyan)}
  #overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(10px,2vw,20px);
    text-align:center;padding:20px;background:radial-gradient(120% 90% at 50% 25%,rgba(7,26,46,.5),rgba(4,18,31,.92));backdrop-filter:blur(3px);z-index:5;transition:opacity .4s;}
  #overlay.hidden{opacity:0;pointer-events:none}
  #overlay h1{font-size:clamp(30px,8.5vw,74px);font-weight:900;letter-spacing:.02em;line-height:.92;text-transform:uppercase;color:var(--chalk);
    text-shadow:0 6px 0 rgba(0,0,0,.35),0 0 40px rgba(58,232,207,.4);}
  #overlay h1 span{display:block;color:var(--gold);font-size:.5em;letter-spacing:.2em}
  #overlay p{max-width:35ch;font-size:clamp(14px,2.6vw,19px);line-height:1.45;opacity:.92}
  #playBtn{pointer-events:auto;cursor:pointer;border:none;border-radius:100px;padding:clamp(12px,2vw,18px) clamp(30px,6vw,56px);
    font-family:inherit;font-weight:900;font-size:clamp(18px,3.4vw,26px);letter-spacing:.12em;text-transform:uppercase;color:var(--ink);
    background:linear-gradient(180deg,var(--cyan),#12b79c);box-shadow:0 8px 0 #0a6a5a,0 14px 30px rgba(0,0,0,.5);transition:transform .08s,box-shadow .08s;}
  #playBtn:active{transform:translateY(5px);box-shadow:0 3px 0 #0a6a5a}
  #playBtn:focus-visible{outline:3px solid var(--hot);outline-offset:4px}
  .sub{font-size:clamp(11px,2vw,14px);letter-spacing:.2em;text-transform:uppercase;color:var(--cyan);opacity:.85}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div id="stage">
  <canvas id="c"></canvas>
  <div id="hud">
    <div class="board" id="goals"><span class="label">Goals</span><span class="value" id="goals-v">0</span></div>
    <div class="board" style="text-align:center"><span class="label">Kick</span><span class="value" id="kick">1<small style="font-size:.5em;opacity:.6">/6</small></span></div>
    <div class="board" style="text-align:right"><span class="label">Streak</span><span class="value" id="streak">0</span></div>
  </div>
  <div id="msg"></div>
  <div id="hint">タップで 狙い(横→縦) → カーブ量 を決めて蹴る</div>
  <div id="overlay">
    <div class="sub">Soccer · Free Kick</div>
    <h1>カーブ<span>Free Kick</span></h1>
    <p>横→縦で<b style="color:var(--cyan)">狙い</b>を、最後に<b style="color:var(--gold)">カーブ量</b>を決めて壁を巻く。軌道プレビューを見ながらキーパーの逆を突け。全6本！</p>
    <button id="playBtn">Kick Off</button>
    <div class="sub" style="opacity:.55">Tap / Space ×3</div>
  </div>
</div>

<script>
(()=>{
"use strict";
const cvs=document.getElementById('c'),ctx=cvs.getContext('2d');
const W=900,H=600;let dpr=Math.min(window.devicePixelRatio||1,2);
function resize(){const r=cvs.getBoundingClientRect();cvs.width=Math.round(r.width*dpr);cvs.height=Math.round(r.height*dpr);
  ctx.setTransform(cvs.width/W,0,0,cvs.height/H,0,0);}
new ResizeObserver(resize).observe(cvs);resize();

let AC=null;function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function tone(f,d,t='sine',v=.22,to=null){const a=ac();if(!a)return;const o=a.createOscillator(),g=a.createGain();
  o.type=t;o.frequency.setValueAtTime(f,a.currentTime);if(to)o.frequency.exponentialRampToValueAtTime(to,a.currentTime+d);
  g.gain.setValueAtTime(v,a.currentTime);g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+d);
  o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+d);}
function noise(d,v){const a=ac();if(!a)return;const n=a.createBuffer(1,a.sampleRate*d,a.sampleRate);const dd=n.getChannelData(0);
  for(let i=0;i<dd.length;i++)dd[i]=(Math.random()*2-1)*(1-i/dd.length);const s=a.createBufferSource();s.buffer=n;const g=a.createGain();
  g.gain.value=v;s.connect(g);g.connect(a.destination);s.start();}
const sTick=()=>tone(660,.03,'square',.12);
const sKick=()=>tone(230,.1,'square',.26,90);
const sGoal=()=>{tone(523,.1,'square',.24);setTimeout(()=>tone(659,.1,'square',.24),90);setTimeout(()=>tone(880,.22,'square',.26),180);};
const sSave=()=>tone(200,.18,'sawtooth',.24,80);
const sWall=()=>{noise(.1,.3);tone(150,.2,'square',.2,70);};

const goal={x:250,y:85,w:400,h:170};
const wall={x:372,y:298,w:156,h:64}; // blocking box
const ballHome={x:450,y:508};
const S={IDLE:'idle',AIMX:'aimx',AIMY:'aimy',CURVE:'curve',FLY:'fly',RESULT:'result',OVER:'over'};
let state=S.IDLE;
let goals=0, kick=1, streak=0; const TOTAL=6;
let aimX=goal.x, aimDX=1, aimY=goal.y, aimDY=1, tx=0, ty=0;
let curve=0, curveDir=1, lockCurve=0;
let keeperZone=1, keeper={x:450,y:230,dive:0};
let ball=null, path=null, particles=[], shake=0, flash=0, flashCol='#ffcf3a', tPrev=0;

function reset(){goals=0;kick=1;streak=0;particles=[];ball=null;updateHUD();}
function start(){reset();document.getElementById('overlay').classList.add('hidden');beginKick();}
function beginKick(){
  if(kick>TOTAL)return endGame();
  aimX=goal.x+20;aimDX=1;aimY=goal.y+goal.h*0.5;aimDY=1;curve=0;curveDir=1;
  keeperZone=Math.random()<0.5?1:(Math.random()<0.5?0:2); // center-weighted
  keeper.x=zoneX(keeperZone);keeper.dive=0;ball=null;path=null;
  state=S.AIMX;setHint('<b>横</b>の狙いをタップ');
}
function zoneX(z){return goal.x+goal.w*(z===0?0.2:z===1?0.5:0.8);}
function zoneOf(x){const t=(x-goal.x)/goal.w;return t<0.36?0:t>0.64?2:1;}
function act(){const a=ac();if(a&&a.state==='suspended')a.resume();
  if(state===S.IDLE||state===S.OVER){start();return;}
  if(state===S.AIMX){tx=aimX;state=S.AIMY;sTick();setHint('<b>縦</b>の高さをタップ');}
  else if(state===S.AIMY){ty=aimY;state=S.CURVE;sTick();setHint('<b>カーブ量</b>をタップ（壁を巻け！）');}
  else if(state===S.CURVE){lockCurve=curve;shoot();}
}
window.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();act();}});
cvs.addEventListener('pointerdown',e=>{e.preventDefault();act();});
document.getElementById('playBtn').addEventListener('click',e=>{e.stopPropagation();ac()&&ac().resume&&ac().resume();start();});

function buildPath(cv){
  // quadratic bezier ball->target, control offset perpendicular by curve
  const b=ballHome, t={x:tx,y:ty};
  const mx=(b.x+t.x)/2, my=(b.y+t.y)/2;
  const dx=t.x-b.x, dy=t.y-b.y, len=Math.hypot(dx,dy)||1;
  const px=-dy/len, py=dx/len; // perpendicular
  const off=cv*150;
  return {b,t,c:{x:mx+px*off,y:my+py*off}};
}
function bez(p,u){const iu=1-u;return {x:iu*iu*p.b.x+2*iu*u*p.c.x+u*u*p.t.x, y:iu*iu*p.b.y+2*iu*u*p.c.y+u*u*p.t.y};}
function shoot(){
  state=S.FLY;sKick();path=buildPath(lockCurve);
  // detect wall collision along path
  let blockU=null;
  for(let u=0;u<=1;u+=0.02){const pt=bez(path,u);
    if(pt.x>wall.x&&pt.x<wall.x+wall.w&&pt.y>wall.y&&pt.y<wall.y+wall.h){blockU=u;break;}}
  ball={u:0,dur:0.72,blockU,done:false};
}
function resolveOutcome(){
  if(ball.blockU!=null){ // hit wall
    streak=0;sWall();shake=10;showMsg('BLOCKED!','#ff5a3c');
    burst(bez(path,ball.blockU).x,bez(path,ball.blockU).y,['#fff','#cfe6d6'],16);
    finishKick();return;
  }
  const z=zoneOf(tx);
  const topCorner=ty< goal.y+goal.h*0.32;
  const saved=(z===keeperZone)&&!topCorner;
  if(saved){streak=0;sSave();shake=8;keeper.dive=1;
    showMsg('SAVED!','#3ae8cf');burst(keeper.x,keeper.y-20,['#3ae8cf','#fff'],16);}
  else{goals++;streak++;flash=.7;flashCol='#ffcf3a';shake=12;sGoal();
    showMsg(streak>1?('GOAL ×'+streak+'!'):'GOAL!','#ffcf3a');burst(tx,ty,['#ffcf3a','#fff','#3ae8cf'],34);}
  updateHUD();finishKick();
}
function finishKick(){state=S.RESULT;setTimeout(()=>{keeper.dive=0;kick++;updateHUD();beginKick();},1250);}
function endGame(){state=S.OVER;const ov=document.getElementById('overlay');
  const rating=goals>=6?'MAESTRO!':goals>=5?'FREE-KICK KING':goals>=3?'SHARP':goals>=1?'NOT BAD':'BACK TO TRAINING';
  ov.querySelector('.sub').textContent='Full time';
  ov.querySelector('h1').innerHTML=goals+' / '+TOTAL+'<span>'+rating+'</span>';
  ov.querySelector('p').innerHTML='<b style="color:var(--gold)">'+rating+'</b> — 壁を巻いてキーパーの逆を突く感覚を掴もう！';
  ov.querySelector('#playBtn').textContent='Play Again';ov.classList.remove('hidden');}

function burst(x,y,cols,n){for(let i=0;i<n;i++){const a=Math.random()*7,s=1+Math.random()*6;
  particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-2,life:1,col:cols[i%cols.length],r:2+Math.random()*4});}}
function updateHUD(){document.getElementById('goals-v').textContent=goals;
  document.getElementById('kick').innerHTML=Math.min(kick,TOTAL)+'<small style="font-size:.5em;opacity:.6">/'+TOTAL+'</small>';
  document.getElementById('streak').textContent=streak;}
let msgT=null;function showMsg(t,c){const m=document.getElementById('msg');m.textContent=t;m.style.color=c;m.style.opacity='1';
  clearTimeout(msgT);msgT=setTimeout(()=>m.style.opacity='0',1000);}
function setHint(h){document.getElementById('hint').innerHTML=h;}

function update(dt){
  if(state===S.AIMX){aimX+=aimDX*420*dt;if(aimX>goal.x+goal.w-14){aimX=goal.x+goal.w-14;aimDX=-1;}if(aimX<goal.x+14){aimX=goal.x+14;aimDX=1;}}
  else if(state===S.AIMY){aimY+=aimDY*300*dt;if(aimY>goal.y+goal.h-14){aimY=goal.y+goal.h-14;aimDY=-1;}if(aimY<goal.y+14){aimY=goal.y+14;aimDY=1;}}
  else if(state===S.CURVE){curve+=curveDir*1.7*dt;if(curve>1){curve=1;curveDir=-1;}if(curve<-1){curve=-1;curveDir=1;}}
  else if(state===S.FLY&&ball){ball.u+=dt/ball.dur;
    if(ball.blockU!=null&&ball.u>=ball.blockU){ball.u=ball.blockU;resolveOutcome();}
    else if(ball.u>=1){ball.u=1;resolveOutcome();}}
  // keeper drift toward covered zone
  const kzx=zoneX(keeperZone);keeper.x+=(kzx-keeper.x)*Math.min(1,dt*8);
  for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.x+=p.vx;p.y+=p.vy;p.vy+=.3;p.vx*=.99;p.life-=dt*1.1;if(p.life<=0)particles.splice(i,1);}
  if(shake>0)shake=Math.max(0,shake-dt*30);if(flash>0)flash=Math.max(0,flash-dt*1.6);
}
function roundRect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function drawScene(){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#071a2e');g.addColorStop(.4,'#0a3a24');g.addColorStop(1,'#0e5f34');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#0c2436';ctx.fillRect(0,40,W,46);ctx.save();ctx.globalAlpha=.4;
  for(let i=0;i<220;i++){const x=i*27%W,y=44+(i*11%38);ctx.fillStyle=['#13314a','#1c4a30','#2a2f5a'][i%3];ctx.fillRect(x,y,4,3);}ctx.restore();
  for(let i=0;i<8;i++){const y0=300+i*38;ctx.fillStyle=i%2?'rgba(255,255,255,.04)':'rgba(0,0,0,.05)';ctx.fillRect(0,y0,W,38);}
  // penalty spot
  ctx.fillStyle='rgba(234,243,236,.7)';ctx.beginPath();ctx.arc(ballHome.x,ballHome.y+18,4,0,7);ctx.fill();
}
function drawGoal(){
  ctx.save();ctx.strokeStyle='rgba(234,243,236,.16)';ctx.lineWidth=1;
  for(let i=0;i<=goal.w;i+=15){ctx.beginPath();ctx.moveTo(goal.x+i,goal.y);ctx.lineTo(goal.x+i,goal.y+goal.h);ctx.stroke();}
  for(let j=0;j<=goal.h;j+=15){ctx.beginPath();ctx.moveTo(goal.x,goal.y+j);ctx.lineTo(goal.x+goal.w,goal.y+j);ctx.stroke();}
  ctx.restore();
  ctx.fillStyle='#f4f7f4';ctx.shadowColor='rgba(0,0,0,.4)';ctx.shadowBlur=8;
  ctx.fillRect(goal.x-11,goal.y-11,13,goal.h+11);ctx.fillRect(goal.x+goal.w-2,goal.y-11,13,goal.h+11);
  ctx.fillRect(goal.x-11,goal.y-11,goal.w+24,13);ctx.shadowBlur=0;
}
function drawKeeper(){
  const x=keeper.x,y=keeper.y,d=keeper.dive;
  ctx.save();ctx.translate(x,y);
  ctx.fillStyle='rgba(0,0,0,.25)';ctx.beginPath();ctx.ellipse(0,26,20,6,0,0,7);ctx.fill();
  ctx.fillStyle='#ffd21f';roundRect(-13,-24,26,38,8);ctx.fill();
  ctx.fillStyle='#f2c79a';ctx.beginPath();ctx.arc(0,-32,10,0,7);ctx.fill();
  ctx.strokeStyle='#ffd21f';ctx.lineWidth=8;ctx.lineCap='round';
  const reach=16+d*22;ctx.beginPath();ctx.moveTo(0,-14);ctx.lineTo(-reach,-24-d*14);ctx.moveTo(0,-14);ctx.lineTo(reach,-24-d*14);ctx.stroke();
  ctx.fillStyle='#3ae8cf';ctx.beginPath();ctx.arc(-reach,-24-d*14,6,0,7);ctx.fill();ctx.beginPath();ctx.arc(reach,-24-d*14,6,0,7);ctx.fill();
  ctx.restore();
}
function drawWall(){
  const n=4, gap=wall.w/n;
  for(let i=0;i<n;i++){const cx=wall.x+gap*i+gap/2, base=wall.y+wall.h;
    ctx.save();ctx.translate(cx,base);
    ctx.fillStyle='rgba(0,0,0,.25)';ctx.beginPath();ctx.ellipse(0,4,16,5,0,0,7);ctx.fill();
    ctx.fillStyle='#1f5fd0';roundRect(-13,-58,26,50,7);ctx.fill();
    ctx.fillStyle='#e8b88a';ctx.beginPath();ctx.arc(0,-66,9,0,7);ctx.fill();
    ctx.fillStyle='#0c2138';ctx.fillRect(-13,-10,26,10);
    // arms crossed in front
    ctx.strokeStyle='#1f5fd0';ctx.lineWidth=6;ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(-10,-40);ctx.lineTo(10,-30);ctx.moveTo(10,-40);ctx.lineTo(-10,-30);ctx.stroke();
    ctx.restore();}
}
function drawAimAndPreview(){
  // locked target marker
  if(state===S.AIMY||state===S.CURVE||state===S.FLY){
    ctx.save();ctx.strokeStyle='rgba(255,90,60,.5)';ctx.lineWidth=2;ctx.setLineDash([5,5]);
    ctx.beginPath();ctx.moveTo(tx,goal.y);ctx.lineTo(tx,goal.y+goal.h);ctx.stroke();ctx.setLineDash([]);ctx.restore();
  }
  if(state===S.AIMX){ctx.save();ctx.strokeStyle='#3ae8cf';ctx.lineWidth=3;
    ctx.beginPath();ctx.moveTo(aimX,goal.y);ctx.lineTo(aimX,goal.y+goal.h);ctx.stroke();ctx.restore();}
  else if(state===S.AIMY){ctx.save();ctx.strokeStyle='#3ae8cf';ctx.lineWidth=3;
    ctx.beginPath();ctx.moveTo(goal.x,aimY);ctx.lineTo(goal.x+goal.w,aimY);ctx.stroke();
    ctx.fillStyle='rgba(58,232,207,.9)';ctx.beginPath();ctx.arc(tx,aimY,7,0,7);ctx.fill();ctx.restore();}
  else if(state===S.CURVE){
    // reticle at target
    ctx.save();ctx.fillStyle='#ff5a3c';ctx.beginPath();ctx.arc(tx,ty,8,0,7);ctx.fill();
    ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke();ctx.restore();
    // live curved path preview
    const pv=buildPath(curve);
    ctx.save();ctx.strokeStyle='rgba(255,207,58,.85)';ctx.lineWidth=3;ctx.setLineDash([8,7]);
    ctx.beginPath();for(let u=0;u<=1.001;u+=0.04){const pt=bez(pv,u);u===0?ctx.moveTo(pt.x,pt.y):ctx.lineTo(pt.x,pt.y);}ctx.stroke();ctx.setLineDash([]);ctx.restore();
    // curve meter
    ctx.save();const mw=260,mx=W/2-mw/2,my=560;
    ctx.fillStyle='rgba(4,10,18,.6)';roundRect(mx,my-9,mw,18,9);ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,.3)';ctx.lineWidth=2;roundRect(mx,my-9,mw,18,9);ctx.stroke();
    ctx.fillStyle='#ffcf3a';const cxp=mx+mw/2+curve*(mw/2-10);
    ctx.beginPath();ctx.arc(cxp,my,9,0,7);ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.5)';ctx.fillRect(mx+mw/2-1,my-9,2,18);
    ctx.restore();
  }
}
function drawBall(){
  let bx=ballHome.x,by=ballHome.y;
  if((state===S.FLY||state===S.RESULT)&&ball&&path){const pt=bez(path,ball.u);bx=pt.x;by=pt.y;}
  const r=13-6*(ball?ball.u:0);
  ctx.save();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(bx,by,Math.max(6,r),0,7);ctx.fill();
  ctx.fillStyle='#111';const rot=(ball?ball.u*20:0);for(let i=0;i<5;i++){const a=rot+i*1.256;ctx.beginPath();ctx.arc(bx+Math.cos(a)*r*.5,by+Math.sin(a)*r*.5,Math.max(1.5,r*.2),0,7);ctx.fill();}
  ctx.strokeStyle='rgba(0,0,0,.25)';ctx.lineWidth=1;ctx.beginPath();ctx.arc(bx,by,Math.max(6,r),0,7);ctx.stroke();ctx.restore();
}
function render(){
  ctx.clearRect(0,0,W,H);ctx.save();
  if(shake>0)ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
  drawScene();drawGoal();drawKeeper();drawAimAndPreview();drawWall();drawBall();
  for(const p of particles){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.col;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill();}
  ctx.globalAlpha=1;ctx.restore();
  if(flash>0){ctx.fillStyle='rgba('+(flashCol==='#3ae8cf'?'58,232,207':'255,207,58')+','+(flash*0.26)+')';ctx.fillRect(0,0,W,H);}
}
function loop(t){if(!tPrev)tPrev=t;let dt=(t-tPrev)/1000;tPrev=t;if(dt>.05)dt=.05;update(dt);render();requestAnimationFrame(loop);}
reset();requestAnimationFrame(loop);state=S.IDLE;
// test-only hook (inert unless URL hash contains "test")
if(location.hash.indexOf('test')>=0){window.__fk={
  get state(){return state;}, get goal(){return goal;}, get wall(){return wall;}, get keeperZone(){return keeperZone;},
  kickTo(txx,tyy,cv){tx=txx;ty=tyy;lockCurve=cv;shoot();},
  simulate(txx,tyy,cv,kz){const p=buildPath.call(null,cv);
    // buildPath uses tx,ty globals; set them temporarily
    tx=txx;ty=tyy;const pp=buildPath(cv);let blocked=false;
    for(let u=0;u<=1;u+=0.02){const pt=bez(pp,u);if(pt.x>wall.x&&pt.x<wall.x+wall.w&&pt.y>wall.y&&pt.y<wall.y+wall.h){blocked=true;break;}}
    const z=zoneOf(txx);const topCorner=tyy<goal.y+goal.h*0.32;const saved=(z===(kz==null?keeperZone:kz))&&!topCorner;
    return {blocked,zone:z,saved,goal:!blocked&&!saved};}};}
})();
