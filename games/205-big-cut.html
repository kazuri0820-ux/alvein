<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>フルスイング (Big Cut)</title>
<style>
  html,body{margin:0;height:100%;background:#0a1018;overflow:hidden;
    font-family:-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  #stage{position:relative;width:100vw;height:100vh;max-width:calc(100vh*1.5);max-height:calc(100vw/1.5);aspect-ratio:900/600;}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;border-radius:6px;}
</style>
</head>
<body>
<div id="wrap"><div id="stage"><canvas id="cv"></canvas></div></div>
<script>
(function(){
const W=900,H=600,cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let DPR=1;
function fit(){DPR=Math.min(2,window.devicePixelRatio||1);cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
fit();addEventListener('resize',fit);

// ---------- audio ----------
let AC=null;function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function tone(f,d,type,v,sweep){const a=ac();if(!a)return;const t=a.currentTime,o=a.createOscillator(),g=a.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(sweep)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+sweep),t+d);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v||0.2,t+0.008);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+0.02);}
function noise(d,v,hp){const a=ac();if(!a)return;const t=a.currentTime,n=Math.floor(a.sampleRate*d),buf=a.createBuffer(1,n,a.sampleRate),ch=buf.getChannelData(0);
  for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource();s.buffer=buf;
  const f=a.createBiquadFilter();f.type='highpass';f.frequency.value=hp||600;const g=a.createGain();g.gain.value=v||0.2;
  s.connect(f);f.connect(g);g.connect(a.destination);s.start(t);s.stop(t+d+0.02);}
const S={
  start:()=>{tone(300,0.05,'square',0.08);},
  lock:()=>{tone(560,0.05,'square',0.1);},
  crack:()=>{noise(0.05,0.3,1200);tone(240,0.13,'square',0.2,320);setTimeout(()=>tone(520,0.1,'triangle',0.14),40);},
  hr:()=>{[523,659,784,1046,1318].forEach((f,i)=>setTimeout(()=>tone(f,0.16,'triangle',0.22),i*90));},
  hit:()=>{tone(500,0.1,'triangle',0.16);setTimeout(()=>tone(720,0.1,'triangle',0.13),70);},
  out:()=>{noise(0.1,0.16,500);tone(240,0.24,'sawtooth',0.16,-120);},
  over:()=>{[440,330,247,175].forEach((f,i)=>setTimeout(()=>tone(f,0.3,'triangle',0.2),i*160));}
};

// ---------- meter thresholds ----------
function params(){ return {
  sgl:34, dbl:58, hr:80, overMax:97-lvl*0.5,
  green:9-lvl*0.7, accSpeed:0.13+lvl*0.016, powRate:0.10+lvl*0.006, clock:2200-lvl*120 }; }

// ---------- state ----------
let state='title', phase='ready', t=0, plays=0;
let score=0, combo=0, best=+(localStorage.getItem('bigcut_best')||0);
let hits=0, hrs=0, outs=0, lvl=1;
let power=0, accMarker=50, accDir=1, lockedPow=0, lockedAcc=50;
let readyT=0, ball=null, outcome=null, result=null, resultT=0, msg='', msg2='';
let shake=0, flash=0, flashCol='#fff', last=performance.now();
let parts=[], pops=[];

function rnd(a,b){return a+Math.random()*(b-a);}
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function lerp(a,b,u){return a+(b-a)*u;}

function reset(){state='title';score=0;combo=0;hits=0;hrs=0;outs=0;lvl=1;plays=0;ball=null;result=null;parts=[];pops=[];}
function newAB(){
  plays++; lvl=Math.min(7,1+Math.floor((hits+hrs)/4));
  power=0; accMarker=50; accDir=1; lockedPow=0; lockedAcc=50; readyT=0; ball=null; outcome=null;
  phase='ready'; result=null; msg=''; msg2='';
}
function start(){ if(!ac())ac(); if(AC&&AC.state==='suspended')AC.resume(); reset(); state='play'; newAB(); }

function tap(){
  if(state==='title'){start();return;}
  if(state==='over'){ if(resultT>0.4){reset();start();} return; }
  if(state!=='play')return;
  if(phase==='ready'){ phase='power'; power=0; S.start(); }
  else if(phase==='power'){ lockedPow=power; phase='accuracy'; accMarker=6; accDir=1; S.lock(); }
  else if(phase==='accuracy'){ lockedAcc=accMarker; S.lock(); contact(); }
}

function contact(){
  const p=params();
  const accOff=Math.abs(lockedAcc-50);
  let out;
  if(lockedPow>p.overMax) out='over';        // over-swung -> pop/mishit
  else if(accOff>p.green) out='mishit';       // not squared -> weak out
  else if(lockedPow>=p.hr) out='homerun';
  else if(lockedPow>=p.dbl) out='double';
  else if(lockedPow>=p.sgl) out='single';
  else out='weak';                            // too little power
  outcome=out;
  // launch ball
  const dist = out==='homerun'?1.0 : out==='double'?0.72 : out==='single'?0.5 : out==='over'?0.34 : out==='mishit'?0.3 : 0.24;
  const dir = (lockedAcc-50)/50; // -1..1 pull/oppo (visual)
  ball={t:0,dur:out==='homerun'?900:700, dist, dir, out};
  phase='fly'; S.crack();
}

function resolve(){
  phase='resolve'; resultT=0; result=outcome;
  const good = outcome==='homerun'||outcome==='double'||outcome==='single';
  if(good){
    if(outcome==='homerun'){ hrs++; }else{ hits++; }
    combo++;
    const base = outcome==='homerun'?500 : outcome==='double'?220 : 100;
    const add=Math.round(base*(1+Math.min(9,combo-1)*0.16)); score+=add;
    if(outcome==='homerun'){S.hr();flash=1;flashCol='#ffe08a';shake=14;burst(450,150,'#ffe08a',34,9);pop(450,150,'ホームラン！ +'+add,'#fff3c4');}
    else {S.hit();flash=0.6;flashCol='#8fe0a0';shake=7;burst(450,240,'#cfe8ff',18,6);pop(450,220,(outcome==='double'?'ツーベース！ +':'ヒット！ +')+add,'#dfffe6');}
    if(combo>=2)pop(450,outcome==='homerun'?184:250,'コンボ x'+combo,'#ffd24d');
    msg = outcome==='homerun'?'完璧な一撃！ 柵越えホームラン':(outcome==='double'?'鋭い当たりでツーベース！':'クリーンヒット！'); msg2='';
  } else {
    outs++; combo=0; S.out(); flash=0.8;flashCol='#ff5b5b';shake=8;
    if(outcome==='over')msg='振り過ぎ！ 力んで凡フライ';
    else if(outcome==='mishit')msg='芯を外した！ 力ない打球でアウト';
    else if(outcome==='weak')msg='スイングが緩い！ 差し込まれてアウト';
    else msg='見逃し…三振でアウト';
    msg2 = outs>=3?'':'あと'+(3-outs)+'アウトで交代';
    pop(450,260,'アウト','#ffb0b0');
  }
  if(outs>=3){ state='over'; resultT=0; S.over(); if(score>best){best=score;localStorage.setItem('bigcut_best',best);} }
}

// ---------- input ----------
cv.addEventListener('pointerdown',e=>{e.preventDefault();tap();});
addEventListener('keydown',e=>{ if(e.code==='Space'||e.code==='Enter'||e.code==='ArrowUp'){e.preventDefault();tap();} });

// ---------- particles ----------
function burst(x,y,c,n,sp){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=rnd(sp*0.3,sp);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:1,c});}}
function pop(x,y,txt,c){pops.push({x,y,txt,c,life:1});}

// ---------- update ----------
function update(dt){
  shake*=Math.pow(0.86,dt/16.7); if(shake<0.3)shake=0;
  flash*=Math.pow(0.9,dt/16.7);
  for(const p of parts){p.vx*=0.96;p.vy=p.vy*0.96+0.3;p.x+=p.vx*dt/16.7;p.y+=p.vy*dt/16.7;p.life-=dt/16.7*0.026;}
  parts=parts.filter(p=>p.life>0);
  for(const p of pops){p.y-=dt/16.7*0.5;p.life-=dt/16.7*0.02;}
  pops=pops.filter(p=>p.life>0);

  if(state!=='play'){ if(state==='over')resultT+=dt/1000; return; }
  t+=dt; const p=params();
  if(phase==='ready'){ readyT+=dt; if(readyT>p.clock){ outcome='take'; resolve(); } return; }
  if(phase==='power'){ power+=p.powRate*dt; if(power>=100){ lockedPow=100; phase='accuracy'; accMarker=6; accDir=1; } return; }
  if(phase==='accuracy'){ accMarker+=accDir*p.accSpeed*dt; if(accMarker>=100){accMarker=100;accDir=-1;} if(accMarker<=0){accMarker=0;accDir=1;}
    return; }
  if(phase==='fly'){ ball.t+=dt; if(ball.t>=ball.dur) resolve(); return; }
  if(phase==='resolve'){ resultT+=dt/1000; if(resultT>1.15 && state==='play') newAB(); return; }
}

// ---------- render ----------
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

function drawField(){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#16233a');g.addColorStop(0.5,'#1a3324');g.addColorStop(1,'#20442d');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  // outfield fence arc
  ctx.strokeStyle='rgba(255,255,255,0.4)';ctx.lineWidth=4;ctx.beginPath();ctx.arc(450,560,330,Math.PI*1.15,Math.PI*1.85);ctx.stroke();
  ctx.strokeStyle='rgba(255,255,80,0.5)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(450,560,326,Math.PI*1.15,Math.PI*1.85);ctx.stroke();
  // infield dirt
  ctx.fillStyle='rgba(150,95,55,0.4)';ctx.beginPath();ctx.ellipse(450,520,150,80,0,0,6.28);ctx.fill();
  // home plate + batter
  ctx.fillStyle='#eee';ctx.beginPath();ctx.moveTo(450,532);ctx.lineTo(438,524);ctx.lineTo(438,514);ctx.lineTo(462,514);ctx.lineTo(462,524);ctx.closePath();ctx.fill();
}
function drawBatter(){
  const bx=486,by=502;
  ctx.save();ctx.translate(bx,by);
  let sw=0.7;
  if(phase==='power')sw=0.7+ (power/100)*0.4;
  else if(phase==='accuracy'||phase==='fly'||phase==='resolve')sw=-1.1;
  ctx.fillStyle='#2b6cff';rr(-9,-8,18,26,6);ctx.fill();ctx.fillStyle='#f2c9a0';ctx.beginPath();ctx.arc(0,-18,8,0,6.28);ctx.fill();
  ctx.strokeStyle='#c8a15a';ctx.lineWidth=6;ctx.lineCap='round';ctx.save();ctx.rotate(sw);ctx.beginPath();ctx.moveTo(0,-6);ctx.lineTo(0,-46);ctx.stroke();ctx.restore();
  ctx.restore();
}
function drawBall(){
  if(!ball)return; const f=clamp(ball.t/ball.dur,0,1);
  const startx=470,starty=500;
  const ang = Math.PI*1.5 + ball.dir*0.5; // up, biased by dir
  const reach = ball.dist*360;
  const tx=450+Math.cos(ang)*reach*0.9, ty=560+Math.sin(ang)*reach - (ball.out==='homerun'?40:0);
  const x=lerp(startx,tx,f), y=lerp(starty,ty,f)-Math.sin(f*Math.PI)*(ball.out==='homerun'?150:(ball.out==='double'?110:70));
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(x,y,7,0,6.28);ctx.fill();
  ctx.strokeStyle='#c33';ctx.lineWidth=1.2;ctx.beginPath();ctx.arc(x,y,7,0.4,2.3);ctx.stroke();
}

function drawMeter(){
  if(state!=='play')return;
  const p=params();
  // POWER bar (left vertical)
  const bx=70,by=140,bw=34,bh=340;
  ctx.fillStyle='rgba(0,0,0,0.4)';rr(bx,by,bw,bh,8);ctx.fill();
  // tiers
  const yOf=v=>by+bh*(1-v/100);
  ctx.fillStyle='rgba(120,200,255,0.25)';ctx.fillRect(bx,yOf(p.dbl),bw,yOf(p.sgl)-yOf(p.dbl));
  ctx.fillStyle='rgba(150,230,170,0.28)';ctx.fillRect(bx,yOf(p.hr),bw,yOf(p.dbl)-yOf(p.hr));
  ctx.fillStyle='rgba(255,220,120,0.4)';ctx.fillRect(bx,yOf(p.overMax),bw,yOf(p.hr)-yOf(p.overMax));
  ctx.fillStyle='rgba(255,90,90,0.4)';ctx.fillRect(bx,by,bw,yOf(p.overMax)-by);
  // current fill
  const shownPow = phase==='power'?power:(phase==='ready'?0:lockedPow);
  ctx.fillStyle='#ffd24d';rr(bx,yOf(shownPow),bw,by+bh-yOf(shownPow),8);ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,0.3)';ctx.lineWidth=2;rr(bx,by,bw,bh,8);ctx.stroke();
  ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,0.7)';ctx.font='12px sans-serif';ctx.fillText('パワー',bx+bw/2,by-8);
  ctx.fillStyle='rgba(150,230,170,0.95)';ctx.font='11px sans-serif';ctx.fillText('本塁打',bx+bw+30,yOf((p.hr+p.overMax)/2)+4);
  ctx.fillStyle='rgba(255,120,120,0.9)';ctx.fillText('振り過ぎ',bx+bw+34,yOf((100+p.overMax)/2)+4);

  // ACCURACY bar (bottom horizontal) - only in accuracy phase
  if(phase==='accuracy'||phase==='ready'||phase==='power'){
    const ax=250,ay=H-46,aw=400,ah=20;
    ctx.fillStyle='rgba(0,0,0,0.4)';rr(ax,ay,aw,ah,8);ctx.fill();
    const gw=aw*(p.green/50); const gc=ax+aw/2;
    ctx.fillStyle='rgba(150,230,170,0.45)';ctx.fillRect(gc-gw,ay,gw*2,ah);
    if(phase==='accuracy'){ const mx=ax+aw*(accMarker/100); ctx.fillStyle='#ffe08a';ctx.fillRect(mx-3,ay-5,6,ah+10); }
    ctx.strokeStyle='rgba(255,255,255,0.3)';ctx.lineWidth=2;rr(ax,ay,aw,ah,8);ctx.stroke();
    ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,0.6)';ctx.font='12px sans-serif';ctx.fillText('ミート（芯で捉える）',gc,ay-8);
  }
}

function render(){
  ctx.save();
  if(shake>0)ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
  drawField();
  if(state==='play'||state==='over'){ drawBatter(); if(state==='play'&&phase==='fly')drawBall(); }

  for(const p of parts){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,3.4,0,6.28);ctx.fill();}
  ctx.globalAlpha=1;
  for(const p of pops){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.font='bold 22px sans-serif';ctx.textAlign='center';ctx.fillText(p.txt,p.x,p.y);}
  ctx.globalAlpha=1;

  drawMeter();

  // HUD
  ctx.textAlign='left';ctx.fillStyle='#fff';ctx.font='bold 26px sans-serif';ctx.fillText('SCORE '+score,20,36);
  ctx.textAlign='right';ctx.fillStyle='rgba(255,255,255,0.85)';ctx.font='14px sans-serif';ctx.fillText('本塁打 '+hrs+' 安打 '+hits+'  Lv'+lvl,W-20,24);
  ctx.fillText('アウト',W-96,46);
  for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(W-60+i*20,41,7,0,6.28);ctx.fillStyle=i<outs?'#ff5b5b':'rgba(255,255,255,0.22)';ctx.fill();}
  if(combo>=2){ctx.textAlign='center';ctx.fillStyle='#ffd24d';ctx.font='bold 18px sans-serif';ctx.fillText('コンボ x'+combo,450,110);}

  if(state==='play'){
    ctx.textAlign='center';ctx.font='bold 17px sans-serif';
    if(phase==='ready'){ctx.fillStyle='#ffe08a';ctx.fillText('タップでスイング開始！',450,80);}
    else if(phase==='power'){ctx.fillStyle='#ffe08a';ctx.fillText('パワーを溜めて“本塁打”ゾーンでタップ！',450,80);}
    else if(phase==='accuracy'){ctx.fillStyle='#8fe0a0';ctx.fillText('ミート！ 中央（芯）でタップ！',450,80);}
    else if(phase==='resolve'&&msg){ctx.fillStyle=(result==='homerun'||result==='double'||result==='single')?'#9ff0b8':'#ff9a9a';ctx.font='bold 23px sans-serif';ctx.fillText(msg,450,80);}
  }

  if(state==='title'){
    ctx.fillStyle='rgba(6,10,18,0.68)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='bold 52px sans-serif';ctx.fillText('フルスイング',W/2,150);
    ctx.fillStyle='#ffd24d';ctx.font='bold 22px sans-serif';ctx.fillText('Big Cut',W/2,186);
    ctx.fillStyle='rgba(255,255,255,0.9)';ctx.font='16px sans-serif';
    ctx.fillText('パワーとミートの“スイングメーター”で長打を狙う一発勝負',W/2,238);
    ctx.fillStyle='rgba(255,255,255,0.66)';ctx.font='14px sans-serif';
    ctx.fillText('①タップでスイング開始 → ②上がるパワーを“本塁打”ゾーンで止める（タップ）',W/2,278);
    ctx.fillText('③左右に動くミートを中央（芯）で止める（タップ）＝芯で捉える',W/2,300);
    ctx.fillText('大パワー×芯＝ホームラン、パワー中＝ツーベース/ヒット、芯を外す・振り過ぎ・緩い＝アウト',W/2,322);
    ctx.fillText('上級ほどメーターが速く、本塁打ゾーンも芯も狭くなる。3アウトで交代',W/2,344);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で開始',W/2,404);
    ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='14px sans-serif';ctx.fillText('BEST '+best+'　　1ボタン・3タップ（開始→パワー→ミート）',W/2,436);
  }
  if(state==='over'){
    ctx.fillStyle='rgba(6,10,18,0.76)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#ff6b6b';ctx.font='bold 46px sans-serif';ctx.fillText('3アウト…交代',W/2,222);
    ctx.fillStyle='#fff';ctx.font='bold 40px sans-serif';ctx.fillText('SCORE '+score,W/2,290);
    ctx.fillStyle='rgba(255,255,255,0.85)';ctx.font='19px sans-serif';ctx.fillText('本塁打 '+hrs+' 安打 '+hits+'   BEST '+best,W/2,330);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で もう一度',W/2,402);
  }

  if(flash>0.02){ctx.globalAlpha=flash*0.5;ctx.fillStyle=flashCol;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}
  ctx.restore();

  ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,0.4)';ctx.font='12px sans-serif';
  ctx.fillText('①開始→②パワーを本塁打ゾーンで止める→③ミートを芯（中央）で止める。芯を外す/振り過ぎ/緩いはアウト。3アウトで交代',W/2,H-8);
}

function frame(ts){let dt=ts-last;last=ts;if(dt>60)dt=60;if(dt<0)dt=0;update(dt);render();requestAnimationFrame(frame);}
requestAnimationFrame(frame);

// ---------- test hook ----------
window.__bc={
  start, tap:()=>tap(),
  get state(){return state;},
  get score(){return score;},
  get outs(){return outs;},
  get hrs(){return hrs;},
  get hits(){return hits;},
  get info(){const p=params(); return {state,phase, power, accMarker, lockedPow, lockedAcc,
    sgl:p.sgl,dbl:p.dbl,hr:p.hr,overMax:p.overMax,green:p.green, outs, hrs, hits, lvl};}
};
})();
</script>
</body>
</html>
