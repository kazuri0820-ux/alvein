<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>任せるか掻き出すか (Leave It or Clear It)</title>
<style>
  html,body{margin:0;height:100%;background:#07100a;overflow:hidden;
    font-family:-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  #stage{position:relative;width:100vw;height:100vh;max-width:calc(100vh*1.5);max-height:calc(100vw/1.5);aspect-ratio:900/600;}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;border-radius:6px;}
</style>
</head>
<body>
<div id="wrap"><div id="stage"><canvas id="cv"></canvas></div></div>
<script>
(function(){
const W=900,H=600,cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let DPR=1;
function fit(){DPR=Math.min(2,window.devicePixelRatio||1);cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
fit();addEventListener('resize',fit);

// ---------- audio ----------
let AC=null;function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function tone(f,d,type,v,sweep){const a=ac();if(!a)return;const t=a.currentTime,o=a.createOscillator(),g=a.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(sweep)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+sweep),t+d);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v||0.2,t+0.008);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+0.02);}
function noise(d,v,hp){const a=ac();if(!a)return;const t=a.currentTime,n=Math.floor(a.sampleRate*d),buf=a.createBuffer(1,n,a.sampleRate),ch=buf.getChannelData(0);
  for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource();s.buffer=buf;
  const f=a.createBiquadFilter();f.type='highpass';f.frequency.value=hp||600;const g=a.createGain();g.gain.value=v||0.2;
  s.connect(f);f.connect(g);g.connect(a.destination);s.start(t);s.stop(t+d+0.02);}
const S={
  swing:()=>{tone(300,0.05,'sine',0.03);},
  head:()=>{noise(0.05,0.15,500);tone(300,0.06,'square',0.08,-40);},
  call:()=>{tone(520,0.09,'triangle',0.10);},
  good:()=>{[680,940,1220].forEach((f,i)=>setTimeout(()=>tone(f,0.1,'triangle',0.16),i*55));},
  big:()=>{[600,800,1000,1250].forEach((f,i)=>setTimeout(()=>tone(f,0.12,'triangle',0.17),i*80));},
  bad:()=>{noise(0.2,0.24,260);tone(150,0.24,'sawtooth',0.13,-50);},
  streak:()=>{[700,930,1170,1400].forEach((f,i)=>setTimeout(()=>tone(f,0.1,'triangle',0.16),i*60));},
  over:()=>{[440,330,247,175].forEach((f,i)=>setTimeout(()=>tone(f,0.3,'triangle',0.2),i*160));}
};

// ---------- geometry ----------
const GOAL={x:452,y:120}, GW=250, GH=58;
const GKHOME={x:452,y:196}, CLEARP={x:452,y:300};   // keeper's line ; the ball's arrival/clear point
const DEF={x:560,y:360}, ATT={x:360,y:352}, CORNER={x:836,y:150};

// ---------- state ----------
let state='title', phase='set', plays=0;
let score=0, combo=0, best=+(localStorage.getItem('kb_best')||0);
let outs=0, fails=0, lvl=1;   // outs = dangers averted
let clock=0, revealT=520, callWin=980, call='STAY', tough=false;   // call: STAY (you clear) or COME (leave it)
let decided=false, acted=false, result=null, resultT=0, msg='', msgOk=false, anim=0;
let shake=0, flash=0, flashCol='#fff', last=performance.now();
let parts=[], pops=[];

function rnd(a,b){return a+Math.random()*(b-a);}
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function lerp(a,b,u){return a+(b-a)*u;}
function easeOut(u){return 1-Math.pow(1-u,2);}

function reset(){state='title';score=0;combo=0;outs=0;fails=0;lvl=1;plays=0;result=null;parts=[];pops=[];}

function newPlay(){
  plays++; lvl=Math.min(7,1+Math.floor(outs/4));
  revealT=clamp(560-lvl*24,360,560);
  callWin=clamp(1020-lvl*70,560,1020);
  tough=Math.random()<clamp(0.2+lvl*0.05,0.2,0.5);
  call=(Math.random()<0.5?'STAY':'COME');
  phase='set'; clock=0; decided=false; acted=false; result=null; resultT=0; msg=''; msgOk=false; anim=0;
  S.swing();
}
function start(){ if(!ac())ac(); if(AC&&AC.state==='suspended')AC.resume(); reset(); state='play'; newPlay(); }

function act(){   // "I'll take it" — go up and clear (head it away)
  if(state==='title'){start();return;}
  if(state==='over'){ if(resultT>0.4){reset();start();} return; }
  if(state!=='play'||phase!=='set'||decided) return;
  decided=true; acted=true;
  if(clock<revealT){ resolve('early'); return; }
  resolve(call==='STAY'?'clear':'collide');
}

function resolve(k){
  phase='result'; result=k; resultT=0; anim=0;
  if(k==='clear'||k==='left'){
    outs++; combo++;
    let add=Math.round((tough?240:150)*(1+Math.min(9,combo-1)*0.14)); score+=add;
    if(k==='clear'){ S.head(); } setTimeout(S.good,120); if(tough)setTimeout(S.big,200);
    msgOk=true; flash=1;flashCol='#8affa0';shake=5; burst(CLEARP.x,CLEARP.y,'#8affa0',16,7);
    pop(W/2,250,(k==='clear'?'キーパー残る——自分で掻き出した！ +':'キーパー！ 任せて正解——GKがキャッチ！ +')+add,'#d6ffe0');
    if(combo>=2)pop(W/2,214,'コンボ x'+combo,'#ffd24d');
    if(combo>0&&combo%5===0)S.streak();
    msg=(k==='clear')?'GKが動かないと見て、自分で頭を出してクロスを大きくクリア——ピンチを摘み取った！':'GKの「キーパー！」の声を聞いて体を引き、飛び出したGKにきっちり任せてキャッチさせた！';
  } else {
    fails++; combo=0; msgOk=false; flash=1;flashCol='#ff5b5b';shake=9; S.bad();
    if(k==='early') msg='判断が早い…GKの意図が分かる前に動き、まだ来ないクロスに空振りして裏を取られた';
    else if(k==='collide') msg='かぶった…GKが飛び出しているのに自分も行ってしまい、交錯してこぼれ球を押し込まれた（オウンゴール級）';
    else msg='任せすぎ…GKは出て来なかったのに見送り、フリーの相手にクロスを頭で押し込まれた';
    pop(W/2,250,(k==='collide')?'かぶった…失点':(k==='early')?'空振り…失点':'見送り…失点','#ffb0b0');
  }
  if(fails>=3){ state='over'; resultT=0; S.over(); if(score>best){best=score;localStorage.setItem('kb_best',best);} }
}

// ---------- input ----------
cv.addEventListener('pointerdown',e=>{e.preventDefault();act();});
addEventListener('keydown',e=>{ if(e.repeat)return; if(e.code==='Space'||e.code==='Enter'||e.code==='ArrowUp'||e.code==='KeyF'){e.preventDefault();act();} });

// ---------- particles ----------
function burst(x,y,c,n,sp){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=rnd(sp*0.3,sp);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:1,c});}}
function pop(x,y,txt,c){pops.push({x,y,txt,c,life:1});}

// ---------- update ----------
function update(dt){
  shake*=Math.pow(0.86,dt/16.7); if(shake<0.3)shake=0;
  flash*=Math.pow(0.9,dt/16.7);
  for(const p of parts){p.vx*=0.96;p.vy=p.vy*0.96+0.28;p.x+=p.vx*dt/16.7;p.y+=p.vy*dt/16.7;p.life-=dt/16.7*0.026;}
  parts=parts.filter(p=>p.life>0);
  for(const p of pops){p.y-=dt/16.7*0.5;p.life-=dt/16.7*0.02;}
  pops=pops.filter(p=>p.life>0);

  if(state!=='play'){ if(state==='over')resultT+=dt/1000; return; }
  if(phase==='set'){ const wasBefore=clock<revealT; clock+=dt;
    if(wasBefore&&clock>=revealT&&call==='COME')S.call();
    if(clock>=revealT) anim=Math.min(1,anim+dt/240);
    if(!decided && clock>revealT+callWin){ decided=true; resolve(call==='COME'?'left':'leftStay'); }  // held: correct only if COME
    return; }
  if(phase==='result'){ resultT+=dt/1000; anim=Math.min(1,anim+dt/360); if(resultT>1.6) newPlay(); return; }
}

// ---------- render ----------
function drawField(){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#0f5e34');g.addColorStop(0.55,'#0e5230');g.addColorStop(1,'#0c4429');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='rgba(255,255,255,0.03)';for(let i=0;i<6;i++){ if(i%2===0)ctx.fillRect(0,80+i*95,W,95); }
  ctx.strokeStyle='rgba(255,255,255,0.26)';ctx.lineWidth=3;
  ctx.strokeRect(GOAL.x-210,GOAL.y+GH,420,250);
  ctx.strokeRect(GOAL.x-100,GOAL.y+GH,200,90);
  ctx.fillStyle='rgba(0,0,0,0.28)';ctx.fillRect(GOAL.x-GW/2-4,GOAL.y-4,GW+8,GH+4);
  ctx.strokeStyle='rgba(255,255,255,0.34)';ctx.lineWidth=1;
  for(let gx=GOAL.x-GW/2;gx<=GOAL.x+GW/2;gx+=16){ctx.beginPath();ctx.moveTo(gx,GOAL.y);ctx.lineTo(gx,GOAL.y+GH);ctx.stroke();}
  for(let gy=GOAL.y;gy<=GOAL.y+GH;gy+=13){ctx.beginPath();ctx.moveTo(GOAL.x-GW/2,gy);ctx.lineTo(GOAL.x+GW/2,gy);ctx.stroke();}
  ctx.strokeStyle='#f2f2f2';ctx.lineWidth=6;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(GOAL.x-GW/2,GOAL.y+GH);ctx.lineTo(GOAL.x-GW/2,GOAL.y);ctx.lineTo(GOAL.x+GW/2,GOAL.y);ctx.lineTo(GOAL.x+GW/2,GOAL.y+GH);ctx.stroke();
  ctx.lineCap='butt';
}
function person(x,y,col,s,rise,lean){s=s||1;rise=rise||0;lean=lean||0;
  ctx.save();ctx.translate(x,y-rise);ctx.rotate(lean);
  ctx.fillStyle='rgba(0,0,0,0.2)';ctx.beginPath();ctx.ellipse(0,(13*s)+rise,11*s,4*s,0,0,6.28);ctx.fill();
  ctx.fillStyle=col;ctx.beginPath();ctx.ellipse(0,-15*s,10*s,15*s,0,0,6.28);ctx.fill();
  ctx.fillStyle='#f0c9a0';ctx.beginPath();ctx.arc(0,-34*s,7.5*s,0,6.28);ctx.fill();
  if(rise>4){ ctx.strokeStyle=col;ctx.lineWidth=5*s;ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(-5,-26*s);ctx.lineTo(-9,-46*s);ctx.stroke();
    ctx.beginPath();ctx.moveTo(5,-26*s);ctx.lineTo(9,-46*s);ctx.stroke(); }
  ctx.restore();
}

function render(){
  ctx.save();
  if(shake>0)ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
  drawField();

  if(state==='play'||state==='over'){
    const revealed=(phase==='set'&&clock>=revealT)||phase==='result';
    const coming=(call==='COME');
    // keeper: rushes out toward the claim point on COME, holds on STAY
    let gkx=GKHOME.x, gky=GKHOME.y;
    if(revealed&&coming){ const u=easeOut(clamp((phase==='set'?(clock-revealT)/300:1),0,1)); gkx=lerp(GKHOME.x,CLEARP.x,u); gky=lerp(GKHOME.y,CLEARP.y-6,u); }
    const gkRise=(phase==='result'&&(result==='left'))?30:(revealed&&coming?14:0);
    person(gkx,gky,'#e8c23a',0.95,gkRise);

    // lurking attacker
    let attRise=0;
    if(phase==='result'&&(result==='collide'||result==='leftStay'||result==='early')) attRise=easeOut(anim)*40;
    person(ATT.x,ATT.y,'#d0403a',0.95,attRise);

    // you (defender): rise when you go to clear
    let defRise=0, defLean=0;
    if(phase==='result'&&(result==='clear'||result==='collide')) defRise=easeOut(anim)*44;
    else if(phase==='result'&&(result==='left')) defLean=-0.2;   // pulled out of the way
    person(DEF.x,DEF.y,'#2b6fd6',1.0,defRise,defLean);

    // ball: arcs in toward the claim point; resolves per outcome
    let b=ballPos(phase==='set'?clock:(revealT+callWin));
    if(phase==='result'){
      const u=easeOut(anim);
      if(result==='clear'){ b.x=lerp(CLEARP.x,DEF.x+40,u); b.y=lerp(CLEARP.y,CLEARP.y+90,u); }          // headed away, out of the box
      else if(result==='left'){ b.x=lerp(CLEARP.x,gkx,u); b.y=lerp(CLEARP.y,gky-28,u); }                  // into the keeper's hands
      else if(result==='collide'){ b.x=lerp(CLEARP.x,GOAL.x+50,u); b.y=lerp(CLEARP.y,GOAL.y+GH*0.5,u); }  // bundled in
      else if(result==='leftStay'){ b.x=lerp(CLEARP.x,GOAL.x-60,u); b.y=lerp(CLEARP.y,GOAL.y+GH*0.5,u); } // headed in by attacker
      else { b.x=lerp(b.x,GOAL.x,u); b.y=lerp(b.y,GOAL.y+GH*0.5,u); }                                     // early: sails in
    }
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(b.x,b.y,8,0,6.28);ctx.fill();
    ctx.strokeStyle='#333';ctx.lineWidth=1.1;ctx.beginPath();ctx.arc(b.x,b.y,8,0.4,2.2);ctx.stroke();

    // reveal tell + banner
    ctx.textAlign='center';
    if(revealed){
      ctx.fillStyle=coming?'rgba(255,210,90,0.98)':'rgba(120,205,255,0.98)';ctx.font='bold 22px sans-serif';
      ctx.fillText(coming?'「キーパー！」 GKが飛び出した——任せろ！':'GKは動かない——自分で掻き出せ！', W/2, 250);
    }
    if(state==='play'&&phase==='set'){
      if(clock<revealT){ ctx.fillStyle='rgba(255,220,90,0.95)';ctx.font='bold 20px sans-serif';ctx.fillText('危険なクロス！ GKが来るか＝任せる／来ないか＝掻き出すを見極めろ',W/2,44); }
      else { const p=clamp((clock-revealT)/callWin,0,1),bw=250,x=W/2-bw/2,y=60;
        ctx.fillStyle='rgba(255,255,255,0.18)';ctx.fillRect(x,y,bw,7);ctx.fillStyle=p<0.7?'#8affa0':(p<1?'#ffd24d':'#ff5b5b');ctx.fillRect(x,y,bw*p,7); }
    }

    if(state==='play'){
      const active=phase==='set'&&clock>=revealT;
      ctx.fillStyle=active?'#3aa0ff':'rgba(255,255,255,0.10)';rr(150,506,230,62,10);ctx.fill();
      ctx.fillStyle=active?'#08130c':'rgba(255,255,255,0.5)';ctx.textAlign='center';ctx.font='bold 19px sans-serif';ctx.fillText('掻き出す（タップ/SPACE）',150+115,506+26);
      ctx.font='11px sans-serif';ctx.fillText('GKが来ない時＝自分でクリア',150+115,506+45);
      ctx.fillStyle=active?'#e8c23a':'rgba(255,255,255,0.10)';rr(520,506,230,62,10);ctx.fill();
      ctx.fillStyle=active?'#08130c':'rgba(255,255,255,0.5)';ctx.fillText('任せる（何もしない）',520+115,506+26);
      ctx.font='11px sans-serif';ctx.fillText('GKが来た時＝手を出さず引く',520+115,506+45);
      ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='12px sans-serif';ctx.fillText('GKが飛び出したら“任せて”手を出さない・出て来なければ“掻き出す”（タップ）',W/2,506+62+16);
    }
  }

  for(const p of parts){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,3.2,0,6.28);ctx.fill();}
  ctx.globalAlpha=1;
  for(const p of pops){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.font='bold 21px sans-serif';ctx.textAlign='center';ctx.fillText(p.txt,p.x,p.y);}
  ctx.globalAlpha=1;

  // HUD
  ctx.textAlign='left';ctx.fillStyle='#fff';ctx.font='bold 26px sans-serif';ctx.fillText('SCORE '+score,20,36);
  ctx.textAlign='right';ctx.fillStyle='rgba(255,255,255,0.9)';ctx.font='14px sans-serif';ctx.fillText('処理 '+outs+'  Lv'+lvl,W-20,24);
  ctx.fillText('失点',W-92,46);
  for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(W-60+i*20,41,7,0,6.28);ctx.fillStyle=i<fails?'#ff5b5b':'rgba(255,255,255,0.25)';ctx.fill();}
  if(combo>=2){ctx.textAlign='center';ctx.fillStyle='#ffd24d';ctx.font='bold 18px sans-serif';ctx.fillText('コンボ x'+combo,W/2,112);}

  if(state==='play'&&phase==='result'&&msg){ctx.textAlign='center';ctx.fillStyle=msgOk?'#9ff0b8':'#ff9a9a';ctx.font='bold 15px sans-serif';ctx.fillText(msg,W/2,300);}

  if(state==='title'){
    ctx.fillStyle='rgba(3,10,6,0.84)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='bold 38px sans-serif';ctx.fillText('任せるか掻き出すか',W/2,80);
    ctx.fillStyle='#ffd23e';ctx.font='bold 22px sans-serif';ctx.fillText('Leave It or Clear It',W/2,116);
    ctx.fillStyle='rgba(255,255,255,0.92)';ctx.font='16px sans-serif';
    ctx.fillText('ゴール前へ入る危険なクロス——DFとして、GKと“かぶらない”よう任せるか自分で掻き出すかを見極めろ',W/2,172);
    ctx.fillStyle='rgba(255,255,255,0.66)';ctx.font='14px sans-serif';
    ctx.fillText('GKが「キーパー！」と飛び出したら＝任せる（何もしない・手を出さない）でGKがキャッチ',W/2,210);
    ctx.fillText('GKが動かない（出て来ない）なら＝自分で掻き出す（タップ/クリック/SPACE）でヘッドクリア',W/2,234);
    ctx.fillText('GKが来たのに手を出す＝かぶって交錯し失点／来ないのに任せる＝フリーの相手に押し込まれ失点',W/2,258);
    ctx.fillText('意図が分かる前に動く＝空振りで失点。際どい場面（tough）はボーナス。上級ほど判断が速く猶予も短い',W/2,282);
    ctx.fillText('3失点で交代',W/2,306);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で開始',W/2,368);
    ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='14px sans-serif';ctx.fillText('BEST '+best,W/2,400);
  }
  if(state==='over'){
    ctx.fillStyle='rgba(3,10,6,0.86)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#ff6b6b';ctx.font='bold 46px sans-serif';ctx.fillText('3失点…交代',W/2,222);
    ctx.fillStyle='#fff';ctx.font='bold 40px sans-serif';ctx.fillText('SCORE '+score,W/2,290);
    ctx.fillStyle='rgba(255,255,255,0.85)';ctx.font='19px sans-serif';ctx.fillText('処理 '+outs+'   BEST '+best,W/2,330);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で もう一度',W/2,402);
  }

  if(flash>0.02){ctx.globalAlpha=flash*0.5;ctx.fillStyle=flashCol;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}
  ctx.restore();

  ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,0.4)';ctx.font='12px sans-serif';
  ctx.fillText('任せるか掻き出すか：GKが飛び出したら任せる（何もしない）・来なければ掻き出す（タップ）。かぶり/見送り/空振りは失点、3失点で交代',W/2,H-8);
}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
// ball arc (declared after use is fine due to hoisting of function declarations)
function ballPos(t){ const u=clamp(t/(revealT+callWin),0,1); return {x:lerp(CORNER.x,CLEARP.x,easeOut(u)), y:lerp(CORNER.y-8,CLEARP.y,u*u)}; }

function frame(ts){let dt=ts-last;last=ts;if(dt>60)dt=60;if(dt<0)dt=0;update(dt);render();requestAnimationFrame(frame);}
requestAnimationFrame(frame);

// ---------- test hook ----------
window.__kb={
  start, act:()=>act(),
  get state(){return state;},
  get score(){return score;},
  get outs(){return outs;},
  get fails(){return fails;},
  get info(){return {state,phase,clock,revealT,callWin,call,tough,decided,result,outs,fails,lvl,
    shouldClear:(call==='STAY'),revealed:(clock>=revealT),canAct:(phase==='set'&&!decided)};}
};
})();
</script>
</body>
</html>
