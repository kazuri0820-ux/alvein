<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>決め球 (Put It Away)</title>
<style>
  html,body{margin:0;height:100%;background:#0a0c12;overflow:hidden;
    font-family:-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  #stage{position:relative;width:100vw;height:100vh;max-width:calc(100vh*1.5);max-height:calc(100vw/1.5);aspect-ratio:900/600;}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;border-radius:6px;}
</style>
</head>
<body>
<div id="wrap"><div id="stage"><canvas id="cv"></canvas></div></div>
<script>
(function(){
const W=900,H=600,cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let DPR=1;
function fit(){DPR=Math.min(2,window.devicePixelRatio||1);cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
fit();addEventListener('resize',fit);

// ---------- audio ----------
let AC=null;function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function tone(f,d,type,v,sweep){const a=ac();if(!a)return;const t=a.currentTime,o=a.createOscillator(),g=a.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(sweep)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+sweep),t+d);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v||0.2,t+0.008);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+0.02);}
function noise(d,v,hp){const a=ac();if(!a)return;const t=a.currentTime,n=Math.floor(a.sampleRate*d),buf=a.createBuffer(1,n,a.sampleRate),ch=buf.getChannelData(0);
  for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource();s.buffer=buf;
  const f=a.createBiquadFilter();f.type='highpass';f.frequency.value=hp||600;const g=a.createGain();g.gain.value=v||0.2;
  s.connect(f);f.connect(g);g.connect(a.destination);s.start(t);s.stop(t+d+0.02);}
const S={
  lock:()=>{tone(680,0.04,'square',0.08);},
  fire:()=>{noise(0.04,0.12,700);tone(360,0.05,'square',0.09,220);},
  k:()=>{noise(0.05,0.12,600);[720,980,1240].forEach((f,i)=>setTimeout(()=>tone(f,0.11,'triangle',0.17),i*66));},
  ace:()=>{noise(0.05,0.12,500);[600,860,1120,1400,1680].forEach((f,i)=>setTimeout(()=>tone(f,0.12,'triangle',0.18),i*58));},
  bad:()=>{noise(0.16,0.22,320);tone(170,0.18,'sawtooth',0.12,-50);},
  streak:()=>{[700,930,1170,1400].forEach((f,i)=>setTimeout(()=>tone(f,0.1,'triangle',0.16),i*60));},
  over:()=>{[440,330,247,175].forEach((f,i)=>setTimeout(()=>tone(f,0.3,'triangle',0.2),i*160));}
};

// ---------- geometry ----------
const ZC={x:450,y:300}, ZW=200, ZH=230;    // strike zone box
const ZL=ZC.x-ZW/2, ZR=ZC.x+ZW/2, ZT=ZC.y-ZH/2, ZB=ZC.y+ZH/2;

// ---------- state ----------
let state='title', phase='aimH', t=0, plays=0;
let score=0, ks=0, fails=0, lvl=1, combo=0;
let best=+(localStorage.getItem('putaway_best')||0);
let clock=0, sweepH=1400, sweepV=1200, tr=40, tx=520, ty=360, hotR=52;
let mx=ZC.x, my=ZC.y, lockX=0, lockY=0, dirH=1, dirV=1;
let acted=false, result=null, resultT=0, msg='', fireU=0, dist=0, perfect=false;
let shake=0, flash=0, flashCol='#fff', last=performance.now();
let parts=[], pops=[];

function rnd(a,b){return a+Math.random()*(b-a);}
function chance(p){return Math.random()<p;}
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function lerp(a,b,u){return a+(b-a)*u;}
function easeOut(u){return 1-Math.pow(1-u,2);}

function params(){ return {
  sh:Math.max(1600,2300-lvl*100),
  sv:Math.max(1400,2050-lvl*92),
  tr:Math.max(36,52-lvl*2.3)
};}

function reset(){state='title';score=0;ks=0;fails=0;lvl=1;combo=0;plays=0;result=null;parts=[];pops=[];}
function newPlay(){
  plays++; lvl=Math.min(7,1+Math.floor(ks/4));
  const p=params();
  sweepH=p.sh; sweepV=p.sv; tr=p.tr;
  // target: a chase spot near a corner/edge of the zone (away from the dead-center hot zone)
  const cx=chance(0.5)?-1:1, cy=chance(0.5)?-1:1;
  tx=ZC.x+cx*rnd(ZW*0.28,ZW*0.52); ty=ZC.y+cy*rnd(ZH*0.26,ZH*0.5);
  hotR=52;
  mx=ZL; my=ZT; dirH=1; dirV=1;
  clock=0; acted=false; lockX=0; lockY=0; result=null; phase='aimH'; msg=''; resultT=0; fireU=0; perfect=false;
}
function start(){ if(!ac())ac(); if(AC&&AC.state==='suspended')AC.resume(); reset(); state='play'; newPlay(); }

function tapLock(){
  if(state==='title'){start();return;}
  if(state==='over'){ if(resultT>0.4){reset();start();} return; }
  if(state!=='play') return;
  if(phase==='aimH'){ lockX=mx; phase='aimV'; my=ZT; dirV=1; clock=0; S.lock(); return; }
  if(phase==='aimV'){ lockY=my; S.fire(); resolve_calc(); return; }
}
function resolve_calc(){
  acted=true;
  dist=Math.hypot(lockX-tx, lockY-ty);
  const distHot=Math.hypot(lockX-ZC.x, lockY-ZC.y);
  let kind;
  if(dist<=tr){ perfect=dist<=tr*0.42; kind=perfect?'ace':'k'; }
  else if(distHot<=hotR){ kind='crushed'; }
  else {
    // in zone but off target -> foul (wasted); out of zone -> ball
    const inZone = lockX>=ZL&&lockX<=ZR&&lockY>=ZT&&lockY<=ZB;
    kind = inZone?'foul':'ball';
  }
  resolve(kind);
}

function resolve(kind){
  phase='result'; result=kind; resultT=0;
  const good=(kind==='k'||kind==='ace');
  if(good){
    ks++; combo++;
    let add=Math.round((kind==='ace'?200:120)*(1+Math.min(9,combo-1)*0.15)); score+=add;
    if(kind==='ace'){ S.ace(); flash=1;flashCol='#8affa0';shake=8; burst(tx,ty,'#8affa0',22,7);
      pop(tx,ty-30,'ウイニングショット！ +'+add,'#d6ffe0'); pop(450,150,'完璧なコースに決めた！','#8affa0'); }
    else { S.k(); flash=1;flashCol='#ffe08a';shake=5; burst(lockX,lockY,'#ffe08a',12,5);
      pop(lockX,ly2(lockY)-30,'空振り三振！ +'+add,'#fff3c4'); }
    if(combo>=2)pop(450,190,'コンボ x'+combo,'#ffd24d');
    if(combo>0&&combo%5===0)S.streak();
    msg=kind==='ace'?'完璧な決め球！ 釣り球で空振り三振！':'際どいコースで空振り三振！';
  } else {
    fails++; combo=0; flash=1;flashCol='#ff5b5b';shake=8; S.bad();
    if(kind==='crushed') msg='甘い！ 真ん中に入って痛打された';
    else if(kind==='ball') msg='外れた…ボールでカウントを悪くした';
    else msg='コースが甘く…ファウルで逃げられた';
    pop(lockX,ly2(lockY)-30,kind==='crushed'?'痛打':(kind==='ball'?'ボール':'ファウル'),'#ffb0b0');
  }
  if(fails>=3){ state='over'; resultT=0; S.over(); if(score>best){best=score;localStorage.setItem('putaway_best',best);} }
}
function ly2(y){return y;}

// ---------- input ----------
cv.addEventListener('pointerdown',e=>{e.preventDefault();tapLock();});
addEventListener('keydown',e=>{ if(e.repeat)return; if(e.code==='Space'||e.code==='Enter'||e.code==='ArrowUp'||e.code==='KeyZ'){e.preventDefault();tapLock();} });

// ---------- particles ----------
function burst(x,y,c,n,sp){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=rnd(sp*0.3,sp);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:1,c});}}
function pop(x,y,txt,c){pops.push({x,y,txt,c,life:1});}

// ---------- update ----------
function update(dt){
  shake*=Math.pow(0.86,dt/16.7); if(shake<0.3)shake=0;
  flash*=Math.pow(0.9,dt/16.7);
  for(const p of parts){p.vx*=0.96;p.vy=p.vy*0.96+0.28;p.x+=p.vx*dt/16.7;p.y+=p.vy*dt/16.7;p.life-=dt/16.7*0.026;}
  parts=parts.filter(p=>p.life>0);
  for(const p of pops){p.y-=dt/16.7*0.5;p.life-=dt/16.7*0.02;}
  pops=pops.filter(p=>p.life>0);

  if(state!=='play'){ if(state==='over')resultT+=dt/1000; return; }
  t+=dt;
  if(phase==='aimH'||phase==='aimV'){ clock+=dt; return; }  // sweep handled by stepSweep()
  if(phase==='result'){
    resultT+=dt/1000; fireU=Math.min(1,fireU+dt/240);
    if(resultT>1.2 && state==='play') newPlay();
    return;
  }
}
// cleaner sweep in a fixed-step manner inside frame via clock
function stepSweep(dt){
  if(state!=='play')return;
  if(phase==='aimH'){ const sp=(ZR-ZL)/(sweepH/2)*dt; mx+=dirH*sp; if(mx>ZR){mx=ZR;dirH=-1;} if(mx<ZL){mx=ZL;dirH=1;} }
  else if(phase==='aimV'){ const sp=(ZB-ZT)/(sweepV/2)*dt; my+=dirV*sp; if(my>ZB){my=ZB;dirV=-1;} if(my<ZT){my=ZT;dirV=1;} }
}

// ---------- render ----------
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function drawScene(){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#1b2740');g.addColorStop(0.6,'#22406b');g.addColorStop(1,'#2c7a3b');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  // catcher's-eye strike zone
  ctx.fillStyle='rgba(255,255,255,0.05)';ctx.fillRect(ZL,ZT,ZW,ZH);
  ctx.strokeStyle='rgba(255,255,255,0.55)';ctx.lineWidth=2.5;ctx.strokeRect(ZL,ZT,ZW,ZH);
  ctx.strokeStyle='rgba(255,255,255,0.18)';ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(ZL+ZW/3,ZT);ctx.lineTo(ZL+ZW/3,ZB);ctx.moveTo(ZL+2*ZW/3,ZT);ctx.lineTo(ZL+2*ZW/3,ZB);
  ctx.moveTo(ZL,ZT+ZH/3);ctx.lineTo(ZR,ZT+ZH/3);ctx.moveTo(ZL,ZT+2*ZH/3);ctx.lineTo(ZR,ZT+2*ZH/3);ctx.stroke();
  // home plate
  ctx.fillStyle='#eef0f2';ctx.beginPath();ctx.moveTo(ZC.x-30,ZB+40);ctx.lineTo(ZC.x+30,ZB+40);ctx.lineTo(ZC.x+30,ZB+52);ctx.lineTo(ZC.x,ZB+62);ctx.lineTo(ZC.x-30,ZB+52);ctx.closePath();ctx.fill();
}

function render(){
  ctx.save();
  if(shake>0)ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
  drawScene();

  if(state==='play'){
    // hot zone (danger, center)
    ctx.fillStyle='rgba(226,60,60,0.16)';ctx.beginPath();ctx.arc(ZC.x,ZC.y,hotR,0,6.28);ctx.fill();
    ctx.strokeStyle='rgba(226,60,60,0.4)';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(ZC.x,ZC.y,hotR,0,6.28);ctx.stroke();
    ctx.fillStyle='rgba(255,140,140,0.7)';ctx.font='11px sans-serif';ctx.textAlign='center';ctx.fillText('痛打ゾーン',ZC.x,ZC.y+4);
    // target (chase spot)
    ctx.strokeStyle='rgba(150,240,170,0.9)';ctx.lineWidth=2.5;ctx.beginPath();ctx.arc(tx,ty,tr,0,6.28);ctx.stroke();
    ctx.fillStyle='rgba(120,235,150,0.22)';ctx.beginPath();ctx.arc(tx,ty,tr,0,6.28);ctx.fill();
    ctx.strokeStyle='rgba(214,255,224,0.5)';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(tx,ty,tr*0.42,0,6.28);ctx.stroke();
    ctx.fillStyle='rgba(159,240,184,0.9)';ctx.font='bold 11px sans-serif';ctx.fillText('釣り球',tx,ty-tr-6);

    // aim markers
    if(phase==='aimH'){
      ctx.strokeStyle='#ffd24d';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(mx,ZT-20);ctx.lineTo(mx,ZB+20);ctx.stroke();
      ctx.fillStyle='rgba(255,210,77,0.9)';ctx.font='bold 13px sans-serif';ctx.textAlign='center';ctx.fillText('①横（左右）を合わせてタップ',ZC.x,ZT-34);
    } else if(phase==='aimV'){
      ctx.strokeStyle='rgba(255,255,255,0.35)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(lockX,ZT-20);ctx.lineTo(lockX,ZB+20);ctx.stroke();
      ctx.strokeStyle='#ffd24d';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(ZL-20,my);ctx.lineTo(ZR+20,my);ctx.stroke();
      ctx.fillStyle='#ffd24d';ctx.beginPath();ctx.arc(lockX,my,6,0,6.28);ctx.fill();
      ctx.fillStyle='rgba(255,210,77,0.9)';ctx.font='bold 13px sans-serif';ctx.textAlign='center';ctx.fillText('②縦（高さ）を合わせてタップ',ZC.x,ZT-34);
    } else {
      // ball fired to lock position; batter swings & misses on K
      const bx=lerp(ZC.x,lockX,easeOut(fireU)), by=lerp(ZB+90,lockY,easeOut(fireU))-Math.sin(Math.PI*fireU)*30;
      ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(bx,by,7,0,6.28);ctx.fill();
      // lock crosshair
      ctx.strokeStyle=(result==='k'||result==='ace')?'rgba(150,240,170,0.8)':'rgba(255,120,120,0.8)';ctx.lineWidth=2;
      ctx.beginPath();ctx.arc(lockX,lockY,10,0,6.28);ctx.stroke();
    }
  }

  for(const p of parts){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,3.2,0,6.28);ctx.fill();}
  ctx.globalAlpha=1;
  for(const p of pops){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.font='bold 22px sans-serif';ctx.textAlign='center';ctx.fillText(p.txt,p.x,p.y);}
  ctx.globalAlpha=1;

  // HUD
  ctx.textAlign='left';ctx.fillStyle='#fff';ctx.font='bold 26px sans-serif';ctx.fillText('SCORE '+score,20,36);
  ctx.textAlign='right';ctx.fillStyle='rgba(255,255,255,0.9)';ctx.font='14px sans-serif';ctx.fillText('三振 '+ks+'  Lv'+lvl,W-20,24);
  ctx.fillText('失投',W-92,46);
  for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(W-60+i*20,41,7,0,6.28);ctx.fillStyle=i<fails?'#ff5b5b':'rgba(255,255,255,0.25)';ctx.fill();}
  if(combo>=2){ctx.textAlign='center';ctx.fillStyle='#ffd24d';ctx.font='bold 18px sans-serif';ctx.fillText('コンボ x'+combo,W/2,ZB+96);}

  if(state==='play'&&(phase==='aimH'||phase==='aimV')){ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,0.9)';ctx.font='bold 15px sans-serif';
    ctx.fillText('追い込んだ！ 釣り球（緑）へ狙いを横→縦の2回で合わせて決め球',W/2,44);}
  if(state==='play'&&phase==='result'&&msg){ctx.textAlign='center';ctx.fillStyle=(result==='k'||result==='ace')?'#9ff0b8':'#ff9a9a';ctx.font='bold 20px sans-serif';ctx.fillText(msg,W/2,44);}

  if(state==='title'){
    ctx.fillStyle='rgba(6,9,14,0.8)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='bold 44px sans-serif';ctx.fillText('決め球',W/2,108);
    ctx.fillStyle='#ffd23e';ctx.font='bold 22px sans-serif';ctx.fillText('Put It Away',W/2,144);
    ctx.fillStyle='rgba(255,255,255,0.92)';ctx.font='16px sans-serif';
    ctx.fillText('2ストライクからの決め球。追い込んだ打者を“釣り球”で空振り三振に仕留めろ',W/2,192);
    ctx.fillStyle='rgba(255,255,255,0.66)';ctx.font='14px sans-serif';
    ctx.fillText('打者が手を出す“釣り球ゾーン（緑）”がゾーンの隅に出る',W/2,232);
    ctx.fillText('① 横に動く狙い線を左右で合わせてタップ → ② 縦の高さを合わせてタップ',W/2,254);
    ctx.fillText('釣り球ゾーンに決めれば空振り三振（中心＝“ウイニングショット”で大量得点）',W/2,276);
    ctx.fillText('真ん中の“痛打ゾーン（赤）”は痛打、ゾーン外はボール、外れると失投＝失敗',W/2,298);
    ctx.fillText('上級ほど狙い線が速く釣り球が小さい。3失投で交代',W/2,320);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で開始',W/2,384);
    ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='14px sans-serif';ctx.fillText('BEST '+best,W/2,416);
  }
  if(state==='over'){
    ctx.fillStyle='rgba(6,9,14,0.86)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#ff6b6b';ctx.font='bold 46px sans-serif';ctx.fillText('3失投…交代',W/2,222);
    ctx.fillStyle='#fff';ctx.font='bold 40px sans-serif';ctx.fillText('SCORE '+score,W/2,290);
    ctx.fillStyle='rgba(255,255,255,0.85)';ctx.font='19px sans-serif';ctx.fillText('三振 '+ks+'   BEST '+best,W/2,330);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で もう一度',W/2,402);
  }

  if(flash>0.02){ctx.globalAlpha=flash*0.5;ctx.fillStyle=flashCol;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}
  ctx.restore();

  ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,0.4)';ctx.font='12px sans-serif';
  ctx.fillText('狙い線を横→縦の2回タップで釣り球ゾーン（緑）へ。真ん中は痛打、ゾーン外はボール。3失投で交代',W/2,H-8);
}

function frame(ts){let dt=ts-last;last=ts;if(dt>60)dt=60;if(dt<0)dt=0;stepSweep(dt);update(dt);render();requestAnimationFrame(frame);}
requestAnimationFrame(frame);

// ---------- test hook ----------
window.__pa={
  start, tap:()=>tapLock(),
  get state(){return state;},
  get score(){return score;},
  get outs(){return ks;},
  get fails(){return fails;},
  get info(){return {state,phase,mx,my,lockX,tx,ty,tr,ZL,ZR,ZT,ZB,hotR,zc:{x:ZC.x,y:ZC.y},
    canTap:(phase==='aimH'||phase==='aimV'),result,outs:ks,fails,lvl};}
};
})();
</script>
</body>
</html>
