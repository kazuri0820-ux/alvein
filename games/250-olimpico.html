<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>オリンピコ (Score from the Corner)</title>
<style>
  html,body{margin:0;height:100%;background:#07120b;overflow:hidden;
    font-family:-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  #stage{position:relative;width:100vw;height:100vh;max-width:calc(100vh*1.5);max-height:calc(100vw/1.5);aspect-ratio:900/600;}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;border-radius:6px;}
</style>
</head>
<body>
<div id="wrap"><div id="stage"><canvas id="cv"></canvas></div></div>
<script>
(function(){
const W=900,H=600,cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let DPR=1;
function fit(){DPR=Math.min(2,window.devicePixelRatio||1);cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
fit();addEventListener('resize',fit);

// ---------- audio ----------
let AC=null;function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function tone(f,d,type,v,sweep){const a=ac();if(!a)return;const t=a.currentTime,o=a.createOscillator(),g=a.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(sweep)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+sweep),t+d);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v||0.2,t+0.008);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+0.02);}
function noise(d,v,hp){const a=ac();if(!a)return;const t=a.currentTime,n=Math.floor(a.sampleRate*d),buf=a.createBuffer(1,n,a.sampleRate),ch=buf.getChannelData(0);
  for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource();s.buffer=buf;
  const f=a.createBiquadFilter();f.type='highpass';f.frequency.value=hp||600;const g=a.createGain();g.gain.value=v||0.2;
  s.connect(f);f.connect(g);g.connect(a.destination);s.start(t);s.stop(t+d+0.02);}
const S={
  kick:()=>{noise(0.05,0.14,500);tone(300,0.08,'square',0.1,260);},
  goal:()=>{noise(0.06,0.14,500);[560,820,1080,1340,1600].forEach((f,i)=>setTimeout(()=>tone(f,0.13,'triangle',0.18),i*60));},
  save:()=>{noise(0.1,0.16,420);tone(230,0.12,'sawtooth',0.1,-40);},
  wide:()=>{tone(300,0.16,'sine',0.1,-120);noise(0.06,0.06,900);},
  streak:()=>{[700,930,1170,1400].forEach((f,i)=>setTimeout(()=>tone(f,0.1,'triangle',0.16),i*60));},
  over:()=>{[440,330,247,175].forEach((f,i)=>setTimeout(()=>tone(f,0.3,'triangle',0.2),i*160));}
};

// ---------- geometry & physics ----------
const GY=118, GW=210, GC=468, GL=GC-GW/2, GR=GC+GW/2;   // goal on top
const BALL={x:150,y:498};                                // corner (bottom-left)
const AX=240;                                            // in-swing curl accel (px/s^2, rightward)
const VY0=-540;                                          // default upward speed (px/s)

// ---------- state ----------
let state='title', phase='aim', t=0, plays=0;
let score=0, combo=0, best=+(localStorage.getItem('olimpico_best')||0);
let outs=0, fails=0, lvl=1;   // outs = goals
let kSide=-1, kW=0, openC=GC, tolExtra=0;
let vx=0, vy=0, bx=BALL.x, by=BALL.y, flightT=0, crossX=0;
let dragging=false, dsx=0, dsy=0, dcx=0, dcy=0;
let result=null, resultT=0, msg='', worldie=false;
let shake=0, flash=0, flashCol='#fff', last=performance.now();
let parts=[], pops=[], trail=[];

function rnd(a,b){return a+Math.random()*(b-a);}
function chance(p){return Math.random()<p;}
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function lerp(a,b,u){return a+(b-a)*u;}

function params(){ return { kw:Math.min(0.62,0.4+lvl*0.03) }; }  // keeper covers this fraction of goal

// crossing x for a launch (vx,vy) — continuous closed form
function crossFor(vxx,vyy){ if(vyy>=-1)return 99999; const tt=(GY-by)/vyy; return bx+vxx*tt+0.5*AX*tt*tt; }
function solveVx(targetX,vyy){ const tt=(GY-by)/vyy; return (targetX-bx-0.5*AX*tt*tt)/tt; }

function reset(){state='title';score=0;combo=0;outs=0;fails=0;lvl=1;plays=0;result=null;parts=[];pops=[];trail=[];}
function newPlay(){
  plays++; lvl=Math.min(7,1+Math.floor(outs/4));
  const p=params();
  // keeper covers near-post (left) or far portion
  kSide=chance(0.5)?-1:1;
  kW=GW*p.kw;
  if(kSide<0){ /* keeper on left */ openC=lerp(GL+kW,GR,0.5); }
  else { openC=lerp(GL,GR-kW,0.5); }
  bx=BALL.x; by=BALL.y;
  vx=0; vy=0; trail=[];
  clock0();
  dragging=false; result=null; phase='aim'; msg=''; resultT=0; worldie=false;
}
let clockT=0; function clock0(){clockT=0;}
function start(){ if(!ac())ac(); if(AC&&AC.state==='suspended')AC.resume(); reset(); state='play'; newPlay(); }

function kick(kvx,kvy){
  if(state!=='play'||phase!=='aim')return;
  vx=kvx; vy=kvy; phase='fly'; flightT=0; bx=BALL.x; by=BALL.y; trail=[]; S.kick();
}
function solve(){ return [solveVx(openC, VY0), VY0]; }

function landResolve(){
  crossX = bx;
  const inGoal = crossX>=GL && crossX<=GR;
  // keeper covered band
  const kL = kSide<0? GL : GR-kW;
  const kR = kSide<0? GL+kW : GR;
  const saved = crossX>=kL && crossX<=kR;
  let kind;
  if(!inGoal) kind='wide';
  else if(saved) kind='save';
  else { worldie=Math.abs(crossX-openC)<=GW*0.12; kind=worldie?'worldie':'goal'; }
  resolve(kind);
}

function resolve(kind){
  phase='result'; result=kind; resultT=0;
  const good=(kind==='goal'||kind==='worldie');
  if(good){
    outs++; combo++;
    let add=Math.round((kind==='worldie'?240:140)*(1+Math.min(9,combo-1)*0.15)); score+=add;
    S.goal(); flash=1;flashCol=kind==='worldie'?'#8affa0':'#ffe08a';shake=kind==='worldie'?10:6;
    burst(crossX,GY,kind==='worldie'?'#8affa0':'#ffe08a',kind==='worldie'?28:16,8);
    pop(crossX,GY-8,(kind==='worldie'?'オリンピコ！ +':'ゴール！ +')+add,kind==='worldie'?'#d6ffe0':'#fff3c4');
    if(kind==='worldie')pop(450,200,'コーナーから直接突き刺した！','#8affa0');
    if(combo>=2)pop(450,240,'コンボ x'+combo,'#ffd24d');
    if(combo>0&&combo%5===0)S.streak();
    msg=kind==='worldie'?'完璧なカーブ！ コーナーから直接ゴラッソ！':'巻き込んでゴール！ 直接決めた！';
  } else {
    fails++; combo=0; flash=1;flashCol='#ff5b5b';shake=8;
    if(kind==='save'){ S.save(); msg='GKの正面…曲がりが足りず抑えられた'; }
    else { S.wide(); msg='枠の外…曲げ過ぎ／power不足でコースを外した'; }
    pop(clamp(crossX,60,840),GY+30,kind==='save'?'キャッチ！':'枠外…','#ffb0b0');
  }
  if(fails>=3){ state='over'; resultT=0; S.over(); if(score>best){best=score;localStorage.setItem('olimpico_best',best);} }
}

// ---------- input (drag slingshot) ----------
function ptr(e){ const r=cv.getBoundingClientRect(); return {x:(e.clientX-r.left)/r.width*W, y:(e.clientY-r.top)/r.height*H}; }
cv.addEventListener('pointerdown',e=>{e.preventDefault();
  if(state==='title'){start();return;}
  if(state==='over'){ if(resultT>0.4){reset();start();} return; }
  if(state==='play'&&phase==='aim'){ dragging=true; const p=ptr(e); dsx=p.x;dsy=p.y;dcx=p.x;dcy=p.y; }
});
cv.addEventListener('pointermove',e=>{ if(!dragging)return; e.preventDefault(); const p=ptr(e); dcx=p.x;dcy=p.y; });
cv.addEventListener('pointerup',e=>{ if(!dragging)return; e.preventDefault(); dragging=false;
  const kv=dragVel(); if(kv){ kick(kv[0],kv[1]); } });
cv.addEventListener('pointercancel',e=>{dragging=false;});
function dragVel(){ const dx=dsx-dcx, dy=dsy-dcy; const len=Math.hypot(dx,dy); if(len<24)return null;
  const K=3.4; let kvx=dx*K, kvy=dy*K; if(kvy>-120)kvy=-120; kvy=Math.max(kvy,-900); return [kvx,kvy]; }
addEventListener('keydown',e=>{ if(e.code==='Space'||e.code==='Enter'){e.preventDefault(); if(state!=='play'){ if(state==='title')start(); else if(resultT>0.4){reset();start();} } } });

// ---------- particles ----------
function burst(x,y,c,n,sp){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=rnd(sp*0.3,sp);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:1,c});}}
function pop(x,y,txt,c){pops.push({x,y,txt,c,life:1});}

// ---------- update ----------
function update(dt){
  shake*=Math.pow(0.86,dt/16.7); if(shake<0.3)shake=0;
  flash*=Math.pow(0.9,dt/16.7);
  for(const p of parts){p.vx*=0.96;p.vy=p.vy*0.96+0.28;p.x+=p.vx*dt/16.7;p.y+=p.vy*dt/16.7;p.life-=dt/16.7*0.026;}
  parts=parts.filter(p=>p.life>0);
  for(const p of pops){p.y-=dt/16.7*0.5;p.life-=dt/16.7*0.02;}
  pops=pops.filter(p=>p.life>0);

  if(state!=='play'){ if(state==='over')resultT+=dt/1000; return; }
  t+=dt;
  if(phase==='fly'){
    const h=dt/1000;
    vx+=AX*h; bx+=vx*h; by+=vy*h;
    trail.push({x:bx,y:by}); if(trail.length>26)trail.shift();
    if(by<=GY){ by=GY; landResolve(); return; }
    if(by>H+40||bx<-60||bx>W+60){ crossX=bx; resolve('wide'); return; }
    return;
  }
  if(phase==='result'){ resultT+=dt/1000; if(resultT>1.35 && state==='play') newPlay(); return; }
}

// ---------- render ----------
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function drawScene(){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#256d34');g.addColorStop(1,'#184a22');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='rgba(255,255,255,0.035)';
  for(let i=0;i<7;i++){ if(i%2===0)ctx.fillRect(0,i*H/7,W,H/7); }
  // goal
  ctx.fillStyle='rgba(255,255,255,0.10)';ctx.fillRect(GL-6,GY-40,GW+12,40);
  ctx.strokeStyle='#f2f4f6';ctx.lineWidth=6;
  ctx.beginPath();ctx.moveTo(GL-6,GY);ctx.lineTo(GL-6,GY-40);ctx.lineTo(GR+6,GY-40);ctx.lineTo(GR+6,GY);ctx.stroke();
  ctx.strokeStyle='rgba(255,255,255,0.14)';ctx.lineWidth=1;
  for(let x=GL;x<=GR;x+=15){ctx.beginPath();ctx.moveTo(x,GY-38);ctx.lineTo(x,GY-2);ctx.stroke();}
  ctx.strokeStyle='rgba(255,255,255,0.4)';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(GL,GY);ctx.lineTo(GR,GY);ctx.stroke();
  // corner arc
  ctx.strokeStyle='rgba(255,255,255,0.25)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(BALL.x,H-70,26,-1.57,0);ctx.stroke();
}

function render(){
  ctx.save();
  if(shake>0)ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
  drawScene();

  if(state==='play'){
    // keeper band
    const kL=kSide<0?GL:GR-kW, kR=kSide<0?GL+kW:GR;
    ctx.fillStyle='rgba(226,60,60,0.5)';ctx.fillRect(kL,GY-40,kR-kL,40);
    ctx.fillStyle='#e23c3c';rr((kL+kR)/2-11,GY+2,22,28,6);ctx.fill();
    ctx.fillStyle='#f2c9a0';ctx.beginPath();ctx.arc((kL+kR)/2,GY,7,0,6.28);ctx.fill();
    // open target
    const oL=kSide<0?GL+kW:GL, oR=kSide<0?GR:GR-kW;
    ctx.fillStyle='rgba(120,235,150,0.28)';ctx.fillRect(oL,GY-40,oR-oL,40);
    ctx.strokeStyle='rgba(150,240,170,0.9)';ctx.lineWidth=2;ctx.strokeRect(oL,GY-40,oR-oL,40);

    // trajectory preview while dragging
    if(phase==='aim'&&dragging){ const kv=dragVel();
      if(kv){ ctx.strokeStyle='rgba(255,210,77,0.85)';ctx.lineWidth=2;ctx.setLineDash([5,7]);ctx.beginPath();
        let px=BALL.x,py=BALL.y,pvx=kv[0],pvy=kv[1]; ctx.moveTo(px,py);
        for(let i=0;i<80;i++){ const h=0.016; pvx+=AX*h; px+=pvx*h; py+=pvy*h; ctx.lineTo(px,py); if(py<=GY||py>H||px<0||px>W)break; }
        ctx.stroke();ctx.setLineDash([]); }
      // sling line
      ctx.strokeStyle='rgba(255,255,255,0.5)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(BALL.x,BALL.y);ctx.lineTo(BALL.x-(dcx-dsx),BALL.y-(dcy-dsy));ctx.stroke();
    }

    // ball & trail
    if(phase==='fly'||phase==='aim'){
      for(let i=0;i<trail.length;i++){ ctx.globalAlpha=i/trail.length*0.4;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(trail[i].x,trail[i].y,4,0,6.28);ctx.fill(); }
      ctx.globalAlpha=1;
      ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(bx,by,8,0,6.28);ctx.fill();
      ctx.strokeStyle='#333';ctx.lineWidth=1.2;ctx.beginPath();ctx.arc(bx,by,8,0.6,2.4);ctx.stroke();
    } else if(phase==='result'){
      ctx.globalAlpha=(result==='goal'||result==='worldie')?1:clamp(1.3-resultT,0,1);
      ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(bx,by,8,0,6.28);ctx.fill();ctx.globalAlpha=1;
    }

    if(phase==='aim'&&!dragging){ ctx.fillStyle='rgba(255,255,255,0.85)';ctx.font='bold 15px sans-serif';ctx.textAlign='center';
      ctx.fillText('ボールから引っ張って離す＝スリング。カーブを計算してGKの逆（緑）へ巻き込め',W/2,H-40); }
  }

  for(const p of parts){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,3.2,0,6.28);ctx.fill();}
  ctx.globalAlpha=1;
  for(const p of pops){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.font='bold 22px sans-serif';ctx.textAlign='center';ctx.fillText(p.txt,p.x,p.y);}
  ctx.globalAlpha=1;

  // HUD
  ctx.textAlign='left';ctx.fillStyle='#fff';ctx.font='bold 26px sans-serif';ctx.fillText('SCORE '+score,20,36);
  ctx.textAlign='right';ctx.fillStyle='rgba(255,255,255,0.9)';ctx.font='14px sans-serif';ctx.fillText('ゴール '+outs+'  Lv'+lvl,W-20,24);
  ctx.fillText('失敗',W-92,46);
  for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(W-60+i*20,41,7,0,6.28);ctx.fillStyle=i<fails?'#ff5b5b':'rgba(255,255,255,0.25)';ctx.fill();}
  if(combo>=2){ctx.textAlign='center';ctx.fillStyle='#ffd24d';ctx.font='bold 18px sans-serif';ctx.fillText('コンボ x'+combo,W/2,GY+70);}

  if(state==='play'&&phase==='result'&&msg){ctx.textAlign='center';ctx.fillStyle=(result==='goal'||result==='worldie')?'#9ff0b8':'#ff9a9a';ctx.font='bold 20px sans-serif';ctx.fillText(msg,W/2,GY+70);}

  if(state==='title'){
    ctx.fillStyle='rgba(5,12,7,0.78)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='bold 44px sans-serif';ctx.fillText('オリンピコ',W/2,110);
    ctx.fillStyle='#ffd23e';ctx.font='bold 22px sans-serif';ctx.fillText('Score from the Corner',W/2,146);
    ctx.fillStyle='rgba(255,255,255,0.92)';ctx.font='16px sans-serif';
    ctx.fillText('コーナーキックを直接ゴールへ巻き込む大技“オリンピコ”を決めろ',W/2,196);
    ctx.fillStyle='rgba(255,255,255,0.66)';ctx.font='14px sans-serif';
    ctx.fillText('ボールを引っ張って離す＝スリングショット。強さと方向で弾道が決まる',W/2,236);
    ctx.fillText('ボールは飛びながら右へカーブ（インスイング）。予測線を見ながら狙え',W/2,258);
    ctx.fillText('GK（赤）がゴールの一部を固める。空いた側（緑）へ曲げて突き刺す',W/2,280);
    ctx.fillText('中心の芯へ決めれば“オリンピコ”で大量得点。GK正面はキャッチ、外は枠外',W/2,302);
    ctx.fillText('上級ほどGKが広く守る。3失敗で交代　　※250作目！',W/2,324);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で開始',W/2,388);
    ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='14px sans-serif';ctx.fillText('BEST '+best+'　　ドラッグで狙って離す',W/2,420);
  }
  if(state==='over'){
    ctx.fillStyle='rgba(5,12,7,0.84)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#ff6b6b';ctx.font='bold 46px sans-serif';ctx.fillText('3失敗…交代',W/2,222);
    ctx.fillStyle='#fff';ctx.font='bold 40px sans-serif';ctx.fillText('SCORE '+score,W/2,290);
    ctx.fillStyle='rgba(255,255,255,0.85)';ctx.font='19px sans-serif';ctx.fillText('ゴール '+outs+'   BEST '+best,W/2,330);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で もう一度',W/2,402);
  }

  if(flash>0.02){ctx.globalAlpha=flash*0.5;ctx.fillStyle=flashCol;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}
  ctx.restore();

  ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,0.4)';ctx.font='12px sans-serif';
  ctx.fillText('ボールを引っ張って離すスリングショット。右へのカーブを計算し、GKの逆（緑）へ直接巻き込め。3失敗で交代',W/2,H-8);
}

function frame(ts){let dt=ts-last;last=ts;if(dt>60)dt=60;if(dt<0)dt=0;update(dt);render();requestAnimationFrame(frame);}
requestAnimationFrame(frame);

// ---------- test hook ----------
window.__ol={
  start, kick:(a,b)=>kick(a,b), solve,
  get state(){return state;},
  get score(){return score;},
  get outs(){return outs;},
  get fails(){return fails;},
  get info(){return {state,phase,GL,GR,GY,GC,GW,bx:BALL.x,by:BALL.y,AX,VY0,kSide,kW,openC,
    kL:(kSide<0?GL:GR-kW),kR:(kSide<0?GL+kW:GR),result,outs,fails,lvl};}
};
})();
</script>
</body>
</html>
