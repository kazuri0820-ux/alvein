<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>アエリアルデュエル — Win the Header</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{width:100%;height:100%;background:#08140c;overflow:hidden;
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,system-ui,sans-serif;
    touch-action:none;user-select:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  #stage{position:relative;aspect-ratio:900/600;max-width:100%;max-height:100%;
    width:auto;height:auto;box-shadow:0 0 60px rgba(0,0,0,.6);}
  canvas{display:block;width:100%;height:100%;border-radius:6px;}
</style>
</head>
<body>
<div id="wrap"><div id="stage"><canvas id="c" width="900" height="600"></canvas></div></div>
<script>
(function(){
"use strict";
const TEST=location.hash.indexOf('test')>=0;
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
const W=900,H=600;
let dpr=Math.max(1,Math.min(2,window.devicePixelRatio||1));
function fit(){ dpr=Math.max(1,Math.min(2,window.devicePixelRatio||1)); cv.width=W*dpr; cv.height=H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0); }
fit(); window.addEventListener('resize',fit);

// ---- audio ----
let AC=null;
function ac(){ if(!AC){ try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){AC=null;} } return AC; }
function tone(f,d,type,g,f2){ const a=ac(); if(!a)return; const o=a.createOscillator(),gg=a.createGain();
  o.type=type||'sine'; o.frequency.setValueAtTime(f,a.currentTime); if(f2)o.frequency.exponentialRampToValueAtTime(f2,a.currentTime+d);
  gg.gain.setValueAtTime(0.0001,a.currentTime); gg.gain.exponentialRampToValueAtTime(g||0.2,a.currentTime+0.01);
  gg.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+d); o.connect(gg); gg.connect(a.destination); o.start(); o.stop(a.currentTime+d+0.02); }
function noise(d,g,cut){ const a=ac(); if(!a)return; const n=Math.floor(a.sampleRate*d),buf=a.createBuffer(1,n,a.sampleRate),ch=buf.getChannelData(0);
  for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(1-i/n); const src=a.createBufferSource(); src.buffer=buf;
  const f=a.createBiquadFilter(); f.type='lowpass'; f.frequency.value=cut||1200; const gg=a.createGain(); gg.gain.value=g||0.2;
  src.connect(f); f.connect(gg); gg.connect(a.destination); src.start(); }
const S={
  cross(){ noise(0.05,0.14,1800); },
  head(){ noise(0.05,0.4,1600); tone(300,0.07,'square',0.2,180); },
  goal(){ noise(0.08,0.4,2200); tone(520,0.14,'square',0.26,660); },
  cheer(){ const a=ac(); if(!a)return; noise(0.9,0.28,1900); for(let i=0;i<7;i++)setTimeout(()=>tone(500+Math.random()*340,0.34,'sine',0.05),i*42); },
  save(){ noise(0.12,0.34,1400); tone(260,0.16,'sawtooth',0.14,120); },
  lost(){ noise(0.1,0.3,1000); tone(200,0.14,'sawtooth',0.14,90); },
  whiff(){ noise(0.08,0.2,1500); tone(240,0.12,'sine',0.1,150); }, tick(){ tone(1000,0.03,'square',0.05); }
};

// ---- geometry ----
const GOAL={L:342,R:558,line:96};
const SPOT={x:450,y:360};       // contested point
const JUMP_LAG=0.30, JUMP_H=86, JUMP_T=0.6;   // jump apex at JUMP_LAG, total air time JUMP_T

// ---- state ----
let state='ready';   // ready, cross, result, over
let goals=0, miss=0, streak=0, best=0, level=0, playN=0;
let p=0, dropDur=1.35, feederX=140, ballBreak=0;
let jumped=false, jumpP=0, yourE=1, oppE=0.1, oppTapP=0.7, oppJumped=false;
let keeperSide=0, result=null, ballFly=null;
let msg='',msgT=0, subMsg='';
let flash=0,flashCol='#fff',shakeT=0,shakeM=0;
let parts=[], crowd=[], t=0;

try{ best=parseInt(localStorage.getItem('ad_best')||'0',10)||0; }catch(e){}
for(let i=0;i<80;i++) crowd.push({x:Math.random()*W,y:6+Math.random()*40,c:['#e8544e','#f0c14b','#4a90d9','#fff','#5cc98a','#c98af0'][i%6],b:Math.random()*6.28});

function saveBest(){ try{localStorage.setItem('ad_best',''+best);}catch(e){} }
function levelUp(){ level=Math.min(9,Math.floor(goals/3)); }
function idealTapP(){ return (dropDur-JUMP_LAG)/dropDur; }
function reset(){ goals=0;miss=0;streak=0;level=0;playN=0; parts=[]; nextCross(); }

function nextCross(){
  levelUp(); playN++;
  dropDur=Math.max(0.95,1.4-level*0.045);
  feederX = Math.random()<0.5? 120+Math.random()*80 : 700+Math.random()*80;
  ballBreak=(Math.random()*2-1)*20;
  // opponent timing error: tighter with level
  oppE = Math.max(0.03, 0.11 - level*0.006) + Math.random()*0.06;
  oppTapP = idealTapP() + (Math.random()<0.5?-1:1)*oppE*(Math.random()*0.8+0.4);
  oppJumped=false;
  keeperSide = Math.random()<0.5?-1:1;
  p=0; jumped=false; jumpP=0; yourE=1; result=null; ballFly=null;
  state='cross';
  if(playN<=2){ msg='クロスが来る！ 落下点でジャンプの頂点を合わせてヘッド'; msgT=180; subMsg=''; }
  else { msg=''; msgT=0; subMsg=''; }
  S.cross();
}

function ballPos(){
  const pp=Math.min(1.12,p);
  // arc from feeder to the spot (drops to head height at p=1)
  const x=feederX+(SPOT.x-feederX)*pp + ballBreak*Math.sin(pp*Math.PI);
  const yEnd=SPOT.y-40;                          // head height at contact
  const y=90+(yEnd-90)*pp - Math.sin(pp*Math.PI)*70;
  return {x,y};
}
function jumpHeight(elapsed){ // parabola peaking at JUMP_LAG
  if(elapsed<0||elapsed>JUMP_T) return 0;
  const u=elapsed/JUMP_T; return Math.sin(u*Math.PI)*JUMP_H;
}

function header(){
  if(state!=='cross'||jumped) return;
  jumped=true; jumpP=p;
  yourE=Math.abs((p+JUMP_LAG/dropDur)-1.0);
  S.head();
}
function resolveDuel(){
  const win = yourE < oppE;
  const sh=ballPos();
  if(!win || yourE>0.2){ result='lost'; msg = yourE>0.2?'ジャンプが合わない…':'競り負けた…'; miss++; streak=0; S.lost(); shakeT=8; shakeM=3;
    ballFly={x0:SPOT.x,y0:SPOT.y-40,x1:SPOT.x+(Math.random()<0.5?-200:200),y1:250,t:0,dur:0.5,cleared:true};
    endPlay(); return; }
  // won the duel -> quality by yourE
  if(yourE<0.055){ result='goal'; goals++; streak++; if(streak>best){best=streak;saveBest();}
    msg = streak>=3?`${streak}試合連続ヘッド弾！`:'ドンピシャ！ ヘディングゴール！'; S.goal(); setTimeout(S.cheer,60);
    flash=0.5; flashCol='#eafff0'; shakeT=14; shakeM=5;
    const tx = keeperSide<0? GOAL.R-30:GOAL.L+30;      // aim away from keeper
    ballFly={x0:SPOT.x,y0:SPOT.y-40,x1:tx,y1:GOAL.line+6,t:0,dur:0.32}; burst(tx,GOAL.line+10,'#eaffe0',16);
  } else if(yourE<0.12){ result='save'; miss++; streak=0; msg='当たりが弱い… GKセーブ'; S.save(); shakeT=6; shakeM=2;
    ballFly={x0:SPOT.x,y0:SPOT.y-40,x1:450,y1:GOAL.line+16,t:0,dur:0.36};
  } else { result='wide'; miss++; streak=0; msg='枠を捉えられず…'; S.whiff();
    ballFly={x0:SPOT.x,y0:SPOT.y-40,x1:GOAL.L-40,y1:GOAL.line+10,t:0,dur:0.4}; }
  endPlay();
}
function endPlay(){
  state='result'; msgT=115;
  if(result!=='goal' && miss>=3){ setTimeout(()=>{ state='over'; msg='3ミス・終了'; msgT=99999; }, 850); }
  else setTimeout(()=>{ if(state==='result') nextCross(); }, result==='goal'?1150:1000);
}

function burst(x,y,col,n){ for(let i=0;i<n;i++){ const a=Math.random()*6.28,sp=1+Math.random()*5;
  parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-2,life:1,col,r:2+Math.random()*3}); } }

// ---- input ----
function press(){ const a=ac(); if(a&&a.state==='suspended')a.resume();
  if(state==='ready'||state==='over'){ reset(); return; }
  if(state==='cross'){ header(); }
}
cv.addEventListener('pointerdown',e=>{ e.preventDefault(); press(); });
window.addEventListener('keydown',e=>{ if(e.code==='Space'||e.code==='Enter'){ e.preventDefault(); press(); } });

// ---- update ----
let last=0;
function update(dt){
  t+=dt; if(msgT>0)msgT--; if(flash>0)flash=Math.max(0,flash-dt*2); if(shakeT>0)shakeT--;
  if(state==='cross'){
    p+=dt/dropDur;
    if(!oppJumped && p>=oppTapP){ oppJumped=true; }
    if(p>0.6 && ((p*14|0)!==((p-dt/dropDur)*14|0))) S.tick();
    if(p>=1.0){ resolveDuel(); }
  } else if(state==='result' && ballFly){ ballFly.t+=dt; }
  for(let i=parts.length-1;i>=0;i--){ const q=parts[i]; q.x+=q.vx;q.y+=q.vy;q.vy+=0.16;q.life-=dt*1.0; if(q.life<=0)parts.splice(i,1); }
}

// ---- draw ----
function rr(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }

function drawField(){
  const g=ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,'#0f3a1e'); g.addColorStop(1,'#1e7a40');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#0a1c10'; ctx.fillRect(0,0,W,40);
  for(const c of crowd){ const yy=c.y+Math.sin(t*3+c.b)*1.1; ctx.fillStyle=c.c; ctx.globalAlpha=.5; ctx.fillRect(c.x,yy,5,4); }
  ctx.globalAlpha=1;
  for(let i=0;i<7;i++){ ctx.fillStyle=i%2?'rgba(255,255,255,.04)':'rgba(0,0,0,.05)'; ctx.fillRect(0,60+i*78,W,78); }
  // net
  ctx.fillStyle='rgba(255,255,255,.06)'; ctx.fillRect(GOAL.L,GOAL.line-26,GOAL.R-GOAL.L,26);
  ctx.strokeStyle='rgba(255,255,255,.22)'; ctx.lineWidth=1;
  for(let x=GOAL.L;x<=GOAL.R;x+=15){ ctx.beginPath(); ctx.moveTo(x,GOAL.line-26); ctx.lineTo(x,GOAL.line); ctx.stroke(); }
  ctx.strokeStyle='#fff'; ctx.lineWidth=7; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(GOAL.L,GOAL.line); ctx.lineTo(GOAL.L,GOAL.line-26); ctx.lineTo(GOAL.R,GOAL.line-26); ctx.lineTo(GOAL.R,GOAL.line); ctx.stroke();
  ctx.strokeStyle='rgba(255,255,255,.4)'; ctx.lineWidth=3; ctx.strokeRect(GOAL.L-70,GOAL.line,GOAL.R-GOAL.L+140,150);
  // keeper
  const kx = 450 + keeperSide*54;
  ctx.save(); ctx.translate(kx,GOAL.line+8); ctx.fillStyle='#ffcf3f'; rr(-11,-24,22,26,6); ctx.fill();
  ctx.fillStyle='#f0c39a'; ctx.beginPath(); ctx.arc(0,-30,7,0,6.28); ctx.fill();
  ctx.strokeStyle='#ffcf3f'; ctx.lineWidth=6; ctx.lineCap='round'; ctx.beginPath(); ctx.moveTo(0,-14); ctx.lineTo(-16,-22); ctx.stroke(); ctx.beginPath(); ctx.moveTo(0,-14); ctx.lineTo(16,-22); ctx.stroke(); ctx.restore();
}
function jumper(x,baseY,col,elapsed,isYou){
  const jh=jumpHeight(elapsed);
  ctx.save(); ctx.translate(x,baseY-jh);
  ctx.fillStyle='rgba(0,0,0,.24)'; ctx.beginPath(); ctx.ellipse(0,20+jh*0.1,16,5,0,0,6.28); ctx.fill();
  ctx.strokeStyle='#20304a'; ctx.lineWidth=7; ctx.lineCap='round';
  const sp=jh>2?12:2; ctx.beginPath(); ctx.moveTo(0,4); ctx.lineTo(-6,20-sp*0.3); ctx.stroke(); ctx.beginPath(); ctx.moveTo(0,4); ctx.lineTo(6,20-sp*0.3); ctx.stroke();
  // arms up when jumping
  ctx.strokeStyle=col; ctx.lineWidth=7; const au=jh>2?-24:-8;
  ctx.beginPath(); ctx.moveTo(0,-14); ctx.lineTo(-12,au); ctx.stroke(); ctx.beginPath(); ctx.moveTo(0,-14); ctx.lineTo(12,au); ctx.stroke();
  ctx.fillStyle=col; rr(-12,-28,24,30,7); ctx.fill();
  ctx.fillStyle='#f0c39a'; ctx.beginPath(); ctx.arc(0,-36,9,0,6.28); ctx.fill();
  ctx.restore();
}
function drawPlayers(){
  const ye = jumped? (p-jumpP)*dropDur : -1;
  const oe = oppJumped? (p-oppTapP)*dropDur : -1;
  // opponent slightly to one side, you at spot
  jumper(SPOT.x+28, SPOT.y+30, '#e8544e', oppJumped?oe:-1, false);
  jumper(SPOT.x-6, SPOT.y+30, '#2f7fd6', jumped?ye:-1, true);
}
function drawBall(){
  if(state==='cross'){ const b=ballPos();
    ctx.strokeStyle='rgba(255,255,255,.3)'; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(feederX,90); ctx.lineTo(b.x,b.y); ctx.stroke();
    ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(b.x,b.y,7,0,6.28); ctx.fill(); ctx.strokeStyle='#123'; ctx.lineWidth=1.2; ctx.stroke();
    // timing gauge with sweet spot at idealTapP
    const bw=320,bx=(W-bw)/2,by=H-46; ctx.fillStyle='rgba(6,18,10,.6)'; rr(bx,by,bw,12,6); ctx.fill();
    const it=idealTapP(); ctx.fillStyle='rgba(140,255,168,.6)'; ctx.fillRect(bx+bw*(it-0.05),by,bw*0.1,12);
    ctx.fillStyle='#fff'; ctx.fillRect(bx+bw*Math.min(1,p)-2,by-3,4,18);
  }
  if(ballFly){ const pr=Math.min(1,ballFly.t/ballFly.dur);
    const x=ballFly.x0+(ballFly.x1-ballFly.x0)*pr, y=ballFly.y0+(ballFly.y1-ballFly.y0)*pr - Math.sin(pr*Math.PI)*30;
    ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(x,y,7,0,6.28); ctx.fill(); ctx.strokeStyle='#123'; ctx.lineWidth=1.2; ctx.stroke(); }
}

function hud(x,y,w,h,lab,val,col){
  ctx.fillStyle='rgba(6,20,12,.62)'; rr(x,y,w,h,9); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.6)'; ctx.font='11px sans-serif'; ctx.textAlign='left'; ctx.fillText(lab,x+12,y+19);
  ctx.fillStyle=col||'#fff'; ctx.font='bold 24px sans-serif'; ctx.fillText(val,x+12,y+44);
}
function drawHUD(){
  hud(20,14,150,56,'ゴール GOALS',''+goals,'#8effa8');
  hud(W/2-75,14,150,56,'連続 STREAK',''+streak,'#ffd23e');
  const mc=miss>=2?'#ff6a5a':'#fff';
  hud(W-170,14,150,56,'ミス MISS',miss+' /3',mc); ctx.textAlign='left';
  ctx.fillStyle='rgba(255,255,255,.5)'; ctx.font='12px sans-serif'; ctx.fillText('自己ベスト連続 '+best,22,88);
}
function drawMsg(){
  if(msgT>0&&msg){ ctx.textAlign='center'; ctx.font='bold 28px sans-serif'; const w=ctx.measureText(msg).width;
    const yb = subMsg?452:466;
    ctx.fillStyle='rgba(6,18,10,.8)'; rr(450-w/2-18,yb,w+36,42,10); ctx.fill();
    ctx.fillStyle='#fff'; ctx.fillText(msg,450,yb+28);
    if(subMsg){ ctx.font='bold 17px sans-serif'; ctx.fillStyle='rgba(140,255,168,.95)'; ctx.fillText(subMsg,450,yb+52); }
    ctx.textAlign='left'; }
}
function drawHint(){ if(state==='cross'){ ctx.textAlign='center'; ctx.fillStyle='rgba(255,255,255,.7)'; ctx.font='14px sans-serif';
  ctx.fillText('少し早めにタップ＝ジャンプの頂点でボールを叩く（緑が目安）',450,H-22); ctx.textAlign='left'; } }
function drawOverlay(){
  ctx.fillStyle='rgba(6,16,10,.76)'; ctx.fillRect(0,0,W,H); ctx.textAlign='center';
  ctx.fillStyle='rgba(140,255,168,.9)'; ctx.font='600 15px sans-serif'; ctx.fillText('SOCCER · AERIAL DUEL',450,138);
  ctx.fillStyle='#fff'; ctx.font='bold 50px sans-serif'; ctx.fillText('アエリアルデュエル',450,196);
  ctx.fillStyle='#ffd23e'; ctx.font='bold 21px sans-serif'; ctx.fillText('Win the Header',450,228);
  ctx.fillStyle='rgba(255,255,255,.9)'; ctx.font='16px sans-serif';
  const L=['クロスの落下点で相手DFと競り合うヘディング勝負！',
    'ジャンプは頂点まで一瞬かかる。少し早めにタップ。',
    '頂点でボールを叩ければ相手に競り勝ち、ドンピシャ弾に。',
    'タイミングが甘いと弱いヘッドでGKにセーブされる。',
    '競り負け・枠外・セーブはミス。3ミスで終了。'];
  for(let i=0;i<L.length;i++) ctx.fillText(L[i],450,266+i*25);
  ctx.fillStyle='#e8544e'; rr(450-95,424,190,54,27); ctx.fill();
  ctx.fillStyle='#fff'; ctx.font='bold 24px sans-serif'; ctx.fillText('キックオフ',450,458);
  ctx.fillStyle='rgba(255,255,255,.6)'; ctx.font='14px sans-serif'; ctx.fillText('タップ / Space でジャンプ＆ヘッド',450,502);
  ctx.textAlign='left';
}
function drawOver(){
  ctx.fillStyle='rgba(6,16,10,.84)'; ctx.fillRect(0,0,W,H); ctx.textAlign='center';
  ctx.fillStyle='#fff'; ctx.font='bold 46px sans-serif'; ctx.fillText('3ミス・終了',450,232);
  ctx.fillStyle='#8effa8'; ctx.font='bold 30px sans-serif'; ctx.fillText('ヘディング弾 '+goals,450,286);
  ctx.fillStyle='#ffd23e'; ctx.font='20px sans-serif'; ctx.fillText('自己ベスト連続 '+best,450,322);
  ctx.fillStyle='#2f7fd6'; rr(450-95,372,190,54,27); ctx.fill();
  ctx.fillStyle='#fff'; ctx.font='bold 22px sans-serif'; ctx.fillText('もう一度',450,406);
  ctx.textAlign='left';
}

function render(){
  ctx.save();
  if(shakeT>0){ ctx.translate((Math.random()*2-1)*shakeM,(Math.random()*2-1)*shakeM); }
  drawField(); drawPlayers(); drawBall();
  for(const q of parts){ ctx.globalAlpha=Math.max(0,q.life); ctx.fillStyle=q.col; ctx.beginPath(); ctx.arc(q.x,q.y,q.r,0,6.28); ctx.fill(); }
  ctx.globalAlpha=1;
  drawHUD(); drawMsg(); drawHint();
  ctx.restore();
  if(flash>0){ ctx.fillStyle=flashCol; ctx.globalAlpha=flash; ctx.fillRect(0,0,W,H); ctx.globalAlpha=1; }
  if(state==='ready') drawOverlay();
  if(state==='over') drawOver();
}
function loop(ts){ if(!last)last=ts; let dt=(ts-last)/1000; last=ts; if(dt>0.05)dt=0.05; update(dt); render(); requestAnimationFrame(loop); }
requestAnimationFrame(loop);

if(TEST){
  window.__ad={
    get state(){return state;},
    get p(){return p;},
    get idealP(){return idealTapP();},
    get result(){return result;},
    get count(){return {goals,miss,streak};},
    header(){ header(); },
    tap(){ if(state==='ready'||state==='over')reset(); }
  };
}
})();
</script>
</body>
</html>
