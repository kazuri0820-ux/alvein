<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>無回転シュート (Knuckleball)</title>
<style>
  html,body{margin:0;height:100%;background:#0a0f1a;overflow:hidden;
    font-family:-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  #stage{position:relative;width:100vw;height:100vh;max-width:calc(100vh*1.5);max-height:calc(100vw/1.5);aspect-ratio:900/600;}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;border-radius:6px;}
</style>
</head>
<body>
<div id="wrap"><div id="stage"><canvas id="cv"></canvas></div></div>
<script>
(function(){
const W=900,H=600,cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let DPR=1;
function fit(){DPR=Math.min(2,window.devicePixelRatio||1);cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
fit();addEventListener('resize',fit);

// ---------- audio ----------
let AC=null;function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function tone(f,d,type,v,sweep){const a=ac();if(!a)return;const t=a.currentTime,o=a.createOscillator(),g=a.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(sweep)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+sweep),t+d);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v||0.2,t+0.008);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+0.02);}
function noise(d,v,hp){const a=ac();if(!a)return;const t=a.currentTime,n=Math.floor(a.sampleRate*d),buf=a.createBuffer(1,n,a.sampleRate),ch=buf.getChannelData(0);
  for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource();s.buffer=buf;
  const f=a.createBiquadFilter();f.type='highpass';f.frequency.value=hp||600;const g=a.createGain();g.gain.value=v||0.2;
  s.connect(f);f.connect(g);g.connect(a.destination);s.start(t);s.stop(t+d+0.02);}
const S={
  whoosh:()=>{tone(300,0.2,'sine',0.05,300);},
  save:()=>{noise(0.05,0.16,500);[680,900,1120].forEach((f,i)=>setTimeout(()=>tone(f,0.11,'triangle',0.18),i*70));},
  goal:()=>{noise(0.16,0.18,300);tone(150,0.3,'sawtooth',0.14,-60);},
  streak:()=>{[660,880,1100,1320].forEach((f,i)=>setTimeout(()=>tone(f,0.1,'triangle',0.16),i*60));},
  over:()=>{[440,330,247,175].forEach((f,i)=>setTimeout(()=>tone(f,0.3,'triangle',0.2),i*160));}
};

// ---------- geometry ----------
const GLY=456, GOALL=298, GOALR=602, KICKY=78;

// ---------- state ----------
let state='title', phase='fly', t=0, plays=0;
let score=0, combo=0, best=+(localStorage.getItem('knuckle_best')||0);
let saves=0, fails=0, lvl=1;
let clock=0, catchT=1400, catchW=42, vmax=0.34;
let startX=450, finalX=450, curve=60, wobA=26, wobF=9, ph=0, ph2=0;
let gkX=450, gkTarget=450, ballX=450, ballY=KICKY;
let result=null, resultT=0, msg='';
let shake=0, flash=0, flashCol='#fff', last=performance.now();
let parts=[], pops=[], trail=[];

function rnd(a,b){return a+Math.random()*(b-a);}
function chance(p){return Math.random()<p;}
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function lerp(a,b,u){return a+(b-a)*u;}
function easeIn(u){return u*u;}
function easeOut(u){return 1-Math.pow(1-u,2);}

function params(){ return { catchT:Math.max(820,1480-lvl*80), catchW:Math.max(26,44-lvl*2.4), curve:70+lvl*16, wobA:22+lvl*7, wobF:8+lvl*1.4 }; }

// fixed randoms per shot (no Math.random in path so it's smooth/deterministic per shot)
function ballPathX(u){
  const base=lerp(startX,finalX,easeIn(u));
  const fade=Math.sin(Math.min(1,u)*Math.PI);                 // 0 at ends, 1 mid
  const sw=curve*Math.sin(u*Math.PI + ph)*fade;               // big swerve, settles by the end
  const wob=wobA*Math.sin(u*wobF + ph2)*fade;                 // knuckle wobble
  return base+sw+wob;
}

function reset(){state='title';score=0;combo=0;saves=0;fails=0;lvl=1;plays=0;result=null;parts=[];pops=[];trail=[];}
function newShot(){
  plays++; lvl=Math.min(7,1+Math.floor(saves/4));
  const p=params(); catchT=p.catchT; catchW=p.catchW; curve=p.curve*(chance(0.5)?1:-1); wobA=p.wobA; wobF=p.wobF;
  ph=rnd(0,6.28); ph2=rnd(0,6.28);
  startX=rnd(390,510); finalX=rnd(GOALL+34,GOALR-34);
  gkX=450; gkTarget=450; clock=0; ballY=KICKY; ballX=startX; trail=[];
  result=null; phase='fly'; msg=''; resultT=0;
  if(ac())S.whoosh();
}
function start(){ if(!ac())ac(); if(AC&&AC.state==='suspended')AC.resume(); reset(); state='play'; newShot(); }

function resolve(kind){
  phase='result'; result=kind; resultT=0;
  if(kind==='save'){
    saves++; combo++; const hard=Math.abs(curve)>110||catchW<32;
    const add=Math.round((hard?150:105)*(1+Math.min(9,combo-1)*0.16)); score+=add;
    S.save(); flash=1;flashCol='#9fe0ff';shake=6; burst(gkX,GLY,'#bfe6ff',18,6);
    pop(gkX,GLY-40,'ナイスセーブ！ +'+add,'#dff3ff');
    if(hard)pop(gkX,GLY-66,'ブレ球を正面で！','#9fe0ff');
    if(combo>=2)pop(gkX,GLY-14,'コンボ x'+combo,'#ffd24d');
    if(combo>0&&combo%5===0)S.streak();
    msg='軌道を読み切って正面でキャッチ！';
  } else {
    fails++; combo=0; flash=1;flashCol='#ff5b5b';shake=8; S.goal();
    msg='ブレ球に逆を突かれた…被弾';
    pop(finalX,GLY-24,'GOAL','#ffb0b0');
  }
  if(fails>=3){ state='over'; resultT=0; S.over(); if(score>best){best=score;localStorage.setItem('knuckle_best',best);} }
}

// ---------- input ----------
function px(e){ const r=cv.getBoundingClientRect(); return (e.clientX-r.left)/r.width*W; }
cv.addEventListener('pointerdown',e=>{e.preventDefault(); if(state!=='play'){start();return;} gkTarget=clamp(px(e),GOALL,GOALR);});
cv.addEventListener('pointermove',e=>{ if(state==='play'&&phase==='fly'){ gkTarget=clamp(px(e),GOALL,GOALR); } });
addEventListener('keydown',e=>{ if(e.code==='ArrowLeft'){e.preventDefault();gkTarget=clamp(gkTarget-46,GOALL,GOALR);}
  else if(e.code==='ArrowRight'){e.preventDefault();gkTarget=clamp(gkTarget+46,GOALL,GOALR);}
  else if(e.code==='Space'||e.code==='Enter'){e.preventDefault(); if(state!=='play')start();} });

// ---------- particles ----------
function burst(x,y,c,n,sp){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=rnd(sp*0.3,sp);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:1,c});}}
function pop(x,y,txt,c){pops.push({x,y,txt,c,life:1});}

// ---------- update ----------
function update(dt){
  shake*=Math.pow(0.86,dt/16.7); if(shake<0.3)shake=0;
  flash*=Math.pow(0.9,dt/16.7);
  for(const p of parts){p.vx*=0.96;p.vy=p.vy*0.96+0.28;p.x+=p.vx*dt/16.7;p.y+=p.vy*dt/16.7;p.life-=dt/16.7*0.026;}
  parts=parts.filter(p=>p.life>0);
  for(const p of pops){p.y-=dt/16.7*0.5;p.life-=dt/16.7*0.02;}
  pops=pops.filter(p=>p.life>0);

  if(state!=='play'){ if(state==='over')resultT+=dt/1000; return; }
  t+=dt;
  // GK hands ease toward target, speed-capped
  const d=gkTarget-gkX; gkX += clamp(d,-vmax*dt,vmax*dt);
  if(phase==='fly'){
    clock+=dt; const u=clamp(clock/catchT,0,1);
    ballX=ballPathX(u); ballY=lerp(KICKY,GLY,easeIn(u));
    trail.push({x:ballX,y:ballY}); if(trail.length>18)trail.shift();
    if(clock>=catchT){ resolve(Math.abs(ballX-gkX)<catchW?'save':'goal'); }
    return;
  }
  if(phase==='result'){
    resultT+=dt/1000;
    if(result==='goal'){ ballY=Math.min(GLY+40,ballY+0.18*dt); }
    if(resultT>1.1 && state==='play') newShot();
    return;
  }
}

// ---------- render ----------
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function drawScene(){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#16233a');g.addColorStop(0.5,'#1c5a2c');g.addColorStop(1,'#164a24');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  for(let i=0;i<8;i++){ctx.fillStyle=i%2?'rgba(255,255,255,0.04)':'rgba(0,0,0,0.045)';ctx.fillRect(0,GLY-120+i*70,W,35);}
  // goal
  ctx.strokeStyle='#eef3f5';ctx.lineWidth=7;ctx.lineJoin='round';
  ctx.beginPath();ctx.moveTo(GOALL,GLY);ctx.lineTo(GOALL,GLY-150);ctx.lineTo(GOALR,GLY-150);ctx.lineTo(GOALR,GLY);ctx.stroke();
  ctx.strokeStyle='rgba(255,255,255,0.16)';ctx.lineWidth=1;
  for(let x=GOALL+14;x<GOALR;x+=20){ctx.beginPath();ctx.moveTo(x,GLY-150);ctx.lineTo(x,GLY);ctx.stroke();}
  for(let y=GLY-140;y<GLY;y+=18){ctx.beginPath();ctx.moveTo(GOALL,y);ctx.lineTo(GOALR,y);ctx.stroke();}
  // goal line
  ctx.strokeStyle='rgba(255,255,255,0.4)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(GOALL,GLY);ctx.lineTo(GOALR,GLY);ctx.stroke();
}

function render(){
  ctx.save();
  if(shake>0)ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
  drawScene();

  if(state==='play'){
    // kicker
    ctx.fillStyle='rgba(0,0,0,0.2)';ctx.beginPath();ctx.ellipse(startX,KICKY+14,14,5,0,0,6.28);ctx.fill();
    ctx.fillStyle='#e23c3c';rr(startX-9,KICKY-12,18,26,6);ctx.fill();
    ctx.fillStyle='#f2c9a0';ctx.beginPath();ctx.arc(startX,KICKY-18,7,0,6.28);ctx.fill();
    // ball trail (shows the wobble)
    for(let i=0;i<trail.length;i++){const p=trail[i];ctx.globalAlpha=i/trail.length*0.4;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(p.x,p.y,4,0,6.28);ctx.fill();}
    ctx.globalAlpha=1;
    // GK hands (catch zone)
    const gy=GLY;
    ctx.strokeStyle='rgba(255,210,62,0.35)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(gkX-catchW,gy+2);ctx.lineTo(gkX+catchW,gy+2);ctx.stroke();
    ctx.fillStyle='#ffcf3e';ctx.beginPath();ctx.arc(gkX-13,gy-6,9,0,6.28);ctx.arc(gkX+13,gy-6,9,0,6.28);ctx.fill();
    ctx.fillStyle='#1f9d55';rr(gkX-11,gy-2,22,30,7);ctx.fill();
    ctx.fillStyle='#f2c9a0';ctx.beginPath();ctx.arc(gkX,gy-10,7,0,6.28);ctx.fill();
    // ball
    const br=lerp(6,11,clamp(clock/catchT,0,1));
    let bx=ballX, by=ballY;
    if(phase==='result'&&result==='save'){ bx=gkX; by=GLY-4; }
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(bx,by,br,0,6.28);ctx.fill();
    ctx.strokeStyle='#334';ctx.lineWidth=1;ctx.beginPath();ctx.arc(bx,by,br*0.5,0,6.28);ctx.stroke();
  }

  for(const p of parts){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,3.2,0,6.28);ctx.fill();}
  ctx.globalAlpha=1;
  for(const p of pops){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.font='bold 22px sans-serif';ctx.textAlign='center';ctx.fillText(p.txt,p.x,p.y);}
  ctx.globalAlpha=1;

  // HUD
  ctx.textAlign='left';ctx.fillStyle='#fff';ctx.font='bold 26px sans-serif';ctx.fillText('SCORE '+score,20,36);
  ctx.textAlign='right';ctx.fillStyle='rgba(255,255,255,0.9)';ctx.font='14px sans-serif';ctx.fillText('セーブ '+saves+'  Lv'+lvl,W-20,24);
  ctx.fillText('失点',W-92,46);
  for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(W-60+i*20,41,7,0,6.28);ctx.fillStyle=i<fails?'#ff5b5b':'rgba(255,255,255,0.25)';ctx.fill();}
  if(combo>=2){ctx.textAlign='center';ctx.fillStyle='#ffd24d';ctx.font='bold 18px sans-serif';ctx.fillText('コンボ x'+combo,W/2,H-40);}

  if(state==='play'&&phase==='fly'){ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,0.9)';ctx.font='bold 15px sans-serif';
    ctx.fillText('ブレて曲がる無回転シュート。軌道を読んでGKを動かし、到達点を正面で止めろ（ドラッグ/←→）',W/2,40);}
  if(state==='play'&&phase==='result'&&msg){ctx.textAlign='center';ctx.fillStyle=result==='save'?'#9ff0b8':'#ff9a9a';ctx.font='bold 22px sans-serif';ctx.fillText(msg,W/2,40);}

  if(state==='title'){
    ctx.fillStyle='rgba(6,10,18,0.72)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='bold 44px sans-serif';ctx.fillText('無回転シュート',W/2,132);
    ctx.fillStyle='#ffd23e';ctx.font='bold 22px sans-serif';ctx.fillText('Knuckleball',W/2,168);
    ctx.fillStyle='rgba(255,255,255,0.92)';ctx.font='16px sans-serif';
    ctx.fillText('GK視点。不規則にブレて曲がる無回転シュートの軌道を追って止めろ',W/2,218);
    ctx.fillStyle='rgba(255,255,255,0.66)';ctx.font='14px sans-serif';
    ctx.fillText('ドラッグ（またはマウス移動 / ← →）でGKを左右に動かし、ボールの到達点に手を合わせる',W/2,256);
    ctx.fillText('ボールは大きく揺れて曲がるので、揺さぶりに惑わされず“最後に収まる位置”を読む',W/2,278);
    ctx.fillText('到達の瞬間に手が届いていればセーブ、逆を突かれると失点',W/2,300);
    ctx.fillText('大きくブレる球ほど高得点。上級ほど速く曲がりも激しく手も狭い。3失点で交代',W/2,322);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で開始',W/2,400);
    ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='14px sans-serif';ctx.fillText('BEST '+best+'　　ドラッグでGKを操作',W/2,432);
  }
  if(state==='over'){
    ctx.fillStyle='rgba(6,10,18,0.8)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#ff6b6b';ctx.font='bold 46px sans-serif';ctx.fillText('3失点…交代',W/2,222);
    ctx.fillStyle='#fff';ctx.font='bold 40px sans-serif';ctx.fillText('SCORE '+score,W/2,290);
    ctx.fillStyle='rgba(255,255,255,0.85)';ctx.font='19px sans-serif';ctx.fillText('セーブ '+saves+'   BEST '+best,W/2,330);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で もう一度',W/2,402);
  }

  if(flash>0.02){ctx.globalAlpha=flash*0.5;ctx.fillStyle=flashCol;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}
  ctx.restore();

  ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,0.4)';ctx.font='12px sans-serif';
  ctx.fillText('揺れて曲がる無回転の到達点を読み、GKを動かして正面で止める。逆を突かれると失点。3失点で交代',W/2,H-8);
}

function frame(ts){let dt=ts-last;last=ts;if(dt>60)dt=60;if(dt<0)dt=0;update(dt);render();requestAnimationFrame(frame);}
requestAnimationFrame(frame);

// ---------- test hook ----------
window.__kn={
  start, steer:(x)=>{ gkTarget=clamp(x,GOALL,GOALR); },
  get state(){return state;},
  get score(){return score;},
  get saves(){return saves;},
  get fails(){return fails;},
  get info(){return {state,phase,gkX,ballX,finalX,catchW,clock,catchT,result,saves,fails,lvl};}
};
})();
</script>
</body>
</html>
