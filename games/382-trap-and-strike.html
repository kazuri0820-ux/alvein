<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>落としてミドル (Trap and Strike)</title>
<style>
  html,body{margin:0;height:100%;background:#07100a;overflow:hidden;
    font-family:-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  #stage{position:relative;width:100vw;height:100vh;max-width:calc(100vh*1.5);max-height:calc(100vw/1.5);aspect-ratio:900/600;}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;border-radius:6px;}
</style>
</head>
<body>
<div id="wrap"><div id="stage"><canvas id="cv"></canvas></div></div>
<script>
(function(){
const W=900,H=600,cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let DPR=1;
function fit(){DPR=Math.min(2,window.devicePixelRatio||1);cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
fit();addEventListener('resize',fit);

// ---------- audio ----------
let AC=null;function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function tone(f,d,type,v,sweep){const a=ac();if(!a)return;const t=a.currentTime,o=a.createOscillator(),g=a.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(sweep)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+sweep),t+d);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v||0.2,t+0.008);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+0.02);}
function noise(d,v,hp){const a=ac();if(!a)return;const t=a.currentTime,n=Math.floor(a.sampleRate*d),buf=a.createBuffer(1,n,a.sampleRate),ch=buf.getChannelData(0);
  for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource();s.buffer=buf;
  const f=a.createBiquadFilter();f.type='highpass';f.frequency.value=hp||600;const g=a.createGain();g.gain.value=v||0.2;
  s.connect(f);f.connect(g);g.connect(a.destination);s.start(t);s.stop(t+d+0.02);}
const S={
  loft:()=>{tone(300,0.06,'sine',0.04);},
  trap:()=>{tone(360,0.05,'sine',0.06);noise(0.03,0.06,500);},
  strike:()=>{noise(0.05,0.18,900);tone(280,0.06,'square',0.09,-90);},
  good:()=>{[680,940,1220].forEach((f,i)=>setTimeout(()=>tone(f,0.11,'triangle',0.16),i*56));},
  big:()=>{[600,800,1000,1250].forEach((f,i)=>setTimeout(()=>tone(f,0.12,'triangle',0.17),i*80));},
  bad:()=>{noise(0.2,0.24,240);tone(150,0.24,'sawtooth',0.13,-50);},
  streak:()=>{[700,930,1170,1400].forEach((f,i)=>setTimeout(()=>tone(f,0.1,'triangle',0.16),i*60));},
  over:()=>{[440,330,247,175].forEach((f,i)=>setTimeout(()=>tone(f,0.3,'triangle',0.2),i*160));}
};

// ---------- geometry ----------
const GOAL={x:452,y:120}, GW=300, GH=72;
const GK={x:452,y:176};
const PASSER={x:168,y:352};                     // teammate who lofts the lay-off in
const FEET={x:452,y:432};                        // you (striker) at the edge of the box
function ballTrap(u){ return {x:lerp(PASSER.x,FEET.x,u), y:lerp(PASSER.y,FEET.y,u)-96*Math.sin(Math.PI*u)}; }  // lofted arc

// ---------- state ----------
let state='title', phase='trap', t=0, plays=0;
let score=0, combo=0, best=+(localStorage.getItem('ls_best')||0);
let outs=0, fails=0, lvl=1;   // outs = goals
let clock=0, trapIdeal=540, trapW=140, strikeIdeal=300, strikeW=130, trapGrace=90;
let acted=false, trapped=false, trapAt=0, result=null, resultT=0, msg='', animU=0, quick=false, gkSide=1;
let shake=0, flash=0, flashCol='#fff', last=performance.now();
let parts=[], pops=[];

function rnd(a,b){return a+Math.random()*(b-a);}
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function lerp(a,b,u){return a+(b-a)*u;}
function easeOut(u){return 1-Math.pow(1-u,2);}

function params(){ return {
  trapIdeal:rnd(440,640)-lvl*6,
  trapW:Math.max(90,150-lvl*8),
  strikeIdeal:rnd(250,360),
  strikeW:Math.max(90,150-lvl*8)
};}

function reset(){state='title';score=0;combo=0;outs=0;fails=0;lvl=1;plays=0;result=null;parts=[];pops=[];}
function newPlay(){
  plays++; lvl=Math.min(7,1+Math.floor(outs/4));
  const p=params(); trapIdeal=Math.max(300,p.trapIdeal); trapW=p.trapW; strikeIdeal=p.strikeIdeal; strikeW=p.strikeW;
  gkSide=(Math.random()<0.5?-1:1);
  phase='trap'; clock=0; acted=false; trapped=false; trapAt=0; result=null; resultT=0; msg=''; animU=0; quick=false;
  S.loft();
}
function start(){ if(!ac())ac(); if(AC&&AC.state==='suspended')AC.resume(); reset(); state='play'; newPlay(); }

function act(){
  if(state==='title'){start();return;}
  if(state==='over'){ if(resultT>0.4){reset();start();} return; }
  if(state!=='play') return;
  if(phase==='trap'&&!trapped){
    const err=clock-trapIdeal;
    if(err< -trapW){ acted=true; resolve('earlyTrap'); return; }   // reach for it early -> miscontrol
    if(err>  trapW){ acted=true; resolve('lateTrap'); return; }     // ball drops past you / nicked away
    trapped=true; trapAt=clock; S.trap(); phase='strike'; clock=0;  // clean first touch -> ball sits up
    return;
  }
  if(phase==='strike'&&!acted){
    const err=clock-strikeIdeal;
    if(err< -strikeW){ acted=true; resolve('earlyStrike'); return; } // swing before it's set -> sliced/skied
    if(err>  strikeW){ acted=true; resolve('lateStrike'); return; }  // ball rolls away / defender blocks
    acted=true; quick=Math.abs(err)<=strikeW*0.4; resolve('goal');
    return;
  }
}

function resolve(k){
  phase='result'; result=k; resultT=0; animU=0;
  if(k==='goal'){
    outs++; combo++;
    let add=Math.round((quick?240:150)*(1+Math.min(9,combo-1)*0.14)); score+=add;
    S.strike(); setTimeout(S.good,110); if(quick)setTimeout(S.big,190);
    flash=1;flashCol='#8affa0';shake=8; burst(GOAL.x+gkSide*70,GOAL.y+GH*0.5,'#8affa0',20,8);
    pop(W/2,250,(quick?'完璧なトラップから振り抜いた——弾丸ミドルがゴール！ +':'落ち着いて止めて振り抜き——ゴール！ +')+add,'#d6ffe0');
    if(combo>=2)pop(W/2,214,'コンボ x'+combo,'#ffd24d');
    if(combo>0&&combo%5===0)S.streak();
    msg=quick?'ワンタッチで完璧に置き、間髪入れず振り抜いた弾丸ミドルがGKの逆サイドへ突き刺さった！':'浮き球をピタリと止めてから振り抜き、ゴール左右の隅へ流し込んだ——芸術的な一連の流れ！';
  } else {
    fails++; combo=0; flash=1;flashCol='#ff5b5b';shake=8; S.bad();
    if(k==='earlyTrap') msg='トラップが早い…落ちてくる前に足を出してしまい、ボールが足元から大きく弾んで奪われた';
    else if(k==='lateTrap') msg='止めるのが遅い…浮き球が足元を過ぎて流れ、寄せた相手にクリアされた';
    else if(k==='earlyStrike') msg='振るのが早い…ボールが落ち着く前に振り抜き、体が開いて枠の上へふかした';
    else msg='振るのが遅い…ボールが転がって離れ、詰めてきた相手にシュートをブロックされた';
    pop(W/2,250,(k==='earlyTrap'||k==='lateTrap')?'トラップ失敗…':'シュート失敗…','#ffb0b0');
  }
  if(fails>=3){ state='over'; resultT=0; S.over(); if(score>best){best=score;localStorage.setItem('ls_best',best);} }
}

// ---------- input ----------
cv.addEventListener('pointerdown',e=>{e.preventDefault();act();});
addEventListener('keydown',e=>{ if(e.repeat)return; if(e.code==='Space'||e.code==='Enter'||e.code==='ArrowUp'||e.code==='KeyF'){e.preventDefault();act();} });

// ---------- particles ----------
function burst(x,y,c,n,sp){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=rnd(sp*0.3,sp);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:1,c});}}
function pop(x,y,txt,c){pops.push({x,y,txt,c,life:1});}

// ---------- update ----------
function update(dt){
  shake*=Math.pow(0.86,dt/16.7); if(shake<0.3)shake=0;
  flash*=Math.pow(0.9,dt/16.7);
  for(const p of parts){p.vx*=0.96;p.vy=p.vy*0.96+0.28;p.x+=p.vx*dt/16.7;p.y+=p.vy*dt/16.7;p.life-=dt/16.7*0.026;}
  parts=parts.filter(p=>p.life>0);
  for(const p of pops){p.y-=dt/16.7*0.5;p.life-=dt/16.7*0.02;}
  pops=pops.filter(p=>p.life>0);

  if(state!=='play'){ if(state==='over')resultT+=dt/1000; return; }
  t+=dt;
  if(phase==='trap'){ clock+=dt; if(!acted && clock>trapIdeal+trapW+trapGrace){ acted=true; resolve('lateTrap'); } return; }
  if(phase==='strike'){ clock+=dt; if(!acted && clock>strikeIdeal+strikeW){ acted=true; resolve('lateStrike'); } return; }
  if(phase==='result'){ resultT+=dt/1000; animU=Math.min(1,animU+dt/560); if(resultT>1.5 && state==='play') newPlay(); return; }
}

// ---------- render ----------
function drawField(){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#0f5e34');g.addColorStop(0.55,'#0e5230');g.addColorStop(1,'#0c4429');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='rgba(255,255,255,0.03)';for(let i=0;i<6;i++){ if(i%2===0)ctx.fillRect(0,80+i*95,W,95); }
  ctx.strokeStyle='rgba(255,255,255,0.26)';ctx.lineWidth=3;ctx.strokeRect(GOAL.x-250,GOAL.y+GH,500,300);ctx.strokeRect(GOAL.x-120,GOAL.y+GH,240,110);
  ctx.fillStyle='rgba(0,0,0,0.28)';ctx.fillRect(GOAL.x-GW/2-4,GOAL.y-4,GW+8,GH+4);
  ctx.strokeStyle='rgba(255,255,255,0.34)';ctx.lineWidth=1;
  for(let gx=GOAL.x-GW/2;gx<=GOAL.x+GW/2;gx+=16){ctx.beginPath();ctx.moveTo(gx,GOAL.y);ctx.lineTo(gx,GOAL.y+GH);ctx.stroke();}
  for(let gy=GOAL.y;gy<=GOAL.y+GH;gy+=13){ctx.beginPath();ctx.moveTo(GOAL.x-GW/2,gy);ctx.lineTo(GOAL.x+GW/2,gy);ctx.stroke();}
  ctx.strokeStyle='#f2f2f2';ctx.lineWidth=6;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(GOAL.x-GW/2,GOAL.y+GH);ctx.lineTo(GOAL.x-GW/2,GOAL.y);ctx.lineTo(GOAL.x+GW/2,GOAL.y);ctx.lineTo(GOAL.x+GW/2,GOAL.y+GH);ctx.stroke();
  ctx.lineCap='butt';
}
function person(x,y,col,s,lean){s=s||1;lean=lean||0;
  ctx.save();ctx.translate(x,y);ctx.rotate(lean);
  ctx.fillStyle='rgba(0,0,0,0.2)';ctx.beginPath();ctx.ellipse(0,13*s,11*s,4*s,0,0,6.28);ctx.fill();
  ctx.fillStyle=col;ctx.beginPath();ctx.ellipse(0,-15*s,10*s,15*s,0,0,6.28);ctx.fill();
  ctx.fillStyle='#f0c9a0';ctx.beginPath();ctx.arc(0,-34*s,7.5*s,0,6.28);ctx.fill();
  ctx.restore();
}

function render(){
  ctx.save();
  if(shake>0)ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
  drawField();

  if(state==='play'||state==='over'){
    // GK — commits to the wrong side on the strike (ball goes to +gkSide, keeper dives to -gkSide)
    let gkx=GK.x;
    if(phase==='result'&&result==='goal') gkx=GK.x-gkSide*easeOut(animU)*90;   // dives away from the shot -> beaten
    else if(phase==='strike'||phase==='result') gkx=GK.x-gkSide*10;
    person(gkx,GK.y,'#e8c23a',0.92,phase==='result'&&result==='goal'?-gkSide*0.5:0);

    // passer (teammate)
    person(PASSER.x,PASSER.y,'#3aa0ff',0.9,0);

    // you (striker) — small lean on the strike
    let strLean=(phase==='result'&&(result==='goal'||result==='earlyStrike'||result==='lateStrike'))?0.28:0;
    person(FEET.x,FEET.y,'#e0553a',1.0,strLean);

    // ball
    let b;
    if(phase==='trap'){ b=ballTrap(clamp(clock/trapIdeal,0,1)); }
    else if(phase==='strike'){ b={x:FEET.x, y:FEET.y-8 - Math.max(0,6*Math.sin(clock/90))}; }   // settled, slight bob
    else {
      const u=easeOut(animU);
      if(result==='goal'){ b={x:lerp(FEET.x,GOAL.x+gkSide*76,u), y:lerp(FEET.y-8,GOAL.y+GH*0.5,u)}; }
      else if(result==='earlyTrap'){ b={x:lerp(FEET.x-20,FEET.x-90,u), y:FEET.y-8-40*Math.sin(Math.PI*Math.min(1,u))}; }   // bounces off
      else if(result==='lateTrap'){ b={x:lerp(FEET.x,FEET.x+80,u), y:lerp(FEET.y-8,FEET.y+34,u)}; }              // dropped past, rolls away
      else if(result==='earlyStrike'){ b={x:lerp(FEET.x,GOAL.x+gkSide*40,u), y:lerp(FEET.y-8,GOAL.y-70,u)}; }             // skied over
      else { b={x:lerp(FEET.x,FEET.x-30,u), y:lerp(FEET.y-8,FEET.y+18,u)}; }                                              // blocked / rolled away
    }
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(b.x,b.y,8,0,6.28);ctx.fill();
    ctx.strokeStyle='#333';ctx.lineWidth=1.1;ctx.beginPath();ctx.arc(b.x,b.y,8,0.4,2.2);ctx.stroke();

    // timing banner + bar (per phase)
    ctx.textAlign='center';
    if(state==='play'&&(phase==='trap'||phase==='strike')){
      const ideal=(phase==='trap')?trapIdeal:strikeIdeal, ww=(phase==='trap')?trapW:strikeW;
      const near=Math.abs(clock-ideal)<=ww;
      ctx.fillStyle=near?'rgba(140,255,160,0.98)':'rgba(255,220,90,0.96)';ctx.font='bold 21px sans-serif';
      ctx.fillText(phase==='trap'?(near?'今だ！ トラップで止めろ！':'浮き球が落ちてくる——足元でピタリと止めろ')
                                 :(near?'今だ！ 振り抜け！':'ボールが落ち着いた——素早く振り抜け'),W/2,44);
      const bw=280,x=W/2-bw/2,y=62;
      const wl=x+bw*clamp((ideal-ww)/(ideal+ww),0,1), wwid=bw*(2*ww/(ideal+ww));
      ctx.fillStyle='rgba(255,255,255,0.15)';ctx.fillRect(x,y,bw,8);
      ctx.fillStyle='rgba(120,255,150,0.5)';ctx.fillRect(wl,y,wwid,8);
      const px=x+bw*clamp(clock/(ideal+ww),0,1);
      ctx.fillStyle='#ffe14d';ctx.fillRect(px-2,y-3,4,14);
      // phase pips
      ctx.font='12px sans-serif';ctx.fillStyle='rgba(255,255,255,0.6)';
      ctx.fillText(phase==='trap'?'① トラップ  →  ② シュート':'① トラップ ✓  →  ② シュート',W/2,y+30);
    }
  }

  for(const p of parts){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,3.2,0,6.28);ctx.fill();}
  ctx.globalAlpha=1;
  for(const p of pops){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.font='bold 21px sans-serif';ctx.textAlign='center';ctx.fillText(p.txt,p.x,p.y);}
  ctx.globalAlpha=1;

  // HUD
  ctx.textAlign='left';ctx.fillStyle='#fff';ctx.font='bold 26px sans-serif';ctx.fillText('SCORE '+score,20,36);
  ctx.textAlign='right';ctx.fillStyle='rgba(255,255,255,0.9)';ctx.font='14px sans-serif';ctx.fillText('ゴール '+outs+'  Lv'+lvl,W-20,24);
  ctx.fillText('失敗',W-92,46);
  for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(W-60+i*20,41,7,0,6.28);ctx.fillStyle=i<fails?'#ff5b5b':'rgba(255,255,255,0.25)';ctx.fill();}
  if(combo>=2){ctx.textAlign='center';ctx.fillStyle='#ffd24d';ctx.font='bold 18px sans-serif';ctx.fillText('コンボ x'+combo,W/2,112);}

  if(state==='play'&&phase==='result'&&msg){ctx.textAlign='center';ctx.fillStyle=result==='goal'?'#9ff0b8':'#ff9a9a';ctx.font='bold 15px sans-serif';ctx.fillText(msg,W/2,320);}

  if(state==='title'){
    ctx.fillStyle='rgba(3,10,6,0.84)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='bold 40px sans-serif';ctx.fillText('落としてミドル',W/2,80);
    ctx.fillStyle='#ffd23e';ctx.font='bold 22px sans-serif';ctx.fillText('Trap and Strike',W/2,116);
    ctx.fillStyle='rgba(255,255,255,0.92)';ctx.font='16px sans-serif';
    ctx.fillText('味方が浮かせて落とす“レイオフ”を、ワンタッチで止めてから振り抜く——2拍の連続タイミングでミドルを決めろ',W/2,172);
    ctx.fillStyle='rgba(255,255,255,0.66)';ctx.font='14px sans-serif';
    ctx.fillText('① 浮き球が足元に落ちる緑帯でタップ/クリック/SPACE＝トラップ（早いと弾き・遅いと流れて奪われる）',W/2,212);
    ctx.fillText('② 止めた球が落ち着く緑帯でもう一度＝シュート（早いとふかし・遅いとブロックされる）',W/2,236);
    ctx.fillText('止めて即振り抜くほど（quick）弾丸ミドルで大量加点＆コンボ。GKは逆サイドを突けば決まる',W/2,260);
    ctx.fillText('上級ほど落下が速く帯が短い。3失敗で交代',W/2,284);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で開始',W/2,350);
    ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='14px sans-serif';ctx.fillText('BEST '+best,W/2,382);
  }
  if(state==='over'){
    ctx.fillStyle='rgba(3,10,6,0.86)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#ff6b6b';ctx.font='bold 46px sans-serif';ctx.fillText('3失敗…交代',W/2,222);
    ctx.fillStyle='#fff';ctx.font='bold 40px sans-serif';ctx.fillText('SCORE '+score,W/2,290);
    ctx.fillStyle='rgba(255,255,255,0.85)';ctx.font='19px sans-serif';ctx.fillText('ゴール '+outs+'   BEST '+best,W/2,330);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で もう一度',W/2,402);
  }

  if(flash>0.02){ctx.globalAlpha=flash*0.5;ctx.fillStyle=flashCol;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}
  ctx.restore();

  ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,0.4)';ctx.font='12px sans-serif';
  ctx.fillText('落としてミドル：①落ちる浮き球をトラップ→②落ち着いた球を振り抜く、の2拍。各段の早い/遅いは失敗、3失敗で交代',W/2,H-8);
}

function frame(ts){let dt=ts-last;last=ts;if(dt>60)dt=60;if(dt<0)dt=0;update(dt);render();requestAnimationFrame(frame);}
requestAnimationFrame(frame);

// ---------- test hook ----------
window.__ls={
  start, act:()=>act(),
  get state(){return state;},
  get score(){return score;},
  get outs(){return outs;},
  get fails(){return fails;},
  get info(){return {state,phase,clock,trapIdeal,trapW,strikeIdeal,strikeW,trapped,acted,result,outs,fails,lvl,
    inTrap:(phase==='trap'&&clock>=trapIdeal-trapW&&clock<=trapIdeal+trapW),
    inStrike:(phase==='strike'&&clock>=strikeIdeal-strikeW&&clock<=strikeIdeal+strikeW),
    canAct:((phase==='trap'&&!trapped)||(phase==='strike'&&!acted))};}
};
})();
</script>
</body>
</html>
