<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>フレーミング — Steal the Strike</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{width:100%;height:100%;background:#0a1622;overflow:hidden;
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,system-ui,sans-serif;
    touch-action:none;user-select:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  #stage{position:relative;aspect-ratio:900/600;max-width:100%;max-height:100%;
    width:auto;height:auto;box-shadow:0 0 60px rgba(0,0,0,.6);}
  canvas{display:block;width:100%;height:100%;border-radius:6px;}
</style>
</head>
<body>
<div id="wrap"><div id="stage"><canvas id="c" width="900" height="600"></canvas></div></div>
<script>
(function(){
"use strict";
const TEST=location.hash.indexOf('test')>=0;
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
const W=900,H=600;
let dpr=Math.max(1,Math.min(2,window.devicePixelRatio||1));
function fit(){ dpr=Math.max(1,Math.min(2,window.devicePixelRatio||1)); cv.width=W*dpr; cv.height=H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0); }
fit(); window.addEventListener('resize',fit);

// ---- audio ----
let AC=null;
function ac(){ if(!AC){ try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){AC=null;} } return AC; }
function tone(f,d,type,g,f2){ const a=ac(); if(!a)return; const o=a.createOscillator(),gg=a.createGain();
  o.type=type||'sine'; o.frequency.setValueAtTime(f,a.currentTime); if(f2)o.frequency.exponentialRampToValueAtTime(f2,a.currentTime+d);
  gg.gain.setValueAtTime(0.0001,a.currentTime); gg.gain.exponentialRampToValueAtTime(g||0.2,a.currentTime+0.01);
  gg.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+d); o.connect(gg); gg.connect(a.destination); o.start(); o.stop(a.currentTime+d+0.02); }
function noise(d,g,cut){ const a=ac(); if(!a)return; const n=Math.floor(a.sampleRate*d),buf=a.createBuffer(1,n,a.sampleRate),ch=buf.getChannelData(0);
  for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(1-i/n); const src=a.createBufferSource(); src.buffer=buf;
  const f=a.createBiquadFilter(); f.type='lowpass'; f.frequency.value=cut||1200; const gg=a.createGain(); gg.gain.value=g||0.2;
  src.connect(f); f.connect(gg); gg.connect(a.destination); src.start(); }
const S={
  pitch(){ noise(0.04,0.14,2000); },
  pop(){ noise(0.05,0.4,1200); tone(300,0.04,'sine',0.18); },       // ball snapping the mitt
  steal(){ noise(0.05,0.3,1600); tone(440,0.08,'square',0.2,640); },
  strike(){ noise(0.05,0.3,1500); tone(420,0.08,'square',0.2,600); },
  ball(){ tone(240,0.14,'sine',0.12,180); },
  k(){ noise(0.06,0.4,2200); tone(560,0.12,'square',0.24,720); },
  cheer(){ const a=ac(); if(!a)return; noise(0.8,0.24,1900); for(let i=0;i<6;i++)setTimeout(()=>tone(500+Math.random()*320,0.3,'sine',0.05),i*44); },
  walk(){ tone(260,0.26,'sawtooth',0.14,120); noise(0.08,0.14,1200); },
  miss(){ noise(0.09,0.24,1400); tone(220,0.12,'sine',0.12,140); }, tick(){ tone(1000,0.03,'square',0.05); }
};

// ---- zone ----
const ZC={x:450,y:300}, ZHX=76, ZHY=58;
const MOUND={x:450,y:96}, MITT={x:450,y:392};

// ---- state ----
let state='ready';   // ready, pitch, result, over
let ks=0, walks=0, streak=0, best=0, level=0, batterN=0;
let balls=0, strikes=0;
let p=0, pitchDur=0.6, cls='strike', tx=450, ty=300, r=0, received=false, recE=1;
let cred=0.5;        // credibility 0..1 -> widens framable band
let mittX=450, mittY=392, frameT=0, callText='', callCol='#fff', umpPunch=0;
let msg='',msgT=0, subMsg='', result=null;
let flash=0,flashCol='#fff',shakeT=0,shakeM=0;
let parts=[], crowd=[], t=0;

try{ best=parseInt(localStorage.getItem('fr_best')||'0',10)||0; }catch(e){}
for(let i=0;i<80;i++) crowd.push({x:Math.random()*W,y:6+Math.random()*40,c:['#e8544e','#f0c14b','#4a90d9','#fff','#5cc98a','#c98af0'][i%6],b:Math.random()*6.28});

function saveBest(){ try{localStorage.setItem('fr_best',''+best);}catch(e){} }
function levelUp(){ level=Math.min(9,Math.floor(ks/3)); }
function framableMax(){ return 1.16 + cred*0.28 - level*0.012; }   // outer edge of stealable band

function reset(){ ks=0;walks=0;streak=0;level=0;cred=0.5; parts=[]; nextBatter(true); }
function nextBatter(first){ levelUp(); balls=0; strikes=0; if(!first)batterN++; else batterN=0; nextPitch(first&&batterN===0); }

function nextPitch(intro){
  pitchDur=Math.max(0.42,0.62-level*0.02);
  // choose class distribution
  const rr=Math.random();
  if(rr<0.32) cls='strike'; else if(rr<0.72) cls='edge'; else cls='ball';
  let rad;
  if(cls==='strike') rad=0.55+Math.random()*0.34;
  else if(cls==='edge') rad=1.0+Math.random()*(framableMax()-1.0+0.06);
  else rad=framableMax()+0.12+Math.random()*0.5;
  const ang=Math.random()*6.28; let nx=Math.cos(ang), ny=Math.sin(ang);
  const m=Math.max(Math.abs(nx),Math.abs(ny)); nx/=m; ny/=m;   // push to a square edge (chebyshev)
  tx=ZC.x+nx*rad*ZHX; ty=ZC.y+ny*rad*ZHY; r=rad;
  p=0; received=false; recE=1; result=null; frameT=0; callText='';
  state='pitch';
  if(intro){ msg='際どい球を丁寧に捕って“ストライク”を盗め！'; msgT=170; subMsg=''; }
  else { msg=''; msgT=0; subMsg=''; }
  S.pitch();
}

function ballPos(){ const pp=Math.min(1.18,p); return {x:MOUND.x+(tx-MOUND.x)*pp, y:MOUND.y+(ty-MOUND.y)*pp}; }

function receive(){
  if(state!=='pitch'||received) return;
  received=true; recE=Math.abs(p-1.0); S.pop();
  const e=recE;
  const pull=Math.max(0,1-e/0.15);           // 1 = perfect quiet receive
  let called;
  if(cls==='strike'){ called='strike'; }
  else if(cls==='ball'){ called='ball'; }
  else { // edge: steal if framed well enough for how far out it is
    const need=(r-1.0)/(framableMax()-1.0+0.0001);   // 0(at edge)..1(outer)
    called = (pull >= 0.32+need*0.5) ? 'strike-steal' : 'ball';
  }
  applyCall(called,pull);
}
function applyCall(called,pull){
  // mitt "stick" toward zone center for the frame
  frameT=1; mittX=tx; mittY=ty;
  if(called==='strike'||called==='strike-steal'){
    strikes++; callText='ストライク！'; callCol='#ffd23e'; umpPunch=1;
    if(called==='strike-steal'){ S.steal(); cred=Math.min(1,cred+0.05); callText='盗んだ！ ストライク'; subMsg='ナイスフレーミング'; msgT=60;
      burst(ZC.x+(tx-ZC.x)*0.5,ZC.y+(ty-ZC.y)*0.5,'#eaffd0',10); }
    else S.strike();
  } else {
    balls++; callText='ボール'; callCol='#8ee9ff';
    if(cls==='edge'){ cred=Math.max(0,cred-0.06); if(received&&recE>0.15){subMsg='雑な捕球…';msgT=50;} } S.ball();
  }
  finishPitch();
}
function finishPitch(){
  if(strikes>=3){ ks++; streak++; if(streak>best){best=streak;saveBest();}
    result='K'; msg='見逃し三振！'; if(streak%4===0){subMsg='絶妙な捕球術！';} S.k(); setTimeout(S.cheer,60);
    flash=0.4; flashCol='#eafff0'; shakeT=10; shakeM=3; msgT=110;
    state='result'; setTimeout(()=>{ if(state==='result') nextBatter(false); }, 1050);
  } else if(balls>=4){ walks++; streak=0; result='BB'; msg='フォアボール…'; S.walk(); msgT=110;
    state='result';
    if(walks>=3){ setTimeout(()=>{ state='over'; msg='3四球・降板'; msgT=99999; }, 800); }
    else setTimeout(()=>{ if(state==='result') nextBatter(false); }, 1000);
  } else { // next pitch of same at-bat
    result=null; state='result'; msgT=Math.max(msgT,40);
    setTimeout(()=>{ if(state==='result') nextPitch(false); }, 640);
  }
}

function burst(x,y,col,n){ for(let i=0;i<n;i++){ const a=Math.random()*6.28,sp=1+Math.random()*4;
  parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-1.5,life:1,col,r:2+Math.random()*3}); } }

// ---- input ----
function press(){ const a=ac(); if(a&&a.state==='suspended')a.resume();
  if(state==='ready'||state==='over'){ reset(); return; }
  if(state==='pitch'){ receive(); }
}
cv.addEventListener('pointerdown',e=>{ e.preventDefault(); press(); });
window.addEventListener('keydown',e=>{ if(e.code==='Space'||e.code==='Enter'){ e.preventDefault(); press(); } });

// ---- update ----
let last=0;
function update(dt){
  t+=dt; if(msgT>0)msgT--; if(flash>0)flash=Math.max(0,flash-dt*2); if(shakeT>0)shakeT--;
  if(frameT>0)frameT=Math.max(0,frameT-dt*1.6); if(umpPunch>0)umpPunch=Math.max(0,umpPunch-dt*2.2);
  // mitt tracks catch point during pitch; sticks toward zone after frame
  if(state==='pitch'){
    p+=dt/pitchDur;
    const b=ballPos(); mittX+=(b.x-mittX)*Math.min(1,dt*10); mittY+=(b.y-mittY)*Math.min(1,dt*10);
    if(p>0.6 && ((p*14|0)!==((p-dt/pitchDur)*14|0))) S.tick();
    if(!received && p>=1.18){ received=true; recE=0.3;    // missed the catch -> natural call, no frame
      applyCall(r<=1.0?'strike':'ball',0); }
  } else if(state==='result' && frameT>0){
    // stick pull toward zone edge (frame illusion)
    const gx=ZC.x+(mittX-ZC.x)*0.86, gy=ZC.y+(mittY-ZC.y)*0.86;
    mittX+=(gx-mittX)*Math.min(1,dt*6); mittY+=(gy-mittY)*Math.min(1,dt*6);
  }
  for(let i=parts.length-1;i>=0;i--){ const q=parts[i]; q.x+=q.vx;q.y+=q.vy;q.vy+=0.15;q.life-=dt*1.0; if(q.life<=0)parts.splice(i,1); }
}

// ---- draw ----
function rr(x,y,w,h,rd){ ctx.beginPath(); ctx.moveTo(x+rd,y); ctx.arcTo(x+w,y,x+w,y+h,rd); ctx.arcTo(x+w,y+h,x,y+h,rd); ctx.arcTo(x,y+h,x,y,rd); ctx.arcTo(x,y,x+w,y,rd); ctx.closePath(); }

function drawScene(){
  const g=ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,'#12314c'); g.addColorStop(1,'#173a2a');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#0c1c28'; ctx.fillRect(0,0,W,40);
  for(const c of crowd){ const yy=c.y+Math.sin(t*3+c.b)*1.1; ctx.fillStyle=c.c; ctx.globalAlpha=.5; ctx.fillRect(c.x,yy,5,5); }
  ctx.globalAlpha=1;
  // pitcher
  ctx.save(); ctx.translate(MOUND.x,MOUND.y);
  ctx.fillStyle='#c94e8a'; rr(-11,-22,22,24,6); ctx.fill(); ctx.fillStyle='#f0c39a'; ctx.beginPath(); ctx.arc(0,-28,7,0,6.28); ctx.fill(); ctx.restore();
  // dirt
  ctx.fillStyle='#b5763e'; ctx.beginPath(); ctx.ellipse(450,430,200,70,0,0,6.28); ctx.fill();
  // framable band (faint) then strike zone
  const fm=framableMax();
  ctx.strokeStyle='rgba(140,255,168,.18)'; ctx.setLineDash([5,6]); ctx.lineWidth=2;
  ctx.strokeRect(ZC.x-ZHX*fm,ZC.y-ZHY*fm,ZHX*2*fm,ZHY*2*fm); ctx.setLineDash([]);
  ctx.strokeStyle='rgba(255,255,255,.7)'; ctx.lineWidth=3; ctx.strokeRect(ZC.x-ZHX,ZC.y-ZHY,ZHX*2,ZHY*2);
  ctx.strokeStyle='rgba(255,255,255,.2)'; ctx.lineWidth=1;
  for(let i=1;i<3;i++){ ctx.beginPath(); ctx.moveTo(ZC.x-ZHX+ZHX*2*i/3,ZC.y-ZHY); ctx.lineTo(ZC.x-ZHX+ZHX*2*i/3,ZC.y+ZHY); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(ZC.x-ZHX,ZC.y-ZHY+ZHY*2*i/3); ctx.lineTo(ZC.x+ZHX,ZC.y-ZHY+ZHY*2*i/3); ctx.stroke(); }
  // batter silhouette (side)
  ctx.save(); ctx.translate(ZC.x-ZHX-56,ZC.y+30); ctx.globalAlpha=.9;
  ctx.fillStyle='#20304a'; rr(-14,-40,28,64,8); ctx.fill(); ctx.fillStyle='#12203a'; ctx.beginPath(); ctx.arc(2,-52,12,0,6.28); ctx.fill();
  ctx.strokeStyle='#3a2a18'; ctx.lineWidth=7; ctx.lineCap='round'; ctx.beginPath(); ctx.moveTo(10,-40); ctx.lineTo(40,-70); ctx.stroke(); ctx.globalAlpha=1; ctx.restore();
  // home plate + catcher mitt
  ctx.fillStyle='#fff'; ctx.beginPath(); ctx.moveTo(450-16,470);ctx.lineTo(450+16,470);ctx.lineTo(450+16,480);ctx.lineTo(450,492);ctx.lineTo(450-16,480);ctx.closePath(); ctx.fill();
  drawMitt();
  drawUmp();
}
function drawMitt(){
  ctx.save(); ctx.translate(mittX,mittY);
  const pop=frameT>0?1+frameT*0.2:1;
  ctx.scale(pop,pop);
  ctx.fillStyle='#5a3a20'; ctx.beginPath(); ctx.arc(0,0,15,0,6.28); ctx.fill();
  ctx.fillStyle='#7a5230'; ctx.beginPath(); ctx.arc(0,0,10,0,6.28); ctx.fill();
  ctx.strokeStyle='#4a2e18'; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(0,0,15,-1.2,1.2); ctx.stroke();
  ctx.restore();
}
function drawUmp(){
  ctx.save(); ctx.translate(560,452);
  ctx.fillStyle='#2a2a33'; rr(-16,-46,32,56,9); ctx.fill();
  ctx.fillStyle='#20242c'; ctx.beginPath(); ctx.arc(0,-54,11,0,6.28); ctx.fill();
  // punch arm on strike call
  if(umpPunch>0){ ctx.strokeStyle='#2a2a33'; ctx.lineWidth=9; ctx.lineCap='round';
    const a=-0.5-umpPunch*0.8; ctx.save(); ctx.translate(14,-30); ctx.rotate(a); ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(26,0); ctx.stroke();
    ctx.fillStyle='#20242c'; ctx.beginPath(); ctx.arc(26,0,6,0,6.28); ctx.fill(); ctx.restore(); }
  ctx.restore();
}
function drawBall(){
  if(state==='pitch'){ const b=ballPos();
    ctx.strokeStyle='rgba(255,255,255,.35)'; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(MOUND.x,MOUND.y); ctx.lineTo(b.x,b.y); ctx.stroke();
    const rr0=5+(1-Math.min(1,p))*4;
    ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(b.x,b.y,rr0,0,6.28); ctx.fill(); ctx.strokeStyle='#123'; ctx.lineWidth=1.2; ctx.stroke();
  } else if(state==='result'&&frameT>0){ ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(mittX,mittY,5,0,6.28); ctx.fill(); }
  // call text
  if(callText&&(state==='pitch'||state==='result')&&frameT>0.02){ ctx.textAlign='center'; ctx.font='bold 30px sans-serif';
    ctx.fillStyle=callCol; ctx.globalAlpha=Math.min(1,frameT*1.5); ctx.fillText(callText, mittX, mittY-28); ctx.globalAlpha=1; ctx.textAlign='left'; }
}

function dot(x,y,on,col){ ctx.beginPath(); ctx.arc(x,y,7,0,6.28); ctx.fillStyle=on?(col||'#ffd23e'):'rgba(255,255,255,.18)'; ctx.fill(); ctx.strokeStyle='rgba(0,0,0,.3)'; ctx.lineWidth=1; ctx.stroke(); }
function hud(x,y,w,h,lab,val,col){
  ctx.fillStyle='rgba(6,20,20,.62)'; rr(x,y,w,h,9); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.6)'; ctx.font='11px sans-serif'; ctx.textAlign='left'; ctx.fillText(lab,x+12,y+19);
  ctx.fillStyle=col||'#fff'; ctx.font='bold 24px sans-serif'; ctx.fillText(val,x+12,y+44);
}
function drawHUD(){
  hud(20,14,150,56,'奪三振 K',''+ks,'#8effa8');
  hud(W/2-75,14,150,56,'連続 STREAK',''+streak,'#ffd23e');
  const wc=walks>=2?'#ff6a5a':'#fff';
  hud(W-170,14,150,56,'四球 BB',walks+' /3',wc);
  // count
  ctx.textAlign='left'; ctx.fillStyle='rgba(255,255,255,.8)'; ctx.font='13px sans-serif';
  ctx.fillText('B',W-172,96); for(let i=0;i<3;i++) dot(W-150+i*20,92,i<balls,'#8ee9ff');
  ctx.fillText('S',W-172,120); for(let i=0;i<2;i++) dot(W-150+i*20,116,i<strikes,'#ffd23e');
  // credibility meter
  ctx.fillStyle='rgba(255,255,255,.55)'; ctx.font='11px sans-serif'; ctx.fillText('信頼度',22,84);
  ctx.fillStyle='rgba(6,20,12,.6)'; rr(22,90,120,9,4); ctx.fill();
  ctx.fillStyle=cred>0.6?'#8effa8':cred>0.35?'#ffd23e':'#ff8a5a'; rr(22,90,120*cred,9,4); ctx.fill();
}
function drawMsg(){
  if(msgT>0&&msg){ ctx.textAlign='center'; ctx.font='bold 28px sans-serif'; const w=ctx.measureText(msg).width;
    ctx.fillStyle='rgba(6,18,14,.75)'; rr(450-w/2-18,150,w+36,42,10); ctx.fill();
    ctx.fillStyle='#fff'; ctx.fillText(msg,450,178);
    if(subMsg){ ctx.font='bold 17px sans-serif'; ctx.fillStyle='rgba(140,255,168,.95)'; ctx.fillText(subMsg,450,204); }
    ctx.textAlign='left'; }
}
function drawHint(){ if(state==='pitch'){ ctx.textAlign='center'; ctx.fillStyle='rgba(255,255,255,.7)'; ctx.font='14px sans-serif';
  ctx.fillText('ミットに収まる瞬間にタップ＝丁寧に捕球（点線内は盗める）',450,540); ctx.textAlign='left'; } }
function drawOverlay(){
  ctx.fillStyle='rgba(6,16,14,.76)'; ctx.fillRect(0,0,W,H); ctx.textAlign='center';
  ctx.fillStyle='rgba(140,255,168,.9)'; ctx.font='600 15px sans-serif'; ctx.fillText('BASEBALL · PITCH FRAMING',450,138);
  ctx.fillStyle='#fff'; ctx.font='bold 52px sans-serif'; ctx.fillText('フレーミング',450,196);
  ctx.fillStyle='#ffd23e'; ctx.font='bold 21px sans-serif'; ctx.fillText('Steal the Strike',450,228);
  ctx.fillStyle='rgba(255,255,255,.9)'; ctx.font='16px sans-serif';
  const L=['あなたは捕手。際どい球を丁寧に捕って“ストライク”を盗め。',
    'ボールがミットに収まる瞬間にジャストタップ＝静かな捕球。',
    '点線の枠内なら際どい球も盗める（外なら判定はボール）。',
    '雑な捕球や露骨な引き込みは信頼度ダウンで枠が縮む。',
    '3ストライクで三振。4ボールは四球、3四球で降板。'];
  for(let i=0;i<L.length;i++) ctx.fillText(L[i],450,266+i*25);
  ctx.fillStyle='#e8544e'; rr(450-95,422,190,54,27); ctx.fill();
  ctx.fillStyle='#fff'; ctx.font='bold 24px sans-serif'; ctx.fillText('プレイボール',450,456);
  ctx.fillStyle='rgba(255,255,255,.6)'; ctx.font='14px sans-serif'; ctx.fillText('タップ / Space で捕球',450,500);
  ctx.textAlign='left';
}
function drawOver(){
  ctx.fillStyle='rgba(6,16,14,.84)'; ctx.fillRect(0,0,W,H); ctx.textAlign='center';
  ctx.fillStyle='#fff'; ctx.font='bold 46px sans-serif'; ctx.fillText('3四球・降板',450,232);
  ctx.fillStyle='#8effa8'; ctx.font='bold 30px sans-serif'; ctx.fillText('奪三振 '+ks,450,286);
  ctx.fillStyle='#ffd23e'; ctx.font='20px sans-serif'; ctx.fillText('自己ベスト連続 '+best,450,322);
  ctx.fillStyle='#2f7fd6'; rr(450-95,372,190,54,27); ctx.fill();
  ctx.fillStyle='#fff'; ctx.font='bold 22px sans-serif'; ctx.fillText('もう一度',450,406);
  ctx.textAlign='left';
}

function render(){
  ctx.save();
  if(shakeT>0){ ctx.translate((Math.random()*2-1)*shakeM,(Math.random()*2-1)*shakeM); }
  drawScene(); drawBall();
  for(const q of parts){ ctx.globalAlpha=Math.max(0,q.life); ctx.fillStyle=q.col; ctx.beginPath(); ctx.arc(q.x,q.y,q.r,0,6.28); ctx.fill(); }
  ctx.globalAlpha=1;
  drawHUD(); drawMsg(); drawHint();
  ctx.restore();
  if(flash>0){ ctx.fillStyle=flashCol; ctx.globalAlpha=flash; ctx.fillRect(0,0,W,H); ctx.globalAlpha=1; }
  if(state==='ready') drawOverlay();
  if(state==='over') drawOver();
}
function loop(ts){ if(!last)last=ts; let dt=(ts-last)/1000; last=ts; if(dt>0.05)dt=0.05; update(dt); render(); requestAnimationFrame(loop); }
requestAnimationFrame(loop);

if(TEST){
  window.__fr={
    get state(){return state;},
    get p(){return p;},
    get cls(){return cls;},
    get framableMax(){return framableMax();},
    get r(){return r;},
    get count(){return {balls,strikes};},
    get tally(){return {ks,walks,streak,cred:Math.round(cred*100)/100};},
    receive(){ receive(); },
    tap(){ if(state==='ready'||state==='over')reset(); }
  };
}
})();
</script>
</body>
</html>
