<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>二塁牽制 デイライト (Daylight Pickoff)</title>
<style>
  html,body{margin:0;height:100%;background:#0b0a06;overflow:hidden;
    font-family:-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  #stage{position:relative;width:100vw;height:100vh;max-width:calc(100vh*1.5);max-height:calc(100vw/1.5);aspect-ratio:900/600;}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;border-radius:6px;}
</style>
</head>
<body>
<div id="wrap"><div id="stage"><canvas id="cv"></canvas></div></div>
<script>
(function(){
const W=900,H=600,cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let DPR=1;
function fit(){DPR=Math.min(2,window.devicePixelRatio||1);cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
fit();addEventListener('resize',fit);

// ---------- audio ----------
let AC=null;function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function tone(f,d,type,v,sweep){const a=ac();if(!a)return;const t=a.currentTime,o=a.createOscillator(),g=a.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(sweep)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+sweep),t+d);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v||0.2,t+0.008);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+0.02);}
function noise(d,v,hp){const a=ac();if(!a)return;const t=a.currentTime,n=Math.floor(a.sampleRate*d),buf=a.createBuffer(1,n,a.sampleRate),ch=buf.getChannelData(0);
  for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource();s.buffer=buf;
  const f=a.createBiquadFilter();f.type='highpass';f.frequency.value=hp||600;const g=a.createGain();g.gain.value=v||0.2;
  s.connect(f);f.connect(g);g.connect(a.destination);s.start(t);s.stop(t+d+0.02);}
const S={
  set:()=>{tone(300,0.08,'sine',0.05,40);},
  cue:()=>{tone(1300,0.05,'sine',0.09);},
  fire:()=>{noise(0.05,0.16,500);tone(320,0.05,'square',0.08,120);},
  out:()=>{[660,900,1180].forEach((f,i)=>setTimeout(()=>tone(f,0.11,'triangle',0.17),i*66));},
  fine:()=>{[660,900,1160,1450].forEach((f,i)=>setTimeout(()=>tone(f,0.11,'triangle',0.16),i*64));},
  err:()=>{noise(0.2,0.2,300);tone(150,0.22,'sawtooth',0.12,-50);},
  safe:()=>{noise(0.16,0.18,260);tone(180,0.2,'sawtooth',0.1,-40);},
  streak:()=>{[700,930,1170,1400].forEach((f,i)=>setTimeout(()=>tone(f,0.1,'triangle',0.16),i*60));},
  over:()=>{[440,330,247,175].forEach((f,i)=>setTimeout(()=>tone(f,0.3,'triangle',0.2),i*160));}
};

// ---------- geometry ----------
const MOUND={x:450,y:430}, B2={x:450,y:230}, B3={x:250,y:340}, CF={x:450,y:70};

// ---------- state ----------
let state='title', phase='set', plays=0;
let score=0, combo=0, best=+(localStorage.getItem('dlp_best')||0);
let outs=0, fails=0, lvl=1;   // outs = pickoffs, fails = safe/error
let clock=0, wsT=740, win=290, cueLead=250;
let thrown=false, throwClock=0, quality=0, tough=false, result=null, resultT=0, reason='', flyT=0;
let shake=0, flash=0, flashCol='#fff', last=performance.now();
let parts=[], pops=[];

function rnd(a,b){return a+Math.random()*(b-a);}
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function lerp(a,b,u){return a+(b-a)*u;}
function easeOut(u){return 1-Math.pow(1-u,2);}

function reset(){state='title';score=0;combo=0;outs=0;fails=0;lvl=1;plays=0;result=null;parts=[];pops=[];}

function newPlay(){
  plays++; lvl=Math.min(7,1+Math.floor(outs/4));
  wsT=clamp(780-lvl*28,580,780);
  win=clamp(330-lvl*20,190,330);
  tough=Math.random()<clamp(0.22+lvl*0.03,0.22,0.46);
  if(tough)win=Math.round(win*0.82);
  thrown=false; throwClock=0; quality=0; result=null; reason=''; resultT=0; flyT=0;
  phase='set'; clock=0; S.set();
}
function start(){ if(!ac())ac(); if(AC&&AC.state==='suspended')AC.resume(); reset(); state='play'; newPlay(); }

function fire(){
  if(state==='title'){start();return;}
  if(state==='over'){ if(resultT>0.4){reset();start();} return; }
  if(state!=='play'||phase!=='set'||thrown) return;
  thrown=true; throwClock=clock; S.fire();
  if(clock<wsT){ resolve('early'); return; }
  quality=clamp(1-(clock-wsT)/win,0,1);   // sooner after the SS arrives = runner more off
  resolve('out');
}

function resolve(k){
  phase='result'; result=k; resultT=0; flyT=0;
  if(k==='out'){
    outs++; combo++;
    const fine=quality>=0.7;
    const mult=1+Math.min(9,combo-1)*0.14;
    const add=Math.round((70+Math.round(quality*90)+(tough?90:0))*mult); score+=add;
    S.fire(); setTimeout(fine?S.fine:S.out,120);
    flash=1;flashCol='#8affa0';shake=5; burst(B2.x,B2.y,'#8affa0',18,7);
    reason = fine?'完璧なデイライト！ 大きく off の走者を刺した':'ショートが入った“今”を突いてタッチアウト！';
    pop(B2.x,B2.y-40,(tough?'鋭い走者を刺した！ +':'アウト！ +')+add,'#d6ffe0');
    if(combo>=2)pop(W/2,150,'コンボ x'+combo,'#ffd24d');
    if(combo>0&&combo%5===0)S.streak();
  } else {
    fails++; combo=0; flash=1;flashCol='#ff5b5b';shake=8;
    if(k==='early'){ S.err(); reason='早すぎ…ショートが入る前で送球がセンターへ抜ける（悪送球）'; pop(lerp(MOUND.x,CF.x,0.6),lerp(MOUND.y,CF.y,0.6),'悪送球…','#ffb0b0'); }
    else { S.safe(); reason='遅すぎ…走者が帰塁してセーフ、好機を逃す'; pop(B2.x,B2.y-40,'セーフ…','#ffb0b0'); }
  }
  if(fails>=3){ state='over'; resultT=0; S.over(); if(score>best){best=score;localStorage.setItem('dlp_best',best);} }
}

// ---------- input ----------
cv.addEventListener('pointerdown',e=>{e.preventDefault();fire();});
addEventListener('keydown',e=>{ if(e.repeat)return;
  if(e.code==='Space'||e.code==='Enter'||e.code==='ArrowUp'||e.code==='KeyF'||e.code==='KeyJ'){e.preventDefault();fire();} });

// ---------- particles ----------
function burst(x,y,c,n,sp){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=rnd(sp*0.3,sp);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:1,c});}}
function pop(x,y,txt,c){pops.push({x,y,txt,c,life:1});}

// ---------- update ----------
function update(dt){
  shake*=Math.pow(0.86,dt/16.7); if(shake<0.3)shake=0;
  flash*=Math.pow(0.9,dt/16.7);
  for(const p of parts){p.vx*=0.96;p.vy=p.vy*0.96+0.28;p.x+=p.vx*dt/16.7;p.y+=p.vy*dt/16.7;p.life-=dt/16.7*0.026;}
  parts=parts.filter(p=>p.life>0);
  for(const p of pops){p.y-=dt/16.7*0.5;p.life-=dt/16.7*0.02;}
  pops=pops.filter(p=>p.life>0);

  if(state!=='play'){ if(state==='over')resultT+=dt/1000; return; }
  if(phase==='set'){ clock+=dt;
    if(Math.abs(clock-(wsT-cueLead))<9) S.cue();
    if(!thrown && clock>wsT+win){ resolve('late'); }
    return; }
  if(phase==='result'){ resultT+=dt/1000; flyT=Math.min(1,flyT+dt/300); if(resultT>1.45) newPlay(); return; }
}

// ---------- render ----------
function drawField(){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#1f6b38');g.addColorStop(0.5,'#176033');g.addColorStop(1,'#0f5029');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  // infield dirt (diamond around 2B)
  ctx.fillStyle='#8a5c33';ctx.beginPath();ctx.moveTo(MOUND.x,MOUND.y+40);ctx.lineTo(660,300);ctx.lineTo(B2.x,150);ctx.lineTo(240,300);ctx.closePath();ctx.fill();
  // base lines
  ctx.strokeStyle='rgba(255,255,255,0.5)';ctx.lineWidth=3;ctx.setLineDash([8,7]);
  ctx.beginPath();ctx.moveTo(B2.x,B2.y);ctx.lineTo(B3.x,B3.y);ctx.stroke();ctx.setLineDash([]);
  // second base
  ctx.save();ctx.translate(B2.x,B2.y);ctx.rotate(Math.PI/4);ctx.fillStyle='#f2efe6';ctx.fillRect(-11,-11,22,22);ctx.restore();
  ctx.save();ctx.translate(B3.x,B3.y);ctx.rotate(Math.PI/4);ctx.fillStyle='#f2efe6';ctx.fillRect(-10,-10,20,20);ctx.restore();
  ctx.fillStyle='rgba(255,255,255,0.6)';ctx.font='12px sans-serif';ctx.textAlign='center';ctx.fillText('二塁',B2.x+20,B2.y-14);ctx.fillText('三塁',B3.x-4,B3.y+28);
}

function render(){
  ctx.save();
  if(shake>0)ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
  drawField();

  if(state==='play'||state==='over'){
    const inWin = phase==='set'&&clock>=wsT&&clock<=wsT+win;
    // shortstop sneaking to the bag (arrives at wsT)
    const ssU = phase==='set'? clamp(clock/wsT,0,1) : 1;
    const ssx=lerp(600,B2.x+14,easeOut(ssU)), ssy=lerp(200,B2.y-2,easeOut(ssU));
    ctx.fillStyle='#2b6fd6';ctx.beginPath();ctx.ellipse(ssx,ssy,11,15,0,0,6.28);ctx.fill();
    ctx.fillStyle='#f0c9a0';ctx.beginPath();ctx.arc(ssx,ssy-20,8,0,6.28);ctx.fill();

    // runner leading off toward third, dives back at end of window
    let runU=0;
    if(phase==='set'){ runU=clamp((clock-(wsT+win*0.5))/(win*0.7),0,1); } // starts diving back mid-late window
    else if(phase==='result'){ runU = (result==='out')?0 : 1; if(result==='out'&&resultT>0)runU=0; }
    if(phase==='result'&&result==='late') runU=Math.min(1,flyT*1.4);
    const leadX=lerp(B2.x-56,B2.x-6,runU), leadY=lerp(B2.y+34,B2.y+6,runU);
    ctx.fillStyle='#d0403a';ctx.beginPath();ctx.ellipse(leadX,leadY,11,14,0,0,6.28);ctx.fill();
    ctx.fillStyle='#f0c9a0';ctx.beginPath();ctx.arc(leadX-6,leadY-16,8,0,6.28);ctx.fill();

    // pitcher (you)
    ctx.fillStyle='#e8e4d8';ctx.beginPath();ctx.ellipse(MOUND.x,MOUND.y,12,16,0,0,6.28);ctx.fill();
    ctx.fillStyle='#f0c9a0';ctx.beginPath();ctx.arc(MOUND.x,MOUND.y-22,9,0,6.28);ctx.fill();

    // thrown ball
    if(phase==='result'&&(result==='out'||result==='late')){ const u=easeOut(flyT); const bx=lerp(MOUND.x,B2.x,u),by=lerp(MOUND.y,B2.y,u);
      ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(bx,by,7,0,6.28);ctx.fill(); }
    else if(phase==='result'&&result==='early'){ const u=easeOut(flyT); const bx=lerp(MOUND.x,CF.x,u),by=lerp(MOUND.y,CF.y,u);
      ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(bx,by,7,0,6.28);ctx.fill(); }

    // daylight window indicator between runner and bag
    if(state==='play'&&phase==='set'&&clock>=wsT-cueLead){
      ctx.strokeStyle=inWin?'#7dff9a':'rgba(255,225,120,0.9)';ctx.lineWidth=3;
      ctx.beginPath();ctx.arc(B2.x,B2.y,26,0,6.28);ctx.stroke();
      if(inWin){ ctx.fillStyle='rgba(140,255,160,0.98)';ctx.font='bold 14px sans-serif';ctx.textAlign='center';ctx.fillText('デイライト！ 今だ',B2.x,B2.y-34); }
    }

    // cue
    ctx.textAlign='center';
    if(state==='play'&&phase==='set'){
      ctx.fillStyle='rgba(255,220,90,0.96)';ctx.font='bold 21px sans-serif';ctx.fillText('二塁牽制！ ショートが入る“その瞬間”に送球しろ',W/2,44);
      ctx.fillStyle='rgba(255,255,255,0.6)';ctx.font='13px sans-serif';ctx.fillText('ショートが二塁に入る緑リングでタップ / SPACE＝早いと悪送球・遅いと帰塁される',W/2,H-34);
    }
  }

  for(const p of parts){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,3.2,0,6.28);ctx.fill();}
  ctx.globalAlpha=1;
  for(const p of pops){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.font='bold 21px sans-serif';ctx.textAlign='center';ctx.fillText(p.txt,p.x,p.y);}
  ctx.globalAlpha=1;

  // HUD
  ctx.textAlign='left';ctx.fillStyle='#fff';ctx.font='bold 26px sans-serif';ctx.fillText('SCORE '+score,20,36);
  ctx.textAlign='right';ctx.fillStyle='rgba(255,255,255,0.9)';ctx.font='14px sans-serif';ctx.fillText('牽制刺 '+outs+'  Lv'+lvl,W-20,24);
  ctx.fillText('失敗',W-92,46);
  for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(W-60+i*20,41,7,0,6.28);ctx.fillStyle=i<fails?'#ff5b5b':'rgba(255,255,255,0.25)';ctx.fill();}
  if(combo>=2){ctx.textAlign='center';ctx.fillStyle='#ffd24d';ctx.font='bold 18px sans-serif';ctx.fillText('コンボ x'+combo,W/2,120);}

  if(state==='play'&&phase==='result'&&reason){ctx.textAlign='center';ctx.fillStyle=result==='out'?'#9ff0b8':'#ff9a9a';ctx.font='bold 17px sans-serif';ctx.fillText(reason,W/2,H-64);}

  if(state==='title'){
    ctx.fillStyle='rgba(6,5,3,0.82)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='bold 34px sans-serif';ctx.fillText('二塁牽制 デイライト',W/2,90);
    ctx.fillStyle='#ffd23e';ctx.font='bold 22px sans-serif';ctx.fillText('Daylight Pickoff',W/2,126);
    ctx.fillStyle='rgba(255,255,255,0.92)';ctx.font='16px sans-serif';
    ctx.fillText('二塁走者への牽制“デイライトプレー”。ショートが二塁に入った一瞬を突いて送球し刺せ',W/2,182);
    ctx.fillStyle='rgba(255,255,255,0.66)';ctx.font='14px sans-serif';
    ctx.fillText('ショートが背後から二塁ベースへ入る→“入った瞬間”（緑リング）でタップ / SPACE で送球',W/2,220);
    ctx.fillText('走者がまだ大きく off の早いタイミングほど確実にタッチアウト（大きく off なら大量点）',W/2,244);
    ctx.fillText('ショートが入る前に投げると送球がセンターへ抜ける悪送球、遅いと走者が帰塁してセーフ',W/2,268);
    ctx.fillText('上級ほど走者が鋭く猶予（デイライトの窓）が短い。3失敗で交代',W/2,292);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で開始',W/2,360);
    ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='14px sans-serif';ctx.fillText('BEST '+best,W/2,392);
  }
  if(state==='over'){
    ctx.fillStyle='rgba(6,5,3,0.84)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#ff6b6b';ctx.font='bold 46px sans-serif';ctx.fillText('3失敗…交代',W/2,222);
    ctx.fillStyle='#fff';ctx.font='bold 40px sans-serif';ctx.fillText('SCORE '+score,W/2,290);
    ctx.fillStyle='rgba(255,255,255,0.85)';ctx.font='19px sans-serif';ctx.fillText('牽制刺 '+outs+'   BEST '+best,W/2,330);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で もう一度',W/2,402);
  }

  if(flash>0.02){ctx.globalAlpha=flash*0.5;ctx.fillStyle=flashCol;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}
  ctx.restore();

  ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,0.4)';ctx.font='12px sans-serif';
  ctx.fillText('二塁牽制 デイライト：ショートが二塁に入る“その瞬間”（緑リング）で送球して走者を刺す。早いと悪送球・遅いと帰塁、3失敗で交代',W/2,H-8);
}

function frame(ts){let dt=ts-last;last=ts;if(dt>60)dt=60;if(dt<0)dt=0;update(dt);render();requestAnimationFrame(frame);}
requestAnimationFrame(frame);

// ---------- test hook ----------
window.__dlp={
  start, fire:()=>fire(),
  get state(){return state;},
  get score(){return score;},
  get outs(){return outs;},
  get fails(){return fails;},
  get info(){return {state,phase,clock,wsT,win,cueLead,thrown,throwClock,tough,result,outs,fails,lvl,
    canFire:(phase==='set'&&!thrown&&clock>=wsT&&clock<=wsT+win),
    cueOn:(phase==='set'&&clock>=wsT-cueLead)};}
};
})();
</script>
</body>
</html>
