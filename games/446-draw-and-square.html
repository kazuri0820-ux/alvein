<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>引きつけて、決めさせろ (Draw and Square)</title>
<style>
  html,body{margin:0;padding:0;background:#08140d;overflow:hidden;font-family:'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif;-webkit-user-select:none;user-select:none;touch-action:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 30%,#18361f,#050d08 72%);}
  #stage{position:relative;width:min(100vw,calc(100vh*1.5));aspect-ratio:900/600;max-width:900px;box-shadow:0 10px 60px rgba(0,0,0,.6);border-radius:8px;overflow:hidden;}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;}
</style>
</head>
<body>
<div id="wrap"><div id="stage"><canvas id="cv"></canvas></div></div>
<script>
(function(){
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const W=900,H=600;let DPR=Math.min(2,window.devicePixelRatio||1);
function fit(){const r=cv.getBoundingClientRect();DPR=Math.min(2,window.devicePixelRatio||1);cv.width=Math.round(r.width*DPR);cv.height=Math.round(r.height*DPR);ctx.setTransform(cv.width/W,0,0,cv.height/H,0,0);}
new ResizeObserver(fit).observe(cv);fit();

// ---------- audio ----------
let AC=null;function actx(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function tone(f,d,type,v,sweep){const a=actx();if(!a)return;const o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.value=f;if(sweep)o.frequency.linearRampToValueAtTime(sweep,a.currentTime+d);g.gain.value=0.0001;g.gain.exponentialRampToValueAtTime(v||0.2,a.currentTime+0.008);g.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+d);o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+d+0.02);}
function noise(d,v,hp){const a=actx();if(!a)return;const n=a.createBufferSource(),b=a.createBuffer(1,a.sampleRate*d,a.sampleRate),dt=b.getChannelData(0);for(let i=0;i<dt.length;i++)dt[i]=Math.random()*2-1;n.buffer=b;const f=a.createBiquadFilter();f.type='highpass';f.frequency.value=hp||800;const g=a.createGain();g.gain.value=0.0001;g.gain.exponentialRampToValueAtTime(v||0.2,a.currentTime+0.01);g.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+d);n.connect(f);f.connect(g);g.connect(a.destination);n.start();n.stop(a.currentTime+d+0.02);}
const S={
  run(){tone(300,0.05,'sine',0.05);},
  square(){tone(520,0.09,'sine',0.14,700);noise(0.03,0.05,700);},
  tap(){noise(0.05,0.16,600);tone(240,0.08,'square',0.14,120);},
  goal(){tone(560,0.1,'triangle',0.2);setTimeout(function(){tone(760,0.14,'triangle',0.22);},110);setTimeout(function(){tone(1000,0.2,'triangle',0.22);},230);},
  roar(){noise(0.5,0.14,300);},
  cut(){noise(0.09,0.2,500);tone(220,0.1,'square',0.14,120);},
  smother(){tone(300,0.24,'sawtooth',0.16,150);noise(0.1,0.12,400);},
  combo(n){tone(600+Math.min(n,8)*70,0.12,'triangle',0.16);},
  over(){tone(330,0.3,'sine',0.2,160);setTimeout(function(){tone(220,0.5,'sine',0.2,110);},180);},
  start(){tone(440,0.1,'triangle',0.18);setTimeout(function(){tone(660,0.16,'triangle',0.2);},110);},
};

function clamp(v,a,b){return v<a?a:v>b?b:v;}
function rnd(a,b){return a+Math.random()*(b-a);}

// ---------- state ----------
let state='title';
let outs=0,fails=0,score=0,combo=0,lvl=1;   // outs = goals set up
let best=0;try{best=parseInt(localStorage.getItem('ds_best')||'0')||0;}catch(e){}
const TARGET=26;

let phase='wind';  // wind | watch | result
let pt=0, clock=0;
let deadT=1100, win=500, effWin=500, winStart=600, tough=false;
let decided=false, result='', squareClock=0, quality=0;
let parts=[];
let shakeT=0,flash=0;
let msg='',msgCol='#fff',msgT=0;
let ballU=0, tapU=0;
let lastAdd=0;
// scene
const GOALC=[450,86];
const CAR_A=[500,432], CAR_B=[486,244];   // you (ball carrier) advance up the middle
const TM_A=[326,432],  TM_B=[314,244];    // teammate runs parallel (left)
const GK_HOME=[450,150];
let carX=500,carY=432, tmX=326,tmY=432, gkX=450,gkY=150, ballX=500,ballY=432;

function reset(){outs=0;fails=0;score=0;combo=0;lvl=1;parts=[];}
function gkPos(c){const gu=clamp(c/deadT,0,1);return [GK_HOME[0]+(carX-GK_HOME[0])*gu*0.6, GK_HOME[1]+((carY-96)-GK_HOME[1])*gu], gu;}
function newPlay(){
  lvl=Math.min(7,1+Math.floor(outs/4));
  deadT=clamp(1180-lvl*58,720,1180);
  win=clamp(520-lvl*30,300,520);
  tough=Math.random()<clamp(0.2+lvl*0.05,0.2,0.5);
  effWin=tough?win*0.82:win;
  winStart=deadT-effWin;
  phase='wind';pt=0;clock=0;decided=false;result='';squareClock=0;quality=0;ballU=0;tapU=0;
  carX=CAR_A[0];carY=CAR_A[1];tmX=TM_A[0];tmY=TM_A[1];gkX=GK_HOME[0];gkY=GK_HOME[1];ballX=CAR_A[0];ballY=CAR_A[1];
}
function startGame(){reset();state='play';newPlay();S.start();}

function burst(x,y,col,n,sp){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=rnd(0.4,1)*(sp||3);parts.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:1,col:col,r:rnd(2,5)});}}
function lerp(a,b,t){return [a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t];}

function resolve(kind){
  decided=true;result=kind;squareClock=clock;ballU=0;
  if(kind==='cross'){
    outs++;combo++;
    quality=clamp((clock-winStart)/effWin,0,1);   // later = GK more committed = bigger empty net
    const cm=1+Math.min(combo-1,6)*0.14;
    const add=Math.round((100+quality*150)*cm)*Math.max(1,lvl);
    score+=add;lastAdd=add;
    S.square();setTimeout(S.tap,300);setTimeout(S.goal,360);setTimeout(S.roar,430);if(combo>1)setTimeout(function(){S.combo(combo);},560);
    flash=0.28;
    msg=(quality>0.72?'GKを完全に釣り出して横パス！ 無人のゴールへ！':'GKを引きつけてスクエア！ 味方が流し込む！')+'  +'+add;msgCol='#5affa0';msgT=1;
  }else{
    combo=0;fails++;
    if(result==='early'){S.cut();}else{S.smother();}
    setTimeout(S.over,60);flash=0.32;shakeT=0.6;
    if(result==='early')msg='スクエアが早い！ GKが立ったままパスを切った';
    else msg='引きつけ過ぎ！ GKに詰められてボールを奪われた';
    msgCol='#ff6a6a';msgT=1;
  }
  phase='result';pt=0;
}

function cross(){
  if(state!=='play'||phase!=='watch'||decided)return;
  const c=clock;
  if(c<winStart)resolve('early');
  else resolve('cross');
}

// ---------- input ----------
function act(){if(!AC)actx();if(state==='title'){startGame();return;}if(state==='over'){startGame();return;}cross();}
cv.addEventListener('mousedown',function(e){e.preventDefault();act();});
cv.addEventListener('touchstart',function(e){e.preventDefault();act();},{passive:false});
window.addEventListener('keydown',function(e){
  if(e.code==='Space'||e.code==='ArrowUp'||e.code==='Enter'||e.code==='KeyJ'){e.preventDefault();act();}
});

// ---------- update ----------
let last=0;
function update(dt){
  if(flash>0)flash=Math.max(0,flash-dt/300);
  if(shakeT>0)shakeT=Math.max(0,shakeT-dt/320);
  if(msgT>0)msgT=Math.max(0,msgT-dt/1500);
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.x+=p.vx;p.y+=p.vy;p.vy+=0.16;p.life-=dt/640;if(p.life<=0)parts.splice(i,1);}
  if(state!=='play')return;
  pt+=dt;
  if(phase==='wind'){
    if(pt>=440){phase='watch';pt=0;clock=0;S.run();}
  }else if(phase==='watch'){
    clock+=dt;
    const u=clamp(clock/deadT,0,1);
    const cp=lerp(CAR_A,CAR_B,u); carX=cp[0];carY=cp[1]; ballX=carX+6;ballY=carY-4;
    const tp=lerp(TM_A,TM_B,u); tmX=tp[0];tmY=tp[1];
    const gu=clamp(clock/deadT,0,1); gkX=GK_HOME[0]+(carX-GK_HOME[0])*gu*0.6; gkY=GK_HOME[1]+((carY-92)-GK_HOME[1])*gu;
    if(clock>=deadT&&!decided)resolve('late');
  }else if(phase==='result'){
    if(ballU<1)ballU=Math.min(1,ballU+dt/280);
    if(result==='cross'){
      if(ballU<1){ const p=lerp([carX,carY-4],[tmX,tmY-6],ballU); ballX=p[0];ballY=p[1]; }
      else { tapU=Math.min(1,tapU+dt/240); const p=lerp([tmX,tmY-6],[GOALC[0]-40,GOALC[1]+18],tapU); ballX=p[0];ballY=p[1]; if(tapU<0.6&&Math.random()<0.2)burst(ballX,ballY,'#cfe',1,1.4); }
    }else if(result==='early'){ const p=lerp([carX,carY-4],[gkX,gkY],ballU); ballX=p[0];ballY=p[1]; }   // GK cuts the square
    else { const p=lerp([carX,carY-4],[gkX,gkY+6],Math.min(ballU*1.4,1)); ballX=p[0];ballY=p[1]; }        // smothered at your feet
    if(pt>=1200){
      if(fails>=3){state='over';best=Math.max(best,score);try{localStorage.setItem('ds_best',String(best));}catch(e){}S.over();}
      else if(outs>=TARGET){state='over';best=Math.max(best,score);try{localStorage.setItem('ds_best',String(best));}catch(e){}S.goal();}
      else newPlay();
    }
  }
}

// ---------- render ----------
function roundRect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

const GL=350,GR=550,GTOP=48,GLINE=120;
function drawField(){
  for(let i=0;i<9;i++){ctx.fillStyle=i%2?'#2b6b3d':'#256036';ctx.fillRect(0,i*(H/9),W,H/9);}
  // goal top-centre
  ctx.fillStyle='rgba(255,255,255,.06)';ctx.fillRect(GL,GTOP,GR-GL,GLINE-GTOP);
  ctx.strokeStyle='rgba(255,255,255,.18)';ctx.lineWidth=1;
  for(let x=GL;x<=GR;x+=14){ctx.beginPath();ctx.moveTo(x,GTOP);ctx.lineTo(x,GLINE);ctx.stroke();}
  for(let y=GTOP+11;y<GLINE;y+=12){ctx.beginPath();ctx.moveTo(GL,y);ctx.lineTo(GR,y);ctx.stroke();}
  ctx.fillStyle='#f2f2f2';ctx.fillRect(GL-6,GTOP-5,6,GLINE-GTOP+6);ctx.fillRect(GR,GTOP-5,6,GLINE-GTOP+6);ctx.fillRect(GL-6,GTOP-5,GR-GL+12,6);
  ctx.fillStyle='#fff';ctx.fillRect(GL-6,GLINE,GR-GL+12,3);
  // box + arc
  ctx.strokeStyle='rgba(255,255,255,.4)';ctx.lineWidth=3;ctx.strokeRect(250,GLINE,400,150);
}

function person(x,y,col,glow,lean){
  ctx.save();ctx.translate(x,y);if(lean)ctx.rotate(lean);
  if(glow>0){ctx.strokeStyle='rgba(90,255,160,'+glow+')';ctx.lineWidth=4;ctx.beginPath();ctx.arc(0,-18,26,0,Math.PI*2);ctx.stroke();}
  ctx.fillStyle='rgba(0,0,0,.26)';ctx.beginPath();ctx.ellipse(0,4,14,5,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#222';ctx.fillRect(-8,-4,7,22);ctx.fillRect(1,-4,7,22);
  ctx.fillStyle=col;ctx.fillRect(-11,-30,22,28);
  ctx.fillStyle='#f0c9a0';ctx.beginPath();ctx.arc(0,-40,8,0,Math.PI*2);ctx.fill();
  ctx.restore();
}

function drawKeeper(x,y,commit){
  ctx.save();ctx.translate(x,y);
  ctx.fillStyle='rgba(0,0,0,.26)';ctx.beginPath();ctx.ellipse(0,6,16+commit*8,5,0,0,Math.PI*2);ctx.fill();
  // legs spread wider as the keeper commits/goes to ground
  const sp=6+commit*16;
  ctx.fillStyle='#222';ctx.fillRect(-sp,-2,7,20);ctx.fillRect(sp-7,-2,7,20);
  ctx.fillStyle='#e9d84a';ctx.fillRect(-12,-28,24,28);
  ctx.fillStyle='#f0c9a0';ctx.beginPath();ctx.arc(0,-38,8,0,Math.PI*2);ctx.fill();
  // arms spread
  ctx.strokeStyle='#e9d84a';ctx.lineWidth=5;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(-8,-20);ctx.lineTo(-14-commit*12,-8);ctx.moveTo(8,-20);ctx.lineTo(14+commit*12,-8);ctx.stroke();
  ctx.restore();
}

function drawScene(){
  drawField();
  const gu=clamp((phase==='watch'?clock:squareClock)/deadT,0,1);
  // keeper advancing / committing
  drawKeeper(gkX,gkY,gu);
  // trailing defender (beaten, behind)
  person(carX+20,carY+40,'#c0343a',0,0);
  // teammate running parallel (blue) — glows in the square window (open for the tap-in)
  const win=(phase==='watch'&&!decided&&clock>=winStart);
  person(tmX,tmY,'#2f6fd0',win?0.9:0,0.08);
  // you (ball carrier, yellow)
  person(carX,carY,'#e8d24a',0,(phase==='watch')?0.12:0);
  // pass lane hint (you -> teammate) once the window opens
  if(win){ctx.strokeStyle='rgba(90,255,160,.4)';ctx.setLineDash([8,7]);ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(carX,carY-10);ctx.lineTo(tmX,tmY-10);ctx.stroke();ctx.setLineDash([]);}
  // ball
  ctx.fillStyle='rgba(0,0,0,.2)';ctx.beginPath();ctx.ellipse(ballX,ballY+7,7,3,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(ballX,ballY,7,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#111';ctx.beginPath();ctx.arc(ballX,ballY,2.6,0,Math.PI*2);ctx.fill();
}

function drawTimingBar(){
  if(state!=='play')return;
  const mx=150,mw=600,my=560,mh=18;
  roundRect(mx,my,mw,mh,9);ctx.fillStyle='rgba(0,0,0,.45)';ctx.fill();
  const end=deadT;
  const wsX=mx+mw*clamp(winStart/end,0,1);
  ctx.fillStyle='rgba(210,70,70,.30)';ctx.fillRect(mx,my,wsX-mx,mh);
  const gg=ctx.createLinearGradient(wsX,0,mx+mw,0);gg.addColorStop(0,'rgba(90,220,150,.35)');gg.addColorStop(1,'rgba(60,255,150,.95)');
  ctx.fillStyle=gg;ctx.fillRect(wsX,my,(mx+mw)-wsX,mh);
  roundRect(mx,my,mw,mh,9);ctx.strokeStyle='rgba(255,255,255,.4)';ctx.lineWidth=1.5;ctx.stroke();
  ctx.font='11px sans-serif';ctx.textAlign='left';ctx.fillStyle='#ff9a9a';ctx.fillText('早い＝GKに切られる',mx+4,my-6);
  ctx.textAlign='right';ctx.fillStyle='#aaffcf';ctx.fillText('引きつけてスクエア（深いほど◎）',mx+mw-4,my-6);
  if(phase==='watch'||phase==='result'){
    const cc=(phase==='watch')?clock:squareClock;
    const px=mx+mw*clamp((result==='late'?deadT:cc)/end,0,1);
    ctx.fillStyle=(phase==='result')?(result==='cross'?'#5affa0':'#ff6a6a'):'#fff';
    ctx.fillRect(px-2,my-5,4,mh+10);
  }
}

function drawHUD(){
  ctx.textAlign='left';ctx.textBaseline='alphabetic';
  ctx.font='bold 20px sans-serif';ctx.fillStyle='#fff';
  ctx.fillText('ゴール '+outs+' / '+TARGET,20,32);
  ctx.font='14px sans-serif';ctx.fillStyle='#ffb14a';ctx.fillText('失敗 '+fails+' / 3',20,54);
  ctx.textAlign='right';
  ctx.font='bold 20px sans-serif';ctx.fillStyle='#ffe08a';ctx.fillText('SCORE '+score,W-20,32);
  ctx.font='13px sans-serif';ctx.fillStyle='#bfe';ctx.fillText('BEST '+Math.max(best,score)+'   Lv.'+lvl,W-20,52);
  if(combo>1){ctx.textAlign='center';ctx.font='bold 20px sans-serif';ctx.fillStyle='#5affa0';ctx.fillText(combo+' 連続ゴール!',450,300);}
  if(phase==='watch'&&!decided){ctx.textAlign='center';ctx.font='bold 15px sans-serif';ctx.fillStyle='#ffe08a';ctx.fillText('味方が並走！ GKを引きつけてから横パスで決めさせろ',450,336);}
}

function drawMsg(){
  if(msgT<=0)return;
  ctx.save();ctx.globalAlpha=clamp(msgT*1.4,0,1);
  ctx.textAlign='center';ctx.font='bold 23px sans-serif';
  ctx.fillStyle='rgba(0,0,0,.6)';roundRect(450-300,388,600,42,10);ctx.fill();
  ctx.fillStyle=msgCol;ctx.fillText(msg,450,416);
  ctx.restore();
}

function drawTitle(){
  drawField();
  ctx.save();ctx.textAlign='center';
  ctx.fillStyle='rgba(0,0,0,.68)';roundRect(96,104,708,392,16);ctx.fill();
  ctx.fillStyle='#fff';ctx.font='bold 32px sans-serif';ctx.fillText('引きつけて、決めさせろ',450,158);
  ctx.font='18px sans-serif';ctx.fillStyle='#9fe0bf';ctx.fillText('Draw and Square',450,188);
  ctx.font='16px sans-serif';ctx.fillStyle='#e6fcef';
  const lines=[
    'あなたはカウンターの起点。GKと2対1で抜け出した！',
    '並走する味方がいる——GKを限界まで“引きつけて”から',
    '横パス（スクエア）で味方に決めさせろ。',
    '引きつけるほどGKが釣り出され、無人のゴールが大きく開く。',
    '早いとGKが立ったままパスを切られる。',
    '引きつけ過ぎるとGKに詰められて奪われる。',
    'タップ / クリック / SPACE で横パス。3失敗で終了。',
  ];
  for(let i=0;i<lines.length;i++)ctx.fillText(lines[i],450,224+i*29);
  ctx.fillStyle='#ffe08a';ctx.font='bold 22px sans-serif';
  ctx.fillText('タップ / SPACE でスタート',450,476);
  ctx.restore();
}

function drawOver(){
  drawField();
  ctx.save();ctx.textAlign='center';
  ctx.fillStyle='rgba(0,0,0,.68)';roundRect(190,150,520,300,16);ctx.fill();
  const w2=outs>=TARGET;
  ctx.fillStyle=w2?'#5affa0':'#ff8a5a';ctx.font='bold 34px sans-serif';
  ctx.fillText(w2?'名アシスト！':'決めさせられず…',450,222);
  ctx.fillStyle='#fff';ctx.font='20px sans-serif';
  ctx.fillText('ゴール '+outs+' / '+TARGET,450,270);
  ctx.fillText('スコア '+score,450,304);
  ctx.fillStyle='#ffe08a';ctx.fillText('ベスト '+Math.max(best,score),450,336);
  ctx.fillStyle='#9fe0bf';ctx.font='bold 20px sans-serif';
  ctx.fillText('タップ / SPACE でもう一度',450,404);
  ctx.restore();
}

function render(){
  ctx.save();
  if(shakeT>0){const s=shakeT*7;ctx.translate(rnd(-s,s),rnd(-s,s));}
  if(state==='title'){drawTitle();}
  else if(state==='over'){drawOver();}
  else{
    drawScene();
    drawTimingBar();
    drawHUD();
    drawMsg();
  }
  for(const p of parts){ctx.globalAlpha=clamp(p.life,0,1);ctx.fillStyle=p.col;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();}
  ctx.globalAlpha=1;
  ctx.restore();
  if(flash>0){ctx.fillStyle='rgba(255,255,255,'+(flash*0.5)+')';ctx.fillRect(0,0,W,H);}
}

function frame(ts){let dt=ts-last;last=ts;if(dt>60)dt=60;if(dt<0)dt=0;update(dt);render();requestAnimationFrame(frame);}
requestAnimationFrame(frame);

// ---------- test hook ----------
window.__ds={
  start:startGame,
  cross:cross,   // cross() = play the square pass
  get state(){return state;},
  get outs(){return outs;},
  get fails(){return fails;},
  get score(){return score;},
  get info(){return {state:state,phase:phase,clock:clock,deadT:deadT,win:win,effWin:effWin,winStart:winStart,tough:tough,decided:decided,result:result,quality:quality,outs:outs,fails:fails,lvl:lvl,inWindow:(clock>=winStart&&clock<deadT),canAct:(state==='play'&&phase==='watch'&&!decided)};}
};
})();
</script>
</body>
</html>
