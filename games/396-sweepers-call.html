<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>飛び出すか、留まるか (Sweeper's Call)</title>
<style>
  html,body{margin:0;height:100%;background:#07100a;overflow:hidden;
    font-family:-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  #stage{position:relative;width:100vw;height:100vh;max-width:calc(100vh*1.5);max-height:calc(100vw/1.5);aspect-ratio:900/600;}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;border-radius:6px;}
</style>
</head>
<body>
<div id="wrap"><div id="stage"><canvas id="cv"></canvas></div></div>
<script>
(function(){
const W=900,H=600,cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let DPR=1;
function fit(){DPR=Math.min(2,window.devicePixelRatio||1);cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
fit();addEventListener('resize',fit);

// ---------- audio ----------
let AC=null;function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function tone(f,d,type,v,sweep){const a=ac();if(!a)return;const t=a.currentTime,o=a.createOscillator(),g=a.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(sweep)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+sweep),t+d);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v||0.2,t+0.008);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+0.02);}
function noise(d,v,hp){const a=ac();if(!a)return;const t=a.currentTime,n=Math.floor(a.sampleRate*d),buf=a.createBuffer(1,n,a.sampleRate),ch=buf.getChannelData(0);
  for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource();s.buffer=buf;
  const f=a.createBiquadFilter();f.type='highpass';f.frequency.value=hp||600;const g=a.createGain();g.gain.value=v||0.2;
  s.connect(f);f.connect(g);g.connect(a.destination);s.start(t);s.stop(t+d+0.02);}
const S={
  ball:()=>{tone(240,0.05,'sine',0.05,-40);},
  call:()=>{tone(520,0.05,'square',0.06);noise(0.03,0.05,1200);},
  claim:()=>{noise(0.05,0.16,500);tone(300,0.07,'square',0.09,-40);},
  good:()=>{[660,900,1180].forEach((f,i)=>setTimeout(()=>tone(f,0.11,'triangle',0.16),i*56));},
  big:()=>{[600,800,1000,1250].forEach((f,i)=>setTimeout(()=>tone(f,0.12,'triangle',0.17),i*80));},
  bad:()=>{noise(0.2,0.24,240);tone(150,0.24,'sawtooth',0.13,-50);},
  streak:()=>{[700,930,1170,1400].forEach((f,i)=>setTimeout(()=>tone(f,0.1,'triangle',0.16),i*60));},
  over:()=>{[440,330,247,175].forEach((f,i)=>setTimeout(()=>tone(f,0.3,'triangle',0.2),i*160));}
};

// ---------- geometry ----------
const GOAL={x:452,y:118}, GW=300, GH=72;
const GK={x:452,y:206};                     // you, on your line
const MEET={x:452,y:344};                    // claim point out in front (on a rush)
const BALL0={x:452,y:556};                   // through-ball played from deep
const STR0={x:452,y:582};                    // striker chasing onto it

// ---------- state ----------
let state='title', phase='set', plays=0;
let score=0, combo=0, best=+(localStorage.getItem('sk_best')||0);
let outs=0, fails=0, lvl=1;   // outs = danger snuffed out
let clock=0, revealT=520, callWin=980, winnable=true, tough=false;
let decided=false, rushed=false, result=null, resultT=0, msg='', msgOk=false, anim=0;
let shake=0, flash=0, flashCol='#fff', last=performance.now();
let parts=[], pops=[];

function rnd(a,b){return a+Math.random()*(b-a);}
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function lerp(a,b,u){return a+(b-a)*u;}
function easeOut(u){return 1-Math.pow(1-u,2);}

function reset(){state='title';score=0;combo=0;outs=0;fails=0;lvl=1;plays=0;result=null;parts=[];pops=[];}

function newPlay(){
  plays++; lvl=Math.min(7,1+Math.floor(outs/4));
  revealT=clamp(560-lvl*24,360,560);
  callWin=clamp(1020-lvl*70,560,1020);
  tough=Math.random()<clamp(0.2+lvl*0.05,0.2,0.5);
  winnable=(Math.random()<0.5);
  phase='set'; clock=0; decided=false; rushed=false; result=null; resultT=0; msg=''; msgOk=false; anim=0;
  S.ball();
}
function start(){ if(!ac())ac(); if(AC&&AC.state==='suspended')AC.resume(); reset(); state='play'; newPlay(); }

// tap = commit to RUSHING out. Holding = do nothing.
function act(){
  if(state==='title'){start();return;}
  if(state==='over'){ if(resultT>0.4){reset();start();} return; }
  if(state!=='play'||phase!=='set'||decided) return;
  if(clock<revealT){ decided=true; rushed=true; resolve('early'); return; }
  decided=true; rushed=true;
  resolve(winnable?'claim':'caught');
}

function resolve(k){
  phase='result'; result=k; resultT=0; anim=0;
  if(k==='claim'||k==='held'){
    outs++; combo++;
    let add=Math.round((tough?250:150)*(1+Math.min(9,combo-1)*0.14)); score+=add;
    S.claim(); setTimeout(S.good,140); if(tough)setTimeout(S.big,220);
    msgOk=true; flash=1;flashCol='#8affa0';shake=6;
    const bx=(k==='claim')?MEET.x:GK.x, by=(k==='claim')?MEET.y:GK.y; burst(bx,by,'#8affa0',18,7);
    if(k==='claim'){
      pop(W/2,250,(tough?'際どい50-50を制して飛び出しキャッチ！ +':'一歩早く飛び出してボールを回収——ピンチ阻止！ +')+add,'#d6ffe0');
      msg='勝てると見て飛び出した——ストライカーより一歩早くボールに触れ、抱え込んでピンチを摘み取った！';
    } else {
      pop(W/2,250,(tough?'冷静に見極めてステイ——不用意に出ず正面で対応！ +':'間に合わないと見て留まり、正面で対応——失点を防いだ！ +')+add,'#d6ffe0');
      msg='間に合わないと見て飛び出さずにステイ——ゴールを空けず、寄せてきた相手の難しい体勢のシュートを正面で受け止めた！';
    }
    if(combo>=2)pop(W/2,214,'コンボ x'+combo,'#ffd24d');
    if(combo>0&&combo%5===0)S.streak();
  } else {
    fails++; combo=0; msgOk=false; flash=1;flashCol='#ff5b5b';shake=8; S.bad();
    if(k==='caught') msg='飛び出し過ぎ…間に合わないボールに突っ込み、ストライカーにかわされて無人のゴールへ流し込まれた';
    else if(k==='missed') msg='留まり過ぎ…勝てるボールに出ず、抜け出したストライカーに独走を許して決められた';
    else msg='判断が早い…勝てるか見える前に飛び出し、中途半端な位置で釣り出されて置き去りにされた';
    pop(W/2,250,(k==='caught')?'出過ぎた…かわされ失点':(k==='missed')?'留まり過ぎ…抜け出され失点':'早い…釣り出された','#ffb0b0');
  }
  if(fails>=3){ state='over'; resultT=0; S.over(); if(score>best){best=score;localStorage.setItem('sk_best',best);} }
}

// ---------- input ----------
const BW=300, BY=520, BH=60, BX=W/2-BW/2;
cv.addEventListener('pointerdown',e=>{e.preventDefault();act();});
addEventListener('keydown',e=>{ if(e.repeat)return; if(e.code==='Space'||e.code==='Enter'||e.code==='ArrowUp'||e.code==='KeyF'||e.code==='KeyJ'){e.preventDefault();act();} });

// ---------- particles ----------
function burst(x,y,c,n,sp){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=rnd(sp*0.3,sp);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:1,c});}}
function pop(x,y,txt,c){pops.push({x,y,txt,c,life:1});}

// ---------- update ----------
function update(dt){
  shake*=Math.pow(0.86,dt/16.7); if(shake<0.3)shake=0;
  flash*=Math.pow(0.9,dt/16.7);
  for(const p of parts){p.vx*=0.96;p.vy=p.vy*0.96+0.28;p.x+=p.vx*dt/16.7;p.y+=p.vy*dt/16.7;p.life-=dt/16.7*0.026;}
  parts=parts.filter(p=>p.life>0);
  for(const p of pops){p.y-=dt/16.7*0.5;p.life-=dt/16.7*0.02;}
  pops=pops.filter(p=>p.life>0);

  if(state!=='play'){ if(state==='over')resultT+=dt/1000; return; }
  if(phase==='set'){ const before=clock<revealT; clock+=dt;
    if(before&&clock>=revealT)S.call();
    if(!decided && clock>revealT+callWin){ decided=true; rushed=false; resolve(winnable?'missed':'held'); }
    return; }
  if(phase==='result'){ resultT+=dt/1000; anim=Math.min(1,anim+dt/420); if(resultT>1.55) newPlay(); return; }
}

// ---------- render ----------
function drawField(){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#0f5e34');g.addColorStop(0.55,'#0e5230');g.addColorStop(1,'#0c4429');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='rgba(255,255,255,0.03)';for(let i=0;i<6;i++){ if(i%2===0)ctx.fillRect(0,80+i*95,W,95); }
  ctx.strokeStyle='rgba(255,255,255,0.26)';ctx.lineWidth=3;ctx.strokeRect(GOAL.x-250,GOAL.y+GH,500,300);ctx.strokeRect(GOAL.x-120,GOAL.y+GH,240,120);
  ctx.beginPath();ctx.arc(GOAL.x,GOAL.y+GH+300,54,Math.PI*0.08,Math.PI*0.92);ctx.stroke();
  ctx.fillStyle='rgba(0,0,0,0.28)';ctx.fillRect(GOAL.x-GW/2-4,GOAL.y-4,GW+8,GH+4);
  ctx.strokeStyle='rgba(255,255,255,0.34)';ctx.lineWidth=1;
  for(let gx=GOAL.x-GW/2;gx<=GOAL.x+GW/2;gx+=16){ctx.beginPath();ctx.moveTo(gx,GOAL.y);ctx.lineTo(gx,GOAL.y+GH);ctx.stroke();}
  for(let gy=GOAL.y;gy<=GOAL.y+GH;gy+=13){ctx.beginPath();ctx.moveTo(GOAL.x-GW/2,gy);ctx.lineTo(GOAL.x+GW/2,gy);ctx.stroke();}
  ctx.strokeStyle='#f2f2f2';ctx.lineWidth=6;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(GOAL.x-GW/2,GOAL.y+GH);ctx.lineTo(GOAL.x-GW/2,GOAL.y);ctx.lineTo(GOAL.x+GW/2,GOAL.y);ctx.lineTo(GOAL.x+GW/2,GOAL.y+GH);ctx.stroke();
  ctx.lineCap='butt';
}
function person(x,y,col,s,lean){s=s||1;lean=lean||0;
  ctx.save();ctx.translate(x,y);ctx.rotate(lean);
  ctx.fillStyle='rgba(0,0,0,0.2)';ctx.beginPath();ctx.ellipse(0,13*s,10*s,4*s,0,0,6.28);ctx.fill();
  ctx.fillStyle=col;ctx.beginPath();ctx.ellipse(0,-14*s,9*s,14*s,0,0,6.28);ctx.fill();
  ctx.fillStyle='#f0c9a0';ctx.beginPath();ctx.arc(0,-31*s,7*s,0,6.28);ctx.fill();
  ctx.restore();
}
function keeper(x,y,dive){ ctx.save();ctx.translate(x,y);
  ctx.fillStyle='rgba(0,0,0,0.2)';ctx.beginPath();ctx.ellipse(0,13,11,4,0,0,6.28);ctx.fill();
  ctx.fillStyle='#e8c23a';ctx.beginPath();ctx.ellipse(0,-14,9,14,0,0,6.28);ctx.fill();
  ctx.fillStyle='#f0c9a0';ctx.beginPath();ctx.arc(0,-31,7,0,6.28);ctx.fill();
  // gloves reaching forward when claiming
  if(dive){ ctx.strokeStyle='#2b8a5b';ctx.lineWidth=6;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(-4,-18);ctx.lineTo(-2,-40);ctx.moveTo(4,-18);ctx.lineTo(2,-40);ctx.stroke();
    ctx.fillStyle='#eef2f0';ctx.beginPath();ctx.arc(-2,-42,5,0,6.28);ctx.arc(2,-42,5,0,6.28);ctx.fill(); }
  ctx.restore(); }
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

function render(){
  ctx.save();
  if(shake>0)ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
  drawField();

  if(state==='play'||state==='over'){
    const revealed=(phase==='set'&&clock>=revealT)||phase==='result';

    // ball: played from deep up toward the box; on result it continues per outcome
    let b, prog=clamp(clock/(revealT+callWin*0.7),0,1);
    if(phase==='set'){ b={x:BALL0.x+Math.sin(clock/120)*6, y:lerp(BALL0.y,MEET.y+6,easeOut(prog))}; }
    else { const u=easeOut(anim);
      if(result==='claim'){ b={x:MEET.x, y:MEET.y}; }
      else if(result==='held'){ b={x:lerp(MEET.x+6,GK.x,u), y:lerp(MEET.y+6,GK.y-6,u)}; }
      else if(result==='caught'){ b={x:lerp(MEET.x,GOAL.x-40,u), y:lerp(MEET.y,GOAL.y+GH*0.5,u)}; }   // slotted into empty net
      else if(result==='missed'){ b={x:lerp(MEET.x,GOAL.x+50,u), y:lerp(MEET.y,GOAL.y+GH*0.5,u)}; }
      else { b={x:MEET.x, y:lerp(MEET.y+40,MEET.y-10,u)}; }   // early: ball loose
    }

    // striker chasing up onto the ball
    let strT = phase==='set' ? clamp(clock/(revealT+callWin*(winnable?1.15:0.62)),0,1) : Math.min(1,anim*1.05);
    let sty=lerp(STR0.y, MEET.y+ (winnable?24:2), easeOut(strT));
    let sty2=sty;
    if(phase==='result'&&(result==='caught'||result==='missed')){ sty2=lerp(STR0.y,GOAL.y+GH+10,easeOut(anim)); }
    person(STR0.x-2, phase==='result'?sty2:sty, '#2b6fd6', 1.0, 0.12);

    // keeper
    let gkx=GK.x, gky=GK.y, diving=false;
    if(phase==='set'){ if(revealed && rushed){} gkx=GK.x; gky=GK.y; }
    if(phase==='result'){ const u=easeOut(anim);
      if(result==='claim'){ gky=lerp(GK.y,MEET.y-6,u); diving=u>0.4; }
      else if(result==='caught'){ gky=lerp(GK.y,MEET.y+10,u*0.9); diving=true; }
      else if(result==='early'){ gky=lerp(GK.y,(GK.y+MEET.y)/2,u); }
      else { gky=GK.y+Math.sin(u*3.14)*4; }   // held / missed: stays on line
    }
    keeper(gkx,gky,diving);

    // ball on top
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(b.x,b.y,8,0,6.28);ctx.fill();
    ctx.strokeStyle='#333';ctx.lineWidth=1.1;ctx.beginPath();ctx.arc(b.x,b.y,8,0.4,2.2);ctx.stroke();

    // reveal tell
    ctx.textAlign='center';
    if(revealed&&phase==='set'){
      if(winnable){ ctx.fillStyle='rgba(140,255,160,0.98)';ctx.font='bold 27px sans-serif';ctx.fillText('出られる！ 飛び出せ ▲', MEET.x, MEET.y-34); }
      else { ctx.fillStyle='rgba(255,120,110,0.98)';ctx.font='bold 27px sans-serif';ctx.fillText('間に合わない… ステイ', MEET.x, MEET.y-34); }
    }
    if(state==='play'&&phase==='set'){
      if(clock<revealT){ ctx.fillStyle='rgba(255,220,90,0.95)';ctx.font='bold 20px sans-serif';ctx.fillText('裏へ抜けるボール——勝てるか見極めろ！',W/2,44); }
      else { ctx.fillStyle='rgba(255,220,120,0.98)';ctx.font='bold 22px sans-serif';ctx.fillText(winnable?'今だ、飛び出せ！':'出るな、ステイ！',W/2,44);
        const p=clamp((clock-revealT)/callWin,0,1),bw=250,x=W/2-bw/2,y=58;
        ctx.fillStyle='rgba(255,255,255,0.18)';ctx.fillRect(x,y,bw,7);ctx.fillStyle=p<0.7?'#8affa0':(p<1?'#ffd24d':'#ff5b5b');ctx.fillRect(x,y,bw*p,7); }
    }
    // action button
    if(state==='play'){
      const active=phase==='set'&&clock>=revealT;
      ctx.fillStyle=active?'#2b6fd6':'rgba(255,255,255,0.10)';rr(BX,BY,BW,BH,10);ctx.fill();
      ctx.fillStyle=active?'#eaf4ff':'rgba(255,255,255,0.5)';ctx.textAlign='center';ctx.font='bold 20px sans-serif';ctx.fillText('▲ 飛び出す（タップ / SPACE）',BX+BW/2,BY+27);
      ctx.font='11px sans-serif';ctx.fillText('勝てる時だけ飛び出す。間に合わない時は“何もしない”＝ステイ',BX+BW/2,BY+46);
    }
  }

  for(const p of parts){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,3.2,0,6.28);ctx.fill();}
  ctx.globalAlpha=1;
  for(const p of pops){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.font='bold 20px sans-serif';ctx.textAlign='center';ctx.fillText(p.txt,p.x,p.y);}
  ctx.globalAlpha=1;

  // HUD
  ctx.textAlign='left';ctx.fillStyle='#fff';ctx.font='bold 26px sans-serif';ctx.fillText('SCORE '+score,20,36);
  ctx.textAlign='right';ctx.fillStyle='rgba(255,255,255,0.9)';ctx.font='14px sans-serif';ctx.fillText('阻止 '+outs+'  Lv'+lvl,W-20,24);
  ctx.fillText('失点',W-92,46);
  for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(W-60+i*20,41,7,0,6.28);ctx.fillStyle=i<fails?'#ff5b5b':'rgba(255,255,255,0.25)';ctx.fill();}
  if(combo>=2){ctx.textAlign='center';ctx.fillStyle='#ffd24d';ctx.font='bold 18px sans-serif';ctx.fillText('コンボ x'+combo,W/2,112);}

  if(state==='play'&&phase==='result'&&msg){ctx.textAlign='center';ctx.fillStyle=msgOk?'#9ff0b8':'#ff9a9a';ctx.font='bold 14px sans-serif';ctx.fillText(msg,W/2,300);}

  if(state==='title'){
    ctx.fillStyle='rgba(3,10,6,0.84)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='bold 38px sans-serif';ctx.fillText('飛び出すか、留まるか',W/2,78);
    ctx.fillStyle='#ffd23e';ctx.font='bold 22px sans-serif';ctx.fillText("Sweeper's Call",W/2,114);
    ctx.fillStyle='rgba(255,255,255,0.92)';ctx.font='16px sans-serif';
    ctx.fillText('スイーパー型GKとして、裏へ抜けるボールに“飛び出して勝てるか”を瞬時に見極めろ',W/2,166);
    ctx.fillStyle='rgba(255,255,255,0.66)';ctx.font='14px sans-serif';
    ctx.fillText('「出られる！」＝勝てるボールならタップ/クリック/SPACE/↑で飛び出してキャッチ＝ピンチ阻止',W/2,206);
    ctx.fillText('「間に合わない」＝勝てないボールなら“何もしない”でステイ＝ゴールを空けず正面で対応＝これも正解',W/2,230);
    ctx.fillText('勝てないのに飛び出す＝かわされて無人のゴールへ／勝てるのに留まる＝抜け出されて独走で失点',W/2,254);
    ctx.fillText('見える前に飛び出す＝釣り出されて置き去り。際どい50-50を制すと大量加点。上級ほど判断が速い。3失点で交代',W/2,278);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で開始',W/2,348);
    ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='14px sans-serif';ctx.fillText('BEST '+best,W/2,380);
  }
  if(state==='over'){
    ctx.fillStyle='rgba(3,10,6,0.86)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#ff6b6b';ctx.font='bold 46px sans-serif';ctx.fillText('3失点…交代',W/2,222);
    ctx.fillStyle='#fff';ctx.font='bold 40px sans-serif';ctx.fillText('SCORE '+score,W/2,290);
    ctx.fillStyle='rgba(255,255,255,0.85)';ctx.font='19px sans-serif';ctx.fillText('阻止 '+outs+'   BEST '+best,W/2,330);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で もう一度',W/2,402);
  }

  if(flash>0.02){ctx.globalAlpha=flash*0.5;ctx.fillStyle=flashCol;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}
  ctx.restore();

  ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,0.4)';ctx.font='12px sans-serif';
  ctx.fillText('飛び出すか、留まるか：裏へのボールに勝てるなら飛び出してキャッチ、勝てないなら留まって正面で対応。出過ぎ・留まり過ぎ・早い判断は失点、3失点で交代',W/2,H-8);
}

function frame(ts){let dt=ts-last;last=ts;if(dt>60)dt=60;if(dt<0)dt=0;update(dt);render();requestAnimationFrame(frame);}
requestAnimationFrame(frame);

// ---------- test hook ----------
window.__sk={
  start, act:()=>act(),
  get state(){return state;},
  get score(){return score;},
  get outs(){return outs;},
  get fails(){return fails;},
  get info(){return {state,phase,clock,revealT,callWin,winnable,tough,decided,rushed,result,outs,fails,lvl,
    shouldRush:winnable,revealed:(clock>=revealT),canAct:(phase==='set'&&!decided)};}
};
})();
</script>
