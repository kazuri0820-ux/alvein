<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>還ってこい！ (Send Him Home)</title>
<style>
  html,body{margin:0;height:100%;background:#0a0d08;overflow:hidden;
    font-family:-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  #stage{position:relative;width:100vw;height:100vh;max-width:calc(100vh*1.5);max-height:calc(100vw/1.5);aspect-ratio:900/600;}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;border-radius:6px;}
</style>
</head>
<body>
<div id="wrap"><div id="stage"><canvas id="cv"></canvas></div></div>
<script>
(function(){
const W=900,H=600,cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let DPR=1;
function fit(){DPR=Math.min(2,window.devicePixelRatio||1);cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
fit();addEventListener('resize',fit);

// ---------- audio ----------
let AC=null;function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function tone(f,d,type,v,sweep){const a=ac();if(!a)return;const t=a.currentTime,o=a.createOscillator(),g=a.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(sweep)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+sweep),t+d);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v||0.2,t+0.008);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+0.02);}
function noise(d,v,hp){const a=ac();if(!a)return;const t=a.currentTime,n=Math.floor(a.sampleRate*d),buf=a.createBuffer(1,n,a.sampleRate),ch=buf.getChannelData(0);
  for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource();s.buffer=buf;
  const f=a.createBiquadFilter();f.type='highpass';f.frequency.value=hp||600;const g=a.createGain();g.gain.value=v||0.2;
  s.connect(f);f.connect(g);g.connect(a.destination);s.start(t);s.stop(t+d+0.02);}
const S={
  hit:()=>{noise(0.05,0.16,800);tone(280,0.06,'square',0.08,-70);},
  step:()=>{tone(150+Math.random()*30,0.03,'square',0.035);},
  relay:()=>{tone(380,0.05,'sine',0.06);noise(0.03,0.06,600);},
  safe:()=>{[620,880,1150].forEach((f,i)=>setTimeout(()=>tone(f,0.11,'triangle',0.16),i*56));},
  big:()=>{[600,800,1000,1250].forEach((f,i)=>setTimeout(()=>tone(f,0.12,'triangle',0.17),i*80));},
  out:()=>{noise(0.2,0.24,240);tone(150,0.24,'sawtooth',0.13,-50);},
  streak:()=>{[700,930,1170,1400].forEach((f,i)=>setTimeout(()=>tone(f,0.1,'triangle',0.16),i*60));},
  over:()=>{[440,330,247,175].forEach((f,i)=>setTimeout(()=>tone(f,0.3,'triangle',0.2),i*160));}
};

// ---------- geometry ----------
const HOME={x:452,y:476}, FIRST={x:686,y:352}, SECOND={x:452,y:200}, THIRD={x:218,y:352};
const CUT={x:512,y:300};                    // cut-off man (relays the throw home)
const HTYPES={
  deep:{of:{x:742,y:96},  name:'右中間を破る深い当たり', throwBase:4600, tight:'余裕'},
  gap:{of:{x:648,y:74},   name:'外野の間を抜けるギャップ', throwBase:4060, tight:'普通'},
  shal:{of:{x:566,y:132}, name:'外野前に落ちる浅い当たり', throwBase:3720, tight:'際どい'}
};
function runnerPos(fr){
  if(fr<0.5){ const u=fr/0.5; return {x:lerp(SECOND.x,THIRD.x,easeOut(u)), y:lerp(SECOND.y,THIRD.y,easeOut(u))}; }
  const u=(fr-0.5)/0.5; return {x:lerp(THIRD.x,HOME.x,easeOut(u)), y:lerp(THIRD.y,HOME.y-2,easeOut(u))};
}

// ---------- state ----------
let state='title', phase='run', plays=0;
let score=0, combo=0, best=+(localStorage.getItem('sh_best')||0);
let outs=0, fails=0, lvl=1;   // outs = runs scored (生還)
let rp=0, tp=0, throwT=4000, lastTap=-999, tclk=0, margin=0, htype='gap', ff=0.55, firstTap=true, goodJump=false, jumpFlash=0;
const STEP=0.034, TAPCD=52;
let result=null, resultT=0, msg='', msgOk=false, anim=0, tapPulse=0;
let shake=0, flash=0, flashCol='#fff', last=performance.now();
let parts=[], pops=[];

function rnd(a,b){return a+Math.random()*(b-a);}
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function lerp(a,b,u){return a+(b-a)*u;}
function easeOut(u){return 1-Math.pow(1-u,2);}

function reset(){state='title';score=0;combo=0;outs=0;fails=0;lvl=1;plays=0;result=null;parts=[];pops=[];}

function newPlay(){
  plays++; lvl=Math.min(7,1+Math.floor(outs/4));
  const keys=['deep','gap','shal']; htype=keys[Math.floor(Math.random()*3)];
  throwT=clamp(HTYPES[htype].throwBase-lvl*80, HTYPES[htype].throwBase-560, HTYPES[htype].throwBase);
  ff=0.55;
  rp=0; tp=0; lastTap=-999; tclk=0; margin=0; firstTap=true; goodJump=false; jumpFlash=0;
  phase='run'; result=null; resultT=0; msg=''; msgOk=false; anim=0;
  S.hit();
}
function start(){ if(!ac())ac(); if(AC&&AC.state==='suspended')AC.resume(); reset(); state='play'; newPlay(); }

function tap(){
  if(state==='title'){start();return;}
  if(state==='over'){ if(resultT>0.4){reset();start();} return; }
  if(state!=='play'||phase!=='run') return;
  if(tclk-lastTap<TAPCD) return;                 // rate cap (no superhuman mashing)
  if(firstTap){ firstTap=false; if(tclk<=260){ goodJump=true; rp=clamp(rp+0.06,0,1); jumpFlash=1; S.relay(); } }  // aggressive read off the bat
  lastTap=tclk; rp=clamp(rp+STEP,0,1); tapPulse=1; S.step();
  if(rp>=1){ margin=clamp(1-tp,0,1); resolve('safe'); }
}

function resolve(k){
  phase='result'; result=k; resultT=0; anim=0;
  if(k==='safe'){
    outs++; combo++;
    const bang=margin<0.12;
    let add=Math.round((80+Math.round((1-margin)*150)+(goodJump?40:0))*(1+Math.min(9,combo-1)*0.14)); score+=add;
    setTimeout(S.safe,120); if(bang||margin>0.4)setTimeout(S.big,200);
    msgOk=true; flash=1;flashCol='#8affa0';shake=7; burst(HOME.x,HOME.y,'#8affa0',22,8);
    pop(W/2,250,(bang?'際どいクロスプレーをヘッドスライディングで制して生還！ +':'快足で中継返球を上回った——ホームイン！ +')+add,'#d6ffe0');
    if(combo>=2)pop(W/2,214,'コンボ x'+combo,'#ffd24d');
    if(combo>0&&combo%5===0)S.streak();
    msg=bang?'本塁ベース上で頭から滑り込み、タッチをかいくぐって生還——痺れる本塁クロスプレーを制した！':(goodJump?'打球判断からの好スタート、三塁を回って一気に生還——中継返球より先にホームイン！':'全力疾走で三塁を蹴って生還——中継返球を上回る快足のホームイン！');
  } else {
    fails++; combo=0; msgOk=false; flash=1;flashCol='#ff5b5b';shake=8; S.out();
    msg='中継返球が先に本塁へ——タッチアウト。ダッシュ（連打）が足りず、本塁生還が間に合わなかった';
    pop(W/2,250,'本塁でタッチアウト…','#ffb0b0');
  }
  if(fails>=3){ state='over'; resultT=0; S.over(); if(score>best){best=score;localStorage.setItem('sh_best',best);} }
}

// ---------- input ----------
cv.addEventListener('pointerdown',e=>{e.preventDefault();tap();});
addEventListener('keydown',e=>{ if(e.repeat)return; if(e.code==='Space'||e.code==='Enter'||e.code==='ArrowRight'||e.code==='KeyF'||e.code==='KeyJ'){e.preventDefault();tap();} });

// ---------- particles ----------
function burst(x,y,c,n,sp){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=rnd(sp*0.3,sp);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:1,c});}}
function pop(x,y,txt,c){pops.push({x,y,txt,c,life:1});}

// ---------- update ----------
function update(dt){
  shake*=Math.pow(0.86,dt/16.7); if(shake<0.3)shake=0;
  flash*=Math.pow(0.9,dt/16.7); tapPulse*=Math.pow(0.8,dt/16.7); jumpFlash*=Math.pow(0.9,dt/16.7);
  for(const p of parts){p.vx*=0.96;p.vy=p.vy*0.96+0.28;p.x+=p.vx*dt/16.7;p.y+=p.vy*dt/16.7;p.life-=dt/16.7*0.026;}
  parts=parts.filter(p=>p.life>0);
  for(const p of pops){p.y-=dt/16.7*0.5;p.life-=dt/16.7*0.02;}
  pops=pops.filter(p=>p.life>0);

  if(state!=='play'){ if(state==='over')resultT+=dt/1000; return; }
  if(phase==='run'){ tclk+=dt; const prev=tp; tp=clamp(tp+dt/throwT,0,1);
    if(prev<ff&&tp>=ff)S.relay();                     // ball reaches the cut-off man
    if(tp>=1 && rp<1){ margin=0; resolve('out'); }
    return; }
  if(phase==='result'){ resultT+=dt/1000; anim=Math.min(1,anim+dt/500); if(resultT>1.6) newPlay(); return; }
}

// ---------- render ----------
function drawScene(){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#12703f');g.addColorStop(0.5,'#0f5e34');g.addColorStop(1,'#0c4c2b');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#6a4a30';ctx.beginPath();ctx.moveTo(HOME.x,HOME.y+24);ctx.lineTo(FIRST.x+24,FIRST.y);ctx.lineTo(SECOND.x,SECOND.y-24);ctx.lineTo(THIRD.x-24,THIRD.y);ctx.closePath();ctx.fill();
  // running lane second->third->home highlighted
  ctx.strokeStyle='rgba(230,210,150,0.4)';ctx.lineWidth=7;
  ctx.beginPath();ctx.moveTo(HOME.x,HOME.y);ctx.lineTo(FIRST.x,FIRST.y);ctx.lineTo(SECOND.x,SECOND.y);ctx.stroke();
  ctx.strokeStyle='rgba(230,210,150,0.72)';ctx.lineWidth=9;
  ctx.beginPath();ctx.moveTo(SECOND.x,SECOND.y);ctx.lineTo(THIRD.x,THIRD.y);ctx.lineTo(HOME.x,HOME.y);ctx.stroke();
  for(const B of [FIRST,SECOND,THIRD]){ ctx.save();ctx.translate(B.x,B.y);ctx.rotate(0.785);ctx.fillStyle='#eef0f2';ctx.fillRect(-10,-10,20,20);ctx.restore(); }
  ctx.fillStyle='#eef0f2';ctx.beginPath();ctx.moveTo(HOME.x-12,HOME.y-7);ctx.lineTo(HOME.x+12,HOME.y-7);ctx.lineTo(HOME.x+12,HOME.y+1);ctx.lineTo(HOME.x,HOME.y+12);ctx.lineTo(HOME.x-12,HOME.y+1);ctx.closePath();ctx.fill();
}
function person(x,y,col,s,lean){s=s||1;lean=lean||0;
  ctx.save();ctx.translate(x,y);ctx.rotate(lean);
  ctx.fillStyle='rgba(0,0,0,0.2)';ctx.beginPath();ctx.ellipse(0,13*s,10*s,4*s,0,0,6.28);ctx.fill();
  ctx.fillStyle=col;ctx.beginPath();ctx.ellipse(0,-14*s,9*s,14*s,0,0,6.28);ctx.fill();
  ctx.fillStyle='#f0c9a0';ctx.beginPath();ctx.arc(0,-31*s,7*s,0,6.28);ctx.fill();
  ctx.restore();
}
function slider(x,y,col,lean){ ctx.save();ctx.translate(x,y);ctx.rotate(lean);
  ctx.fillStyle=col;ctx.beginPath();ctx.ellipse(0,-6,17,8,0,0,6.28);ctx.fill();
  ctx.fillStyle='#f0c9a0';ctx.beginPath();ctx.arc(15,-9,6.5,0,6.28);ctx.fill();
  ctx.strokeStyle=col;ctx.lineWidth=6;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(-8,-4);ctx.lineTo(-24,-1);ctx.stroke();ctx.restore(); }
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

function render(){
  ctx.save();
  if(shake>0)ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
  drawScene();

  if(state==='play'){
    const of=HTYPES[htype].of;
    // outfielder (has fielded), cut-off man, catcher at the plate
    person(of.x,of.y,'#c85049',0.84,0);
    person(CUT.x,CUT.y,'#c85049',0.9,0);
    person(HOME.x+22,HOME.y-4,'#c85049',0.9,0);            // catcher

    // ball: outfielder->cut-off (tp<ff) then cut-off->home (tp>=ff)
    let b;
    if(tp<ff){ const u=tp/ff; b={x:lerp(of.x,CUT.x,u), y:lerp(of.y,CUT.y,u)}; }
    else { const u=(tp-ff)/(1-ff); b={x:lerp(CUT.x,HOME.x,easeOut(u)), y:lerp(CUT.y,HOME.y,easeOut(u))}; }

    // runner
    const rpos=runnerPos(rp);
    const sliding=(phase==='result'&&result==='safe')||rp>0.92;
    if(sliding) slider(rpos.x,rpos.y,'#2b6fd6',0.30); else person(rpos.x,rpos.y,'#2b6fd6',1.0, phase==='run'?(-0.10-0.06*Math.sin(tclk/70)):0);

    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(b.x,b.y,7,0,6.28);ctx.fill();
    ctx.strokeStyle='#c33';ctx.lineWidth=1;ctx.beginPath();ctx.arc(b.x,b.y,7,0.4,2.2);ctx.stroke();

    // race bars: runner (blue) vs relay throw (red)
    const bx=W/2-150, by=70, bw=300;
    ctx.textAlign='center';ctx.font='bold 13px sans-serif';
    ctx.fillStyle='rgba(255,255,255,0.16)';rr(bx,by,bw,12,6);ctx.fill();
    ctx.fillStyle='#3aa0ff';rr(bx,by,bw*rp,12,6);ctx.fill();
    ctx.fillStyle='rgba(255,255,255,0.16)';rr(bx,by+18,bw,12,6);ctx.fill();
    ctx.fillStyle=tp<ff?'#e0a24b':'#ff5b5b';rr(bx,by+18,bw*tp,12,6);ctx.fill();
    ctx.fillStyle='#bfe0ff';ctx.textAlign='left';ctx.fillText('走者',bx-2,by+11);
    ctx.fillStyle='#ffc99a';ctx.fillText(tp<ff?'中継へ':'本塁送球',bx-2,by+29);
    // banner
    ctx.textAlign='center';ctx.fillStyle='rgba(255,220,90,0.96)';ctx.font='bold 21px sans-serif';
    ctx.fillText('連打で全力疾走！ 中継返球より先に本塁を陥れろ',W/2,40);
    ctx.fillStyle='rgba(255,255,255,0.7)';ctx.font='13px sans-serif';ctx.fillText(HTYPES[htype].name+'（'+HTYPES[htype].tight+'）',W/2,H-40);
    ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='12px sans-serif';ctx.fillText('タップ / クリック / SPACE 連打 ＝ 走る（打った直後の好判断スタートでボーナス）',W/2,H-20);
    if(jumpFlash>0.05){ ctx.fillStyle='rgba(140,255,160,'+jumpFlash+')';ctx.font='bold 22px sans-serif';ctx.fillText('好スタート！',W/2,150); }
  }

  for(const p of parts){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,3.2,0,6.28);ctx.fill();}
  ctx.globalAlpha=1;
  for(const p of pops){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.font='bold 21px sans-serif';ctx.textAlign='center';ctx.fillText(p.txt,p.x,p.y);}
  ctx.globalAlpha=1;

  // HUD
  ctx.textAlign='left';ctx.fillStyle='#fff';ctx.font='bold 26px sans-serif';ctx.fillText('SCORE '+score,20,34);
  ctx.textAlign='right';ctx.fillStyle='rgba(255,255,255,0.9)';ctx.font='14px sans-serif';ctx.fillText('生還 '+outs+'  Lv'+lvl,W-20,22);
  ctx.fillText('アウト',W-100,44);
  for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(W-64+i*20,39,7,0,6.28);ctx.fillStyle=i<fails?'#ff5b5b':'rgba(255,255,255,0.25)';ctx.fill();}
  if(combo>=2){ctx.textAlign='center';ctx.fillStyle='#ffd24d';ctx.font='bold 18px sans-serif';ctx.fillText('コンボ x'+combo,W/2,110);}

  if(state==='play'&&phase==='result'&&msg){ctx.textAlign='center';ctx.fillStyle=msgOk?'#9ff0b8':'#ff9a9a';ctx.font='bold 15px sans-serif';ctx.fillText(msg,W/2,300);}

  if(state==='title'){
    ctx.fillStyle='rgba(4,8,4,0.84)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='bold 40px sans-serif';ctx.fillText('還ってこい！',W/2,80);
    ctx.fillStyle='#ffd23e';ctx.font='bold 22px sans-serif';ctx.fillText('Send Him Home',W/2,116);
    ctx.fillStyle='rgba(255,255,255,0.92)';ctx.font='16px sans-serif';
    ctx.fillText('二塁走者として、単打で一気に本塁を狙う——連打で全力疾走し、三塁を回って中継返球より先に生還しろ',W/2,172);
    ctx.fillStyle='rgba(255,255,255,0.66)';ctx.font='14px sans-serif';
    ctx.fillText('タップ/クリック/SPACEを連打＝走る（青バー）。外野→中継→本塁の返球（赤バー）より先に本塁到達＝生還',W/2,210);
    ctx.fillText('打った“直後”に走り出すと打球判断の好スタートでボーナス。際どいクロスプレーをヘッドスライディングで制すと大量加点',W/2,234);
    ctx.fillText('当たりは毎回変化——深い当たり（余裕）／ギャップ（普通）／浅い当たり（際どい＝返球が速い）',W/2,258);
    ctx.fillText('連打が足りず返球が先に届くと本塁タッチアウト。上級ほど返球が速い。3アウトで交代',W/2,282);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で開始',W/2,350);
    ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='14px sans-serif';ctx.fillText('BEST '+best,W/2,382);
  }
  if(state==='over'){
    ctx.fillStyle='rgba(4,8,4,0.86)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#ff6b6b';ctx.font='bold 46px sans-serif';ctx.fillText('3アウト…交代',W/2,222);
    ctx.fillStyle='#fff';ctx.font='bold 40px sans-serif';ctx.fillText('SCORE '+score,W/2,290);
    ctx.fillStyle='rgba(255,255,255,0.85)';ctx.font='19px sans-serif';ctx.fillText('生還 '+outs+'   BEST '+best,W/2,330);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で もう一度',W/2,402);
  }

  if(flash>0.02){ctx.globalAlpha=flash*0.5;ctx.fillStyle=flashCol;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}
  ctx.restore();

  ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,0.4)';ctx.font='12px sans-serif';
  ctx.fillText('還ってこい！：連打で全力疾走し、外野→中継→本塁の返球（赤）より先に本塁へ（青）。返球が先着なら本塁タッチアウト、3アウトで交代',W/2,H-8);
}

function frame(ts){let dt=ts-last;last=ts;if(dt>60)dt=60;if(dt<0)dt=0;update(dt);render();requestAnimationFrame(frame);}
requestAnimationFrame(frame);

// ---------- test hook ----------
window.__sh={
  start, tap:()=>tap(),
  get state(){return state;},
  get score(){return score;},
  get outs(){return outs;},
  get fails(){return fails;},
  get info(){return {state,phase,rp,tp,throwT,htype,margin,goodJump,result,outs,fails,lvl,tclk,canAct:(phase==='run')};}
};
})();
</script>
</body>
</html>
