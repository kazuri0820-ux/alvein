<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>一瞬の隙 (Hit the Gap)</title>
<style>
  html,body{margin:0;height:100%;background:#08120b;overflow:hidden;
    font-family:-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  #stage{position:relative;width:100vw;height:100vh;max-width:calc(100vh*1.5);max-height:calc(100vw/1.5);aspect-ratio:900/600;}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;border-radius:6px;}
</style>
</head>
<body>
<div id="wrap"><div id="stage"><canvas id="cv"></canvas></div></div>
<script>
(function(){
const W=900,H=600,cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let DPR=1;
function fit(){DPR=Math.min(2,window.devicePixelRatio||1);cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
fit();addEventListener('resize',fit);

// ---------- audio ----------
let AC=null;function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function tone(f,d,type,v,sweep){const a=ac();if(!a)return;const t=a.currentTime,o=a.createOscillator(),g=a.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(sweep)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+sweep),t+d);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v||0.2,t+0.008);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+0.02);}
function noise(d,v,hp){const a=ac();if(!a)return;const t=a.currentTime,n=Math.floor(a.sampleRate*d),buf=a.createBuffer(1,n,a.sampleRate),ch=buf.getChannelData(0);
  for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource();s.buffer=buf;
  const f=a.createBiquadFilter();f.type='highpass';f.frequency.value=hp||600;const g=a.createGain();g.gain.value=v||0.2;
  s.connect(f);f.connect(g);g.connect(a.destination);s.start(t);s.stop(t+d+0.02);}
const S={
  shoot:()=>{noise(0.05,0.2,900);tone(240,0.1,'square',0.14,220);},
  goal:()=>{[523,659,784,1046].forEach((f,i)=>setTimeout(()=>tone(f,0.16,'triangle',0.22),i*90));noise(0.1,0.2,500);},
  save:()=>{noise(0.1,0.24,600);tone(300,0.14,'sawtooth',0.14,-70);},
  miss:()=>{tone(300,0.22,'sawtooth',0.16,-140);},
  streak:()=>{[660,880,1100].forEach((f,i)=>setTimeout(()=>tone(f,0.1,'triangle',0.16),i*60));},
  over:()=>{[440,330,247,175].forEach((f,i)=>setTimeout(()=>tone(f,0.3,'triangle',0.2),i*160));}
};

// ---------- geometry ----------
const GLX=346, GRX=554, GY=110, BAR_Y=64, SHOOTER={x:450,y:508};

// ---------- state ----------
let state='title', phase='aim', t=0, plays=0;
let score=0, combo=0, best=+(localStorage.getItem('hitgap_best')||0);
let goals=0, misses=0, lvl=1;
let ret=GLX+30, retDir=1, kx=450, kDir=1, shotClock=0;
let shot=null, keeper={x:450,dive:0,diveTo:null}, outcome=null, result=null, resultT=0, msg='', msg2='';
let shake=0, flash=0, flashCol='#fff', last=performance.now();
let parts=[], pops=[];

function rnd(a,b){return a+Math.random()*(b-a);}
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function lerp(a,b,u){return a+(b-a)*u;}

function params(){ return { kSpeed:0.09+lvl*0.011, rSpeed:0.15+lvl*0.018, baseR:34+lvl*1.6,
  dive:0.12+lvl*0.008, flight:288-lvl*6, clock:3500-lvl*110 }; }

function reset(){state='title';score=0;combo=0;goals=0;misses=0;lvl=1;plays=0;shot=null;result=null;parts=[];pops=[];}
function newPlay(){
  plays++; lvl=Math.min(7,1+Math.floor(goals/4));
  ret=GLX+22; retDir=1; kx=rnd(GLX+40,GRX-40); kDir=Math.random()<0.5?-1:1;
  keeper={x:kx,dive:0,diveTo:null}; shot=null; shotClock=0; outcome=null;
  phase='aim'; result=null; msg=''; msg2='';
}
function start(){ if(!ac())ac(); if(AC&&AC.state==='suspended')AC.resume(); reset(); state='play'; newPlay(); }

function reqGap(){ const p=params(); return p.baseR + p.dive*p.flight; }

function shoot(){
  if(state==='title'){start();return;}
  if(state==='over'){ if(resultT>0.4){reset();start();} return; }
  if(state!=='play'||phase!=='aim') return;
  const p=params(); const sx=ret;
  const gap=Math.abs(sx-kx);
  keeper.diveTo=sx; keeper.x=kx;
  outcome = gap > reqGap() ? 'goal' : 'save';
  shot={x:SHOOTER.x,y:SHOOTER.y,tx:sx,ty:GY+4,t:0,dur:p.flight,gap};
  phase='fly'; S.shoot();
}

function resolve(){
  phase='resolve'; result=outcome; resultT=0;
  if(outcome==='goal'){
    goals++; combo++; const marg=Math.round(shot.gap-reqGap());
    const add=Math.round((marg<26?230:150)*(1+Math.min(9,combo-1)*0.18)); score+=add;
    S.goal(); flash=1;flashCol='#8fe0a0';shake=12; burst(shot.tx,GY,'#cfffe0',28,8);
    pop(shot.tx,GY-16,'ゴール！ +'+add,'#dfffe6');
    if(marg<26)pop(shot.tx,GY-42,'ギリギリを射抜いた！','#fff3c4');
    if(combo>=2)pop(450,GY-66,'コンボ x'+combo,'#ffd24d');
    if(combo>0&&combo%5===0)S.streak();
    msg='ゴール！ 一瞬の隙を撃ち抜いた'; msg2='';
  } else {
    misses++; combo=0; S.save(); flash=1;flashCol='#ff5b5b';shake=10; burst(keeper.x,GY+20,'#ffd27a',14,6);
    msg='セーブ！ GKの正面を突いた'; msg2 = misses>=3?'':'あと'+(3-misses)+'回のミスで終了';
    pop(shot.tx,GY-16,'セーブ','#ffb0b0');
  }
  if(misses>=3){ state='over'; resultT=0; S.over(); if(score>best){best=score;localStorage.setItem('hitgap_best',best);} }
}

// ---------- input ----------
cv.addEventListener('pointerdown',e=>{e.preventDefault();shoot();});
addEventListener('keydown',e=>{ if(e.code==='Space'||e.code==='Enter'||e.code==='ArrowUp'){e.preventDefault();shoot();} });

// ---------- particles ----------
function burst(x,y,c,n,sp){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=rnd(sp*0.3,sp);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:1,c});}}
function pop(x,y,txt,c){pops.push({x,y,txt,c,life:1});}

// ---------- update ----------
function update(dt){
  shake*=Math.pow(0.86,dt/16.7); if(shake<0.3)shake=0;
  flash*=Math.pow(0.9,dt/16.7);
  for(const p of parts){p.vx*=0.96;p.vy=p.vy*0.96+0.28;p.x+=p.vx*dt/16.7;p.y+=p.vy*dt/16.7;p.life-=dt/16.7*0.028;}
  parts=parts.filter(p=>p.life>0);
  for(const p of pops){p.y-=dt/16.7*0.5;p.life-=dt/16.7*0.02;}
  pops=pops.filter(p=>p.life>0);

  if(state!=='play'){ if(state==='over')resultT+=dt/1000; return; }
  t+=dt; const p=params();
  if(phase==='aim'){
    ret+=retDir*p.rSpeed*dt; if(ret>=GRX-22){ret=GRX-22;retDir=-1;} if(ret<=GLX+22){ret=GLX+22;retDir=1;}
    kx+=kDir*p.kSpeed*dt; if(kx>=GRX-34){kx=GRX-34;kDir=-1;} if(kx<=GLX+34){kx=GLX+34;kDir=1;}
    keeper.x=kx;
    shotClock+=dt; if(shotClock>p.clock){ // hesitated too long
      phase='resolve'; result='rushed'; resultT=0; misses++; combo=0; flash=1;flashCol='#ff5b5b';shake=8;
      msg='撃てず…隙を逃した'; msg2=misses>=3?'':'あと'+(3-misses)+'回のミスで終了';
      if(misses>=3){ state='over'; resultT=0; S.over(); if(score>best){best=score;localStorage.setItem('hitgap_best',best);} }
    }
    return;
  }
  if(phase==='fly'){
    shot.t+=dt; const f=clamp(shot.t/shot.dur,0,1);
    shot.x=lerp(SHOOTER.x,shot.tx,f); shot.y=lerp(SHOOTER.y,shot.ty,f)-Math.sin(f*Math.PI)*30;
    if(keeper.diveTo!=null){ keeper.dive=clamp(keeper.dive+dt/shot.dur,0,1);
      keeper.x += (clamp(keeper.diveTo,GLX,GRX)-keeper.x)*Math.min(1,dt/16.7*0.16); }
    if(f>=1) resolve();
    return;
  }
  if(phase==='resolve'){ resultT+=dt/1000; if(resultT>1.05 && state==='play') newPlay(); return; }
}

// ---------- render ----------
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

function drawPitch(){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#1c5a2c');g.addColorStop(1,'#164a24');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  for(let i=0;i<9;i++){ctx.fillStyle=i%2?'rgba(255,255,255,0.03)':'rgba(0,0,0,0.04)';ctx.fillRect(0,i*66,W,66);}
  ctx.fillStyle='rgba(255,255,255,0.06)';ctx.fillRect(GLX,BAR_Y,GRX-GLX,GY-BAR_Y);
  ctx.strokeStyle='rgba(255,255,255,0.22)';ctx.lineWidth=1;
  for(let x=GLX;x<=GRX;x+=14){ctx.beginPath();ctx.moveTo(x,BAR_Y);ctx.lineTo(x,GY);ctx.stroke();}
  ctx.fillStyle='#eef3f5';ctx.fillRect(GLX-7,BAR_Y,7,GY-BAR_Y+2);ctx.fillRect(GRX,BAR_Y,7,GY-BAR_Y+2);ctx.fillRect(GLX-7,BAR_Y-7,GRX-GLX+14,7);
  ctx.strokeStyle='rgba(255,255,255,0.25)';ctx.lineWidth=3;ctx.strokeRect(250,GY,400,300);
}
function drawKeeper(){
  const x=keeper.x,y=GY+22;
  ctx.save();ctx.translate(x,y);
  if(keeper.dive>0&&keeper.diveTo!=null){const dir=keeper.diveTo<x?-1:1;ctx.rotate(dir*keeper.dive*0.85);}
  ctx.fillStyle='rgba(0,0,0,0.2)';ctx.beginPath();ctx.ellipse(0,16,16,5,0,0,6.28);ctx.fill();
  ctx.fillStyle='#ffd23e';rr(-12,-10,24,28,7);ctx.fill();
  ctx.fillStyle='#f2c9a0';ctx.beginPath();ctx.arc(0,-20,8,0,6.28);ctx.fill();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(-15,-2,5,0,6.28);ctx.fill();ctx.beginPath();ctx.arc(15,-2,5,0,6.28);ctx.fill();
  ctx.restore();
}

function render(){
  ctx.save();
  if(shake>0)ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
  drawPitch();
  drawKeeper();

  if(state==='play'){
    // shooter
    ctx.fillStyle='rgba(0,0,0,0.22)';ctx.beginPath();ctx.ellipse(SHOOTER.x,SHOOTER.y+22,15,5,0,0,6.28);ctx.fill();
    ctx.fillStyle='#2b6cff';rr(SHOOTER.x-10,SHOOTER.y+2,20,26,7);ctx.fill();ctx.fillStyle='#f2c9a0';ctx.beginPath();ctx.arc(SHOOTER.x,SHOOTER.y-6,8,0,6.28);ctx.fill();
    if(phase==='aim'){
      // aim reticle sweeping on goal line
      const openEnough=Math.abs(ret-kx)>reqGap();
      ctx.strokeStyle=openEnough?'#8fe0a0':'rgba(255,255,255,0.55)';ctx.lineWidth=2;ctx.setLineDash([6,7]);
      ctx.beginPath();ctx.moveTo(SHOOTER.x,SHOOTER.y);ctx.lineTo(ret,GY);ctx.stroke();ctx.setLineDash([]);
      ctx.fillStyle=openEnough?'#8fe0a0':'#ffe08a';ctx.beginPath();ctx.arc(ret,GY,8,0,6.28);ctx.fill();
      ctx.strokeStyle=openEnough?'#8fe0a0':'#ffe08a';ctx.lineWidth=2;ctx.beginPath();ctx.arc(ret,GY,13,0,6.28);ctx.stroke();
      // required-gap hint around keeper (fades)
      const a=clamp(0.7-(lvl-1)*0.09,0.16,0.7); ctx.strokeStyle='rgba(255,150,150,'+a+')';ctx.lineWidth=2;
      ctx.beginPath();ctx.moveTo(clamp(kx-reqGap(),GLX,GRX),GY+2);ctx.lineTo(clamp(kx+reqGap(),GLX,GRX),GY+2);ctx.stroke();
    }
    if((phase==='fly')&&shot){ ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(shot.x,shot.y,8,0,6.28);ctx.fill();
      ctx.strokeStyle='#c33';ctx.lineWidth=1.2;ctx.beginPath();ctx.arc(shot.x,shot.y,8,0.4,2.3);ctx.stroke(); }
  }

  for(const p of parts){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,3.2,0,6.28);ctx.fill();}
  ctx.globalAlpha=1;
  for(const p of pops){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.font='bold 21px sans-serif';ctx.textAlign='center';ctx.fillText(p.txt,p.x,p.y);}
  ctx.globalAlpha=1;

  // HUD
  ctx.textAlign='left';ctx.fillStyle='#fff';ctx.font='bold 26px sans-serif';ctx.fillText('SCORE '+score,20,36);
  ctx.textAlign='right';ctx.fillStyle='rgba(255,255,255,0.85)';ctx.font='14px sans-serif';ctx.fillText('得点 '+goals+'  Lv'+lvl,W-20,24);
  ctx.fillText('ミス',W-92,46);
  for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(W-60+i*20,41,7,0,6.28);ctx.fillStyle=i<misses?'#ff5b5b':'rgba(255,255,255,0.22)';ctx.fill();}
  if(combo>=2){ctx.textAlign='center';ctx.fillStyle='#ffd24d';ctx.font='bold 18px sans-serif';ctx.fillText('コンボ x'+combo,450,H-96);}

  if(state==='play'&&phase==='aim'){ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,0.85)';ctx.font='bold 16px sans-serif';
    ctx.fillText('狙いが左右に動く。GKから離れた“隙”でタップ！',450,44);}
  if(state==='play'&&phase==='resolve'&&msg){ctx.textAlign='center';ctx.fillStyle=result==='goal'?'#9ff0b8':'#ff9a9a';ctx.font='bold 22px sans-serif';ctx.fillText(msg,450,44);}

  if(state==='title'){
    ctx.fillStyle='rgba(6,14,10,0.68)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='bold 50px sans-serif';ctx.fillText('一瞬の隙',W/2,150);
    ctx.fillStyle='#ffd23e';ctx.font='bold 22px sans-serif';ctx.fillText('Hit the Gap',W/2,186);
    ctx.fillStyle='rgba(255,255,255,0.9)';ctx.font='16px sans-serif';
    ctx.fillText('左右に動く“狙い”と、動くGK。ズレた一瞬の隙を撃ち抜くシュートゲーム',W/2,240);
    ctx.fillStyle='rgba(255,255,255,0.66)';ctx.font='14px sans-serif';
    ctx.fillText('照準（◯）はゴール上を左右に往復し、GKも動く。GKから十分離れた瞬間にタップ＝ゴール',W/2,280);
    ctx.fillText('GKの近く（正面）を撃つと飛びついてセーブ、迷って撃てないと隙を逃す',W/2,302);
    ctx.fillText('ギリギリの隙を射抜くほど高得点＆コンボ。上級ほど照準もGKも速く守備範囲も広い。3ミスで終了',W/2,324);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で開始',W/2,404);
    ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='14px sans-serif';ctx.fillText('BEST '+best+'　　タップ／SPACEで撃つ',W/2,436);
  }
  if(state==='over'){
    ctx.fillStyle='rgba(6,14,10,0.76)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#ff6b6b';ctx.font='bold 46px sans-serif';ctx.fillText('3ミス…試合終了',W/2,222);
    ctx.fillStyle='#fff';ctx.font='bold 40px sans-serif';ctx.fillText('SCORE '+score,W/2,290);
    ctx.fillStyle='rgba(255,255,255,0.85)';ctx.font='19px sans-serif';ctx.fillText('得点 '+goals+'   BEST '+best,W/2,330);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で もう一度',W/2,402);
  }

  if(flash>0.02){ctx.globalAlpha=flash*0.5;ctx.fillStyle=flashCol;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}
  ctx.restore();

  ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,0.4)';ctx.font='12px sans-serif';
  ctx.fillText('左右に往復する照準と動くGK。GKから離れた一瞬の隙でタップして撃つ。正面は弾かれる。3ミスで終了',W/2,H-8);
}

function frame(ts){let dt=ts-last;last=ts;if(dt>60)dt=60;if(dt<0)dt=0;update(dt);render();requestAnimationFrame(frame);}
requestAnimationFrame(frame);

// ---------- test hook ----------
window.__hg={
  start, shoot:()=>shoot(),
  get state(){return state;},
  get score(){return score;},
  get goals(){return goals;},
  get misses(){return misses;},
  get info(){return {state,phase, reticleX:ret, keeperX:kx, gap:Math.abs(ret-kx), reqGap:reqGap(),
    shotClock, goals, misses, lvl};}
};
})();
</script>
</body>
</html>
