<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>オーバーヘッドキック — Bicycle Kick</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{width:100%;height:100%;background:#0a1220;overflow:hidden;
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,system-ui,sans-serif;
    touch-action:none;user-select:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  #stage{position:relative;aspect-ratio:900/600;max-width:100%;max-height:100%;
    width:auto;height:auto;box-shadow:0 0 60px rgba(0,0,0,.6);}
  canvas{display:block;width:100%;height:100%;border-radius:6px;}
</style>
</head>
<body>
<div id="wrap"><div id="stage"><canvas id="c" width="900" height="600"></canvas></div></div>
<script>
(function(){
"use strict";
const TEST=location.hash.indexOf('test')>=0;
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
const W=900,H=600;
let dpr=Math.max(1,Math.min(2,window.devicePixelRatio||1));
function fit(){ dpr=Math.max(1,Math.min(2,window.devicePixelRatio||1)); cv.width=W*dpr; cv.height=H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0); }
fit(); window.addEventListener('resize',fit);

// ---- audio ----
let AC=null;
function ac(){ if(!AC){ try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){AC=null;} } return AC; }
function tone(f,d,type,g,f2){ const a=ac(); if(!a)return; const o=a.createOscillator(),gg=a.createGain();
  o.type=type||'sine'; o.frequency.setValueAtTime(f,a.currentTime); if(f2)o.frequency.exponentialRampToValueAtTime(f2,a.currentTime+d);
  gg.gain.setValueAtTime(0.0001,a.currentTime); gg.gain.exponentialRampToValueAtTime(g||0.2,a.currentTime+0.01);
  gg.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+d); o.connect(gg); gg.connect(a.destination); o.start(); o.stop(a.currentTime+d+0.02); }
function noise(d,g,cut){ const a=ac(); if(!a)return; const n=Math.floor(a.sampleRate*d),buf=a.createBuffer(1,n,a.sampleRate),ch=buf.getChannelData(0);
  for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(1-i/n); const src=a.createBufferSource(); src.buffer=buf;
  const f=a.createBiquadFilter(); f.type='lowpass'; f.frequency.value=cut||1200; const gg=a.createGain(); gg.gain.value=g||0.2;
  src.connect(f); f.connect(gg); gg.connect(a.destination); src.start(); }
const S={
  serve(){ tone(500,0.16,'sine',0.05,760); },
  kick(){ noise(0.06,0.4,2400); tone(240,0.14,'triangle',0.24,120); },
  goal(){ tone(300,0.16,'triangle',0.24,150); setTimeout(()=>tone(560,0.16,'square',0.14),40); setTimeout(()=>tone(760,0.2,'square',0.12),100); },
  save(){ noise(0.12,0.34,1200); tone(300,0.14,'square',0.14,200); },
  wide(){ tone(360,0.14,'sine',0.1,200); noise(0.1,0.14,700); },
  whiff(){ noise(0.14,0.26,600); tone(180,0.2,'sawtooth',0.14,80); },
  cheer(){ const a=ac(); if(!a)return; noise(0.8,0.26,2000); for(let i=0;i<6;i++)setTimeout(()=>tone(500+Math.random()*340,0.3,'sine',0.05),i*44); }
};

// ---- geometry ----
const GL=322, GR=578, GY=150, BAR=76;    // goal mouth x-range, goal line y, crossbar y
const CX=450, CY=330;                     // overhead contact point
const STK={x:450,y:436};                  // striker base

// ---- state ----
let state='ready';        // ready, play, over
let score=0, miss=0, streak=0, level=0, bestStreak=0, attempts=0;
let best=0; try{ best=parseInt(localStorage.getItem('bk_best')||'0',10)||0; }catch(e){}

let serve=null;           // {sx,sy,cx0,dur,pt, side}
let aimX=450, aimDir=1, aimSpd=210;
let keeperX=450, keeperTarget=450, keeperLean=0, saveR=52, keeperDive=0;
let shot=null;            // {x,y,tx,ty,pt,dur,onFrame,saved,res}
let kickAnim=0;
let msg='',msgT=0, popText='',popT=0,popX=450,popY=CY,popCol='#fff';
let flash=0,flashCol='#fff',shakeT=0,shakeM=0, netRipple=0;
let parts=[], crowd=[], t=0, waitT=0;

for(let i=0;i<70;i++) crowd.push({x:Math.random()*W,y:4+Math.random()*30,c:['#e8544e','#f0c14b','#4a90d9','#fff','#5cc98a','#c98af0'][i%6],b:Math.random()*6.28});

function saveBest(){ try{localStorage.setItem('bk_best',''+best);}catch(e){} }

function reset(){ score=0;miss=0;streak=0;level=0;attempts=0; parts=[];shot=null; state='play';
  msg='ボールが頭上に落ちる瞬間にキック！ 狙いはゴールの空き'; msgT=210; startServe(1.0); }

function startServe(delay){
  waitT=delay; serve=null; shot=null;
}
function launchServe(){
  level=Math.min(9,Math.floor(score/4));
  const side=Math.random()<0.5?-1:1;
  const sx=side<0? 60+Math.random()*40 : W-60-Math.random()*40;
  const sy=250+Math.random()*70;
  const dur=Math.max(0.72,1.08-level*0.04);
  const apexX=(sx+CX)/2 + (Math.random()*60-30);
  serve={ sx, sy, apexX, apexY:120-Math.random()*30, dur, pt:0, side, kicked:false, missed:false };
  aimSpd=210+level*26; aimDir=Math.random()<0.5?1:-1; aimX=GL+Math.random()*(GR-GL);
  // keeper commits a cheat/dive target, leaning as a tell
  keeperTarget=GL+30+Math.random()*(GR-GL-60);
  keeperLean=(keeperTarget-450)*0.16;
  keeperDive=0; keeperX=450;
  saveR=Math.max(34,54-level*2.0);
  S.serve();
}
function servePos(p){ const s=serve; const q=p<0?0:(p>1?1:p);
  const x=(1-q)*(1-q)*s.sx + 2*(1-q)*q*s.apexX + q*q*CX;
  const y=(1-q)*(1-q)*s.sy + 2*(1-q)*q*s.apexY + q*q*CY;
  return {x,y};
}

function doKick(){
  if(state!=='play'||!serve||serve.kicked||serve.missed||shot) return;
  serve.kicked=true; kickAnim=1;
  const a=ac(); if(a&&a.state==='suspended')a.resume();
  const p=serve.pt/serve.dur;
  const q=Math.max(0,1-Math.abs(1-p)/0.26);   // timing quality by ball height
  attempts++;
  if(q<0.42){ // mistimed swing
    miss++; streak=0; S.whiff();
    popText='ミスキック…'; popCol='#ff8a5a'; popX=CX;popY=CY-40;popT=1.1; shakeT=6;shakeM=2;
    if(miss>=3){ gameOver(); return; } startServe(0.9); return;
  }
  S.kick(); shakeT=7;shakeM=3;
  const src=servePos(1);
  const ax=aimX;
  const onFrame = ax>GL+6 && ax<GR-6 && q>0.55;   // needs power+placement to be on target
  const ty = onFrame? (BAR+18+Math.random()*(GY-BAR-24)) : (q<=0.55? BAR-30-Math.random()*20 : GY+10);
  const tx = onFrame? ax : (ax<GL? GL-40 : (ax>GR? GR+40 : ax));
  // keeper dive
  keeperDive=1;
  const saved = onFrame && Math.abs(ax-keeperTarget)<saveR;
  shot={ x:src.x, y:src.y, tx, ty, pt:0, dur:0.42, onFrame, saved, res:(!onFrame?'wide':(saved?'save':'goal')), done:false };
}
function resolveShot(){
  shot.done=true;
  const r=shot.res;
  if(r==='goal'){
    score++; streak++; if(streak>bestStreak)bestStreak=streak; if(score>best){best=score;saveBest();}
    popText= streak>=3? 'ゴォォル！ '+streak+'連続':'ゴール！ +1'; popCol='#8effa8'; popX=shot.tx;popY=shot.ty+30;popT=1.3;
    flash=0.32;flashCol='#eafff0'; shakeT=10;shakeM=3; netRipple=1; burst(shot.tx,shot.ty,'#eaffe0',18); S.goal(); setTimeout(S.cheer,60);
    startServe(1.1);
  } else if(r==='save'){
    miss++; streak=0; popText='セーブされた！'; popCol='#ffd23e'; popX=shot.tx;popY=shot.ty-10;popT=1.1; S.save(); shakeT=6;shakeM=2;
    burst(shot.tx,shot.ty,'#ffe08a',10);
    if(miss>=3){ gameOver(); return; } startServe(0.95);
  } else { // wide/over
    miss++; streak=0; popText= shot.ty<GY?'枠の上へ…':'枠外へ…'; popCol='#ff8a5a'; popX=shot.tx;popY=Math.max(40,shot.ty);popT=1.1; S.wide();
    if(miss>=3){ gameOver(); return; } startServe(0.95);
  }
}
function gameOver(){ state='over'; msg=''; msgT=99999; }

function burst(x,y,col,n){ for(let i=0;i<n;i++){ const a=Math.random()*6.28,sp=1+Math.random()*4.5;
  parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-1.6,life:1,col,r:2+Math.random()*3}); } }

// ---- input ----
cv.addEventListener('pointerdown',e=>{ e.preventDefault(); const a=ac(); if(a&&a.state==='suspended')a.resume();
  if(state==='ready'||state==='over'){ reset(); return; } if(state==='play') doKick(); });
window.addEventListener('keydown',e=>{ if(e.code==='Space'||e.code==='Enter'){ e.preventDefault();
  if(state==='ready'||state==='over'){ reset(); return; } if(state==='play') doKick(); } });

// ---- update ----
function update(dt){
  t+=dt; if(msgT>0)msgT--; if(flash>0)flash=Math.max(0,flash-dt*2); if(shakeT>0)shakeT--; if(popT>0)popT=Math.max(0,popT-dt*1.0);
  if(kickAnim>0)kickAnim=Math.max(0,kickAnim-dt*3.2); if(netRipple>0)netRipple=Math.max(0,netRipple-dt*1.6);
  if(state==='play'){
    if(!serve && !shot){ waitT-=dt; if(waitT<=0) launchServe(); }
    if(serve && !serve.kicked && !serve.missed && !shot){
      serve.pt+=dt; const p=serve.pt/serve.dur;
      // aim sweep
      aimX+=aimDir*aimSpd*dt; if(aimX>GR){aimX=GR;aimDir=-1;} if(aimX<GL){aimX=GL;aimDir=1;}
      if(p>=1.24){ serve.missed=true; miss++; streak=0; S.whiff();
        popText='キック逃した…'; popCol='#ff8a5a'; popX=CX;popY=CY-30;popT=1.1;
        if(miss>=3){ gameOver(); } else startServe(0.9); }
    }
    if(shot && !shot.done){
      shot.pt+=dt; const p=Math.min(1,shot.pt/shot.dur);
      shot.x=servePos(1).x+(shot.tx-servePos(1).x)*p; shot.y=servePos(1).y+(shot.ty-servePos(1).y)*p - Math.sin(p*3.14)*22;
      if(keeperDive>0){ keeperX=450+(keeperTarget-450)*Math.min(1,shot.pt/0.32); }
      if(p>=1) resolveShot();
    }
  }
  for(let i=parts.length-1;i>=0;i--){ const q=parts[i]; q.x+=q.vx;q.y+=q.vy;q.vy+=0.14;q.life-=dt*1.05; if(q.life<=0)parts.splice(i,1); }
}

// ---- draw ----
function rr(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }

function drawField(){
  const g=ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,'#0e2a4a'); g.addColorStop(0.28,'#155a30'); g.addColorStop(1,'#1e7a40');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#0a1424'; ctx.fillRect(0,0,W,26);
  for(const c of crowd){ ctx.fillStyle=c.c; ctx.globalAlpha=.3; ctx.fillRect(c.x,c.y,4,3);} ctx.globalAlpha=1;
  // pitch stripes (perspective-ish horizontal bands)
  for(let i=0;i<7;i++){ ctx.fillStyle=i%2?'rgba(255,255,255,.04)':'rgba(0,0,0,.05)'; ctx.fillRect(0,180+i*60,W,60); }
  // penalty arc
  ctx.strokeStyle='rgba(255,255,255,.12)'; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(450,150,190,0.2,3.14-0.2); ctx.stroke();
}
function drawGoal(){
  // net
  ctx.save();
  ctx.strokeStyle='rgba(255,255,255,.16)'; ctx.lineWidth=1;
  const rip=netRipple>0? Math.sin(t*30)*netRipple*3:0;
  for(let x=GL;x<=GR;x+=13){ ctx.beginPath(); ctx.moveTo(x,BAR); ctx.lineTo(x+ (x>GL&&x<GR?rip:0),GY); ctx.stroke(); }
  for(let y=BAR;y<=GY;y+=12){ ctx.beginPath(); ctx.moveTo(GL,y); ctx.lineTo(GR,y); ctx.stroke(); }
  ctx.restore();
  // frame
  ctx.strokeStyle='#f4f7ff'; ctx.lineWidth=6; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(GL,GY); ctx.lineTo(GL,BAR); ctx.lineTo(GR,BAR); ctx.lineTo(GR,GY); ctx.stroke();
  // goal line
  ctx.strokeStyle='rgba(255,255,255,.5)'; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(GL-30,GY); ctx.lineTo(GR+30,GY); ctx.stroke();
  // keeper
  const kx=state==='play'?(keeperDive>0?keeperX:450+keeperLean):450;
  ctx.save(); ctx.translate(kx,GY-6);
  const dv=keeperDive>0? (keeperX-450):0;
  ctx.rotate(dv*0.002);
  ctx.fillStyle='rgba(0,0,0,.25)'; ctx.beginPath(); ctx.ellipse(0,10,16,4,0,0,6.28); ctx.fill();
  ctx.fillStyle='#f0c14b'; rr(-12,-40,24,42,7); ctx.fill();
  ctx.fillStyle='#f0c39a'; ctx.beginPath(); ctx.arc(0,-46,7,0,6.28); ctx.fill();
  // arms out if diving
  ctx.strokeStyle='#f0c14b'; ctx.lineWidth=7; ctx.lineCap='round';
  const spread=keeperDive>0?26:14;
  ctx.beginPath(); ctx.moveTo(0,-30); ctx.lineTo(-spread,-42); ctx.stroke(); ctx.beginPath(); ctx.moveTo(0,-30); ctx.lineTo(spread,-42); ctx.stroke();
  ctx.restore();
}
function drawAim(){
  if(state==='play'&&serve&&!serve.kicked&&!serve.missed&&!shot){
    // sweeping aim marker on goal line
    ctx.save();
    ctx.strokeStyle='rgba(140,255,168,.9)'; ctx.lineWidth=3;
    ctx.beginPath(); ctx.moveTo(aimX,BAR+4); ctx.lineTo(aimX,GY-2); ctx.stroke();
    ctx.fillStyle='rgba(140,255,168,.95)'; ctx.beginPath(); ctx.moveTo(aimX,GY+2); ctx.lineTo(aimX-8,GY+16); ctx.lineTo(aimX+8,GY+16); ctx.closePath(); ctx.fill();
    ctx.restore();
  }
}
function drawStriker(){
  const p=serve&&!serve.kicked&&!serve.missed? serve.pt/serve.dur : (kickAnim>0?1:0);
  const ka=kickAnim; // 1->0 during kick
  ctx.save(); ctx.translate(STK.x,STK.y);
  ctx.fillStyle='rgba(0,0,0,.25)'; ctx.beginPath(); ctx.ellipse(0,26,30,8,0,0,6.28); ctx.fill();
  if(ka>0){
    // bicycle-kick pose: body horizontal, legs scissoring up
    const rot=-1.4 - (1-ka)*0.5;
    ctx.rotate(0);
    // body tilted back
    ctx.save(); ctx.translate(0,-6); ctx.rotate(-1.15);
    ctx.fillStyle='#2f7fd6'; rr(-14,-16,44,26,10); ctx.fill();
    ctx.fillStyle='#f0c39a'; ctx.beginPath(); ctx.arc(-20,-2,9,0,6.28); ctx.fill();
    // kicking leg up
    ctx.strokeStyle='#20304a'; ctx.lineWidth=8; ctx.lineCap='round';
    const kang=-1.9 + (1-ka)*1.6;
    ctx.beginPath(); ctx.moveTo(26,-4); ctx.lineTo(26+Math.cos(kang)*40,-4+Math.sin(kang)*40); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(20,6); ctx.lineTo(38,26); ctx.stroke();
    ctx.restore();
  } else {
    // ready / crouch, looking up
    const bob=Math.sin(t*4)*1.5;
    ctx.strokeStyle='#20304a'; ctx.lineWidth=8; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(-3,2); ctx.lineTo(-12,26); ctx.stroke(); ctx.beginPath(); ctx.moveTo(-3,2); ctx.lineTo(9,26); ctx.stroke();
    ctx.fillStyle='#2f7fd6'; rr(-13,-24+bob,26,32,8); ctx.fill();
    ctx.fillStyle='#f0c39a'; ctx.beginPath(); ctx.arc(0,-32+bob,8,0,6.28); ctx.fill();
    // arms raised
    ctx.strokeStyle='#2f7fd6'; ctx.lineWidth=6; ctx.beginPath(); ctx.moveTo(-8,-16+bob); ctx.lineTo(-18,-30+bob); ctx.stroke(); ctx.beginPath(); ctx.moveTo(8,-16+bob); ctx.lineTo(18,-30+bob); ctx.stroke();
  }
  ctx.restore();
}
function drawBall(){
  if(serve&&!serve.kicked&&!serve.missed&&!shot){
    const p=serve.pt/serve.dur; const b=servePos(p); const r=8+Math.min(1,p)*3;
    // sweet-height indicator ring near contact when close
    if(p>0.7){ const a=Math.max(0,1-Math.abs(1-p)/0.26); ctx.strokeStyle='rgba(140,255,168,'+(0.25+a*0.5)+')'; ctx.lineWidth=3; ctx.beginPath(); ctx.arc(CX,CY,20+ (1-a)*22,0,6.28); ctx.stroke(); }
    drawSoccer(b.x,b.y,r);
  }
  if(shot&&!shot.done){ drawSoccer(shot.x,shot.y,8);
    ctx.strokeStyle='rgba(255,255,255,.3)'; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(servePos(1).x,servePos(1).y); ctx.lineTo(shot.x,shot.y); ctx.stroke(); }
}
function drawSoccer(x,y,r){ ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(x,y,r,0,6.28); ctx.fill();
  ctx.fillStyle='#1a2233'; ctx.beginPath(); ctx.arc(x,y,r*0.34,0,6.28); ctx.fill(); ctx.strokeStyle='#556'; ctx.lineWidth=1; ctx.stroke(); }

function drawPop(){ if(popT>0&&popText){ ctx.textAlign='center'; ctx.globalAlpha=Math.min(1,popT*1.2); ctx.font='bold 26px sans-serif'; ctx.fillStyle=popCol; ctx.fillText(popText,popX,popY); ctx.globalAlpha=1; ctx.textAlign='left'; } }

function hud(x,y,w,h,lab,val,col){ ctx.fillStyle='rgba(6,16,26,.62)'; rr(x,y,w,h,9); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.6)'; ctx.font='11px sans-serif'; ctx.textAlign='left'; ctx.fillText(lab,x+12,y+19);
  ctx.fillStyle=col||'#fff'; ctx.font='bold 24px sans-serif'; ctx.fillText(val,x+12,y+44); }
function drawHUD(){
  hud(20,300,132,56,'ゴール GOALS',''+score,'#8effa8');
  hud(20,364,132,56,'連続 STREAK',''+streak,'#ffd23e');
  const rem=3-miss; const mc=rem<=1?'#ff6a5a':'#fff';
  hud(W-152,300,132,56,'残り CHANCES',rem+' /3',mc); ctx.textAlign='left';
  ctx.fillStyle='rgba(255,255,255,.5)'; ctx.font='12px sans-serif'; ctx.textAlign='right'; ctx.fillText('自己ベスト '+best,W-22,376); ctx.fillText('最多連続 '+bestStreak,W-22,394); ctx.textAlign='left';
}
function drawMsg(){ if(msgT>0&&msg){ ctx.textAlign='center'; ctx.font='bold 20px sans-serif'; const w=ctx.measureText(msg).width;
  ctx.fillStyle='rgba(6,16,26,.72)'; rr(450-w/2-16,H-92,w+32,34,9); ctx.fill(); ctx.fillStyle='#fff'; ctx.fillText(msg,450,H-69); ctx.textAlign='left'; } }
function drawHint(){ if(state==='play'){ ctx.textAlign='center'; ctx.fillStyle='rgba(255,255,255,.66)'; ctx.font='13px sans-serif';
  ctx.fillText('タップ／スペースでオーバーヘッド。緑の狙い印がGKのいない所に来た瞬間＋落下点でキック', 450, H-30); ctx.textAlign='left'; } }
function drawOverlay(){
  ctx.fillStyle='rgba(6,14,24,.78)'; ctx.fillRect(0,0,W,H); ctx.textAlign='center';
  ctx.fillStyle='rgba(140,255,168,.9)'; ctx.font='600 15px sans-serif'; ctx.fillText('SOCCER · BICYCLE KICK',450,116);
  ctx.fillStyle='#fff'; ctx.font='bold 46px sans-serif'; ctx.fillText('オーバーヘッドキック',450,172);
  ctx.fillStyle='#ffd23e'; ctx.font='bold 21px sans-serif'; ctx.fillText('Bicycle Kick',450,204);
  ctx.fillStyle='rgba(255,255,255,.9)'; ctx.font='16px sans-serif';
  const L=['クロスが頭上に落ちてくる。豪快なオーバーヘッドで叩き込め！',
    'ボールが落下点（緑の輪）に重なる瞬間にタップ＝ジャストミート。',
    '同時に、ゴール上を往復する緑の狙い印がGKのいない所に。',
    'タイミングと狙いが噛み合えばゴール。早すぎ／遅すぎは空振り。',
    'セーブ・枠外・空振りでチャンスを消費。3回でゲーム終了。'];
  for(let i=0;i<L.length;i++) ctx.fillText(L[i],450,242+i*25);
  ctx.fillStyle='#e8544e'; rr(450-95,392,190,54,27); ctx.fill();
  ctx.fillStyle='#fff'; ctx.font='bold 24px sans-serif'; ctx.fillText('キックオフ',450,426);
  ctx.fillStyle='rgba(255,255,255,.6)'; ctx.font='14px sans-serif'; ctx.fillText('タップ／スペースで開始',450,470);
  ctx.textAlign='left';
}
function drawOver(){
  ctx.fillStyle='rgba(6,14,24,.86)'; ctx.fillRect(0,0,W,H); ctx.textAlign='center';
  ctx.fillStyle='#fff'; ctx.font='bold 46px sans-serif'; ctx.fillText('ゲーム終了',450,212);
  ctx.fillStyle='#8effa8'; ctx.font='bold 34px sans-serif'; ctx.fillText('ゴール '+score,450,272);
  ctx.fillStyle='#ffd23e'; ctx.font='19px sans-serif'; ctx.fillText('最多連続ゴール '+bestStreak,450,306);
  ctx.fillStyle='#ffd23e'; ctx.font='20px sans-serif'; ctx.fillText('自己ベスト '+best,450,338);
  ctx.fillStyle='#2f7fd6'; rr(450-95,380,190,54,27); ctx.fill();
  ctx.fillStyle='#fff'; ctx.font='bold 22px sans-serif'; ctx.fillText('もう一度',450,414);
  ctx.textAlign='left';
}

function render(){
  ctx.save();
  if(shakeT>0){ ctx.translate((Math.random()*2-1)*shakeM,(Math.random()*2-1)*shakeM); }
  drawField(); drawGoal(); drawAim(); drawStriker(); drawBall();
  for(const q of parts){ ctx.globalAlpha=Math.max(0,q.life); ctx.fillStyle=q.col; ctx.beginPath(); ctx.arc(q.x,q.y,q.r,0,6.28); ctx.fill(); }
  ctx.globalAlpha=1;
  drawPop(); drawHUD(); drawMsg(); drawHint();
  ctx.restore();
  if(flash>0){ ctx.fillStyle=flashCol; ctx.globalAlpha=flash; ctx.fillRect(0,0,W,H); ctx.globalAlpha=1; }
  if(state==='ready') drawOverlay();
  if(state==='over') drawOver();
}
let last=0;
function loop(ts){ if(!last)last=ts; let dt=(ts-last)/1000; last=ts; if(dt>0.05)dt=0.05; update(dt); render(); requestAnimationFrame(loop); }
requestAnimationFrame(loop);

if(TEST){
  window.__bk={
    get state(){return state;},
    get serve(){ if(!serve)return null; return {p:serve.pt/serve.dur, kicked:serve.kicked, missed:serve.missed}; },
    get aimX(){return aimX;},
    get keeperTarget(){return keeperTarget;},
    get saveR(){return saveR;},
    get shot(){ if(!shot)return null; return {res:shot.res,done:shot.done}; },
    get count(){return {score,miss,streak,attempts};},
    get last(){return popText;},
    goalRange(){ return {GL,GR,saveR,keeperTarget}; },
    kick(){ doKick(); },
    tap(){ if(state==='ready'||state==='over')reset(); }
  };
}
})();
</script>
</body>
