<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ボーク判定 (Balk or Legal?)</title>
<style>
  html,body{margin:0;height:100%;background:#0a0d12;overflow:hidden;
    font-family:-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  #stage{position:relative;width:100vw;height:100vh;max-width:calc(100vh*1.5);max-height:calc(100vw/1.5);aspect-ratio:900/600;}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;border-radius:6px;}
</style>
</head>
<body>
<div id="wrap"><div id="stage"><canvas id="cv"></canvas></div></div>
<script>
(function(){
const W=900,H=600,cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let DPR=1;
function fit(){DPR=Math.min(2,window.devicePixelRatio||1);cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
fit();addEventListener('resize',fit);

// ---------- audio ----------
let AC=null;function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function tone(f,d,type,v,sweep){const a=ac();if(!a)return;const t=a.currentTime,o=a.createOscillator(),g=a.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(sweep)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+sweep),t+d);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v||0.2,t+0.008);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+0.02);}
function noise(d,v,hp){const a=ac();if(!a)return;const t=a.currentTime,n=Math.floor(a.sampleRate*d),buf=a.createBuffer(1,n,a.sampleRate),ch=buf.getChannelData(0);
  for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource();s.buffer=buf;
  const f=a.createBiquadFilter();f.type='highpass';f.frequency.value=hp||600;const g=a.createGain();g.gain.value=v||0.2;
  s.connect(f);f.connect(g);g.connect(a.destination);s.start(t);s.stop(t+d+0.02);}
const S={
  set:()=>{tone(300,0.06,'sine',0.05);},
  move:()=>{noise(0.05,0.12,700);tone(360,0.05,'square',0.06,-30);},
  balk:()=>{tone(300,0.16,'sawtooth',0.12,-120);setTimeout(()=>tone(220,0.14,'sawtooth',0.1,-80),90);},
  play:()=>{tone(560,0.09,'triangle',0.08,60);},
  good:()=>{[680,940,1220].forEach((f,i)=>setTimeout(()=>tone(f,0.1,'triangle',0.16),i*55));},
  big:()=>{[600,800,1000,1250].forEach((f,i)=>setTimeout(()=>tone(f,0.12,'triangle',0.17),i*80));},
  bad:()=>{noise(0.18,0.22,300);tone(160,0.22,'sawtooth',0.12,-50);},
  streak:()=>{[700,930,1170,1400].forEach((f,i)=>setTimeout(()=>tone(f,0.1,'triangle',0.16),i*60));},
  over:()=>{[440,330,247,175].forEach((f,i)=>setTimeout(()=>tone(f,0.3,'triangle',0.2),i*160));}
};

// ---------- geometry ----------
const MOUND={x:452,y:300}, HOME={x:452,y:520}, FIRST={x:726,y:372}, RUN={x:656,y:356};

// each move type: kind (truth), dir (where he goes), ball (real release?), tell text
const MOVES={
  home_legal:{kind:'legal', dir:'home', ball:true,  tell:'完全静止 → 本塁へ投球'},
  pick_legal:{kind:'legal', dir:'first',ball:true,  tell:'軸足を外して一塁へ送球'},
  flinch:    {kind:'balk',  dir:'home', ball:false, tell:'静止せず始動（二段モーション）'},
  feint:     {kind:'balk',  dir:'first',ball:false, tell:'軸足を外さず一塁へ偽投'},
  interrupt: {kind:'balk',  dir:'home', ball:false, tell:'始動して中断（ジャッグル）'}
};
const BTN=[
  {k:'balk', x:150,label:'ボーク！ ←',sub:'反則＝走者に進塁',col:'#e0704b'},
  {k:'legal',x:520,label:'プレー継続 →',sub:'正規＝そのまま',col:'#3f99e0'}
];
const BW=230, BY=505, BH=64;

// ---------- state ----------
let state='title', phase='set', plays=0;
let score=0, combo=0, best=+(localStorage.getItem('bk_best')||0);
let outs=0, fails=0, lvl=1;   // outs = correct calls
let clock=0, revealT=520, callWin=980, kind='legal', movetype='home_legal', tough=false;
let decided=false, call=null, result=null, resultT=0, msg='', msgOk=false, anim=0;
let shake=0, flash=0, flashCol='#fff', last=performance.now();
let parts=[], pops=[];

function rnd(a,b){return a+Math.random()*(b-a);}
function pick(a){return a[Math.floor(Math.random()*a.length)];}
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function lerp(a,b,u){return a+(b-a)*u;}
function easeOut(u){return 1-Math.pow(1-u,2);}

function reset(){state='title';score=0;combo=0;outs=0;fails=0;lvl=1;plays=0;result=null;parts=[];pops=[];}

function newPlay(){
  plays++; lvl=Math.min(7,1+Math.floor(outs/4));
  revealT=clamp(560-lvl*24,360,560);
  callWin=clamp(1020-lvl*70,560,1020);
  tough=Math.random()<clamp(0.2+lvl*0.05,0.2,0.5);
  kind=(Math.random()<0.5?'balk':'legal');
  movetype=(kind==='legal')?pick(['home_legal','pick_legal']):pick(['flinch','feint','interrupt']);
  phase='set'; clock=0; decided=false; call=null; result=null; resultT=0; msg=''; msgOk=false; anim=0;
  S.set();
}
function start(){ if(!ac())ac(); if(AC&&AC.state==='suspended')AC.resume(); reset(); state='play'; newPlay(); }

function correctCall(){ return kind; }   // 'balk' or 'legal'

function makeCall(c){
  if(state==='title'){start();return;}
  if(state==='over'){ if(resultT>0.4){reset();start();} return; }
  if(state!=='play'||phase!=='set'||decided) return;
  if(clock<revealT){ decided=true; call=c; resolve('early'); return; }
  decided=true; call=c;
  resolve(c===correctCall()?'good':'wrong');
}

function resolve(k){
  phase='result'; result=k; resultT=0; anim=0;
  const mv=MOVES[movetype];
  if(k==='good'){
    outs++; combo++;
    let add=Math.round((tough?250:150)*(1+Math.min(9,combo-1)*0.14)); score+=add;
    if(kind==='balk')S.balk(); else S.play(); setTimeout(S.good,120); if(tough)setTimeout(S.big,180);
    msgOk=true; flash=1;flashCol='#8affa0';shake=5; burst(MOUND.x,MOUND.y-8,'#8affa0',16,7);
    pop(W/2,186,(tough?'際どい反則を見抜いた！ +':'好判定！ +')+add,'#d6ffe0');
    if(combo>=2)pop(W/2,150,'コンボ x'+combo,'#ffd24d');
    if(combo>0&&combo%5===0)S.streak();
    msg=(kind==='balk')?('ボーク！ '+mv.tell+'——走者に進塁を認めて正解'):('正規のプレー（'+mv.tell+'）——継続で正解');
  } else {
    fails++; combo=0; msgOk=false; flash=1;flashCol='#ff5b5b';shake=9; S.bad();
    if(k==='early') msg='判断が早い…投手が動き切る前に判定してはいけない';
    else msg=(kind==='balk')?('誤審…'+mv.tell+'＝ボークだった（見逃し）'):('誤審…'+mv.tell+'＝正規のプレーだった');
    pop(W/2,186,'誤審…','#ffb0b0');
  }
  if(fails>=3){ state='over'; resultT=0; S.over(); if(score>best){best=score;localStorage.setItem('bk_best',best);} }
}

// ---------- input ----------
cv.addEventListener('pointerdown',e=>{e.preventDefault();
  if(state!=='play'||phase!=='set'){ makeCall('balk'); return; }
  const r=cv.getBoundingClientRect(); const x=(e.clientX-r.left)/r.width*W, y=(e.clientY-r.top)/r.height*H;
  for(const b of BTN){ if(x>=b.x&&x<=b.x+BW&&y>=BY&&y<=BY+BH){ makeCall(b.k); return; } }
  makeCall(x<W*0.5?'balk':'legal');
});
addEventListener('keydown',e=>{ if(e.repeat)return;
  if(e.code==='ArrowLeft'||e.code==='KeyA'){e.preventDefault();makeCall('balk');}
  else if(e.code==='ArrowRight'||e.code==='KeyD'){e.preventDefault();makeCall('legal');}
  else if(e.code==='Space'||e.code==='Enter'){e.preventDefault(); if(state!=='play')makeCall('balk');} });

// ---------- particles ----------
function burst(x,y,c,n,sp){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=rnd(sp*0.3,sp);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:1,c});}}
function pop(x,y,txt,c){pops.push({x,y,txt,c,life:1});}

// ---------- update ----------
function update(dt){
  shake*=Math.pow(0.86,dt/16.7); if(shake<0.3)shake=0;
  flash*=Math.pow(0.9,dt/16.7);
  for(const p of parts){p.vx*=0.96;p.vy=p.vy*0.96+0.28;p.x+=p.vx*dt/16.7;p.y+=p.vy*dt/16.7;p.life-=dt/16.7*0.026;}
  parts=parts.filter(p=>p.life>0);
  for(const p of pops){p.y-=dt/16.7*0.5;p.life-=dt/16.7*0.02;}
  pops=pops.filter(p=>p.life>0);

  if(state!=='play'){ if(state==='over')resultT+=dt/1000; return; }
  if(phase==='set'){ clock+=dt;
    if(clock>=revealT) anim=Math.min(1,anim+dt/300);
    if(!decided && clock>revealT+callWin){ decided=true; call=null; resolve('late'); }
    return; }
  if(phase==='result'){ resultT+=dt/1000; anim=Math.min(1,anim+dt/360); if(resultT>1.7) newPlay(); return; }
}

// ---------- render ----------
function drawField(){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#123a1f');g.addColorStop(0.5,'#0f5e34');g.addColorStop(1,'#0c4c2b');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  // infield dirt
  ctx.fillStyle='#6a4a30';ctx.beginPath();ctx.moveTo(HOME.x,HOME.y+8);ctx.lineTo(FIRST.x+40,FIRST.y);ctx.lineTo(MOUND.x,120);ctx.lineTo(180,FIRST.y);ctx.closePath();ctx.fill();
  // mound
  ctx.fillStyle='#7a5638';ctx.beginPath();ctx.ellipse(MOUND.x,MOUND.y+14,74,42,0,0,6.28);ctx.fill();
  ctx.fillStyle='#e9e2d2';ctx.fillRect(MOUND.x-20,MOUND.y+10,40,7);   // rubber
  // home plate
  ctx.fillStyle='#e8e4d8';ctx.beginPath();
  ctx.moveTo(HOME.x-16,HOME.y-8);ctx.lineTo(HOME.x+16,HOME.y-8);ctx.lineTo(HOME.x+16,HOME.y+6);ctx.lineTo(HOME.x,HOME.y+16);ctx.lineTo(HOME.x-16,HOME.y+6);ctx.closePath();ctx.fill();
  // first base bag
  ctx.save();ctx.translate(FIRST.x,FIRST.y);ctx.rotate(0.78);ctx.fillStyle='#e8e4d8';ctx.fillRect(-13,-13,26,26);ctx.restore();
}
function person(x,y,col,s,lean){s=s||1;lean=lean||0;
  ctx.save();ctx.translate(x,y);ctx.rotate(lean);
  ctx.fillStyle=col;ctx.beginPath();ctx.ellipse(0,-15*s,10*s,15*s,0,0,6.28);ctx.fill();
  ctx.fillStyle='#f0c9a0';ctx.beginPath();ctx.arc(0,-34*s,7.5*s,0,6.28);ctx.fill();
  ctx.restore();
}

function render(){
  ctx.save();
  if(shake>0)ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
  drawField();

  if(state==='play'||state==='over'){
    const revealed=(phase==='set'&&clock>=revealT)||phase==='result';
    const mv=MOVES[movetype];
    const showMove=revealed?anim:0;

    // runner leading off first (advances to 2nd on a correct balk call)
    let rx=RUN.x, ry=RUN.y;
    if(phase==='result'&&result==='good'&&kind==='balk'){ const u=easeOut(clamp(resultT/1.1,0,1)); rx=lerp(RUN.x,RUN.x-70,u); ry=lerp(RUN.y,RUN.y-92,u); }
    person(rx,ry,'#2b6fd6',0.9);
    if(!revealed){ ctx.fillStyle='rgba(150,200,255,0.8)';ctx.font='bold 11px sans-serif';ctx.textAlign='center';ctx.fillText('走者',rx,ry-46); }

    // pitcher on the mound; small flinch/lean when he moves
    let lean=0, px=MOUND.x, py=MOUND.y;
    if(revealed){
      if(mv.dir==='home'){ py=MOUND.y+ (movetype==='interrupt'? 6*Math.sin(showMove*9)*(1-showMove) : 10*showMove); }
      else { px=MOUND.x+ (movetype==='feint'? 12*Math.sin(showMove*8)*(1-showMove) : 16*showMove); lean=0.25*showMove; }
      if(kind==='balk')lean+= (Math.sin(showMove*22)*0.05*(1-showMove));  // jitter tell
    }
    person(px,py,'#c23a3a',0.98,lean);

    // set gauge (comes set before the move)
    if(state==='play'&&phase==='set'&&clock<revealT){
      const sp=clamp(clock/revealT,0,1),bw=120,x=MOUND.x-bw/2,y=MOUND.y-64;
      ctx.fillStyle='rgba(255,255,255,0.16)';ctx.fillRect(x,y,bw,7);
      ctx.fillStyle='#8affa0';ctx.fillRect(x,y,bw*sp,7);
      ctx.fillStyle='rgba(255,255,255,0.7)';ctx.font='11px sans-serif';ctx.textAlign='center';ctx.fillText('セットに入る…',MOUND.x,y-6);
    }

    // move arrow + ball on reveal
    if(revealed){
      const tx=(mv.dir==='home')?HOME.x:FIRST.x, ty=(mv.dir==='home')?HOME.y:FIRST.y;
      const ax=lerp(MOUND.x,tx,0.5), ay=lerp(MOUND.y,ty,0.5);
      ctx.strokeStyle=kind==='balk'?'rgba(255,120,90,0.85)':'rgba(120,220,255,0.85)';ctx.lineWidth=4;
      ctx.beginPath();ctx.moveTo(MOUND.x,MOUND.y);ctx.lineTo(lerp(MOUND.x,tx,0.34+0.12*showMove),lerp(MOUND.y,ty,0.34+0.12*showMove));ctx.stroke();
      // ball only on a real release
      if(mv.ball){ const u=easeOut(showMove); const bx=lerp(MOUND.x,tx,u), by=lerp(MOUND.y,ty,u);
        ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(bx,by,6,0,6.28);ctx.fill();
        ctx.strokeStyle='#222';ctx.lineWidth=1;ctx.beginPath();ctx.arc(bx,by,6,0.4,2.2);ctx.stroke(); }
      // tell label
      ctx.fillStyle=kind==='balk'?'rgba(255,120,95,0.98)':'rgba(130,205,255,0.98)';ctx.font='bold 17px sans-serif';ctx.textAlign='center';
      ctx.fillText(mv.tell,MOUND.x,MOUND.y-52);
    }

    // cue banner + timer
    ctx.textAlign='center';
    if(state==='play'&&phase==='set'){
      if(clock<revealT){ ctx.fillStyle='rgba(255,220,90,0.95)';ctx.font='bold 20px sans-serif';ctx.fillText('走者一塁——投手の動きを見極めろ',W/2,50); }
      else { ctx.fillStyle='rgba(255,220,120,0.98)';ctx.font='bold 22px sans-serif';ctx.fillText('判定！ ボークか、正規のプレーか',W/2,50);
        const p=clamp((clock-revealT)/callWin,0,1),bw=250,x=W/2-bw/2,y=64;
        ctx.fillStyle='rgba(255,255,255,0.18)';ctx.fillRect(x,y,bw,7);ctx.fillStyle=p<0.7?'#8affa0':(p<1?'#ffd24d':'#ff5b5b');ctx.fillRect(x,y,bw*p,7); }
    }

    if(state==='play'){
      for(const b of BTN){ const active=phase==='set'&&clock>=revealT;
        ctx.fillStyle=active?b.col:'rgba(255,255,255,0.10)';rr(b.x,BY,BW,BH,10);ctx.fill();
        ctx.fillStyle=active?'#08130c':'rgba(255,255,255,0.5)';ctx.textAlign='center';ctx.font='bold 19px sans-serif';ctx.fillText(b.label,b.x+BW/2,BY+27);
        ctx.font='11px sans-serif';ctx.fillText(b.sub,b.x+BW/2,BY+47); }
      ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='12px sans-serif';ctx.textAlign='center';ctx.fillText('タップ / ←=ボーク ・ →=プレー継続',W/2,BY+BH+18);
    }
  }

  for(const p of parts){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,3.2,0,6.28);ctx.fill();}
  ctx.globalAlpha=1;
  for(const p of pops){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.font='bold 21px sans-serif';ctx.textAlign='center';ctx.fillText(p.txt,p.x,p.y);}
  ctx.globalAlpha=1;

  // HUD
  ctx.textAlign='left';ctx.fillStyle='#fff';ctx.font='bold 26px sans-serif';ctx.fillText('SCORE '+score,20,36);
  ctx.textAlign='right';ctx.fillStyle='rgba(255,255,255,0.9)';ctx.font='14px sans-serif';ctx.fillText('好判定 '+outs+'  Lv'+lvl,W-20,24);
  ctx.fillText('誤審',W-92,46);
  for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(W-60+i*20,41,7,0,6.28);ctx.fillStyle=i<fails?'#ff5b5b':'rgba(255,255,255,0.25)';ctx.fill();}
  if(combo>=2){ctx.textAlign='center';ctx.fillStyle='#ffd24d';ctx.font='bold 18px sans-serif';ctx.fillText('コンボ x'+combo,W/2,112);}

  if(state==='play'&&phase==='result'&&msg){ctx.textAlign='center';ctx.fillStyle=msgOk?'#9ff0b8':'#ff9a9a';ctx.font='bold 15px sans-serif';ctx.fillText(msg,W/2,474);}

  if(state==='title'){
    ctx.fillStyle='rgba(4,7,12,0.84)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='bold 40px sans-serif';ctx.fillText('ボーク判定',W/2,82);
    ctx.fillStyle='#ffd23e';ctx.font='bold 22px sans-serif';ctx.fillText('Balk or Legal?',W/2,118);
    ctx.fillStyle='rgba(255,255,255,0.92)';ctx.font='16px sans-serif';
    ctx.fillText('塁審として、走者一塁での投手の動きが“ボーク（反則）”か“正規のプレー”かを見極めて判定しろ',W/2,176);
    ctx.fillStyle='rgba(255,255,255,0.66)';ctx.font='14px sans-serif';
    ctx.fillText('反則＝静止せず始動（二段モーション）／軸足を外さず一塁へ偽投／始動して中断＝「ボーク」（←/画面左）',W/2,214);
    ctx.fillText('正規＝完全静止から本塁へ投球／軸足を外して一塁へ送球＝「プレー継続」（→/画面右）',W/2,238);
    ctx.fillText('動き切る前の判定＝早すぎ、誤審は失格ポイント、際どい反則を見抜くと大量加点',W/2,262);
    ctx.fillText('上級ほど動きが速く際どく猶予も短い。3誤審で交代',W/2,286);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で開始',W/2,354);
    ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='14px sans-serif';ctx.fillText('BEST '+best,W/2,386);
  }
  if(state==='over'){
    ctx.fillStyle='rgba(4,7,12,0.86)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#ff6b6b';ctx.font='bold 46px sans-serif';ctx.fillText('3誤審…交代',W/2,222);
    ctx.fillStyle='#fff';ctx.font='bold 40px sans-serif';ctx.fillText('SCORE '+score,W/2,290);
    ctx.fillStyle='rgba(255,255,255,0.85)';ctx.font='19px sans-serif';ctx.fillText('好判定 '+outs+'   BEST '+best,W/2,330);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で もう一度',W/2,402);
  }

  if(flash>0.02){ctx.globalAlpha=flash*0.5;ctx.fillStyle=flashCol;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}
  ctx.restore();

  ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,0.4)';ctx.font='12px sans-serif';
  ctx.fillText('ボーク判定：静止せず始動/偽投/中断＝ボーク(←)、完全静止→投球/軸足を外して送球＝プレー継続(→)。早判定/誤審は失敗、3つで交代',W/2,H-8);
}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

function frame(ts){let dt=ts-last;last=ts;if(dt>60)dt=60;if(dt<0)dt=0;update(dt);render();requestAnimationFrame(frame);}
requestAnimationFrame(frame);

// ---------- test hook ----------
window.__bk={
  start, makeCall:(c)=>makeCall(c),
  get state(){return state;},
  get score(){return score;},
  get outs(){return outs;},
  get fails(){return fails;},
  get info(){return {state,phase,clock,revealT,callWin,kind,movetype,tough,decided,call,result,outs,fails,lvl,
    revealed:(clock>=revealT),correctCall:correctCall(),canAct:(phase==='set'&&!decided)};}
};
})();
</script>
</body>
</html>
