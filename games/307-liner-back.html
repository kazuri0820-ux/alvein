<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ライナーバック (Get Back!)</title>
<style>
  html,body{margin:0;height:100%;background:#0a1207;overflow:hidden;
    font-family:-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  #stage{position:relative;width:100vw;height:100vh;max-width:calc(100vh*1.5);max-height:calc(100vw/1.5);aspect-ratio:900/600;}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;border-radius:6px;}
</style>
</head>
<body>
<div id="wrap"><div id="stage"><canvas id="cv"></canvas></div></div>
<script>
(function(){
const W=900,H=600,cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let DPR=1;
function fit(){DPR=Math.min(2,window.devicePixelRatio||1);cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
fit();addEventListener('resize',fit);

// ---------- audio ----------
let AC=null;function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function tone(f,d,type,v,sweep){const a=ac();if(!a)return;const t=a.currentTime,o=a.createOscillator(),g=a.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(sweep)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+sweep),t+d);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v||0.2,t+0.008);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+0.02);}
function noise(d,v,hp){const a=ac();if(!a)return;const t=a.currentTime,n=Math.floor(a.sampleRate*d),buf=a.createBuffer(1,n,a.sampleRate),ch=buf.getChannelData(0);
  for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource();s.buffer=buf;
  const f=a.createBiquadFilter();f.type='highpass';f.frequency.value=hp||600;const g=a.createGain();g.gain.value=v||0.2;
  s.connect(f);f.connect(g);g.connect(a.destination);s.start(t);s.stop(t+d+0.02);}
const S={
  crack:()=>{noise(0.05,0.18,500);tone(220,0.06,'square',0.11,-50);},
  good:()=>{[680,940,1220].forEach((f,i)=>setTimeout(()=>tone(f,0.1,'triangle',0.16),i*55));},
  big:()=>{[620,840,1080,1360].forEach((f,i)=>setTimeout(()=>tone(f,0.12,'triangle',0.17),i*80));},
  slide:()=>{noise(0.14,0.12,300);},
  bad:()=>{noise(0.18,0.22,300);tone(150,0.22,'sawtooth',0.12,-40);},
  streak:()=>{[700,930,1170,1400].forEach((f,i)=>setTimeout(()=>tone(f,0.1,'triangle',0.16),i*60));},
  over:()=>{[440,330,247,175].forEach((f,i)=>setTimeout(()=>tone(f,0.3,'triangle',0.2),i*160));}
};

// ---------- geometry ----------
const HOME={x:150,y:500}, SECOND={x:470,y:150}, THIRD={x:180,y:250}, INF={x:430,y:330};
const BTN=[
  {k:'back', x:150,label:'戻れ！ ←',sub:'ライナー＝捕られる',col:'#e0574b'},
  {k:'go', x:520,label:'進塁！ →',sub:'ゴロ＝抜ける',col:'#3fc46b'}
];
const BW=230, BY=506, BH=64;

// ---------- state ----------
let state='title', phase='live', plays=0;
let score=0, combo=0, best=+(localStorage.getItem('lb_best')||0);
let outs=0, fails=0, lvl=1;   // outs = good reads
let t=0, revealT=300, w=420, kind='liner', tough=false;
let decided=false, call=null, result=null, resultT=0, msg='', msgOk=false, actAt=0;
let ballU=0, runU=0;
let shake=0, flash=0, flashCol='#fff', last=performance.now();
let parts=[], pops=[];

function rnd(a,b){return a+Math.random()*(b-a);}
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function lerp(a,b,u){return a+(b-a)*u;}
function easeOut(u){return 1-Math.pow(1-u,2);}
function need(){return kind==='liner'?'back':'go';}

function reset(){state='title';score=0;combo=0;outs=0;fails=0;lvl=1;plays=0;result=null;parts=[];pops=[];}

function newPlay(){
  plays++; lvl=Math.min(7,1+Math.floor(outs/4));
  revealT=clamp(320-lvl*12,210,320);
  w=clamp(430-lvl*22,290,430);
  tough=Math.random()<clamp(0.18+lvl*0.05,0.18,0.5);
  kind=(Math.random()<0.5?'liner':'grounder');
  phase='live'; t=0; decided=false; call=null; result=null; resultT=0; msg=''; msgOk=false; actAt=0;
  ballU=0; runU=0;
  S.crack();
}
function start(){ if(!ac())ac(); if(AC&&AC.state==='suspended')AC.resume(); reset(); state='play'; newPlay(); }

function act(dir){
  if(state==='title'){start();return;}
  if(state==='over'){ if(resultT>0.4){reset();start();} return; }
  if(state!=='play'||phase!=='live'||decided||dir==null) return;
  decided=true; call=dir; actAt=t;
  if(t<revealT){ resolve('early'); return; }
  if(t<=revealT+w){ resolve(dir===need()?'good':'wrong'); return; }
  resolve('late');
}

function resolve(k){
  phase='result'; result=k; resultT=0;
  if(k==='good'){
    outs++; combo++;
    const quick=(actAt<=revealT+w*0.45);
    let base=tough?250:150; if(quick)base+=70;
    let add=Math.round(base*(1+Math.min(9,combo-1)*0.14)); score+=add;
    (kind==='liner')?S.slide():0; setTimeout(S.good,60); if(quick||tough)setTimeout(S.big,130);
    msgOk=true; flash=1;flashCol='#8affa0';shake=5; burst(kind==='liner'?SECOND.x:THIRD.x,kind==='liner'?SECOND.y:THIRD.y,'#8affa0',16,7);
    pop(W/2,150,(quick?'好判断！ +':'ナイス走塁！ +')+add,'#d6ffe0');
    if(combo>=2)pop(W/2,196,'コンボ x'+combo,'#ffd24d');
    if(combo>0&&combo%5===0)S.streak();
    msg=(kind==='liner')?'ライナー！ 素早く帰塁してダブルオフを回避——好判断':'ゴロで抜けた！ 一気に三塁へ進塁——ナイス走塁';
  } else {
    fails++; combo=0; msgOk=false; flash=1;flashCol='#ff5b5b';shake=9; S.bad();
    if(k==='early') msg='早い…打球を見極める前に飛び出して逆を突かれた';
    else if(k==='late') msg='判断が遅い…戻れず／進めずアウト';
    else msg=(kind==='liner')?'誤判断…ライナーで飛び出しダブルオフ（併殺）':'誤判断…ゴロなのに帰塁して絶好機を逃した';
    pop(W/2,150,(kind==='liner'&&k==='wrong')?'ダブルオフ…':'アウト…','#ffb0b0');
  }
  if(fails>=3){ state='over'; resultT=0; setTimeout(S.over,180); if(score>best){best=score;localStorage.setItem('lb_best',best);} }
}

// ---------- input ----------
cv.addEventListener('pointerdown',e=>{e.preventDefault();
  if(state!=='play'||phase!=='live'){ act('back'); return; }
  const r=cv.getBoundingClientRect(); const x=(e.clientX-r.left)/r.width*W, y=(e.clientY-r.top)/r.height*H;
  for(const b of BTN){ if(x>=b.x&&x<=b.x+BW&&y>=BY&&y<=BY+BH){ act(b.k); return; } }
  act(x<W/2?'back':'go');
});
addEventListener('keydown',e=>{ if(e.repeat)return;
  if(e.code==='ArrowLeft'||e.code==='KeyA'){e.preventDefault();act('back');}
  else if(e.code==='ArrowRight'||e.code==='KeyD'){e.preventDefault();act('go');}
  else if(e.code==='Space'||e.code==='Enter'){e.preventDefault(); if(state!=='play')act('back');} });

// ---------- particles ----------
function burst(x,y,c,n,sp){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=rnd(sp*0.3,sp);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:1,c});}}
function pop(x,y,txt,c){pops.push({x,y,txt,c,life:1});}

// ---------- update ----------
function update(dt){
  shake*=Math.pow(0.86,dt/16.7); if(shake<0.3)shake=0;
  flash*=Math.pow(0.9,dt/16.7);
  for(const p of parts){p.vx*=0.96;p.vy=p.vy*0.96+0.28;p.x+=p.vx*dt/16.7;p.y+=p.vy*dt/16.7;p.life-=dt/16.7*0.026;}
  parts=parts.filter(p=>p.life>0);
  for(const p of pops){p.y-=dt/16.7*0.5;p.life-=dt/16.7*0.02;}
  pops=pops.filter(p=>p.life>0);

  if(state!=='play'){ if(state==='over')resultT+=dt/1000; return; }
  if(phase==='live'){ t+=dt;
    ballU=clamp(t/(revealT+w*0.7),0,1);
    if(!decided && t>revealT+w){ decided=true; call=null; actAt=t; resolve('late'); }
    return; }
  if(phase==='result'){ resultT+=dt/1000;
    if(result==='good') runU=Math.min(1,runU+dt/300);
    else if(result==='wrong'||result==='late') runU=Math.min(1,runU+dt/400);
    if(resultT>1.5) newPlay(); return; }
}

// ---------- render ----------
function drawField(){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#0f5e34');g.addColorStop(0.5,'#12703f');g.addColorStop(1,'#0c4c2b');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  // infield dirt
  ctx.fillStyle='#7a5433';ctx.beginPath();ctx.moveTo(HOME.x,HOME.y);ctx.lineTo(SECOND.x,SECOND.y);ctx.lineTo(THIRD.x,THIRD.y);ctx.closePath();ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,0.4)';ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(SECOND.x,SECOND.y);ctx.lineTo(THIRD.x,THIRD.y);ctx.stroke();
  ctx.fillStyle='#fff';
  ctx.save();ctx.translate(SECOND.x,SECOND.y);ctx.rotate(0.78);ctx.fillRect(-9,-9,18,18);ctx.restore();
  ctx.save();ctx.translate(THIRD.x,THIRD.y);ctx.rotate(0.78);ctx.fillRect(-9,-9,18,18);ctx.restore();
}
function person(x,y,col,s,label){s=s||1;ctx.fillStyle=col;ctx.beginPath();ctx.ellipse(x,y-15*s,10*s,16*s,0,0,6.28);ctx.fill();
  ctx.fillStyle='#f0c9a0';ctx.beginPath();ctx.arc(x,y-34*s,7.5*s,0,6.28);ctx.fill();
  if(label){ctx.fillStyle='rgba(255,255,255,0.75)';ctx.font='11px sans-serif';ctx.textAlign='center';ctx.fillText(label,x,y-48*s);}}

function render(){
  ctx.save();
  if(shake>0)ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
  drawField();

  if(state==='play'||state==='over'){
    const revealed=(phase==='live'&&t>=revealT)||phase==='result';
    // batter at home
    person(HOME.x,HOME.y,'#c23b34',0.95);
    // fielder near second-base area (catches liners)
    person(INF.x,INF.y,'#2b6fd6',0.95,'野手');

    // runner leading off second toward third
    let rx=SECOND.x, ry=SECOND.y;
    if(phase==='result'&&result==='good'&&kind==='grounder'){ const u=easeOut(runU); rx=lerp(SECOND.x,THIRD.x,u); ry=lerp(SECOND.y,THIRD.y,u); }
    else if(phase==='result'&&(result==='good'&&kind==='liner')){ rx=SECOND.x+8; ry=SECOND.y+6; }
    else { rx=SECOND.x+lerp(0,26,Math.min(1,t/700)); ry=SECOND.y+lerp(0,12,Math.min(1,t/700)); }
    person(rx,ry,'#e8e8e8',0.95,'走者');

    // batted ball
    let bx,by;
    const u=easeOut(ballU);
    if(kind==='liner'){ bx=lerp(HOME.x+14,INF.x,u); by=lerp(HOME.y-24,INF.y-24,u)-Math.sin(u*Math.PI)*14; }
    else { bx=lerp(HOME.x+14,INF.x+130,u); by=HOME.y-6-Math.abs(Math.sin(u*7))*16*(1-u); }
    if(!(phase==='result'&&result!=='good')){
      ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(bx,by,7.5,0,6.28);ctx.fill();
      ctx.strokeStyle='#c33';ctx.lineWidth=1.1;ctx.beginPath();ctx.arc(bx-2,by-2,4.5,0.6,2.6);ctx.stroke();
      if(kind==='liner'){ctx.strokeStyle='rgba(255,255,255,0.4)';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(bx-Math.cos(u*0.6)*16,by-4);ctx.lineTo(bx,by);ctx.stroke();}
      else {ctx.fillStyle='rgba(0,0,0,0.15)';ctx.beginPath();ctx.ellipse(bx,HOME.y+2,8,3,0,0,6.28);ctx.fill();}
    }

    // reveal cue
    if(revealed){
      ctx.textAlign='center';
      if(kind==='liner'){ ctx.fillStyle='rgba(255,150,140,0.98)';ctx.font='bold 20px sans-serif';ctx.fillText('鋭いライナー！ 野手の正面——捕られる',W/2,86); }
      else { ctx.fillStyle='rgba(150,255,170,0.98)';ctx.font='bold 20px sans-serif';ctx.fillText('ゴロだ！ 内野を抜けていく',W/2,86); }
    }

    // cue banner + timer
    ctx.textAlign='center';
    if(state==='play'&&phase==='live'){
      if(t<revealT){ ctx.fillStyle='rgba(255,220,90,0.95)';ctx.font='bold 21px sans-serif';ctx.fillText('打った！ 打球を見極めろ（飛び出し過ぎるな）',W/2,52); }
      else { ctx.fillStyle='rgba(255,220,120,0.98)';ctx.font='bold 22px sans-serif';ctx.fillText('判断！ 戻る or 進む',W/2,52);
        const p=clamp((t-revealT)/w,0,1),bw=250,x=W/2-bw/2,y=64;
        ctx.fillStyle='rgba(255,255,255,0.18)';ctx.fillRect(x,y,bw,7);ctx.fillStyle=p<0.45?'#8affa0':(p<1?'#ffd24d':'#ff5b5b');ctx.fillRect(x,y,bw*p,7); }
    }

    if(state==='play'){
      for(const b of BTN){ const active=phase==='live'&&t>=revealT;
        ctx.fillStyle=active?b.col:'rgba(255,255,255,0.10)';rr(b.x,BY,BW,BH,10);ctx.fill();
        ctx.fillStyle=active?'#08130c':'rgba(255,255,255,0.5)';ctx.textAlign='center';ctx.font='bold 19px sans-serif';ctx.fillText(b.label,b.x+BW/2,BY+27);
        ctx.font='11px sans-serif';ctx.fillText(b.sub,b.x+BW/2,BY+47); }
      ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='12px sans-serif';ctx.textAlign='center';ctx.fillText('タップ / ←=戻れ ・ →=進塁',W/2,BY+BH+18);
    }
  }

  for(const p of parts){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,3.2,0,6.28);ctx.fill();}
  ctx.globalAlpha=1;
  for(const p of pops){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.font='bold 21px sans-serif';ctx.textAlign='center';ctx.fillText(p.txt,p.x,p.y);}
  ctx.globalAlpha=1;

  // HUD
  ctx.textAlign='left';ctx.fillStyle='#fff';ctx.font='bold 26px sans-serif';ctx.fillText('SCORE '+score,20,36);
  ctx.textAlign='right';ctx.fillStyle='rgba(255,255,255,0.9)';ctx.font='14px sans-serif';ctx.fillText('好走塁 '+outs+'  Lv'+lvl,W-20,24);
  ctx.fillText('走塁死',W-104,46);
  for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(W-60+i*20,41,7,0,6.28);ctx.fillStyle=i<fails?'#ff5b5b':'rgba(255,255,255,0.25)';ctx.fill();}
  if(combo>=2){ctx.textAlign='center';ctx.fillStyle='#ffd24d';ctx.font='bold 18px sans-serif';ctx.fillText('コンボ x'+combo,W/2,116);}

  if(state==='play'&&phase==='result'&&msg){ctx.textAlign='center';ctx.fillStyle=msgOk?'#9ff0b8':'#ff9a9a';ctx.font='bold 16px sans-serif';ctx.fillText(msg,W/2,470);}

  if(state==='title'){
    ctx.fillStyle='rgba(4,10,7,0.82)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='bold 42px sans-serif';ctx.fillText('ライナーバック',W/2,90);
    ctx.fillStyle='#ffd23e';ctx.font='bold 22px sans-serif';ctx.fillText('Get Back!',W/2,126);
    ctx.fillStyle='rgba(255,255,255,0.92)';ctx.font='16px sans-serif';
    ctx.fillText('二塁走者としてリードを取る。打った瞬間の打球を見極めて、戻るか進むかを一瞬で判断しろ',W/2,182);
    ctx.fillStyle='rgba(255,255,255,0.66)';ctx.font='14px sans-serif';
    ctx.fillText('鋭いライナー（野手の正面＝捕られる）＝すぐ帰塁（←／画面左）でダブルオフを回避',W/2,220);
    ctx.fillText('ゴロ（内野を抜ける）＝一気に進塁（→／画面右）で好走塁＝加点',W/2,244);
    ctx.fillText('ライナーで飛び出すと併殺、ゴロで帰ると好機を逃す、見極め前の早飛び出し／遅れも失敗',W/2,268);
    ctx.fillText('素早い好判断ほど大量加点。上級ほど打球が速く見極めが短い。3走塁死で交代',W/2,292);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で開始',W/2,360);
    ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='14px sans-serif';ctx.fillText('BEST '+best,W/2,392);
  }
  if(state==='over'){
    ctx.fillStyle='rgba(4,10,7,0.84)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#ff6b6b';ctx.font='bold 46px sans-serif';ctx.fillText('3走塁死…交代',W/2,222);
    ctx.fillStyle='#fff';ctx.font='bold 40px sans-serif';ctx.fillText('SCORE '+score,W/2,290);
    ctx.fillStyle='rgba(255,255,255,0.85)';ctx.font='19px sans-serif';ctx.fillText('好走塁 '+outs+'   BEST '+best,W/2,330);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で もう一度',W/2,402);
  }

  if(flash>0.02){ctx.globalAlpha=flash*0.5;ctx.fillStyle=flashCol;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}
  ctx.restore();

  ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,0.4)';ctx.font='12px sans-serif';
  ctx.fillText('ライナーバック：ライナー（捕られる）＝戻れ、ゴロ（抜ける）＝進塁。逆判断/早飛び出し/遅れは走塁死、3つで交代',W/2,H-8);
}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

function frame(ts){let dt=ts-last;last=ts;if(dt>60)dt=60;if(dt<0)dt=0;update(dt);render();requestAnimationFrame(frame);}
requestAnimationFrame(frame);

// ---------- test hook ----------
window.__lb={
  start, act:(d)=>act(d),
  get state(){return state;},
  get score(){return score;},
  get outs(){return outs;},
  get fails(){return fails;},
  get info(){return {state,phase,t,revealT,w,kind,tough,decided,call,result,outs,fails,lvl,
    need:need(),revealed:(t>=revealT),actWin:(phase==='live'&&t>=revealT&&t<=revealT+w),canAct:(phase==='live'&&!decided)};}
};
})();
</script>
</body>
</html>
