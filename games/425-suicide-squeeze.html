<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>スクイズを決めろ (Suicide Squeeze)</title>
<style>
  html,body{margin:0;padding:0;background:#0a1410;overflow:hidden;font-family:'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif;-webkit-user-select:none;user-select:none;touch-action:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 30%,#173525,#060d09 72%);}
  #stage{position:relative;width:min(100vw,calc(100vh*1.5));aspect-ratio:900/600;max-width:900px;box-shadow:0 10px 60px rgba(0,0,0,.6);border-radius:8px;overflow:hidden;}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;}
</style>
</head>
<body>
<div id="wrap"><div id="stage"><canvas id="cv"></canvas></div></div>
<script>
(function(){
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const W=900,H=600;let DPR=Math.min(2,window.devicePixelRatio||1);
function fit(){const r=cv.getBoundingClientRect();DPR=Math.min(2,window.devicePixelRatio||1);cv.width=Math.round(r.width*DPR);cv.height=Math.round(r.height*DPR);ctx.setTransform(cv.width/W,0,0,cv.height/H,0,0);}
new ResizeObserver(fit).observe(cv);fit();

// ---------- audio ----------
let AC=null;function actx(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function tone(f,d,type,v,sweep){const a=actx();if(!a)return;const o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.value=f;if(sweep)o.frequency.linearRampToValueAtTime(sweep,a.currentTime+d);g.gain.value=0.0001;g.gain.exponentialRampToValueAtTime(v||0.2,a.currentTime+0.008);g.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+d);o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+d+0.02);}
function noise(d,v,hp){const a=actx();if(!a)return;const n=a.createBufferSource(),b=a.createBuffer(1,a.sampleRate*d,a.sampleRate),dt=b.getChannelData(0);for(let i=0;i<dt.length;i++)dt[i]=Math.random()*2-1;n.buffer=b;const f=a.createBiquadFilter();f.type='highpass';f.frequency.value=hp||800;const g=a.createGain();g.gain.value=0.0001;g.gain.exponentialRampToValueAtTime(v||0.2,a.currentTime+0.01);g.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+d);n.connect(f);f.connect(g);g.connect(a.destination);n.start();n.stop(a.currentTime+d+0.02);}
const S={
  set(){tone(300,0.08,'sine',0.12);},
  go(){tone(560,0.08,'square',0.14,760);noise(0.05,0.06,700);},
  bunt(){tone(300,0.06,'square',0.16);noise(0.05,0.14,500);},
  score(){tone(560,0.1,'triangle',0.2);setTimeout(function(){tone(760,0.14,'triangle',0.22);},110);setTimeout(function(){tone(1000,0.2,'triangle',0.22);},230);for(let i=0;i<5;i++)setTimeout(function(){tone(500+Math.random()*400,0.2,'triangle',0.05);},260+i*45);},
  out(){tone(300,0.3,'sawtooth',0.16,150);setTimeout(function(){tone(190,0.4,'sawtooth',0.14,110);},150);},
  combo(n){tone(600+Math.min(n,8)*70,0.12,'triangle',0.16);},
  over(){tone(330,0.3,'sine',0.2,160);setTimeout(function(){tone(220,0.5,'sine',0.2,110);},180);},
  start(){tone(440,0.1,'triangle',0.18);setTimeout(function(){tone(660,0.16,'triangle',0.2);},110);},
};

function clamp(v,a,b){return v<a?a:v>b?b:v;}
function rnd(a,b){return a+Math.random()*(b-a);}

// ---------- state ----------
let state='title';
let outs=0,fails=0,score=0,combo=0,lvl=1;   // outs = squeezes scored
let best=0;try{best=parseInt(localStorage.getItem('sq_best')||'0')||0;}catch(e){}
const TARGET=26;

let phase='wind';  // wind | combo(beat1: break) | run(beat2: bunt) | result
let pt=0, clock=0;
let arriveT1=850, w1=150, effW1=150, fireIdeal=520, fw=150, effFw=150, tough=false;
let breakClock=0, decided=false, result='', beat1done=false, q1=0,q2=0;
let parts=[];
let shakeT=0,flash=0;
let msg='',msgCol='#fff',msgT=0;
let lastAdd=0;
// diamond actors
const HOME=[450,470], TB=[248,336], MOUND=[450,240], CATCH=[450,520];
let runX=248,runY=336, ballX=450,ballY=240, buntU=0, popU=0, whiffU=0, wideU=0;

function reset(){outs=0;fails=0;score=0;combo=0;lvl=1;parts=[];}
function newPlay(){
  lvl=Math.min(7,1+Math.floor(outs/4));
  arriveT1=clamp(900-lvl*42,620,900);
  w1=clamp(150-lvl*10,90,150);
  fireIdeal=clamp(560-lvl*20,420,560);
  fw=clamp(150-lvl*10,90,150);
  tough=Math.random()<clamp(0.2+lvl*0.05,0.2,0.5);
  effW1=tough?w1*0.82:w1;
  effFw=tough?fw*0.82:fw;
  phase='wind';pt=0;clock=0;breakClock=0;decided=false;result='';beat1done=false;q1=0;q2=0;
  runX=TB[0];runY=TB[1];ballX=MOUND[0];ballY=MOUND[1];buntU=0;popU=0;whiffU=0;wideU=0;
}
function startGame(){reset();state='play';newPlay();S.start();}

function burst(x,y,col,n,sp){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=rnd(0.4,1)*(sp||3);parts.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:1,col:col,r:rnd(2,5)});}}

function finish(kind){
  decided=true;result=kind;
  if(kind==='score'){
    outs++;combo++;
    const cm=1+Math.min(combo-1,6)*0.14;
    const add=Math.round((100+(q1+q2)*60)*cm)*Math.max(1,lvl);
    score+=add;lastAdd=add;
    S.score();if(combo>1)setTimeout(function(){S.combo(combo);},300);
    flash=0.28;
    msg=((q1+q2)>1.4?'完璧なスクイズ！ 転がして生還！':'スクイズ成功！ 一点をもぎ取った！')+'  +'+add;msgCol='#5affa0';msgT=1;
    burst(HOME[0],HOME[1],'#5affa0',16,3.5);
  }else{
    combo=0;fails++;
    S.out();flash=0.35;shakeT=0.7;
    if(result==='early1'){msg='スタートが早い！ 見破られてピッチアウト';wideU=0.0001;}
    else if(result==='late1')msg='スタートが遅い！ スクイズの機を逃した';
    else if(result==='early2'){msg='バントが早い！ 打ち上げて小フライ';popU=0.0001;}
    else {msg='バント空振り！ 三塁走者が本塁で憤死';whiffU=0.0001;}
    msgCol='#ff6a6a';msgT=1;
  }
  phase='result';pt=0;
}

function act(){
  if(!AC)actx();
  if(state==='title'){startGame();return;}
  if(state==='over'){startGame();return;}
  if(state!=='play'||decided)return;
  if(phase==='combo'){
    const c=clock;
    if(c<arriveT1-effW1){finish('early1');return;}
    beat1done=true;breakClock=clock;q1=clamp(1-Math.abs(c-arriveT1)/effW1,0,1);
    S.go();phase='run';pt=0;
  }else if(phase==='run'){
    const rc=clock-breakClock;
    if(rc<fireIdeal-effFw){finish('early2');return;}
    q2=clamp(1-Math.abs(rc-fireIdeal)/effFw,0,1);
    S.bunt();buntU=0.0001;finish('score');
  }
}
cv.addEventListener('mousedown',function(e){e.preventDefault();act();});
cv.addEventListener('touchstart',function(e){e.preventDefault();act();},{passive:false});
window.addEventListener('keydown',function(e){
  if(e.code==='Space'||e.code==='ArrowUp'||e.code==='Enter'||e.code==='KeyJ'){e.preventDefault();act();}
});

// ---------- update ----------
let last=0;
function pitchProg(){
  // pitch travels mound->plate, reaching the plate at the bunt moment (fireIdeal into beat2)
  if(phase==='combo') return clamp(clock/(arriveT1),0,1)*0.45;
  if(phase==='run') return 0.45+clamp((clock-breakClock)/fireIdeal,0,1)*0.55;
  return (result==='score'||result==='late2')?1:0.9;
}
function update(dt){
  if(flash>0)flash=Math.max(0,flash-dt/300);
  if(shakeT>0)shakeT=Math.max(0,shakeT-dt/320);
  if(msgT>0)msgT=Math.max(0,msgT-dt/1500);
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.x+=p.vx;p.y+=p.vy;p.vy+=0.16;p.life-=dt/640;if(p.life<=0)parts.splice(i,1);}
  if(state!=='play')return;
  pt+=dt;
  if(phase==='wind'){
    if(pt>=460){phase='combo';pt=0;clock=0;S.set();}
  }else if(phase==='combo'){
    clock+=dt;
    runX=TB[0];runY=TB[1];
    const u=pitchProg();ballX=MOUND[0]+(HOME[0]-MOUND[0])*u;ballY=MOUND[1]+(455-MOUND[1])*u;
    if(clock>=arriveT1+effW1&&!decided)finish('late1');
  }else if(phase==='run'){
    clock+=dt;
    const rc=clock-breakClock;
    const ur=clamp(rc/fireIdeal,0,1);
    runX=TB[0]+(HOME[0]-TB[0])*ur; runY=TB[1]+(HOME[1]-TB[1])*ur;   // runner sprints 3B -> home
    const u=pitchProg();ballX=MOUND[0]+(HOME[0]-MOUND[0])*u;ballY=MOUND[1]+(455-MOUND[1])*u;
    if(rc>=fireIdeal+effFw&&!decided)finish('late2');
  }else if(phase==='result'){
    if(result==='score'){
      // runner finishes across the plate; bunt dribbles fair up the third-base line
      runX=Math.max(HOME[0]-6,runX-dt*0.02); runY=HOME[1];
      buntU=Math.min(1,buntU+dt/420); ballX=455+(388-455)*buntU; ballY=455+(432-455)*buntU;
      if(buntU<0.5&&Math.random()<0.2)burst(ballX,ballY,'#cfe',1,1);
    }else if(result==='early2'){ popU=Math.min(1,popU+dt/500); ballX=452; ballY=455-Math.sin(popU*Math.PI)*150; }
    else if(result==='late2'){ whiffU=Math.min(1,whiffU+dt/300); ballX=452; ballY=455+whiffU*60; }
    else if(result==='early1'){ wideU=Math.min(1,wideU+dt/300); ballX=452+wideU*70; ballY=455+wideU*30; }
    if(pt>=1120){
      if(fails>=3){state='over';best=Math.max(best,score);try{localStorage.setItem('sq_best',String(best));}catch(e){}S.over();}
      else if(outs>=TARGET){state='over';best=Math.max(best,score);try{localStorage.setItem('sq_best',String(best));}catch(e){}S.start();}
      else newPlay();
    }
  }
}

// ---------- render ----------
function roundRect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

function drawDiamond(){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#2a5a3a');g.addColorStop(1,'#1c4a2c');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  // infield dirt
  ctx.fillStyle='#8a5a34';ctx.beginPath();ctx.moveTo(HOME[0],HOME[1]+8);ctx.lineTo(TB[0]-6,TB[1]);ctx.lineTo(MOUND[0],MOUND[1]-70);ctx.lineTo(652,TB[1]);ctx.closePath();ctx.fill();
  // grass infield
  ctx.fillStyle='#2f6b41';ctx.beginPath();ctx.moveTo(HOME[0],HOME[1]-16);ctx.lineTo(TB[0]+22,TB[1]+6);ctx.lineTo(MOUND[0],MOUND[1]-30);ctx.lineTo(630,TB[1]+6);ctx.closePath();ctx.fill();
  // baselines
  ctx.strokeStyle='rgba(255,255,255,.85)';ctx.lineWidth=4;
  ctx.beginPath();ctx.moveTo(HOME[0],HOME[1]);ctx.lineTo(TB[0],TB[1]);ctx.stroke();      // 3B line
  ctx.beginPath();ctx.moveTo(HOME[0],HOME[1]);ctx.lineTo(652,TB[1]);ctx.stroke();        // 1B line
  // bases
  function base(p){ctx.save();ctx.translate(p[0],p[1]);ctx.rotate(Math.PI/4);ctx.fillStyle='#eee';ctx.fillRect(-8,-8,16,16);ctx.restore();}
  base(TB);base([652,TB[1]]);
  // mound
  ctx.fillStyle='#9a663a';ctx.beginPath();ctx.ellipse(MOUND[0],MOUND[1],34,18,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#c9c2b6';ctx.fillRect(MOUND[0]-9,MOUND[1]-3,18,5);
  // home plate
  ctx.fillStyle='#eee';ctx.beginPath();ctx.moveTo(HOME[0],HOME[1]+12);ctx.lineTo(HOME[0]+11,HOME[1]+3);ctx.lineTo(HOME[0]+11,HOME[1]-5);ctx.lineTo(HOME[0]-11,HOME[1]-5);ctx.lineTo(HOME[0]-11,HOME[1]+3);ctx.closePath();ctx.fill();
  // labels
  ctx.fillStyle='rgba(255,255,255,.5)';ctx.font='11px sans-serif';ctx.textAlign='center';
  ctx.fillText('三塁',TB[0],TB[1]-16);ctx.fillText('本塁',HOME[0],HOME[1]+30);
}

function person(x,y,col,glow,lean){
  ctx.save();ctx.translate(x,y);if(lean)ctx.rotate(lean);
  if(glow>0){ctx.strokeStyle='rgba(90,255,160,'+glow+')';ctx.lineWidth=4;ctx.beginPath();ctx.arc(0,-18,26,0,Math.PI*2);ctx.stroke();}
  ctx.fillStyle='rgba(0,0,0,.28)';ctx.beginPath();ctx.ellipse(0,4,14,5,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#222';ctx.fillRect(-8,-4,7,22);ctx.fillRect(1,-4,7,22);
  ctx.fillStyle=col;ctx.fillRect(-11,-30,22,28);
  ctx.fillStyle='#f0c9a0';ctx.beginPath();ctx.arc(0,-40,8,0,Math.PI*2);ctx.fill();
  ctx.restore();
}

function drawScene(){
  drawDiamond();
  // pitcher on the mound (delivery lean grows with pitch progress)
  const pp=pitchProg();
  person(MOUND[0],MOUND[1]-8,'#d8dde6',0,(phase==='combo'||phase==='run')?-0.25+pp*0.4:0);
  // catcher behind the plate
  person(CATCH[0],CATCH[1],'#3b6b9b',0,0);
  // runner from third
  const runGlow=(phase==='combo'&&clock>=arriveT1-effW1&&!decided)?1:0;
  person(runX,runY,'#c0343a',runGlow,(phase==='run')?0.5:0);
  // batter squares to bunt during beat2 window / at contact
  const batGlow=(phase==='run'&&(clock-breakClock)>=fireIdeal-effFw&&!decided)?1:0;
  const squaring=(phase==='run')||(phase==='result'&&result==='score');
  drawBatter(squaring,batGlow);
  // ball
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(ballX,ballY,7,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='#d33';ctx.lineWidth=1;ctx.beginPath();ctx.arc(ballX-2,ballY,5,-0.7,0.7);ctx.stroke();
}

function drawBatter(squaring,glow){
  const bx=486,by=452;
  ctx.save();ctx.translate(bx,by);
  if(glow>0){ctx.strokeStyle='rgba(90,255,160,'+glow+')';ctx.lineWidth=4;ctx.beginPath();ctx.arc(-4,-18,26,0,Math.PI*2);ctx.stroke();}
  ctx.fillStyle='rgba(0,0,0,.25)';ctx.beginPath();ctx.ellipse(0,6,15,5,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#222';ctx.fillRect(-9,-4,7,22);ctx.fillRect(2,-4,7,22);
  ctx.fillStyle='#2f6fd0';ctx.fillRect(-12,-30,24,28);
  ctx.fillStyle='#f0c9a0';ctx.beginPath();ctx.arc(-2,-40,8,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#20130a';ctx.beginPath();ctx.arc(-2,-42,9,Math.PI,0);ctx.fill();
  // bat: shouldered when not squaring, held level (bunt) when squaring
  ctx.strokeStyle='#c98b3a';ctx.lineWidth=6;ctx.lineCap='round';
  if(squaring){ ctx.beginPath();ctx.moveTo(-14,-24);ctx.lineTo(-34,-22);ctx.stroke(); }
  else { ctx.beginPath();ctx.moveTo(4,-26);ctx.lineTo(24,-58);ctx.stroke(); }
  ctx.restore();
}

function drawBar(){
  if(state!=='play'||phase==='wind'||phase==='result')return;
  const mx=180,mw=540,my=558,mh=18;
  let end, gC, gH, marker, label, col;
  if(phase==='combo'){ end=arriveT1+effW1+200; gC=arriveT1; gH=effW1; marker=clock; label='① 走者スタート（投球に合わせて三塁走者を走らせる）'; col='#ffe08a'; }
  else { end=fireIdeal+effFw+200; gC=fireIdeal; gH=effFw; marker=clock-breakClock; label='② バント（投球が来た“今”で確実に転がす）'; col='#9fd7ff'; }
  roundRect(mx,my,mw,mh,9);ctx.fillStyle='rgba(0,0,0,.45)';ctx.fill();
  const gx0=mx+mw*clamp((gC-gH)/end,0,1), gx1=mx+mw*clamp((gC+gH)/end,0,1);
  const gg=ctx.createLinearGradient(gx0,0,gx1,0);gg.addColorStop(0,'rgba(90,220,150,.4)');gg.addColorStop(0.5,'rgba(60,255,150,.9)');gg.addColorStop(1,'rgba(90,220,150,.4)');
  ctx.fillStyle=gg;ctx.fillRect(gx0,my,gx1-gx0,mh);
  ctx.fillStyle='rgba(210,70,70,.26)';ctx.fillRect(mx,my,gx0-mx,mh);
  roundRect(mx,my,mw,mh,9);ctx.strokeStyle='rgba(255,255,255,.4)';ctx.lineWidth=1.5;ctx.stroke();
  const px=mx+mw*clamp(marker/end,0,1);
  ctx.fillStyle='#fff';ctx.fillRect(px-2,my-4,4,mh+8);
  ctx.textAlign='center';ctx.font='bold 14px sans-serif';ctx.fillStyle=col;ctx.fillText(label,450,my-8);
}

function drawHUD(){
  ctx.textAlign='left';ctx.textBaseline='alphabetic';
  ctx.font='bold 20px sans-serif';ctx.fillStyle='#fff';
  ctx.fillText('スクイズ '+outs+' / '+TARGET,20,32);
  ctx.font='14px sans-serif';ctx.fillStyle='#ffb14a';ctx.fillText('失敗 '+fails+' / 3',20,54);
  ctx.textAlign='right';
  ctx.font='bold 20px sans-serif';ctx.fillStyle='#ffe08a';ctx.fillText('SCORE '+score,W-20,32);
  ctx.font='13px sans-serif';ctx.fillStyle='#bfe';ctx.fillText('BEST '+Math.max(best,score)+'   Lv.'+lvl,W-20,52);
  if(combo>1){ctx.textAlign='center';ctx.font='bold 20px sans-serif';ctx.fillStyle='#5affa0';ctx.fillText(combo+' 連続スクイズ!',450,92);}
  if(phase==='combo'&&!decided){ctx.textAlign='center';ctx.font='bold 15px sans-serif';ctx.fillStyle='#ffe08a';ctx.fillText('サインは出た！ 投球に合わせて三塁走者にスタートを切らせろ',450,120);}
}

function drawMsg(){
  if(msgT<=0)return;
  ctx.save();ctx.globalAlpha=clamp(msgT*1.4,0,1);
  ctx.textAlign='center';ctx.font='bold 24px sans-serif';
  ctx.fillStyle='rgba(0,0,0,.55)';roundRect(450-290,150,580,44,10);ctx.fill();
  ctx.fillStyle=msgCol;ctx.fillText(msg,450,180);
  ctx.restore();
}

function drawTitle(){
  drawDiamond();
  person(MOUND[0],MOUND[1]-8,'#d8dde6',0,0);person(TB[0],TB[1],'#c0343a',0,0);person(CATCH[0],CATCH[1],'#3b6b9b',0,0);drawBatter(false,0);
  ctx.save();ctx.textAlign='center';
  ctx.fillStyle='rgba(0,0,0,.64)';roundRect(96,100,708,400,16);ctx.fill();
  ctx.fillStyle='#fff';ctx.font='bold 36px sans-serif';ctx.fillText('スクイズを決めろ',450,160);
  ctx.font='18px sans-serif';ctx.fillStyle='#9fe0bf';ctx.fillText('Suicide Squeeze',450,190);
  ctx.font='16px sans-serif';ctx.fillStyle='#e6fcef';
  const lines=[
    '一打サヨナラ、三塁に走者。サインはスクイズ——',
    '①投球に合わせる“今”タップ＝三塁走者にスタートを切らせる。',
    '　早いと見破られてピッチアウト、遅いと機を逃す。',
    '②投球がプレートに来る“今”タップ＝確実にバントで転がす。',
    '　早いと打ち上げて小フライ、遅いと空振りで走者が本塁憤死。',
    '2つの「緑」でタイミングを合わせて一点をもぎ取れ。3失敗で終了。',
    'タップ / クリック / SPACE で操作。',
  ];
  for(let i=0;i<lines.length;i++)ctx.fillText(lines[i],450,232+i*29);
  ctx.fillStyle='#ffe08a';ctx.font='bold 22px sans-serif';
  ctx.fillText('タップ / SPACE でスタート',450,478);
  ctx.restore();
}

function drawOver(){
  drawDiamond();
  ctx.save();ctx.textAlign='center';
  ctx.fillStyle='rgba(0,0,0,.64)';roundRect(190,150,520,300,16);ctx.fill();
  const w2=outs>=TARGET;
  ctx.fillStyle=w2?'#5affa0':'#ff8a5a';ctx.font='bold 34px sans-serif';
  ctx.fillText(w2?'スモールボールの達人！':'スクイズ失敗続き…',450,222);
  ctx.fillStyle='#fff';ctx.font='20px sans-serif';
  ctx.fillText('スクイズ '+outs+' / '+TARGET,450,270);
  ctx.fillText('スコア '+score,450,304);
  ctx.fillStyle='#ffe08a';ctx.fillText('ベスト '+Math.max(best,score),450,336);
  ctx.fillStyle='#9fe0bf';ctx.font='bold 20px sans-serif';
  ctx.fillText('タップ / SPACE でもう一度',450,404);
  ctx.restore();
}

function render(){
  ctx.save();
  if(shakeT>0){const s=shakeT*7;ctx.translate(rnd(-s,s),rnd(-s,s));}
  if(state==='title'){drawTitle();}
  else if(state==='over'){drawOver();}
  else{
    drawScene();
    drawBar();
    drawHUD();
    drawMsg();
  }
  for(const p of parts){ctx.globalAlpha=clamp(p.life,0,1);ctx.fillStyle=p.col;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();}
  ctx.globalAlpha=1;
  ctx.restore();
  if(flash>0){ctx.fillStyle='rgba(255,255,255,'+(flash*0.5)+')';ctx.fillRect(0,0,W,H);}
}

function frame(ts){let dt=ts-last;last=ts;if(dt>60)dt=60;if(dt<0)dt=0;update(dt);render();requestAnimationFrame(frame);}
requestAnimationFrame(frame);

// ---------- test hook ----------
window.__sq={
  start:startGame,
  act:act,
  get state(){return state;},
  get outs(){return outs;},
  get fails(){return fails;},
  get score(){return score;},
  get info(){return {state:state,phase:phase,clock:clock,arriveT1:arriveT1,effW1:effW1,fireIdeal:fireIdeal,effFw:effFw,breakClock:breakClock,tough:tough,decided:decided,result:result,beat1done:beat1done,outs:outs,fails:fails,lvl:lvl,collectClock:(clock-breakClock),canAct:(state==='play'&&(phase==='combo'||phase==='run')&&!decided)};}
};
})();
</script>
