<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>リカバリーラン (Track Back)</title>
<style>
  html,body{margin:0;height:100%;background:#06110a;overflow:hidden;
    font-family:-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  #stage{position:relative;width:100vw;height:100vh;max-width:calc(100vh*1.5);max-height:calc(100vw/1.5);aspect-ratio:900/600;}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;border-radius:6px;}
</style>
</head>
<body>
<div id="wrap"><div id="stage"><canvas id="cv"></canvas></div></div>
<script>
(function(){
const W=900,H=600,cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let DPR=1;
function fit(){DPR=Math.min(2,window.devicePixelRatio||1);cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
fit();addEventListener('resize',fit);

// ---------- audio ----------
let AC=null;function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function tone(f,d,type,v,sweep){const a=ac();if(!a)return;const t=a.currentTime,o=a.createOscillator(),g=a.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(sweep)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+sweep),t+d);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v||0.2,t+0.008);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+0.02);}
function noise(d,v,hp){const a=ac();if(!a)return;const t=a.currentTime,n=Math.floor(a.sampleRate*d),buf=a.createBuffer(1,n,a.sampleRate),ch=buf.getChannelData(0);
  for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource();s.buffer=buf;
  const f=a.createBiquadFilter();f.type='highpass';f.frequency.value=hp||600;const g=a.createGain();g.gain.value=v||0.2;
  s.connect(f);f.connect(g);g.connect(a.destination);s.start(t);s.stop(t+d+0.02);}
const S={
  step:()=>{tone(180+Math.random()*40,0.03,'square',0.03);},
  caught:()=>{tone(560,0.06,'triangle',0.12);tone(760,0.07,'triangle',0.09);},
  tackle:()=>{noise(0.08,0.2,500);[640,900,1180].forEach((f,i)=>setTimeout(()=>tone(f,0.1,'triangle',0.16),i*55));},
  bad:()=>{noise(0.18,0.22,300);tone(160,0.24,'sawtooth',0.13,-50);},
  streak:()=>{[700,930,1170,1400].forEach((f,i)=>setTimeout(()=>tone(f,0.1,'triangle',0.16),i*60));},
  over:()=>{[440,330,247,175].forEach((f,i)=>setTimeout(()=>tone(f,0.3,'triangle',0.2),i*160));}
};

// ---------- geometry ----------
const GOALX=90, SHOTX=250;      // attacker shoots when it reaches SHOTX (near goal at left)
const STARTAX=640;              // attacker start x

// ---------- state ----------
let state='title', phase='chase', plays=0;
let score=0, combo=0, best=+(localStorage.getItem('trackback_best')||0);
let outs=0, fails=0, lvl=1;   // outs = stops
let clock=0, chaseT=2400, Nneed=10, C=0, A=0;
let tackleClock=0, tackleIdeal=260, twin=190, grace=140;
let result=null, resultT=0, msg='', anim=0, clean=false, lastStep=0;
let shake=0, flash=0, flashCol='#fff', last=performance.now();
let parts=[], pops=[];

function rnd(a,b){return a+Math.random()*(b-a);}
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function lerp(a,b,u){return a+(b-a)*u;}
function easeOut(u){return 1-Math.pow(1-u,2);}

function reset(){state='title';score=0;combo=0;outs=0;fails=0;lvl=1;plays=0;result=null;parts=[];pops=[];}
function newPlay(){
  plays++; lvl=Math.min(7,1+Math.floor(outs/4));
  chaseT=clamp(2500-lvl*130,1600,2500);
  Nneed=11;                            // taps to catch up (fast enough for ~10/s, too many for ~4/s)
  tackleIdeal=260; twin=clamp(215-lvl*9,150,215);
  phase='chase'; clock=0; C=0; A=0; tackleClock=0; result=null; resultT=0; msg=''; anim=0; clean=false;
}
function start(){ if(!ac())ac(); if(AC&&AC.state==='suspended')AC.resume(); reset(); state='play'; newPlay(); }

function tap(){
  if(state==='title'){start();return;}
  if(state==='over'){ if(resultT>0.4){reset();start();} return; }
  if(state!=='play') return;
  if(phase==='chase'){
    C=Math.min(1,C+1/Nneed); S.step();
    if(C>=1){ phase='tackle'; tackleClock=0; S.caught(); }
    return;
  }
  if(phase==='tackle'){
    const d=tackleClock-tackleIdeal;
    if(d < -twin){ resolve('early'); }
    else if(d > twin){ resolve('late'); }
    else { clean=Math.abs(d)<=twin*0.4; resolve('stop'); }
    return;
  }
}

function resolve(k){
  phase='result'; result=k; resultT=0; anim=0;
  if(k==='stop'){
    outs++; combo++;
    let add=Math.round((clean?240:150)*(1+Math.min(9,combo-1)*0.14)); score+=add;
    S.tackle(); flash=1;flashCol='#8affa0';shake=clean?9:6; burst(SHOTX+70,360,'#8affa0',22,clean?10:7);
    pop(SHOTX+70,320,clean?'完璧なスライディング！ 完全に止めた！ +'+add:'追いついてボール奪取！ +'+add,'#d6ffe0');
    if(combo>=2&&!clean)pop(W/2,150,'コンボ x'+combo,'#ffd24d');
    if(combo>0&&combo%5===0)S.streak();
    msg=clean?'猛然と戻って一気に追いつき、ジャストのタックルでクリーンに奪取！':'全力の戻りで追いつき、スライディングでボールを掻き出した！';
  } else {
    fails++; combo=0; flash=1;flashCol='#ff5b5b';shake=9; S.bad();
    if(k==='goal') msg='戻りが遅い…追いつけずシュートを打たれて失点';
    else if(k==='early') msg='仕掛けが早い…足だけ出してかわされ、置き去りに';
    else msg='仕掛けが遅い…先にシュートを打たれて失点';
    pop(SHOTX+40,320,k==='goal'?'独走を許した…':'かわされた…','#ffb0b0');
  }
  if(fails>=3){ state='over'; resultT=0; S.over(); if(score>best){best=score;localStorage.setItem('trackback_best',best);} }
}

// ---------- input ----------
cv.addEventListener('pointerdown',e=>{e.preventDefault();tap();});
addEventListener('keydown',e=>{ if(e.code==='Space'||e.code==='Enter'||e.code==='ArrowRight'||e.code==='KeyF'||e.code==='KeyJ'){e.preventDefault(); if(e.repeat)return; tap();} });

// ---------- particles ----------
function burst(x,y,c,n,sp){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=rnd(sp*0.3,sp);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:1,c});}}
function pop(x,y,txt,c){pops.push({x,y,txt,c,life:1});}

// ---------- update ----------
function update(dt){
  shake*=Math.pow(0.86,dt/16.7); if(shake<0.3)shake=0;
  flash*=Math.pow(0.9,dt/16.7);
  for(const p of parts){p.vx*=0.96;p.vy=p.vy*0.96+0.28;p.x+=p.vx*dt/16.7;p.y+=p.vy*dt/16.7;p.life-=dt/16.7*0.026;}
  parts=parts.filter(p=>p.life>0);
  for(const p of pops){p.y-=dt/16.7*0.5;p.life-=dt/16.7*0.02;}
  pops=pops.filter(p=>p.life>0);

  if(state!=='play'){ if(state==='over')resultT+=dt/1000; return; }
  if(phase==='chase'){
    clock+=dt; A=Math.min(1,A+dt/chaseT);
    if(A>=1){ resolve('goal'); }
    return;
  }
  if(phase==='tackle'){
    tackleClock+=dt;
    if(tackleClock>tackleIdeal+twin+grace){ resolve('late'); }
    return;
  }
  if(phase==='result'){ resultT+=dt/1000; anim=Math.min(1,anim+dt/560); if(resultT>1.25) newPlay(); return; }
}

// ---------- render ----------
function runner(x,y,col,run){
  ctx.fillStyle='rgba(0,0,0,0.24)';ctx.beginPath();ctx.ellipse(x,y+14,13,4,0,0,6.28);ctx.fill();
  ctx.save();ctx.translate(x,y);ctx.rotate(run?0.18:0.08);
  ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(-7,-22);ctx.lineTo(7,-22);ctx.lineTo(6,12);ctx.lineTo(-6,12);ctx.closePath();ctx.fill();
  ctx.fillStyle='#f2c9a0';ctx.beginPath();ctx.arc(0,-28,6,0,6.28);ctx.fill();
  ctx.restore();
}
function drawScene(){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#0f3d24');g.addColorStop(0.6,'#12653a');g.addColorStop(1,'#0c4d2c');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  for(let i=0;i<9;i++){ ctx.fillStyle=i%2?'rgba(255,255,255,0.03)':'rgba(0,0,0,0.03)'; ctx.fillRect(i*100,0,100,H); }
  // goal at left
  ctx.strokeStyle='#eef3f0';ctx.lineWidth=5;ctx.strokeRect(GOALX-8,300-70,12,140);
  ctx.fillStyle='rgba(255,255,255,0.05)';ctx.fillRect(GOALX-8,300-70,12,140);
  // shot line
  ctx.strokeStyle='rgba(255,120,120,0.4)';ctx.lineWidth=2;ctx.setLineDash([7,7]);ctx.beginPath();ctx.moveTo(SHOTX,60);ctx.lineTo(SHOTX,H-40);ctx.stroke();ctx.setLineDash([]);
  ctx.fillStyle='rgba(255,150,150,0.6)';ctx.font='12px sans-serif';ctx.textAlign='center';ctx.fillText('シュートライン',SHOTX,72);
}

function render(){
  ctx.save();
  if(shake>0)ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
  drawScene();

  if(state==='play'||state==='over'){
    const cy=360;
    // attacker advances left toward goal as A grows
    const ax=lerp(STARTAX, SHOTX, A);
    // defender closes from behind (right) as C grows; when caught, alongside/ slightly behind
    let dxpos=lerp(ax+150, ax+8, C);
    let tackling = phase==='result'&&result==='stop';
    let miss = phase==='result'&&(result==='early'||result==='late'||result==='goal');
    if(phase==='tackle'){ dxpos=ax+8; }
    if(tackling){ dxpos=lerp(ax+8, ax-14, easeOut(anim)); }

    // ball at attacker's feet
    const bx=ax-14, by=cy+14;
    // draw defender then attacker
    runner(dxpos, cy, '#3aa0ff', phase==='chase');
    if(phase==='tackle'||tackling){ // slide leg toward ball
      ctx.strokeStyle='#3aa0ff';ctx.lineWidth=7;ctx.lineCap='round';
      const lx=lerp(dxpos-6, bx, tackling?easeOut(anim):(clamp(tackleClock/tackleIdeal,0,1)));
      ctx.beginPath();ctx.moveTo(dxpos-6,cy+12);ctx.lineTo(lx,cy+16);ctx.stroke();ctx.lineCap='butt';
    }
    runner(ax, cy, '#d24b4b', phase==='chase');
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(tackling?lerp(bx,SHOTX-40,easeOut(anim)):bx, by, 7,0,6.28);ctx.fill();

    // HUD gauges
    if(state==='play'&&(phase==='chase'||phase==='tackle')){
      // catch-up gauge
      const gw=300,gx=W/2-gw/2,gy=120;
      ctx.fillStyle='rgba(255,255,255,0.16)';ctx.fillRect(gx,gy,gw,14);
      ctx.fillStyle=C>=1?'#8affa0':'#ffd24d';ctx.fillRect(gx,gy,gw*C,14);
      ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.strokeRect(gx,gy,gw,14);
      ctx.fillStyle='rgba(255,255,255,0.85)';ctx.font='12px sans-serif';ctx.textAlign='center';ctx.fillText('追いつきゲージ（連打！）',W/2,gy-6);
      // attacker-to-goal danger
      ctx.fillStyle='rgba(255,255,255,0.6)';ctx.font='12px sans-serif';ctx.fillText('相手のゴールまで',W/2,gy+40);
      ctx.fillStyle='rgba(255,255,255,0.16)';ctx.fillRect(gx,gy+48,gw,8);
      ctx.fillStyle='#ff7b6b';ctx.fillRect(gx,gy+48,gw*A,8);

      ctx.textAlign='center';
      if(phase==='chase'){ ctx.fillStyle='rgba(255,220,90,0.98)';ctx.font='bold 20px sans-serif';ctx.fillText('連打で全力の戻り！ 追いつけ！',W/2,52); }
      else { const inWin=Math.abs(tackleClock-tackleIdeal)<=twin;
        ctx.fillStyle=inWin?'rgba(140,255,160,0.98)':'rgba(255,255,255,0.9)';ctx.font='bold 20px sans-serif';
        ctx.fillText(inWin?'今だ！ タックル！':'追いついた！ タイミングを合わせて…',W/2,52);
        // tackle timing ring
        const inw=Math.abs(tackleClock-tackleIdeal)<=twin;
        ctx.strokeStyle=inw?'rgba(140,255,160,0.95)':'rgba(255,220,90,0.7)';ctx.lineWidth=4;
        const rem=clamp(1-tackleClock/tackleIdeal,0,1);
        ctx.beginPath();ctx.arc(ax,cy-2,16+rem*40,0,6.28);ctx.stroke();
      }
    }
  }

  for(const p of parts){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,3.2,0,6.28);ctx.fill();}
  ctx.globalAlpha=1;
  for(const p of pops){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.font='bold 20px sans-serif';ctx.textAlign='center';ctx.fillText(p.txt,p.x,p.y);}
  ctx.globalAlpha=1;

  // HUD
  ctx.textAlign='left';ctx.fillStyle='#fff';ctx.font='bold 26px sans-serif';ctx.fillText('SCORE '+score,20,36);
  ctx.textAlign='right';ctx.fillStyle='rgba(255,255,255,0.9)';ctx.font='14px sans-serif';ctx.fillText('阻止 '+outs+'  Lv'+lvl,W-20,24);
  ctx.fillText('失点',W-92,46);
  for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(W-60+i*20,41,7,0,6.28);ctx.fillStyle=i<fails?'#ff5b5b':'rgba(255,255,255,0.25)';ctx.fill();}
  if(combo>=2){ctx.textAlign='center';ctx.fillStyle='#ffd24d';ctx.font='bold 18px sans-serif';ctx.fillText('コンボ x'+combo,W/2,200);}

  if(state==='play'&&phase==='result'&&msg){ctx.textAlign='center';ctx.fillStyle=result==='stop'?'#9ff0b8':'#ff9a9a';ctx.font='bold 19px sans-serif';ctx.fillText(msg,W/2,52);}

  if(state==='title'){
    ctx.fillStyle='rgba(4,10,7,0.80)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='bold 42px sans-serif';ctx.fillText('リカバリーラン',W/2,102);
    ctx.fillStyle='#ffd23e';ctx.font='bold 22px sans-serif';ctx.fillText('Track Back',W/2,138);
    ctx.fillStyle='rgba(255,255,255,0.92)';ctx.font='16px sans-serif';
    ctx.fillText('抜け出した相手を全力の戻りで追いかけ、追いついてシュート前に止めろ',W/2,190);
    ctx.fillStyle='rgba(255,255,255,0.66)';ctx.font='14px sans-serif';
    ctx.fillText('① 連打（クリック/タップ/SPACE）で追いつきゲージを満タンに——相手がシュートラインに着く前に追いつく',W/2,228);
    ctx.fillText('② 追いついたら“今だ！”の緑リングでタックル（同ボタン）＝ボールを掻き出して阻止',W/2,252);
    ctx.fillText('連打が遅く追いつけない＝独走を許して失点／タックルが早い＝かわされる／遅い＝先に打たれる',W/2,276);
    ctx.fillText('ジャストのスライディングは大量加点。上級ほど相手が速く猶予が短い。3失点で交代',W/2,300);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で開始',W/2,366);
    ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='14px sans-serif';ctx.fillText('BEST '+best,W/2,398);
  }
  if(state==='over'){
    ctx.fillStyle='rgba(4,10,7,0.84)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#ff6b6b';ctx.font='bold 46px sans-serif';ctx.fillText('3失点…交代',W/2,222);
    ctx.fillStyle='#fff';ctx.font='bold 40px sans-serif';ctx.fillText('SCORE '+score,W/2,290);
    ctx.fillStyle='rgba(255,255,255,0.85)';ctx.font='19px sans-serif';ctx.fillText('阻止 '+outs+'   BEST '+best,W/2,330);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で もう一度',W/2,402);
  }

  if(flash>0.02){ctx.globalAlpha=flash*0.5;ctx.fillStyle=flashCol;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}
  ctx.restore();

  ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,0.4)';ctx.font='12px sans-serif';
  ctx.fillText('リカバリーラン：連打で全力の戻り→追いついたら緑リングのタイミングでタックル。追いつけず/早い/遅いは失点。3失点で交代',W/2,H-8);
}

function frame(ts){let dt=ts-last;last=ts;if(dt>60)dt=60;if(dt<0)dt=0;update(dt);render();requestAnimationFrame(frame);}
requestAnimationFrame(frame);

// ---------- test hook ----------
window.__tb={
  start, tap:()=>tap(),
  get state(){return state;},
  get score(){return score;},
  get outs(){return outs;},
  get fails(){return fails;},
  get info(){return {state,phase,clock,chaseT,Nneed,C,A,tackleClock,tackleIdeal,twin,result,outs,fails,lvl,
    canAct:(state==='play'&&(phase==='chase'||phase==='tackle'))};}
};
})();
</script>
</body>
</html>
