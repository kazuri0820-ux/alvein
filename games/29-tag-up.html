<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>タッチアップ — Tag Up & Score</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{width:100%;height:100%;background:#08131f;overflow:hidden;
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,system-ui,sans-serif;
    touch-action:none;user-select:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  #stage{position:relative;aspect-ratio:900/600;max-width:100%;max-height:100%;
    width:auto;height:auto;box-shadow:0 0 60px rgba(0,0,0,.6);}
  canvas{display:block;width:100%;height:100%;border-radius:6px;}
</style>
</head>
<body>
<div id="wrap"><div id="stage"><canvas id="c" width="900" height="600"></canvas></div></div>
<script>
(function(){
"use strict";
const TEST=location.hash.indexOf('test')>=0;
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
const W=900,H=600;
let dpr=Math.max(1,Math.min(2,window.devicePixelRatio||1));
function fit(){ dpr=Math.max(1,Math.min(2,window.devicePixelRatio||1)); cv.width=W*dpr; cv.height=H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0); }
fit(); window.addEventListener('resize',fit);

// ---- audio ----
let AC=null;
function ac(){ if(!AC){ try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){AC=null;} } return AC; }
function tone(f,d,type,g,f2){ const a=ac(); if(!a)return; const o=a.createOscillator(),gg=a.createGain();
  o.type=type||'sine'; o.frequency.setValueAtTime(f,a.currentTime); if(f2)o.frequency.exponentialRampToValueAtTime(f2,a.currentTime+d);
  gg.gain.setValueAtTime(0.0001,a.currentTime); gg.gain.exponentialRampToValueAtTime(g||0.2,a.currentTime+0.01);
  gg.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+d); o.connect(gg); gg.connect(a.destination); o.start(); o.stop(a.currentTime+d+0.02); }
function noise(d,g,cut){ const a=ac(); if(!a)return; const n=Math.floor(a.sampleRate*d),buf=a.createBuffer(1,n,a.sampleRate),ch=buf.getChannelData(0);
  for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(1-i/n); const src=a.createBufferSource(); src.buffer=buf;
  const f=a.createBiquadFilter(); f.type='lowpass'; f.frequency.value=cut||1200; const gg=a.createGain(); gg.gain.value=g||0.2;
  src.connect(f); f.connect(gg); gg.connect(a.destination); src.start(); }
const S={
  catch(){ noise(0.09,0.32,1400); tone(240,0.09,'triangle',0.2,150); },
  go(){ tone(660,0.08,'square',0.16,900); },
  slide(){ noise(0.3,0.28,1100); },
  safe(){ tone(500,0.14,'sine',0.2,760); setTimeout(()=>tone(760,0.2,'sine',0.18),110); },
  cheer(){ const a=ac(); if(!a)return; noise(0.8,0.26,1900); for(let i=0;i<6;i++)setTimeout(()=>tone(480+Math.random()*320,0.34,'sine',0.05),i*44); },
  out(){ tone(300,0.28,'sawtooth',0.16,90); },
  foul(){ tone(200,0.35,'square',0.16,120); noise(0.15,0.2,600); },
  tick(){ tone(680,0.035,'square',0.07); },
  whistle(){ tone(2100,0.13,'square',0.1); setTimeout(()=>tone(2400,0.15,'square',0.1),85); }
};

// ---- diamond geometry (top-down) ----
const HOME={x:450,y:486}, B1={x:628,y:360}, B2={x:450,y:236}, B3={x:272,y:360};
const CF={x:450,y:150};       // center fielder (catch point)
const CATCHER={x:450,y:452};

// ---- state ----
let state='ready';   // ready, descend, race, result, over
let runs=0,outs=0,streak=0,best=0,level=0,playN=0;
let clock=0, catchT=1.5, caught=false;
let tagT=-1, lateness=0, margin=0, slideBonus=null, slid=false, slideT=-1;
let runnerP=0;       // 0 at 3rd -> 1 at home
let throwP=0;        // 0 at CF -> 1 at home
let runT=1.75, throwDur=2.1, gap=0.4;
let result=null;     // 'safe'|'out'|'foul'|'hold'
let ballAlt=1;       // fly ball altitude 1->0
let msg='',msgT=0;
let shakeT=0,shakeM=0,flash=0,flashCol='#fff';
let parts=[]; let crowd=[]; let t=0;
let raceStart=0;

try{ best=parseInt(localStorage.getItem('tu_best')||'0',10)||0; }catch(e){}
for(let i=0;i<70;i++) crowd.push({x:Math.random()*W,y:6+Math.random()*40,c:['#e8544e','#f0c14b','#4a90d9','#fff','#5cc98a','#c98af0'][i%6],b:Math.random()*6.28});

function reset(){ runs=0;outs=0;streak=0;level=0;playN=0; parts=[]; nextPlay(); }
function levelUp(){ level=Math.min(9,Math.floor(runs/3)); }

function nextPlay(){
  levelUp(); playN++;
  clock=0; caught=false; tagT=-1; lateness=0; margin=0; slideBonus=null; slid=false; slideT=-1;
  runnerP=0; throwP=0; ballAlt=1; result=null; raceStart=0;
  catchT=1.15+Math.random()*0.85;             // fly hang time
  runT=Math.max(1.25,1.8-level*0.055);
  gap=Math.max(0.16,0.42-level*0.028);         // safe cushion for a perfect tag
  throwDur=runT+gap;
  state='descend';
  if(playN<=2){ msg='捕球の瞬間にタップでスタート！ 早すぎるとアウト'; msgT=110; }
  else { msg=''; msgT=0; }
  S.whistle();
}

function doTag(){
  tagT=clock;
  if(tagT < catchT-0.06){ // left too early
    result='foul'; onResult(); return;
  }
  lateness=Math.max(0,tagT-catchT);
  margin = gap - lateness;
  raceStart=clock;
  state='race';
  S.go();
}

function doSlide(){
  if(slid) return;
  slid=true; slideT=runnerP;
  S.slide();
  // best slide when runner is right at the plate (runnerP ~ 0.9)
  const d=Math.abs(runnerP-0.9);
  if(runnerP<0.6){ slideBonus=-0.08; }       // way too early
  else if(d<0.06) slideBonus=0.18;
  else if(d<0.14) slideBonus=0.09;
  else slideBonus=0.0;
  burst(lerp(B3.x,HOME.x,runnerP),lerp(B3.y,HOME.y,runnerP),'#e8d9b0',10);
}

function resolveRace(){
  const sb = slideBonus==null? -0.05 : slideBonus;   // no slide = small penalty
  const eff = margin + sb;
  result = eff>0? 'safe':'out';
  onResult();
}

function onResult(){
  state='result'; msgT=130;
  if(result==='safe'){
    runs++; streak++; if(streak>best){best=streak; save();}
    msg = streak>=3? `生還！ ${streak}人連続ホームイン！`:'セーフ！ ホームイン！';
    S.safe(); setTimeout(S.cheer,90); flash=0.45; flashCol='#eafff0'; shakeT=14; shakeM=5;
    burst(HOME.x,HOME.y,'#ffe14d',24); burst(HOME.x,HOME.y,'#5cc98a',16);
  } else if(result==='out'){
    outs++; streak=0; msg='タッチアウト！ 際どい…';
    S.out(); flash=0.28; flashCol='#ffb090'; shakeT=12; shakeM=5;
    burst(HOME.x,HOME.y,'#ff9060',14);
  } else if(result==='foul'){
    outs++; streak=0; msg='離塁が早い！ アウト';
    S.foul(); flash=0.3; flashCol='#ff8080'; shakeT=12; shakeM=5;
  } else {
    outs++; streak=0; msg='スタート遅れ… 本塁憤死';
    S.out();
  }
  if(outs>=3){ setTimeout(()=>{ state='over'; msg='スリーアウト・チェンジ'; msgT=99999; }, 950); }
  else setTimeout(()=>{ if(state==='result') nextPlay(); }, 1100);
}
function save(){ try{localStorage.setItem('tu_best',''+best);}catch(e){} }
function lerp(a,b,p){ return a+(b-a)*p; }
function burst(x,y,col,n){ for(let i=0;i<n;i++){ const a=Math.random()*6.28,sp=1+Math.random()*5;
  parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-2,life:1,col,r:2+Math.random()*3}); } }

// ---- input ----
function press(){
  const a=ac(); if(a&&a.state==='suspended')a.resume();
  if(state==='ready'||state==='over'){ reset(); return; }
  if(state==='descend'){ doTag(); return; }
  if(state==='race'){ doSlide(); return; }
}
cv.addEventListener('pointerdown',e=>{ e.preventDefault(); press(); });
window.addEventListener('keydown',e=>{ if(e.code==='Space'||e.code==='Enter'){ e.preventDefault(); press(); } });

// ---- update ----
let last=0;
function update(dt){
  t+=dt; if(msgT>0)msgT--; if(flash>0)flash=Math.max(0,flash-dt*2); if(shakeT>0)shakeT--;
  if(state==='descend'){
    clock+=dt;
    ballAlt=Math.max(0,1-clock/catchT);
    if(!caught && clock>=catchT){ caught=true; S.catch(); burst(CF.x,CF.y,'#fff',10); }
    if(clock>=catchT+1.25 && tagT<0){ // never tagged -> runner holds, out
      result='hold'; onResult();
    }
  }
  else if(state==='race'){
    clock+=dt;
    const rt=(clock-raceStart);
    runnerP=Math.min(1, rt/runT);
    throwP=Math.min(1, (clock-catchT)/throwDur);
    if(runnerP>=1 || throwP>=1.02){
      resolveRace();
    }
  }
  for(let i=parts.length-1;i>=0;i--){ const q=parts[i]; q.x+=q.vx;q.y+=q.vy;q.vy+=0.16;q.life-=dt*1.1; if(q.life<=0)parts.splice(i,1); }
  // audio ticks near catch
  if(state==='descend' && !caught){ const rem=catchT-clock; if(rem<0.5 && ((clock*12|0)!==((clock-dt)*12|0))) S.tick(); }
}

// ---- draw ----
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

function drawField(){
  ctx.fillStyle='#0c1c28'; ctx.fillRect(0,0,W,52);
  for(const c of crowd){ const yy=c.y+Math.sin(t*3+c.b)*1.2; ctx.fillStyle=c.c; ctx.globalAlpha=.8; ctx.fillRect(c.x,yy,5,5); }
  ctx.globalAlpha=1;
  // grass
  const g=ctx.createLinearGradient(0,52,0,H); g.addColorStop(0,'#1f7a3f'); g.addColorStop(1,'#175f33');
  ctx.fillStyle=g; ctx.fillRect(0,52,W,H-52);
  // outfield arc
  ctx.fillStyle='#1c6f39'; ctx.beginPath(); ctx.moveTo(0,52); ctx.lineTo(W,52); ctx.lineTo(W,150); ctx.quadraticCurveTo(450,60,0,150); ctx.closePath(); ctx.fill();
  // infield dirt diamond
  ctx.fillStyle='#b5763e';
  ctx.beginPath(); ctx.moveTo(HOME.x,HOME.y+16); ctx.lineTo(B1.x+18,B1.y); ctx.lineTo(B2.x,B2.y-18); ctx.lineTo(B3.x-18,B3.y); ctx.closePath(); ctx.fill();
  // grass infield inset
  ctx.fillStyle='#1f7a3f';
  ctx.beginPath(); ctx.moveTo(HOME.x,HOME.y-30); ctx.lineTo(B1.x-30,B1.y); ctx.lineTo(B2.x,B2.y+30); ctx.lineTo(B3.x+30,B3.y); ctx.closePath(); ctx.fill();
  // baselines
  ctx.strokeStyle='rgba(255,255,255,.7)'; ctx.lineWidth=3;
  ctx.beginPath(); ctx.moveTo(HOME.x,HOME.y); ctx.lineTo(B1.x,B1.y); ctx.lineTo(B2.x,B2.y); ctx.lineTo(B3.x,B3.y); ctx.closePath(); ctx.stroke();
  // 3rd->home path highlight
  ctx.strokeStyle= state==='race'? 'rgba(255,220,80,.85)':'rgba(255,255,255,.25)'; ctx.lineWidth=4; ctx.setLineDash([8,8]);
  ctx.beginPath(); ctx.moveTo(B3.x,B3.y); ctx.lineTo(HOME.x,HOME.y); ctx.stroke(); ctx.setLineDash([]);
  // bases
  base(B1,'一塁'); base(B2,'二塁'); base(B3,'三塁');
  // home plate
  ctx.fillStyle='#fff'; ctx.beginPath();
  ctx.moveTo(HOME.x-11,HOME.y-6); ctx.lineTo(HOME.x+11,HOME.y-6); ctx.lineTo(HOME.x+11,HOME.y+4); ctx.lineTo(HOME.x,HOME.y+12); ctx.lineTo(HOME.x-11,HOME.y+4); ctx.closePath(); ctx.fill();
}
function base(b,label){ ctx.save(); ctx.translate(b.x,b.y); ctx.rotate(Math.PI/4);
  ctx.fillStyle='#f4f8ff'; ctx.fillRect(-9,-9,18,18); ctx.restore();
  ctx.fillStyle='rgba(255,255,255,.5)'; ctx.font='10px sans-serif'; ctx.textAlign='center'; ctx.fillText(label,b.x,b.y+24); }

function drawFielder(){
  // center fielder
  const f=CF;
  ctx.fillStyle='rgba(0,0,0,.2)'; ctx.beginPath(); ctx.ellipse(f.x,f.y+16,16,5,0,0,6.28); ctx.fill();
  ctx.fillStyle='#e8544e'; rr(f.x-11,f.y-24,22,30,6); ctx.fill();
  ctx.fillStyle='#f0c39a'; ctx.beginPath(); ctx.arc(f.x,f.y-32,8,0,6.28); ctx.fill();
  // glove up if about to catch
  ctx.fillStyle='#7a4a24'; ctx.beginPath(); ctx.arc(f.x+ (caught?0:0), f.y-40- (ballAlt>0?0:0),8,0,6.28); ctx.fill();
  // catcher at home
  const c=CATCHER;
  ctx.fillStyle='rgba(0,0,0,.2)'; ctx.beginPath(); ctx.ellipse(c.x,c.y+14,15,5,0,0,6.28); ctx.fill();
  ctx.fillStyle='#4a90d9'; rr(c.x-11,c.y-22,22,28,6); ctx.fill();
  ctx.fillStyle='#f0c39a'; ctx.beginPath(); ctx.arc(c.x,c.y-30,8,0,6.28); ctx.fill();
}

function drawFly(){
  if(state!=='descend' && !(state==='race')) return;
  if(ballAlt<=0 && state!=='descend') return;
  if(state==='descend'){
    // shadow at fielder
    const sh=1-ballAlt;
    ctx.fillStyle='rgba(0,0,0,'+(0.1+sh*0.22)+')'; ctx.beginPath(); ctx.ellipse(CF.x,CF.y,6+sh*8,3+sh*4,0,0,6.28); ctx.fill();
    // ball descending from top
    const by=40+(CF.y-46-40)*(1-ballAlt);
    const r=9+ballAlt*5;
    ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(CF.x,by,r,0,6.28); ctx.fill();
    ctx.strokeStyle='#d33'; ctx.lineWidth=1.5; ctx.beginPath(); ctx.arc(CF.x-2,by-2,r,0.4,1.8); ctx.stroke();
    // catch ring
    const rr2=14+ballAlt*54;
    ctx.strokeStyle= ballAlt<0.12?'rgba(92,201,138,.95)':'rgba(255,255,255,.5)'; ctx.lineWidth=3;
    ctx.beginPath(); ctx.arc(CF.x,CF.y-40,rr2,0,6.28); ctx.stroke();
  }
}

function drawRunner(){
  let x,y,lean=0;
  if(state==='descend'){
    // leading off 3rd, ready
    x=B3.x+10; y=B3.y+6;
    lean=Math.sin(t*5)*0.05;
  } else if(state==='race'||state==='result'){
    x=lerp(B3.x,HOME.x,runnerP); y=lerp(B3.y,HOME.y,runnerP);
    lean=0.4;
  } else return;
  const sliding = slid && runnerP>0.6;
  ctx.save(); ctx.translate(x,y);
  ctx.fillStyle='rgba(0,0,0,.22)'; ctx.beginPath(); ctx.ellipse(0,14,14,5,0,0,6.28); ctx.fill();
  if(sliding){ ctx.rotate(0.9); }
  else ctx.rotate(lean);
  // legs (running)
  ctx.strokeStyle='#20304a'; ctx.lineWidth=6; ctx.lineCap='round';
  const sw=Math.sin(t*22)* (state==='race'?8:0);
  ctx.beginPath(); ctx.moveTo(-2,-16); ctx.lineTo(-6+sw,6); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(2,-16); ctx.lineTo(6-sw,6); ctx.stroke();
  ctx.fillStyle='#f5d23e'; rr(-10,-34,20,22,6); ctx.fill();
  ctx.fillStyle='#f0c39a'; ctx.beginPath(); ctx.arc(0,-40,7,0,6.28); ctx.fill();
  ctx.restore();
}

function drawThrow(){
  if(state!=='race'&&state!=='result') return;
  if(throwP<=0||throwP>=1) return;
  const x=lerp(CF.x,CATCHER.x,throwP), y=lerp(CF.y-40,CATCHER.y-8,throwP);
  ctx.strokeStyle='rgba(255,255,255,.3)'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(CF.x,CF.y-40); ctx.lineTo(x,y); ctx.stroke();
  ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(x,y,6,0,6.28); ctx.fill();
  ctx.strokeStyle='#d33'; ctx.lineWidth=1; ctx.beginPath(); ctx.arc(x-1,y-1,6,0.4,1.9); ctx.stroke();
}

function drawPrompt(){
  if(state==='descend'){
    ctx.textAlign='center';
    const rem=catchT-clock;
    ctx.fillStyle= rem<0.4?'#5cc98a':'rgba(255,255,255,.9)'; ctx.font='bold 20px sans-serif';
    ctx.fillText(rem>0? 'タイミングを計れ…':'今だ！ タップ！', HOME.x, 300);
  } else if(state==='race' && !slid){
    ctx.textAlign='center'; ctx.fillStyle= runnerP>0.78?'#5cc98a':'rgba(255,255,255,.8)'; ctx.font='bold 20px sans-serif';
    ctx.fillText(runnerP>0.6?'スライディング！ タップ！':'本塁へ猛ダッシュ！', HOME.x-140, 300);
  }
}

function drawHUD(){
  ctx.textAlign='left'; hud(14,12,'得点 RUNS',runs,'#ffe14d');
  ctx.textAlign='center'; hudC(W/2,12,'連続 STREAK',streak,'#7fd0ff');
  ctx.textAlign='right'; hudR(W-14,12,'アウト OUT',outs+' /3','#ff7d6b');
  ctx.fillStyle='rgba(255,255,255,.5)'; ctx.font='12px sans-serif'; ctx.textAlign='center';
  ctx.fillText('自己ベスト連続 '+best, W/2, 78);
}
function hud(x,y,l,v,c){ ctx.fillStyle='rgba(6,18,28,.72)'; rr(x,y,104,50,9); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.6)'; ctx.font='11px sans-serif'; ctx.textAlign='left'; ctx.fillText(l,x+10,y+17);
  ctx.fillStyle=c; ctx.font='bold 22px sans-serif'; ctx.fillText(v,x+10,y+42); }
function hudC(x,y,l,v,c){ const w=104; ctx.fillStyle='rgba(6,18,28,.72)'; rr(x-w/2,y,w,50,9); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.6)'; ctx.font='11px sans-serif'; ctx.textAlign='center'; ctx.fillText(l,x,y+17);
  ctx.fillStyle=c; ctx.font='bold 22px sans-serif'; ctx.fillText(v,x,y+42); }
function hudR(x,y,l,v,c){ const w=104; ctx.fillStyle='rgba(6,18,28,.72)'; rr(x-w,y,w,50,9); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.6)'; ctx.font='11px sans-serif'; ctx.textAlign='right'; ctx.fillText(l,x-10,y+17);
  ctx.fillStyle=c; ctx.font='bold 22px sans-serif'; ctx.fillText(v,x-10,y+42); }

function drawMsg(){ if(msgT>0&&msg){ const my=560; ctx.textAlign='center'; ctx.font='bold 21px sans-serif';
  const tw=ctx.measureText(msg).width; ctx.fillStyle='rgba(4,10,18,.6)'; rr(W/2-tw/2-14,my-25,tw+28,34,10); ctx.fill();
  ctx.fillStyle='#fff'; ctx.fillText(msg,W/2,my); } }

function drawOverlay(){
  ctx.fillStyle='rgba(4,10,18,.75)'; ctx.fillRect(0,0,W,H); ctx.textAlign='center';
  ctx.fillStyle='rgba(255,255,255,.55)'; ctx.font='14px sans-serif'; ctx.fillText('BASEBALL · BASERUNNING',W/2,138);
  ctx.fillStyle='#fff'; ctx.font='bold 56px sans-serif'; ctx.fillText('タッチアップ',W/2,198);
  ctx.fillStyle='#ffe14d'; ctx.font='bold 24px sans-serif'; ctx.fillText('Tag Up & Score',W/2,234);
  ctx.fillStyle='rgba(255,255,255,.82)'; ctx.font='16px sans-serif';
  const lines=['三塁走者を犠牲フライで還す！','外野手の【捕球の瞬間】ぴったりにタップして離塁。','早すぎると離塁アウト、遅いと本塁で憤死。','走者が本塁に近づいたら、もう一度タップで','スライディング！ 送球より先にホームイン。3アウトで交代。'];
  lines.forEach((l,i)=>ctx.fillText(l,W/2,276+i*26));
  const bw=220,bh=54,bx=(W-bw)/2,by=452; ctx.fillStyle='#e8544e'; rr(bx,by,bw,bh,12); ctx.fill();
  ctx.fillStyle='#fff'; ctx.font='bold 24px sans-serif'; ctx.fillText('プレイボール',W/2,by+35);
  ctx.fillStyle='rgba(255,255,255,.5)'; ctx.font='13px sans-serif'; ctx.fillText('タップ / Space',W/2,by+bh+22);
}
function drawOver(){
  ctx.fillStyle='rgba(4,10,18,.8)'; ctx.fillRect(0,0,W,H); ctx.textAlign='center';
  ctx.fillStyle='#fff'; ctx.font='bold 44px sans-serif'; ctx.fillText('スリーアウト・チェンジ',W/2,222);
  ctx.fillStyle='#ffe14d'; ctx.font='bold 28px sans-serif'; ctx.fillText('生還 '+runs+' 点',W/2,276);
  ctx.fillStyle='#5cc98a'; ctx.font='20px sans-serif'; ctx.fillText('自己ベスト連続 '+best,W/2,312);
  const bw=220,bh=54,bx=(W-bw)/2,by=360; ctx.fillStyle='#e8544e'; rr(bx,by,bw,bh,12); ctx.fill();
  ctx.fillStyle='#fff'; ctx.font='bold 24px sans-serif'; ctx.fillText('もう一度',W/2,by+35);
  ctx.fillStyle='rgba(255,255,255,.5)'; ctx.font='13px sans-serif'; ctx.fillText('タップ / Space',W/2,by+bh+22);
}

function render(){
  ctx.save(); if(shakeT>0){ const s=shakeM*(shakeT/14); ctx.translate((Math.random()*2-1)*s,(Math.random()*2-1)*s); }
  drawField(); drawFielder(); drawThrow(); drawFly(); drawRunner();
  for(const q of parts){ ctx.globalAlpha=Math.max(0,q.life); ctx.fillStyle=q.col; ctx.beginPath(); ctx.arc(q.x,q.y,q.r,0,6.28); ctx.fill(); }
  ctx.globalAlpha=1;
  drawPrompt(); drawHUD(); drawMsg();
  ctx.restore();
  if(flash>0){ ctx.fillStyle=flashCol; ctx.globalAlpha=flash; ctx.fillRect(0,0,W,H); ctx.globalAlpha=1; }
  if(state==='ready') drawOverlay();
  if(state==='over') drawOver();
}
function loop(ts){ if(!last)last=ts; let dt=(ts-last)/1000; last=ts; if(dt>0.05)dt=0.05; update(dt); render(); requestAnimationFrame(loop); }
requestAnimationFrame(loop);

if(TEST){
  window.__tu={
    get state(){return state;},
    get clock(){return clock;},
    get catchT(){return catchT;},
    get runnerP(){return runnerP;},
    get tagged(){return tagT>=0;},
    get slid(){return slid;},
    get result(){return result;},
    get margin(){return margin;},
    get count(){return {runs,outs,streak,level};},
    tap(){ press(); }
  };
}
})();
</script>
