<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ティップセーブ (Tip It Over)</title>
<style>
  html,body{margin:0;height:100%;background:#06120a;overflow:hidden;
    font-family:-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  #stage{position:relative;width:100vw;height:100vh;max-width:calc(100vh*1.5);max-height:calc(100vw/1.5);aspect-ratio:900/600;}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;border-radius:6px;}
</style>
</head>
<body>
<div id="wrap"><div id="stage"><canvas id="cv"></canvas></div></div>
<script>
(function(){
const W=900,H=600,cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let DPR=1;
function fit(){DPR=Math.min(2,window.devicePixelRatio||1);cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
fit();addEventListener('resize',fit);

// ---------- audio ----------
let AC=null;function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function tone(f,d,type,v,sweep){const a=ac();if(!a)return;const t=a.currentTime,o=a.createOscillator(),g=a.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(sweep)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+sweep),t+d);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v||0.2,t+0.008);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+0.02);}
function noise(d,v,hp){const a=ac();if(!a)return;const t=a.currentTime,n=Math.floor(a.sampleRate*d),buf=a.createBuffer(1,n,a.sampleRate),ch=buf.getChannelData(0);
  for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource();s.buffer=buf;
  const f=a.createBiquadFilter();f.type='highpass';f.frequency.value=hp||600;const g=a.createGain();g.gain.value=v||0.2;
  s.connect(f);f.connect(g);g.connect(a.destination);s.start(t);s.stop(t+d+0.02);}
const S={
  strike:()=>{noise(0.05,0.16,500);tone(230,0.06,'square',0.09,-70);},
  tip:()=>{noise(0.06,0.14,1400);tone(760,0.06,'square',0.06,-120);},
  save:()=>{[680,940,1220].forEach((f,i)=>setTimeout(()=>tone(f,0.1,'triangle',0.16),i*55));},
  worldclass:()=>{[600,820,1080,1360,1650].forEach((f,i)=>setTimeout(()=>tone(f,0.12,'triangle',0.18),i*75));},
  net:()=>{noise(0.12,0.14,300);tone(120,0.2,'sawtooth',0.12,-40);},
  streak:()=>{[700,930,1170,1400].forEach((f,i)=>setTimeout(()=>tone(f,0.1,'triangle',0.16),i*60));},
  over:()=>{[440,330,247,175].forEach((f,i)=>setTimeout(()=>tone(f,0.3,'triangle',0.2),i*160));}
};

// ---------- geometry ----------
const BARY=132, GHW=250, GCX=450, GL=GCX-GHW, GR=GCX+GHW, GBOT=372; // goal mouth
const SHOT={x:450,y:548};
const KY=352;              // keeper stance foot line

// ---------- state ----------
let state='title', phase='shot', plays=0;
let score=0, combo=0, best=+(localStorage.getItem('tip_best')||0);
let outs=0, fails=0, lvl=1;       // outs = saves
let t=0, tipT=600, w=440, tough=false, targetX=560, targetY=150, dipLate=0;
let decided=false, result=null, resultT=0, msg='', msgOk=false, tipAt=0;
let leap=0, leapV=0, jumped=false, ballOver=0;
let shake=0, flash=0, flashCol='#fff', last=performance.now();
let parts=[], pops=[];

function rnd(a,b){return a+Math.random()*(b-a);}
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function lerp(a,b,u){return a+(b-a)*u;}
function easeOut(u){return 1-Math.pow(1-u,2);}

function reset(){state='title';score=0;combo=0;outs=0;fails=0;lvl=1;plays=0;result=null;parts=[];pops=[];}

function newPlay(){
  plays++; lvl=Math.min(7,1+Math.floor(outs/4));
  tipT=clamp(640-lvl*28,440,640);
  w=clamp(470-lvl*24,300,470);
  tough=Math.random()<clamp(0.18+lvl*0.05,0.18,0.5);
  const side=(Math.random()<0.5?-1:1);
  targetX=GCX+side*rnd(120,GHW-40);
  targetY=BARY+rnd(6,26);            // just under the bar
  dipLate=rnd(-14,20);               // late dip/rise -> watch the ball
  phase='shot'; t=0; decided=false; result=null; resultT=0; msg=''; msgOk=false; tipAt=0;
  leap=0; leapV=0; jumped=false; ballOver=0;
  S.strike();
}
function start(){ if(!ac())ac(); if(AC&&AC.state==='suspended')AC.resume(); reset(); state='play'; newPlay(); }

function act(){
  if(state==='title'){start();return;}
  if(state==='over'){ if(resultT>0.4){reset();start();} return; }
  if(state!=='play'||phase!=='shot'||decided) return;
  jumped=true; leapV=-7.6;            // spring up
  if(t<tipT){ decided=true; tipAt=t; resolve('early'); return; }
  if(t<=tipT+w){ decided=true; tipAt=t; resolve('save'); return; }
  decided=true; tipAt=t; resolve('late');
}

function resolve(k){
  phase='result'; result=k; resultT=0;
  if(k==='save'){
    outs++; combo++;
    const fingertip=(tipAt>=tipT+w*0.5);
    let base=tough?250:150; if(fingertip)base+=90;
    let add=Math.round(base*(1+Math.min(9,combo-1)*0.14)); score+=add;
    S.tip(); setTimeout(S.save,70); if(fingertip||tough)setTimeout(S.worldclass,150);
    msgOk=true; flash=1;flashCol='#8affa0';shake=6; burst(targetX,targetY,'#8affa0',18,8);
    ballOver=1;
    pop(GCX,110,(fingertip?'ワールドクラス！ 指先で弾いた +':'ビッグセーブ！ +')+add,'#d6ffe0');
    if(combo>=2)pop(GCX,180,'コンボ x'+combo,'#ffd24d');
    if(combo>0&&combo%5===0)S.streak();
    msg=fingertip?'指一本！ 枠を捉えた強烈な一撃をバーの上へ弾き出した':'伸び上がってバーの上へ——決定的なシュートをセーブ！';
  } else {
    fails++; combo=0; msgOk=false; flash=1;flashCol='#ff5b5b';shake=9; setTimeout(S.net,120);
    if(k==='early') msg='跳ぶのが早い…手が落ちた所を頭上に越えてゴール';
    else msg='跳ぶのが遅い…枠を捉えた一撃が先にネットへ突き刺さった';
    pop(targetX,targetY,'ゴール…','#ffb0b0');
  }
  if(fails>=3){ state='over'; resultT=0; setTimeout(S.over,200); if(score>best){best=score;localStorage.setItem('tip_best',best);} }
}

// ---------- input ----------
cv.addEventListener('pointerdown',e=>{e.preventDefault();act();});
addEventListener('keydown',e=>{ if(e.repeat)return;
  if(e.code==='Space'||e.code==='Enter'||e.code==='ArrowUp'||e.code==='KeyF'){e.preventDefault();act();} });

// ---------- particles ----------
function burst(x,y,c,n,sp){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=rnd(sp*0.3,sp);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:1,c});}}
function pop(x,y,txt,c){pops.push({x,y,txt,c,life:1});}

// ---------- update ----------
function update(dt){
  shake*=Math.pow(0.86,dt/16.7); if(shake<0.3)shake=0;
  flash*=Math.pow(0.9,dt/16.7);
  for(const p of parts){p.vx*=0.96;p.vy=p.vy*0.96+0.28;p.x+=p.vx*dt/16.7;p.y+=p.vy*dt/16.7;p.life-=dt/16.7*0.026;}
  parts=parts.filter(p=>p.life>0);
  for(const p of pops){p.y-=dt/16.7*0.5;p.life-=dt/16.7*0.02;}
  pops=pops.filter(p=>p.life>0);

  // keeper leap physics
  if(jumped){ leap+=leapV*dt/16.7; leapV+=0.42*dt/16.7; if(leap>0){leap=0;leapV=0;jumped=false;} }

  if(state!=='play'){ if(state==='over')resultT+=dt/1000; return; }
  if(phase==='shot'){ t+=dt;
    if(!decided && t>tipT+w){ decided=true; tipAt=t; resolve('late'); }
    return; }
  if(phase==='result'){ resultT+=dt/1000;
    if(result==='save') ballOver=Math.min(2,ballOver+dt/220);
    if(resultT>1.5) newPlay(); return; }
}

// ---------- render ----------
function drawScene(){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#0d5330');g.addColorStop(0.5,'#12703f');g.addColorStop(1,'#0b4c2b');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  // net
  ctx.fillStyle='rgba(255,255,255,0.06)';ctx.fillRect(GL,BARY,GR-GL,GBOT-BARY);
  ctx.strokeStyle='rgba(255,255,255,0.14)';ctx.lineWidth=1;
  for(let x=GL;x<=GR;x+=16){ctx.beginPath();ctx.moveTo(x,BARY);ctx.lineTo(x,GBOT);ctx.stroke();}
  for(let y=BARY;y<=GBOT;y+=15){ctx.beginPath();ctx.moveTo(GL,y);ctx.lineTo(GR,y);ctx.stroke();}
  // posts + bar
  ctx.strokeStyle='#f2f2f2';ctx.lineWidth=8;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(GL,GBOT);ctx.lineTo(GL,BARY);ctx.lineTo(GR,BARY);ctx.lineTo(GR,GBOT);ctx.stroke();ctx.lineCap='butt';
}
function keeper(handUp){
  const cx=GCX, base=KY, jy=leap; // leap is negative when up
  const lean=clamp((targetX-GCX)/GHW,-1,1)*14;
  // body
  ctx.fillStyle='#23c36a';ctx.beginPath();ctx.ellipse(cx+lean*0.4,base-30+jy,15,30,0,0,6.28);ctx.fill();
  ctx.fillStyle='#f0c9a0';ctx.beginPath();ctx.arc(cx+lean*0.6,base-64+jy,11,0,6.28);ctx.fill();
  // arms up (reach for the bar)
  ctx.strokeStyle='#23c36a';ctx.lineWidth=9;ctx.lineCap='round';
  const reach=handUp? -46 : -30;
  const hx=cx+lean, hy=base-52+jy+reach;
  ctx.beginPath();ctx.moveTo(cx-8,base-46+jy);ctx.lineTo(hx-14,hy);ctx.moveTo(cx+8,base-46+jy);ctx.lineTo(hx+14,hy);ctx.stroke();
  // gloves
  ctx.fillStyle='#ffe14d';ctx.beginPath();ctx.arc(hx-14,hy,7,0,6.28);ctx.fill();ctx.beginPath();ctx.arc(hx+14,hy,7,0,6.28);ctx.fill();
  ctx.lineCap='butt';
  return {hx,hy};
}

function render(){
  ctx.save();
  if(shake>0)ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
  drawScene();

  if(state==='play'||state==='over'){
    // shooter
    ctx.fillStyle='#d0403a';ctx.beginPath();ctx.ellipse(SHOT.x,SHOT.y-8,12,20,0,0,6.28);ctx.fill();
    ctx.fillStyle='#f0c9a0';ctx.beginPath();ctx.arc(SHOT.x,SHOT.y-32,9,0,6.28);ctx.fill();

    // keeper
    const handUp=jumped||(phase==='shot'&&t>=tipT)||(phase==='result'&&result==='save');
    const gl=keeper(handUp);

    // ball
    let bx,by;
    if(phase==='shot'){ const u=clamp(t/(tipT+w*0.55),0,1); bx=lerp(SHOT.x,targetX,easeOut(u)); by=lerp(SHOT.y-20,targetY+dipLate*Math.min(1,u*1.2),easeOut(u)); }
    else if(result==='save'){ // deflected up over the bar
      const u=easeOut(Math.min(1,ballOver)); bx=lerp(targetX,targetX+(targetX-GCX)*0.2,u); by=lerp(targetY,BARY-70,u); }
    else { // goal: ball into the net
      const u=easeOut(clamp(resultT/0.4,0,1)); bx=targetX; by=lerp(targetY,targetY+80,u); }
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(bx,by,8.5,0,6.28);ctx.fill();
    ctx.strokeStyle='#c33';ctx.lineWidth=1.2;ctx.beginPath();ctx.arc(bx-2,by-2,5,0.6,2.6);ctx.stroke();
    if(phase==='shot'){ctx.strokeStyle='rgba(255,255,255,0.35)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(bx,by+4);ctx.lineTo(lerp(SHOT.x,bx,0.4),lerp(SHOT.y,by,0.4)+4);ctx.stroke();}

    // reach window ring near the bar
    if(phase==='shot'&&t>=tipT&&t<=tipT+w){ ctx.strokeStyle='rgba(140,255,160,0.9)';ctx.lineWidth=3;ctx.beginPath();ctx.arc(targetX,targetY,18,0,6.28);ctx.stroke(); }

    // cue + timer
    ctx.textAlign='center';
    if(state==='play'&&phase==='shot'){
      if(t<tipT){ ctx.fillStyle='rgba(255,220,90,0.95)';ctx.font='bold 21px sans-serif';ctx.fillText('枠を捉えた強烈なシュート！ 伸び上がって弾き出せ',W/2,GBOT+40); }
      else { ctx.fillStyle='rgba(150,255,170,0.98)';ctx.font='bold 23px sans-serif';ctx.fillText('今だ！ ティップ！',W/2,GBOT+40);
        const p=clamp((t-tipT)/w,0,1),bw=250,x=W/2-bw/2,y=GBOT+52;
        ctx.fillStyle='rgba(255,255,255,0.18)';ctx.fillRect(x,y,bw,7);ctx.fillStyle=p<0.5?'#8affa0':(p<1?'#ffd24d':'#ff5b5b');ctx.fillRect(x,y,bw*p,7); }
    }
    if(state==='play'){ ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='13px sans-serif';ctx.textAlign='center';
      ctx.fillText('タップ / SPACE / ↑：伸び上がってバーの上へ弾く（早すぎ／遅すぎは失点）',W/2,H-28); }
  }

  for(const p of parts){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,3.2,0,6.28);ctx.fill();}
  ctx.globalAlpha=1;
  for(const p of pops){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.font='bold 21px sans-serif';ctx.textAlign='center';ctx.fillText(p.txt,p.x,p.y);}
  ctx.globalAlpha=1;

  // HUD
  ctx.textAlign='left';ctx.fillStyle='#fff';ctx.font='bold 26px sans-serif';ctx.fillText('SCORE '+score,20,36);
  ctx.textAlign='right';ctx.fillStyle='rgba(255,255,255,0.9)';ctx.font='14px sans-serif';ctx.fillText('セーブ '+outs+'  Lv'+lvl,W-20,24);
  ctx.fillText('失',W-92,46);
  for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(W-60+i*20,41,7,0,6.28);ctx.fillStyle=i<fails?'#ff5b5b':'rgba(255,255,255,0.25)';ctx.fill();}
  if(combo>=2){ctx.textAlign='center';ctx.fillStyle='#ffd24d';ctx.font='bold 18px sans-serif';ctx.fillText('コンボ x'+combo,W/2,60);}

  if(state==='play'&&phase==='result'&&msg){ctx.textAlign='center';ctx.fillStyle=msgOk?'#9ff0b8':'#ff9a9a';ctx.font='bold 16px sans-serif';ctx.fillText(msg,W/2,GBOT+70);}

  if(state==='title'){
    ctx.fillStyle='rgba(4,10,7,0.82)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='bold 42px sans-serif';ctx.fillText('ティップセーブ',W/2,96);
    ctx.fillStyle='#ffd23e';ctx.font='bold 22px sans-serif';ctx.fillText('Tip It Over',W/2,132);
    ctx.fillStyle='rgba(255,255,255,0.92)';ctx.font='16px sans-serif';
    ctx.fillText('枠の上ギリギリを狙った強烈なシュートを、伸び上がって指先でバーの上へ弾き出すGKの美技',W/2,186);
    ctx.fillStyle='rgba(255,255,255,0.66)';ctx.font='14px sans-serif';
    ctx.fillText('ボールがバー下の“届く高さ（緑リング）”に来た瞬間にタップ／SPACE／↑で伸び上がって弾く',W/2,224);
    ctx.fillText('跳ぶのが早いと手が落ちて頭上を越され、遅いと先にネットへ——どちらも失点',W/2,248);
    ctx.fillText('ギリギリを指先で弾く“ワールドクラス”は大量加点。弾道は毎回わずかに変化＝球をよく見ろ',W/2,272);
    ctx.fillText('上級ほどシュートが速く窓も短い。3失点で交代',W/2,296);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で開始',W/2,362);
    ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='14px sans-serif';ctx.fillText('BEST '+best,W/2,394);
  }
  if(state==='over'){
    ctx.fillStyle='rgba(4,10,7,0.84)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#ff6b6b';ctx.font='bold 46px sans-serif';ctx.fillText('3失点…交代',W/2,224);
    ctx.fillStyle='#fff';ctx.font='bold 40px sans-serif';ctx.fillText('SCORE '+score,W/2,292);
    ctx.fillStyle='rgba(255,255,255,0.85)';ctx.font='19px sans-serif';ctx.fillText('セーブ '+outs+'   BEST '+best,W/2,332);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で もう一度',W/2,404);
  }

  if(flash>0.02){ctx.globalAlpha=flash*0.5;ctx.fillStyle=flashCol;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}
  ctx.restore();

  ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,0.4)';ctx.font='12px sans-serif';
  ctx.fillText('ティップセーブ：枠上を狙う強烈な一撃を、届く高さの一瞬で伸び上がってバー上へ弾く＝セーブ。早跳び/遅れは失点、3つで交代',W/2,H-8);
}

function frame(ts){let dt=ts-last;last=ts;if(dt>60)dt=60;if(dt<0)dt=0;update(dt);render();requestAnimationFrame(frame);}
requestAnimationFrame(frame);

// ---------- test hook ----------
window.__ts={
  start, act:()=>act(),
  get state(){return state;},
  get score(){return score;},
  get outs(){return outs;},
  get fails(){return fails;},
  get info(){return {state,phase,t,tipT,w,tough,decided,result,outs,fails,lvl,
    pre:(t<tipT),tipWin:(phase==='shot'&&t>=tipT&&t<=tipT+w),canAct:(phase==='shot'&&!decided)};}
};
})();
</script>
</body>
</html>
