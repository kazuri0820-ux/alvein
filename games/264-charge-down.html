<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>チャージダウン (Charge Down)</title>
<style>
  html,body{margin:0;height:100%;background:#06110a;overflow:hidden;
    font-family:-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  #stage{position:relative;width:100vw;height:100vh;max-width:calc(100vh*1.5);max-height:calc(100vw/1.5);aspect-ratio:900/600;}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;border-radius:6px;}
</style>
</head>
<body>
<div id="wrap"><div id="stage"><canvas id="cv"></canvas></div></div>
<script>
(function(){
const W=900,H=600,cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let DPR=1;
function fit(){DPR=Math.min(2,window.devicePixelRatio||1);cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
fit();addEventListener('resize',fit);

// ---------- audio ----------
let AC=null;function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function tone(f,d,type,v,sweep){const a=ac();if(!a)return;const t=a.currentTime,o=a.createOscillator(),g=a.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(sweep)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+sweep),t+d);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v||0.2,t+0.008);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+0.02);}
function noise(d,v,hp){const a=ac();if(!a)return;const t=a.currentTime,n=Math.floor(a.sampleRate*d),buf=a.createBuffer(1,n,a.sampleRate),ch=buf.getChannelData(0);
  for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource();s.buffer=buf;
  const f=a.createBiquadFilter();f.type='highpass';f.frequency.value=hp||600;const g=a.createGain();g.gain.value=v||0.2;
  s.connect(f);f.connect(g);g.connect(a.destination);s.start(t);s.stop(t+d+0.02);}
const S={
  block:()=>{noise(0.1,0.24,350);tone(260,0.1,'square',0.12,80);},
  great:()=>{noise(0.07,0.18,500);[520,780,1040,1320].forEach((f,i)=>setTimeout(()=>tone(f,0.12,'triangle',0.18),i*52));},
  hold:()=>{tone(520,0.08,'sine',0.09);tone(660,0.08,'sine',0.06);},
  bad:()=>{noise(0.18,0.22,300);tone(160,0.2,'sawtooth',0.12,-50);},
  streak:()=>{[700,930,1170,1400].forEach((f,i)=>setTimeout(()=>tone(f,0.1,'triangle',0.16),i*60));},
  over:()=>{[440,330,247,175].forEach((f,i)=>setTimeout(()=>tone(f,0.3,'triangle',0.2),i*160));}
};

// ---------- geometry ----------
const FOE={x:470,y:352}, YOU0={x:648,y:352}, GOALX=96;

// ---------- state ----------
let state='title', phase='live', t=0, plays=0;
let score=0, combo=0, best=+(localStorage.getItem('chargedown_best')||0);
let outs=0, fails=0, lvl=1;   // outs = charge-downs / good holds
let clock=0, cueT=600, reactWin=360, kind='kick';
let acted=false, result=null, resultT=0, msg='', reactMs=0, animU=0;
let shake=0, flash=0, flashCol='#fff', last=performance.now();
let parts=[], pops=[];

function rnd(a,b){return a+Math.random()*(b-a);}
function chance(p){return Math.random()<p;}
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function lerp(a,b,u){return a+(b-a)*u;}
function easeOut(u){return 1-Math.pow(1-u,2);}

function params(){ return {
  cueT:rnd(460,720)-lvl*8,
  win:Math.max(250,400-lvl*22)
};}

function reset(){state='title';score=0;combo=0;outs=0;fails=0;lvl=1;plays=0;result=null;parts=[];pops=[];}
function newPlay(){
  plays++; lvl=Math.min(7,1+Math.floor(outs/4));
  const p=params(); cueT=Math.max(320,p.cueT); reactWin=p.win;
  kind=chance(0.6)?'kick':'fake';
  phase='live'; clock=0; acted=false; result=null; resultT=0; msg=''; reactMs=0; animU=0;
}
function start(){ if(!ac())ac(); if(AC&&AC.state==='suspended')AC.resume(); reset(); state='play'; newPlay(); }

function press(){ // BLOCK / charge down
  if(state==='title'){start();return;}
  if(state==='over'){ if(resultT>0.4){reset();start();} return; }
  if(state!=='play'||phase!=='live'||acted) return;
  acted=true;
  if(clock<cueT){ resolve('early'); return; }        // committed during the wind-up -> baited
  if(kind==='fake'){ resolve('faked'); return; }      // bit the fake
  const err=clock-cueT;
  if(err>reactWin){ resolve('cleared'); return; }
  reactMs=err; resolve('block');
}

function resolve(k){
  phase='result'; result=k; resultT=0; animU=0;
  const good=(k==='block'||k==='held');
  if(good){
    outs++; combo++;
    let add;
    if(k==='block'){ const quick=reactMs<=reactWin*0.4;
      add=Math.round((quick?230:130)*(1+Math.min(9,combo-1)*0.14)); quick?S.great():S.block();
      flash=1;flashCol='#8affa0';shake=9; burst(FOE.x,FOE.y,'#8affa0',22,8); pop(FOE.x,FOE.y-46,quick?'ドンピシャ・チャージ！ +'+add:'チャージダウン成功！ +'+add,'#d6ffe0'); pop(W/2,150,'蹴り出しをブロックしてボール奪取！','#8affa0'); }
    else { add=Math.round(70*(1+Math.min(9,combo-1)*0.12)); S.hold();
      pop(FOE.x,FOE.y-46,'釣られず我慢 +'+add,'#bfe3ff'); }
    score+=add;
    if(combo>=2&&k!=='block')pop(W/2,150,'コンボ x'+combo,'#ffd24d');
    if(combo>0&&combo%5===0)S.streak();
    msg=k==='block'?'蹴った瞬間に体を投げ出してチャージダウン！':'蹴るふり（フェイント）に飛び込まず我慢——好判断';
  } else {
    fails++; combo=0; flash=1;flashCol='#ff5b5b';shake=8; S.bad();
    if(result==='faked') msg='蹴るふりに飛び込んだ…かわされて運ばれた';
    else if(result==='early') msg='早すぎ…振りかぶりに釣られて空を切った';
    else msg='遅い…蹴り出された後で間に合わず';
    pop(FOE.x,FOE.y-46,result==='cleared'?'蹴り出された！':'かわされた…','#ffb0b0');
  }
  if(fails>=3){ state='over'; resultT=0; S.over(); if(score>best){best=score;localStorage.setItem('chargedown_best',best);} }
}

// ---------- input ----------
cv.addEventListener('pointerdown',e=>{e.preventDefault();press();});
addEventListener('keydown',e=>{ if(e.repeat)return; if(e.code==='Space'||e.code==='Enter'||e.code==='ArrowUp'||e.code==='KeyZ'){e.preventDefault();press();} });

// ---------- particles ----------
function burst(x,y,c,n,sp){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=rnd(sp*0.3,sp);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:1,c});}}
function pop(x,y,txt,c){pops.push({x,y,txt,c,life:1});}

// ---------- update ----------
function update(dt){
  shake*=Math.pow(0.86,dt/16.7); if(shake<0.3)shake=0;
  flash*=Math.pow(0.9,dt/16.7);
  for(const p of parts){p.vx*=0.96;p.vy=p.vy*0.96+0.28;p.x+=p.vx*dt/16.7;p.y+=p.vy*dt/16.7;p.life-=dt/16.7*0.026;}
  parts=parts.filter(p=>p.life>0);
  for(const p of pops){p.y-=dt/16.7*0.5;p.life-=dt/16.7*0.02;}
  pops=pops.filter(p=>p.life>0);

  if(state!=='play'){ if(state==='over')resultT+=dt/1000; return; }
  t+=dt;
  if(phase==='live'){ clock+=dt; if(!acted && clock>cueT+reactWin){ resolve(kind==='kick'?'cleared':'held'); } return; }
  if(phase==='result'){ resultT+=dt/1000; animU=Math.min(1,animU+dt/620); if(resultT>1.25 && state==='play') newPlay(); return; }
}

// ---------- render ----------
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function figure(x,y,col,sc,lean){ sc=sc||1; lean=lean||0;
  ctx.fillStyle='rgba(0,0,0,0.22)';ctx.beginPath();ctx.ellipse(x,y+13*sc,12*sc,4*sc,0,0,6.28);ctx.fill();
  ctx.save();ctx.translate(x,y);ctx.rotate(lean);
  ctx.fillStyle=col;rr(-7*sc,-22*sc,14*sc,24*sc,6*sc);ctx.fill();
  ctx.fillStyle='#f2c9a0';ctx.beginPath();ctx.arc(0,-27*sc,6*sc,0,6.28);ctx.fill();
  ctx.restore();
}
function drawScene(){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#0f3d24');g.addColorStop(0.6,'#12653a');g.addColorStop(1,'#0c4d2c');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  for(let i=0;i<7;i++){ ctx.fillStyle=i%2?'rgba(255,255,255,0.03)':'rgba(0,0,0,0.03)'; ctx.fillRect(0,50+i*80,W,80); }
  // opponent's goal at the left (what you attack after winning it)
  ctx.strokeStyle='#eef3f0';ctx.lineWidth=5;ctx.strokeRect(GOALX-6,H/2-70,10,140);
  ctx.fillStyle='rgba(255,255,255,0.05)';ctx.fillRect(GOALX-6,H/2-70,10,140);
}

function render(){
  ctx.save();
  if(shake>0)ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
  drawScene();

  if(state==='play'){
    // wind-up leg angle: swings back then forward through cueT
    let swing=0;
    if(phase==='live'){ swing = clamp(clock/cueT,0,1); }
    else swing=1;
    // opponent
    const legBack = Math.sin(clamp(clock/cueT,0,1)*1.4);
    figure(FOE.x, FOE.y, '#d24b4b', 1.0);
    // kicking leg
    ctx.save();ctx.translate(FOE.x-6,FOE.y-2);
    let legAng;
    if(phase==='live'){ legAng = lerp(0.5, -0.9, clamp(clock/cueT,0,1)); }
    else if(kind==='kick'||result==='block'||result==='early'||result==='cleared'){ legAng=lerp(-0.9,-2.0,easeOut(animU)); }
    else { legAng=lerp(-0.9,0.6,easeOut(animU)); } // fake: pull back
    ctx.rotate(legAng);ctx.strokeStyle='#d24b4b';ctx.lineWidth=6;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(-30,4);ctx.stroke();ctx.restore();

    // ball
    let bx=FOE.x-24, by=FOE.y+10;
    if(phase==='live'){ if(clock>=cueT && kind==='kick'){ /* about to launch */ } }
    if(phase==='result'){
      if(result==='block'){ bx=lerp(FOE.x-24,YOU0.x-30,easeOut(animU)); by=FOE.y+6; } // deflects toward you
      else if(result==='cleared'||result==='early'){ bx=lerp(FOE.x-24,GOALX+80,easeOut(animU)); by=lerp(FOE.y+10,FOE.y-120,easeOut(animU)); } // cleared away
      else if(result==='faked'){ bx=lerp(FOE.x-24,FOE.x-90,easeOut(animU)); by=FOE.y+18; } // dribbled around
      else if(result==='held'){ bx=lerp(FOE.x-24,FOE.x-70,easeOut(animU)); by=FOE.y+16; }
    }
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(bx,by,7,0,6.28);ctx.fill();

    // you (charging down)
    let yx=YOU0.x, yy=YOU0.y, yl=0;
    if(phase==='live'){ yx=lerp(YOU0.x,FOE.x+34,clamp(clock/(cueT+reactWin),0,1)); }
    if(phase==='result'&&(result==='block')){ yx=FOE.x+20; yl=-0.5*easeOut(animU); }
    figure(yx,yy,'#3aa0ff',1.0,yl);

    // strike cue
    if(phase==='live'&&clock>=cueT){ ctx.textAlign='center';
      if(kind==='kick'){ ctx.fillStyle='rgba(140,255,160,0.95)';ctx.font='bold 20px sans-serif';ctx.fillText('蹴った！ ブロック！',FOE.x,FOE.y-56); }
      else { ctx.fillStyle='rgba(255,200,120,0.95)';ctx.font='bold 20px sans-serif';ctx.fillText('引いた…蹴るふり！',FOE.x,FOE.y-56); }
    }
  }

  for(const p of parts){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,3.2,0,6.28);ctx.fill();}
  ctx.globalAlpha=1;
  for(const p of pops){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.font='bold 21px sans-serif';ctx.textAlign='center';ctx.fillText(p.txt,p.x,p.y);}
  ctx.globalAlpha=1;

  // HUD
  ctx.textAlign='left';ctx.fillStyle='#fff';ctx.font='bold 26px sans-serif';ctx.fillText('SCORE '+score,20,36);
  ctx.textAlign='right';ctx.fillStyle='rgba(255,255,255,0.9)';ctx.font='14px sans-serif';ctx.fillText('阻止 '+outs+'  Lv'+lvl,W-20,24);
  ctx.fillText('失敗',W-92,46);
  for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(W-60+i*20,41,7,0,6.28);ctx.fillStyle=i<fails?'#ff5b5b':'rgba(255,255,255,0.25)';ctx.fill();}
  if(combo>=2){ctx.textAlign='center';ctx.fillStyle='#ffd24d';ctx.font='bold 18px sans-serif';ctx.fillText('コンボ x'+combo,W/2,110);}

  if(state==='play'&&phase==='live'){ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,0.92)';ctx.font='bold 15px sans-serif';
    ctx.fillText('相手のクリアを寄せて止めろ！ “蹴った瞬間”にブロック（タップ/クリック/SPACE）、蹴るふりには飛び込むな',W/2,44);}
  if(state==='play'&&phase==='result'&&msg){ctx.textAlign='center';ctx.fillStyle=(result==='block'||result==='held')?'#9ff0b8':'#ff9a9a';ctx.font='bold 19px sans-serif';ctx.fillText(msg,W/2,44);}

  if(state==='title'){
    ctx.fillStyle='rgba(4,10,7,0.78)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='bold 44px sans-serif';ctx.fillText('チャージダウン',W/2,102);
    ctx.fillStyle='#ffd23e';ctx.font='bold 22px sans-serif';ctx.fillText('Charge Down',W/2,138);
    ctx.fillStyle='rgba(255,255,255,0.92)';ctx.font='16px sans-serif';
    ctx.fillText('自陣でクリアしようとする相手に寄せ、蹴り出しをブロックしてボールを奪え',W/2,188);
    ctx.fillStyle='rgba(255,255,255,0.66)';ctx.font='14px sans-serif';
    ctx.fillText('相手が振りかぶってクリアを蹴る——“蹴った瞬間”にブロック（タップ/クリック/SPACE）＝チャージダウンで奪取',W/2,226);
    ctx.fillText('振りかぶりに釣られて早く飛び込むと空を切り、蹴り出された後では間に合わない',W/2,250);
    ctx.fillText('相手は“蹴るふり”をしてボールを引く（フェイント）——それに飛び込むとかわされる。我慢が正解',W/2,274);
    ctx.fillText('蹴った瞬間に素早くブロックするほど高得点。上級ほど速く反応の窓が短い。3失敗で交代',W/2,298);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で開始',W/2,372);
    ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='14px sans-serif';ctx.fillText('BEST '+best,W/2,404);
  }
  if(state==='over'){
    ctx.fillStyle='rgba(4,10,7,0.84)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#ff6b6b';ctx.font='bold 46px sans-serif';ctx.fillText('3失敗…交代',W/2,222);
    ctx.fillStyle='#fff';ctx.font='bold 40px sans-serif';ctx.fillText('SCORE '+score,W/2,290);
    ctx.fillStyle='rgba(255,255,255,0.85)';ctx.font='19px sans-serif';ctx.fillText('阻止 '+outs+'   BEST '+best,W/2,330);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で もう一度',W/2,402);
  }

  if(flash>0.02){ctx.globalAlpha=flash*0.5;ctx.fillStyle=flashCol;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}
  ctx.restore();

  ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,0.4)';ctx.font='12px sans-serif';
  ctx.fillText('チャージダウン：相手の蹴り出した瞬間にブロックして奪取。蹴るふり（フェイント）には飛び込むな。3失敗で交代',W/2,H-8);
}

function frame(ts){let dt=ts-last;last=ts;if(dt>60)dt=60;if(dt<0)dt=0;update(dt);render();requestAnimationFrame(frame);}
requestAnimationFrame(frame);

// ---------- test hook ----------
window.__cd={
  start, press:()=>press(),
  get state(){return state;},
  get score(){return score;},
  get outs(){return outs;},
  get fails(){return fails;},
  get info(){return {state,phase,clock,cueT,reactWin,kind,committed:(clock>=cueT),
    acted,result,outs,fails,lvl,canAct:(phase==='live'&&!acted)};}
};
})();
</script>
</body>
</html>
