<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>呼び込んで叩け (Let It Travel)</title>
<style>
  html,body{margin:0;padding:0;background:#08140d;overflow:hidden;font-family:'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif;-webkit-user-select:none;user-select:none;touch-action:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 26%,#1a3a4c,#050d10 72%);}
  #stage{position:relative;width:min(100vw,calc(100vh*1.5));aspect-ratio:900/600;max-width:900px;box-shadow:0 10px 60px rgba(0,0,0,.6);border-radius:8px;overflow:hidden;}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;}
</style>
</head>
<body>
<div id="wrap"><div id="stage"><canvas id="cv"></canvas></div></div>
<script>
(function(){
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const W=900,H=600;let DPR=Math.min(2,window.devicePixelRatio||1);
function fit(){const r=cv.getBoundingClientRect();DPR=Math.min(2,window.devicePixelRatio||1);cv.width=Math.round(r.width*DPR);cv.height=Math.round(r.height*DPR);ctx.setTransform(cv.width/W,0,0,cv.height/H,0,0);}
new ResizeObserver(fit).observe(cv);fit();

// ---------- audio ----------
let AC=null;function actx(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function tone(f,d,type,v,sweep){const a=actx();if(!a)return;const o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.value=f;if(sweep)o.frequency.linearRampToValueAtTime(sweep,a.currentTime+d);g.gain.value=0.0001;g.gain.exponentialRampToValueAtTime(v||0.2,a.currentTime+0.008);g.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+d);o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+d+0.02);}
function noise(d,v,hp){const a=actx();if(!a)return;const n=a.createBufferSource(),b=a.createBuffer(1,a.sampleRate*d,a.sampleRate),dt=b.getChannelData(0);for(let i=0;i<dt.length;i++)dt[i]=Math.random()*2-1;n.buffer=b;const f=a.createBiquadFilter();f.type='highpass';f.frequency.value=hp||800;const g=a.createGain();g.gain.value=0.0001;g.gain.exponentialRampToValueAtTime(v||0.2,a.currentTime+0.01);g.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+d);n.connect(f);f.connect(g);g.connect(a.destination);n.start();n.stop(a.currentTime+d+0.02);}
const S={
  pitch(){tone(300,0.05,'sine',0.05);},
  crack(){noise(0.05,0.26,700);tone(240,0.09,'square',0.18,120);},       // sharp bat crack
  smash(){noise(0.06,0.3,600);tone(180,0.12,'square',0.2,90);},           // big drive
  goal(){tone(560,0.1,'triangle',0.2);setTimeout(function(){tone(760,0.14,'triangle',0.22);},110);setTimeout(function(){tone(1000,0.2,'triangle',0.22);},230);},
  roar(){noise(0.5,0.14,300);},
  roll(){noise(0.12,0.14,300);tone(150,0.14,'sawtooth',0.12,90);},         // weak grounder
  jam(){tone(300,0.24,'sawtooth',0.16,150);noise(0.08,0.1,900);},          // jammed / into the mitt
  combo(n){tone(600+Math.min(n,8)*70,0.12,'triangle',0.16);},
  over(){tone(330,0.3,'sine',0.2,160);setTimeout(function(){tone(220,0.5,'sine',0.2,110);},180);},
  start(){tone(440,0.1,'triangle',0.18);setTimeout(function(){tone(660,0.16,'triangle',0.2);},110);},
};

function clamp(v,a,b){return v<a?a:v>b?b:v;}
function rnd(a,b){return a+Math.random()*(b-a);}

// ---------- state ----------
let state='title';
let outs=0,fails=0,score=0,combo=0,lvl=1;   // outs = clean hits
let best=0;try{best=parseInt(localStorage.getItem('lt_best')||'0')||0;}catch(e){}
const TARGET=26;

let phase='wind';  // wind | watch | result
let pt=0, clock=0;
let deadT=1100, win=500, effWin=500, winStart=600, tough=false;
let decided=false, result='', swingClock=0, quality=0;
let parts=[];
let shakeT=0,flash=0;
let msg='',msgCol='#fff',msgT=0;
let lastAdd=0;
// scene geometry
const PITCHY=118, DEEPY=468, PLATEX=450;
let ballX=PLATEX, ballY=PITCHY;       // the incoming pitch
let swingU=0;                          // bat-swing animation
let hit=null;                          // batted-ball {x,y,u,land,arc,foul}
const FENCEY=150;                      // outfield wall (HR beyond)

function reset(){outs=0;fails=0;score=0;combo=0;lvl=1;parts=[];}
function newPlay(){
  lvl=Math.min(7,1+Math.floor(outs/4));
  deadT=clamp(1180-lvl*58,720,1180);
  win=clamp(520-lvl*30,300,520);
  tough=Math.random()<clamp(0.2+lvl*0.05,0.2,0.5);
  effWin=tough?win*0.82:win;
  winStart=deadT-effWin;
  phase='wind';pt=0;clock=0;decided=false;result='';swingClock=0;quality=0;swingU=0;hit=null;
  ballX=PLATEX;ballY=PITCHY;
}
function startGame(){reset();state='play';newPlay();S.start();}

function burst(x,y,col,n,sp){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=rnd(0.4,1)*(sp||3);parts.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:1,col:col,r:rnd(2,5)});}}
function lerp(a,b,t){return [a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t];}

function resolve(kind){
  decided=true;result=kind;swingClock=clock;
  const contactY=ballY;
  if(kind==='hit'){
    outs++;combo++;
    quality=clamp((clock-winStart)/effWin,0,1);   // later = deeper contact = better drive
    const cm=1+Math.min(combo-1,6)*0.14;
    const add=Math.round((100+quality*160)*cm)*Math.max(1,lvl);
    score+=add;lastAdd=add;
    const homer=quality>0.72;
    // batted ball flies up-field; distance/arc scale with quality
    const spray=rnd(-1,1)*(0.7-quality*0.4);
    const landX=clamp(PLATEX+spray*300,120,780);
    const landY=homer?rnd(90,FENCEY-18):clamp(300-quality*250,FENCEY+6,320);
    hit={x0:PLATEX,y0:contactY,x:PLATEX,y:contactY,u:0,land:[landX,landY],arc:120+quality*150,homer:homer,dur:640+quality*420};
    S.crack();if(homer)setTimeout(S.smash,20);setTimeout(S.goal,homer?300:200);setTimeout(S.roar,homer?380:280);if(combo>1)setTimeout(function(){S.combo(combo);},460);
    flash=homer?0.34:0.22;burst(PLATEX,contactY,homer?'#ffe08a':'#bfe',homer?14:8,homer?3.6:2.6);
    msg=(homer?'完璧に引きつけた——特大アーチ！':'呼び込んでジャストミート——痛烈な打球！')+'  +'+add;msgCol='#5affa0';msgT=1;
  }else{
    combo=0;fails++;
    if(result==='early'){S.roll();
      hit={x0:PLATEX,y0:contactY,x:PLATEX,y:contactY,u:0,land:[clamp(PLATEX+rnd(-90,90),330,570),548],arc:26,homer:false,dur:520};
      msg='早い！ 泳がされて引っ掛けた——ボテボテのゴロ';
    }else{S.jam();
      hit={x0:PLATEX,y0:DEEPY,x:PLATEX,y:DEEPY,u:0,land:[PLATEX,522],arc:8,homer:false,dur:300};
      msg='差し込まれた！ 詰まってミットへ';
    }
    setTimeout(S.over,60);flash=0.3;shakeT=0.55;msgCol='#ff6a6a';msgT=1;
  }
  phase='result';pt=0;
}

function swing(){
  if(state!=='play'||phase!=='watch'||decided)return;
  swingU=0.001;
  if(clock<winStart)resolve('early');
  else resolve('hit');
}

// ---------- input ----------
function act(){if(!AC)actx();if(state==='title'){startGame();return;}if(state==='over'){startGame();return;}swing();}
cv.addEventListener('mousedown',function(e){e.preventDefault();act();});
cv.addEventListener('touchstart',function(e){e.preventDefault();act();},{passive:false});
window.addEventListener('keydown',function(e){
  if(e.code==='Space'||e.code==='ArrowUp'||e.code==='Enter'||e.code==='KeyJ'){e.preventDefault();act();}
});

// ---------- update ----------
let last=0;
function update(dt){
  if(flash>0)flash=Math.max(0,flash-dt/300);
  if(shakeT>0)shakeT=Math.max(0,shakeT-dt/320);
  if(msgT>0)msgT=Math.max(0,msgT-dt/1500);
  if(swingU>0&&swingU<1)swingU=Math.min(1,swingU+dt/150);
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.x+=p.vx;p.y+=p.vy;p.vy+=0.16;p.life-=dt/640;if(p.life<=0)parts.splice(i,1);}
  if(state!=='play')return;
  pt+=dt;
  if(phase==='wind'){
    if(pt>=440){phase='watch';pt=0;clock=0;S.pitch();}
  }else if(phase==='watch'){
    clock+=dt;
    const u=clamp(clock/deadT,0,1);
    ballY=PITCHY+(DEEPY-PITCHY)*u;   // pitch travels toward the batter
    if(clock>=deadT&&!decided)resolve('late');
  }else if(phase==='result'){
    if(hit){
      hit.u=Math.min(1,hit.u+dt/hit.dur);
      const p=lerp([hit.x0,hit.y0],hit.land,hit.u);
      hit.x=p[0];hit.y=p[1]-Math.sin(hit.u*Math.PI)*hit.arc;
      if(result==='hit'&&hit.u<0.9&&Math.random()<0.25)burst(hit.x,hit.y,hit.homer?'#ffe08a':'#cfe',1,1.2);
    }
    if(pt>=1200){
      if(fails>=3){state='over';best=Math.max(best,score);try{localStorage.setItem('lt_best',String(best));}catch(e){}S.over();}
      else if(outs>=TARGET){state='over';best=Math.max(best,score);try{localStorage.setItem('lt_best',String(best));}catch(e){}S.goal();}
      else newPlay();
    }
  }
}

// ---------- render ----------
function roundRect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

function drawField(){
  // outfield beyond the fence
  const sky=ctx.createLinearGradient(0,0,0,FENCEY);sky.addColorStop(0,'#20344c');sky.addColorStop(1,'#31506a');
  ctx.fillStyle=sky;ctx.fillRect(0,0,W,FENCEY);
  ctx.fillStyle='#1c2c40';ctx.fillRect(0,66,W,FENCEY-66);
  for(let y=74;y<FENCEY-4;y+=11){for(let x=8;x<W;x+=13){ctx.fillStyle=(x+y)%3?'rgba(200,210,230,.07)':'rgba(255,230,160,.07)';ctx.fillRect(x,y,6,6);}}
  // outfield wall + yellow HR line
  ctx.fillStyle='#1f6b39';ctx.fillRect(0,FENCEY,W,16);
  ctx.fillStyle='#ffd23a';ctx.fillRect(0,FENCEY-3,W,4);
  // grass
  const gr=ctx.createLinearGradient(0,FENCEY+16,0,H);gr.addColorStop(0,'#2f7d45');gr.addColorStop(1,'#215c33');
  ctx.fillStyle=gr;ctx.fillRect(0,FENCEY+16,W,H-(FENCEY+16));
  for(let i=0;i<10;i++){ctx.fillStyle=i%2?'rgba(255,255,255,.03)':'rgba(0,0,0,.04)';ctx.fillRect(i*90,FENCEY+16,90,H-(FENCEY+16));}
  // infield dirt around the plate
  ctx.fillStyle='#8a5a34';ctx.beginPath();ctx.ellipse(PLATEX,510,300,120,0,0,Math.PI*2);ctx.fill();
  // pitcher's mound (far)
  ctx.fillStyle='#8a5a34';ctx.beginPath();ctx.ellipse(PLATEX,124,50,14,0,0,Math.PI*2);ctx.fill();
  // home plate
  ctx.fillStyle='#f4f4f4';ctx.beginPath();ctx.moveTo(PLATEX,556);ctx.lineTo(PLATEX+40,538);ctx.lineTo(PLATEX+34,516);ctx.lineTo(PLATEX-34,516);ctx.lineTo(PLATEX-40,538);ctx.closePath();ctx.fill();
}

function drawPitcher(){
  ctx.save();ctx.translate(PLATEX,104);
  ctx.fillStyle='#22303f';ctx.fillRect(-9,4,7,18);ctx.fillRect(2,4,7,18);
  ctx.fillStyle='#d0d6de';roundRect(-12,-16,24,22,4);ctx.fill();
  ctx.fillStyle='#f0c9a0';ctx.beginPath();ctx.arc(0,-24,8,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#1b2740';ctx.beginPath();ctx.arc(0,-26,8,Math.PI,0);ctx.fill();
  ctx.restore();
}

function drawZone(){
  // the "引きつけゾーン" — deep contact window near the plate
  const zx=PLATEX-70, zTop=PITCHY+(DEEPY-PITCHY)*clamp(winStart/deadT,0,1), zBot=DEEPY;
  ctx.fillStyle='rgba(90,220,150,.14)';ctx.fillRect(zx,zTop,140,zBot-zTop);
  ctx.strokeStyle='rgba(90,220,150,.5)';ctx.lineWidth=2;ctx.setLineDash([7,6]);ctx.strokeRect(zx,zTop,140,zBot-zTop);ctx.setLineDash([]);
  ctx.fillStyle='rgba(170,255,207,.85)';ctx.font='11px sans-serif';ctx.textAlign='center';ctx.fillText('引きつけゾーン（深いほど◎）',PLATEX,zTop-6);
}

function drawBatter(){
  // right-handed batter beside the plate, swings on contact
  const bx=PLATEX-52, by=470;
  ctx.save();ctx.translate(bx,by);
  ctx.fillStyle='rgba(0,0,0,.25)';ctx.beginPath();ctx.ellipse(6,20,20,6,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#20242c';ctx.fillRect(-4,4,8,22);ctx.fillRect(8,4,8,22);
  ctx.fillStyle='#c0343a';roundRect(-6,-24,24,30,5);ctx.fill();
  ctx.fillStyle='#f0c9a0';ctx.beginPath();ctx.arc(8,-34,9,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#16305c';ctx.beginPath();ctx.arc(8,-37,10,Math.PI,0);ctx.fill();ctx.fillRect(8,-38,12,4);
  // bat: coiled back, whips through on swing
  const sw=(swingU>0)?swingU:0;
  const ang=-2.5 + sw*3.3;   // from cocked (behind) to follow-through
  ctx.save();ctx.translate(10,-16);ctx.rotate(ang);
  ctx.strokeStyle='#c9a05a';ctx.lineWidth=6;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(46,0);ctx.stroke();
  ctx.restore();
  ctx.restore();
}

function drawCatcher(){
  ctx.save();ctx.translate(PLATEX,528);
  ctx.fillStyle='#1b1e24';ctx.beginPath();ctx.ellipse(0,20,30,12,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#7a2f38';ctx.beginPath();ctx.ellipse(0,0,24,22,0,Math.PI,0);ctx.fill();
  ctx.fillStyle='#333';ctx.beginPath();ctx.arc(0,-18,11,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#8a5a2a';ctx.beginPath();ctx.arc(-16,-4,9,0,Math.PI*2);ctx.fill();  // mitt
  ctx.restore();
}

function drawBall(){
  // incoming pitch (during watch) or batted ball (during result)
  let x,y,r=8;
  if(phase==='watch'){x=ballX;y=ballY;
    ctx.strokeStyle='rgba(255,255,255,.28)';ctx.lineWidth=5;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x,y-20);ctx.lineTo(x,y);ctx.stroke();
  }else if(phase==='result'&&hit){x=hit.x;y=hit.y;r=hit.homer?9:8;
    ctx.strokeStyle=hit.homer?'rgba(255,224,138,.5)':'rgba(255,255,255,.3)';ctx.lineWidth=5;ctx.lineCap='round';
    const back=lerp([hit.x0,hit.y0],hit.land,Math.max(0,hit.u-0.06));ctx.beginPath();ctx.moveTo(back[0],back[1]-Math.sin(Math.max(0,hit.u-0.06)*Math.PI)*hit.arc);ctx.lineTo(x,y);ctx.stroke();
  }else return;
  ctx.fillStyle='rgba(0,0,0,.16)';ctx.beginPath();ctx.ellipse(x,y+r*0.7,r*0.85,r*0.4,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='#d33';ctx.lineWidth=1.1;ctx.beginPath();ctx.arc(x-r*0.3,y,r*0.7,-0.7,0.7);ctx.stroke();
}

function drawTimingBar(){
  if(state!=='play')return;
  const mx=150,mw=600,my=566,mh=16;
  roundRect(mx,my,mw,mh,8);ctx.fillStyle='rgba(0,0,0,.45)';ctx.fill();
  const end=deadT;
  const wsX=mx+mw*clamp(winStart/end,0,1);
  ctx.fillStyle='rgba(210,70,70,.30)';ctx.fillRect(mx,my,wsX-mx,mh);
  const gg=ctx.createLinearGradient(wsX,0,mx+mw,0);gg.addColorStop(0,'rgba(90,220,150,.35)');gg.addColorStop(1,'rgba(60,255,150,.95)');
  ctx.fillStyle=gg;ctx.fillRect(wsX,my,(mx+mw)-wsX,mh);
  roundRect(mx,my,mw,mh,8);ctx.strokeStyle='rgba(255,255,255,.4)';ctx.lineWidth=1.5;ctx.stroke();
  ctx.font='11px sans-serif';ctx.textAlign='left';ctx.fillStyle='#ff9a9a';ctx.fillText('早い＝泳いで引っ掛け',mx+4,my-5);
  ctx.textAlign='right';ctx.fillStyle='#aaffcf';ctx.fillText('引きつけて叩く（深いほど◎）',mx+mw-4,my-5);
  if(phase==='watch'||phase==='result'){
    const cc=(phase==='watch')?clock:swingClock;
    const px=mx+mw*clamp((result==='late'?deadT:cc)/end,0,1);
    ctx.fillStyle=(phase==='result')?(result==='hit'?'#5affa0':'#ff6a6a'):'#fff';
    ctx.fillRect(px-2,my-4,4,mh+8);
  }
}

function drawHUD(){
  ctx.textAlign='left';ctx.textBaseline='alphabetic';
  ctx.font='bold 20px sans-serif';ctx.fillStyle='#fff';
  ctx.fillText('快打 '+outs+' / '+TARGET,20,32);
  ctx.font='14px sans-serif';ctx.fillStyle='#ffb14a';ctx.fillText('凡打 '+fails+' / 3',20,54);
  ctx.textAlign='right';
  ctx.font='bold 20px sans-serif';ctx.fillStyle='#ffe08a';ctx.fillText('SCORE '+score,W-20,32);
  ctx.font='13px sans-serif';ctx.fillStyle='#bfe';ctx.fillText('BEST '+Math.max(best,score)+'   Lv.'+lvl,W-20,52);
  if(combo>1){ctx.textAlign='center';ctx.font='bold 20px sans-serif';ctx.fillStyle='#5affa0';ctx.fillText(combo+' 連続快打!',450,300);}
  if(phase==='watch'&&!decided){ctx.textAlign='center';ctx.font='bold 15px sans-serif';ctx.fillStyle='#ffe08a';ctx.fillText('ボールを限界まで呼び込め——差し込まれる直前に叩く',450,352);}
}

function drawMsg(){
  if(msgT<=0)return;
  ctx.save();ctx.globalAlpha=clamp(msgT*1.4,0,1);
  ctx.textAlign='center';ctx.font='bold 22px sans-serif';
  ctx.fillStyle='rgba(0,0,0,.6)';roundRect(450-310,398,620,42,10);ctx.fill();
  ctx.fillStyle=msgCol;ctx.fillText(msg,450,426);
  ctx.restore();
}

function drawTitle(){
  drawField();drawPitcher();drawCatcher();drawBatter();
  ctx.save();ctx.textAlign='center';
  ctx.fillStyle='rgba(0,0,0,.7)';roundRect(96,96,708,410,16);ctx.fill();
  ctx.fillStyle='#fff';ctx.font='bold 32px sans-serif';ctx.fillText('呼び込んで叩け',450,152);
  ctx.font='18px sans-serif';ctx.fillStyle='#9fe0bf';ctx.fillText('Let It Travel',450,182);
  ctx.font='16px sans-serif';ctx.fillStyle='#e6fcef';
  const lines=[
    'あなたは巧打者。速球を“引きつけて”強い打球を放て！',
    '投球がバットの届く深い「引きつけゾーン」に入ってから',
    'タップ / SPACE で振る＝呼び込んで痛烈にミート。',
    '深く引きつける（遅く振る）ほど打球は強く、特大アーチに。',
    '早いと泳がされて引っ掛け（ボテボテのゴロ）。',
    '引きつけ過ぎ＝差し込まれてミットへ（見逃し）。',
    '26本の快打で勝利。3凡打で終了。',
  ];
  for(let i=0;i<lines.length;i++)ctx.fillText(lines[i],450,220+i*30);
  ctx.fillStyle='#ffe08a';ctx.font='bold 22px sans-serif';
  ctx.fillText('タップ / SPACE でスタート',450,486);
  ctx.restore();
}

function drawOver(){
  drawField();
  ctx.save();ctx.textAlign='center';
  ctx.fillStyle='rgba(0,0,0,.7)';roundRect(190,150,520,300,16);ctx.fill();
  const w2=outs>=TARGET;
  ctx.fillStyle=w2?'#5affa0':'#ff8a5a';ctx.font='bold 34px sans-serif';
  ctx.fillText(w2?'固め打ち達成！':'打ち取られた…',450,222);
  ctx.fillStyle='#fff';ctx.font='20px sans-serif';
  ctx.fillText('快打 '+outs+' / '+TARGET,450,270);
  ctx.fillText('スコア '+score,450,304);
  ctx.fillStyle='#ffe08a';ctx.fillText('ベスト '+Math.max(best,score),450,336);
  ctx.fillStyle='#9fe0bf';ctx.font='bold 20px sans-serif';
  ctx.fillText('タップ / SPACE でもう一度',450,404);
  ctx.restore();
}

function render(){
  ctx.save();
  if(shakeT>0){const s=shakeT*7;ctx.translate(rnd(-s,s),rnd(-s,s));}
  if(state==='title'){drawTitle();}
  else if(state==='over'){drawOver();}
  else{
    drawField();drawPitcher();
    if(phase==='watch'&&!decided)drawZone();
    drawCatcher();drawBatter();drawBall();
    drawTimingBar();drawHUD();drawMsg();
  }
  for(const p of parts){ctx.globalAlpha=clamp(p.life,0,1);ctx.fillStyle=p.col;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();}
  ctx.globalAlpha=1;
  ctx.restore();
  if(flash>0){ctx.fillStyle='rgba(255,240,180,'+(flash*0.45)+')';ctx.fillRect(0,0,W,H);}
}

function frame(ts){let dt=ts-last;last=ts;if(dt>60)dt=60;if(dt<0)dt=0;update(dt);render();requestAnimationFrame(frame);}
requestAnimationFrame(frame);

// ---------- test hook ----------
window.__lt={
  start:startGame,
  swing:swing,   // swing() = take the cut
  get state(){return state;},
  get outs(){return outs;},
  get fails(){return fails;},
  get score(){return score;},
  get info(){return {state:state,phase:phase,clock:clock,deadT:deadT,win:win,effWin:effWin,winStart:winStart,tough:tough,decided:decided,result:result,quality:quality,outs:outs,fails:fails,lvl:lvl,inWindow:(clock>=winStart&&clock<deadT),canAct:(state==='play'&&phase==='watch'&&!decided)};}
};
})();
</script>
