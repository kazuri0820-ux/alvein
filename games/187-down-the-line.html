<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>フェア・ファウル (Down the Line)</title>
<style>
  html,body{margin:0;height:100%;background:#0a1018;overflow:hidden;
    font-family:-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  #stage{position:relative;width:100vw;height:100vh;max-width:calc(100vh*1.5);max-height:calc(100vw/1.5);aspect-ratio:900/600;}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;border-radius:6px;}
</style>
</head>
<body>
<div id="wrap"><div id="stage"><canvas id="cv"></canvas></div></div>
<script>
(function(){
const W=900,H=600,cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let DPR=1;
function fit(){DPR=Math.min(2,window.devicePixelRatio||1);cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
fit();addEventListener('resize',fit);

// ---------- audio ----------
let AC=null;function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function tone(f,d,type,v,sweep){const a=ac();if(!a)return;const t=a.currentTime,o=a.createOscillator(),g=a.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(sweep)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+sweep),t+d);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v||0.2,t+0.008);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+0.02);}
function noise(d,v,hp){const a=ac();if(!a)return;const t=a.currentTime,n=Math.floor(a.sampleRate*d),buf=a.createBuffer(1,n,a.sampleRate),ch=buf.getChannelData(0);
  for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource();s.buffer=buf;
  const f=a.createBiquadFilter();f.type='highpass';f.frequency.value=hp||600;const g=a.createGain();g.gain.value=v||0.2;
  s.connect(f);f.connect(g);g.connect(a.destination);s.start(t);s.stop(t+d+0.02);}
const S={
  field:()=>{noise(0.06,0.2,500);tone(360,0.09,'square',0.13);},
  out:()=>{tone(760,0.09,'square',0.18);setTimeout(()=>tone(1040,0.13,'square',0.2),80);setTimeout(()=>tone(1320,0.16,'triangle',0.18),190);},
  great:()=>{[700,980,1320,1760].forEach((f,i)=>setTimeout(()=>tone(f,0.12,'triangle',0.2),i*60));},
  foulok:()=>{tone(520,0.1,'sine',0.12);},
  bad:()=>{tone(240,0.3,'sawtooth',0.2,-120);setTimeout(()=>tone(170,0.28,'sawtooth',0.16,-70),120);},
  whiff:()=>{noise(0.14,0.16,400);tone(200,0.16,'sawtooth',0.12,-70);},
  over:()=>{[440,330,247,175].forEach((f,i)=>setTimeout(()=>tone(f,0.3,'triangle',0.2),i*160));}
};

// ---------- geometry ----------
const HP={x:474,y:520}, CORNER={x:120,y:150};
const dirX=(CORNER.x-HP.x), dirY=(CORNER.y-HP.y); const dLen=Math.hypot(dirX,dirY);
const ux=dirX/dLen, uy=dirY/dLen;         // along the line
const px=-uy, py=ux;                        // perpendicular; choose foul side sign below
// foul side = to the left/outside. Test: perp (px,py) with px=-uy,py=ux points up-right(fair). foul = negative of that.
const B3={x:HP.x+ux*0.44*dLen, y:HP.y+uy*0.44*dLen};   // third base along the line
const REACH_U0=0.37, REACH_U1=0.51;         // reach window (fraction along line)
const FIRST={x:690,y:470};

// ---------- state ----------
let state='title', phase='roll', t=0, plays=0;
let score=0, combo=0, best=+(localStorage.getItem('dtl_best')||0);
let outs=0, miss=0, lvl=1;
let P=null, ball=null, result=null, resultT=0, msg='', msg2='', throwBall=null;
let shake=0, flash=0, flashCol='#fff', last=performance.now();
let parts=[], pops=[];

function rnd(a,b){return a+Math.random()*(b-a);}
function chance(p){return Math.random()<p;}
function clamp(v,a,b){return v<a?a:v>b?b:v;}

function reset(){state='title';score=0;combo=0;outs=0;miss=0;lvl=1;plays=0;P=null;ball=null;result=null;parts=[];pops=[];throwBall=null;}

function newPlay(){
  plays++;
  lvl=Math.min(6,1+Math.floor(plays/3));
  const isFair=chance(0.5);
  const dur=Math.max(1050,1550-lvl*84);
  // curve: foul balls drift to the foul side; fair stay near/inside. closer at high lvl
  const close=Math.max(10,30-lvl*3);
  const curve=isFair? -rnd(4,14) : rnd(close, close+30+lvl*4); // +=foul side offset(px foul), -=fair
  P={isFair,dur,curve,t:0,decided:false,fielded:false,fieldU:-1};
  ball={u:0,x:HP.x,y:HP.y,off:0};
  result=null; throwBall=null; phase='roll'; t=0;
  msg='ライン際！ フェアかファウルか'; msg2='フェアなら捕って送球、ファウルは見送り';
}

function start(){ if(!ac())ac(); if(AC&&AC.state==='suspended')AC.resume(); reset(); state='play'; newPlay(); }

function ballXY(u){
  const bx=HP.x+ux*u*dLen, by=HP.y+uy*u*dLen;
  const off=P.curve*u*u; // perpendicular offset (foul side = -px direction)
  // foul side: subtract perp (since perp px,py points fair). off>0 => foul.
  return {x:bx - px*off, y:by - py*off, off};
}

// ---------- field ----------
function field(){
  if(state==='title'){start();return;}
  if(state==='over'){ if(resultT>0.5){reset();start();} return; }
  if(state!=='play'||phase!=='roll'||!P||P.decided) return;
  const u=ball.u;
  const inReach = u>=REACH_U0 && u<=REACH_U1;
  P.decided=true; P.fielded=true; P.fieldU=u;
  if(!inReach){ // charged too early / lunged out of range
    S.whiff(); applyResult('whiff'); return;
  }
  if(P.isFair){ const great=Math.abs(u-(REACH_U0+REACH_U1)/2)<0.03; startThrow(great?'great':'out'); }
  else { applyResult('fooled'); }
}

function startThrow(kind){
  phase='throw'; P.kind=kind; S.field();
  const b=ballXY(ball.u); throwBall={x:b.x,y:b.y,tx:FIRST.x,ty:FIRST.y,tp:0};
  P.tt=0;
}

function applyResult(kind){
  result=kind; resultT=0; phase='resolve';
  const b=ballXY(clamp(ball.u,0,1));
  if(kind==='out'||kind==='great'){
    combo++; const mult=1+Math.min(6,combo-1)*0.24; const base=kind==='great'?180:120; const add=Math.round(base*mult);
    score+=add; outs++;
    if(kind==='great')S.great(); else S.out();
    flash=1;flashCol=kind==='great'?'#ffe08a':'#8ff0b8'; shake=kind==='great'?12:8;
    burst(FIRST.x,FIRST.y,kind==='great'?'#ffe08a':'#bfffd0',kind==='great'?24:16,7);
    pop(FIRST.x,FIRST.y-28,(kind==='great'?'好プレー！ ':'アウト！ ')+'+'+add,'#eaffef');
    if(combo>=2)pop(FIRST.x,FIRST.y-52,'コンボ x'+combo,'#ffe08a');
    msg=kind==='great'?'ナイス判断＆好捕！ ライン際を仕留めた':'アウト！ フェアを的確に処理'; msg2='';
  } else if(kind==='foulok'){
    combo++; const add=40; score+=add; S.foulok();
    pop(B3.x,B3.y-30,'ファウル 見送り +'+add,'#cfe8ff');
    msg='ファウル！ 正しく見送った'; msg2=''; result='foulok';
  } else {
    combo=0; miss++;
    S.bad();
    flash=1;flashCol='#ff6b6b'; shake=10;
    if(kind==='fooled'){ msg='ファウルに手を出した！ 判断ミス'; msg2='切れる打球は見送れ'; burst(ball.x,ball.y,'#ff8a8a',15,5);}
    else if(kind==='letgo'){ msg='フェアを見送った！ 長打を許した'; msg2='残る打球は捕って送球'; burst(b.x,b.y,'#ff8a8a',15,5);}
    else { msg='突っ込みすぎ！ お手玉'; msg2='届く間合いで捕れ'; burst(ball.x,ball.y,'#ff8a8a',15,5);}
  }
}

// ---------- input ----------
cv.addEventListener('pointerdown',e=>{e.preventDefault();field();});
addEventListener('keydown',e=>{ if(e.code==='Space'||e.code==='Enter'||e.code==='ArrowUp'){e.preventDefault();field();}});

// ---------- particles ----------
function burst(x,y,c,n,sp){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=rnd(sp*0.3,sp);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:1,c});}}
function pop(x,y,txt,c){pops.push({x,y,txt,c,life:1});}

// ---------- update ----------
function update(dt){
  shake*=Math.pow(0.86,dt/16.7); if(shake<0.3)shake=0;
  flash*=Math.pow(0.9,dt/16.7);
  for(const p of parts){p.vx*=0.96;p.vy=p.vy*0.96+0.3;p.x+=p.vx*dt/16.7;p.y+=p.vy*dt/16.7;p.life-=dt/16.7*0.026;}
  parts=parts.filter(p=>p.life>0);
  for(const p of pops){p.y-=dt/16.7*0.5;p.life-=dt/16.7*0.018;}
  pops=pops.filter(p=>p.life>0);

  if(state!=='play'){ if(state==='over')resultT+=dt/1000; return; }
  t+=dt;

  if(phase==='roll'){
    P.t+=dt; ball.u=clamp(P.t/P.dur,0,1);
    const b=ballXY(ball.u); ball.x=b.x; ball.y=b.y; ball.off=b.off;
    if(ball.u>=1 && !P.decided){ // ball settled without a field decision (held)
      P.decided=true;
      if(P.isFair) applyResult('letgo'); else applyResult('foulok');
    }
    return;
  }
  if(phase==='throw'){
    P.tt+=dt; throwBall.tp=clamp(throwBall.tp+dt/340,0,1);
    if(throwBall.tp>=1){ applyResult(P.kind); }
    return;
  }
  if(phase==='resolve'){
    resultT+=dt/1000;
    if(resultT>1.0){
      if(miss>=3){ state='over'; resultT=0; S.over(); if(score>best){best=score;localStorage.setItem('dtl_best',best);} }
      else newPlay();
    }
    return;
  }
}

// ---------- render ----------
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

function drawScene(){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#16273e');g.addColorStop(0.5,'#1d5233');g.addColorStop(1,'#227a46');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  // foul territory shading (left of line)
  ctx.fillStyle='rgba(60,40,25,0.35)';
  ctx.beginPath();ctx.moveTo(HP.x,HP.y);ctx.lineTo(CORNER.x,CORNER.y);ctx.lineTo(0,CORNER.y);ctx.lineTo(0,H);ctx.lineTo(HP.x,H);ctx.closePath();ctx.fill();
  ctx.fillStyle='rgba(255,255,255,0.25)';ctx.font='12px sans-serif';ctx.textAlign='left';ctx.fillText('ファウルゾーン',30,200);
  // chalk line
  ctx.strokeStyle='#f4f4f4';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(HP.x,HP.y);ctx.lineTo(CORNER.x,CORNER.y);ctx.stroke();
  // reach window band along the line
  if(state==='play'&&phase==='roll'){
    const a=ballXY? null:null;
    const p0={x:HP.x+ux*REACH_U0*dLen,y:HP.y+uy*REACH_U0*dLen}, p1={x:HP.x+ux*REACH_U1*dLen,y:HP.y+uy*REACH_U1*dLen};
    ctx.strokeStyle='rgba(126,240,176,0.4)';ctx.lineWidth=20;ctx.beginPath();ctx.moveTo(p0.x,p0.y);ctx.lineTo(p1.x,p1.y);ctx.stroke();
  }
  // third base
  ctx.save();ctx.translate(B3.x,B3.y);ctx.rotate(Math.PI/4);ctx.fillStyle='#f0f0f0';ctx.fillRect(-10,-10,20,20);ctx.restore();
  // home + first
  ctx.fillStyle='#eee';ctx.beginPath();ctx.moveTo(HP.x,HP.y+8);ctx.lineTo(HP.x-12,HP.y);ctx.lineTo(HP.x-12,HP.y-8);ctx.lineTo(HP.x+12,HP.y-8);ctx.lineTo(HP.x+12,HP.y);ctx.closePath();ctx.fill();
  ctx.save();ctx.translate(FIRST.x,FIRST.y);ctx.rotate(Math.PI/4);ctx.fillStyle='#f0f0f0';ctx.fillRect(-10,-10,20,20);ctx.restore();
}

function drawFielder(){
  // 3B stands just fair of third; leans to field during reach
  let fx=B3.x+26, fy=B3.y-6;
  if(P&&phase==='throw'){ fx=ball.x+8; fy=ball.y-4; }
  ctx.fillStyle='rgba(0,0,0,0.22)';ctx.beginPath();ctx.ellipse(fx,fy+15,12,4,0,0,6.28);ctx.fill();
  ctx.fillStyle='#c0352e';rr(fx-8,fy-6,16,22,6);ctx.fill();
  ctx.fillStyle='#f2c9a0';ctx.beginPath();ctx.arc(fx,fy-14,7,0,6.28);ctx.fill();
  ctx.fillStyle='#7a1712';ctx.beginPath();ctx.arc(fx,fy-16,7.5,Math.PI,0);ctx.fill();
  ctx.fillStyle='#6a3f22';ctx.beginPath();ctx.arc(fx-10,fy+4,6,0,6.28);ctx.fill();
}

function render(){
  ctx.save();
  if(shake>0)ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
  drawScene();

  if(P){
    drawFielder();
    // rolling ball
    if(phase==='roll'||phase==='resolve'){
      // fair/foul live tag near the ball
      ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(ball.x,ball.y,7,0,6.28);ctx.fill();
      ctx.strokeStyle='#333';ctx.lineWidth=1.3;ctx.beginPath();ctx.arc(ball.x,ball.y,7,0,6.28);ctx.stroke();
      // trail dots along path
      ctx.fillStyle='rgba(255,255,255,0.25)';for(let k=1;k<=5;k++){const uu=clamp(ball.u-k*0.03,0,1);const b=ballXY(uu);ctx.beginPath();ctx.arc(b.x,b.y,3,0,6.28);ctx.fill();}
    }
    if(throwBall){ const x=throwBall.x+(throwBall.tx-throwBall.x)*throwBall.tp, y=throwBall.y+(throwBall.ty-throwBall.y)*throwBall.tp - Math.sin(throwBall.tp*Math.PI)*24;
      ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(x,y,6,0,6.28);ctx.fill();ctx.strokeStyle='#c33';ctx.lineWidth=1.2;ctx.beginPath();ctx.arc(x,y,6,0.4,2.3);ctx.stroke(); }
    // first baseman
    ctx.fillStyle='#c0352e';rr(FIRST.x+14,FIRST.y-24,16,22,6);ctx.fill();ctx.fillStyle='#f2c9a0';ctx.beginPath();ctx.arc(FIRST.x+22,FIRST.y-30,6,0,6.28);ctx.fill();
  }

  for(const p of parts){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,3.2,0,6.28);ctx.fill();}
  ctx.globalAlpha=1;
  for(const p of pops){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.font='bold 20px sans-serif';ctx.textAlign='center';ctx.fillText(p.txt,p.x,p.y);}
  ctx.globalAlpha=1;

  // HUD
  ctx.textAlign='left';ctx.fillStyle='#fff';ctx.font='bold 26px sans-serif';ctx.fillText('SCORE '+score,20,36);
  ctx.textAlign='right';ctx.fillStyle='rgba(255,255,255,0.85)';ctx.font='14px sans-serif';ctx.fillText('アウト '+outs+'  Lv.'+lvl,W-20,26);
  ctx.fillText('判断ミス',W-108,50);
  for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(W-66+i*22,46,7,0,6.28);ctx.fillStyle=i<miss?'#ff5b5b':'rgba(255,255,255,0.25)';ctx.fill();}
  if(combo>=2){ctx.textAlign='left';ctx.fillStyle='#ffe08a';ctx.font='bold 18px sans-serif';ctx.fillText('コンボ x'+combo,20,60);}

  if(state==='play'&&(msg||msg2)){
    ctx.textAlign='center';
    const good=result==='out'||result==='great'||result==='foulok';
    ctx.fillStyle=result?(good?'#8ff0b8':'#ff9a9a'):'rgba(255,255,255,0.92)';
    ctx.font='bold 25px sans-serif';ctx.fillText(msg,W/2,H-52);
    if(msg2){ctx.fillStyle='rgba(255,255,255,0.72)';ctx.font='15px sans-serif';ctx.fillText(msg2,W/2,H-28);}
  }

  if(state==='title'){
    ctx.fillStyle='rgba(6,10,18,0.66)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='bold 44px sans-serif';ctx.fillText('フェア・ファウル',W/2,186);
    ctx.fillStyle='#8ff0b8';ctx.font='bold 22px sans-serif';ctx.fillText('Down the Line',W/2,222);
    ctx.fillStyle='rgba(255,255,255,0.9)';ctx.font='18px sans-serif';
    ctx.fillText('三塁線を転がる打球が“切れる（ファウル）”か“残る（フェア）”かを読み、',W/2,284);
    ctx.fillText('フェアなら間合い（緑帯）で捕って送球（クリック/タップ/SPACE）、ファウルは見送り',W/2,312);
    ctx.fillStyle='rgba(255,255,255,0.66)';ctx.font='15px sans-serif';
    ctx.fillText('ファウルに手を出すと判断ミス／フェアを見送ると長打／早すぎる突っ込みはお手玉',W/2,354);
    ctx.fillText('際どい打球を的確にさばくほど高得点。3判断ミスで交代',W/2,378);
    ctx.fillStyle='#ffe08a';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で開始',W/2,440);
    ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='14px sans-serif';ctx.fillText('BEST '+best,W/2,472);
  }
  if(state==='over'){
    ctx.fillStyle='rgba(6,10,18,0.74)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#ff6b6b';ctx.font='bold 44px sans-serif';ctx.fillText('3判断ミス…交代',W/2,230);
    ctx.fillStyle='#fff';ctx.font='bold 40px sans-serif';ctx.fillText('SCORE '+score,W/2,296);
    ctx.fillStyle='rgba(255,255,255,0.85)';ctx.font='20px sans-serif';ctx.fillText('アウト '+outs+'   BEST '+best,W/2,336);
    ctx.fillStyle='#8ff0b8';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で もう一度',W/2,408);
  }

  if(flash>0.02){ctx.globalAlpha=flash*0.5;ctx.fillStyle=flashCol;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}
  ctx.restore();

  ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,0.4)';ctx.font='13px sans-serif';
  ctx.fillText('残る打球（フェア）は緑帯で捕って送球、切れる打球（ファウル）は見送り。3判断ミスで交代',W/2,H-8);
}

function frame(ts){let dt=ts-last;last=ts;if(dt>60)dt=60;if(dt<0)dt=0;update(dt);render();requestAnimationFrame(frame);}
requestAnimationFrame(frame);

// ---------- test hook ----------
window.__dl={
  start, field,
  get state(){return state;},
  get score(){return score;},
  get outs(){return outs;},
  get miss(){return miss;},
  get info(){return {state,phase, u:ball?ball.u:0, isFair:P?P.isFair:false, inReach: !!(ball&&phase==='roll'&&ball.u>=REACH_U0&&ball.u<=REACH_U1),
    reach0:REACH_U0, reach1:REACH_U1, off:ball?ball.off:0, result, outs, miss, lvl};}
};
})();
</script>
</body>
</html>
