<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>受けて反転、裏へ通せ (Turn and Thread)</title>
<style>
  html,body{margin:0;height:100%;background:#07100a;overflow:hidden;
    font-family:-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  #stage{position:relative;width:100vw;height:100vh;max-width:calc(100vh*1.5);max-height:calc(100vw/1.5);aspect-ratio:900/600;}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;border-radius:6px;}
</style>
</head>
<body>
<div id="wrap"><div id="stage"><canvas id="cv"></canvas></div></div>
<script>
(function(){
const W=900,H=600,cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let DPR=1;
function fit(){DPR=Math.min(2,window.devicePixelRatio||1);cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
fit();addEventListener('resize',fit);

// ---------- audio ----------
let AC=null;function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function tone(f,d,type,v,sweep){const a=ac();if(!a)return;const t=a.currentTime,o=a.createOscillator(),g=a.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(sweep)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+sweep),t+d);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v||0.2,t+0.008);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+0.02);}
function noise(d,v,hp){const a=ac();if(!a)return;const t=a.currentTime,n=Math.floor(a.sampleRate*d),buf=a.createBuffer(1,n,a.sampleRate),ch=buf.getChannelData(0);
  for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource();s.buffer=buf;
  const f=a.createBiquadFilter();f.type='highpass';f.frequency.value=hp||600;const g=a.createGain();g.gain.value=v||0.2;
  s.connect(f);f.connect(g);g.connect(a.destination);s.start(t);s.stop(t+d+0.02);}
const S={
  pass:()=>{tone(300,0.05,'sine',0.05);},
  control:()=>{tone(380,0.05,'sine',0.06);noise(0.02,0.05,500);},
  thread:()=>{noise(0.04,0.12,700);tone(300,0.06,'triangle',0.09,120);},
  good:()=>{[680,940,1220].forEach((f,i)=>setTimeout(()=>tone(f,0.11,'triangle',0.16),i*56));},
  big:()=>{[600,800,1000,1250].forEach((f,i)=>setTimeout(()=>tone(f,0.12,'triangle',0.17),i*80));},
  bad:()=>{noise(0.2,0.24,240);tone(150,0.24,'sawtooth',0.13,-50);},
  streak:()=>{[700,930,1170,1400].forEach((f,i)=>setTimeout(()=>tone(f,0.1,'triangle',0.16),i*60));},
  over:()=>{[440,330,247,175].forEach((f,i)=>setTimeout(()=>tone(f,0.3,'triangle',0.2),i*160));}
};

// ---------- geometry ----------
const GOAL={x:452,y:112}, GW=300, GH=64;
const LINE=272;                                  // the defensive line (offside line)
const YOU={x:452,y:396};                         // you (playmaker), back to goal
const PASSER={x:452,y:534};                      // teammate feeding a vertical pass
const MARKER={x:452,y:330};                      // defender marking you from behind
const RUN0={x:614,y:308}, RUNT={x:520,y:168};    // runner: breaks from onside into the space behind
const SLOT={x:544,y:214};                        // where the through-ball is threaded (ahead of the runner)
function runnerPos(u){ return {x:lerp(RUN0.x,RUNT.x,u), y:lerp(RUN0.y,RUNT.y,u)}; }

// ---------- state ----------
let state='title', phase='control', t=0, plays=0;
let score=0, combo=0, best=+(localStorage.getItem('tt_best')||0);
let outs=0, fails=0, lvl=1;   // outs = clean through-balls (chances created)
let clock=0, controlIdeal=540, controlW=140, threadIdeal=300, threadW=130, controlGrace=90;
let acted=false, controlled=false, ctrlAt=0, result=null, resultT=0, msg='', animU=0, quick=false;
let shake=0, flash=0, flashCol='#fff', last=performance.now();
let parts=[], pops=[];

function rnd(a,b){return a+Math.random()*(b-a);}
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function lerp(a,b,u){return a+(b-a)*u;}
function easeOut(u){return 1-Math.pow(1-u,2);}

function params(){ return {
  controlIdeal:rnd(440,640)-lvl*6,
  controlW:Math.max(90,150-lvl*8),
  threadIdeal:rnd(250,360),
  threadW:Math.max(90,150-lvl*8)
};}

function reset(){state='title';score=0;combo=0;outs=0;fails=0;lvl=1;plays=0;result=null;parts=[];pops=[];}
function newPlay(){
  plays++; lvl=Math.min(7,1+Math.floor(outs/4));
  const p=params(); controlIdeal=Math.max(300,p.controlIdeal); controlW=p.controlW; threadIdeal=p.threadIdeal; threadW=p.threadW;
  phase='control'; clock=0; acted=false; controlled=false; ctrlAt=0; result=null; resultT=0; msg=''; animU=0; quick=false;
  S.pass();
}
function start(){ if(!ac())ac(); if(AC&&AC.state==='suspended')AC.resume(); reset(); state='play'; newPlay(); }

function act(){
  if(state==='title'){start();return;}
  if(state==='over'){ if(resultT>0.4){reset();start();} return; }
  if(state!=='play') return;
  if(phase==='control'&&!controlled){
    const err=clock-controlIdeal;
    if(err< -controlW){ acted=true; resolve('earlyControl'); return; }   // stab at it early -> heavy touch, lose it
    if(err>  controlW){ acted=true; resolve('lateControl'); return; }     // ball runs past / marker nicks it
    controlled=true; ctrlAt=clock; S.control(); phase='thread'; clock=0;  // clean first touch + turn -> ball set, facing up
    return;
  }
  if(phase==='thread'&&!acted){
    const err=clock-threadIdeal;
    if(err< -threadW){ acted=true; resolve('earlyThread'); return; } // release before the runner breaks -> offside / to the DF
    if(err>  threadW){ acted=true; resolve('lateThread'); return; }  // hold too long -> DF recovers / closed down
    acted=true; quick=Math.abs(err)<=threadW*0.4; resolve('through');
    return;
  }
}

function resolve(k){
  phase='result'; result=k; resultT=0; animU=0;
  if(k==='through'){
    outs++; combo++;
    let add=Math.round((quick?240:150)*(1+Math.min(9,combo-1)*0.14)); score+=add;
    S.thread(); setTimeout(S.good,110); if(quick)setTimeout(S.big,190);
    flash=1;flashCol='#8affa0';shake=7; burst(SLOT.x,SLOT.y,'#8affa0',20,8);
    pop(W/2,250,(quick?'完璧な反転から絶妙のスルーパス——決定機を演出！ +':'反転して裏へ通した——味方が抜け出した！ +')+add,'#d6ffe0');
    if(combo>=2)pop(W/2,214,'コンボ x'+combo,'#ffd24d');
    if(combo>0&&combo%5===0)S.streak();
    msg=quick?'背負ったボールをワンタッチで反転、間髪入れず最終ラインの隙間へ通した絶妙のスルーパス——味方が完全に抜け出した！':'落ち着いて反転し、走り込む味方の足元へピタリのスルーパス——決定機を演出した！';
  } else {
    fails++; combo=0; flash=1;flashCol='#ff5b5b';shake=8; S.bad();
    if(k==='earlyControl') msg='トラップが早い…来る前に足を出して大きく弾き、背後のマークに奪われた（コントロールミス）';
    else if(k==='lateControl') msg='収めるのが遅い…縦パスが足元を通り過ぎ、寄せたマークに引っ掛けられた';
    else if(k==='earlyThread') msg='出すのが早い…味方が抜け出す前に通し、オフサイド（または相手の足元）になった';
    else msg='出すのが遅い…もたついている間に最終ラインが戻り、パスコースを消されてカットされた';
    pop(W/2,250,(k==='earlyControl'||k==='lateControl')?'コントロールミス…':'スルーパス失敗…','#ffb0b0');
  }
  if(fails>=3){ state='over'; resultT=0; S.over(); if(score>best){best=score;localStorage.setItem('tt_best',best);} }
}

// ---------- input ----------
cv.addEventListener('pointerdown',e=>{e.preventDefault();act();});
addEventListener('keydown',e=>{ if(e.repeat)return; if(e.code==='Space'||e.code==='Enter'||e.code==='ArrowUp'||e.code==='KeyF'){e.preventDefault();act();} });

// ---------- particles ----------
function burst(x,y,c,n,sp){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=rnd(sp*0.3,sp);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:1,c});}}
function pop(x,y,txt,c){pops.push({x,y,txt,c,life:1});}

// ---------- update ----------
function update(dt){
  shake*=Math.pow(0.86,dt/16.7); if(shake<0.3)shake=0;
  flash*=Math.pow(0.9,dt/16.7);
  for(const p of parts){p.vx*=0.96;p.vy=p.vy*0.96+0.28;p.x+=p.vx*dt/16.7;p.y+=p.vy*dt/16.7;p.life-=dt/16.7*0.026;}
  parts=parts.filter(p=>p.life>0);
  for(const p of pops){p.y-=dt/16.7*0.5;p.life-=dt/16.7*0.02;}
  pops=pops.filter(p=>p.life>0);

  if(state!=='play'){ if(state==='over')resultT+=dt/1000; return; }
  t+=dt;
  if(phase==='control'){ clock+=dt; if(!acted && clock>controlIdeal+controlW+controlGrace){ acted=true; resolve('lateControl'); } return; }
  if(phase==='thread'){ clock+=dt; if(!acted && clock>threadIdeal+threadW){ acted=true; resolve('lateThread'); } return; }
  if(phase==='result'){ resultT+=dt/1000; animU=Math.min(1,animU+dt/560); if(resultT>1.5 && state==='play') newPlay(); return; }
}

// ---------- render ----------
function drawField(){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#0f5e34');g.addColorStop(0.55,'#0e5230');g.addColorStop(1,'#0c4429');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='rgba(255,255,255,0.03)';for(let i=0;i<6;i++){ if(i%2===0)ctx.fillRect(0,70+i*95,W,95); }
  ctx.strokeStyle='rgba(255,255,255,0.26)';ctx.lineWidth=3;ctx.strokeRect(GOAL.x-240,GOAL.y+GH,480,220);
  ctx.fillStyle='rgba(0,0,0,0.28)';ctx.fillRect(GOAL.x-GW/2-4,GOAL.y-4,GW+8,GH+4);
  ctx.strokeStyle='rgba(255,255,255,0.34)';ctx.lineWidth=1;
  for(let gx=GOAL.x-GW/2;gx<=GOAL.x+GW/2;gx+=16){ctx.beginPath();ctx.moveTo(gx,GOAL.y);ctx.lineTo(gx,GOAL.y+GH);ctx.stroke();}
  ctx.strokeStyle='#f2f2f2';ctx.lineWidth=6;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(GOAL.x-GW/2,GOAL.y+GH);ctx.lineTo(GOAL.x-GW/2,GOAL.y);ctx.lineTo(GOAL.x+GW/2,GOAL.y);ctx.lineTo(GOAL.x+GW/2,GOAL.y+GH);ctx.stroke();
  ctx.lineCap='butt';
  // defensive line
  ctx.strokeStyle='rgba(255,255,255,0.16)';ctx.setLineDash([7,9]);ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(120,LINE);ctx.lineTo(780,LINE);ctx.stroke();ctx.setLineDash([]);
}
function person(x,y,col,s,lean){s=s||1;lean=lean||0;
  ctx.save();ctx.translate(x,y);ctx.rotate(lean);
  ctx.fillStyle='rgba(0,0,0,0.2)';ctx.beginPath();ctx.ellipse(0,13*s,10*s,4*s,0,0,6.28);ctx.fill();
  ctx.fillStyle=col;ctx.beginPath();ctx.ellipse(0,-14*s,9*s,14*s,0,0,6.28);ctx.fill();
  ctx.fillStyle='#f0c9a0';ctx.beginPath();ctx.arc(0,-31*s,7*s,0,6.28);ctx.fill();
  ctx.restore();
}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

function render(){
  ctx.save();
  if(shake>0)ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
  drawField();

  if(state==='play'||state==='over'){
    // runner making his run behind the line
    let ru;
    if(phase==='control') ru=clamp(clock/(controlIdeal+controlW)*0.34,0,0.34);
    else if(phase==='thread') ru=clamp(0.34+clock/(threadIdeal+threadW)*0.34,0.34,0.68);
    else { const u=easeOut(animU); ru=(result==='through')? clamp(0.68+u*0.32,0,1) : 0.62; }
    const rp=runnerPos(ru);
    person(rp.x,rp.y,'#3aa0ff',0.94,0);

    // marker (behind you) + passer
    person(MARKER.x, MARKER.y, '#c85049',0.95,0);
    person(PASSER.x, PASSER.y, '#3aa0ff',0.85,0);

    // you (playmaker) — back to goal, then turn to face up on the thread
    let youLean=0;
    if(phase==='thread') youLean=Math.PI;               // turned to face up-field
    else if(phase==='result') youLean=Math.PI;
    person(YOU.x, YOU.y, '#2b6fd6', 1.02, 0);

    // ball
    let b;
    if(phase==='control'){ const u=clamp(clock/controlIdeal,0,1); b={x:lerp(PASSER.x,YOU.x,u), y:lerp(PASSER.y,YOU.y+6,u)}; }
    else if(phase==='thread'){ b={x:YOU.x-2, y:YOU.y-6 - Math.max(0,4*Math.sin(clock/90))}; }
    else {
      const u=easeOut(animU);
      if(result==='through'){ b={x:lerp(YOU.x,SLOT.x,u), y:lerp(YOU.y,SLOT.y,u)}; }
      else if(result==='earlyControl'){ b={x:lerp(YOU.x,YOU.x+70,u), y:lerp(YOU.y,YOU.y+40,u)}; }
      else if(result==='lateControl'){ b={x:lerp(YOU.x,MARKER.x,u), y:lerp(YOU.y,MARKER.y,u)}; }
      else if(result==='earlyThread'){ b={x:lerp(YOU.x,MARKER.x+30,u), y:lerp(YOU.y,LINE,u)}; }
      else { b={x:lerp(YOU.x,LINE<YOU.y?452:452,u), y:lerp(YOU.y,LINE,u)}; }
    }
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(b.x,b.y,8,0,6.28);ctx.fill();
    ctx.strokeStyle='#333';ctx.lineWidth=1.1;ctx.beginPath();ctx.arc(b.x,b.y,8,0.4,2.2);ctx.stroke();

    // banner + timing bar (per phase)
    ctx.textAlign='center';
    if(state==='play'&&(phase==='control'||phase==='thread')){
      const ideal=(phase==='control')?controlIdeal:threadIdeal, ww=(phase==='control')?controlW:threadW;
      const near=Math.abs(clock-ideal)<=ww;
      ctx.fillStyle=near?'rgba(140,255,160,0.98)':'rgba(255,220,90,0.96)';ctx.font='bold 21px sans-serif';
      ctx.fillText(phase==='control'?(near?'今だ！ 止めて反転！':'背負って縦パスを受ける——足元でピタリと収めろ')
                                    :(near?'今だ！ 裏へ通せ！':'反転した——走り込む味方の抜け出しに合わせて通せ'),W/2,44);
      const bw=280,x=W/2-bw/2,y=60;
      const wl=x+bw*clamp((ideal-ww)/(ideal+ww),0,1), wwid=bw*(2*ww/(ideal+ww));
      ctx.fillStyle='rgba(255,255,255,0.15)';ctx.fillRect(x,y,bw,8);
      ctx.fillStyle='rgba(120,255,150,0.5)';ctx.fillRect(wl,y,wwid,8);
      const px=x+bw*clamp(clock/(ideal+ww),0,1);
      ctx.fillStyle='#ffe14d';ctx.fillRect(px-2,y-3,4,14);
      ctx.font='12px sans-serif';ctx.fillStyle='rgba(255,255,255,0.6)';
      ctx.fillText(phase==='control'?'① トラップ＆反転  →  ② スルーパス':'① トラップ＆反転 ✓  →  ② スルーパス',W/2,y+28);
    }
  }

  for(const p of parts){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,3.2,0,6.28);ctx.fill();}
  ctx.globalAlpha=1;
  for(const p of pops){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.font='bold 21px sans-serif';ctx.textAlign='center';ctx.fillText(p.txt,p.x,p.y);}
  ctx.globalAlpha=1;

  // HUD
  ctx.textAlign='left';ctx.fillStyle='#fff';ctx.font='bold 26px sans-serif';ctx.fillText('SCORE '+score,20,36);
  ctx.textAlign='right';ctx.fillStyle='rgba(255,255,255,0.9)';ctx.font='14px sans-serif';ctx.fillText('決定機 '+outs+'  Lv'+lvl,W-20,24);
  ctx.fillText('失敗',W-92,46);
  for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(W-60+i*20,41,7,0,6.28);ctx.fillStyle=i<fails?'#ff5b5b':'rgba(255,255,255,0.25)';ctx.fill();}
  if(combo>=2){ctx.textAlign='center';ctx.fillStyle='#ffd24d';ctx.font='bold 18px sans-serif';ctx.fillText('コンボ x'+combo,W/2,110);}

  if(state==='play'&&phase==='result'&&msg){ctx.textAlign='center';ctx.fillStyle=result==='through'?'#9ff0b8':'#ff9a9a';ctx.font='bold 15px sans-serif';ctx.fillText(msg,W/2,470);}

  if(state==='title'){
    ctx.fillStyle='rgba(3,10,6,0.84)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='bold 38px sans-serif';ctx.fillText('受けて反転、裏へ通せ',W/2,80);
    ctx.fillStyle='#ffd23e';ctx.font='bold 22px sans-serif';ctx.fillText('Turn and Thread',W/2,116);
    ctx.fillStyle='rgba(255,255,255,0.92)';ctx.font='16px sans-serif';
    ctx.fillText('背負って縦パスを受ける司令塔として、止めて反転し、走り込む味方の抜け出しにスルーパスを通す2拍の連係',W/2,172);
    ctx.fillStyle='rgba(255,255,255,0.66)';ctx.font='14px sans-serif';
    ctx.fillText('① 縦パスが足元に来る緑帯でタップ/クリック/SPACE＝トラップ＆反転（早いと弾き・遅いとマークに引っ掛かる）',W/2,212);
    ctx.fillText('② 反転後、走り込む味方が抜け出す緑帯でもう一度＝スルーパス（早いとオフサイド・遅いとラインが戻る）',W/2,236);
    ctx.fillText('止めて即通すほど（quick）絶妙の決定機演出で大量加点＆コンボ',W/2,260);
    ctx.fillText('上級ほどパスが速く帯が短い。3失敗で交代',W/2,284);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で開始',W/2,350);
    ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='14px sans-serif';ctx.fillText('BEST '+best,W/2,382);
  }
  if(state==='over'){
    ctx.fillStyle='rgba(3,10,6,0.86)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#ff6b6b';ctx.font='bold 46px sans-serif';ctx.fillText('3失敗…交代',W/2,222);
    ctx.fillStyle='#fff';ctx.font='bold 40px sans-serif';ctx.fillText('SCORE '+score,W/2,290);
    ctx.fillStyle='rgba(255,255,255,0.85)';ctx.font='19px sans-serif';ctx.fillText('決定機 '+outs+'   BEST '+best,W/2,330);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で もう一度',W/2,402);
  }

  if(flash>0.02){ctx.globalAlpha=flash*0.5;ctx.fillStyle=flashCol;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}
  ctx.restore();

  ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,0.4)';ctx.font='12px sans-serif';
  ctx.fillText('受けて反転、裏へ通せ：①縦パスを止めて反転→②走り込む味方へスルーパス、の2拍。各段の早い/遅いは失敗、3失敗で交代',W/2,H-8);
}

function frame(ts){let dt=ts-last;last=ts;if(dt>60)dt=60;if(dt<0)dt=0;update(dt);render();requestAnimationFrame(frame);}
requestAnimationFrame(frame);

// ---------- test hook ----------
window.__tt={
  start, act:()=>act(),
  get state(){return state;},
  get score(){return score;},
  get outs(){return outs;},
  get fails(){return fails;},
  get info(){return {state,phase,clock,controlIdeal,controlW,threadIdeal,threadW,controlled,acted,result,outs,fails,lvl,
    inControl:(phase==='control'&&clock>=controlIdeal-controlW&&clock<=controlIdeal+controlW),
    inThread:(phase==='thread'&&clock>=threadIdeal-threadW&&clock<=threadIdeal+threadW),
    canAct:((phase==='control'&&!controlled)||(phase==='thread'&&!acted))};}
};
})();
</script>
</body>
</html>
