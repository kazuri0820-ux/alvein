<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>バックパス処理 (Back-Pass Under Pressure)</title>
<style>
  html,body{margin:0;height:100%;background:#06120a;overflow:hidden;
    font-family:-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  #stage{position:relative;width:100vw;height:100vh;max-width:calc(100vh*1.5);max-height:calc(100vw/1.5);aspect-ratio:900/600;}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;border-radius:6px;}
</style>
</head>
<body>
<div id="wrap"><div id="stage"><canvas id="cv"></canvas></div></div>
<script>
(function(){
const W=900,H=600,cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let DPR=1;
function fit(){DPR=Math.min(2,window.devicePixelRatio||1);cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
fit();addEventListener('resize',fit);

// ---------- audio ----------
let AC=null;function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function tone(f,d,type,v,sweep){const a=ac();if(!a)return;const t=a.currentTime,o=a.createOscillator(),g=a.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(sweep)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+sweep),t+d);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v||0.2,t+0.008);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+0.02);}
function noise(d,v,hp){const a=ac();if(!a)return;const t=a.currentTime,n=Math.floor(a.sampleRate*d),buf=a.createBuffer(1,n,a.sampleRate),ch=buf.getChannelData(0);
  for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource();s.buffer=buf;
  const f=a.createBiquadFilter();f.type='highpass';f.frequency.value=hp||600;const g=a.createGain();g.gain.value=v||0.2;
  s.connect(f);f.connect(g);g.connect(a.destination);s.start(t);s.stop(t+d+0.02);}
const S={
  roll:()=>{tone(220,0.08,'sine',0.05,60);},
  trap:()=>{noise(0.04,0.1,500);tone(320,0.05,'sine',0.06);},
  clear:()=>{noise(0.05,0.16,500);tone(240,0.06,'square',0.09,-70);},
  good:()=>{[680,940,1220].forEach((f,i)=>setTimeout(()=>tone(f,0.1,'triangle',0.16),i*55));},
  big:()=>{[620,840,1080,1360].forEach((f,i)=>setTimeout(()=>tone(f,0.12,'triangle',0.17),i*80));},
  bad:()=>{noise(0.18,0.22,300);tone(150,0.22,'sawtooth',0.12,-40);},
  streak:()=>{[700,930,1170,1400].forEach((f,i)=>setTimeout(()=>tone(f,0.1,'triangle',0.16),i*60));},
  over:()=>{[440,330,247,175].forEach((f,i)=>setTimeout(()=>tone(f,0.3,'triangle',0.2),i*160));}
};

// ---------- geometry ----------
const GK={x:450,y:452}, PASSFROM={x:450,y:150};
const MATE={l:{x:150,y:230}, r:{x:750,y:230}};

// ---------- state ----------
let state='title', phase='incoming', plays=0;
let score=0, combo=0, best=+(localStorage.getItem('bp_best')||0);
let outs=0, fails=0, lvl=1;      // outs = clean clearances
let t=0, ctrlT=490, cw=450, clrT=270, clw=460, openSide=1, tough=false;
let controlled=false, decided=false, result=null, resultT=0, msg='', msgOk=false, clrAt=0, clrDir=0;
let strikerU=0, ballOutU=0;
let shake=0, flash=0, flashCol='#fff', last=performance.now();
let parts=[], pops=[];

function rnd(a,b){return a+Math.random()*(b-a);}
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function lerp(a,b,u){return a+(b-a)*u;}
function easeOut(u){return 1-Math.pow(1-u,2);}

function reset(){state='title';score=0;combo=0;outs=0;fails=0;lvl=1;plays=0;result=null;parts=[];pops=[];}

function newPlay(){
  plays++; lvl=Math.min(7,1+Math.floor(outs/4));
  ctrlT=clamp(500-lvl*20,360,500);
  cw=clamp(460-lvl*22,330,460);
  clrT=clamp(280-lvl*8,220,280);
  clw=clamp(470-lvl*24,340,470);
  tough=Math.random()<clamp(0.18+lvl*0.05,0.18,0.5);
  openSide=(Math.random()<0.5?-1:1);
  phase='incoming'; t=0; controlled=false; decided=false; result=null; resultT=0; msg=''; msgOk=false; clrAt=0; clrDir=0;
  strikerU=0; ballOutU=0;
  S.roll();
}
function start(){ if(!ac())ac(); if(AC&&AC.state==='suspended')AC.resume(); reset(); state='play'; newPlay(); }

function act(dir){
  if(state==='title'){start();return;}
  if(state==='over'){ if(resultT>0.4){reset();start();} return; }
  if(state!=='play'||decided) return;
  if(phase==='incoming'){
    if(t<ctrlT){ resolve('miscontrol'); return; }
    if(t<=ctrlT+cw){ controlled=true; phase='clear'; t=0; S.trap(); flash=0.4;flashCol='#bfe9ff'; return; }
  } else if(phase==='clear'){
    if(dir===0||dir==null) return;   // clearing needs a direction
    clrDir=dir;
    if(t<clrT){ clrAt=t; resolve('rushed'); return; }
    if(t<=clrT+clw){ clrAt=t; resolve(dir===openSide?'good':'wrong'); return; }
    clrAt=t; resolve('blocked');
  }
}

function resolve(k){
  decided=true; result=k; resultT=0;
  if(k==='good'){
    phase='result';
    outs++; combo++;
    const snap=(clrAt<=clrT+clw*0.45);
    let base=tough?250:150; if(snap)base+=70;
    let add=Math.round(base*(1+Math.min(9,combo-1)*0.14)); score+=add;
    S.clear(); setTimeout(S.good,70); if(snap||tough)setTimeout(S.big,140);
    msgOk=true; flash=1;flashCol='#8affa0';shake=5; burst(openSide<0?MATE.l.x:MATE.r.x,230,'#8affa0',16,7);
    pop(GK.x,GK.y-70,(snap?'落ち着いて蹴り出した！ +':'クリア成功！ +')+add,'#d6ffe0');
    if(combo>=2)pop(W/2,150,'コンボ x'+combo,'#ffd24d');
    if(combo>0&&combo%5===0)S.streak();
    msg=snap?'プレスを呼び込んでから逆の空いた味方へ——冷静なビルドアップ':'寄せられる前に空いたサイドの味方へクリア——ピンチ脱出！';
  } else {
    phase='result';
    fails++; combo=0; msgOk=false; flash=1;flashCol='#ff5b5b';shake=9; S.bad();
    if(k==='miscontrol'){ msg='トラップが早い…転がるボールに足を出して弾いてしまった'; pop(GK.x,GK.y-50,'トラップミス…','#ffb0b0'); }
    else if(k==='past'){ msg='遅い…処理が遅れて突っ込んできたFWにかすめ取られた'; pop(GK.x,GK.y-50,'奪われた…','#ffb0b0'); }
    else if(k==='rushed'){ msg='慌てた…トラップ直後に蹴り急いでミスキック'; pop(GK.x,GK.y-40,'ミスキック…','#ffb0b0'); }
    else if(k==='wrong'){ msg='逆…FWが詰めている側へ蹴ってブロックされた（大ピンチ）'; pop(openSide<0?MATE.r.x:MATE.l.x,230,'ブロック…','#ffb0b0'); }
    else { msg='クリアが遅い…FWに寄せ切られてチャージダウンされた'; pop(GK.x,GK.y-40,'詰められた…','#ffb0b0'); }
  }
  if(fails>=3){ state='over'; resultT=0; setTimeout(S.over,200); if(score>best){best=score;localStorage.setItem('bp_best',best);} }
}

// ---------- input ----------
cv.addEventListener('pointerdown',e=>{e.preventDefault();
  if(state!=='play'){ act(0); return; }
  if(phase==='clear'){ const r=cv.getBoundingClientRect(); const x=(e.clientX-r.left)/r.width*W; act(x<W/2?-1:1); }
  else act(0);
});
addEventListener('keydown',e=>{ if(e.repeat)return;
  if(e.code==='ArrowLeft'||e.code==='KeyA'){e.preventDefault();act(-1);}
  else if(e.code==='ArrowRight'||e.code==='KeyD'){e.preventDefault();act(1);}
  else if(e.code==='Space'||e.code==='Enter'||e.code==='ArrowUp'){e.preventDefault(); if(state!=='play')act(0); else if(phase==='incoming')act(0); } });

// ---------- particles ----------
function burst(x,y,c,n,sp){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=rnd(sp*0.3,sp);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:1,c});}}
function pop(x,y,txt,c){pops.push({x,y,txt,c,life:1});}

// ---------- update ----------
function update(dt){
  shake*=Math.pow(0.86,dt/16.7); if(shake<0.3)shake=0;
  flash*=Math.pow(0.9,dt/16.7);
  for(const p of parts){p.vx*=0.96;p.vy=p.vy*0.96+0.28;p.x+=p.vx*dt/16.7;p.y+=p.vy*dt/16.7;p.life-=dt/16.7*0.026;}
  parts=parts.filter(p=>p.life>0);
  for(const p of pops){p.y-=dt/16.7*0.5;p.life-=dt/16.7*0.02;}
  pops=pops.filter(p=>p.life>0);

  if(state!=='play'){ if(state==='over')resultT+=dt/1000; return; }
  if(phase==='incoming'){ t+=dt;
    strikerU=clamp(t/(ctrlT+cw+clrT+clw*0.5),0,1);
    if(!decided&&!controlled&&t>ctrlT+cw){ resolve('past'); }
    return; }
  if(phase==='clear'){ t+=dt;
    strikerU=clamp(strikerU+dt/(clrT+clw+200)*0.42,0,1);
    if(!decided&&t>clrT+clw){ resolve('blocked'); }
    return; }
  if(phase==='result'){ resultT+=dt/1000;
    if(result==='good') ballOutU=Math.min(1,ballOutU+dt/300);
    else if(result==='wrong'||result==='blocked'||result==='past') strikerU=Math.min(1,strikerU+dt/400);
    if(resultT>1.5) newPlay(); return; }
}

// ---------- render ----------
function drawField(){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#0f5e34');g.addColorStop(0.5,'#12703f');g.addColorStop(1,'#0c4c2b');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  for(let i=0;i<7;i++){ctx.fillStyle=i%2?'rgba(255,255,255,0.03)':'rgba(0,0,0,0.03)';ctx.fillRect(0,i*90,W,90);}
  // own goal + box at bottom
  ctx.strokeStyle='rgba(255,255,255,0.3)';ctx.lineWidth=3;ctx.strokeRect(250,500,400,90);
  ctx.strokeStyle='#f2f2f2';ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(370,588);ctx.lineTo(370,556);ctx.lineTo(530,556);ctx.lineTo(530,588);ctx.stroke();
}
function person(x,y,col,s,label,lcol){s=s||1;
  ctx.fillStyle=col;ctx.beginPath();ctx.ellipse(x,y-16*s,11*s,18*s,0,0,6.28);ctx.fill();
  ctx.fillStyle='#f0c9a0';ctx.beginPath();ctx.arc(x,y-38*s,8.5*s,0,6.28);ctx.fill();
  if(label){ctx.fillStyle=lcol||'rgba(255,255,255,0.7)';ctx.font='11px sans-serif';ctx.textAlign='center';ctx.fillText(label,x,y-54*s);}
}

function render(){
  ctx.save();
  if(shake>0)ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
  drawField();

  if(state==='play'||state==='over'){
    // teammates on the flanks: open side green, covered side has an opponent
    const openMate=openSide<0?MATE.l:MATE.r, covMate=openSide<0?MATE.r:MATE.l;
    person(openMate.x,openMate.y,'#2b6fd6',0.9,'味方(空)','rgba(150,255,170,0.9)');
    person(covMate.x-18,covMate.y,'#2b6fd6',0.9,null);
    person(covMate.x+14,covMate.y-4,'#d0403a',0.9,'相手','rgba(255,150,140,0.9)');

    // GK
    person(GK.x,GK.y,'#23c36a',1);
    ctx.fillStyle='#ffe14d';ctx.beginPath();ctx.arc(GK.x-15,GK.y-24,6,0,6.28);ctx.fill();ctx.beginPath();ctx.arc(GK.x+15,GK.y-24,6,0,6.28);ctx.fill();

    // charging striker (from top, behind ball)
    const sx=lerp(PASSFROM.x,GK.x,strikerU*0.9), sy=lerp(PASSFROM.y-40,GK.y-40,strikerU);
    person(sx,sy,'#d0403a',0.95,'FW詰め','rgba(255,150,140,0.9)');

    // ball
    let bx,by;
    if(phase==='incoming'){ const u=clamp(t/ctrlT,0,1); bx=lerp(PASSFROM.x,GK.x,u); by=lerp(PASSFROM.y,GK.y-8,u); }
    else if(phase==='clear'||(phase==='result'&&result==='good')){
      if(phase==='result'&&result==='good'){ const u=easeOut(ballOutU); const tgt=openSide<0?MATE.l:MATE.r; bx=lerp(GK.x,tgt.x,u); by=lerp(GK.y-8,tgt.y,u)-Math.sin(u*Math.PI)*30; }
      else { bx=GK.x; by=GK.y-8; }
    }
    else if(phase==='result'&&result==='wrong'){ const u=easeOut(ballOutU); const tgt=openSide<0?MATE.r:MATE.l; bx=lerp(GK.x,tgt.x,u); by=lerp(GK.y-8,tgt.y,u); }
    else { bx=GK.x; by=GK.y-8; }
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(bx,by,8,0,6.28);ctx.fill();
    ctx.strokeStyle='#222';ctx.lineWidth=1.2;ctx.beginPath();ctx.moveTo(bx-5,by-3);ctx.lineTo(bx+3,by-6);ctx.lineTo(bx+6,by);ctx.lineTo(bx+2,by+5);ctx.lineTo(bx-5,by+4);ctx.closePath();ctx.stroke();

    // window rings
    if(phase==='incoming'&&t>=ctrlT&&t<=ctrlT+cw){ ctx.strokeStyle='rgba(140,255,160,0.9)';ctx.lineWidth=3;ctx.beginPath();ctx.arc(GK.x,GK.y-8,17,0,6.28);ctx.stroke(); }
    if(phase==='clear'&&t>=clrT&&t<=clrT+clw){ const tgt=openSide<0?MATE.l:MATE.r;
      ctx.strokeStyle='rgba(140,255,160,0.85)';ctx.lineWidth=3;ctx.beginPath();ctx.arc(tgt.x,tgt.y,20,0,6.28);ctx.stroke();
      ctx.strokeStyle='rgba(140,255,160,0.35)';ctx.setLineDash([6,7]);ctx.beginPath();ctx.moveTo(GK.x,GK.y-8);ctx.lineTo(tgt.x,tgt.y);ctx.stroke();ctx.setLineDash([]); }

    // cue + timer
    ctx.textAlign='center';
    if(state==='play'&&phase==='incoming'){
      if(t<ctrlT){ ctx.fillStyle='rgba(255,220,90,0.95)';ctx.font='bold 20px sans-serif';ctx.fillText('危険なバックパス！ FWが詰めてくる——まずトラップで収めろ',W/2,46); }
      else { ctx.fillStyle='rgba(150,255,170,0.98)';ctx.font='bold 22px sans-serif';ctx.fillText('今だ！ トラップ！',W/2,46); bar((t-ctrlT)/cw); }
    } else if(state==='play'&&phase==='clear'){
      ctx.fillStyle='rgba(150,255,170,0.98)';ctx.font='bold 22px sans-serif';ctx.fillText('空いた味方へクリア！  '+(openSide<0?'← 左':'右 →'),W/2,46);
      if(t>=clrT) bar((t-clrT)/clw);
    }
    if(state==='play'){ ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='12px sans-serif';ctx.textAlign='center';
      ctx.fillText('タップ／SPACE：① トラップ　→　タップ左右／←→：② 空いたサイドへクリア（2ビート）',W/2,H-14); }
  }

  for(const p of parts){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,3.2,0,6.28);ctx.fill();}
  ctx.globalAlpha=1;
  for(const p of pops){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.font='bold 21px sans-serif';ctx.textAlign='center';ctx.fillText(p.txt,p.x,p.y);}
  ctx.globalAlpha=1;

  // HUD
  ctx.textAlign='left';ctx.fillStyle='#fff';ctx.font='bold 26px sans-serif';ctx.fillText('SCORE '+score,20,36);
  ctx.textAlign='right';ctx.fillStyle='rgba(255,255,255,0.9)';ctx.font='14px sans-serif';ctx.fillText('クリア '+outs+'  Lv'+lvl,W-20,24);
  ctx.fillText('失',W-92,46);
  for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(W-60+i*20,41,7,0,6.28);ctx.fillStyle=i<fails?'#ff5b5b':'rgba(255,255,255,0.25)';ctx.fill();}
  if(combo>=2){ctx.textAlign='center';ctx.fillStyle='#ffd24d';ctx.font='bold 18px sans-serif';ctx.fillText('コンボ x'+combo,W/2,110);}

  if(state==='play'&&phase==='result'&&msg){ctx.textAlign='center';ctx.fillStyle=msgOk?'#9ff0b8':'#ff9a9a';ctx.font='bold 16px sans-serif';ctx.fillText(msg,W/2,H-40);}

  if(state==='title'){
    ctx.fillStyle='rgba(4,10,7,0.82)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='bold 38px sans-serif';ctx.fillText('バックパス処理',W/2,90);
    ctx.fillStyle='#ffd23e';ctx.font='bold 20px sans-serif';ctx.fillText('Back-Pass Under Pressure',W/2,124);
    ctx.fillStyle='rgba(255,255,255,0.92)';ctx.font='16px sans-serif';
    ctx.fillText('味方からの危険なバックパス。FWに詰められる前に落ち着いて処理し、空いたサイドへ蹴り出せ',W/2,180);
    ctx.fillStyle='rgba(255,255,255,0.66)';ctx.font='14px sans-serif';
    ctx.fillText('①転がるボールが足元に収まる“緑リング”でトラップ（タップ／SPACE）＝早いと弾く・遅いと奪われる',W/2,218);
    ctx.fillText('②収めたら、相手がいない“空いた味方”のサイドへクリア（タップ左右／←→）を緑リングのタイミングで',W/2,242);
    ctx.fillText('相手が詰める側へ蹴るとブロック、蹴り急ぐとミスキック、遅いとチャージダウン。素早い処理は加点',W/2,266);
    ctx.fillText('上級ほどFWの寄せが速く猶予も短い。3失敗で交代',W/2,290);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で開始',W/2,356);
    ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='14px sans-serif';ctx.fillText('BEST '+best,W/2,388);
  }
  if(state==='over'){
    ctx.fillStyle='rgba(4,10,7,0.84)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#ff6b6b';ctx.font='bold 46px sans-serif';ctx.fillText('3失敗…交代',W/2,224);
    ctx.fillStyle='#fff';ctx.font='bold 40px sans-serif';ctx.fillText('SCORE '+score,W/2,292);
    ctx.fillStyle='rgba(255,255,255,0.85)';ctx.font='19px sans-serif';ctx.fillText('クリア '+outs+'   BEST '+best,W/2,332);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で もう一度',W/2,404);
  }

  if(flash>0.02){ctx.globalAlpha=flash*0.5;ctx.fillStyle=flashCol;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}
  ctx.restore();

  ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,0.4)';ctx.font='12px sans-serif';
  ctx.fillText('バックパス処理：①緑リングでトラップ→②空いた味方のサイドへ緑リングでクリア。早トラップ/被奪取/逆方向/蹴り急ぎ/遅れは失敗、3つで交代',W/2,H-2);
}
function bar(p){p=clamp(p,0,1);const bw=250,x=W/2-bw/2,y=58;
  ctx.fillStyle='rgba(255,255,255,0.18)';ctx.fillRect(x,y,bw,7);
  ctx.fillStyle=p<0.45?'#8affa0':(p<1?'#ffd24d':'#ff5b5b');ctx.fillRect(x,y,bw*p,7);}

function frame(ts){let dt=ts-last;last=ts;if(dt>60)dt=60;if(dt<0)dt=0;update(dt);render();requestAnimationFrame(frame);}
requestAnimationFrame(frame);

// ---------- test hook ----------
window.__bp={
  start, act:(d)=>act(d),
  get state(){return state;},
  get score(){return score;},
  get outs(){return outs;},
  get fails(){return fails;},
  get info(){return {state,phase,t,ctrlT,cw,clrT,clw,openSide,tough,controlled,decided,result,outs,fails,lvl,
    ctrlWin:(phase==='incoming'&&t>=ctrlT&&t<=ctrlT+cw),clearWin:(phase==='clear'&&t>=clrT&&t<=clrT+clw),
    canAct:((phase==='incoming'||phase==='clear')&&!decided)};}
};
})();
</script>
</body>
</html>
