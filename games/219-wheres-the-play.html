<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>送球判断 (Where's the Play)</title>
<style>
  html,body{margin:0;height:100%;background:#0b0f0a;overflow:hidden;
    font-family:-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  #stage{position:relative;width:100vw;height:100vh;max-width:calc(100vh*1.5);max-height:calc(100vw/1.5);aspect-ratio:900/600;}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;border-radius:6px;}
</style>
</head>
<body>
<div id="wrap"><div id="stage"><canvas id="cv"></canvas></div></div>
<script>
(function(){
const W=900,H=600,cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let DPR=1;
function fit(){DPR=Math.min(2,window.devicePixelRatio||1);cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
fit();addEventListener('resize',fit);

// ---------- audio ----------
let AC=null;function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function tone(f,d,type,v,sweep){const a=ac();if(!a)return;const t=a.currentTime,o=a.createOscillator(),g=a.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(sweep)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+sweep),t+d);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v||0.2,t+0.008);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+0.02);}
function noise(d,v,hp){const a=ac();if(!a)return;const t=a.currentTime,n=Math.floor(a.sampleRate*d),buf=a.createBuffer(1,n,a.sampleRate),ch=buf.getChannelData(0);
  for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource();s.buffer=buf;
  const f=a.createBiquadFilter();f.type='highpass';f.frequency.value=hp||600;const g=a.createGain();g.gain.value=v||0.2;
  s.connect(f);f.connect(g);g.connect(a.destination);s.start(t);s.stop(t+d+0.02);}
const S={
  throw:()=>{noise(0.03,0.1,900);tone(400,0.06,'sine',0.1,120);},
  out:()=>{noise(0.05,0.14,700);[720,960,1200].forEach((f,i)=>setTimeout(()=>tone(f,0.11,'triangle',0.18),i*70));},
  safe:()=>{noise(0.14,0.2,380);tone(200,0.16,'sawtooth',0.12,-60);},
  go:()=>{tone(520,0.05,'square',0.06);},
  streak:()=>{[660,880,1100,1320].forEach((f,i)=>setTimeout(()=>tone(f,0.1,'triangle',0.16),i*60));},
  over:()=>{[440,330,247,175].forEach((f,i)=>setTimeout(()=>tone(f,0.3,'triangle',0.2),i*160));}
};

// ---------- geometry ----------
const BASE={ home:{x:450,y:470}, first:{x:626,y:322}, second:{x:450,y:174}, third:{x:274,y:322} };
const NEXT={ home:'first', first:'second', second:'third', third:'home' };
const NAME={ home:'本', first:'一', second:'二', third:'三' };
const FIELDER={x:450,y:322};

// ---------- state ----------
let state='title', phase='play', t=0, plays=0;
let score=0, combo=0, best=+(localStorage.getItem('play_best')||0);
let outs=0, fails=0, lvl=1;
let clock=0, commitT=700, deadline=1300, playFrom='first', playBase='second', acted=false;
let runners=[], ball=null, throwTo=null;
let result=null, resultT=0, msg='';
let shake=0, flash=0, flashCol='#fff', last=performance.now();
let parts=[], pops=[];

function rnd(a,b){return a+Math.random()*(b-a);}
function ri(a,b){return Math.floor(rnd(a,b+1));}
function chance(p){return Math.random()<p;}
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function lerp(a,b,u){return a+(b-a)*u;}
function easeOut(u){return 1-Math.pow(1-u,2);}

function params(){ return { cLo:460, cHi:880, window:Math.max(300,660-lvl*48), decoys: lvl>=5?2:(lvl>=2?1:0), bluff:0.10+lvl*0.012 }; }

function reset(){state='title';score=0;combo=0;outs=0;fails=0;lvl=1;plays=0;result=null;parts=[];pops=[];}
function newPlay(){
  plays++; lvl=Math.min(7,1+Math.floor(outs/4));
  const p=params();
  const froms=['home','first','second','third'];
  playFrom=froms[ri(0,3)]; playBase=NEXT[playFrom];
  commitT=rnd(p.cLo,p.cHi); deadline=commitT+p.window;
  runners=[{from:playFrom,to:playBase,role:'play',prog:0,lead:0,bluffDir:1}];
  // decoys on other bases that bluff
  const others=froms.filter(b=>b!==playFrom && b!==playBase);
  for(let i=0;i<p.decoys && others.length;i++){ const b=others.splice(ri(0,others.length-1),1)[0];
    runners.push({from:b,to:NEXT[b],role:'decoy',prog:0,lead:0,bluffT:rnd(commitT-320,commitT-60)}); }
  clock=0; acted=false; ball=null; throwTo=null;
  result=null; phase='play'; msg='';
}
function start(){ if(!ac())ac(); if(AC&&AC.state==='suspended')AC.resume(); reset(); state='play'; newPlay(); }

function throwBase(base){
  if(state==='title'){start();return;}
  if(state==='over'){ if(resultT>0.4){reset();start();} return; }
  if(state!=='play'||phase!=='play'||acted) return;
  acted=true; throwTo=base; ball={x:FIELDER.x,y:FIELDER.y,p:0}; S.throw();
  if(clock<commitT) resolve('early');
  else if(base===playBase) resolve('out');
  else resolve('wrong');
}

function resolve(kind){
  phase='result'; result=kind; resultT=0;
  if(kind==='out'){
    outs++; combo++; const fast=(clock-commitT)<(deadline-commitT)*0.4;
    const add=Math.round((fast?150:100)*(1+Math.min(9,combo-1)*0.16)); score+=add;
    setTimeout(()=>S.out(),200); flash=1;flashCol='#ffe08a';shake=7;
    const b=BASE[playBase]; burst(b.x,b.y,'#ffe08a',18,6);
    pop(b.x,b.y-34,'アウト！ +'+add,'#fff3c4');
    if(fast)pop(b.x,b.y-58,'好判断！','#ffe08a');
    if(combo>=2)pop(b.x,b.y-10,'コンボ x'+combo,'#ffd24d');
    if(combo>0&&combo%5===0)S.streak();
    msg=NAME[playBase]+'塁で刺した！ ナイス送球判断';
  } else {
    fails++; combo=0; flash=1;flashCol='#ff5b5b';shake=8; S.safe();
    if(kind==='early') msg='早い！ 走り出す前（おとり）に投げて悪送球';
    else if(kind==='wrong') msg='投げ先が違う！ 本命の走者を見誤った';
    else msg='遅い！ 判断が遅れてセーフ';
    const b=BASE[playBase]; pop(b.x,b.y-30,'セーフ','#ffb0b0');
  }
  if(fails>=3){ state='over'; resultT=0; S.over(); if(score>best){best=score;localStorage.setItem('play_best',best);} }
}

// ---------- input ----------
function baseFromEvent(e){ const r=cv.getBoundingClientRect(); const x=(e.clientX-r.left)/r.width*W, y=(e.clientY-r.top)/r.height*H;
  let bestb=null,bd=1e9; for(const k in BASE){ const d=(BASE[k].x-x)**2+(BASE[k].y-y)**2; if(d<bd){bd=d;bestb=k;} } return bestb; }
cv.addEventListener('pointerdown',e=>{e.preventDefault();
  if(state!=='play'){throwBase('first');return;}
  throwBase(baseFromEvent(e));
});
addEventListener('keydown',e=>{
  const c=e.code;
  if(c==='ArrowUp'||c==='KeyW'){e.preventDefault();throwBase('second');}
  else if(c==='ArrowRight'||c==='KeyD'){e.preventDefault();throwBase('first');}
  else if(c==='ArrowLeft'||c==='KeyA'){e.preventDefault();throwBase('third');}
  else if(c==='ArrowDown'||c==='KeyS'){e.preventDefault();throwBase('home');}
  else if(c==='Space'||c==='Enter'){e.preventDefault(); if(state!=='play')throwBase('first');}
});

// ---------- particles ----------
function burst(x,y,c,n,sp){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=rnd(sp*0.3,sp);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:1,c});}}
function pop(x,y,txt,c){pops.push({x,y,txt,c,life:1});}

// ---------- update ----------
function runnerPos(rn){ const a=BASE[rn.from], b=BASE[rn.to]; const u=clamp(rn.prog,0,1); return {x:lerp(a.x,b.x,u),y:lerp(a.y,b.y,u)}; }
function update(dt){
  shake*=Math.pow(0.86,dt/16.7); if(shake<0.3)shake=0;
  flash*=Math.pow(0.9,dt/16.7);
  for(const p of parts){p.vx*=0.96;p.vy=p.vy*0.96+0.28;p.x+=p.vx*dt/16.7;p.y+=p.vy*dt/16.7;p.life-=dt/16.7*0.026;}
  parts=parts.filter(p=>p.life>0);
  for(const p of pops){p.y-=dt/16.7*0.5;p.life-=dt/16.7*0.02;}
  pops=pops.filter(p=>p.life>0);

  if(state!=='play'){ if(state==='over')resultT+=dt/1000; return; }
  t+=dt; const p=params();
  if(phase==='play'){
    clock+=dt;
    for(const rn of runners){
      if(rn.role==='play'){
        if(clock<commitT){ rn.lead=p.bluff*Math.min(1,clock/300); rn.prog=rn.lead; }
        else { if(rn.prog<0.14&&clock<commitT+40)S.go(); rn.prog=Math.min(1, p.bluff + (clock-commitT)/(deadline-commitT)*(1-p.bluff)); }
      } else {
        if(rn.bluffT>0 && clock>=rn.bluffT && clock<rn.bluffT+240){ rn.prog=p.bluff*1.3*Math.sin((clock-rn.bluffT)/240*Math.PI); }
        else { rn.prog=lerp(rn.prog,0,Math.min(1,dt/16.7*0.12)); }
      }
    }
    if(!acted && clock>deadline){ resolve('late'); }
    return;
  }
  if(phase==='result'){
    resultT+=dt/1000;
    if(ball){ ball.p=Math.min(1,ball.p+dt/300); const tgt=BASE[throwTo]; ball.x=lerp(FIELDER.x,tgt.x,easeOut(ball.p)); ball.y=lerp(FIELDER.y,tgt.y,easeOut(ball.p)); }
    // play runner keeps running to the base on any result
    const pr=runners.find(r=>r.role==='play'); if(pr){ pr.prog=Math.min(1,pr.prog+dt/ (result==='out'?900:520)); }
    if(resultT>1.2 && state==='play') newPlay();
    return;
  }
}

// ---------- render ----------
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function drawScene(){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#2f7a3c');g.addColorStop(1,'#1f5c28');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  // infield dirt diamond
  ctx.fillStyle='#7a5230';ctx.beginPath();
  ctx.moveTo(BASE.home.x,BASE.home.y+18);ctx.lineTo(BASE.first.x+20,BASE.first.y);ctx.lineTo(BASE.second.x,BASE.second.y-18);ctx.lineTo(BASE.third.x-20,BASE.third.y);ctx.closePath();ctx.fill();
  // grass infield
  ctx.fillStyle='#2f7a3c';ctx.beginPath();
  ctx.moveTo(BASE.home.x,BASE.home.y-26);ctx.lineTo(BASE.first.x-30,BASE.first.y);ctx.lineTo(BASE.second.x,BASE.second.y+26);ctx.lineTo(BASE.third.x+30,BASE.third.y);ctx.closePath();ctx.fill();
  // basepaths
  ctx.strokeStyle='rgba(255,255,255,0.35)';ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(BASE.home.x,BASE.home.y);ctx.lineTo(BASE.first.x,BASE.first.y);ctx.lineTo(BASE.second.x,BASE.second.y);ctx.lineTo(BASE.third.x,BASE.third.y);ctx.closePath();ctx.stroke();
  // bases
  for(const k in BASE){ const b=BASE[k]; ctx.save();ctx.translate(b.x,b.y);ctx.rotate(Math.PI/4);
    ctx.fillStyle='#f2f4f6';ctx.fillRect(-12,-12,24,24);ctx.restore();
    ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='11px sans-serif';ctx.textAlign='center';ctx.fillText(NAME[k],b.x,b.y-18); }
}
function drawFig(x,y,col,r){
  ctx.fillStyle='rgba(0,0,0,0.22)';ctx.beginPath();ctx.ellipse(x,y+11,10,4,0,0,6.28);ctx.fill();
  ctx.fillStyle=col;rr(x-8,y-10,16,24,6);ctx.fill();
  ctx.fillStyle='#f2c9a0';ctx.beginPath();ctx.arc(x,y-15,6.5,0,6.28);ctx.fill();
}

function render(){
  ctx.save();
  if(shake>0)ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
  drawScene();

  if(state==='play'){
    // target-base highlight when a runner has committed
    if(phase==='play'){ const pr=runners.find(r=>r.role==='play');
      if(pr && clock>=commitT){ const b=BASE[playBase]; ctx.strokeStyle='rgba(255,220,80,0.9)';ctx.lineWidth=3;
        ctx.beginPath();ctx.arc(b.x,b.y,22,0,6.28);ctx.stroke(); } }
    // runners
    for(const rn of runners){ const pos=runnerPos(rn); drawFig(pos.x,pos.y, rn.role==='play'?'#e23c3c':'#d98f3c'); }
    // fielder with ball
    drawFig(FIELDER.x,FIELDER.y,'#2b6cff');
    if(!ball){ ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(FIELDER.x+10,FIELDER.y-6,5,0,6.28);ctx.fill(); }
    // ball in flight
    if(ball){ ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(ball.x,ball.y,6,0,6.28);ctx.fill(); }
    // timing ring
    if(phase==='play'){ const u=clock/deadline; const rad=lerp(64,20,clamp(u,0,1));
      ctx.strokeStyle=(clock>=commitT&&clock<=deadline)?'rgba(150,240,170,0.85)':'rgba(255,255,255,0.28)';
      ctx.lineWidth=3;ctx.beginPath();ctx.arc(FIELDER.x,FIELDER.y,rad,0,6.28);ctx.stroke(); }
  }

  for(const p of parts){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,3.2,0,6.28);ctx.fill();}
  ctx.globalAlpha=1;
  for(const p of pops){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.font='bold 22px sans-serif';ctx.textAlign='center';ctx.fillText(p.txt,p.x,p.y);}
  ctx.globalAlpha=1;

  // HUD
  ctx.textAlign='left';ctx.fillStyle='#fff';ctx.font='bold 26px sans-serif';ctx.fillText('SCORE '+score,20,36);
  ctx.textAlign='right';ctx.fillStyle='rgba(255,255,255,0.9)';ctx.font='14px sans-serif';ctx.fillText('アウト '+outs+'  Lv'+lvl,W-20,24);
  ctx.fillText('失敗',W-92,46);
  for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(W-60+i*20,41,7,0,6.28);ctx.fillStyle=i<fails?'#ff5b5b':'rgba(255,255,255,0.25)';ctx.fill();}
  if(combo>=2){ctx.textAlign='center';ctx.fillStyle='#ffd24d';ctx.font='bold 18px sans-serif';ctx.fillText('コンボ x'+combo,W/2,H-40);}

  if(state==='play'&&phase==='play'){ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,0.9)';ctx.font='bold 15px sans-serif';
    ctx.fillText('本当に走り出した走者（赤）を見極め、その進塁先の塁へ即送球（塁をタップ / ←↑→↓）',W/2,40);}
  if(state==='play'&&phase==='result'&&msg){ctx.textAlign='center';ctx.fillStyle=result==='out'?'#9ff0b8':'#ff9a9a';ctx.font='bold 21px sans-serif';ctx.fillText(msg,W/2,40);}

  if(state==='title'){
    ctx.fillStyle='rgba(6,12,8,0.72)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='bold 46px sans-serif';ctx.fillText('送球判断',W/2,132);
    ctx.fillStyle='#ffd23e';ctx.font='bold 22px sans-serif';ctx.fillText("Where's the Play",W/2,168);
    ctx.fillStyle='rgba(255,255,255,0.92)';ctx.font='16px sans-serif';
    ctx.fillText('内野手の一瞬の判断。走り出した走者を見極め、正しい塁へ刺せ',W/2,216);
    ctx.fillStyle='rgba(255,255,255,0.66)';ctx.font='14px sans-serif';
    ctx.fillText('複数の走者がリード＆おとりの動き。“本当に走り出した（コミットした）走者”を見極める',W/2,254);
    ctx.fillText('その走者の進塁先の塁へ送球＝アウト（塁をタップ / ← 三塁 ↑ 二塁 → 一塁 ↓ 本塁）',W/2,276);
    ctx.fillText('走り出す前（おとり）に投げると悪送球、投げ先を間違えると本命を見誤りセーフ',W/2,298);
    ctx.fillText('速い好判断ほど高得点＆コンボ。上級ほど判断が速く要求され、おとりも巧妙。3失敗で交代',W/2,320);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で開始',W/2,398);
    ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='14px sans-serif';ctx.fillText('BEST '+best+'　　塁をタップ / 矢印キーで送球',W/2,432);
  }
  if(state==='over'){
    ctx.fillStyle='rgba(6,12,8,0.8)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#ff6b6b';ctx.font='bold 46px sans-serif';ctx.fillText('3失敗…交代',W/2,222);
    ctx.fillStyle='#fff';ctx.font='bold 40px sans-serif';ctx.fillText('SCORE '+score,W/2,290);
    ctx.fillStyle='rgba(255,255,255,0.85)';ctx.font='19px sans-serif';ctx.fillText('アウト '+outs+'   BEST '+best,W/2,330);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で もう一度',W/2,402);
  }

  if(flash>0.02){ctx.globalAlpha=flash*0.5;ctx.fillStyle=flashCol;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}
  ctx.restore();

  ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,0.4)';ctx.font='12px sans-serif';
  ctx.fillText('走り出した走者を見極めその進塁先へ送球。早い（おとり）=悪送球/違う塁=見誤り/遅い=セーフ。3失敗で交代',W/2,H-8);
}

function frame(ts){let dt=ts-last;last=ts;if(dt>60)dt=60;if(dt<0)dt=0;update(dt);render();requestAnimationFrame(frame);}
requestAnimationFrame(frame);

// ---------- test hook ----------
window.__wp={
  start, throwBase:(b)=>throwBase(b),
  get state(){return state;},
  get score(){return score;},
  get outs(){return outs;},
  get fails(){return fails;},
  get info(){return {state,phase,playFrom,playBase,clock,commitT,deadline,committed:clock>=commitT,acted,result,outs,fails,lvl};}
};
})();
</script>
</body>
</html>
