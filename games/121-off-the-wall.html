<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>フェンス際の処理 (Off the Wall)</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;background:#0a1410;overflow:hidden;font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",system-ui,sans-serif}
  #wrap{width:100%;height:100%;display:flex;align-items:center;justify-content:center}
  #stage{position:relative;width:min(100vw,calc(100vh*1.5));aspect-ratio:900/600;max-width:900px;
    box-shadow:0 10px 60px rgba(0,0,0,.6);border-radius:10px;overflow:hidden;touch-action:none}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
  #hint{position:absolute;left:0;bottom:6px;width:100%;text-align:center;color:#cfe;
    font-size:12px;opacity:.55;pointer-events:none;text-shadow:0 1px 3px #000}
</style>
</head>
<body>
<div id="wrap"><div id="stage">
  <canvas id="cv"></canvas>
  <div id="hint">跳ね返りの落下点へ ← / → （タップで移動）・ 捕ったら緑ゾーンで SPACE/タップ 送球 ・ 3進塁で交代</div>
</div></div>
<script>
(()=>{
const cv=document.getElementById('cv'), g=cv.getContext('2d');
const W=900,H=600;
let DPR=1;
function fit(){ DPR=Math.min(2,window.devicePixelRatio||1); cv.width=W*DPR; cv.height=H*DPR; g.setTransform(DPR,0,0,DPR,0,0); }
fit(); addEventListener('resize',fit);

// ---------- audio ----------
let AC=null;
function ac(){ if(!AC){ try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){} } return AC; }
function tone(f,d,t,v,sweep){ const a=ac(); if(!a)return; const o=a.createOscillator(),gg=a.createGain();
  o.type=t||'sine'; o.frequency.value=f; if(sweep) o.frequency.exponentialRampToValueAtTime(Math.max(20,sweep),a.currentTime+d);
  gg.gain.setValueAtTime(0.0001,a.currentTime); gg.gain.exponentialRampToValueAtTime(v||0.2,a.currentTime+0.012);
  gg.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+d); o.connect(gg).connect(a.destination);
  o.start(); o.stop(a.currentTime+d+0.02); }
function noise(d,v,hp){ const a=ac(); if(!a)return; const n=a.createBuffer(1,a.sampleRate*d,a.sampleRate); const ch=n.getChannelData(0);
  for(let i=0;i<ch.length;i++) ch[i]=(Math.random()*2-1)*(1-i/ch.length);
  const s=a.createBufferSource(); s.buffer=n; const f=a.createBiquadFilter(); f.type='highpass'; f.frequency.value=hp||600;
  const gg=a.createGain(); gg.gain.value=v||0.15; s.connect(f).connect(gg).connect(a.destination); s.start(); }
const S={
  crack(){ noise(0.04,0.16,1400); tone(340,0.05,'square',0.1,180); },
  clang(){ tone(180,0.12,'square',0.16,90); noise(0.08,0.12,300); },
  field(){ noise(0.05,0.14,700); tone(260,0.05,'triangle',0.08,160); },
  bobble(){ noise(0.14,0.16,320); tone(150,0.16,'sawtooth',0.1,80); },
  throw(){ tone(520,0.09,'triangle',0.1,860); },
  out(){ tone(680,0.1,'square',0.14,920); setTimeout(()=>tone(1010,0.16,'square',0.12,1320),80); },
  gun(){ tone(720,0.07,'square',0.12,1080); setTimeout(()=>tone(1080,0.08,'square',0.12,1500),70); setTimeout(()=>tone(1460,0.12,'triangle',0.1,1900),150); },
  safe(){ tone(300,0.4,'sawtooth',0.14,110); setTimeout(()=>tone(220,0.4,'sawtooth',0.12,80),150); },
  over(){ tone(300,0.5,'sawtooth',0.16,90); setTimeout(()=>tone(200,0.6,'sawtooth',0.14,60),160); },
  tick(){ tone(820,0.03,'square',0.035); },
};

// ---------- geometry ----------
const WALL=104, TRACK=150, FY=250;
const FXMIN=132, FXMAX=768;
const BX=566, BY=410, RSX=782, RSY=556;   // relay base + runner start

// ---------- state ----------
let state='title';
let parts=[], pops=[];
let score, outs, allowed, combo, best, lvl;
let k=null;
let flash=0, shakeT=0;
let pendingNew=false;
let fx=450, ftx=450, keyDir=0;
try{ best=+localStorage.getItem('otw_best')||0; }catch(e){ best=0; }

const crowd=[]; { const cc=['#e6b48f','#9bd0e6','#e6dc8f','#c9a0d8','#8fd8bd','#f0f0f0','#d88f9b']; for(let i=0;i<240;i++) crowd.push({x:(i*31.7)%W, y:4+((i*67)%56), c:cc[i%cc.length]}); }

function reset(){ parts=[]; pops=[]; score=0; outs=0; allowed=0; combo=0; lvl=0; k=null; flash=0; shakeT=0; pendingNew=false; fx=450; ftx=450; keyDir=0; nextPlay(); }
function clamp(v,a,b){ return v<a?a:v>b?b:v; }
function nextPlay(){
  lvl=Math.min(6,Math.floor(outs/3));
  const startX=250+Math.random()*400;
  const wallHitX=clamp(200+Math.random()*500,180,720);
  // carom lands offset from wall-hit toward a side; harder = larger, later-revealed offset
  const dir=Math.random()<0.5?-1:1;
  const off=(70+Math.random()*150)*dir*(1+lvl*0.08);
  const caromX=clamp(wallHitX+off, FXMIN+10, FXMAX-10);
  k={ phase:'flight', t:0,
      riseDur:560-lvl*34, caromDur:460-lvl*30,
      startX, wallHitX, caromX,
      hop:(lvl>=1 && Math.random()<0.32), hopX:0,
      revealAt:0.30+lvl*0.05,   // fraction of (rise+carom) before carom marker locks in
      tol:52-lvl*4,
      clean:null, res:null, resT:0, applied:false,
      throwT:0, throwDur:640, threw:false, quality:null,
      runnerP:0, runnerDur:2500-lvl*150, runnerBonus:0,
      ticked:-1,
      clutch: lvl>=2 && Math.random()<0.2 };
  if(k.hop){ k.hopX=clamp(k.startX+(k.wallHitX-k.startX)*0.7,200,700); k.riseDur=430-lvl*24; }
  fx=clamp(fx,FXMIN,FXMAX); ftx=fx;
}
function flightDur(){ return k.riseDur+k.caromDur; }
function caromShown(){ // marker becomes reliable after revealAt; before, it wobbles
  const p=k.t/flightDur();
  if(p>=k.revealAt) return k.caromX;
  const w=(k.revealAt-p)/k.revealAt; return k.caromX + Math.sin(k.t*0.02)*40*w;
}
function throwGreen(){ const p=k.throwT/k.throwDur; return p>=0.45&&p<=0.82; }
function throwPerfect(){ const p=k.throwT/k.throwDur; return p>=0.57&&p<=0.68; }

// ---------- action ----------
function throwNow(){
  if(!k||k.phase!=='throw'||k.threw) return;
  k.threw=true; S.throw();
  const perfect=throwPerfect(), green=throwGreen();
  k.quality = perfect?'perfect':green?'good':'wild';
  const RThresh=(k.clean?0.86:0.68) - lvl*0.015;
  if(k.quality==='wild'){ k.res='wild'; S.safe(); }
  else if(k.runnerP < RThresh){ k.res = (perfect && k.runnerP<RThresh-0.12)?'gun':'out'; (k.res==='gun'?S.gun():S.out()); }
  else { k.res='safe'; S.safe(); }
  k.phase='resolve'; k.resT=0;
}

function applyResult(){
  const r=k.res;
  if(r==='out'||r==='gun'){
    outs++; combo++;
    const base=r==='gun'?150:95;
    const gained=Math.round((base+combo*12)*(k.clutch?2:1)); score+=gained;
    const label=r==='gun'?'レーザービーム！刺した！ +':'アウト！走者を刺した +';
    const col=r==='gun'?'#7fd8ff':'#8fffb0';
    pops.push({txt:label+gained, big:true, y:120, life:1.05, c:col});
    if(r==='gun') pops.push({txt:'GUNNED DOWN', big:false, y:162, life:1.0, c:'#7fd8ff'});
    flash=Math.max(flash, r==='gun'?0.5:0.35); burst(BX,BY,col,r==='gun'?26:16);
    if(outs%5===0){ pops.push({txt:outs+' 補殺！',big:false,y:200,life:1.1,c:'#ffe15a'}); score+=120; }
    pendingNew=true;
  } else {
    allowed++; combo=0; shakeT=0.35; flash=Math.max(flash,0.4);
    const msg = k.res==='wild'?'悪送球…進塁を許した':'間に合わず進塁';
    pops.push({txt:msg, big:true, y:140, life:1.05, c:'#ff6a6a'});
    burst(BX,BY,'#ff6a6a',16);
    if(allowed>=3){ gameOver(); return; }
    pendingNew=true;
  }
}
function gameOver(){ state='over'; S.over(); if(score>best){ best=score; try{localStorage.setItem('otw_best',best);}catch(e){} } }
function burst(x,y,c,n){ for(let i=0;i<n;i++) parts.push({x,y,vx:(Math.random()-0.5)*7,vy:(Math.random()-0.5)*7-1,life:1,c}); }

// ---------- input ----------
function start(){ ac(); reset(); state='play'; }
function aim(x){ ftx=clamp(x,FXMIN,FXMAX); }
addEventListener('keydown',e=>{ const key=e.key.toLowerCase();
  if(state!=='play'){ if(!e.repeat){ start(); } return; }
  if(key==='arrowleft'||key==='a'){ keyDir=-1; e.preventDefault(); }
  else if(key==='arrowright'||key==='d'){ keyDir=1; e.preventDefault(); }
  else if(key===' '||key==='arrowup'||key==='w'||key==='enter'){ if(!e.repeat) throwNow(); e.preventDefault(); } });
addEventListener('keyup',e=>{ const key=e.key.toLowerCase();
  if((key==='arrowleft'||key==='a')&&keyDir<0) keyDir=0;
  if((key==='arrowright'||key==='d')&&keyDir>0) keyDir=0; });
cv.addEventListener('pointerdown',e=>{ ac(); if(state!=='play'){ start(); return; } if(!k) return;
  if(k.phase==='throw'){ throwNow(); return; }
  const r=cv.getBoundingClientRect(); aim((e.clientX-r.left)/r.width*W); e.preventDefault(); });
cv.addEventListener('pointermove',e=>{ if(state!=='play'||!k) return; if(e.buttons){ const r=cv.getBoundingClientRect(); aim((e.clientX-r.left)/r.width*W); } });

// ---------- update ----------
function update(dt){
  if(flash>0) flash=Math.max(0,flash-dt*0.003);
  if(shakeT>0) shakeT-=dt*0.001;
  parts.forEach(q=>{q.x+=q.vx;q.y+=q.vy;q.vy+=0.12;q.life-=dt*0.0022;});
  parts=parts.filter(q=>q.life>0);
  pops.forEach(q=>{q.y-=dt*0.02;q.life-=dt*0.0014;});
  pops=pops.filter(q=>q.life>0);
  if(state!=='play'||!k) return;

  // fielder movement
  const spd=0.85*dt;
  if(keyDir){ fx=clamp(fx+keyDir*spd,FXMIN,FXMAX); ftx=fx; }
  else { const d=ftx-fx; fx=clamp(fx+clamp(d,-spd,spd),FXMIN,FXMAX); }

  // runner advances from contact through field & throw
  if(k.phase!=='resolve'){ k.runnerP=Math.min(1, k.runnerP + dt/k.runnerDur + (k.phase==='field'?k.runnerBonus*0:0)); }

  if(k.phase==='flight'){
    k.t+=dt;
    if(k.t>=k.riseDur && k.ticked<0){ k.ticked=0; if(k.hop){ S.field(); } else { S.clang(); flash=Math.max(flash,0.12); } }
    if(k.t>=flightDur()){
      k.clean = Math.abs(fx-k.caromX) < k.tol;
      k.runnerBonus = k.clean?0 : Math.min(0.26, Math.abs(fx-k.caromX)/760);
      k.runnerP = Math.min(1, k.runnerP + k.runnerBonus);
      if(k.clean) S.field(); else S.bobble();
      k.phase='field'; k.fieldT=0;
    }
  } else if(k.phase==='field'){
    k.fieldT=(k.fieldT||0)+dt;
    if(k.runnerP>=1){ k.res='safe'; S.safe(); k.phase='resolve'; k.resT=0; return; }
    if(k.fieldT>=280){ k.phase='throw'; k.throwT=0; }
  } else if(k.phase==='throw'){
    k.throwT+=dt;
    const tk=Math.floor(k.throwT/70); if(tk!==k.tickThrow){ k.tickThrow=tk; if(throwGreen()) S.tick(); }
    if(k.runnerP>=1){ k.res='safe'; S.safe(); k.phase='resolve'; k.resT=0; return; }
    if(k.throwT>=k.throwDur){ k.res='wild'; S.safe(); k.phase='resolve'; k.resT=0; } // too slow
  } else if(k.phase==='resolve'){
    k.resT+=dt;
    if(k.res==='out'||k.res==='gun') k.ballFly=Math.min(1,k.resT/320);
    if(k.resT>=540 && !k.applied){ k.applied=true; applyResult(); }
    if(k.resT>=1180 && pendingNew){ pendingNew=false; if(state==='play') nextPlay(); }
  }
}

// ---------- render ----------
function roundRect(x,y,w,h,r){ g.beginPath(); g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r); g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath(); }
function lerp(a,b,t){ return a+(b-a)*t; }
function ballPos(){
  const p=k.t;
  const hitX = k.hop?k.hopX:k.wallHitX, hitY = k.hop?TRACK-2:WALL+8;
  if(k.phase==='flight'){
    if(p<k.riseDur){ const q=p/k.riseDur; return {x:lerp(k.startX,hitX,q), y:lerp(560,hitY,q)-Math.sin(q*Math.PI)*(k.hop?54:30)}; }
    const q=Math.min(1,(p-k.riseDur)/k.caromDur); return {x:lerp(hitX,k.caromX,q), y:lerp(hitY,FY,q)-Math.sin(q*Math.PI)*(k.hop?40:24)};
  }
  return {x:k.caromX,y:FY};
}
function drawField(){
  const gr=g.createLinearGradient(0,0,0,H); gr.addColorStop(0,'#2b8c4c'); gr.addColorStop(1,'#1f6f3b'); g.fillStyle=gr; g.fillRect(0,0,W,H);
  g.globalAlpha=0.06; for(let i=0;i<9;i++){ g.fillStyle=i%2?'#fff':'#000'; g.fillRect(0,TRACK+i*50,W,50); } g.globalAlpha=1;
  // stands + wall
  g.fillStyle='#14324a'; g.fillRect(0,0,W,60);
  for(const c of crowd){ g.fillStyle=c.c; g.globalAlpha=0.7; g.fillRect(c.x,c.y,3,3); } g.globalAlpha=1;
  // outfield wall (padded fence)
  g.fillStyle='#123a5c'; g.fillRect(0,60,W,WALL-60);
  g.fillStyle='#0f2f4a'; g.fillRect(0,WALL-8,W,10);
  g.fillStyle='#ffd23f'; g.fillRect(0,WALL-2,W,3);
  // warning track (dirt)
  g.fillStyle='#a86a3c'; g.fillRect(0,WALL+2,W,TRACK-WALL);
  // distance markers (corners, away from centered cue text)
  g.fillStyle='rgba(255,255,255,0.45)'; g.font='bold 15px sans-serif'; g.textAlign='center'; g.fillText('410',70,96); g.fillText('410',W-70,96);
}
function drawFielder(x,y,arm){ g.save(); g.translate(x,y);
  g.fillStyle='rgba(0,0,0,0.22)'; g.beginPath(); g.ellipse(0,6,14,4,0,0,6.28); g.fill();
  g.strokeStyle='#20303a'; g.lineWidth=5; g.lineCap='round';
  g.beginPath(); g.moveTo(-4,-2); g.lineTo(-6,16); g.moveTo(4,-2); g.lineTo(6,16); g.stroke();
  g.strokeStyle='#1b2a44'; g.lineWidth=5;
  g.beginPath(); g.moveTo(0,-14); g.lineTo(-12-arm*10,-6-arm*8); g.moveTo(0,-14); g.lineTo(12,-8); g.stroke();
  g.fillStyle='#c98b2a'; g.beginPath(); g.arc(-12-arm*10,-6-arm*8,5,0,6.28); g.fill(); // glove
  g.fillStyle='#1b3a6e'; roundRect(-9,-26,18,26,6); g.fill(); g.fillStyle='#f2c9a0'; g.beginPath(); g.arc(0,-34,8,0,6.28); g.fill(); g.restore(); }
function drawBall(x,y,r){ r=r||7; g.fillStyle='#fff'; g.beginPath(); g.arc(x,y,r,0,6.28); g.fill(); g.strokeStyle='#c33'; g.lineWidth=1.2; g.stroke(); }

function drawScene(){
  if(!k) return;
  // predicted carom marker on fielder line
  if(k.phase==='flight'||k.phase==='field'){
    const cx=k.phase==='flight'?caromShown():k.caromX;
    const locked=k.t/flightDur()>=k.revealAt;
    g.strokeStyle=locked?'rgba(255,225,90,0.9)':'rgba(255,225,90,0.4)'; g.lineWidth=3;
    g.beginPath(); g.moveTo(cx,FY-24); g.lineTo(cx,FY+24); g.stroke();
    g.beginPath(); g.moveTo(cx-10,FY-24); g.lineTo(cx+10,FY-24); g.stroke();
    g.fillStyle=locked?'rgba(255,225,90,0.25)':'rgba(255,225,90,0.12)'; g.fillRect(cx-k.tol,FY-3,k.tol*2,6);
  }
  // ball
  if(k.phase==='flight'){ const b=ballPos(); if(k.t>=k.riseDur){ /* carom */ } drawBall(b.x,b.y,7);
    // trail
    g.globalAlpha=0.2; drawBall(b.x,b.y+6,5); g.globalAlpha=1;
  } else if(k.phase==='field'){ drawBall(k.caromX,FY-4,7); }
  else if(k.phase==='resolve'&&(k.res==='out'||k.res==='gun')){ const bx=lerp(k.caromX,BX,k.ballFly||0), by=lerp(FY,BY,k.ballFly||0)-Math.sin((k.ballFly||0)*Math.PI)*46;
    for(let s=1;s<=3;s++){ const gp=(k.ballFly||0)-s*0.07; if(gp>0){ const tx=lerp(k.caromX,BX,gp), ty=lerp(FY,BY,gp)-Math.sin(gp*Math.PI)*46; g.globalAlpha=0.16*(4-s); g.fillStyle='#fff'; g.beginPath(); g.arc(tx,ty,6-s,0,6.28); g.fill(); } } g.globalAlpha=1;
    drawBall(bx,by,7); }
  else if(k.phase==='resolve'){ drawBall(k.caromX,FY,7); }

  // fielder
  const arm=(k.phase==='field'||k.phase==='throw')?1:0;
  drawFielder(fx,FY,arm);

  // relay base + runner racing to it
  const rp=Math.min(1,k.runnerP);
  const safe=(k.phase==='resolve'&&(k.res==='safe'||k.res==='wild'));
  // base diamond
  g.save(); g.translate(BX,BY); g.rotate(Math.PI/4);
  g.fillStyle=(k.phase==='resolve'&&(k.res==='out'||k.res==='gun'))?'#8fffb0':'#fff'; g.fillRect(-13,-13,26,26); g.restore();
  // approach lane
  g.strokeStyle='rgba(255,255,255,0.25)'; g.lineWidth=3; g.setLineDash([8,8]); g.beginPath(); g.moveTo(RSX,RSY); g.lineTo(BX,BY); g.stroke(); g.setLineDash([]);
  // runner sprite sliding toward base
  const runx=lerp(RSX,BX,rp), runy=lerp(RSY,BY,rp);
  g.save(); g.translate(runx,runy);
  g.fillStyle='rgba(0,0,0,0.2)'; g.beginPath(); g.ellipse(0,7,12,4,0,0,6.28); g.fill();
  if(safe&&rp>0.98){ g.rotate(-0.5); } // slide pose
  g.strokeStyle='#7a4a10'; g.lineWidth=5; g.lineCap='round'; g.beginPath(); g.moveTo(-3,0); g.lineTo(-7,15); g.moveTo(3,0); g.lineTo(7,15); g.stroke();
  g.fillStyle='#f0a81e'; roundRect(-8,-20,16,22,5); g.fill(); g.fillStyle='#f2c9a0'; g.beginPath(); g.arc(0,-27,6,0,6.28); g.fill(); g.restore();
  // tension label
  g.textAlign='center'; g.fillStyle=rp<0.72?'#cfe':'#ff9a9a'; g.font='bold 13px sans-serif'; g.fillText(rp<0.72?'走者 進塁中':'間に合うか…！',BX,BY+40);

  // cue + throw meter
  g.textAlign='center';
  if(k.phase==='flight'){ g.fillStyle='#cfe'; g.font='bold 20px sans-serif'; g.fillText('跳ね返りの落下点へ入れ！',W/2,88+0);
    if(k.clutch){ g.fillStyle='#ffe15a'; g.font='bold 15px sans-serif'; g.fillText('★ 決勝の走者 2倍 ★',W/2,72);} }
  else if(k.phase==='field'){ g.fillStyle=k.clean?'#8fffb0':'#ffb36a'; g.font='bold 24px sans-serif'; g.fillText(k.clean?'ナイスキャッチ！':'ファンブル…',W/2,96); }
  else if(k.phase==='throw'){ g.fillStyle=throwGreen()?'#8fffb0':'#ffd76a'; g.font='bold 24px sans-serif'; g.fillText(throwGreen()?'今だ！送球！':'狙いを定めて…',W/2,96);
    const x=W/2-150,y=118,w=300; g.fillStyle='rgba(0,0,0,0.4)'; roundRect(x,y,w,14,7); g.fill();
    g.fillStyle='rgba(120,230,140,0.5)'; roundRect(x+w*0.45,y,w*0.37,14,7); g.fill();
    g.fillStyle=throwPerfect()?'rgba(127,216,255,0.95)':'rgba(127,216,255,0.6)'; roundRect(x+w*0.57,y,w*0.11,14,7); g.fill();
    const mp=Math.min(1,k.throwT/k.throwDur); g.fillStyle='#fff'; g.fillRect(x+w*mp-2,y-3,4,20);
    g.fillStyle='#7fd8ff'; g.font='bold 11px sans-serif'; g.fillText('PERFECT',x+w*0.625,y-6); }
}

function render(){
  g.clearRect(0,0,W,H);
  g.save(); if(shakeT>0){ const s=shakeT*13; g.translate((Math.random()-0.5)*s,(Math.random()-0.5)*s); }
  drawField();
  if(state!=='title') drawScene();
  for(const q of parts){ g.globalAlpha=Math.max(0,q.life); g.fillStyle=q.c; g.fillRect(q.x-2,q.y-2,4,4); }
  g.globalAlpha=1;
  g.restore();

  if(state==='play') drawHUD();
  for(const q of pops){ g.globalAlpha=Math.max(0,q.life); g.textAlign='center';
    if(q.big){ g.font='bold 32px sans-serif'; g.fillStyle=q.c; g.strokeStyle='#000'; g.lineWidth=5; g.strokeText(q.txt,W/2,q.y); g.fillText(q.txt,W/2,q.y); }
    else { g.font='bold 22px sans-serif'; g.fillStyle=q.c; g.strokeStyle='#000'; g.lineWidth=4; g.strokeText(q.txt,W/2,q.y); g.fillText(q.txt,W/2,q.y); } }
  g.globalAlpha=1;
  if(flash>0){ g.fillStyle='rgba(255,255,255,'+(flash*0.5)+')'; g.fillRect(0,0,W,H); }
  if(state==='title') drawTitle();
  if(state==='over') drawOver();
}
function drawHUD(){
  g.textAlign='left'; g.font='bold 26px sans-serif'; g.fillStyle='#fff'; g.strokeStyle='rgba(0,0,0,0.5)'; g.lineWidth=4;
  g.strokeText('SCORE '+score,20,40); g.fillText('SCORE '+score,20,40);
  g.font='bold 15px sans-serif'; g.fillStyle='#cfe'; g.fillText('補殺 '+outs,22,62);
  if(combo>1){ g.textAlign='center'; g.font='bold 20px sans-serif'; g.fillStyle='#ffe15a'; g.strokeText(combo+' 連続補殺',W/2,44); g.fillText(combo+' 連続補殺',W/2,44); }
  g.textAlign='right'; g.font='bold 16px sans-serif'; g.fillStyle='#fff'; g.strokeText('進塁',W-104,40); g.fillText('進塁',W-104,40);
  for(let i=0;i<3;i++){ g.fillStyle=i<allowed?'#ff5a5a':'rgba(255,255,255,0.28)'; g.beginPath(); g.arc(W-78+i*24,34,8,0,6.28); g.fill(); }
}
function drawTitle(){
  g.fillStyle='rgba(4,12,8,0.72)'; g.fillRect(0,0,W,H); g.textAlign='center';
  g.fillStyle='#8fffb0'; g.font='bold 50px sans-serif'; g.fillText('フェンス際の処理',W/2,H/2-104);
  g.fillStyle='#cfe'; g.font='20px sans-serif'; g.fillText('Off the Wall — 跳ね返りを捌いて走者を刺せ',W/2,H/2-66);
  g.font='17px sans-serif'; g.fillStyle='#bcd';
  g.fillText('深い打球がフェンスへ。跳ね返りの落下点を予測し ← / → で入る。',W/2,H/2-28);
  g.fillText('ピタリ捕れば素早く、ズレるとファンブルで走者に進まれる。',W/2,H/2-4);
  g.fillText('捕ったら送球メーターの緑（中央でPERFECT）で SPACE/タップ。',W/2,H/2+20);
  g.fillText('走者が到達する前に正確な送球で刺せ。3進塁で交代。',W/2,H/2+44);
  g.fillStyle='#ffe15a'; g.font='bold 24px sans-serif'; g.fillText('クリック / タップ / キー で スタート',W/2,H/2+96);
  if(best>0){ g.fillStyle='#9fd'; g.font='16px sans-serif'; g.fillText('BEST '+best,W/2,H/2+126); }
}
function drawOver(){
  g.fillStyle='rgba(4,12,8,0.8)'; g.fillRect(0,0,W,H); g.textAlign='center';
  g.fillStyle='#ff6a6a'; g.font='bold 50px sans-serif'; g.fillText('3進塁…守備交代',W/2,H/2-60);
  g.fillStyle='#fff'; g.font='bold 34px sans-serif'; g.fillText('SCORE '+score,W/2,H/2);
  g.fillStyle='#cfe'; g.font='18px sans-serif'; g.fillText('補殺 '+outs,W/2,H/2+32);
  const nb=score>0&&score>=best; g.fillStyle=nb?'#ffe15a':'#9fd'; g.font='18px sans-serif';
  g.fillText(nb?'🎉 ベスト更新！ BEST '+best:'BEST '+best,W/2,H/2+62);
  g.fillStyle='#8fffb0'; g.font='bold 22px sans-serif'; g.fillText('クリック / タップ で もう一度',W/2,H/2+112);
}

let last=0;
function frame(t){ let dt=t-last; last=t; if(dt>60)dt=60; if(dt<0)dt=0; update(dt); render(); requestAnimationFrame(frame); }
requestAnimationFrame(frame);

// ---------- test hook ----------
window.__otw={
  start, aim, throwNow,
  get state(){return state;}, get score(){return score;}, get outs(){return outs;}, get allowed(){return allowed;},
  get fx(){return fx;},
  get info(){ if(!k) return null; return {
    phase:k.phase, caromX:k.caromX, caromShown:(k.phase==='flight'?caromShown():k.caromX), revealed:(k.t/flightDur()>=k.revealAt),
    fx:fx, tol:k.tol, clean:k.clean, runnerP:k.runnerP,
    throwGreen:throwGreen(), throwPerfect:throwPerfect(), res:k.res, quality:k.quality, clutch:!!k.clutch }; }
};
})();
</script>
