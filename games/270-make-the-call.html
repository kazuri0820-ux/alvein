<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>主審 (Make the Call)</title>
<style>
  html,body{margin:0;height:100%;background:#06110a;overflow:hidden;
    font-family:-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  #stage{position:relative;width:100vw;height:100vh;max-width:calc(100vh*1.5);max-height:calc(100vw/1.5);aspect-ratio:900/600;}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;border-radius:6px;}
</style>
</head>
<body>
<div id="wrap"><div id="stage"><canvas id="cv"></canvas></div></div>
<script>
(function(){
const W=900,H=600,cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let DPR=1;
function fit(){DPR=Math.min(2,window.devicePixelRatio||1);cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
fit();addEventListener('resize',fit);

// ---------- audio ----------
let AC=null;function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function tone(f,d,type,v,sweep){const a=ac();if(!a)return;const t=a.currentTime,o=a.createOscillator(),g=a.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(sweep)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+sweep),t+d);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v||0.2,t+0.008);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+0.02);}
function noise(d,v,hp){const a=ac();if(!a)return;const t=a.currentTime,n=Math.floor(a.sampleRate*d),buf=a.createBuffer(1,n,a.sampleRate),ch=buf.getChannelData(0);
  for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource();s.buffer=buf;
  const f=a.createBiquadFilter();f.type='highpass';f.frequency.value=hp||600;const g=a.createGain();g.gain.value=v||0.2;
  s.connect(f);f.connect(g);g.connect(a.destination);s.start(t);s.stop(t+d+0.02);}
const S={
  whistleShort:()=>{tone(2100,0.14,'sine',0.14);tone(2600,0.14,'sine',0.09);},
  whistleLong:()=>{tone(2000,0.32,'sine',0.16,120);tone(2500,0.32,'sine',0.1,120);},
  contact:()=>{noise(0.06,0.16,500);},
  good:()=>{[680,900,1180].forEach((f,i)=>setTimeout(()=>tone(f,0.1,'triangle',0.16),i*55));},
  bad:()=>{noise(0.16,0.2,300);tone(160,0.22,'sawtooth',0.12,-50);},
  streak:()=>{[700,930,1170,1400].forEach((f,i)=>setTimeout(()=>tone(f,0.1,'triangle',0.16),i*60));},
  over:()=>{[440,330,247,175].forEach((f,i)=>setTimeout(()=>tone(f,0.3,'triangle',0.2),i*160));}
};

// ---------- buttons ----------
const BTN=[
  {k:'clean',x:60, label:'プレーオン', sub:'ボールに触れた', col:'#3fc46b'},
  {k:'foul', x:335,label:'ファウル！', sub:'足にかかった', col:'#e0574b'},
  {k:'dive', x:610,label:'シミュレーション', sub:'接触なし・ダイブ', col:'#e0b33e'}
];
const BW=230, BY=512, BH=64;

// ---------- state ----------
let state='title', phase='show', plays=0;
let score=0, combo=0, best=+(localStorage.getItem('ref_best')||0);
let outs=0, fails=0, lvl=1;   // outs = correct calls
let clock=0, revealT=440, decideWin=980, verdict='clean', tough=false;
let decided=false, call=null, result=null, resultT=0, msg='', anim=0;
let shake=0, flash=0, flashCol='#fff', last=performance.now();
let parts=[], pops=[];

function rnd(a,b){return a+Math.random()*(b-a);}
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function lerp(a,b,u){return a+(b-a)*u;}
function easeOut(u){return 1-Math.pow(1-u,2);}

function reset(){state='title';score=0;combo=0;outs=0;fails=0;lvl=1;plays=0;result=null;parts=[];pops=[];}
function newPlay(){
  plays++; lvl=Math.min(7,1+Math.floor(outs/4));
  revealT=clamp(470-lvl*24,300,470);
  decideWin=clamp(1020-lvl*66,540,1020);
  const r=Math.random(); verdict = r<0.34?'clean':(r<0.67?'foul':'dive');
  tough = Math.random()<clamp(0.18+lvl*0.05,0.18,0.5);   // subtle contact -> big bonus if right
  phase='show'; clock=0; decided=false; call=null; result=null; resultT=0; msg=''; anim=0;
}
function start(){ if(!ac())ac(); if(AC&&AC.state==='suspended')AC.resume(); reset(); state='play'; newPlay(); }

function makeCall(c){
  if(state==='title'){start();return;}
  if(state==='over'){ if(resultT>0.4){reset();start();} return; }
  if(state!=='play') return;
  if(phase!=='show'||decided) return;
  if(clock<revealT){ decided=true; call=c; resolve('early'); return; }   // whistled before the tackle resolved
  decided=true; call=c;
  if(c===verdict) resolve('correct'); else resolve('wrong');
}

function resolve(k){
  phase='result'; result=k; resultT=0; anim=0;
  if(k==='correct'){
    outs++; combo++;
    let add=Math.round((tough?240:150)*(1+Math.min(9,combo-1)*0.14)); score+=add;
    if(verdict==='foul'){ S.whistleLong(); } else S.whistleShort();
    setTimeout(S.good,80);
    flash=1;flashCol='#8affa0';shake=5;
    burst(450,300,'#8affa0',18,7);
    pop(450,250,tough?'際どい判定を的中！ +'+add:'正しい判定！ +'+add,'#d6ffe0');
    if(combo>=2&&!tough)pop(W/2,150,'コンボ x'+combo,'#ffd24d');
    if(combo>0&&combo%5===0)S.streak();
    msg = verdict==='clean'?'ボールに先に触れている——プレーオンで正解！'
        : verdict==='foul'?'足を刈っている——ファウルの笛が正解！'
        : '接触はなかった——シミュレーションを見抜いた！';
  } else {
    fails++; combo=0; flash=1;flashCol='#ff5b5b';shake=9; S.bad();
    if(k==='early') msg='笛が早い…プレーが終わる前の判定は禁物';
    else if(k==='late') msg='判定が遅い…主審が迷ってはいけない';
    else {
      const truth = verdict==='clean'?'実際はクリーン(ボール先)':verdict==='foul'?'実際はファウル(足に接触)':'実際はダイブ(接触なし)';
      msg='誤審…'+truth+'だった';
    }
    pop(450,250,'誤審…','#ffb0b0');
  }
  if(fails>=3){ state='over'; resultT=0; S.over(); if(score>best){best=score;localStorage.setItem('ref_best',best);} }
}

// ---------- input ----------
cv.addEventListener('pointerdown',e=>{e.preventDefault();
  if(state!=='play'||phase!=='show'){ makeCall('clean'); return; }  // title/over: any tap
  const r=cv.getBoundingClientRect(); const x=(e.clientX-r.left)/r.width*W, y=(e.clientY-r.top)/r.height*H;
  for(const b of BTN){ if(x>=b.x&&x<=b.x+BW&&y>=BY&&y<=BY+BH){ makeCall(b.k); return; } }
});
addEventListener('keydown',e=>{ if(e.repeat)return;
  if(e.code==='Digit1'||e.code==='KeyA'){e.preventDefault();makeCall('clean');}
  else if(e.code==='Digit2'||e.code==='KeyS'){e.preventDefault();makeCall('foul');}
  else if(e.code==='Digit3'||e.code==='KeyD'){e.preventDefault();makeCall('dive');}
  else if(e.code==='Space'||e.code==='Enter'){e.preventDefault(); if(state!=='play')makeCall('clean');}
});

// ---------- particles ----------
function burst(x,y,c,n,sp){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=rnd(sp*0.3,sp);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:1,c});}}
function pop(x,y,txt,c){pops.push({x,y,txt,c,life:1});}

// ---------- update ----------
function update(dt){
  shake*=Math.pow(0.86,dt/16.7); if(shake<0.3)shake=0;
  flash*=Math.pow(0.9,dt/16.7);
  for(const p of parts){p.vx*=0.96;p.vy=p.vy*0.96+0.28;p.x+=p.vx*dt/16.7;p.y+=p.vy*dt/16.7;p.life-=dt/16.7*0.026;}
  parts=parts.filter(p=>p.life>0);
  for(const p of pops){p.y-=dt/16.7*0.5;p.life-=dt/16.7*0.02;}
  pops=pops.filter(p=>p.life>0);

  if(state!=='play'){ if(state==='over')resultT+=dt/1000; return; }
  if(phase==='show'){ clock+=dt;
    if(!decided && Math.abs(clock-revealT)<9) S.contact();
    if(!decided && clock>revealT+decideWin){ decided=true; call=null; resolve('late'); }  // no call in time -> missed
    return; }
  if(phase==='result'){ resultT+=dt/1000; anim=Math.min(1,anim+dt/560); if(resultT>1.35) newPlay(); return; }
}

// ---------- render ----------
function figure(x,y,col,sc,lean,down){ sc=sc||1;lean=lean||0;
  ctx.fillStyle='rgba(0,0,0,0.22)';ctx.beginPath();ctx.ellipse(x,y+14*sc,13*sc,4*sc,0,0,6.28);ctx.fill();
  ctx.save();ctx.translate(x,y);ctx.rotate(down?1.35:lean);
  ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(-7*sc,-22*sc);ctx.lineTo(7*sc,-22*sc);ctx.lineTo(6*sc,12*sc);ctx.lineTo(-6*sc,12*sc);ctx.closePath();ctx.fill();
  ctx.fillStyle='#f2c9a0';ctx.beginPath();ctx.arc(0,-28*sc,6*sc,0,6.28);ctx.fill();
  ctx.restore();
}
function drawScene(){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#0f3d24');g.addColorStop(0.6,'#12653a');g.addColorStop(1,'#0c4d2c');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  for(let i=0;i<7;i++){ ctx.fillStyle=i%2?'rgba(255,255,255,0.03)':'rgba(0,0,0,0.03)'; ctx.fillRect(0,40+i*70,W,70); }
}

function render(){
  ctx.save();
  if(shake>0)ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
  drawScene();

  if(state==='play'||state==='over'){
    const cy=300;
    // progress of the incident
    let u = phase==='show'? clamp(clock/revealT,0,1) : 1;
    u=easeOut(u);
    // attacker runs left->right; defender slides in from the right-low
    const atkX=lerp(340,470,u), defX=lerp(600,center(),u);
    function center(){ return verdict==='dive'?505:470; } // dive: defender stops a bit short
    const resolved = (phase==='show'&&clock>=revealT)||phase==='result';
    const down = resolved && verdict!=='clean';   // attacker down on foul/dive
    const atkDown = phase==='result'? (verdict!=='clean') : down;

    // ball
    let ballX=atkX+16, ballY=cy+14;
    if(resolved && verdict==='clean'){ const k=phase==='result'?easeOut(anim):1; ballX=lerp(atkX+16, atkX+120, k); ballY=cy+14-8*k; }
    // defender
    figure(defX, cy+6, '#d24b4b', 1.0, resolved?-0.5:-0.2);
    // defender leg (slide)
    ctx.strokeStyle='#d24b4b';ctx.lineWidth=7;ctx.lineCap='round';
    const legTgt = verdict==='dive'? {x:atkX+26,y:cy+16} : {x:atkX+2,y:cy+14};
    ctx.beginPath();ctx.moveTo(defX-4,cy+14);ctx.lineTo(lerp(defX-4,legTgt.x,resolved?1:u),lerp(cy+14,legTgt.y,resolved?1:u));ctx.stroke();
    ctx.lineCap='butt';
    // attacker
    figure(atkX, cy, '#3aa0ff', 1.0, atkDown?0:0.12, atkDown);
    // ball draw
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(ballX,ballY,7,0,6.28);ctx.fill();

    // contact evidence spark at reveal
    if(resolved){
      if(verdict==='clean'){ spark(ballX,ballY,'#7dff9a','ボールに接触'); }
      else if(verdict==='foul'){ spark(atkX+2,cy+8,'#ff6b5b','足に接触'); }
      else { // dive: show the gap (no contact)
        ctx.strokeStyle='rgba(255,210,90,0.9)';ctx.lineWidth=2;ctx.setLineDash([4,4]);
        ctx.beginPath();ctx.moveTo(atkX+24,cy+16);ctx.lineTo(atkX+52,cy+16);ctx.stroke();ctx.setLineDash([]);
        ctx.fillStyle='rgba(255,220,110,0.95)';ctx.font='bold 13px sans-serif';ctx.textAlign='center';ctx.fillText('接触なし',atkX+40,cy-6);
      }
    }

    // cue
    ctx.textAlign='center';
    if(state==='play'&&phase==='show'){
      if(clock<revealT){ ctx.fillStyle='rgba(255,220,90,0.95)';ctx.font='bold 19px sans-serif';ctx.fillText('よく見ろ——接触の瞬間を見極めろ',W/2,52); }
      else { ctx.fillStyle='rgba(140,255,160,0.98)';ctx.font='bold 20px sans-serif';ctx.fillText('判定を下せ！',W/2,52);
        // decide timer
        const p=clamp((clock-revealT)/decideWin,0,1), bw=260,x=W/2-bw/2,y=64;
        ctx.fillStyle='rgba(255,255,255,0.18)';ctx.fillRect(x,y,bw,7);
        ctx.fillStyle=p<0.7?'#8affa0':(p<1?'#ffd24d':'#ff5b5b');ctx.fillRect(x,y,bw*p,7); }
    }

    // decision buttons
    if(state==='play'){
      for(const b of BTN){
        const active = phase==='show'&&clock>=revealT;
        ctx.fillStyle=active?b.col:'rgba(255,255,255,0.10)';
        rr(b.x,BY,BW,BH,10);ctx.fill();
        ctx.fillStyle=active?'#08130c':'rgba(255,255,255,0.5)';ctx.textAlign='center';ctx.font='bold 19px sans-serif';
        ctx.fillText(b.label,b.x+BW/2,BY+28);
        ctx.font='12px sans-serif';ctx.fillText(b.sub,b.x+BW/2,BY+48);
      }
      ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='12px sans-serif';ctx.textAlign='center';
      ctx.fillText('タップ / キー 1・2・3（A・S・D）で判定',W/2,BY+BH+18);
    }
  }

  for(const p of parts){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,3.2,0,6.28);ctx.fill();}
  ctx.globalAlpha=1;
  for(const p of pops){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.font='bold 21px sans-serif';ctx.textAlign='center';ctx.fillText(p.txt,p.x,p.y);}
  ctx.globalAlpha=1;

  // HUD
  ctx.textAlign='left';ctx.fillStyle='#fff';ctx.font='bold 26px sans-serif';ctx.fillText('SCORE '+score,20,36);
  ctx.textAlign='right';ctx.fillStyle='rgba(255,255,255,0.9)';ctx.font='14px sans-serif';ctx.fillText('好判定 '+outs+'  Lv'+lvl,W-20,24);
  ctx.fillText('誤審',W-92,46);
  for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(W-60+i*20,41,7,0,6.28);ctx.fillStyle=i<fails?'#ff5b5b':'rgba(255,255,255,0.25)';ctx.fill();}
  if(combo>=2){ctx.textAlign='center';ctx.fillStyle='#ffd24d';ctx.font='bold 18px sans-serif';ctx.fillText('コンボ x'+combo,W/2,120);}

  if(state==='play'&&phase==='result'&&msg){ctx.textAlign='center';ctx.fillStyle=result==='correct'?'#9ff0b8':'#ff9a9a';ctx.font='bold 19px sans-serif';ctx.fillText(msg,W/2,410);}

  if(state==='title'){
    ctx.fillStyle='rgba(4,10,7,0.82)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='bold 44px sans-serif';ctx.fillText('主審',W/2,100);
    ctx.fillStyle='#ffd23e';ctx.font='bold 22px sans-serif';ctx.fillText('Make the Call',W/2,136);
    ctx.fillStyle='rgba(255,255,255,0.92)';ctx.font='16px sans-serif';
    ctx.fillText('あなたは主審。タックルの瞬間を見極めて正しくジャッジしろ',W/2,188);
    ctx.fillStyle='rgba(255,255,255,0.66)';ctx.font='14px sans-serif';
    ctx.fillText('接触の“場所”を読む：ボールに先に触れた＝プレーオン / 足に接触＝ファウル / 接触なし＝シミュレーション',W/2,226);
    ctx.fillText('プレーが終わる（接触の瞬間）まで待ってから、3つのボタン（またはキー1・2・3）で判定',W/2,250);
    ctx.fillText('笛が早い＝判定ミス、誤審は失格ポイント。際どい判定を当てると大量加点',W/2,274);
    ctx.fillText('上級ほど接触が見えづらく判定の猶予も短い。3誤審で交代',W/2,298);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で開始',W/2,364);
    ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='14px sans-serif';ctx.fillText('BEST '+best,W/2,396);
  }
  if(state==='over'){
    ctx.fillStyle='rgba(4,10,7,0.84)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#ff6b6b';ctx.font='bold 46px sans-serif';ctx.fillText('3誤審…主審交代',W/2,222);
    ctx.fillStyle='#fff';ctx.font='bold 40px sans-serif';ctx.fillText('SCORE '+score,W/2,290);
    ctx.fillStyle='rgba(255,255,255,0.85)';ctx.font='19px sans-serif';ctx.fillText('好判定 '+outs+'   BEST '+best,W/2,330);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で もう一度',W/2,402);
  }

  if(flash>0.02){ctx.globalAlpha=flash*0.5;ctx.fillStyle=flashCol;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}
  ctx.restore();

  ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,0.4)';ctx.font='12px sans-serif';
  ctx.fillText('主審：接触の場所を見極め、ボール先=プレーオン/足に接触=ファウル/接触なし=シミュレーションを判定。早笛・誤審は失敗、3誤審で交代',W/2,H-8);
}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function spark(x,y,c,label){ for(let i=0;i<8;i++){const a=i/8*6.28;ctx.strokeStyle=c;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x+Math.cos(a)*6,y+Math.sin(a)*6);ctx.lineTo(x+Math.cos(a)*13,y+Math.sin(a)*13);ctx.stroke();}
  ctx.fillStyle=c;ctx.font='bold 13px sans-serif';ctx.textAlign='center';ctx.fillText(label,x,y-18); }

function frame(ts){let dt=ts-last;last=ts;if(dt>60)dt=60;if(dt<0)dt=0;update(dt);render();requestAnimationFrame(frame);}
requestAnimationFrame(frame);

// ---------- test hook ----------
window.__rf={
  start, makeCall:(c)=>makeCall(c),
  get state(){return state;},
  get score(){return score;},
  get outs(){return outs;},
  get fails(){return fails;},
  get info(){return {state,phase,clock,revealT,decideWin,verdict,tough,decided,call,result,outs,fails,lvl,
    revealed:(clock>=revealT),canAct:(phase==='show'&&!decided)};}
};
})();
</script>
</body>
</html>
