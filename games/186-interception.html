<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>インターセプト (Read the Pass)</title>
<style>
  html,body{margin:0;height:100%;background:#0a1a10;overflow:hidden;
    font-family:-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  #stage{position:relative;width:100vw;height:100vh;max-width:calc(100vh*1.5);max-height:calc(100vw/1.5);aspect-ratio:900/600;}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;border-radius:6px;}
</style>
</head>
<body>
<div id="wrap"><div id="stage"><canvas id="cv"></canvas></div></div>
<script>
(function(){
const W=900,H=600,cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let DPR=1;
function fit(){DPR=Math.min(2,window.devicePixelRatio||1);cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
fit();addEventListener('resize',fit);

// ---------- audio ----------
let AC=null;function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function tone(f,d,type,v,sweep){const a=ac();if(!a)return;const t=a.currentTime,o=a.createOscillator(),g=a.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(sweep)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+sweep),t+d);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v||0.2,t+0.008);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+0.02);}
function noise(d,v,hp){const a=ac();if(!a)return;const t=a.currentTime,n=Math.floor(a.sampleRate*d),buf=a.createBuffer(1,n,a.sampleRate),ch=buf.getChannelData(0);
  for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource();s.buffer=buf;
  const f=a.createBiquadFilter();f.type='highpass';f.frequency.value=hp||600;const g=a.createGain();g.gain.value=v||0.2;
  s.connect(f);f.connect(g);g.connect(a.destination);s.start(t);s.stop(t+d+0.02);}
const S={
  step:()=>{tone(480,0.06,'square',0.1,120);},
  cut:()=>{noise(0.06,0.22,600);tone(420,0.1,'square',0.14);},
  great:()=>{[620,880,1180,1560].forEach((f,i)=>setTimeout(()=>tone(f,0.12,'triangle',0.2),i*60));},
  pass:()=>{tone(460,0.08,'square',0.12,120);},
  beaten:()=>{tone(240,0.3,'sawtooth',0.2,-120);setTimeout(()=>tone(170,0.28,'sawtooth',0.16,-70),120);},
  over:()=>{[440,330,247,175].forEach((f,i)=>setTimeout(()=>tone(f,0.3,'triangle',0.2),i*160));}
};

// ---------- geometry ----------
const PASSER={x:450,y:486};
const T=[{x:224,y:214},{x:450,y:152},{x:676,y:214}];   // 3 pass targets
const DEF0={x:450,y:338};

// ---------- state ----------
let state='title', phase='read', t=0, plays=0;
let score=0, combo=0, best=+(localStorage.getItem('intercept_best')||0);
let cuts=0, beaten=0, lvl=1;
let P=null, def={x:450,y:338,tx:450,ty:338, lane:-1}, ball=null, result=null, resultT=0, msg='', msg2='';
let shake=0, flash=0, flashCol='#fff', last=performance.now();
let parts=[], pops=[];

function rnd(a,b){return a+Math.random()*(b-a);}
function chance(p){return Math.random()<p;}
function clamp(v,a,b){return v<a?a:v>b?b:v;}

function reset(){state='title';score=0;combo=0;cuts=0;beaten=0;lvl=1;plays=0;P=null;ball=null;result=null;parts=[];pops=[];def={x:450,y:338,tx:450,ty:338,lane:-1};}

function interceptPoint(lane){ const tk=T[lane]; return {x:PASSER.x+(tk.x-PASSER.x)*0.5, y:PASSER.y+(tk.y-PASSER.y)*0.5}; }

function newPlay(){
  plays++;
  lvl=Math.min(6,1+Math.floor(plays/3));
  const target=Math.floor(rnd(0,3));
  const tPass=rnd(1500,2000);
  const tTele=tPass*(0.62-lvl*0.01);
  // wander schedule for the aim arrow before it settles
  const wander=[]; let n=2+Math.floor(rnd(0,2));
  for(let i=0;i<n;i++) wander.push(Math.floor(rnd(0,3)));
  P={target, realTarget:target, tPass, tTele, wander, t:0, committed:false, commitLane:-1, aimLane:wander[0]||target, settled:false, lookoff: lvl>=4&&chance(0.3)};
  def={x:DEF0.x,y:DEF0.y,tx:DEF0.x,ty:DEF0.y,lane:-1};
  ball=null; result=null; phase='read'; t=0;
  msg='パスコースを読め'; msg2='相手の狙い（矢印）が定まってから踏み込め';
}

function start(){ if(!ac())ac(); if(AC&&AC.state==='suspended')AC.resume(); reset(); state='play'; newPlay(); }

// ---------- commit ----------
function commit(lane){
  if(state==='title'){start();return;}
  if(state==='over'){ if(resultT>0.5){reset();start();} return; }
  if(state!=='play'||phase!=='read'||!P||P.committed) return;
  P.committed=true; P.commitLane=lane; S.step();
  const ip=interceptPoint(lane); def.tx=ip.x; def.ty=ip.y; def.lane=lane;
  const early = P.t < P.tTele;
  if(early){
    // read the defender's early move -> pass to a different open lane (dummy)
    let opts=[0,1,2].filter(l=>l!==lane); P.realTarget=opts[Math.floor(rnd(0,opts.length))];
    P.aimLane=P.realTarget; P.dummied=true;
  }
  // release the pass now
  const tk=T[P.realTarget]; ball={x:PASSER.x,y:PASSER.y-8,tx:tk.x,ty:tk.y,tp:0,to:P.realTarget};
  S.pass(); phase='pass';
  P.win = (!early) && (lane===P.realTarget);
  P.decisive = P.t>P.tTele+ (P.tPass-P.tTele)*0.25;
}

function resolveNoCommit(){
  // never committed -> pass completes uncontested
  const tk=T[P.realTarget]; ball={x:PASSER.x,y:PASSER.y-8,tx:tk.x,ty:tk.y,tp:0,to:P.realTarget};
  S.pass(); phase='pass'; P.win=false; P.noCommit=true;
}

function applyResult(kind){
  result=kind; resultT=0; phase='resolve';
  const ip=P.commitLane>=0?interceptPoint(P.commitLane):interceptPoint(P.realTarget);
  if(kind==='cut'||kind==='great'){
    combo++; const mult=1+Math.min(6,combo-1)*0.24; const base=kind==='great'?180:120; const add=Math.round(base*mult);
    score+=add; cuts++;
    if(kind==='great')S.great(); else S.cut();
    flash=1;flashCol=kind==='great'?'#ffe08a':'#8ff0b8'; shake=kind==='great'?12:8;
    burst(ip.x,ip.y,kind==='great'?'#ffe08a':'#bfffd0',kind==='great'?26:18,7);
    pop(ip.x,ip.y-28,(kind==='great'?'ナイス読み！ ':'インターセプト！ ')+'+'+add,'#eaffef');
    if(combo>=2)pop(ip.x,ip.y-52,'コンボ x'+combo,'#ffe08a');
    msg=kind==='great'?'ナイス読み！ 狙い澄ましてカット':'インターセプト！ コースを読み切った'; msg2='';
  } else {
    combo=0; beaten++;
    S.beaten();
    flash=1;flashCol='#ff6b6b'; shake=10;
    const tk=T[P.realTarget]; burst(tk.x,tk.y,'#ff8a8a',16,5);
    if(P.dummied){msg='逆を突かれた！ 動きが早い';msg2='狙いが定まるまで我慢';}
    else if(P.noCommit){msg='通された！ 読み遅れ';msg2='素早くコースへ踏み込め';}
    else {msg='コースを外した！ 通された';msg2='狙われたレーンへ入れ';}
  }
}

// ---------- input ----------
cv.addEventListener('pointerdown',e=>{
  e.preventDefault();
  if(state==='title'||state==='over'){commit(1);return;}
  if(state!=='play'||phase!=='read')return;
  const r=cv.getBoundingClientRect(); const x=((e.clientX-r.left)/r.width)*W;
  commit(x<W*0.36?0:(x>W*0.64?2:1));
});
addEventListener('keydown',e=>{
  if(e.code==='ArrowLeft'){e.preventDefault();commit(0);}
  else if(e.code==='ArrowUp'){e.preventDefault();commit(1);}
  else if(e.code==='ArrowRight'){e.preventDefault();commit(2);}
  else if(e.code==='Space'||e.code==='Enter'){ if(state!=='play')commit(1);}
});

// ---------- particles ----------
function burst(x,y,c,n,sp){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=rnd(sp*0.3,sp);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:1,c});}}
function pop(x,y,txt,c){pops.push({x,y,txt,c,life:1});}

// ---------- update ----------
function update(dt){
  shake*=Math.pow(0.86,dt/16.7); if(shake<0.3)shake=0;
  flash*=Math.pow(0.9,dt/16.7);
  for(const p of parts){p.vx*=0.96;p.vy=p.vy*0.96+0.3;p.x+=p.vx*dt/16.7;p.y+=p.vy*dt/16.7;p.life-=dt/16.7*0.026;}
  parts=parts.filter(p=>p.life>0);
  for(const p of pops){p.y-=dt/16.7*0.5;p.life-=dt/16.7*0.018;}
  pops=pops.filter(p=>p.life>0);
  def.x+=(def.tx-def.x)*Math.min(1,dt/16.7*0.34);
  def.y+=(def.ty-def.y)*Math.min(1,dt/16.7*0.34);

  if(state!=='play'){ if(state==='over')resultT+=dt/1000; return; }
  t+=dt;

  if(phase==='read'){
    P.t+=dt; const p=P.t/P.tPass;
    // aim arrow wanders before tTele, then settles on realTarget
    if(P.t<P.tTele){
      const idx=Math.min(P.wander.length-1,Math.floor(p/(P.tTele/P.tPass)*P.wander.length));
      P.aimLane=P.wander[idx];
    } else if(!P.settled){ P.settled=true; P.aimLane=P.realTarget;
      if(P.lookoff){ /* look-off: briefly point wrong then correct */ } }
    if(P.t>=P.tPass && !P.committed){ resolveNoCommit(); }
    return;
  }
  if(phase==='pass'){
    ball.tp=clamp(ball.tp+dt/300,0,1);
    // if intercepting, ball stops at the intercept point
    if(P.win){ if(ball.tp>=0.5){ applyResult(P.decisive?'great':'cut'); } }
    else { if(ball.tp>=1){ applyResult('beaten'); } }
    return;
  }
  if(phase==='resolve'){
    resultT+=dt/1000;
    if(resultT>1.05){
      if(beaten>=3){ state='over'; resultT=0; S.over(); if(score>best){best=score;localStorage.setItem('intercept_best',best);} }
      else newPlay();
    }
    return;
  }
}

// ---------- render ----------
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

function drawScene(){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#164a2c');g.addColorStop(1,'#1f7040');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='rgba(255,255,255,0.03)';for(let i=0;i<6;i++){if(i%2)ctx.fillRect(0,i*100,W,100);}
  ctx.strokeStyle='rgba(255,255,255,0.1)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(450,300,64,0,6.28);ctx.stroke();
}

function drawPlayer(x,y,col,dark,label,sc){
  sc=sc||1;ctx.save();ctx.translate(x,y);ctx.scale(sc,sc);
  ctx.fillStyle='rgba(0,0,0,0.22)';ctx.beginPath();ctx.ellipse(0,15,11,4,0,0,6.28);ctx.fill();
  ctx.fillStyle=col;rr(-8,-6,16,21,6);ctx.fill();
  ctx.fillStyle='#f2c9a0';ctx.beginPath();ctx.arc(0,-13,6.5,0,6.28);ctx.fill();
  ctx.fillStyle=dark;ctx.beginPath();ctx.arc(0,-15,7,Math.PI,0);ctx.fill();
  ctx.restore();
  if(label){ctx.fillStyle='rgba(255,255,255,0.85)';ctx.font='bold 11px sans-serif';ctx.textAlign='center';ctx.fillText(label,x,y+28);}
}

function render(){
  ctx.save();
  if(shake>0)ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
  drawScene();

  if(P){
    // passing lanes (faint)
    for(let i=0;i<3;i++){ ctx.strokeStyle='rgba(255,255,255,0.10)';ctx.lineWidth=2;ctx.setLineDash([5,8]);
      ctx.beginPath();ctx.moveTo(PASSER.x,PASSER.y-8);ctx.lineTo(T[i].x,T[i].y);ctx.stroke();ctx.setLineDash([]); }
    // aim arrow (telegraph)
    if(state==='play'&&phase==='read'){
      const tk=T[P.aimLane]; const dx=tk.x-PASSER.x, dy=tk.y-PASSER.y, L=Math.hypot(dx,dy);
      const ux=dx/L, uy=dy/L; const len=60+(P.settled?18:0);
      ctx.strokeStyle=P.settled?'rgba(255,224,138,0.95)':'rgba(255,224,138,0.5)';ctx.lineWidth=P.settled?6:4;
      ctx.beginPath();ctx.moveTo(PASSER.x,PASSER.y-16);ctx.lineTo(PASSER.x+ux*len,PASSER.y-16+uy*len);ctx.stroke();
      // arrowhead
      const hx=PASSER.x+ux*len, hy=PASSER.y-16+uy*len;
      ctx.beginPath();ctx.moveTo(hx,hy);ctx.lineTo(hx-ux*12-uy*8,hy-uy*12+ux*8);ctx.moveTo(hx,hy);ctx.lineTo(hx-ux*12+uy*8,hy-uy*12-ux*8);ctx.stroke();
      if(P.settled){ctx.fillStyle='#ffe08a';ctx.font='bold 13px sans-serif';ctx.textAlign='center';ctx.fillText('狙い定まる',PASSER.x,PASSER.y-56);}
    }
    // targets (opponents)
    for(let i=0;i<3;i++) drawPlayer(T[i].x,T[i].y,'#e2413a','#8a1f1a',null,0.95);
    // passer
    drawPlayer(PASSER.x,PASSER.y,'#e2413a','#8a1f1a','パサー',1.0);
    // defender (you)
    drawPlayer(def.x,def.y,'#2b6cff','#1a3a8a','YOU',1.05);
    // ball
    if(ball){ const x=ball.x+(ball.tx-ball.x)*ball.tp, y=ball.y+(ball.ty-ball.y)*ball.tp;
      ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(x,y,7,0,6.28);ctx.fill();ctx.strokeStyle='#333';ctx.lineWidth=1.3;ctx.beginPath();ctx.arc(x,y,7,0,6.28);ctx.stroke(); }
    else { ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(PASSER.x+9,PASSER.y+2,7,0,6.28);ctx.fill();ctx.strokeStyle='#333';ctx.lineWidth=1.2;ctx.beginPath();ctx.arc(PASSER.x+9,PASSER.y+2,7,0,6.28);ctx.stroke(); }
  }

  for(const p of parts){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,3.2,0,6.28);ctx.fill();}
  ctx.globalAlpha=1;
  for(const p of pops){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.font='bold 21px sans-serif';ctx.textAlign='center';ctx.fillText(p.txt,p.x,p.y);}
  ctx.globalAlpha=1;

  // HUD
  ctx.textAlign='left';ctx.fillStyle='#fff';ctx.font='bold 26px sans-serif';ctx.fillText('SCORE '+score,20,36);
  ctx.textAlign='right';ctx.fillStyle='rgba(255,255,255,0.85)';ctx.font='14px sans-serif';ctx.fillText('カット '+cuts+'  Lv.'+lvl,W-20,26);
  ctx.fillText('被通し',W-100,50);
  for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(W-70+i*22,46,7,0,6.28);ctx.fillStyle=i<beaten?'#ff5b5b':'rgba(255,255,255,0.25)';ctx.fill();}
  if(combo>=2){ctx.textAlign='left';ctx.fillStyle='#ffe08a';ctx.font='bold 18px sans-serif';ctx.fillText('コンボ x'+combo,20,60);}

  if(state==='play'&&(msg||msg2)){
    ctx.textAlign='center';
    const good=result==='cut'||result==='great';
    ctx.fillStyle=result?(good?'#8ff0b8':'#ff9a9a'):'rgba(255,255,255,0.92)';
    ctx.font='bold 26px sans-serif';ctx.fillText(msg,W/2,H-54);
    if(msg2){ctx.fillStyle='rgba(255,255,255,0.72)';ctx.font='15px sans-serif';ctx.fillText(msg2,W/2,H-30);}
  }

  if(state==='title'){
    ctx.fillStyle='rgba(6,16,10,0.66)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='bold 50px sans-serif';ctx.fillText('インターセプト',W/2,190);
    ctx.fillStyle='#8ff0b8';ctx.font='bold 22px sans-serif';ctx.fillText('Read the Pass',W/2,226);
    ctx.fillStyle='rgba(255,255,255,0.9)';ctx.font='18px sans-serif';
    ctx.fillText('相手の狙い（黄色い矢印）が定まるのを読み、狙われたコースへ踏み込む',W/2,288);
    ctx.fillText('（← 左 / ↑ 中 / → 右、または左/中/右をタップ）＝パスカット',W/2,316);
    ctx.fillStyle='rgba(255,255,255,0.66)';ctx.font='15px sans-serif';
    ctx.fillText('矢印が定まる前に動くと読まれて逆を通される（ダミー）／読み遅れも通される',W/2,358);
    ctx.fillText('定まった直後に鋭く読み切ればナイス読みで高得点。3被通しで終了',W/2,382);
    ctx.fillStyle='#ffe08a';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で開始',W/2,442);
    ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='14px sans-serif';ctx.fillText('BEST '+best,W/2,474);
  }
  if(state==='over'){
    ctx.fillStyle='rgba(6,16,10,0.74)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#ff6b6b';ctx.font='bold 46px sans-serif';ctx.fillText('3被通し…終了',W/2,230);
    ctx.fillStyle='#fff';ctx.font='bold 40px sans-serif';ctx.fillText('SCORE '+score,W/2,296);
    ctx.fillStyle='rgba(255,255,255,0.85)';ctx.font='20px sans-serif';ctx.fillText('カット '+cuts+'   BEST '+best,W/2,336);
    ctx.fillStyle='#8ff0b8';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で もう一度',W/2,408);
  }

  if(flash>0.02){ctx.globalAlpha=flash*0.5;ctx.fillStyle=flashCol;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}
  ctx.restore();

  ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,0.4)';ctx.font='13px sans-serif';
  ctx.fillText('黄矢印が定まってから狙われたコースへ踏み込む（←↑→）。早いとダミーで逆を突かれる。3被通しで終了',W/2,H-8);
}

function frame(ts){let dt=ts-last;last=ts;if(dt>60)dt=60;if(dt<0)dt=0;update(dt);render();requestAnimationFrame(frame);}
requestAnimationFrame(frame);

// ---------- test hook ----------
window.__ic={
  start, commit,
  get state(){return state;},
  get score(){return score;},
  get cuts(){return cuts;},
  get beaten(){return beaten;},
  get info(){return {state,phase, t:P?P.t:0, tPass:P?P.tPass:0, tTele:P?P.tTele:0, settled:P?P.settled:false,
    aimLane:P?P.aimLane:-1, committed:P?P.committed:false, result, cuts, beaten, lvl};}
};
})();
</script>
</body>
</html>
