<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>アドバンテージ (Play On?)</title>
<style>
  html,body{margin:0;height:100%;background:#07120b;overflow:hidden;
    font-family:-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  #stage{position:relative;width:100vw;height:100vh;max-width:calc(100vh*1.5);max-height:calc(100vw/1.5);aspect-ratio:900/600;}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;border-radius:6px;}
</style>
</head>
<body>
<div id="wrap"><div id="stage"><canvas id="cv"></canvas></div></div>
<script>
(function(){
const W=900,H=600,cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let DPR=1;
function fit(){DPR=Math.min(2,window.devicePixelRatio||1);cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
fit();addEventListener('resize',fit);

// ---------- audio ----------
let AC=null;function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function tone(f,d,type,v,sweep){const a=ac();if(!a)return;const t=a.currentTime,o=a.createOscillator(),g=a.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(sweep)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+sweep),t+d);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v||0.2,t+0.008);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+0.02);}
function noise(d,v,hp){const a=ac();if(!a)return;const t=a.currentTime,n=Math.floor(a.sampleRate*d),buf=a.createBuffer(1,n,a.sampleRate),ch=buf.getChannelData(0);
  for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource();s.buffer=buf;
  const f=a.createBiquadFilter();f.type='highpass';f.frequency.value=hp||600;const g=a.createGain();g.gain.value=v||0.2;
  s.connect(f);f.connect(g);g.connect(a.destination);s.start(t);s.stop(t+d+0.02);}
const S={
  foul:()=>{noise(0.06,0.14,500);tone(200,0.06,'square',0.08,-40);},
  whistle:()=>{tone(1800,0.14,'square',0.08);setTimeout(()=>tone(2000,0.1,'square',0.06),80);},
  wave:()=>{tone(520,0.08,'triangle',0.08,120);},
  good:()=>{[680,940,1220].forEach((f,i)=>setTimeout(()=>tone(f,0.1,'triangle',0.16),i*55));},
  big:()=>{[600,800,1000,1250].forEach((f,i)=>setTimeout(()=>tone(f,0.12,'triangle',0.17),i*80));},
  bad:()=>{noise(0.18,0.22,300);tone(160,0.22,'sawtooth',0.12,-50);},
  streak:()=>{[700,930,1170,1400].forEach((f,i)=>setTimeout(()=>tone(f,0.1,'triangle',0.16),i*60));},
  over:()=>{[440,330,247,175].forEach((f,i)=>setTimeout(()=>tone(f,0.3,'triangle',0.2),i*160));}
};

// ---------- geometry ----------
const FOUL={x:430,y:340};
const BTN=[
  {k:'playon', x:150,label:'プレーオン ↑',sub:'味方が保持＝続行',col:'#3fc46b'},
  {k:'whistle', x:520,label:'笛 ↓',sub:'奪われた／流れた',col:'#e0a23b'}
];
const BW=230, BY=505, BH=64;

// ---------- state ----------
let state='title', phase='roll', plays=0;
let score=0, combo=0, best=+(localStorage.getItem('adv_best')||0);
let outs=0, fails=0, lvl=1;   // outs = correct calls
let clock=0, revealT=520, callWin=980, kind='adv', tough=false;
let destX=0, destY=0, destTeam=1; // where the ball rolls after the foul
let decided=false, call=null, result=null, resultT=0, msg='', msgOk=false;
let shake=0, flash=0, flashCol='#fff', last=performance.now();
let parts=[], pops=[];

function rnd(a,b){return a+Math.random()*(b-a);}
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function lerp(a,b,u){return a+(b-a)*u;}
function easeOut(u){return 1-Math.pow(1-u,2);}

function reset(){state='title';score=0;combo=0;outs=0;fails=0;lvl=1;plays=0;result=null;parts=[];pops=[];}

function newPlay(){
  plays++; lvl=Math.min(7,1+Math.floor(outs/4));
  revealT=clamp(560-lvl*24,360,560);
  callWin=clamp(1020-lvl*70,560,1020);
  tough=Math.random()<clamp(0.2+lvl*0.05,0.2,0.5);
  kind=(Math.random()<0.5?'adv':'noadv');
  // advantage: ball runs to a teammate (blue) in space. no-adv: to an opponent (red) or loose/out.
  const side=(Math.random()<0.5?-1:1);
  destX=FOUL.x+side*rnd(150,260); destY=FOUL.y+rnd(-70,70);
  destTeam=(kind==='adv')?1:0;   // 1=attacking teammate (blue), 0=opponent (red)
  phase='roll'; clock=0; decided=false; call=null; result=null; resultT=0; msg=''; msgOk=false;
  S.foul();
}
function start(){ if(!ac())ac(); if(AC&&AC.state==='suspended')AC.resume(); reset(); state='play'; newPlay(); }

function makeCall(c){
  if(state==='title'){start();return;}
  if(state==='over'){ if(resultT>0.4){reset();start();} return; }
  if(state!=='play'||phase!=='roll'||decided) return;
  if(clock<revealT){ decided=true; call=c; resolve('early'); return; }
  decided=true; call=c;
  const correct=(c==='playon')===(kind==='adv');
  resolve(correct?'good':'wrong');
}

function resolve(k){
  phase='result'; result=k; resultT=0;
  if(k==='good'){
    outs++; combo++;
    let add=Math.round((tough?250:150)*(1+Math.min(9,combo-1)*0.14)); score+=add;
    if(kind==='adv')S.wave(); else S.whistle(); setTimeout(S.good,80); if(tough)setTimeout(S.big,140);
    msgOk=true; flash=1;flashCol='#8affa0';shake=5; burst(destX,destY,'#8affa0',16,7);
    pop(FOUL.x,FOUL.y-70,(tough?'際どい判断を的中！ +':'好判定！ +')+add,'#d6ffe0');
    if(combo>=2&&!tough)pop(W/2,150,'コンボ x'+combo,'#ffd24d');
    if(combo>0&&combo%5===0)S.streak();
    msg=(kind==='adv')?'ファウルはあったが味方がボールを保持——アドバンテージで流して正解':'攻撃が途切れて相手ボール——笛でファウルを取って正解';
  } else {
    fails++; combo=0; msgOk=false; flash=1;flashCol='#ff5b5b';shake=9; S.bad();
    if(k==='early') msg='判断が早い…ボールの行方を見極める前に決めるのは禁物';
    else msg=(kind==='adv')?'誤審…味方が保持しており流す（アドバンテージ）べきだった':'誤審…攻撃は途切れており笛を吹くべきだった';
    pop(FOUL.x,FOUL.y-70,'誤審…','#ffb0b0');
  }
  if(fails>=3){ state='over'; resultT=0; S.over(); if(score>best){best=score;localStorage.setItem('adv_best',best);} }
}

// ---------- input ----------
cv.addEventListener('pointerdown',e=>{e.preventDefault();
  if(state!=='play'||phase!=='roll'){ makeCall('playon'); return; }
  const r=cv.getBoundingClientRect(); const x=(e.clientX-r.left)/r.width*W, y=(e.clientY-r.top)/r.height*H;
  for(const b of BTN){ if(x>=b.x&&x<=b.x+BW&&y>=BY&&y<=BY+BH){ makeCall(b.k); return; } }
  makeCall(y<H*0.5?'playon':'whistle');
});
addEventListener('keydown',e=>{ if(e.repeat)return;
  if(e.code==='ArrowUp'||e.code==='KeyP'){e.preventDefault();makeCall('playon');}
  else if(e.code==='ArrowDown'||e.code==='KeyW'){e.preventDefault();makeCall('whistle');}
  else if(e.code==='Space'||e.code==='Enter'){e.preventDefault(); if(state!=='play')makeCall('playon');} });

// ---------- particles ----------
function burst(x,y,c,n,sp){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=rnd(sp*0.3,sp);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:1,c});}}
function pop(x,y,txt,c){pops.push({x,y,txt,c,life:1});}

// ---------- update ----------
function update(dt){
  shake*=Math.pow(0.86,dt/16.7); if(shake<0.3)shake=0;
  flash*=Math.pow(0.9,dt/16.7);
  for(const p of parts){p.vx*=0.96;p.vy=p.vy*0.96+0.28;p.x+=p.vx*dt/16.7;p.y+=p.vy*dt/16.7;p.life-=dt/16.7*0.026;}
  parts=parts.filter(p=>p.life>0);
  for(const p of pops){p.y-=dt/16.7*0.5;p.life-=dt/16.7*0.02;}
  pops=pops.filter(p=>p.life>0);

  if(state!=='play'){ if(state==='over')resultT+=dt/1000; return; }
  if(phase==='roll'){ clock+=dt;
    if(!decided && clock>revealT+callWin){ decided=true; call=null; resolve('late'); }
    return; }
  if(phase==='result'){ resultT+=dt/1000; if(resultT>1.6) newPlay(); return; }
}

// ---------- render ----------
function drawField(){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#0f5e34');g.addColorStop(0.5,'#12703f');g.addColorStop(1,'#0c4c2b');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  for(let i=0;i<8;i++){ctx.fillStyle=i%2?'rgba(255,255,255,0.03)':'rgba(0,0,0,0.03)';ctx.fillRect(0,i*80,W,80);}
  ctx.strokeStyle='rgba(255,255,255,0.25)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(W/2,80);ctx.lineTo(W/2,470);ctx.stroke();
  ctx.beginPath();ctx.arc(W/2,275,60,0,6.28);ctx.stroke();
}
function person(x,y,col,s,down){s=s||1;
  if(down){ ctx.save();ctx.translate(x,y);ctx.rotate(1.1);
    ctx.fillStyle=col;ctx.beginPath();ctx.ellipse(0,0,11*s,17*s,0,0,6.28);ctx.fill();
    ctx.fillStyle='#f0c9a0';ctx.beginPath();ctx.arc(0,-22*s,8*s,0,6.28);ctx.fill();ctx.restore(); return; }
  ctx.fillStyle=col;ctx.beginPath();ctx.ellipse(x,y-16*s,11*s,17*s,0,0,6.28);ctx.fill();
  ctx.fillStyle='#f0c9a0';ctx.beginPath();ctx.arc(x,y-38*s,8*s,0,6.28);ctx.fill();
}

function render(){
  ctx.save();
  if(shake>0)ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
  drawField();

  if(state==='play'||state==='over'){
    const revealed=(phase==='roll'&&clock>=revealT)||phase==='result';
    // the foul: an attacker (blue) fouled by a defender (red)
    person(FOUL.x-30,FOUL.y,'#2b6fd6',0.95,true);   // fouled attacker down
    person(FOUL.x+2,FOUL.y-6,'#d0403a',0.95);        // defender who fouled
    ctx.fillStyle='rgba(255,120,110,0.9)';ctx.font='bold 13px sans-serif';ctx.textAlign='center';ctx.fillText('ファウル！',FOUL.x-14,FOUL.y-52);

    // destination player (revealed): blue=teammate(advantage) / red=opponent(no adv)
    if(revealed){
      person(destX,destY,destTeam?'#2b6fd6':'#d0403a',0.95);
      ctx.fillStyle=destTeam?'rgba(150,255,170,0.95)':'rgba(255,150,140,0.95)';ctx.font='bold 13px sans-serif';ctx.textAlign='center';
      ctx.fillText(destTeam?'味方が保持':'相手が回収',destX,destY-50);
    }
    // ball rolls from foul toward destination
    let bx=FOUL.x,by=FOUL.y-8;
    if(phase==='roll'){ const u=easeOut(clamp(clock/(revealT+120),0,1)); bx=lerp(FOUL.x,destX,u); by=lerp(FOUL.y-8,destY-8,u); }
    else { bx=destX; by=destY-8; }
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(bx,by,8,0,6.28);ctx.fill();
    ctx.strokeStyle='#222';ctx.lineWidth=1.2;
    ctx.beginPath();ctx.moveTo(bx-6,by-4);ctx.lineTo(bx+2,by-9);ctx.lineTo(bx+7,by-2);ctx.lineTo(bx+3,by+6);ctx.lineTo(bx-6,by+5);ctx.closePath();ctx.stroke();

    // cue banner + timer
    ctx.textAlign='center';
    if(state==='play'&&phase==='roll'){
      if(clock<revealT){ ctx.fillStyle='rgba(255,220,90,0.95)';ctx.font='bold 20px sans-serif';ctx.fillText('ファウルがあった！ ボールの行方を見て判断しろ',W/2,52); }
      else { ctx.fillStyle='rgba(255,220,120,0.98)';ctx.font='bold 22px sans-serif';ctx.fillText('判定！ 流すか、笛か',W/2,52);
        const p=clamp((clock-revealT)/callWin,0,1),bw=250,x=W/2-bw/2,y=64;
        ctx.fillStyle='rgba(255,255,255,0.18)';ctx.fillRect(x,y,bw,7);ctx.fillStyle=p<0.7?'#8affa0':(p<1?'#ffd24d':'#ff5b5b');ctx.fillRect(x,y,bw*p,7); }
    }

    if(state==='play'){
      for(const b of BTN){ const active=phase==='roll'&&clock>=revealT;
        ctx.fillStyle=active?b.col:'rgba(255,255,255,0.10)';rr(b.x,BY,BW,BH,10);ctx.fill();
        ctx.fillStyle=active?'#08130c':'rgba(255,255,255,0.5)';ctx.textAlign='center';ctx.font='bold 19px sans-serif';ctx.fillText(b.label,b.x+BW/2,BY+27);
        ctx.font='11px sans-serif';ctx.fillText(b.sub,b.x+BW/2,BY+47); }
      ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='12px sans-serif';ctx.textAlign='center';ctx.fillText('タップ / ↑=プレーオン ・ ↓=笛',W/2,BY+BH+18);
    }
  }

  for(const p of parts){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,3.2,0,6.28);ctx.fill();}
  ctx.globalAlpha=1;
  for(const p of pops){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.font='bold 21px sans-serif';ctx.textAlign='center';ctx.fillText(p.txt,p.x,p.y);}
  ctx.globalAlpha=1;

  // HUD
  ctx.textAlign='left';ctx.fillStyle='#fff';ctx.font='bold 26px sans-serif';ctx.fillText('SCORE '+score,20,36);
  ctx.textAlign='right';ctx.fillStyle='rgba(255,255,255,0.9)';ctx.font='14px sans-serif';ctx.fillText('好判定 '+outs+'  Lv'+lvl,W-20,24);
  ctx.fillText('誤審',W-92,46);
  for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(W-60+i*20,41,7,0,6.28);ctx.fillStyle=i<fails?'#ff5b5b':'rgba(255,255,255,0.25)';ctx.fill();}
  if(combo>=2){ctx.textAlign='center';ctx.fillStyle='#ffd24d';ctx.font='bold 18px sans-serif';ctx.fillText('コンボ x'+combo,W/2,110);}

  if(state==='play'&&phase==='result'&&msg){ctx.textAlign='center';ctx.fillStyle=msgOk?'#9ff0b8':'#ff9a9a';ctx.font='bold 16px sans-serif';ctx.fillText(msg,W/2,468);}

  if(state==='title'){
    ctx.fillStyle='rgba(4,10,7,0.82)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='bold 40px sans-serif';ctx.fillText('アドバンテージ',W/2,90);
    ctx.fillStyle='#ffd23e';ctx.font='bold 22px sans-serif';ctx.fillText('Play On?',W/2,126);
    ctx.fillStyle='rgba(255,255,255,0.92)';ctx.font='16px sans-serif';
    ctx.fillText('主審として、ファウルの後のボールの行方を見て「流す（アドバンテージ）」か「笛」かを見極めろ',W/2,182);
    ctx.fillStyle='rgba(255,255,255,0.66)';ctx.font='14px sans-serif';
    ctx.fillText('反則の後、味方（青）がボールを保持して攻撃が続くなら＝プレーオン（↑/画面ボタン）で流す',W/2,220);
    ctx.fillText('相手（赤）にボールが渡る／流れて攻撃が途切れたなら＝笛（↓）でファウルを取る',W/2,244);
    ctx.fillText('ボールの行方が分かる前の判定＝早すぎ、誤審は失格ポイント、際どい判断を当てると大量加点',W/2,268);
    ctx.fillText('上級ほど行方が紛らわしく猶予も短い。3誤審で交代',W/2,292);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で開始',W/2,360);
    ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='14px sans-serif';ctx.fillText('BEST '+best,W/2,392);
  }
  if(state==='over'){
    ctx.fillStyle='rgba(4,10,7,0.84)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#ff6b6b';ctx.font='bold 46px sans-serif';ctx.fillText('3誤審…主審交代',W/2,222);
    ctx.fillStyle='#fff';ctx.font='bold 40px sans-serif';ctx.fillText('SCORE '+score,W/2,290);
    ctx.fillStyle='rgba(255,255,255,0.85)';ctx.font='19px sans-serif';ctx.fillText('好判定 '+outs+'   BEST '+best,W/2,330);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で もう一度',W/2,402);
  }

  if(flash>0.02){ctx.globalAlpha=flash*0.5;ctx.fillStyle=flashCol;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}
  ctx.restore();

  ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,0.4)';ctx.font='12px sans-serif';
  ctx.fillText('アドバンテージ：ファウル後、味方が保持＝プレーオンで流す／相手に渡り攻撃が途切れ＝笛。早判定/誤審は失敗、3つで交代',W/2,H-8);
}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

function frame(ts){let dt=ts-last;last=ts;if(dt>60)dt=60;if(dt<0)dt=0;update(dt);render();requestAnimationFrame(frame);}
requestAnimationFrame(frame);

// ---------- test hook ----------
window.__adv={
  start, makeCall:(c)=>makeCall(c),
  get state(){return state;},
  get score(){return score;},
  get outs(){return outs;},
  get fails(){return fails;},
  get info(){return {state,phase,clock,revealT,callWin,kind,tough,decided,call,result,outs,fails,lvl,
    revealed:(clock>=revealT),correctCall:(kind==='adv'?'playon':'whistle'),canAct:(phase==='roll'&&!decided)};}
};
})();
</script>
</body>
</html>
