<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>強襲 (Hot Shots)</title>
<style>
  html,body{margin:0;height:100%;background:#0a0f18;overflow:hidden;
    font-family:-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  #stage{position:relative;width:100vw;height:100vh;max-width:calc(100vh*1.5);max-height:calc(100vw/1.5);aspect-ratio:900/600;}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;border-radius:6px;}
</style>
</head>
<body>
<div id="wrap"><div id="stage"><canvas id="cv"></canvas></div></div>
<script>
(function(){
const W=900,H=600,cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let DPR=1;
function fit(){DPR=Math.min(2,window.devicePixelRatio||1);cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
fit();addEventListener('resize',fit);

// ---------- audio ----------
let AC=null;function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function tone(f,d,type,v,sweep){const a=ac();if(!a)return;const t=a.currentTime,o=a.createOscillator(),g=a.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(sweep)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+sweep),t+d);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v||0.2,t+0.008);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+0.02);}
function noise(d,v,hp){const a=ac();if(!a)return;const t=a.currentTime,n=Math.floor(a.sampleRate*d),buf=a.createBuffer(1,n,a.sampleRate),ch=buf.getChannelData(0);
  for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource();s.buffer=buf;
  const f=a.createBiquadFilter();f.type='highpass';f.frequency.value=hp||600;const g=a.createGain();g.gain.value=v||0.2;
  s.connect(f);f.connect(g);g.connect(a.destination);s.start(t);s.stop(t+d+0.02);}
const S={
  crack:()=>{noise(0.04,0.22,1300);tone(220,0.08,'square',0.12,180);},
  snag:()=>{noise(0.05,0.26,1400);tone(500,0.05,'square',0.12);},
  miss:()=>{tone(280,0.22,'sawtooth',0.18,-140);setTimeout(()=>tone(190,0.22,'sawtooth',0.14,-60),100);},
  move:()=>{noise(0.02,0.05,1800);},
  streak:()=>{[660,880,1100].forEach((f,i)=>setTimeout(()=>tone(f,0.1,'triangle',0.16),i*60));},
  over:()=>{[440,330,247,175].forEach((f,i)=>setTimeout(()=>tone(f,0.3,'triangle',0.2),i*160));}
};

// ---------- grid ----------
const LX=[288,450,612];       // 3 lanes
const HI_Y=402, LO_Y=470;     // liner(high) / grounder(low) catch heights
const BAT={x:450,y:120};
const CATCH_LINE=Y=>Y;        // arrival at HI_Y/LO_Y

// ---------- state ----------
let state='title', phase='wait', t=0, seen=0;
let score=0, combo=0, best=+(localStorage.getItem('hotshots_best')||0);
let catches=0, misses=0, lvl=1;
let ball=null, glove={lane:1,hi:false}, gx=LX[1], gy=LO_Y;
let waitT=0, result=null, resultT=0, msg='';
let shake=0, flash=0, flashCol='#fff', last=performance.now();
let parts=[], pops=[];

function rnd(a,b){return a+Math.random()*(b-a);}
function chance(p){return Math.random()<p;}
function clamp(v,a,b){return v<a?a:v>b?b:v;}

function reset(){state='title';score=0;combo=0;catches=0;misses=0;lvl=1;seen=0;ball=null;glove={lane:1,hi:false};result=null;parts=[];pops=[];}

function spawnBall(){
  seen++; lvl=Math.min(7,1+Math.floor(catches/5));
  const lane=Math.floor(rnd(0,3)); const hi=chance(0.5);
  const dur=Math.max(440,900-lvl*66)+ (hi?0:40);
  ball={lane,hi,sx:BAT.x,sy:BAT.y,tx:LX[lane],ty:hi?HI_Y:LO_Y,dur,t:0,judged:false};
  phase='fly'; S.crack();
}
function startWait(ms){ phase='wait'; waitT=ms; }
function start(){ if(!ac())ac(); if(AC&&AC.state==='suspended')AC.resume(); reset(); state='play'; startWait(600); }

function setGlove(lane,hi){
  if(state==='title'){start();return;}
  if(state==='over'){ if(resultT>0.4){reset();start();} return; }
  if(state!=='play')return;
  const nl=clamp(lane,0,2);
  if(nl!==glove.lane||hi!==glove.hi)S.move();
  glove.lane=nl; glove.hi=hi;
}

function judge(){
  ball.judged=true;
  const ok = glove.lane===ball.lane && glove.hi===ball.hi;
  if(ok){
    catches++; combo++; const add=Math.round(100*(1+Math.min(9,combo-1)*0.15)); score+=add;
    S.snag(); flash=0.7;flashCol='#8fe0a0';shake=6;
    burst(ball.tx,ball.ty,'#cfffe0',18,6); pop(ball.tx,ball.ty-26,'アウト！ +'+add,'#dfffe6');
    if(combo>0&&combo%5===0){S.streak();pop(450,250,'好守連発 x'+combo+'！','#ffd24d');flash=1;flashCol='#ffe08a';}
    result='snag'; startWait(Math.max(200,420-lvl*26));
  } else {
    misses++; combo=0; S.miss(); flash=1;flashCol='#ff5b5b';shake=12;
    burst(ball.tx,ball.ty,'#ff9a9a',16,6); pop(ball.tx,ball.ty-26,'弾いた！','#ffb0b0');
    result='miss'; startWait(560);
  }
}

// ---------- input ----------
cv.addEventListener('pointerdown',e=>{
  e.preventDefault();
  if(state==='title'||state==='over'){setGlove(1,false);return;}
  const r=cv.getBoundingClientRect(); const x=((e.clientX-r.left)/r.width)*W, y=((e.clientY-r.top)/r.height)*H;
  let lane = x<(LX[0]+LX[1])/2?0:(x<(LX[1]+LX[2])/2?1:2);
  const hi = y < (HI_Y+LO_Y)/2 - 6;
  setGlove(lane,hi);
});
addEventListener('keydown',e=>{
  if(state!=='play'){ if(e.code==='Space'||e.code==='Enter')setGlove(1,false); return; }
  if(e.code==='ArrowLeft'||e.code==='KeyA'){e.preventDefault();setGlove(glove.lane-1,glove.hi);}
  else if(e.code==='ArrowRight'||e.code==='KeyD'){e.preventDefault();setGlove(glove.lane+1,glove.hi);}
  else if(e.code==='ArrowUp'||e.code==='KeyW'){e.preventDefault();setGlove(glove.lane,true);}
  else if(e.code==='ArrowDown'||e.code==='KeyS'){e.preventDefault();setGlove(glove.lane,false);}
  else if(e.code==='Digit1'){setGlove(0,glove.hi);}else if(e.code==='Digit2'){setGlove(1,glove.hi);}else if(e.code==='Digit3'){setGlove(2,glove.hi);}
});

// ---------- particles ----------
function burst(x,y,c,n,sp){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=rnd(sp*0.3,sp);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:1,c});}}
function pop(x,y,txt,c){pops.push({x,y,txt,c,life:1});}

// ---------- update ----------
function update(dt){
  shake*=Math.pow(0.86,dt/16.7); if(shake<0.3)shake=0;
  flash*=Math.pow(0.9,dt/16.7);
  // glove visual ease
  const tgx=LX[glove.lane], tgy=glove.hi?HI_Y:LO_Y;
  gx+=(tgx-gx)*Math.min(1,dt/16.7*0.4); gy+=(tgy-gy)*Math.min(1,dt/16.7*0.4);
  for(const p of parts){p.vx*=0.96;p.vy=p.vy*0.96+0.28;p.x+=p.vx*dt/16.7;p.y+=p.vy*dt/16.7;p.life-=dt/16.7*0.03;}
  parts=parts.filter(p=>p.life>0);
  for(const p of pops){p.y-=dt/16.7*0.5;p.life-=dt/16.7*0.022;}
  pops=pops.filter(p=>p.life>0);

  if(state!=='play'){ if(state==='over')resultT+=dt/1000; return; }
  t+=dt;

  if(phase==='wait'){
    waitT-=dt; if(waitT<=0){ spawnBall(); }
    return;
  }
  if(phase==='fly'){
    ball.t+=dt; const f=clamp(ball.t/ball.dur,0,1);
    if(f>=1 && !ball.judged){ judge();
      if(misses>=3){ state='over'; resultT=0; S.over(); if(score>best){best=score;localStorage.setItem('hotshots_best',best);} }
    }
    return;
  }
}

// ---------- render ----------
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

function drawScene(){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#16233a');g.addColorStop(0.5,'#1a3324');g.addColorStop(1,'#20442d');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  // infield dirt band
  ctx.fillStyle='rgba(150,95,55,0.34)';ctx.fillRect(0,360,W,150);
  // batter
  ctx.fillStyle='rgba(0,0,0,0.2)';ctx.beginPath();ctx.ellipse(BAT.x,BAT.y+16,16,6,0,0,6.28);ctx.fill();
  ctx.fillStyle='#c94c4c';rr(BAT.x-10,BAT.y-10,20,26,7);ctx.fill();
  ctx.fillStyle='#f2c9a0';ctx.beginPath();ctx.arc(BAT.x,BAT.y-18,7,0,6.28);ctx.fill();
  // lane guides
  for(let i=0;i<3;i++){ ctx.strokeStyle='rgba(255,255,255,0.10)';ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(LX[i],200);ctx.lineTo(LX[i],510);ctx.stroke();
    // catch cells
    for(const hy of [HI_Y,LO_Y]){ const on = glove.lane===i && glove.hi===(hy===HI_Y);
      ctx.strokeStyle=on?'rgba(150,230,170,0.5)':'rgba(255,255,255,0.12)';ctx.lineWidth=on?2:1;
      rr(LX[i]-40,hy-26,80,46,9);ctx.stroke(); }
  }
  ctx.fillStyle='rgba(255,255,255,0.32)';ctx.font='12px sans-serif';ctx.textAlign='center';
  ctx.fillText('ライナー(上)',108,HI_Y+2);ctx.fillText('ゴロ(下)',108,LO_Y+6);
}

function drawGlove(){
  // fielder
  ctx.fillStyle='rgba(0,0,0,0.22)';ctx.beginPath();ctx.ellipse(gx,510,20,7,0,0,6.28);ctx.fill();
  ctx.fillStyle='#2b6cff';rr(gx-11,470,22,34,8);ctx.fill();
  ctx.fillStyle='#f2c9a0';ctx.beginPath();ctx.arc(gx,462,8,0,6.28);ctx.fill();
  // glove at cell
  ctx.fillStyle='#7a4a24';ctx.strokeStyle='#caa15a';ctx.lineWidth=3;
  ctx.beginPath();ctx.arc(gx,gy,15,0,6.28);ctx.fill();ctx.stroke();
  ctx.fillStyle='#5a3418';ctx.beginPath();ctx.arc(gx,gy,8,0,6.28);ctx.fill();
}

function render(){
  ctx.save();
  if(shake>0)ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
  drawScene();
  if(state==='play'||state==='over') drawGlove();

  if(state==='play'&&phase==='fly'&&ball){
    const f=clamp(ball.t/ball.dur,0,1); const bx=ball.sx+(ball.tx-ball.sx)*f, by=ball.sy+(ball.ty-ball.sy)*f;
    const r=6+f*6;
    for(let k=1;k<=4;k++){const ff=clamp(f-k*0.045,0,1);const tx2=ball.sx+(ball.tx-ball.sx)*ff,ty2=ball.sy+(ball.ty-ball.sy)*ff;
      ctx.globalAlpha=0.16;ctx.fillStyle=ball.hi?'#ffd27a':'#fff';ctx.beginPath();ctx.arc(tx2,ty2,r*0.7,0,6.28);ctx.fill();}
    ctx.globalAlpha=1;
    ctx.fillStyle=ball.hi?'#ffe6a0':'#fff';ctx.beginPath();ctx.arc(bx,by,r,0,6.28);ctx.fill();
    ctx.strokeStyle='#c33';ctx.lineWidth=1.3;ctx.beginPath();ctx.arc(bx,by,r,0.4,2.3);ctx.stroke();
    // target reticle at destination cell
    ctx.globalAlpha=0.4+0.3*f;ctx.strokeStyle=ball.hi?'#ffd27a':'#bfe0ff';ctx.lineWidth=2;
    rr(ball.tx-40,ball.ty-26,80,46,9);ctx.stroke();ctx.globalAlpha=1;
  }

  for(const p of parts){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,3.2,0,6.28);ctx.fill();}
  ctx.globalAlpha=1;
  for(const p of pops){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.font='bold 21px sans-serif';ctx.textAlign='center';ctx.fillText(p.txt,p.x,p.y);}
  ctx.globalAlpha=1;

  // HUD
  ctx.textAlign='left';ctx.fillStyle='#fff';ctx.font='bold 26px sans-serif';ctx.fillText('SCORE '+score,20,36);
  ctx.textAlign='right';ctx.fillStyle='rgba(255,255,255,0.85)';ctx.font='14px sans-serif';ctx.fillText('好守 '+catches+'  Lv'+lvl,W-20,24);
  ctx.fillText('エラー',W-96,46);
  for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(W-62+i*20,41,7,0,6.28);ctx.fillStyle=i<misses?'#ff5b5b':'rgba(255,255,255,0.22)';ctx.fill();}
  if(combo>=2){ctx.textAlign='center';ctx.fillStyle='#ffd24d';ctx.font='bold 18px sans-serif';ctx.fillText('コンボ x'+combo,450,320);}

  if(state==='play'&&phase==='wait'&&result==='miss'){
    ctx.textAlign='center';ctx.fillStyle='#ff9a9a';ctx.font='bold 22px sans-serif';ctx.fillText('エラー！ レーンか高さを外した',450,300);
  }

  if(state==='title'){
    ctx.fillStyle='rgba(6,10,18,0.68)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='bold 54px sans-serif';ctx.fillText('強襲',W/2,150);
    ctx.fillStyle='#ffd24d';ctx.font='bold 22px sans-serif';ctx.fillText('Hot Shots',W/2,186);
    ctx.fillStyle='rgba(255,255,255,0.9)';ctx.font='17px sans-serif';
    ctx.fillText('次々に襲いかかる強い打球を、反応でさばく守備の反射神経ゲーム',W/2,240);
    ctx.fillStyle='rgba(255,255,255,0.66)';ctx.font='14px sans-serif';
    ctx.fillText('打球の飛ぶ「レーン(左/中/右)」と「高さ（ライナー=上／ゴロ=下）」を素早く読み、',W/2,280);
    ctx.fillText('グラブを正しいマスへ移動して到達前に構える＝好捕（アウト）',W/2,302);
    ctx.fillText('レーン移動：←→（またはタップの左右）／高さ：↑↓（タップの上下）',W/2,330);
    ctx.fillText('速い打球ほど反応時間が短い。捕るほどレベルが上がり加速。3エラーで交代',W/2,352);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で開始',W/2,408);
    ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='14px sans-serif';ctx.fillText('BEST '+best,W/2,440);
  }
  if(state==='over'){
    ctx.fillStyle='rgba(6,10,18,0.76)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#ff6b6b';ctx.font='bold 46px sans-serif';ctx.fillText('3エラー…交代',W/2,222);
    ctx.fillStyle='#fff';ctx.font='bold 40px sans-serif';ctx.fillText('SCORE '+score,W/2,290);
    ctx.fillStyle='rgba(255,255,255,0.85)';ctx.font='19px sans-serif';ctx.fillText('好守 '+catches+'   BEST '+best,W/2,330);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で もう一度',W/2,402);
  }

  if(flash>0.02){ctx.globalAlpha=flash*0.5;ctx.fillStyle=flashCol;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}
  ctx.restore();

  ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,0.4)';ctx.font='12px sans-serif';
  ctx.fillText('レーン(←→)と高さ(↑↓ライナー/ゴロ)を読んでグラブを構える。速い打球を次々さばけ。3エラーで交代',W/2,H-8);
}

function frame(ts){let dt=ts-last;last=ts;if(dt>60)dt=60;if(dt<0)dt=0;update(dt);render();requestAnimationFrame(frame);}
requestAnimationFrame(frame);

// ---------- test hook ----------
window.__hs={
  start, set:(lane,hi)=>setGlove(lane,hi),
  get state(){return state;},
  get score(){return score;},
  get catches(){return catches;},
  get misses(){return misses;},
  get info(){return {state,phase, ballLane:ball?ball.lane:null, ballHi:ball?ball.hi:null,
    ballT:ball?ball.t/ball.dur:0, gloveLane:glove.lane, gloveHi:glove.hi, misses, catches, lvl};}
};
})();
</script>
</body>
</html>
