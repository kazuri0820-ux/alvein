<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ドリブル・スラローム — Dribble Slalom</title>
<style>
  :root{--pitch:#1aa054;--pitch-d:#127a3d;--chalk:#eaf7ee;--gold:#ffcf3a;--hot:#ff5a3c;--cyan:#3ae8cf;--ink:#06210f;--cone:#ff7a2f;}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:#04160c;font-family:"Arial Narrow","Roboto Condensed",system-ui,sans-serif;color:var(--chalk);
    display:flex;align-items:center;justify-content:center;overflow:hidden;-webkit-user-select:none;user-select:none;touch-action:none;}
  #stage{position:relative;width:min(100vw,calc(100vh*0.667));aspect-ratio:2/3;max-height:100vh;
    box-shadow:0 30px 80px rgba(0,0,0,.6);overflow:hidden;background:#1aa054;}
  canvas{display:block;width:100%;height:100%}
  #hud{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;padding:clamp(6px,2vw,12px);pointer-events:none;gap:8px;}
  .board{background:rgba(6,33,15,.72);backdrop-filter:blur(6px);border:1px solid rgba(58,232,207,.35);border-radius:10px;
    padding:5px clamp(9px,2.5vw,15px);display:flex;flex-direction:column;line-height:1;}
  .board .label{font-size:clamp(9px,2.4vw,12px);letter-spacing:.14em;text-transform:uppercase;color:var(--cyan);opacity:.9}
  .board .value{font-family:"Courier New",monospace;font-weight:700;font-size:clamp(20px,6vw,34px);font-variant-numeric:tabular-nums;}
  #score .value{color:var(--gold)}
  #timebar{position:absolute;top:clamp(52px,11vw,68px);left:8%;right:8%;height:9px;background:rgba(6,33,15,.6);border-radius:6px;overflow:hidden;border:1px solid rgba(255,255,255,.15);pointer-events:none;}
  #timefill{height:100%;width:100%;background:linear-gradient(90deg,var(--cyan),var(--gold));}
  #msg{position:absolute;top:22%;left:0;right:0;text-align:center;pointer-events:none;font-weight:900;
    font-size:clamp(24px,9vw,54px);color:#fff;opacity:0;transition:opacity .1s;text-transform:uppercase;
    text-shadow:0 4px 0 rgba(0,0,0,.3),0 0 30px currentColor;}
  #hint{position:absolute;bottom:0;left:0;right:0;text-align:center;padding:8px 12px calc(10px + env(safe-area-inset-bottom));
    font-size:clamp(12px,3.4vw,16px);letter-spacing:.03em;color:var(--chalk);background:linear-gradient(transparent,rgba(6,33,15,.6));pointer-events:none;}
  #hint b{color:var(--cyan)}
  #overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(10px,3vw,20px);
    text-align:center;padding:22px;background:radial-gradient(120% 70% at 50% 30%,rgba(26,160,84,.4),rgba(4,22,12,.93));backdrop-filter:blur(3px);z-index:5;transition:opacity .35s;}
  #overlay.hidden{opacity:0;pointer-events:none}
  #overlay h1{font-size:clamp(32px,12vw,70px);font-weight:900;letter-spacing:.02em;line-height:.9;text-transform:uppercase;color:var(--chalk);
    text-shadow:0 5px 0 rgba(0,0,0,.35),0 0 36px rgba(58,232,207,.4);}
  #overlay h1 span{display:block;color:var(--gold);font-size:.5em;letter-spacing:.2em}
  #overlay p{max-width:26ch;font-size:clamp(14px,4vw,18px);line-height:1.45;opacity:.92}
  #playBtn{pointer-events:auto;cursor:pointer;border:none;border-radius:100px;padding:clamp(13px,3vw,18px) clamp(32px,9vw,56px);
    font-family:inherit;font-weight:900;font-size:clamp(18px,5vw,26px);letter-spacing:.12em;text-transform:uppercase;color:var(--ink);
    background:linear-gradient(180deg,var(--cyan),#12b79c);box-shadow:0 8px 0 #0a6a5a,0 14px 30px rgba(0,0,0,.5);transition:transform .08s,box-shadow .08s;}
  #playBtn:active{transform:translateY(5px);box-shadow:0 3px 0 #0a6a5a}
  #playBtn:focus-visible{outline:3px solid var(--hot);outline-offset:4px}
  .sub{font-size:clamp(11px,3vw,14px);letter-spacing:.2em;text-transform:uppercase;color:var(--cyan);opacity:.85}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div id="stage">
  <canvas id="c"></canvas>
  <div id="hud">
    <div class="board" id="score"><span class="label">Score</span><span class="value" id="score-v">0</span></div>
    <div class="board" style="text-align:center"><span class="label">Combo</span><span class="value" id="combo">×1</span></div>
    <div class="board" style="text-align:right"><span class="label">Time</span><span class="value" id="time">45</span></div>
  </div>
  <div id="timebar"><div id="timefill"></div></div>
  <div id="msg"></div>
  <div id="hint"><b>ドラッグ / ← →</b> でボールを操ってゲートを通過！中央通過でボーナス</div>
  <div id="overlay">
    <div class="sub">Soccer · Time Attack</div>
    <h1>ドリブル<span>Slalom</span></h1>
    <p>転がるボールを左右に操り、コーンのゲートを<b style="color:var(--cyan)">通り抜けろ</b>。ボールには慣性があるので早めの操作を。中央を通すとパーフェクト＆コンボ加算。コーンに当たるとコンボ消滅。<b style="color:var(--gold)">45秒</b>で何点稼げる？</p>
    <button id="playBtn">Start</button>
    <div class="sub" style="opacity:.55">Drag / Arrows</div>
  </div>
</div>

<script>
(()=>{
"use strict";
const cvs=document.getElementById('c'),ctx=cvs.getContext('2d');
const W=560,H=900;let dpr=Math.min(window.devicePixelRatio||1,2);
function resize(){const r=cvs.getBoundingClientRect();cvs.width=Math.round(r.width*dpr);cvs.height=Math.round(r.height*dpr);
  ctx.setTransform(cvs.width/W,0,0,cvs.height/H,0,0);}
new ResizeObserver(resize).observe(cvs);resize();

let AC=null;function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function tone(f,d,t='sine',v=.18,to=null){const a=ac();if(!a)return;const o=a.createOscillator(),g=a.createGain();
  o.type=t;o.frequency.setValueAtTime(f,a.currentTime);if(to)o.frequency.exponentialRampToValueAtTime(to,a.currentTime+d);
  g.gain.setValueAtTime(v,a.currentTime);g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+d);
  o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+d);}
function noise(d,v){const a=ac();if(!a)return;const n=a.createBuffer(1,a.sampleRate*d,a.sampleRate);const dd=n.getChannelData(0);
  for(let i=0;i<dd.length;i++)dd[i]=(Math.random()*2-1)*(1-i/dd.length);const s=a.createBufferSource();s.buffer=n;const g=a.createGain();
  g.gain.value=v;s.connect(g);g.connect(a.destination);s.start();}
function sPass(c){tone(440+Math.min(900,c*40),.07,'square',.15,660+Math.min(900,c*40));}
const sPerfect=()=>{tone(700,.06,'square',.18);setTimeout(()=>tone(1050,.1,'square',.18),50);};
const sHit=()=>{noise(.14,.26);tone(180,.2,'sawtooth',.2,70);};

const MARGIN=46, R=16, BALLY=706;
const S={IDLE:'idle',PLAY:'play',OVER:'over'};
let state=S.IDLE;
let ball={x:280,vx:0}, targetX=null;
let gates=[], score=0, combo=0, timeLeft=45, scroll=0, spawnGap=0, streakPerfect=0;
let particles=[], shake=0, flash=0, flashCol='#ffcf3a', tPrev=0, best=0, lastCx=280;
const store={get(k){try{return localStorage.getItem(k);}catch(e){return null;}},set(k,v){try{localStorage.setItem(k,v);}catch(e){}}};
best=Number(store.get('ds_best')||0);

function reset(){ball={x:280,vx:0};targetX=null;gates=[];score=0;combo=0;timeLeft=45;scroll=0;spawnGap=0;streakPerfect=0;lastCx=280;particles=[];updateHUD();}
function start(){reset();document.getElementById('overlay').classList.add('hidden');state=S.PLAY;spawnGate(-40);spawnGate(-260);spawnGate(-480);}
function updateHUD(){document.getElementById('score-v').textContent=score;document.getElementById('combo').textContent='×'+(1+Math.floor(combo/3));
  document.getElementById('time').textContent=Math.ceil(Math.max(0,timeLeft));document.getElementById('timefill').style.width=(Math.max(0,timeLeft)/45*100)+'%';}
let msgT=null;function showMsg(t,c){const m=document.getElementById('msg');m.textContent=t;m.style.color=c;m.style.opacity='1';
  clearTimeout(msgT);msgT=setTimeout(()=>m.style.opacity='0',600);}

function spawnGate(y){const diff=Math.min(1,(45-timeLeft)/40);
  const gap=Math.max(44,72-diff*26);
  const center=W/2, minC=MARGIN+gap, maxC=W-MARGIN-gap;
  // zig-zag: place the gap toward the opposite side of the previous gate so you must weave
  const side=lastCx>=center?-1:1;
  const maxAmp=side>0?(maxC-center):(center-minC);
  const amp=62+Math.random()*Math.max(1,maxAmp-62);
  let cx=Math.max(minC,Math.min(maxC,center+side*amp));
  lastCx=cx;
  const gold=Math.random()<0.14;
  gates.push({y:y,cx,gap,gold,done:false,result:0});}

// input
let keys={};let dragging=false;
function ptx(e){const r=cvs.getBoundingClientRect();return (e.clientX-r.left)/r.width*W;}
cvs.addEventListener('pointerdown',e=>{e.preventDefault();const a=ac();a&&a.resume&&a.resume();
  if(state===S.IDLE||state===S.OVER)return;dragging=true;targetX=Math.max(MARGIN,Math.min(W-MARGIN,ptx(e)));});
cvs.addEventListener('pointermove',e=>{if(dragging)targetX=Math.max(MARGIN,Math.min(W-MARGIN,ptx(e)));});
window.addEventListener('pointerup',()=>{dragging=false;targetX=null;});
window.addEventListener('keydown',e=>{const a=ac();a&&a.resume&&a.resume();
  if(e.code==='Space'){e.preventDefault();if(state===S.IDLE||state===S.OVER)start();return;}
  if(e.code==='ArrowLeft'||e.code==='KeyA'){keys.l=true;e.preventDefault();}if(e.code==='ArrowRight'||e.code==='KeyD'){keys.r=true;e.preventDefault();}});
window.addEventListener('keyup',e=>{if(e.code==='ArrowLeft'||e.code==='KeyA')keys.l=false;if(e.code==='ArrowRight'||e.code==='KeyD')keys.r=false;});
document.getElementById('playBtn').addEventListener('click',e=>{e.stopPropagation();ac()&&ac().resume&&ac().resume();start();});

function gateResult(g){
  const d=Math.abs(ball.x-g.cx);
  if(d<=g.gap){ // passed
    const perfect=d<g.gap*0.32;
    combo++;const mult=1+Math.floor(combo/3);
    let pts=(perfect?150:80)*mult*(g.gold?2:1);score+=pts;
    if(perfect){streakPerfect++;sPerfect();showMsg((g.gold?'GOLD ':'')+'PERFECT +'+pts,'#ffcf3a');flash=.35;flashCol='#ffcf3a';
      burst(g.cx,BALLY,['#ffcf3a','#fff','#3ae8cf'],14);}
    else{streakPerfect=0;sPass(combo);burst(ball.x,BALLY,g.gold?['#ffcf3a','#fff']:['#3ae8cf','#fff'],8);}
    g.result=perfect?2:1;
  } else { // hit a cone
    combo=0;streakPerfect=0;sHit();shake=12;flash=.4;flashCol='#ff5a3c';showMsg('コーンに接触！','#ff5a3c');
    ball.vx*= -0.4;score=Math.max(0,score-20);burst(ball.x<g.cx?g.cx-g.gap:g.cx+g.gap,BALLY,['#ff7a2f','#fff'],14);
    g.result=-1;}
  g.done=true;updateHUD();
}
function endGame(){state=S.OVER;if(score>best){best=score;store.set('ds_best',score);}
  const ov=document.getElementById('overlay');
  const rating=score>=6000?'メッシ級！':score>=3500?'テクニシャン':score>=2000?'ドリブラー':score>=800?'まずまず':'練習あるのみ';
  ov.querySelector('.sub').textContent='Time up';
  ov.querySelector('h1').innerHTML=score+'<span>'+rating+'</span>';
  ov.querySelector('p').innerHTML='<b style="color:var(--gold)">'+rating+'</b> ／ ベスト '+best+'<br>中央通過でパーフェクト、コンボを繋げてハイスコアを狙え！';
  ov.querySelector('#playBtn').textContent='Retry';ov.classList.remove('hidden');}

function burst(x,y,cols,n){for(let i=0;i<n;i++){const a=Math.random()*7,s=1+Math.random()*5;
  particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:1,col:cols[i%cols.length],r:2+Math.random()*3});}}

function update(dt){
  if(state===S.PLAY){
    timeLeft-=dt;if(timeLeft<=0){timeLeft=0;updateHUD();return endGame();}
    const diff=Math.min(1,(45-timeLeft)/40);
    const speed=250+diff*230;
    scroll+=speed*dt;
    // steering — responsive velocity tracking toward the target, with a little inertia
    if(targetX!=null){const desired=Math.max(-720,Math.min(720,(targetX-ball.x)*6));ball.vx+=(desired-ball.vx)*Math.min(1,dt*12);}
    else{if(keys.l)ball.vx-=1500*dt;if(keys.r)ball.vx+=1500*dt;ball.vx*=Math.pow(0.03,dt);}
    ball.x+=ball.vx*dt;
    if(ball.x<MARGIN){ball.x=MARGIN;ball.vx*=-0.3;}if(ball.x>W-MARGIN){ball.x=W-MARGIN;ball.vx*=-0.3;}
    // gates move down; resolve when reaching the ball line
    for(const g of gates){g.y+=speed*dt;if(!g.done&&g.y>=BALLY){gateResult(g);}}
    gates=gates.filter(g=>g.y<H+60);
    // spawn the next gate once the previous has scrolled down far enough
    spawnGap-=speed*dt;
    if(spawnGap<=0){spawnGate(-40);spawnGap=252+Math.random()*70-diff*46;}
    updateHUD();
  }
  for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.x+=p.vx;p.y+=p.vy;p.vy+=.2;p.life-=dt*1.3;if(p.life<=0)particles.splice(i,1);}
  if(shake>0)shake=Math.max(0,shake-dt*30);if(flash>0)flash=Math.max(0,flash-dt*1.6);
}

function drawScene(){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#1aa85a');g.addColorStop(1,'#127a3d');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  const stripeH=110,off=scroll%stripeH;
  for(let y=-stripeH+off;y<H;y+=stripeH){ctx.fillStyle='rgba(255,255,255,.045)';ctx.fillRect(0,y,W,stripeH/2);}
  ctx.strokeStyle='rgba(255,255,255,.35)';ctx.lineWidth=5;
  ctx.beginPath();ctx.moveTo(20,0);ctx.lineTo(20,H);ctx.moveTo(W-20,0);ctx.lineTo(W-20,H);ctx.stroke();
}
function drawCone(x,y,gold){ctx.save();ctx.translate(x,y);
  ctx.fillStyle='rgba(0,0,0,.2)';ctx.beginPath();ctx.ellipse(0,6,14,4,0,0,7);ctx.fill();
  ctx.fillStyle=gold?'#ffcf3a':'#ff7a2f';ctx.beginPath();ctx.moveTo(0,-22);ctx.lineTo(11,8);ctx.lineTo(-11,8);ctx.closePath();ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.85)';ctx.fillRect(-9,-6,18,4);ctx.restore();}
function drawGate(g){
  // cones at gap edges + connecting markers across (barrier)
  ctx.save();ctx.strokeStyle=g.gold?'rgba(255,207,58,.35)':'rgba(255,255,255,.18)';ctx.lineWidth=3;ctx.setLineDash([5,10]);
  ctx.beginPath();ctx.moveTo(20,g.y);ctx.lineTo(g.cx-g.gap,g.y);ctx.moveTo(g.cx+g.gap,g.y);ctx.lineTo(W-20,g.y);ctx.stroke();ctx.setLineDash([]);
  // gap glow
  ctx.fillStyle=g.gold?'rgba(255,207,58,.14)':'rgba(58,232,207,.10)';ctx.fillRect(g.cx-g.gap,g.y-30,g.gap*2,60);
  ctx.restore();
  drawCone(g.cx-g.gap,g.y,g.gold);drawCone(g.cx+g.gap,g.y,g.gold);
}
function drawBall(){
  const y=BALLY;
  // player behind ball
  ctx.save();ctx.translate(ball.x-Math.sign(ball.vx||1)*2,y+30);
  ctx.fillStyle='rgba(0,0,0,.25)';ctx.beginPath();ctx.ellipse(0,10,20,6,0,0,7);ctx.fill();
  ctx.fillStyle='#1f6fe0';ctx.beginPath();ctx.roundRect?ctx.roundRect(-13,-34,26,36,7):ctx.rect(-13,-34,26,36);ctx.fill();
  ctx.fillStyle='#e8b88a';ctx.beginPath();ctx.arc(0,-42,10,0,7);ctx.fill();ctx.restore();
  // ball with spin from vx
  ctx.save();ctx.translate(ball.x,y);ctx.rotate((scroll+ball.x)*0.02);
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(0,0,R,0,7);ctx.fill();
  ctx.fillStyle='#111';for(let i=0;i<5;i++){const a=i*1.256;ctx.beginPath();ctx.arc(Math.cos(a)*R*0.5,Math.sin(a)*R*0.5,R*0.2,0,7);ctx.fill();}
  ctx.strokeStyle='rgba(0,0,0,.25)';ctx.lineWidth=1.4;ctx.beginPath();ctx.arc(0,0,R,0,7);ctx.stroke();ctx.restore();
  // aim guide line to help judge
  ctx.save();ctx.strokeStyle='rgba(255,255,255,.2)';ctx.lineWidth=2;ctx.setLineDash([4,10]);
  ctx.beginPath();ctx.moveTo(ball.x,y-24);ctx.lineTo(ball.x,120);ctx.stroke();ctx.setLineDash([]);ctx.restore();
}
function render(){
  ctx.clearRect(0,0,W,H);ctx.save();
  if(shake>0)ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
  drawScene();
  for(const g of gates)if(!g.done||g.y<BALLY+40)drawGate(g);
  if(state!==S.IDLE)drawBall();
  for(const p of particles){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.col;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill();}
  ctx.globalAlpha=1;ctx.restore();
  if(flash>0){ctx.fillStyle='rgba('+(flashCol==='#ff5a3c'?'255,90,60':'255,207,58')+','+(flash*0.2)+')';ctx.fillRect(0,0,W,H);}
}
function loop(t){if(!tPrev)tPrev=t;let dt=(t-tPrev)/1000;tPrev=t;if(dt>.04)dt=.04;update(dt);render();requestAnimationFrame(loop);}
requestAnimationFrame(loop);state=S.IDLE;
// test hook (inert unless URL hash has "test")
if(location.hash.indexOf('test')>=0){window.__ds={get state(){return state;},get ballX(){return ball.x;},get score(){return score;},get timeLeft(){return timeLeft;},
  get nextGate(){let best=null,by=-1e9;for(const g of gates){if(!g.done&&g.y<BALLY&&g.y>by){by=g.y;best=g;}}return best?{cx:best.cx,gap:best.gap,y:best.y}:null;},
  setTarget(x){targetX=Math.max(MARGIN,Math.min(W-MARGIN,x));},setTime(s){timeLeft=s;}};}
})();
</script>
