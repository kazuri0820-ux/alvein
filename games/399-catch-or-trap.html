<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>捕球かワンバウンドか (Catch or Trap?)</title>
<style>
  html,body{margin:0;height:100%;background:#0a0d08;overflow:hidden;
    font-family:-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  #stage{position:relative;width:100vw;height:100vh;max-width:calc(100vh*1.5);max-height:calc(100vw/1.5);aspect-ratio:900/600;}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;border-radius:6px;}
</style>
</head>
<body>
<div id="wrap"><div id="stage"><canvas id="cv"></canvas></div></div>
<script>
(function(){
const W=900,H=600,cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let DPR=1;
function fit(){DPR=Math.min(2,window.devicePixelRatio||1);cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
fit();addEventListener('resize',fit);

// ---------- audio ----------
let AC=null;function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function tone(f,d,type,v,sweep){const a=ac();if(!a)return;const t=a.currentTime,o=a.createOscillator(),g=a.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(sweep)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+sweep),t+d);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v||0.2,t+0.008);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+0.02);}
function noise(d,v,hp){const a=ac();if(!a)return;const t=a.currentTime,n=Math.floor(a.sampleRate*d),buf=a.createBuffer(1,n,a.sampleRate),ch=buf.getChannelData(0);
  for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource();s.buffer=buf;
  const f=a.createBiquadFilter();f.type='highpass';f.frequency.value=hp||600;const g=a.createGain();g.gain.value=v||0.2;
  s.connect(f);f.connect(g);g.connect(a.destination);s.start(t);s.stop(t+d+0.02);}
const S={
  liner:()=>{noise(0.05,0.12,700);tone(300,0.05,'square',0.06,-40);},
  glove:()=>{noise(0.05,0.2,1200);tone(360,0.04,'square',0.07);},
  dust:()=>{noise(0.14,0.16,300);},
  right:()=>{[660,900,1180].forEach((f,i)=>setTimeout(()=>tone(f,0.11,'triangle',0.16),i*56));},
  big:()=>{[600,800,1000,1250].forEach((f,i)=>setTimeout(()=>tone(f,0.12,'triangle',0.17),i*80));},
  bad:()=>{noise(0.2,0.24,240);tone(150,0.24,'sawtooth',0.13,-50);},
  streak:()=>{[700,930,1170,1400].forEach((f,i)=>setTimeout(()=>tone(f,0.1,'triangle',0.16),i*60));},
  over:()=>{[440,330,247,175].forEach((f,i)=>setTimeout(()=>tone(f,0.3,'triangle',0.2),i*160));}
};

// ---------- geometry ----------
const GRASS=372;                    // the grass line (glove-contact reference)
const DIVE={x:452,y:352};           // where the diving outfielder's glove reaches
const BALL0={x:150,y:150};          // sinking liner origin

// ---------- state ----------
let state='title', phase='watch', plays=0;
let score=0, combo=0, best=+(localStorage.getItem('tc_best')||0);
let outs=0, fails=0, lvl=1;   // outs = correct calls
let clock=0, revealT=520, callWin=980, truth='CAUGHT', tough=false;
let decided=false, pick=null, result=null, resultT=0, msg='', msgOk=false, anim=0;
let contactH=14;                    // height above grass at glove contact (small=trap, big=clean)
let shake=0, flash=0, flashCol='#fff', last=performance.now();
let parts=[], pops=[];

function rnd(a,b){return a+Math.random()*(b-a);}
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function lerp(a,b,u){return a+(b-a)*u;}
function easeOut(u){return 1-Math.pow(1-u,2);}

function reset(){state='title';score=0;combo=0;outs=0;fails=0;lvl=1;plays=0;result=null;parts=[];pops=[];}

function newPlay(){
  plays++; lvl=Math.min(7,1+Math.floor(outs/4));
  revealT=clamp(560-lvl*24,360,560);
  callWin=clamp(1020-lvl*70,560,1020);
  tough=Math.random()<clamp(0.2+lvl*0.05,0.2,0.5);
  truth=(Math.random()<0.5?'CAUGHT':'TRAPPED');
  contactH = truth==='CAUGHT' ? (tough?rnd(6,12):rnd(14,26)) : (tough? -rnd(1,5) : -rnd(6,16));
  phase='watch'; clock=0; decided=false; pick=null; result=null; resultT=0; msg=''; msgOk=false; anim=0;
  S.liner();
}
function start(){ if(!ac())ac(); if(AC&&AC.state==='suspended')AC.resume(); reset(); state='play'; newPlay(); }

// OUT = clean catch ; SAFE = trapped (short-hopped)
function makeCall(c){
  if(state==='title'){start();return;}
  if(state==='over'){ if(resultT>0.4){reset();start();} return; }
  if(state!=='play'||phase!=='watch'||decided) return;
  if(clock<revealT){ decided=true; pick=c; resolve('early'); return; }
  decided=true; pick=c;
  const correct=(c==='OUT'&&truth==='CAUGHT')||(c==='SAFE'&&truth==='TRAPPED');
  resolve(correct?'right':'wrong');
}

function resolve(k){
  phase='result'; result=k; resultT=0; anim=0;
  if(k==='right'){
    outs++; combo++;
    let add=Math.round((tough?250:150)*(1+Math.min(9,combo-1)*0.14)); score+=add;
    if(truth==='CAUGHT')S.glove(); else S.dust(); setTimeout(S.right,140); if(tough)setTimeout(S.big,220);
    msgOk=true; flash=1;flashCol='#8affa0';shake=6; burst(DIVE.x,DIVE.y,'#8affa0',18,7);
    pop(W/2,236,(tough?'紙一重の際どい打球を正確にジャッジ！ +':'正しくジャッジ——ナイスコール！ +')+add,'#d6ffe0');
    if(combo>=2)pop(W/2,204,'コンボ x'+combo,'#ffd24d');
    if(combo>0&&combo%5===0)S.streak();
    msg=(truth==='CAUGHT')?'グラブが地面すれすれで球の下に入っていた——ノーバウンド捕球でアウト！正しいジャッジ':'球はグラブの直前でワンバウンドしていた——トラップ、ノーキャッチ＝ヒット（セーフ）！正しいジャッジ';
  } else {
    fails++; combo=0; msgOk=false; flash=1;flashCol='#ff5b5b';shake=8; S.bad();
    if(k==='early') msg='判定が早い…捕球の瞬間（グラブと地面の関係）が見える前にコールし、誤審となった';
    else if(k==='wrong'){
      msg=(truth==='CAUGHT')?'誤審…実際はノーバウンドの好捕だったのに“ヒット（セーフ）”とコール＝アウトを取り消してしまった':'誤審…実際はワンバウンドのトラップだったのに“アウト”とコール＝ヒットの走者をアウトにしてしまった';
    }
    else msg='判定が遅い…コールが間に合わず、両軍が抗議する曖昧な裁定になった';
    pop(W/2,236,(k==='wrong')?'誤審…':(k==='early')?'早い…見る前にコール':'遅い…判定できず','#ffb0b0');
  }
  if(fails>=3){ state='over'; resultT=0; S.over(); if(score>best){best=score;localStorage.setItem('tc_best',best);} }
}

// ---------- input ----------
const BW=250, BY=506, BH=64, BL=150, BR=500;
cv.addEventListener('pointerdown',e=>{e.preventDefault();
  if(state!=='play'||phase!=='watch'){ makeCall('OUT'); return; }
  const r=cv.getBoundingClientRect(); const x=(e.clientX-r.left)/r.width*W, y=(e.clientY-r.top)/r.height*H;
  if(y>=BY&&y<=BY+BH){ if(x>=BL&&x<=BL+BW){ makeCall('OUT'); return; } if(x>=BR&&x<=BR+BW){ makeCall('SAFE'); return; } }
  makeCall(y<H*0.5?'OUT':'SAFE');
});
addEventListener('keydown',e=>{ if(e.repeat)return;
  if(e.code==='ArrowUp'||e.code==='KeyW'){e.preventDefault();makeCall('OUT');}
  else if(e.code==='ArrowDown'||e.code==='KeyS'){e.preventDefault();makeCall('SAFE');}
  else if(e.code==='Space'||e.code==='Enter'){e.preventDefault(); if(state!=='play')makeCall('OUT');} });

// ---------- particles ----------
function burst(x,y,c,n,sp){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=rnd(sp*0.3,sp);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:1,c});}}
function pop(x,y,txt,c){pops.push({x,y,txt,c,life:1});}

// ---------- update ----------
function update(dt){
  shake*=Math.pow(0.86,dt/16.7); if(shake<0.3)shake=0;
  flash*=Math.pow(0.9,dt/16.7);
  for(const p of parts){p.vx*=0.96;p.vy=p.vy*0.96+0.28;p.x+=p.vx*dt/16.7;p.y+=p.vy*dt/16.7;p.life-=dt/16.7*0.026;}
  parts=parts.filter(p=>p.life>0);
  for(const p of pops){p.y-=dt/16.7*0.5;p.life-=dt/16.7*0.02;}
  pops=pops.filter(p=>p.life>0);

  if(state!=='play'){ if(state==='over')resultT+=dt/1000; return; }
  if(phase==='watch'){ const before=clock<revealT; clock+=dt;
    if(before&&clock>=revealT){ if(truth==='CAUGHT')S.glove(); else S.dust(); if(truth==='TRAPPED')burst(DIVE.x,GRASS,'#caa86a',8,4); }
    if(!decided && clock>revealT+callWin){ decided=true; resolve('late'); }
    return; }
  if(phase==='result'){ resultT+=dt/1000; anim=Math.min(1,anim+dt/360); if(resultT>1.6) newPlay(); return; }
}

// ---------- render ----------
function drawField(){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#12703f');g.addColorStop(0.5,'#0f5e34');g.addColorStop(1,'#0c4c2b');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='rgba(255,255,255,0.03)';for(let i=0;i<6;i++){ if(i%2===0)ctx.fillRect(0,60+i*95,W,95); }
  // grass / dirt reference line
  ctx.strokeStyle='rgba(255,255,255,0.12)';ctx.lineWidth=2;ctx.setLineDash([10,8]);
  ctx.beginPath();ctx.moveTo(60,GRASS);ctx.lineTo(W-60,GRASS);ctx.stroke();ctx.setLineDash([]);
  ctx.fillStyle='rgba(90,120,60,0.18)';ctx.fillRect(0,GRASS,W,H-GRASS);
}
function diver(x,y,col,ext){ // diving outfielder, glove reaching to (x - ext)
  ctx.save();ctx.translate(x,y);
  ctx.fillStyle='rgba(0,0,0,0.2)';ctx.beginPath();ctx.ellipse(0,20,22,6,0,0,6.28);ctx.fill();
  ctx.save();ctx.rotate(-0.9);
  ctx.fillStyle=col;ctx.beginPath();ctx.ellipse(0,-8,10,17,0,0,6.28);ctx.fill();
  ctx.fillStyle='#f0c9a0';ctx.beginPath();ctx.arc(0,-28,7,0,6.28);ctx.fill();
  ctx.restore();
  // outstretched arm+glove toward the ball (up-left)
  ctx.strokeStyle=col;ctx.lineWidth=7;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(-4,-6);ctx.lineTo(-ext,-30);ctx.stroke();
  ctx.fillStyle='#5a3d24';ctx.beginPath();ctx.arc(-ext,-32,9,0,6.28);ctx.fill();
  ctx.restore();
}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

function render(){
  ctx.save();
  if(shake>0)ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
  drawField();

  if(state==='play'||state==='over'){
    const revealed=(phase==='watch'&&clock>=revealT)||phase==='result';
    // glove contact point: at reveal the glove reaches the ball near the grass
    const gloveTipX=DIVE.x-58, gloveTipY=GRASS-2;
    // diving fielder
    diver(DIVE.x+18,DIVE.y,'#c85049',76);

    // ball path: sinking liner descending to the glove/grass
    let bx,by;
    if(phase==='watch'){
      const u=clamp(clock/revealT,0,1);
      bx=lerp(BALL0.x,gloveTipX,easeOut(u));
      by=lerp(BALL0.y,gloveTipY-Math.max(0,contactH),easeOut(u));   // ends slightly above/at grass
    } else {
      const u=easeOut(anim);
      // settle at contact point then a small follow
      const cy=gloveTipY-Math.max(-2,contactH);
      bx=lerp(gloveTipX,gloveTipX+ (truth==='CAUGHT'? 4 : 30), u);
      by=lerp(cy, truth==='CAUGHT'? cy : GRASS-3, u);
    }
    // dust puff if trapped (revealed)
    if(revealed && truth==='TRAPPED'){ ctx.fillStyle='rgba(200,175,120,0.35)';ctx.beginPath();ctx.ellipse(gloveTipX,GRASS,20,7,0,0,6.28);ctx.fill(); }
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(bx,by,8,0,6.28);ctx.fill();
    ctx.strokeStyle='#c33';ctx.lineWidth=1;ctx.beginPath();ctx.arc(bx,by,8,0.4,2.2);ctx.stroke();

    // zoom marker on contact vs grass at reveal
    ctx.textAlign='center';
    if(revealed&&phase==='watch'){
      if(truth==='CAUGHT'){ ctx.fillStyle='rgba(140,255,160,0.98)';ctx.font='bold 26px sans-serif';ctx.fillText('グラブが下に入った！（ノーバウンド）',W/2,300); }
      else { ctx.fillStyle='rgba(255,150,90,0.98)';ctx.font='bold 26px sans-serif';ctx.fillText('直前でワンバウンド！（トラップ）',W/2,300); }
    }
    if(state==='play'&&phase==='watch'){
      if(clock<revealT){ ctx.fillStyle='rgba(255,220,90,0.95)';ctx.font='bold 20px sans-serif';ctx.fillText('沈む打球にダイビング——捕ったか、ワンバウンドか、よく見ろ！',W/2,44); }
      else { ctx.fillStyle='rgba(255,220,120,0.98)';ctx.font='bold 22px sans-serif';ctx.fillText('コールしろ！',W/2,44);
        const p=clamp((clock-revealT)/callWin,0,1),bw=250,x=W/2-bw/2,y=58;
        ctx.fillStyle='rgba(255,255,255,0.18)';ctx.fillRect(x,y,bw,7);ctx.fillStyle=p<0.7?'#8affa0':(p<1?'#ffd24d':'#ff5b5b');ctx.fillRect(x,y,bw*p,7); }
    }
    // call buttons
    if(state==='play'){
      const active=phase==='watch'&&clock>=revealT;
      ctx.fillStyle=active?'#2b8a5b':'rgba(255,255,255,0.10)';rr(BL,BY,BW,BH,10);ctx.fill();
      ctx.fillStyle=active?'#eafff0':'rgba(255,255,255,0.5)';ctx.textAlign='center';ctx.font='bold 20px sans-serif';ctx.fillText('▲ アウト（捕球）',BL+BW/2,BY+27);
      ctx.font='11px sans-serif';ctx.fillText('ノーバウンドで捕った（↑/W）',BL+BW/2,BY+46);
      ctx.fillStyle=active?'#b5502f':'rgba(255,255,255,0.10)';rr(BR,BY,BW,BH,10);ctx.fill();
      ctx.fillStyle=active?'#fff0ea':'rgba(255,255,255,0.5)';ctx.fillText('セーフ（ヒット）▼',BR+BW/2,BY+27);
      ctx.font='11px sans-serif';ctx.fillText('ワンバウンド＝トラップ（↓/S）',BR+BW/2,BY+46);
    }
  }

  for(const p of parts){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,3.2,0,6.28);ctx.fill();}
  ctx.globalAlpha=1;
  for(const p of pops){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.font='bold 20px sans-serif';ctx.textAlign='center';ctx.fillText(p.txt,p.x,p.y);}
  ctx.globalAlpha=1;

  // HUD
  ctx.textAlign='left';ctx.fillStyle='#fff';ctx.font='bold 26px sans-serif';ctx.fillText('SCORE '+score,20,36);
  ctx.textAlign='right';ctx.fillStyle='rgba(255,255,255,0.9)';ctx.font='14px sans-serif';ctx.fillText('好判定 '+outs+'  Lv'+lvl,W-20,24);
  ctx.fillText('誤審',W-96,46);
  for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(W-56+i*20,41,7,0,6.28);ctx.fillStyle=i<fails?'#ff5b5b':'rgba(255,255,255,0.25)';ctx.fill();}
  if(combo>=2){ctx.textAlign='center';ctx.fillStyle='#ffd24d';ctx.font='bold 18px sans-serif';ctx.fillText('コンボ x'+combo,W/2,110);}

  if(state==='play'&&phase==='result'&&msg){ctx.textAlign='center';ctx.fillStyle=msgOk?'#9ff0b8':'#ff9a9a';ctx.font='bold 14px sans-serif';ctx.fillText(msg,W/2,262);}

  if(state==='title'){
    ctx.fillStyle='rgba(4,8,4,0.84)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='bold 36px sans-serif';ctx.fillText('捕球かワンバウンドか',W/2,78);
    ctx.fillStyle='#ffd23e';ctx.font='bold 22px sans-serif';ctx.fillText('Catch or Trap?',W/2,114);
    ctx.fillStyle='rgba(255,255,255,0.92)';ctx.font='16px sans-serif';
    ctx.fillText('塁審として、沈む打球へのダイビングキャッチが“ノーバウンド捕球”か“ワンバウンドのトラップ”かを見極めろ',W/2,168);
    ctx.fillStyle='rgba(255,255,255,0.66)';ctx.font='14px sans-serif';
    ctx.fillText('捕球の瞬間、グラブが球の下に入っていた＝アウト（↑/W・左ボタン）／直前でワンバウンド＝セーフ＝ヒット（↓/S・右ボタン）',W/2,206);
    ctx.fillText('正しくコールすれば加点。紙一重の際どい打球（tough）を裁くと大量加点＆コンボ',W/2,230);
    ctx.fillText('見える前にコール＝早すぎ／逆をコール＝誤審／判定できず＝失敗、いずれも誤審',W/2,254);
    ctx.fillText('上級ほど捕球が速く見極めが紙一重で猶予も短い。3誤審で交代',W/2,278);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で開始',W/2,348);
    ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='14px sans-serif';ctx.fillText('BEST '+best,W/2,380);
  }
  if(state==='over'){
    ctx.fillStyle='rgba(4,8,4,0.86)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#ff6b6b';ctx.font='bold 46px sans-serif';ctx.fillText('3誤審…交代',W/2,222);
    ctx.fillStyle='#fff';ctx.font='bold 40px sans-serif';ctx.fillText('SCORE '+score,W/2,290);
    ctx.fillStyle='rgba(255,255,255,0.85)';ctx.font='19px sans-serif';ctx.fillText('好判定 '+outs+'   BEST '+best,W/2,330);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で もう一度',W/2,402);
  }

  if(flash>0.02){ctx.globalAlpha=flash*0.5;ctx.fillStyle=flashCol;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}
  ctx.restore();

  ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,0.4)';ctx.font='12px sans-serif';
  ctx.fillText('捕球かワンバウンドか：ダイビングが捕球（アウト）かトラップ（セーフ）かを見極めてコール。逆・早い・遅いは誤審、3誤審で交代',W/2,H-8);
}

function frame(ts){let dt=ts-last;last=ts;if(dt>60)dt=60;if(dt<0)dt=0;update(dt);render();requestAnimationFrame(frame);}
requestAnimationFrame(frame);

// ---------- test hook ----------
window.__tc={
  start, out:()=>makeCall('OUT'), safe:()=>makeCall('SAFE'),
  get state(){return state;},
  get score(){return score;},
  get outs(){return outs;},
  get fails(){return fails;},
  get info(){return {state,phase,clock,revealT,callWin,truth,tough,decided,result,outs,fails,lvl,
    isCaught:(truth==='CAUGHT'),revealed:(clock>=revealT),canAct:(phase==='watch'&&!decided)};}
};
})();
</script>
</body>
</html>
