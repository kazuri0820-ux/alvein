<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>フックスライド (Evade the Tag)</title>
<style>
  html,body{margin:0;height:100%;background:#0c0f0a;overflow:hidden;
    font-family:-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  #stage{position:relative;width:100vw;height:100vh;max-width:calc(100vh*1.5);max-height:calc(100vw/1.5);aspect-ratio:900/600;}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;border-radius:6px;}
</style>
</head>
<body>
<div id="wrap"><div id="stage"><canvas id="cv"></canvas></div></div>
<script>
(function(){
const W=900,H=600,cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let DPR=1;
function fit(){DPR=Math.min(2,window.devicePixelRatio||1);cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
fit();addEventListener('resize',fit);

// ---------- audio ----------
let AC=null;function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function tone(f,d,type,v,sweep){const a=ac();if(!a)return;const t=a.currentTime,o=a.createOscillator(),g=a.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(sweep)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+sweep),t+d);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v||0.2,t+0.008);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+0.02);}
function noise(d,v,hp){const a=ac();if(!a)return;const t=a.currentTime,n=Math.floor(a.sampleRate*d),buf=a.createBuffer(1,n,a.sampleRate),ch=buf.getChannelData(0);
  for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource();s.buffer=buf;
  const f=a.createBiquadFilter();f.type='highpass';f.frequency.value=hp||600;const g=a.createGain();g.gain.value=v||0.2;
  s.connect(f);f.connect(g);g.connect(a.destination);s.start(t);s.stop(t+d+0.02);}
const S={
  slide:()=>{noise(0.14,0.16,300);tone(200,0.1,'sine',0.08,-40);},
  safe:()=>{[720,960,1200].forEach((f,i)=>setTimeout(()=>tone(f,0.11,'triangle',0.18),i*70));},
  out:()=>{noise(0.14,0.22,400);tone(190,0.16,'sawtooth',0.13,-70);},
  reach:()=>{tone(520,0.06,'square',0.06);},
  streak:()=>{[660,880,1100,1320].forEach((f,i)=>setTimeout(()=>tone(f,0.1,'triangle',0.16),i*60));},
  over:()=>{[440,330,247,175].forEach((f,i)=>setTimeout(()=>tone(f,0.3,'triangle',0.2),i*160));}
};

// ---------- geometry ----------
const BAGX=450, BAGY=300, RUNSTART=560;

// ---------- state ----------
let state='title', phase='play', t=0, plays=0;
let score=0, combo=0, best=+(localStorage.getItem('hook_best')||0);
let safes=0, outs=0, lvl=1;
let clock=0, arriveT=1050, window0=280, revealT=680, tagSide='left', openSide='right';
let feintT=-1, feintSide='left', acted=false, revealed=false;
let slideDir=null, slideAmt=0, runY=RUNSTART, glovePos=0, gloveShown=0;
let result=null, resultT=0, msg='';
let shake=0, flash=0, flashCol='#fff', last=performance.now();
let parts=[], pops=[];

function rnd(a,b){return a+Math.random()*(b-a);}
function chance(p){return Math.random()<p;}
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function lerp(a,b,u){return a+(b-a)*u;}
function easeOut(u){return 1-Math.pow(1-u,2);}

function params(){ return { arrive:Math.max(760,1120-lvl*58), window:Math.max(120,300-lvl*24), lead:Math.max(150,380-lvl*26), feint:lvl>=3?0.5:0 }; }

function reset(){state='title';score=0;combo=0;safes=0;outs=0;lvl=1;plays=0;result=null;parts=[];pops=[];}
function newSlide(){
  plays++; lvl=Math.min(7,1+Math.floor(safes/4));
  const p=params(); arriveT=p.arrive; window0=p.window; revealT=arriveT-p.lead;
  tagSide=chance(0.5)?'left':'right'; openSide=tagSide==='left'?'right':'left';
  feintT = (p.feint>0&&chance(0.55))? rnd(revealT-260,revealT-90) : -1;
  feintSide = chance(0.5)?'left':'right';
  clock=0; acted=false; revealed=false; slideDir=null; slideAmt=0; runY=RUNSTART; glovePos=0; gloveShown=0;
  result=null; phase='play'; msg='';
}
function start(){ if(!ac())ac(); if(AC&&AC.state==='suspended')AC.resume(); reset(); state='play'; newSlide(); }

function slide(dir){
  if(state==='title'){start();return;}
  if(state==='over'){ if(resultT>0.4){reset();start();} return; }
  if(state!=='play'||phase!=='play'||acted) return;
  acted=true; slideDir=dir; S.slide();
  const u=clock-arriveT;
  if(u < -window0){ resolve('early'); return; }        // slid way too early
  if(dir===tagSide) resolve('tagged');                 // slid into the glove
  else resolve('safe');                                // hooked the open corner
}

function resolve(kind){
  phase='result'; result=kind; resultT=0;
  if(kind==='safe'){
    safes++; combo++; const tight=Math.abs(clock-arriveT)<90;
    const add=Math.round((tight?150:105)*(1+Math.min(9,combo-1)*0.16)); score+=add;
    S.safe(); flash=1;flashCol='#8fe0ff';shake=7; burst(BAGX+(openSide==='left'?-40:40),BAGY,'#bfe6ff',18,6);
    pop(BAGX,BAGY-70,'セーフ！ +'+add,'#dff3ff');
    if(tight)pop(BAGX,BAGY-96,'際どく手先でタッチ！','#8fe0ff');
    if(combo>=2)pop(BAGX,BAGY-44,'コンボ x'+combo,'#ffd24d');
    if(combo>0&&combo%5===0)S.streak();
    msg='グラブの逆へ滑り込んでセーフ！';
  } else {
    outs++; combo=0; flash=1;flashCol='#ff5b5b';shake=9; S.out();
    if(kind==='tagged') msg='タッチアウト！ グラブの方へ滑ってしまった';
    else if(kind==='early') msg='早い！ 手前で滑って届かず';
    else msg='遅い！ 先にタッチされた';
    pop(BAGX,BAGY-64,'アウト','#ffb0b0');
  }
  if(outs>=3){ state='over'; resultT=0; S.over(); if(score>best){best=score;localStorage.setItem('hook_best',best);} }
}

// ---------- input ----------
function dirFromEvent(e){ const r=cv.getBoundingClientRect(); const x=(e.clientX-r.left)/r.width; return x<0.5?'left':'right'; }
cv.addEventListener('pointerdown',e=>{e.preventDefault();
  if(state!=='play'){slide('left');return;}
  slide(dirFromEvent(e));
});
addEventListener('keydown',e=>{
  const c=e.code;
  if(c==='ArrowLeft'||c==='KeyA'){e.preventDefault();slide('left');}
  else if(c==='ArrowRight'||c==='KeyD'){e.preventDefault();slide('right');}
  else if(c==='Space'||c==='Enter'){e.preventDefault(); if(state!=='play')slide('left');}
});

// ---------- particles ----------
function burst(x,y,c,n,sp){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=rnd(sp*0.3,sp);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:1,c});}}
function pop(x,y,txt,c){pops.push({x,y,txt,c,life:1});}

// ---------- update ----------
function update(dt){
  shake*=Math.pow(0.86,dt/16.7); if(shake<0.3)shake=0;
  flash*=Math.pow(0.9,dt/16.7);
  for(const p of parts){p.vx*=0.96;p.vy=p.vy*0.96+0.28;p.x+=p.vx*dt/16.7;p.y+=p.vy*dt/16.7;p.life-=dt/16.7*0.026;}
  parts=parts.filter(p=>p.life>0);
  for(const p of pops){p.y-=dt/16.7*0.5;p.life-=dt/16.7*0.02;}
  pops=pops.filter(p=>p.life>0);

  if(state!=='play'){ if(state==='over')resultT+=dt/1000; return; }
  t+=dt;
  if(phase==='play'){
    clock+=dt;
    runY = lerp(RUNSTART, BAGY+30, easeOut(Math.min(1,clock/arriveT)));
    // glove reveal: which side the fielder reaches to tag
    if(feintT>0 && clock>=feintT && clock<feintT+150){ gloveShown=1; glovePos=(feintSide==='left'?-1:1)*0.7; }
    else if(clock>=revealT){ if(!revealed){revealed=true;S.reach();} gloveShown=1; glovePos=lerp(glovePos,(tagSide==='left'?-1:1),Math.min(1,dt/16.7*0.12)); }
    else { gloveShown=0; glovePos=lerp(glovePos,0,0.1); }
    if(!acted && clock>arriveT+window0){ resolve('late'); }
    return;
  }
  if(phase==='result'){
    resultT+=dt/1000;
    if(slideDir) slideAmt=Math.min(1,slideAmt+dt/260);
    if(resultT>1.15 && state==='play') newSlide();
    return;
  }
}

// ---------- render ----------
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function drawScene(){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#3a2a1c');g.addColorStop(0.5,'#5a3f28');g.addColorStop(1,'#6b4a30');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  // infield grass wedge behind the bag
  ctx.fillStyle='#2f7a3c';ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(W,0);ctx.lineTo(W,180);ctx.quadraticCurveTo(450,120,0,180);ctx.closePath();ctx.fill();
  // baseline
  ctx.strokeStyle='rgba(255,255,255,0.5)';ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(450,H);ctx.lineTo(450,BAGY);ctx.stroke();
  ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(450,BAGY);ctx.lineTo(760,150);ctx.stroke();
  // base bag
  ctx.save();ctx.translate(BAGX,BAGY);ctx.rotate(Math.PI/4);
  ctx.fillStyle='#f2f4f6';ctx.fillRect(-24,-24,48,48);
  ctx.strokeStyle='rgba(0,0,0,0.2)';ctx.lineWidth=2;ctx.strokeRect(-24,-24,48,48);
  ctx.restore();
}
function drawFielder(){
  // fielder straddling the bag, glove reaches to glovePos side when shown
  const fx=BAGX, fy=BAGY-46;
  ctx.fillStyle='rgba(0,0,0,0.2)';ctx.beginPath();ctx.ellipse(fx,BAGY-8,22,6,0,0,6.28);ctx.fill();
  ctx.fillStyle='#c23c3c';rr(fx-13,fy-16,26,44,8);ctx.fill();
  ctx.fillStyle='#f2c9a0';ctx.beginPath();ctx.arc(fx,fy-24,9,0,6.28);ctx.fill();
  // glove arm
  const gx=fx+glovePos*54, gy=BAGY+ (gloveShown? 6: -6);
  ctx.strokeStyle='#c23c3c';ctx.lineWidth=6;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(fx,fy+6);ctx.lineTo(gx,gy);ctx.stroke();
  if(gloveShown>0){
    ctx.fillStyle='#7a4a22';ctx.beginPath();ctx.arc(gx,gy,12,0,6.28);ctx.fill();
    ctx.fillStyle='#8a5a2c';ctx.beginPath();ctx.arc(gx,gy,7,0,6.28);ctx.fill();
    // tag-side warning tint on the covered corner
    ctx.fillStyle='rgba(255,90,90,0.28)';ctx.beginPath();ctx.arc(gx,gy,22,0,6.28);ctx.fill();
  }
}
function drawRunner(){
  const dir = slideDir==='left'?-1: slideDir==='right'?1:0;
  const off = dir*46*easeOut(slideAmt);
  const rx=BAGX+off, ry=runY;
  ctx.fillStyle='rgba(0,0,0,0.2)';ctx.beginPath();ctx.ellipse(rx,ry+16,20,6,0,0,6.28);ctx.fill();
  ctx.save();ctx.translate(rx,ry);
  if(slideDir){ ctx.rotate(dir*0.5*slideAmt); }
  ctx.fillStyle='#2b6cff';rr(-11,-8,22,34,8);ctx.fill();
  ctx.fillStyle='#f2c9a0';ctx.beginPath();ctx.arc(0,-16,8,0,6.28);ctx.fill();
  // reaching hand toward the bag corner
  if(slideDir){ctx.strokeStyle='#2b6cff';ctx.lineWidth=5;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(0,-2);ctx.lineTo(-dir*20,-14);ctx.stroke();}
  ctx.restore();
}

function render(){
  ctx.save();
  if(shake>0)ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
  drawScene();

  if(state==='play'){
    drawFielder();
    drawRunner();
    // timing ring at the bag
    if(phase==='play'){
      const u=clock/arriveT;
      const rad=lerp(90,30,clamp(u,0,1));
      ctx.strokeStyle=Math.abs(clock-arriveT)<window0?'rgba(150,240,170,0.9)':'rgba(255,255,255,0.3)';
      ctx.lineWidth=3;ctx.beginPath();ctx.arc(BAGX,BAGY,rad,0,6.28);ctx.stroke();
    }
    // open-corner hint (left/right)
    if(phase==='play'&&revealed){
      ctx.fillStyle='rgba(150,240,170,0.85)';ctx.font='bold 15px sans-serif';ctx.textAlign='center';
      ctx.fillText('空いてる角 →',BAGX+(openSide==='left'?-120:120),BAGY+4);
    }
  }

  for(const p of parts){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,3.2,0,6.28);ctx.fill();}
  ctx.globalAlpha=1;
  for(const p of pops){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.font='bold 22px sans-serif';ctx.textAlign='center';ctx.fillText(p.txt,p.x,p.y);}
  ctx.globalAlpha=1;

  // HUD
  ctx.textAlign='left';ctx.fillStyle='#fff';ctx.font='bold 26px sans-serif';ctx.fillText('SCORE '+score,20,36);
  ctx.textAlign='right';ctx.fillStyle='rgba(255,255,255,0.9)';ctx.font='14px sans-serif';ctx.fillText('セーフ '+safes+'  Lv'+lvl,W-20,24);
  ctx.fillText('アウト',W-100,46);
  for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(W-60+i*20,41,7,0,6.28);ctx.fillStyle=i<outs?'#ff5b5b':'rgba(255,255,255,0.25)';ctx.fill();}
  if(combo>=2){ctx.textAlign='center';ctx.fillStyle='#ffd24d';ctx.font='bold 18px sans-serif';ctx.fillText('コンボ x'+combo,BAGX,72);}

  if(state==='play'&&phase==='play'){ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,0.9)';ctx.font='bold 15px sans-serif';
    ctx.fillText('野手のグラブが伸びた“逆の角”へ、ベース到達の瞬間にフックスライド（左半分/← ・ 右半分/→）',BAGX,44);}
  if(state==='play'&&phase==='result'&&msg){ctx.textAlign='center';ctx.fillStyle=result==='safe'?'#9ff0b8':'#ff9a9a';ctx.font='bold 22px sans-serif';ctx.fillText(msg,BAGX,44);}

  if(state==='title'){
    ctx.fillStyle='rgba(8,10,6,0.72)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='bold 46px sans-serif';ctx.fillText('フックスライド',BAGX,140);
    ctx.fillStyle='#ffd23e';ctx.font='bold 22px sans-serif';ctx.fillText('Evade the Tag',BAGX,176);
    ctx.fillStyle='rgba(255,255,255,0.92)';ctx.font='16px sans-serif';
    ctx.fillText('タッチをかわす走者の駆け引き。グラブの逆の角へ滑り込んでセーフを奪え',BAGX,228);
    ctx.fillStyle='rgba(255,255,255,0.66)';ctx.font='14px sans-serif';
    ctx.fillText('野手がタッチに来るグラブの側を見極め、その“逆の角”へフックスライド（左半分/← ・ 右半分/→）',BAGX,266);
    ctx.fillText('ベースに到達する“瞬間”に合わせて滑る＝手先でベースにタッチしてセーフ',BAGX,288);
    ctx.fillText('グラブの方へ滑るとタッチアウト、早すぎると手前で届かず、遅いと先にタッチ',BAGX,310);
    ctx.fillText('上級ほどタッチが速く見極めが遅れる＆フェイント（見せグラブ）に注意。3アウトで交代',BAGX,332);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で開始',BAGX,404);
    ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='14px sans-serif';ctx.fillText('BEST '+best+'　　左/右 で滑る方向',BAGX,436);
  }
  if(state==='over'){
    ctx.fillStyle='rgba(8,10,6,0.8)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#ff6b6b';ctx.font='bold 46px sans-serif';ctx.fillText('3アウト…交代',BAGX,222);
    ctx.fillStyle='#fff';ctx.font='bold 40px sans-serif';ctx.fillText('SCORE '+score,BAGX,290);
    ctx.fillStyle='rgba(255,255,255,0.85)';ctx.font='19px sans-serif';ctx.fillText('セーフ '+safes+'   BEST '+best,BAGX,330);
    ctx.fillStyle='#8fe0a0';ctx.font='bold 22px sans-serif';ctx.fillText('クリック / タップ で もう一度',BAGX,402);
  }

  if(flash>0.02){ctx.globalAlpha=flash*0.5;ctx.fillStyle=flashCol;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}
  ctx.restore();

  ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,0.4)';ctx.font='12px sans-serif';
  ctx.fillText('グラブの逆の角へ、到達の瞬間にフックスライド。グラブ側=タッチ/早い=届かず/遅い=タッチ。3アウトで交代',BAGX,H-8);
}

function frame(ts){let dt=ts-last;last=ts;if(dt>60)dt=60;if(dt<0)dt=0;update(dt);render();requestAnimationFrame(frame);}
requestAnimationFrame(frame);

// ---------- test hook ----------
window.__ht={
  start, slide:(d)=>slide(d),
  get state(){return state;},
  get score(){return score;},
  get safes(){return safes;},
  get outs(){return outs;},
  get info(){return {state,phase,tagSide,openSide,clock,arriveT,window0,revealT,revealed,acted,result,safes,outs,lvl};}
};
})();
</script>
</body>
</html>
