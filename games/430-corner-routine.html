<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>コーナーのサインプレー (The Corner Routine)</title>
<style>
  html,body{margin:0;padding:0;background:#08140d;overflow:hidden;font-family:'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif;-webkit-user-select:none;user-select:none;touch-action:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 30%,#18361f,#050d08 72%);}
  #stage{position:relative;width:min(100vw,calc(100vh*1.5));aspect-ratio:900/600;max-width:900px;box-shadow:0 10px 60px rgba(0,0,0,.6);border-radius:8px;overflow:hidden;}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;}
</style>
</head>
<body>
<div id="wrap"><div id="stage"><canvas id="cv"></canvas></div></div>
<script>
(function(){
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const W=900,H=600;let DPR=Math.min(2,window.devicePixelRatio||1);
function fit(){const r=cv.getBoundingClientRect();DPR=Math.min(2,window.devicePixelRatio||1);cv.width=Math.round(r.width*DPR);cv.height=Math.round(r.height*DPR);ctx.setTransform(cv.width/W,0,0,cv.height/H,0,0);}
new ResizeObserver(fit).observe(cv);fit();

// ---------- audio ----------
let AC=null;function actx(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function tone(f,d,type,v,sweep){const a=actx();if(!a)return;const o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.value=f;if(sweep)o.frequency.linearRampToValueAtTime(sweep,a.currentTime+d);g.gain.value=0.0001;g.gain.exponentialRampToValueAtTime(v||0.2,a.currentTime+0.008);g.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+d);o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+d+0.02);}
function noise(d,v,hp){const a=actx();if(!a)return;const n=a.createBufferSource(),b=a.createBuffer(1,a.sampleRate*d,a.sampleRate),dt=b.getChannelData(0);for(let i=0;i<dt.length;i++)dt[i]=Math.random()*2-1;n.buffer=b;const f=a.createBiquadFilter();f.type='highpass';f.frequency.value=hp||800;const g=a.createGain();g.gain.value=0.0001;g.gain.exponentialRampToValueAtTime(v||0.2,a.currentTime+0.01);g.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+d);n.connect(f);f.connect(g);g.connect(a.destination);n.start();n.stop(a.currentTime+d+0.02);}
const S={
  swing(){tone(560,0.09,'sine',0.12,760);},
  flick(){noise(0.05,0.14,700);tone(420,0.08,'triangle',0.13);},
  header(){noise(0.06,0.2,500);tone(240,0.09,'square',0.14,120);},
  goal(){tone(560,0.1,'triangle',0.2);setTimeout(function(){tone(760,0.14,'triangle',0.22);},110);setTimeout(function(){tone(1000,0.2,'triangle',0.22);},230);for(let i=0;i<5;i++)setTimeout(function(){tone(500+Math.random()*400,0.2,'triangle',0.05);},260+i*45);},
  lost(){tone(300,0.3,'sawtooth',0.16,150);setTimeout(function(){tone(190,0.4,'sawtooth',0.14,110);},150);},
  combo(n){tone(600+Math.min(n,8)*70,0.12,'triangle',0.16);},
  over(){tone(330,0.3,'sine',0.2,160);setTimeout(function(){tone(220,0.5,'sine',0.2,110);},180);},
  start(){tone(440,0.1,'triangle',0.18);setTimeout(function(){tone(660,0.16,'triangle',0.2);},110);},
};

function clamp(v,a,b){return v<a?a:v>b?b:v;}
function rnd(a,b){return a+Math.random()*(b-a);}

// ---------- state ----------
let state='title';
let outs=0,fails=0,score=0,combo=0,lvl=1;   // outs = routines finished
let best=0;try{best=parseInt(localStorage.getItem('cr_best')||'0')||0;}catch(e){}
const TARGET=26;

let phase='wind';  // wind | combo(beat1: near flick) | run(beat2: far finish) | result
let pt=0, clock=0;
let arriveT1=850, w1=150, effW1=150, fireIdeal=520, fw=150, effFw=150, tough=false;
let flickClock=0, decided=false, result='', beat1done=false, q1=0,q2=0;
let parts=[];
let shakeT=0,flash=0;
let msg='',msgCol='#fff',msgT=0;
let lastAdd=0;
// scene points
const CORNER=[92,466], NEAR=[336,250], FAR=[566,224], GOALC=[450,120];
let ballX=92, ballY=466;

function reset(){outs=0;fails=0;score=0;combo=0;lvl=1;parts=[];}
function newPlay(){
  lvl=Math.min(7,1+Math.floor(outs/4));
  arriveT1=clamp(900-lvl*42,620,900);
  w1=clamp(150-lvl*10,90,150);
  fireIdeal=clamp(560-lvl*20,420,560);
  fw=clamp(150-lvl*10,90,150);
  tough=Math.random()<clamp(0.2+lvl*0.05,0.2,0.5);
  effW1=tough?w1*0.82:w1;
  effFw=tough?fw*0.82:fw;
  phase='wind';pt=0;clock=0;flickClock=0;decided=false;result='';beat1done=false;q1=0;q2=0;
  ballX=CORNER[0];ballY=CORNER[1];
}
function startGame(){reset();state='play';newPlay();S.start();}

function burst(x,y,col,n,sp){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=rnd(0.4,1)*(sp||3);parts.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:1,col:col,r:rnd(2,5)});}}

function finish(kind){
  decided=true;result=kind;
  if(kind==='goal'){
    outs++;combo++;
    const cm=1+Math.min(combo-1,6)*0.14;
    const add=Math.round((100+(q1+q2)*60)*cm)*Math.max(1,lvl);
    score+=add;lastAdd=add;
    S.goal();if(combo>1)setTimeout(function(){S.combo(combo);},300);
    flash=0.28;
    msg=((q1+q2)>1.4?'完璧なサインプレー！ ファーでドンピシャ！':'デザインされたコーナー！ ファーで叩き込んだ！')+'  +'+add;msgCol='#5affa0';msgT=1;
    burst(GOALC[0],GOALC[1]+40,'#5affa0',16,3.5);
  }else{
    combo=0;fails++;
    S.lost();flash=0.35;shakeT=0.7;
    if(result==='early1')msg='ニアの動き出しが早い！ 球に合わず流れる';
    else if(result==='late1')msg='逸らすのが遅い！ ニアで跳ね返された';
    else if(result==='early2')msg='ファーの詰めが早い！ 頭上を越えてバーの上';
    else msg='ファーの詰めが遅い！ 戻った守備にクリア';
    msgCol='#ff6a6a';msgT=1;
  }
  phase='result';pt=0;
}

function act(){
  if(!AC)actx();
  if(state==='title'){startGame();return;}
  if(state==='over'){startGame();return;}
  if(state!=='play'||decided)return;
  if(phase==='combo'){
    const c=clock;
    if(c<arriveT1-effW1){finish('early1');return;}
    beat1done=true;flickClock=clock;q1=clamp(1-Math.abs(c-arriveT1)/effW1,0,1);
    S.flick();phase='run';pt=0;
  }else if(phase==='run'){
    const rc=clock-flickClock;
    if(rc<fireIdeal-effFw){finish('early2');return;}
    q2=clamp(1-Math.abs(rc-fireIdeal)/effFw,0,1);
    S.header();finish('goal');
  }
}
cv.addEventListener('mousedown',function(e){e.preventDefault();act();});
cv.addEventListener('touchstart',function(e){e.preventDefault();act();},{passive:false});
window.addEventListener('keydown',function(e){
  if(e.code==='Space'||e.code==='ArrowUp'||e.code==='Enter'||e.code==='KeyJ'){e.preventDefault();act();}
});

// ---------- update ----------
let last=0;
function lerp(a,b,t){return [a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t];}
function update(dt){
  if(flash>0)flash=Math.max(0,flash-dt/300);
  if(shakeT>0)shakeT=Math.max(0,shakeT-dt/320);
  if(msgT>0)msgT=Math.max(0,msgT-dt/1500);
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.x+=p.vx;p.y+=p.vy;p.vy+=0.16;p.life-=dt/640;if(p.life<=0)parts.splice(i,1);}
  if(state!=='play')return;
  pt+=dt;
  if(phase==='wind'){
    if(pt>=440){phase='combo';pt=0;clock=0;S.swing();}
  }else if(phase==='combo'){
    clock+=dt;
    // inswinging corner from the flag toward the near post
    const u=clamp(clock/arriveT1,0,1);
    const p=lerp(CORNER,NEAR,u); ballX=p[0]; ballY=p[1]-Math.sin(u*Math.PI)*40;
    if(clock>=arriveT1+effW1&&!decided)finish('late1');
  }else if(phase==='run'){
    clock+=dt;
    const rc=clock-flickClock;
    // flicked on: ball glances toward the far post
    const u=clamp(rc/fireIdeal,0,1);
    const p=lerp(NEAR,FAR,u); ballX=p[0]; ballY=p[1]-Math.sin(u*Math.PI)*26;
    if(rc>=fireIdeal+effFw&&!decided)finish('late2');
  }else if(phase==='result'){
    if(result==='goal'){ const u=clamp(pt/300,0,1); const p=lerp(FAR,GOALC,u); ballX=p[0];ballY=p[1]; }
    if(pt>=1120){
      if(fails>=3){state='over';best=Math.max(best,score);try{localStorage.setItem('cr_best',String(best));}catch(e){}S.over();}
      else if(outs>=TARGET){state='over';best=Math.max(best,score);try{localStorage.setItem('cr_best',String(best));}catch(e){}S.start();}
      else newPlay();
    }
  }
}

// ---------- render ----------
function roundRect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

const GL=280, GR=620, GTOP=70, GLINE=168;
function drawField(){
  for(let i=0;i<9;i++){ctx.fillStyle=i%2?'#2b6b3d':'#256036';ctx.fillRect(0,i*(H/9),W,H/9);}
  // goal net
  ctx.fillStyle='rgba(255,255,255,.06)';ctx.fillRect(GL,GTOP,GR-GL,GLINE-GTOP);
  ctx.strokeStyle='rgba(255,255,255,.18)';ctx.lineWidth=1;
  for(let x=GL;x<=GR;x+=15){ctx.beginPath();ctx.moveTo(x,GTOP);ctx.lineTo(x,GLINE);ctx.stroke();}
  for(let y=GTOP+12;y<GLINE;y+=13){ctx.beginPath();ctx.moveTo(GL,y);ctx.lineTo(GR,y);ctx.stroke();}
  ctx.fillStyle='#f2f2f2';ctx.fillRect(GL-6,GTOP-5,6,GLINE-GTOP+6);ctx.fillRect(GR,GTOP-5,6,GLINE-GTOP+6);ctx.fillRect(GL-6,GTOP-5,GR-GL+12,6);
  ctx.fillStyle='#fff';ctx.fillRect(GL-6,GLINE,GR-GL+12,3);
  // six-yard box + touchline near corner
  ctx.strokeStyle='rgba(255,255,255,.45)';ctx.lineWidth=3;ctx.strokeRect(230,GLINE,440,150);
  ctx.beginPath();ctx.moveTo(70,GLINE);ctx.lineTo(70,H);ctx.stroke();   // touchline
  ctx.beginPath();ctx.moveTo(70,GLINE);ctx.lineTo(W,GLINE);ctx.stroke(); // goal line
  // corner flag + arc
  ctx.strokeStyle='rgba(255,255,255,.6)';ctx.lineWidth=3;ctx.beginPath();ctx.arc(70,GLINE,20,0,Math.PI*0.5);ctx.stroke();
  const sway=Math.sin((clock+pt)/240)*3;
  ctx.strokeStyle='#e8e8e8';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(70,GLINE);ctx.lineTo(70,GLINE-2);ctx.stroke();
  ctx.strokeStyle='#e8e8e8';ctx.beginPath();ctx.moveTo(CORNER[0],CORNER[1]);ctx.lineTo(CORNER[0],CORNER[1]-40);ctx.stroke();
  ctx.fillStyle='#ff5a4a';ctx.beginPath();ctx.moveTo(CORNER[0],CORNER[1]-40);ctx.lineTo(CORNER[0]+20+sway,CORNER[1]-34);ctx.lineTo(CORNER[0],CORNER[1]-26);ctx.closePath();ctx.fill();
}

function person(x,y,col,glow,lean){
  ctx.save();ctx.translate(x,y);if(lean)ctx.rotate(lean);
  if(glow>0){ctx.strokeStyle='rgba(90,255,160,'+glow+')';ctx.lineWidth=4;ctx.beginPath();ctx.arc(0,-18,26,0,Math.PI*2);ctx.stroke();}
  ctx.fillStyle='rgba(0,0,0,.26)';ctx.beginPath();ctx.ellipse(0,4,14,5,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#222';ctx.fillRect(-8,-4,7,22);ctx.fillRect(1,-4,7,22);
  ctx.fillStyle=col;ctx.fillRect(-11,-30,22,28);
  ctx.fillStyle='#f0c9a0';ctx.beginPath();ctx.arc(0,-40,8,0,Math.PI*2);ctx.fill();
  ctx.restore();
}

function drawScene(){
  drawField();
  // keeper
  person(450,GTOP+52,'#e9d84a',0,0);
  // defenders
  person(NEAR[0]+30,NEAR[1]+14,'#c0343a',0,0);
  person(FAR[0]-26,FAR[1]+16,'#c0343a',0,0);
  // near-post flicker (blue) — glows in beat1 window
  const b1=(phase==='combo'&&clock>=arriveT1-effW1&&!decided);
  person(NEAR[0],NEAR[1]+16,'#2f6fd0',b1?1:0,0);
  // far-post finisher (light) — glows in beat2 window
  const b2=(phase==='run'&&(clock-flickClock)>=fireIdeal-effFw&&!decided);
  person(FAR[0],FAR[1]+16,'#e8d24a',b2?1:0,0);
  // ball
  ctx.fillStyle='rgba(0,0,0,.2)';ctx.beginPath();ctx.ellipse(ballX,ballY+7,7,3,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(ballX,ballY,7,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#111';ctx.beginPath();ctx.arc(ballX,ballY,2.6,0,Math.PI*2);ctx.fill();
}

function drawBar(){
  if(state!=='play'||phase==='wind'||phase==='result')return;
  const mx=180,mw=540,my=560,mh=18;
  let end, gC, gH, marker, label, col;
  if(phase==='combo'){ end=arriveT1+effW1+200; gC=arriveT1; gH=effW1; marker=clock; label='① ニアで逸らす（インスイングを頭でファーへ）'; col='#ffe08a'; }
  else { end=fireIdeal+effFw+200; gC=fireIdeal; gH=effFw; marker=clock-flickClock; label='② ファーで合わせる（流れてきた球を叩き込む）'; col='#9fd7ff'; }
  roundRect(mx,my,mw,mh,9);ctx.fillStyle='rgba(0,0,0,.45)';ctx.fill();
  const gx0=mx+mw*clamp((gC-gH)/end,0,1), gx1=mx+mw*clamp((gC+gH)/end,0,1);
  const gg=ctx.createLinearGradient(gx0,0,gx1,0);gg.addColorStop(0,'rgba(90,220,150,.4)');gg.addColorStop(0.5,'rgba(60,255,150,.9)');gg.addColorStop(1,'rgba(90,220,150,.4)');
  ctx.fillStyle=gg;ctx.fillRect(gx0,my,gx1-gx0,mh);
  ctx.fillStyle='rgba(210,70,70,.26)';ctx.fillRect(mx,my,gx0-mx,mh);
  roundRect(mx,my,mw,mh,9);ctx.strokeStyle='rgba(255,255,255,.4)';ctx.lineWidth=1.5;ctx.stroke();
  const px=mx+mw*clamp(marker/end,0,1);
  ctx.fillStyle='#fff';ctx.fillRect(px-2,my-4,4,mh+8);
  ctx.textAlign='center';ctx.font='bold 14px sans-serif';ctx.fillStyle=col;ctx.fillText(label,450,my-8);
}

function drawHUD(){
  ctx.textAlign='left';ctx.textBaseline='alphabetic';
  ctx.font='bold 20px sans-serif';ctx.fillStyle='#fff';
  ctx.fillText('ゴール '+outs+' / '+TARGET,20,32);
  ctx.font='14px sans-serif';ctx.fillStyle='#ffb14a';ctx.fillText('失敗 '+fails+' / 3',20,54);
  ctx.textAlign='right';
  ctx.font='bold 20px sans-serif';ctx.fillStyle='#ffe08a';ctx.fillText('SCORE '+score,W-20,32);
  ctx.font='13px sans-serif';ctx.fillStyle='#bfe';ctx.fillText('BEST '+Math.max(best,score)+'   Lv.'+lvl,W-20,52);
  if(combo>1){ctx.textAlign='center';ctx.font='bold 20px sans-serif';ctx.fillStyle='#5affa0';ctx.fillText(combo+' 連続弾!',450,300);}
}

function drawMsg(){
  if(msgT<=0)return;
  ctx.save();ctx.globalAlpha=clamp(msgT*1.4,0,1);
  ctx.textAlign='center';ctx.font='bold 24px sans-serif';
  ctx.fillStyle='rgba(0,0,0,.55)';roundRect(450-290,330,580,44,10);ctx.fill();
  ctx.fillStyle=msgCol;ctx.fillText(msg,450,360);
  ctx.restore();
}

function drawTitle(){
  drawField();person(450,GTOP+52,'#e9d84a',0,0);person(NEAR[0],NEAR[1]+16,'#2f6fd0',0,0);person(FAR[0],FAR[1]+16,'#e8d24a',0,0);
  ctx.save();ctx.textAlign='center';
  ctx.fillStyle='rgba(0,0,0,.66)';roundRect(96,96,708,404,16);ctx.fill();
  ctx.fillStyle='#fff';ctx.font='bold 32px sans-serif';ctx.fillText('コーナーのサインプレー',450,152);
  ctx.font='18px sans-serif';ctx.fillStyle='#9fe0bf';ctx.fillText('The Corner Routine  🎉430',450,182);
  ctx.font='16px sans-serif';ctx.fillStyle='#e6fcef';
  const lines=[
    'デザインされたコーナーキックの崩しを2段で決めろ！',
    '①インスイングのボールがニアに来る“今”タップ＝ニアで逸らす。',
    '　早いと球に合わず流れ、遅いとニアで跳ね返される。',
    '②逸らした球がファーに流れる“今”タップ＝ファーで合わせる。',
    '　早いとバーの上、遅いと戻った守備にクリアされる。',
    '2つの「緑」でタイミングを合わせて叩き込め。3失敗で終了。',
    'タップ / クリック / SPACE で操作。',
  ];
  for(let i=0;i<lines.length;i++)ctx.fillText(lines[i],450,222+i*29);
  ctx.fillStyle='#ffe08a';ctx.font='bold 22px sans-serif';
  ctx.fillText('タップ / SPACE でスタート',450,476);
  ctx.restore();
}

function drawOver(){
  drawField();
  ctx.save();ctx.textAlign='center';
  ctx.fillStyle='rgba(0,0,0,.66)';roundRect(190,150,520,300,16);ctx.fill();
  const w2=outs>=TARGET;
  ctx.fillStyle=w2?'#5affa0':'#ff8a5a';ctx.font='bold 34px sans-serif';
  ctx.fillText(w2?'セットプレーの匠！':'崩し切れず…',450,222);
  ctx.fillStyle='#fff';ctx.font='20px sans-serif';
  ctx.fillText('ゴール '+outs+' / '+TARGET,450,270);
  ctx.fillText('スコア '+score,450,304);
  ctx.fillStyle='#ffe08a';ctx.fillText('ベスト '+Math.max(best,score),450,336);
  ctx.fillStyle='#9fe0bf';ctx.font='bold 20px sans-serif';
  ctx.fillText('タップ / SPACE でもう一度',450,404);
  ctx.restore();
}

function render(){
  ctx.save();
  if(shakeT>0){const s=shakeT*7;ctx.translate(rnd(-s,s),rnd(-s,s));}
  if(state==='title'){drawTitle();}
  else if(state==='over'){drawOver();}
  else{
    drawScene();
    drawBar();
    drawHUD();
    drawMsg();
  }
  for(const p of parts){ctx.globalAlpha=clamp(p.life,0,1);ctx.fillStyle=p.col;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();}
  ctx.globalAlpha=1;
  ctx.restore();
  if(flash>0){ctx.fillStyle='rgba(255,255,255,'+(flash*0.5)+')';ctx.fillRect(0,0,W,H);}
}

function frame(ts){let dt=ts-last;last=ts;if(dt>60)dt=60;if(dt<0)dt=0;update(dt);render();requestAnimationFrame(frame);}
requestAnimationFrame(frame);

// ---------- test hook ----------
window.__cr={
  start:startGame,
  act:act,
  get state(){return state;},
  get outs(){return outs;},
  get fails(){return fails;},
  get score(){return score;},
  get info(){return {state:state,phase:phase,clock:clock,arriveT1:arriveT1,effW1:effW1,fireIdeal:fireIdeal,effFw:effFw,flickClock:flickClock,tough:tough,decided:decided,result:result,beat1done:beat1done,outs:outs,fails:fails,lvl:lvl,collectClock:(clock-flickClock),canAct:(state==='play'&&(phase==='combo'||phase==='run')&&!decided)};}
};
})();
</script>
</body>
</html>
